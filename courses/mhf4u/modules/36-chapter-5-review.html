.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 36: hero caption, per-topic tables, Connect (four forms grouping, one page), mixed practice, wave tuner task */
.hero .hero-eq.md{font-size:clamp(1.8rem,4.4vw,3rem);white-space:nowrap}
#hero-cap{font:400 .95rem/1.5 var(--font-ui);color:var(--ink-2);display:grid;gap:2px}
#hero-cap .hc-l{display:block}
#hero-cap .hc-l.cur{color:var(--ink);font-weight:600}
#hero-cap .m{white-space:normal}
/* toolkit workaround: the visually hidden "(done)" text in a step button escaped the scrolling step bar on phones */
.steps .step{position:relative}
/* per-topic tables */
.tt-wrap{overflow-x:auto;margin:10px 0}
.tt td:nth-child(2){white-space:nowrap}
.tt td:last-child{white-space:nowrap}
.tt tr.tt-rev td{border-bottom:0}
.tt tr.tt-more td{padding-top:0;white-space:normal}
.tt-key{padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.tt-key p{margin:0 0 .3em;max-width:none}
.tt-key p:last-child{margin:0}

/* Connect: challenge card (as in MHF4U 30) */
.cv-chal{border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--paper)}
.cv-chal .q-prompt{font-weight:700}
.cv-chal .how{margin:8px 0 0}
.cv-top{flex-wrap:wrap}
.cv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.cv-top .dots{flex:0 0 auto}
.cv-nav{border-top:1px solid var(--rule);padding-top:10px}
.ff-cnt{margin:6px 0 0}
.ff-mc .q-head{margin-top:4px}

/* Connect: K12 grouping with multi-form cards */
.ff-lab{display:block;font:700 .78rem var(--font-ui);color:var(--ink-2);margin:0 0 4px}
.ff-tray{margin-top:14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 12px}
.ff-th{margin:0 0 4px;font:700 .95rem var(--font-ui)}
.ff-row{margin:8px 0 0}
.ff-rc{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
.ff-card{display:block;width:100%;min-width:0;text-align:left;border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:44px;font:inherit;cursor:pointer}
.ff-card:not(:disabled):hover{border-color:var(--pen)}
.ff-card:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.ff-card:disabled{cursor:default;opacity:1;color:var(--ink)}
.ff-card.on{border-color:var(--ink);background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.ff-card.used{border-style:dashed}
.ff-badge{display:block;font:700 .75rem var(--font-ui);color:var(--green);min-height:0}
.ff-badge:empty{display:none}
.ff-card.on .ff-badge{color:var(--hi-ink)}
.ff-face{display:block}
.ff-sface{width:100%;padding:4px 6px}
.ff-sface canvas.plot.ff-gc{aspect-ratio:16/10;border:0;border-radius:4px}
.ff-ct{font:400 1.1rem var(--font-math)}
.ff-ct .m{white-space:normal}
.ff-card canvas.plot.ff-gc{aspect-ratio:16/10;border:0;border-radius:4px;pointer-events:none}
.ff-tb{border-collapse:collapse;width:100%;font-size:.92rem}
.ff-tb th,.ff-tb td{border:1px solid var(--rule);padding:3px 4px;text-align:center;white-space:nowrap}
.ff-tb th{font-weight:700;text-align:left;font-size:.82rem}
.ff-tb th .m{font-size:1.05em}
.ff-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.ff-g{border:2px dashed var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);min-width:0}
.ff-g.cur{border:2px solid var(--ink);box-shadow:0 0 0 3px var(--hi-soft)}
.ff-g.done{border:2px solid var(--green)}
.ff-gh{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.ff-gt{margin:0;font-size:1.05rem}
.ff-words{margin:8px 0;border-left:4px solid var(--ink-2);padding:4px 10px;background:var(--paper);border-radius:4px}
.ff-words p{margin:0;max-width:none}
.ff-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ff-slot-eq{grid-column:1 / -1}
.ff-slot{min-width:0}
.ff-sh{min-height:58px;border:1.5px dashed var(--rule);border-radius:8px;display:flex;align-items:center;justify-content:center}
.ff-sh:has(.ff-sface){border:1.5px solid var(--green)}
.ff-empty{font-size:.8rem;color:var(--ink-2)}
.ff-wait{margin:6px 0 0}
.ff-wait:empty{display:none}
.ff-bar{position:sticky;bottom:0;z-index:5;margin-top:14px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:8px 12px}
.ff-bar[hidden]{display:none}
.ff-brow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.ff-bs{margin:0;flex:1 1 14rem;max-width:none;font-size:.95rem}
.ff-bs .m{white-space:normal}
.ff-bar .fb{margin:8px 0 0}
.ff-per{display:grid;gap:8px;margin:10px 0}
.ff-pr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.ff-pw{font-weight:700;min-width:5.5em}
.ff-pr .chips{margin:0}
/* the chapter on one page */
.ff-one{margin-top:18px}
.ff-one h3{margin:0 0 6px}
.ff-key{display:flex;flex-wrap:wrap;gap:8px 14px;max-width:none}
.ff-h{padding:0 .2em;border-bottom:3px solid var(--ink-2);border-radius:2px}
.ff-h-amp{border-bottom-color:var(--acol)}
.ff-h-axis{border-bottom-color:var(--p-c)}
.ff-h-per{border-bottom-color:var(--p-k)}
.ff-h-start{background:var(--hi);color:var(--hi-ink);border-bottom-color:var(--ink)}
.ff-tb td.ff-h-amp,.ff-tb td.ff-h-axis,.ff-tb td.ff-h-per,.ff-tb td.ff-h-start{border-bottom-width:4px;font-weight:700}
.ff-onegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.ff-oc{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet);min-width:0}
.ff-oc h4{margin:0 0 6px}
.ff-oeq{font-size:1.35rem;margin:6px 0 8px}
.ff-oeq .m{white-space:normal}
.ff-ow{margin:6px 0 8px;font-size:1.05rem;line-height:1.7}
.ff-otb{overflow-x:auto}
.ff-otb .ff-tb{max-width:340px}
.ff-notes{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:.92rem}
.ff-n{border-left:4px solid var(--ink-2);padding-left:8px}
.ff-n .m{white-space:normal}
.ff-n-amp{border-left-color:var(--acol)}
.ff-n-axis{border-left-color:var(--p-c)}
.ff-n-per{border-left-color:var(--p-k)}
.ff-n-start{border-left-color:var(--hi)}
@media (max-width:900px){ .ff-rc{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .ff-rc-eq{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  .ff-groups,.ff-onegrid{grid-template-columns:minmax(0,1fr)}
}

/* Mixed practice */
@media (max-width:560px){
  .mx-q .q-head{flex-wrap:wrap}
  .mx-q .q-head .tags{order:-1;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
}
.mx-q .q-prompt{font-weight:700}
.mx-q .numrow{flex-wrap:wrap;align-items:center;gap:8px 10px}
.mx-cell{display:inline-flex;align-items:center;gap:8px}
.mx-lab .m{font-size:1.05rem}
.mx-unit{font-size:.95rem;color:var(--ink-2)}
.mx-yours{margin:6px 0 0}
.mx-yours .m{white-space:normal}
.mx-sum{margin-top:6px}
/* N7 select-all on the 0-to-2π strip (from MHF4U 34) */
.mx-sb{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:3px;margin:8px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.mx-a{min-height:46px;min-width:0;padding:2px 0;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font-size:.9rem;cursor:pointer}
.mx-a .m{font-size:1em}
.mx-a.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.mx-a.bad{border:2.5px solid var(--red)}
.mx-a:disabled{opacity:.85;cursor:default}
.mx-a:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
@media (max-width:640px){ .mx-sb{grid-template-columns:repeat(9,minmax(0,1fr))} }

/* Task: wave tuner (N9 step sliders, from MHF4U 32) */
.ww-spec{margin:6px 0 10px;padding-left:1.4em}
.ww-how{margin:4px 0 6px}
.ww-sls{display:grid;gap:2px;margin:4px 0 12px}
.ww-sl{margin:0 0 4px}
.ww-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ww-sl-top label{font-weight:700;font-size:1.05rem}
.ww-sl-top output{font:600 1.15rem var(--font-math);color:var(--sc)}
.ww-sl-row{display:flex;align-items:center;gap:8px}
.ww-pm{min-width:40px;min-height:40px;padding:0;font-size:1.25rem;line-height:1}
.ww-sl input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;cursor:pointer}
.ww-sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.ww-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc);margin-top:-8px}
.ww-sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.ww-sl input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc)}
.ww-sl input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.ww-h{margin:0 0 4px}
.ww-eq{font-size:1.25rem;margin:0 0 6px;min-height:1.6em}
.ww-eq .m{white-space:normal}
#ww-read{margin-top:10px}
#ww-read dd .m{white-space:normal}

</style>
</head>

:"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"69c654de","content":{"id":"36-chapter-5-review","kind":"review","title":"Chapter 5 summary and review","topic":"Chapter 5 Summary & Review","hero":{"eq":"`y = @a{a} sin[@k{k}(x - @d{d})] + @c{c}`","eqLabel":"y equals a sine of k times the quantity x minus d, plus c","eqSize":"md","headline":"One wave, four ways to say it","text":"A tide, a Ferris wheel and a sound are all waves. You can draw one, write its equation, list its values, or describe it in words. Amplitude, period, phase shift and axis connect all four, and the unit circle is where every wave comes from.","muted":"Work through the five parts in order. Your answers save on this device as you go.","fig":{"shape":"wide","aria":"Graph of y = 3 sin(πt/6) + 1 for t from 0 to 12, with amplitude 3, period 12 and axis y = 1 marked. A dashed cosine, y = 3 cos[π/6(t − 3)] + 1, lies exactly on it. The line y = 2.5 meets the wave at t = 1 and t = 5. The axes are labelled time (h) and water level (m).","steps":[{"cap":"A point on the unit circle unwraps into `y = sin x` · module 31"},{"cap":"`@a{a} = 3`, period `2π ÷ @k{π/6} = 12`, axis `y = @c{1}`: `y = 3 sin(πt/6) + 1` · module 32"},{"cap":"A cosine slides `@d{d} = 3` onto it: same wave, another equation · module 33"},{"cap":"The line `y = 2.5` meets it twice, at `t = 1` and `t = 5` · module 34"},{"cap":"The axes become time (h) and water level (m) · module 35"}]}},"goals":["I can sketch and describe the six trig functions in radians, including periods, zeros, asymptotes and ranges.","I can state the amplitude, period, phase shift and axis of a transformed sinusoid and sketch it.","I can write an equation for a sinusoid from its graph or features, in more than one correct way.","I can solve linear and quadratic trig equations on `0 ≤ x ≤ 2π`.","I can model periodic situations and interpret the parameters and rates in context.","I can move between a wave’s graph, equation, table and description."],"keyIdeas":{"31":{"idea":"The graphs unwrap the unit circle; csc, sec, cot have asymptotes where sin, cos, tan are 0 and stay put where they’re ±1.","look":"Unwrap the circle (Explore); Build the reciprocal graphs (Reciprocals)"},"32":{"idea":"Amplitude `|a|`, period `2π/|k|`, phase shift `d` (after factoring), axis `y = c`.","look":"Wave tuner: four numbers, four brackets (Explore); Period and phase detective (Detective)"},"33":{"idea":"Amplitude and axis from max and min; period from max to max; choose sine or cosine and the matching `d`. Many equations can be right.","look":"Read the wave (Explore); Many right answers (Rewrite)"},"34":{"idea":"Isolate the trig function (or factor), find the reference angle, use CAST for every solution in `[0, 2π]`.","look":"Line meets wave (Explore); Quadratic equations and identities (Quadratics)"},"35":{"idea":"Read amplitude, axis, period and start from the situation; interpret each parameter with units.","look":"Ferris wheel lab (Explore); Real data: tides and daylight (Real data)"}},"start":{"diagnostic":{"title":"Diagnostic: which modules should I revisit?","intro":"Eight questions, one or two from each Chapter 5 module. Pick an answer, say how sure you are, then check it. At the end you’ll see which modules to revisit.","questions":[{"id":"d1","topic":"31","goal":1,"prompt":"Which of these functions has vertical asymptotes at `x = 0`, π and 2π?","options":[{"t":"`tan x`","why":"`tan x` has asymptotes at `π/2` and `3π/2`.","_n":"07f9","_k":"245e8369"},{"t":"`sec x`","why":"`sec x` is undefined where `cos x = 0`: `π/2`, `3π/2`. `csc x = 1/sin x`: asymptotes where `sin x = 0`.","_n":"17e9","_k":"a41295b7"},{"t":"`cos x`","why":"Cosine has no asymptotes.","_n":"27d9","_k":"01ed2f65"},{"t":"`csc x`","why":"`csc x = 1/sin x`, undefined where `sin x = 0`.","_n":"37c9","_k":"c13657b4"}],"hints":["Asymptotes come from dividing by 0.","Which function divides by `sin x`?","`csc x`."]},{"id":"d2","topic":"31","goal":1,"prompt":"Which set is the range of `y = sec x`?","options":[{"t":"`(-1, 1)`","why":"Those are exactly the values `sec x` can’t take.","_n":"47b9","_k":"03f16e79"},{"t":"`(-∞, -1] ∪ [1, ∞)`","why":"`|cos x| ≤ 1`, so `|1/cos x| ≥ 1`.","_n":"57a9","_k":"f61cfbb4"},{"t":"`[-1, 1]`","why":"That’s the range of `cos x`.","_n":"6799","_k":"0bc77c28"},{"t":"`(-∞, ∞)`","why":"`sec x` never takes values between −1 and 1.","_n":"7789","_k":"55341760"}],"hints":["`sec = 1/cos`.","What happens to `1/c` when `|c| ≤ 1`?","`|sec x| ≥ 1`."]},{"id":"d3","topic":"32","goal":2,"fixedOrder":true,"prompt":"What is the period of `y = 3 sin[4(x - π/6)] + 2`?","options":[{"t":"`π/6`","why":"That’s the phase shift.","_n":"8779","_k":"fd3f21b4"},{"t":"`π/2`","why":"`2π/4`.","_n":"97ba","_k":"48140c13"},{"t":"4","why":"That’s `k`. `k` squeezes 2π: the period is `2π/|k|`.","_n":"a7ca","_k":"5bc2d335"},{"t":"`8π`","why":"That multiplies by 4.","_n":"b79a","_k":"afb42a5c"}],"hints":["Period = `2π/|k|`.","`k = 4`.","`π/2`."]},{"id":"d4","topic":"32","goal":2,"prompt":"What are the maximum and minimum values of `y = -2 cos x + 5`?","options":[{"t":"Maximum 5, minimum −2","why":"5 is the axis; −2 is `a`.","_n":"c7aa","_k":"1b0fe089"},{"t":"Maximum 7, minimum −3","why":"5 − 2 = 3.","_n":"d7fa","_k":"abf6892d"},{"t":"Maximum 7, minimum 3","why":"Axis 5, amplitude 2.","_n":"e80a","_k":"8d3f4b40"},{"t":"Maximum 3, minimum 7","why":"The maximum is the larger: 5 + 2.","_n":"f7da","_k":"ad674179"}],"hints":["Axis `c = 5`, amplitude `|a| = 2`.","5 ± 2.","7 and 3."]},{"id":"d5","topic":"33","goal":3,"prompt":"A sinusoid has a maximum at `(π/4, 6)` and the next minimum at `(3π/4, -2)`. Which equation fits?","options":[{"t":"`y = 4 cos[{1}/{2}(x - π/4)] + 2`","why":"Period π gives `k = 2π/π = 2`. `k` squeezes 2π: the period is `2π/|k|`.","_n":"g7ea","_k":"8c143411"},{"t":"`y = 4 cos[2(x - π/4)] + 6`","why":"6 is the maximum, not the axis.","_n":"h73a","_k":"3dfc5fe8"},{"t":"`y = 4 cos[2(x - π/4)] + 2`","why":"Amplitude (6 − (−2))/2 = 4; axis 2; half a period is `π/2`, so the period is π and `k = 2`; cosine with `a > 0` has its max at `d = π/4`.","_n":"i74a","_k":"8a64449d"},{"t":"`y = 8 cos[2(x - π/4)] + 2`","why":"8 is max − min; the amplitude is half that. Amplitude = (max − min)/2; axis `y = (max + min)/2`.","_n":"j75a","_k":"8aab21c8"}],"hints":["Max and min give amplitude and axis.","Max to min is half a period.","`y = 4 cos[2(x - π/4)] + 2`."]},{"id":"d6","topic":"34","goal":4,"prompt":"Solve `2 sin x - 1 = 0` for `0 ≤ x ≤ 2π`.","options":[{"t":"`x = π/6` or `7π/6`","why":"Sine is negative at `7π/6`.","_n":"k74a","_k":"35c71990"},{"t":"`x = π/6` only","why":"Sine is also `1/2` in quadrant 2. A horizontal line meets the wave twice per period: use the related angle too.","_n":"l73a","_k":"2593757c"},{"t":"`x = π/3` or `2π/3`","why":"That’s `sin x = √3/2`.","_n":"m72a","_k":"684cfdf4"},{"t":"`x = π/6` or `5π/6`","why":"`sin x = 1/2` in quadrants 1 and 2.","_n":"n71a","_k":"b27945b3"}],"hints":["Isolate `sin x`.","`sin x = 1/2`.","`π/6` and `5π/6`."]},{"id":"d7","topic":"34","goal":4,"prompt":"Solve `2 cos^2 x - cos x - 1 = 0` for `0 ≤ x ≤ 2π`.","options":[{"t":"`x = 2π/3` or `4π/3`","why":"`cos x = 1` also gives 0 and 2π.","_n":"o70a","_k":"afa281b8"},{"t":"`x = 0`, `2π/3`, `4π/3` or `2π`","why":"`(2 cos x + 1)(cos x - 1) = 0`: `cos x = -1/2` or 1.","_n":"p6fa","_k":"0705d26d"},{"t":"`x = 0` or `2π`","why":"`cos x = -1/2` gives two more.","_n":"q6ea","_k":"a1a31348"},{"t":"`x = π/3`, `5π/3` or 0","why":"`cos x = -1/2`, not `+1/2`.","_n":"r7da","_k":"ddf661ed"}],"hints":["Let `u = cos x` and factor.","`(2u + 1)(u - 1) = 0`.","0, `2π/3`, `4π/3`, 2π."]},{"id":"d8","topic":"35","goal":5,"prompt":"A rider’s height is `h(t) = -10 cos(πt/30) + 12` metres after `t` seconds. What are the period and the maximum height?","options":[{"t":"60 s; 12 m","why":"12 m is the axle height.","_n":"s7ca","_k":"b0c1d9bf"},{"t":"`2π` s; 10 m","why":"The period is in seconds: 60.","_n":"tefa","_k":"52337db7"},{"t":"30 s; 22 m","why":"Period = 2π ÷ (`π/30`). `k` squeezes 2π: the period is `2π/|k|`.","_n":"uf0a","_k":"6d56190d"},{"t":"60 s; 22 m","why":"2π ÷ (`π/30`) = 60; 12 + 10 = 22.","_n":"vf1a","_k":"f70cd8a4"}],"hints":["Period = `2π/k`.","`k = π/30`.","60 s; 22 m."]}]}},"connect":{"heading":"Four forms, four waves","intro":"Each tide below appears in four forms: an equation, a graph, a table and words. Time `t` is in hours; heights `h` are in metres relative to a dock marker. Each wave’s words card is already in place. Build its group by adding the equation, the graph and the table that describe the same wave.","summary":"Four forms","how":"Tap a card, then tap “Place in wave §1”.","ui":{"forms":{"eq":"Equation","graph":"Graph","table":"Table","words":"Words"},"rows":{"eq":"Equations","graph":"Graphs","table":"Tables"},"tray":"Cards","inWave":"in wave §1","put":"Place in wave §1","pick":"Tap a card first, then tap “Place in wave §1”.","placed":"That card belongs to wave §1: §2 of 3 placed.","done":"Wave §1’s group is complete.","wait":"Its group is built in challenge §1.","check":"Check","needAll":"Choose a form for every wave first.","wave":"Wave §1","empty":"empty slot","selected":"Selected:","none":"Tap a card to select it.","graphCard":"graph card","tableCard":"table","chal":"Challenge §1 of §2","prev":"Previous","next":"Next challenge","progress":"§1 of §2 challenges done. “The chapter on one page” appears when all §2 are done."},"groups":[{"id":"A","words":"Starts at the middle level and rising; high tide 3 h later; repeats every 12 h."},{"id":"B","words":"Starts at high tide, 4 m; repeats every 12 h."},{"id":"C","words":"Starts at low tide, −2 m; repeats every 12 h."},{"id":"D","words":"Starts at the middle level and rising; high tide 1.5 h later; repeats every 6 h."}],"cards":[{"id":"e1","form":"eq","t":"`h = 3 sin(πt/3) + 1`","_a":"FH1B"},{"id":"e2","form":"eq","t":"`h = 3 cos(πt/6) + 1`","_a":"FHtB"},{"id":"e3","form":"eq","t":"`h = 3 sin(πt/6) + 1`","_a":"FHhB"},{"id":"e4","form":"eq","t":"`h = -3 cos(πt/6) + 1`","_a":"FHpB"},{"id":"g1","form":"graph","p":{"f":"cos","a":-3,"kd":6,"c":1},"_a":"FHpB"},{"id":"g2","form":"graph","p":{"f":"sin","a":3,"kd":6,"c":1},"_a":"FHhB"},{"id":"g3","form":"graph","p":{"f":"sin","a":3,"kd":3,"c":1},"_a":"FH1B"},{"id":"g4","form":"graph","p":{"f":"cos","a":3,"kd":6,"c":1},"_a":"FHtB"},{"id":"t1","form":"table","rows":[[0,4],[3,1],[6,-2],[9,1]],"_a":"FHtB"},{"id":"t2","form":"table","rows":[[0,1],[1.5,4],[3,1],[4.5,-2]],"_a":"FH1B"},{"id":"t3","form":"table","rows":[[0,-2],[3,1],[6,4],[9,1]],"_a":"FHpB"},{"id":"t4","form":"table","rows":[[0,1],[3,4],[6,1],[9,-2]],"_a":"FHhB"}],"def":{"eq":"Compare this equation with the words: what is `h` at `t = 0`, and what period does `2π ÷ k` give?","graph":"Read this graph at `t = 0`, then find its first high tide. Do they match the words?","table":"Read the `t`-column as well as the `h`-column: where does the table start, and when does it reach 4 m?"},"challenges":[{"id":"FF1","type":"group","wave":"A","topics":["32","33"],"goal":6,"prompt":"Build wave A’s group of four.","fb":{"t2":"Check the times: this wave peaks at 1.5 h, not 3 h."},"why":"Wave A starts on its axis, `h = 1`, and rises to its high tide of 4 m at `t = 3`; its period is `2π ÷ π/6 = 12` h."},{"id":"FF2","type":"group","wave":"B","topics":["32","33"],"goal":6,"prompt":"Build wave B’s group.","fb":{"g1":"This graph starts at its lowest point: a −cos wave."},"why":"Wave B starts at its high tide, 4 m, so it’s a cosine with `a > 0`; it repeats every `2π ÷ π/6 = 12` h."},{"id":"FF3","type":"group","wave":"C","topics":["32","33"],"goal":6,"prompt":"Build wave C’s group.","fb":{"e2":"`-3 cos` starts at 1 − 3 = −2."},"why":"Wave C starts at its low tide, 1 − 3 = −2 m, so it’s a cosine with `a \u003c 0`; its period is 12 h."},{"id":"FF4","type":"group","wave":"D","topics":["32","33"],"goal":6,"prompt":"Build wave D’s group.","fb":{"e3":"`πt/6` gives period 12 h; this wave repeats every 6 h. `k` squeezes 2π: the period is `2π/|k|`."},"why":"Wave D starts on its axis and rises, like wave A, but `k = π/3` gives a period of `2π ÷ π/3 = 6` h, so its high tide comes at `t = 1.5`."},{"id":"FF5","type":"mc","stretch":true,"topics":["33"],"goal":[3,6],"prompt":"Which second equation also describes wave A?","options":[{"t":"`h = -3 sin(πt/6) + 1`","why":"That starts at the middle but falling.","_n":"wf2a","_k":"e661c2ed"},{"t":"`h = 3 sin[{π}/{6}(t - 3)] + 1`","why":"That starts at the minimum.","_n":"xeba","_k":"0aa28ee7"},{"t":"`h = 3 cos[{π}/{6}(t + 3)] + 1`","why":"That peaks at `t = -3`, i.e. 9.","_n":"yeca","_k":"501f698b"},{"t":"`h = 3 cos[{π}/{6}(t - 3)] + 1`","why":"Its max is at `t = 3`, where wave A has its high tide, with the same amplitude, axis and period. Shift a sine by a quarter period and it becomes a cosine; check one max and the period.","_n":"zeda","_k":"9f0e6a24"}]},{"id":"FF6","type":"period","stretch":true,"topics":["32"],"goal":[2,6],"prompt":"For each wave, which form shows the period most directly?","forms":[{"id":"eq","t":"Equation"},{"id":"table","t":"Table"}],"note":"The equation gives it by `2π/k`; the table needs a full cycle of times.","periods":"Waves A, B and C repeat every 12 h; wave D repeats every 6 h."}],"onePage":{"title":"The chapter on one page","intro":"Wave A in all four forms. The same four facts sit in each one: amplitude 3, axis `h = 1`, period 12 h and the start.","key":[{"id":"amp","name":"Amplitude","t":"amplitude 3"},{"id":"axis","name":"Axis","t":"axis `h = 1`"},{"id":"per","name":"Period","t":"period 12 h"},{"id":"start","name":"Start","t":"start: middle, rising"}],"aria":"Graph of wave A, h = 3 sin(πt/6) + 1, for t from 0 to 12. A bracket shows the amplitude 3 below the axis, a dashed line marks the axis h = 1, a bracket over the top spans one period from t = 0 to t = 12, and a ring marks the start (0, 1), rising.","cells":{"eq":{"html":"`h = @a{3} sin(@k{{π}/{6}}t) + @c{1}`","notes":[["amp","`|a| = 3`"],["axis","`c = 1`, so the axis is `h = 1`"],["per","`2π ÷ π/6 = 12` h"],["start","sin with `a > 0`: middle, rising"]]},"graph":{"notes":[["amp","high 4, low −2: half the gap is 3"],["axis","halfway between: `h = 1`"],["per","one full cycle from `t = 0` to `t = 12`"],["start","at `t = 0`, `h = 1` and rising"]]},"table":{"notes":[["amp","(4 − (−2))/2 = 3"],["axis","(4 + (−2))/2 = 1"],["per","middle at 0, high at 3: a quarter period is 3 h, so the period is 12 h"],["start","`t = 0`: `h = 1`, then up to 4"]]},"words":{"html":"Starts at the \u003cspan class=\"ff-h ff-h-axis\">middle level\u003c/span> and \u003cspan class=\"ff-h ff-h-start\">rising\u003c/span>; high tide \u003cspan class=\"ff-h ff-h-per\">3 h later\u003c/span>; \u003cspan class=\"ff-h ff-h-per\">repeats every 12 h\u003c/span>.","notes":[["amp","not stated: these words give times, not heights"],["axis","“the middle level”"],["per","“repeats every 12 h” (and “3 h later” is a quarter of it)"],["start","“starts at the middle level and rising”"]]}}}},"mixed":{"heading":"Mixed practice","intro":"Twelve questions from every Chapter 5 module, mixed up on purpose, so you practise choosing the right idea. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Twelve questions from all five modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"33","goal":3,"kind":"mc","star":true,"prompt":"A wave has maximum 5 at `x = π/2` and minimum −1 at `x = 3π/2`. Which equation fits?","options":[{"t":"`y = 6 sin x + 2`","why":"6 is max − min. Amplitude = (max − min)/2; axis `y = (max + min)/2`.","_n":"10eea","_k":"7b26ad81"},{"t":"`y = 3 sin x + 2`","why":"Amplitude 3, axis 2, period 2π, and `sin x` peaks at `π/2`.","_n":"11f7a","_k":"fa125bb4"},{"t":"`y = 3 sin x + 5`","why":"5 is the max, not the axis.","_n":"12f8a","_k":"f72d7777"},{"t":"`y = 3 cos x + 2`","why":"`cos x` peaks at 0.","_n":"13e99","_k":"a3537b1e"}],"hints":["Amplitude, axis, period.","3, 2, 2π.","sin peaks at `π/2`: `3 sin x + 2`."]},{"id":"mp2","topic":"31","goal":1,"kind":"strip","prompt":"Zeros of `y = tan x` on `[0, 2π]`.","_a":"bQlPBwcYVlFr","display":"`x = 0`, π and 2π","why":"`tan x = sin x/cos x` is 0 where `sin x = 0`.","rules":[{"any":[6,18],"fb":"That’s an asymptote: `tan x` is undefined there."}],"hints":["`tan x = sin x/cos x` is 0 where its top is 0.","`sin x = 0` at 0, π and 2π.","0, π and 2π."]},{"id":"mp3","topic":"34","goal":4,"kind":"strip","prompt":"Solve `tan x = √3` on `[0, 2π]`.","_a":"bQ1PBwNp","display":"`x = π/3` and `4π/3`","why":"Reference angle `π/3`; tangent is positive in quadrants 1 and 3.","rules":[{"any":[8],"fb":"`tan(2π/3) = -√3`."}],"hints":["`tan(π/3) = √3`, so the reference angle is `π/3`.","Tangent is positive in quadrants 1 and 3.","`π/3` and `4π/3`."]},{"id":"mp4","topic":"32","goal":2,"kind":"mc","prompt":"What is the phase shift of `y = sin(2x - π/3)`?","options":[{"t":"`π/3` to the left","why":"Factor out `k` first; then `x - d` with `d > 0` shifts to the right.","_n":"14e89","_k":"77fa05a4"},{"t":"`π/3` to the right","why":"Factor out `k`: `sin[2(x - π/6)]` shifts `π/6`.","_n":"15eb9","_k":"8e2d16db"},{"t":"`π/6` to the left","why":"`x - π/6` means a shift to the right.","_n":"16ea9","_k":"8d98ddc3"},{"t":"`π/6` to the right","why":"`2x - π/3 = 2(x - π/6)`: `π/6` to the right.","_n":"17ed9","_k":"cddee700"}],"hints":["Write the inside as `k(x - d)`.","`2x - π/3 = 2(x - π/6)`.","`π/6` to the right."]},{"id":"mp5","topic":"35","goal":5,"kind":"num","keypad":"decimal","prompt":"Daylight hours on day `t` of the year are `D(t) = 3 sin[{2π}/{365}(t - 80)] + 12`. What is the longest day’s length?","label":"Longest day:","unit":"h","_a":"Bww=","display":"15 h","why":"The longest day is the maximum: `c + |a|` = 12 + 3 = 15 h.","wrong":[{"match":12,"fb":"12 h is the axis: the average day."},{"match":9,"fb":"That’s the shortest day, `c - |a|`."},{"match":3,"fb":"3 is the amplitude: how far the longest day is above the average."}],"hints":["The longest day is the maximum of `D`.","Maximum = axis + amplitude.","12 + 3 = 15 h."]},{"id":"mp6","topic":"31","goal":1,"kind":"strip","prompt":"Where is `csc x` undefined on `[0, 2π]`?","_a":"bQlPBwcYVlFr","display":"`x = 0`, π and 2π","why":"`csc x = 1/sin x` is undefined where `sin x = 0`: 0, π and 2π.","rules":[{"any":[6],"fb":"`csc = 1/sin`; `sin(π/2) = 1`. `csc x = 1/sin x`: asymptotes where `sin x = 0`."},{"any":[18],"fb":"`csc = 1/sin`; `sin(3π/2) = -1`. `csc x = 1/sin x`: asymptotes where `sin x = 0`."}],"hints":["`csc x = 1/sin x`.","It’s undefined where `sin x = 0`.","0, π and 2π."]},{"id":"mp7","topic":"33","goal":3,"kind":"mc","star":true,"prompt":"Which cosine equation is equivalent to `y = 2 sin[3(x - π/6)] - 1`?","options":[{"t":"`y = 2 cos[3(x - π/6)] - 1`","why":"Sine and cosine differ by a quarter period: `2π/3 ÷ 4 = π/6` more.","_n":"18ec9","_k":"09301303"},{"t":"`y = 2 cos[3(x - π/2)] - 1`","why":"That shifts by `π/2`, a full quarter of 2π, not of the period.","_n":"19ef9","_k":"d2eb67ab"},{"t":"`y = 2 cos[3(x - π/3)] - 1`","why":"The sine starts its cycle at `π/6` and peaks a quarter period, `2π/3 ÷ 4 = π/6`, later, at `π/3`: that’s where the cosine’s maximum goes.","_n":"1aee9","_k":"ad000f73"},{"t":"`y = -2 cos[3(x - π/6)] - 1`","why":"That starts at a minimum.","_n":"1bf19","_k":"a3008a7a"}],"hints":["`sin θ = cos(θ - π/2)`.","`3(x - π/6) - π/2 = 3(x - π/6 - π/6)`.","`2 cos[3(x - π/3)] - 1`."]},{"id":"mp8","topic":"34","goal":4,"kind":"strip","star":true,"prompt":"Solve `2 sin^2 x = sin x` on `[0, 2π]`.","_a":"bQlPBBkFVEkHC08EAWk=","display":"`x = 0`, `π/6`, `5π/6`, π and 2π","why":"`sin x(2 sin x - 1) = 0` keeps `sin x = 0` (0, π, 2π) as well as `sin x = 1/2` (`π/6`, `5π/6`).","rules":[{"set":[2,10],"fb":"Dividing by `sin x` lost `sin x = 0`: factor `sin x(2 sin x - 1) = 0`. Factor instead: `sin x(2 sin x - 1) = 0` keeps `sin x = 0`."}],"hints":["Bring everything to one side: `2 sin^2 x - sin x = 0`.","Factor: `sin x(2 sin x - 1) = 0`.","`sin x = 0`: 0, π, 2π; `sin x = 1/2`: `π/6`, `5π/6`."]},{"id":"mp9","topic":"32","goal":2,"kind":"mc","prompt":"Amplitude and axis of `y = -4 sin x - 3`?","options":[{"t":"Amplitude −4, axis `y = -3`","why":"Amplitude is `|a|`.","_n":"1cf09","_k":"47f1b00e"},{"t":"Amplitude 4, axis `y = 3`","why":"The axis is `y = c`, and here `c = -3`.","_n":"1d039","_k":"21246780"},{"t":"Amplitude 4, axis `y = -3`","why":"Amplitude `|a| = |-4| = 4`; axis `y = c = -3`.","_n":"1e049","_k":"7a8885a5"},{"t":"Amplitude 3, axis `y = -4`","why":"That swaps them: `a = -4` sets the amplitude and `c = -3` the axis.","_n":"1f019","_k":"f6bc5110"}],"hints":["Amplitude = `|a|`; axis `y = c`.","`a = -4`, `c = -3`.","Amplitude 4, axis `y = -3`."]},{"id":"mp10","topic":"35","goal":5,"kind":"mc","star":true,"prompt":"A Ferris wheel has radius 15 m, its axle 17 m above the ground, one turn every 40 s, and the rider starts at the bottom. Which model gives the height?","options":[{"t":"`h = 15 cos(πt/20) + 17`","why":"That starts at the top. A cosine with `a > 0` starts at a maximum; −cos starts at a minimum.","_n":"1g029","_k":"db81c1ce"},{"t":"`h = -15 cos(πt/20) + 17`","why":"Amplitude = radius 15, axis = axle 17, `k = 2π/40 = π/20`, and a bottom start is −cos.","_n":"1hff9","_k":"f9a9c418"},{"t":"`h = -17 cos(πt/20) + 15`","why":"Radius and axle swapped.","_n":"1i009","_k":"b595820a"},{"t":"`h = -15 cos(40t) + 17`","why":"`k` squeezes 2π: the period is `2π/|k|`. Here `k = 2π/40`.","_n":"1jfd9","_k":"743c837b"}],"hints":["Amplitude = radius, axis = axle.","`k = 2π/40 = π/20`.","Bottom start: −cos."]},{"id":"mp11","topic":"31","goal":1,"kind":"num","star":true,"keypad":"decimal","prompt":"How many solutions does `sin x = 0.3` have for `0 ≤ x ≤ 4π`?","label":"Number of solutions:","_a":"Ag==","display":"4 solutions","why":"The line `y = 0.3` meets each period of `sin x` twice, and `[0, 4π]` holds two periods.","wrong":[{"match":2,"fb":"That’s one period; `[0, 4π]` is two periods."}],"hints":["How many times does the line `y = 0.3` cross one period of `sin x`?","Twice per period: 0.3 is between −1 and 1, and isn’t ±1.","Two periods × 2 = 4."]},{"id":"mp12","topic":"34","goal":4,"kind":"strip","star":true,"prompt":"Solve `cos 2x = cos x` on `[0, 2π]`.","_a":"bQlPDhkFUkkEDT4=","display":"`x = 0`, `2π/3`, `4π/3` and 2π","why":"`2 cos^2 x - cos x - 1 = (2 cos x + 1)(cos x - 1) = 0`: `cos x = -1/2` gives `2π/3` and `4π/3`; `cos x = 1` gives 0 and 2π.","general":"`cos 2x = 2 cos^2 x - 1`, so `2 cos^2 x - cos x - 1 = 0`.","hints":["Use a double-angle identity with cosine only.","`(2 cos x + 1)(cos x - 1) = 0`.","0, `2π/3`, `4π/3`, 2π."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which Connect card was hardest to place, and what finally gave it away?"},{"id":"j2","q":"In your own words, why can two different equations describe exactly the same wave?"},{"id":"j3","q":"Explain to a friend how to make sure you’ve found every solution of a trig equation in `[0, 2π]`."},{"id":"j4","q":"Which module will you revisit, and what exactly will you practise there?"}]},"final":{"intro":"This shows what you’ve learned across the whole chapter, so there are no hints here. Answer all 15 questions and say how sure you are. Then submit to see your results by category and by module. Each question is labelled with its achievement chart category and its module.","questions":[{"id":"f1","cat":"K","topic":"31","goal":1,"a":{"fixedOrder":true,"prompt":"What is the period of `y = tan x`?","options":[{"t":"`π/2`","why":"That’s only from a zero of `tan x` to the next asymptote.","_n":"1kfe9","_k":"6bd144b7"},{"t":"`π`","why":"`tan x` repeats every half turn: `tan(x + π) = tan x`.","_n":"1lfb9","_k":"9eddece0"},{"t":"`2π`","why":"tan repeats every half turn.","_n":"1mfc9","_k":"dd98e9c7"},{"t":"`4π`","why":"That’s two full turns; `tan x` repeats every π.","_n":"1n7d9","_k":"0b408044"}]},"b":{"fixedOrder":true,"prompt":"What is the period of `y = sec x`?","options":[{"t":"`π/2`","why":"That’s only from `x = 0` to the first asymptote.","_n":"1o7c9","_k":"ef43f05e"},{"t":"`π`","why":"sec follows cos, period 2π.","_n":"1p7b9","_k":"4b386480"},{"t":"`2π`","why":"`sec x = 1/cos x` repeats when `cos x` does: every 2π.","_n":"1q7a9","_k":"e6bda4e1"},{"t":"`4π`","why":"That’s two full periods.","_n":"1r819","_k":"30e312bc"}]}},{"id":"f2","cat":"K","topic":"32","goal":2,"a":{"fixedOrder":true,"prompt":"What is the period of `y = 5 cos(3x) - 1`?","options":[{"t":"`π/3`","why":"That divides π, not 2π, by 3.","_n":"1s809","_k":"96e5b2b4"},{"t":"`2π/3`","why":"`2π/|k| = 2π/3`.","_n":"1t7f9","_k":"2be92823"},{"t":"3","why":"That’s `k`. `k` squeezes 2π: the period is `2π/|k|`.","_n":"1u7e9","_k":"bb41aa5e"},{"t":"`6π`","why":"That multiplies 2π by 3; `k = 3` squeezes the wave.","_n":"1v759","_k":"8cdbbbe9"}]},"b":{"fixedOrder":true,"prompt":"What is the period of `y = 2 sin(x/4) + 3`?","options":[{"t":"`1/4`","why":"That’s `k`. `k` squeezes 2π: the period is `2π/|k|`.","_n":"1w749","_k":"6d1c64a1"},{"t":"`π/2`","why":"That divides 2π by 4, but here `k = 1/4`.","_n":"1x779","_k":"ce8f86f9"},{"t":"4","why":"That’s `1/k`; the period is `2π/k`.","_n":"1y789","_k":"1a0ab4fb"},{"t":"`8π`","why":"`k = 1/4`, so the period is 2π ÷ `1/4` = 8π.","_n":"1z799","_k":"6364983e"}]}},{"id":"f3","cat":"K","topic":"34","goal":4,"a":{"prompt":"Solve `cos x = -√2/2` for `0 ≤ x ≤ 2π`.","options":[{"t":"`3π/4` only","why":"A horizontal line meets the wave twice per period: use the related angle too.","_n":"207a9","_k":"cc752306"},{"t":"`5π/4` and `7π/4`","why":"`cos(7π/4)` is positive: `7π/4` is in quadrant 4.","_n":"217b9","_k":"7ea596d8"},{"t":"`3π/4` and `5π/4`","why":"Reference angle `π/4`; cosine is negative in quadrants 2 and 3.","_n":"227c9","_k":"e6c53dad"},{"t":"`π/4` and `7π/4`","why":"Cosine is negative in quadrants 2 and 3.","_n":"237d9","_k":"296fb4e8"}]},"b":{"prompt":"Solve `sin x = -√3/2` for `0 ≤ x ≤ 2π`.","options":[{"t":"`2π/3` and `4π/3`","why":"`sin(2π/3)` is positive: `2π/3` is in quadrant 2.","_n":"247e9","_k":"06c30bb6"},{"t":"`π/3` and `2π/3`","why":"Those give `sin x = +√3/2`; sine is negative in quadrants 3 and 4.","_n":"256f9","_k":"97db1307"},{"t":"`4π/3` only","why":"A horizontal line meets the wave twice per period: use the related angle too.","_n":"26709","_k":"d3132215"},{"t":"`4π/3` and `5π/3`","why":"Reference angle `π/3`; sine is negative in quadrants 3 and 4.","_n":"27719","_k":"7b68fe8a"}]}},{"id":"f4","cat":"K","topic":"33","goal":3,"a":{"fixedOrder":true,"prompt":"A sinusoid has maximum 9 and minimum −3. What is the equation of its axis?","options":[{"t":"`y = 3`","why":"(9 + (−3))/2 = 3.","_n":"28709","_k":"58bc5558"},{"t":"`y = 6`","why":"That’s the amplitude. Amplitude = (max − min)/2; axis `y = (max + min)/2`.","_n":"29739","_k":"d5bee5fd"},{"t":"`y = 9`","why":"9 is the maximum; the axis is halfway between the maximum and the minimum.","_n":"2a729","_k":"2aced558"},{"t":"`y = 12`","why":"That’s max − min.","_n":"2b6d9","_k":"1ba80e7a"}]},"b":{"fixedOrder":true,"prompt":"A sinusoid has maximum 4 and minimum −8. What is the equation of its axis?","options":[{"t":"`y = -8`","why":"−8 is the minimum; the axis is halfway between the maximum and the minimum.","_n":"2c6c9","_k":"1861cafc"},{"t":"`y = -2`","why":"(4 + (−8))/2 = −2.","_n":"2d6f9","_k":"b379ee29"},{"t":"`y = 6`","why":"That’s the amplitude. Amplitude = (max − min)/2; axis `y = (max + min)/2`.","_n":"2e6e9","_k":"30519f14"},{"t":"`y = 12`","why":"That’s max − min.","_n":"2f799","_k":"43f73a40"}]}},{"id":"f5","cat":"T","topic":"32","goal":2,"a":{"prompt":"Where is the first maximum to the right of `x = π/4` on `y = 2 sin[3(x - π/4)] + 1`?","options":[{"t":"`(3π/4, 3)`","why":"That ignores `k`: `π/2 ÷ 3 = π/6`.","_n":"2g789","_k":"59c02658"},{"t":"`(5π/12, 3)`","why":"`3(x - π/4) = π/2` gives `x = π/4 + π/6`.","_n":"2h6b9","_k":"00506641"},{"t":"`(π/4, 3)`","why":"At `x = π/4` the wave is on its axis, rising.","_n":"2i6c9","_k":"3fa3306a"},{"t":"`(5π/12, 2)`","why":"Max = 1 + 2 = 3.","_n":"2j699","_k":"cce96613"}]},"b":{"prompt":"Where is the first maximum to the right of `x = 0` on `y = 3 cos[2(x + π/6)] - 1`?","options":[{"t":"`(π/6, 2)`","why":"`x + π/6` means a shift left, so the max is at `-π/6 + π`.","_n":"2k6a9","_k":"4307b47a"},{"t":"`(-π/6, 2)`","why":"That’s left of 0.","_n":"2l6f9","_k":"5f005d3e"},{"t":"`(5π/6, 3)`","why":"Max = −1 + 3 = 2.","_n":"2m709","_k":"88a4feda"},{"t":"`(5π/6, 2)`","why":"Maxima where `2(x + π/6) = 2πn`: `x = -π/6 + πn`; the first positive is `5π/6`.","_n":"2n6d9","_k":"42cf72b1"}]}},{"id":"f6","cat":"T","topic":"33","goal":3,"a":{"prompt":"Which equation is \u003cstrong>not\u003c/strong> equivalent to `y = 2 sin x`?","options":[{"t":"`y = -2 sin(x - π)`","why":"Equivalent: `sin(x - π) = -sin x`.","_n":"2o6e9","_k":"0d16d932"},{"t":"`y = 2 sin(x + 2π)`","why":"Equivalent: a full period.","_n":"2p739","_k":"6ae87f20"},{"t":"`y = 2 cos(x - π/2)`","why":"Equivalent: `cos(x - π/2) = sin x`.","_n":"2q749","_k":"b57b4492"},{"t":"`y = 2 cos(x + π/2)`","why":"`cos(x + π/2) = -sin x`.","_n":"2r53c","_k":"d479dca1"}]},"b":{"prompt":"Which equation is \u003cstrong>not\u003c/strong> equivalent to `y = 3 cos x`?","options":[{"t":"`y = 3 sin(x + π/2)`","why":"Equivalent: `sin(x + π/2) = cos x`.","_n":"2s54c","_k":"c2c22d30"},{"t":"`y = 3 cos(x - 2π)`","why":"Equivalent: a full period.","_n":"2t51c","_k":"13597cf6"},{"t":"`y = 3 sin(x - π/2)`","why":"`sin(x - π/2) = -cos x`.","_n":"2u52c","_k":"7a91f0b7"},{"t":"`y = -3 cos(x + π)`","why":"Equivalent: `cos(x + π) = -cos x`.","_n":"2v4fc","_k":"539def28"}]}},{"id":"f7","cat":"T","topic":"34","goal":4,"a":{"prompt":"Solve `2 sin^2 x - 3 sin x + 1 = 0` for `0 ≤ x ≤ 2π`.","options":[{"t":"`x = π/3`, `π/2` or `2π/3`","why":"`sin x = 1/2`, not `√3/2`.","_n":"2w50c","_k":"539cf6f8"},{"t":"`x = π/6` or `5π/6`","why":"`sin x = 1` gives `π/2`.","_n":"2x4dc","_k":"67980324"},{"t":"`x = π/6` or `π/2`","why":"`sin x = 1/2` also at `5π/6`. A horizontal line meets the wave twice per period: use the related angle too.","_n":"2y4ec","_k":"31bc826c"},{"t":"`x = π/6`, `π/2` or `5π/6`","why":"`(2 sin x - 1)(sin x - 1) = 0`.","_n":"2z4bc","_k":"02fce123"}]},"b":{"prompt":"Solve `2 cos^2 x + 3 cos x + 1 = 0` for `0 ≤ x ≤ 2π`.","options":[{"t":"`x = π/3`, `π` or `5π/3`","why":"`cos x = -1/2`, not `1/2`.","_n":"304cc","_k":"2099dbd4"},{"t":"`x = 2π/3` or `π`","why":"`cos x = -1/2` also at `4π/3`. A horizontal line meets the wave twice per period: use the related angle too.","_n":"3139c","_k":"af2e7f12"},{"t":"`x = 2π/3`, `π` or `4π/3`","why":"`(2 cos x + 1)(cos x + 1) = 0`.","_n":"3238c","_k":"282cce93"},{"t":"`x = 2π/3` or `4π/3`","why":"`cos x = -1` gives π.","_n":"333bc","_k":"fd0a6b2f"}]}},{"id":"f8","cat":"T","topic":"31","goal":1,"a":{"prompt":"On `0 \u003c x \u003c 2π`, where are `sin x` and `tan x` both negative?","options":[{"t":"`π \u003c x \u003c 3π/2`","why":"tan is positive in quadrant 3.","_n":"343ac","_k":"3765ba47"},{"t":"`π/2 \u003c x \u003c π`","why":"sin is positive in quadrant 2.","_n":"353dc","_k":"474a58fb"},{"t":"`π \u003c x \u003c 2π`","why":"Only part of that has `tan \u003c 0`.","_n":"363cc","_k":"8932902b"},{"t":"`3π/2 \u003c x \u003c 2π`","why":"`sin \u003c 0` in quadrants 3–4; `tan \u003c 0` in quadrants 2 and 4.","_n":"373fc","_k":"28a5855c"}]},"b":{"prompt":"On `0 \u003c x \u003c 2π`, where are `cos x` negative and `csc x` positive?","options":[{"t":"`π/2 \u003c x \u003c 3π/2`","why":"Only part of that has `csc > 0`.","_n":"383ec","_k":"79274727"},{"t":"`0 \u003c x \u003c π/2`","why":"cos is positive in quadrant 1.","_n":"3941c","_k":"d8458bcb"},{"t":"`π \u003c x \u003c 3π/2`","why":"sin (and csc) is negative in quadrant 3.","_n":"3a40c","_k":"9091b81a"},{"t":"`π/2 \u003c x \u003c π`","why":"`cos \u003c 0` in quadrants 2–3; `csc > 0` where `sin > 0`, quadrants 1–2.","_n":"3bc7b","_k":"5b40ba43"}]}},{"id":"f9","cat":"C","topic":"31","goal":1,"a":{"prompt":"Which is the best explanation of why `y = sec x` has vertical asymptotes at `x = π/2` and `3π/2`?","options":[{"t":"“Because `sin x = 0` there.”","why":"`sin x = ±1` there.","_n":"3cc8b","_k":"224d82f6"},{"t":"“`sec x = 1/cos x`, and `cos x = 0` there, so `sec x` is undefined and grows without bound nearby.”","why":"A reciprocal is undefined where its partner is 0, and huge in size close by.","_n":"3dc9b","_k":"a4d075f7"},{"t":"“Because the period of `sec x` is 2π.”","why":"Period doesn’t place asymptotes.","_n":"3ecab","_k":"f6e3e8a1"},{"t":"“Because sec is the inverse of cos.”","why":"Reciprocal, not inverse: `sec x = 1/cos x`.","_n":"3fcbb","_k":"ba3fdab5"}]},"b":{"prompt":"Which is the best explanation of why `y = cot x` has zeros at `x = π/2` and `3π/2`?","options":[{"t":"“Because `sin x = 0` there.”","why":"Then cot would be undefined.","_n":"3gccb","_k":"92a119dd"},{"t":"“Because `tan x = 0` there.”","why":"tan is undefined there.","_n":"3hcdb","_k":"d5fdd571"},{"t":"“Because cot is the inverse of tan.”","why":"Reciprocal, not inverse: `cot x = 1/tan x`.","_n":"3iceb","_k":"c93a7601"},{"t":"“`cot x = cos x/sin x`; there `cos x = 0` while `sin x = ±1`, so `cot x = 0`.”","why":"A fraction is 0 where its top is 0 and its bottom isn’t.","_n":"3jbfb","_k":"81145ac1"}]}},{"id":"f10","cat":"C","topic":"33","goal":3,"a":{"prompt":"Which is the best explanation of why `y = 4 sin x` and `y = 4 cos(x - π/2)` have the same graph?","options":[{"t":"“Because sine and cosine have the same amplitude.”","why":"Same amplitude isn’t enough: the peaks must line up.","_n":"3kc0b","_k":"6ad1ac76"},{"t":"“Because `π/2` is the period.”","why":"The period is 2π.","_n":"3l4dc","_k":"db4f79db"},{"t":"“Because cos is the reciprocal of sin.”","why":"Reciprocal of sin is csc.","_n":"3m4cc","_k":"4554bec9"},{"t":"“Shifting `cos x` right by `π/2` moves its maximum from 0 to `π/2`, where `sin x` peaks; same amplitude and period, so the curves coincide.”","why":"Shift a sine by a quarter period and it becomes a cosine; check one max and the period.","_n":"3n4bc","_k":"1034c3bc"}]},"b":{"prompt":"Which is the best explanation of why `y = -3 sin x` and `y = 3 sin(x + π)` have the same graph?","options":[{"t":"“Because negative `a` and positive `a` always give the same graph.”","why":"`-3 sin x` is a reflection of `3 sin x`.","_n":"3o4ac","_k":"5bedb079"},{"t":"“Because π is the period of sine.”","why":"The period is 2π.","_n":"3p51c","_k":"ffd702d1"},{"t":"“Shifting `sin x` by half a period, π, changes the sign of every value: `sin(x + π) = -sin x`.”","why":"Half a period moves every maximum onto a minimum, so `3 sin(x + π) = -3 sin x`.","_n":"3q50c","_k":"00ea5e12"},{"t":"“Because both have amplitude 3.”","why":"Not enough on its own.","_n":"3r4fc","_k":"70dcab87"}]}},{"id":"f11","cat":"C","topic":"35","goal":5,"a":{"prompt":"A day’s temperature is `T(t) = 6 sin[{π}/{12}(t - 9)] + 18` °C, `t` hours after midnight. What does the 18 represent?","options":[{"t":"The temperature at midnight","why":"`T(0) = 18 + 6 sin(-3π/4) ≈ 13.8` °C.","_n":"3s4ec","_k":"a5b26271"},{"t":"The highest temperature","why":"That’s 18 + 6.","_n":"3t45c","_k":"873d7e3a"},{"t":"The time of the highest temperature","why":"Times are `t`-values; 18 is a temperature.","_n":"3u44c","_k":"30ebf57a"},{"t":"The average temperature, halfway between the high of 24 °C and the low of 12 °C","why":"18 is `c`: the axis, halfway between 18 + 6 and 18 − 6.","_n":"3vcbc","_k":"78ca6795"}]},"b":{"prompt":"A day’s temperature is `T(t) = 6 sin[{π}/{12}(t - 9)] + 18` °C, `t` hours after midnight. For this model, what does the 9 represent?","options":[{"t":"9 a.m., when the temperature passes its average value while rising","why":"`d = 9`: the sine cycle starts at `t = 9`, on its axis and rising.","_n":"3wccc","_k":"3081ebfd"},{"t":"A temperature of 9 °C","why":"
