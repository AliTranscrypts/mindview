.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 13: hero line, N15 strategy path, N28 pop-up board, Part 3 stations (N25 flatten morph), N4 root boxes, task */
.hero .hero-eq .m{white-space:normal}
.hero .hero-eq.sm{font-size:clamp(1.3rem,3.4vw,2.05rem);line-height:1.3}
.hero .hero-eq.sm .nw .m{white-space:nowrap}
.fb .m,.pred-q .m,.hints .m,.sbtn .m,.task .m,.sq-p .m,.refresh .m,.face .m,.chal .q-prompt .m,.mitem .m,.read dd .m,.rb-q .m{white-space:normal}
/* hero */
.hz-line{font:400 clamp(1.15rem,2.6vw,1.45rem)/1.4 var(--font-math);text-align:center;min-height:2.9em;margin:0 0 8px;display:flex;align-items:center;justify-content:center}
.hz-line .m{white-space:normal}
.hz-in{display:inline-block;animation:hzIn .5s ease-out}
.hz-r{display:inline-block;transition:transform .8s ease-in,opacity .8s ease-in}
.hz-r.go{transform:translateX(-170%);opacity:0}
.hz-hl{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 .15em}
@keyframes hzIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#hero-cap .m{white-space:normal}
/* N15 strategy path */
.sp .eq-cap{font-size:clamp(1.25rem,3vw,1.75rem);line-height:1.3}
.sp-hist{margin:0 0 4px}
.sp-lines{list-style:none;margin:0;padding:0 0 0 2px;border-left:3px solid var(--rule)}
.sp-l{font:400 1.02rem/1.45 var(--font-math);color:var(--ink-2);padding-left:10px;overflow-wrap:anywhere}
.sp-l .m{white-space:normal}
.sp-more{display:none;margin:0 0 4px;font-size:.85rem}
.sp-gcap{margin:6px 0 0}
.sp-gcap .m{white-space:normal}
.sp-modes .seg-wrap{margin-top:0}
.sp-chips{margin:12px 0 6px}
.sp-eq{font-size:1rem;display:inline-flex;align-items:center;gap:.4em}
.sp-tag{font:700 .8rem var(--font-ui);color:var(--ink-2)}
.sp-eq[aria-pressed="true"] .sp-tag{color:var(--hi-ink)}
.sp-note:empty{display:none}
.sp-h{font-weight:700;margin:10px 0 6px}
.sp-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:6px}
.sp-mv{justify-content:flex-start;text-align:left;min-height:40px;font-size:.95rem}
.sp-mv .m{white-space:nowrap}
.sp-mv.flash{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.sp-fb{margin-top:8px}
.sp-fb:empty{display:none}
.sp-foot{margin-top:12px}
.sp-hbox{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.sp-hhead{margin:0 0 6px}
.sp-hhead .m{white-space:normal}
.sp-build .slider output{color:var(--ink)!important}
.sp-build input[type=range]{accent-color:var(--ink)!important}
/* N28 candidate tiles (from MHF4U 12) */
.rh-note{margin:10px 0 6px;max-width:none}
.rh-board{display:flex;flex-wrap:wrap;gap:6px;min-height:8px}
.rh-tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:3.2rem;min-height:44px;padding:.25em .55em;border:2px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1.15rem var(--font-math)}
.rh-tile:disabled{opacity:1}
.rh-tile:not(:disabled):hover{border-color:var(--pen)}
.rh-tile .rh-v{font:400 .78rem var(--font-ui);color:var(--ink-2);white-space:nowrap}
.rh-tile .rh-v .m{font-size:1em}
.rh-tile.miss{border-color:var(--rule);color:var(--ink-2);background:var(--paper)}
.rh-tile.hit{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.rh-tile.hit .rh-v{color:var(--hi-ink);font-weight:700}
/* Part 3 stations */
.rt-chips .fchip.txt{font:700 .95rem var(--font-ui)}
.rt-st h3{margin-top:4px}
.rt-model{margin:6px 0 10px}
.rt-model .m,.rt-fac .m{white-space:normal}
.rt-fac{margin:12px 0 6px}
.rt-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
#rt2-res .tbl-wrap{margin:8px 0}
#rt3-sl .slider output{color:var(--ink)!important}
#rt3-sl input[type=range]{accent-color:var(--ink)!important}
/* Practice: root boxes */
.rb-q{font:400 clamp(1.2rem,3vw,1.5rem)/1.4 var(--font-math);margin:6px 0 10px}
.rb-q.txt{font:400 1.05rem/1.5 var(--font-ui)}
.rb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.rb-lab{font-weight:700}
.rb-boxes{display:flex;flex-wrap:wrap;gap:8px}
.rb-in.numin.short{width:5.6rem}
/* Performance task */
.tl-conds{margin:6px 0 10px;padding-left:1.4em}
.tl-eq{font-size:clamp(1.2rem,3vw,1.6rem)}
.tl-row label > span:first-child{font:400 1.2rem var(--font-math)}
.tl-box{display:inline-flex;align-items:center;gap:4px}
.tl-box .btn{min-width:34px;justify-content:center;padding:.3em .55em}
.tl-row .tl-box input{width:4.6rem}
.tl-roots{margin:4px 0 10px}
.tl-roots .m{white-space:normal}
@media (max-width:560px){
  .sp-lines:not(.all) .sp-l:nth-last-child(n+3){display:none}
  .sp-more{display:inline-block}
  .sp-menu{grid-template-columns:minmax(0,1fr)}
}

title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"f8e8dd60","content":{"id":"13-solving-polynomial-equations","kind":"topic","title":"Solving polynomial equations","topic":"Solving Polynomial Equations","readyTopic":"solving polynomial equations","hero":{"eq":"\u003cspan class=\"nw\">`P(x) = 0` ⟶\u003c/span> \u003cspan class=\"nw\">(factor)(factor)(factor) = 0 ⟶\u003c/span> \u003cspan class=\"nw\">roots = `x`-intercepts\u003c/span>","eqLabel":"P of x equals 0, becomes factor times factor times factor equals 0, and the roots are the x-intercepts","eqSize":"sm","headline":"Zero on one side, then factor","text":"A product is zero only when one of its factors is zero. So to solve a polynomial equation, move everything to one side, \u003cstrong>factor\u003c/strong>, and set each factor to 0. Each real \u003cstrong>root\u003c/strong> you find is an \u003cstrong>`x`-intercept\u003c/strong> of the graph of the polynomial.","fig":{"html":"\u003cdiv class=\"hz-line\" id=\"hz-line\" aria-hidden=\"true\">\u003c/div>\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"The equation x cubed plus 2 x squared equals 9 x plus 18 is rewritten as x cubed plus 2 x squared minus 9 x minus 18 equals 0, then grouped as x squared times (x + 2) minus 9 times (x + 2), then factored as (x + 2)(x − 3)(x + 3) = 0. Three dots drop onto the graph’s x-axis at −3, −2 and 3.\">\u003c/canvas>"}},"goals":["I can solve a factored polynomial equation using the zero product property.","I can rearrange an equation to = 0 before factoring, without dividing by a variable.","I can choose a strategy: common factor, grouping, quadratic form or the factor theorem.","I can solve equations in quadratic form, such as `x^4 - 13x^2 + 36 = 0`.","I can connect real roots to `x`-intercepts, including repeated roots and factors with no real zeros.","I can solve problems with polynomial equations and reject roots that don’t fit the context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Zero product property","goal":1,"prompt":"Solve `(x - 5)(x + 2) = 0`.","options":[{"t":"`x = 5` or `x = -2`","why":"Each factor can be 0.","_n":"037b","_k":"1e7bcf33"},{"t":"`x = -5` or `x = 2`","why":"`x - 5 = 0` at `x = 5`.","_n":"138b","_k":"40867b46"},{"t":"`x = 5` only","why":"`x = -2` makes the second factor 0.","_n":"239b","_k":"4fbc3ae0"},{"t":"`x = -10`","why":"Set each factor to 0.","_n":"33ab","_k":"6df810cd"}],"hints":["When is a product 0?","`x - 5 = 0` or `x + 2 = 0`.","5 or −2."]},{"id":"w2","skill":"Zero product property","goal":2,"prompt":"Solve `x^2 - 3x = 0`.","options":[{"t":"`x = √3`","why":"Factor out `x`.","_n":"43bb","_k":"e08e6e25"},{"t":"`x = 3` only","why":"Dividing by `x` loses `x = 0`.","_n":"53cb","_k":"d0f489ad"},{"t":"`x = 0` or `x = 3`","why":"`x(x - 3) = 0`.","_n":"63db","_k":"bd7834d2"},{"t":"`x = -3` or `x = 0`","why":"`x - 3 = 0` at 3.","_n":"72eb","_k":"734e8dbe"}],"hints":["Common factor?","`x(x - 3) = 0`.","0 or 3."]},{"id":"w3","skill":"Factoring","goal":3,"prompt":"Factor `x^3 - 2x^2 - 9x + 18`.","options":[{"t":"`(x - 2)(x - 9)`","why":"`x^2 - 9`, not `x - 9`.","_n":"82fb","_k":"11b17f3e"},{"t":"`(x - 2)(x^2 - 9)`","why":"`x^2 - 9` factors.","_n":"9df8","_k":"b378d703"},{"t":"`(x + 2)(x - 3)(x + 3)`","why":"`-9x + 18 = -9(x - 2)`.","_n":"ade8","_k":"b8bd7848"},{"t":"`(x - 2)(x - 3)(x + 3)`","why":"`x^2(x - 2) - 9(x - 2)`.","_n":"bdd8","_k":"140081cd"}],"hints":["Group in pairs.","`x^2(x - 2) - 9(x - 2)`.","`(x - 2)(x - 3)(x + 3)`."]},{"id":"w4","skill":"Factoring","goal":3,"prompt":"Factor `u^2 - 13u + 36`.","options":[{"t":"`(u - 4)(u - 9)`","why":"4 × 9 = 36, 4 + 9 = 13.","_n":"cdc8","_k":"b1f6195f"},{"t":"`(u - 12)(u - 3)`","why":"Product 36, but sum 15.","_n":"de38","_k":"a457bfd0"},{"t":"`(u + 4)(u + 9)`","why":"That gives `+13u`.","_n":"ee28","_k":"f6a0938c"},{"t":"`(u - 6)^2`","why":"`(u - 6)^2 = u^2 - 12u + 36`.","_n":"fe18","_k":"9c7f8784"}],"hints":["Product 36, sum −13.","−4 and −9.","`(u - 4)(u - 9)`."]},{"id":"w5","skill":"Square roots","goal":4,"prompt":"Solve `x^2 = 16`.","options":[{"t":"`x = 4`","why":"`(-4)^2 = 16` too.","_n":"ge08","_k":"77029c08"},{"t":"`x = 4` or `x = -4`","why":"Both square to 16.","_n":"hd78","_k":"f33f7368"},{"t":"`x = 8`","why":"`8^2 = 64`.","_n":"id68","_k":"5586a303"},{"t":"`x = 256`","why":"Take the square root.","_n":"je58","_k":"b60295f4"}],"hints":["Which numbers square to 16?","`4^2` and `(-4)^2`.","±4."]},{"id":"w6","skill":"Square roots","goal":5,"prompt":"How many real solutions does `x^2 + 9 = 0` have?","options":[{"t":"Two: ±9","why":"Check: `9^2 + 9 = 90`.","_n":"ke68","_k":"275dc4e2"},{"t":"One: −3","why":"`(-3)^2 = 9`.","_n":"le38","_k":"a1d05d68"},{"t":"Two: ±3","why":"`3^2 = 9`, not −9.","_n":"me48","_k":"adc55a42"},{"t":"None","why":"`x^2 = -9`, and no real number squares to a negative.","_n":"ne18","_k":"7af7f44f"}],"hints":["Isolate `x^2`.","`x^2 = -9`.","No real solutions."]}],"refreshers":{"Zero product property":"If `AB = 0`, then `A = 0` or `B = 0`. It only works when one side is 0.","Factoring":"Common factor first, then grouping or a pattern, then trinomials.","Square roots":"`x^2 = k > 0` gives `x = ±√k`; `x^2 =` negative has no real solutions."}}},"explore":{"heading":"Strategy path","intro":"Choose the next move for each equation. Correct moves rewrite it; each root you find drops onto the graph as an `x`-intercept.","equations":[{"id":"e1","chip":"E1","eq":"`x^3 - 4x = 0`"},{"id":"e2","chip":"E2","eq":"`x^3 + 2x^2 = 9x + 18`"},{"id":"e3","chip":"E3","eq":"`x^4 - 13x^2 + 36 = 0`"},{"id":"e4","chip":"E4","eq":"`2x^3 - 3x^2 - 11x + 6 = 0`"},{"id":"e5","chip":"E5","eq":"`x^4 - 5x^2 - 36 = 0`"}],"moves":[{"id":"side","t":"Move everything to one side"},{"id":"divx","t":"Divide both sides by `x`"},{"id":"cf","t":"Take out a common factor"},{"id":"group","t":"Group in pairs"},{"id":"u","t":"Let `u = x^2`"},{"id":"test","t":"Test a candidate (factor theorem)"},{"id":"quad","t":"Factor a quadratic"},{"id":"zero","t":"Set each factor to 0"}],"fb":{"divx":"That would lose the root `x = 0`. Move everything to one side and factor out `x` instead.","zeroSide":"One side isn’t 0 yet.","na":"{move} doesn’t apply here: {reason}."},"readout":{"line":"Current line","roots":"Roots found","none":"Factors with no real roots","ints":"`x`-intercepts","moves":"Moves"},"predIntro":"Make a prediction first. Then the strategy path will show you what really happens.","predictions":[{"id":"p1","prompt":"Solve `x^3 = 4x`. A student divides both sides by `x` and gets `x^2 = 4`. How many `x`-intercepts does the graph of `y = x^3 - 4x` have?","options":[{"t":"1","_n":"oe28","_k":"99991052"},{"t":"2","_n":"pdf8","_k":"d5decec2"},{"t":"3","_n":"qe08","_k":"9db050d5"},{"t":"4","_n":"rdd8","_k":"c289020a"}],"explain":"`x(x - 2)(x + 2) = 0` also gives `x = 0`, which dividing by `x` threw away."},{"id":"p2","prompt":"E3 after `u = x^2`: `(u - 4)(u - 9) = 0`. How many `x`-intercepts will `y = x^4 - 13x^2 + 36` have?","options":[{"t":"0","_n":"sde8","_k":"6e626c3a"},{"t":"2","_n":"t4b8","_k":"aae2d902"},{"t":"3","_n":"u4a8","_k":"7f679338"},{"t":"4","_n":"v4d8","_k":"95701191"}],"explain":"`u = 4` gives `x = ±2` and `u = 9` gives `x = ±3`."},{"id":"p3","prompt":"E5: `(u - 9)(u + 4) = 0`. How many `x`-intercepts will `y = x^4 - 5x^2 - 36` have?","options":[{"t":"0","_n":"w4c8","_k":"e46e5048"},{"t":"1","_n":"x4f8","_k":"fe0bc9ca"},{"t":"2","_n":"y4e8","_k":"c0377733"},{"t":"4","_n":"z518","_k":"5edd53c0"}],"explain":"`u = x^2 = -4` has no real solutions."},{"id":"p4","prompt":"`y = (x - 1)^2(x + 3)`. How many `x`-intercepts?","options":[{"t":"0","_n":"10508","_k":"7d0a82c4"},{"t":"1","_n":"11538","_k":"63cf2b32"},{"t":"2","_n":"12528","_k":"b7b2a80b"},{"t":"3","_n":"13518","_k":"2e137a8e"}],"explain":"The roots are −3 and 1 (order 2): two different `x`-values."}],"chalIntro":"Use the strategy path to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each candidate you test counts as a move. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3],"prompt":"Solve E2 in at most 4 moves.","why":"Move to one side, group, factor `x^2 - 9`, set to 0: the roots are −3, −2 and 3.","msgs":{"more":"Grouping gets there faster than testing candidates.","pick":"Choose E2 and solve it: find every root.","moves":"You used {n} moves. Press \u003cstrong>Start over\u003c/strong> and try again."},"hints":["Get 0 on one side.","`x^3 + 2x^2 - 9x - 18`: group in pairs.","`(x + 2)(x^2 - 9) = (x + 2)(x - 3)(x + 3)`."]},{"id":"tc2","goal":[3],"prompt":"Solve E4.","why":"`(x - 3)(2x - 1)(x + 2) = 0`: the roots are −2, 1/2 and 3.","msgs":{"ints":"The quotient `2x^2 + 3x - 2` factors as `(2x - 1)(x + 2)`: a fraction root.","pick":"Choose E4 and solve it: find every root."},"hints":["Test candidates ±1, ±2, ±3, ±6, ±1/2, ±3/2.","`P(3) = 54 - 27 - 33 + 6 = 0`.","`(x - 3)(2x - 1)(x + 2) = 0`."]},{"id":"tc3","goal":[4],"stretch":true,"prompt":"Build mode: set `k` so that `x^4 - 10x^2 + k = 0` has \u003cstrong>exactly two\u003c/strong> real roots, \u003cstrong>both integers\u003c/strong>.","why":"`k = -96`: `u = 16` or `u = -6`, so `x = ±4`.","msgs":{"four":"Four real roots.","three":"Three real roots.","none":"No real roots.","twoIrr":"Two real roots, but {r} aren’t integers."},"hints":["Let `u = x^2`: `u^2 - 10u + k = 0`. For exactly two real roots, exactly one `u` should be positive.","The `u`-values add to 10. The positive one must be a perfect square, and the other negative.","`u = 16` and `u = -6`: `k = 16 × (-6) = -96`."]}]},"part3":{"slug":"roots","name":"Roots","heading":"Roots ↔ intercepts","intro":"Three stations, one idea: the real roots of `P(x) = 0` are the `x`-intercepts of `y = P(x)`. Choose a station.","stations":[{"id":"s1","chip":"1. Two views","title":"Station 1: two views of one equation","text":"`x^3 + 2x^2 = 9x + 18` drawn as two graphs: `y = x^3 + 2x^2` (solid) and `y = 9x + 18` (dashed). They meet at `x = -3`, −2 and 3. Subtract them to get one graph.","btn":"Subtract the graphs","back":"Show the two graphs again","after":"`y = x^3 + 2x^2 - 9x - 18` crosses the `x`-axis at the same `x`-values: −3, −2 and 3. Each guide line joins an intersection to its intercept.","alg":"\u003csummary>Check it with algebra\u003c/summary>\u003cp>Substitute each root into both sides:\u003c/p>\u003cdiv class=\"alg-lines\">\u003cspan>`x = -3`: `-27 + 18 = -9` and `9(-3) + 18 = -9`\u003c/span>\u003cspan>`x = -2`: `-8 + 8 = 0` and `9(-2) + 18 = 0`\u003c/span>\u003cspan>`x = 3`: `27 + 18 = 45` and `27 + 18 = 45`\u003c/span>\u003c/div>"},{"id":"s2","chip":"2. The box","title":"Station 2: the box","text":"Cut squares of side `x` cm from the corners of a 10 cm × 16 cm sheet and fold up an open box. For which `x` is the volume 144 cm³?","model":["`V(x) = x(10 - 2x)(16 - 2x) = 144`","`4x^3 - 52x^2 + 160x - 144 = 0`","`x^3 - 13x^2 + 40x - 36 = 0`"],"how":"Test candidates (divisors of 36) until one works.","band":"valid sizes: 0 \u003c `x` \u003c 5","result":"The answer is `x = 2`: a 2 × 6 × 12 box.","alg":"\u003csummary>Check it with algebra\u003c/summary>\u003cdiv class=\"alg-lines\">\u003cspan>`V(2) = 2 × 6 × 12 = 144` ✓\u003c/span>\u003cspan>`x = 9`: `10 - 18 \u003c 0`, so there’s no box \u003csmall>(rejected)\u003c/small>\u003c/span>\u003cspan>Only 0 \u003c `x` \u003c 5 makes every dimension positive.\u003c/span>\u003c/div>"},{"id":"s3","chip":"3. The W","title":"Station 3: the W","text":"`y = x^4 - 13x^2 + 36` with a constant `s` added. Move the slider and watch the four intercepts become two, then none.","alg":"\u003csummary>Check it with algebra\u003c/summary>\u003cp>Let `u = x^2`: `u^2 - 13u + (36 + s) = 0`. Each positive `u` gives two intercepts `x = ±√u`; `u = 0` gives one; a negative `u` gives none.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Roots ↔ intercepts quick check","items":[{"id":"q1","goal":4,"prompt":"Real roots of `x^4 - 5x^2 + 4 = 0`?","choices":[{"t":"±2","fb":"`(x^2 - 1)(x^2 - 4)`: `x^2 = 1` or 4.","_n":"14528","_k":"2c502652"},{"t":"±1, ±2","fb":"Right. `(x^2 - 1)(x^2 - 4)`: `x^2 = 1` or 4.","_n":"15538","_k":"6f9b1b11"},{"t":"1, 4","fb":"`(x^2 - 1)(x^2 - 4)`: `x^2 = 1` or 4.","_n":"16548","_k":"407c7042"},{"t":"±1","fb":"`(x^2 - 1)(x^2 - 4)`: `x^2 = 1` or 4.","_n":"174d8","_k":"da63c97c"}]},{"id":"q2","goal":5,"prompt":"How many `x`-intercepts does `y = x(x^2 + 1)` have?","choices":[{"t":"0","fb":"`x^2 + 1 = 0` has no real roots.","_n":"184e8","_k":"4fed216a"},{"t":"1","fb":"Right. Only `x = 0`: `x^2 + 1 = 0` has no real roots.","_n":"194f8","_k":"7fd3d2fb"},{"t":"2","fb":"`x^2 + 1 = 0` has no real roots.","_n":"1a508","_k":"05dc5a71"},{"t":"3","fb":"`x^2 + 1 = 0` has no real roots.","_n":"1b598","_k":"3eeb8f93"}]},{"id":"q3","goal":2,"prompt":"`x(x - 1) = 6`. First step?","choices":[{"t":"Move 6 to the left","fb":"Right. Get 0 on one side: `x^2 - x - 6 = 0`.","_n":"1c5a8","_k":"9909c621"},{"t":"Set `x - 1 = 6`","fb":"Get 0 on one side: `x^2 - x - 6 = 0`.","_n":"1d578","_k":"ae33ee57"},{"t":"Divide by `x`","fb":"Get 0 on one side: `x^2 - x - 6 = 0`.","_n":"1e568","_k":"48047bcb"},{"t":"Set `x = 6`","fb":"Get 0 on one side: `x^2 - x - 6 = 0`.","_n":"1f558","_k":"44e0e293"}]},{"id":"q4","goal":6,"prompt":"In the box problem, why is `x = 9` rejected?","choices":[{"t":"9 is too big to cube","fb":"Every dimension must be positive.","_n":"1g548","_k":"d735b89f"},{"t":"9 isn’t a root","fb":"Every dimension must be positive.","_n":"1h538","_k":"be53b92f"},{"t":"Roots must be even","fb":"Every dimension must be positive.","_n":"1i528","_k":"6586380b"},{"t":"`10 - 2x` would be negative","fb":"Right. Every dimension must be positive.","_n":"1j518","_k":"b57e5410"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Equation ↔ real roots","summary":"Equation ↔ real roots","goal":[1,4,5],"instruction":"Match each equation with all of its real roots.","leftTitle":"Equation","rightTitle":"Real roots","left":[{"id":"l1","t":"`x^3 - 9x = 0`","why":"`x(x - 3)(x + 3) = 0`."},{"id":"l2","t":"`x^3 + 9x = 0`","why":"`x(x^2 + 9) = 0`, and `x^2 + 9` has no real roots."},{"id":"l3","t":"`x^4 - 10x^2 + 9 = 0`","why":"`(x^2 - 1)(x^2 - 9) = 0`."},{"id":"l4","t":"`(x - 2)^2(x + 1) = 0`","why":"2 is a root of order 2, but it’s one root."},{"id":"l5","t":"`x^4 - 16 = 0`","why":"`(x^2 - 4)(x^2 + 4) = 0`."},{"id":"l6","t":"`x^3 - 8 = 0`","why":"`(x - 2)(x^2 + 2x + 4) = 0`.","hints":["Difference of cubes.","`(x - 2)(x^2 + 2x + 4)`.","Only `x = 2` is real."]},{"id":"l7","t":"`x^3 - 3x^2 - 4x + 12 = 0`","why":"`x^2(x - 3) - 4(x - 3) = (x - 3)(x - 2)(x + 2)`."},{"id":"l8","t":"`2x^3 - x^2 - 2x + 1 = 0`","why":"`(2x - 1)(x - 1)(x + 1) = 0`.","hints":["Group.","`x^2(2x - 1) - 1(2x - 1)`.","`(2x - 1)(x - 1)(x + 1)`."]}],"right":[{"id":"r1","t":"−3, 0, 3"},{"id":"r2","t":"0"},{"id":"r3","t":"−3, −1, 1, 3"},{"id":"r4","t":"−1, 2"},{"id":"r5","t":"−2, 2"},{"id":"r6","t":"2"},{"id":"r7","t":"−2, 2, 3"},{"id":"r8","t":"−1, 1/2, 1"}],"_a":"HRoJCUZeFEJXGkkaCFYUCkRKVxpIRloDRAJHSldGGhIKDEcCRhYCEkoaCQ1GXhRCUxpJGghSFApESlMaSEZaB0QCR0pTRhoSCgBHAkYWDhIb","wrong":{"l2|r1":"`x^2 + 9` has no real roots.","l5|r3":"`x^4 - 16 = (x^2 - 4)(x^2 + 4)`: only ±2.","l6|r5":"`x^3 = 8` has one real root; `x^2 + 2x + 4` has none."},"wrongDefault":"Factor, then set each factor to 0."},{"id":"solve","type":"custom","title":"Solve it","summary":"Solve it","star":true,"goal":[2,3,4,5,6],"instruction":"Enter every real root. The order doesn’t matter.","how":"Type one root in each box (fractions like 1/3 and ± are fine). Press \u003cstrong>Add another root\u003c/strong> for more boxes, then press Check.","add":"Add another root","label":"Real roots","kLabel":"Values of `k`","items":[{"id":"s1","goal":2,"prompt":"`x^3 - 2x^2 - 15x = 0`","_a":"PRVWFFRIA20=","display":"−3, 0, 5","wrong":[{"missing":0,"fb":"Dividing by `x` assumes `x ≠ 0`. Move everything to one side and factor instead: `x = 0` is a root."}],"hints":["Common factor first.","`x(x^2 - 2x - 15) = 0`.","`x(x - 5)(x + 3) = 0`: `x = -3`, 0 or 5."]},{"id":"s2","goal":4,"prompt":"`x^4 - 17x^2 + 16 = 0`","_a":"PRVRFElVGgFKDDg=","display":"±1, ±4","wrong":[{"match":[1,16],"fb":"Those are `u`-values. `u` is `x^2`, so solve `x^2 = 1` and `x^2 = 16`."},{"match":[1,4],"fb":"`x^2 = 1` gives `x = 1` \u003cstrong>or\u003c/strong> `x = -1`, and `x^2 = 16` gives ±4."}],"hints":["Let `u = x^2`.","`(u - 1)(u - 16) = 0`, so `x^2 = 1` or `x^2 = 16`.","`x = ±1` or `x = ±4`."]},{"id":"s3","goal":2,"star":true,"prompt":"`x^3 - x^2 = 4x - 4`","_a":"PRVXFFVIBG0=","display":"1, ±2","general":"Move everything left, then group: `(x - 1)(x^2 - 4)`.","hints":["Get 0 on one side.","`x^3 - x^2 - 4x + 4 = x^2(x - 1) - 4(x - 1)`.","`(x - 1)(x - 2)(x + 2) = 0`: 1, ±2."]},{"id":"s4","goal":3,"star":true,"prompt":"`3x^3 + 2x^2 - 7x + 2 = 0`","_a":"PRVXFFRKBQNVC1YLV1cFA1ULVgtXVxoBOw==","display":"−2, 1/3, 1","wrong":[{"missing":0.3333333333333333,"fb":"The quotient `3x^2 + 5x - 2 = (3x - 1)(x + 2)`."}],"hints":["Test candidates ±1, ±2, ±1/3, ±2/3.","`P(1) = 3 + 2 - 7 + 2 = 0`, so `x - 1` is a factor, with quotient `3x^2 + 5x - 2`.","`(x - 1)(3x - 1)(x + 2) = 0`: −2, 1/3, 1."]},{"id":"s5","goal":4,"star":true,"prompt":"`(x^2 - 5)^2 = 16`","_a":"PRVWFElVGgFKCzg=","display":"±1, ±3","wrong":[{"match":[-3,3],"fb":"`x^2 - 5 = ±4` gives `x^2 = 9` \u003cstrong>or\u003c/strong> `x^2 = 1`."}],"hints":["Take the square root of both sides.","`x^2 - 5 = 4` or `x^2 - 5 = -4`.","`x^2 = 9` or 1: ±3, ±1."]},{"id":"s6","goal":5,"star":true,"kind":"k","prompt":"Find every `k` for which `x^3 - kx^2 + 4x = 0` has exactly two different real roots.","_a":"PRVRFFA5","display":"`k = 4` and `k = -4`","general":"`x(x^2 - kx + 4) = 0`. `x = 0` is one root; the quadratic must have a double root: `k^2 - 16 = 0`.","hints":["Factor out `x`.","The quadratic `x^2 - kx + 4` can’t have 0 as a root, so for exactly two different roots it must have a double root.","Discriminant `k^2 - 16 = 0`: `k = ±4`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Lucas","how":"","instruction":"Lucas made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Solve `x^3 = 9x`.","steps":["Divide both sides by `x`: `x^2 = 9`.","So `x = 3` or `x = -3`."],"_a":"Vg==","stepFb":["","Step 2 solves step 1 correctly. The mistake is earlier."],"fixes":[{"t":"`x^3 - 9x = 0`, so `x(x - 3)(x + 3) = 0`: `x = 0`, 3 or −3.","why":"Getting 0 on one side and factoring keeps every root, including `x = 0`.","_n":"1k508","_k":"86820064"},{"t":"Divide by 9: `x^3/9 = x`.","why":"That’s the same equation in a new form. It still needs 0 on one side and factoring.","_n":"1l5f8","_k":"175e9a5e"},{"t":"Take cube roots: `x = ∛(9x)`.","why":"`x` is still on both sides, so nothing is solved. Get 0 on one side and factor.","_n":"1m5e8","_k":"ef523cd0"},{"t":"Step 1 is correct.","why":"Dividing by `x` loses `x = 0`.","_n":"1n5d9","_k":"c725858d"}],"hints":["Is `x = 0` a solution of `x^3 = 9x`?","Yes: 0 = 0.","Factor instead: 0, ±3."]},{"id":"e2","goal":2,"task":"Solve `x(x - 4) = 5`.","steps":["`x = 5` or `x - 4 = 5`.","So `x = 5` or `x = 9`."],"_a":"Vg==","stepFb":["","Step 2 follows step 1. The mistake is earlier."],"fixes":[{"t":"Step 1 is correct.","why":"Check `x = 9`: 9 × 5 = 45 ≠ 5.","_n":"1o5e9","_k":"fa615689"},{"t":"`x = 0` or `x = 4`.","why":"That solves `x(x - 4) = 0`.","_n":"1p5b9","_k":"5c41f0b9"},{"t":"`x = 5` only.","why":"`x = -1` works too: `(-1)(-5) = 5`. Get 0 on one side and factor to find both.","_n":"1q5c9","_k":"32f6d905"},{"t":"`x^2 - 4x - 5 = 0`, so `(x - 5)(x + 1) = 0`: `x = 5` or −1.","why":"Only a product equal to \u003cstrong>0\u003c/strong> splits into cases, so get 0 on one side first.","_n":"1r619","_k":"cb57c7ce"}],"hints":["Is the right side 0?","Move the 5 over.","5 or −1."]},{"id":"e3","goal":4,"task":"Solve `x^4 - 5x^2 - 36 = 0`.","steps":["Let `u = x^2`: `u^2 - 5u - 36 = 0`.","`(u - 9)(u + 4) = 0`, so `u = 9` or `u = -4`.","So `x = ±3` or `x = ±2`."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.",""],"fixes":[{"t":"`x = 9` or −4.","why":"Those are the `u`-values. `u` is `x^2`, so `x^2 = 9` gives `x = ±3`.","_n":"1s629","_k":"26a4d5b3"},{"t":"`x = ±3` or `±4`.","why":"`u = -4` means `x^2 = -4`, not `x = ±4`. No real number squares to a negative.","_n":"1t5f9","_k":"a8ee16a9"},{"t":"Step 3 is correct.","why":"`(±2)^2 = 4`, not −4.","_n":"1u609","_k":"7fba48ef"},{"t":"`x^2 = 9` gives ±3; `x^2 = -4` has no real solutions. The real roots are ±3.","why":"No real number squares to a negative, so `u = -4` gives no `x`-intercepts.","_n":"1v559","_k":"8a536d6b"}],"hints":["Which numbers square to −4?","None.","±3 only."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the strategy path: the “divide by `x`” trap, or the quadratic-form equations?"},{"id":"j2","q":"In your own words, why must one side be 0 before you factor?"},{"id":"j3","q":"Explain to a friend how you decide which factoring move to try first."},{"id":"j4","q":"Which step still slows you down? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Solve `x(x - 3)(2x + 1) = 0`.","options":[{"t":"`x = 0`, 3 or −1","why":"`2x + 1 = 0` gives `x = -1/2`.","_n":"1w569","_k":"86817cda"},{"t":"`x = 0`, −3 or 1/2","why":"`x - 3 = 0` when `x = 3`, and `2x + 1 = 0` when `x = -1/2`.","_n":"1xe39","_k":"0615cf64"},{"t":"`x = 0`, 3 or `-1/2`","why":"Each factor can be 0: `x = 0`, `x - 3 = 0` gives 3, and `2x + 1 = 0` gives `-1/2`.","_n":"1ye29","_k":"7b01df93"},{"t":"`x = 3` or `-1/2`","why":"`x = 0` makes the first factor 0.","_n":"1ze59","_k":"af6370ac"}]},"b":{"prompt":"Solve `x(x + 4)(3x - 2) = 0`.","options":[{"t":"`x = 0`, 4 or `-2/3`","why":"`x + 4 = 0` when `x = -4`, and `3x - 2 = 0` when `x = 2/3`.","_n":"20e49","_k":"82098d2e"},{"t":"`x = -4` or 2/3","why":"`x = 0` makes the first factor 0.","_n":"21df9","_k":"10399a7a"},{"t":"`x = 0`, −4 or 2","why":"`3x - 2 = 0` gives 2/3.","_n":"22de9","_k":"e06688c2"},{"t":"`x = 0`, −4 or 2/3","why":"Each factor can be 0: `x = 0`, `x + 4 = 0` gives −4, and `3x - 2 = 0` gives 2/3.","_n":"23e19","_k":"8f874307"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Solve `x^4 - 20x^2 + 64 = 0`.","options":[{"t":"`x = 4` or 16","why":"Those are the values of `x^2`.","_n":"24e09","_k":"2bda3c26"},{"t":"`x = 2` or 4","why":"Each square has two roots.","_n":"25db9","_k":"6cb7b02a"},{"t":"`x = ±4` or `±16`","why":"`x^2 = 16` gives ±4; `x^2 = 4` gives ±2.","_n":"26da9","_k":"6dfe27b2"},{"t":"`x = ±2` or `±4`","why":"`(x^2 - 4)(x^2 - 16) = 0`.","_n":"27496","_k":"9fe3ae41"}]},"b":{"prompt":"Solve `x^4 - 26x^2 + 25 = 0`.","options":[{"t":"`x = 1` or 5","why":"Each square has two roots: `x^2 = 1` gives ±1 and `x^2 = 25` gives ±5.","_n":"284a6","_k":"97168e8d"},{"t":"`x = ±1` or `±5`","why":"`(x^2 - 1)(x^2 - 25) = 0`.","_n":"294b6","_k":"444f65cc"},{"t":"`x = 1` or 25","why":"Those are the values of `x^2`.","_n":"2a4c6","_k":"b3c9cb7a"},{"t":"`x = ±1` or `±25`","why":"`x^2 = 25` gives ±5.","_n":"2b4d6","_k":"d816df1e"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"How many `x`-intercepts does `y = x^4 - 3x^2 - 4` have?","options":[{"t":"0","why":"`x^2 = 4` gives ±2.","_n":"2c4e6","_k":"269bd916"},{"t":"2","why":"`(x^2 - 4)(x^2 + 1)`: only `x = ±2`.","_n":"2d4f6","_k":"800b2aad"},{"t":"3","why":"`x^2 = 4` gives two intercepts, ±2, not three.","_n":"2e506","_k":"ab0eb076"},{"t":"4","why":"`x^2 = -1` has no real roots.","_n":"2f516","_k":"f18a30ac"}]},"b":{"prompt":"How many `x`-intercepts does `y = x^4 + 3x^2 - 10` have?","options":[{"t":"0","why":"`x^2 = 2` gives `±√2`.","_n":"2g526","_k":"93782d42"},{"t":"1","why":"`x^2 = 2` gives two intercepts, `±√2`.","_n":"2hcf7","_k":"2e404488"},{"t":"2","why":"`(x^2 + 5)(x^2 - 2)`: only `x = ±√2`.","_n":"2ice7","_k":"3bad22a1"},{"t":"4","why":"`x^2 = -5` has no real roots.","_n":"2jcd7","_k":"a472543c"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Solve `x^3 + 3x^2 = 4x + 12`.","options":[{"t":"`x = -2` or 2","why":"Dividing `x^2(x + 3) = 4(x + 3)` by `(x + 3)` loses `x = -3`.","_n":"2kcc7","_k":"1c9621a6"},{"t":"`x = 3`, −2 or 2","why":"`x + 3 = 0` gives −3.","_n":"2ld37","_k":"97d09790"},{"t":"`x = -3` or 2","why":"`x^2 - 4 = 0` gives ±2.","_n":"2md27","_k":"a4babfa0"},{"t":"`x = -3`, −2 or 2","why":"`x^3 + 3x^2 - 4x - 12 = (x + 3)(x - 2)(x + 2) = 0`.","_n":"2nd17","_k":"aa9e734b"}]},"b":{"prompt":"Solve `x^3 - 2x^2 = 9x - 18`.","options":[{"t":"`x = -2`, −3 or 3","why":"`x - 2 = 0` gives 2, not −2.","_n":"2od07","_k":"617bc5d0"},{"t":"`x = 2`, −3 or 3","why":"`(x - 2)(x - 3)(x + 3) = 0`.","_n":"2pd77","_k":"cde9230b"},{"t":"`x = 2` or 3","why":"`x^2 - 9 = 0` gives ±3.","_n":"2qd67","_k":"05b85c38"},{"t":"`x = -3` or 3","why":"Dividing by `(x - 2)` loses `x = 2`.","_n":"2r60f","_k":"f2651f44"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Solve `2x^3 - 7x^2 + 7x - 2 = 0`.","options":[{"t":"`x = 1/2`, 1 or 2","why":"`P(1) = 0`; `2x^2 - 5x + 2 = (2x - 1)(x - 2)`.","_n":"2s5ff","_k":"0436b1ed"},{"t":"`x = 1` or 2","why":"The rational zero 1/2 is missing: integer candidates alone aren’t enough.","_n":"2t62f","_k":"947ae240"},{"t":"`x = 1`, 2 or `-1/2`","why":"Check `P(-1/2) = -1/4 - 7/4 - 7/2 - 2 ≠ 0`.","_n":"2u61f","_k":"6f57bc9e"},{"t":"`x = -1/2`, 1 or −2","why":"`(2x - 1)(x - 2)` gives +1/2 and +2.","_n":"2v64f","_k":"16b8d89c"}]},"b":{"prompt":"Solve `3x^3 - 10x^2 + 9x - 2 = 0`.","options":[{"t":"`x = 1/3`, 1 or 2","why":"`P(1) = 0`; `3x^2 - 7x + 2 = (3x - 1)(x - 2)`.","_n":"2w63f","_k":"e12c8bd1"},{"t":"`x = -1/3`, 1 or −2","why":"`(3x - 1)(x - 2)` gives +1/3 and +2.","_n":"2x66f","_k":"94348100"},{"t":"`x = 1` or 2","why":"The rational zero 1/3 is missing.","_n":"2y65f","_k":"2f124c96"},{"t":"`x = 1`, 2 or `-1/3`","why":"`P(-1/3) ≠ 0`.","_n":"2z68f","_k":"f6c442e4"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"For which value of `c` does `x^4 - 8x^2 + c = 0` have \u003cstrong>exactly 3\u003c/strong> real roots?","options":[{"t":"`c = 0`","why":"`u^2 - 8u = 0`: `u = 0` or 8, so `x = 0` or `±2√2`.","_n":"3067f","_k":"640ac495"},{"t":"`c = -9`","why":"`u = 9` or −1: 2 roots.","_n":"317af","_k":"1a2e95a6"},{"t":"`c = 16`","why":"`u = 4` twice: `x = ±2`, only 2 roots.","_n":"327bf","_k":"b09595ca"},{"t":"`c = 7`","why":"`u = 1` or 7: 4 roots.","_n":"3378f","_k":"7a96bb85"}]},"b":{"prompt":"For which value of `c` does `x^4 - 18x^2 + c = 0` have \u003cstrong>exactly 3\u003c/strong> real roots?","options":[{"t":"`c = -19`","why":"`u = 19` or −1: 2 roots.","_n":"3479f","_k":"9e79e727"},{"t":"`c = 0`","why":"`u = 0` or 18: `x = 0` or `±3√2`.","_n":"3576f","_k":"58a613ee"},{"t":"`c = 81`","why":"`u = 9` twice: 2 roots.","_n":"3677f","_k":"abd370af"},{"t":"`c = 17`","why":"`u = 1` or 17: 4 roots.","_n":"3774f","_k":"f90155a5"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why dividing both sides of `x^3 = 16x` by `x` is a mistake?","options":[{"t":"It changes the degree, which isn’t allowed.","why":"Degree changes aren’t the issue; losing a root is.","_n":"3875f","_k":"aff3eac7"},{"t":"It loses the root `x = 0`, because dividing by `x` assumes `x ≠ 0`. Instead, `x^3 - 16x = 0` gives `x(x - 4)(x + 4) = 0`.","why":"Dividing by `x` assumes `x ≠ 0`, but `x = 0` is a root: 0 = 0.","_n":"3972f","_k":"c7f85fc6"},{"t":"You can never divide an equation by a variable.","why":"You can when you know it isn’t 0; here it can be.","_n":"3a73f","_k":"75ca6b04"},{"t":"It isn’t a mistake: ±4 are all the roots.","why":"`x = 0` also works: 0 = 0.","_n":"3b74f","_k":"ba1b8894"}]},"b":{"prompt":"Which is the best explanation of why `x(x - 2) = 8` can’t be solved by writing `x = 8` or `x - 2 = 8`?","options":[{"t":"Because 8 isn’t a perfect square.","why":"Irrelevant: whether 8 is a perfect square doesn’t matter. The product has to be 0.","_n":"3c73f","_k":"691a4762"},{"t":"It can: `x = 8` or 10.","why":"Check: 8 × 6 = 48 ≠ 8.","_n":"3d72f","_k":"2aecfae0"},{"t":"The zero product property only works when the product is 0. Rearrange to `x^2 - 2x - 8 = 0`, so `(x - 4)(x + 2) = 0` and `x = 4` or −2.","why":"Only a product equal to \u003cstrong>0\u003c/strong> splits into cases.","_n":"3e71f","_k":"dfcb18bd"},{"t":"Because you must divide by `x` first.","why":"Dividing by `x` assumes `x ≠ 0` and can lose a root. Get 0 on one side and factor instead.","_n":"3f78f","_k":"c010db94"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"`x^3 - 3x + 2 = (x - 1)^2(x + 2)`. Which describes its roots and the graph of `y = x^3 - 3x + 2`?","options":[{"t":"Roots −1 and 2.","why":"`x - 1 = 0` when `x = 1`, and `x + 2 = 0` when `x = -2`.","_n":"3g77f","_k":"dfa5be7a"},{"t":"Roots 1 (order 2) and −2; the graph touches the `x`-axis at 1 and crosses at −2.","why":"`(x - 1)^2` gives one root of order 2, where the graph touches; `x + 2` gives −2, where it crosses.","_n":"3h76f","_k":"7382034b"},{"t":"Roots 1, 1 and −2, so three `x`-intercepts.","why":"`(x - 1)^2` gives one root, `x = 1`, of order 2: the graph touches there once.","_n":"3i75f","_k":"35837182"},{"t":"Root 1 only, because it’s a double root.","why":"`x + 2 = 0` gives −2.","_n":"3j6cf","_k":"1180ad74"}]},"b":{"prompt":"`x^3 + x^2 - 8x - 12 = (x - 3)(x + 2)^2`. Which describes its roots and the graph?","options":[{"t":"Roots −3 and 2.","why":"`x - 3 = 0` when `x = 3`, and `x + 2 = 0` when `x = -2`.","_n":"3k6bf","_k":"4606beb8"},{"t":"Root −2 only.","why":"`x - 3 = 0` gives 3.","_n":"3leee","_k":"5ade757c"},{"t":"Roots 3 and −2 (order 2); the graph crosses at 3 and touches at −2.","why":"`x - 3` gives 3, where the graph crosses; `(x + 2)^2` gives one root of order 2, where it touches.","_n":"3mefe","_k":"3cbe8989"},{"t":"Roots 3, −2 and −2, so three `x`-intercepts.","why":"`(x + 2)^2` gives one root, `x = -2`, of order 2: the graph touches there once.","_n":"3nf0e","_k":"c2e1fa2a"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"An open box is made from a 10 cm × 16 cm sheet by cutting squares of side `x` cm from the corners. For which `x` is the volume 144 cm³?","options":[{"t":"`x = 2` cm or `x = 9` cm","why":"A side length must make every dimension positive. `x = 9` makes `10 - 2x` negative.","_n":"3of1e","_k":"9e9ebcde"},{"t":"`x = 4` cm","why":"`V(4) = 4 × 2 × 8 = 64`.","_n":"3pf2e","_k":"3a95652e"},{"t":"`x = 9` cm","why":"A side length must make every dimension positive. `x = 9` makes `10 - 2x` negative.","_n":"3qf3e","_k":"f39942e2"},{"t":"`x = 2` cm","why":"`x^3 - 13x^2 + 40x - 36 = (x - 2)^2(x - 9) = 0`, and `x = 9` would make `10 - 2x` negative.","_n":"3rf4e","_k":"d0a676f5"}]},"b":{"prompt":"An open box is made from a 12 cm × 12 cm sheet by cutting squares of side `x` cm from the corners. For which `x` is the volume 128 cm³?","options":[{"t":"`x = 2` cm","why":"`x^3 - 12x^2 + 36x - 32 = (x - 2)^2(x - 8) = 0`, and `x = 8` would make `12 - 2x` negative.","_n":"3sf5e","_k":"e7be4701"},{"t":"`x = 2` cm or `x = 8` cm","why":"A side length must make every dimension positive. `x = 8` makes `12 - 2x` negative.","_n":"3te6e","_k":"d3167247"},{"t":"`x = 8` cm","why":"A side length must make every dimension positive. `x = 8` makes `12 - 2x` negative.","_n":"3ue7e","_k":"c2f6e7fb"},{"t":"`x = 4` cm","why":"`V(4) = 4 × 4 × 4 = 64`.","_n":"3vf8f","_k":"9ce25e67"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Three consecutive integers have a product of 210. What is the smallest?","options":[{"t":"5 or −7","why":"(−7)(−6)(−5) = −210, not 210.","_n":"3wf7f","_k":"02feeec5"},{"t":"7","why":"That’s the largest.","_n":"3xfaf","_k":"02f41cf4"},{"t":"6","why":"That’s the middle one.","_n":"3yf9f","_k":"d02d7add"},{"t":"5","why":"`n(n + 1)(n + 2) = 210` gives `(n
