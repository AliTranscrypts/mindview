.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 47: hero colours, envelope explorer, sign-and-shape board, work-backwards boxes, task stepper */
.pq-f,.pq-fl{color:var(--pen)}
.pq-g,.pq-gl{color:var(--f3)}
.pq-fl,.pq-gl{font:italic 700 1.15rem var(--font-math)}
.hero .hero-eq.md{font-size:clamp(2rem,4.4vw,3.1rem)}
canvas.plot.pq-hstrip{aspect-ratio:5/1;margin-bottom:6px}
#hero-cap .m{white-space:normal}
/* radio groups (from MHF4U 25/35) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button .m{font-size:1.1em}
.rg button:disabled{opacity:.45}
.pq-bchips button[aria-checked="true"]{outline:2px solid var(--p-b);outline-offset:1px}
/* explorer */
#ex-app .pg{grid-template-rows:auto 1fr}
.pq-top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:0 0 10px}
.pq-menus{display:grid;gap:8px;margin:0 0 14px}
.pq-note{margin:0;min-height:0}
.pq-note .linkbtn{font-size:inherit}
.pq-cap{font-size:clamp(1.25rem,3.2vw,1.8rem)}
.pq-gwrap{display:flex;gap:10px;align-items:stretch}
.pq-gmain{flex:1 1 auto;min-width:0}
.pq-barbox{flex:0 0 150px;width:150px;display:flex}
.pq-barbox[hidden]{display:none}
canvas.plot.pq-bars{aspect-ratio:auto;height:100%;min-height:220px;width:100%}
canvas.plot.pq-panel{aspect-ratio:3/1;margin-bottom:4px}
.pq-spring{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px;align-items:stretch}
.pq-spring[hidden]{display:none}
canvas.plot.pq-springc{aspect-ratio:auto;height:100%;min-height:160px}
.pq-sent{min-height:1.5em;font-weight:700;margin:8px 0 0}
.pq-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.pq-row .chip[aria-pressed="true"],.pq-row .btn[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.pq-probe{margin-top:6px}
.pq-flash{margin:10px 0 0;font-weight:700}
.pq-flash:empty,.pq-closer:empty{display:none}
.pq-closer{margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--p-b);background:var(--info-bg);border-radius:6px}
.pq-tally{margin:4px 0 0}
@media (max-width:560px){
  .pq-gwrap{flex-direction:column}
  .pq-barbox{flex:none;width:100%}
  canvas.plot.pq-bars{height:90px;min-height:0}
  .pq-spring{grid-template-columns:minmax(0,1fr)}
  canvas.plot.pq-springc{height:120px;min-height:0}
}
@media (max-width:360px){
  .pq-fchips,.pq-gchips{display:grid;grid-template-columns:1fr 1fr}
}
/* Part 3 board: graphs and chart scroll sideways together */
.pq3-eq{font-size:clamp(1.15rem,3vw,1.6rem)}
.pq3-step{margin:0 0 10px}
.pq3-scroll{overflow-x:auto;border:1.5px solid var(--rule);border-radius:8px;padding:6px 0;margin:0 0 12px}
.pq3-board{display:grid;grid-template-columns:52px minmax(0,1fr);min-width:820px;row-gap:4px}
.pq3-lab{position:sticky;left:0;z-index:3;background:var(--sheet);display:flex;align-items:center;justify-content:center;font:italic 700 1.05rem var(--font-math);text-align:center;padding:0 4px}
.pq3-lab[hidden],.pq3-row[hidden]{display:none}
.pq3-small{font:700 .72rem var(--font-ui);color:var(--ink-2)}
.pq3-cv canvas.plot.pq3-c{aspect-ratio:auto;height:110px;border-radius:4px}
.pq3-cv canvas.plot.pq3-res{height:170px}
.pq3-row{position:relative}
.pq3-ticks{height:48px}
.pq3-axis{position:absolute;left:0;right:0;top:24px;border-top:1.5px solid var(--ink)}
.pq3-tick{position:absolute;top:8px;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink-2);background:var(--sheet);padding:0;font:600 .72rem var(--font-ui);color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:1}
.pq3-tick.half{width:26px;height:26px;top:11px;border-style:dashed}
.pq3-tick.on{background:var(--hi);border:2.5px solid var(--ink);color:var(--hi-ink)}
.pq3-tick:disabled{opacity:1}
.pq3-head{height:30px}
.pq3-cv-lab{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap;font-size:1rem;background:var(--hi-soft);padding:0 .3em;border-radius:4px}
.pq3-signs{height:46px}
.pq3-vl{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ink-2);opacity:.6}
.pq3-pair{position:absolute;top:3px;transform:translateX(-50%);display:flex;gap:3px;border-radius:7px;padding:1px}
.pq3-pair button{width:32px;height:40px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;font:700 1.15rem var(--font-math);padding:0;color:var(--ink)}
.pq3-pair button[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.pq3-pair.bad,.pq3-mk.bad{outline:2.5px solid var(--red);background:var(--bad-bg)}
.pq3-marks{height:124px}
.pq3-mk{position:absolute;top:2px;transform:translateX(-50%);display:grid;gap:2px;width:92px;border-radius:7px;padding:1px}
.pq3-mk button{min-height:28px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;font:600 .78rem var(--font-ui);padding:0 .3em;color:var(--ink)}
.pq3-mk button[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);font-weight:700}
.pq3-msgs{margin:6px 0 0;padding-left:1.2em}
.pq3-msgs li{margin:0 0 6px}
@media (max-width:560px){ .pq3-pair button{width:30px} }
/* Practice 3: template boxes */
.pq-tpl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;font:400 1.3rem var(--font-math);margin:8px 0 4px}
.pq-tpl .m{white-space:nowrap}
.pq-boxl{display:inline-flex}
.pq-box{width:4.6rem;min-width:44px;padding:.3em .4em;text-align:center}
.pq-wbg{margin-top:12px}
/* task */
.pq-tkcap{font-size:clamp(1.2rem,3vw,1.6rem)}
.pq-step{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.pq-kout{font:600 1.4rem var(--font-math);min-width:2.2em;text-align:center}
.pq-tkrow{margin:0 0 10px}

nctions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"54aa54e3","content":{"id":"47-products-and-quotients-of-functions","kind":"topic","title":"Products and quotients of functions","topic":"Products and Quotients of Functions","readyTopic":"products and quotients of functions","hero":{"eq":"\u003cspan class=\"m\">(\u003ci class=\"pq-f\">f\u003c/i> · \u003ci class=\"pq-g\">g\u003c/i>)(\u003ci>x\u003c/i>) = \u003ci class=\"pq-f\">f\u003c/i>(\u003ci>x\u003c/i>) · \u003ci class=\"pq-g\">g\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>","eqLabel":"f times g, of x, equals f of x times g of x","eqSize":"md","headline":"Times a wave, a curve becomes a fence","text":"The \u003cstrong>product\u003c/strong> `f · g` and the \u003cstrong>quotient\u003c/strong> `f/g` are built one `x` at a time: `(f · g)(x) = f(x) × g(x)` and `(f/g)(x) = f(x) ÷ g(x)`. Multiply by a wave like `cos(πx)`, which never goes above 1 or below −1, and the result is trapped between `y = f(x)` and `y = -f(x)`. That boundary is the \u003cstrong>envelope\u003c/strong>, and it’s how a bouncing spring settles down: \u003cstrong>damped motion\u003c/strong>. Dividing has its own surprises. Wherever `g(x) = 0`, `f/g` is undefined, and its graph breaks at a \u003cstrong>vertical asymptote\u003c/strong> or a \u003cstrong>hole\u003c/strong>.","fig":{"html":"\u003ccanvas class=\"plot pq-hstrip\" id=\"pq-hero-g\" role=\"img\" aria-label=\"Strip graph of g of x equals cos of pi x, between negative 1 and 1\">\u003c/canvas>\u003ccanvas class=\"plot\" id=\"pq-hero-p\" role=\"img\" aria-label=\"Graph of f of x equals 16 times one half to the x, its mirror, and the product f times g trapped between them\">\u003c/canvas>"}},"goals":["I can find the value and the equation of `f · g` and `f/g` from equations, tables or graphs, without mixing up a product with a composition.","I can state the domain of `f · g` and `f/g`, leaving out every zero of `g`, even one that cancels.","I can find the zeros of a product or quotient, and its sign on each interval, from the zeros and signs of its factors, and show them on a sign chart.","I can predict what `f/g` does where `g(x) = 0` (a vertical asymptote or a hole), where `g(x) = ±1`, and where `g` is large.","I can explain why a wave times an envelope stays between `y = f(x)` and `y = -f(x)`, touching them where the wave is 1 or −1, and use a damped model to answer questions in context.","I can decide whether a product or quotient is even, odd or neither from its factors, and test a claim about increasing or decreasing behaviour with an example."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Restrictions and zeros","goal":2,"prompt":"What are the restrictions on `(x + 3)/(x^2 - 9)`?","options":[{"t":"`x ≠ 3` only","why":"Cancelling doesn’t make `x = -3` allowed. At `x = -3` the original denominator is `(-3)^2 - 9 = 0`, so the expression is 0/0 there: undefined.","_n":"08df","_k":"704aeff3"},{"t":"`x ≠ -3` and `x ≠ 3`","why":"`x^2 - 9 = (x - 3)(x + 3)` is 0 at both 3 and −3. Both are excluded, even though `(x + 3)` also appears on top.","_n":"18cf","_k":"f2cefa0a"},{"t":"`x ≠ -3` only","why":"−3 is a restriction, but because the \u003cstrong>denominator\u003c/strong> is 0 there, not the numerator. `x^2 - 9` is also 0 at `x = 3`.","_n":"28bf","_k":"5f999b07"},{"t":"`x ≠ 9`","why":"`x^2 - 9 = 0` means `x^2 = 9`, so `x = 3` or `x = -3`. At `x = 9` the denominator is 72.","_n":"392f","_k":"d090c241"}],"hints":["Restrictions come from the denominator. Where is `x^2 - 9` equal to 0?","Factor it: `x^2 - 9 = (x - 3)(x + 3)`. Set each factor to 0.","`x = 3` and `x = -3` both make the denominator 0. Cancelling the `(x + 3)` afterwards doesn’t change that: `x ≠ -3` and `x ≠ 3`."]},{"id":"w2","skill":"Restrictions and zeros","goal":4,"prompt":"For which value(s) of `x` is `(x - 4)/(x + 1)` equal to 0?","options":[{"t":"`x = -4`","why":"`x - 4 = 0` gives `x = 4`. At `x = -4` the fraction is `(-8)/(-3) = 8/3`.","_n":"491f","_k":"2dd758ad"},{"t":"`x = 4` and `x = -1`","why":"`x = 4` is right. But at `x = -1` the fraction has no value at all.","_n":"590f","_k":"ef1b8819"},{"t":"`x = -1`","why":"At `x = -1` the denominator is 0, so the expression is undefined there, not 0. You can’t divide by 0.","_n":"68ff","_k":"ac715997"},{"t":"`x = 4`","why":"A fraction is 0 when its numerator is 0 and its denominator isn’t. `x - 4 = 0` at `x = 4`, where the denominator is 5.","_n":"796f","_k":"3e622bf6"}],"hints":["When is a fraction equal to 0?","Only when its numerator is 0 and its denominator isn’t. Solve `x - 4 = 0`.","`x = 4`, and there the denominator is 4 + 1 = 5, not 0. So the only answer is `x = 4`."]},{"id":"w3","skill":"Signs","goal":3,"prompt":"For which `x` is `(x - 1)(x + 3) \u003c 0`?","options":[{"t":"`x \u003c -3` or `x > 1`","why":"Test `x = 2`: (1)(5) = 5, which is positive. These are the intervals where the product is \u003cstrong>greater\u003c/strong> than 0.","_n":"895f","_k":"c6b0476d"},{"t":"`-1 \u003c x \u003c 3`","why":"`x - 1 = 0` at `x =` \u003cstrong>1\u003c/strong>, and `x + 3 = 0` at `x =` \u003cstrong>−3\u003c/strong>.","_n":"922e","_k":"799be6d3"},{"t":"`-3 \u003c x \u003c 1`","why":"The zeros −3 and 1 split the number line into three intervals. Only in the middle do the factors have opposite signs: at `x = 0`, (−1)(3) = −3 \u003c 0.","_n":"a23e","_k":"15f7e2e1"},{"t":"`x \u003c 1`","why":"For `x \u003c -3` \u003cstrong>both\u003c/strong> factors are negative, so the product is positive: at `x = -4`, (−5)(−1) = 5.","_n":"b20e","_k":"7b9fb08a"}],"hints":["Find the zero of each factor. Together they split the number line into intervals.","The zeros are −3 and 1. Test one value in each interval: `x = -4`, 0 and 2.","At −4: (−5)(−1) = 5 > 0. At 0: (−1)(3) = −3 \u003c 0. At 2: (1)(5) = 5 > 0. Only `-3 \u003c x \u003c 1` works."]},{"id":"w4","skill":"Even and odd","goal":6,"prompt":"`f(x) = x^3 - 2x`. What is `f(-x)`, and what does it show?","options":[{"t":"`x^3 - 2x = f(x)`, so `f` is even","why":"`(-x)^3 = (-x)(-x)(-x) = -x^3`. An odd power keeps the sign.","_n":"c21e","_k":"9cbea766"},{"t":"`-x^3 + 2x = -f(x)`, so `f` is odd","why":"`(-x)^3 = -x^3` and `-2(-x) = 2x`. Every term changed sign, so `f(-x) = -f(x)`.","_n":"d1ee","_k":"832f5063"},{"t":"`-x^3 - 2x`, so `f` is neither","why":"Replace \u003cstrong>every\u003c/strong> `x`: `-2(-x) = +2x`. So `f(-x) = -x^3 + 2x`.","_n":"e1fe","_k":"6f340e6a"},{"t":"`-x^3 + 2x`, so `f` is even","why":"The algebra is right, but `-x^3 + 2x = -f(x)`, and `f(-x) = -f(x)` is the test for \u003cstrong>odd\u003c/strong>.","_n":"f1ce","_k":"7886c578"}],"hints":["Replace every `x` with `(-x)`.","`(-x)^3 = -x^3`, and `-2(-x) = +2x`.","`f(-x) = -x^3 + 2x = -(x^3 - 2x) = -f(x)`. That’s the test for odd."]},{"id":"w5","skill":"Waves and decay","goal":5,"prompt":"What is the period of `y = cos(πx)`?","options":[{"t":"π","why":"π is `k`, the number multiplying `x`. The period is `2π/π = 2`.","_n":"g1de","_k":"b2b44306"},{"t":"1/2","why":"The period is `2π/k`, not `k/(2π)`. Here `2π/π = 2`.","_n":"h2ae","_k":"1e6320d1"},{"t":"2","why":"The period is `2π/k = 2π/π = 2`. Check: `cos(π · 0) = 1`, and the next time it’s 1 again is `cos(π · 2) = cos 2π = 1`.","_n":"i2be","_k":"d1214240"},{"t":"2π","why":"2π is the period of `cos x`. Multiplying `x` by π squeezes the wave: `2π/π = 2`.","_n":"j1ce","_k":"be55b874"}],"hints":["For `y = cos(kx)`, the period is `2π/k`.","Here `k = π`.","`2π/π = 2`. The wave repeats every 2 units: `cos(πx) = 1` at `x = 0`, 2, 4, …"]},{"id":"w6","skill":"Waves and decay","goal":5,"prompt":"`y = 16(1/2)^x`. What is `y` when `x = 3`?","options":[{"t":"1/8","why":"`(1/2)^3 = 1/8` is right, but `y = 16 × 1/8`.","_n":"k1be","_k":"82c71460"},{"t":"2","why":"`(1/2)^3 = 1/8`, and `16 × 1/8 = 2`. Each step of 1 in `x` halves `y`: 16, 8, 4, 2.","_n":"l1ae","_k":"4a67ac7f"},{"t":"24","why":"`16 × (3 × 1/2) = 24`. The exponent means multiplying 1/2 by itself 3 times.","_n":"m19e","_k":"b35a3e05"},{"t":"512","why":"That’s `(16 × 1/2)^3 = 8^3`. The exponent belongs to the 1/2 only.","_n":"n20e","_k":"ee91f71e"}],"hints":["Do the power first: what is `(1/2)^3`?","`(1/2)^3 = 1/8`. Now multiply by 16.","`16 × 1/8 = 2`."]}],"refreshers":{"Restrictions and zeros":"A fraction is undefined where its \u003cstrong>denominator\u003c/strong> is 0, and it equals 0 where its \u003cstrong>numerator\u003c/strong> is 0 and its denominator isn’t. Find the restrictions from the original denominator, before cancelling anything. Example: in `(x + 3)/(x^2 - 9)`, `x^2 - 9 = (x - 3)(x + 3)`, so `x ≠ 3` and `x ≠ -3`, even though the expression simplifies to `1/(x - 3)`.","Signs":"A product is negative when it has an odd number of negative factors and positive when it has an even number. To find where `(x - 1)(x + 3) \u003c 0`, mark the zeros −3 and 1, test one value in each interval, and keep the intervals where the result is negative: `-3 \u003c x \u003c 1`.","Even and odd":"Replace `x` with `-x`. If `f(-x) = f(x)`, `f` is even: its graph is its own mirror image in the `y`-axis. If `f(-x) = -f(x)`, `f` is odd: its graph matches itself after a half turn about the origin. Example: `f(x) = x^3 - 2x` gives `f(-x) = -x^3 + 2x = -f(x)`, so `f` is odd. `sin x` is odd and `cos x` is even.","Waves and decay":"`y = cos(kx)` has period `2π/k`, so `cos(πx)` repeats every 2. It’s 1 at `x = 0`, 2, 4, …, −1 at `x = 1`, 3, 5, …, and 0 halfway between. `y = a(b)^x` with `0 \u003c b \u003c 1` decays: `16(1/2)^x` is 16, 8, 4, 2, 1 at `x = 0`, 1, 2, 3, 4. Do the power before multiplying by `a`."}}},"explore":{"heading":"Envelope explorer: multiply and divide, one height at a time","intro":"Pick two functions and slide the probe. At every `x`, the panel multiplies (or divides) the two heights. Press \u003cstrong>Trace\u003c/strong> to build the whole graph, then switch to \u003cstrong>Spring\u003c/strong> to watch a product move.","predictions":[{"id":"p1","start":{"mode":"mul","view":"stacked","f":"4mx2","g":"cos","x":-3},"prompt":"Where will `f · g = (4 - x^2)cos(πx)` be 0 between `x = -3` and `x = 3`?","options":[{"t":"Only at `x = -2` and `x = 2`","_n":"o1fe","_k":"aa31da08"},{"t":"At `x = ±2` and at `x = ±1/2`, `±3/2` and `±5/2`","_n":"p1ee","_k":"4a1e2c1f"},{"t":"Only where the graphs of `f` and `g` cross each other","_n":"q1de","_k":"32055b20"},{"t":"Only at `x = ±1/2`, `±3/2` and `±5/2`","_n":"r24e","_k":"761791a6"}],"explain":"0 times anything is 0, so a product is 0 wherever \u003cstrong>either\u003c/strong> factor is 0. `f = 4 - x^2` is 0 at ±2, and `g = cos(πx)` is 0 halfway between whole numbers, so `f · g` has 8 zeros in this window. Where the graphs of `f` and `g` cross, `f(x) = g(x)`. That makes the \u003cstrong>difference\u003c/strong> `f - g` zero, not the product."},{"id":"p2","start":{"mode":"spring","a":16,"b":"1/2","t":0,"fences":false},"prompt":"The mass is pulled up 16 cm and released: `y = 16(1/2)^t cos(πt)`. What will it do?","options":[{"t":"It swings through rest, reaching half as far each second: 8 cm below rest at `t = 1`, 4 cm above at `t = 2`, 2 cm below at `t = 3`","_n":"s23e","_k":"f33cf943"},{"t":"It bobs up and down by 1 cm around the curve `y = 16(1/2)^t`, sinking slowly toward rest","_n":"t96e","_k":"6356f47b"},{"t":"It drops to rest at `t = 1/2` and stays there","_n":"u97e","_k":"b71b266f"},{"t":"It keeps swinging 16 cm above and below rest; the 1/2 only makes each swing slower","_n":"v98e","_k":"0062a75b"}],"explain":"`cos(πt)` stays between −1 and 1, so multiplying by it keeps `y` between `16(1/2)^t` and `-16(1/2)^t`. At whole seconds `cos(πt) = ±1`, so the mass touches a fence: `y(1) = 8 × (-1) = -8`, `y(2) = 4 × 1 = 4`, `y(3) = 2 × (-1) = -2`. At `t = 1/2`, 3/2, … `cos(πt) = 0`, so the mass passes through rest without stopping. \u003cstrong>Adding\u003c/strong> the wave would make it bob around the curve; \u003cstrong>multiplying\u003c/strong> turns the curve into a fence. The base 1/2 sets how fast the swings shrink, not how long each one takes: the period stays 2 s."},{"id":"p3","start":{"mode":"div","view":"overlay","f":"xm2","g":"x2m4","x":1},"prompt":"`g(x) = x^2 - 4` is 0 at `x = -2` and at `x = 2`. What will the graph of `f/g = (x - 2)/(x^2 - 4)` do at those two values?","options":[{"t":"A hole at `x = -2` and a vertical asymptote at `x = 2`","_n":"w99e","_k":"767f4817"},{"t":"Vertical asymptotes at both","_n":"x9ae","_k":"2c546cd8"},{"t":"It crosses the `x`-axis at both","_n":"y9be","_k":"0a2c8a7a"},{"t":"A vertical asymptote at `x = -2` and a hole at `x = 2`","_n":"z9ce","_k":"97d72a5f"}],"explain":"At `x = 2` \u003cstrong>both\u003c/strong> `f` and `g` are 0. They share the factor `x - 2`, which cancels: `f/g = 1/(x + 2)` for `x ≠ 2`. So near 2 the graph heads for `1/(2 + 2) = 1/4`, and there’s a hole at (2, 1/4). At `x = -2` only `g` is 0 (`f(-2) = -4`), so `f/g` is −4 divided by a tiny number: a vertical asymptote. A zero of `g` is never a zero of `f/g`, because you can’t divide by 0."},{"id":"p4","start":{"mode":"mul","view":"overlay","f":"x","g":"sin","x":0,"fences":true},"prompt":"`f(x) = x` and `g(x) = sin(πx)` are both odd. What symmetry will `f · g = x sin(πx)` have?","options":[{"t":"Odd: it will match itself after a half turn about the origin","_n":"109de","_k":"1c80c5b0"},{"t":"Neither: two odd functions multiply to a function with no symmetry","_n":"119ee","_k":"f8e9d05c"},{"t":"Both even and odd","_n":"129fe","_k":"935d225c"},{"t":"Even: it will be its own mirror image in the `y`-axis","_n":"13a0f","_k":"43deaf5d"}],"explain":"`(f · g)(-x) = f(-x) · g(-x) = (-f(x))(-g(x)) = f(x)g(x)`. Each odd factor flips the sign, and the two flips cancel, just as (−3)(−5) = 15. So odd · odd is even, unlike odd × odd for whole numbers. Only the zero function is both even and odd."}],"chalIntro":"Set the explorer (or press \u003cstrong>Set up this challenge\u003c/strong>), then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":5,"prompt":"(Spring) Set `a` and `b` so that at `t` = 4 s the mass is exactly 1 cm above rest.","why":"`y(4) = 16 × (1/2)^4 × cos 4π = 16 × 1/16 × 1 = 1` cm.","hints":["At `t = 4`, `cos(4π) = 1`, so `y(4) = a · b^4`.","Try `b = 1/2`: `(1/2)^4 = 1/16`. What must `a` be?","`a × 1/16 = 1` gives `a = 16`. Set `a = 16` and `b = 1/2`, then slide `t` to 4 to see it."]},{"id":"tc2","goal":4,"prompt":"(Divide) Choose `g` so that the graph of `f/g` has a hole, then put the probe on a hole.","why":"`f/g = -1` everywhere except `x = ±2`: a flat line with two holes, at (−2, −1) and (2, −1).","hints":["A hole needs `f` and `g` to be 0 at the same `x`. Where is `4 - x^2 = 0`?","`f` is 0 at `x = 2` and `x = -2`. Which `g` in the menu is 0 there too?","`g(x) = x^2 - 4`. Then `f/g = (4 - x^2)/(x^2 - 4) = -1` for `x ≠ ±2`. Put the probe at `x = 2` or `x = -2`."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"(Multiply) Choose `f` and `g` so that the graph of `f · g` \u003cstrong>touches\u003c/strong> the `x`-axis at `x = 2` \u003cstrong>without crossing it\u003c/strong>. Then put the probe at `x = 2`.","why":"Both factors change sign at `x = 2`, and the two sign changes cancel. You’ll use this in Part 3.","hints":["For `f · g` to be 0 at 2, at least one factor must be 0 there. To touch without crossing, `f · g` must have the same sign just left and just right of 2.","If only one factor changes sign at 2, the product changes sign. What if \u003cstrong>both\u003c/strong> factors change sign at 2?","Choose an `f` that is 0 at 2 (`x - 2` or `4 - x^2`) and a `g` that is 0 at 2 (`sin(πx)` or `x^2 - 4`). For `x - 2` and `sin(πx)`: just left of 2 both are negative, and just right both are positive, so the product is positive on both sides."]}]},"part3":{"slug":"signs","name":"Signs","heading":"Sign and shape: build `f · g` and `f/g` from their factors","intro":"Mark where each factor is 0, read each factor’s sign from its graph, then decide the sign and shape of the result. When your chart is right, the graph draws itself across it.","blocks":[{"title":"What the rules say","html":"\u003cp>\u003cstrong>Sign.\u003c/strong> Count the negative factors: an even number gives a positive result, an odd number a negative one. Division follows the same rule as multiplication.\u003c/p>\u003cp>\u003cstrong>Zeros.\u003c/strong> `f · g = 0` wherever `f = 0` or `g = 0`. `f/g = 0` wherever `f = 0` and `g ≠ 0`.\u003c/p>\u003cp>\u003cstrong>Breaks in `f/g`.\u003c/strong> Where `g = 0`, `f/g` is undefined. If `f ≠ 0` there, the graph has a vertical asymptote. If `f = 0` there too and the common factor cancels, it has a hole.\u003c/p>\u003cp>\u003cstrong>Sign changes.\u003c/strong> Where exactly one factor changes sign, the result changes sign. Where both change sign at the same `x`, the two changes cancel: a product touches the axis, and a quotient has a hole with the same sign on both sides.\u003c/p>"}],"cases":[{"id":"A","op":"mul","f":"`f(x) = x^2 - 1`","g":"`g(x) = sin(πx)`","res":"`f · g`","alg":"`(x^2 - 1) sin(πx) = (x - 1)(x + 1) sin(πx)`. On (0, 1): `x - 1 \u003c 0`, `x + 1 > 0` and `sin(πx) > 0`. One negative factor, so the product is negative. At `x = 1` both `x - 1` and `sin(πx)` change sign, so the product keeps its sign. The product is odd (even × odd), which is why the signs on the left are the opposite of the signs on the right."},{"id":"B","op":"div","f":"`f(x) = x^2 + x - 2`","g":"`g(x) = x^2 - 4x + 3`","res":"`f/g`","alg":"`(x^2 + x - 2)/(x^2 - 4x + 3) = ((x + 2)(x - 1))/((x - 1)(x - 3)) = (x + 2)/(x - 3)` for `x ≠ 1`. Domain `{x ∈ ℝ | x ≠ 1, x ≠ 3}`. Hole at `(1, (1 + 2)/(1 - 3)) = (1, -3/2)`. Vertical asymptote `x = 3`. Zero at `x = -2`."},{"id":"C","op":"div","f":"`f(x) = sin(πx)`","g":"`g(x) = cos(πx)`","res":"`f/g`","alg":"`sin(πx)/cos(πx) = tan(πx)` (module 31). It’s undefined where `cos(πx) = 0`, at `x = 1/2` and 3/2. There `sin(πx) = ±1`, so those are vertical asymptotes. It’s 0 at `x = 1`, where `sin(πx) = 0` and `cos(πx) = -1`."}],"quickCheck":{"title":"Sign and shape","summary":"Sign and shape quick check","items":[{"id":"q1","goal":3,"prompt":"`f(x) = x - 3` and `g(x) = x + 1`. Where is `(f · g)(x) \u003c 0`?","choices":[{"t":"`(-1, 3)`","fb":"Right. Between −1 and 3 the factors have opposite signs: at `x = 0`, (−3)(1) = −3.","_n":"149ff","_k":"82bf5c64"},{"t":"`(-∞, -1) ∪ (3, ∞)`","fb":"There both factors have the same sign, so the product is positive: at `x = 4`, (1)(5) = 5.","_n":"15a2f","_k":"a58e7982"},{"t":"`(-3, 1)`","fb":"Check the zeros: `x - 3 = 0` at \u003cstrong>3\u003c/strong>, and `x + 1 = 0` at \u003cstrong>−1\u003c/strong>.","_n":"16a1f","_k":"47b0e032"}]},{"id":"q2","goal":3,"prompt":"`f(x) = 2^x`, which is always positive, and `g(x) = sin(πx)`. Where between `x = 0` and `x = 4` is `f · g` negative?","choices":[{"t":"`1 \u003c x \u003c 2` and `3 \u003c x \u003c 4`","fb":"Right. A positive factor never changes the sign, so `f · g` has the sign of `sin(πx)`, which is negative on (1, 2) and (3, 4).","_n":"179cf","_k":"18725d36"},{"t":"`0 \u003c x \u003c 1` and `2 \u003c x \u003c 3`","fb":"There `sin(πx)` is positive: `sin(π/2) = 1`.","_n":"189bf","_k":"900bb12f"},{"t":"nowhere, because `2^x` is always positive","fb":"`2^x` is positive, but `sin(πx)` isn’t always: positive × negative = negative.","_n":"199ef","_k":"49732755"}]},{"id":"q3","goal":4,"prompt":"`f(x) = x^2 - 9` and `g(x) = x + 3`. What does the graph of `f/g` have at `x = -3`?","choices":[{"t":"a hole at (−3, −6)","fb":"Right. `f(-3) = 0` too, and `(x^2 - 9)/(x + 3) = x - 3` for `x ≠ -3`. At −3 that’s −6, so the hole is at (−3, −6).","_n":"1a9df","_k":"2a3a5483"},{"t":"a vertical asymptote `x = -3`","fb":"`f` is 0 at −3 as well, and the common factor `x + 3` cancels: a hole, not an asymptote.","_n":"1ba8f","_k":"197161db"},{"t":"a zero (it crosses the `x`-axis)","fb":"`g(-3) = 0`, so `f/g` has no value at `x = -3`.","_n":"1ca7f","_k":"148374e1"}]},{"id":"q4","goal":4,"prompt":"`f(x) = x + 2` and `g(x) = (x - 1)^2`. What does `f/g` do on each side of `x = 1`?","choices":[{"t":"`→ ∞` on both sides","fb":"Right. Near 1, `f` is close to 3, which is positive, and `(x - 1)^2` is a tiny \u003cstrong>positive\u003c/strong> number on both sides. So `f/g → ∞` on both sides. A squared factor doesn’t change sign.","_n":"1d9af","_k":"edbf5f57"},{"t":"`→ -∞` on the left and `→ ∞` on the right","fb":"`(x - 1)^2` is never negative, so `g` doesn’t change sign at 1. Only a factor that changes sign can flip the result.","_n":"1e9bf","_k":"2767349a"},{"t":"it has a hole at `x = 1`","fb":"`f(1) = 3`, not 0, so nothing cancels. It’s a vertical asymptote.","_n":"1f98f","_k":"fdd5416f"}]}]}},"practice":{"activities":[{"id":"parity","type":"sorter","title":"Even, odd or neither?","summary":"Even, odd or neither?","goal":6,"noun":"function","instruction":"Sort each product or quotient by its symmetry. The angles are in radians; `sin x` is odd and `cos x` is even (module 31).","how":"Tap a function, then tap the box it belongs in.","boxes":[{"id":"even","label":"Even","sub":"`h(-x) = h(x)`"},{"id":"odd","label":"Odd","sub":"`h(-x) = -h(x)`"},{"id":"neither","label":"Neither"}],"items":[{"id":"s1","t":"`x sin x`","_a":"F1EXBFsW","why":"`x` and `sin x` are both odd: `(-x) sin(-x) = (-x)(-sin x) = x sin x`.","hints":["Is `x` even or odd? Is `sin x`?","Both are odd. Replace `x` with `-x` in both factors.","`(-x) sin(-x) = (-x)(-sin x) = x sin x`. The two signs cancel, so it’s \u003cstrong>Even\u003c/strong>."],"wrong":{"odd":"Two odd factors: each flips the sign when `x` becomes `-x`, and two flips cancel, like (−2)(−3) = 6. Test `x · x = x^2`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s2","t":"`x^2 sin x`","_a":"F1sFBRc=","why":"`x^2` is even and `sin x` is odd: `(-x)^2 sin(-x) = x^2(-sin x) = -x^2 sin x`.","hints":["Is `x^2` even or odd? Is `sin x`?","`x^2` is even and `sin x` is odd. Replace `x` with `-x` in both factors.","`(-x)^2 sin(-x) = x^2(-sin x) = -x^2 sin x`. Only one sign flips, so it’s \u003cstrong>Odd\u003c/strong>."],"wrong":{"even":"Only one factor flips the sign, so the result flips too: `(-f)(g) = -fg`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s3","t":"`(sin x)/x`","_a":"F1EXBFsW","why":"Odd ÷ odd: `sin(-x)/(-x) = (-sin x)/(-x) = (sin x)/x`. Its domain, `x ≠ 0`, is symmetric too.","hints":["Is `sin x` even or odd? Is `x`?","Both are odd. Replace `x` with `-x` in both the top and the bottom.","`sin(-x)/(-x) = (-sin x)/(-x) = (sin x)/x`. The two signs cancel, so it’s \u003cstrong>Even\u003c/strong>."],"wrong":{"odd":"Two odd factors: each flips the sign when `x` becomes `-x`, and two flips cancel, like (−2)(−3) = 6. Test `x · x = x^2`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s4","t":"`(cos x)/x`","_a":"F1sFBRc=","why":"Even ÷ odd: `cos(-x)/(-x) = -(cos x)/x`.","hints":["Is `cos x` even or odd? Is `x`?","`cos x` is even and `x` is odd. Replace `x` with `-x` in both the top and the bottom.","`cos(-x)/(-x) = (cos x)/(-x) = -(cos x)/x`. Only the bottom flips, so it’s \u003cstrong>Odd\u003c/strong>."],"wrong":{"even":"Only one factor flips the sign, so the result flips too: `(-f)(g) = -fg`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s5","t":"`(x - 1) sin x`","_a":"F1oECEFcAEEX","why":"`x - 1` is neither even nor odd. At `x = π/2` the product is `π/2 - 1`, about 0.57; at `x = -π/2` it’s `π/2 + 1`, about 2.57. Not equal, and not opposite.","hints":["Is `x - 1` even, odd or neither?","`-x - 1` is neither `x - 1` nor `-(x - 1)`. So test the product with numbers: try `x = π/2` and `x = -π/2`.","At `π/2` the product is `π/2 - 1`, about 0.57; at `-π/2` it’s `π/2 + 1`, about 2.57. They aren’t equal and aren’t opposite, so it’s \u003cstrong>Neither\u003c/strong>."],"wrong":{"even":"`x - 1` is neither even nor odd, so it doesn’t pass a symmetry on to the product. Check with numbers: at `x = π/2` the product is `π/2 - 1`, about 0.57; at `x = -π/2` it’s `π/2 + 1`, about 2.57.","odd":"`x - 1` is neither even nor odd, so it doesn’t pass a symmetry on to the product. Check with numbers: at `x = π/2` the product is `π/2 - 1`, about 0.57; at `x = -π/2` it’s `π/2 + 1`, about 2.57."}},{"id":"s6","t":"`sin x cos x`","_a":"F1sFBRc=","why":"Odd × even: `sin(-x) cos(-x) = (-sin x)(cos x) = -sin x cos x`.","hints":["Is `sin x` even or odd? Is `cos x`?","`sin x` is odd and `cos x` is even. Replace `x` with `-x` in both factors.","`sin(-x) cos(-x) = (-sin x)(cos x) = -sin x cos x`. Only one sign flips, so it’s \u003cstrong>Odd\u003c/strong>."],"wrong":{"even":"Only one factor flips the sign, so the result flips too: `(-f)(g) = -fg`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s7","t":"`x/(x^2 + 1)`","_a":"F1sFBRc=","why":"Odd ÷ even: `(-x)/((-x)^2 + 1) = -x/(x^2 + 1)`.","hints":["Is `x` even or odd? Is `x^2 + 1`?","`x` is odd and `x^2 + 1` is even. Replace `x` with `-x` in both the top and the bottom.","`(-x)/((-x)^2 + 1) = -x/(x^2 + 1)`. Only the top flips, so it’s \u003cstrong>Odd\u003c/strong>."],"wrong":{"even":"Only one factor flips the sign, so the result flips too: `(-f)(g) = -fg`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s8","t":"`(x^2 + 1)/(x^2 - 4)`","_a":"F1EXBFsW","why":"Even ÷ even is even, and the domain, `x ≠ ±2`, is symmetric.","hints":["Is `x^2 + 1` even or odd? Is `x^2 - 4`?","Both are even. Replace `x` with `-x` in both the top and the bottom.","`((-x)^2 + 1)/((-x)^2 - 4) = (x^2 + 1)/(x^2 - 4)`. Nothing flips, and the domain, `x ≠ ±2`, is symmetric, so it’s \u003cstrong>Even\u003c/strong>."],"wrong":{"odd":"Neither factor flips the sign, so the result doesn’t either: it’s even.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}},{"id":"s9","t":"`2^x cos x`","_a":"F1oECEFcAEEX","why":"`2^x` is neither even nor odd. At `x = π` and `x = -π`, `cos x = -1` both times, but `2^π` is much bigger than `2^{-π}`: the two values are neither equal nor opposite.","hints":["Is `2^x` even, odd or neither?","`2^{-x} = 1/2^x`, which is neither `2^x` nor `-2^x`. So test the product with numbers: try `x = π` and `x = -π`.","At ±π, `cos x = -1`, so the values are `-2^π` and `-2^{-π}`. They aren’t equal and aren’t opposite, so it’s \u003cstrong>Neither\u003c/strong>."],"wrong":{"even":"`2^x` is neither even nor odd, so it doesn’t pass a symmetry on to the product. Check with numbers: at `x = π` and `x = -π`, `cos x = -1` both times, but `2^π` is much bigger than `2^{-π}`, so the two values are neither equal nor opposite.","odd":"`2^x` is neither even nor odd, so it doesn’t pass a symmetry on to the product. Check with numbers: at `x = π` and `x = -π`, `cos x = -1` both times, but `2^π` is much bigger than `2^{-π}`, so the two values are neither equal nor opposite."}},{"id":"s10","t":"`sin^2 x`","_a":"F1EXBFsW","why":"`sin^2 x = sin x · sin x`: odd × odd is even. `sin^2(-x) = (-sin x)^2 = sin^2 x`.","hints":["Write `sin^2 x` as a product. Is each factor even or odd?","`sin^2 x = sin x · sin x`: two odd factors. Replace `x` with `-x`.","`sin^2(-x) = (-sin x)^2 = sin^2 x`. The two signs cancel, so it’s \u003cstrong>Even\u003c/strong>."],"wrong":{"odd":"Two odd factors: each flips the sign when `x` becomes `-x`, and two flips cancel, like (−2)(−3) = 6. Test `x · x = x^2`.","neither":"Both factors have a symmetry, so the result does too. Decide each factor’s type first."}}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Diego","how":"","instruction":"Diego made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"`f(x) = x^2 - 9` and `g(x) = x^2 - x - 6`. State the domain of `f/g`.","steps":["`(f/g)(x) = (x^2 - 9)/(x^2 - x - 6)`.","`= ((x - 3)(x + 3))/((x - 3)(x + 2))`.","`= (x + 3)/(x + 2)`, after cancelling `x - 3`.","`x + 2` is 0 only at `x = -2`, so the domain is `{x ∈ ℝ | x ≠ -2}`.","So the graph of `f/g` has a vertical asymptote at `x = -2` and no other breaks."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: both factorings expand back to the originals.","Cancelling is fine, as long as you remember that `x ≠ 3`. The mistake is later.","","Step 5 follows from step 4. The asymptote at `x = -2` is right, but the mistake in step 4 hides another break."],"fixes":[{"t":"Read the domain from the original denominator: `x^2 - x - 6 = 0` at `x = 3` and `x = -2`, so the domain is `{x ∈ ℝ | x ≠ -2, x ≠ 3}`.","why":"At `x = 3` the original quotient is 0/0, which is undefined. Cancelling hides that, so the graph has a hole at (3, 6/5).","_n":"1g99f","_k":"ce4900e0"},{"t":"Exclude every zero of `f` and of `g`: `{x ∈ ℝ | x ≠ -3, x ≠ -2, x ≠ 3}`.","why":"Zeros of `f` don’t break `f/g`: `(f/g)(-3) = 0/(9 + 3 - 6) = 0`, a perfectly good value.","_n":"1h9ef","_k":"d6f725fc"},{"t":"Also exclude the zero of the new numerator: the domain is `{x ∈ ℝ | x ≠ -3, x ≠ -2}`.","why":"`x = -3` makes the numerator 0, so `f/g = 0` there: a zero, not a restriction. And `x = 3` is still missing.","_n":"1i9ff","_k":"586c0e0a"},{"t":"Step 4 is correct: cancelling `x - 3` removes the restriction at `x = 3`.","why":"Cancelling changes how the formula looks, not where `f/g` is defined. `g(3) = 0`, so `f/g` is undefined at `x = 3`.","_n":"1j9cf","_k":"9badca54"}],"hints":["Is the domain of `f/g` decided before or after you cancel?","Where is the original denominator, `x^2 - x - 6`, equal to 0?","Step 4 is wrong. `x^2 - x - 6 = (x - 3)(x + 2)` is 0 at `x = 3` and `x = -2`, so the domain is `{x ∈ ℝ | x ≠ -2, x ≠ 3}`, with a hole at (3, 6/5)."]},{"id":"e2","goal":1,"task":"`f(x) = 2x - 1` and `g(x) = x^2 + 1`. Find `(f · g)(-1)` and `(f/g)(-1)`.","steps":["`f(-1) = 2(-1) - 1 = -3`.","`g(-1) = (-1)^2 + 1 = 2`.","`(f · g)(-1) = f(g(-1)) = f(2) = 3`.","`(f/g)(-1) = f(-1)/g(-1) = -3/2`."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: `(-1)^2 = 1`.","","Step 4 is correct: that’s exactly how a quotient works. The mistake is earlier."],"fixes":[{"t":"`(f · g)(-1) = g(f(-1)) = g(-3) = 10`.","why":"That’s a composition the other way round. `f · g` multiplies `f(-1)` by `g(-1)`.","_n":"1k9df","_k":"68df2f36"},{"t":"`(f · g)(-1) = f(-1) × g(-1) = (-3)(2) = -6`.","why":"The dot means multiply the two outputs at the same `x`, just as step 4 divides them.","_n":"1la2f","_k":"7355d650"},{"t":"`(f · g)(-1) = f(-1) + g(-1) = -1`.","why":"That’s `(f + g)(-1)`, from module 46. The dot means multiply.","_n":"1ma3f","_k":"b91eb117"},{"t":"Step 3 is correct: `f · g` means put `g(x)` into `f`.","why":"Putting `g` into `f` is `f(g(x))`, a composition (module 48). `(f · g)(x) = f(x) · g(x)`.","_n":"1nb4f","_k":"819c37be"}],"hints":["What does the dot in `f · g` mean?","`(f · g)(-1) = f(-1) × g(-1)`. You already have both values.","Step 3 is wrong: `(f · g)(-1) = (-3)(2) = -6`."]},{"id":"e3","goal":5,"task":"A spring’s height above rest is `y(t) = 12(1/2)^t cos(πt)` cm. Where is the mass at `t` = 3 s?","steps":["The fence at `t = 3` is `12(1/2)^3 = 12/8 = 1.5` cm.","The wave at `t = 3` is `cos(3π) = -1`.","So `y(3) = 1.5 + (-1) = 0.5`.","The mass is 0.5 cm above rest."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: `cos(πt)` is −1 at every odd whole number.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"`y(3) = 1.5 × 1 = 1.5`: only the size of the wave matters, so the mass is 1.5 cm above rest.","why":"The sign of `cos(3π)` matters: −1 puts the mass below rest.","_n":"1ob3f","_k":"ebd74024"},{"t":"`y(3) = 12 × (-1) = -12`, so the mass is 12 cm below rest.","why":"That drops the `(1/2)^3`. By `t = 3` the swings have shrunk to 1.5 cm.","_n":"1pb2f","_k":"3d2c2f56"},{"t":"Step 3 is correct: the fence lifts the wave up and down.","why":"Adding would make the mass bob around the fence. The model multiplies, so the fence sets the size of each swing.","_n":"1qb1f","_k":"2faf6d40"},{"t":"`y(3) = 1.5 × (-1) = -1.5`, so the mass is 1.5 cm below rest.","why":"The model multiplies the fence by the wave. At `t = 3` the wave is −1, so the mass touches the lower fence.","_n":"1rb0f","_k":"2db0a0c1"}],"hints":["Is the fence added to the wave, or multiplied by it?","`y(3) =` (fence) × (wave) `= 1.5 × cos(3π)`.","Step 3 is wrong: `y(3) = 1.5 × (-1) = -1.5`, so the mass is 1.5 cm below rest."]}]},{"id":"builds","type":"custom","title":"Work backwards: build the combination","summary":"Work backwards","star":true,"goal":[3,4,5,6],"instruction":"Fill in the boxes so the combination has every feature listed.","how":"Type a number in each box, then press Check. After each check you’ll see the graph of \u003cstrong>your\u003c/strong> combination.","items":[{"id":"b1","goal":4,"kind":"b1","tpl":["g(x) = x^2 + ",{"box":"b"},"x + ",{"box":"c"},", with f(x) = x - 1"],"features":"`f/g` has a hole at `x = 1` and a vertical asymptote `x = -4`.","_a":"ThYDQw8HSRFWFltMAUk=","why":"`g(x) = (x - 1)(x + 4) = x^2 + 3x - 4`, and `f/g = 1/(x + 4)` for `x ≠ 1`, with the hole at (1, 1/5).","wrong":[{"v":{"b":-3,"c":-4},"fb":"Your `g = (x - 4)(x + 1)` is 0 at 4 and −1. That gives asymptotes there and no hole. Check the signs in the factors."},{"v":{"b":5,"c":4},"fb":"`(x + 1)(x + 4)` is 0 at −4, but not at 1, so there’s no hole: `f/g = 0` at `x = 1`."},{"v":{"b":-5,"c":4},"fb":"`(x - 1)(x - 4)` gives the hole at 1, but its asymptote is at `x = 4`, not −4."}],"hints":["A hole at `x = 1` needs `g(1) = 0` (`f(1)` is already 0). An asymptote at −4 needs `g(-4) = 0`.","So `g(x) = (x - 1)(x + 4)`. Expand it.","`(x - 1)(x + 4) = x^2 + 3x - 4`, so `b = 3` and `c = -4`."]},{"id":"b2","goal":6,"kind":"b2","tpl":["g(x) = ",{"box":"a"},"x + ",{"box":"c"},", with f(x) = x^2 - 4"],"features":"`f · g` is odd, and `(f · g)(1) = 6`.","_a":"ThYAQw8ZVx8XV0NbBUk=","why":"`g(x) = -2x`, and `f · g = -2x^3 + 8x`.","wrong":[{"v":{"a":2,"c":0},"fb":"`(f · g)(1) = (1 - 4)(2) = -6`. `f(1)` is negative, so `g(1)` must be negative too."},{"v":{"a":0,"c":-2},"fb":"`(f · g)(1) = (-3)(-2) = 6`, but `g = -2` is even, so `f · g = -2x^2 + 8` is even, not odd."},{"v":{"cnz":true},"fb":"With `c ≠ 0`, `g` is neither even nor odd, and so is `f · g`: compare `(f · g)(1)` with `(f · g)(-1)`."}],"hints":["`f` is even. What must `g` be for the product to be odd?","`g` must be odd, so `c = 0` and `g(x) = ax`. Then `(f · g)(1) = f(1) × a`.","`f(1) = -3`, so `-3a = 6` and `a = -2`: `g(x) = -2x`."]},{"id":"b3","goal":5,"kind":"b3","tpl":["y(t) = ",{"box":"a","min":-40,"max":40}," · (",{"box":"p","min":1,"max":9,"frac":"top"},"/",{"box":"q","min":1,"max":9,"frac":"bottom"},")^t · cos(πt)"],"features":"At `t = 1` the mass is 6 cm below rest. At `t = 3` it is 2/3 cm below rest.","note":"`a` is a whole number from −40 to 40. The base is a fraction box: whole numbers from 1 to 9 on top and bottom (equal fractions such as 2/6 are accepted).","_a":"ThYAQw8FXR8XVkNbbgVJAGhJ","why":"`y(1) = 18 × 1/3 × (-1) = -6` and `y(3) = 18 × 1/27 × (-1) = -2/3`.","wrong":[{"v":{"a":54,"b":[1,9]},"fb":"`y(1) = -6` works, but `y(3) = -54/729 = -2/27`. Dividing the two conditions gives `b^2 = 1/9`, so take the square root."},{"v":{"a":2,"b":[3,1]},"fb":"`y(1) = -6` works, but the swings grow: `y(3) = -54`. The fraction is upside down."},{"v":{"a":6,"b":[1,1]},"fb":"No damping: `y(3) = -6`, not −2/3."},{"v":{"a":-18,"b":[1,3]},"fb":"`y(1) = (-18)(1/3)(-1) = 6`, which is above rest. `cos π = -1` already makes the height negative, so `a` stays positive."}],"hints":["Write both conditions: `y(1) = a · b · cos π` and `y(3) = a · b^3 · cos 3π`.","`cos π = cos 3π = -1`, so `ab = 6` and `ab^3 = 2/3`. Divide the second by the first.","`b^2 = (2/3)/6 = 1/9`, so `b = 1/3`, and `a = 6 ÷ 1/3 = 18`: `y = 18(1/3)^t cos(πt)`."]},{"id":"b4","goal":5,"kind":"b4","tpl":["f(x) = ",{"box":"p"},"x + ",{"box":"q"}," and h(x) = f(x) · cos(πx)"],"features":"The graph of `h` touches the fence `y = f(x)` at (2, 5) and touches the fence `y = -f(x)` at (1, −3).","_a":"ThYRQw8GSRFEFltQSA==","why":"`f(x) = 2x + 1`, so `h(2) = 5 × cos 2π = 5` and `h(1) = 3 × cos π = -3`.","wrong":[{"v":{"p":8,"q":-11},"fb":"You used `f(1) = -3`. But (1, −3) is a point on `h`, and `h(1) = f(1) × cos π = -f(1)`. So `f(1) = 3`."}],"other":"Right now `h(2) =` {h2} and `h(1) =` {h1}. You need 5 and −3.","hints":["At `x = 2`, `cos 2π = 1`, so `h(2) = f(2)`. At `x = 1`, `cos π = -1`, so `h(1) = -f(1)`.","So `f(2) = 5` and `f(1) = 3`: the line `f` passes through (1, 3) and (2, 5).","Slope `(5 - 3)/(2 - 1) = 2`, and `2(1) + q = 3` gives `q = 1`: `f(x) = 2x + 1`."]},{"id":"b5","goal":4,"kind":"b5","tpl":["f(x) = x + ",{"box":"p"}," and g(x) = x^2 - ",{"box":"q"}],"features":"`f/g` has exactly one vertical asymptote, `x = 3`, and its graph passes through (1, −1/2).","_a":"ThYRQw8HSRFEFltYSA==","why":"`(x + 3)/(x^2 - 9) = 1/(x - 3)` for `x ≠ -3`, with a hole at (−3, −1/6). At `x = 1` it’s `4/(-8) = -1/2`.","wrong":[{"v":{"p":-3,"q":9},"fb":"Now `x - 3` cancels instead: a hole at `x = 3` and the asymptote at `x = -3`."},{"v":{"p":0,"q":9},"fb":"`x/(x^2 - 9)` has two asymptotes, `x = 3` and `x = -3`. The second one must cancel."},{"v":{"q":3},"fb":"`x^2 - 3 = 0` at `±√3`, not at 3."}],"hints":["Which `g` has `x = 3` as a zero?","`q = 9` gives `x^2 - 9`, which is 0 at 3 \u003cstrong>and\u003c/strong> at −3. The −3 mustn’t become an asymptote, so make `f(-3) = 0` and let it cancel.","`p = 3`: `(x + 3)/(x^2 - 9) = 1/(x - 3)` for `x ≠ -3`. One asymptote, `x = 3`, a hole at (−3, −1/6), and at `x = 1` the value is −1/2."]},{"id":"b6","goal":6,"kind":"b6","tpl":["f(x) = x + ",{"box":"c"},", with g(x) = x - 3"],"features":"`f` and `g` are both increasing. Make `f · g` decreasing on `(-∞, 1)` and increasing on `(1, ∞)`.","_a":"ThYCQw8FGA==","why":"`f · g = (x + 1)(x - 3) = x^2 - 2x - 3`, a parabola with its vertex at `x = 1`.","wrong":[{"v":{"c":-1},"fb":"`f · g = (x - 1)(x - 3)` has zeros 1 and 3, so it turns halfway between them, at `x = 2`."},{"v":{"c":5},"fb":"Zeros at −5 and 3: it turns at `x = -1`."}],"hints":["`f · g` is a parabola that opens up. It turns halfway between its two zeros.","The zeros are `-c` and 3. Their midpoint must be 1.","`(-c + 3)/2 = 1` gives `c = 1`: `f · g = (x + 1)(x - 3)`, decreasing on `(-∞, 1)` and increasing on `(1, ∞)`."]},{"id":"b7","goal":[3,4],"star":true,"kind":"b7","tpl":["f(x) = x^2 + ",{"box":"b"},"x + ",{"box":"c"}," and g(x) = x - ",{"box":"r","min":-10,"max":10}],"features":"`f · g` is 0 at exactly two values, `x = -1` and `x = 3`, and `f/g` has a hole at `x = 3`.","_a":"ThYDQw8ZVx8XV0NbGAdJEUcWW1JI","why":"`f(x) = (x - 3)(x + 1)`. Then `f · g = (x - 3)^2(x + 1)`, which touches the axis at 3 and crosses at −1, and `f/g = x + 1` for `x ≠ 3`, with a hole at (3, 4).","wrong":[{"v":{"b":-6,"c":9,"r":3},"fb":"`f = (x - 3)^2`, so `f · g = (x - 3)^3` is 0 only at 3. The zero at −1 has to come from `f`."},{"v":{"b":-2,"c":-3,"r":-1},"fb":"The zeros of `f · g` are right, but `g = x + 1` puts the hole at `x = -1`, not 3."},{"v":{"b":2,"c":-3,"r":3},"fb":"`f = (x + 3)(x - 1)` isn’t 0 at 3, so nothing cancels: `x = 3` becomes an asymptote, and `f · g` is 0 at −3, 1 and 3."}],"hints":["A hole at `x = 3` needs `g(3) = 0` \u003cstrong>and\u003c/strong> `f(3) = 0`.","So `r = 3` and `x - 3` is a factor of `f`. The product’s other zero, −1, has to come from `f`.","`f(x) = (x - 3)(x + 1) = x^2 - 2x - 3`: `b = -2`, `c = -3`, `r = 3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: the fences, where the product was 0, or what happened to `f/g` where `g(x) = 0`?"},{"id":"j2","q":"In your own words, explain why multiplying by `cos(πx)` keeps a graph between `y = f(x)` and `y = -f(x)`, but adding `cos(πx)` doesn’t."},{"id":"j3","q":"Explain to a friend, step by step, how to find the domain, zeros, asymptotes and holes of `f/g` when `f(x) = x^2 - 1` and `g(x) = x^2 + 3x + 2`."},{"id":"j4","q":"Which is shakiest for you: signs, domains, holes, fences or symmetry? What will you do about it before module 48?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`f(x) = x^2 - 1` and `g(x) = 2x + 3`. What is `(f · g)(2)`?","options":[{"t":"9","why":"That’s `g(f(2)) = g(3) = 9`. The dot means multiply: `f(2) × g(2)`.","_n":"1saff","_k":"0701c404"},{"t":"10","why":"That’s `f(2) + g(2) = 3 + 7`, which is `(f + g)(2)`.","_n":"1taef","_k":"646cdfa0"},{"t":"21","why":"`f(2) = 3` and `g(2) = 7`, so `(f · g)(2) = 3 × 7 = 21`.","_n":"1uadf","_k":"6a847baf"},{"t":"48","why":"That’s `f(g(2)) = f(7) = 48`, a composition. `(f · g)(2) = f(2) × g(2)`.","_n":"1vacf","_k":"0d7b00b0"}]},"b":{"prompt":"`f(x) = x^2 + 2` and `g(x) = 5 - x`. What is `(f · g)(3)`?","options":[{"t":"−6","why":"That’s `g(f(3)) = g(11) = -6`. The dot means multiply: `f(3) × g(3)`.","_n":"1wabf","_k":"0de0a4a4"},{"t":"6","why":"That’s `f(g(3)) = f(2) = 6`, a composition.","_n":"1x2ef","_k":"1a84cb5d"},{"t":"13","why":"That’s `f(3) + g(3) = 11 + 2`, which is `(f + g)(3)`.","_n":"1y2ff","_k":"2e2dbaa3"},{"t":"22","why":"`f(3) = 11` and `g(3) = 2`, so `(f · g)(3) = 11 × 2 = 22`.","_n":"1z30f","_k":"42c2584e"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`f(x) = x - 4` and `g(x) = x^2 - 2x - 8`. What is the domain of `f/g`?","options":[{"t":"`{x ∈ ℝ | x ≠ -4, x ≠ 2}`","why":"`x^2 - 2x - 8 = (x - 4)(x + 2)` is 0 at \u003cstrong>4\u003c/strong> and \u003cstrong>−2\u003c/strong>.","_n":"2031f","_k":"243f5ca7"},{"t":"`{x ∈ ℝ | x ≠ -2, x ≠ 4}`","why":"`g(x) = (x - 4)(x + 2)` is 0 at 4 and −2. Both stay out of the domain, even though `x - 4` cancels.","_n":"212af","_k":"e5e52146"},{"t":"`{x ∈ ℝ | x ≠ -2}`","why":"After cancelling, `1/(x + 2)` looks fine at `x = 4`, but `g(4) = 0`, so `f/g` is undefined there: it has a hole.","_n":"222bf","_k":"baaa9e35"},{"t":"`{x ∈ ℝ | x ≠ 4}`","why":"`x = 4` is excluded, but because `g(4) = 0`, not because `f(4) = 0`. `g` is also 0 at `x = -2`.","_n":"232cf","_k":"d969a991"}]},"b":{"prompt":"`f(x) = x + 3` and `g(x) = x^2 - x - 12`. What is the domain of `f/g`?","options":[{"t":"`{x ∈ ℝ | x ≠ 4}`","why":"After cancelling, `1/(x - 4)` looks fine at `x = -3`, but `g(-3) = 0`, so `f/g` is undefined there.","_n":"242df","_k":"06d4cb15"},{"t":"`{x ∈ ℝ | x ≠ -3, x ≠ 4}`","why":"`g(x) = (x - 4)(x + 3)` is 0 at 4 and −3. Both stay out of the domain, even though `x + 3` cancels.","_n":"2526f","_k":"f5f02509"},{"t":"`{x ∈ ℝ | x ≠ -3}`","why":"`x = -3` is excluded, but because `g(-3) = 0`. `g` is also 0 at `x = 4`.","_n":"2627f","_k":"5c6a25b8"},{"t":"`{x ∈ ℝ | x ≠ -4, x ≠ 3}`","why":"`x^2 - x - 12 = (x - 4)(x + 3)` is 0 at \u003cstrong>4\u003c/strong> and \u003cstrong>−3\u003c/strong>.","_n":"27990","_k":"873e4350"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"`f` is an odd function and `g` is an even function, both defined for every real `x`. Which describes `f · g`?","options":[{"t":"It depends on which functions they are","why":"The argument above uses only `f(-x) = -f(x)` and `g(-x) = g(x)`, so it works for every such pair.","_n":"28980","_k":"6136c006"},{"t":"Odd","why":"`(f · g)(-x) = f(-x)g(-x) = (-f(x))(g(x)) = -(f · g)(x)`. Example: `x · x^2 = x^3`.","_n":"299b0","_k":"92fa468e"},{"t":"Neither","why":"An odd function plus an even one is usually neither, but a product passes the single sign flip straight through.","_n":"2a9a0","_k":"883656fa"},{"t":"Even","why":"The odd factor’s sign flip survives: `(f · g)(-x) = (-f(x))(g(x)) = -(f · g)(x)`.","_n":"2b9d0","_k":"8a804274"}]},"b":{"prompt":"`f` and `g` are both odd functions, and `g(x) ≠ 0` except at `x = 0`. Which describes `f/g` on its domain?","options":[{"t":"It depends on which functions they are","why":"The argument uses only `f(-x) = -f(x)` and `g(-x) = -g(x)`, so it works for every such pair.","_n":"2c9c0","_k":"f540fd56"},{"t":"Neither","why":"Both functions have a symmetry, so the quotient does too.","_n":"2d9f0","_k":"1f64c4ac"},{"t":"Odd","why":"The two sign flips cancel. Example: `x/x^3 = 1/x^2` for `x ≠ 0`, which is even.","_n":"2e9e0","_k":"ff29d86a"},{"t":"Even","why":"`(f/g)(-x) = (-f(x))/(-g(x)) = (f/g)(x)`. Example: `(sin x)/x`.","_n":"2fa10","_k":"41343b2a"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`f(x) = x^2 - 9` and `g(x) = x - 1`. For which `x` is `(f · g)(x) \u003c 0`?","options":[{"t":"`(-3, 1) ∪ (3, ∞)`","why":"At `x = 0` the product is (−9)(−1) = 9 > 0. These are the positive intervals.","_n":"2ga00","_k":"9acd78a1"},{"t":"`(-∞, -3) ∪ (1, 3)`","why":"`f · g = (x - 3)(x + 3)(x - 1)`, with zeros −3, 1 and 3. Testing `x = -4`, 0, 2 and 4 gives −, +, −, +.","_n":"2h330","_k":"f9f57fd8"},{"t":"`(-∞, 1)`","why":"That’s where `g \u003c 0`. On (−3, 1), `f` is negative too, so the product is positive there.","_n":"2i340","_k":"cf6a2c85"},{"t":"`(-3, 3)`","why":"That’s where `f \u003c 0`. On (−3, 1), `g` is negative too, so the product is positive there.","_n":"2j310","_k":"ae7ca9ef"}]},"b":{"prompt":"`f(x) = x^2 - 4` and `g(x) = x + 1`. For which `x` is `(f · g)(x) \u003c 0`?","options":[{"t":"`(-∞, -1)`","why":"That’s where `g \u003c 0`. On (−2, −1), `f` is negative too, so the product is positive there.","_n":"2k320","_k":"faca5ffd"},{"t":"`(-2, 2)`","why":"That’s where `f \u003c 0`. On (−2, −1), `g` is negative too, so the product is positive there.","_n":"2l2f0","_k":"e45b7e49"},{"t":"`(-2, -1) ∪ (2, ∞)`","why":"At `x = 3` the product is (5)(4) = 20 > 0. These are the positive intervals.","_n":"2m300","_k":"30c53965"},{"t":"`(-∞, -2) ∪ (-1, 2)`","why":"`f · g = (x - 2)(x + 2)(x + 1)`, with zeros −2, −1 and 2. Testing `x = -3`, −1.5, 0 and 3 gives −, +, −, +.","_n":"2n2d0","_k":"7f2c4016"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"`f(x) = x^2 - 1` and `g(x) = x^2 + x - 2`. Which describes the graph of `f/g`?","options":[{"t":"A hole at (1, 2/3) and a vertical asymptote `x = -2`","why":"`f/g = ((x - 1)(x + 1))/((x - 1)(x + 2)) = (x + 1)/(x + 2)` for `x ≠ 1`. At `x = 1` that’s 2/3. `f(-2) = 3 ≠ 0`, so `x = -2` is an asymptote.","_n":"2o2e0","_k":"0bc338b2"},{"t":"A hole at (1, 0) and a vertical asymptote `x = -2`","why":"At `x = 1` the original is 0/0. The hole’s height comes from the simplified form: `(1 + 1)/(1 + 2) = 2/3`.","_n":"2p2b0","_k":"eb6bcbf1"},{"t":"A hole at (1, 2/3) and a vertical asymptote `x = 2`","why":"`x + 2 = 0` at `x = -2`.","_n":"2q2c0","_k":"2bbe97ad"},{"t":"Vertical asymptotes `x = -2` and `x = 1`","why":"`f(1) = 0` too, and the common factor `x - 1` cancels. There’s a hole at `x = 1`, not an asymptote.","_n":"2r5f0","_k":"d7737972"}]},"b":{"prompt":"`f(x) = x^2 - 4` and `g(x) = x^2 - x - 2`. Which describes the graph of `f/g`?","options":[{"t":"Vertical asymptotes `x = -1` and `x = 2`","why":"`f(2) = 0` too, and the common factor `x - 2` cancels. There’s a hole at `x = 2`.","_n":"2s600","_k":"20c630e8"},{"t":"A hole at (2, 0) and a vertical asymptote `x = -1`","why":"At `x = 2` the original is 0/0. The height comes from the simplified form: `(2 + 2)/(2 + 1) = 4/3`.","_n":"2t5d0","_k":"c4c52e32"},{"t":"A hole at (2, 4/3) and a vertical asymptote `x = -1`","why":"`f/g = ((x - 2)(x + 2))/((x - 2)(x + 1)) = (x + 2)/(x + 1)` for `x ≠ 2`. At `x = 2` that’s 4/3. `f(-1) = -3 ≠ 0`, so `x = -1` is an asymptote.","_n":"2u5e0","_k":"1f44a271"},{"t":"A hole at (2, 4/3) and a vertical asymptote `x = 1`","why":"`x + 1 = 0` at `x = -1`.","_n":"2v630","_k":"551bdf5a"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"`f(x) = x` and `g(x) = x - 2` are both increasing on ℝ. Which gives the \u003cstrong>whole\u003c/strong> interval on which `f · g` is decreasing?","options":[{"t":"Nowhere: an increasing function times an increasing function is increasing","why":"`f · g = x^2 - 2x`, a parabola opening up, which falls until its vertex at `x = 1`. When the factors are negative, making them bigger can make the product smaller.","_n":"2w640","_k":"1c91c1a0"},{"t":"`(-∞, 0)`","why":"It does fall on `(-∞, 0)`, but that isn’t the whole interval: it keeps falling on (0, 1), from 0 at `x = 0` down to −1 at `x = 1`.","_n":"2x610","_k":"8754fe76"},{"t":"`(-∞, 1)`","why":"`f · g = x^2 - 2x = (x - 1)^2 - 1`. It decreases until the vertex at `x = 1`, then increases.","_n":"2y620","_k":"424c7923"},{"t":"`(0, 2)`","why":"That’s where `f · g \u003c 0`. On (1, 2) it’s negative but rising, from −1 back up to 0.","_n":"2z670","_k":"021e3bf2"}]},"b":{"prompt":"`f(x) = x + 4` and `g(x) = x` are both increasing on ℝ. Which gives the \u003cstrong>whole\u003c/strong> interval on which `f · g` is decreasing?","options":[{"t":"`(-∞, -4)`","why":"It does fall on `(-∞, -4)`, but that isn’t the whole interval: it keeps falling on (−4, −2), from 0 at `x = -4` down to −4 at `x = -2`.","_n":"30680","_k":"0629425c"},{"t":"`(-∞, -2)`","why":"`f · g = x^2 + 4x = (x + 2)^2 - 4`. It decreases until the vertex at `x = -2`, then increases.","_n":"31650","_k":"ed7b22ff"},{"t":"`(-4, 0)`","why":"That’s where `f · g \u003c 0`. On (−2, 0) it’s negative but rising.","_n":"32640","_k":"191b76c2"},{"t":"Nowhere: an increasing function times an increasing function is increasing","why":"`f · g = x^2 + 4x`, a parabola opening up, which falls until its vertex at `x = -2`.","_n":"33670","_k":"b7947d6c"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why the graph of `y = x^2 cos x` stays between the graphs of `y = x^2` and `y = -x^2`?","options":[{"t":"“`x^2` is always bigger than `cos x`.”","why":"That isn’t even true near 0 (at `x = 0`, `x^2 = 0` but `cos 0 = 1`), and comparing the factors says nothing about their product.","_n":"34660","_k":"e43ac15e"},{"t":"“`-1 ≤ cos x ≤ 1` and `x^2` is never negative, so `x^2 cos x` is a number between `-x^2` and `x^2`.”","why":"This uses both facts it needs: the size of the multiplier and the sign of `x^2`.","_n":"35610","_k":"279bf60f"},{"t":"“`y = x^2 cos x` has the same zeros as `y = x^2`.”","why":"It has more zeros, wherever `cos x = 0`. And sharing zeros wouldn’t keep a graph between two curves anyway.","_n":"36600","_k":"a7994c7a"},{"t":"“Adding `cos x` moves `x^2` up or down by at most 1.”","why":"That describes `y = x^2 + cos x`. Here `cos x` \u003cstrong>multiplies\u003c/strong> `x^2`.","_n":"37630","_k":"8acb311c"}]},"b":{"prompt":"Which is the best explanation of why the graph of `y = 2^{-x} sin x` stays between the graphs of `y = 2^{-x}` and `y = -2^{-x}`?","options":[{"t":"“`2^{-x}` is never 0.”","why":"True, but `5 · 2^{-x}` is never 0 either, and it isn’t between the two curves.","_n":"38620","_k":"c43e9c1e"},{"t":"“`-1 ≤ sin x ≤ 1` and `2^{-x}` is always positive, so `2^{-x} sin x` is a number between `-2^{-x}` and `2^{-x}`.”","why":"This uses both facts it needs: the size of the multiplier and the sign of `2^{-x}`.","_n":"396d0","_k":"ffb5ecf2"},{"t":"“Adding `sin x` moves `2^{-x}` up or down by at most 1.”","why":"That describes `y = 2^{-x} + sin x`. Here `sin x` \u003cstrong>multiplies\u003c/strong> `2^{-x}`.","_n":"3a6c0","_k":"eb9377ea"},{"t":"“`2^{-x}` is always bigger than `sin x`.”","why":"Not true: at `x = 2`, `2^{-x} = 1/4`, but `sin 2` is about 0.91. And comparing the factors says nothing about their product.","_n":"3bf30","_k":"02f49e65"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"`f(x) = x^2 - 4` and `g(x) = x - 2`. Which statement is written correctly and true?","options":[{"t":"“`(f/g)(x) = x + 2`, with domain `{x ∈ ℝ}`.”","why":"`g(2) = 0`, so `x = 2` stays out of the domain of `f/g`.","_n":"3cf40","_k":"448a51cf"},{"t":"“`(f/g)(2) = 4`.”","why":"`g(2) = 0`, so `(f/g)(2)` doesn’t exist. 4 is the height of the hole at (2, 4).","_n":"3df50","_k":"e4c1e2dd"},{"t":"“`(f/g)(x) = x + 2`, with domain `{x ∈ ℝ | x ≠ 2}`.”","why":"The simplified formula plus the restriction from `g`: the graph is the line `y = x + 2` with a hole at (2, 4).","_n":"3ef60","_k":"0a6f3868"},{"t":"“`(f/g)(x) = f(g(x)) = (x - 2)^2 - 4`.”","why":"`f/g` divides the outputs. `f(g(x))` is a composition.","_n":"3fef0","_k":"373c4039"}]},"b":{"prompt":"`f(x) = x^2 - 9` and `g(x) = x + 3`. Which statement is written correctly and true?","options":[{"t":"“`(f/g)(-3) = -6`.”","why":"`g(-3) = 0`, so `(f/g)(-3)` doesn’t exist. −6 is the height of the hole.","_n":"3gf00","_k":"29ba4a1f"},{"t":"“`(f/g)(x) = f(g(x)) = (x + 3)^2 - 9`.”","why":"`f/g` divides the outputs. `f(g(x))` is a composition.","_n":"3hf10","_k":"7121dc1d"},{"t":"“`(f/g)(x) = x - 3`, with domain `{x ∈ ℝ}`.”","why":"`g(-3) = 0`, so `x = -3` stays out of the domain.","_n":"3if20","_k":"94fa8753"},{"t":"“`(f/g)(x) = x - 3`, with domain `{x ∈ ℝ | x ≠ -3}`.”","why":"The simplified formula plus the restriction from `g`: the line `y = x - 3` with a hole at (−3, −6).","_n":"3jeb0","_k":"7fba6afe"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A mass on a spring is `y(t) = 24(1/2)^t cos(πt)` cm above its rest position, `t` seconds after it is released. Where is it at `t` = 3 s?","options":[{"t":"24 cm below rest","why":"24 × (−1) leaves out the `(1/2)^3`. By `t = 3` the swings have shrunk to 3 cm.","_n":"3kec0","_k":"1b4e8a0d"},{"t":"3 cm below rest","why":"The fence is `24(1/2)^3 = 3` cm and `cos 3π = -1`, so `y(3) = 3 × (-1) = -3`: 3 cm below rest, touching the lower fence.","_n":"3lf90","_k":"111fb2f6"},{"t":"2 cm above rest","why":"3 + (−1) = 2 adds them. The model multiplies: 3 × (−1).","_n":"3mf80","_k":"2523132d"},{"t":"3 cm above rest","why":"`cos 3π = -1`, so the mass is below rest.","_n":"3nf70","_k":"f1df9365"}]},"b":{"prompt":"A mass on a spring is `y(t) = 18(1/3)^t cos(πt)` cm above its rest position, `t` seconds after it is released. Where is it at `t` = 2 s?","options":[{"t":"3 cm above rest","why":"2 + 1 = 3 adds them. The model multiplies: 2 × 1.","_n":"3of60","_k":"5c103a41"},{"t":"18 cm above rest","why":"18 × 1 leaves out the `(1/3)^2`. By `t = 2` the swings have shrunk to 2 cm.","_n":"3pf50","_k":"711bed81"},{"t":"2 cm above rest","why":"The fence is `18(1/3)^2 = 2` cm and `cos 2π = 1`, so `y(2) = 2 × 1 = 2`: 2 cm above rest, touching the upper fence.","_n":"3qf40","_k":"48c2348a"},{"t":"2 cm below rest","why":"`cos 2π = 1`: two seconds is one full cycle of `cos(πt)`.","_n":"3rf30","_k":"967f7fd5"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A town’s population is `P(t) = 12 000 + 600t`, and its built-up area is `S(t) = 20 + 2t` square kilometres, `t` years from now. Its population density is `D(t) = P(t)/S(t)` people per square kilometre. What happens to the density in the long run?","options":[{"t":"It approaches 0, because the area keeps growing","why":"`D → 0` would need the area to grow faster than linearly, outpacing the population. Here both grow at steady rates.","_n":"3sf20","_k":"a32fe8b9"},{"t":"It stays at 600 people per square kilometre","why":"`600 = 12 000/20` is `D(0)`, today’s density. The long run comes from the leading terms.","_n":"3tf10","_k":"b35c1b09"},{"t":"It grows without bound, because the population keeps growing","why":"The area grows too. For large `t`, `D(t)` is about `600t/(2t) = 300`.","_n":"3uf00","_k":"c65f79ad"},{"t":"It approaches 300 people per square kilometre","why":"Both are linear, so in the long run the leading terms decide: `600t/(2t) = 300`. The density falls from 600 toward 300.","_n":"3ve6f","_k":"0e8000dc"}]},"b":{"prompt":"A town’s population is `P(t) = 8000 + 300t`, and its built-up area is `S(t) = 40 + 3t` square kilometres, `t` years from now. Its population density is `D(t) = P(t)/S(t)` people per square kilometre. What happens to the density in the long run?","options":[{"t":"It approaches 0, because the area keeps growing","why":"Both grow at steady rates, so their ratio settles at 300/3.","_n":"3we7f","_k":"95ff955b"},{"t":"It grows without bound, because the population keeps growing","why":"The area grows too. For large `t`, `D(t)` is about `300t/(3t) = 100`.","_n":"3xe4f","_k":"53a76a47"},{"t":"It stays at 200 people per square kilometre","why":"`200 = 8000/40` is `D(0)`, today’s density.","_n":"3ye5f","_k":"e3da835b"},{"t":"It approaches 100 people per square kilometre","why":"Both are linear, so in the long run the leading terms decide: `300t/(3t) = 100`. The density falls from 200 toward 100.","_n":"3ze2f","_k":"b0b66a34"}]}}]},"task":{"title":"Design a combination","summary":"Design a combination","statement":"\u003cp>Use two function cards and a whole number `k` to build `h(x) = k · f(x) · g(x)` or `h(x) = k · f(x)/g(x)`, so that all four checks pass. There are 12 working functions. Can you find three that use different pairs of cards?\u003c/p>\u003cp class=\"tiny muted\">Choose `k` (−3 to 3, not 0), a first card `f`, a second card `g` (a card may be chosen twice), and × or ÷. The graph shows your `h` on `-3 ≤ x ≤ 3`.\u003c/p>","checks":["`h` is odd","`h(-2) = 0` and `h(2) = 0`","`h(x) > 0` for every `x` between 0 and 1","`h` is defined for every real `x`"],"tips":["An odd function times (or divided by) an even one is odd. Two odd ones make an even function.","For `h(±2) = 0`, one card must be 0 at both 2 and −2, and you can’t divide by that card.","Change the sign of `k` or swap a card.","Divide only by a card that is never 0, or multiply instead."],"explainPrompt":"Explain why your design passes each check.","vocab":"Use the words odd, even, zero, sign and domain.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"You found three. Every working design pairs an odd card with an even card, uses `x^2 - 4` or `sin(πx)` to make the zeros at ±2, never divides by a card that can be 0, and gets the sign of `k` from the signs on `0 \u003c x \u003c 1`."},"cards":[["`(f · g)(x)`","`f(x) · g(x)`: multiply the two outputs at the same `x`. With `f(x) = x^2 - 1` and `g(x) = 2x + 3`, `(f · g)(2) = 3 × 7 = 21`. It is not `f(g(x))`."],["`(f/g)(x)`","`f(x)/g(x)`, only where `g(x) ≠ 0`. With `f(x) = x - 2` and `g(x) = x^2 - 4`, `(f/g)(1.5) = (-0.5)/(-1.75) = 2/7`."],["Domain of `f · g` and of `f/g`","`f · g`: every `x` where both `f` and `g` are defined. `f/g`: the same, minus every `x` where `g(x) = 0`. Decide it before cancelling."],["Zeros of `f · g` and of `f/g`","`f · g = 0` where `f = 0` or `g = 0`. `f/g = 0` where `f = 0` and `g ≠ 0`."],["Sign of a product or quotient","Count the negative factors: an even number gives +, an odd number gives −. Division follows the same rule as multiplication."],["Where `g(x) = 0` in `f/g`","If `f ≠ 0` there: a vertical asymptote. If `f = 0` too and a common factor cancels: a hole. `(x - 2)/(x^2 - 4)` has an asymptote at `x = -2` and a hole at (2, 1/4)."],["Both factors 0 at the same `x`","When each factor has a simple zero there, both change sign and the changes cancel: a product touches the axis, and a quotient has a hole with the same sign on both sides. Example: `(x - 2) sin(πx)` touches the axis at `x = 2`."],["The fence (envelope)","If `-1 ≤ g(x) ≤ 1`, then `f · g` stays between `y = f(x)` and `y = -f(x)`. It touches `y = f(x)` where `g = 1` and `y = -f(x)` where `g = -1`."],["Damped motion","`y = a · b^t · cos(πt)` with `0 \u003c b \u003c 1`: the fence `a · b^t` shrinks each second. For `16(1/2)^t` the swings reach 16, 8, 4, 2, 1 at `t = 0`, 1, 2, 3, 4."],["Symmetry of `f · g` and `f/g`","even · even = even; odd · odd = even; odd · even = odd. The same for ÷. Example: `x sin x` is even."],["Increasing × increasing","Not always increasing. `x` and `x - 2` both increase, but `x(x - 2)` decreases on `(-∞, 1)`."],["Adding a wave vs multiplying by one","`f(x) + cos x` wobbles around `y = f(x)` (module 46). `f(x) · cos x` is squeezed between `y = f(x)` and `y = -f(x)`."]]}};</script>
