trig-functions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"75f84089","content":{"id":"23-word-problems-with-rational-functions","kind":"topic","title":"Word problems with rational functions","topic":"Word Problems with Rational Functions","readyTopic":"word problems with rational functions","hero":{"eq":"`{1200 + 8x}/{x} = 8 + {1200}/{x}`\u003cspan class=\"hero-sub\">average cost of \u003ci>x\u003c/i> items: $1200 to set up, $8 to make each one\u003c/span>","eqLabel":"1200 plus 8 x, all over x, equals 8 plus 1200 over x: the average cost of x items, 1200 dollars to set up and 8 dollars to make each one","eqSize":"md","headline":"The long run is hiding in the equation","text":"Many real quantities are a total divided by something that grows: the \u003cstrong>average cost\u003c/strong> of `x` items, the \u003cstrong>concentration\u003c/strong> of salt in a tank, a player’s \u003cstrong>success rate\u003c/strong>. These are \u003cstrong>rational models\u003c/strong>. The \u003cstrong>horizontal asymptote\u003c/strong> is the long-run value. A \u003cstrong>vertical asymptote\u003c/strong> at the edge of the domain marks where the model breaks down. Rewriting a model as \u003cstrong>asymptote + leftover\u003c/strong>, like the equation above, shows both at a glance, and tells you which answers make sense.","fig":{"aria":"Animation: the average cost A of x equals 8 plus 1200 over x. A dot travels along the curve from 50 to 1000 items while a highlighted gap above the dashed line y = 8 shrinks."},"finalCap":"Closer and closer to $8, never below it."},"goals":["I can write a rational function that models a situation, such as average cost, concentration or a success rate, and state the domain that makes sense in the situation.","I can find the vertical and horizontal asymptotes of a model and explain what each one means in the situation, or why it has no meaning there.","I can rewrite a model as “asymptote + leftover” and use it to explain whether, and from which side, the model approaches its long-run value.","I can solve rational equations and inequalities that come from a situation, and check that each answer makes sense (restrictions, whole numbers, the domain).","I can compare two rational models, find where they are equal, and decide which is better for a given need."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Asymptotes","goal":2,"prompt":"What are the asymptotes of `y = {3x + 6}/{x - 2}`?","options":[{"t":"`x = 2` and `y = -3`","why":"`6/(-2) = -3` is the `y`-intercept (the value at `x = 0`). The horizontal asymptote uses the leading coefficients: 3/1 = 3.","_n":"0b74","_k":"7a5eae85"},{"t":"`x = -2` and `y = 3`","why":"`x - 2 = 0` when `x` = \u003cstrong>2\u003c/strong>. At `x = -2` the denominator is −4, which is fine.","_n":"1b84","_k":"398ba857"},{"t":"`x = 2` and `y = 0`","why":"`y = 0` is the horizontal asymptote only when the denominator’s degree is higher. Here both are degree 1, so it’s the ratio 3/1.","_n":"2b94","_k":"fa5d1f71"},{"t":"`x = 2` and `y = 3`","why":"The denominator is 0 at `x = 2`, and the numerator isn’t 0 there, so `x = 2` is a vertical asymptote. For huge `x`, the constants hardly matter, so `y ≈ 3x/x = 3`.","_n":"3ba4","_k":"66c62f4f"}],"hints":["Vertical: where is the denominator 0? Horizontal: what happens when `x` is huge?","`x - 2 = 0` at `x = 2`. For huge `x`, `{3x + 6}/{x - 2} ≈ 3x/x`.","Vertical asymptote `x = 2`; horizontal asymptote `y = 3`."]},{"id":"w2","skill":"Asymptotes","goal":2,"prompt":"Which function has the horizontal asymptote `y = 4`?","options":[{"t":"`y = {4}/{x + 1}`","why":"The top is a constant and the bottom grows, so `y → 0`. The horizontal asymptote is `y = 0`.","_n":"4bb4","_k":"cbf879dc"},{"t":"`y = {4x + 1}/{x + 3}`","why":"The leading coefficients are 4 and 1, so the horizontal asymptote is `y = 4/1 = 4`.","_n":"5bc4","_k":"fce0e95b"},{"t":"`y = {x + 1}/{x - 4}`","why":"`x = 4` is this function’s \u003cstrong>vertical\u003c/strong> asymptote. Its horizontal asymptote is `y = 1`.","_n":"6bd4","_k":"b3912640"},{"t":"`y = {x + 4}/{x + 1}`","why":"The 4 is a constant term. The leading coefficients are 1 and 1, so the asymptote is `y = 1`.","_n":"7ae4","_k":"d138dcd5"}],"hints":["For linear over linear, the horizontal asymptote is the ratio of the leading coefficients.","Find the ratio for each option: `{4x + 1}/{x + 3}` gives 4/1, `{x + 4}/{x + 1}` gives 1/1, `{4}/{x + 1}` has a constant on top, `{x + 1}/{x - 4}` gives 1/1.","Only `{4x + 1}/{x + 3}` gives 4: `y = {4x + 1}/{x + 3}` has horizontal asymptote `y = 4`."]},{"id":"w3","skill":"Rational equations","goal":4,"prompt":"Solve `{12}/{x + 3} = 2`.","options":[{"t":"`x = 6`","why":"6 is the value of `x + 3`. Subtract 3 to get `x`.","_n":"8af4","_k":"365ae141"},{"t":"`x = 3`","why":"Multiply both sides by `x + 3`: `12 = 2x + 6`, so `2x = 6` and `x = 3`. Check: 12/6 = 2.","_n":"9e87","_k":"d22e2648"},{"t":"`x = 4.5`","why":"`2(x + 3)` is `2x` + \u003cstrong>6\u003c/strong>, not `2x + 3`.","_n":"ae77","_k":"0ee05430"},{"t":"`x = 9`","why":"From `x + 3 = 6`, subtract 3: `x = 3`. Check: `12/(9 + 3) = 1`, not 2.","_n":"be67","_k":"bb2d8ffe"}],"hints":["State the restriction (`x ≠ -3`), then multiply both sides by `x + 3`.","`12 = 2(x + 3) = 2x + 6`.","`2x = 6`, so `x = 3`. Check: 12/6 = 2."]},{"id":"w4","skill":"Rational equations","goal":4,"prompt":"Solve `{x + 4}/{x + 10} = {3}/{4}`.","options":[{"t":"`x = 14`","why":"Cross-multiply: `4(x + 4) = 3(x + 10)`, so `4x + 16 = 3x + 30` and `x = 14`. Check: 18/24 = 3/4.","_n":"ce57","_k":"c3c9361f"},{"t":"`x = 6`","why":"`4(x + 4) = 4x + 16` and `3(x + 10) = 3x + 30`. Check: 10/16 = 5/8, not 3/4.","_n":"dec7","_k":"29de0f05"},{"t":"`x = -1`","why":"Equal fractions don’t need equal tops: 6/8 = 3/4. Cross-multiply instead. Check: `(-1 + 4)/(-1 + 10) = 3/9 = 1/3`.","_n":"eeb7","_k":"bcc6ca69"},{"t":"`x = -6`","why":"`4(x + 4) = 4x + 16`, and `3(x + 10) = 3x` + \u003cstrong>30\u003c/strong>, not `3x + 10`.","_n":"fea7","_k":"ab47c731"}],"hints":["Restriction: `x ≠ -10`. Multiply both sides by `4(x + 10)`.","`4(x + 4) = 3(x + 10)`. Distribute on both sides.","`4x + 16 = 3x + 30`, so `x = 14`. Check: 18/24 = 3/4."]},{"id":"w5","skill":"Modelling with ratios","goal":1,"prompt":"4 L of juice concentrate contains 480 g of sugar. You mix it with 2 L of water in a large pitcher. What is the sugar concentration of the mixture?","options":[{"t":"180 g/L","why":"120 × 6/4 = 180 is stronger than before. Adding water can only make it weaker.","_n":"ge97","_k":"ad76ce64"},{"t":"240 g/L","why":"480 ÷ 2 uses just the new water. The sugar is spread through all 6 L.","_n":"he07","_k":"5aa9cbce"},{"t":"120 g/L","why":"480 ÷ 4 = 120 g/L was the concentration \u003cstrong>before\u003c/strong> the water went in. Now there are 6 L.","_n":"idf7","_k":"a359717a"},{"t":"80 g/L","why":"The sugar stays 480 g, and the volume becomes 4 + 2 = 6 L: 480 ÷ 6 = 80 g/L.","_n":"jee7","_k":"9caf5d2e"}],"hints":["Concentration = amount ÷ volume. Which of the two changed?","The sugar is still 480 g. The volume is now 6 L.","480 ÷ 6 = 80 g/L."]},{"id":"w6","skill":"Modelling with ratios","goal":1,"prompt":"A club rents a bus for $400, and each ticket costs $12. If 20 students go and share all the costs equally, how much does each pay?","options":[{"t":"$12","why":"Each student also pays a share of the $400 bus.","_n":"kef7","_k":"62421e7b"},{"t":"$20","why":"$400 ÷ 20 = $20 is the bus share only. Each student also needs a $12 ticket.","_n":"lec7","_k":"2618250d"},{"t":"$32","why":"Total: 400 + 12 × 20 = $640. Shared by 20: $32 each. That’s $12 for the ticket plus a $20 share of the bus.","_n":"med7","_k":"0ef0abc8"},{"t":"$412","why":"One student would only pay $412 if the bus weren’t shared. Split the $400 twenty ways.","_n":"nea7","_k":"d8e46739"}],"hints":["Find the total cost first, then divide by the number of students.","Total = 400 + 12 × 20 = 640.","640 ÷ 20 = 32. Each pays $32: $12 + $20."]}],"refreshers":{"Asymptotes":"For `y = {ax + b}/{cx + d}`, the vertical asymptote is where the denominator is 0, `x = -d/c` (as long as the numerator isn’t also 0 there). The horizontal asymptote is `y = a/c`, the ratio of the leading coefficients, because for huge `x` the constants hardly matter. Example: `y = {3x + 6}/{x - 2}` has `x = 2` and `y = 3`. Its `y`-intercept, `6/(-2) = -3`, is a different feature.","Rational equations":"State the restriction, then multiply both sides by every denominator, distributing to every term. Example: `{x + 4}/{x + 10} = {3}/{4}`, with `x ≠ -10`. Then `4(x + 4) = 3(x + 10)`, so `4x + 16 = 3x + 30` and `x = 14`. Check: 18/24 = 3/4.","Modelling with ratios":"A concentration or an average is a total divided by a volume or a count. When something is added, ask what changes: the top, the bottom, or both. Adding 2 L of water to 480 g of sugar in 4 L changes only the bottom: 480 ÷ 6 = 80 g/L. A $400 bus shared by 20 students adds $20 to each student’s $12 ticket: $32 each."}}},"explore":{"heading":"Cost and concentration simulator","intro":"Make more items, or pour more brine into a tank, and watch where the numbers head. The highlighted gap is the distance to the long run. Switch modes with the buttons above the graph.","chalIntro":"Press \u003cstrong>Set up this challenge\u003c/strong> to load its starting state, use the simulator to meet the goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","ui":{"modes":[["Average cost","Cost"],["Compare two plans","Compare"],["Concentration","Tank"]],"views":["Near (0–200 items)","Mid (0–1000)","Far (0–100 000)"],"tanks":["Real tank (300 L)","Giant tank (no limit)"],"farT":"Far view (0 to 6000 min)","showRate":"Show rate","runCost":"Run production","run":"Run","stop":"Stop","setup":"Set up this challenge","leave":"Leave challenge","locked":"locked for this challenge","sl":{"F":"Fixed cost `F` (setup, $)","v":"Cost to make each item `v` ($)","x":"Items made `x`","FA":"Setup cost `F_{A}` ($)","vA":"Cost per item `v_{A}` ($)","FB":"Setup cost `F_{B}` ($)","vB":"Cost per item `v_{B}` ($)","V0":"Starting volume `V_0` (L)","C0":"Starting concentration `C_0` (g/L)","cin":"Incoming brine `c_{in}` (g/L)","r":"Flow rate `r` (L/min)","t":"Time `t` (min)"},"notes":{"C0":"0 means pure water","cin":"0 means pure water flows in"},"planA":"Plan A","planB":"Plan B","axX":"items made, ","axY":"average cost ($)","axT":"time, ","axC":"concentration (g/L)","near":"Only whole numbers of items make sense; the curve joins them up.","haCost":"$%v%: cost to make one item","make":"make it: %m%","share":"share: %s%","strip":"$%F% split %n% ways = %each% each","rowsCost":["Model","Items made","Total cost","Average cost","Each item’s share","Horizontal asymptote","Vertical asymptote","Domain","Gap above the asymptote"],"perItem":"per item","shareRow":"%make% to make it + %share% share of the setup","haRow":"%eq%: in the long run the average cost approaches $%v%, the cost to make one item. It never gets there, because every item still carries a share of the $%F%.","haNone":"None to approach: with no setup cost, the average is always $%v%.","vaRow":"%eq%: with no items there’s nothing to share the setup cost over, so the average is undefined. The fewer the items, the bigger each one’s share.","vaNone":"None.","domain":"Whole numbers `x ≥ 1`","gapRow":"%gap% (= %F% ÷ %x%)","longRun":"Long-run table","rowsCmp":["Plan A","Plan B","Cheaper at %x%","Same average cost","In the long run"],"cheaper":"Plan %p%, by %d% per item","sameCost":"Same cost","hidden":"hidden for this challenge","meet":"At %x% items: %c% each (equal totals: %T%)","meetFrac":"between %a% and %b% items (%x%)","never":"Never: Plan %p% is cheaper for every number of items.","always":"Always: the two plans are the same.","longCmp":"Plan %p%: its average approaches $%v%, below Plan %q%’s $%w%","longSame":"Neither: both approach $%v%; the plan with the smaller setup cost stays cheaper.","cheaperBand":"Plan %p% cheaper","rowsConc":["Model","Time","Volume","Salt","Concentration","Horizontal asymptote","Approach","Gap","Vertical asymptote","Tank","Rate"],"haConc":"%eq%: in the long run the tank approaches the strength of the incoming brine, %c% g/L.","haConcSame":"%eq%: the tank is already at the incoming strength and stays there.","below":"From below: the tank started weaker than the incoming brine.","above":"From above: the tank started stronger than the incoming brine.","noChange":"No change: `C_0 = c_{in}`, so %Ct% for every `t`. (Algebraically the factor cancels and leaves a hole at %hole%, as in module 21, outside the situation.)","gapBelow":"%g% g/L below the asymptote","gapAbove":"%g% g/L above the asymptote","gapNone":"0 g/L: no gap","vaConc":"%eq%: before the start, so it has no meaning here. It’s only where the formula’s volume, %vol%, would be 0.","vaConcSame":"None: the factor `V_0 + rt` cancels, leaving a hole at %hole%, outside the situation.","tankFull":"Full at %t% min (300 L). After that the model no longer applies.","tankGiant":"No limit (an imaginary giant tank).","rate":"Over the next %n% min: %dir% at %r% g/L per min on average","rising":"rising","falling":"falling","steady":"Over the next %n% min: not changing (0 g/L per min)","haConcLabel":"C = %c% (incoming)","fullLine":"tank full","bigger":"if the tank were bigger","fullMark":"300 L: full","giantMark":"imaginary giant tank","jug":"brine: %c% g/L","overflow":"overflowing","p2":{"halve":"Halve the setup","lower":"Lower v","rows":["original","halved setup","lower `v`"],"head":["Change","Average cost at 100 000 items"]}},"predictions":[{"id":"p1","start":{"mode":"cost","F":1200,"v":8,"x":100,"view":"mid"},"prompt":"Right now 100 items cost $20.00 each on average. If production rises to 400 items, what will the average cost be?","options":[{"t":"$5.00","_n":"oeb7","_k":"fbf1790b"},{"t":"$8.00","_n":"pe87","_k":"fa99390e"},{"t":"$11.00","_n":"qe97","_k":"f21e34b5"},{"t":"$20.00","_n":"re67","_k":"4af10f2e"}],"explain":"`A(400) = {1200 + 8 × 400}/{400} = 4400/400` = $11. Only the setup share was divided by 4, from $12 to $3. Each item still costs $8 to make, so the average can’t fall to $5 ($20 ÷ 4). It doesn’t reach $8 either: there’s still a $3 share of the setup. And it isn’t stuck at $20, because the setup is shared among more items."},{"id":"p2","start":{"mode":"cost","F":1200,"v":8,"x":100,"view":"mid"},"prompt":"Which change gives the lower average cost when 100 000 items are made?","options":[{"t":"Neither matters: at 100 000 items the average cost is $0 either way","_n":"se77","_k":"52c5f7b2"},{"t":"Both give the same average cost","_n":"t547","_k":"ea8b0656"},{"t":"Halve the setup cost to $600","_n":"u537","_k":"621026d8"},{"t":"Lower the cost to make each item from $8 to $7","_n":"v567","_k":"6479c33d"}],"explain":"At 100 000 items each item’s share of the setup is tiny: 1200 ÷ 100 000 = $0.012. Halving the setup saves less than a cent per item. Lowering `v` moves the asymptote itself, from `y = 8` to `y = 7`, and saves a full $1 per item. In the long run only `v` matters; the setup only decides how fast you get close. (For small runs it’s the other way round: at 100 items, halving the setup gives $14 and lowering `v` gives $19.)"},{"id":"p3","start":{"mode":"conc","tank":"giant","V0":100,"C0":0,"cin":30,"r":10,"t":0},"prompt":"Brine with 30 g of salt per litre pours into 100 L of pure water at 10 L/min. Imagine a giant tank that never fills. In the long run, what does the concentration approach?","options":[{"t":"3 g/L","_n":"w557","_k":"53379088"},{"t":"Nothing: it keeps growing without limit","_n":"x587","_k":"555080f6"},{"t":"300 g/L","_n":"y577","_k":"53d46678"},{"t":"30 g/L","_n":"z5a7","_k":"0fed9f02"}],"explain":"Salt grows without limit (300 g more every minute), but so does the volume (10 L more every minute). New salt arrives at 300 g per 10 L, which is 30 g/L, so `C(t) = {300t}/{100 + 10t} → 30`. The tank can never become saltier than what’s pouring in. 300 g is the salt added per \u003cstrong>minute\u003c/strong>, not per litre, and 30 ÷ 10 mixes up a concentration with a flow rate."},{"id":"p4","start":{"mode":"conc","tank":"giant","V0":100,"C0":50,"cin":10,"r":10,"t":0},"prompt":"The tank starts with 100 L of brine at 50 g/L. Weaker brine, at 10 g/L, pours in at 10 L/min. Which describes the graph of the concentration?","options":[{"t":"It falls toward 0 g/L","_n":"10597","_k":"6129d838"},{"t":"It falls below 10 g/L, then rises back up to 10","_n":"115c7","_k":"35e2736b"},{"t":"It falls toward 10 g/L, always staying above 10","_n":"125b7","_k":"ea1d77ea"},{"t":"It falls in a straight line until it reaches 10 g/L, then stays there","_n":"135a7","_k":"d6b853cf"}],"explain":"`C(t) = {5000 + 100t}/{100 + 10t} = {500 + 10t}/{10 + t} = 10 + {400}/{10 + t}`. The leftover `400/(10 + t)` is positive and shrinking, so `C` falls toward 10 from above and never reaches it. Mixing two liquids can’t give something weaker than both of them. It can’t fall at a steady rate either: the gap is 4000 ÷ (the volume), so when the volume doubles from 100 L to 200 L, the gap halves from 40 to 20."}],"challenges":[{"id":"tc1","goal":1,"start":{"mode":"cost","F":600,"v":5,"x":200,"view":"mid"},"prompt":"Set `F` and `v` so that the long-run average cost is $9, and 200 items have an average cost of $15.","why":"`v = 9` sets the long-run value, and the $6 share of the setup at 200 items gives `F/200 = 6`, so `F = 1200`. Check: `(1200 + 9 × 200)/200 = 3000/200` = $15.","fb":{"v15":"$15 is the average at 200 items, not the long-run value. The long-run value is the asymptote `y = v`, so `v = 9`.","onDot":"Your curve passes through the target dot, but its asymptote is %ha%. The long-run value must be $9.","F3000":"With `F = 3000` the average at 200 items is $24. $3000 is the whole \u003cstrong>total\u003c/strong> cost of 200 items at $15, but $9 × 200 = $1800 of that is the cost of making them. The setup is the rest.","F1800":"$1800 is the cost of \u003cstrong>making\u003c/strong> 200 items at $9. The setup is what’s left of the $3000 total.","vRight":"`v` is right. At 200 items your average is %avg%. The share of the setup must be $15 − $9 = $6 per item.","other":"Set the long-run value first (which slider is it?), then make 200 items average $15."},"hints":["The long-run value is the horizontal asymptote. Which slider sets it?","`v = 9`. At 200 items the average is $15, so each item carries a $6 share of the setup.","`F/200 = 6`, so `F = 1200`. Check: `(1200 + 9 × 200)/200 = 3000/200` = $15."]},{"id":"tc2","goal":3,"start":{"mode":"conc","tank":"real","V0":100,"C0":0,"cin":30,"r":10,"t":10},"prompt":"The tank starts with pure water. Set it up so the concentration approaches 40 g/L in the long run and is exactly 20 g/L after 10 minutes, without the tank overflowing first.","why":"From pure water, `C(t) = {40rt}/{V_0 + rt}` is exactly half of 40 when `rt = V_0`. At `t = 10` that needs `V_0 = 10r`, and with `r` from 2 to 15 the tank holds `2V_0` ≤ 300 L at 10 min, so it hasn’t overflowed.","fb":{"c20":"With brine at 20 g/L the tank approaches 20 g/L but never reaches it. The long-run value is the incoming strength, so `c_{in} = 40`.","overflow":"Your numbers work on paper, but the tank is full at %tf%, before 10 minutes. Use a smaller flow rate.","half":"Starting from pure water, the tank is at half of 40 when the brine added equals the water you started with: `rt = V_0`. Yours gets there at %th%. You need 10 min.","other":"Set the long-run value first (which slider is it?), then make the tank reach half of it at 10 minutes."},"hints":["Which slider sets the long-run value? Set it first.","From pure water, `C(t) = {40rt}/{V_0 + rt}`. This is exactly half of 40 when `rt = V_0`: the brine added equals the water you started with.","At `t = 10` you need `10r = V_0`, for example `r = 5` and `V_0 = 50`. The tank then holds 100 L at 10 min, so it hasn’t overflowed."]},{"id":"tc3","goal":5,"stretch":true,"start":{"mode":"cmp","FA":1600,"vA":6,"FB":1000,"vB":8,"x":400,"view":"mid"},"prompt":"Plan A is fixed: $1600 setup and $6 per item. Set Plan B so that the two plans have the \u003cstrong>same average cost at exactly 400 items\u003c/strong>, and \u003cstrong>Plan B is cheaper per item in the long run\u003c/strong>.","why":"Equal averages at 400 items means equal totals: `F_{B}` + 400`v_{B}` = 1600 + 6 × 400 = 4000, with `v_{B}` less than 6. (2000, 5), (2400, 4) and (2800, 3) all work.","fb":{"same":"Plan B is now the same as Plan A, so the curves lie on top of each other. They’re equal everywhere, but B isn’t cheaper in the long run.","above":"The plans do meet at 400 items, but Plan B’s asymptote is %ha%, above Plan A’s `y = 6`, so B costs more in the long run. Make `v_{B}` less than 6.","never":"A smaller per-item cost \u003cstrong>and\u003c/strong> a setup no bigger than A’s: Plan B is cheaper for every number of items, so the plans never meet.","meet":"The plans meet at %meet% items, not 400.","v6":"With the same per-item cost the curves never meet: one plan is always cheaper by its setup difference ÷ `x`.","other":"Plan B approaches $%vB% in the long run, more than $6. Start by choosing `v_{B}` less than 6."},"hints":["At the same number of items, equal average costs means equal total costs. Why?","At 400 items, Plan A’s total is 1600 + 6 × 400 = $4000. So Plan B needs `F_{B}` + 400`v_{B}` = 4000, with `v_{B}` less than 6.","Try `v_{B}` = 5: `F_{B}` = 4000 − 2000 = 2000. Both plans average $10 at 400 items, and B approaches $5 instead of $6. (`v_{B}` = 4 with $2400, and `v_{B}` = 3 with $2800, also work.)"]}]},"part3":{"slug":"meaning","name":"Meaning","heading":"What does the asymptote mean here?","intro":"Pick a situation. Tap each marked feature on the graph and choose what it means. Some features mean something real; some don’t. Then check your thinking with the algebra.","ui":{"zoomOut":"Zoom out","zoomIn":"Zoom in near the vertical asymptote","outside":"outside the situation","algTitle":"Check it with algebra","algLocked":"Answer all three features of this situation to unlock the algebra.","pick":"Tap a marked feature on the graph, or choose one from the list under it.","tryAgain":"try again","steps":["Split the top","Split the fraction","Read it","Which side?","Meaning of the leftover’s numerator","Try an input"],"read":"The first number is the horizontal asymptote; the fraction is the leftover.","side":"In the domain, the leftover is positive for the boat (above `t = 0`), negative for free throws (below 100%) and negative for the pipes (below 6 h).","note":"The 8 is Aisha’s misses. The 36 is 6 × 6, pipe A’s time multiplied by itself.","splitTop":"Write the numerator as a multiple of the denominator plus what’s left:","samples":"Sample values:","gapIs":"The leftover, %l%, is the highlighted gap."},"sits":[{"id":"boat","name":"Boat","x":"s","y":"t","xu":"km/h","yu":"h","story":"A tour boat travels 24 km up a river against a 3 km/h current. Its speed in still water is `s` km/h, so it moves upstream at `s - 3` km/h. The trip takes `t(s) = {24}/{s - 3}` hours.","feats":[{"id":"va","label":"Vertical asymptote `s = 3`","q":"What does `s = 3` mean here?","options":[{"t":"The trip takes 3 hours.","fb":"`s = 3` is a speed, not a time, and `t(3)` isn’t even defined.","_n":"145b7","_k":"fe636e8b"},{"t":"A boat only a little faster than the current takes a very long time; at 3 km/h it makes no progress at all.","fb":"Right. As `s → 3^{+}`, `s - 3 → 0^{+}` and `t → ∞`. At exactly 3 km/h the boat just holds its place.","_n":"155c7","_k":"166d06cc"},{"t":"Nothing: it’s outside the situation.","fb":"`s = 3` is the \u003cstrong>edge\u003c/strong> of the domain `s > 3`, so it does describe the situation: it’s where the model breaks down.","_n":"165d7","_k":"1262a2db"},{"t":"The boat can’t go faster than 3 km/h.","fb":"It’s the other way round: the domain is `s > 3`. The boat must beat the current to get anywhere.","_n":"17567","_k":"c9509588"}]},{"id":"ha","label":"Horizontal asymptote `t = 0`","q":"What does `t = 0` mean here?","options":[{"t":"At `s = 0` the trip takes no time.","fb":"At `s = 0` the current carries the boat backward; `s = 0` is outside the domain.","_n":"18577","_k":"2b8e4cc2"},{"t":"The current stops.","fb":"The current is fixed at 3 km/h in this model.","_n":"19587","_k":"095ca1a4"},{"t":"A very fast boat takes very little time, but never zero time.","fb":"Right. As `s → ∞`, `t → 0^{+}`.","_n":"1a597","_k":"f9c56d5a"},{"t":"The boat doesn’t move.","fb":"A boat that doesn’t move never arrives. `t = 0` is approached by very \u003cstrong>fast\u003c/strong> boats.","_n":"1b627","_k":"dbb30a98"}]},{"id":"branch","label":"The faded branch (`s \u003c 3`)","q":"What does the faded part of the graph show?","options":[{"t":"Nothing real: a boat slower than the current never gets upstream, so these negative “times” have no meaning.","fb":"Right. The formula still gives numbers, but they describe nothing in the story.","_n":"1c637","_k":"e8c2a5df"},{"t":"The time for the trip back downstream.","fb":"Downstream the current helps, so that time is `24/(s + 3)`, a different function.","_n":"1d607","_k":"8c884e5c"},{"t":"Trips that end before they start.","fb":"There’s no such thing as a negative trip time. This branch is simply outside the domain.","_n":"1e5f7","_k":"8c955a92"}]}],"alg":{"top":"`24 = 0 × (s - 3) + 24`","frac":"`t = 0 + {24}/{s - 3}`","samples":"`s` = 5, 7, 11, 27 → 12, 6, 3, 1 h"}},{"id":"ft","name":"Free throws","x":"n","y":"P","xu":"","yu":"","story":"Aisha has made 12 of her first 20 free throws. If she makes her next `n` shots in a row, her success rate is `P(n) = {12 + n}/{20 + n}`.","feats":[{"id":"pt","label":"The point (0, 0.6)","q":"What does (0, 0.6) mean here?","options":[{"t":"She needs 0.6 more shots.","fb":"0.6 is a rate (60%), not a number of shots.","_n":"1f5e7","_k":"de9bf2aa"},{"t":"Her success rate right now: 12 of 20 is 60%.","fb":"Right. `n = 0` means no new shots yet.","_n":"1g5d7","_k":"4607f251"},{"t":"Her rate in the long run.","fb":"That’s the horizontal asymptote, far to the right. (0, 0.6) is where she starts.","_n":"1h5c7","_k":"aecca66e"},{"t":"She has missed 60% of her shots.","fb":"She has \u003cstrong>made\u003c/strong> 60%: 12 of 20. She has missed 8, which is 40%.","_n":"1i5b7","_k":"c2b10852"}]},{"id":"ha","label":"Horizontal asymptote `P = 1`","q":"What does `P = 1` mean here?","options":[{"t":"She needs 1 more shot to be perfect.","fb":"`P = 1` is a rate (100%), not a number of shots.","_n":"1j5a7","_k":"500c501a"},{"t":"Her rate can’t go above 60%.","fb":"Every shot she makes raises her rate above 60%; it heads toward 100%.","_n":"1k597","_k":"4ac8f6df"},{"t":"If she keeps scoring, her rate gets closer and closer to 100%, but her 8 misses mean it never reaches it.","fb":"Right. `{12 + n}/{20 + n}` is always 8 short of a perfect record.","_n":"1l687","_k":"d8be2dff"},{"t":"After enough shots she’ll be perfect: 100%.","fb":"Her 8 misses never go away, so the top is always 8 less than the bottom.","_n":"1m677","_k":"24663f12"}]},{"id":"va","label":"Vertical asymptote `n = -20`","q":"What does `n = -20` mean here?","options":[{"t":"Nothing in this situation: `n` counts shots she makes from now on, so it can’t be negative.","fb":"Right. It’s only where the formula’s `20 + n` would be 0.","_n":"1n668","_k":"4247ac52"},{"t":"Her rate becomes infinite at some point.","fb":"A success rate is always between 0 and 1. The vertical asymptote is outside the domain, so the infinite values never happen.","_n":"1o678","_k":"af9b8f19"},{"t":"She can take at most 20 more shots.","fb":"Nothing limits her shots; the domain is `n ≥ 0` with no upper end.","_n":"1p648","_k":"cb85e389"},{"t":"After 20 misses her rate is undefined.","fb":"`n` counts shots she \u003cstrong>makes\u003c/strong>, not misses. Missing shots would be a different model.","_n":"1q658","_k":"05ef7f7d"}]}],"alg":{"top":"`12 + n = (20 + n) - 8`","frac":"`P = 1 - {8}/{20 + n}`","samples":"`n` = 20, 60, 140 → 80%, 90%, 95%"}},{"id":"pipes","name":"Two pipes","x":"x","y":"T","xu":"h","yu":"h","story":"Pipe A fills a pool in 6 h on its own. Pipe B would fill it in `x` hours on its own. Each hour A fills 1/6 of the pool and B fills `1/x`, so together they fill it in `T(x) = {6x}/{x + 6}` hours.","feats":[{"id":"ha","label":"Horizontal asymptote `T = 6`","q":"What does `T = 6` mean here?","options":[{"t":"Pipe B takes 6 h on its own.","fb":"`x` is pipe B’s time on its own; 6 h is pipe \u003cstrong>A\u003c/strong>’s.","_n":"1r6a8","_k":"89ebafae"},{"t":"Together they always take exactly 6 h.","fb":"With `x = 6` they take 3 h. 6 h is only approached when `x` is huge.","_n":"1s6b8","_k":"7d9e7b78"},{"t":"If pipe B is very slow, filling takes almost as long as pipe A alone: just under 6 h.","fb":"Right. A very slow pipe B adds almost nothing, but it always helps a little.","_n":"1t688","_k":"c526ed7e"},{"t":"Adding pipe B makes the job take longer than 6 h.","fb":"A second pipe can only help: `T(x)` is always less than 6.","_n":"1u698","_k":"21aa5cad"}]},{"id":"pt","label":"The point (6, 3)","q":"What does (6, 3) mean here?","options":[{"t":"Each pipe works for 3 h, then stops.","fb":"Both pipes run the whole time; together they finish in 3 h.","_n":"1v5e8","_k":"93d5ff13"},{"t":"Pipe B takes 3 h on its own.","fb":"The first coordinate, 6, is pipe B’s own time.","_n":"1w5f8","_k":"211cedad"},{"t":"Together they take 6 + 6 = 12 h.","fb":"Adding a pipe can’t make the job slower. Rates add, not times.","_n":"1xec8","_k":"646959bf"},{"t":"If pipe B also takes 6 h alone, together they take 3 h: twice the rate, half the time.","fb":"Right. 1/6 + 1/6 = 1/3 of the pool per hour.","_n":"1yeb8","_k":"0d480c08"}]},{"id":"dom","label":"Domain","q":"Which domain fits the situation?","options":[{"t":"`{x ∈ ℝ | x ≠ -6}`","fb":"That’s only the formula’s restriction. The story also rules out times that are 0 or negative.","_n":"1zee8","_k":"864254c7"},{"t":"`{x ∈ ℝ | x ≥ 0}`","fb":"`x = 0` would mean pipe B fills the pool instantly, which is impossible.","_n":"20ed8","_k":"89f05561"},{"t":"`{x ∈ ℝ | x > 0}`","fb":"Right. Pipe B’s time on its own must be positive.","_n":"21e88","_k":"6a004953"},{"t":"`{x ∈ ℝ | x > 6}`","fb":"Pipe B can be faster than pipe A, so `x` can be less than 6.","_n":"22e78","_k":"8fdadae4"}]}],"alg":{"top":"`6x = 6(x + 6) - 36`","frac":"`T = 6 - {36}/{x + 6}`","samples":"`x` = 3, 6, 12, 30 → 2, 3, 4, 5 h"}}],"blocks":[{"title":"What the asymptotes mean","html":"\u003cp>\u003cstrong>Reading a rational model in context\u003c/strong>\u003c/p>\u003col>\u003cli>\u003cstrong>Domain first.\u003c/strong> Keep only the inputs that make sense: no negative times or counts, whole numbers for items and shots, and stop when a tank is full.\u003c/li>\u003cli>\u003cstrong>Horizontal asymptote:\u003c/strong> the long-run value, approached as the input grows, if the domain goes on that far.\u003c/li>\u003cli>\u003cstrong>Vertical asymptote at the edge of the domain:\u003c/strong> the model breaks down there. Something becomes impossible or takes forever.\u003c/li>\u003cli>\u003cstrong>Vertical asymptote outside the domain:\u003c/strong> no meaning in the situation. It’s only where the formula would divide by 0.\u003c/li>\u003cli>\u003cstrong>Asymptote + leftover:\u003c/strong> the sign of the leftover tells you which side; its size tells you how far.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Long run, breakdown or no meaning?","summary":"Long run, breakdown or no meaning?","items":[{"id":"q1","goal":2,"prompt":"Average cost of `x` posters: `A(x) = {500 + 4x}/{x}`. The asymptote `y = 4`.","choices":[{"t":"Long-run value","fb":"Right. As `x` grows, the $500 share shrinks and the average approaches $4, the cost to print one poster.","_n":"23ea8","_k":"16a9b11c"},{"t":"Model breaks down","fb":"`y = 4` is a horizontal asymptote: it describes very large `x`, and `x` can be as large as you like. It’s the long-run average cost.","_n":"24e98","_k":"933f85e0"},{"t":"No meaning here","fb":"`y = 4` is a horizontal asymptote: it describes very large `x`, and `x` can be as large as you like. It’s the long-run average cost.","_n":"25e48","_k":"df2a0578"}]},{"id":"q2","goal":2,"prompt":"A drone flies 12 km against a 20 km/h wind at `s` km/h (its speed in still air): `t(s) = {12}/{s - 20}`. The asymptote `s = 20`.","choices":[{"t":"Long-run value","fb":"`s = 20` is the edge of the domain `s > 20`. A drone only just faster than the wind barely moves forward, so the model breaks down there.","_n":"26e38","_k":"0c781e74"},{"t":"Model breaks down","fb":"Right. The domain is `s > 20`, and as `s → 20^{+}` the trip takes longer and longer.","_n":"27525","_k":"9fdbfc5c"},{"t":"No meaning here","fb":"`s = 20` is the edge of the domain `s > 20`. A drone only just faster than the wind barely moves forward, so the model breaks down there.","_n":"28535","_k":"f2858c25"}]},{"id":"q3","goal":2,"prompt":"Salt concentration `C(t) = {20t}/{50 + t}`, `t` in minutes from the start. The asymptote `t = -50`.","choices":[{"t":"Long-run value","fb":"`t = -50` is 50 minutes before anything happened. It’s outside the domain, so it has no meaning in the situation.","_n":"29545","_k":"a1d2bd9b"},{"t":"Model breaks down","fb":"`t = -50` is 50 minutes before anything happened. It’s outside the domain, so it has no meaning in the situation.","_n":"2a555","_k":"94495c76"},{"t":"No meaning here","fb":"Right. `t = -50` is before the start; the model only describes `t ≥ 0`.","_n":"2b565","_k":"45fe6981"}]},{"id":"q4","goal":2,"prompt":"Medicine in the blood: `C(t) = {30t}/{t^2 + 9}` mg/L, `t` hours after a dose. The asymptote `C = 0`.","choices":[{"t":"Long-run value","fb":"Right. The denominator has the higher degree, so `C → 0` as `t` grows: in the long run the medicine leaves the blood.","_n":"2c575","_k":"e964fb2d"},{"t":"Model breaks down","fb":"`C = 0` is a horizontal asymptote, about large `t`, which is inside the domain. It says the medicine eventually leaves the blood.","_n":"2d585","_k":"6e568b92"},{"t":"No meaning here","fb":"`C = 0` is a horizontal asymptote, about large `t`, which is inside the domain. It says the medicine eventually leaves the blood.","_n":"2e595","_k":"2967df0e"}]}]}},"practice":{"activities":[{"id":"build","type":"custom","title":"Build the model","summary":"Build the model","goal":1,"instruction":"Read each situation and fill in the boxes to complete its model.","how":"Type a number in each box, then press Check. Each box takes whole numbers.","general":"Not quite. Ask: what is being divided by what? Which numbers change as the input grows?","whole":"Each box takes whole numbers.","empty":"Fill in every box first.","same":"Same model as %m%.","items":[{"id":"b1","goal":1,"prompt":"A bakery spends $900 on a new oven, and each cake costs $6 in ingredients. Average cost per cake for `x` cakes.","tpl":"A(x) = {[0] + [1]x}/{x}","form":"A(x) = {%0 + %1x}/{x}","_a":"bAxWCBgGZQ==","wrong":[{"match":[6,900],"fb":"Swapped. The setup is shared among the cakes, so it’s the term \u003cstrong>not\u003c/strong> multiplied by `x`."}],"hints":["What is divided by what? Name the top and the bottom in words.","Write the top and the bottom as expressions in the input.","`A(x) = {900 + 6x}/{x}`: the $900 oven is shared among the cakes, and each cake adds $6 in ingredients."]},{"id":"b2","goal":1,"prompt":"A tank holds 40 L of pure water. Brine with 15 g of salt per litre flows in at 2 L/min.","tpl":"C(t) = {[0]t}/{[1] + [2]t}","form":"C(t) = {%0t}/{%1 + %2t}","_a":"bAZWFAAAFAtq","ratio":true,"wrong":[{"match":[15,40,2],"fb":"15 g/L is the brine’s strength. Each minute 2 L arrive, carrying 2 × 15 = 30 g of salt."},{"box":2,"val":0,"fb":"The volume grows by 2 L every minute."}],"hints":["Concentration = salt ÷ volume. Write each as a function of `t`.","Volume: `40 + 2t` litres. Salt: each minute 2 L of brine bring 2 × 15 = 30 g.","`C(t) = {30t}/{40 + 2t}`."]},{"id":"b3","goal":1,"prompt":"A goalie has stopped 45 of the 60 shots she has faced. She then stops the next `n` shots.","tpl":"S(n) = {[0] + n}/{[1] + n}","form":"S(n) = {%0 + n}/{%1 + n}","_a":"bAFTFAIAZQ==","wrong":[{"box":0,"val":15,"fb":"15 is the number of goals she let in. The top counts saves; the bottom counts all shots faced."},{"box":1,"val":15,"fb":"15 is the number of goals she let in. The top counts saves; the bottom counts all shots faced."}],"hints":["What is divided by what? Name the top and the bottom in words.","Write the top and the bottom as expressions in the input.","`S(n) = {45 + n}/{60 + n}`: each save in a row adds 1 to the saves and 1 to the shots faced."]},{"id":"b4","goal":1,"prompt":"A ferry travels 30 km downstream on a river with a 4 km/h current. Its speed in still water is `s` km/h.","tpl":"t(s) = {[0]}/{s + [1]}","form":"t(s) = {%0}/{s + %1}","_a":"bAZWFABt","wrong":[{"box":1,"val":-4,"fb":"Downstream the current pushes the ferry along, so its speed is `s + 4`."}],"hints":["What is divided by what? Name the top and the bottom in words.","Write the top and the bottom as expressions in the input.","`t(s) = {30}/{s + 4}`: time = distance ÷ speed, and downstream the 4 km/h current adds to the ferry’s speed."]},{"id":"b5","goal":1,"prompt":"A large tank holds 200 L of salt water at 50 g/L. Pure water flows in at 5 L/min.","tpl":"C(t) = {[0]}/{[1] + [2]t}","form":"C(t) = {%0}/{%1 + %2t}","_a":"bARWCAQAFAsHBUoNaQ==","ratio":true,"wrong":[{"match":[50,200,5],"fb":"50 g/L is a concentration. The salt in the tank is 50 × 200 = 10 000 g, and pure water adds none."}],"hints":["How much salt is in the tank at the start? Does pure water add any?","Salt: 50 × 200 = 10 000 g, and it stays 10 000 g. Volume: `200 + 5t` litres.","`C(t) = {10 000}/{200 + 5t}`. Its horizontal asymptote is `C = 0`: the tank gets more and more dilute."]},{"id":"b6","goal":1,"prompt":"Printer A finishes a job in 5 h on its own; printer B takes `x` h on its own. Together, `1/5 + 1/x = 1/T`.","tpl":"T(x) = {[0]x}/{x + [1]}","form":"T(x) = {%0x}/{x + %1}","_a":"bABKDWk=","wrong":[{"box":0,"val":1,"fb":"Add first: `1/5 + 1/x = {x + 5}/{5x}`. Then flip both sides: `T = {5x}/{x + 5}`."}],"hints":["What is divided by what? Name the top and the bottom in words.","Write the top and the bottom as expressions in the input.","`T(x) = {5x}/{x + 5}`: adding gives `1/5 + 1/x = {x + 5}/{5x}`, and flipping both sides gives `T`."]},{"id":"b7","goal":3,"prompt":"A museum trip: the bus costs $840, shared equally, plus $18 admission per student. Write the cost per student in asymptote + leftover form.","tpl":"A(n) = [0] + {[1]}/{n}","form":"A(n) = %0 + {%1}/{n}","_a":"bAReFAwECGQ=","wrong":[{"match":[840,18],"fb":"The leftover is the shared part, `840/n`. The asymptote is what every student pays no matter how many go: $18."}],"hints":["What is divided by what? Name the top and the bottom in words.","Write the top and the bottom as expressions in the input.","`A(n) = 18 + {840}/{n}`: every student pays the $18 admission, plus an equal share of the $840 bus."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the Error","student":"Nadia","how":"","instruction":"Nadia made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"A soccer team has won 15 of its 25 games. How many wins in a row would raise its winning rate to 80%?","steps":["After `n` more wins in a row, the team has `15 + n` wins in `25 + n` games, so `W(n) = {15 + n}/{25 + n}`.","Set `{15 + n}/{25 + n} = 0.8`.","Multiply both sides by `25 + n`: `15 + n = 20 + n`.","Subtract `n`: 15 = 20, which is false.","So the team can never reach 80%."],"_a":"BQ==","stepFb":["Step 1 is correct: both the wins and the games go up by `n`. Keep checking the steps after it.","Step 2 is correct: 80% is 0.8.","","Step 4 follows from step 3. The mistake is earlier.","Step 5 follows from step 4. The mistake is earlier."],"fixes":[{"t":"`15 + n = 0.8(25 + n) = 20 + 0.8n`, so `0.2n = 5` and `n = 25`.","why":"The 0.8 multiplies both terms. Check: 40 wins in 50 games is 80%.","_n":"2f5a5","_k":"e6d2b5da"},{"t":"`15 + n = 20 + 0.8`, so `n = 5.8`: about 6 wins.","why":"The 0.8 has to multiply `n`, not stand alone: `0.8(25 + n) = 20 + 0.8n`.","_n":"2g5b5","_k":"bd23950f"},{"t":"Step 3 is correct as written.","why":"Test it: with `n = 25` the rate is 40/50 = 0.8, so 80% \u003cstrong>is\u003c/strong> reachable. `0.8(25 + n)` is `20 + 0.8n`, not `20 + n`.","_n":"2hd86","_k":"0ca839c8"},{"t":"`15 + n = 20 + 0.8n`, so `1.8n = 5` and `n ≈ 2.8`: about 3 wins.","why":"Subtract `0.8n` from both sides: `n - 0.8n = 0.2n`, not `1.8n`.","_n":"2id76","_k":"f700112e"}],"hints":["Check each step’s algebra. Does every term get multiplied?","In step 3, `0.8(25 + n)` must multiply both 25 and `n`.","Step 3 is wrong: `15 + n = 20 + 0.8n`, so `0.2n = 5` and `n = 25`."]},{"id":"e2","goal":2,"task":"A large tank holds 100 L of brine at 40 g/L. Brine at 10 g/L flows in at 5 L/min. Interpret the asymptotes of the concentration model.","steps":["Salt: 40 × 100 + 10 × 5`t` = `4000 + 50t` grams. Volume: `100 + 5t` litres.","`C(t) = {4000 + 50t}/{100 + 5t}`.","Horizontal asymptote: `C = 50/5 = 10`. In the long run the concentration approaches 10 g/L, the strength of the incoming brine.","Vertical asymptote: `t = -20`. So 20 minutes after the start, the concentration shoots up to infinity.","So the model can only be used for `0 ≤ t \u003c 20`."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: salt ÷ volume.","Step 3 is correct, and its meaning is right too.","","Step 5 follows from step 4. The mistake is earlier."],"fixes":[{"t":"`t = -20` means the tank was empty 20 minutes before the start.","why":"The formula’s volume `100 + 5t` is 0 at `t = -20`, but the model only describes `t ≥ 0`. Before the pump started, nothing was flowing at 5 L/min, so the model says nothing about the past. Run it backward anyway and it claims 4000 − 1000 = 3000 g of salt in 0 L of water, which is impossible.","_n":"2jd66","_k":"e63c3124"},{"t":"The vertical asymptote is `t = 20`, so the model can be used only until `t = 20`.","why":"`100 + 5t = 0` gives `t = -20`, not 20. And at `t = 20` nothing special happens: `C(20) = 5000/200` = 25 g/L.","_n":"2kd56","_k":"f50cd29e"},{"t":"Step 4 is correct as written.","why":"`C(20) = 5000/200` = 25 g/L, an ordinary value. And a −20 can’t describe 20 minutes \u003cstrong>after\u003c/strong> the start.","_n":"2ldc6","_k":"ee95eccb"},{"t":"`t = -20` is before the start, outside the domain `t ≥ 0`, so it has no meaning here. The model works from `t = 0` until the tank is full.","why":"The vertical asymptote is only where the formula’s volume would be 0.","_n":"2mdb6","_k":"77d95e28"}],"hints":["Which values of `t` does this situation actually include?","`t` counts minutes after the pump starts, so `t ≥ 0`. Where is `t = -20`?","Step 4 is wrong: `t = -20` is before the start, so this asymptote has no meaning in the situation."]},{"id":"e3","goal":5,"task":"Plan A: $300 setup and $12 per shirt. Plan B: $900 setup and $8 per shirt. For which numbers of shirts is Plan B cheaper per shirt?","steps":["Average costs: `A(x) = {300 + 12x}/{x}` and `B(x) = {900 + 8x}/{x}`.","Plan B is cheaper when `{900 + 8x}/{x} \u003c {300 + 12x}/{x}`.","Multiply both sides by `x`. Multiplying an inequality reverses it: `900 + 8x > 300 + 12x`.","`600 > 4x`, so `x \u003c 150`.","Plan B is cheaper for fewer than 150 shirts."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: “cheaper” means a smaller average.","","Step 4 follows from step 3. The mistake is earlier.","Step 5 follows from step 4. The mistake is earlier."],"fixes":[{"t":"Multiply by `x` and keep the direction: `900 + 8x \u003c 300 + 12x`, so `600 \u003c 4x` and `x \u003c 150`.","why":"The direction is now right, but `600 \u003c 4x` means `4x` is \u003cstrong>bigger\u003c/strong> than 600: `x > 150`.","_n":"2nda6","_k":"593aff73"},{"t":"`x` is a number of shirts, so `x > 0`, and multiplying by a positive number keeps the direction: `900 + 8x \u003c 300 + 12x`, so `600 \u003c 4x` and `x > 150`. Plan B is cheaper for more than 150 shirts.","why":"Only multiplying by a \u003cstrong>negative\u003c/strong> number reverses an inequality.","_n":"2od96","_k":"97ab9eb9"},{"t":"Step 3 is correct as written.","why":"Test `x = 200`: `A(200)` = $13.50 and `B(200)` = $12.50, so B is cheaper at 200 shirts, but step 5 says B is cheaper only below 150.","_n":"2pe06","_k":"fbf3432b"},{"t":"Don’t multiply at all: compare the setups. 900 > 300, so Plan B is never cheaper.","why":"The setup is only part of the story. For many shirts, B’s lower $8 per shirt wins.","_n":"2qdf6","_k":"5c9cacf3"}],"hints":["When does multiplying an inequality reverse it?","Only multiplying by a negative number reverses it. Is `x` positive or negative here?","Step 3 is wrong: `x > 0`, so `900 + 8x \u003c 300 + 12x`, which gives `x > 150`."]}]},{"id":"answer","type":"custom","title":"Answer the question","summary":"Answer the question","star":true,"goal":4,"instruction":"Each question needs more than one step. Answer in the boxes, then press Check.","how":"Type a number in each box. Decimals are fine where a box says so.","general":"Check each step against the story, then try again.","empty":"Fill in every box first. Use numbers such as 25 or 3.75.","senseHead":"Sense check: does your answer fit the story?","items":[{"id":"r1","goal":4,"prompt":"A print shop’s average cost per poster is `A(x) = {640 + 2x}/{x}` dollars. How many posters bring the average cost down to exactly $4?","boxes":[{"id":"x","label":"posters"}],"_a":"TBceGg4DCglK","wrong":[{"box":"x","val":160,"fb":"640 ÷ 4 forgets the $2 each poster costs to make. The share of the setup must be $4 − $2 = $2."},{"box":"x","val":106.7,"tol":0.05,"fb":"You added the $2 instead of subtracting it: the share is 4 − 2, not 4 + 2."},{"box":"x","val":107,"fb":"You added the $2 instead of subtracting it: the share is 4 − 2, not 4 + 2."}],"sense":"320 posters: 640/320 = $2 share + $2 to print = $4.","hints":["Set `{640 + 2x}/{x} = 4` and multiply both sides by `x`.","`640 + 2x = 4x`, so `640 = 2x`.","`x` = 320 posters. Check: `(640 + 640)/320 = 4`."]},{"id":"r2","goal":4,"prompt":"For `A(x) = {1500 + 9x}/{x}` dollars, what is the smallest number of items that makes the average cost \u003cstrong>less than\u003c/strong> $9.40?","boxes":[{"id":"x","label":"items"}],"_a":"TBceGg4DDwwGSA==","wrong":[{"box":"x","val":3750,"fb":"At 3750 items the average is exactly $9.40, and the question says \u003cstrong>less than\u003c/strong>."},{"box":"x","val":160,"fb":"1500 ÷ 9.40 ≈ 160 ignores the $9 per item. The share of the setup must be less than $0.40."}],"sense":"3751 is a whole number, and the share 1500/3751 is just under $0.40.","hints":["`A(x) = 9 + {1500}/{x}`. What must the share `1500/x` be?","`1500/x \u003c 0.40`. `x` is positive, so multiply: `1500 \u003c 0.40x`, giving `x > 3750`.","The smallest whole number greater than 3750 is 3751."]},{"id":"r3","goal":4,"prompt":"A hockey goalie has saved 85% of the 200 shots he has faced. What is the smallest number of saves in a row that would bring her save percentage up to 90%?","boxes":[{"id":"x","label":"saves in a row"}],"_a":"TBceGg4BCAlK","wrong":[{"box":"x","val":10,"fb":"90% of 200 is 180, which is 10 more saves, but each save is also another shot faced, so the bottom grows too."}],"sense":"270 saves out of 300 shots is exactly 90%.","hints":["How many saves has he made so far? Write his save percentage after `n` more saves in a row.","He has 0.85 × 200 = 170 saves. After `n` more: `{170 + n}/{200 + n} ≥ 0.9`.","`170 + n ≥ 180 + 0.9n`, so `0.1n ≥ 10` and `n ≥ 100`. He needs 100 saves in a row."]},{"id":"r4","goal":[4,1],"prompt":"A 500 L tank starts with 100 L of pure water. Brine with 60 g/L flows in at 20 L/min. \u003cstrong>(a)\u003c/strong> After how many minutes is the concentration 45 g/L? \u003cstrong>(b)\u003c/strong> What is the highest concentration the tank reaches before it overflows?","boxes":[{"id":"a","label":"(a) minutes (decimals are fine)"},{"id":"b","label":"(b) g/L (decimals are fine)"}],"_a":"TBcHGg4BDRUVV0QCAAhF","wrong":[{"box":"a","val":3.75,"fb":"`1200t/100` forgets that the volume grows: it’s `100 + 20t` litres."},{"box":"b","val":60,"fb":"60 g/L is the long-run value, but the tank is full at `t` = 20 min, long before it gets close."},{"box":"b","val":50,"fb":"The tank is full when `100 + 20t = 500`, at `t = 20`, not 500 ÷ 20 = 25. It started with 100 L already in it."}],"sense":"At 15 min the tank holds 400 L, under 500 L, so (a) really happens. At 20 min it holds 500 L: `C` = 24 000 ÷ 500 = 48 g/L.","hints":["Write `C(t)` = salt ÷ volume. When is the tank full?","`C(t) = {1200t}/{100 + 20t}`. It’s full when `100 + 20t = 500`, at `t = 20`.","(a) `1200t = 45(100 + 20t)` gives `300t = 4500`, so `t = 15` (the tank holds 400 L then). (b) The highest value is at `t = 20`: 24 000/500 = 48 g/L."]},{"id":"r5","goal":5,"prompt":"A gym has three plans for a year. Plan A: $12 per visit. Plan B: $240 a year plus $4 per visit. Plan C: $600 a year with no charge per visit. \u003cstrong>(a)\u003c/strong> For how many visits do Plans A and B have the same average cost per visit? \u003cstrong>(b)\u003c/strong> Above how many visits does Plan C have the lowest average cost of all three?","boxes":[{"id":"a","label":"(a) visits"},{"id":"b","label":"(b) visits"}],"_a":"TBcHGg4DCBUVV0QCDQBF","wrong":[{"box":"b","val":50,"fb":"Above 50 visits C beats A, but it must also beat B. Compare C with B too."},{"box":"b","val":150,"fb":"`600/x \u003c 4` compares C with B’s long-run value, not with B itself. B’s average is `4 + 240/x`."},{"box":"b","val":30,"fb":"30 visits is where A and B are equal. Plan C isn’t involved there."}],"sense":"At 90 visits, B and C both average 600/90 ≈ $6.67 per visit and A is $12; above 90, C is lowest.","hints":["Write each plan’s average cost per visit for `x` visits.","`A = 12`, `B = 4 + {240}/{x}`, `C = {600}/{x}`. For (a), set `12 = 4 + {240}/{x}`.","(a) `240/x = 8`, so `x = 30`. (b) `C \u003c A` needs `x > 50`, and `C \u003c B` needs `600 \u003c 4x + 240`, so `x > 90`. Both hold above 90 visits."]},{"id":"r6","goal":3,"prompt":"A tank’s concentration, in g/L, after `t` minutes is `C(t) = {at + b}/{t + 20}`. It started at 5 g/L and approaches 35 g/L. \u003cstrong>(a)\u003c/strong> Find `a` and `b`. \u003cstrong>(b)\u003c/strong> When is the concentration exactly halfway from its starting value to its long-run value?","boxes":[{"id":"a","label":"(a) `a`"},{"id":"b","label":"(a) `b`"},{"id":"t","label":"(b) `t`, in minutes (decimals are fine)"}],"_a":"TBcHGg4DDRUVV0QCBQAIFRVBRAIGAEU=","wrong":[{"box":"b","val":5,"fb":"`C(0) = b/20`, so `b/20 = 5` and `b = 100`."},{"box":"t","val":14.3,"tol":0.05,"fb":"17.5 is half of 35, but halfway between 5 and 35 is 20 g/L."}],"sense":"`C(t) = 35 - {600}/{t + 20}`. The gap starts at 30 and halves when `t + 20` doubles, from 20 to 40, at `t = 20`.","hints":["The long-run value is the horizontal asymptote, and the start is `C(0)`.","Horizontal asymptote: `a/1 = 35`, so `a = 35`. Start: `C(0) = b/20 = 5`, so `b = 100`. Halfway between 5 and 35 is 20.","`{35t + 100}/{t + 20} = 20` gives `35t + 100 = 20t + 400`, so `15t = 300` and `t = 20` min."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the simulator: the long-run average cost, the tank’s concentration, or something else? Why?"},{"id":"j2","q":"In your own words, why can’t the average cost ever reach the cost of making one item?"},{"id":"j3","q":"Explain to a friend how to decide whether an asymptote means something in a word problem. Use the boat or the tank as your example."},{"id":"j4","q":"Which step of a rational word problem is still hardest for you: writing the model, solving it, or interpreting the answer? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A company’s average cost per item is `A(x) = {2400 + 15x}/{x}` dollars. What is its horizontal asymptote?","options":[{"t":"`y = 2400`","why":"2400 is the setup cost. It’s shared among more and more items, so its effect shrinks.","_n":"2r302","_k":"ec90d467"},{"t":"`x = 0`","why":"`x = 0` is the \u003cstrong>vertical\u003c/strong> asymptote. A horizontal asymptote is a line `y` = …","_n":"2s2f2","_k":"2ccd73cb"},{"t":"`y = 0`","why":"Each item still costs $15 to make, so the average never falls toward 0.","_n":"2t322","_k":"11adee5f"},{"t":"`y = 15`","why":"`A(x) = 15 + {2400}/{x}`, and `2400/x` shrinks toward 0 as `x` grows, so `A(x)` approaches 15.","_n":"2u312","_k":"1c2ab44a"}]},"b":{"prompt":"A company’s average cost per item is `A(x) = {1800 + 25x}/{x}` dollars. What is its horizontal asymptote?","options":[{"t":"`y = 1800`","why":"1800 is the setup cost, which gets shared away.","_n":"2v342","_k":"c7118b27"},{"t":"`x = 0`","why":"That’s the vertical asymptote.","_n":"2w332","_k":"741dff79"},{"t":"`y = 25`","why":"`A(x) = 25 + {1800}/{x}`, which approaches 25.","_n":"2x362","_k":"840d389c"},{"t":"`y = 0`","why":"The $25 per item never goes away.","_n":"2y352","_k":"84795d2d"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"A tank holds 40 L of pure water. Brine with 25 g of salt per litre flows in at 4 L/min. Which function gives the concentration, in g/L, after `t` minutes?","options":[{"t":"`C(t) = {100t}/{40 + 4t}`","why":"Each minute 4 L × 25 g/L = 100 g of salt arrive, and the volume grows by 4 L.","_n":"2z382","_k":"99ba47e4"},{"t":"`C(t) = {100t}/{40 + t}`","why":"The volume grows by 4 L per minute, not 1 L.","_n":"30372","_k":"a03663cd"},{"t":"`C(t) = {25t}/{40 + 4t}`","why":"25 is grams per \u003cstrong>litre\u003c/strong>. Each minute brings 4 L, so 100 g of salt.","_n":"314a2","_k":"79597ba7"},{"t":"`C(t) = {100t}/{40}`","why":"The volume doesn’t stay 40 L: it grows by 4 L every minute.","_n":"324b2","_k":"d395054f"}]},"b":{"prompt":"A tank holds 60 L of pure water. Brine with 30 g of salt per litre flows in at 5 L/min. Which function gives the concentration, in g/L, after `t` minutes?","options":[{"t":"`C(t) = {150t}/{60 + t}`","why":"The volume grows by 5 L per minute, not 1 L.","_n":"33482","_k":"992fc850"},{"t":"`C(t) = {30t}/{60 + 5t}`","why":"30 is grams per litre. Each minute brings 5 L, so 150 g.","_n":"34492","_k":"99386e36"},{"t":"`C(t) = {150t}/{60 + 5t}`","why":"Each minute 5 L × 30 g/L = 150 g of salt arrive, and the volume grows by 5 L.","_n":"35462","_k":"fdbc4913"},{"t":"`C(t) = {150t}/{60}`","why":"The volume grows by 5 L every minute.","_n":"36472","_k":"0944ea62"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A baseball player has 30 hits in 50 at-bats. To find how many hits in a row would raise his average to 0.800, solve `{30 + n}/{50 + n} = 0.8`.","options":[{"t":"10","why":"If you reached `0.2n = 10`, finish by dividing by 0.2: `n = 50`. If you took 0.8 × 50 = 40 hits, so 10 more, remember that every new hit is also a new at-bat: 40/60 ≈ 0.667, not 0.800.","_n":"37442","_k":"cff5c148"},{"t":"12.5","why":"That comes from `150 + 5n = 200 + n`: the 4 multiplied only the 50. `4(50 + n) = 200 + 4n`.","_n":"38452","_k":"f76e28e6"},{"t":"40","why":"0.8 × 50 = 40 is the number of hits he’d need out of his \u003cstrong>first\u003c/strong> 50 at-bats. Every new hit is also a new at-bat.","_n":"39422","_k":"b38309f8"},{"t":"50","why":"`30 + n = 0.8(50 + n) = 40 + 0.8n`, so `0.2n = 10` and `n = 50`. Check: 80/100 = 0.8.","_n":"3a432","_k":"b88e7c62"}]},"b":{"prompt":"A volleyball player has made 21 of 35 serves. To find how many good serves in a row would raise her rate to 0.75, solve `{21 + n}/{35 + n} = 0.75`.","options":[{"t":"5.25","why":"If you reached `0.25n = 5.25`, finish by dividing by 0.25: `n = 21`. If you took 0.75 × 35 = 26.25 good serves, so 5.25 more, remember that every new serve is also a new attempt.","_n":"3b441","_k":"8ad2f6a8"},{"t":"7","why":"That comes from `84 + 4n = 105 + n`: the 3 multiplied only the 35. `3(35 + n) = 105 + 3n`.","_n":"3c431","_k":"1ad25c82"},{"t":"21","why":"`4(21 + n) = 3(35 + n)`, so `84 + 4n = 105 + 3n` and `n = 21`. Check: 42/56 = 0.75.","_n":"3d421","_k":"608abb7b"},{"t":"26.25","why":"0.75 × 35 = 26.25 is the number of good serves out of her \u003cstrong>first\u003c/strong> 35. Every new serve is also a new attempt.","_n":"3e411","_k":"387c4236"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A tank’s concentration is `C(t) = {900 + 10t}/{30 + t}` g/L for `t ≥ 0`. Which describes the concentration over time?","options":[{"t":"It rises from 10 g/L toward 30 g/L","why":"That swaps the start and the long run. The start is `C(0) = 30`; the asymptote is 10/1 = 10.","_n":"3f481","_k":"0baed740"},{"t":"It falls from 30 g/L to below 10 g/L, then rises back to 10","why":"The leftover `600/(30 + t)` is positive for every `t ≥ 0`, so `C` never goes below 10.","_n":"3g471","_k":"193c2d22"},{"t":"It falls from 30 g/L toward 10 g/L, always staying above 10","why":"`C(0) = 900/30 = 30`, and `C(t) = 10 + {600}/{30 + t}`. The leftover is positive and shrinking.","_n":"3h461","_k":"4fdc3dd3"},{"t":"It falls from 30 g/L toward 0 g/L","why":"The asymptote is the ratio of leading coefficients, 10/1 = 10, not 0. The incoming brine keeps it at 10 or more.","_n":"3i451","_k":"3bae13ce"}]},"b":{"prompt":"A tank’s concentration is `C(t) = {200 + 40t}/{20 + t}` g/L for `t ≥ 0`. Which describes the concentration over time?","options":[{"t":"It rises from 10 g/L toward 40 g/L, always staying below 40","why":"`C(0) = 200/20 = 10`, and `C(t) = 40 - {600}/{20 + t}`. The leftover is negative and shrinking.","_n":"3j3c1","_k":"d96c95bd"},{"t":"It falls from 40 g/L toward 10 g/L","why":"That swaps the start and the long run. `C(0) = 10`.","_n":"3k3b1","_k":"6f7b621a"},{"t":"It rises from 10 g/L without any limit","why":"The salt keeps coming, but so does the volume. `C(t)` levels off at 40/1 = 40.","_n":"3lbe1","_k":"19aa04cd"},{"t":"It rises from 10 g/L past 40 g/L, then falls back to 40","why":"The leftover `-600/(20 + t)` is negative for every `t ≥ 0`, so `C` never goes above 40.","_n":"3mbf1","_k":"ed3cd737"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Plan A: $800 setup and $5 per item. Plan B: $2000 setup and $2 per item. For which numbers of items `x` is Plan B’s average cost lower?","options":[{"t":"`x > 1200`","why":"`3x = 1200` isn’t finished: divide by 3 to get 400.","_n":"3nc01","_k":"cbe46455"},{"t":"Never","why":"A bigger setup doesn’t decide it. At 1000 items, A averages $5.80 and B $4.00.","_n":"3oc11","_k":"360d9885"},{"t":"`x > 400`","why":"Equal averages mean equal totals: `800 + 5x = 2000 + 2x` at `x = 400`. Past that, B’s lower $2 per item wins.","_n":"3pc21","_k":"655ebd82"},{"t":"`x \u003c 400`","why":"That’s where Plan A is cheaper: B’s bigger setup dominates when it’s shared among few items.","_n":"3qc31","_k":"db7a13ad"}]},"b":{"prompt":"Plan A: $500 setup and $9 per item. Plan B: $1700 setup and $5 per item. For which numbers of items `x` is Plan B’s average cost lower?","options":[{"t":"`x > 1200`","why":"`4x = 1200` isn’t finished: divide by 4.","_n":"3rc41","_k":"5f699f75"},{"t":"`x > 300`","why":"`500 + 9x = 1700 + 5x` at `x = 300`. Past that, B’s lower $5 per item wins.","_n":"3sc51","_k":"d3ecfcd2"},{"t":"`x \u003c 300`","why":"That’s where Plan A is cheaper.","_n":"3tb61","_k":"8aae95de"},{"t":"Never","why":"At 1000 items, A averages $9.50 and B $6.70.","_n":"3ub71","_k":"07e3fd82"}]}},{"id":"t3","cat":"T","goal":1,"a":{"prompt":"A print shop’s average cost per banner is `A(x) = {1200 + 4x}/{x}` dollars, where `x` is the number of banners it makes in a day. Its machine can make at most 150 banners a day. The owner wants an average cost of at most $10 per banner. What should the owner conclude?","options":[{"t":"It can’t be done: even at the 150-banner limit the average is $12.","why":"An average of $10 or less needs `1200/x ≤ 6`, so `x ≥ 200`. The average falls as `x` grows, so in the domain `1 ≤ x ≤ 150` its lowest value is at the limit: `A(150) = 4 + 8` = $12, still above $10.","_n":"3vc82","_k":"3007a517"},{"t":"Make at least 120 banners a day; the average is then $10 or less.","why":"`1200/x ≤ 10` leaves out the $4 each banner costs to make. Only the setup share shrinks, so it must be at most $10 − $4 = $6.","_n":"3wc72","_k":"cbe7ad9a"},{"t":"Make at most 200 banners a day; the average is then $10 or less.","why":"`x` is positive, so multiplying by `x` keeps the direction: `1200 ≤ 6x`, so `x ≥ 200`, not `x ≤ 200`. Fewer banners make the average \u003cstrong>higher\u003c/strong>.","_n":"3xca2","_k":"d7b75063"},{"t":"Make at least 200 banners a day; the average is then $10 or less.","why":"`4 + 1200/x ≤ 10` does give `x ≥ 200`, but the machine stops at 150 banners. Check the answer against the domain, `1 ≤ x ≤ 150`.","_n":"3yc92","_k":"fef5f0a6"}]},"b":{"prompt":"A bakery’s average cost per cake is `A(x) = {1500 + 6x}/{x}` dollars, where `x` is the number of cakes it bakes in a week. Its ovens can bake at most 200 cakes a week. The owner wants an average cost of at most $12 per cake. What should the owner conclude?","options":[{"t":"Bake at least 250 cakes a week; the average is then $12 or less.","why":"`6 + 1500/x ≤ 12` does give `x ≥ 250`, but the ovens stop at 200 cakes. Check the answer against the domain, `1 ≤ x ≤ 200`.","_n":"3zc42","_k":"88e3bd0c"},{"t":"It can’t be done: even at the 200-cake limit the average is $13.50.","why":"An average of $12 or less needs `x ≥ 250`, beyond the 200-cake limit. The average falls as `x` grows, so the lowest it can be is `A(200) = 6 + 7.5` = $13.50.","_n":"40c32","_k":"f9968773"},{"t":"Bake at least 125 cakes a week; the average is then $12 or less.","why":"`1500/x ≤ 12` leaves out the $6 each cake costs to make. The setup share must be at most $12 − $6 = $6.","_n":"41c62","_k":"d1f17b64"},{"t":"Bake at most 250 cakes a week; the average is then $12 or less.","why":"Multiplying by the positive `x` keeps the direction: `1500 ≤ 6x`, so `x ≥ 250`. Fewer cakes make the average \u003cstrong>higher\u003c/strong>.","_n":"42c52","_k":"f44ee320"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why the average cost `A(x) = {900 + 6x}/{x}` is always more than $6?","options":[{"t":"`A(x) = 6 + {900}/{x}`. For every number of items, the share `900/x` is positive, so the average is always $6 plus something.","why":"It rewrites the model and explains why the leftover keeps the average above 6.","_n":"43c02","_k":"29c086ff"},{"t":"Because `y = 6` is an asymptote, and a graph can never cross its horizontal asymptote.","why":"Graphs can cross horizontal asymptotes: `y = x/(x^2 + 1)` has asymptote `y = 0` and passes through (0, 0). The reason here is the positive share `900/x`.","_n":"44bf2","_k":"d56b7396"},{"t":"Because a company can’t make infinitely many items.","why":"True, but even at 1000 or 10 000 items the average is still above 6. That needs the positive share `900/x`.","_n":"45c22","_k":"3fb93984"},{"t":"Because `900/x` becomes 0 when `x` is very large.","why":"`900/x` is never 0, and if it were, the average would equal 6.","_n":"46c32","_k":"cf974f32"}]},"b":{"prompt":"Which is the best explanation of why the concentration `C(t) = {500 + 10t}/{10 + t}` is always more than 10 g/L for `t ≥ 0`?","options":[{"t":"Because the pump can’t run forever.","why":"Even after a long time the concentration is still above 10. That needs the positive leftover.","_n":"47c02","_k":"f0671768"},{"t":"Because `400/(10 + t)` becomes 0 when `t` is very large.","why":"`400/(10 + t)` is never 0.","_n":"48c12","_k":"7b2c5b42"},{"t":"`C(t) = 10 + {400}/{10 + t}`. For every `t ≥ 0`, `400/(10 + t)` is positive, so the concentration is always 10 plus something.","why":"It rewrites the model and explains why the positive leftover keeps the concentration above 10.","_n":"49c62","_k":"3bd1bb1f"},{"t":"Because `C = 10` is an asymptote, and a graph can never cross its horizontal asymptote.","why":"Graphs can cross horizontal asymptotes. The reason is the positive leftover.","_n":"4ac72","_k":"c2960029"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"A boat’s time to travel 60 km up a river with a 4 km/h current is `t(s) = {60}/{s - 4}` hours, where `s` is its speed in still water. Which statement describes the vertical asymptote correctly?","options":[{"t":"As `s → 4^{-}`, `t → -∞`: a boat slower than the current takes a negative time.","why":"The arrows are right for the formula, but `s \u003c 4` is outside the domain: such a boat never arrives.","_n":"4bc42","_k":"de658b85"},{"t":"As `s → 4^{+}`, `t → ∞`: a boat barely faster than the current takes longer and longer.","why":"Correct notation, the right side of 4, and the right meaning.","_n":"4cc52","_k":"cbf492c2"},{"t":"At `s = 4`, `t = ∞`: the trip takes infinitely long.","why":"∞ isn’t a value: `t(4)` is undefined. Describe what happens as `s` gets close to 4.","_n":"4dba2","_k":"846bfda5"},{"t":"As `s → ∞`, `t → 4`: a very fast boat takes 4 hours.","why":"That mixes up the asymptotes. As `s → ∞`, `t → 0`.","_n":"4ebb2","_k":"133d52fb"}]},"b":{"prompt":"A cyclist rides 45 km into a 15 km/h headwind. Her time is `t(s) = {45}/{s - 15}` hours, where `s` is her speed in still air. Which statement describes the vertical asymptote correctly?","options":[{"t":"As `s → ∞`, `t → 15`: a very fast cyclist takes 15 hours.","why":"As `s → ∞`, `t → 0`.","_n":"4fbc2","_k":"89e2e05d"},{"t":"At `s = 15`, `t = ∞`: the ride takes infinitely long.","why":"∞ isn’t a value: `t(15)` is undefined.","_n":"4gbb2","_k":"854ccea9"},{"t":"As `s → 15^{+}`, `t → ∞`: a cyclist barely faster than the wind takes longer and longer.","why":"Correct notation, the right side of 15, and the right meaning.","_n":"4hba2","_k":"6bed093e"},{"t":"As `s → 15^{-}`, `t → -∞`: a cyclist slower than the wind takes a negative time.","why":"`s \u003c 15` is outside the domain.","_n":"4ib92","_k":"612bb448"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A club rents a bus for $1200, and each ticket costs $35. The costs are shared equally. What is the smallest number of students who must go so that each pays at most $50?","options":[{"t":"24","why":"`1200/n ≤ 50` forgets the $35 ticket. The bus share must be at most $50 − $35 = $15.","_n":"4jb82","_k":"a925b306"},{"t":"25","why":"`(1200 + 35)/n ≤ 50` counts only one ticket. The tickets cost `35n` in total.","_n":"4kb72","_k":"1e2655cc"},{"t":"80","why":"`35 + 1200/n ≤ 50`, so `1200/n ≤ 15`. `n > 0`, so `1200 ≤ 15n` and `n ≥ 80`. At 80 students each pays exactly $50.","_n":"4lb62","_k":"0825c471"},{"t":"81","why":"At 80 students each pays exactly $50, and “at most $50” includes $50.","_n":"4mb52","_k":"9b192a10"}]},"b":{"prompt":"A choir rents a hall for $900, and each meal costs $25. The costs are shared equally. What is the smallest number of guests so that each pays at most $40?","options":[{"t":"23","why":"`900/n ≤ 40` forgets the $25 meal. The hall share must be at most $15.","_n":"4nc42","_k":"9be09161"},{"t":"24","why":"`(900 + 25)/n ≤ 40` counts only one meal.","_n":"4oc32","_k":"a05a9fa7"},{"t":"60","why":"`25 + 900/n ≤ 40`, so `900/n ≤ 15` and `n ≥ 60`. At 60 guests each pays exactly $40.","_n":"4pb62","_k":"33267ac5"},{"t":"61","why":"“At most $40” includes exactly $40, which happens at 60 guests.","_n":"4qb72","_k":"bf1dcc8e"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Ravi cycles 30 km to a lake at 15 km/h and returns along the same road at `u` km/h. His average speed for the round trip is `S(u) = {30u}/{u + 15}` km/h. How fast must he ride home for an average speed of 24 km/h?","options":[{"t":"33 km/h","why":"That averages the two speeds: (15 + 33)/2 = 24. But he spends longer at the slow speed, so the average speed is lower: `S(33)` = 20.625 km/h.","_n":"4rb82","_k":"1936f6fe"},{"t":"60 km/h","why":"`30u = 24(u + 15)` gives `6u = 360`, so `u = 60`. Check: 2 h out and 0.5 h back is 60 km in 2.5 h, which is 24 km/h.","_n":"4sb92","_k":"4bc8920d"},{"t":"It’s impossible: his average can never be more than 15 km/h.","why":"`S(u)` approaches 30 km/h, not 15. A fast return lifts the average above 15.","_n":"4tb22","_k":"39b513aa"},{"t":"2.5 km/h","why":"That comes from `30u = 24u + 15`: the 24 multiplied only the `u`. `24(u + 15) = 24u + 360`.","_n":"4ub32","_k":"b166a12e"}]},"b":{"prompt":"Mei walks 6 km to a park at 4 km/h and jogs back along the same path at `u` km/h. Her average speed for the round trip is `S(u) = {8u}/{u + 4}` km/h. How fast must she jog back for an average speed of 6 km/h?","options":[{"t":"It’s impossible: her average can never be more than 4 km/h.","why":"`S(u)` approaches 8 km/h, not 4.","_n":"4vb42","_k":"f90b615e"},{"t":"2 km/h","why":"That comes from `8u = 6u + 4`: the 6 multiplied only the `u`. `6(u + 4) = 6u + 24`.","_n":"4wb52","_k":"78340792"},{"t":"12 km/h","why":"`8u = 6(u + 4)` gives `2u = 24`, so `u = 12`. Check: 1.5 h out and 0.5 h back is 12 km in 2 h, which is 6 km/h.","_n":"4xbe2","_k":"a953e092"},{"t":"8 km/h","why":"That averages the two speeds: (4 + 8)/2 = 6. But she spends longer at the slow speed: `S(8)` ≈ 5.33 km/h.","_n":"4ybf2","_k":"93093cf3"}]}}]},"task":{"title":"Design a dilution","summary":"Design a dilution","statement":"\u003cp>A lab needs a tank whose salt concentration \u003cstrong>falls\u003c/strong> over time. Choose the starting volume `V_0`, the starting concentration `C_0`, the incoming brine strength `c_{in}` and the flow rate `r` so that all four checks pass. There’s more than one design. Can you find another?\u003c/p>\u003cp class=\"tiny muted\">The tank’s capacity is fixed at 300 L. The preview shows your tank at `t` = 20 min.\u003c/p>","checks":["The concentration falls over time","In the long run it would approach 10 g/L","After 20 minutes the concentration is exactly 30 g/L","The tank hasn’t overflowed at 20 minutes"],"tips":["Right now `C_0 ≤ c_{in}`, so the tank gets stronger or stays the same. For the concentration to fall, the incoming brine must be weaker than what’s in the tank.","The long-run value is the strength of the incoming brine. Set `c_{in}` to 10.","Right now %C20%. Use the gap: `C(t) = 10 + (C_0 - 10)·{V_0}/{V_0 + rt}`. At `t = 20` the gap above 10 must be exactly 20.","At `t = 20` the tank would hold %vol% L, more than 300 L. Use a smaller flow rate or a smaller starting volume."],"explainPrompt":"Explain how you know your tank approaches 10 g/L from above, and why it is at 30 g/L after 20 minutes.","vocab":"Use the words horizontal asymptote, leftover (gap) and domain.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Every working design satisfies `(C_0 - 30)·V_0 = 400r`. That’s the gap condition: `(C_0 - 10)·{V_0}/{V_0 + 20r} = 20`.","ui":{"sl":{"V0":"Starting volume `V_0` (L)","C0":"Starting concentration `C_0` (g/L)","cin":"Incoming brine `c_{in}` (g/L)","r":"Flow rate `r` (L/min)"},"target":"target","targetHA":"target C = 10"}},"cards":[["Average cost model","`A(x)` = total ÷ items = `{F + vx}/{x} = v + {F}/{x}`, where `F` is the setup (fixed) cost and `v` the cost to make each item."],["Long-run average cost","The horizontal asymptote `y = v`. The average gets closer and closer to the cost of making one item, but stays above it while `F > 0`."],["Concentration in a mixing tank","Salt ÷ volume, in g/L: `C(t) = {C_0V_0 + c_{in}rt}/{V_0 + rt}`."],["Long-run concentration of a tank","The strength of the incoming liquid, `c_{in}`. Mixing can’t make the tank stronger than both liquids or weaker than both."],["Asymptote + leftover form","Split the top: `{500 + 10t}/{10 + t} = 10 + {400}/{10 + t}`. Asymptote 10; leftover `400/(10 + t)`."],["Above or below the asymptote?","Look at the leftover’s sign in the domain. Positive: above. Negative: below. `{12 + n}/{20 + n} = 1 - {8}/{20 + n}` stays below 1."],["Three kinds of asymptote in a word problem","Horizontal: the long-run value. Vertical at the edge of the domain: where the model breaks down. Vertical outside the domain: no meaning."],["Domain in context","Only the inputs that make sense: counts are whole numbers, times are ≥ 0, and a tank model stops when the tank is full."],["Success rate after `n` in a row","(made + `n`)/(attempts + `n`). It approaches 1 (100%) but never reaches it if there was at least one miss."],["Comparing two cost plans","For the same number of items, equal average costs ⇔ equal total costs. In the long run the plan with the lower per-item cost wins."],["Answers in context","Round the way the inequality for the count points: `n ≥ 24.7` means 25, and `n ≤ 24.7` means 24. Then check the restriction, the domain and the story."],["Writing a vertical asymptote in context","“As `s → 3^{+}`, `t → ∞`”: the trip takes longer and longer as the speed gets close to 3 km/h. Never write `t = ∞`."]]}};</script>
