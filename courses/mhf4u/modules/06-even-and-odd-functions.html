.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 06: hero, term tiles (rows, flips, stamp, match lights, steppers), sign-flipper, value bars, mirror lab */
.hero .hero-eq{font-style:normal}
.hero-hl{background:var(--hi-soft);box-shadow:inset 0 -.09em 0 var(--hi);border-radius:.06em;padding:0 .05em}
.opt .m,.sbtn .m,.fb .m,.hints .m,.read dd .m,.cw .m,.ml-goal .m,.tt-why .m{white-space:normal}

/* hero rows */
.hero-eo{display:grid;gap:10px}
.he-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;border:1.5px solid var(--rule);border-radius:10px;padding:4px 10px 8px;background:var(--sheet)}
.he-left{min-width:0}
.he-tiles{padding-top:22px}
.he-name{font:400 1.1rem var(--font-math);margin-right:2px;white-space:nowrap}
.hero .he-lab{margin:4px 0 0;font-size:.92rem;font-weight:700;color:var(--ink-2);min-height:1.35em;opacity:0;transition:opacity .45s}
.hero .he-lab.on{opacity:1}
canvas.plot.he-plot{opacity:0;transition:opacity .6s;border-radius:6px}
canvas.plot.he-plot.on{opacity:1}
.he-row .tt-face{font-size:1.08rem;min-width:2.2em;padding:.18em .45em}

/* term tiles */
.tt-rows{display:grid;gap:4px;margin:4px 0 2px}
.tt-line{display:grid;grid-template-columns:4.9em minmax(0,1fr);gap:2px 10px;align-items:end}
.tt-lab{font:400 1.18rem var(--font-math);white-space:nowrap;text-align:right;padding-bottom:12px}
.tt-row{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:50px;padding:22px 2px 6px}
.tt-tiles{display:contents}
.tt{display:inline-block;perspective:420px;border-radius:7px}
.tt-in{display:grid;transition:transform .4s ease;transform-style:preserve-3d}
.tt-face{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:2px;min-width:2.6em;padding:.24em .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1.22rem var(--font-math);white-space:nowrap;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tt-face .m{font-size:1em}
.tt-b{transform:rotateY(180deg)}
.tt.flip .tt-in{transform:rotateY(180deg)}
.tt.flip .tt-b{border:2.5px solid var(--hi);padding:.2em .5em}
.tt-mk{font:700 .72rem var(--font-ui);color:var(--ink-2);align-self:flex-start;margin-left:3px}
.tt.dis{outline:2px dashed var(--red);outline-offset:3px}
.tt.q .tt-face{color:var(--ink-2);border-style:dashed}
.tt.wide .tt-face{padding:.24em .8em}
.tt.pop{animation:tt-pop .5s ease-out}
@keyframes tt-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.tt-stamp{position:absolute;left:0;top:0;z-index:2;background:var(--ink);color:var(--sheet);border-radius:999px;padding:.05em .55em;font:400 1rem var(--font-math);pointer-events:none;white-space:nowrap}
.tt-stamp .m{font-size:1em}
.tt-lights{display:grid;gap:2px;margin:6px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.tt-light{margin:0;font-size:.95rem}
.tt-light .mk{display:inline-block;width:1.2em;font-weight:700}
.tt-light.yes .mk{color:var(--green)}
.tt-light.no .mk{color:var(--red)}
.tt-light.wait{color:var(--ink-2)}
.tt-why{color:var(--ink-2)}

/* coefficient steppers */
.stps-wrap{container-type:inline-size}
.stps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 12px}
@container (min-width:640px){ .stps{grid-template-columns:repeat(6,minmax(0,1fr))} }
.stp{display:grid;justify-items:center;gap:4px;border:1.5px solid var(--ink-2);border-radius:8px;padding:6px 2px;background:var(--sheet)}
.stp.off{border-style:dashed;border-color:var(--rule)}
.stp.off .stp-t,.stp.off .stp-v{color:var(--ink-2)}
.stp-t{font:400 1.1rem var(--font-math);min-height:1.4em}
.stp-t .m{font-size:1em}
.stp-t.c0{font:700 .85rem var(--font-ui);color:var(--ink-2);align-self:end}
.stp-b{display:inline-flex;align-items:center;gap:2px}
.stp-btn{width:30px;height:30px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:700 1.05rem var(--font-ui);padding:0;line-height:1}
.stp-btn:not(:disabled):hover{border-color:var(--pen)}
.stp-btn:disabled{opacity:.4}
.stp-v{min-width:1.5em;text-align:center;font:400 1.1rem var(--font-math)}

/* sign-flipper */
.sf-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin:0 0 4px}
.sf-top .seg-wrap{margin-top:0}
.sf-h{margin:0 0 8px}
.sf-pl{margin:0 0 6px;font-weight:700}
.sf-tog{margin:10px 0 4px}
.sf-tog .chip .m{font-size:1em}
.sf-key{margin:0}
.chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fchip .m{font-size:1em}
.sf .slider{margin-top:6px}
.vbars{margin-top:8px}
.vb{display:grid;grid-template-columns:4.4em minmax(0,1fr) 4.4em;gap:8px;align-items:center;margin:4px 0}
.vb-l{font:400 1.02rem var(--font-math);white-space:nowrap}
.vb-l .m{font-size:1em}
.vb-t{position:relative;height:14px;border-radius:3px;background:var(--paper);border:1px solid var(--rule)}
.vb-t::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink-2)}
.vb-t i{position:absolute;top:2px;bottom:2px;border-radius:2px}
.vb-t i.b1{background:var(--pen)}
.vb-t i.b2{background:var(--ink)}
.vb-t i.b3{background:var(--ink-2)}
.vb-v{font:400 1rem var(--font-math);text-align:right}
.sf-load{margin-left:6px;vertical-align:middle}

/* mirror lab */
#ml-rounds{margin-bottom:12px}
.ml-goal{font-size:1.02rem}
.ml-leg{margin-top:10px}
.legend i.sw-dash{background:repeating-linear-gradient(90deg,var(--ink-2) 0 6px,transparent 6px 12px)}
.legend i.sw-dot{background:repeating-linear-gradient(90deg,var(--ink-2) 0 2px,transparent 2px 6px)}
.ml-terms{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 6px}
.ml-term{display:grid;justify-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:8px;padding:6px;background:var(--sheet)}
.ml-term.off .ml-tog{text-decoration:line-through;color:var(--ink-2);border-style:dashed}
.ml-term.off .stp-v{color:var(--ink-2)}
.ml-cands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 4px}
.ml-cand{display:grid;gap:4px;border:2px solid var(--rule);border-radius:8px;background:var(--sheet);padding:6px;text-align:center;font-weight:700;min-width:0}
.ml-cand:not(:disabled):hover{border-color:var(--pen)}
.ml-cand.right{border-color:var(--green);background:var(--good-bg)}
.ml-cand.wrong{border-color:var(--red);background:var(--bad-bg)}
.ml-cand:disabled{color:var(--ink)}
.ml-cand canvas.plot{border-radius:6px}
.ml-cl .m{font-size:1em}
.spec{margin:0;padding-left:1.3em}

@media (max-width:560px){
  .tt-line{grid-template-columns:minmax(0,1fr)}
  .tt-lab{text-align:left;padding-bottom:0}
  .tt-row{padding-top:22px}
  .tt-face{font-size:1.1rem;padding:.2em .45em;min-width:2.3em}
  .he-row{grid-template-columns:minmax(0,1fr) 80px}
  .vb{grid-template-columns:4em minmax(0,1fr) 3.8em}
}
.ml-tog[aria-pressed="true"]{background:var(--sheet);color:var(--ink);border-color:var(--ink-2)}

</style>

ind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"5c72f563","content":{"id":"06-even-and-odd-functions","kind":"topic","title":"Even and odd functions","topic":"Even and Odd Functions","readyTopic":"even and odd functions","hero":{"eq":"\u003ci>f\u003c/i>(\u003cspan class=\"hero-hl\">−\u003ci>x\u003c/i>\u003c/span>) = ?","eqLabel":"f of negative x equals what?","headline":"Swap `x` for `-x` and see who flips","text":"In module 01 you folded and spun power functions. Here you’ll test any polynomial with algebra. Replace `x` with `-x`: the \u003cstrong>odd-power\u003c/strong> terms change sign and the \u003cstrong>even-power\u003c/strong> terms don’t. If nothing changes, the function is \u003cstrong>even\u003c/strong>. If everything changes sign, it’s \u003cstrong>odd\u003c/strong>. If only some terms change, it’s \u003cstrong>neither\u003c/strong>.","fig":{"html":"\u003cdiv class=\"hero-eo\" id=\"hero-eo\" role=\"img\" aria-label=\"Three rows of term tiles. In f of x equals x to the 4 minus 2 x squared plus 3, nothing flips when x is replaced with negative x: even, symmetric in the y-axis. In g of x equals x cubed minus 4 x, everything flips: odd, unchanged by a half-turn about the origin. In h of x equals x cubed plus x squared, some terms flip: neither.\">\u003c/div>"}},"goals":["I can find `f(-x)` for a polynomial by replacing `x` with `-x`, term by term.","I can decide algebraically whether a polynomial is even, odd or neither by comparing `f(-x)` with `f(x)` and with `-f(x)`.","I can connect even functions to symmetry in the `y`-axis and odd functions to half-turn symmetry about the origin.","I can predict the answer from the powers of the terms, remembering that a constant is an even-power term.","I can use symmetry to find unknown values and complete a graph."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Powers of negatives","goal":1,"prompt":"Which expression equals `(-x)^3`?","options":[{"t":"`x^3`","why":"Two negatives make a positive, but the third makes it negative again.","_n":"0db0","_k":"6832e764"},{"t":"`-x^3`","why":"`(-x)(-x)(-x)`: three negatives multiply to a negative.","_n":"1d80","_k":"ed30329c"},{"t":"`-3x`","why":"The exponent means multiply `-x` by itself 3 times.","_n":"2d90","_k":"d22c1335"},{"t":"`x^{-3}`","why":"`x^{-3}` means `1/x^3`. A minus sign inside the bracket isn’t an exponent.","_n":"3d60","_k":"bc807713"}],"hints":["Write `(-x)^3` as three factors.","`(-x)(-x) = x^2`. Multiply by one more `-x`.","`x^2 · (-x) = -x^3`."]},{"id":"w2","skill":"Powers of negatives","goal":1,"prompt":"What is `(-2)^4`?","options":[{"t":"`-16`","why":"`(-2)(-2)(-2)(-2)`: four negatives make a positive.","_n":"4d70","_k":"1cc90915"},{"t":"`-8`","why":"The exponent 4 means four factors of −2, not × 4.","_n":"5d40","_k":"71d91197"},{"t":"`8`","why":"`2^4 = 2 × 2 × 2 × 2 = 16`.","_n":"6d50","_k":"d3532bad"},{"t":"`16`","why":"An even power of a negative number is positive: `(-2)^4 = 16`.","_n":"7e20","_k":"795bede7"}],"hints":["How many negative factors are there?","Four: an even number.","`(-2)^4 = 16`."]},{"id":"w3","skill":"Function notation","goal":1,"prompt":"`f(x) = x^2 - 3x`. What is `f(-2)`?","options":[{"t":"`-10`","why":"`(-2)^2 = +4` and `-3(-2) = +6`.","_n":"8e30","_k":"2f37a3ca"},{"t":"`-2`","why":"`-3 × (-2) = +6`, so `f(-2) = 4 + 6`.","_n":"98e4","_k":"2390c41a"},{"t":"`2`","why":"`(-2)^2 = (-2)(-2) = 4`.","_n":"a8d4","_k":"6e3217db"},{"t":"`10`","why":"`(-2)^2 - 3(-2) = 4 + 6 = 10`.","_n":"b904","_k":"2e5caca4"}],"hints":["Put −2 in brackets everywhere you see `x`.","`(-2)^2 - 3(-2)`. Work out each part.","4 + 6 = 10."]},{"id":"w4","skill":"Symmetry of power functions","goal":3,"prompt":"From module 01: which symmetry does the graph of `y = x^4` have?","options":[{"t":"A half-turn about the origin maps it onto itself","why":"That’s the symmetry of odd powers like `x^3`.","_n":"c8f4","_k":"d12664fb"},{"t":"It has no symmetry","why":"Fold the graph along the `y`-axis: the arms land on each other.","_n":"d8a4","_k":"36ae0623"},{"t":"It’s symmetric in the `y`-axis: folding along the `y`-axis matches the two halves","why":"Even power: `(-x)^4 = x^4`, so the heights at `x` and `-x` are the same.","_n":"e894","_k":"2b67070d"},{"t":"It’s symmetric in the `x`-axis","why":"`y = x^4` is never negative, so its reflection in the `x`-axis is a different graph.","_n":"f8c4","_k":"cb069c33"}],"hints":["Compare the heights at `x = 2` and `x = -2`.","Both are 16.","Equal heights at `x` and `-x` mean symmetry in the `y`-axis."]},{"id":"w5","skill":"Function notation","goal":2,"prompt":"`f(x) = x^3 + 2`. What is `-f(x)`?","options":[{"t":"`-x^3 + 2`","why":"The minus applies to the whole function, including the +2.","_n":"g8b4","_k":"bbcc242b"},{"t":"`(-x)^3 + 2`","why":"That’s `f(-x)`, replacing `x`. `-f(x)` multiplies the outputs by −1.","_n":"h964","_k":"15645fe7"},{"t":"`-x^3 - 2`","why":"`-f(x) = -1 × (x^3 + 2)`: every term changes sign.","_n":"i954","_k":"68e27c9e"},{"t":"`x^3 - 2`","why":"Both terms change sign.","_n":"j1c3","_k":"b33548e9"}],"hints":["`-f(x)` means `-1 × f(x)`.","`-1 × (x^3 + 2)`. Distribute.","`-x^3 - 2`."]},{"id":"w6","skill":"Reflections","goal":3,"prompt":"The graph of `y = f(-x)` is the graph of `y = f(x)` reflected in which line?","options":[{"t":"The line `y = x`","why":"Reflecting in `y = x` gives the inverse, `f^{-1}`.","_n":"k1d3","_k":"76d18cef"},{"t":"The `y`-axis","why":"The point `(a, b)` on `y = f(x)` becomes `(-a, b)`: left and right swap.","_n":"l1e3","_k":"acbe61aa"},{"t":"The origin","why":"A half-turn is both reflections at once: `y = -f(-x)`.","_n":"m1f3","_k":"c3d33a3f"},{"t":"The `x`-axis","why":"Reflecting in the `x`-axis is `y = -f(x)`.","_n":"n183","_k":"72de3d4a"}],"hints":["In `f(-x)`, what happens to the inputs?","The input `a` now gives what `f` gave at `-a`.","So each point moves to the opposite side of the `y`-axis: a reflection in the `y`-axis."]}],"refreshers":{"Powers of negatives":"A negative number to an even power is positive: `(-2)^4 = 16` and `(-x)^2 = x^2`. To an odd power it stays negative: `(-2)^3 = -8` and `(-x)^3 = -x^3`.","Function notation":"`f(-2)` means put −2 in for every `x`, in brackets: `f(x) = x^2 - 3x` gives `f(-2) = 4 + 6 = 10`. `-f(x)` means −1 times the whole function: every term changes sign.","Symmetry of power functions":"From module 01: even powers (`x^2`, `x^4`) are symmetric in the `y`-axis. Odd powers (`x`, `x^3`) look the same after a half-turn about the origin.","Reflections":"`y = f(-x)` reflects the graph in the `y`-axis. `y = -f(x)` reflects it in the `x`-axis."}}},"explore":{"heading":"Term sign-flipper","intro":"Build a polynomial from term tiles. Press ‘Replace `x` with `-x`’ and watch which tiles flip. Then compare `f(-x)` with `f(x)` and with `-f(x)`.","predIntro":"Make a prediction first. Then the sign-flipper will show you what really happens.","predictions":[{"id":"p1","start":{"c":[3,0,-2,0,1,0],"view":"tiles"},"prompt":"`f(x) = x^4 - 2x^2 + 3`. When `x` is replaced with `-x`, which terms will change sign?","options":[{"t":"`x^4` and `-2x^2` only","_n":"o193","_k":"7e780aa6"},{"t":"All of them","_n":"p1a3","_k":"a365fedd"},{"t":"Only the constant 3","_n":"q1b3","_k":"f4c2c167"},{"t":"None of them","_n":"r143","_k":"339c6f6d"}],"explain":"`(-x)^4 = x^4` and `(-x)^2 = x^2`, and the constant has no `x` at all. Every term is an even power, so `f(-x) = f(x)`: `f` is even."},{"id":"p2","start":{"c":[0,-4,0,1,0,0],"view":"tiles"},"prompt":"`f(x) = x^3 - 4x` is odd. A constant term +1 will be added. What will `f(x) = x^3 - 4x + 1` be?","options":[{"t":"Still odd, because the degree is odd","_n":"s153","_k":"d94a10ce"},{"t":"Both even and odd","_n":"ta23","_k":"5319b136"},{"t":"Even","_n":"ua13","_k":"a4a3931c"},{"t":"Neither even nor odd","_n":"va03","_k":"9847093d"}],"explain":"The constant is `1 · x^0`, an even power: it doesn’t change sign. So `f(-x) = -x^3 + 4x + 1`, while `-f(x) = -x^3 + 4x - 1`. They differ only in the constant, but that’s enough: neither."},{"id":"p3","start":{"c":[0,4,0,-5,0,1],"view":"graph"},"prompt":"The graph of `f(x) = x^5 - 5x^3 + 4x` is shown. Turn on ‘Half-turn about the origin’. What will the ghost do?","options":[{"t":"Land on the graph’s mirror image in the `y`-axis, but not on the graph","_n":"w9f3","_k":"cefeef6d"},{"t":"Land exactly on the graph","_n":"x9e3","_k":"f40f3b96"},{"t":"Not match anything","_n":"y9d3","_k":"254c188d"},{"t":"Land on the graph’s reflection in the `x`-axis","_n":"z9c3","_k":"3f4d6911"}],"explain":"All three terms are odd powers, so `f(-x) = -f(x)`. A half-turn sends `(a, b)` to `(-a, -b)`, and that point is on the graph because `f(-a) = -b`."},{"id":"p4","start":{"c":[1,-2,1,0,0,0],"view":"graph","unexp":true},"prompt":"Is `f(x) = (x - 1)^2` even, odd or neither?","options":[{"t":"Neither","_n":"109b3","_k":"a3d3fb02"},{"t":"Both","_n":"119a3","_k":"c1d02867"},{"t":"Odd","_n":"12993","_k":"d2d2c848"},{"t":"Even, because it’s squared","_n":"13103","_k":"6e99bb2c"}],"explain":"Squaring a whole bracket doesn’t make every term an even power: `x^2 - 2x + 1` has a `-2x` term, which flips. The graph is symmetric about `x = 1`, not about the `y`-axis."}],"chalIntro":"Set the tiles, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"Change \u003cstrong>one\u003c/strong> coefficient of `f(x) = 2x^4 + 3x^3 - x^2 + 5` so that `f` is even. \u003cbutton type=\"button\" class=\"btn ghost sm sf-load\" data-load=\"tc1\">Load this function\u003c/button>","start":[5,0,-1,3,2,0],"why":"Only `3x^3` is an odd power. With its coefficient set to 0, `f(x) = 2x^4 - x^2 + 5` has only even powers.","hints":["Which term changes sign when `x → -x`?","Only `3x^3` is an odd power.","Set the `x^3` coefficient to 0: `f(x) = 2x^4 - x^2 + 5`."]},{"id":"tc2","goal":[2,4],"prompt":"Remove as few terms as possible (set them to 0) from `g(x) = x^5 - 2x^4 + 3x^2 - x + 4` so that `g` is \u003cstrong>odd\u003c/strong>. \u003cbutton type=\"button\" class=\"btn ghost sm sf-load\" data-load=\"tc2\">Load this function\u003c/button>","start":[4,-1,3,0,-2,1],"why":"The three even-power terms `-2x^4`, `3x^2` and 4 had to go, and nothing else: `g(x) = x^5 - x`.","hints":["Which terms would stay the same when `x → -x`?","The even-power terms: `-2x^4`, `3x^2` and the constant 4.","Remove those three: `g(x) = x^5 - x`."]},{"id":"tc3","goal":[2,5],"stretch":true,"prompt":"Build a polynomial (any tiles) that is \u003cstrong>neither\u003c/strong> even nor odd, passes through the origin, and still has `f(1) = f(-1)`. Use the one-value test to show it.","why":"The odd-power coefficients add to 0, so `f(1) = f(-1)`, and the even-power term keeps it from being odd. For example, `f(x) = x^3 - x + x^2` has `f(1) = f(-1) = 1` but is neither: one matching pair isn’t a proof.","hints":["`f(1)` and `f(-1)` differ only in the odd-power terms. What must those add up to?","The odd-power coefficients must add to 0, like `x^3 - x`. Then add an even-power term so it isn’t odd.","`x^3 - x + x^2`: `f(1) = 1 - 1 + 1 = 1` and `f(-1) = -1 + 1 + 1 = 1`. But `f(2) = 10` and `f(-2) = -2`: neither."]}]},"part3":{"slug":"mirror","name":"Mirror","heading":"Mirror lab: make it even, make it odd","intro":"Each polynomial is drawn with its even part and its odd part. Remove or change terms, then run the mirror test and the half-turn test.","alg":"`f(x) = E(x) + O(x)`. Replacing `x` with `-x` leaves `E` alone and flips `O`: `f(-x) = E(x) - O(x)`. So `f(-x) = f(x)` exactly when `O = 0` (even), and `f(-x) = -f(x)` exactly when `E = 0` (odd).","rounds":[{"id":"r1","start":[2,-3,0,1,0,0],"target":"odd","parts":"`E = 2`, `O = x^3 - 3x`","goal":"Remove one term to make `f` odd.","wrong":[{"removed":[1],"fb":"Still not odd: the constant 2 doesn’t flip."}],"why":"Without the +2, `f(x) = x^3 - 3x`: `E = 0`, so `f(-x) = -f(x)` and the half-turn test matches."},{"id":"r2","start":[0,1,-4,0,1,0],"target":"even","parts":"`E = x^4 - 4x^2`, `O = x`","goal":"Remove one term to make `f` even.","wrong":[{"removed":[4],"fb":"`x` still flips, so the mirror test still fails."}],"why":"Without the `+x`, `f(x) = x^4 - 4x^2`: `O = 0`, so `f(-x) = f(x)` and the mirror test matches."},{"id":"r3","start":[-2,-1,2,1,0,0],"target":"pick","parts":"`E = 2x^2 - 2`, `O = x^3 - x`","eq":"`f(x) = (x + 2)(x^2 - 1)`\u003cbr>`= x^3 + 2x^2 - x - 2`","goal":"Which curve is `y = f(-x)`? Tap it.","cands":[{"e":1,"o":1,"name":"`E + O`","fb":"That’s `f` itself.","_n":"14113","_k":"156a9656"},{"e":-1,"o":-1,"name":"`-E - O`","fb":"That’s `-f(x)`, the reflection in the `x`-axis.","_n":"150e3","_k":"2c6af900"},{"e":1,"o":-1,"name":"`E - O`","fb":"Right. `f(-x) = E(x) - O(x) = -x^3 + 2x^2 + x - 2`: `E` stays and `O` flips.","_n":"160f3","_k":"4fc04d3b"},{"e":-1,"o":1,"name":"`-E + O`","fb":"That’s `-f(-x)`, the half-turn.","_n":"170c3","_k":"45d313d4"}]}],"blocks":[{"title":"What the tests mean","html":"\u003cp>\u003cstrong>Even, odd or neither: the rule\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Even:\u003c/strong> every term has an even power (a constant counts). `f(-x) = f(x)`. The graph is symmetric in the `y`-axis.\u003c/li>\u003cli>\u003cstrong>Odd:\u003c/strong> every term has an odd power (no constant). `f(-x) = -f(x)`. A half-turn about the origin maps the graph onto itself, and the graph passes through (0, 0).\u003c/li>\u003cli>\u003cstrong>Neither:\u003c/strong> a mixture. Most polynomials are neither.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Even, odd or neither?","summary":"Even, odd or neither?","items":[{"id":"q1","goal":[2,4],"prompt":"`f(x) = 3x^6 - x^2 + 7`","choices":[{"t":"Even","fb":"Right. Powers 6, 2 and 0 are all even.","_n":"180d3","_k":"89e4a037"},{"t":"Odd","fb":"All three powers are even, including the constant’s power 0. Nothing flips.","_n":"190a3","_k":"ed233d28"},{"t":"Neither","fb":"All three powers are even, including the constant’s power 0. Nothing flips.","_n":"1a0b3","_k":"96ebf87f"}]},{"id":"q2","goal":[2,4],"prompt":"`g(x) = -2x^5 + x^3 - 6x`","choices":[{"t":"Even","fb":"Every term is an odd power, so every term flips: `g(-x) = -g(x)`.","_n":"1b183","_k":"55692131"},{"t":"Odd","fb":"Right. Powers 5, 3 and 1 are all odd, and there’s no constant.","_n":"1c193","_k":"690a6b42"},{"t":"Neither","fb":"Every term is an odd power, so every term flips: `g(-x) = -g(x)`.","_n":"1d163","_k":"86a0c255"}]},{"id":"q3","goal":[2,4],"prompt":"`h(x) = x(x^2 - 4)`","choices":[{"t":"Even","fb":"Expand first: `x^3 - 4x`. Both powers are odd.","_n":"1e153","_k":"4624d59f"},{"t":"Odd","fb":"Right. Expanded, it’s `x^3 - 4x`: only odd powers.","_n":"1f183","_k":"60c00602"},{"t":"Neither","fb":"Expand first: `x^3 - 4x`. Both powers are odd.","_n":"1g173","_k":"b0991033"}]},{"id":"q4","goal":[2,4],"prompt":"`k(x) = (x + 1)(x - 1) + x`","choices":[{"t":"Even","fb":"Expand: `x^2 - 1 + x`. The `x` term flips; the others don’t.","_n":"1h1a3","_k":"ee995b3a"},{"t":"Odd","fb":"Expand: `x^2 - 1 + x`. The `x` term flips; the others don’t.","_n":"1i193","_k":"6929b5df"},{"t":"Neither","fb":"Right. It’s `x^2 + x - 1`: a mix of powers.","_n":"1j1c3","_k":"97f8b2d9"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Even, odd or neither?","summary":"Sort","noun":"function","goal":[2,4],"instruction":"Sort each function.","how":"Tap a function, then tap the box it belongs in.","wrongDefault":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither.","boxes":[{"id":"ev","label":"Even"},{"id":"od","label":"Odd"},{"id":"ne","label":"Neither"}],"items":[{"id":"i1","t":"`y = x^4 - 2x^2`","_a":"FwZBEA==","why":"Only even powers.","hints":["Write the function as a sum of terms (expand if needed).","List the powers, counting a constant as power 0: here they are 4 and 2.","All even powers: Even."],"wrong":{"od":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither.","ne":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither."}},{"id":"i2","t":"`y = 5x^3 - x`","_a":"FwxTEA==","why":"Only odd powers, no constant.","hints":["Write the function as a sum of terms (expand if needed).","List the powers, counting a constant as power 0: here they are 3 and 1, with no constant.","All odd powers: Odd."],"wrong":{"ev":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither.","ne":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither."}},{"id":"i3","t":"`y = x^3 + 1`","_a":"Fw1SEA==","why":"`x^3` flips; the constant doesn’t.","hints":["Write the function as a sum of terms (expand if needed).","List the powers, counting a constant as power 0: here they are 3 and 0.","A mixture of even and odd powers: Neither."],"wrong":{"od":"Look at every term, not just the highest power. The constant is an even-power term. It doesn’t flip.","ev":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither."}},{"id":"i4","t":"`y = -7`","_a":"FwZBEA==","why":"A constant is an even power (`x^0`): `f(-x) = -7 = f(x)`.","hints":["Write the function as a sum of terms (expand if needed).","List the powers, counting a constant as power 0: the only power here is 0.","0 is even: Even."],"wrong":{"od":"The constant is an even-power term. It doesn’t flip.","ne":"The constant is an even-power term. It doesn’t flip."}},{"id":"i5","t":"`y = x^5 - 3x^3 + 2x`","_a":"FwxTEA==","why":"Powers 5, 3, 1: all odd.","hints":["Write the function as a sum of terms (expand if needed).","List the powers, counting a constant as power 0: here they are 5, 3 and 1, with no constant.","All odd powers: Odd."],"wrong":{"ev":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither.","ne":"List the powers, counting a constant as power 0. All even: Even. All odd: Odd. A mixture: Neither."}},{"id":"i6","t":"`y = (x - 2)^2`","_a":"Fw1SEA==","why":"`x^2 - 4x + 4`: the `-4x` term flips.","hints":["Expand the bracket first.","`(x - 2)^2 = x^2 - 4x + 4`. The powers are 2, 1 and 0.","A mixture of even and odd powers: Neither."],"wrong":{"ev":"Expand the brackets first, then look at the powers.","od":"Expand the brackets first, then look at the powers."}},{"id":"i7","t":"`y = x^2 · x^3`","_a":"FwxTEA==","why":"`x^2 · x^3 = x^5`: one odd power.","hints":["Simplify the product.","Exponents add: `x^2 · x^3 = x^5`.","One odd-power term: Odd."],"wrong":{"ev":"Multiply out the product first, then look at the powers.","ne":"Multiply out the product first, then look at the powers."}},{"id":"i8","t":"`y = (x^2 + 1)(x^2 - 3)`","_a":"FwZBEA==","why":"`x^4 - 2x^2 - 3`: all even powers.","hints":["Expand the brackets first.","`(x^2 + 1)(x^2 - 3) = x^4 - 2x^2 - 3`. The powers are 4, 2 and 0.","All even powers: Even."],"wrong":{"od":"Expand the brackets first, then look at the powers.","ne":"Expand the brackets first, then look at the powers."}},{"id":"i9","t":"`y = x(x^2 + 1)`","_a":"FwxTEA==","why":"`x^3 + x`: all odd powers.","hints":["Expand the bracket first.","`x(x^2 + 1) = x^3 + x`. The powers are 3 and 1, with no constant.","All odd powers: Odd."],"wrong":{"ev":"Expand the brackets first, then look at the powers.","ne":"Expand the brackets first, then look at the powers."}},{"id":"i10","t":"`y = 2x^6 + x^5`","_a":"Fw1SEA==","why":"`x^6` is even, `x^5` is odd: a mixture.","hints":["Write the function as a sum of terms (expand if needed).","List the powers, counting a constant as power 0: here they are 6 and 5.","A mixture of even and odd powers: Neither."],"wrong":{"ev":"Look at every term, not just the highest power.","od":"Look at every term, not just the highest power."}}]},{"id":"symm","type":"custom","title":"Use the symmetry","summary":"Use the symmetry","star":true,"goal":[2,5],"instruction":"Use what you know about even and odd functions. No calculator needed.","how":"Type your answer, then press Check. Items 3 to 6 (★) ask you to reason backwards from the definitions.","items":[{"id":"u1","kind":"num","goal":5,"prompt":"`f` is even and `f(3) = 7`. Find `f(-3)`.","label":"`f(-3) =`","_a":"Ag==","display":"`f(-3) = 7`","why":"Even means `f(-x) = f(x)`, so `f(-3) = f(3) = 7`.","wrong":[{"match":-7,"fb":"That’s the odd rule. Even means `f(-x) = f(x)`."}],"general":"Even means `f(-x) = f(x)`. Which value of `f` do you already know?","hints":["Even means `f(-x) = f(x)`.","So `f(-3) = f(3)`.","`f(-3) = f(3) = 7`."]},{"id":"u2","kind":"num","goal":5,"prompt":"`g` is odd and `g(2) = -5`. Find `g(-2)`.","label":"`g(-2) =`","_a":"AA==","display":"`g(-2) = 5`","why":"Odd means `g(-x) = -g(x)`, so `g(-2) = -(-5) = 5`.","wrong":[{"match":-5,"fb":"That’s the even rule. Odd means `g(-x) = -g(x) = 5`."}],"general":"Odd means `g(-x) = -g(x)`. Which value of `g` do you already know?","hints":["Odd means `g(-x) = -g(x)`.","So `g(-2) = -g(2)`.","`g(-2) = -(-5) = 5`."]},{"id":"u3","kind":"num","goal":[2,5],"star":true,"prompt":"`h` is an odd polynomial. What is `h(0)`?","label":"`h(0) =`","_a":"BQ==","display":"`h(0) = 0`","why":"`h(0) = -h(0)`, so `h(0) = 0`. Every odd polynomial passes through the origin.","general":"Put `x = 0` into `h(-x) = -h(x)`: `h(0) = -h(0)`, so `h(0) = 0`. Every odd polynomial passes through the origin.","hints":["Put `x = 0` into `h(-x) = -h(x)`.","`-0 = 0`, so the equation says `h(0) = -h(0)`.","The only number equal to its own opposite is 0: `h(0) = 0`."]},{"id":"u4","kind":"num","goal":[2,5],"star":true,"prompt":"`f(x) = ax^3 + bx^2 + 2x + c` is odd, and `f(1) = 5`. Find `a`.","label":"`a =`","_a":"Bg==","display":"`a = 3`","why":"Odd forces `b = 0` and `c = 0`. Then `f(1) = a + 2 = 5`, so `a = 3`.","wrong":[{"match":5,"fb":"Odd forces `b = 0` and `c = 0`. Then `f(1) = a + 2 = 5`."},{"match":7,"fb":"`a + 2 = 5` gives `a = 3`, not 7."}],"general":"An odd polynomial has no even-power terms, so `b` and `c` must be 0. What’s left of `f(1)`?","hints":["An odd polynomial has only odd-power terms.","So `b = 0` and `c = 0`, which leaves `f(x) = ax^3 + 2x`.","`f(1) = a + 2 = 5`, so `a = 3`."]},{"id":"u5","kind":"mc","goal":2,"star":true,"prompt":"`p(x) = x^4 + kx^3 - 5x^2 + (k - 2)x + 1`. For which value of `k` is `p` even?","options":[{"t":"`k = 0`","why":"Then the `x`-term is `-2x`, which flips.","_n":"1k1b3","_k":"44444f6a"},{"t":"No value of `k` works","why":"Both odd-power coefficients, `k` and `k - 2`, would have to be 0, and that can’t happen for one value of `k`.","_n":"1l0e3","_k":"45cb6f9e"},{"t":"`k = -2`","why":"Then both odd terms are there: `-2x^3` and `-4x`.","_n":"1m0d3","_k":"d6051fb9"},{"t":"`k = 2`","why":"Then the `x^3` term is `2x^3`, which flips.","_n":"1n843","_k":"06230dde"}],"hints":["For `p` to be even, every odd-power term must vanish.","The odd-power terms are `kx^3` and `(k - 2)x`. Both coefficients must be 0.","`k = 0` and `k - 2 = 0` can’t both be true, so no value of `k` works."]},{"id":"u6","kind":"num","goal":5,"star":true,"prompt":"`f = E + O`, where `E` is even and `O` is odd. `f(2) = 10` and `f(-2) = 4`. Find `E(2)`.","label":"`E(2) =`","_a":"Ag==","display":"`E(2) = 7`","why":"`f(2) + f(-2) = 2E(2) = 14`, so `E(2) = 7` (and `O(2) = 3`).","wrong":[{"match":10,"fb":"`f(2) = E(2) + O(2) = 10` and `f(-2) = E(2) - O(2) = 4`. Add them."},{"match":4,"fb":"`f(2) = E(2) + O(2) = 10` and `f(-2) = E(2) - O(2) = 4`. Add them."},{"match":3,"fb":"That’s `O(2)`. `E(2) = (10 + 4) ÷ 2`."}],"general":"Write `f(2)` and `f(-2)` using `E` and `O`, then add them.","hints":["Write `f(2)` and `f(-2)` using `E` and `O`.","`f(2) = E(2) + O(2) = 10`. `f(-2) = E(-2) + O(-2) = E(2) - O(2) = 4`.","Adding: `2E(2) = 14`, so `E(2) = 7` (and `O(2) = 3`)."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Noah","how":"","instruction":"Noah made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Is `f(x) = x^4 - 3x^2 + x` even, odd or neither?","steps":["`f(-x) = (-x)^4 - 3(-x)^2 + (-x)`","`= -x^4 + 3x^2 - x`","That’s `-f(x)`.","So `f` is odd."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 follows from step 2. The mistake is earlier.","Step 4 follows. The mistake is earlier."],"fixes":[{"t":"`f(-x) = x^4 - 3x^2 + x = f(x)`, so `f` is even.","why":"`(-x) = -x`: the last term does flip.","_n":"1o853","_k":"cdbbdd76"},{"t":"`f(-x) = -x^4 - 3x^2 - x`.","why":"`(-x)^4` is positive: an even power of a negative is positive.","_n":"1p863","_k":"587ac58a"},{"t":"Step 2 is correct as written.","why":"`(-x)^4 = x^4`, not `-x^4`. Even powers lose the minus sign.","_n":"1q873","_k":"14115c12"},{"t":"`(-x)^4 = x^4` and `(-x)^2 = x^2`, so `f(-x) = x^4 - 3x^2 - x`. That’s neither `f(x)` nor `-f(x)`: neither.","why":"Only the `x` term flips.","_n":"1r883","_k":"5cffff01"}],"hints":["Check each power of `-x` in step 2.","Is `(-x)^4` positive or negative? What about `(-x)^2`?","Step 2 is wrong: `f(-x) = x^4 - 3x^2 - x`, so `f` is neither."]},{"id":"e2","goal":2,"task":"Is `g(x) = 2x^3 - 5x + 4` even, odd or neither?","steps":["`g(-x) = 2(-x)^3 - 5(-x) + 4`","`= -2x^3 + 5x + 4`","`g(-x) ≠ g(x)`, so `g` is not even.","Since it isn’t even, it must be odd."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct as written.","why":"‘Not even’ doesn’t mean ‘odd’. Most polynomials are neither.","_n":"1s893","_k":"a8a91ce6"},{"t":"Since its degree is odd, it’s odd.","why":"The degree doesn’t decide: the constant 4 doesn’t flip.","_n":"1t8a3","_k":"4fb9f7f5"},{"t":"Since it isn’t even, it’s neither, without checking further.","why":"That happens to be true here, but you still need the comparison with `-g(x)` to know it isn’t odd.","_n":"1u8b3","_k":"ce98512b"},{"t":"Compare with `-g(x) = -2x^3 + 5x - 4`. The constants differ (+4 vs −4), so `g` is neither.","why":"There are three possibilities, so check both.","_n":"1v8c3","_k":"f86ccd42"}],"hints":["How many possible answers are there?","Three: even, odd, neither. Step 4 skips a comparison.","Step 4 is wrong: `-g(x) = -2x^3 + 5x - 4 ≠ g(-x)`, so `g` is neither."]},{"id":"e3","goal":2,"task":"Is `h(x) = x^4 - x^3 - x^2 + x` even? Noah tests a value.","steps":["`h(1) = 1 - 1 - 1 + 1 = 0`.","`h(-1) = 1 + 1 - 1 - 1 = 0`.","`h(1) = h(-1)`, so `h` is even.","So its graph is symmetric in the `y`-axis."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"One pair isn’t enough. `h(2) = 6` but `h(-2) = 18`. Checking the terms: `h(-x) = x^4 + x^3 - x^2 - x`, which is neither `h(x)` nor `-h(x)`.","why":"The test must hold for every `x`.","_n":"1w8d3","_k":"01d9d9c4"},{"t":"Step 3 is correct as written.","why":"`h(2) = 16 - 8 - 4 + 2 = 6` and `h(-2) = 16 + 8 - 4 - 2 = 18`. Not equal.","_n":"1x0a3","_k":"4293bce1"},{"t":"Test `x = 0` as well: `h(0) = 0`, so it’s even.","why":"More single values can still mislead. Check the terms.","_n":"1y093","_k":"3261deb0"},{"t":"`h(1) = h(-1) = 0`, so `h` is odd.","why":"Matching zeros don’t make it odd either: `h(2) = 6` but `-h(-2) = -18`.","_n":"1z083","_k":"2ec4821e"}],"hints":["Does one matching pair prove it for every `x`?","Try `x = 2` and `x = -2`.","Step 3 is wrong: `h(2) ≠ h(-2)`. Testing the terms shows `h` is neither."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the sign-flipper: the constant, the one-value test, or `(x - 1)^2`?"},{"id":"j2","q":"In your own words, why do only the odd-power terms change sign when you replace `x` with `-x`?"},{"id":"j3","q":"Explain to a friend how to show algebraically that a function is odd. What two things do you compare?"},{"id":"j4","q":"Which part are you still unsure about: the algebra, the symmetry, or using symmetry to find values? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`f(x) = 2x^4 - x^3 + 5x`. What is `f(-x)`?","options":[{"t":"`2x^4 + x^3 - 5x`","why":"The odd-power terms `-x^3` and `5x` flip; `2x^4` doesn’t.","_n":"20073","_k":"3686c695"},{"t":"`-2x^4 - x^3 - 5x`","why":"That flips `2x^4` and leaves `-x^3` alone: the wrong way round.","_n":"210e3","_k":"06b5edd5"},{"t":"`2x^4 - x^3 - 5x`","why":"`-x^3` flips too: `-(-x)^3 = +x^3`.","_n":"220d3","_k":"80612adb"},{"t":"`-2x^4 + x^3 - 5x`","why":"`(-x)^4 = x^4`, so `2x^4` stays positive. (This is `-f(x)`.)","_n":"230c3","_k":"540c8f21"}]},"b":{"prompt":"`g(x) = -3x^5 + x^2 - 4`. What is `g(-x)`?","options":[{"t":"`3x^5 + x^2 - 4`","why":"Only the odd-power term `-3x^5` flips.","_n":"240b3","_k":"d9482e58"},{"t":"`-3x^5 + x^2 - 4`","why":"`-3(-x)^5 = +3x^5`: the odd power flips.","_n":"25123","_k":"33607879"},{"t":"`3x^5 - x^2 - 4`","why":"`(-x)^2 = x^2`, so `x^2` stays positive.","_n":"26113","_k":"4fd727a9"},{"t":"`3x^5 - x^2 + 4`","why":"`x^2` and −4 don’t flip. (This is `-g(x)`.)","_n":"27985","_k":"17265a83"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which function is odd?","options":[{"t":"`y = x^4 - x`","why":"`x^4` is an even power: neither.","_n":"28995","_k":"1fcfd699"},{"t":"`y = x^2 + x^4`","why":"Both powers are even: that’s even.","_n":"29965","_k":"b8445b17"},{"t":"`y = x^3 + x`","why":"Powers 3 and 1: both odd, no constant.","_n":"2a975","_k":"66fff445"},{"t":"`y = x^3 + 1`","why":"The constant 1 doesn’t flip, so it’s neither.","_n":"2b9c5","_k":"2817e32d"}]},"b":{"prompt":"Which function is even?","options":[{"t":"`y = x^4 + x`","why":"The `x` term flips: neither.","_n":"2c9d5","_k":"84293d7b"},{"t":"`y = x^3`","why":"That’s odd.","_n":"2d9a5","_k":"06b01545"},{"t":"`y = x^4 - 3x^2 + 8`","why":"Powers 4, 2 and 0: all even.","_n":"2e9b5","_k":"b3c7dcd4"},{"t":"`y = (x + 1)^2`","why":"`x^2 + 2x + 1`: the `2x` term flips, so it’s neither.","_n":"2f905","_k":"8aefe2da"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which symmetry does the graph of every odd function have?","options":[{"t":"A half-turn about the origin maps it onto itself","why":"`(a, b)` on the graph means `(-a, -b)` is too.","_n":"2g915","_k":"8c18ac61"},{"t":"Symmetry in the `y`-axis","why":"That’s even functions.","_n":"2h1e5","_k":"782072b5"},{"t":"Symmetry in the `x`-axis","why":"A function’s graph can’t be symmetric in the `x`-axis unless it lies on it.","_n":"2i1d5","_k":"41bc8bf1"},{"t":"Symmetry in the line `y = x`","why":"That’s a function and its inverse.","_n":"2j205","_k":"4a79ead3"}]},"b":{"prompt":"Which symmetry does the graph of every even function have?","options":[{"t":"Symmetry in the `x`-axis","why":"A function’s graph can’t be symmetric in the `x`-axis unless it lies on it.","_n":"2k1f5","_k":"0e47833d"},{"t":"Symmetry in the `y`-axis","why":"`(a, b)` on the graph means `(-a, b)` is too.","_n":"2l1a5","_k":"868031e2"},{"t":"Symmetry in the line `y = x`","why":"That’s a function and its inverse.","_n":"2m195","_k":"c053835c"},{"t":"A half-turn about the origin maps it onto itself","why":"That’s odd functions.","_n":"2n1c5","_k":"66415349"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"`f(x) = x^5 - 2x^3 + kx^2`, where `k` is a constant. For which value of `k` is `f` odd?","options":[{"t":"−2","why":"Then the `-2x^2` term doesn’t flip, so `f` isn’t odd.","_n":"2o1b5","_k":"36bc5b1d"},{"t":"0","why":"`kx^2` is an even-power term; it must vanish.","_n":"2p165","_k":"5c795731"},{"t":"2","why":"Then the `2x^2` term doesn’t flip, so `f` isn’t odd.","_n":"2q155","_k":"61842c04"},{"t":"Any value of `k`, because the degree is odd","why":"Every term must be an odd power. The degree alone doesn’t decide.","_n":"2r231","_k":"12748c44"}]},"b":{"prompt":"`g(x) = x^4 + kx^3 - 6`, where `k` is a constant. For which value of `k` is `g` even?","options":[{"t":"0","why":"`kx^3` is an odd-power term; it must vanish.","_n":"2s221","_k":"a9140b43"},{"t":"Any value of `k`, because the degree is even","why":"Every term must be an even power. The degree alone doesn’t decide.","_n":"2t211","_k":"8252bed0"},{"t":"−6","why":"Then the `-6x^3` term flips, so `g` isn’t even.","_n":"2u201","_k":"4be09cf4"},{"t":"6","why":"Then the `6x^3` term flips, so `g` isn’t even.","_n":"2v1f1","_k":"4587abe4"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`f` is odd, `f(2) = 5` and `f(4) = -1`. What is `f(-4) + f(-2)`?","options":[{"t":"−6","why":"`f(-4) = -f(4) = +1`, not −1.","_n":"2w1e1","_k":"96275c7e"},{"t":"−4","why":"`f(-4) = -(-1) = 1` and `f(-2) = -5`. Sum: −4.","_n":"2x1d1","_k":"388f883f"},{"t":"4","why":"That uses the even rule: `f(-4) = -1` and `f(-2) = 5`.","_n":"2y1c1","_k":"81e4bd2a"},{"t":"6","why":"`f(-2) = -f(2) = -5`, not 5.","_n":"2z1b1","_k":"5bec7ab4"}]},"b":{"prompt":"`g` is even, `g(1) = -3` and `g(5) = 2`. What is `g(-1) - g(-5)`?","options":[{"t":"−5","why":"`g(-1) = -3` and `g(-5) = 2`. −3 − 2 = −5.","_n":"301a1","_k":"4526c641"},{"t":"−1","why":"`g(-5) = g(5) = 2`, so subtract 2: −3 − 2.","_n":"311d1","_k":"9532454e"},{"t":"1","why":"`g(-1) = g(1) = -3`, not 3.","_n":"321e1","_k":"c919f718"},{"t":"5","why":"That uses the odd rule: `g(-1) = 3` and `g(-5) = -2`.","_n":"331f1","_k":"96322f8a"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"`f(x) = x^2` is even and `g(x) = x^3 - x` is odd. Is `h(x) = f(x) · g(x)` even, odd or neither?","options":[{"t":"Both even and odd","why":"Only the zero function is both.","_n":"34201","_k":"b64b97ea"},{"t":"Odd","why":"`h(-x) = f(-x) · g(-x) = f(x) · (-g(x)) = -h(x)`. Check: `h(x) = x^5 - x^3`, all odd powers.","_n":"35191","_k":"a73a6e98"},{"t":"Even","why":"`f` is even, but `g` contributes a sign change to every product.","_n":"361a1","_k":"65728120"},{"t":"Neither","why":"Expand: `x^5 - x^3` has only odd powers.","_n":"371b1","_k":"f78d3c6a"}]},"b":{"prompt":"`f(x) = x^3 - x` and `g(x) = 2x` are both odd. Is `h(x) = f(x) · g(x)` even, odd or neither?","options":[{"t":"Neither","why":"Expand: `2x^4 - 2x^2` has only even powers.","_n":"381c1","_k":"bb21d1e0"},{"t":"Even","why":"`h(-x) = (-f(x)) · (-g(x)) = h(x)`. Check: `h(x) = 2x^4 - 2x^2`, all even powers.","_n":"39151","_k":"3b255950"},{"t":"Odd, because both factors are odd","why":"Two sign changes cancel: odd × odd is even.","_n":"3a161","_k":"03b44e88"},{"t":"Both even and odd","why":"Only the zero function is both.","_n":"3b8f1","_k":"16735694"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which line correctly shows that `f(x) = x^3 - 4x` is odd?","options":[{"t":"`f(-x) = (-x)^3 - 4(-x) = -x^3 + 4x = -(x^3 - 4x) = -f(x)`","why":"Every step is shown, and it ends in `-f(x)`.","_n":"3c8e1","_k":"fa377035"},{"t":"`f(-x) = x^3 + 4x = -f(x)`","why":"`(-x)^3 = -x^3`, and `x^3 + 4x` isn’t `-f(x)`.","_n":"3d911","_k":"4d814b6a"},{"t":"`f(1) = -3` and `f(-1) = 3`, so `f` is odd.","why":"One pair of values isn’t a proof.","_n":"3e901","_k":"77bb0b9e"},{"t":"`f(-x) = -x^3 - 4x = -f(x)`","why":"`-4(-x) = +4x`. And `-x^3 - 4x` isn’t `-f(x)`.","_n":"3f8b1","_k":"8d66d804"}]},"b":{"prompt":"Which line correctly shows that `g(x) = x^4 + 2x^2` is even?","options":[{"t":"`g(-x) = -g(x)`, because the degree is even.","why":"That’s the odd test, and the degree doesn’t decide.","_n":"3g8a1","_k":"66586052"},{"t":"`g(2) = 24` and `g(-2) = 24`, so `g` is even.","why":"One pair of values isn’t a proof.","_n":"3h8d1","_k":"8821cf9c"},{"t":"`g(-x) = -x^4 - 2x^2 = g(x)`","why":"`(-x)^4 = x^4`. And `-x^4 - 2x^2` isn’t `g(x)`.","_n":"3i8c1","_k":"d111b446"},{"t":"`g(-x) = (-x)^4 + 2(-x)^2 = x^4 + 2x^2 = g(x)`","why":"Every step is shown, and it ends in `g(x)`.","_n":"3j971","_k":"deb9ea31"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why `f(x) = x^3 + 1` is neither even nor odd, even though its degree is odd?","options":[{"t":"The constant 1 is an even-power term (`1 = x^0`). It doesn’t change sign when `x → -x`, so `f(-x) = -x^3 + 1` matches neither `f(x)` nor `-f(x)`.","why":"It names the term that breaks the pattern and compares `f(-x)` with both `f(x)` and `-f(x)`.","_n":"3k961","_k":"b838935d"},{"t":"Because 1 is positive.","why":"−1 would cause the same problem. Any non-zero constant does.","_n":"3l091","_k":"28627c39"},{"t":"Because odd-degree functions are always neither.","why":"`x^3 + x` has odd degree and is odd.","_n":"3m0a1","_k":"8b94be8c"},{"t":"Because a cubic graph can’t be symmetric.","why":"`y = x^3` is symmetric under a half-turn about the origin.","_n":"3n071","_k":"70b6168d"}]},"b":{"prompt":"Which is the best explanation of why `g(x) = (x - 3)^2` is not even, even though it’s a square?","options":[{"t":"Because squares are always odd.","why":"`x^2` is a square and it’s even.","_n":"3o081","_k":"45fbadc7"},{"t":"Because `g(0) ≠ 0`.","why":"Even functions don’t need `g(0) = 0`: `x^2 + 1` is even.","_n":"3p0d1","_k":"70de46bc"},{"t":"Because 3 is an odd number.","why":"`(x - 2)^2` isn’t even either. The shift is the problem, not the 3.","_n":"3q0e1","_k":"9371cd24"},{"t":"Expanding gives `x^2 - 6x + 9`. The `-6x` term changes sign when `x → -x`, so `g(-x) ≠ g(x)`. The graph is symmetric about `x = 3`, not the `y`-axis.","why":"It expands first, names the odd-power term that flips, and links it to the graph’s symmetry about `x = 3`.","_n":"3r0b1","_k":"d2f4321b"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"An engineer records a signal that is an odd function of time `t` (measured from the centre of the recording). At `t` = 1, 2 and 3 s the readings are 0.5, 1.2 and 0.9. What is the sum of the readings at `t` = −3, −2, −1, 0, 1, 2 and 3?","options":[{"t":"−2.6","why":"That adds only the negative times.","_n":"3s0c1","_k":"636f0430"},{"t":"0","why":"Odd: each negative-time reading is the opposite of its positive partner, and the reading at `t` = 0 is 0. Everything cancels.","_n":"3t111","_k":"41a45af5"},{"t":"2.6","why":"That adds only the positive times. The negative times cancel them.","_n":"3u121","_k":"4b534960"},{"t":"5.2","why":"That uses the even rule: the negative times would repeat 0.5, 1.2, 0.9.","_n":"3v8b0","_k":"c9209adf"}]},"b":{"prompt":"A different signal is an even function of `t`. At `t` = 0 the reading is 2, and at `t` = 1, 2 and 3 s the readings are 0.5, 1.2 and 0.9. What is the sum of the readings at `t` = −3, −2, −1, 0, 1, 2 and 3?","options":[{"t":"2","why":"That uses the odd rule, where the pairs cancel.","_n":"3w8a0","_k":"6aa7cbe5"},{"t":"4.6","why":"That counts 0.5, 1.2, 0.9 only once.","_n":"3x890","_k":"be6713ea"},{"t":"5.2","why":"Don’t forget the reading at `t` = 0.","_n":"3y880","_k":"b9e6bae2"},{"t":"7.2","why":"Even: the negative times repeat 0.5, 1.2, 0.9. Sum: 2 + 2 × 2.6 = 7.2.","_n":"3z8f0","_k":"c849afe4"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"An odd polynomial function has a local maximum at (−2, 16). Which statement must be true?","options":[{"t":"It has a local minimum at (2, −16), and `f(0) = 16`.","why":"Odd polynomials have `f(0) = 0`.","_n":"408e0","_k":"b195b15f"},{"t":"It has a local minimum at (2, −16), and `f(0) = 0`.","why":"A half-turn sends (−2, 16) to (2, −16) and turns the peak into a valley. Odd polynomials pass through the origin.","_n":"418d0","_k":"74ffe2c4"},{"t":"It has a local maximum at (2, 16), and `f(0) = 0`.","why":"That’s the even rule (a mirror in the `y`-axis).","_n":"428c0","_k":"308babfb"},{"t":"It has a local minimum at (−2, −16), and `f(0) = 0`.","why":"That reflects in the `x`-axis, which isn’t a symmetry of the graph.","_n":"43930","_k":"5f5524d5"}]},"b":{"prompt":"An even polynomial function has a local minimum at (3, −5) and `y`-intercept 4. Which statement must be true?","options":[{"t":"(−3, −5) is also a local minimum.","why":"A mirror in the `y`-axis sends (3, −5) to (−3, −5), and a valley stays a valley.","_n":"44920","_k":"e58465c8"},{"t":"(−3, −5) is a local maximum.","why":"A mirror image of a valley is still a valley.","_n":"45850","_k":"6006f6f2"},{"t":"(−3, 5) is a local maximum.","why":"That’s the half-turn, the odd rule.","_n":"46860","_k":"e0b41d1a"},{"t":"(3, 5) is a local maximum.","why":"That reflects in the `x`-axis.","_n":"47870","_k":"d91acc92"}]}}]},"task":{"title":"Build an odd function to spec","summary":"Build an odd function to spec","statement":"\u003cp>Use the term tiles to build a polynomial that meets every line of the spec. There are many answers. Can you find more than one?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The spec\u003c/h4>\u003col class=\"spec\">\u003cli>The function is odd.\u003c/li>\u003cli>Degree 5, with end behaviour Q2 to Q4.\u003c/li>\u003cli>Its graph passes through (−1, −2).\u003c/li>\u003cli>Exactly 3 `x`-intercepts.\u003c/li>\u003c/ol>\u003c/div>","checks":["Odd","Degree 5, Q2 to Q4","Passes through (−1, −2)","Exactly 3 `x`-intercepts"],"tips":["An odd function has only odd-power terms: remove the `x^4`, `x^2` and constant tiles.","Q2 to Q4 with degree 5 needs a negative `x^5` coefficient.","`f(-1) =` {value}. For an odd function, `f(-1) = -2` is the same as `f(1) = 2`: make the coefficients add to 2.","Your graph has {k} `x`-intercepts. An odd function always crosses at 0; you need exactly one more pair, ±`r`."],"explainPrompt":"Explain why passing through (−1, −2) was the same as making the coefficients add to 2, and how you got exactly 3 `x`-intercepts.","vocab":"Use the words odd function, `f(-x) = -f(x)`, coefficient and `x`-intercept.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Every answer has coefficients adding to 2: for an odd function, passing through (−1, −2) is the same as passing through (1, 2)."},"cards":[["`(-x)^n`","`x^n` when `n` is even; `-x^n` when `n` is odd."],["Even function","`f(-x) = f(x)` for every `x`. Only even powers (a constant counts). Symmetric in the `y`-axis."],["Odd function","`f(-x) = -f(x)` for every `x`. Only odd powers, no constant. A half-turn about the origin maps the graph onto itself."],["Neither","A mixture of even and odd powers. Most polynomials are neither."],["Is a constant an even or odd power?","Even: `c = c · x^0`. A non-zero constant stops a function from being odd."],["Does the degree decide?","No. `x^3 + 1` has odd degree and is neither; every term must pass."],["`f(-x)` vs `-f(x)`","`f(-x)`: replace `x` (reflects in the `y`-axis). `-f(x)`: negate every output (reflects in the `x`-axis)."],["Why one value isn’t proof","`x^3 - 4x + 1` has `f(2) = f(-2) = 1` but is neither. The test must hold for every `x`."],["Odd polynomials and the origin","`f(0) = -f(0)`, so `f(0) = 0`: every odd polynomial passes through (0, 0)."],["Is `(x - 1)^2` even?","No: `x^2 - 2x + 1` has an odd-power term. Its graph is symmetric about `x = 1`."]]}};</script>
