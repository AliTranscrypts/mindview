.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 03: budget bars, shape lab controls, TC3 reasons, "Possible or impossible?" cards */
.slider[hidden],.btn[hidden],.lab-zoom[hidden],.imp-r[hidden],#p3-app [hidden]{display:none!important}
.hero-eq .lt{font-size:.5em;font-style:normal;color:var(--ink-2);white-space:nowrap;letter-spacing:0}
.hero-far{font-size:.95em}
.bud{display:grid;gap:8px;margin:0 0 14px}
.bud-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px}
.bud-lab{font-weight:700;font-size:.95rem}
.bud-lab b{font-size:1.12rem}
.bud-slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bud-g{display:inline-flex;gap:3px}
.bud-g.pair{padding:2px;border:1px dashed var(--ink-2);border-radius:5px}
.bud-s{display:inline-block;width:20px;height:16px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet);transition:background-color .25s,border-color .25s}
.bud-s.on{background:var(--pen);border-color:var(--pen)}
.hero-bud{opacity:0;transition:opacity .6s;margin:12px 0 0;font-size:.95rem}
.hero-bud.on{opacity:1}
.lab-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.lab-lab{font-weight:700;font-size:.92rem}
.chips.lab-chips{margin:0;gap:6px}
.nchip .m{font-size:1em}
.nchip[aria-pressed="true"]{background:var(--sheet);color:var(--ink);border-color:var(--pen);box-shadow:inset 0 0 0 1.5px var(--pen)}
.lab-more{margin:6px 0 4px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.lab-more summary{font-weight:700;cursor:pointer}
.lab-more[open] summary{margin-bottom:8px}
.lab-more .btn{margin-top:4px}
.zstops{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2);margin:-2px 0 4px}
.imp{margin:10px 0 0}
.imp-r{display:grid;gap:6px;margin-top:10px}
.pc-fig{margin:0}
.pc-fig figcaption{font:400 1.25rem var(--font-math);text-align:center;margin-top:8px;min-height:1.4em}
.pc-alg{display:block;font:400 .92rem var(--font-ui);color:var(--ink-2);margin-top:4px}
.pc-text{border:2px dashed var(--ink-2);border-radius:8px;padding:24px 18px;font-size:1.2rem;text-align:center;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.pc-text p{margin:0}
.pc-claim{font:400 1.5rem var(--font-math);margin:0 0 10px}
.pc-q{font-weight:700;font-size:.95rem;margin:0 0 6px}
.pc-verdict{display:flex;flex-wrap:wrap;gap:8px}
.pc-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc-chip{border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.45em .8em;text-align:left;min-height:40px;font-size:.95rem}
.pc-verdict .pc-chip{min-width:8.5rem;font-weight:700;text-align:center}
.pc-chip[aria-checked="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
.pc-chip:not(:disabled):hover{border-color:var(--pen)}
.pc-chip:disabled{opacity:.8}
.pc-chip .m{white-space:normal}

g-the-six-trig-functions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"54168f55","content":{"id":"03-characteristics-of-polynomial-functions","kind":"topic","title":"Characteristics of polynomial functions","topic":"Characteristics of Polynomial Functions","readyTopic":"characteristics of polynomial functions","hero":{"eq":"y = \u003cspan class=\"va\">a\u003c/span>x\u003csup class=\"vn\">n\u003c/sup> + \u003cspan class=\"lt\">(lower terms)\u003c/span>","eqLabel":"y equals a x to the power n, plus lower terms","eqSize":"md","headline":"The leading term runs the show","text":"A \u003cstrong>polynomial function\u003c/strong> adds up terms like `3x^4`, `-x^2` and 7, with whole-number powers. The highest power is the \u003cstrong>degree\u003c/strong> `@n{n}`, and its coefficient is the \u003cstrong>leading coefficient\u003c/strong> `@a{a}`. The lower terms make the bumps in the middle. But far out, the leading term wins, and `@n{n}` also caps how many times the graph can cross the axis and turn.","fig":{"html":"\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"Graph of y = x⁴ − 5x² + 4 with its 4 x-intercepts and 3 turning points, then zoomed out until it matches y = x⁴\">\u003c/canvas>\u003cdiv class=\"bud hero-bud\" id=\"hero-bud\" aria-hidden=\"true\">\u003c/div>"}},"goals":["I can decide whether a function is a polynomial and state its degree and leading coefficient, even when it isn’t written in standard form.","I can use the degree and the sign of the leading coefficient to describe end behaviour, in quadrant form and in arrow form.","I can state the most `x`-intercepts and turning points a polynomial of degree `n` can have, and which numbers of turning points are possible.","I can state the domain and describe the range of a polynomial function from its degree and leading coefficient.","I can tell polynomial functions apart from exponential and sinusoidal functions by their graphs and equations.","I can decide whether a sketch could be the graph of a polynomial with a given degree and leading coefficient, and name the rule it breaks if not."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Power functions","goal":2,"prompt":"What is the end behaviour of `y = -2x^3`?","options":[{"t":"Q3 to Q4","why":"Both arms down happens for even degree with `a \u003c 0`. Odd degree sends the arms opposite ways.","_n":"0ae5","_k":"8b1bb8b0"},{"t":"Q2 to Q1","why":"Both arms up is `x^2`, `x^4`, … with a positive coefficient.","_n":"1ad5","_k":"4faab3e4"},{"t":"Q2 to Q4","why":"Odd degree: the arms point opposite ways. The negative coefficient sends the left arm up (Q2) and the right arm down (Q4).","_n":"2ac5","_k":"57c0714b"},{"t":"Q3 to Q1","why":"That’s `y = 2x^3`. A negative `a` reflects the graph in the `x`-axis.","_n":"3ab5","_k":"3bab7f94"}],"hints":["Is the degree even or odd? Then look at the sign of `a`.","Odd degree: opposite directions. With `a \u003c 0` the right arm goes down.","Right arm down (Q4), left arm up (Q2): Q2 to Q4."]},{"id":"w2","skill":"Power functions","goal":2,"prompt":"The graph of `y = ax^n` has both arms pointing down. What must be true?","options":[{"t":"`n` is even and `a > 0`","why":"Even with `a > 0` is `x^2`, both arms up.","_n":"4aa5","_k":"42c13b68"},{"t":"`n` is even and `a \u003c 0`","why":"Even degree sends both arms the same way; a negative coefficient makes that way down.","_n":"5a95","_k":"dd122d9e"},{"t":"`n` is odd and `a \u003c 0`","why":"With odd `n` the arms point opposite ways, whatever the sign of `a`.","_n":"6a85","_k":"9f3d05a7"},{"t":"`n` is odd and `a > 0`","why":"That’s `x^3`: Q3 to Q1.","_n":"7a75","_k":"09fc0b51"}],"hints":["First decide: same direction or opposite directions?","Same direction means even degree. Up or down depends on the sign of `a`.","Both down: even `n` and negative `a`."]},{"id":"w3","skill":"Multiplying polynomials","goal":1,"prompt":"When `(x^2 + 3)(2x^3 - x)` is expanded, which term has the highest power?","options":[{"t":"`x^5`","why":"The power is right, but the coefficient is 1 × 2 = 2.","_n":"8a65","_k":"10265c1b"},{"t":"`2x^6`","why":"`x^2 × x^3 = x · x · x · x · x = x^5`. Exponents add when you multiply.","_n":"9a69","_k":"25977bae"},{"t":"`6x^3`","why":"`3 × 2x^3 = 6x^3` is one of the terms, but `x^2 × 2x^3` gives a higher power.","_n":"aa79","_k":"9baae5f3"},{"t":"`2x^5`","why":"`x^2 × 2x^3 = 2x^5`: the exponents add. No other pair of terms gives a higher power.","_n":"ba49","_k":"6d82d638"}],"hints":["The highest power comes from multiplying the highest-power term in each bracket.","That’s `x^2` from the first bracket and `2x^3` from the second.","`x^2 × 2x^3 = 2x^5`."]},{"id":"w4","skill":"Exponents and function types","goal":1,"prompt":"Which expression equals `1/x^2`?","options":[{"t":"`x^{1/2}`","why":"`x^{1/2}` is `√x`, not `1/x^2`.","_n":"ca59","_k":"84fd2837"},{"t":"`x^{-1/2}`","why":"`x^{-1/2} = 1/√x`.","_n":"daa9","_k":"23c99cfc"},{"t":"`x^{-2}`","why":"A negative exponent means a reciprocal: `x^{-2} = 1/x^2`.","_n":"eab9","_k":"a16ada89"},{"t":"`-x^2`","why":"`-x^2` is negative for every `x ≠ 0`; `1/x^2` is positive.","_n":"fa89","_k":"24aea333"}],"hints":["What does a negative exponent mean?","`x^{-n} = 1/x^n`.","So `1/x^2 = x^{-2}`."]},{"id":"w5","skill":"Exponents and function types","goal":5,"prompt":"Which function’s graph has a horizontal asymptote?","options":[{"t":"`y = x^3`","why":"`x^3` flattens at the origin, then keeps going: its arms go to ±∞.","_n":"ga99","_k":"4ff6dde7"},{"t":"`y = x^2`","why":"A parabola’s arms go up forever. Near the vertex it’s flat for a moment, but it doesn’t approach a line.","_n":"h9e9","_k":"ea9e0a14"},{"t":"`y = 2^x`","why":"As `x → -∞`, `2^x` gets closer and closer to 0, so `y = 0` is a horizontal asymptote.","_n":"i9f9","_k":"85361789"},{"t":"`y = sin x`","why":"`sin x` keeps oscillating between −1 and 1. It never settles toward one value.","_n":"j209","_k":"ce1d3c52"}],"hints":["An asymptote is a line the graph gets closer and closer to, far out.","Which graph levels off as `x` goes far to one side?","`2^x` shrinks toward 0 as `x → -∞`: `y = 0` is its horizontal asymptote."]},{"id":"w6","skill":"Domain and range","goal":4,"prompt":"What is the range of `y = -(x - 3)^2 + 4`?","options":[{"t":"`{y ∈ ℝ}`","why":"A parabola only goes one way from its vertex. Values above 4 are never reached.","_n":"k1f9","_k":"c147628c"},{"t":"`{y ∈ ℝ | y ≤ 3}`","why":"3 is the `x`-coordinate of the vertex. The range uses its `y`-coordinate, 4.","_n":"l1e9","_k":"a71404d0"},{"t":"`{y ∈ ℝ | y ≥ 4}`","why":"The −1 in front makes it open down: 4 is the top, not the bottom.","_n":"m1d9","_k":"2ceecc7c"},{"t":"`{y ∈ ℝ | y ≤ 4}`","why":"The parabola opens down with vertex (3, 4), so 4 is its highest value.","_n":"n1c9","_k":"afa45233"}],"hints":["Find the vertex and the direction of opening.","Vertex (3, 4); the −1 means it opens down.","Highest value 4: `{y ∈ ℝ | y ≤ 4}`."]}],"refreshers":{"Power functions":"For `y = ax^n`: even `n` sends both arms the same way (up if `a > 0`, down if `a \u003c 0`); odd `n` sends them opposite ways (Q3 to Q1 if `a > 0`, Q2 to Q4 if `a \u003c 0`). Example: `-2x^3` goes Q2 to Q4.","Multiplying polynomials":"When you multiply powers, the exponents add: `x^2 · x^3 = x^5`. So the highest-power term of a product comes from multiplying the highest-power terms of the factors: `(x^2 + 3)(2x^3 - x)` starts with `2x^5`.","Exponents and function types":"`x^{-n} = 1/x^n` and `x^{1/2} = √x`. In an exponential function like `2^x`, the variable is the exponent; its graph levels off toward a horizontal asymptote on one side. A sinusoidal function like `sin x` repeats forever between a highest and a lowest value.","Domain and range":"The range is every `y`-value the graph reaches. For a parabola, find the vertex: if it opens down, the range is `y ≤` (vertex’s `y`); if up, `y ≥` (vertex’s `y`). Example: `-(x - 3)^2 + 4` has range `{y ∈ ℝ | y ≤ 4}`."}}},"explore":{"heading":"Polynomial shape lab","intro":"Pick a degree and a leading coefficient, then use the other sliders to bend the graph. Watch the two budget bars: can you ever beat them? Then zoom out and see who’s really in charge.","predIntro":"Make a prediction first. Then the shape lab will show you what really happens.","predictions":[{"id":"p1","start":{"n":4,"a":1,"p":0,"q":-5,"r":0,"s":4},"prompt":"The graph shows `y = x^4 - 5x^2 + 4`. The constant term `s` will slide from 4 up to 10. How many `x`-intercepts will the graph have at the end?","options":[{"t":"3","_n":"o1b9","_k":"708802f4"},{"t":"4, because a degree 4 graph has 4 intercepts","_n":"p1a9","_k":"047f4ac0"},{"t":"0","_n":"q199","_k":"d364f1a6"},{"t":"2","_n":"r289","_k":"7c46b162"}],"explain":"Changing `s` moves the whole graph up without changing its shape, so it keeps its 3 turning points. The valleys’ lowest height is `s - 6.25`, so once `s > 6.25` the graph never meets the axis. Degree 4 allows \u003cstrong>up to\u003c/strong> 4 intercepts, not exactly 4."},{"id":"p2","start":{"n":3,"a":-1,"p":0,"q":9,"r":0,"s":4},"prompt":"The lab shows `y = 4 + 9x^2 - x^3`, written here in that order. Switch to Zoom out and go to ×100. Which way will the arms point?","options":[{"t":"Q2 to Q4","_n":"s279","_k":"66d6310f"},{"t":"Q3 to Q4","_n":"t1a9","_k":"4a23b07c"},{"t":"Q3 to Q1","_n":"u1b9","_k":"dfda0396"},{"t":"Q2 to Q1","_n":"v1c9","_k":"9fa2dfd8"}],"explain":"The leading term is `-x^3`: the highest power, even though it’s written last. At `x = 100`, `-x^3 = -1 000 000` while `9x^2 = 90 000` and 4 is nothing. Odd degree, negative coefficient: Q2 to Q4. 9 is the biggest coefficient, but a bigger power always wins far out."},{"id":"p3","start":{"n":3,"a":1,"p":0,"q":0,"r":-3,"s":0},"prompt":"The graph shows `y = x^3 - 3x`. A tiny term, `0.1x^4`, will be added. What happens?","options":[{"t":"Nothing changes: `0.1x^4` is too small to matter","_n":"w1d9","_k":"8a5d596e"},{"t":"Far to the left, the left arm turns up, and a new turning point appears","_n":"x169","_k":"3a51af6c"},{"t":"The right arm turns down","_n":"y179","_k":"2ede0e4b"},{"t":"Both arms now point down","_n":"z189","_k":"2725670f"}],"explain":"Now the degree is 4 and `a = 0.1 > 0`, so both arms must point up. Near the origin `0.1x^4` is tiny, but at `x = -20` it’s 16 000, while `x^3` is only −8000. To turn the left arm around, the graph needs one more turning point: 3, an odd number, as degree 4 requires."},{"id":"p4","start":{"n":5,"a":1,"p":0,"q":0,"r":0,"s":0},"prompt":"The graph shows `y = x^5`. Which numbers of turning points can a degree 5 polynomial have?","options":[{"t":"Any number from 0 to 4","_n":"10199","_k":"8ae659d9"},{"t":"1, 3 or 5","_n":"11229","_k":"f566772a"},{"t":"Exactly 4","_n":"12239","_k":"289bdcc8"},{"t":"0, 2 or 4","_n":"13149","_k":"e07d0f58"}],"explain":"Degree 5 has its arms pointing opposite ways. Starting from the left arm, every turn reverses direction, and you must end heading the way the right arm points. So the turns come in pairs: 0, 2 or 4, never 1 or 3. And never 5, because the most is `n - 1 = 4`."}],"chalIntro":"Set the lab, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,6],"prompt":"With degree 4 and a positive leading coefficient, make a graph with exactly \u003cstrong>2\u003c/strong> `x`-intercepts and \u003cstrong>3\u003c/strong> turning points.","why":"With the middle hump below the axis, only the two outer arms cross it, as in `y = x^4 - 5x^2 - 2`.","hints":["Start from the W-shape preset. It has 3 turning points already.","Count the crossings: two valleys and a hump. Which part has to stay on the other side of the axis?","Push the middle hump below the axis: `y = x^4 - 5x^2 - 2` crosses only twice."]},{"id":"tc2","goal":[3,6],"prompt":"With degree 3 and a negative leading coefficient, make a graph with exactly \u003cstrong>1\u003c/strong> `x`-intercept but \u003cstrong>2\u003c/strong> turning points.","why":"Both turning points are on the same side of the axis, so the cubic crosses only once, as in `y = -x^3 + 3x + 5`.","hints":["First get 2 turning points: a cubic needs a positive `r` here to bend.","A cubic always crosses at least once. To cross only once, both turning points must be on the same side of the axis.","`y = -x^3 + 3x + 5`: turning points at (−1, 3) and (1, 7), both above the axis, so it crosses once, on the right."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"With degree 4, try to make a graph with exactly \u003cstrong>2\u003c/strong> turning points. When you’re convinced it can’t be done, press \u003cstrong>It’s impossible\u003c/strong> and choose the reason.","reasons":[{"t":"A quartic’s arms point the same way, so it must turn an odd number of times.","why":"","_n":"14139","_k":"7bc877c0"},{"t":"2 is more than `n - 1`.","why":"`n - 1 = 3`, and 2 is less than that. The maximum isn’t the problem.","_n":"15169","_k":"a0f571fb"},{"t":"Every quartic has exactly 3 turning points.","why":"`y = x^4` has only 1. The rule is about which counts are possible.","_n":"16159","_k":"e74d0d2b"},{"t":"It can be done with a negative `a`.","why":"Flipping the graph doesn’t change how many times it turns.","_n":"17189","_k":"d7a79e53"}],"why":"The arms are fixed by the leading term, so turns come in pairs. Degree 4 (arms the same way) needs an odd number: 1 or 3, never 2.","hints":["Trace a quartic with `a > 0` from the left: it comes down from Q2. Which way must it be heading at the very end?","Each turn reverses direction. After 2 turns, which way is it heading?","After an even number of turns it would be heading down again, but the right arm must go up. So the number of turns must be odd: reason A."]}]},"part3":{"slug":"possible","name":"Possible?","heading":"Possible or impossible?","intro":"Each card shows a sketch and a claim about its degree and leading coefficient. Decide whether a polynomial like that could have this graph. If not, name the rule it breaks.","rules":[{"id":"ends","t":"End behaviour doesn’t match","name":"end behaviour"},{"id":"turns","t":"Too many turning points","name":"number of turning points"},{"id":"ints","t":"Too many `x`-intercepts","name":"number of `x`-intercepts"},{"id":"parity","t":"Wrong kind of number of turning points (odd/even)","name":"kind of number of turning points (odd or even)"}],"cards":[{"id":"s1","claim":"Degree 4, `a > 0`","desc":"Sketch: both arms up; 3 turning points; crosses the x-axis 4 times.","view":{"xmin":-3,"xmax":3,"ymin":-5,"ymax":11},"_a":"ThZHFAJEZRcZFlJZGlxuARkEHRsNSgUZBGkdFF0XFw8XVEgWBUZNawEUHBYNHmsHFR8RAlhEGRdTVhMMQ0RQW1FHEwwaIlBSR1FUFgxGQlxBXBFWWUYLFQVUEUVdCFFGFVZeQlBGVEdYRxFDSEoVVFtQEUJQB0HXta1CFk8OVEEVQFlTGBVeUEFXWRZLDlpCRhoTGhoSQEdbRxMMGiJQUkdRVBYMRlRZWVtGRRgTRRVBWxEFGBJAR1tdX1EYFlpcW0BCDRhVFVxGFFdfVgMbFxkWWFhMFRcPF3BUUUoDUBUBFFBaVAlCRhVBQRZMCRUBFVRJVhUPW0FQRlJTSBJGDhUAEV9LRlNcW1EfFBRERVRHXUVPGlwXcVBTQ1NdRgEVQUFDWEtGVFsVW1VSGAhAWFdRQxZXABVBXFlURQNGBhVcRxFZXAIZFUZbEUJQB0HXta1CFl4PW1AbFkxL"},{"id":"s2","claim":"Degree 3, `a \u003c 0`","desc":"Sketch: rises from Q3 to Q1; 2 turning points; crosses the x-axis 3 times.","view":{"xmin":-3,"xmax":3,"ymin":-8,"ymax":8},"_a":"ThZHFAJEfBcZFkNDVANGFw9vE1NWAkYXaBgTQkhED25uGQAYCkoGaBlvABgKShgGaGkdFFkUWEYXDmobCUoEaBkWQ0NUAxcPF3FfUhgEUF1UQlhZTRQPFVQUUkNaD1YVQl1FXhgGVBUJFAFWGAFaUEYUYAQYEloVZAAfFBREWVpaXxMMGicVVkBWWFUYEVxBXRRRVxhaFQVVFEJCWRRBRhVdXxZpVBVUW1ARU1YCRhVcWhFnDEgVYV1dQhZLDVBBVlwRUlcDRhVBXFQWVxZFWkZdRVMWREg="},{"id":"s3","claim":"Degree 4, `a > 0`","desc":"Sketch: both arms up; 5 turning points; crosses the x-axis 4 times.","view":{"xmin":-3,"xmax":3,"ymin":-5,"ymax":6},"_a":"ThZHFAJEfBcZFkNDVANGFw9vE0JNFFtGF2kdFEwWFw9ubxwEFEsGaBlvHAcUVGgZbgQdGws7GW4EGBwHZUpuBxkZAmtlShdUR1lCFAI9BBkEaR0UShN arms pointing opposite ways, a quintic needs its turns in pairs. 1 turn would leave both arms heading the same way.","_n":"1c1b9","_k":"db772c59"},{"t":"Impossible","fb":"Right. Odd degree turns an even number of times: 0, 2 or 4.","_n":"1dae9","_k":"71da979e"}]},{"id":"q4","goal":[3,6],"prompt":"A degree 4 polynomial with 4 `x`-intercepts and only 1 turning point","choices":[{"t":"Possible","fb":"To cross at 4 places, the graph has to come back down (or up) between each pair of crossings: at least 3 turns.","_n":"1eaf9","_k":"b01634eb"},{"t":"Impossible","fb":"Right. Between each pair of neighbouring crossings the graph must turn back, so 4 crossings need at least 3 turns.","_n":"1fac9","_k":"50019c96"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Polynomial or not?","summary":"Polynomial or not?","noun":"function","goal":[1,5],"instruction":"Sort each function. If it’s a polynomial, decide whether its degree is odd or even.","how":"Tap a function, then tap the box it belongs in.","boxes":[{"id":"b1","label":"Not a polynomial"},{"id":"b2","label":"Polynomial, odd degree"},{"id":"b3","label":"Polynomial, even degree"}],"items":[{"id":"i1","t":"`y = 5 + 2x - 3x^4`","_a":"F1YCFA==","why":"The highest power is 4, even though `-3x^4` is written last.","goal":1,"wrong":{"b1":"Every power of `x` here is a whole number 0, 1, 2, …. Dividing by a number (like `x^2/4`) is allowed.","b2":"The first term written isn’t the leading term. Find the highest power: the powers are 0, 1 and 4, so the degree is 4."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = 5 + 2x - 3x^4`: the highest power is 4, so it goes in \u003cstrong>Polynomial, even degree\u003c/strong>."]},{"id":"i2","t":"`y = 2^x`","_a":"F1YAFA==","why":"`x` is the exponent. That’s an exponential function.","goal":[1,5],"wrong":{"b2":"Look at the powers of `x`: `y = 2^x` has `x` as an exponent.","b3":"Look at the powers of `x`: `y = 2^x` has `x` as an exponent."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = 2^x`: `x` is the exponent, so it goes in \u003cstrong>Not a polynomial\u003c/strong>."]},{"id":"i3","t":"`y = (x^2 + 1)(x^3 - 2)`","_a":"F1YDFA==","why":"Degrees add when you multiply: 2 + 3 = 5.","goal":1,"wrong":{"b1":"Every power of `x` here is a whole number 0, 1, 2, …. Dividing by a number (like `x^2/4`) is allowed.","b3":"Add the degrees of the factors: 2 + 3 = 5."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = (x^2 + 1)(x^3 - 2)`: the degrees add: 2 + 3 = 5, so it goes in \u003cstrong>Polynomial, odd degree\u003c/strong>."]},{"id":"i4","t":"`y = √x + 1`","_a":"F1YAFA==","why":"`√x = x^{1/2}`: the power isn’t a whole number.","goal":1,"wrong":{"b2":"Look at the powers of `x`: `y = √x + 1` has a fractional power.","b3":"Look at the powers of `x`: `y = √x + 1` has a fractional power."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = √x + 1`: `√x = x^{1/2}` is a fractional power, so it goes in \u003cstrong>Not a polynomial\u003c/strong>."]},{"id":"i5","t":"`y = 3/x^2`","_a":"F1YAFA==","why":"`3/x^2 = 3x^{-2}`: a negative power.","goal":1,"wrong":{"b2":"Look at the powers of `x`: `y = 3/x^2` has a negative power.","b3":"Look at the powers of `x`: `y = 3/x^2` has a negative power."},"hints":["Rewrite it with a power of `x`.","`3/x^2 = 3x^{-2}`. Is −2 a whole number 0, 1, 2, …?","No: a negative power, so it’s not a polynomial."]},{"id":"i6","t":"`y = -7`","_a":"F1YCFA==","why":"A constant is `-7x^0`: degree 0, which is even. Its graph is a horizontal line, with both “arms” the same way.","goal":1,"wrong":{"b1":"A constant counts: `-7 = -7x^0`.","b2":"Find the highest power: `-7 = -7x^0`, so the degree is 0, which is even."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = -7`: a constant is `-7x^0`, degree 0, so it goes in \u003cstrong>Polynomial, even degree\u003c/strong>."]},{"id":"i7","t":"`y = x(x - 1)(x + 2)^2`","_a":"F1YCFA==","why":"1 + 1 + 2 = 4.","goal":1,"wrong":{"b1":"Every power of `x` here is a whole number 0, 1, 2, …. Dividing by a number (like `x^2/4`) is allowed.","b2":"Add the degrees of the factors: 1 + 1 + 2 = 4."},"hints":["Are all the powers of `x` whole numbers? Yes: it’s a product of polynomials.","Add the degrees of the factors: `x` has degree 1, `(x - 1)` degree 1, `(x + 2)^2` degree 2.","1 + 1 + 2 = 4: \u003cstrong>Polynomial, even degree\u003c/strong>."]},{"id":"i8","t":"`y = sin x`","_a":"F1YAFA==","why":"A sinusoidal function: it repeats forever and never goes off to infinity.","goal":[1,5],"wrong":{"b2":"Look at the powers of `x`: `y = sin x` has a trig function.","b3":"Look at the powers of `x`: `y = sin x` has a trig function."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = sin x`: it’s a trig function, so it goes in \u003cstrong>Not a polynomial\u003c/strong>."]},{"id":"i9","t":"`y = (2x - 1)^3`","_a":"F1YDFA==","why":"Degree 3. Its leading term is `(2x)^3 = 8x^3`.","goal":1,"wrong":{"b1":"Every power of `x` here is a whole number 0, 1, 2, …. Dividing by a number (like `x^2/4`) is allowed.","b3":"Find the highest power: `(2x - 1)^3` starts with `(2x)^3 = 8x^3`, so the degree is 3."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = (2x - 1)^3`: its leading term is `(2x)^3 = 8x^3`, degree 3, so it goes in \u003cstrong>Polynomial, odd degree\u003c/strong>."]},{"id":"i10","t":"`y = x^3 - x^5 + 4`","_a":"F1YDFA==","why":"The highest power is 5.","goal":1,"wrong":{"b1":"Every power of `x` here is a whole number 0, 1, 2, …. Dividing by a number (like `x^2/4`) is allowed.","b3":"Find the highest power: the powers are 3, 5 and 0, so the degree is 5."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = x^3 - x^5 + 4`: the highest power is 5, so it goes in \u003cstrong>Polynomial, odd degree\u003c/strong>."]},{"id":"i11","t":"`y = x^2/4 - 3x`","_a":"F1YCFA==","why":"Dividing by the number 4 is fine: it’s `(1/4)x^2`, degree 2.","goal":1,"wrong":{"b1":"Every power of `x` here is a whole number 0, 1, 2, …. Dividing by a number (like `x^2/4`) is allowed.","b2":"Find the highest power: `x^2/4 = (1/4)x^2`, so the degree is 2."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = x^2/4 - 3x`: `x^2/4 = (1/4)x^2`, degree 2, so it goes in \u003cstrong>Polynomial, even degree\u003c/strong>."]},{"id":"i12","t":"`y = x + 1/x`","_a":"F1YAFA==","why":"`1/x = x^{-1}` is a negative power.","goal":1,"wrong":{"b2":"Look at the powers of `x`: `y = x + 1/x` has a negative power.","b3":"Look at the powers of `x`: `y = x + 1/x` has a negative power."},"hints":["Are all the powers of `x` whole numbers?","If so, find the highest power (add degrees for a product).","`y = x + 1/x`: `1/x = x^{-1}` is a negative power, so it goes in \u003cstrong>Not a polynomial\u003c/strong>."]}]},{"id":"deduce","type":"custom","title":"Deduce it","summary":"Deduce it","star":true,"goal":[3,4,6],"instruction":"Each clue describes a polynomial without showing it. Work out what must be true.","how":"Choose an answer (for question 3, every answer that applies), then press Check answer. If it’s wrong, read the feedback and try again.","items":[{"id":"d1","goal":3,"prompt":"A polynomial’s graph crosses the `x`-axis at 5 different points. What’s the lowest degree it can have?","options":[{"t":"3","why":"A cubic meets the axis at most 3 times.","_n":"1gad9","_k":"6cefc96f"},{"t":"4","why":"Degree 4 allows at most 4 intercepts.","_n":"1haa9","_k":"cc98d369"},{"t":"5","why":"Degree `n` allows at most `n` `x`-intercepts, so 5 crossings need degree 5 or more.","_n":"1iab9","_k":"8c8242c8"},{"t":"6","why":"6 works, but it isn’t the lowest.","_n":"1ja89","_k":"0bfa79f6"}],"hints":["How many `x`-intercepts can a polynomial of degree `n` have at most?","At most `n`. So the degree must be at least the number of crossings.","5 crossings need `n ≥ 5`. The lowest degree is 5."]},{"id":"d2","goal":[3,6],"prompt":"A polynomial has 3 turning points and both arms point down. Lowest degree, and the sign of `a`?","options":[{"t":"4, `a \u003c 0`","why":"3 turning points need `n - 1 ≥ 3`, so `n ≥ 4`. Both arms down needs even degree and `a \u003c 0`.","_n":"1ka99","_k":"e7a4bf15"},{"t":"5, `a \u003c 0`","why":"Odd degree points the arms opposite ways.","_n":"1la69","_k":"13e74192"},{"t":"3, `a \u003c 0`","why":"A cubic allows only 2 turning points, and its arms point opposite ways.","_n":"1ma79","_k":"55f81886"},{"t":"4, `a > 0`","why":"`a > 0` sends the arms up.","_n":"1na89","_k":"fe6dfe62"}],"hints":["Which degrees allow 3 turning points? Which degrees send both arms the same way?","3 turning points need `n ≥ 4`. Both arms down needs even degree and a negative `a`.","The lowest is degree 4, with `a \u003c 0`."]},{"id":"d3","goal":[3,6],"star":true,"kind":"sa","prompt":"A graph has exactly 4 turning points. Which of these degrees are possible? Select all.","options":[{"t":"4","why":"Degree 4 allows at most 3 turning points.","_n":"1oa79","_k":"4f5d8dd4"},{"t":"5","why":"Degree 5 allows up to 4 turning points, and 4 is even, as odd degree needs.","_n":"1pa69","_k":"ffd1d369"},{"t":"6","why":"Even degree turns an odd number of times.","_n":"1qa59","_k":"e1144b94"},{"t":"7","why":"Degree 7 allows up to 6 turning points, and 4 is an even number, as odd degree needs.","_n":"1rac9","_k":"7d42f17a"}],"_a":"ThZcX0sVFw9OFgIUAkRxUFJGVFMYURVUWVheQUtGQEUVQF4WDkZBQEdaWFhfRkVaXFpFRRRGVFtRFAUWURUVVFsUVEBdCBVbQFlTU0pKFVRGFF5SXEZRUFJGVFMYCFBQUUcfFEUb","why":"4 turning points need `n ≥ 5`, and an even number of turns needs an odd degree: 5 and 7.","hints":["Use two rules: at most `n - 1` turning points, and which numbers of turns each kind of degree allows.","4 turning points need `n ≥ 5`. An even number of turns needs an odd degree.","The odd degrees of at least 5 in the list: 5 and 7."]},{"id":"d4","goal":4,"star":true,"prompt":"A polynomial’s range is `{y ∈ ℝ | y ≤ 6}`. What must be true?","options":[{"t":"Odd degree, `a \u003c 0`","why":"Odd degree reaches every `y`-value.","_n":"1sab9","_k":"55752159"},{"t":"Degree exactly 2","why":"Any even degree with `a \u003c 0` works, e.g. `-x^4 + 6`.","_n":"1taa9","_k":"e1a11abd"},{"t":"Even degree, `a > 0`","why":"`a > 0` sends both arms up, so the range would have a lowest value, not a highest.","_n":"1ua99","_k":"04c63e44"},{"t":"Even degree, `a \u003c 0`","why":"A highest value and no lowest value means both arms point down: even degree with `a \u003c 0`.","_n":"1va09","_k":"a0aa6675"}],"hints":["The range has a highest value, 6, but no lowest value. Which way do the arms point?","Both arms must point down. Which degrees and signs do that?","Both arms down: even degree with `a \u003c 0`."]},{"id":"d5","goal":[1,2],"star":true,"prompt":"`f(x) = (3 - x)^2(2x + 1)^3(x^2 + 4)`. Degree and end behaviour?","options":[{"t":"Degree 7; Q3 to Q1","why":"The leading term is `x^2 · 8x^3 · x^2 = 8x^7`: odd degree with a positive coefficient.","_n":"1w9f9","_k":"0ed6641e"},{"t":"Degree 7; Q2 to Q4","why":"The leading term is `(-x)^2 · (2x)^3 · x^2 = x^2 · 8x^3 · x^2 = 8x^7`. The minus in `(3 - x)` is squared away.","_n":"1xa28","_k":"a25f50e5"},{"t":"Degree 12; Q2 to Q1","why":"Degrees add: 2 + 3 + 2 = 7. 12 multiplies them.","_n":"1ya38","_k":"c225a451"},{"t":"Degree 7; Q2 to Q1","why":"Odd degree points the arms opposite ways.","_n":"1za48","_k":"a8d46f75"}],"hints":["Find the leading term of each factor, then multiply them.","`(3 - x)^2` starts with `(-x)^2 = x^2`. `(2x + 1)^3` starts with `(2x)^3 = 8x^3`. `(x^2 + 4)` starts with `x^2`.","`x^2 · 8x^3 · x^2 = 8x^7`: degree 7, `a = 8 > 0`, so Q3 to Q1."]},{"id":"d6","goal":[3,6],"star":true,"prompt":"A degree 4 polynomial with `a > 0` has `x`-intercepts only at −2, 1 and 3. It crosses the axis at −2 and at 3. What happens at `x = 1`, and how many turning points does it have?","options":[{"t":"It crosses at 1; 3 turning points","why":"Follow the signs from the left arm (positive): crossing at −2 makes it negative; crossing at 1 would make it positive; crossing at 3 negative again. But the right arm must be positive. So it can’t cross at 1.","_n":"20a58","_k":"a4b55b17"},{"t":"It touches the axis at 1; 3 turning points","why":"Between −2 and 3 it must stay negative, so at 1 it touches the axis and turns back: a valley, a peak at (1, 0), a valley.","_n":"21a68","_k":"dcb808fe"},{"t":"It touches at 1; 2 turning points","why":"Degree 4 turns an odd number of times.","_n":"22a78","_k":"a2b6879b"},{"t":"It crosses at 1; 4 turning points","why":"At most 3 turning points for degree 4, and the sign argument rules out crossing.","_n":"23a88","_k":"39385a69"}],"hints":["Follow the sign of the graph from left to right. With `a > 0` and even degree, where does it start?","It starts positive (Q2). Crossing at −2 makes it negative. What sign must it have at the far right?","It must end positive (Q1). Crossing at 3 makes it positive, so between −2 and 3 it must stay negative: at 1 it touches and turns back. Turns: a valley, a peak at (1, 0), a valley: 3 turning points."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Aisha","how":"","instruction":"Aisha made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Describe the end behaviour of `y = 2x^3 - 5x^4 + x - 7`.","steps":["The terms are `2x^3`, `-5x^4`, `x` and −7.","The leading term is `2x^3`, because it comes first.","Degree 3 is odd and the coefficient 2 is positive.","So the end behaviour is Q3 to Q1."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 follows from step 2. The mistake is earlier.","Step 4 follows from step 2. The mistake is earlier."],"fixes":[{"t":"The leading term is −7, the last term.","why":"The constant has the lowest power, 0. The leading term has the highest.","_n":"24a98","_k":"23a48a37"},{"t":"The leading term is `-5x^4`, the highest power. Degree 4, `a = -5`: Q3 to Q4.","why":"The highest power decides, wherever it’s written.","_n":"259a8","_k":"27b55f7d"},{"t":"The leading term is `2x^3`, but its sign is negative because of the −5.","why":"Each term keeps its own sign. And `2x^3` isn’t the leading term anyway.","_n":"269b8","_k":"9b81b072"},{"t":"Step 2 is correct as written.","why":"The leading term is the term with the highest power, not the first one written.","_n":"279c8","_k":"9a037396"}],"hints":["Check which term has the highest power.","The powers are 3, 4, 1 and 0. Which is highest?","Step 2 is wrong: the leading term is `-5x^4`, so the end behaviour is Q3 to Q4."]},{"id":"e2","goal":3,"task":"State the possible numbers of `x`-intercepts and turning points for a polynomial of degree 5.","steps":["Degree 5 allows at most 5 `x`-intercepts.","It has at least 1, because its arms point in opposite directions.","It allows at most 4 turning points.","So it can have 0, 1, 2, 3 or 4 turning points.","And it can have 1, 2, 3, 4 or 5 `x`-intercepts."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","Step 3 is correct.","","Step 5 is true: for example, `x^2(x - 1)(x^2 + 1)` has exactly 2. The mistake is earlier."],"fixes":[{"t":"1, 3 or 5 turning points.","why":"Odd degree needs an even number of turns, and 5 is more than `n - 1`.","_n":"289b8","_k":"58fbd0e0"},{"t":"Exactly 4 turning points.","why":"4 is the most, not the only possibility: `x^5` has none.","_n":"299e8","_k":"35f50272"},{"t":"Step 4 is correct as written.","why":"With 1 or 3 turns, a quintic would end heading the wrong way. The turns come in pairs.","_n":"2a9d8","_k":"8e9547cb"},{"t":"0, 2 or 4 turning points: the arms point opposite ways, so the turns come in pairs.","why":"Odd degree means an even number of turning points.","_n":"2b988","_k":"ba071b1f"}],"hints":["Check step 4 against the arms: a quintic must end heading the opposite way from where it started.","Each turn reverses direction. Can an odd number of turns work?","Step 4 is wrong: degree 5 has 0, 2 or 4 turning points."]},{"id":"e3","goal":4,"task":"State the range of `y = -2x^4 + 4x^2 + 1`. (The graph is shown: highest points (−1, 3) and (1, 3), and a dip at (0, 1).)","fig":"\u003ccanvas class=\"plot fig-sm\" data-fig=\"e3\" role=\"img\" aria-label=\"Graph of y = −2x⁴ + 4x² + 1: both arms down, highest points (−1, 3) and (1, 3), and a dip at (0, 1)\">\u003c/canvas>","steps":["Degree 4 with `a = -2 \u003c 0`, so both arms point down.","So the graph has a highest value but no lowest value.","The `y`-intercept is 1.","The range is `{y ∈ ℝ | y ≤ 1}`."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","Step 3 is true. The question is what it’s used for.",""],"fixes":[{"t":"The highest points are (±1, 3), so the range is `{y ∈ ℝ | y ≤ 3}`.","why":"The range stops at the graph’s highest value, not at the `y`-intercept.","_n":"2c978","_k":"df6d7c81"},{"t":"The range is `{y ∈ ℝ}`.","why":"Both arms point down, so values above the highest point are never reached.","_n":"2d9a8","_k":"19200337"},{"t":"The range is `{y ∈ ℝ | y ≥ 3}`.","why":"The arms point down, so the range goes down from 3, not up.","_n":"2e998","_k":"4d04ba22"},{"t":"Step 4 is correct as written.","why":"(0, 1) is a dip between two higher peaks. Heights up to 3 are reached at `x = ±1`.","_n":"2fa48","_k":"0a7d0a4c"}],"hints":["The range runs down from the highest height the graph reaches. Where is that?","The graph is higher at `x = ±1` than at `x = 0`.","Step 4 is wrong: the highest value is 3, so the range is `{y ∈ ℝ | y ≤ 3}`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the shape lab: the budget bars, the pairs of turning points, or zooming out?"},{"id":"j2","q":"In your own words, why does only the leading term decide the end behaviour?"},{"id":"j3","q":"Explain to a friend how to check whether a sketch could be a degree 4 polynomial. Mention all four checks."},{"id":"j4","q":"Which rule are you least sure about? Write one example that would help you remember it."}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What are the degree and leading coefficient of `f(x) = 4 + 3x^2 - 2x^5 + x`?","options":[{"t":"Degree 5, leading coefficient 2","why":"The coefficient includes its sign: −2.","_n":"2ga38","_k":"447360ae"},{"t":"Degree 5, leading coefficient 4","why":"4 is the first term written, the constant. The leading coefficient belongs to the highest power.","_n":"2h168","_k":"665ad8ec"},{"t":"Degree 2, leading coefficient 3","why":"`3x^2` is the second term written, not the highest power.","_n":"2i178","_k":"e3606438"},{"t":"Degree 5, leading coefficient −2","why":"The highest power is 5, in the term `-2x^5`.","_n":"2j148","_k":"439443c3"}]},"b":{"prompt":"What are the degree and leading coefficient of `g(x) = 7x - x^4 + 6x^3 - 1`?","options":[{"t":"Degree 4, leading coefficient −1","why":"The highest power is 4, in `-x^4 = -1x^4`.","_n":"2k158","_k":"815720af"},{"t":"Degree 4, leading coefficient 1","why":"The coefficient includes its sign: −1.","_n":"2l1a8","_k":"48dacad7"},{"t":"Degree 3, leading coefficient 6","why":"6 is the biggest coefficient, but `6x^3` isn’t the highest power.","_n":"2m1b8","_k":"87269449"},{"t":"Degree 4, leading coefficient 7","why":"7 belongs to `7x`, the first term written.","_n":"2n188","_k":"6c642178"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is the end behaviour of `y = -3x^5 + 2x^2 - 8`?","options":[{"t":"Q3 to Q4","why":"Both arms down needs even degree. Degree 5 is odd.","_n":"2o198","_k":"9d6864ec"},{"t":"Q2 to Q1","why":"Both arms up needs even degree and `a > 0`.","_n":"2p1e8","_k":"8208ed37"},{"t":"Q2 to Q4","why":"Odd degree, negative leading coefficient: up on the left, down on the right.","_n":"2q1f8","_k":"fe30a0fe"},{"t":"Q3 to Q1","why":"That ignores the negative leading coefficient.","_n":"2rc94","_k":"aa717c97"}]},"b":{"prompt":"What is the end behaviour of `y = 6 - x^4 + 5x^3`?","options":[{"t":"Q2 to Q1","why":"That ignores the negative leading coefficient.","_n":"2sca4","_k":"3c2484b6"},{"t":"Q3 to Q4","why":"Even degree, negative leading coefficient (`-x^4`): both arms down.","_n":"2tc74","_k":"bfb2bb80"},{"t":"Q3 to Q1","why":"That’s the end behaviour of `5x^3`, a middle term.","_n":"2uc84","_k":"fa448525"},{"t":"Q2 to Q4","why":"Opposite directions needs odd degree. The degree is 4.","_n":"2vc54","_k":"b43c8487"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"A polynomial function has degree 6. What are the most `x`-intercepts and the most turning points it can have?","options":[{"t":"6 `x`-intercepts and 6 turning points","why":"Turning points max out at `n - 1`.","_n":"2wc64","_k":"a96cadf5"},{"t":"6 `x`-intercepts and 5 turning points","why":"At most `n` intercepts and `n - 1` turning points.","_n":"2xc34","_k":"b0f4b7d8"},{"t":"5 `x`-intercepts and 6 turning points","why":"These are swapped.","_n":"2yc44","_k":"c53e3ad5"},{"t":"6 `x`-intercepts and 4 turning points","why":"4 is possible, but the most is 5.","_n":"2zc14","_k":"a2037927"}]},"b":{"prompt":"A polynomial function has degree 7. What are the most `x`-intercepts and the most turning points it can have?","options":[{"t":"7 `x`-intercepts and 5 turning points","why":"5 is not even possible for degree 7: odd degree turns an even number of times. The most is 6.","_n":"30c24","_k":"43ee6239"},{"t":"6 `x`-intercepts and 7 turning points","why":"These are swapped.","_n":"31af4","_k":"69126f5a"},{"t":"7 `x`-intercepts and 6 turning points","why":"At most `n` intercepts and `n - 1` turning points.","_n":"32ae4","_k":"f989c485"},{"t":"7 `x`-intercepts and 7 turning points","why":"Turning points max out at `n - 1`.","_n":"33b14","_k":"4460dd96"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Which of these could be the number of turning points of a polynomial of degree 5?","options":[{"t":"1","why":"Odd degree turns an even number of times.","_n":"34b04","_k":"11b50584"},{"t":"3","why":"Odd degree turns an even number of times.","_n":"35b34","_k":"c6a7df32"},{"t":"4","why":"At most 5 − 1 = 4, and 4 is even, as odd degree requires.","_n":"36b24","_k":"883597df"},{"t":"5","why":"At most `n - 1 = 4`.","_n":"37b54","_k":"3bf88076"}]},"b":{"prompt":"Which of these could be the number of turning points of a polynomial of degree 6?","options":[{"t":"2","why":"Even degree turns an odd number of times.","_n":"38b44","_k":"a3ed4764"},{"t":"3","why":"At most 5, and 3 is odd, as even degree requires.","_n":"39b74","_k":"1a3d332d"},{"t":"4","why":"Even degree turns an odd number of times.","_n":"3ab64","_k":"ec9244eb"},{"t":"6","why":"At most `n - 1 = 5`.","_n":"3b3d3","_k":"abefd82c"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"A graph rises from Q3, has exactly 4 turning points, crosses the `x`-axis 3 times, and ends in Q1. What is the lowest degree a polynomial with this graph could have?","options":[{"t":"3","why":"That counts the crossings. A cubic allows only 2 turning points.","_n":"3c3e3","_k":"7c63db74"},{"t":"4","why":"Degree 4 allows only 3 turning points, and its arms would point the same way.","_n":"3d3f3","_k":"236552ac"},{"t":"5","why":"4 turning points need `n - 1 ≥ 4`, so `n ≥ 5`. Opposite arms need odd degree. 5 works.","_n":"3e403","_k":"5484e519"},{"t":"6","why":"Degree 6 allows 5 turning points, but even degree sends both arms the same way.","_n":"3f413","_k":"a1191008"}]},"b":{"prompt":"A graph falls from Q2, has exactly 3 turning points, touches the `x`-axis twice without crossing, and ends in Q1. What is the lowest degree a polynomial with this graph could have?","options":[{"t":"2","why":"That counts the touch points. A parabola has only 1 turning point.","_n":"3g423","_k":"625d79d6"},{"t":"3","why":"A cubic allows only 2 turning points, and its arms point opposite ways.","_n":"3h433","_k":"ef28b31c"},{"t":"4","why":"3 turning points need `n ≥ 4`. Both arms up needs even degree. 4 works, e.g. `(x - 1)^2(x + 1)^2`.","_n":"3i443","_k":"9a5ea9d1"},{"t":"5","why":"Odd degree sends the arms opposite ways.","_n":"3j353","_k":"62a82e25"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Which function has range `{y ∈ ℝ | y ≥ -5}`?","options":[{"t":"`y = -x^4 + 2x^2 - 5`","why":"Both arms point down, so the range has a highest value (−4), not a lowest.","_n":"3k363","_k":"4c91fb7b"},{"t":"`y = x^4 - 2x^2 - 4`","why":"Both arms up, and its lowest points are at `x = ±1`: 1 − 2 − 4 = −5.","_n":"3l433","_k":"610b4aab"},{"t":"`y = x^4 - 2x^2 - 5`","why":"Its `y`-intercept is −5, but it dips lower: at `x = ±1` it’s 1 − 2 − 5 = −6.","_n":"3m423","_k":"da8520b8"},{"t":"`y = x^5 - 5`","why":"Odd degree: the range is every real number.","_n":"3n413","_k":"0ca58330"}]},"b":{"prompt":"Which function has range `{y ∈ ℝ | y ≤ 7}`?","options":[{"t":"`y = -x^3 + 7`","why":"Odd degree: the range is every real number.","_n":"3o403","_k":"7b57c528"},{"t":"`y = x^4 - 8x^2 + 7`","why":"Both arms point up, so the range has a lowest value (−9), not a highest.","_n":"3p473","_k":"6f21fb00"},{"t":"`y = -x^4 + 8x^2 - 9`","why":"Both arms down, and its highest points are at `x = ±2`: −16 + 32 − 9 = 7.","_n":"3q463","_k":"d4d64a03"},{"t":"`y = -x^4 + 8x^2 + 7`","why":"Its `y`-intercept is 7, but it rises higher: at `x = ±2` it’s −16 + 32 + 7 = 23.","_n":"3r453","_k":"2d790948"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which statement correctly describes the end behaviour of `y = -2x^6 + x`?","options":[{"t":"As `x → -∞`, `y → ∞`, and as `x → ∞`, `y → ∞`.","why":"That ignores the negative leading coefficient.","_n":"3s443","_k":"0ae582e0"},{"t":"As `y → -∞`, `x → -∞`, and as `y → -∞`, `x → ∞`.","why":"The arrows are written the wrong way round: describe what `y` does as `x` goes to ±∞.","_n":"3t3b3","_k":"b6411ff8"},{"t":"As `x → -∞`, `y → -∞`, and as `x → ∞`, `y → -∞`.","why":"Even degree, negative leading coefficient: both arms down.","_n":"3u3a3","_k":"d89cd151"},{"t":"As `x → -∞`, `y → ∞`, and as `x → ∞`, `y → -∞`.","why":"That’s odd-degree behaviour. Degree 6 sends both arms the same way.","_n":"3v414","_k":"6bbf59d5"}]},"b":{"prompt":"Which statement correctly describes the end behaviour of `y = 3x^5 - x^2`?","options":[{"t":"As `x → -∞`, `y → ∞`, and as `x → ∞`, `y → -∞`.","why":"That’s Q2 to Q4, for a negative leading coefficient.","_n":"3w424","_k":"82e1400f"},{"t":"As `x → -∞`, `y → -∞`, and as `x → ∞`, `y → ∞`.","why":"Odd degree, positive leading coefficient: Q3 to Q1.","_n":"3x3f4","_k":"a8186602"},{"t":"As `y → -∞`, `x → -∞`, and as `y → ∞`, `x → ∞`.","why":"The arrows are written the wrong way round: describe what `y` does as `x` goes to ±∞.","_n":"3y404","_k":"f9221123"},{"t":"As `x → -∞`, `y → ∞`, and as `x → ∞`, `y → ∞`.","why":"That’s even-degree behaviour. Degree 5 sends the arms opposite ways.","_n":"3z454","_k":"6ef12b6d"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why a polynomial of degree 4 can’t have exactly 2 turning points?","options":[{"t":"“Its arms point the same way. After 2 turns it would be heading the way it started, but it has to end heading back the other way. So it must turn an odd number of times.”","why":"The pairing argument.","_n":"40464","_k":"e3dd11a2"},{"t":"“A quartic always has exactly 3 turning points.”","why":"`y = x^4` has only 1.","_n":"41434","_k":"b34560f1"},{"t":"“It would need exactly 2 `x`-intercepts.”","why":"Intercepts and turning points are separate counts.","_n":"42444","_k":"f6301285"},{"t":"“2 is more than 4 − 1.”","why":"4 − 1 = 3, and 2 is less than that.","_n":"43394","_k":"37690ad4"}]},"b":{"prompt":"Which is the best explanation of why every polynomial of degree 3 crosses the `x`-axis at least once?","options":[{"t":"“Degree 3 means exactly 3 `x`-intercepts.”","why":"At most 3: `y = x^3 + 1` has only one.","_n":"443a4","_k":"aef4eaaf"},{"t":"“Its constant term is always 0.”","why":"`y = x^3 + 1` has constant term 1.","_n":"45474","_k":"b4299a91"},{"t":"“Its arms point in opposite directions, one up and one down, so somewhere in between the graph must pass through height 0.”","why":"End behaviour forces a crossing.","_n":"46464","_k":"682c18d0"},{"t":"“It always has 2 turning points.”","why":"`y = x^3` has none.","_n":"47494","_k":"b2c0abe5"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A scientist’s graph flattens toward the line `y = 0` far to the left and climbs ever more steeply to the right, with no turning points. Which type of function fits it best?","options":[{"t":"Sinusoidal","why":"A sinusoid repeats; it doesn’t climb forever.","_n":"48484","_k":"23b98983"},{"t":"A polynomial of even degree","why":"Both arms of an even-degree polynomial go to infinity; neither levels off.","_n":"49434","_k":"bdabf7c9"},{"t":"Exponential","why":"Only an exponential levels off toward a horizontal line on one side while growing faster and faster on the other.","_n":"4a424","_k":"816ed133"},{"t":"A polynomial of odd degree","why":"An odd-degree polynomial’s left arm goes to −∞ or ∞; it can’t level off toward `y = 0`.","_n":"4b454","_k":"e0df4a94"}]},"b":{"prompt":"A tide-height graph repeats the same rise and fall every 12.4 hours, for as long as it’s recorded, and always stays between −2 m and 2 m. Which type of function fits it best?","options":[{"t":"Sinusoidal","why":"Repeating forever between a highest and a lowest value is what sinusoidal functions do.","_n":"4c444","_k":"f32dd3af"},{"t":"A polynomial of high degree","why":"A polynomial of degree `n` turns at most `n - 1` times, so it can’t rise and fall forever.","_n":"4d3f4","_k":"61897148"},{"t":"Exponential","why":"An exponential keeps growing (or shrinking toward 0); it doesn’t repeat.","_n":"4e3e4","_k":"7e479792"},{"t":"A polynomial of even degree","why":"Both arms of an even-degree polynomial go off to infinity, so it can’t stay between −2 and 2 forever.","_n":"4fb54","_k":"cea7cc8e"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A company models its profit, in thousands of dollars, by `P(x) = -0.5x^4 + 6x^3 - 10x + 3`, where `x` is the number of units made, in hundreds. If the model were used for very large `x`, what would it predict?","options":[{"t":"Profit eventually rises again, because the degree is even.","why":"Even degree with a \u003cstrong>negative\u003c/strong> leading coefficient sends both arms down.","_n":"4gb64","_k":"74586910"},{"t":"Profit grows without limit, because `6x^3` has the largest coefficient.","why":"Far out, the higher power wins whatever the coefficients: at `x = 100`, `-0.5x^4 = -50 000 000` and `6x^3 = 6 000 000`.","_n":"4hb74","_k":"0d7d87e2"},{"t":"Profit levels off at 3.","why":"3 is the profit at `x = 0`. Polynomials don’t level off.","_n":"4ib84","_k":"c8c35d00"},{"t":"Profit eventually falls without limit (bigger and bigger losses), because the leading term `-0.5x^4` wins.","why":"Even degree with `a \u003c 0`: as `x → ∞`, `P → -∞`.","_n":"4jb14","_k":"8d468f39"}]},"b":{"prompt":"A biologist models a population by `N(t) = 2t^3 - 0.1t^4 + 50`, where `t` is time in years. If the model were used far into the future, what would it predict?","options":[{"t":"The population eventually falls without limit (to impossible negative values), because the leading term `-0.1t^4` wins.","why":"Even degree with `a \u003c 0`: as `t → ∞`, `N → -∞`. That’s a sign the model only works for a limited time.","_n":"4kb24","_k":"77cd2d53"},{"t":"The population grows without limit, because `2t^3` has the larger coefficient.","why":"Far out, the higher power wins: at `t = 100`, `-0.1t^4 = -10 000 000` and `2t^3 = 2 000 000`.","_n":"4lb34","_k":"8e8e58c2"},{"t":"The population eventually rises again, because the degree is even.","why":"Even degree with a \u003cstrong>negative\u003c/strong> leading coefficient sends both arms down.","_n":"4mb44","_k":"67a2c2e0"},{"t":"The population levels off at 50.","why":"50 is the starting value. Polynomials don’t level off.","_n":"4nbd4","_k":"3720beef"}]}}]},"task":{"title":"Design to spec","summary":"Design to spec","statement":"\u003cp>An engineer needs a polynomial with the graph described below, and with the \u003cstrong>lowest degree\u003c/strong> that can do it. Use the shape lab’s sliders to build one. There are many answers. Can you find more than one?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The spec\u003c/h4>\u003cul style=\"margin:4px 0 0;padding-left:1.2em\">\u003cli>Both arms point up.\u003c/li>\u003cli>Exactly 3 turning points.\u003c/li>\u003cli>Exactly 2 `x`-intercepts.\u003c/li>\u003cli>`y`-intercept −3.\u003c/li>\u003c/ul>\u003c/div>","checks":["Both arms point up","Exactly 3 turning points","Exactly 2 `x`-intercepts","`y`-intercept −3","Lowest degree that can do all this"],"tips":["Both arms up needs an even degree and a positive leading coefficient.","You have {k} turning points. A W-shape has 3: try a negative `q`.","You have {k} `x`-intercepts. With 3 turning points, keep the middle hump on the other side of the axis from at least one valley.","The `y`-intercept is the constant term `s`.","Your degree is {n}. Could a lower even degree have 3 turning points? Degree `n` allows at most `n - 1`."],"explainPrompt":"Explain why degree 4 is the lowest degree that can meet the spec, and how you got exactly 2 `x`-intercepts.","vocab":"Use the words degree, leading coefficient, turning point and end behaviour.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Every answer has degree 4: degree 2 allows only 1 turning point, and degree 3 has its arms pointing opposite ways."},"cards":[["Polynomial function","A sum of terms `ax^n` with whole-number powers `n = 0, 1, 2, …`. Not polynomials: `2^x`, `√x`, `1/x`, `sin x`."],["Degree and leading coefficient","The highest power, and its coefficient, wherever it’s written. `4 + 3x^2 - 2x^5`: degree 5, `a = -2`."],["Degree of a product","Add the degrees: `(x^2 + 1)(x^3 - 2)` has degree 2 + 3 = 5."],["End behaviour: even degree","Both arms the same way: up if `a > 0` (Q2 to Q1), down if `a \u003c 0` (Q3 to Q4)."],["End behaviour: odd degree","Opposite ways: Q3 to Q1 if `a > 0`; Q2 to Q4 if `a \u003c 0`."],["Why only the leading term matters far out","A higher power beats any coefficient for large `|x|`: at `x = 100`, `-x^3 = -1 000 000` but `9x^2 = 90 000`."],["Most `x`-intercepts and turning points","Degree `n`: at most `n` `x`-intercepts and at most `n - 1` turning points. These are maximums, not exact counts."],["Which numbers of turning points are possible?","Even degree: an odd number (1, 3, …). Odd degree: an even number (0, 2, …). Turns come in pairs."],["Odd degree and the `x`-axis","Odd degree always crosses at least once, because its arms point opposite ways."],["Range of a polynomial","Odd degree: `{y ∈ ℝ}`. Even degree: `y ≥` (lowest value) if `a > 0`, `y ≤` (highest value) if `a \u003c 0`."],["Domain of a polynomial","Always `{x ∈ ℝ}`."],["Polynomial, exponential or sinusoidal?","Polynomial: both arms go to ±∞, finitely many turns. Exponential: levels off toward a horizontal asymptote on one side. Sinusoidal: repeats forever between two values."]]}};</script>
