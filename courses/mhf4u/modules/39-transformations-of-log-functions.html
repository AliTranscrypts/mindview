nge which `x`-values are allowed.","b2":"Check the wall’s sign. `-(x + 2)` is 0 at `x = -2`.","b3":"The minus sign in front of the log flips the graph top to bottom. It can’t change which `x`-values are allowed."},"hints":["Find where the inside is 0. That’s the wall.","The inside is `-(x + 2)`, which is 0 at `x = -2`. The −2 and the + 3 are outside, so ignore them. Test `x = -3`.","At `x = -3` the inside is `-(-1) = 1`, which is positive, so the domain is `{x ∈ ℝ | x \u003c -2}`."]},{"id":"i12","t":"`y = log(-4 - 2x)`","_a":"FQEGQA==","why":"`-4 - 2x = -2(x + 2) > 0` gives `x \u003c -2`.","wrong":{"b1":"Check the wall’s sign. `-4 - 2x` is 0 at `x = -2`. Test a value: at `x = -3` the inside `-4 - 2x` is 2, which is positive.","b2":"Check the wall’s sign. `-4 - 2x` is 0 at `x = -2`.","b3":"Right wall, wrong side. Test a value: at `x = -3` the inside `-4 - 2x` is 2, which is positive."},"hints":["Find where the inside is 0. That’s the wall.","The inside is `-4 - 2x`, which is 0 at `x = -2`. Now test one `x`-value on one side.","`-4 - 2x > 0` gives `x \u003c -2`, so the domain is `{x ∈ ℝ | x \u003c -2}`."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the Error","student":"Yasmin","how":"","instruction":"Yasmin made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"State the vertical asymptote and the domain of `y = 3 log_{2}(2x - 8) + 1`.","steps":["The inside of the log is `2x - 8`.","Comparing with `log_{b}[k(x - d)]`, `d = 8`, so the vertical asymptote is `x = 8`.","`k = 2` is positive, so the domain is to the right of the wall.","So the domain is `{x ∈ ℝ | x > 8}`."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 is true: a positive `k` puts the domain on the right. The mistake is earlier.","Step 4 follows from step 2. The mistake is earlier."],"fixes":[{"t":"The asymptote is `x = 9`, because the + 1 moves the wall 1 unit.","why":"`c` lifts the graph; it can’t move a vertical line sideways.","_n":"1i684","_k":"dfc295b2"},{"t":"Factor first: `2x - 8 = 2(x - 4)`, so `d = 4`. The asymptote is `x = 4` and the domain is `{x ∈ ℝ | x > 4}`.","why":"The form `k(x - d)` needs `k` factored out. Check: at `x = 4` the inside is 2(4) − 8 = 0.","_n":"1j6b4","_k":"5263d17c"},{"t":"The asymptote is `x = -8`, because the sign in front of 8 flips.","why":"At `x = -8` the inside is 2(−8) − 8 = −24, not 0. The wall is where the inside is 0.","_n":"1k6a4","_k":"a1da1821"},{"t":"Step 2 is correct as written.","why":"At `x = 8` the inside is 2(8) − 8 = 8, not 0. `d` can only be read after factoring.","_n":"1l654","_k":"01a77916"}],"hints":["Check step 2: what must the inside equal at the wall?","Set `2x - 8 = 0`, or factor: `2x - 8 = 2(x - ?)`.","`2x - 8 = 2(x - 4)`, so `d = 4`: wall `x = 4`, domain `x > 4`. Step 2 read `d` before factoring."]},{"id":"e2","goal":3,"task":"(4, 2) is on `y = log_{2} x`. Find where it lands on `y = -log_{2}[2(x + 1)] + 3`.","steps":["`a = -1`, `k = 2`, `d = -1`, `c = 3`.","New `x`: `kx + d = 2(4) + (-1) = 7`.","New `y`: `ay + c = -1(2) + 3 = 1`.","So (4, 2) lands on (7, 1)."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 is correct: `ay + c`. The mistake is earlier.","Step 4 follows from step 2. The mistake is earlier."],"fixes":[{"t":"New `x`: `x/k - d = 4/2 + 1 = 3`.","why":"`d` is −1 here, so `x/k + d = 2 - 1 = 1`. Check (3, 1): `-log_{2}[2(4)] + 3 = 0`, not 1.","_n":"1m644","_k":"d9cd42b2"},{"t":"Step 2 is correct as written.","why":"Check (7, 1): `-log_{2}[2(8)] + 3 = -4 + 3 = -1`, not 1. A compression by a factor of 1/2 halves the `x`-coordinates; it doesn’t double them.","_n":"1ndb4","_k":"158127a1"},{"t":"New `x`: `(x + d)/k = (4 - 1)/2 = 3/2`.","why":"That shifts before compressing. The rule divides by `k` first, then adds `d`. Check (3/2, 1): `-log_{2} 5 + 3`, which isn’t 1, because `log_{2} 5` isn’t 2 (`2^2 = 4`). It’s about 0.68.","_n":"1odc4","_k":"e3f5f1b1"},{"t":"New `x`: `x/k + d = 4/2 + (-1) = 1`. The point lands on (1, 1).","why":"A horizontal compression by a factor of 1/2 halves the `x`-coordinate. Check: `-log_{2}[2(1 + 1)] + 3 = -2 + 3 = 1`.","_n":"1pdd4","_k":"7a44e316"}],"hints":["Does a horizontal compression by a factor of 1/2 double the `x`-coordinate, or halve it?","The mapping rule is `(x, y) -> (x/k + d, ay + c)`.","`x/k + d = 4/2 - 1 = 1`, so (4, 2) → (1, 1). Step 2 multiplied by `k` instead of dividing."]},{"id":"e3","goal":2,"task":"Describe the vertical asymptote, domain and range of `y = -2 log_{3}(x + 5) - 4`.","steps":["The inside, `x + 5`, is 0 at `x = -5`, so the vertical asymptote is `x = -5`.","`a = -2` is negative, so the graph is reflected in the `x`-axis.","A reflection flips the domain to the other side of the wall: `{x ∈ ℝ | x \u003c -5}`.","The range is `{y ∈ ℝ}`."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: a negative `a` reflects in the `x`-axis. Keep checking.","","Step 4 is true: every log graph has range all real numbers. The mistake is earlier."],"fixes":[{"t":"A reflection in the `x`-axis flips the `y`-values only. The inside `x + 5` must still be positive, so the domain is `{x ∈ ℝ | x > -5}`.","why":"Only the inside decides the domain. `a` changes heights, not which `x`-values are allowed.","_n":"1qde4","_k":"251f3c3e"},{"t":"Step 3 is correct as written.","why":"Test `x = -6`, which step 3 says is in the domain: the inside is −6 + 5 = −1, and `log_{3}(-1)` has no value.","_n":"1rd74","_k":"063a5388"},{"t":"The reflection moves the wall too, so the domain is `{x ∈ ℝ | x > 5}`.","why":"The wall is where `x + 5 = 0`, at `x = -5`. `a` can’t move it.","_n":"1sd84","_k":"fc818a0e"},{"t":"The − 4 moves the wall down, so the domain is `{x ∈ ℝ | x > -9}`.","why":"`c` shifts the graph up or down. A vertical wall slid up or down stays exactly where it is.","_n":"1td94","_k":"3be10c30"}],"hints":["Which part of the equation decides which `x`-values are allowed?","Only the inside, `x + 5`, must be positive. `a = -2` changes the `y`-values.","`x + 5 > 0` gives `x > -5`. A reflection in the `x`-axis doesn’t move the domain; only a negative `k` would put it on the left."]}]},{"id":"backwards","type":"custom","title":"Work backwards","summary":"Work backwards","star":true,"goal":[6,2,3,5],"instruction":"Fill in the boxes to make a function with all the listed features.","how":"Type an integer or a simple fraction in each box (negative values are fine), then press Check. After each Check, a small graph shows your curve with the item’s points.","ui":{"empty":"Enter a number in every box, such as −2, 3 or 1/2.","zero":"{p} can’t be 0.","your":"Your function:","wall":"wall `x =` {w}","side":"domain {lr} of the wall","gives":"at `x =` {x} gives {yv}","none":"at `x =` {x} has no value","needs":"(needs {v})","passes":"passes through {pt}"},"items":[{"id":"B1","goal":6,"b":2,"tpl":"full","feat":"Base 2. Vertical asymptote `x = 2`; passes through (3, 1) and (6, 5).","_a":"TEFTQAkLFEFcQQhTHxtcQQ1RHkBQGwJSSg==","wall":2,"side":"r","pts":[[3,1],[6,5]],"view":{"xmin":-1,"xmax":9,"ymin":-3,"ymax":7},"wrong":[{"m":{"a":4,"k":1,"d":2,"c":1},"fb":"This passes through (3, 1), but at `x = 6` it gives `4 log_{2} 4 + 1 = 9`. From `x = 3` to `x = 6` the distance from the wall goes from 1 to 4: two doublings. A rise of 4 over two doublings means `a = 2`."},{"m":{"d":-2},"fb":"Your wall is at `x = -2`. The inside must be `x - 2`."},{"m":{"a":1.3333333333333333},"fb":"4/3 is the slope between the points, as if the graph were a line. A log rises by `a` for every doubling of the distance from the wall."}],"hints":["Measure each point’s distance from the wall `x = 2`.","Distances 1 and 4. At distance 1 the log is 0, so `c = 1`. From 1 to 4 is two doublings.","The rise from 1 to 5 is 4 over two doublings, so `a = 2`: `y = 2 log_{2}(x - 2) + 1`."],"right":"✓ Correct. Check: at `x = 3`, `2 log_{2} 1 + 1 = 1`, and at `x = 6`, `2 log_{2} 4 + 1 = 5`. The inside `x - 2` is 0 at the wall `x = 2`."},{"id":"B2","goal":6,"b":3,"tpl":"full","feat":"Base 3. Domain `{x ∈ ℝ | x \u003c 0}`; passes through (−1, 3) and (−9, 1).","_a":"TEFTQAkUCU8VCBBYHggUQVNBCFIfG1tBDVBP","wall":0,"side":"l","pts":[[-1,3],[-9,1]],"view":{"xmin":-11,"xmax":2,"ymin":-2,"ymax":6},"wrong":[{"m":{"a":1,"k":-1,"d":0,"c":3},"fb":"At `x = -9` this gives `log_{3} 9 + 3 = 5`. The heights fall from 3 to 1 as you move away from the wall, so `a` is negative."},{"m":{"k":1},"fb":"With `k = 1` the domain is `x > 0`, so (−1, 3) isn’t on the graph. For a domain on the left, `k` must be negative."},{"m":{"a":-2,"k":-1,"d":0,"c":3},"fb":"At `x = -9` this gives `-2 log_{3} 9 + 3 = -1`. From distance 1 to distance 9 is two triplings, and `log_{3} 9 = 2`, so a drop of 2 needs `a = -1`."}],"hints":["Domain `x \u003c 0`: where is the wall, and what sign must `k` have?","Wall `x = 0`, `k = -1`. The points are 1 and 9 units from the wall, and `log_{3} 1 = 0`, `log_{3} 9 = 2`.","(−1, 3) gives `c = 3`. Then `2a + 3 = 1`, so `a = -1`: `y = -log_{3}(-x) + 3`."],"right":"✓ Correct. Check: at `x = -1`, `-log_{3} 1 + 3 = 3`, and at `x = -9`, `-log_{3} 9 + 3 = 1`. The inside `-x` is positive only when `x \u003c 0`."},{"id":"B3","goal":[6,1],"b":10,"tpl":"full","feat":"Base 10. `y = log x` is reflected in the `x`-axis, compressed horizontally by a factor of 1/10, then translated 4 units left.","_a":"TEFTQAkUCU8VCBBYAgkUQVNBCE8HFRoAFVkCHw==","wall":-4,"side":"r","pts":[[-3.9,0],[-3,-1]],"view":{"xmin":-6,"xmax":4,"ymin":-4,"ymax":3},"wrong":[{"m":{"k":10,"d":-0.4},"fb":"`10x + 4 = 10(x + 2/5)`: the wall is at `x = -2/5`. Translating after the compression puts the 4 inside the bracket: `10(x + 4)`."},{"m":{"d":4},"fb":"That moves the graph right. 4 units left means `x + 4` inside: `d = -4`."},{"m":{"k":0.1},"fb":"`k = 1/10` \u003cstrong>stretches\u003c/strong> by a factor of 10. A compression by a factor of 1/10 needs `k = 10`."},{"m":{"a":1},"fb":"A reflection in the `x`-axis makes `a` negative."}],"hints":["Each description matches one parameter: reflection in the `x`-axis → `a`; compression → `k`; translation → `d`.","`a = -1`; a compression by a factor of 1/10 means `k = 10`; 4 units left means `d = -4`.","`y = -log[10(x + 4)]`. (It is also `y = -log(x + 4) - 1`, since `log 10 = 1`.)"],"right":"✓ Correct. Reflection: `a = -1`. Compression by a factor of 1/10: `k = 10`. Then 4 units left: `d = -4`. Check: at `x = -3.9` the inside is 10(0.1) = 1, so `y = -log 1 = 0`, and the wall is `x = -4`."},{"id":"B4","goal":6,"b":2,"tpl":"full","feat":"Base 2. `x`-intercept (5, 0); vertical asymptote `x = 1`; passes through (17, 2).","_a":"TEFTQAkIFEFcQQhTHxtcQQ1SHkBQGwJOBR4=","wall":1,"side":"r","pts":[[5,0],[17,2]],"view":{"xmin":-1,"xmax":19,"ymin":-4,"ymax":5},"wrong":[{"m":{"a":1,"k":1,"d":1,"c":0},"fb":"`y = log_{2}(x - 1)` is 2 at `x = 5`, not 0. Move it down 2."},{"m":{"a":2,"k":1,"d":1,"c":-4},"fb":"This crosses at (5, 0), but at `x = 17` it gives `2 log_{2} 16 - 4 = 4`. From distance 4 to distance 16 is two doublings with a rise of 2, so `a = 1`."},{"m":{"d":-1},"fb":"Your wall is at `x = -1`. The inside must be `x - 1`."}],"hints":["Distances from the wall: 4 for (5, 0) and 16 for (17, 2).","From 4 to 16 is two doublings, and `y` rises 2, so `a = 1`. Then `log_{2} 4 + c = 0`.","`2 + c = 0`, so `c = -2`: `y = log_{2}(x - 1) - 2`."],"right":"✓ Correct. Check: at `x = 5`, `log_{2} 4 - 2 = 0`, and at `x = 17`, `log_{2} 16 - 2 = 2`. The inside `x - 1` is 0 at the wall `x = 1`."},{"id":"B5","goal":[6,5],"b":2,"tpl":"dc","star":true,"feat":"Base 2. `y = log_{2} x` is compressed horizontally by a factor of 1/8, then translated 2 units right. Write the result \u003cstrong>without `k`\u003c/strong>: `y = log_{2}(x - [ ]) + [ ]`.","_a":"TEFTQAkIFEFcQQhTHxtcQQ1RHkBQGwJQSg==","wall":2,"side":"r","pts":[[3,3],[4,4]],"view":{"xmin":-1,"xmax":8,"ymin":-2,"ymax":7},"wrong":[{"m":{"d":2,"c":8},"fb":"The compression adds `log_{2} 8`, which is 3, not 8. `8 = 2^3`."},{"m":{"d":2,"c":-3},"fb":"Compressing toward the `y`-axis raises a log graph: `log_{2}[8(x - 2)] = log_{2}(x - 2) + 3`."},{"m":{"d":0.25,"c":3},"fb":"That’s what you get if you translate first and then compress: `log_{2}(8x - 2) = log_{2}[8(x - 1/4)]`. Stretches and compressions come first."},{"m":{"d":16,"c":3},"fb":"The translation isn’t multiplied by 8: after the compression, moving 2 right replaces `x` with `x - 2`."}],"hints":["Write it with `k` first. A compression by a factor of 1/8 is `k = 8`; then 2 units right.","`y = log_{2}[8(x - 2)]`. `8 = 2^3`, so multiplying the inside by 8 adds 3 to the log.","`y = log_{2}(x - 2) + 3`: `d = 2`, `c = 3`."],"right":"✓ Correct. `8 = 2^3`, so multiplying the inside by 8 adds 3. Check: at `x = 3`, `log_{2}[8(1)] = 3` and `log_{2} 1 + 3 = 3`; at `x = 4`, `log_{2}[8(2)] = 4` and `log_{2} 2 + 3 = 4`."},{"id":"B6","goal":6,"b":2,"tpl":"adc","star":true,"feat":"Base 2. `y = a log_{2}(x - d) + c` passes through (2, 1), (3, 3) and (5, 5).","_a":"TEFTQAkLFEFcQQhTHxtcQQ1SHkBQGwJSSg==","wall":null,"side":"r","pts":[[2,1],[3,3],[5,5]],"view":{"xmin":-1,"xmax":7,"ymin":-2,"ymax":7},"wrong":[{"m":{"a":2,"d":0,"c":-1},"fb":"This passes through (2, 1), but at `x = 3` it gives `2 log_{2} 3 - 1` ≈ 2.17. With the wall at `x = 0` the distances 2, 3, 5 don’t grow by equal factors."},{"m":{"d":2},"fb":"(2, 1) would sit on the wall, where the log has no value."},{"m":{"a":1,"d":1,"c":1},"fb":"Right wall. But the heights rise 2 per doubling of the distance (1 → 2 → 4), so `a = 2`."}],"hints":["The heights go up in equal steps of 2. For a log graph, equal steps up come from equal \u003cstrong>ratios\u003c/strong> of the distances from the wall.","So `(3 - d)/(2 - d) = (5 - d)/(3 - d)`. Cross-multiply.","`(3 - d)^2 = (2 - d)(5 - d)` gives `9 - 6d = 10 - 7d`, so `d = 1`. The distances are 1, 2, 4, each double the last, so `a = 2`, and (2, 1) gives `c = 1`: `y = 2 log_{2}(x - 1) + 1`."],"right":"✓ Correct. The points are 1, 2 and 4 units from the wall `x = 1`, so the logs are 0, 1 and 2, and the heights 2(0) + 1, 2(1) + 1 and 2(2) + 1 are 1, 3 and 5."}]}]},"reflect":{"journal":[{"id":"j1","q":"In Explore, which surprised you more: that `a` and `c` never move the wall, or that squeezing a log graph sideways can look exactly like sliding it up? Describe what you saw."},{"id":"j2","q":"In your own words, explain why only the inside, `k(x - d)`, can change the domain of a log function."},{"id":"j3","q":"Explain to a friend how to sketch `y = log_{2}(8 - 2x) + 1`: the wall, the side and two key points."},{"id":"j4","q":"Which step of graphing a transformed log function do you still get wrong most often? What will you do differently next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":4,"a":{"prompt":"Which statement describes the graph of `y = -2 log_{3}(x + 1) + 4` next to its vertical asymptote and far from it?","options":[{"t":"As `x → -1⁺`, `y → ∞`, and as `x → ∞`, `y → -∞`.","why":"The wall is `x = -1`, where the inside `x + 1` is 0. Next to it the log plunges toward −∞, and `a = -2` turns that into ∞. Far away the log keeps rising slowly, and `a = -2` turns that into a slow fall with no floor.","_n":"1uda4","_k":"32b7a4ae"},{"t":"As `x → -1⁺`, `y → ∞`, and as `x → ∞`, `y → 4`.","why":"The + 4 lifts the graph, but a log graph never levels off, so there’s no horizontal asymptote. At `x = 80`, `y = -2 log_{3} 81 + 4 = -4`, already below 4.","_n":"1ve34","_k":"88b1826b"},{"t":"As `x → -1⁺`, `y → -∞`, and as `x → ∞`, `y → ∞`.","why":"That’s the behaviour of `y = log_{3}(x + 1)`, before the reflection. `a = -2` is negative, so both ends flip: up along the wall, down far away.","_n":"1we44","_k":"9f09fd39"},{"t":"As `x → 1⁺`, `y → ∞`, and as `x → ∞`, `y → -∞`.","why":"The inside `x + 1` is 0 at `x = -1`, not 1, so the graph runs along the wall `x = -1`.","_n":"1xe14","_k":"3cb5b7d3"}]},"b":{"prompt":"Which statement describes the graph of `y = -3 log_{2}(x - 2) + 5` next to its vertical asymptote and far from it?","options":[{"t":"As `x → 2⁺`, `y → -∞`, and as `x → ∞`, `y → ∞`.","why":"That’s the behaviour of `y = log_{2}(x - 2)`, before the reflection. `a = -3` is negative, so both ends flip: up along the wall, down far away.","_n":"1ye04","_k":"48bc3e8f"},{"t":"As `x → -2⁺`, `y → ∞`, and as `x → ∞`, `y → -∞`.","why":"The inside `x - 2` is 0 at `x = 2`, not −2, so the graph runs along the wall `x = 2`.","_n":"1zdf4","_k":"c93f79e1"},{"t":"As `x → 2⁺`, `y → ∞`, and as `x → ∞`, `y → 5`.","why":"The + 5 lifts the graph, but a log graph never levels off, so there’s no horizontal asymptote. At `x = 10`, `y = -3 log_{2} 8 + 5 = -4`, already below 5.","_n":"20de4","_k":"f5773069"},{"t":"As `x → 2⁺`, `y → ∞`, and as `x → ∞`, `y → -∞`.","why":"The wall is `x = 2`, where the inside `x - 2` is 0. Next to it the log plunges toward −∞, and `a = -3` turns that into ∞. Far away the log keeps rising slowly, and `a = -3` turns that into a slow fall with no floor.","_n":"21dd4","_k":"cc279fae"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is the domain of `y = log_{2}(12 - 3x)`?","options":[{"t":"`{x ∈ ℝ | x \u003c 4}`","why":"`12 - 3x > 0` gives `-3x > -12`, so `x \u003c 4` (dividing by −3 reverses the sign).","_n":"22dc4","_k":"c35d9d32"},{"t":"`{x ∈ ℝ | x \u003c 12}`","why":"12 is the constant before factoring: `12 - 3x = -3(x - 4)`. At `x = 5` the inside is −3.","_n":"23db4","_k":"a5c195c5"},{"t":"`{x ∈ ℝ | x \u003c -4}`","why":"That comes from `-3x > 12`, which moves the 12 across without changing its sign. `12 - 3x > 0` gives `-3x > -12`, so `x \u003c 4`. Check `x = 0`: the inside is 12 > 0, so 0 is in the domain, but 0 \u003c −4 is false.","_n":"24da4","_k":"5bc7d5d9"},{"t":"`{x ∈ ℝ | x > 4}`","why":"Test `x = 0`: 12 > 0, so 0 is in the domain. Dividing by −3 reverses the inequality.","_n":"25e94","_k":"41fde697"}]},"b":{"prompt":"What is the domain of `y = log(10 - 2x) + 3`?","options":[{"t":"`{x ∈ ℝ | x \u003c 5}`","why":"`10 - 2x > 0` gives `x \u003c 5`. The + 3 acts on the output.","_n":"26e84","_k":"dcf917aa"},{"t":"`{x ∈ ℝ | x \u003c -5}`","why":"That comes from `-2x > 10`, which moves the 10 across without changing its sign. `10 - 2x > 0` gives `-2x > -10`, so `x \u003c 5`. Check `x = 0`: the inside is 10 > 0, so 0 is in the domain, but 0 \u003c −5 is false.","_n":"275f2","_k":"6380b29c"},{"t":"`{x ∈ ℝ | x > 5}`","why":"Test `x = 0`: 10 > 0, so 0 is in the domain.","_n":"28602","_k":"5734ad18"},{"t":"`{x ∈ ℝ | x \u003c 10}`","why":"`10 - 2x = -2(x - 5)`. At `x = 6` the inside is −2.","_n":"295d2","_k":"05816614"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"(9, 2) is on the graph of `y = log_{3} x`. Which point is on the graph of `y = 2 log_{3}(x - 4) + 1`?","options":[{"t":"(13, 5)","why":"(9 + 4, 2(2) + 1) = (13, 5). Check: `2 log_{3} 9 + 1 = 5`.","_n":"2a5e2","_k":"8ae0baae"},{"t":"(13, 3)","why":"That adds 1 but leaves out the stretch: 2 × 2 = 4, then + 1.","_n":"2b5b2","_k":"e9dbfa2d"},{"t":"(5, 5)","why":"`x - 4` inside moves the graph 4 units right: 9 + 4 = 13.","_n":"2c5c2","_k":"f7882631"},{"t":"(13, 6)","why":"That’s 2(2 + 1). Multiply first, then add: 2(2) + 1 = 5.","_n":"2d592","_k":"049ade00"}]},"b":{"prompt":"(8, 3) is on the graph of `y = log_{2} x`. Which point is on the graph of `y = 3 log_{2}(x + 2) - 1`?","options":[{"t":"(10, 8)","why":"`x + 2` inside moves the graph 2 units left: 8 − 2 = 6.","_n":"2e5a2","_k":"2aedb9b9"},{"t":"(6, 6)","why":"That’s 3(3 − 1). Multiply first, then subtract: 3(3) − 1 = 8.","_n":"2f672","_k":"9b4c311d"},{"t":"(6, 8)","why":"(8 − 2, 3(3) − 1) = (6, 8). Check: `3 log_{2} 8 - 1 = 8`.","_n":"2g682","_k":"9b122f04"},{"t":"(6, 2)","why":"That subtracts 1 but leaves out the stretch: 3 × 3 = 9, then − 1.","_n":"2h653","_k":"6c3ccdb6"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"In `y = a log_{2}[k(x - 3)] + c`, the numbers `a`, `k` and `c` are all positive. You want the graph to pass through (1, 5). Which number must become negative?","options":[{"t":"`a`","why":"A negative `a` flips the graph top to bottom. The domain stays `x > 3`, so `x = 1` still has no value.","_n":"2i643","_k":"70c82902"},{"t":"`c`","why":"`c` moves the graph up or down. No height can reach a point whose `x`-value isn’t in the domain.","_n":"2j673","_k":"4d07bae6"},{"t":"None; a larger `c` is enough.","why":"At `x = 1` the inside is `k(1 - 3) = -2k`, which is negative while `k > 0`, so there is no point on the graph at `x = 1` at all.","_n":"2k663","_k":"f952ae82"},{"t":"`k`","why":"(1, 5) is left of the wall `x = 3`, and right now the domain is `x > 3`. Only a negative `k` moves the domain to the left. Then it can work: with `k = -1` the inside at `x = 1` is 2, so `a = 1` and `c = 4` give `log_{2} 2 + 4 = 5`.","_n":"2l693","_k":"d69241f9"}]},"b":{"prompt":"In `y = a log_{3}[k(x + 2)] + c`, the numbers `a`, `k` and `c` are all positive. You want the graph to pass through (−5, 1). Which number must become negative?","options":[{"t":"`a`","why":"A negative `a` flips the graph top to bottom. The domain stays `x > -2`.","_n":"2m683","_k":"8425e8aa"},{"t":"`c`","why":"`c` moves the graph up or down. It can’t make `x = -5` allowed.","_n":"2n6b3","_k":"926f5977"},{"t":"None; a smaller `c` is enough.","why":"At `x = -5` the inside is `k(-5 + 2) = -3k`, which is negative while `k > 0`, so there is no point on the graph at `x = -5`.","_n":"2o6a3","_k":"fd47838d"},{"t":"`k`","why":"(−5, 1) is left of the wall `x = -2`, and right now the domain is `x > -2`. Only a negative `k` moves it to the left. With `k = -1` the inside at `x = -5` is 3, so `a = 1/2` and `c = 1/2` give `(1/2) log_{3} 3 + 1/2 = 1`.","_n":"2p5d3","_k":"9ab9dc2d"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"The graph of `y = a log_{2}(x - d) + c` has vertical asymptote `x = -1` and passes through (0, 4) and (3, 0). What is `a`?","options":[{"t":"`-4`","why":"−4 is the change in `y`. Between the points the inside goes from 1 to 4, which adds `log_{2} 4 = 2` to the log, so `a = -4 ÷ 2`.","_n":"2q5c3","_k":"04e3e83c"},{"t":"`-2`","why":"`d = -1`. At `x = 0` the inside is 1 and `log_{2} 1 = 0`, so `c = 4`. At `x = 3` the inside is 4: `2a + 4 = 0`, so `a = -2`.","_n":"2r0d9","_k":"7edefcd2"},{"t":"`-4/3`","why":"−4/3 is the slope of the line through the two points. The graph is a log curve, not a line.","_n":"2s0c9","_k":"bf7c13d7"},{"t":"2","why":"The graph falls from (0, 4) to (3, 0), so `a` must be negative.","_n":"2t0b9","_k":"3f2a49d5"}]},"b":{"prompt":"The graph of `y = a log_{3}(x - d) + c` has vertical asymptote `x = 2` and passes through (3, −1) and (11, 3). What is `a`?","options":[{"t":"`-2`","why":"The graph rises from (3, −1) to (11, 3), so `a` is positive.","_n":"2u0a9","_k":"01480993"},{"t":"`1/2`","why":"1/2 is the slope of the line through the two points. The graph is a log curve, not a line.","_n":"2v119","_k":"a3c994d7"},{"t":"2","why":"`d = 2`. At `x = 3` the inside is 1, so `c = -1`. At `x = 11` the inside is 9 and `log_{3} 9 = 2`: `2a - 1 = 3`, so `a = 2`.","_n":"2w109","_k":"a7e367f0"},{"t":"4","why":"4 is the change in `y`. The inside goes from 1 to 9, which adds `log_{3} 9 = 2` to the log, so `a = 4 ÷ 2`.","_n":"2x0f9","_k":"24d5233d"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Which equation has exactly the same graph as `y = log_{2}(4x - 12)`?","options":[{"t":"`y = 4 log_{2}(x - 3)`","why":"A factor inside isn’t a factor outside. At `x = 5`: `log_{2} 8 = 3`, but `4 log_{2} 2 = 4`.","_n":"2y0e9","_k":"5f9b85bb"},{"t":"`y = log_{2}(x - 12) + 2`","why":"The 4 has to come out of both terms: `4x - 12 = 4(x - 3)`. `log_{2}(x - 12) + 2` has its wall at `x = 12`, but `log_{2}(4x - 12)` has its wall at `x = 3`.","_n":"2z159","_k":"e7aed3f7"},{"t":"`y = log_{2}(x - 3) + 4`","why":"The shift is `log_{2} 4 = 2`, not 4. At `x = 4`: `log_{2} 4 = 2`, but `log_{2} 1 + 4 = 4`.","_n":"30149","_k":"ffa12f13"},{"t":"`y = log_{2}(x - 3) + 2`","why":"Factor first: `4x - 12 = 4(x - 3)`. Then `4 = 2^2`, so multiplying the inside by 4 adds 2: `log_{2}[4(x - 3)] = log_{2}(x - 3) + 2`. Check `x = 4`: `log_{2} 4 = 2` and `log_{2} 1 + 2 = 2`.","_n":"31079","_k":"5b9c1501"}]},"b":{"prompt":"Which equation has exactly the same graph as `y = log_{3}(9x + 18)`?","options":[{"t":"`y = 9 log_{3}(x + 2)`","why":"A factor inside isn’t a factor outside. At `x = 1`: `log_{3} 27 = 3`, but `9 log_{3} 3 = 9`.","_n":"32089","_k":"a2257f32"},{"t":"`y = log_{3}(x + 2) + 2`","why":"Factor first: `9x + 18 = 9(x + 2)`. Then `9 = 3^2`, so multiplying the inside by 9 adds 2: `log_{3}[9(x + 2)] = log_{3}(x + 2) + 2`. Check `x = -1`: `log_{3} 9 = 2` and `log_{3} 1 + 2 = 2`.","_n":"33099","_k":"c2521c6d"},{"t":"`y = log_{3}(x + 2) + 9`","why":"The shift is `log_{3} 9 = 2`, not 9. At `x = -1`: `log_{3} 9 = 2`, but `log_{3} 1 + 9 = 9`.","_n":"340a9","_k":"ac7991fd"},{"t":"`y = log_{3}(x + 18) + 2`","why":"The 9 has to come out of both terms: `9x + 18 = 9(x + 2)`. `log_{3}(x + 18) + 2` has its wall at `x = -18`, but `log_{3}(9x + 18)` has its wall at `x = -2`.","_n":"350b9","_k":"856b1a4b"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which describes how to get `y = 3 log[2(x + 1)] - 4` from `y = log x`, correctly and in a correct order?","options":[{"t":"A translation 1 unit left and 4 units down, then a vertical stretch by a factor of 3 and a horizontal compression by a factor of 1/2.","why":"In that order the stretch also stretches the shift: the − 4 becomes − 12, and you get `3 log(2x + 1) - 12`.","_n":"360c9","_k":"4772d4ed"},{"t":"A vertical stretch by a factor of 3 and a horizontal stretch by a factor of 2, then a translation 1 unit left and 4 units down.","why":"`k = 2` halves every `x`-coordinate: that’s a compression by a factor of 1/2.","_n":"370d9","_k":"fde2b70f"},{"t":"A vertical stretch by a factor of 3 and a horizontal compression by a factor of 1/2, then a translation 2 units left and 4 units down.","why":"The bracket is already factored: `2(x + 1)`. The shift is the number with `x` inside the bracket, 1, not 2 × 1.","_n":"380e9","_k":"dbab4ec5"},{"t":"A vertical stretch by a factor of 3 and a horizontal compression by a factor of 1/2, then a translation 1 unit left and 4 units down.","why":"`a = 3`, `k = 2`, `d = -1`, `c = -4`, with stretches before translations, as in the mapping rule `(x/2 - 1, 3y - 4)`.","_n":"390f9","_k":"a45a4e20"}]},"b":{"prompt":"Which describes how to get `y = -(1/2) log_{2}[3(x - 2)] + 5` from `y = log_{2} x`, correctly and in a correct order?","options":[{"t":"A vertical compression by a factor of 1/2, a reflection in the `x`-axis and a horizontal compression by a factor of 1/3, then a translation 2 units right and 5 units up.","why":"`a = -1/2`, `k = 3`, `d = 2`, `c = 5`, stretches and reflections first.","_n":"3a109","_k":"65239261"},{"t":"A vertical compression by a factor of 1/2, a reflection in the `x`-axis and a horizontal compression by a factor of 1/3, then a translation 6 units right and 5 units up.","why":"The bracket is already factored: `3(x - 2)`. The shift is 2, not 3 × 2.","_n":"3b999","_k":"8ad08038"},{"t":"A translation 2 units right and 5 units up, then a vertical compression by a factor of 1/2, a reflection in the `x`-axis and a horizontal compression by a factor of 1/3.","why":"In that order the reflection and compression also act on the shift: the + 5 becomes −5/2.","_n":"3c989","_k":"cf79e32c"},{"t":"A vertical compression by a factor of 1/2, a reflection in the `x`-axis and a horizontal stretch by a factor of 3, then a translation 2 units right and 5 units up.","why":"`k = 3` divides every `x`-coordinate by 3: that’s a compression by a factor of 1/3.","_n":"3d9b9","_k":"6b029135"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why `y = 5 log_{2}(x - 1) - 7` has domain `{x ∈ ℝ | x > 1}`?","options":[{"t":"`a = 5` is positive, so the graph is not reflected and stays on the right of its wall `x = 1`. If `a` were negative, the reflection would carry the graph across the wall, and the domain would become `{x ∈ ℝ | x \u003c 1}`.","why":"A negative `a` reflects in the `x`-axis, which changes heights, not `x`-values. The domain would still be `x > 1`.","_n":"3e9a9","_k":"bfe1bf1f"},{"t":"The input `x - 1` must be positive, so `x > 1`. In the same way, the −7 shifts the graph down 7, which limits the outputs instead: the range is `{y ∈ ℝ | y > -7}`, so the graph stays above that line.","why":"The first sentence is right, but the second isn’t. The range of every log graph is all real numbers: as `x → 1⁺`, `y → -∞`, far below −7.","_n":"3f9d9","_k":"d0714755"},{"t":"A log only accepts positive inputs, and the input here is `x - 1`, so `x - 1 > 0` and `x > 1`. The 5 and the −7 act on the output after the log is taken, so they can’t change which `x`-values are allowed.","why":"This names what decides the domain and why the other numbers don’t matter.","_n":"3g9c9","_k":"6ee503b0"},{"t":"The vertical asymptote is `x = 1`, because the inside `x - 1` is 0 there. A graph can never touch its vertical asymptote, so `x = 1` is left out of the domain, and that leaves `{x ∈ ℝ | x > 1}`.","why":"This explains why `x = 1` is left out, but not why `x = 0` is. For `y = 1/(x - 1)`, `x = 0` is allowed. A log has no values on one whole side of its wall: at `x = 0` the inside is −1.","_n":"3h9f9","_k":"5327d39d"}]},"b":{"prompt":"Which is the best explanation of why `y = -3 log(x + 4) + 2` has domain `{x ∈ ℝ | x > -4}`, even though `a` is negative?","options":[{"t":"The vertical asymptote is `x = -4`, because the inside `x + 4` is 0 there. A graph can never touch its vertical asymptote, so `x = -4` is left out of the domain, and that leaves `{x ∈ ℝ | x > -4}`.","why":"This explains why `x = -4` is left out, but not why `x = -5` is. For `y = 1/(x + 4)`, `x = -5` is allowed. A log has no values on one whole side of its wall: at `x = -5` the inside is −1.","_n":"3i9e9","_k":"3c48acaf"},{"t":"A negative `a` reflects the graph in the `y`-axis, which would put it on the left of the wall. But the + 4 inside moves it back to the right, so the domain is still `{x ∈ ℝ | x > -4}`.","why":"A negative `a` reflects in the `x`-axis, not the `y`-axis, so there is nothing to move back.","_n":"3j919","_k":"01eb70f8"},{"t":"The input `x + 4` must be positive, so `x > -4`. In the same way, the + 2 and the reflection limit the outputs instead: the range is `{y ∈ ℝ | y \u003c 2}`, so the graph stays below that line.","why":"The first sentence is right, but the second isn’t. The range of every log graph is all real numbers: as `x → -4⁺`, `y → ∞`, far above 2.","_n":"3k909","_k":"f56b5b6c"},{"t":"A log only accepts positive inputs, and the input here is `x + 4`, so `x + 4 > 0` and `x > -4`. The −3 and the 2 act on the output after the log is taken, so they can’t change which `x`-values are allowed.","why":"This names what decides the domain and why `a` doesn’t matter.","_n":"3l139","_k":"931b3afb"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A seedling’s height `h`, in centimetres, `t` weeks after it is planted is modelled by `h = 6 log_{2}(t + 1) + 4`. After how many weeks is it 22 cm tall?","options":[{"t":"3","why":"3 is the value of `log_{2}(t + 1)`, not `t`. Undo the log: `t + 1 = 2^3`.","_n":"3m149","_k":"12f471fe"},{"t":"5","why":"`2^3` is 2 × 2 × 2 = 8, not 2 × 3 = 6.","_n":"3n119","_k":"83c5dd2c"},{"t":"7","why":"`6 log_{2}(t + 1) = 18`, so `log_{2}(t + 1) = 3` and `t + 1 = 2^3 = 8`: `t = 7`. In mapping terms, (8, 3) on `y = log_{2} x` maps to (8 − 1, 6(3) + 4) = (7, 22).","_n":"3o129","_k":"a6f576b9"},{"t":"8","why":"`t + 1 = 8`, so `t = 7`. The + 1 inside shifts the graph 1 unit left.","_n":"3p0f9","_k":"78853c26"}]},"b":{"prompt":"A fish’s length `L`, in centimetres, `t` months after it hatches is modelled by `L = 5 log_{3}(t + 1) + 2`. After how many months is it 12 cm long?","options":[{"t":"2","why":"2 is the value of `log_{3}(t + 1)`, not `t`. Undo the log: `t + 1 = 3^2`.","_n":"3q109","_k":"ed7528be"},{"t":"5","why":"`3^2` is 3 × 3 = 9, not 3 × 2 = 6.","_n":"3r0d9","_k":"393aba36"},{"t":"8","why":"`5 log_{3}(t + 1) = 10`, so `log_{3}(t + 1) = 2` and `t + 1 = 3^2 = 9`: `t = 8`. In mapping terms, (9, 2) on `y = log_{3} x` maps to (9 − 1, 5(2) + 2) = (8, 12).","_n":"3s0e9","_k":"8f50c281"},{"t":"9","why":"`t + 1 = 9`, so `t = 8`. The + 1 inside shifts the graph 1 unit left.","_n":"3t1b9","_k":"0e6982cd"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"`f(x) = 2^{x - 3} + 1`. The inverse of `f` is a transformed log function. What is the vertical asymptote of the graph of the inverse?","options":[{"t":"`y = 1`","why":"That’s `f`’s asymptote. Reflecting in `y = x` turns a horizontal line into a vertical one.","_n":"3u1c9","_k":"0a70dcf1"},{"t":"`x = 1`","why":"`f` has horizontal asymptote `y = 1`. Reflecting in `y = x` swaps the coordinates, so the inverse has the vertical asymptote `x = 1`. Algebra agrees: `x = 2^{y - 3} + 1` gives `y = log_{2}(x - 1) + 3`.","_n":"3va59","_k":"b71e19a3"},{"t":"`x = 3`","why":"The 3 is `f`’s horizontal shift. After the swap it becomes the inverse’s vertical shift: `y = log_{2}(x - 1) + 3`.","_n":"3wa49","_k":"e9e14f9c"},{"t":"`x = -1`","why":"Sign slip: the inverse is `log_{2}(x - 1) + 3`, whose inside is 0 at `x = 1`.","_n":"3xa39","_k":"ca50509c"}]},"b":{"prompt":"`g(x) = 3^{x + 2} - 4`. The inverse of `g` is a transformed log function. What is the vertical asymptote of the graph of the inverse?","options":[{"t":"`x = 4`","why":"Sign slip: the inverse is `log_{3}(x + 4) - 2`, whose inside is 0 at `x = -4`.","_n":"3ya29","_k":"16f52c00"},{"t":"`x = -4`","why":"`g` has horizontal asymptote `y = -4`. Reflecting in `y = x` makes it the vertical asymptote `x = -4`. Algebra agrees: `x = 3^{y + 2} - 4` gives `y = log_{3}(x + 4) - 2`.","_n":"3za19","_k":"abe15743"},{"t":"`x = -2`","why":"The −2 comes from `g`’s horizontal shift. After the swap it becomes the inverse’s vertical shift: `y = log_{3}(x + 4) - 2`.","_n":"40a09","_k":"173d6c4e"},{"t":"`y = -4`","why":"That’s `g`’s asymptote. Reflecting in `y = x` turns a horizontal line into a vertical one.","_n":"419f9","_k":"14671655"}]}}]},"task":{"title":"Rising to the wall","summary":"Rising to the wall","statement":"\u003cp>Design a function `y = @a{a} log_{@b{b}}[@k{k}(x - @d{d})] + @c{c}` whose graph:\u003c/p>\u003cul>\u003cli>has domain `{x ∈ ℝ | x \u003c 4}`;\u003c/li>\u003cli>passes through (3, 2);\u003c/li>\u003cli>is increasing on its whole domain;\u003c/li>\u003cli>crosses the `x`-axis at an integer from −10 to 10.\u003c/li>\u003c/ul>\u003cp>There’s more than one answer. Can you find them all?\u003c/p>","checks":["Domain `{x ∈ ℝ | x \u003c 4}`","Passes through (3, 2)","Increasing on its whole domain","Crosses the `x`-axis at an integer from −10 to 10"],"tips":["The domain `x \u003c 4` fixes two things: where the wall is (`d`) and which side the graph is on (the sign of `k`).","At `x = 3` your graph is at {yv}.","Your graph falls as `x` increases. With `k` negative, the inside shrinks as `x` moves right, so the log falls. A negative `a` turns that fall into a rise.","Your graph crosses the `x`-axis at `x ≈` {v}. With `k = -1` and `c = 2` you need `a log_{b}(4 - x) = -2`, so `4 - x` must be `b^{-2/a}`. Which choices of `a` and `b` make that a whole number?"],"tip2out":"`x = 3` isn’t in your domain yet. Fix line 1 first.","tip2more":"3 is one unit left of the wall. With `k = -1` the inside there is 1, and `log_{b} 1 = 0`, so the height at `x = 3` is just `c`.","noCross":"Your graph doesn’t cross the `x`-axis inside the window you can reach with these numbers.","far":"far off the screen, beyond 10 000 units from the wall","same":"Same function as one you already found.","allFive":"You found all five. Every answer is `y = a log_{b}(4 - x) + 2` with `a` negative. The point (3, 2) is one unit from the wall, where the log is 0, so it pins the height at 2. The `x`-intercept is where `a log_{b}(4 - x) = -2`. Other choices also give integers, such as −12 (base 2, `a = -1/2`) and −96 (base 10, `a = -1`), but they are outside −10 to 10.","explainPrompt":"Explain why `a` has to be negative in every answer.","vocab":"Use the words domain, wall, reflection and increasing.","success":"Your design works!","more":"There’s more than one answer. Can you find another?"},"cards":[["Key points of `y = log_{b} x`","`(1/b, -1)`, (1, 0), `(b, 1)`, `(b^2, 2)`. Base 2: (1/2, −1), (1, 0), (2, 1), (4, 2). Wall `x = 0`, domain `x > 0`."],["`y = a log_{b}[k(x - d)] + c`","`a`: vertical stretch or compression (reflection in the `x`-axis if `a \u003c 0`). `k`: horizontal compression or stretch by a factor of `1/|k|` (reflection in the `y`-axis if `k \u003c 0`). `d`: left or right. `c`: up or down."],["The vertical asymptote","`x = d`, where the inside `k(x - d)` is 0. Only `d` moves it. Example: `y = 4 log(x + 6) - 3` has `x = -6`."],["The domain","`k > 0`: `{x ∈ ℝ | x > d}`. `k \u003c 0`: `{x ∈ ℝ | x \u003c d}`. `a` and `c` never change it."],["The range","Always `{y ∈ ℝ}`. A log graph has no horizontal asymptote: it keeps rising or falling, slowly."],["Factor first","`log_{2}(2x - 8) = log_{2}[2(x - 4)]`: `d = 4`, not 8. `log_{2}(6 - 2x) = log_{2}[-2(x - 3)]`: wall `x = 3`, domain `x \u003c 3`."],["The mapping rule","`(x, y) -> (x/k + d, ay + c)`. Example: (2, 1) on `y = log_{2} x` → (5, 3) on `y = 2 log_{2}(x - 3) + 1`."],["Increasing or decreasing?","Increasing when `a` and `k` have the same sign; decreasing when their signs differ (for base `b > 1`)."],["Next to the wall","`y → -∞` when `a > 0`, `y → ∞` when `a \u003c 0`. Example: `y = -log_{2}(x - 1)`: as `x → 1⁺`, `y → ∞`."],["Stretch or shift?","Multiplying the inside by a power of the base shifts the graph: `log_{2}(4x) = log_{2} x + 2`; `log_{3}(x/9) = log_{3} x - 2`."],["`x`-intercept of a transformed log","Set `y = 0` and undo the log: `k(x - d) = b^{-c/a}`. Example: `2 log_{2}(x - 3) - 2 = 0` gives `x - 3 = 2`, so `x = 5`."],["Order of transformations","Stretches, compressions and reflections first, then translations. Translating first stretches the shifts too."]]}};</script>
