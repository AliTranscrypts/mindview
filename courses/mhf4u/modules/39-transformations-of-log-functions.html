.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 39: hero, radio groups, Domain wall explorer (sliders, legend, readout, tables, inset), by-hand builder, work-backwards boxes, task */
.hero .hero-eq.md{font-size:clamp(1.5rem,4vw,2.6rem)}
.hero .hero-eq .m{white-space:normal}
.hero p.lw-hook{font-size:.95rem;padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
canvas.plot:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
/* radio groups (copied from MHF4U 32) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:36px;min-width:44px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button[aria-checked="true"] .p-b{color:inherit}
.rg button:disabled{opacity:.6}
.rg.chips .p-b{font-weight:700}
/* explorer layout */
.lw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"graph top" "graph sl" "graph tog" "tbl tbl" "read read";grid-template-rows:auto auto 1fr auto auto;gap:12px 26px;align-items:start}
.lw > *{min-width:0}
.lw-top{grid-area:top;display:grid;gap:10px}.lw-sl{grid-area:sl}.lw-graph{grid-area:graph}.lw-tog{grid-area:tog}.lw-tbl{grid-area:tbl;max-width:720px}.lw-read{grid-area:read}
.lw-tbl:empty{display:none}
.lw-cap{font-size:clamp(1.1rem,2.4vw,1.55rem);min-height:1.7em;margin-bottom:4px}
.lw-cap .m{white-space:normal}
.lw-vs{font-size:.85rem;color:var(--ink-2);font-weight:700;margin:0 4px}
.lw .drag-h,.lh .drag-h,.rw-pv .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.lw-lock{margin:6px 0 0;color:var(--ink-2)}
.lw-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;max-width:none}
.lw-leg span{display:inline-flex;align-items:center;gap:6px}
.lw-leg .ln{display:inline-block;width:26px;height:0;border-top:2px dashed var(--ink-2)}
.lw-leg .ln.cur{border-top:3px solid var(--pen)}
.lw-leg .ln.tg{border-top:2.5px dashed var(--ink);width:30px}
.lw-leg .ln.gap{border-top:4px solid var(--p-c);width:18px}
.lw-leg .dt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pen)}
.lw-leg .dt.ho{background:var(--sheet);border:2px solid var(--ink-2)}
.lw-leg .dt.dk{background:var(--ink)}
.lw-togs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.lw-tb{min-height:36px}
.lw-tb[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.lw-tb .m{font-size:1.05em}
.lw-inset{margin-top:12px;max-width:420px}
.lw-icap{margin:6px 0 0}
.lw-icap .m{white-space:normal}
.lw-tbl{margin-top:2px}
.lw-th{margin:0 0 6px;font-size:.85rem;color:var(--ink-2)}
.lw-tbl table.vt th,.lw-tbl table.vt td{padding:5px 10px}
.lw-read dl.read{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.lw-read .read > div,.lw-read .read > div:first-child{padding:8px 0}
.lw-read .read dd .m{white-space:normal}
.lw-why{color:var(--ink-2);font-size:.92rem}
.lw-more{display:none;margin-top:8px}
/* sliders (stepSlider, adapted from MHF4U 32) */
.lw-sl4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.lw-sl1{margin:0 0 4px}
.lw-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap}
.lw-sl-top label{font-weight:700;font-size:.9rem}
.lw-sl-top output{font:600 1.15rem var(--font-math);color:var(--sc)}
.lw-sl-row{display:flex;align-items:center;gap:6px}
.lw-pm{min-width:34px;min-height:34px;padding:0;font-size:1.2rem;line-height:1;justify-content:center}
.lw-sl1 input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:40px;background:transparent;margin:0;cursor:pointer}
.lw-sl1 input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.lw-sl1 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc);margin-top:-8px}
.lw-sl1 input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.lw-sl1 input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc)}
.lw-sl1 input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.lw-sl1 input[type=range]:disabled{opacity:.45;cursor:default}
.lw-sl-note{margin:-6px 0 0}
@media (max-width:760px){
  .lw{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "graph" "sl" "tog" "tbl" "read";grid-template-rows:none}
  .lw-read dl.read{grid-template-columns:minmax(0,1fr)}
  .lw-read:not(.all) .read > div:nth-child(n+7){display:none}
  .lw-more{display:inline-flex}
  .lw-sl4{gap:2px 10px}
  .lh-par{min-width:0}
  .lh-prow .lh-in{width:3.4rem}
  .bw-in{width:3.3rem}
}
/* by hand */
.lh-eq{font-size:clamp(1.25rem,3vw,1.7rem)}
.lh-eq .m{white-space:normal}
.lh-rounds{margin-bottom:6px}
ol.lh-steps{margin:0 0 12px;padding-left:1.3em;display:grid;gap:10px}
ol.lh-steps > li > strong{display:block;margin-bottom:4px}
ol.lh-steps p.tiny{margin:0 0 4px}
.lh-pbox{display:flex;flex-wrap:wrap;gap:6px 14px}
.lh-box{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.lh-box .m{font-size:1.15rem}
.lh-in{width:4.6rem;padding:.35em .5em}
.lh-fac{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 8px;font-size:1.1rem}
.lh-fac[hidden]{display:none}
.lh-flab{font:700 .9rem var(--font-ui)}
.lh-prow{display:flex;flex-wrap:nowrap;align-items:center;gap:4px 5px;margin:0 0 6px}
.lh-prow .m{font-size:1.15rem}
.lh-par{min-width:4.6em;white-space:nowrap}
.lh-prow .lh-in{width:4.2rem}
.lh-v{font-size:1.15rem}
ul.lh-checks .lh-why{display:block;font-size:.9rem;color:var(--ink-2);margin-top:2px}
ul.lh-checks li.bad .mk{color:var(--red)}
ul.lh-fbl{margin:6px 0 0;padding-left:1.2em}
ul.lh-fbl li{margin:0 0 4px}
/* work backwards */
.bw-tpl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:10px 0 4px;font-size:1.2rem}
.bw-tpl .m{font-size:1.1em}
.bw-in{width:4.4rem;padding:.3em .45em;text-align:center}
.bw-g{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
canvas.plot.bw-mini{max-width:360px;margin-top:10px}
/* task */
.rw-sl{margin-top:8px}
.rw-note{margin:6px 0 0}
.lw-cap + .rw-pv{margin-bottom:10px}
#rw-base{margin-top:6px}

x-trig-functions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"7c2b398c","content":{"id":"39-transformations-of-log-functions","kind":"topic","title":"Transformations of log functions","topic":"Transformations of Log Functions","readyTopic":"transformations of log functions","hero":{"eq":"`y = @a{a} log_{@b{b}}[@k{k}(x - @d{d})] + @c{c}`","eqLabel":"y equals a times log base b of the quantity k times x minus d, plus c","eqSize":"md","headline":"Which numbers can move the wall?","text":"Every log graph has a \u003cstrong>vertical asymptote\u003c/strong>, a wall it hugs but never crosses, and its \u003cstrong>domain\u003c/strong> sits on one side of that wall. Four numbers, `@a{a}`, `@k{k}`, `@d{d}` and `@c{c}`, transform the graph. Some of them can move the wall or switch the side the graph lives on, and some can’t. You’ll find out which. Then you’ll sketch any transformed log graph by hand from its wall, its side and a few \u003cstrong>key points\u003c/strong>, moved with the \u003cstrong>mapping rule\u003c/strong> `(x, y) -> (x/@k{k} + @d{d}, @a{a}y + @c{c})`.\u003c/p>\u003cp class=\"lw-hook\">Same colours as module 07: violet `@a{a}` and orange `@k{k}` stretch; teal `@d{d}` and magenta `@c{c}` shift. The base `@b{b}` is brown.","fig":{"aria":"The graph of y = log base 2 of x with its wall x = 0 and key points; the points travel along mapping arrows while the wall slides to x = 3 and the domain switches to the left","caption":""},"capEnd":"`y = 2 log_{2}[-(x - 3)] + 1`. The wall moved from `x = 0` to `x = 3`, and the graph switched sides. Which of `@a{a}`, `@k{k}`, `@d{d}` and `@c{c}` did that? Explore will show you."},"goals":["I can describe how each of `a`, `k`, `d` and `c` transforms the graph of `y = log_{b} x`, naming stretches and reflections first, then translations.","I can find the vertical asymptote and the domain of `y = a log_{b}[k(x - d)] + c` from its equation, factoring the inside first when needed, and explain why `a` and `c` can’t change them.","I can map key points with `(x, y) -> (x/k + d, ay + c)` and use them, with the asymptote, to sketch the graph.","I can state the range, the intercepts and where the function increases or decreases, and describe its behaviour next to the asymptote and far from it.","I can recognize when two different equations give the same log graph, such as `y = log_{2}(4x)` and `y = log_{2} x + 2`.","I can work backwards from a graph, points or features to an equation of a transformed log function."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Evaluating logarithms","goal":3,"prompt":"What is `log_{2} 32`?","options":[{"t":"4","why":"`2^4 = 16`, not 32. Halving 32 gives 16, 8, 4, 2, 1: five halvings to reach 1, so the exponent is 5.","_n":"06aa","_k":"67c94b4a"},{"t":"5","why":"`log_{2} 32` asks: 2 to what exponent gives 32? `2^5 = 32`, so `log_{2} 32 = 5`.","_n":"167a","_k":"fc898b86"},{"t":"16","why":"32 ÷ 2 = 16, but a logarithm is an exponent, not a quotient. `2^{16}` is 65 536.","_n":"268a","_k":"fc2e9e69"},{"t":"64","why":"2 × 32 = 64. The log is the exponent that turns 2 into 32: `2^5 = 32`.","_n":"36da","_k":"6788c41c"}],"hints":["A logarithm is an exponent. `log_{2} 32` means: 2 to what exponent gives 32?","List powers of 2: 2, 4, 8, 16, 32 …","`2^5 = 32`, so `log_{2} 32 = 5`."]},{"id":"w2","skill":"Evaluating logarithms","goal":3,"prompt":"What is `log_{3}(1/9)`?","options":[{"t":"`-2`","why":"`3^{-2} = 1/3^2 = 1/9`, so `log_{3}(1/9) = -2`. Numbers between 0 and 1 have negative logs.","_n":"46ea","_k":"432afa05"},{"t":"`-1/2`","why":"`3^{-1/2} = 1/√3`, about 0.58. For 1/9 you need `1/3^2`, so the exponent is −2.","_n":"56ba","_k":"4594e12c"},{"t":"`1/2`","why":"`3^{1/2} = √3`, about 1.73, not 1/9. The reciprocal of the input gives the \u003cstrong>opposite\u003c/strong> of the log, not its reciprocal.","_n":"66ca","_k":"6489a00e"},{"t":"2","why":"`3^2 = 9`, not 1/9. A reciprocal needs a negative exponent: `3^{-2} = 1/9`.","_n":"761a","_k":"bbc8a4a9"}],"hints":["Write 1/9 as a power of 3.","`9 = 3^2`, and a reciprocal flips the sign of the exponent.","`1/9 = 3^{-2}`, so `log_{3}(1/9) = -2`."]},{"id":"w3","skill":"Features of \u003cspan class=\"m\">\u003ci>y\u003c/i> = \u003cspan class=\"fnm\">log\u003c/span>\u003csub>\u003ci>b\u003c/i>\u003c/sub> \u003ci>x\u003c/i>\u003c/span>","goal":2,"prompt":"What is the domain of `y = log_{2} x`?","options":[{"t":"`{x ∈ ℝ}`","why":"Every real number is the \u003cstrong>range\u003c/strong> (any exponent is possible). The inputs must be positive.","_n":"862a","_k":"24e93319"},{"t":"`{x ∈ ℝ | x > 1}`","why":"`log_{2} x` is positive when `x > 1`, but it exists for `0 \u003c x \u003c 1` too: `log_{2}(1/2) = -1`.","_n":"9d54","_k":"423d16a2"},{"t":"`{x ∈ ℝ | x > 0}`","why":"`log_{2} x` is the exponent that turns 2 into `x`. Every power of 2 is positive, so `x` must be positive. 0 is excluded too: 2 to any exponent is never 0.","_n":"ad44","_k":"3b6d7f10"},{"t":"`{x ∈ ℝ | x ≥ 0}`","why":"`log_{2} 0` would need `2^y = 0`, which never happens. The graph hugs the `y`-axis but never reaches `x = 0`.","_n":"bd74","_k":"fb470e1b"}],"hints":["`log_{2} x` answers: 2 to what exponent gives `x`? Which numbers can a power of 2 equal?","Powers of 2 are always positive, and never 0.","So `x > 0`: the domain is `{x ∈ ℝ | x > 0}`."]},{"id":"w4","skill":"Transformations","goal":3,"prompt":"The point (2, 5) is on the graph of `y = f(x)`. Which point must be on the graph of `y = 3f(x - 4) + 1`?","options":[{"t":"(−2, 16)","why":"`x - 4` inside moves the graph 4 units \u003cstrong>right\u003c/strong>: 2 + 4 = 6.","_n":"cd64","_k":"d0990113"},{"t":"(6, 16)","why":"The mapping rule `(x, y) -> (x/k + d, ay + c)` with `k = 1`, `d = 4`, `a = 3`, `c = 1` gives (2 + 4, 3(5) + 1) = (6, 16).","_n":"dd94","_k":"b1147848"},{"t":"(6, 18)","why":"That’s 3(5 + 1). Stretch first, then shift: 3(5) + 1 = 16.","_n":"ed84","_k":"bc8438eb"},{"t":"(6, 9)","why":"5 + 3 + 1 = 9 treats the 3 as a shift. A vertical stretch by 3 multiplies: 3 × 5 = 15, then + 1 = 16.","_n":"fdb4","_k":"72f6e712"}],"hints":["Use `(x, y) -> (x/k + d, ay + c)`. Read `a`, `k`, `d` and `c` from `3f(x - 4) + 1`.","`a = 3`, `k = 1`, `d = 4`, `c = 1`. The `x`-coordinate becomes 2 + 4.","(2 + 4, 3 × 5 + 1) = (6, 16)."]},{"id":"w5","skill":"Transformations","goal":1,"prompt":"Compared with `y = f(x)`, the graph of `y = f[2(x + 3)]` is…","options":[{"t":"compressed horizontally by a factor of 1/2, then translated 3 units right","why":"`x + 3` is `x - (-3)`, so `d = -3`: left, not right.","_n":"gda4","_k":"d136de30"},{"t":"compressed horizontally by a factor of 1/2, then translated 6 units left","why":"The 2 is factored out already: `2(x + 3)`. The translation is the number inside the bracket with `x`, which is 3.","_n":"hdd4","_k":"ac732d62"},{"t":"stretched horizontally by a factor of 2, then translated 3 units left","why":"`k = 2` squeezes the graph toward the `y`-axis: each `x`-coordinate is halved. That’s a compression by a factor of 1/2.","_n":"idc4","_k":"aed6e07c"},{"t":"compressed horizontally by a factor of 1/2, then translated 3 units left","why":"`k = 2` compresses by a factor of 1/2, and `x + 3 = x - (-3)` means `d = -3`: 3 units left.","_n":"j633","_k":"c77fa287"}],"hints":["Match `f[2(x + 3)]` to `f[k(x - d)]`. What are `k` and `d`?","`k = 2` and `d = -3`. A `k` bigger than 1 compresses.","Compression by a factor of 1/2, then 3 units left."]},{"id":"w6","skill":"Linear inequalities","goal":2,"prompt":"Solve `6 - 2x > 0`.","options":[{"t":"`x ≤ 3`","why":"At `x = 3`, 6 − 6 = 0, and 0 > 0 is false. The inequality is strict.","_n":"k643","_k":"708d3b12"},{"t":"`x \u003c -3`","why":"`6 - 2x > 0` gives `-2x > -6`, not `-2x > 6`. Check `x = 0`: 6 > 0, so 0 must be a solution, but 0 \u003c −3 is false.","_n":"l653","_k":"c42876ac"},{"t":"`x \u003c 3`","why":"`-2x > -6`. Dividing by −2 reverses the inequality: `x \u003c 3`. Check `x = 0`: 6 − 0 = 6 > 0.","_n":"m663","_k":"fc966131"},{"t":"`x > 3`","why":"Check `x = 4`: 6 − 8 = −2, which isn’t > 0. Dividing by −2 flips > to \u003c.","_n":"n673","_k":"f9f3544c"}],"hints":["Move the 6: `-2x > -6`.","Divide by −2, and remember what happens to the inequality sign.","`x \u003c 3`. Check: `x = 0` gives 6 > 0 ✓, `x = 4` gives −2 > 0 ✗."]}],"refreshers":{"Evaluating logarithms":"A logarithm is an exponent. `log_{b} x = y` means `b^y = x`. So `log_{2} 32 = 5` because `2^5 = 32`, and `log_{3}(1/9) = -2` because `3^{-2} = 1/9`. Reciprocals give negative logs, and `log_{b} 1 = 0` for every base.","Features of \u003cspan class=\"m\">\u003ci>y\u003c/i> = \u003cspan class=\"fnm\">log\u003c/span>\u003csub>\u003ci>b\u003c/i>\u003c/sub> \u003ci>x\u003c/i>\u003c/span>":"For a base `b > 1`: domain `{x ∈ ℝ | x > 0}`, range `{y ∈ ℝ}`, vertical asymptote `x = 0` (the `y`-axis), `x`-intercept (1, 0), no `y`-intercept, and the graph rises from left to right. Key points: `(1/b, -1)`, (1, 0), `(b, 1)`. For base 2: (1/2, −1), (1, 0), (2, 1), (4, 2).","Transformations":"In `y = a f[k(x - d)] + c`, each point `(x, y)` moves to `(x/k + d, ay + c)`. `a` stretches or compresses vertically by a factor of `|a|` (and reflects in the `x`-axis if negative); `k` stretches or compresses horizontally by a factor of `1/|k|` (and reflects in the `y`-axis if negative); `d` moves the graph right (left if negative); `c` moves it up (down if negative). Example: on `y = 3f(x - 4) + 1`, (2, 5) moves to (6, 16). If the inside isn’t factored, factor `k` out first: `f(2x + 6) = f[2(x + 3)]`.","Linear inequalities":"Solve like an equation, but when you multiply or divide by a negative number, reverse the sign. `6 - 2x > 0 -> -2x > -6 -> x \u003c 3`. Check with one value: `x = 0` gives 6 > 0, true."}}},"explore":{"heading":"Domain wall","intro":"Move the sliders and watch the wall, the shaded domain and the key points. Drag the probe to test any `x`-value: is it allowed? Then switch to \u003cstrong>Stretch or shift?\u003c/strong> to see something only log graphs do.","predIntro":"Make a prediction first. Then the explorer will show you what really happens.","predictions":[{"id":"p1","start":{"view":"t","b":2,"a":1,"k":1,"d":0,"c":0,"probe":2},"prompt":"First `c` will change from 0 to 4. Then `d` will change from 0 to −3. Where will the wall be at the end?","options":[{"t":"`x = -3`","_n":"o683","_k":"84eafc4d"},{"t":"`x = 4`","_n":"p693","_k":"728135b4"},{"t":"`x = 3`","_n":"q6a3","_k":"cc383561"},{"t":"`x = 1`","_n":"r5b3","_k":"69464c30"}],"banners":["The wall didn’t move.","The wall, the domain and the curve slid 3 units left together."],"explain":"Moving a vertical line up or down leaves it where it is, so `c` can’t move the wall. `d = -3` makes the inside `x - (-3) = x + 3`, which is 0 at `x = -3`: 3 units left. `x = 3` is the sign slip. `x = 1` adds the two shifts, as if `c` could move the wall too. `x = 4` lets `c` move it."},{"id":"p2","start":{"view":"t","b":2,"a":1,"k":1,"d":2,"c":0,"probe":4},"prompt":"`a` will change from 1 to −3. What will the domain be?","options":[{"t":"`{x ∈ ℝ | x > 2}`, unchanged","_n":"s5c3","_k":"423c36df"},{"t":"`{x ∈ ℝ | x > 6}`","_n":"t693","_k":"ee1d1288"},{"t":"`{x ∈ ℝ | x > -6}`","_n":"u683","_k":"7a361f6c"},{"t":"`{x ∈ ℝ | x \u003c 2}`","_n":"v673","_k":"b81c4a84"}],"banners":["Every point kept its `x`-coordinate. Domain: still `x > 2`."],"explain":"`a` multiplies the output, after the log is taken. It moves points up and down only, so the set of allowed `x`-values can’t change. A reflection in the `x`-axis flips the graph top to bottom, not left to right. The other options multiply the wall by 3 or by −3, as if the stretch acted on `x`."},{"id":"p3","start":{"view":"t","b":2,"a":1,"k":1,"d":1,"c":0,"probe":0},"prompt":"`k` will change from 1 to −1. What will happen to the graph?","options":[{"t":"It flips across the `y`-axis, and the wall moves to `x = -1`","_n":"w663","_k":"3cdb8960"},{"t":"It disappears, because a log of a negative number has no value","_n":"x6d3","_k":"f397db61"},{"t":"It flips across the `x`-axis, and the domain stays `x > 1`","_n":"y6c3","_k":"6e795187"},{"t":"It flips across the wall `x = 1`, and the domain becomes `x \u003c 1`","_n":"z6b3","_k":"5f619382"}],"banners":["The graph turned over the wall `x = 1`. Domain: now `x \u003c 1`."],"explain":"With `k = -1` the inside is `-(x - 1) = 1 - x`, which is positive when `x \u003c 1`. So the graph now lives left of the wall. In the mapping rule, `x/k + d` sends (2, 1) on `y = log_{2} x` to `(2/(-1) + 1, 1) = (-1, 1)`. The reflection in the `y`-axis happens first and the shift right 1 happens after, so the result looks like a mirror image across the wall itself. Flipping across the `x`-axis is `a`’s job. Negative values of `k` don’t make the graph vanish: they make the inside positive on the other side."},{"id":"p4","start":{"view":"s","b":2,"ks":1},"prompt":"`k` will change from 1 to 4, a horizontal compression by a factor of 1/4. The gap bars will measure how far the new curve is above `y = log_{2} x` at `x = 1`, 2, 4 and 8. What will the gaps be?","options":[{"t":"They shrink toward 0 as `x` grows","_n":"106a3","_k":"f70f5787"},{"t":"They grow as `x` grows","_n":"11613","_k":"0a19baba"},{"t":"All 4","_n":"12603","_k":"f354fb28"},{"t":"All 2","_n":"13e74","_k":"c4e4b381"}],"banners":["Same curve: `log_{2}(4x) = log_{2} x + 2`."],"explain":"Multiplying the inside by 4 is two doublings, and each doubling adds 1 to a base-2 log. So every point gains exactly 2, wherever it is: a horizontal compression by 1/4 is the same as a translation 2 units up. ‘All 4’ mixes up the factor with the shift. Growing gaps are what happens to `y = x^2`: turn on the comparison to see `(2x)^2` pull away from `x^2`. The gaps can’t shrink: the two curves never meet. (Module 41 shows why this works for any number, not just powers of the base.)"}],"chalIntro":"Set the explorer, then press \u003cstrong>Check challenge\u003c/strong>. Tapping a challenge shows its target on the graph. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Put the wall at `x = 3` with the domain on its \u003cstrong>left\u003c/strong>, and make the graph cross the `x`-axis at (2, 0).","why":"The wall `x = 3` needs `d = 3`, and only a negative `k` puts the domain on the left. With `k = -1` the inside at `x = 2` is 1 and `log_{b} 1 = 0`, so `c = 0` works with any `a` and any base, such as `y = log_{2}[-(x - 3)]`. Other settings trade `k` for `c`, such as `k = -2`, `c = -1` with `a = 1` in base 2.","general":"Put the wall at `x = 3` first, then choose the side, then the height at `x = 2`.","hints":["The wall is where the inside is 0. Which `d` puts it at `x = 3`?","`d = 3`. For the domain to be on the left, `k` must be negative. Try `k = -1`.","With `k = -1` the inside at `x = 2` is `-(2 - 3) = 1`, and `log_{b} 1 = 0`. So with `c = 0` the graph crosses at (2, 0): `y = log_{2}[-(x - 3)]` works, with any `a`."]},{"id":"tc2","goal":[3,6],"prompt":"Match the dashed target curve exactly. Its wall is `x = 1`, and three of its points are ringed: (0, −1), (−1, 1) and (−3, 3).","_a":"TEFQQAkLFEFWQQhQHxtTQQ1OA04RXRpZBk8QAREDFVJK","target":{"pts":[[0,-1],[-1,1],[-3,3]]},"why":"Matched. This curve has five different slider settings. Try `k = -2`: what must `c` become? (The Stretch or shift? view explains why.)","general":"Check the wall first, then the side, then match the marked points one at a time.","hints":["Where is the target’s wall, and which side of it does the curve live on?","Wall `x = 1`, domain `x \u003c 1`: `d = 1` and `k` negative (try `k = -1`). The marked points are 1, 2 and 4 units from the wall.","Distances 1, 2, 4 double each time, and the heights go −1, 1, 3: up 2 per doubling. In base 2 that’s `a = 2`. At distance 1 the log is 0, so `c = -1`: `y = 2 log_{2}[-(x - 1)] - 1`."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"The wall is fixed at `x = -2`. Make the curve pass through both marked points, (0, 1) and (6, −1). (While this challenge is selected, `d` is locked at −2.)","target":{"pts":[[0,1],[6,-1]],"lockD":-2},"why":"Guessing rarely works here. Between the two points the distance from the wall goes from 2 to 8, so the inside is multiplied by 4. In base 2 that adds `log_{2} 4 = 2` to the log, so the curve changes by `2a` between the points. `2a = -2` gives `a = -1`.","hints":["Measure how far each point is from the wall `x = -2`.","The distances are 2 and 8, so the inside is multiplied by 4 between the points. In base 2, that adds `log_{2} 4 = 2` to the log. So the curve changes by `2a`.","`2a = -1 - 1 = -2`, so `a = -1`. With `k = 1`: `-log_{2} 2 + c = 1`, so `c = 2`. `y = -log_{2}(x + 2) + 2`."]}],"chalFb":{"tc1":{"dm3":"Your wall is at `x = -3`. For a wall at `x = 3` the inside must be `k(x - 3)`, so `d = 3`.","aNeg":"A negative `a` flips the graph top to bottom, not left to right. Your domain is still `x > 3`. Only a negative `k` puts it on the left.","kPos":"Right wall, wrong side. With `k > 0` the inside `k(x - 3)` is positive only when `x > 3`. Make `k` negative.","miss":"Right wall and right side. At `x = 2` your graph is at {yv}, not 0. The inside there is `k(2 - 3) = -k`."},"tc2":{"kPos":"Your curve is the mirror image of the target: it lives right of its wall. The target lives left of `x = 1`, so `k` must be negative.","dm1":"Your wall is at `x = -1`. The target’s wall is `x = 1`.","aNeg":"Your curve rises toward the wall; the target falls toward it. Change the sign of `a`.","a1":"You pass through (0, −1), but at `x = -1` you’re at 0, not 1. The target climbs 2 each time the distance from the wall doubles, so `a = 2`.","base":"With base {b}, no `a` on the slider fits all three points. The marked points are 1, 2 and 4 units from the wall, and the heights rise by the same amount each time the distance doubles. Which base makes doubling add a whole number?"},"tc3":{"kNeg":"With `k \u003c 0` the domain is left of `x = -2`, so neither point can be on the graph.","aPos":"Your curve rises from left to right, but (6, −1) is lower than (0, 1). Make `a` negative.","a2":"Your curve drops 4 between the points. The inside is multiplied by 4 there (distances 2 and 8), which adds 2 to a base-2 log, so the drop is 2 × 2. You need a drop of 2.","base":"In base {b}, multiplying the inside by 4 adds {L} ≈ {v} to the log, so you’d need `a ≈` {av}, which isn’t on the slider. Try base 2.","other":"At `x = 0` your curve is at {y0}, and at `x = 6` it’s at {y6}."}}},"part3":{"slug":"mapping","name":"By hand","heading":"Wall, domain and key points by hand","intro":"Read the equation, place the wall, choose the side, then move three key points with the mapping rule. When your sketch agrees with itself, check it against the real graph.","checks":["`a`, `k`, `d` and `c`","Wall","Domain side","Key points","My points agree with my wall"],"ui":{"steps":["Read the parameters","Wall","Side","Map three key points","Draw my sketch"],"factorLab":"Factor first:","wallHow":"Tap the `x`-axis, or press \u003cstrong>Place wall\u003c/strong> and use the arrow keys. It snaps to steps of 0.5 and can be dragged.","sides":["Domain left of the wall","Domain right of the wall"],"pointsHow":"Each row moves a point of `y = log_{b} x`. Its image appears on the grid as soon as both boxes are filled.","sketchHow":"The tool joins your three points with a smooth curve (long dashes) and extends it toward the wall and away from it. It’s a drawing aid: it shows what your points say.","wrongSide":"Your point {pt} is {lr} of your wall `x =` {w}, but you chose the domain on the {side}.","onWall":"Your point {pt} sits on your wall `x =` {w}, where the log has no value.","sameX":"Two of your points have the same `x`-coordinate. A function has only one height at each `x`.","notMono":"A log graph always rises or always falls as you move away from its wall. Your heights go {hs} as the points get farther from the wall, so at least one point is wrong.","allRight":"All four lines are right. The true graph is drawn in blue over your sketch.","generic":{"params":"Compare the equation with `y = a log_{b}[k(x - d)] + c`. Check {list} again.","factor":"Multiply your factored form back out and compare it with the inside.","wall":"Your wall is at `x =` {w}. The wall is where the inside is 0.","side":"Test one `x`-value on each side of the wall: the inside must be positive.","point":"Check your image of {pt}. Use `(x/k + d, ay + c)` with the right `a`, `k`, `d` and `c`."}},"algGeneral":[["Why the wall is `x = d`","The inside `k(x - d)` is 0 at `x = d`, and `log_{b} 0` has no value, because `b^y` is never 0. Close to `x = d` the inside is a tiny positive number, so the log is a huge negative number: the graph plunges along the wall."],["Why the side depends on `k`","The inside must be positive: `k(x - d) > 0`. Divide by `k`. If `k > 0`, `x - d > 0`, so `x > d`. If `k \u003c 0`, dividing reverses the inequality: `x \u003c d`."],["Why the rule is `(x/k + d, ay + c)`","Take a point `(x, y)` on `y = log_{b} x`. On the new graph, the input `X` with `k(X - d) = x` gives the same log, `y`. Solving, `X = x/k + d`. The output is then `a · y + c`."],["Why a squeeze can be a shift","If `k = b^m`, then `k · x = b^m · b^{log_{b} x} = b^{m + log_{b} x}`, so `log_{b}(kx) = m + log_{b} x`. Example: `log_{2}(4x) = 2 + log_{2} x`. Only exponent laws are needed."]],"rounds":[{"id":"r1","goal":[2,3],"eq":"`y = 2 log_{2}(x - 3) + 1`","b":2,"_a":"TEFTQAkLFEFcQQhTHxtcQQ1QHkBQGwJSG0FBC1dcGlkVERBOEVBVBBVZaTkAFw1PGlJvTmgNFFJqT2lXHwplPko=","parents":[[0.5,-1],[1,0],[2,1]],"wrong":{"d":[{"v":-3,"fb":"`x - 3` is 0 at `x = 3`, not −3."}],"wall":[{"v":-3,"fb":"`x - 3` is 0 at `x = 3`, not −3."}],"pts":[{"i":1,"p":[4,2],"fb":"You added `c` before multiplying by `a`. The rule is `ay + c`: 2(0) + 1 = 1, not 2(0 + 1) = 2."},{"i":2,"p":[5,4],"fb":"You added `c` before multiplying by `a`. The rule is `ay + c`: 2(1) + 1 = 3, not 2(1 + 1) = 4."},{"i":0,"p":[3.5,0],"fb":"You added `c` before multiplying by `a`. The rule is `ay + c`: 2(−1) + 1 = −1, not 2(−1 + 1) = 0."},{"i":1,"p":[4,0],"fb":"The `y`-coordinate is `ay + c` = 2(0) + 1 = 1. Don’t forget `c`."},{"i":2,"p":[-1,3],"fb":"`x - 3` inside moves the graph 3 units right: add 3 to each `x`-coordinate."},{"i":0,"p":[-2.5,-1],"fb":"`x - 3` inside moves the graph 3 units right: add 3 to each `x`-coordinate."}]},"hints":["Compare `2 log_{2}(x - 3) + 1` with `a log_{b}[k(x - d)] + c`.","`a = 2`, `k = 1`, `d = 3`, `c = 1`. The wall is `x = 3`; with `k > 0` the domain is on the right. Each point moves to `(x + 3, 2y + 1)`.","(1/2, −1) → (7/2, −1); (1, 0) → (4, 1); (2, 1) → (5, 3)."],"alg":"At `x = 5`: `2 log_{2}(5 - 3) + 1 = 2 log_{2} 2 + 1 = 3` ✓. At `x = 7/2`: `2 log_{2}(1/2) + 1 = -2 + 1 = -1` ✓."},{"id":"r2","goal":[2,3],"eq":"`y = -log_{3}(x + 4) + 2`","b":3,"_a":"TEFTQAkUCU8VCBBYAhUaBxVZH1YfG1tBDVEeQEBQXAYVWRAQERUaCloEEFhoYhVQG1FvTmgUCU8GPh45BhUIPmoe","parents":[[1,0],[3,1],[9,2]],"wrong":{"d":[{"v":4,"fb":"`x + 4 = x - (-4)`: `d = -4`, so the wall is at `x = -4`."}],"wall":[{"v":4,"fb":"`x + 4 = x - (-4)`: `d = -4`, so the wall is at `x = -4`."}],"side":"`a = -1` flips the graph top to bottom only. The inside `x + 4` is positive when `x > -4`.","pts":[{"i":1,"p":[-1,-3],"fb":"That’s `-(y + 2)`. Multiply by `a` first, then add `c`: −1 + 2 = 1."},{"i":2,"p":[5,-4],"fb":"That’s `-(y + 2)`. Multiply by `a` first, then add `c`: −2 + 2 = 0."},{"i":2,"p":[5,4],"fb":"You left out the reflection: `a = -1` makes the `y`-coordinate `-y + 2`."},{"i":1,"p":[-1,3],"fb":"You left out the reflection: `a = -1` makes the `y`-coordinate `-y + 2`."},{"i":1,"p":[7,1],"fb":"`x + 4` inside moves the graph 4 units \u003cstrong>left\u003c/strong>: 3 − 4 = −1."}]},"hints":["Rewrite `x + 4` as `x - (-4)`, and read `a` from the sign in front of the log.","`a = -1`, `k = 1`, `d = -4`, `c = 2`. Each point moves to `(x - 4, -y + 2)`.","(1, 0) → (−3, 2); (3, 1) → (−1, 1); (9, 2) → (5, 0)."],"alg":"At `x = 5`: `-log_{3} 9 + 2 = -2 + 2 = 0` ✓, so (5, 0) is also the `x`-intercept. At `x = -1`: `-log_{3} 3 + 2 = 1` ✓."},{"id":"r3","goal":[2,3],"eq":"`y = log_{2}(6 - 2x) - 1`","b":2,"factor":{"lhs":"`6 - 2x =`"},"_a":"TEFTQAkIFEFcQQhPARUaBxVZAU4RWhpZGlIeQEBQXAYVWRAOERUaBRVZaU8BFQs+G0FbD1QbAjhsURxXHxQJPhs4AE4DZBQ4GlIeUG5kRQ==","parents":[[1,0],[2,1],[8,3]],"wrong":{"factor":[{"v":[2,3],"fb":"Multiply back out: `2(x - 3) = 2x - 6`, the opposite of `6 - 2x`. The factor is −2."},{"v":[-2,-3],"fb":"`-2(x + 3) = -2x - 6`. You need +6: `-2(x - 3) = -2x + 6`."}],"d":[{"v":6,"fb":"6 is the constant before factoring. `6 - 2x = -2(x - 3)`, so the wall is `x = 3`. Check: at `x = 3` the inside is 0."}],"wall":[{"v":6,"fb":"6 is the constant before factoring. `6 - 2x = -2(x - 3)`, so the wall is `x = 3`. Check: at `x = 3` the inside is 0."}],"side":"Test `x = 0`: 6 − 0 = 6 > 0, so 0 is in the domain, left of the wall. A negative `k` puts the domain on the left.","pts":[{"i":1,"p":[-1,0],"fb":"That multiplies by `k`: −2(2) + 3. The rule divides: 2/(−2) + 3 = 2."},{"i":2,"p":[-13,2],"fb":"That multiplies by `k`: −2(8) + 3. The rule divides: 8/(−2) + 3 = −1."},{"i":1,"p":[4,0],"fb":"Dividing by `k = -2` gives a negative number: 2/(−2) = −1, then + 3 = 2. Keep the sign of `k`."}]},"hints":["Factor the inside so it looks like `k(x - d)`. Take out −2.","`6 - 2x = -2(x - 3)`: `k = -2`, `d = 3`. Wall `x = 3`, and with `k \u003c 0` the domain is on the left. Each point moves to `(x/(-2) + 3, y - 1)`.","(1, 0) → (5/2, −1); (2, 1) → (2, 0); (8, 3) → (−1, 2)."],"alg":"Factor first: `6 - 2x = -2(x - 3)`. At `x = 2`: `log_{2}(6 - 4) - 1 = 1 - 1 = 0` ✓, so (2, 0) is the `x`-intercept. At `x = -1`: `log_{2} 8 - 1 = 2` ✓."}],"blocks":[{"title":"How to graph it by hand","html":"\u003cp>\u003cstrong>Graphing `y = a log_{b}[k(x - d)] + c` in five steps\u003c/strong>\u003c/p>\u003col>\u003cli>\u003cstrong>Factor\u003c/strong> the inside if needed, so it reads `k(x - d)`.\u003c/li>\u003cli>\u003cstrong>Wall:\u003c/strong> `x = d`.\u003c/li>\u003cli>\u003cstrong>Side:\u003c/strong> `k > 0`, the domain is right of the wall; `k \u003c 0`, left.\u003c/li>\u003cli>\u003cstrong>Points:\u003c/strong> move three key points of `y = log_{b} x` with `(x, y) -> (x/k + d, ay + c)`.\u003c/li>\u003cli>\u003cstrong>Draw:\u003c/strong> a curve through the points that hugs the wall (down along it if `a > 0`, up along it if `a \u003c 0`) and keeps going slowly the other way, with no horizontal asymptote.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Read it from the equation","summary":"Read it from the equation","items":[{"id":"q1","goal":2,"prompt":"What is the vertical asymptote of `y = log_{2}(3x - 12) + 5`?","choices":[{"t":"`x = 5`","fb":"The + 5 lifts the graph; it can’t move a vertical wall.","_n":"14e84","_k":"a96c3c76"},{"t":"`x = 12`","fb":"Factor first: `3x - 12 = 3(x - 4)`. At `x = 12` the inside is 24.","_n":"15e54","_k":"afb867fe"},{"t":"`x = 4`","fb":"Right. `3x - 12 = 3(x - 4)`, so the inside is 0 at `x = 4`.","_n":"16e64","_k":"b0e15c99"},{"t":"`x = -4`","fb":"`3(x - 4)` is 0 at `x = 4`, not −4.","_n":"17eb4","_k":"ab6b965f"}]},{"id":"q2","goal":2,"prompt":"What is the domain of `y = -2 log(5 - x)`?","choices":[{"t":"`{x ∈ ℝ | x \u003c 5}`","fb":"Right. `5 - x > 0` gives `x \u003c 5`. The −2 acts on the output, so it doesn’t change the domain.","_n":"18ec4","_k":"d3a0c76e"},{"t":"`{x ∈ ℝ | x > 5}`","fb":"Test `x = 0`: 5 − 0 = 5 > 0, so 0 is allowed. The domain is left of the wall.","_n":"19e94","_k":"2a61b6de"},{"t":"`{x ∈ ℝ | x > -5}`","fb":"`5 - x` is 0 at `x = 5`. Check `x = 6`: the inside is −1.","_n":"1aea4","_k":"e612256e"}]},{"id":"q3","goal":3,"prompt":"(4, 2) is on `y = log_{2} x`. Where does it land on `y = 3 log_{2}(x + 1) - 4`?","choices":[{"t":"(5, 2)","fb":"`x + 1` inside moves the graph 1 unit left: 4 − 1 = 3.","_n":"1bdf4","_k":"f6dc19e9"},{"t":"(3, 2)","fb":"Right. (4 − 1, 3(2) − 4) = (3, 2). Check: `3 log_{2} 4 - 4 = 2`.","_n":"1ce04","_k":"cdebcdee"},{"t":"(3, −6)","fb":"That’s 3(2 − 4). Multiply first, then subtract: 3(2) − 4 = 2.","_n":"1d6d4","_k":"44438ed7"},{"t":"(3, −2)","fb":"You left out the stretch: 3 × 2 = 6, then − 4.","_n":"1e6c4","_k":"420ae055"}]},{"id":"q4","goal":5,"prompt":"Is `y = log_{3}(9x)` the same graph as `y = log_{3} x + 2`?","choices":[{"t":"Yes","fb":"Right. `9 = 3^2`, so multiplying the inside by 9 adds 2 to a base-3 log. Check at `x = 3`: `log_{3} 27 = 3` and `log_{3} 3 + 2 = 3`.","_n":"1f6f4","_k":"32b83224"},{"t":"No: one is a compression and the other is a translation","fb":"Both descriptions are true of the same curve. Check `x = 1`: `log_{3} 9 = 2` and `log_{3} 1 + 2 = 2`. At `x = 3`: 3 and 3.","_n":"1g6e4","_k":"fce02d61"},{"t":"No: `log_{3}(9x) = 9 log_{3} x`","fb":"At `x = 3`, `9 log_{3} 3 = 9`, but `log_{3} 27 = 3`. A factor inside the log is not a factor outside.","_n":"1h694","_k":"990b278e"}]}]}},"practice":{"activities":[{"id":"sides","type":"sorter","title":"Which side of which wall?","summary":"Which side of which wall?","noun":"function","goal":[2,1],"instruction":"Sort each function into the box with its domain.","how":"Tap a function, then tap the box it belongs in.","boxes":[{"id":"b1","label":"`{x ∈ ℝ | x > 2}`","icon":"\u003csvg width=\"60\" height=\"30\" viewBox=\"0 0 60 30\" aria-hidden=\"true\">\u003crect x=\"44\" y=\"15\" width=\"14\" height=\"7\" fill=\"var(--hi)\" opacity=\".75\"/>\u003cpath d=\"M2 18.5H58\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\u003cpath d=\"M30 14V23\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\u003cpath d=\"M44 2V28\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"3 2.5\"/>\u003c/svg>"},{"id":"b2","label":"`{x ∈ ℝ | x \u003c 2}`","icon":"\u003csvg width=\"60\" height=\"30\" viewBox=\"0 0 60 30\" aria-hidden=\"true\">\u003crect x=\"2\" y=\"15\"
