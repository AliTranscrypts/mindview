.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 11: hero, division stepper (N22 synthetic grid + long-division twin), remainder shortcut, practice boxes, task */
.hero .hero-eq .eq-above{display:block;font:400 clamp(.95rem,2.2vw,1.2rem)/1.3 var(--font-ui);font-style:normal;color:var(--ink-2);margin-bottom:.4em;letter-spacing:0}
.hero .hero-eq.md{font-size:clamp(1.9rem,3.9vw,2.75rem)}
/* long division statements in feedback, prompts and steps must wrap on phones */
.fb .m,.pred-q .m,.hints .m,.sbtn .m,.task .m,.sq-p .m,.refresh .m,.cw .m,.face .m,.sc-line .m{white-space:normal}
.hero .hero-eq .m{white-space:normal}

/* ---------- stepper layout ---------- */
.ds{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.ds-main,.ds-side{min-width:0}
.ds-twins{display:flex;flex-wrap:wrap;gap:16px}
.ds-pane{flex:1 1 250px;min-width:0}
.ds-twins .p-syn{flex:0 1 auto}
.ds-h{font-size:.85rem;color:var(--ink-2);margin:0 0 6px;font-weight:700}
.p-graph{margin-top:16px}
.ds:not(.g-on) .p-graph{display:none}
.ds:not(.t-on) .p-long{display:none}
.ds-tabs,.ds-now-ph,.gr-off{display:none}
.ds-sub{margin:16px 0 6px}
.ds-side > .seg-wrap,.ds-side #ds-type .seg-wrap{margin-top:6px}
.ds-side .slider{margin:0 0 2px}
.ds-side .slider output{font-size:1.15rem}
.ds-deg{margin:0 0 4px;align-items:center}
.ds-divlab{font:400 1.15rem var(--font-math);margin:4px 0 2px}
.ds-step{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 6px;padding:8px;border:1.5px solid var(--rule);border-radius:8px}
.ds-step:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.ds-views{margin:10px 0 2px}
.ds-read{margin-top:14px}
.ds-read dd .m{white-space:normal}
.ds-twin-s{display:block;margin-top:4px;color:var(--ink-2);font-size:.94rem}
.ds-log{margin-top:18px}
.ds-lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;margin-bottom:8px}
.ds-lockbar p{margin:0}
.ds-lockbar:focus{outline:none}
.ds-pinbox{margin:10px 0}
.ds-pinlist{margin:8px 0 0;padding-left:1.1em}
.ds-pinlist li{margin:2px 0}
.ds-lr{margin:8px 0 0;align-items:center}
.chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.tc-setup{margin-left:6px;font-weight:700}
.ld-same{margin:6px 0 0;color:var(--ink)}

/* ---------- synthetic grid ---------- */
.sg-wrap{position:relative;overflow-x:auto;padding:2px 2px 4px}
table.sg{border-collapse:collapse;font-family:var(--font-math);font-size:1.18rem}
table.sg th,table.sg td{min-width:44px;height:2.3em;padding:2px 5px;text-align:center;vertical-align:middle}
table.sg thead th,table.sg thead td{font:700 .72rem var(--font-ui);color:var(--ink-2);height:auto;padding-bottom:4px}
table.sg thead th .m{font-size:1.05rem;font-weight:400;color:var(--ink-2)}
.sg-c{font-size:.66rem}
table.sg tbody th{min-width:54px;font-weight:400}
.sg-top th,.sg-mid th{border-right:2px solid var(--ink)}
.sg-mid td{border-bottom:2px solid var(--ink);color:var(--ink-2)}
.sg-bot td{font-weight:600}
.sg-box{display:inline-block;min-width:1.9em;padding:.05em .3em;border:2px solid var(--ink);border-radius:3px;background:var(--sheet)}
td.sg-rem.on{border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
td.ph{color:var(--ink-2)}
.sg-ph,.sg-tag,.sg-x{display:block;font:400 .64rem/1.15 var(--font-ui);color:var(--ink-2);white-space:nowrap}
.sg-tag{font-weight:700;color:var(--ink)}
.sg-tag .m{font-size:1.1em}
table.sg td.hl,table.ld td.hl{background:var(--hi-soft)}
table.sg td.same,table.ld td.same{outline:1.5px solid var(--ink);outline-offset:-3px;border-radius:4px}
.fresh{animation:sg-in .4s ease-out}
.sg-bot td.fresh[data-g="b0"]{animation:sg-down .3s ease-out}
@keyframes sg-in{from{opacity:0;transform:translateY(-6px)}}
@keyframes sg-down{from{opacity:.3;transform:translateY(-4.4em)}}
td.pulse{animation:sg-pulse .7s ease-in-out 2}
@keyframes sg-pulse{50%{background:var(--hi);color:var(--hi-ink)}}
.sg-svg{position:absolute;left:0;top:0;pointer-events:none;color:var(--ink-2);overflow:visible}
.sg-arrow{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:420;stroke-dashoffset:420;animation:sg-draw .45s ease-out forwards}
@keyframes sg-draw{to{stroke-dashoffset:0}}
.sg-in{width:3.3em;border:1.5px solid var(--ink-2);border-radius:5px;background:var(--sheet);padding:.15em .2em;font:400 1rem var(--font-math);text-align:center}
.sg-in:focus{border-color:var(--ink)}
.sg-in.bad,.bx-in.bad,.numin.bad{border-color:var(--red);background:var(--bad-bg)}
.sg-box .sg-in{border:0;width:2.8em;padding:0}
table.sg.sm{font-size:1rem}
table.sg.sm th,table.sg.sm td{min-width:40px;height:2em}

/* ---------- long-division twin ---------- */
table.ld{border-collapse:collapse;font-family:var(--font-math);font-size:1.05rem}
table.ld td{padding:3px 5px;text-align:left;white-space:nowrap;vertical-align:top;min-width:2.9em}
table.ld td.ld-l{text-align:right;padding-right:3px;min-width:0}
.ld-dvd td:not(.ld-l){border-top:2px solid var(--ink)}
.ld-par{display:inline-block;font-size:1.3em;line-height:.85;margin-left:2px;transform:scaleY(1.25)}
.ld-prod td:not(.ld-l):not(:empty){border-bottom:1.5px solid var(--ink)}
.ld-minus{color:var(--ink-2);font-weight:700}
.x-out > .m{text-decoration:line-through;opacity:.5}
.ld-flip{display:block;font:400 .75rem var(--font-math);color:var(--ink-2)}
.ld-flip .m{font-size:1em}
.ld-hidden{padding:34px 10px;text-align:center;border:1.5px dashed var(--rule);border-radius:8px}
table.ld .ph{color:var(--ink-2)}

/* squeeze */
.sq-stage .sq-after{display:none}
.sq-stage.b5 .sq-ld{display:none}
.sq-stage.b5 .sq-after{display:block;animation:sg-in .6s ease-out}
.sq-x{display:inline-block;transition:opacity .6s}
.sq-stage.b1 .sq-x{opacity:0}
.sq-one{display:none}
.sq-stage.b1 .sq-one{display:inline}
.sq-c{transition:opacity .6s}
.sq-stage.b2 .sq-lead .sq-c{text-decoration:line-through;opacity:.35}
.sq-stage .sq-drop{display:none}
.sq-stage.b3 .sq-drop{display:table-row}
.sq-drop td{border-top:2px solid var(--ink);font-weight:700}
.sq-stage.b3 .sq-q,.sq-stage.b3 .sq-first{outline:1.5px solid var(--ink);outline-offset:-2px;background:var(--hi-soft)}
.sq-stage.b3 .sq-first .sq-c{opacity:1;text-decoration:none}
.sq-stage.b4 [data-flip]{background:var(--hi-soft);border-radius:3px}
.sq-beat{font-weight:700;min-height:1.4em;margin:10px 0 4px;max-width:none}
.sq-cap{font-style:italic;max-width:none}
.sq-side{display:flex;flex-wrap:wrap;gap:16px}
.sq-side > div{min-width:0;overflow-x:auto}
.sq-notes{margin:10px 0;padding-left:1.3em;font-size:.95rem}
.sq-side .sq-drop{display:none}

/* ---------- Part 3 ---------- */
.sc .fchip.sc-st{font:700 .88rem var(--font-ui)}
.sc-sub{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.sc-line{margin:0 0 .25em;transition:opacity .4s;max-width:none}
.sc-line.hide,.sc-mini.hide{opacity:0}
.sc-mini{margin-top:10px;transition:opacity .4s;overflow-x:auto}
.sc-pics{margin-top:12px}
.ostep.sc-now{border-color:var(--pen);background:var(--hi-soft)}
.sc-eq{font-size:1.45rem}
.gauges{margin:12px 0 6px}
canvas.plot.gauge{aspect-ratio:2/1;max-width:320px}
.g-labs{display:flex;max-width:320px;text-align:center;font-size:.9rem;margin-top:4px}
.g-labs span{flex:1}
.g-labs b{font:600 1.25rem var(--font-math)}
.kpin-wrap{position:relative;height:1.7em;margin:-2px 0 6px}
.kpin{position:absolute;top:0;transform:translateX(-50%);font-size:.8rem;font-weight:700;white-space:nowrap;border-top:3px solid var(--ink);padding-top:2px}
.sc-fill{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.05rem;max-width:none}
.numin.sc-box{width:4.4em;padding:.25em .4em;font-size:1.05rem}

/* ---------- practice boxes ---------- */
.bx-in{width:3.6em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);padding:.25em .3em;font:400 1.05rem var(--font-math);text-align:center}
.bx-in:focus{border-color:var(--ink)}
.bx-in:disabled{opacity:.85}
.bx-row{display:flex;flex-wrap:wrap;gap:12px 22px;margin:8px 0}
.bx-lab{display:flex;align-items:center;gap:6px;font-weight:700}
.bx-frame{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:1.1rem;max-width:none}
.tbl-scroll{overflow-x:auto;max-width:100%;padding:2px 0}
.dv-adj{margin-top:10px;max-width:none;line-height:2.6}
.dv-adj .bx-in{margin:0 3px}
table.ld.dv-ld td.ld-rule{border-top:1.5px solid var(--ink)}
table.ld.dv-ld td{vertical-align:middle}
.bx-item .sg-box .bx-in{border:0;width:2.8em;padding:0}

/* ---------- task ---------- */
.tk-eq{font-size:1.4rem}
.tk-row label{display:grid;gap:4px}
.tk-box{display:inline-flex;align-items:center;gap:4px}
.inrow .tk-box input{width:4.4rem}
.tk-box .btn{min-width:38px;justify-content:center;padding:.3em .55em;font-size:1.05rem}

/* ---------- phone ---------- */
@media (max-width:820px){ .ds{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){
  .ds-tabs{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin:0 0 10px}
  .ds-tabs button{flex:1;border:0;background:var(--sheet);padding:.45em .5em;font-weight:700;min-height:36px}
  .ds-tabs button + button{border-left:1.5px solid var(--ink)}
  .ds-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
  .ds-now-ph{display:block;font-size:.95rem;min-height:2.6em;margin:0 0 8px;padding:6px 10px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;max-width:none}
  .ds-now-ph .m{white-space:normal}
  .ds-h{display:none}
  .ds[data-tab="syn"] .p-long,.ds[data-tab="syn"] .p-graph,.ds[data-tab="long"] .p-syn,.ds[data-tab="long"] .p-graph,.ds[data-tab="graph"] .p-syn,.ds[data-tab="graph"] .p-long{display:none}
  .ds[data-tab="graph"] .p-graph,.ds[data-tab="long"] .p-long{display:block}
  .ds:not(.g-on) .gr-off{display:block}
  .ds:not(.g-on) .p-graph .plot-wrap,.ds:not(.g-on) .ds-lr{display:none}
  .ds:not(.t-on) .p-long > div{display:none}
  .ds:not(.t-on) .p-long::after{content:"The long-division twin is off. Turn it on with the Long-division twin button.";display:block;font-size:.9rem;color:var(--ink-2)}
  table.ld{font-size:.9rem}
  table.ld td{min-width:2.3em;padding:3px 3px}
  table.sg{font-size:1.08rem}
  .bx-in{width:2.9em;font-size:1rem;padding:.2em .15em}
  .bx-item table.sg th,.bx-item table.sg td{min-width:0;padding:2px 2px}
  .bx-item table.sg .bx-in{width:2.6em}
  .bx-item .sg-box .bx-in{width:2.4em}
  .sq-side > div{flex:1 1 100%}
}

</style>
</head>
<body>
