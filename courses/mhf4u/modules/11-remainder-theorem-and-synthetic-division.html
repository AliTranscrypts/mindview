:"31","slug":"graphing-the-six-trig-functions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"0c69bd57","content":{"id":"11-remainder-theorem-and-synthetic-division","kind":"topic","title":"Remainder theorem and synthetic division","topic":"Remainder Theorem and Synthetic Division","readyTopic":"dividing polynomials","hero":{"eq":"\u003cspan class=\"eq-above\">dividend = divisor × quotient + remainder\u003c/span>`P(x) = (x - b) Q(x) + R`","eqSize":"md","eqLabel":"Dividend equals divisor times quotient plus remainder: P of x equals x minus b, times Q of x, plus R.","headline":"Where is the remainder hiding?","text":"When you divide a polynomial `P(x)`, the \u003cstrong>dividend\u003c/strong>, by a binomial such as `x - 3`, the \u003cstrong>divisor\u003c/strong>, you get a \u003cstrong>quotient\u003c/strong> and a \u003cstrong>remainder\u003c/strong>. \u003cstrong>Long division\u003c/strong> does this with every term written out. \u003cstrong>Synthetic division\u003c/strong> does the same work with only the numbers. And the \u003cstrong>remainder theorem\u003c/strong> gives a shortcut that finds the remainder without dividing at all. The graph holds the clue; you’ll find it in Explore.","fig":{"aria":"Synthetic division of P of x by x minus 3 with remainder 4, and the graph of y = P(x) with a framed marker at x = 3"}},"goals":["I can divide a polynomial by a binomial using long division, and write the result as `P(x) = `(divisor)(quotient) + remainder.","I can divide a polynomial by `x - b` using synthetic division, including when terms are missing.","I can divide by a binomial of the form `ax - b`, and adjust the quotient correctly.","I can use the remainder theorem to find a remainder without dividing, and explain why it works.","I can find unknown coefficients in a polynomial from information about its remainders.","I can use polynomial division to solve problems, such as finding a missing dimension or describing an expression’s value for large `x`."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Dividing whole numbers","goal":1,"prompt":"What are the quotient and remainder when 437 is divided by 12?","options":[{"t":"35, remainder 17","why":"A remainder of 17 is bigger than the divisor 12, so 12 fits at least once more: 36, remainder 5.","_n":"02c3","_k":"2b8090bd"},{"t":"36, remainder 5","why":"12 × 36 = 432, and 437 − 432 = 5. The remainder 5 is less than 12, so the division is finished.","_n":"12b3","_k":"6847c766"},{"t":"5, remainder 36","why":"The quotient is how many 12s fit (36); the remainder is what’s left (5).","_n":"22a3","_k":"3aaaf99d"},{"t":"36, remainder 7","why":"7 is what’s left after the first step (43 − 36). Bring down the next digit and keep going: 77 − 72 = 5. Check: 12 × 36 + 7 = 439, not 437.","_n":"3293","_k":"96ec3a88"}],"hints":["How many 12s fit into 437? Try 12 × 30 first.","12 × 36 = 432 and 12 × 37 = 444, which is too big.","437 − 432 = 5, so the quotient is 36 and the remainder is 5."]},{"id":"w2","skill":"Dividing whole numbers","goal":1,"prompt":"Which statement checks that 437 ÷ 12 is 36 with remainder 5?","options":[{"t":"437 = (12 + 5) × 36","why":"17 × 36 = 612. The remainder is added once, at the end.","_n":"4283","_k":"70591cf6"},{"t":"437 = 12 × (36 + 5)","why":"12 × 41 = 492. The remainder isn’t another group of 12.","_n":"5273","_k":"7ecdcd80"},{"t":"437 = 12 × 36 + 5","why":"Dividend = divisor × quotient + remainder. 432 + 5 = 437.","_n":"6263","_k":"ffdd2d15"},{"t":"437 = 12 × 36 − 5","why":"12 × 36 − 5 = 427. The remainder is left over, so it’s added back.","_n":"7353","_k":"b3c02997"}],"hints":["Think of the division backwards: how do you rebuild 437 from 12, 36 and 5?","36 groups of 12, plus the 5 left over.","437 = 12 × 36 + 5: 432 + 5 = 437."]},{"id":"w3","skill":"Polynomial arithmetic","goal":1,"prompt":"Expand `(x - 3)(2x^2 + x - 1)`.","options":[{"t":"`2x^3 - 5x^2 - 4x - 3`","why":"(−3)(−1) = +3, not −3.","_n":"8343","_k":"579b10d1"},{"t":"`2x^3 - 5x^2 - 4x + 3`","why":"`x(2x^2 + x - 1) = 2x^3 + x^2 - x`, and `-3(2x^2 + x - 1) = -6x^2 - 3x + 3`. Adding: `2x^3 - 5x^2 - 4x + 3`.","_n":"9001","_k":"fee4766c"},{"t":"`2x^3 + 7x^2 + 2x - 3`","why":"Those are the products with +3. Here the second term is −3.","_n":"a011","_k":"97ebafea"},{"t":"`2x^3 + 3`","why":"Every term in the first bracket multiplies every term in the second: six products, then collect like terms.","_n":"bfe1","_k":"4bb4c00f"}],"hints":["Multiply each term of `2x^2 + x - 1` by `x`, then by −3.","`x(2x^2 + x - 1) = 2x^3 + x^2 - x`; `-3(2x^2 + x - 1) = -6x^2 - 3x + 3`.","Collect: `2x^3 + (1 - 6)x^2 + (-1 - 3)x + 3 = 2x^3 - 5x^2 - 4x + 3`."]},{"id":"w4","skill":"Polynomial arithmetic","goal":1,"prompt":"Simplify `(3x^3 - 2x^2) - (3x^3 - 7x^2)`.","options":[{"t":"`-9x^2`","why":"`-(3x^3 - 7x^2) = -3x^3` \u003cstrong>+\u003c/strong> `7x^2`. So `-2x^2 + 7x^2 = 5x^2`.","_n":"cff1","_k":"953c314d"},{"t":"`-5x^2`","why":"That’s `(3x^3 - 7x^2) - (3x^3 - 2x^2)`. Keep the order: first bracket minus second.","_n":"d041","_k":"05166682"},{"t":"`6x^3 - 9x^2`","why":"The brackets are subtracted, so the `x^3` terms cancel.","_n":"e051","_k":"3690a30a"},{"t":"`5x^2`","why":"The minus sign changes both signs in the second bracket: `3x^3 - 2x^2 - 3x^3 + 7x^2 = 5x^2`.","_n":"f021","_k":"7622e441"}],"hints":["Distribute the minus sign to \u003cstrong>every\u003c/strong> term in the second bracket.","`3x^3 - 2x^2 - 3x^3 + 7x^2`.","The `x^3` terms cancel, and `-2x^2 + 7x^2 = 5x^2`."]},{"id":"w5","skill":"Evaluating polynomials","goal":4,"prompt":"`P(x) = 2x^3 + x^2 - 3x + 1`. What is `P(-2)`?","options":[{"t":"−17","why":"A negative times a negative is positive: `-3(-2) = +6`.","_n":"g031","_k":"845d5ab6"},{"t":"−13","why":"`(-2)^2 = (-2)(-2) = +4`.","_n":"h081","_k":"2227ac52"},{"t":"−5","why":"`2(-8) + 4 - 3(-2) + 1 = -16 + 4 + 6 + 1 = -5`.","_n":"i091","_k":"682fa5dd"},{"t":"15","why":"15 is `P(2)`. Substitute −2, in brackets, everywhere.","_n":"j9a1","_k":"baed86d2"}],"hints":["Put −2 in brackets everywhere you see `x`.","`(-2)^3 = -8` and `(-2)^2 = 4`.","`2(-8) + 4 - 3(-2) + 1 = -16 + 4 + 6 + 1 = -5`."]},{"id":"w6","skill":"Evaluating polynomials","goal":4,"prompt":"`P(x) = 4x^3 - 2x + 1`. What is `P(1/2)`?","options":[{"t":"`1/2`","why":"`(1/2)^3 = 1/8`, so `4(1/8) - 2(1/2) + 1 = 1/2 - 1 + 1 = 1/2`.","_n":"k991","_k":"2841a828"},{"t":"`2/3`","why":"`(1/2)^3 = (1 × 1 × 1)/(2 × 2 × 2) = 1/8`. Cubing multiplies, it doesn’t multiply by 3.","_n":"l981","_k":"280b26c1"},{"t":"8","why":"Powers come before multiplication: `4(1/2)^3 = 4 × 1/8`, not `(4 × 1/2)^3`.","_n":"m971","_k":"58ed4027"},{"t":"29","why":"29 is `P(2)`. The input here is `1/2`.","_n":"n961","_k":"e79f8a99"}],"hints":["Start with the power: what is `(1/2)^3`?","`(1/2)^3 = 1/8`, so the first term is `4 × 1/8 = 1/2`.","`1/2 - 2(1/2) + 1 = 1/2 - 1 + 1 = 1/2`."]}],"refreshers":{"Dividing whole numbers":"Dividing 437 by 12 asks how many 12s fit (the quotient, 36) and what’s left over (the remainder, 5). The remainder must be less than the divisor. You can always check: dividend = divisor × quotient + remainder, so 437 = 12 × 36 + 5. Polynomial division works the same way: `P(x) = `(divisor)(quotient) + remainder.","Polynomial arithmetic":"To multiply, multiply every term in one bracket by every term in the other, then collect like terms: `(x - 3)(2x^2 + x - 1) = 2x^3 - 5x^2 - 4x + 3`. To subtract a bracket, change the sign of \u003cstrong>every\u003c/strong> term inside it: `(3x^3 - 2x^2) - (3x^3 - 7x^2) = 3x^3 - 2x^2 - 3x^3 + 7x^2 = 5x^2`. Long division uses both moves at every step.","Evaluating polynomials":"Put the input in brackets everywhere you see `x`, do the powers first, then multiply, then add. For `P(x) = 2x^3 + x^2 - 3x + 1`: `P(-2) = 2(-8) + (4) - 3(-2) + 1 = -5`. Watch the signs: `(-2)^2 = +4` and `(-2)^3 = -8`. With a fraction: `(1/2)^3 = 1/8`."}}},"explore":{"heading":"Division stepper","intro":"Divide one polynomial by another, one move at a time. Synthetic division runs on the left and its long-division twin on the right, so you can see that every number matches. Then switch on the graph.","predictions":[{"id":"p1","start":{"coef":[2,-5,-4,7],"type":"xb","a":1,"b":3,"pos":2,"graph":false},"prompt":"Long division is about to subtract: `(2x^3 - 5x^2) - (2x^3 - 6x^2)`. What will it leave?","options":[{"t":"0","_n":"o951","_k":"03c2607b"},{"t":"`x^2`","_n":"p941","_k":"49bf7f86"},{"t":"`-11x^2`","_n":"q931","_k":"67fc7aff"},{"t":"`-x^2`","_n":"r921","_k":"be5beb91"}],"explain":"Subtracting `-6x^2` is the same as adding `6x^2`, so `-5x^2 + 6x^2 = x^2`. Synthetic division multiplies by the zero, +3, instead of −3, so its product is already +6 and it just adds: −5 + 6 = 1. Same number, two routes.\u003cbr>\u003cspan class=\"tiny\">Why the others are tempting: `-11x^2` changes the sign of `2x^3` but not of `-6x^2`; `-x^2` subtracts in the wrong order; 0 assumes every term cancels, but only the leading terms always do.\u003c/span>"},{"id":"p2","start":{"coef":[2,-5,-4,7],"type":"xb","a":1,"b":3,"pos":"end","graph":false},"prompt":"The remainder is 4. Now the graph of `y = P(x)` will appear, with a marker at `x = 3`. How high is the graph at `x = 3`?","options":[{"t":"−4","_n":"s911","_k":"bc79770b"},{"t":"0","_n":"t941","_k":"c3b6e61d"},{"t":"4","_n":"u951","_k":"2624d216"},{"t":"7","_n":"v961","_k":"02460e01"}],"explain":"The division statement says `P(x) = (x - 3)(2x^2 + x - 1) + 4`. At `x = 3` the first part is 0 × (…) = 0, so `P(3) = 4`. The remainder is the height of the graph at the divisor’s zero.\u003cbr>\u003cspan class=\"tiny\">Why the others are tempting: 0 mixes up the divisor’s zero with a zero of `P`; 7 is `P(0)`, the `y`-intercept; −4 flips the sign of the remainder.\u003c/span>"},{"id":"p3","start":{"coef":[2,-5,-4,7],"type":"xb","a":1,"b":3,"pos":"end","graph":true},"prompt":"The divisor will change from `x - 3` to `x + 1`. What will the new remainder be?","options":[{"t":"−4","_n":"w971","_k":"5e2a381d"},{"t":"0","_n":"x901","_k":"a0b205dd"},{"t":"4","_n":"y911","_k":"9bb95e6e"},{"t":"14","_n":"z921","_k":"84437e39"}],"explain":"`P(-1) = -2 - 5 + 4 + 7 = 4`. A different divisor, the same remainder: the graph is at height 4 at both `x = 3` and `x = -1`. The line `y = 4` meets the graph once more. Keep that third point in mind.\u003cbr>\u003cspan class=\"tiny\">Why the others are tempting: 0 is `P(1)`, which uses +1 instead of −1; −4 assumes flipping the divisor’s sign flips the remainder; 14 treats `(-1)^2` as −1.\u003c/span>"},{"id":"p4","start":{"coef":[2,-5,-4,7],"type":"axb","a":2,"b":1,"pos":7,"graph":true,"twinHidden":true},"prompt":"Synthetic division with `1/2` gives 2 | −4 | −6 | 4. Long division by `2x - 1` is about to run. What quotient and remainder will it give?","options":[{"t":"`x^2 - 2x - 3`, remainder 4","_n":"10931","_k":"4503cafc"},{"t":"`4x^2 - 8x - 12`, remainder 8","_n":"118c1","_k":"8367d621"},{"t":"`2x^2 - 4x - 6`, remainder 4","_n":"128d1","_k":"d0d2ac15"},{"t":"`x^2 - 2x - 3`, remainder 2","_n":"138e1","_k":"ffa3a0fd"}],"explain":"`x - 1/2` is half of `2x - 1`. So `P(x) = (x - 1/2)(2x^2 - 4x - 6) + 4 = (2x - 1)(x^2 - 2x - 3) + 4`. Halve the quotient, keep the remainder. And the remainder is still the height at the zero: `P(1/2) = 4`, which explains P3’s third point.\u003cbr>\u003cspan class=\"tiny\">Why the others are tempting: `2x^2 - 4x - 6` forgets to divide the quotient; remainder 2 divides the remainder too; doubling everything multiplies instead of dividing.\u003c/span>"}],"chalIntro":"Set up the stepper, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"Divide `x^3 - 6x + 4` by `x + 2`. Set up the stepper, then run the division to the end (Watch or You divide).","why":"Quotient `x^2 - 2x - 2`, remainder 8. Check: `P(-2) = -8 + 12 + 4 = 8`.","hints":["Which powers of `x` does `x^3 - 6x + 4` have? Which one is missing?","Use degree 3 with coefficients 1, 0, −6, 4. The divisor `x + 2` has zero −2.","Set the dividend to 1, 0, −6, 4 and `b` to −2, then press Play. Bottom row 1, −2, −2 | 8: quotient `x^2 - 2x - 2`, remainder 8."]},{"id":"tc2","goal":[2,5],"prompt":"Work backwards. The divisor is locked at `x - 2`. Set the dividend’s coefficients so that the quotient is `x^2 - x + 2` and the remainder is 3. \u003cbutton type=\"button\" class=\"btn ghost sm tc-setup\" data-setup=\"tc2\">Lock the divisor at \u003cspan class=\"m\">\u003ci>x\u003c/i> − 2\u003c/span>\u003c/button>","why":"`P(x) = x^3 - 3x^2 + 4x - 1`: the bottom row reads 1 | −1 | 2 | 3. It’s the only answer, because the division statement fixes `P`.","hints":["Work backwards: in each column, top number + product = bottom number. So top number = bottom number − product.","Or use the division statement: `P(x) = (x - 2)(x^2 - x + 2) + 3`. Expand it.","`(x - 2)(x^2 - x + 2) = x^3 - 3x^2 + 4x - 4`. Add 3: `P(x) = x^3 - 3x^2 + 4x - 1`. Set the sliders to 1, −3, 4, −1."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"The dividend is locked at `P(x) = 2x^3 - x^2 - 5x + 1`. Find \u003cstrong>three divisors with different zeros\u003c/strong> that each leave remainder \u003cstrong>3\u003c/strong>. Set a divisor, press \u003cstrong>Pin this divisor\u003c/strong>, and repeat. Then press \u003cstrong>Check challenge\u003c/strong>. (Both divisor types are allowed; graph view and the line `y = R` are available.) \u003cbutton type=\"button\" class=\"btn ghost sm tc-setup\" data-setup=\"tc3\">Lock the dividend\u003c/button>","why":"The zeros −1, −1/2 and 2 are the three places where the line `y = 3` meets the graph: `P(x) = (x - 2)(2x + 1)(x + 1) + 3`. The expected answer is `x + 1`, `x - 2` and `2x + 1`.","hints":["A remainder of 3 means the graph of `y = P(x)` is at height 3 at the divisor’s zero. Set any divisor, turn on ‘Line `y = R`’, and look where the line `y = 3` meets the curve.","`x - 2` works. Its division statement tells you more: `P(x) = (x - 2)(2x^2 + 3x + 1) + 3`. Where else is `(x - 2)(2x^2 + 3x + 1)` equal to 0?","`2x^2 + 3x + 1 = (2x + 1)(x + 1)`, so `P(x) = (x - 2)(2x + 1)(x + 1) + 3`. The product is 0 at `x = 2`, `-1/2` and −1. The divisors are `x - 2`, `2x + 1` and `x + 1`."]}],"msgs":{"tc1":{"deg2":"You’ve set up `x^2 - 6x + 4`. `x^3 - 6x + 4` is a cubic with no `x^2` term, so it needs degree 3 with a 0 for `x^2`.","b2":"Your divisor is `x - 2`. Set it to `x + 2`: its zero is −2. (With `x - 2` the remainder happens to be 0, which is why it looked neat.)","both":"Two fixes: the dividend needs a 0 for its missing `x^2` term, and the divisor should be `x + 2`.","run":"Run the division to the last column first.","other":"Compare your dividend and divisor with `x^3 - 6x + 4` and `x + 2`."},"tc2":{"plus":"That’s `(x + 2)(x^2 - x + 2) + 3`: you added 2 × (the previous bottom number) to reverse each step. Synthetic division added going forward, so going backwards you subtract.","zero":"Your quotient is right, but the remainder is 0. Add 3 to the constant term.","quot":"Your quotient is right. Only the constant term changes the remainder, and it changes it by the same amount: move the constant by (3 − current remainder).","lead":"The first bottom number is always the leading coefficient. The quotient starts with `1x^2`, so the leading coefficient is 1.","other":"Work from the left: each top number is the bottom number minus the product written under it.","lock":"Press \u003cstrong>Lock the divisor at `x - 2`\u003c/strong> first, then set the dividend."},"tc3":{"same":"These two divisors have the same zero, {z}, so they test the same point on the graph. Find a different zero.","half":"`2x - 1` has zero +1/2, and `P(1/2) = -3/2`. The third point is left of the `y`-axis: try `2x + 1`.","one":"`x - 1` has zero 1, and `P(1) = -3`: the right size, but below the axis. The point at height 3 is at `x = -1`, so its divisor is `x + 1`.","two":"`x + 2` leaves `P(-2) = -9`.","few":"Pin three divisors first.","other":"Each remainder must be 3. Turn on the line `y = R`: every place it meets the graph gives a zero that works.","lock":"Press \u003cstrong>Lock the dividend\u003c/strong> first, then pin three divisors."}},"youDivide":{"bring":"Bring the leading coefficient straight down: nothing is added in the first column.","top":"Multiply the number in the \u003cstrong>bottom\u003c/strong> row, not the top.","adjust":[{"t":"Divide the quotient numbers by `a`","fb":"`ax - b = a(x - b/a)`, so the quotient for `ax - b` is `1/a` of the one for `x - b/a`. The remainder is unchanged.","_n":"148d1","_k":"ee386b2c"},{"t":"Divide every number, including the remainder, by `a`","fb":"The remainder doesn’t change: it’s still `P(b/a)`. Only the quotient is shared out.","_n":"15901","_k":"b915bb31"},{"t":"Leave the bottom row as it is","fb":"That’s the quotient for `x - b/a`. The divisor `ax - b` is `a` times bigger, so the quotient is `a` times smaller.","_n":"168f1","_k":"18ea7a1f"}],"readRight":"The bottom row gives the quotient’s coefficients, starting one degree lower than `P`, and then the remainder.","readDeg":"The quotient starts one degree lower than the dividend: dividing a cubic by a linear divisor gives a quadratic.","readTerm":"The last number is the remainder, not the constant term of the quotient.","readSign":"The remainder is the last bottom number exactly as it stands. Nothing has its sign flipped back at the end."},"squeezeCaption":"Same numbers, fewer marks. Using +3 instead of −3 turns every subtraction into an addition."},"part3":{"slug":"shortcut","name":"Shortcut","heading":"The remainder shortcut","intro":"You’ve seen that the remainder is the height of the graph at the divisor’s zero. Now use that to find remainders without dividing, see why it always works, and tune a polynomial so two remainders match.","radar":{"cards":[{"id":"r1","a":1,"b":2,"_a":"HVI=","lines":["`x - 2 = 0` when `x = 2`.","`P(2) = (2)^3 - 2(2)^2 - 3(2) + 5`","`= 8 - 8 - 6 + 5`","`= -1`"],"wrong":[{"v":-5,"fb":"That’s `P(-2)`. `x - 2 = 0` when `x = 2`."}],"hints":["Solve `x - 2 = 0`. That’s the input.","`x = 2`. Now `(2)^3 = 8` and `(2)^2 = 4`.","`P(2) = 8 - 2(4) - 3(2) + 5 = 8 - 8 - 6 + 5 = -1`."]},{"id":"r2","a":1,"b":-1,"_a":"BQ==","lines":["`x + 1 = 0` when `x = -1`.","`P(-1) = (-1)^3 - 2(-1)^2 - 3(-1) + 5`","`= -1 - 2 + 3 + 5`","`= 5`"],"wrong":[{"v":1,"fb":"That’s `P(1)`. `x + 1 = 0` when `x = -1`."},{"v":9,"fb":"`(-1)^2 = +1`, so `-2(-1)^2 = -2`."}],"hints":["Solve `x + 1 = 0`. That’s the input.","`x = -1`. Now `(-1)^3 = -1` and `(-1)^2 = 1`.","`P(-1) = -1 - 2(1) - 3(-1) + 5 = -1 - 2 + 3 + 5 = 5`."]},{"id":"r3","a":2,"b":-3,"_a":"AU0AC1c=","lines":["`2x + 3 = 0` when `x = -3/2`.","`P(-3/2) = (-3/2)^3 - 2(-3/2)^2 - 3(-3/2) + 5`","`= -27/8 - 9/2 + 9/2 + 5`","`= 13/8`"],"wrong":[{"v":-0.625,"fb":"That’s `P(3/2)`. Solve `2x + 3 = 0`: `x = -3/2`."},{"v":-31,"fb":"That’s `P(-3)`. The zero of `2x + 3` is `-3/2`, not −3."},{"v":5.814814814814815,"fb":"That’s `P(-2/3)`, the fraction upside down."}],"hints":["Solve `2x + 3 = 0`. That’s the input.","`x = -3/2`. Now `(-3/2)^3 = -27/8` and `(-3/2)^2 = 9/4`.","`P(-3/2) = -27/8 - 2(9/4) - 3(-3/2) + 5 = -27/8 - 9/2 + 9/2 + 5 = -27/8 + 40/8 = 13/8`."]}],"prompt":"Predict the remainder when `P(x)` is divided by {d}. Enter it, then press \u003cstrong>Reveal\u003c/strong>."},"proof":{"instruction":"These steps prove the remainder theorem for a divisor `x - b`. Put them in order. Tap a step, then use Move up and Move down.","steps":["Divide `P(x)` by `x - b`. Call the quotient `Q(x)` and the remainder `R`, a number.","So `P(x) = (x - b)Q(x) + R`, and this is true for every value of `x`.","Substitute `x = b`: `P(b) = (b - b)Q(b) + R`.","`b - b = 0`, and `0 × Q(b) = 0`.","So `P(b) = R`: the remainder is `P(b)`."],"start":[2,0,4,1,3],"fb":{"s2first":"Step 2 names `Q(x)` and `R`. Which step says where they come from?","s3before2":"You can only substitute into an equation once you’ve written it. What equation is step 3 substituting into?","s4before3":"Where does `b - b` come from? It appears only after substituting `x = b`.","s5before4":"That’s the conclusion. Which step gives the reason it’s true?"},"hints":["Start with the division itself, then write what it means.","The division statement comes before the substitution, and the substitution comes before simplifying.","Order: divide; write `P(x) = (x - b)Q(x) + R`; substitute `x = b`; `b - b = 0`; so `P(b) = R`."],"pics":["The teal curve is `y = P(x) - R = (x - 2)Q(x)`: the blue curve shifted up by 1.","Substitute `x = 2`: a marker at `x = 2`.","`(2 - 2)Q(2) = 0`: the teal curve passes through (2, 0).","`P(2) = R = -1`: the blue curve is at height −1 there."],"ax":{"prompt":"If `P(x) = (ax - b)Q(x) + R`, which value of `x` makes the first part 0?","chips":[{"t":"`b/a`","fb":"✓ `a(b/a) - b = b - b = 0`, so `P(b/a) = R`.","_n":"17921","_k":"a7ab29fa"},{"t":"`b`","fb":"`ab - b = b(a - 1)`, which isn’t 0 unless `a = 1` (or `b = 0`).","_n":"18911","_k":"7d3b1a91"},{"t":"`-b/a`","fb":"`a(-b/a) - b = -2b`, which isn’t 0 unless `b = 0`.","_n":"19941","_k":"939671f1"},{"t":"`a/b`","fb":"`a(a/b) - b` is 0 only by coincidence.","_n":"1a931","_k":"83c50ace"}]}},"match":{"instruction":"Slide `k` until the two remainders match, then press \u003cstrong>Lock in\u003c/strong>.","rounds":[{"id":"m1","c":[1,null,-4,1],"z":[2,-1],"div":["`x - 2`","`x + 1`"],"right":"✓ `k = 1`: `P(2) = 8 + 4 - 8 + 1 = 5` and `P(-1) = -1 + 1 + 4 + 1 = 5`.","note":"Moving `k` by 1 changes `R_1 = P(2)` by 4 and `R_2 = P(-1)` by 1, so the left gauge moves four times as fast."},{"id":"m2","c":[1,null,-5,1],"z":[1,2],"div":["`x - 1`","`x - 2`"],"hints":["Write each remainder as an expression in `k` by substituting the divisor’s zero.","`P(1) = 1 + k - 5 + 1 = k - 3` and `P(2) = 8 + 4k - 10 + 1 = 4k - 1`.","`k - 3 = 4k - 1`, so `-3k = 2` and `k = -2/3`."],"exact":{"_a":"S0FVCEBeBBsSCAcbWEkGGxIABBtYUBkVW1EUA09VGRVbFRQDT1QbAQZVAA9UUgMBBlUAD1RSA0o=","wrong":[{"box":"c2","v":2,"fb":"`k` multiplies `x^2`, and at `x = 2` that’s 4, not 2."},{"box":"k2","v":19,"fb":"`-5(2) = -10`, not +10, so the constant part is 8 − 10 + 1 = −1."},{"box":"kv","v":0.6666666666666666,"fb":"Check the sign: `k - 3 = 4k - 1` gives `-3k = 2`, so `k = -2/3`."}],"solved":"The slider moves in steps of 0.25, so it can only get close. Algebra gets `k` exactly: `-2/3`."}}],"wrongLock":"Not equal yet: `R_1` = {r1}, `R_2` = {r2}."},"blocks":[{"title":"What the shortcut means","html":"\u003cp>\u003cstrong>The remainder theorem\u003c/strong>\u003c/p>\u003cul>\u003cli>When `P(x)` is divided by `x - b`, the remainder is `P(b)`. When it’s divided by `ax - b`, the remainder is `P(b/a)`.\u003c/li>\u003cli>To find the input, set the divisor equal to 0 and solve: `x + 4 = 0` gives −4; `3x - 2 = 0` gives `2/3`.\u003c/li>\u003cli>On the graph, the remainder is the height of `y = P(x)` at that `x`-value.\u003c/li>\u003cli>The theorem gives only the remainder. For the quotient, you still divide.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Which value?","summary":"Which value? quick check","items":[{"id":"q1","goal":4,"prompt":"The remainder when `P(x)` is divided by `x + 4` is…","choices":[{"t":"`P(-4)`","fb":"Right. `x + 4 = 0` when `x = -4`.","_n":"1b861","_k":"45b2f948"},{"t":"`P(1/4)`","fb":"The divisor has no coefficient in front of `x`, so the zero is a whole number: −4.","_n":"1c851","_k":"4209757d"},{"t":"`P(4)`","fb":"`x + 4 = 0` at −4, not 4.","_n":"1d880","_k":"7e02e6f8"},{"t":"`P(-1/4)`","fb":"The divisor has no coefficient in front of `x`, so the zero is a whole number: −4.","_n":"1e890","_k":"b41f7820"}]},{"id":"q2","goal":3,"prompt":"The remainder when `P(x)` is divided by `3x - 2` is…","choices":[{"t":"`P(2)`","fb":"That’s the zero of `x - 2`. Divide by 3 too.","_n":"1f860","_k":"fcb91ad4"},{"t":"`P(-2/3)`","fb":"`3x - 2 = 0` gives `+2/3`.","_n":"1g870","_k":"cdab860c"},{"t":"`P(3/2)`","fb":"Upside down: `3x = 2` gives `x = 2/3`.","_n":"1h840","_k":"b133b548"},{"t":"`P(2/3)`","fb":"Right. `3x - 2 = 0` when `x = 2/3`.","_n":"1i850","_k":"e34411f3"}]},{"id":"q3","goal":4,"prompt":"The graph of `y = P(x)` passes through (−1, 6). The remainder when `P(x)` is divided by `x + 1` is…","choices":[{"t":"−6","fb":"The height at `x = -1` is +6.","_n":"1j820","_k":"80acf07c"},{"t":"−1","fb":"−1 is the zero (the `x`-value). The remainder is the height.","_n":"1k830","_k":"e0886524"},{"t":"0","fb":"The graph isn’t on the `x`-axis at `x = -1`; it’s at height 6.","_n":"1l900","_k":"d09b85ab"},{"t":"6","fb":"Right. The point (−1, 6) says `P(-1) = 6`, and that’s the remainder for `x + 1`.","_n":"1m910","_k":"3d756af4"}]},{"id":"q4","goal":3,"prompt":"Dividing `P(x)` by `x - 2` leaves remainder 5. The remainder when `P(x)` is divided by `2x - 4` is…","choices":[{"t":"5","fb":"Right. `2x - 4` has the same zero, 2, so its remainder is also `P(2) = 5`.","_n":"1n020","_k":"bab83fd3"},{"t":"Can’t tell without `P(x)`","fb":"You don’t need `P(x)`: `2x - 4 = 0` at `x = 2`, and `P(2) = 5`.","_n":"1o010","_k":"f1076c7a"},{"t":"`5/2`","fb":"Only the quotient is halved; the remainder stays `P(2)`.","_n":"1p000","_k":"7d95b18c"},{"t":"10","fb":"The remainder doesn’t double. It’s the height at `x = 2`.","_n":"1qff0","_k":"24ef1e65"}]}]}},"practice":{"activities":[{"id":"divide","type":"custom","title":"Divide it","summary":"Divide it","goal":[1,2,3],"instruction":"Fill in the blanks to finish each division. Then press Check.","how":"Type a number in each box. Fractions like −3/2 are fine.","right":"✓ Correct. Check with the remainder theorem: {check}, the same as your remainder.","items":[{"id":"d1","goal":1,"kind":"long","top":[1,2,-5,3],"a":1,"b":2,"task":"`(x^3 + 2x^2 - 5x + 3) ÷ (x - 2)`, long division","_a":"S0FHCUBeBBsSEgcbWFAZFUFRFANRSBdbAEEMDU5GWQYSWQUVQBYXDQke","wrong":[{"match":{"l0":0},"fb":"`(x^3 + 2x^2) - (x^3 - 2x^2) = 4x^2`: subtracting `-2x^2` adds `2x^2`. Fix it and check again."}],"hints":["Divide the leading terms first: `x^3 ÷ x`.","That gives `x^2`. Multiply it by the \u003cstrong>whole\u003c/strong> divisor, then subtract \u003cstrong>every\u003c/strong> term of that line: `(x^3 + 2x^2) - (x^3 - 2x^2) = 4x^2`.","`x^3 ÷ x = x^2`; `x^2(x - 2) = x^3 - 2x^2`; `(x^3 + 2x^2) - (x^3 - 2x^2) = 4x^2`. Bring down `-5x`: `4x^2 - 5x`. `4x^2 ÷ x = 4x`; `4x(x - 2) = 4x^2 - 8x`; `(4x^2 - 5x) - (4x^2 - 8x) = 3x`. Bring down 3: `3x + 3`. `3x ÷ x = 3`; `3(x - 2) = 3x - 6`; `(3x + 3) - (3x - 6) = 9`. Quotient `x^2 + 4x + 3`, remainder 9."]},{"id":"d2","goal":1,"kind":"long","top":[6,-1,4,-3],"a":3,"b":2,"task":"`(6x^3 - x^2 + 4x - 3) ÷ (3x - 2)`, long division","_a":"S0FHCUBeBxsSEgcbWFUZFUFRFANQSBdbAEEMCk5GWQYSWQAVQBYXDQEe","wrong":[{"match":{"l0":-5},"fb":"`(6x^3 - x^2) - (6x^3 - 4x^2) = 3x^2`: subtracting `-4x^2` adds `4x^2`, so `-x^2 + 4x^2 = 3x^2`. Fix it and check again."},{"match":{"q0":6,"q1":3,"q2":6},"fb":"That’s the quotient for `x - 2/3`, the one synthetic division by `2/3` gives. Here you divide by `3x`: `6x^3 ÷ 3x = 2x^2`, so every quotient term is a third as big. Fix it and check again."}],"hints":["Divide the leading terms first: `6x^3 ÷ 3x`.","That gives `2x^2`. Multiply: `2x^2(3x - 2) = 6x^3 - 4x^2`. Subtract: `(6x^3 - x^2) - (6x^3 - 4x^2) = 3x^2`.","`6x^3 ÷ 3x = 2x^2`; `2x^2(3x - 2) = 6x^3 - 4x^2`; `(6x^3 - x^2) - (6x^3 - 4x^2) = 3x^2`. Bring down `4x`: `3x^2 + 4x`. `3x^2 ÷ 3x = x`; `x(3x - 2) = 3x^2 - 2x`; `(3x^2 + 4x) - (3x^2 - 2x) = 6x`. Bring down −3: `6x - 3`. `6x ÷ 3x = 2`; `2(3x - 2) = 6x - 4`; `(6x - 3) - (6x - 4) = 1`. Quotient `2x^2 + x + 2`, remainder 1."]},{"id":"d3","goal":2,"kind":"syn","top":[2,-3,1,-4],"a":1,"b":-1,"task":"`(2x^3 - 3x^2 + x - 4) ÷ (x + 1)`","_a":"S0FMG1hJBBsSAQYbWFYZFVJSFANPURkVUlEUA1RIF1UDQQwUU1RI","wrong":[{"match":{"z":1,"b0":2,"b1":-1,"b2":0,"b3":-4},"fb":"That’s division by `x - 1`. `x + 1 = 0` when `x = -1`. Fix it and check again."}],"hints":["What number goes in the box? Solve `x + 1 = 0`.","The box holds −1. Bring down 2, then multiply by −1 and add, column by column.","2; 2 × (−1) = −2, −3 + (−2) = −5; −5 × (−1) = 5, 1 + 5 = 6; 6 × (−1) = −6, −4 + (−6) = −10. Bottom row 2, −5, 6 | −10: quotient `2x^2 - 5x + 6`, remainder −10."]},{"id":"d4","goal":2,"kind":"syn","setup":true,"top":[3,0,-10,5],"a":1,"b":-2,"task":"`(3x^3 - 10x + 5) ÷ (x + 2)`","_a":"S0FCCUBeBhsSFwcbWFQZFURRFANPVQUbEhcFG1hRGRVKQQwUUEgXVQBBDApORlcGElkbD05GVwUSWQQVQAYGFQpSSw==","wrong":[{"match":{"b0":3,"b1":6,"b2":2,"b3":9},"fb":"You used +2 (or subtracted). The zero of `x + 2` is −2, and synthetic division adds. Fix it and check again."},{"match":{"t0":3,"t1":-10,"t2":5},"fb":"−10 belongs under `x`, not `x^2`. The `x^2` box needs a 0 placeholder. Fix it and check again."}],"hints":["`x^3`, `x`, constant… which power is missing? And what number goes in the box?","Top row 3, 0, −10, 5; box −2. Bring down 3, multiply by −2, add.","3; 3 × (−2) = −6, 0 + (−6) = −6; −6 × (−2) = 12, −10 + 12 = 2; 2 × (−2) = −4, 5 + (−4) = 1. Bottom row 3, −6, 2 | 1: quotient `3x^2 - 6x + 2`, remainder 1."]},{"id":"d5","goal":2,"kind":"syn","setup":true,"top":[2,0,0,-3,1],"a":1,"b":-2,"task":"`(2x^4 - 3x + 1) ÷ (x + 2)`","_a":"S0FCCUBeBxsSFwcbWFQZFURRFANSSBdDA0EMFFFIF0MEQQwITkZPFQpOBBVABgUVClEaGwBVFw0dVxobAFYXDQhPFFtRRg8aAVoaGwBQFw0DWks=","wrong":[{"match":{"b0":2,"b1":4,"b2":8,"b3":13,"b4":27},"fb":"That’s division by `x - 2`. Use −2 in the box. Fix it and check again."},{"match":{"t0":2,"t1":-3,"t2":1},"fb":"`2x^4 - 3x + 1` is missing both `x^3` and `x^2`. Put a 0 in each of those boxes. Fix it and check again."}],"hints":["`x^4`, `x`, constant… which powers are missing? And what number goes in the box?","Top row 2, 0, 0, −3, 1; box −2. Bring down 2, multiply by −2, add.","2; 2 × (−2) = −4, 0 + (−4) = −4; −4 × (−2) = 8, 0 + 8 = 8; 8 × (−2) = −16, −3 + (−16) = −19; −19 × (−2) = 38, 1 + 38 = 39. Bottom row 2, −4, 8, −19 | 39: quotient `2x^3 - 4x^2 + 8x - 19`, remainder 39."]},{"id":"d6","goal":3,"kind":"syn","top":[2,3,-4,5],"a":2,"b":1,"task":"`(2x^3 + 3x^2 - 4x + 5) ÷ (2x - 1)`","_a":"S0FMG1hUGwIcQVQJQF4HGxIBBxtYUBkVUlEUA09WGRVSUBQDVkgXRgBBDAhORkQGElkEFUAVBxUKTgcVQBYXDQQe","wrong":[{"match":{"z":1,"b0":2,"b1":5,"b2":1,"b3":6},"fb":"That’s division by `x - 1`. The zero of `2x - 1` is `1/2`. Fix it and check again."},{"match":{"z":2,"b0":2,"b1":7,"b2":10,"b3":25},"fb":"2 is the coefficient of `x`. Solve `2x - 1 = 0`. Fix it and check again."},{"match":{"q0":2,"q1":4,"q2":-2},"fb":"That’s the quotient for `x - 1/2`. `2x - 1` is twice as big, so halve it: 1, 2, −1. Fix it and check again."},{"match":{"r":2},"fb":"Only the quotient is halved. The remainder stays `P(1/2) = 4`. Fix it and check again."}],"hints":["Solve `2x - 1 = 0` for the box. You’ll need one extra step at the end.","The box holds 1/2. Bring down 2, multiply by 1/2 and add across. Then divide the quotient numbers (not the remainder) by 2.","2; 1, 3 + 1 = 4; 2, −4 + 2 = −2; −1, 5 − 1 = 4. Bottom row 2, 4, −2 | 4. Halve the quotient: `x^2 + 2x - 1`, remainder 4."]},{"id":"d7","goal":3,"kind":"syn","top":[3,4,-5,1],"a":3,"b":-1,"task":"`(3x^3 + 4x^2 - 5x + 1) ÷ (3x + 1)`","_a":"S0FMG1hJBRkDUAUKUVcGBANQBQpRVwYEHEFUCUBeBhsSAQcbWFcZFVJRFANPUhkVUlAUA1FIF0YAQQwITkZEBhJZBxVAFQcVCk4EFUAWFw0DHg==","wrong":[{"match":{"z":-1,"b0":3,"b1":1,"b2":-6,"b3":7},"fb":"That’s `P(-1)`: division by `x + 1`. Solve `3x + 1 = 0`: `x = -1/3`. Fix it and check again."},{"match":{"q0":3,"q1":3,"q2":-6},"fb":"Divide the quotient numbers by 3: 1, 1, −2. The remainder stays 3. Fix it and check again."},{"match":{"r":1},"fb":"The remainder isn’t divided by 3. It’s `P(-1/3) = 3`. Fix it and check again."}],"hints":["Solve `3x + 1 = 0` for the box. You’ll need one extra step at the end.","The box holds −1/3. Bring down 3, multiply by −1/3 and add across. Then divide the quotient numbers (not the remainder) by 3.","3; −1, 4 − 1 = 3; −1, −5 − 1 = −6; 2, 1 + 2 = 3. Bottom row 3, 3, −6 | 3. Divide the quotient by 3: `x^2 + x - 2`, remainder 3."]},{"id":"d8","goal":3,"kind":"syn","setup":true,"top":[4,0,-5,2],"a":2,"b":-3,"task":"`(4x^3 - 5x + 2) ÷ (2x + 3)`","_a":"S0FCCUBeARsSFwcbWFQZFURRFANPURkVRFAUA1BIF00SWRsITFEZFVJTFANWSBdVAUEMFFRIF1UCQQwNTkZXBBJZGw1ORkQHElkEFUAVBBUKTgUVQBUHFQpRGhsQRg8aBB4=","wrong":[{"match":{"z":1.5,"b0":4,"b1":6,"b2":4,"b3":8},"fb":"That’s division by `2x - 3`. `2x + 3 = 0` gives `-3/2`. Fix it and check again."},{"match":{"z":-3,"b0":4,"b1":-12,"b2":31,"b3":-91},"fb":"−3 is the zero of `x + 3`. Solve `2x + 3 = 0`: `x = -3/2`. Fix it and check again."},{"match":{"t0":4,"t1":-5,"t2":2},"fb":"`4x^3 - 5x + 2` has no `x^2` term. Put 0 in the `x^2` box. Fix it and check again."},{"match":{"q0":2,"q1":-3,"q2":2,"r":-2},"fb":"The quotient is right, but the remainder stays −4: it’s `P(-3/2)`, and halving doesn’t touch it. Fix it and check again."}],"hints":["`x^3`, `x`, constant… which power is missing? Then solve `2x + 3 = 0` for the box. You’ll need one extra step at the end.","Top row 4, 0, −5, 2; box −3/2. Bring down 4, multiply by −3/2 and add across. Then divide the quotient numbers (not the remainder) by 2.","4; −6, 0 − 6 = −6; 9, −5 + 9 = 4; −6, 2 − 6 = −4. Bottom row 4, −6, 4 | −4. Halve the quotient: `2x^2 - 3x + 2`, remainder −4."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Owen","how":"","instruction":"Owen made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Divide `3x^3 + 2x^2 - 7x + 4` by `x + 2` using long division.","steps":["`3x^3 ÷ x = 3x^2`. Multiply: `3x^2(x + 2) = 3x^3 + 6x^2`.","Subtract: `(3x^3 + 2x^2) - (3x^3 + 6x^2) = 8x^2`. Bring down `-7x`.","`8x^2 ÷ x = 8x`. Multiply: `8x(x + 2) = 8x^2 + 16x`.","Subtract: `(8x^2 - 7x) - (8x^2 + 16x) = -23x`. Bring down 4.","`-23x ÷ x = -23`. Multiply: `-23(x + 2) = -23x - 46`. Subtract: `(-23x + 4) - (-23x - 46) = 50`. Quotient `3x^2 + 8x - 23`, remainder 50."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 uses step 2’s `8x^2` correctly. The mistake is earlier.","This subtraction is done correctly. The mistake is earlier.","Step 5 follows from the earlier lines. The mistake is earlier."],"fixes":[{"t":"`(3x^3 + 2x^2) - (3x^3 + 6x^2) = 4x^2`, so the quotient is `3x^2 + 4x - 15` and the remainder is 34.","why":"That subtracts in the wrong order (6 − 2). The first line minus the second gives `2x^2 - 6x^2 = -4x^2`.","_n":"1r060","_k":"ccc232f8"},{"t":"`(3x^3 + 2x^2) - (3x^3 + 6x^2) = -4x^2`, so the quotient is `3x^2 - 4x + 1` and the remainder is `P(2) = 22`.","why":"The division is right now, but the check uses the wrong value. `x + 2 = 0` at `x = -2`, so the remainder is `P(-2) = 2`.","_n":"1s050","_k":"3a0263b2"},{"t":"`(3x^3 + 2x^2) - (3x^3 + 6x^2) = -4x^2`. The quotient is `3x^2 - 4x + 1` and the remainder is 2.","why":"`2x^2 - 6x^2 = -4x^2`. Check with the remainder theorem: `P(-2) = -24 + 8 + 14 + 4 = 2`.","_n":"1t040","_k":"b35af83f"},{"t":"Step 2 is correct as written.","why":"`2x^2 - 6x^2` is `-4x^2`, not `8x^2`. Subtracting changes the sign of the `6x^2`.","_n":"1u030","_k":"bbf66bc2"}],"hints":["Check each subtraction term by term.","In step 2, the `x^2` terms are `2x^2 - 6x^2`. What is that?","Step 2 is wrong: `2x^2 - 6x^2 = -4x^2`. Redoing the division gives quotient `3x^2 - 4x + 1` and remainder 2."]},{"id":"e2","goal":3,"task":"Divide `4x^3 - 4x^2 + 5x - 3` by `2x - 1`.","steps":["`2x - 1 = 0` gives `x = 1/2`, so `1/2` goes in the box.","Synthetic division with `1/2` on 4, −4, 5, −3 gives the bottom row 4 | −2 | 4 | −1.","`2x - 1 = 2(x - 1/2)`, so divide every number in the bottom row by 2: 2 | −1 | 2 | `-1/2`.","So `4x^3 - 4x^2 + 5x - 3 = (2x - 1)(2x^2 - x + 2) - 1/2`."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: 4; 2, −2; −1, 4; 2, −1.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"Check it: `(2x - 1)(2x^2 - x + 2) - 1/2 = 4x^3 - 4x^2 + 5x - 5/2`, not − 3. The remainder must stay −1.","_n":"1v0a0","_k":"85ad5e4b"},{"t":"Multiply the bottom row by 2: the quotient is `8x^2 - 4x + 8` and the remainder is −2.","why":"A bigger divisor gives a smaller quotient, not a bigger one.","_n":"1w090","_k":"fc27247a"},{"t":"Don’t divide by 2 at all: the quotient is `4x^2 - 2x + 4` and the remainder is −1.","why":"That’s the quotient for `x - 1/2`. The divisor `2x - 1` is twice as big, so the quotient is half as big.","_n":"1xfc0","_k":"559a4035"},{"t":"Divide only the quotient numbers by 2. The quotient is `2x^2 - x + 2` and the remainder stays −1.","why":"`(2x - 1)(2x^2 - x + 2) - 1 = 4x^3 - 4x^2 + 5x - 3`, and `P(1/2) = -1`.","_n":"1yfd0","_k":"2550b58c"}],"hints":["Check step 3 by multiplying out step 4. Do you get the original polynomial?","The remainder is `P(1/2)`. What is `P(1/2)`?","Step 3 is wrong: divide only the quotient numbers. Quotient `2x^2 - x + 2`, remainder −1."]},{"id":"e3","goal":4,"task":"Find the remainder when `x^4 - 3x^2 + 2x - 5` is divided by `x + 3`, without dividing.","steps":["`x + 3 = 0` gives `x = -3`, so the remainder is `P(-3)`.","`P(-3) = (-3)^4 - 3(-3)^2 + 2(-3) - 5`.","`= -81 - 27 - 6 - 5`","`= -119`, so the remainder is −119."],"_a":"Ag==","stepFb":["Step 1 is correct: the remainder theorem uses the divisor’s zero, −3.","Step 2 is correct. Substitution doesn’t need a placeholder for the missing `x^3` term.","","Step 4 adds step 3’s numbers correctly. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"`(-3)^4 = (-3)(-3)(-3)(-3) = 81`. Four negatives multiply to a positive.","_n":"1zfe0","_k":"81c3d9c1"},{"t":"`(-3)^4 = 81`, so `P(-3) = 81 - 27 - 6 - 5 = 43`.","why":"An even power of a negative number is positive: `(-3)^4 = 81`.","_n":"20ff0","_k":"9bb1beba"},{"t":"`(-3)^4 = 81`, so `P(-3) = 81 - 27 + 6 - 5 = 55`.","why":"`2(-3) = -6`, not +6.","_n":"21000","_k":"0690cb34"},{"t":"`(-3)^4 = 81` and `-3(-3)^2 = +27`, so `P(-3) = 81 + 27 - 6 - 5 = 97`.","why":"`(-3)^2 = 9` first, then −3 × 9 = −27. The square doesn’t change the −3 in front.","_n":"22010","_k":"8f06673e"}],"hints":["Check each power of −3 in step 3.","Is `(-3)^4` positive or negative?","Step 3 is wrong: `(-3)^4 = 81`. `P(-3) = 81 - 27 - 6 - 5 = 43`."]}]},{"id":"backwards","type":"custom","title":"Work backwards","summary":"Work backwards","star":true,"goal":[1,4,5],"instruction":"Each problem gives you the result and asks for what produced it. Some need two or three steps.","how":"Type your answer in the boxes. Fractions are fine.","items":[{"id":"wb1","goal":5,"prompt":"When `2x^3 + kx^2 - x + 6` is divided by `x - 2`, the remainder is 4. Find `k`.","frame":"{k}","boxes":[{"id":"k","label":"`k`"}],"_a":"S0FdG1hJAUo=","wrong":[{"match":{"k":3},"fb":"That solves `P(-2) = 4`. The zero of `x - 2` is +2."},{"match":{"k":-5},"fb":"That sets the remainder to 0. Set `P(2)` equal to 4."}],"check":"`P(2) = 16 + 4(-4) - 2 + 6 = 4`.","hints":["The remainder is `P(2)`.","`P(2) = 4k + 20`.","`4k + 20 = 4`, so `k = -4`."]},{"id":"wb2","goal":5,"prompt":"When `4x^3 + kx^2 + 2x - 1` is divided by `2x + 1`, the remainder is −3. Find `k`.","frame":"{k}","boxes":[{"id":"k","label":"`k`"}],"_a":"S0FdG1hJB0o=","wrong":[{"match":{"k":-14},"fb":"That solves `P(1/2) = -3`. `2x + 1 = 0` gives `x = -1/2`."},{"match":{"k":4},"fb":"That uses `P(-1)`. The zero of `2x + 1` is `-1/2`."}],"check":"`P(-1/2) = -1/2 + (-2)(1/4) - 1 - 1 = -3`.","hints":["Solve `2x + 1 = 0` for the input.","`P(-1/2) = 4(-1/8) + k(1/4) + 2(-1/2) - 1 = k/4 - 5/2`.","`k/4 - 5/2 = -3`, so `k/4 = -1/2` and `k = -2`."]},{"id":"wb3","goal":5,"prompt":"`x^3 + px^2 + qx - 4` leaves remainder 2 when divided by `x - 1` and remainder −6 when divided by `x + 1`. Find `p` and `q`.","frame":"{p} {q}","boxes":[{"id":"p","label":"`p`"},{"id":"q","label":"`q`"}],"_a":"S0FGG1hWGRVBQQwKHw==","wrong":[{"match":{"p":2,"q":-5},"fb":"That swaps the zeros: it uses `P(-1) = 2` and `P(1) = -6`."}],"check":"`P(1) = 1 + 2 + 3 - 4 = 2` and `P(-1) = -1 + 2 - 3 - 4 = -6`.","hints":["Two remainders give two equations.","`p + q = 5` and `p - q = -1`.","Add them: `2p = 4`, so `p = 2` and `q = 3`."]},{"id":"wb4","goal":1,"prompt":"Dividing `P(x)` by `2x + 1` gives quotient `x^2 - 3x + 2` and remainder 4. Find `P(x)`.","frame":"`P(x) = `{c3}`x^3 + `{c2}`x^2 + `{c1}`x + `{c0}","boxes":[{"id":"c3","label":"coefficient of x cubed"},{"id":"c2","label":"coefficient of x squared"},{"id":"c1","label":"coefficient of x"},{"id":"c0","label":"constant term"}],"_a":"S0FVCkBeBxsSAAQbWEkAGxIABxtYVRkVU1MUA1QZ","wrong":[{"match":{"c3":2,"c2":-5,"c1":1,"c0":2},"fb":"That’s the product without the remainder. Add 4."},{"match":{"c3":2,"c2":-7,"c1":7,"c0":2},"fb":"That multiplies by `2x - 1`. The divisor is `2x + 1`."}],"check":"The remainder theorem agrees: `P(-1/2) = 2(-1/8) - 5(1/4) - 1/2 + 6 = 4`.","hints":["Use the division statement: dividend = divisor × quotient + remainder.","`(2x + 1)(x^2 - 3x + 2) = 2x^3 - 6x^2 + 4x + x^2 - 3x + 2`.","`= 2x^3 - 5x^2 + x + 2`. Add 4: `2x^3 - 5x^2 + x + 6`."]},{"id":"wb5","goal":5,"star":true,"prompt":"`x^3 + px^2 + qx + 5` leaves the same remainder when divided by `x + 1` and by `x - 2`, and leaves remainder 17 when divided by `x - 3`. Find `p` and `q`.","frame":"{p} {q}","boxes":[{"id":"p","label":"`p`"},{"id":"q","label":"`q`"}],"_a":"S0FGG1hJBBsSEhQDT1ZI","wrong":[{"match":{"p":5,"q":2},"fb":"That uses the opposite zeros: `P(1) = P(-2)` and `P(-3) = 17`. The zeros of `x + 1`, `x - 2` and `x - 3` are −1, 2 and 3."}],"check":"`P(-1) = -1 - 1 + 2 + 5 = 5`, `P(2) = 8 - 4 - 4 + 5 = 5`, and `P(3) = 27 - 9 - 6 + 5 = 17`.","hints":["Write all three remainders in terms of `p` and `q`.","Equal remainders: `p - q + 4 = 4p + 2q + 13`, so `p + q = -3`. The third: `9p + 3q + 32 = 17`, so `3p + q = -5`.","Subtract: `2p = -2`, so `p = -1` and `q = -2`."]},{"id":"wb6","goal":4,"star":true,"prompt":"A polynomial `P(x)` leaves remainder 3 when divided by `x - 1` and remainder −5 when divided by `x + 3`. When `P(x)` is divided by `(x - 1)(x + 3)`, a quadratic, the remainder has the form `rx + s`. Find it.","frame":"remainder = {r}`x + `{s}","boxes":[{"id":"r","label":"coefficient r"},{"id":"s","label":"constant s"}],"_a":"S0FEG1hWGRVDQQwIHw==","wrong":[{"match":{"r":3,"s":-5},"fb":"The remainder is `rx + s`, and each given remainder is one value of it, not one coefficient."},{"match":{"r":-5,"s":3},"fb":"The remainder is `rx + s`, and each given remainder is one value of it, not one coefficient."},{"match":{"r":0},"fb":"The remainder is `rx + s`, and each given remainder is one value of it, not one coefficient."},{"match":{"r":-2,"s":1},"fb":"That substitutes `x = -1` and `x = 3`, the opposites of the zeros. `(x - 1)(x + 3)` is 0 at `x = 1` and `x = -3`."}],"check":"At `x = 1`: 2(1) + 1 = 3. At `x = -3`: 2(−3) + 1 = −5.","example":"Example that fits: `P(x) = x^3 + 2x^2 - x + 1 = (x^2 + 2x - 3)(x) + 2x + 1`, with `P(1) = 3` and `P(-3) = -5`.","hints":["Write the division statement with the quadratic divisor and remainder `rx + s`.","Substitute `x = 1` and `x = -3`: the quadratic factor is 0 at both.","`r + s = 3` and `-3r + s = -5`. Subtract: `4r = 8`, so `r = 2` and `s = 1`. The remainder is `2x + 1`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when the graph appeared next to the remainder in Explore?"},{"id":"j2","q":"In your own words, why is the remainder from dividing `P(x)` by `x - b` always equal to `P(b)`?"},{"id":"j3","q":"Explain to a friend how to divide by `2x + 3` with synthetic division. What do they have to do at the end that they wouldn’t do for `x + 3`?"},{"id":"j4","q":"Which part of division still trips you up: signs, placeholders, or adjusting for `ax - b`? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Use synthetic division to divide `x^3 - 7x + 4` by `x - 2`. What are the quotient and remainder?","options":[{"t":"`x^2 + 2x - 3`, remainder −2","why":"Top row 1, 0, −7, 4 with 2 in the box: 1; 2, 2; 4, −3; −6, −2.","_n":"23020","_k":"0bfe7457"},{"t":"`x^3 + 2x^2 - 3x`, remainder −2","why":"The quotient starts one degree lower than the dividend: `x^2`, not `x^3`.","_n":"24030","_k":"595771ca"},{"t":"`x - 5`, remainder −6","why":"That leaves out the 0 for the missing `x^2` term, so it divides `x^2 - 7x + 4` instead.","_n":"25040","_k":"e38beaf4"},{"t":"`x^2 - 2x - 3`, remainder 10","why":"That uses −2 in the box, which divides by `x + 2`.","_n":"26050","_k":"c646155e"}]},"b":{"prompt":"Use synthetic division to divide `x^3 - 5x^2 + 3` by `x + 1`. What are the quotient and remainder?","options":[{"t":"`x^2 - 4x - 4`, remainder −1","why":"That uses +1 in the box, which divides by `x - 1`.","_n":"27162","_k":"c9152391"},{"t":"`x - 6`, remainder 9","why":"That leaves out the 0 for the missing `x` term.","_n":"28152","_k":"34bd03b5"},{"t":"`x^3 - 6x^2 + 6x`, remainder −3","why":"The quotient starts at `x^2`, one degree lower than the dividend.","_n":"29182","_k":"2329ad4d"},{"t":"`x^2 - 6x + 6`, remainder −3","why":"Top row 1, −5, 0, 3 with −1 in the box: 1; −1, −6; 6, 6; −6, −3.","_n":"2a172","_k":"85d95b91"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which value is the remainder when `P(x)` is divided by `2x + 5`?","options":[{"t":"`P(5/2)`","why":"`2x + 5 = 0` gives a negative value: `x = -5/2`.","_n":"2b122","_k":"54b18c70"},{"t":"`P(-2/5)`","why":"The fraction is upside down: `2x = -5` gives `x = -5/2`.","_n":"2c112","_k":"06cd620e"},{"t":"`P(-5/2)`","why":"`2x + 5 = 0` when `x = -5/2`.","_n":"2d142","_k":"96896a8f"},{"t":"`P(-5)`","why":"−5 solves `x + 5 = 0`. Here the 2 in front of `x` matters: divide by it.","_n":"2e132","_k":"5f5a10be"}]},"b":{"prompt":"Which value is the remainder when `P(x)` is divided by `3x - 4`?","options":[{"t":"`P(4)`","why":"4 solves `x - 4 = 0`. Divide by the 3 as well.","_n":"2f0e2","_k":"532f2770"},{"t":"`P(4/3)`","why":"`3x - 4 = 0` when `x = 4/3`.","_n":"2g0d2","_k":"bc12212b"},{"t":"`P(3/4)`","why":"The fraction is upside down: `3x = 4` gives `x = 4/3`.","_n":"2h102","_k":"6932274c"},{"t":"`P(-4/3)`","why":"`3x - 4 = 0` gives a positive value: `x = 4/3`.","_n":"2i112","_k":"9b0ecdf0"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"In the long division `(3x^3 - 4x^2 + 2x - 1) ÷ (x - 2)`, the first quotient term is `3x^2`. After multiplying, subtracting and bringing down the next term, what is the new line?","options":[{"t":"`2x^2 - 2x`","why":"Bringing down copies the next term as it is: `+2x`. Only the subtracted line changes sign.","_n":"2j0e2","_k":"80b380f4"},{"t":"`-4x^2 + 2x`","why":"That multiplies `3x^2` by `x` only. Multiply by the whole divisor, `x - 2`.","_n":"2k0f2","_k":"83c6c356"},{"t":"`2x^2 + 2x`","why":"`3x^2(x - 2) = 3x^3 - 6x^2`, and `(3x^3 - 4x^2) - (3x^3 - 6x^2) = 2x^2`. Then bring down `+2x`.","_n":"2l142","_k":"63f9f0d7"},{"t":"`-10x^2 + 2x`","why":"Subtracting `-6x^2` adds `6x^2`: `-4x^2 + 6x^2 = 2x^2`.","_n":"2m152","_k":"465ae510"}]},"b":{"prompt":"In the long division `(4x^3 - 3x^2 + 5x - 2) ÷ (x - 1)`, the first quotient term is `4x^2`. After multiplying, subtracting and bringing down the next term, what is the new line?","options":[{"t":"`-3x^2 + 5x`","why":"That multiplies `4x^2` by `x` only. Multiply by the whole divisor, `x - 1`.","_n":"2n122","_k":"fe030e74"},{"t":"`x^2 + 5x`","why":"`4x^2(x - 1) = 4x^3 - 4x^2`, and `(4x^3 - 3x^2) - (4x^3 - 4x^2) = x^2`. Then bring down `+5x`.","_n":"2o132","_k":"7d8409ab"},{"t":"`x^2 - 5x`","why":"Bringing down copies the next term as it is: `+5x`. Only the subtracted line changes sign.","_n":"2p082","_k":"d48b1c9f"},{"t":"`-7x^2 + 5x`","why":"Subtracting `-4x^2` adds `4x^2`: `-3x^2 + 4x^2 = x^2`.","_n":"2q092","_k":"83745597"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"`x^3 + kx^2 + 2x - 3` leaves the same remainder when divided by `x + 1` and when divided by `x - 2`. What is `k`?","options":[{"t":"−5","why":"`P(-1) = k - 6` and `P(2) = 4k + 9`. Setting them equal: `k - 6 = 4k + 9`, so `k = -5`. Both remainders are −11.","_n":"2r9c8","_k":"a60c1fdc"},{"t":"−3","why":"That treats `(-1)^2` as −1, which gives `P(-1) = -k - 6`. `(-1)^2 = +1`.","_n":"2s9d8","_k":"27db2925"},{"t":"5","why":"That uses `P(1)` and `P(-2)`: the zeros of `x - 1` and `x + 2`.","_n":"2t9a8","_k":"15868c9f"},{"t":"6","why":"That sets `P(-1) = 0`. ‘The same remainder’ means `P(-1) = P(2)`, not 0.","_n":"2u9b8","_k":"bb297131"}]},"b":{"prompt":"`2x^3 + kx^2 - 4x + 6` leaves the same remainder when divided by `x + 3` and when divided by `x - 1`. What is `k`?","options":[{"t":"−5","why":"That uses `P(3)` and `P(-1)`: the zeros of `x - 3` and `x + 1`.","_n":"2v988","_k":"20e5a1a0"},{"t":"−4","why":"That treats `(-3)^2` as −9, which gives `P(-3) = -9k - 36`. `(-3)^2 = +9`.","_n":"2w998","_k":"f8e8dc74"},{"t":"4","why":"That sets `P(-3) = 0`. ‘The same remainder’ means `P(-3) = P(1)`, not 0.","_n":"2x968","_k":"b384cf0c"},{"t":"5","why":"`P(-3) = 9k - 36` and `P(1) = k + 4`. Setting them equal: `8k = 40`, so `k = 5`. Both remainders are 9.","_n":"2y978","_k":"1b6ad36b"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"The graph of `y = P(x)` passes through (2, −3) and (−2, 5). What is the remainder when `P(x) + 4` is divided by `x - 2`?","options":[{"t":"−7","why":"That subtracts 4. The new polynomial is `P(x)` \u003cstrong>+\u003c/strong> 4.","_n":"2za48","_k":"a7a3e8a8"},{"t":"−3","why":"That’s the remainder for `P(x)` itself. Adding 4 raises the height at `x = 2` by 4.","_n":"30a58","_k":"125e0c58"},{"t":"1","why":"The remainder is the value of `P(x) + 4` at `x = 2`: `P(2) + 4 = -3 + 4 = 1`.","_n":"31a28","_k":"7cdc3b1d"},{"t":"9","why":"That uses the point at `x = -2`. `x - 2 = 0` when `x = 2`.","_n":"32a18","_k":"52f38952"}]},"b":{"prompt":"The graph of `y = P(x)` passes through (−3, 2) and (3, −4). What is the remainder when `P(x) - 5` is divided by `x + 3`?","options":[{"t":"−9","why":"That uses the point at `x = 3`. `x + 3 = 0` when `x = -3`.","_n":"33a48","_k":"1caeddfa"},{"t":"−3","why":"The remainder is the value of `P(x) - 5` at `x = -3`: `P(-3) - 5 = 2 - 5 = -3`.","_n":"34a38","_k":"681fd4d5"},{"t":"2","why":"That’s the remainder for `P(x)` itself. Subtracting 5 lowers the height by 5.","_n":"35a68","_k":"30db27ea"},{"t":"7","why":"That adds 5. The new polynomial is `P(x)` \u003cstrong>−\u003c/strong> 5.","_n":"36a58","_k":"540390b2"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Dividing `P(x)` by `2x - 3` gives quotient `2x^2 - 4x + 6` and remainder 5. Without finding `P(x)`, what are the quotient and remainder when `P(x)` is divided by `x - 3/2`?","options":[{"t":"`x^2 - 2x + 3`, remainder 5","why":"That halves the quotient out of habit. Here the divisor gets smaller: `x - 3/2` is half of `2x - 3`, so the quotient gets bigger.","_n":"37a88","_k":"450771da"},{"t":"`2x^2 - 4x + 6`, remainder 5","why":"The quotient depends on the divisor’s leading coefficient. `x - 3/2` is half of `2x - 3`, so the quotient doubles.","_n":"38a78","_k":"bfd269f2"},{"t":"`4x^2 - 8x + 12`, remainder 10","why":"The remainder doesn’t change. Both divisors have the same zero, `3/2`, so both remainders are `P(3/2) = 5`.","_n":"399a8","_k":"49d271c9"},{"t":"`4x^2 - 8x + 12`, remainder 5","why":"`2x - 3 = 2(x - 3/2)`, so `P(x) = 2(x - 3/2)(2x^2 - 4x + 6) + 5 = (x - 3/2)(4x^2 - 8x + 12) + 5`. The quotient doubles; the remainder is still `P(3/2) = 5`.","_n":"3a998","_k":"3e233026"}]},"b":{"prompt":"Dividing `P(x)` by `3x + 2` gives quotient `3x^2 - 6x + 3` and remainder −4. Without finding `P(x)`, what are the quotient and remainder when `P(x)` is divided by `x + 2/3`?","options":[{"t":"`x^2 - 2x + 1`, remainder −4","why":"That divides the quotient by 3 out of habit. Here the divisor gets smaller: `x + 2/3` is a third of `3x + 2`, so the quotient gets bigger.","_n":"3b108","_k":"fb138353"},{"t":"`9x^2 - 18x + 9`, remainder −12","why":"The remainder doesn’t change. Both divisors have the same zero, `-2/3`, so both remainders are `P(-2/3) = -4`.","_n":"3c118","_k":"6673012f"},{"t":"`9x^2 - 18x + 9`, remainder −4","why":"`3x + 2 = 3(x + 2/3)`, so `P(x) = 3(x + 2/3)(3x^2 - 6x + 3) - 4 = (x + 2/3)(9x^2 - 18x + 9) - 4`. The quotient triples; the remainder is still `P(-2/3) = -4`.","_n":"3d128","_k":"a47c61b0"},{"t":"`3x^2 - 6x + 3`, remainder −4","why":"The quotient depends on the divisor’s leading coefficient. `x + 2/3` is a third of `3x + 2`, so the quotient triples.","_n":"3e138","_k":"33a0fa9f"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Dividing `3x^3 + x^2 - 4` by `x + 1` gives quotient `3x^2 - 2x + 2` and remainder −6. Which statement is written correctly?","options":[{"t":"`{3x^3 + x^2 - 4}/{x + 1} = 3x^2 - 2x + 2 - 6, x != -1`","why":"The remainder must be divided by the divisor too: `-{6}/{x + 1}`.","_n":"3f148","_k":"43d49eb3"},{"t":"`{3x^3 + x^2 - 4}/{x + 1} = 3x^2 - 2x + 2 - {6}/{x + 1}, x != -1`","why":"The remainder stays over the divisor, and the restriction is the divisor’s zero.","_n":"3g158","_k":"6f487234"},{"t":"`3x^3 + x^2 - 4 = (x + 1)(3x^2 - 2x + 2) - {6}/{x + 1}`","why":"This mixes the two forms. Multiplied out, the remainder is just −6.","_n":"3h168","_k":"b21de0f3"},{"t":"`{3x^3 + x^2 - 4}/{x + 1} = 3x^2 - 2x + 2 - {6}/{x + 1}, x != 1`","why":"The restriction comes from `x + 1 = 0`, so `x ≠ -1`.","_n":"3i178","_k":"de91b607"}]},"b":{"prompt":"Dividing `2x^3 - 7x + 1` by `x - 2` gives quotient `2x^2 + 4x + 1` and remainder 3. Which statement is written correctly?","options":[{"t":"`{2x^3 - 7x + 1}/{x - 2} = 2x^2 + 4x + 1 + 3, x != 2`","why":"The remainder must be divided by the divisor too: `{3}/{x - 2}`.","_n":"3j188","_k":"b28f59d3"},{"t":"`{2x^3 - 7x + 1}/{x - 2} = 2x^2 + 4x + 1 + {3}/{x - 2}, x != 2`","why":"The remainder stays over the divisor, and the restriction is the divisor’s zero.","_n":"3k198","_k":"5d04fc2c"},{"t":"`2x^3 - 7x + 1 = (x - 2)(2x^2 + 4x + 1) + {3}/{x - 2}`","why":"This mixes the two forms. Multiplied out, the remainder is just 3.","_n":"3l168","_k":"166c169f"},{"t":"`{2x^3 - 7x + 1}/{x - 2} = 2x^2 + 4x + 1 + {3}/{x - 2}, x != -2`","why":"The restriction comes from `x - 2 = 0`, so `x ≠ 2`.","_n":"3m158","_k":"536f0621"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Owen says, ‘Dividing any polynomial `P(x)` by `x - 5` leaves remainder `P(5)`.’ Which is the best explanation of why he’s right?","options":[{"t":"“Division gives `P(x) = (x - 5)Q(x) + R` for every `x`. At `x = 5` the factor `x - 5` is 0, so `P(5) = 0 · Q(5) + R = R`.”","why":"This uses the division statement and shows why the quotient part vanishes.","_n":"3n148","_k":"4c1a0528"},{"t":"“Long division and synthetic division by `x - 5` always give the same remainder, and synthetic division puts 5 in the box, so the remainder must be `P(5)`.”","why":"Both facts are true, but neither shows why the remainder equals `P(5)`. Putting 5 in the box isn’t the same as evaluating `P` at 5.","_n":"3o138","_k":"f9b64729"},{"t":"“Division gives `P(x) = (x - 5)Q(x) + R`. Substituting `x = 5` into the quotient gives `Q(5) = R`, the remainder.”","why":"The remainder comes from `P(5)`, not `Q(5)`. For `P(x) = x^2`, `Q(x) = x + 5` and `Q(5) = 10`, but `R = 25`.","_n":"3p1a8","_k":"6659cb2c"},{"t":"“It worked for `x - 1`, `x - 2` and `x - 3`: each remainder matched `P(1)`, `P(2)` and `P(3)`. So it must also work for `x - 5`.”","why":"Examples suggest a pattern but don’t prove it. The division statement proves it for every divisor.","_n":"3q198","_k":"4c55b2c1"}]},"b":{"prompt":"Owen says, ‘Dividing any polynomial `P(x)` by `3x + 1` leaves remainder `P(-1/3)`.’ Which is the best explanation of why he’s right?","options":[{"t":"“Division gives `P(x) = (3x + 1)Q(x) + R` for every `x`. At `x = -1/3` the factor `3x + 1` is 0, so `P(-1/3) = 0 · Q(-1/3) + R = R`.”","why":"This uses the division statement and shows why the quotient part vanishes.","_n":"3r188","_k":"e250f4d8"},{"t":"“Division gives `P(x) = (3x + 1)Q(x) + R`. Substituting `x = -1/3` into the quotient gives `Q(-1/3) = R`, the remainder.”","why":"The remainder comes from `P(-1/3)`, not `Q(-1/3)`. For `P(x) = 9x^2`, `Q(x) = 3x - 1` and `Q(-1/3) = -2`, but `R = 1`.","_n":"3s178","_k":"79b16a59"},{"t":"“It worked for `3x + 2` and `3x + 4`: each remainder matched `P(-2/3)` and `P(-4/3)`. So it must also work for `3x + 1`.”","why":"Examples suggest a pattern but don’t prove it. The division statement proves it for every divisor.","_n":"3t1e8","_k":"4a7302a4"},{"t":"“Long division by `3x + 1` and synthetic division with `-1/3` always give the same remainder, and synthetic division puts `-1/3` in the box, so the remainder must be `P(-1/3)`.”","why":"Both facts are true, but neither shows why the remainder equals `P(-1/3)`. Putting `-1/3` in the box isn’t the same as evaluating `P` at `-1/3`.","_n":"3u1d8","_k":"70f45978"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A shipping box has volume `V(x) = 2x^3 + 9x^2 + 7x - 6` cm³, where `x > 1`. Its height is (`x + 3`) cm and its width is (`x + 2`) cm. Which expression gives its length, in centimetres?","options":[{"t":"`2x^2 + 3x - 2`","why":"That’s the area of the base, after one division. Divide by the width as well.","_n":"3v149","_k":"6e8f02d8"},{"t":"`2x + 7`","why":"That divides the base area by `x - 2`, which leaves remainder 12. The width is `x + 2`, so use −2.","_n":"3w159","_k":"452d590c"},{"t":"`2x - 1`","why":"V ÷ (`x + 3`) = `2x^2 + 3x - 2`, the area of the base. Then (`2x^2 + 3x - 2`) ÷ (`x + 2`) = `2x - 1`, with remainder 0.","_n":"3x129","_k":"3b5769ff"},{"t":"`2x + 3`","why":"That divides the base area by `x` alone (`2x^2 + 3x - 2 = x(2x + 3) - 2`) and drops the −2. Divide by the whole width, `x + 2`.","_n":"3y139","_k":"46d77df8"}]},"b":{"prompt":"A planter has volume `V(x) = 3x^3 + 11x^2 - 6x - 8` cm³, where `x > 1`. Its height is (`x + 4`) cm and its width is (`x - 1`) cm. Which expression gives its length, in centimetres?","options":[{"t":"`3x + 2`","why":"V ÷ (`x + 4`) = `3x^2 - x - 2`, the area of the base. Then (`3x^2 - x - 2`) ÷ (`x - 1`) = `3x + 2`, with remainder 0.","_n":"3z189","_k":"9954790b"},{"t":"`3x - 1`","why":"That divides the base area by `x` alone (`3x^2 - x - 2 = x(3x - 1) - 2`) and drops the −2. Divide by the whole width, `x - 1`.","_n":"40199","_k":"e46177a6"},{"t":"`3x^2 - x - 2`","why":"That’s the area of the base, after one division. Divide by the width as well.","_n":"41169","_k":"d2a66508"},{"t":"`3x - 4`","why":"That divides the base area by `x + 1`, which leaves remainder 2. The width is `x - 1`, so use +1.","_n":"42179","_k":"adaf4b4e"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Write `{x^2 - x + 4}/{x - 3}` as a polynomial plus a fraction. As `x` grows very large, which polynomial does the expression get closer and closer to?","options":[{"t":"`x + 2`","why":"`{x^2 - x + 4}/{x - 3} = x + 2 + {10}/{x - 3}`. As `x` grows, `{10}/{x - 3}` shrinks toward 0. At `x = 1003` it’s only 0.01.","_n":"431c9","_k":"0ed30350"},{"t":"`x + 12`","why":"That adds the remainder 10 as a number. It stays over the divisor, as `{10}/{x - 3}`, which shrinks.","_n":"441d9","_k":"74879c7b"},{"t":"`x`","why":"That keeps only the leading terms. The difference from `x` stays near 2, not 0.","_n":"451a9","_k":"085efd13"},{"t":"`x - 4`","why":"That divides by `x + 3`. The divisor’s zero is +3.","_n":"46199","_k":"ef3cba88"}]},"b":{"prompt":"Write `{2x^2 - x + 3}/{x + 1}` as a polynomial plus a fraction. As `x` grows very large, which polynomial does the expression get closer and closer to?","options":[{"t":"`2x + 3`","why":"That adds the remainder 6 as a number. It stays over the divisor, as `{6}/{x + 1}`, which shrinks.","_n":"471c9","_k":"c6930757"},{"t":"`2x`","why":"That keeps only the leading terms. The difference from `2x` stays near −3, not 0.","_n":"481b9","_k":"9effc2bd"},{"t":"`2x - 3`","why":"`{2x^2 - x + 3}/{x + 1} = 2x - 3 + {6}/{x + 1}`. As `x` grows, `{6}/{x + 1}` shrinks toward 0.","_n":"49169","_k":"d6db0cf3"},{"t":"`2x + 1`","why":"That divides by `x - 1`. The divisor’s zero is −1.","_n":"4a159","_k":"0b859d9b"}]}}]},"task":{"title":"Design by remainders","summary":"Design by remainders","statement":"\u003cp>Choose whole numbers `p`, `q` and `r` from −9 to 9 so that `P(x) = x^3 + px^2 + qx + r`:\u003c/p>\u003cul>\u003cli>leaves the \u003cstrong>same remainder\u003c/strong> when divided by `x - 1` and by `x + 1`;\u003c/li>\u003cli>leaves remainder \u003cstrong>3\u003c/strong> when divided by `x - 2`;\u003c/li>\u003cli>leaves a \u003cstrong>positive\u003c/strong> remainder when divided by `x`.\u003c/li>\u003c/ul>\u003cp>There’s more than one answer. Can you find them all?\u003c/p>","checks":["Whole numbers from −9 to 9","Same remainder for `x - 1` and `x + 1`","Remainder 3 for `x - 2`","Positive remainder for `x`"],"tips":["Use whole numbers from −9 to 9 in all three boxes.","Right now the remainders are `P(1)` = {v1} and `P(-1)` = {v2}. Write both in terms of `p`, `q` and `r` and set them equal. Which letters cancel?","Right now `P(2)` = {v3}. The remainder for `x - 2` is `P(2)`, not `P(-2)`: write `8 + 4p + 2q + r = 3`.","Dividing by `x` is dividing by `x - 0`, so the remainder is `P(0)`. What is `P(0)` for your polynomial?"],"explainPrompt":"Explain how you found `p`, `q` and `r`.","vocab":"Use the words remainder theorem, divisor and remainder.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"You found all three. In every answer `q = -1`: `P(1) = P(-1)` makes the `x^2` and constant terms cancel and leaves `2 + 2q = 0`. Then line 3 gives `r = -3 - 4p`, and `0 \u003c r ≤ 9` allows only `p = -3`, −2 or −1."},"cards":[["The division statement","`P(x) = `(divisor)(quotient) + remainder. Example: `2x^3 - 5x^2 - 4x + 7 = (x - 3)(2x^2 + x - 1) + 4`."],["Synthetic division in three moves","Bring down the first coefficient; multiply by the number in the box; add the column. Repeat multiply and add to the end."],["What goes in the box?","The divisor’s zero. `x - 3` → 3; `x + 3` → −3; `2x - 1` → `1/2`."],["A missing power","Write 0 in its place. `x^3 - 6x + 4` has top row 1, 0, −6, 4."],["Reading the bottom row","All but the last number are the quotient’s coefficients, starting one degree lower. The last number is the remainder."],["Why does synthetic division add?","It multiplies by the zero (+3 for `x - 3`) instead of −3, so every product has already changed sign. Long division’s “subtract” becomes “add”."],["Dividing by `ax - b`","Use `b/a` in the box, then divide the quotient (not the remainder) by `a`. `2x - 1`: box `1/2`, halve the quotient."],["The remainder theorem","`P(x) ÷ (x - b)` leaves `P(b)`. `P(x) ÷ (ax - b)` leaves `P(b/a)`."],["Why the remainder theorem works","`P(x) = (x - b)Q(x) + R`. At `x = b`: `P(b) = 0 · Q(b) + R = R`."],["The remainder on the graph","The height of `y = P(x)` at the divisor’s zero. If the graph passes through (−1, 6), dividing by `x + 1` leaves 6."],["Finding an unknown coefficient","Set P(zero) equal to the given remainder and solve. `(x^3 + kx^2 - 2x + 5) ÷ (x - 2)` leaves 17 when `4k + 9 = 17`, so `k = 2`."],["Fraction form of a division","`{P(x)}/{x - b} = Q(x) + {R}/{x - b}, x != b`. The remainder stays over the divisor."]]}};</script>
