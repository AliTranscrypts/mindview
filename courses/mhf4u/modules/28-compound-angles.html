.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 28: compound angle visualiser, π/12 clock, double-angle lab, exact-value entries, task inputs */
.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.seg button:disabled{opacity:.6}
.cx-hcap{font-size:1.05rem !important;line-height:1.5}
.cx-hcap .m{white-space:normal}
.cx-sl{margin:10px 0 4px}
.cx-sl label{font-weight:700}
.cx-sl output{font:600 1.35rem var(--font-math)}
.cx-slrow{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:10px;align-items:center}
.cx-slrow input[type=range]{width:100%;min-height:32px}
.cx-pm{min-width:40px;min-height:40px;font-size:1.3rem;line-height:1;padding:0}
.cx-cap{margin:8px 0 0;min-height:1.5em}
.cx-cap .m{white-space:normal}
.cx-tg{margin-top:10px}
.cx-pin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}
.cx-form{margin:6px 0 0;font-size:1.15rem}
.cx-form p{margin:4px 0}
.cx-form .m{white-space:normal}
.cx-u1,.cx-u2{display:inline-block;padding-bottom:1px}
.cx-u1{border-bottom:3px solid var(--pen)}
.cx-u2{border-bottom:3px solid var(--f3)}
.cx-pc{font-size:.75em;vertical-align:super;margin-left:1px}
.cx-u1 .cx-pc{color:var(--pen)}
.cx-u2 .cx-pc{color:var(--f3)}
.cx-hl{background:var(--hi);color:var(--hi-ink);border-radius:3px;padding:0 3px}
.cx-dbar{display:block;height:10px;margin-top:6px;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper);max-width:220px}
.cx-dbar b{display:block;height:100%;background:var(--ink-2)}
.cx-found summary,.p3-view{margin-bottom:4px}
.pg-read .read dd{line-height:1.6}
.read dd .m{font-size:1.08em}
/* Part 3: the π/12 clock */
.p3-view{margin-bottom:14px}
.ck-dots{position:static}
.ck-dot{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2;cursor:pointer}
.ck-dot:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.ck-start{font-weight:700}
.ck-h{font-size:1.1rem;margin:0 0 6px}
.ck-step{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px}
.ck-step h4{margin:0 0 6px;font-size:1rem}
.ck-lab{margin:8px 0 4px;font-weight:700}
.ck-tiles{display:flex;flex-wrap:wrap;gap:6px}
.ck-tile{min-width:52px;min-height:40px}
.ck-opts .opt{min-height:44px}
.ck-form{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 10px}
.ck-op{font:400 1.3rem var(--font-math);padding:0 2px}
.ck-slot{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;min-height:44px;border:2px dashed var(--ink-2);background:var(--sheet);border-radius:8px;padding:.25em .45em}
.ck-slot[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}
.ck-slot.good{border-style:solid;border-color:var(--green);background:var(--good-bg)}
.ck-slot.bad{border-style:solid;border-color:var(--red);background:var(--bad-bg)}
.ck-slot:disabled{color:inherit;opacity:1}
.ck-sf{font-size:.95rem}
.ck-sv{font:400 1.1rem var(--font-math);min-height:1.4em}
.ck-pal{display:grid;grid-template-columns:repeat(9,minmax(44px,1fr));gap:6px;max-width:560px}
.ck-pt{min-height:44px;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;font:400 1.05rem var(--font-math);padding:.1em .2em}
.ck-pt:hover:not(:disabled){border-color:var(--pen)}
.ck-pt[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.ck-done{margin:0 0 12px;padding-left:1.2em}
.ck-done li{margin:4px 0}
.ck-done .m{white-space:normal}
table.ck-grid td,table.ck-grid th{padding:6px 8px}
table.ck-grid th[scope=row]{font-family:var(--font-math);background:var(--paper)}
.sg-pair{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;vertical-align:middle}
.sg-pair button{min-width:40px;min-height:40px;border:0;background:var(--sheet);font:700 1.05rem var(--font-math);padding:0 .45em}
.sg-pair button + button{border-left:1.5px solid var(--ink)}
.sg-pair button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.sg-pair button:disabled{color:inherit}
.sg-pair button[aria-pressed="true"]:disabled{color:var(--sheet)}
.sg-pair.bad{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
/* Practice 2 */
.en-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 4px;font-size:1.15rem}
.en-box{width:3.5em}
.en-frac{display:inline-flex;flex-direction:column;align-items:center}
.en-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;justify-content:center}
.en-bar{display:block;width:100%;height:2px;background:var(--ink);margin:4px 0}
.en-pal{margin-top:6px;width:100%}
/* task */
.tk-in{display:grid;gap:10px;margin:8px 0 14px}
.tk-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tk-row .seg-wrap{margin-top:0}
.tk-name{font:400 1.5rem var(--font-math);min-width:2.4em}
.tk-lab{font-weight:700}
#tk-xp{width:3.4rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.3em .4em;font:400 1.2rem var(--font-math);text-align:center;min-height:40px}
.tk-frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.tk-frac input,.tk-frac select,#tk-key{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.3em .4em;font:400 1.15rem var(--font-math);min-height:38px}
.tk-frac input,.tk-frac select{width:4.4rem;text-align:center}
#tk-key{max-width:100%}
.tk-line{display:block;width:100%;height:2px;background:var(--ink)}
.tk-pi{font:400 1.5rem var(--font-math)}
.tk-keyv{font-size:1.15rem}
.tk-note{margin:-4px 0 0}
.tk-live{font-size:1.05rem;min-height:2.6em}
.tk-live .m{white-space:normal}
@media (max-width:820px){
  .ck-pal{grid-template-columns:repeat(3,minmax(44px,1fr));max-width:260px}
  .en-pal{max-width:260px}
}

ith-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"af2b9fe7","content":{"id":"28-compound-angles","kind":"topic","title":"Compound angles","topic":"Compound Angles","readyTopic":"compound angles","hero":{"eq":"`sin(a + b) ≠` `sin a + sin b`","eqLabel":"sine of a plus b is not equal to sine a plus sine b","eqSize":"md","headline":"Angles add. Their sines don’t.","text":"When two angles combine into a \u003cstrong>compound angle\u003c/strong> `a + b`, its sine isn’t the sum of the two sines. The unit circle shows what it really is: the height of the new point splits into two pieces, `sin a cos b` and `cos a sin b`. These \u003cstrong>compound angle formulas\u003c/strong> give exact values for new angles like `π/12` and `7π/12`, and setting `b = a` gives the \u003cstrong>double-angle formulas\u003c/strong>.","fig":{"aria":"Unit circle with a = π/3 and b = π/6. Stacking sin a and sin b reaches about 1.37, above the top of the circle. Turning on from a by b reaches the top of the circle, height 1, which splits into 3/4 and 1/4.","shape":"square"},"caps":["`sin a + sin b ≈ 1.37`, but no point on the unit circle is higher than 1.","`sin(a + b) = sin a cos b + cos a sin b = {3}/{4} + {1}/{4} = 1`"],"labels":{"top":"top of the circle","p1":"`sin a cos b`","p2":"`cos a sin b`"}},"goals":["I can use a counterexample or the unit circle to show that `sin(a + b) ≠ sin a + sin b`, and explain where each piece of the correct formula comes from in the picture.","I can expand `sin(a ± b)` and `cos(a ± b)` with the right pairs and signs, and recognize an expansion such as `sin x cos y - cos x sin y` as a single compound angle.","I can find exact values for angles such as `π/12`, `5π/12`, `7π/12` and `11π/12` by writing them as a sum or difference of special angles.","I can use the formula for `tan(a ± b)` and explain when `tan(a + b)` is undefined.","I can get the double-angle formulas from the compound angle formulas, choose the most useful form of `cos 2θ`, and use them to find exact values.","I can find a ratio of `a + b`, `a - b` or `2θ` when I’m given one ratio of each angle and its quadrant."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Special angles","goal":3,"fixedOrder":true,"prompt":"What is the exact value of `cos(3π/4)`?","options":[{"t":"`-1`","why":"−1 is `tan(3π/4)`: sine and cosine have the same size there, with opposite signs. Cosine alone is `-{√2}/{2}`.","_n":"087e","_k":"c037c547"},{"t":"`-{√2}/{2}`","why":"`3π/4` is in quadrant 2 with reference angle `π/4`. `cos(π/4) = {√2}/{2}`, and cosine is negative in quadrant 2.","_n":"18ae","_k":"181442db"},{"t":"`-{1}/{2}`","why":"`-{1}/{2}` is `cos(2π/3)`, from the `π/3` family. `3π/4` has reference angle `π/4`, whose cosine is `{√2}/{2}`.","_n":"289e","_k":"78c7a61b"},{"t":"`{√2}/{2}`","why":"Right size, wrong sign. `3π/4` is left of the `y`-axis, so its `x`-coordinate (cosine) is negative.","_n":"384e","_k":"3bdeeeef"}],"hints":["Find the quadrant and the reference angle of `3π/4`.","`3π/4` is in quadrant 2, with reference angle `π - 3π/4 = π/4`. Cosine is negative in quadrant 2.","`cos(π/4) = {√2}/{2}`, so `cos(3π/4) = -{√2}/{2}`."]},{"id":"w2","skill":"Special angles","goal":4,"fixedOrder":true,"prompt":"What is the exact value of `tan(π/6)`?","options":[{"t":"`{1}/{2}`","why":"`{1}/{2}` is `sin(π/6)`. Tangent is sine divided by cosine.","_n":"483e","_k":"b848e9d7"},{"t":"`{√3}/{3}`","why":"`tan(π/6) = sin(π/6)/cos(π/6) = {{1}/{2}}/{{√3}/{2}} = {1}/{√3} = {√3}/{3}`.","_n":"586e","_k":"cd431378"},{"t":"`{√3}/{2}`","why":"`{√3}/{2}` is `cos(π/6)`. Divide the sine by it: `{1}/{2} ÷ {√3}/{2}`.","_n":"685e","_k":"83e44603"},{"t":"`√3`","why":"`√3` is `tan(π/3)`. The smaller angle `π/6` has the smaller tangent, `{√3}/{3}`.","_n":"790e","_k":"0d38e8dc"}],"hints":["`tan θ = sin θ / cos θ`.","`sin(π/6) = {1}/{2}` and `cos(π/6) = {√3}/{2}`.","`{1}/{2} ÷ {√3}/{2} = {1}/{√3}`. Multiply the top and bottom by `√3`: `{√3}/{3}`."]},{"id":"w3","skill":"Fractions and radicals","goal":3,"fixedOrder":true,"prompt":"Multiply: `({√2}/{2}) × ({√3}/{2})`.","options":[{"t":"`{√5}/{4}`","why":"`√2 × √3` multiplies under the root: `√6`, not `√5`. Check: 1.414 × 1.732 ≈ 2.449, and `√6` ≈ 2.449.","_n":"88fe","_k":"11847082"},{"t":"`{√6}/{4}`","why":"Multiply the tops and the bottoms: `{√2 × √3}/{2 × 2} = {√6}/{4}`.","_n":"945d","_k":"976afa90"},{"t":"`{√6}/{2}`","why":"The bottoms multiply too: 2 × 2 = 4.","_n":"a46d","_k":"02b17d68"},{"t":"`{3}/{2}`","why":"`√2 × √3` is `√6`, not 6. `{6}/{4}` would be `{3}/{2}`, but the root stays.","_n":"b47d","_k":"2ac54a72"}],"hints":["Multiply the numerators together and the denominators together.","`√2 × √3 = √{2 × 3}`, and 2 × 2 = 4.","`({√2}/{2})({√3}/{2}) = {√6}/{4}`."]},{"id":"w4","skill":"Fractions and radicals","goal":3,"fixedOrder":true,"prompt":"Which is equal to `π/4 + π/6`?","options":[{"t":"`π/12`","why":"`π/12` is `π/4 - π/6`. The sum is bigger than either angle.","_n":"c48d","_k":"39731eec"},{"t":"`π/10`","why":"Adding the bottoms (4 + 6) makes the answer \u003cem>smaller\u003c/em> than `π/6`. Fractions need a common denominator.","_n":"d41d","_k":"c9672cb2"},{"t":"`π/5`","why":"`{π + π}/{4 + 6} = 2π/10 = π/5`, which is less than `π/4`. Use a common denominator: 12.","_n":"e42d","_k":"8446e348"},{"t":"`5π/12`","why":"With denominator 12: `π/4 = 3π/12` and `π/6 = 2π/12`, so the sum is `5π/12`.","_n":"f43d","_k":"4dc533d5"}],"hints":["Write both fractions with a common denominator.","12 works: `π/4 = 3π/12` and `π/6 = 2π/12`.","`3π/12 + 2π/12 = 5π/12`."]},{"id":"w5","skill":"One ratio from another","goal":6,"fixedOrder":true,"prompt":"Angle `x` is in quadrant 2 and `sin x = {3}/{5}`. What is `cos x`?","options":[{"t":"`-{4}/{5}`","why":"`cos^2x = 1 - ({3}/{5})^2 = {16}/{25}`, so `cos x = ±{4}/{5}`. Cosine is negative in quadrant 2: `-{4}/{5}`.","_n":"g44d","_k":"d2fcfef7"},{"t":"`-{3}/{4}`","why":"`-{3}/{4}` is `y/x = tan x`. Cosine is `x/r = -{4}/{5}`.","_n":"h3dd","_k":"07a55432"},{"t":"`{2}/{5}`","why":"`1 - {3}/{5} = {2}/{5}` treats the identity as `sin x + cos x = 1`. It’s the \u003cstrong>squares\u003c/strong> that add to 1: `cos^2x = 1 - {9}/{25} = {16}/{25}`.","_n":"i3ed","_k":"63ad4282"},{"t":"`{4}/{5}`","why":"The size is right, but in quadrant 2 the point is left of the `y`-axis, so cosine is negative.","_n":"jb7d","_k":"eaeeef14"}],"hints":["Use `sin^2x + cos^2x = 1` for the size, and the quadrant for the sign.","`cos^2x = 1 - {9}/{25} = {16}/{25}`, so the size is `{4}/{5}`. Is cosine positive or negative in quadrant 2?","Negative, so `cos x = -{4}/{5}`. (A 3–4–5 triangle with the point at (−4, 3).)"]},{"id":"w6","skill":"Equivalent expressions","goal":2,"prompt":"Which expression is equal to `cos(π/2 - x)` for every `x`?","options":[{"t":"`-cos x`","why":"That’s `cos(π/2) - cos x = 0 - cos x`. Cosine doesn’t split over a subtraction. This idea is the heart of this module.","_n":"kb6d","_k":"1741a380"},{"t":"`-sin x`","why":"For a small positive `x`, `π/2 - x` is in quadrant 1, where cosine is positive. So the answer is `+sin x`.","_n":"lb9d","_k":"8097022c"},{"t":"`cos x`","why":"Subtracting from `π/2` switches cosine to sine (module 27). Check `x = π/2`: `cos 0 = 1`, but `cos(π/2) = 0`.","_n":"mb8d","_k":"509f5108"},{"t":"`sin x`","why":"This is a cofunction identity: in a right triangle, the side adjacent to the angle `π/2 - x` is opposite `x`.","_n":"nb3d","_k":"eadee947"}],"hints":["This is one of the cofunction identities from module 27.","In a right triangle with acute angle `x`, the other acute angle is `π/2 - x`. The side next to one is opposite the other.","So `cos(π/2 - x) = sin x`. Check with `x = π/6`: `cos(π/3) = {1}/{2} = sin(π/6)`."]}],"refreshers":{"Special angles":"For any special angle, the reference angle gives the size and CAST gives the sign. `cos(3π/4)`: reference angle `π/4`, quadrant 2, so `-{√2}/{2}`. Tangent is sine over cosine: `tan(π/6) = {{1}/{2}}/{{√3}/{2}} = {√3}/{3}`. You’ll need all three ratios of `π/6`, `π/4` and `π/3` in this module.","Fractions and radicals":"To multiply radical fractions, multiply under the roots and multiply the denominators: `({√2}/{2})({√3}/{2}) = {√6}/{4}`. You can’t add or subtract under a root: `√6 - √2` stays as it is. To add fractions of π, use a common denominator: `π/4 + π/6 = 3π/12 + 2π/12 = 5π/12`. Never add the denominators. One more tool you’ll need for tangents: to clear a root from a denominator like `3 - √3`, multiply the top and bottom by `3 + √3`, because `(3 - √3)(3 + √3) = 9 - 3 = 6`.","One ratio from another":"`sin^2x + cos^2x = 1` gives the size of the missing ratio, and the quadrant gives its sign. If `sin x = {3}/{5}` in quadrant 2: `cos^2x = 1 - {9}/{25} = {16}/{25}`, so `cos x = -{4}/{5}` (cosine is negative in quadrant 2), and `tan x = {{3}/{5}}/{-{4}/{5}} = -{3}/{4}`.","Equivalent expressions":"A trig function never splits over + or −: `cos(π/2 - x)` is not `cos(π/2) - cos x`. Instead, `cos(π/2 - x) = sin x` and `sin(π/2 - x) = cos x` (the cofunction identities from module 27). Also, `cos(-x) = cos x` and `sin(-x) = -sin x`."}}},"explore":{"heading":"Compound angle visualiser","intro":"Put two angles on the unit circle and watch the height of the point. First test whether sines add. Then build the real formula, one triangle at a time.","ui":{"modes":["Does it add?","Build `a + b`","Build `a - b`"],"modeLabel":"Mode","sa":"Angle `a`","sb":"Angle `b`","stages":["Start with `a`","Turn on by `b`","Drop a perpendicular","The lower triangle","The upper triangle","Add it up"],"cap3":"In right triangle `OQP` the hypotenuse is 1, so its legs are `cos b` and `sin b`.","cap5":"`QP` is perpendicular to the `a` arm and `TP` is perpendicular to the `x`-axis, so the angle at `P` equals `a`.","signed":"(signed lengths: left and down count as negative)","showAll":"Show every step","nums":"Numbers on the picture","tan":"Tangent rows","pin":"Pin","unpin":"Clear pin","pinned":"Pinned:","clamp":"{v} set to {val}: Build modes use {range}","onAxis":"`a + b = π/2`: `P` is on the `y`-axis","top":"top of the circle","bottom":"bottom of the circle","over":"higher than any point on the circle","under":"lower than any point on the circle","col1":"`sin a + sin b`","col2":"`sin(a + b)`","measured":"measured height of `P`","rows":{"angles":"Angles","point":"Point `P`","height":"Height: `sin(a ± b)`","hp":"Pieces of the height","run":"Run: `cos(a ± b)`","rp":"Pieces of the run","tan":"`tan(a ± b)`","den":"Denominator","check":"Check","sum":"`sin a + sin b`","sinab":"`sin(a + b)`","verdict":"Verdict","cosrow":"`cos a + cos b` vs `cos(a + b)`","tally":"Tally"},"samePoint":"the same point as {v}","checkRow":"From the picture, `P`’s height is {v}. The formula agrees.","notSpecial":"{v} isn’t a special angle yet. You’ll find its exact values in Part 3.","notSpecial2":"{v} aren’t special angles yet. You’ll find their exact values in Part 3.","subAdds":"(`cos a` is negative, so subtracting it adds)","tanUndef":"undefined: {den} = 0","tanNo":"The tan formula can’t be used here ({which} is undefined). From the point: `sin(a ± b)/cos(a ± b)` {v}","undef":"undefined","notEqual":"Not equal: `sin a + sin b` is {gap} too {dir}.","big":"big","small":"small","equal":"Equal for this pair. One pair isn’t enough to trust a formula: try another.","tally":"Pairs tried: {n} · Pairs where the sines add: {m}"},"predictions":[{"id":"p1","fixedOrder":true,"start":{"mode":"add","a":4,"b":2,"hide":true},"prompt":"`sin(π/3) + sin(π/6) ≈ 1.37`. The `b` arm will now swing round to start from the `a` arm, so the new point is at `a + b`. What will `sin(a + b)` be?","options":[{"t":"about 0.37 (the difference of the heights)","_n":"ob2d","_k":"0ec84658"},{"t":"about 0.43 (the product of the heights)","_n":"pb5d","_k":"9e11475c"},{"t":"1","_n":"qb4d","_k":"41dcc353"},{"t":"about 1.37 (the sum of the heights)","_n":"rbfd","_k":"8b4a68cd"}],"explain":"`π/3 + π/6 = π/2`, so `P` is at the top of the circle and `sin(a + b) = 1`. Adding the heights gives about 1.37, higher than any point on the unit circle can be, so sines don’t add: `sin(a + b) ≠ sin a + sin b`. (0.37 is `sin a - sin b` and 0.43 is `sin a × sin b`; neither is the height of the new point either.)"},{"id":"p2","start":{"mode":"plus","a":4,"b":0,"all":true},"prompt":"The run of `P` is `cos a cos b - sin a sin b`. Keep `a = π/3` and turn `b` up to `π/3`. Where will `P` end up?","options":[{"t":"Right of the `y`-axis: the run stays positive","_n":"sbed","_k":"fdf9addb"},{"t":"On the `y`-axis","_n":"tb1d","_k":"331ffefc"},{"t":"Left of the `y`-axis: the backward piece wins","_n":"ub2d","_k":"514b9e05"},{"t":"Below the `x`-axis","_n":"vafd","_k":"85949514"}],"explain":"At `a = b = π/3`, `cos a cos b = {1}/{4}` and `sin a sin b = {3}/{4}`, so `cos(2π/3) = {1}/{4} - {3}/{4} = -{1}/{2}`. The minus sign in the cosine formula is the upper triangle stepping back to the left. Once that step is longer than the forward run, `P` crosses into quadrant 2."},{"id":"p3","start":{"mode":"plus","a":4,"b":2,"all":true},"prompt":"Now switch from `a + b` to `a - b`. The upper triangle will flip to the other side of the `a` arm. What happens to the two formulas?","options":[{"t":"In both formulas, both pieces change sign","_n":"wb0d","_k":"af38215a"},{"t":"In both formulas, only the second piece changes sign","_n":"xb5d","_k":"6007c0d7"},{"t":"Only the sine formula changes","_n":"yb6d","_k":"b2dbda62"},{"t":"Nothing: the formulas are the same for `a - b`","_n":"zb3d","_k":"c0160530"}],"explain":"The lower triangle doesn’t move: it still has hypotenuse `cos b` and angle `a`, so piece ① is the same. Only the upper triangle flips, so only its piece changes sign: `sin(a - b) = sin a cos b - cos a sin b` and `cos(a - b) = cos a cos b + sin a sin b`. Check with these angles: `sin(π/6) = {3}/{4} - {1}/{4} = {1}/{2}` ✓ and `cos(π/6) = {√3}/{4} + {√3}/{4} = {√3}/{2}` ✓."},{"id":"p4","start":{"mode":"plus","a":3,"b":0,"tan":true},"prompt":"`tan(a + b) = {tan a + tan b}/{1 - tan a tan b}`. Keep `a = π/4` and turn `b` from 0 up to `π/4`. What happens to `tan(a + b)`?","options":[{"t":"It grows to 2, because `tan a + tan b = 1 + 1`","_n":"10b4d","_k":"cc213b2c"},{"t":"It stays at 1","_n":"11b9d","_k":"a98e9aa4"},{"t":"It drops to 0","_n":"12bad","_k":"e6847a13"},{"t":"It grows without limit, and at `b = π/4` it is undefined","_n":"1333d","_k":"af6fd72c"}],"explain":"At `b = π/4`, `tan a tan b = 1 × 1 = 1`, so the denominator is 0 and `tan(a + b)` is undefined. The picture agrees: `a + b = π/2`, where the arm is vertical and tangent is undefined (module 26). Adding the tangents would give 2, but the true value isn’t even defined."}],"found":{"title":"What you found","score":"Your predictions: {n} of 4 matched","html":"\u003cul>\u003cli>`sin(a + b) ≠ sin a + sin b`. One counterexample (`a = π/3`, `b = π/6`) shows it.\u003c/li>\u003cli>\u003cstrong>Sine mixes and keeps the sign:\u003c/strong> `sin(a ± b) = sin a cos b ± cos a sin b`.\u003c/li>\u003cli>\u003cstrong>Cosine matches and switches the sign:\u003c/strong> `cos(a ± b) = cos a cos b ∓ sin a sin b`.\u003c/li>\u003cli>\u003cstrong>Tangent:\u003c/strong> `tan(a ± b) = {tan a ± tan b}/{1 ∓ tan a tan b}`, when `tan a` and `tan b` exist and the denominator isn’t 0.\u003c/li>\u003cli>The lower triangle gives the first piece of each formula; the upper triangle gives the second.\u003c/li>\u003c/ul>"},"derive":{"title":"Where the formulas come from","html":"\u003cp>\u003cstrong>From the picture:\u003c/strong> stages 1–6 give `sin(a + b)` and `cos(a + b)`.\u003c/p>\u003cp>\u003cstrong>From `a + b` to `a - b`:\u003c/strong> replace `b` with `-b`. Since `cos(-b) = cos b` and `sin(-b) = -sin b` (module 27), `cos(a - b) = cos a cos b + sin a sin b` and `sin(a - b) = sin a cos b - cos a sin b`.\u003c/p>\u003cp>\u003cstrong>Tangent:\u003c/strong> `tan(a + b) = {sin a cos b + cos a sin b}/{cos a cos b - sin a sin b}`. Divide every term by `cos a cos b`: `{tan a + tan b}/{1 - tan a tan b}`.\u003c/p>\u003cp>\u003cstrong>One formula gives all the others:\u003c/strong> start from `cos(a - b)`. Then `sin(a + b) = cos(π/2 - (a + b)) = cos((π/2 - a) - b) = cos(π/2 - a) cos b + sin(π/2 - a) sin b = sin a cos b + cos a sin b`, using the cofunction identities from module 27.\u003c/p>\u003cp>\u003cstrong>Check with numbers:\u003c/strong> `a = π/3`, `b = π/6` gives `sin(π/2) = ({√3}/{2})({√3}/{2}) + ({1}/{2})({1}/{2}) = {3}/{4} + {1}/{4} = 1` ✓.\u003c/p>"},"challenges":[{"id":"tc1","goal":[2,3],"prompt":"Land `P` on `7π/12` \u003cstrong>twice\u003c/strong>: once in Build `a + b` mode and once in Build `a - b` mode, using only special angles (multiples of `π/6` or `π/4`) for `a` and `b`, with neither of them 0. Set the first build and press \u003cstrong>Pin\u003c/strong> (the pinned build stays drawn faintly), switch modes, set the second build, then press \u003cstrong>Check challenge\u003c/strong>.","why":"`sin(7π/12) = {√6 + √2}/{4}` and `cos(7π/12) = {√2 - √6}/{4}`, both ways. ✓ Two different splits land on the same point, so the formulas must give the same exact values.","msgs":{"nonSpecial":"`π/12` and `5π/12` aren’t special angles, so their exact values aren’t known yet. Use multiples of `π/6` or `π/4`.","same":"Both your builds use {op}. Make the second one in the other Build mode.","sumAngles":"In `a - b` mode you get {calc}. Here `a` has to be bigger than `7π/12`.","five":"{calc}. You need `7π/12`.","other":"Your build lands on {v}. Write `7π/12` and the special angles with denominator 12, then look for two that make 7.","pin":"Press \u003cstrong>Pin\u003c/strong> to keep this build, then make the second one in the other Build mode.","mode":"Switch to a Build mode: this challenge uses Build `a + b` and Build `a - b`."},"hints":["Write the special angles with denominator 12: `π/6 = 2π/12`, `π/4 = 3π/12`, `π/3 = 4π/12`, `π/2 = 6π/12`, `2π/3 = 8π/12`, `3π/4 = 9π/12`, `5π/6 = 10π/12`, `π = 12π/12`.","For `a + b`, find two that add to 7: 4 + 3. For `a - b`, find two that differ by 7, with `b` no bigger than 6: 9 − 2 or 10 − 3.","Pin `a = π/3`, `b = π/4` in `a + b` mode. Then set `a = 3π/4`, `b = π/6` in `a - b` mode."]},{"id":"tc2","goal":[1,5],"prompt":"In Build `a + b` mode, make the two pieces of the height exactly \u003cstrong>equal\u003c/strong> (bars ① and ② the same length) \u003cstrong>and\u003c/strong> put `P` at height exactly `{√3}/{2}`. Two conditions at once: reason about each one before you move the sliders.","why":"When `a = b`, both pieces are `sin a cos a`, so `sin(a + a) = 2 sin a cos a`. That’s the \u003cstrong>double-angle formula\u003c/strong> for sine. Here `2a` is `π/3` or `2π/3`, the two angles from 0 to π whose sine is `{√3}/{2}`, so both builds work. Part 3 shows the double angle from another angle.","msgs":{"eqWrong":"Your pieces are equal, so the height is `sin a cos a + cos a sin a = 2 sin a cos a = sin 2a` = {v}. You need `{√3}/{2}`. Which angles `2a` have sine `{√3}/{2}`?","heightOnly":"`P` is at height `{√3}/{2}`, but the pieces are ① {p1} and ② {p2}. Equal pieces need `sin a cos b = cos a sin b`.","close":"Close: ① {p1} and ② {p2}. Look at the two angles you’ve chosen.","other":"① = `sin a cos b` {p1} and ② = `cos a sin b` {p2}, and `P`’s height is {h}. Start with the pieces: divide both by `cos a cos b`. What has to be true about `tan a` and `tan b`?","mode":"Switch to Build `a + b` mode: this challenge uses its two pieces."},"hints":["Piece ① is `sin a cos b` and piece ② is `cos a sin b`. When are they equal? Then what does the height become?","If `cos a` and `cos b` aren’t 0, divide both pieces by `cos a cos b`: you need `tan a = tan b`, so `a = b`. Then the height is `sin a cos a + cos a sin a = 2 sin a cos a`.","The height is `sin(a + a) = sin 2a`. You need `sin 2a = {√3}/{2}`, so `2a = π/3` or `2π/3`. Set `a = b = π/6`: both pieces are `({1}/{2})({√3}/{2}) = {√3}/{4}`, and `{√3}/{4} + {√3}/{4} = {√3}/{2}`. (`a = b = π/3` works too.)"]},{"id":"tc3","goal":1,"stretch":true,"prompt":"In Does it add? mode, find `a` and `b`, neither of them 0 or `2π`, that make `sin(a + b) = sin a + sin b` \u003cstrong>exactly\u003c/strong>. The tally keeps counting the pairs you try; with 23 × 23 non-zero pairs, a random search is slow, so reason first.","why":"Both sides are 0. `sin(2π) = 0`, and `sin b = sin(2π - a) = -sin a`, so the two heights cancel. The equation holds for these pairs and fails for almost every other pair, so it isn’t an identity: one counterexample, such as `a = π/3` and `b = π/6`, is enough to show that.","msgs":{"half":"`sin(a + b)` = {s} = 0 now, but `sin a + sin b = 2 sin a`, which isn’t 0. Can you make the two heights cancel instead?","cancel":"The heights cancel, so `sin a + sin b = 0`. But `a + b` = {v}, and {sv}, not 0. You need the compound angle to land where sine is 0 too.","other":"Here {l} and {r}. Instead of trying pairs at random, look for a way to make both sides 0.","zero":"Those sides match, but the challenge rules out 0 and `2π`: with an angle of 0 the equation only says `sin b = sin b`. Choose two angles that aren’t 0 or `2π`.","mode":"Switch to Does it add? mode: this challenge compares `sin(a + b)` with `sin a + sin b`."},"hints":["Two different numbers rarely match by luck. Try to make both sides equal 0.","`sin a + sin b = 0` when the two heights cancel: `b = 2π - a` (a mirror image in the `x`-axis), or `b = a ± π` (half a turn apart). Which of those also makes `sin(a + b) = 0`?","With `b = 2π - a`, `a + b = 2π` and `sin(2π) = 0`. For example, `a = π/3` and `b = 5π/3`: both sides are 0."]}]},"part3":{"slug":"exact","name":"Exact values","heading":"Exact values: split an angle, double an angle","intro":"The special angles give 16 exact points on the unit circle. Split each new angle into two special angles to find 8 more. Then see what happens when an angle is doubled.","views":["The `π/12` clock","Double-angle lab"],"viewLabel":"View","clock":{"start":"Tap the next “?” dot to start round {n}: find {f}.","order":"Rounds go in order: tap the {v} dot first.","roundHead":"Round {n} of 4: find {f}","labels":"Show all labels","steps":["Split it","Choose the formula","Fill in the values","Multiply and combine"],"tilesA":"Tiles for `a`","op":"Operation","tilesB":"Tiles for `b`","turn":"Turn","hit":"{calc}.","miss":"{calc}. You need {t}{tip}","trySub":": try subtracting.","tryAdd":": try adding.","special":"{calc}. That’s a special angle you already know; you need {t}.","fSin":{"ok":"Sine mixes the pairs and keeps the sign of {op}.","sign":"That’s {other}. The sine formula keeps the operation’s sign.","cross":"That’s {other}. You’re finding a sine, so the pairs are mixed: sin·cos and cos·sin.","split":"Sine doesn’t split over a {word}. {expr} ≈ {v}, but the point’s height is about {h}."},"fCos":{"ok":"Cosine matches the pairs and switches the sign of {op}.","sign":"That keeps the operation’s sign; cosine switches it.","cross":"You’re finding a cosine: the pairs match, cos·cos and sin·sin.","split":"Cosine doesn’t split over a {word}. {expr} ≈ {v}, but the point’s `x`-coordinate is about {h}."},"sum":"sum","diff":"difference","slotHow":"Tap a slot, then tap a value from the exact-value palette.","palette":"Exact-value palette","slotSign":"{f} has the right size, but {ang} is in quadrant {q}, where {r} is {pn}.","slotSwap":"That’s {f}. For `π/6`, sine is the short side `{1}/{2}` and cosine is `{√3}/{2}`; for `π/3` it’s the other way round.","slotFam":"That value belongs to the {fam} family. {ang} has reference angle {ref}.","fam":{"h":"`π/6` and `π/3`","r2":"`π/4`","ax":"axis angles (0, `π/2`, `π`)"},"positive":"positive","negative":"negative","slotsDone":"✓ All four values are right.","other":"and {expr} = {v}, worked out for you","rounds":[{"k":1,"r":"sin","combine":[{"t":"`{√6 - √2}/{4}`","why":"`({√2}/{2})({√3}/{2}) = {√6}/{4}` and `({√2}/{2})({1}/{2}) = {√2}/{4}`, so the difference is `{√6 - √2}/{4} ≈ 0.259`.","_n":"1432d","_k":"10c5bac2"},{"t":"`{√4}/{4} = {1}/{2}`","why":"You can’t subtract under the root: `√6 - √2 ≈ 1.035`, not `√4 = 2`. And `sin(π/12)` can’t be `{1}/{2}`, which is `sin(π/6)`.","_n":"1531d","_k":"0fee6ee7"},{"t":"`{√5 - √2}/{4}`","why":"`√2 × √3` multiplies under the root: `√6`, not `√5`.","_n":"1630d","_k":"7070f3c1"},{"t":"`{√6 - √2}/{2}`","why":"Both denominators are 2, so each product has denominator 4.","_n":"1737d","_k":"62957c7f"}],"hints":["Write `π/12` with denominator 12 and look for two special angles whose numerators differ by 1.","`π/4 = 3π/12` and `π/6 = 2π/12`, so `π/12 = π/4 - π/6`. You need `sin(a - b) = sin a cos b - cos a sin b`.","`sin(π/4)cos(π/6) - cos(π/4)sin(π/6) = ({√2}/{2})({√3}/{2}) - ({√2}/{2})({1}/{2}) = {√6}/{4} - {√2}/{4} = {√6 - √2}/{4}`."]},{"k":5,"r":"cos","combine":[{"t":"`{√6 - √2}/{4}`","why":"The two products are `{√6}/{4}` and `{√2}/{4}`, and the `{√2}/{4}` piece counts as negative (the formula subtracts it, or one of its factors is negative), so the result is `{√6 - √2}/{4} ≈ 0.259`. It’s small and positive, as it should be just below `π/2`.","_n":"1836d","_k":"4cdfb222"},{"t":"`{√6 + √2}/{4}`","why":"That’s `cos(π/12)`, which equals `sin(5π/12)`. The `{√2}/{4}` piece counts as negative: check its sign on screen before you combine.","_n":"1935d","_k":"bf99a9a7"},{"t":"`{1}/{2}`","why":"You can’t subtract under the root: `√6 - √2` isn’t `√4`. And `cos(5π/12)` can’t be `{1}/{2}`, which is `cos(π/3)`.","_n":"1a34d","_k":"f78ef256"},{"t":"`{√6 - √2}/{2}`","why":"Each product has denominator 2 × 2 = 4, not 2.","_n":"1b3bd","_k":"f66b96b7"}],"hints":["Write `5π/12` with denominator 12. Which special numerators add to 5?","`π/6 + π/4 = 2π/12 + 3π/12`. You need `cos(a + b) = cos a cos b - sin a sin b`.","`cos(π/6)cos(π/4) - sin(π/6)sin(π/4) = ({√3}/{2})({√2}/{2}) - ({1}/{2})({√2}/{2}) = {√6}/{4} - {√2}/{4} = {√6 - √2}/{4}`. It’s small and positive, as it should be just below `π/2`."]},{"k":7,"r":"cos","combine":[{"t":"`{√2 - √6}/{4}`","why":"The products are `{√2}/{4}` and `{√6}/{4}`, and the `{√6}/{4}` piece counts as negative, so the result is `{√2 - √6}/{4} ≈ -0.259`. It’s negative, as a cosine past `π/2` must be.","_n":"1c3ad","_k":"5fcd43ca"},{"t":"`{√6 - √2}/{4}`","why":"That’s the right size but positive, and `7π/12` is past `π/2`, so its cosine must be negative. The `{√6}/{4}` piece is the one that counts as negative.","_n":"1dadc","_k":"1a8cc8a4"},{"t":"`-{1}/{2}`","why":"You can’t combine `√2 - √6` under one root: it isn’t `-√4`. The exact value stays as `{√2 - √6}/{4}`.","_n":"1eaec","_k":"dcf70158"},{"t":"`{√2 + √6}/{4}`","why":"That adds both products, but the `{√6}/{4}` piece counts as negative (check its sign on screen). A cosine past `π/2` can’t be positive.","_n":"1fafc","_k":"bca25950"}],"hints":["Write `7π/12` with denominator 12. Which special numerators add to 7?","`π/3 + π/4 = 4π/12 + 3π/12`. You need `cos(a + b) = cos a cos b - sin a sin b`.","`cos(π/3)cos(π/4) - sin(π/3)sin(π/4) = ({1}/{2})({√2}/{2}) - ({√3}/{2})({√2}/{2}) = {√2}/{4} - {√6}/{4} = {√2 - √6}/{4}`. It’s negative, as it should be past `π/2`."]},{"k":11,"r":"sin","combine":[{"t":"`{√6 - √2}/{4}`","why":"The products are `{√6}/{4}` and `-{√2}/{4}`, so the result is `{√6 - √2}/{4} ≈ 0.259`: positive, as a sine in quadrant 2 must be.","_n":"1gb0c","_k":"8ab00dfd"},{"t":"`{√6 + √2}/{4}`","why":"`cos(2π/3)` and `cos(3π/4)` are negative, so the second product is negative. Check its sign before you combine.","_n":"1hb1c","_k":"2b91d7ec"},{"t":"`-{√6 - √2}/{4}`","why":"`11π/12` is in quadrant 2, where sine is positive.","_n":"1ib2c","_k":"c54115ce"},{"t":"`{1}/{2}`","why":"You can’t subtract under the root: `√6 - √2` isn’t `√4`. And `sin(11π/12)` can’t be `{1}/{2}`, which is `sin(5π/6)`.","_n":"1jb3c","_k":"9148b134"}],"hints":["Write `11π/12` with denominator 12. Which special numerators add to 11?","`2π/3 + π/4 = 8π/12 + 3π/12`. You need `sin(a + b) = sin a cos b + cos a sin b`.","`sin(2π/3)cos(π/4) + cos(2π/3)sin(π/4) = ({√3}/{2})({√2}/{2}) + (-{1}/{2})({√2}/{2}) = {√6}/{4} - {√2}/{4} = {√6 - √2}/{4}`. It’s positive, as a sine in quadrant 2 must be."]}],"reflect":{"title":"Reflect to finish","intro":"The lower four dots fill by symmetry instead of new splits. Choose each angle’s reference angle and the signs of its sine and cosine, then press Check.","cols":["Angle","reference angle","sign of sin","sign of cos"],"check":"Check","rows":[{"k":13,"ref":1,"s":"−","c":"−","fb":"`13π/12` is `π + π/12`: a half turn, so both coordinates change sign."},{"k":17,"ref":5,"s":"−","c":"−","fb":"`17π/12` is `π + 5π/12`: a half turn, so both coordinates change sign."},{"k":19,"ref":5,"s":"−","c":"+","fb":"`19π/12` is `2π - 5π/12`: a reflection in the `x`-axis, so sine changes sign and cosine keeps it."},{"k":23,"ref":1,"s":"−","c":"+","fb":"`23π/12` is `2π - π/12`: a reflection in the `x`-axis, so sine changes sign and cosine keeps it."}],"good":"✓ All four rows are right. The last four dots are filled."},"done":"24 angles, 24 exact points. Every new coordinate is `±{√6 + √2}/{4} ≈ ±0.966` or `±{√6 - √2}/{4} ≈ ±0.259`.","summary":"`π/12` clock (rounds right first try)","dbl":{"title":"Check it with a double angle","html":"`2 sin(π/12) cos(π/12) = 2 × {√6 - √2}/{4} × {√6 + √2}/{4} = 2 × {6 - 2}/{16} = {1}/{2}`, and that’s `sin(π/6)`. Doubling `π/12` gives `π/6`. The next view shows why this works."}},"lab":{"theta":"Angle `@t{θ}`","compare":"Compare with `2 sin θ`","stages":["Double the angle","Join `A` to `P`","Measure the chord","Height and run"],"caps":["The arm `OP` turns through `2θ`.","`OA = OP = 1`, so triangle `AOP` is isosceles and its angles at `A` and `P` are equal. Together they make the outside angle `2θ` at `O`, so each one is `θ`.","Triangle `AMO` has hypotenuse 1 and angle `θ` at `A`, so `AM = cos θ` and the chord is `AP = 2 cos θ`.","In right triangle `AFP` (hypotenuse `2 cos θ`, angle `θ` at `A`): the height `FP = 2 cos θ sin θ`, and the run `AF = 2 cos θ cos θ = 2cos^2θ`. Since `A` is at `x = -1` and `F` is at `x = cos 2θ`, `AF = 1 + cos 2θ`. `1 + cos 2θ = 2cos^2θ`, so `cos 2θ = 2cos^2θ - 1`."],"flat":"(the triangle is flat at this end of the slider)","heightLab":"`sin 2θ = 2 sin θ cos θ`","chordLab":"`2 cos θ`","runLab":"`2cos^2θ`","cmpLab":"`2 sin θ`: not the height of `P`","rows":{"angles":"Angles","chord":"Chord `AP = 2 cos θ`","height":"Height of `P` = `sin 2θ`","prod":"`2 sin θ cos θ`","cos3":"`cos 2θ`, three ways","tan":"`tan 2θ = {2 tan θ}/{1 - tan^2θ}`","two":"`2 sin θ`"},"allThree":"all three ways (exactly {v}, since `2θ` = {ang})","tanUndef":"undefined: the denominator `1 - tan^2θ` is 0","tanNo":"The formula can’t be used here (`tan θ` is undefined). From the point: `tan 2θ = tan π = 0`.","tanExact":"(exact, since `2θ` = {ang} is special)","more":", which is more than `sin 2θ` {v}","same":", the same as `sin 2θ`","alg":{"title":"Check it with algebra","html":"\u003cp>Set `b = a = θ` in the compound angle formulas.\u003c/p>\u003cp>`sin 2θ = sin(θ + θ) = sin θ cos θ + cos θ sin θ =` \u003cstrong>`2 sin θ cos θ`\u003c/strong>.\u003c/p>\u003cp>`cos 2θ = cos(θ + θ) = cos θ cos θ - sin θ sin θ =` \u003cstrong>`cos^2θ - sin^2θ`\u003c/strong>.\u003c/p>\u003cp>Replace `sin^2θ` with `1 - cos^2θ`: `cos 2θ =` \u003cstrong>`2cos^2θ - 1`\u003c/strong>. Replace `cos^2θ` with `1 - sin^2θ`: `cos 2θ =` \u003cstrong>`1 - 2sin^2θ`\u003c/strong>.\u003c/p>\u003cp>`tan 2θ = {tan θ + tan θ}/{1 - tan θ tan θ} =` \u003cstrong>`{2 tan θ}/{1 - tan^2θ}`\u003c/strong>.\u003c/p>\u003cp>Check with `θ = π/6`: `sin(π/3) = 2 × {1}/{2} × {√3}/{2} = {√3}/{2}` ✓.\u003c/p>"}},"blocks":[{"title":"What the formulas mean","html":"\u003cp>\u003cstrong>Exact values in four steps\u003c/strong>\u003c/p>\u003col>\u003cli>Write the angle with denominator 12 and split it into two special angles (a sum or a difference).\u003c/li>\u003cli>Choose the formula: sine mixes and keeps the sign; cosine matches and switches it.\u003c/li>\u003cli>Fill in the special values, with CAST signs.\u003c/li>\u003cli>Multiply under the roots, put everything over 4, and check the sign against the quadrant.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Tangent values:\u003c/strong> use `tan(a ± b) = {tan a ± tan b}/{1 ∓ tan a tan b}`, then clear the root from the denominator with a difference of squares. Example: `tan(5π/12) = tan(π/4 + π/6) = {1 + {√3}/{3}}/{1 - {√3}/{3}}`. Multiply the top and bottom by 3: `{3 + √3}/{3 - √3}`. Multiply the top and bottom by `3 + √3`: `{9 + 6√3 + 3}/{9 - 3} = {12 + 6√3}/{6} = 2 + √3`. (Or divide: tan = sin/cos, with the values from the clock.)\u003c/p>\u003cp>\u003cstrong>Double angles:\u003c/strong> `sin 2θ = 2 sin θ cos θ`; `cos 2θ = cos^2θ - sin^2θ = 2cos^2θ - 1 = 1 - 2sin^2θ`; `tan 2θ = {2 tan θ}/{1 - tan^2θ}`. Choose the form of `cos 2θ` that uses the ratio you’re given.\u003c/p>"}],"quickCheck":{"title":"Exact values","summary":"Exact values quick check","items":[{"id":"q1","goal":3,"prompt":"Which split turns `7π/12` into two special angles?","choices":[{"t":"`π/2 + π/12`","fb":"That adds to `7π/12`, but `π/12` isn’t a special angle, so you don’t know its values to start with.","_n":"1kb4c","_k":"f45b33d2"},{"t":"`π/3 + π/4`","fb":"Right: `4π/12 + 3π/12 = 7π/12`, and both parts are special.","_n":"1lb5c","_k":"5e502667"},{"t":"`π/2 + π/6`","fb":"`6π/12 + 2π/12 = 8π/12 = 2π/3`.","_n":"1mb6c","_k":"577957ae"},{"t":"`π/4 + π/6`","fb":"`3π/12 + 2π/12 = 5π/12`, not `7π/12`.","_n":"1n3fd","_k":"d65067df"}]},{"id":"q2","goal":5,"prompt":"`sin θ = {3}/{5}` and `θ` is acute. What is `sin 2θ`?","choices":[{"t":"`{12}/{25}`","fb":"`sin θ cos θ` is only half of `sin 2θ`. Don’t forget the 2.","_n":"1o3ed","_k":"541ae1c5"},{"t":"`{6}/{5}`","fb":"`2 sin θ = {6}/{5}` is bigger than 1, so it can’t be a sine. Doubling the angle doesn’t double the sine.","_n":"1p41d","_k":"e936c19b"},{"t":"`{24}/{25}`","fb":"Right: `cos θ = {4}/{5}`, so `sin 2θ = 2 × {3}/{5} × {4}/{5} = {24}/{25}`.","_n":"1q40d","_k":"22cf4a98"},{"t":"`{7}/{25}`","fb":"That’s `cos 2θ = cos^2θ - sin^2θ = {16}/{25} - {9}/{25}`.","_n":"1r43d","_k":"64aaad03"}]},{"id":"q3","goal":5,"prompt":"`cos θ = {1}/{4}`. What is `cos 2θ`?","choices":[{"t":"`{7}/{8}`","fb":"`1 - 2cos^2θ` is the negative of `cos 2θ`. The sin form is `1 - 2sin^2θ`; the cos form is `2cos^2θ - 1`.","_n":"1s42d","_k":"621758fb"},{"t":"`-{1}/{2}`","fb":"`2 cos θ - 1` forgets to square: it’s `2cos^2θ - 1`.","_n":"1t45d","_k":"6a1bc4bb"},{"t":"`-{7}/{8}`","fb":"Right: use the form with cos: `2cos^2θ - 1 = {2}/{16} - 1 = -{7}/{8}`.","_n":"1u44d","_k":"12ca3a68"},{"t":"`{1}/{2}`","fb":"`2 cos θ` doubles the ratio, not the angle.","_n":"1v37d","_k":"d3975e1e"}]},{"id":"q4","goal":5,"fixedOrder":true,"prompt":"`2 sin(π/12) cos(π/12) = ?`","choices":[{"t":"`{1}/{4}`","fb":"`sin(π/12) cos(π/12)` alone is `{1}/{4}`; the 2 doubles it.","_n":"1w36d","_k":"e481b726"},{"t":"`{1}/{2}`","fb":"Right: `2 sin θ cos θ = sin 2θ`, so this is `sin(π/6) = {1}/{2}`.","_n":"1x39d","_k":"cb52d4a5"},{"t":"`{√3}/{2}`","fb":"That’s `cos(π/6)`. `2 sin θ cos θ` is the sine of `2θ`.","_n":"1y3ad","_k":"247344e3"},{"t":"1","fb":"`sin^2θ + cos^2θ = 1`, but this is `2 sin θ cos θ`, a different expression.","_n":"1z37d","_k":"a171c042"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Name that compound angle","summary":"Name that compound angle","goal":[2,1],"instruction":"Sort each expression into the box for the single compound angle it equals.","how":"Tap an expression, then tap the box it belongs in.","noun":"expression","boxes":[{"id":"b1","label":"`sin(a + b)`"},{"id":"b2","label":"`sin(a - b)`"},{"id":"b3","label":"`cos(a + b)`"},{"id":"b4","label":"`cos(a - b)`"}],"items":[{"id":"s1","t":"`sin a cos b + cos a sin b`","_a":"QwQDQA==","why":"Mixed pairs mean sine, and the + matches `a + b`.","wrong":{"b2":"The sine formula keeps the sign: + between the pieces means `sin(a + b)`, − means `sin(a - b)`.","b3":"Look at the a function. The distributive law doesn’t apply.","_n":"3p15d","_k":"75b24ac6"},{"t":"“Try `a = π/3` and `b = π/6`: the sides are 1 and about 1.37. But one example can’t prove anything, so we can’t tell.”","why":"One example can’t prove an identity, but one counterexample \u003cstrong>can\u003c/strong> disprove it.","_n":"3q14d","_k":"51f63022"},{"t":"“Try `a = π/2` and `b = 3π/2`: `sin(2π) = 0` and `sin(π/2) + sin(3π/2) = 1 - 1 = 0`. The sides match, so the claim is true.”","why":"One matching pair proves nothing. An identity has to hold for \u003cstrong>every\u003c/strong> pair.","_n":"3r17d","_k":"383d9cb2"}]},"b":{"prompt":"A classmate claims `cos(a - b) = cos a - cos b` for all angles. Which is the best response?","options":[{"t":"“Try `a = b = π/3`: `cos 0 = 1`, but `cos(π/3) - cos(π/3) = 0`. One pair where the sides differ shows the claim is false.”","why":"One counterexample is enough to show an equation isn’t an identity.","_n":"3s16d","_k":"0af43e21"},{"t":"“Use the distributive law: `cos(a - b) = cos·a - cos·b`, so the claim is true.”","why":"cos is a function, not a number you multiply by.","_n":"3t11d","_k":"df53c506"},{"t":"“Try `a = b = π/3`: the sides are 1 and 0. But one example can’t prove anything, so we can’t tell.”","why":"One example can’t prove an identity, but one counterexample \u003cstrong>can\u003c/strong> disprove it.","_n":"3u10d","_k":"ca05257a"},{"t":"“Try `a = π/2` and `b = 3π/4`: `cos(-π/4) = {√2}/{2}` and `cos(π/2) - cos(3π/4) = 0 + {√2}/{2} = {√2}/{2}`. The sides match, so the claim is true.”","why":"One matching pair proves nothing. An identity has to hold for \u003cstrong>every\u003c/strong> pair.","_n":"3v0fc","_k":"e45d0d55"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which line of working finds `sin(7π/12)` correctly?","options":[{"t":"`sin(7π/12) = sin(3π/4) - sin(π/6) = {√2}/{2} - {1}/{2} = {√2 - 1}/{2}`","why":"Sine doesn’t split over a difference.","_n":"3w10c","_k":"ceef2489"},{"t":"`sin(7π/12) = sin(3π/4 - π/6) = sin(3π/4) cos(π/6) - cos(3π/4) sin(π/6) = ({√2}/{2})({√3}/{2}) - ({√2}/{2})({1}/{2}) = {√6 - √2}/{4}`","why":"`cos(3π/4)` is `-{√2}/{2}`: `3π/4` is in quadrant 2.","_n":"3x11c","_k":"5dec4a1b"},{"t":"`sin(7π/12) = sin(π/3 + π/4) = sin(π/3) cos(π/4) + cos(π/3) sin(π/4) = {√6}/{4} + {√2}/{4} = {√8}/{4} = {√2}/{2}`","why":"Everything is right until the last step: `√6 + √2` can’t be combined under one root.","_n":"3y12c","_k":"efc6a5c9"},{"t":"`sin(7π/12) = sin(3π/4 - π/6) = sin(3π/4) cos(π/6) - cos(3π/4) sin(π/6) = ({√2}/{2})({√3}/{2}) - (-{√2}/{2})({1}/{2}) = {√6 + √2}/{4}`","why":"Right split, right formula, right signs: subtracting the negative product adds it.","_n":"3z13c","_k":"9dc42514"}]},"b":{"prompt":"Which line of working finds `cos(11π/12)` correctly?","options":[{"t":"`cos(11π/12) = cos(3π/4 + π/6) = cos(3π/4) cos(π/6) - sin(3π/4) sin(π/6) = -{√6}/{4} - {√2}/{4} = -{√8}/{4} = -{√2}/{2}`","why":"Everything is right until the last step: `√6 + √2` can’t be combined under one root.","_n":"4014c","_k":"0f7f8ee7"},{"t":"`cos(11π/12) = cos(2π/3) + cos(π/4) = -{1}/{2} + {√2}/{2} = {√2 - 1}/{2}`","why":"Cosine doesn’t split over a sum.","_n":"4115c","_k":"e91d3393"},{"t":"`cos(11π/12) = cos(2π/3 + π/4) = cos(2π/3) cos(π/4) - sin(2π/3) sin(π/4) = (-{1}/{2})({√2}/{2}) - ({√3}/{2})({√2}/{2}) = -{√2 + √6}/{4}`","why":"Right split, right formula, right signs.","_n":"4216c","_k":"8f135068"},{"t":"`cos(11π/12) = cos(2π/3 + π/4) = cos(2π/3) cos(π/4) - sin(2π/3) sin(π/4) = ({1}/{2})({√2}/{2}) - ({√3}/{2})({√2}/{2}) = {√2 - √6}/{4}`","why":"`cos(2π/3)` is `-{1}/{2}`: `2π/3` is in quadrant 2.","_n":"4307c","_k":"524c4bc4"}]}},{"id":"a1","cat":"A","goal":3,"a":{"fixedOrder":true,"prompt":"A crane’s boom is 8 m long. It is raised to an angle of `7π/12` measured from the ground in the forward direction, so it leans slightly backward past vertical. How far behind the pivot is the tip, measured horizontally?","options":[{"t":"`{√6 - √2}/{4}` m","why":"That’s `|cos(7π/12)|` on the unit circle. Multiply by the boom’s length, 8 m.","_n":"4408c","_k":"5874dd04"},{"t":"`2√6 - 2√2` m","why":"`cos(7π/12) = cos(π/3 + π/4) = ({1}/{2})({√2}/{2}) - ({√3}/{2})({√2}/{2}) = {√2 - √6}/{4}`, which is negative: the tip is behind the pivot. `8 × {√6 - √2}/{4} = 2√6 - 2√2 ≈ 2.07` m, a short distance, as you’d expect for a boom only `π/12` past vertical.","_n":"4515c","_k":"fd9ba11c"},{"t":"`2√6 + 2√2` m","why":"That uses + in `cos(a + b)`. Cosine switches the sign.","_n":"4614c","_k":"318cc529"},{"t":"`4 + 4√2` m","why":"That’s `8(cos(π/3) + cos(π/4)) ≈ 9.66` m, longer than the 8 m boom itself.","_n":"4713c","_k":"c05395df"}]},"b":{"fixedOrder":true,"prompt":"A crane’s boom is 12 m long. It is lowered backward to an angle of `11π/12`, measured from the ground in the forward direction, so it points back and slightly up. How far behind the pivot is the tip, measured horizontally?","options":[{"t":"`{√6 + √2}/{4}` m","why":"That’s `|cos(11π/12)|` on the unit circle. Multiply by the boom’s length, 12 m.","_n":"4812c","_k":"4e3c7945"},{"t":"`6√2 - 6` m","why":"That’s `12(cos(2π/3) + cos(π/4))`. Cosine doesn’t split over a sum, and that value is positive, which would put the tip in front of the pivot.","_n":"4919c","_k":"94fa286f"},{"t":"`3√6 - 3√2` m","why":"That’s `12 × {√6 - √2}/{4}`. It comes from using + between the products in `cos(2π/3 + π/4)`, or from taking `cos(2π/3)` as `+{1}/{2}`. Cosine switches the sign, and `cos(2π/3) = -{1}/{2}`.","_n":"4a18c","_k":"af438fee"},{"t":"`3√6 + 3√2` m","why":"`cos(11π/12) = cos(2π/3 + π/4) = (-{1}/{2})({√2}/{2}) - ({√3}/{2})({√2}/{2}) = -{√6 + √2}/{4}`, which is negative: the tip is behind the pivot. `12 × {√6 + √2}/{4} = 3√6 + 3√2 ≈ 11.59` m, almost the whole 12 m, as you’d expect for a boom only `π/12` above the ground.","_n":"4b17c","_k":"33de3465"}]}},{"id":"a2","cat":"A","goal":5,"a":{"fixedOrder":true,"prompt":"For one kicking speed, a soccer ball’s horizontal range is `R = 40 sin 2θ` metres, where `θ` is the launch angle. A player kicks at an angle with `tan θ = {3}/{4}`. How far does the ball travel?","options":[{"t":"11.2 m","why":"That’s `40 cos 2θ = 40 × {7}/{25}`.","_n":"4c16c","_k":"714dbe0e"},{"t":"24 m","why":"That’s `40 sin θ`. The formula uses the double angle.","_n":"4d0dc","_k":"c2022e88"},{"t":"38.4 m","why":"`tan θ = {3}/{4}` gives `sin θ = {3}/{5}` and `cos θ = {4}/{5}`, so `sin 2θ = 2 × {3}/{5} × {4}/{5} = {24}/{25}` and `R = 40 × {24}/{25} = 38.4` m.","_n":"4e0cc","_k":"72bbff5d"},{"t":"48 m","why":"That’s `40 × 2 sin θ`. The range can’t be more than 40 m, because `sin 2θ` is at most 1.","_n":"4f1bc","_k":"fa664a3b"}]},"b":{"fixedOrder":true,"prompt":"For one kicking speed, a soccer ball’s horizontal range is `R = 50 sin 2θ` metres, where `θ` is the launch angle. A player kicks at an angle with `tan θ = {4}/{3}`. How far does the ball travel?","options":[{"t":"−14 m","why":"That’s `50 cos 2θ = 50 × (-{7}/{25})`. A range can’t be negative.","_n":"4g1cc","_k":"52f1c4df"},{"t":"40 m","why":"That’s `50 sin θ`. The formula uses the double angle.","_n":"4h19c","_k":"7bd3d532"},{"t":"48 m","why":"`tan θ = {4}/{3}` gives `sin θ = {4}/{5}` and `cos θ = {3}/{5}`, so `sin 2θ = {24}/{25}` and `R = 50 × {24}/{25} = 48` m.","_n":"4i1ac","_k":"95f73b64"},{"t":"80 m","why":"That’s `50 × 2 sin θ`. The range can’t be more than 50 m, because `sin 2θ` is at most 1.","_n":"4j17c","_k":"20f56ffa"}]}}]},"task":{"title":"Set the question","summary":"Set the question","statement":"\u003cp>Write an exact-value question for a classmate. Choose an angle `x` that isn’t a special angle, a split of `x` into two special angles `a` and `b` that sit in \u003cstrong>different quadrants\u003c/strong>, and a ratio (sin, cos or tan) that is \u003cstrong>negative\u003c/strong> at `x`. Then give the answer key. There are many good questions. Can you write one for each ratio?\u003c/p>","ui":{"x":"Angle `x`","a":"Angle `a`","b":"Angle `b`","op":"Operation","ratio":"Ratio","key":"Answer key","keyPick":"Choose the exact value","keyNote":"Tangent keys have no root in the denominator. Clear it with a difference of squares, as in Part 3’s “Tangent values”.","pq":"For `a` and `b`: a whole number from 0 to 24 on top, and the denominator from the menu.","live":"Your question: Find the exact value of {rx}, using {eq}.","liveWait":"Your question appears here once every box is filled.","cot":"Same point, different angle: {eq}.","pending":"checked when you press Check my design","fill":"Fill in every box first: `x`, `a`, `b`, the operation, the ratio and the answer key.","quad":"in quadrant {n}","axis":"on an axis","outside":"outside 0 to 2π","firstYes":"yes","firstNo":"no","firstNot":"not checked yet","line":"Set the question: {s}; answer key right on the first check: {f}","solved":"solved ({q})","notSolved":"not solved yet"},"checks":["`x` is not a special angle","`a` and `b` are special angles, off the axes, in different quadrants","`a ± b = x`","Your ratio is negative at `x`","Your answer key is the exact value"],"tips":["`x` must be a multiple of `π/12` that isn’t a multiple of `π/6` or `π/4`, like `7π/12` or `13π/12`. `2π/12 = π/6` and `3π/12 = π/4` are special angles that don’t need a formula.","Use multiples of `π/6` or `π/4` that aren’t on an axis, in different quadrants. Right now `a` is {qa} and `b` is {qb}.","Right now {ab} = {v}. Write all three angles with denominator 12 and compare the numerators.","{rx} is positive: `x` is in quadrant {n}, where {r} is positive. Use CAST to find where your ratio is negative.","That isn’t the exact value. Expand {rab} with the formula and check each sign."],"tipCot":"Your split lands on the same point as `x`, but {ab} = {v}, which is {xpm}, not {x}. Your question will say {xeq}, so the angles themselves must be equal. Keep `a` and change `b` (or the operation).","explainPrompt":"Explain how your classmate should find the exact value, and how they can tell it will be negative before they calculate.","vocab":"Use the words split, special angle, compound angle formula and CAST.","success":"Your question works.","more":"There’s more than one good question. Can you write one for each ratio, sin, cos and tan?","afterEach":"Three good questions. Notice that only six values of `x` ever work. The other two angles that aren’t special, `π/12` and `5π/12`, are in quadrant 1, where every ratio is positive."},"cards":[["`sin(a ± b)`","`sin a cos b ± cos a sin b`. Sine mixes the pairs and keeps the sign."],["`cos(a ± b)`","`cos a cos b ∓ sin a sin b`. Cosine matches the pairs and switches the sign."],["`tan(a ± b)`","`{tan a ± tan b}/{1 ∓ tan a tan b}`. Undefined when the denominator is 0, for example `a = b = π/4`."],["Does `sin(a + b) = sin a + sin b`?","No. Counterexample: `a = π/3`, `b = π/6` gives `sin(π/2) = 1`, but `sin a + sin b = {√3 + 1}/{2} ≈ 1.37`."],["Where the two pieces of `sin(a + b)` come from","Stack a right triangle with hypotenuse `cos b` (angle `a`) under one with hypotenuse `sin b`. Their heights are `sin a cos b` and `cos a sin b`."],["`sin 2θ`","`2 sin θ cos θ` (from `sin(θ + θ)`). Example: `sin(π/3) = 2 × {1}/{2} × {√3}/{2} = {√3}/{2}`."],["`cos 2θ`, three ways","`cos^2θ - sin^2θ = 2cos^2θ - 1 = 1 - 2sin^2θ`. Use the form that matches the ratio you know."],["`tan 2θ`","`{2 tan θ}/{1 - tan^2θ}`. Example: `tan(π/3) = {{2√3}/{3}}/{1 - {1}/{3}} = √3`."],["`sin(π/12)` and `cos(π/12)`","`{√6 - √2}/{4}` and `{√6 + √2}/{4}`, from `π/12 = π/4 - π/6`."],["`tan(π/12)` and `tan(5π/12)`","`2 - √3` and `2 + √3`. Their product is 1, since `5π/12 = π/2 - π/12`."],["Splitting an angle","Write it with denominator 12 and find two special numerators (2, 3, 4, 6, 8, 9, 10, …) that add or subtract to it: `7π/12 = 4π/12 + 3π/12 = π/3 + π/4`."],["One ratio and a quadrant → the other ratio","`sin^2 + cos^2 = 1` gives the size; CAST gives the sign. `sin a = {3}/{5}` in quadrant 2 → `cos a = -{4}/{5}`."]]}};</script>
