.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 25: radio groups, radius wrapper controls and ruler strip, spin lab, unit chains, robot-wheel task */
.m .p-t{font-style:italic}
#hero-cap{font:400 1.05rem var(--font-ui);color:var(--ink-2);min-height:2.8em}
.rw-top{margin:0 0 14px}
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.rw-wrapbtns{display:flex;flex-wrap:wrap;gap:8px}
.rw-wrapbtns .btn{min-height:40px;min-width:5.5rem}
.rw-sl{margin:0 0 12px}
.rw-slrow{display:flex;align-items:center;gap:8px}
.rw-slrow input[type=range]{flex:1;min-width:0}
.rw-pm{min-width:40px;min-height:40px;padding:0 .4em;font-size:1.25rem;line-height:1}
#rw-step{margin-top:2px}
.rw-tog{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rw-tog .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rw-ruler-wrap{margin-top:10px}
canvas.plot.rw-ruler{aspect-ratio:auto;height:110px}
canvas.plot.rw-ruler.rows2{height:176px}
canvas.plot.rw-ruler.rows3{height:260px}
.rw-rcap{margin:4px 0 0}
.rw-capr{font-size:.7em}
.read > div.rw-hl{background:var(--hi-soft);border-radius:6px;padding-left:8px;padding-right:8px;box-shadow:inset 3px 0 0 var(--hi)}
.read .tbl-wrap{margin-top:4px}
.read table.vt td,.read table.vt th,.read table.vt .m{white-space:nowrap}
.nm-post.deg{margin-left:-6px}
.rw-found ul{margin:10px 0 0;padding-left:1.2em}
.rw-found li{margin:4px 0}
.nw{white-space:nowrap}
/* spin lab */
.sp-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.sp-graph,.sp-side{min-width:0}
.sp-row{margin:0 0 10px}
.sp-cap{font-size:clamp(1.3rem,3vw,1.8rem)}
.sp-side .read{margin-top:14px}
.sp-quad{margin-top:10px}
/* unit chains */
.uc-scroll{overflow-x:auto;padding:4px 2px 8px}
.uc-row{display:flex;align-items:center;gap:8px;min-width:max-content;font:400 1.1rem var(--font-math)}
.uc-f{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;vertical-align:middle}
.uc-n{padding:0 .3em 2px;border-bottom:1.5px solid currentColor}
.uc-d{padding:2px .3em 0}
.uc-f s{color:var(--red);text-decoration-thickness:2px}
.uc-x{font-size:1.2rem}
.uc-slot{min-width:92px;min-height:64px;border:2px dashed var(--rule);background:var(--paper);border-radius:8px;padding:4px 6px;color:var(--ink);font:inherit}
.uc-slot.full{border-style:solid;border-color:var(--ink);background:var(--sheet)}
.uc-slot.ready{border-color:var(--pen)}
.uc-slot:disabled{opacity:1}
.uc-empty{font:400 .85rem var(--font-ui);color:var(--ink-2)}
.uc-res{font-weight:600;white-space:nowrap}
.uc-tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.uc-tile{border:2px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:4px 8px;font:400 1.02rem var(--font-math);min-height:56px}
.uc-tile[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
/* practice entries */
.nm-row{gap:10px 18px}
.nm-box{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.nm-box label{font-weight:700}
/* task */
.rq-in{align-items:flex-end}
.rq-sel{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.45em .6em;font:400 1.15rem var(--font-math);min-height:44px}
.rq-d label{display:block;font-weight:700;margin-bottom:4px}
.rq-d input{width:6.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.45em .7em;font:400 1.2rem var(--font-math)}
.rq-cap{font:400 1.1rem var(--font-math);margin:8px 0 0;min-height:1.5em}
@media (max-width:820px){ .sp-grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){
  #rw-modes .rg-wrap,#rw-modes .rg.seg,#sp-view .rg-wrap,#sp-view .rg.seg{display:flex;width:100%;flex-wrap:nowrap}
  #rw-modes .rg.seg button,#sp-view .rg.seg button{flex:1 1 0;padding-left:.4em;padding-right:.4em}
  .rw-wrapbtns{display:grid;grid-template-columns:1fr 1fr}
  [data-act-id="where"] .bins{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ [data-act-id="where"] .bin[data-bin="q2"]{order:-1} }

combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"a7977a90","content":{"id":"25-radian-measure","kind":"topic","title":"Radian measure","topic":"Radian Measure","readyTopic":"radian measure","hero":{"eq":"`a = r@t{θ}`","eqLabel":"a equals r theta","headline":"Measure an angle with the circle’s own radius","text":"Lay a circle’s radius along its edge. The angle it makes at the centre is \u003cstrong>one radian\u003c/strong>. The circumference is `2πr`, so exactly \u003cstrong>2π\u003c/strong> radius lengths fit around any circle: a full turn is 2π radians. Measuring angles this way makes \u003cstrong>arc length\u003c/strong> simple, `a = r@t{θ}`, and lets you describe how fast something spins with \u003cstrong>angular velocity\u003c/strong>.","fig":{"shape":"square","aria":"A circle of radius 1. Copies of the radius wrap around its edge: 6 radius lengths and a small gap make a full turn."},"caps":["1 radian ≈ 57.3°: the arc is exactly one radius long","6 radius lengths and a bit: a full turn is 2π ≈ 6.28 radians"]},"goals":["I can explain what one radian is, and why a full turn is 2π radians.","I can convert between degrees and radians, giving exact answers in terms of π and decimal approximations.","I can picture an angle given in radians, including a decimal like 2.5 or an angle past a full turn, and name the quadrant its terminal arm ends in.","I can use `a = r@t{θ}` to find an arc length, a radius or an angle, with `@t{θ}` in radians.","I can find angular velocity in radians per second, including from rotations per minute, and use `v = rω` to find how fast a point on a wheel moves.","I can find the trig ratios of an angle in radians from a tool or from given values, and spot an answer that came from degree mode."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Circles","goal":1,"fixedOrder":true,"prompt":"A circle has radius 5 cm. What is its circumference?","options":[{"t":"10 cm","why":"10 cm is the diameter. The circumference is π times the diameter: 10π cm.","_n":"066a","_k":"31182dbb"},{"t":"5π cm","why":"The circumference is `2πr` (or `πd`). With `r` = 5 cm, that’s 10π cm.","_n":"167a","_k":"89476a87"},{"t":"10π cm","why":"`C = 2πr = 2π × 5 = 10π` cm, about 31.4 cm.","_n":"268a","_k":"acc06b04"},{"t":"25π cm","why":"25π cm² is the area, `πr^2`. The circumference is `2πr` = 10π cm.","_n":"361a","_k":"8185de03"}],"hints":["The circumference is the distance around the circle.","`C = 2πr`, or π times the diameter.","`C = 2π × 5 = 10π` cm."]},{"id":"w2","skill":"Circles","goal":4,"fixedOrder":true,"prompt":"A circle has circumference 36 cm. How long is the arc cut off by a 60° angle at the centre?","options":[{"t":"0.6 cm","why":"36 ÷ 60 doesn’t give a fraction of the circle. 60° is 60/360 of a full turn.","_n":"462a","_k":"12ef7693"},{"t":"6 cm","why":"60° is 60/360 = 1/6 of a full turn, so the arc is 1/6 of 36 cm: 6 cm.","_n":"563a","_k":"be08b444"},{"t":"12 cm","why":"60/180 = 1/3 would be right only if a full turn were 180°. A full turn is 360°, so 60° is 1/6 of it.","_n":"664a","_k":"5ec20ff7"},{"t":"60 cm","why":"That’s longer than the whole circle (36 cm). The arc is a fraction of the circumference: 1/6 × 36 = 6 cm.","_n":"76da","_k":"2702ecf6"}],"hints":["What fraction of a full turn is 60°?","60° is 60/360 = 1/6 of a turn, so the arc is 1/6 of the circumference.","36 × 1/6 = 6 cm."]},{"id":"w3","skill":"Rates and units","goal":5,"fixedOrder":true,"prompt":"A car travels at 72 km/h. What is that in metres per second?","options":[{"t":"1.2 m/s","why":"72 ÷ 60 = 1.2 is kilometres per minute. You still need metres and seconds.","_n":"86ea","_k":"6c526d40"},{"t":"20 m/s","why":"72 km = 72 000 m and 1 h = 3600 s, so 72 000 ÷ 3600 = 20 m/s.","_n":"9015","_k":"5fda1e00"},{"t":"259.2 m/s","why":"72 × 3.6 goes the wrong way. 1 m/s is 3.6 km/h, so the same speed is a smaller number in m/s: 72 ÷ 3.6 = 20.","_n":"a005","_k":"26a2face"},{"t":"1200 m/s","why":"72 000 ÷ 60 = 1200 is metres per \u003cstrong>minute\u003c/strong>. Divide by 60 again for seconds.","_n":"bff5","_k":"c29cc7b9"}],"hints":["Change kilometres to metres and hours to seconds.","72 km = 72 000 m, and 1 h = 60 × 60 = 3600 s.","72 000 ÷ 3600 = 20 m/s."]},{"id":"w4","skill":"Rates and units","goal":5,"prompt":"A wheel turns 3 times every 2 seconds. How many times does it turn in one minute?","options":[{"t":"1.5","why":"1.5 is turns per \u003cstrong>second\u003c/strong>. A minute has 60 seconds.","_n":"cfe5","_k":"116710bb"},{"t":"40","why":"60 × 2/3 = 40 uses seconds per turn. The wheel makes 3/2 = 1.5 turns each second.","_n":"dfd5","_k":"0da936fd"},{"t":"90","why":"3 turns in 2 s is 1.5 turns per second, and 1.5 × 60 = 90 turns per minute.","_n":"efc5","_k":"8ed44538"},{"t":"180","why":"3 × 60 = 180 assumes 3 turns every second. It’s 3 turns every 2 seconds.","_n":"ffb5","_k":"ed63c701"}],"hints":["Find the number of turns in 1 second first.","3 turns in 2 s is 1.5 turns per second.","1.5 × 60 = 90 turns per minute."]},{"id":"w5","skill":"Angles in standard position","goal":3,"fixedOrder":true,"prompt":"An angle in standard position measures 160°. In which quadrant is its terminal arm?","options":[{"t":"Quadrant 1","why":"20° is the related angle. The angle itself, 160°, is past 90°.","_n":"gfa5","_k":"9c8446ab"},{"t":"Quadrant 2","why":"Start on the positive `x`-axis and turn counterclockwise: 90° \u003c 160° \u003c 180°, so the arm is in quadrant 2.","_n":"hf95","_k":"d2525a23"},{"t":"Quadrant 3","why":"Standard position turns \u003cstrong>counterclockwise\u003c/strong>. Turning 160° clockwise would end in quadrant 3.","_n":"if85","_k":"09c6a93c"},{"t":"Quadrant 4","why":"Quadrants are numbered counterclockwise from the top right: 1, 2, 3, 4. The top-left quadrant is quadrant 2.","_n":"je75","_k":"1b5c4639"}],"hints":["Start on the positive `x`-axis and turn counterclockwise.","Quadrant 1 ends at 90°, quadrant 2 at 180°, quadrant 3 at 270°.","90° \u003c 160° \u003c 180°, so the arm is in quadrant 2."]},{"id":"w6","skill":"Trig ratios","goal":6,"fixedOrder":true,"prompt":"What is the exact value of `sin 150°`?","options":[{"t":"`-{√3}/{2}`","why":"√3/2 is `sin 60°`, and sine is positive in quadrant 2.","_n":"ke85","_k":"aa665cf7"},{"t":"`-{1}/{2}`","why":"In quadrant 2 the arm is above the `x`-axis, so sine is positive.","_n":"le55","_k":"fa8a6b49"},{"t":"`{1}/{2}`","why":"150° is in quadrant 2 with related angle 180° − 150° = 30°. Sine is positive there, so `sin 150° = sin 30° = 1/2`.","_n":"me65","_k":"cf946880"},{"t":"`{√3}/{2}`","why":"√3/2 is `sin 60°`. The related angle of 150° is 30°.","_n":"neb5","_k":"1406829c"}],"hints":["Find the related angle and the sign of sine in quadrant 2.","The related angle is 180° − 150° = 30°, and sine is positive in quadrant 2.","`sin 150° = sin 30° = 1/2`."]}],"refreshers":{"Circles":"The circumference of a circle is `C = 2πr` (or `πd`). An arc is a fraction of it: a 60° angle at the centre is 60/360 = 1/6 of a turn, so its arc is 1/6 of the circumference. Example: `r` = 5 cm gives `C` = 10π cm, so a 60° arc is 10π/6 = 5π/3 cm.","Rates and units":"To change the units of a rate, multiply by fractions equal to 1 so the old units cancel. Example: 72 km/h × (1000 m / 1 km) × (1 h / 3600 s) = 20 m/s. For ‘3 turns in 2 s’: 3 ÷ 2 = 1.5 turns per second, and 1.5 × 60 = 90 turns per minute.","Angles in standard position":"An angle in standard position starts on the positive `x`-axis and turns counterclockwise. Quadrant 1 is 0° to 90°, quadrant 2 is 90° to 180°, quadrant 3 is 180° to 270°, and quadrant 4 is 270° to 360°. Example: 160° is in quadrant 2.","Trig ratios":"Find the related angle (the angle to the `x`-axis), then use CAST for the sign: All three ratios are positive in quadrant 1, only Sine in 2, Tangent in 3, Cosine in 4. Example: 150° is in quadrant 2 with related angle 30°, so `sin 150° = +sin 30° = 1/2`."}}},"explore":{"heading":"Radius wrapper","intro":"Wrap radius-length pieces around a circle to build an angle, then change the circle and watch the arc. The panel tracks the angle in radians and degrees.","text":{"gap7":"Only about 0.28 of the 7th piece fits. A full turn is 2π ≈ 6.28 radius lengths.","gapP1":"≈ 0.28 of a piece","gapP3":"π − 3 ≈ 0.14","ghost180":"180 cm would wrap around this circle about 9.5 times.","cmpLast":"Arc ÷ radius is the same for all three circles: it’s the angle in radians.","past":"You’ve passed a full turn. A full turn is 2π ≈ 6.28 radius lengths, so {x} of the 7th piece overlaps the first.","rulerCap":"Ruler strip, drawn at a smaller scale: centimetres on top, radius lengths below."},"predictions":[{"id":"p1","start":{"mode":"wrap","L":10},"prompt":"If you keep wrapping radius pieces, what happens when you get back to the start?","options":[{"t":"3 pieces fit, and a small gap is left","_n":"oec5","_k":"bab056b8"},{"t":"Exactly 6 pieces fit, with nothing left over","_n":"pe95","_k":"c1ef7139"},{"t":"It depends on how big the circle is","_n":"qea5","_k":"d13f23c0"},{"t":"6 pieces fit, and a gap shorter than one piece is left","_n":"ref5","_k":"4c75a2af"}],"explain":"The circumference is `2πr`, so 2π ≈ 6.28 radius lengths fit around the circle: 6 whole pieces and about 0.28 of another. That’s why a full turn is 2π radians, not 6. (Three pieces and a bit, about 3.14, is a \u003cstrong>half\u003c/strong> turn: π.) The count is the same for every circle, because the circumference and the radius grow together."},{"id":"p2","start":{"mode":"arc","step":"dec","r":2,"th":1},"fixedOrder":true,"prompt":"The radius will grow from 2 cm to 5 cm, and the arc will stay exactly one radius long. What happens to the angle?","options":[{"t":"It shrinks to 0.4 radians","_n":"sf05","_k":"bf294fc2"},{"t":"It stays at 1 radian","_n":"t6d5","_k":"f360230a"},{"t":"It grows to 2.5 radians","_n":"u6c5","_k":"b62e5a4b"},{"t":"It grows to 5 radians","_n":"v6f5","_k":"1031b17d"}],"explain":"`@t{θ} = a ÷ r`. The arc grows from 2 cm to 5 cm, and so does the radius, so `@t{θ}` = 5 ÷ 5 = 1 the whole time. A radian is the same angle on every circle. (0.4 = 2 ÷ 5 would be right only if the arc stayed 2 cm; 2.5 = 5 ÷ 2 treats the angle as growing with the circle; 5 is the arc length, not the angle.)"},{"id":"p3","start":{"mode":"arc","step":"dec","r":4,"th":0,"rad":true},"fixedOrder":true,"prompt":"The arm will turn to `@t{θ}` = 3, with no π. Where will it stop?","options":[{"t":"Just past the positive `x`-axis, in quadrant 1","_n":"w6e5","_k":"be990fff"},{"t":"Just before the negative `x`-axis, in quadrant 2","_n":"x695","_k":"143bedc3"},{"t":"Exactly on the negative `x`-axis","_n":"y685","_k":"3020bcbc"},{"t":"In quadrant 3","_n":"z6b5","_k":"065514bd"}],"explain":"With no degree sign, `@t{θ}` = 3 means 3 radians, about 3 × 57.3° ≈ 171.9°. A half turn is π ≈ 3.14, so 3 radians stops 0.14 short of the negative `x`-axis, in quadrant 2. It isn’t 3° (quadrant 1), and π isn’t exactly 3."},{"id":"p4","start":{"mode":"arc","step":"pi","r":3,"idx":4,"deg":true},"fixedOrder":true,"prompt":"How long is the arc?","options":[{"t":"about 1.05 cm","_n":"106a5","_k":"f312ca1f"},{"t":"about 3.14 cm","_n":"11755","_k":"86e18d36"},{"t":"about 9.42 cm","_n":"12745","_k":"919d2f0b"},{"t":"180 cm","_n":"13634","_k":"f5ed76a9"}],"explain":"`a = r@t{θ} = 3 × π/3 = π ≈ 3.14` cm. The formula needs `@t{θ}` in radians, π/3, not 60. Using 60 gives 180 cm, but the whole circle is only 6π ≈ 18.85 cm around, so that arc would wrap about 9.5 times. (1.05 cm is `@t{θ}` alone, without multiplying by `r`; 9.42 cm is 3π, which uses `@t{θ} = π`.)"}],"found":{"title":"What you found","html":"\u003cul>\u003cli>\u003cstrong>One radian\u003c/strong> is the angle at the centre of a circle that cuts off an arc as long as the radius. It’s about 57.3°, and it’s the same angle on every circle.\u003c/li>\u003cli>\u003cstrong>A full turn\u003c/strong> is 2π radians, because 2π radius lengths fit around a circumference of `2πr`. So 360° = 2π radians and 180° = π radians.\u003c/li>\u003cli>\u003cstrong>Converting:\u003c/strong>\u003cul>\u003cli>degrees → radians: multiply by π/180. Example: 120° = 120π/180 = 2π/3;\u003c/li>\u003cli>radians → degrees: multiply by 180/π. Example: 2.5 × 180/π ≈ 143.2°.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Benchmarks:\u003c/strong> π/2 ≈ 1.57, π ≈ 3.14, 3π/2 ≈ 4.71, 2π ≈ 6.28.\u003c/li>\u003cli>\u003cstrong>Arc length:\u003c/strong> `a = r@t{θ}`, with `@t{θ}` in radians. Rearranged: `@t{θ} = a ÷ r` and `r = a ÷ @t{θ}`.\u003c/li>\u003c/ul>"},"challenges":[{"id":"tc1","goal":[1,4],"prompt":"In Arc mode, keep the radius at 4 cm. Make the arc exactly 10 cm long.","why":"`@t{θ}` = 10 ÷ 4 = 2.5.","msgs":{"mode":"Switch to Arc mode: this challenge uses the radius and angle sliders.","flip":"You set `@t{θ} = r ÷ a` = 4 ÷ 10. The angle is arc ÷ radius: how many 4 cm lengths make 10 cm?","close":"So close: your arc is {a} cm. Nudge `@t{θ}` by 0.01.","steps":"π-steps go up by π/12 ≈ 0.26, so none of them makes exactly 10 cm. Switch to decimal steps.","radius":"Keep the radius at 4 cm; the challenge fixes it.","other":"Your arc is {a} cm. You need 10 cm: how many radius lengths is that?"},"hints":["The angle in radians counts how many radius lengths fit along the arc.","How many 4 cm lengths make 10 cm? `@t{θ} = a ÷ r`.","`@t{θ}` = 10 ÷ 4 = 2.5. In decimal steps, set `@t{θ}` = 2.50 with `r` = 4."]},{"id":"tc2","goal":[2,4],"prompt":"Make an arc that is exactly 2π cm long \u003cstrong>and\u003c/strong> exactly one-sixth of its circle.","why":"`r = a ÷ @t{θ} = 2π ÷ (π/3) = 6`.","msgs":{"mode":"Switch to Arc mode: this challenge uses the radius and angle sliders.","frac":"Your arc is 2π cm, but it’s {f} of its circle. One-sixth of a full turn is `2π/6 = π/3`.","fracs":{"1":"the whole","2":"1/2","3":"1/3","4":"1/4","1.5":"2/3"},"sixth":"That’s one-sixth of the circle. Now the length: your arc is {a} cm, but it must be 2π cm. Which radius makes `r × π/3 = 2π`?","twelfth":"π/6 is one-\u003cstrong>twelfth\u003c/strong> of a full turn. A full turn is 2π, not π, so one-sixth is π/3.","dec":"Very close, but 1.05 is only near π/3, so the arc is 6.30 cm, not exactly 2π. Switch to π-steps.","other":"Find the angle first (one-sixth of 2π), then the radius (`r = a ÷ @t{θ}`)."},"hints":["Find the angle first: what is one-sixth of a full turn, in radians?","A full turn is 2π, so one-sixth is 2π/6 = π/3. Which radius makes `r × π/3 = 2π`?","`r = a ÷ @t{θ} = 2π ÷ (π/3) = 6`. Set `r` = 6 and `@t{θ} = π/3`."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Make a sector (a pizza-slice shape) whose perimeter, its two straight edges plus its arc, is exactly \u003cstrong>half\u003c/strong> of its circle’s circumference.","why":"`2r + r@t{θ} = πr`, so `@t{θ} = π - 2 ≈ 1.14` radians. Notice the radius didn’t matter: it cancelled.","msgs":{"mode":"Switch to Arc mode: this challenge uses the radius and angle sliders.","pi":"Your arc alone is half the circumference. The perimeter also includes the two straight edges.","pim1":"You’ve counted one straight edge. A sector has two.","whole":"That makes the perimeter equal to the \u003cstrong>whole\u003c/strong> circumference. You need half.","quarter":"A quarter-circle’s perimeter is `2r + (π/2)r ≈ 3.57r`, more than `πr ≈ 3.14r`. Make `@t{θ}` smaller.","steps":"π − 2 isn’t a multiple of π/12. Switch to decimal steps.","other":"Write the perimeter as `2r + r@t{θ}` and set it equal to half the circumference, `πr`."},"rulerLabels":["perimeter 2r + rθ","half the circumference πr"],"hints":["Write the sector’s perimeter in terms of `r` and `@t{θ}`. Write half the circumference in terms of `r`.","Perimeter = `r + r + r@t{θ} = 2r + r@t{θ}`. Half the circumference is `πr`. Set them equal, then divide both sides by `r`.","`2 + @t{θ} = π`, so `@t{θ} = π - 2 ≈ 3.14 - 2 = 1.14`. Any radius works. In decimal steps, set `@t{θ}` = 1.14."]}]},"part3":{"slug":"spin","name":"Spin lab","heading":"Spin lab: how fast is it turning?","intro":"A wheel’s angular velocity is the angle it turns each second. Predict, run the wheel, and see how far each point travels.","views":["One wheel, two riders","Two wheels, one belt"],"runIntro":"Enter a prediction and press Check. Then the wheel runs so you can see it.","runs":[{"id":"r1","goal":5,"setup":{"view":0,"rpm":15,"t":2},"prompt":"Through what angle will the merry-go-round turn?","box":{"pre":"`@t{θ}` =","post":"π"},"_a":"GhVPFQ1QRA==","display":"`@t{θ} = π`","wrong":[{"v":0.5,"fb":"π/2 is the angle per second: that’s ω. In 2 s it turns twice that."},{"v":2,"fb":"2π is a full turn. 15 turns per minute is one turn every 4 s, so 2 s is half a turn."},{"v":60,"fb":"That treats 15 rpm as 15 turns per \u003cstrong>second\u003c/strong>: 15 × 2 × 2π = 60π."}],"hints":["How many turns does the merry-go-round make in 2 s?","15 turns per minute is 15 ÷ 60 = 1/4 turn per second, so 1/2 turn in 2 s.","Half a turn is π radians. `@t{θ} = π`."]},{"id":"r2","goal":5,"setup":{"view":0,"rpm":15,"t":2},"prompt":"How far along the circle did rider B travel?","box":{"pre":"","post":"π m"},"_a":"GhVPFQ1QRA==","display":"π m","wrong":[{"v":2,"fb":"2π m is rider A’s distance, 2 × π. B sits 1 m from the centre: `a = 1 × π`."},{"v":0.5,"fb":"π/2 is B’s speed in m/s. In 2 s, B travels twice that."}],"hints":["Rider B turns through the same angle as the wheel. Use `a = r@t{θ}`.","`@t{θ} = π` (from R1), and B sits `r` = 1 m from the centre.","`a = 1 × π = π` m. Type 1."]},{"id":"r3","goal":5,"setup":{"view":0,"rpm":20,"t":2},"prompt":"Through what angle will it turn, and where will rider A stop?","box":{"pre":"`@t{θ}` =","post":"π"},"quad":true,"_a":"GhVPFQ1QFwNSBAoEBFIKA1IECgQEUgocQ0YbDQQc","display":"`@t{θ} = 4π/3`, quadrant 3","wrong":[{"v":0.6666666666666666,"fb":"2π/3 is ω, the angle per second. In 2 s it turns 4π/3."},{"v":80,"fb":"That treats 20 rpm as turns per second."}],"qwrong":{"2":"4π/3 is past π (3π/3), so the rider is below the `x`-axis.","4":"4π/3 hasn’t reached 3π/2."},"hints":["How many turns does the merry-go-round make in 2 s at 20 rpm?","20 rpm is 20 ÷ 60 = 1/3 turn per second, so 2/3 turn in 2 s. One turn is 2π.","`@t{θ} = 2/3 × 2π = 4π/3`. That’s past π = 3π/3 but short of 3π/2 = 4.5π/3, so quadrant 3. Type 4/3 and choose Quadrant 3."]},{"id":"r4","goal":5,"setup":{"view":1,"r1":5,"n1":90,"r2":15,"t":2},"prompt":"How many full turns will the big pulley make?","box":{"pre":"","post":"turns"},"_a":"GhVPFQ1QRA==","display":"1 turn","wrong":[{"v":3,"fb":"3 turns is the small pulley. The belt moves the same distance around the big pulley, but each of its turns is 3 times as long."},{"v":9,"fb":"The big pulley turns \u003cstrong>slower\u003c/strong>, not faster: divide by 3."}],"hints":["The belt moves the same distance around both pulleys.","90 rpm is 1.5 turns per second, so the small pulley makes 3 turns in 2 s. Its rim moves 3 × 2π × 5 = 30π cm.","One turn of the big pulley is 2π × 15 = 30π cm of belt. So it makes 30π ÷ 30π = 1 turn."]}],"chainIntro":"Tap a tile, then tap an empty slot. Units that cancel are struck through. Press Check when the units are right; then enter the value.","tiles":[{"id":"t1","n":"2π rad","d":"1 turn","nu":"rad","du":"turn"},{"id":"t2","n":"1 turn","d":"2π rad","nu":"turn","du":"rad"},{"id":"t3","n":"π rad","d":"1 turn","nu":"rad","du":"turn"},{"id":"t4","n":"60 s","d":"1 min","nu":"s","du":"min"},{"id":"t5","n":"1 min","d":"60 s","nu":"min","du":"s"},{"id":"t6","n":"60 min","d":"1 h","nu":"min","du":"h"}],"chains":[{"id":"u1","goal":5,"q":"45 rpm in rad/s","start":{"n":"45 turns","d":"1 min","nu":"turn","du":"min"},"slots":2,"target":"rad/s","box":{"post":"π rad/s","pi":true},"_a":"GhVNXlsEShJbbBtDBkMVEhUCG2obQ08SWwYXAko=","display":"45 rpm = `3π/2` rad/s ≈ 4.71 rad/s","tileFb":{"t2":"This tile puts ‘turn’ on top again, so ‘turn’ can’t cancel. Use the tile with ‘turn’ underneath.","t3":"One turn is 2π radians. π radians is only half a turn.","t4":"With ‘60 s’ on top you’d be multiplying by 60. To change ‘per minute’ into ‘per second’, use ‘1 min / 60 s’.","t6":"This brings in hours, which aren’t in the question."},"wrong":[{"v":90,"fb":"90π is per minute: divide by 60."},{"v":0.75,"fb":"That used π rad per turn."}],"hints":["Line up the units: you have turns per minute, and you want radians per second.","One tile must change turns into radians, with ‘turn’ underneath. The other must change ‘per minute’ into ‘per second’, with ‘min’ on top.","45 × 2π ÷ 60 = 90π/60 = 3π/2 rad/s. Type 3/2."]},{"id":"u2","goal":5,"q":"6π rad/s in rpm","start":{"n":"6π rad","d":"1 s","nu":"rad","du":"s"},"slots":2,"target":"turn/min","box":{"post":"rpm","pi":false},"_a":"GhVNXlsEShJbbBtDBUMVEhUDG2obQ08SWwYBB0o=","display":"6π rad/s = 180 rpm","tileFb":{"t1":"This tile puts ‘rad’ on top again, so ‘rad’ can’t cancel. Use the tile with ‘rad’ underneath.","t3":"One turn is 2π radians. π radians is only half a turn.","t5":"With ‘min’ on top you’d be dividing by 60. To change ‘per second’ into ‘per minute’, use ‘60 s / 1 min’: a rate per minute is 60 times a rate per second.","t6":"This brings in hours, which aren’t in the question."},"wrong":[{"v":3,"fb":"3 turns per \u003cstrong>second\u003c/strong>: multiply by 60."}],"hints":["You have radians per second, and you want turns per minute.","One tile must change radians into turns, with ‘rad’ underneath. The other must change ‘per second’ into ‘per minute’, with ‘s’ on top.","6π ÷ 2π = 3 turns per second, and 3 × 60 = 180 rpm."]},{"id":"u3","goal":5,"q":"Earth turns once every 24 h. Its angular velocity in rad/h?","start":{"n":"1 turn","d":"24 h","nu":"turn","du":"h"},"slots":1,"target":"rad/h","box":{"post":"π rad/h","pi":true},"_a":"GhVNXlsEShJbbBtDBkNkHENBGw0HTwkIUgQKBARSCgNSBAoEBFIKTQ==","display":"`π/12` rad/h ≈ 0.26 rad/h","after":"π/12 radians is 15°. Earth turns 15° every hour, which is why time zones are about 15° wide.","tileFb":{"t2":"This tile puts ‘turn’ on top again, so ‘turn’ can’t cancel. Use the tile with ‘turn’ underneath.","t3":"One turn is 2π radians. π radians is only half a turn.","t4":"The answer stays per hour, so the time units don’t change. Only ‘turn’ needs to become ‘rad’.","t5":"The answer stays per hour, so the time units don’t change. Only ‘turn’ needs to become ‘rad’.","t6":"The answer stays per hour, so the time units don’t change. Only ‘turn’ needs to become ‘rad’."},"wrong":[{"v":0.041666666666666664,"fb":"That used π rad per turn."},{"v":2,"fb":"You left out the 24 h: 2π rad is per \u003cstrong>day\u003c/strong>."}],"hints":["You have turns per hour, and you want radians per hour. Only the turns need changing.","Use the tile with ‘turn’ underneath: 2π rad / 1 turn. The hours stay where they are.","2π ÷ 24 = π/12 rad/h. Type 1/12."]}],"blocks":[{"title":"","html":"\u003cdetails class=\"alg\">\u003csummary>Check it with algebra\u003c/summary>\u003cdiv class=\"alg-lines\">\u003cdiv>`ω = @t{θ} ÷ t`. One turn is 2π radians, so `N` turns per minute is `2πN` radians every 60 s: `ω = 2πN/60 = πN/30` rad/s.\u003c/div>\u003cdiv>A point at distance `r` travels `a = r@t{θ}`, so its speed is `v = a ÷ t = r(@t{θ} ÷ t) = rω`.\u003c/div>\u003cdiv>A belt moves both rims the same distance, so `r_1@t{θ}_1 = r_2@t{θ}_2`, and dividing by `t` gives `r_1ω_1 = r_2ω_2`.\u003c/div>\u003cdiv>Check with view 1: 15 rpm → `ω = 15π/30 = π/2` rad/s, and rider A’s speed is 2 × π/2 = π m/s, the same as the readout.\u003c/div>\u003c/div>\u003c/details>"},{"title":"Angular velocity, in four lines","html":"\u003col>\u003cli>ω is the angle turned per unit of time: `ω = @t{θ} ÷ t`, in rad/s.\u003c/li>\u003cli>From rpm: multiply by 2π (radians per turn) and divide by 60 (seconds per minute). 15 rpm = π/2 rad/s.\u003c/li>\u003cli>\u003cstrong>One wheel:\u003c/strong> every point has the same ω. Its speed along its path is `v = rω`, so points farther out move faster.\u003c/li>\u003cli>\u003cstrong>Belt, chain or meshing gears:\u003c/strong> the rims share one speed, so `r_1ω_1 = r_2ω_2`, and the smaller wheel turns faster.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Quick check: Spin lab","summary":"Spin lab quick check","items":[{"id":"q1","goal":5,"fixedOrder":true,"prompt":"A wheel turns at 30 rpm. What is its angular velocity?","choices":[{"t":"π rad/s","fb":"Right: 30 rpm is half a turn per second, and half a turn is π radians.","_n":"14644","_k":"208824c2"},{"t":"2π rad/s","fb":"2π rad/s is one full turn every second, which is 60 rpm.","_n":"15654","_k":"29b60741"},{"t":"30 rad/s","fb":"rpm counts turns per minute, not radians per second.","_n":"16664","_k":"05b69975"},{"t":"60π rad/s","fb":"30 × 2π = 60π is radians per \u003cstrong>minute\u003c/strong>. Divide by 60.","_n":"17674","_k":"3a416261"}]},{"id":"q2","goal":5,"prompt":"On a spinning merry-go-round, rider A sits 2 m from the centre and rider B sits 1 m from the centre. Who has the greater angular velocity?","choices":[{"t":"A","fb":"A goes farther, but turns through the same angle as B. Angular velocity measures the angle.","_n":"18684","_k":"573a9bb5"},{"t":"B","fb":"B is closer to the centre but turns with the same wheel, through the same angle.","_n":"19694","_k":"5b1850f9"},{"t":"The same","fb":"Right: they turn through the same angle in the same time, so ω is the same.","_n":"1a6a4","_k":"ebc2e1c6"}]},{"id":"q3","goal":5,"prompt":"Same riders: who moves faster along their path?","choices":[{"t":"A, twice as fast","fb":"Right: `v = rω` with the same ω, so doubling `r` doubles `v`.","_n":"1b6b4","_k":"8a3256d2"},{"t":"B, twice as fast","fb":"B’s circle is smaller, so B covers less distance in each turn.","_n":"1c6c4","_k":"c1f98ec9"},{"t":"The same","fb":"Same ω, but A’s circle is twice as big, so A covers twice the distance in each turn.","_n":"1d694","_k":"c66b4ea8"}]},{"id":"q4","goal":5,"prompt":"A 4 cm pulley drives a 12 cm pulley with a belt. The small one turns at 60 rpm. How fast does the big one turn?","choices":[{"t":"20 rpm","fb":"Right: `r_1ω_1 = r_2ω_2`: 4 × 60 = 12 × 20. The big pulley turns a third as fast.","_n":"1e684","_k":"9a7870ef"},{"t":"60 rpm","fb":"The belt makes the rims move at the same speed, not the pulleys turn at the same rate.","_n":"1f674","_k":"7ed6f4a4"},{"t":"180 rpm","fb":"The bigger pulley turns \u003cstrong>slower\u003c/strong>. Divide by 3, don’t multiply.","_n":"1g664","_k":"e97fd5b0"}]}]}},"practice":{"activities":[{"id":"where","type":"sorter","title":"Where does it land?","summary":"Where does it land?","noun":"angle","goal":[3,2],"instruction":"Sort each angle into the quadrant where its terminal arm ends.","how":"Tap an angle, then tap the box it belongs in.","use":"π/2 ≈ 1.57, π ≈ 3.14, 3π/2 ≈ 4.71, 2π ≈ 6.28","boxes":[{"id":"q1","label":"Quadrant 1"},{"id":"q2","label":"Quadrant 2"},{"id":"q3","label":"Quadrant 3"},{"id":"q4","label":"Quadrant 4"}],"items":[{"id":"i1","t":"1","_a":"Q0YIFQ==","why":"1 is less than π/2 ≈ 1.57. One radian is about 57°.","wrong":{"q2":"Check the benchmark between those two quadrants: π/2 ≈ 1.57. Is 1 more or less than that?","q3":"Compare 1 with the benchmarks in the box.","q4":"Check the benchmark between those two quadrants: 2π ≈ 6.28. Is 1 more or less than that?"},"goal":[3,2],"hints":["Compare 1 with the benchmarks in the box.","1 is between 0 and π/2 ≈ 1.57.","So 1 ends in quadrant 1, about 57°."]},{"id":"i2","t":"1.5","_a":"Q0YIFQ==","why":"1.5 is just less than π/2 ≈ 1.57: about 86°, just short of the positive `y`-axis.","wrong":{"q2":"1.5 is just \u003cstrong>less\u003c/strong> than π/2 ≈ 1.57, so it hasn’t reached the positive `y`-axis.","q3":"Compare 1.5 with the benchmarks in the box.","q4":"Check the benchmark between those two quadrants: 2π ≈ 6.28. Is 1.5 more or less than that?"},"goal":[3,2],"hints":["Compare 1.5 with the benchmarks in the box.","1.5 is between 0 and π/2 ≈ 1.57.","So 1.5 ends in quadrant 1, about 86°."]},{"id":"i3","t":"`2π/5`","_a":"Q0YIFQ==","why":"`2π/5 = 0.4π`, which is less than 0.5π. It’s 72°.","wrong":{"q2":"Write `2π/5` as a number times π: `2π/5` = 0.4π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q3":"Write `2π/5` as a number times π: `2π/5` = 0.4π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q4":"Write `2π/5` as a number times π: `2π/5` = 0.4π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π."},"goal":[3,2],"hints":["Compare `2π/5` with the benchmarks in the box.","Write it as 0.4π first.","So `2π/5` ends in quadrant 1. It’s 72°."]},{"id":"i4","t":"2","_a":"Q0YLFQ==","why":"1.57 \u003c 2 \u003c 3.14. Two radians is about 115°.","wrong":{"q1":"Did you read 2 as degrees? With no degree sign, 2 means 2 radians, and one radian is about 57°. Compare 2 with π/2 ≈ 1.57.","q3":"Check the benchmark between those two quadrants: π ≈ 3.14. Is 2 more or less than that?","q4":"Compare 2 with the benchmarks in the box."},"goal":[3,2],"hints":["Compare 2 with the benchmarks in the box.","2 is between π/2 ≈ 1.57 and π ≈ 3.14.","So 2 ends in quadrant 2, about 115°."]},{"id":"i5","t":"3","_a":"Q0YLFQ==","why":"3 is just less than π ≈ 3.14: about 172°.","wrong":{"q1":"Did you read 3 as degrees? With no degree sign, 3 means 3 radians, and one radian is about 57°. Compare 3 with π/2 ≈ 1.57.","q3":"3 is less than π ≈ 3.14: it stops just before the negative `x`-axis.","q4":"Compare 3 with the benchmarks in the box."},"goal":[3,2],"hints":["Compare 3 with the benchmarks in the box.","3 is between π/2 ≈ 1.57 and π ≈ 3.14.","So 3 ends in quadrant 2, about 172°."]},{"id":"i6","t":"`7π/12`","_a":"Q0YLFQ==","why":"`7π/12 ≈ 0.58π`, between 0.5π and π. It’s 105°.","wrong":{"q1":"Write `7π/12` as a number times π: `7π/12` ≈ 0.58π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q3":"Write `7π/12` as a number times π: `7π/12` ≈ 0.58π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q4":"Write `7π/12` as a number times π: `7π/12` ≈ 0.58π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π."},"goal":[3,2],"hints":["Compare `7π/12` with the benchmarks in the box.","Write it as about 0.58π first.","So `7π/12` ends in quadrant 2. It’s 105°."]},{"id":"i7","t":"4","_a":"Q0YKFQ==","why":"3.14 \u003c 4 \u003c 4.71. Four radians is about 229°.","wrong":{"q1":"Did you read 4 as degrees? With no degree sign, 4 means 4 radians, and one radian is about 57°. Compare 4 with π/2 ≈ 1.57.","q2":"Check the benchmark between those two quadrants: π ≈ 3.14. Is 4 more or less than that?","q4":"Check the benchmark between those two quadrants: 3π/2 ≈ 4.71. Is 4 more or less than that?"},"goal":[3,2],"hints":["Compare 4 with the benchmarks in the box.","4 is between π ≈ 3.14 and 3π/2 ≈ 4.71.","So 4 ends in quadrant 3, about 229°."]},{"id":"i8","t":"4.5","_a":"Q0YKFQ==","why":"4.5 is just less than 3π/2 ≈ 4.71: about 258°.","wrong":{"q1":"Did you read 4.5 as degrees? With no degree sign, 4.5 means 4.5 radians, and one radian is about 57°. Compare 4.5 with π/2 ≈ 1.57.","q2":"Check the benchmark between those two quadrants: π ≈ 3.14. Is 4.5 more or less than that?","q4":"4.5 is less than 3π/2 ≈ 4.71."},"goal":[3,2],"hints":["Compare 4.5 with the benchmarks in the box.","π ≈ 3.14 and 3π/2 ≈ 4.71. Is 4.5 between them?","3.14 \u003c 4.5 \u003c 4.71, so 4.5 radians ends in quadrant 3, about 258°, just before the negative `y`-axis."]},{"id":"i9","t":"`9π/8`","_a":"Q0YKFQ==","why":"`9π/8 = 1.125π`, between π and 1.5π. It’s 202.5°.","wrong":{"q1":"Write `9π/8` as a number times π: `9π/8` = 1.125π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q2":"Write `9π/8` as a number times π: `9π/8` = 1.125π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q4":"Write `9π/8` as a number times π: `9π/8` = 1.125π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π."},"goal":[3,2],"hints":["Write `9π/8` as a number times π.","9/8 = 1.125, so `9π/8 = 1.125π`. Quadrant 3 runs from π to 1.5π.","π \u003c 9π/8 \u003c 3π/2, so it ends in quadrant 3. It’s 9 × 22.5° = 202.5°."]},{"id":"i10","t":"5","_a":"Q0YNFQ==","why":"4.71 \u003c 5 \u003c 6.28. Five radians is about 286°.","wrong":{"q1":"Did you read 5 as degrees? With no degree sign, 5 means 5 radians, and one radian is about 57°. Compare 5 with π/2 ≈ 1.57.","q2":"Compare 5 with the benchmarks in the box.","q3":"Check the benchmark between those two quadrants: 3π/2 ≈ 4.71. Is 5 more or less than that?"},"goal":[3,2],"hints":["Compare 5 with the benchmarks in the box.","5 is between 3π/2 ≈ 4.71 and 2π ≈ 6.28.","So 5 ends in quadrant 4, about 286°."]},{"id":"i11","t":"6","_a":"Q0YNFQ==","why":"6 is less than 2π ≈ 6.28: about 344°, just short of a full turn.","wrong":{"q1":"6 is less than 2π ≈ 6.28, so it hasn’t finished a full turn.","q2":"Compare 6 with the benchmarks in the box.","q3":"Check the benchmark between those two quadrants: 3π/2 ≈ 4.71. Is 6 more or less than that?"},"goal":[3,2],"hints":["Compare 6 with the benchmarks in the box.","6 is between 3π/2 ≈ 4.71 and 2π ≈ 6.28.","So 6 ends in quadrant 4, about 344°."]},{"id":"i12","t":"`19π/10`","_a":"Q0YNFQ==","why":"`19π/10 = 1.9π`, between 1.5π and 2π. It’s 342°.","wrong":{"q1":"Write `19π/10` as a number times π: `19π/10` = 1.9π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q2":"Write `19π/10` as a number times π: `19π/10` = 1.9π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π.","q3":"Write `19π/10` as a number times π: `19π/10` = 1.9π. Quadrant 1 runs to 0.5π, quadrant 2 to π, quadrant 3 to 1.5π and quadrant 4 to 2π."},"goal":[3,2],"hints":["Compare `19π/10` with the benchmarks in the box.","Write it as 1.9π first.","So `19π/10` ends in quadrant 4. It’s 342°."]}]},{"id":"nums","type":"custom","title":"Find the missing piece","summary":"Find the missing piece","star":true,"goal":[2,4,5,6],"instruction":"Find each missing value. The last three are puzzles: they need more than one step.","how":"Type your answer in the box, then press Check. For a multiple of π, type only the number in front of π (a fraction like 2/9 is fine).","items":[{"id":"n1","goal":2,"prompt":"Convert 40° to radians. Give the exact value.","boxes":[{"pi":true,"tol":0.0001,"wrong":[{"v":4.5,"fb":"That flips the fraction: 180/40 instead of 40/180. 9π/2 is more than two full turns. Multiply 40 by π/180."},{"v":40,"fb":"Multiply by π/180, not just by π."},{"v":0.1111111111111111,"fb":"40/360 = 1/9 is the fraction of a \u003cstrong>turn\u003c/strong>. A turn is 2π, so 40° = 2π/9."}]}],"_a":"OgcXBQVTCwJTBQsFBVMLAlMFC2o=","display":"40° = `2π/9`","hints":["Degrees to radians: multiply by π/180.","40 × π/180 = 40π/180. Simplify 40/180.","40/180 = 2/9, so 40° = 2π/9. Type 2/9."]},{"id":"n2","goal":2,"prompt":"Convert `7π/12` to degrees.","boxes":[{"post":"°","tol":0.01,"wrong":[{"v":210,"fb":"That uses π = 360°. A \u003cstrong>half\u003c/strong> turn is π, so π = 180°."},{"v":52.5,"fb":"That uses π = 90°. π radians is 180°."},{"v":1.832595714594046,"fb":"1.83 is `7π/12` as a decimal, still in radians. Multiply by 180/π."}]}],"_a":"OgYJAmo=","display":"`7π/12` = 105°","hints":["Radians to degrees: multiply by 180/π, or replace π with 180°.","`7π/12 × 180/π = 7 × 180 ÷ 12`.","7 × 15 = 105°."]},{"id":"n3","goal":4,"prompt":"An arc 12 cm long is on a circle of radius 8 cm. Find the angle at the centre, in radians.","boxes":[{"tol":0.01,"wrong":[{"v":0.6666666666666666,"fb":"That’s `r ÷ a`. The angle is `a ÷ r` = 12 ÷ 8."},{"v":96,"fb":"That’s `a × r`. Rearrange `a = r@t{θ}`: `@t{θ} = a ÷ r`."},{"v":85.94366926962348,"tol":0.1,"fb":"That’s the angle in degrees. The question asks for radians."}]}],"_a":"OgYXAmo=","display":"`@t{θ}` = 1.5","hints":["`@t{θ} = a ÷ r`: how many radius lengths fit along the arc?","`a` = 12 cm and `r` = 8 cm.","`@t{θ}` = 12 ÷ 8 = 1.5 radians."]},{"id":"n4","goal":4,"prompt":"A pendulum 90 cm long swings through an arc of 15π cm. Through how many degrees does it swing?","boxes":[{"post":"°","tol":0.1,"wrong":[{"v":0.5235987755982988,"tol":0.01,"fb":"That’s `@t{θ}` in radians (π/6 ≈ 0.52): `a ÷ r` always gives radians. Convert it to degrees."},{"v":6,"fb":"That’s 90 ÷ 15, the radius over the arc, with the π left out. `@t{θ} = a ÷ r = 15π ÷ 90 = π/6`."},{"v":94.24777960769379,"fb":"That’s π/6 × 180 = 30π. You multiplied by 180 but forgot to divide by π: π/6 × 180/π = 30."}]}],"_a":"OgQJag==","display":"30°","hints":["Find `@t{θ}` in radians first, with `@t{θ} = a ÷ r`.","`@t{θ} = 15π ÷ 90 = π/6`.","π/6 × 180/π = 30°."]},{"id":"n5","goal":6,"prompt":"Find `csc 1.2` and `cot 1.2`, to two decimal places.","use":"`sin 1.2 ≈ 0.932` and `cos 1.2 ≈ 0.362`","boxes":[{"pre":"`csc 1.2 ≈`","name":"`csc 1.2`","tol":0.01,"wrong":[{"v":2.7624309392265194,"fb":"That’s 1/cos 1.2, which is sec 1.2. csc pairs with sine."}]},{"pre":"`cot 1.2 ≈`","name":"`cot 1.2`","tol":0.01,"wrong":[{"v":2.5745856353591163,"fb":"That’s sin ÷ cos, which is tan 1.2. cot is cos ÷ sin."}]}],"_a":"OgYXBwBNCR5SDmQ=","display":"`csc 1.2 ≈ 1.07` and `cot 1.2 ≈ 0.39`","hints":["csc = 1/sin and cot = cos/sin.","`csc 1.2` = 1 ÷ 0.932 and `cot 1.2` = 0.362 ÷ 0.932.","1 ÷ 0.932 ≈ 1.07 and 0.362 ÷ 0.932 ≈ 0.39. Check by multiplying: 0.932 × 1.07 ≈ 0.997, close to 1, and 0.932 × 0.39 ≈ 0.363, close to 0.362."]},{"id":"n6","goal":5,"star":true,"prompt":"\u003cem>Non-routine.\u003c/em> A gear of radius 3 cm meshes with a gear of radius 8 cm. The small gear turns through 4π radians (two full turns). Through what angle does the big gear turn?","boxes":[{"pi":true,"tol":0.0001,"wrong":[{"v":4,"fb":"Meshing gears don’t turn through the same angle. Their rims move the same \u003cstrong>distance\u003c/strong>."},{"v":12,"fb":"12π cm is the distance the teeth move. Divide by the big gear’s radius to get its angle."},{"v":10.666666666666666,"fb":"The ratio is upside down: the big gear turns \u003cstrong>less\u003c/strong> than the small one."}]}],"_a":"OgYXAmo=","display":"`3π/2`","hints":["Where the gears touch, both rims move the same distance.","The small gear’s rim moves `a = 3 × 4π = 12π` cm, so the big gear’s rim also moves 12π cm.","`@t{θ} = 12π ÷ 8 = 3π/2`. The big gear turns three-quarters of a turn. Type 3/2."]},{"id":"n7","goal":5,"star":true,"prompt":"\u003cem>Non-routine.\u003c/em> A bike wheel of radius 35 cm rolls 11 m along a path in 5 s without slipping. About how many rotations per minute is it turning?","use":"π ≈ 3.14","boxes":[{"post":"rpm","tol":0.5,"wrong":[{"v":[6.29,6.28],"tol":0.005,"fb":"That’s ω in rad/s. Change it to turns per minute."},{"v":377,"fb":"That’s radians per minute. Divide by 2π for turns."},{"v":1,"fb":"That’s turns per \u003cstrong>second\u003c/strong>."},{"v":30,"fb":"That uses the diameter. Rolling distance = `r@t{θ}` with `r` = 35 cm."}]}],"_a":"OgEJag==","display":"about 60 rpm","hints":["When a wheel rolls without slipping, the distance it rolls equals the arc its rim turns through.","`@t{θ}` = 1100 cm ÷ 35 cm ≈ 31.43 radians in 5 s, so ω ≈ 31.43 ÷ 5 ≈ 6.29 rad/s.","One full turn is 2π ≈ 6.28 radians, so 6.29 rad/s is about 1 turn per second (6.29 ÷ 6.28 ≈ 1.00). That’s about 60 rotations per minute. (A shortcut: each turn rolls one circumference, 2π × 35 ≈ 219.8 cm, about 220 cm. 1100 ÷ 220 = 5 turns in 5 s, which is 1 turn per second.)"]},{"id":"n8","goal":4,"star":true,"prompt":"\u003cem>Non-routine, hardest.\u003c/em> On a circle of what radius is every arc’s length, in centimetres, equal to its angle in degrees? Give the radius to one decimal place.","use":"π ≈ 3.14","boxes":[{"post":"cm","tol":0.1,"wrong":[{"v":1,"fb":"On a circle of radius 1, an arc’s length equals its angle in \u003cstrong>radians\u003c/strong>, not degrees."},{"v":[0.017,0],"tol":0.01,"fb":"That’s π/180, upside down. Solve `r@t{θ} = 180@t{θ}/π` for `r`."},{"v":114.6,"fb":"That’s 360/π, the diameter of the circle you want. The radius is 180/π."}]}],"_a":"OgIOGQQ8","display":"57.3 cm","hints":["Write the arc length with `a = r@t{θ}` (`@t{θ}` in radians). Then write the angle in degrees in terms of `@t{θ}`.","`@t{θ}` radians is 180`@t{θ}`/π degrees. You need `r@t{θ} = 180@t{θ}/π` for every `@t{θ}`.","Divide both sides by `@t{θ}`: `r` = 180/π ≈ 180 ÷ 3.14 ≈ 57.3 cm. That’s why one radian is about 57.3°."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ravi","how":"","instruction":"Ravi made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Convert 135° to radians.","steps":["A half turn is 180°, which is π radians.","So 1° is 180/π radians.","135° = 135 × 180/π = 24 300/π radians.","That’s about 7735 radians."],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 follows from step 2. The mistake is earlier.","Step 4 is the right arithmetic for step 3. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct as written.","why":"If 1° were 180/π ≈ 57 radians, then 135° would be about 7735 radians, more than 1200 full turns. A degree is much \u003cstrong>smaller\u003c/strong> than a radian.","_n":"1h6d4","_k":"c5633d59"},{"t":"1° is π/180 radians, so 135° = 135π/180 = 3π/4 radians.","why":"Dividing π radians = 180° by 180 gives 1° = π/180 radians. 135° is three-quarters of a half turn: 3π/4.","_n":"1i6c4","_k":"fd6faa30"},{"t":"1° is π radians, so 135° = 135π radians.","why":"π radians is a half turn, so 1° can’t be π radians. 135π would be more than 67 full turns.","_n":"1j6b4","_k":"00725fcd"},{"t":"1° is 2π/180 radians, so 135° = 3π/2 radians.","why":"2π goes with 360°, not 180°. 3π/2 is 270°.","_n":"1k6a4","_k":"319337b3"}],"hints":["Check step 2: is a degree bigger or smaller than a radian?","π radians = 180°. Divide both sides by 180 to find 1°.","Step 2 is wrong: 1° = π/180 radians, so 135° = 135π/180 = 3π/4."]},{"id":"e2","goal":4,"task":"A lawn sprinkler sprays water 8 m and sweeps through 45°. How long is the wet arc at the edge of its spray?","steps":["The edge of the spray is an arc of a circle with radius 8 m.","Arc length is `a = r@t{θ}`.","So `a = 8 × 45`.","The wet arc is 360 m long."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: it’s the right formula.","","Step 4 is the right arithmetic for step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"The whole circle’s edge is only 2π × 8 ≈ 50 m long, so a 360 m arc would go around about 7 times. `a = r@t{θ}` needs `@t{θ}` in radians.","_n":"1l714","_k":"e7469ce7"},{"t":"`@t{θ} = π/4`, so `a = (π/4) ÷ 8 = π/32` m.","why":"The radian conversion is right now, but `a = r@t{θ}` multiplies: 8 × π/4.","_n":"1m704","_k":"a7fb093f"},{"t":"`@t{θ}` is 45/360 = 1/8 of a turn, so `a = 8 × 1/8 = 1` m.","why":"1/8 is the fraction of a turn, not the angle in radians. One turn is 2π radians, so `@t{θ} = 2π/8 = π/4`.","_n":"1n6f4","_k":"3ac0487d"},{"t":"`@t{θ}` must be in radians: 45° = π/4, so `a = 8 × π/4 = 2π ≈ 6.28` m.","why":"`a = r@t{θ}` counts radius lengths, so `@t{θ}` must be in radians.","_n":"1o704","_k":"ba22c5ae"}],"hints":["Check the units of `@t{θ}` in step 3.","`a = r@t{θ}` works only with `@t{θ}` in radians. Convert 45° first.","Step 3 is wrong: 45° = π/4, so `a = 8 × π/4 = 2π ≈ 6.28` m."]},{"id":"e3","goal":6,"task":"Find `sec 2`, to two decimal places. (The angle is 2 radians.)","steps":["`sec 2 = 1/cos 2`.","2 is between π/2 ≈ 1.57 and π ≈ 3.14, so 2 radians is in quadrant 2.","A calculator gives `cos 2 ≈ 0.9994`.","So `sec 2 ≈ 1 ÷ 0.9994 ≈ 1.00`."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct, and it’s useful: what sign should `cos 2` have?","","Step 4 is the right arithmetic for step 3. The mistake is earlier."],"fixes":[{"t":"`sec 2 = 1/sin 2`, and `sin 2 ≈ 0.909`, so `sec 2 ≈ 1.10`.","why":"sec pairs with cosine, not sine. `1/sin 2` is `csc 2`.","_n":"1p6d4","_k":"74e92c61"},{"t":"Step 3 is correct as written.","why":"Step 2 puts 2 radians in quadrant 2, where cosine is negative. A positive value means the calculator treated 2 as 2°: `cos 2° ≈ 0.9994`.","_n":"1q6e4","_k":"45b0893d"},{"t":"`cos 2` means `cos(2π) = 1`, so `sec 2 = 1`.","why":"`cos 2` means the cosine of 2 radians. Angles in radians don’t need π in them.","_n":"1r6b4","_k":"659e2a35"},{"t":"In radian mode, `cos 2 ≈ -0.416`, so `sec 2 ≈ 1 ÷ (-0.416) ≈ -2.40`.","why":"Cosine is negative in quadrant 2, which matches step 2.","_n":"1s6c4","_k":"a7eeac06"}],"hints":["Compare step 3 with step 2: what sign should cosine have in quadrant 2?","Cosine is negative in quadrant 2. 0.9994 is `cos 2°`, from a calculator in degree mode.","Step 3 is wrong: `cos 2 ≈ -0.416`, so `sec 2 ≈ -2.40`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you wrapped radius pieces around the circle?"},{"id":"j2","q":"In your own words, what is one radian, and why does a full turn measure 2π radians?"},{"id":"j3","q":"Explain to a friend how to change 75 rpm into radians per second, and why each step is there."},{"id":"j4","q":"Which is harder for you right now: picturing an angle like 4 radians, or converting between degrees and radians? What will you do to practise it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Which shows 225° in radians, exactly and as a decimal?","use":"π ≈ 3.1416","fixedOrder":true,"options":[{"t":"`5π/8 ≈ 1.96`","why":"That’s 225/360 × π, which treats a full turn as π. A full turn is 2π.","_n":"1t694","_k":"a360c818"},{"t":"`4π/5 ≈ 2.51`","why":"That’s 180/225 × π: the conversion factor is upside down. Multiply by π/180.","_n":"1u6a4","_k":"427eb7a5"},{"t":"`5π/4 ≈ 3.93`","why":"225 × π/180 = 225π/180 = 5π/4 ≈ 3.93.","_n":"1v774","_k":"05e836d4"},{"t":"`225π ≈ 706.86`","why":"That multiplies by π but forgets to divide by 180.","_n":"1w784","_k":"b9755831"}]},"b":{"prompt":"Which shows 300° in radians, exactly and as a decimal?","use":"π ≈ 3.1416","fixedOrder":true,"options":[{"t":"`3π/5 ≈ 1.88`","why":"That’s 180/300 × π: the factor is upside down.","_n":"1x754","_k":"fd6e8b1f"},{"t":"`5π/6 ≈ 2.62`","why":"That’s 300/360 × π, which treats a full turn as π.","_n":"1y744","_k":"4d4579e7"},{"t":"`5π/3 ≈ 5.24`","why":"300 × π/180 = 300π/180 = 5π/3 ≈ 5.24.","_n":"1z774","_k":"13b997d8"},{"t":"`300π ≈ 942.48`","why":"That multiplies by π but forgets to divide by 180.","_n":"20764","_k":"cd82e861"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which statement describes one radian?","options":[{"t":"The angle at the centre of any circle that cuts off an arc as long as the radius.","why":"That’s the definition. It’s about 57.3°, on any circle.","_n":"21794","_k":"701c36f4"},{"t":"The angle at the centre that cuts off an arc 1 cm long, on any circle.","why":"That’s 1 radian only when the radius is 1 cm. On a circle of radius 4 cm, a 1 cm arc makes 0.25 radians.","_n":"22784","_k":"54773e81"},{"t":"The angle that is one-sixth of a full turn, on any circle.","why":"One-sixth of a turn is 60°, or π/3 ≈ 1.05 radians. A full turn is 2π ≈ 6.28 radians, not 6.","_n":"237b4","_k":"8638beea"},{"t":"The angle that is 1/360 of a full turn, on any circle.","why":"That’s one degree. A radian is about 57.3 times as big.","_n":"247a4","_k":"d6fc9742"}]},"b":{"prompt":"Which statement describes an angle of exactly 2 radians?","options":[{"t":"The angle that is 2/360 of a full turn, on any circle.","why":"That’s 2 degrees.","_n":"256d4","_k":"3eede651"},{"t":"The angle that is one-third of a full turn, on any circle.","why":"One-third of a turn is 2π/3 ≈ 2.09 radians. It would be 2 only if a full turn were exactly 6.","_n":"266c4","_k":"664dd689"},{"t":"The angle at the centre that cuts off an arc 2 cm long, on any circle.","why":"That’s 2 radians only when the radius is 1 cm. On a circle of radius 4 cm, a 2 cm arc makes 0.5 radians.","_n":"27eb6","_k":"18d15356"},{"t":"The angle at the centre of any circle that cuts off an arc as long as the diameter.","why":"The diameter is 2 radius lengths, so the angle is 2 radians.","_n":"28ec6","_k":"72cd7583"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A circle has radius 6 cm. How long is the arc cut off by a central angle of `5π/6`?","fixedOrder":true,"options":[{"t":"`5π/36` cm","why":"That’s `@t{θ} ÷ r`. Arc length is `a = r@t{θ}`: multiply.","_n":"29ed6","_k":"9cb6b012"},{"t":"5π cm","why":"`a = r@t{θ} = 6 × 5π/6 = 5π` cm, about 15.7 cm.","_n":"2aee6","_k":"edff14f4"},{"t":"10π cm","why":"That uses the diameter, 12 cm. `a = r@t{θ}` uses the radius.","_n":"2be76","_k":"4fa2ccc2"},{"t":"900 cm","why":"That’s 6 × 150, using degrees. `@t{θ}` must be in radians.","_n":"2ce86","_k":"c9671d08"}]},"b":{"prompt":"A circle has radius 8 cm. How long is the arc cut off by a central angle of `3π/4`?","fixedOrder":true,"options":[{"t":"`3π/32` cm","why":"That’s `@t{θ} ÷ r`. Multiply instead.","_n":"2de96","_k":"f6f728d6"},{"t":"6π cm","why":"`a = 8 × 3π/4 = 6π` cm, about 18.8 cm.","_n":"2eea6","_k":"e066ac84"},{"t":"12π cm","why":"That uses the diameter, 16 cm.","_n":"2ff36","_k":"8eeeaa73"},{"t":"1080 cm","why":"That’s 8 × 135, using degrees.","_n":"2gf46","_k":"0d0d1269"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A wheel’s painted spoke starts along the positive `x`-axis. The wheel turns counterclockwise through 9 radians. Where does the spoke stop?","use":"π ≈ 3.14","fixedOrder":true,"options":[{"t":"In quadrant 1","why":"That reads 9 radians as 9°. 9 radians is about 516°, more than a full turn.","_n":"2hf16","_k":"f1629d67"},{"t":"In quadrant 2","why":"One full turn is 2π ≈ 6.28, so 9 radians is one turn plus 9 − 6.28 = 2.72. Since π/2 ≈ 1.57 \u003c 2.72 \u003c 3.14 ≈ π, the spoke stops in quadrant 2.","_n":"2if06","_k":"551f6e20"},{"t":"On the negative `x`-axis","why":"That takes π to be exactly 3, so 9 = 3π. But 3π ≈ 9.42, so the spoke stops 0.42 short of the negative `x`-axis.","_n":"2jef6","_k":"9c467767"},{"t":"In quadrant 4","why":"9 is more than 3π/2 ≈ 4.71, but it’s also more than a full turn. Take off the full turn first: 9 − 6.28 = 2.72.","_n":"2kee6","_k":"cb7bfde1"}]},"b":{"prompt":"A wheel’s painted spoke starts along the positive `x`-axis. The wheel turns counterclockwise through 10.5 radians. Where does the spoke stop?","use":"π ≈ 3.14","fixedOrder":true,"options":[{"t":"In quadrant 1","why":"That reads 10.5 radians as 10.5°. 10.5 radians is about 602°, more than a full turn.","_n":"2led6","_k":"309f0d77"},{"t":"In quadrant 3","why":"One full turn is 2π ≈ 6.28, so 10.5 radians is one turn plus 10.5 − 6.28 = 4.22. Since π ≈ 3.14 \u003c 4.22 \u003c 4.71 ≈ 3π/2, the spoke stops in quadrant 3.","_n":"2mec6","_k":"e6cd985a"},{"t":"On the negative `y`-axis","why":"That takes π to be exactly 3, so 10.5 = 3.5π = 7π/2. But 7π/2 ≈ 3.5 × 3.14 = 10.99, so the spoke stops about 0.5 short of the negative `y`-axis.","_n":"2neb6","_k":"35f5d1f7"},{"t":"In quadrant 4","why":"10.5 is more than 3π/2 ≈ 4.71, but it’s also more than a full turn. Take off the full turn first: 10.5 − 6.28 = 4.22.","_n":"2oea6","_k":"0a2da8e9"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"An arc 4π cm long cuts off a central angle of 80°. What is the radius of the circle?","fixedOrder":true,"options":[{"t":"1/9 cm","why":"That’s `@t{θ} ÷ a`. Rearrange `a = r@t{θ}`: `r = a ÷ @t{θ}`.","_n":"2pf96","_k":"929f03e7"},{"t":"π/20 cm","why":"That divides by 80. `a = r@t{θ}` needs `@t{θ}` in radians: 80° = 4π/9.","_n":"2qf86","_k":"f75bd633"},{"t":"4.5 cm","why":"4π ÷ (4π/9) = 9 is the radius itself, not the diameter.","_n":"2ra4e","_k":"db3fc470"},{"t":"9 cm","why":"80° = 80π/180 = 4π/9. Then `r = a ÷ @t{θ}` = 4π ÷ (4π/9) = 9 cm.","_n":"2sa3e","_k":"56eadda1"}]},"b":{"prompt":"An arc 5π cm long cuts off a central angle of 150°. What is the radius of the circle?","fixedOrder":true,"options":[{"t":"π/30 cm","why":"That divides by 150. Convert 150° to radians first: 5π/6.","_n":"2ta6e","_k":"fd05cb40"},{"t":"1/6 cm","why":"That’s `@t{θ} ÷ a`. Use `r = a ÷ @t{θ}`.","_n":"2ua5e","_k":"eaabbfb2"},{"t":"3 cm","why":"5π ÷ (5π/6) = 6 is the radius itself, not the diameter.","_n":"2va0e","_k":"918bac10"},{"t":"6 cm","why":"150° = 5π/6. Then `r` = 5π ÷ (5π/6) = 6 cm.","_n":"2w9fe","_k":"6a242ba8"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Points P and Q are on the same spinning wheel. P is 12 cm from the centre and moves at 40 cm/s. Q is 30 cm from the centre. How fast does Q move?","fixedOrder":true,"options":[{"t":"16 cm/s","why":"That uses the ratio upside down. Q is farther out, so it moves faster.","_n":"2xa2e","_k":"7e169c20"},{"t":"40 cm/s","why":"Points on one wheel share the same ω, not the same speed. Farther out means faster.","_n":"2ya1e","_k":"c265409a"},{"t":"58 cm/s","why":"Adding the extra 18 cm to the speed mixes up a distance and a speed.","_n":"2z9ce","_k":"c1a5b397"},{"t":"100 cm/s","why":"`ω = v ÷ r` = 40 ÷ 12 = 10/3 rad/s for the whole wheel. Q’s speed is 30 × 10/3 = 100 cm/s.","_n":"309be","_k":"af1c6294"}]},"b":{"prompt":"Points P and Q are on the same spinning wheel. P is 8 cm from the centre and moves at 20 cm/s. Q is 28 cm from the centre. How fast does Q move?","fixedOrder":true,"options":[{"t":"about 5.7 cm/s","why":"That uses the ratio upside down (20 × 8/28).","_n":"319ee","_k":"775c65a9"},{"t":"20 cm/s","why":"Same ω, not the same speed.","_n":"329fe","_k":"17a0c5a1"},{"t":"40 cm/s","why":"Adding the extra 20 cm to the speed mixes up a distance and a speed.","_n":"339ce","_k":"65807f79"},{"t":"70 cm/s","why":"ω = 20 ÷ 8 = 2.5 rad/s. Q’s speed is 28 × 2.5 = 70 cm/s.","_n":"349de","_k":"abd04c9e"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"A calculator gives `sin 2 ≈ 0.0349`. Which is the best explanation of what went wrong?","options":[{"t":"“Nothing went wrong. 2 is a small angle, close to 0, and the sine of a small angle is small, so `sin 2 ≈ 0.0349` is right.”","why":"2 radians is about 115°, not a small angle. Its sine is large: about 0.909.","_n":"35a2e","_k":"1fb46f52"},{"t":"“The calculator was in degree mode, so it found `sin 2°`. Here 2 means 2 radians, about 115°, which is in quadrant 2, so `sin 2 ≈ 0.909`.”","why":"This names the cause (degree mode), says what 2 really means, and checks the size: an angle of about 115° has a large sine.","_n":"36a3e","_k":"94f3f247"},{"t":"“It should have found `sin(2π)` instead, because an angle in radians always has π in it. The answer should be `sin(2π) = 0`.”","why":"Angles in radians don’t need π. `sin 2` is the sine of 2 radians.","_n":"37a0e","_k":"374af286"},{"t":"“Only the sign is wrong. 2 radians is past π/2, where sine is negative, so the answer should be `sin 2 ≈ -0.0349`.”","why":"Sine is positive in quadrant 2, and the size is wrong too: 0.0349 is the sine of 2°.","_n":"38a1e","_k":"1095eb24"}]},"b":{"prompt":"A calculator gives `cos 5 ≈ 0.9962`. Which is the best explanation of what went wrong?","options":[{"t":"“The calculator was in degree mode, so it found `cos 5°`. Here 5 means 5 radians, about 286°, which is in quadrant 4, so `cos 5 ≈ 0.284`.”","why":"This names the cause (degree mode), says what 5 really means, and checks the size: 286° is 74° short of a full turn, so its cosine is small.","_n":"3996e","_k":"83e10c05"},{"t":"“It should have found `cos(5π)` instead, because an angle in radians always has π in it. The answer should be `cos(5π) = -1`.”","why":"Angles in radians don’t need π. `cos 5` is the cosine of 5 radians.","_n":"3a97e","_k":"26d57d47"},{"t":"“Nothing went wrong. 5 is a small angle, close to 0, and the cosine of a small angle is close to 1, so `cos 5 ≈ 0.9962` is right.”","why":"5 radians is about 286°, most of the way around the circle. Its cosine is small: about 0.284.","_n":"3b98d","_k":"593d17f8"},{"t":"“Only the sign is wrong. 5 radians is past 3π/2, where cosine is negative, so the answer should be `cos 5 ≈ -0.9962`.”","why":"Cosine is positive in quadrant 4, and the size is wrong too: 0.9962 is the cosine of 5°.","_n":"3c97d","_k":"db8881d2"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why a full turn is 2π radians?","options":[{"t":"“The circumference is `2πr`, so exactly 2π radius lengths fit around the circle. Each radius length of arc makes 1 radian, so a full turn is 2π radians.”","why":"It uses the definition of a radian and the circumference formula, and it works for every circle.","_n":"3d96d","_k":"868bd577"},{"t":"“π is 180, and a full turn is 360°. Since 360 = 2 × 180, a full turn must be 2π radians.”","why":"π is a number, about 3.14. It’s π \u003cstrong>radians\u003c/strong> that equal 180°, and that fact needs its own reason, so this argument goes in a circle.","_n":"3e95d","_k":"24f05332"},{"t":"“About 6 radius lengths fit around a circle, and 6 is close to 2π ≈ 6.28, so a full turn is 2π radians.”","why":"That only shows a full turn is \u003cstrong>close\u003c/strong> to 2π. It doesn’t explain why it’s \u003cstrong>exactly\u003c/strong> 2π.","_n":"3f94d","_k":"29c12210"},{"t":"“Radians are measured in units of π, and a circle has two halves, so a full turn is one π for each half: 2π.”","why":"Radians are defined with the radius, not with π. The π comes from the circumference.","_n":"3g93d","_k":"69b6ffaa"}]},"b":{"prompt":"Which is the best explanation of why half a turn is π radians?","options":[{"t":"“Radians are measured in units of π, and half a turn is exactly one of those units, so half a turn is one π: π radians.”","why":"Radians are defined with the radius, not with π. The π comes from the circumference.","_n":"3h92d","_k":"d3663024"},{"t":"“π is 180, and half a turn is 180°. The two numbers match, so half a turn must be exactly π radians, on any circle.”","why":"π is a number, about 3.14. π \u003cstrong>radians\u003c/strong> equal 180°, and that fact is what needs explaining, so this argument goes in a circle.","_n":"3i91d","_k":"ee28c10a"},{"t":"“Half the circumference is `πr`, so exactly π radius lengths fit around half the circle. Each radius length of arc makes 1 radian, so half a turn is π radians.”","why":"It uses the definition of a radian and half the circumference formula, and it works for every circle.","_n":"3ja0d","_k":"5a3ef963"},{"t":"“About 3 radius lengths fit around half a circle, and 3 is close to π ≈ 3.14, so half a turn is π radians.”","why":"That only shows half a turn is \u003cstrong>close\u003c/strong> to π. It doesn’t explain why it’s \u003cstrong>exactly\u003c/strong> π.","_n":"3k9fd","_k":"e93252b3"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A bike wheel has radius 35 cm and turns at 120 rpm. How fast is the bike moving?","use":"π ≈ 3.14","fixedOrder":true,"options":[{"t":"0.70 m/s","why":"That treats 2 turns per second as 2 rad/s. One turn is 2π radians.","_n":"3l92d","_k":"f1e9a738"},{"t":"4.40 m/s","why":"ω = 120 × 2π ÷ 60 = 4π rad/s. `v = rω` = 35 × 4π = 140π ≈ 439.6 cm/s ≈ 4.40 m/s.","_n":"3m93d","_k":"1ffd3fe7"},{"t":"8.79 m/s","why":"That uses the diameter, 70 cm. `v = rω` uses the radius.","_n":"3n94d","_k":"a8420f18"},{"t":"263.76 m/s","why":"That forgets to divide by 60, so it’s a per-minute rate treated as per second.","_n":"3o95d","_k":"d9d338cc"}]},"b":{"prompt":"A ceiling fan’s blade tip is 60 cm from the centre, and the fan turns at 90 rpm. How fast does the tip move?","use":"π ≈ 3.14","fixedOrder":true,"options":[{"t":"0.90 m/s","why":"That treats 1.5 turns per second as 1.5 rad/s.","_n":"3p8ed","_k":"72bb5fc4"},{"t":"5.65 m/s","why":"ω = 90 × 2π ÷ 60 = 3π rad/s. `v` = 60 × 3π = 180π ≈ 565.2 cm/s ≈ 5.65 m/s.","_n":"3q8fd","_k":"d87fe569"},{"t":"11.30 m/s","why":"That uses the diameter, 120 cm.","_n":"3r90d","_k":"c337e930"},{"t":"339.12 m/s","why":"That forgets to divide by 60.","_n":"3s91d","_k":"a0def43c"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Two weather stations in northern Canada lie on the same north–south line. Their latitudes differ by 9°, which is the angle between them at Earth’s centre. Earth’s radius is about 6400 km. About how far apart are they along Earth’s surface?","use":"π ≈ 3.14","fixedOrder":true,"options":[{"t":"320 km","why":"That uses 9/180 as the angle in radians and drops the π. 9° = 9π/180 = π/20.","_n":"3t9ad","_k":"fe555053"},{"t":"1005 km","why":"9° = π/20, so `a = r@t{θ}` = 6400 × π/20 = 320π ≈ 1005 km.","_n":"3u9bd","_k":"265d66da"},{"t":"2010 km","why":"That uses Earth’s diameter, 12 800 km. Use the radius.","_n":"3v0cd","_k":"b212834c"},{"t":"57 600 km","why":"That’s 6400 × 9, using degrees. It’s longer than the whole way around Earth (about 40 000 km).","_n":"3w0bd","_k":"fe8888b4"}]},"b":{"prompt":"Two weather stations in northern Canada lie on the same north–south line. Their latitudes differ by 22.5°, which is the angle between them at Earth’s centre. Earth’s radius is about 6400 km. About how far apart are they along Earth’s surface?","use":"π ≈ 3.14","fixedOrder":true,"options":[{"t":"800 km","why":"That uses 22.5/180 = 1/8 as the angle in radians and drops the π. 22.5° = 22.5π/180 = π/8.","_n":"3x0ed","_k":"02ae8854"},{"t":"2512 km","why":"22.5° = π/8, so `a = r@t{θ}` = 6400 × π/8 = 800π ≈ 2512 km.","_n":"3y0dd","_k":"d72fcbaf"},{"t":"5024 km","why":"That uses Earth’s diameter, 12 800 km. Use the radius.","_n":"3z10d","_k":"7f990b50"},{"t":"144 000 km","why":"That’s 6400 × 22.5, using degrees. It’s more than three times the whole way around Earth (about 40 000 km).","_n":"400fd","_k":"382b361a"}]}}]},"task":{"title":"Roll to quadrant 2","summary":"Roll to quadrant 2","statement":"\u003cp>A robotics club is testing a wheel with a painted spoke. In the picture the robot drives to the left, so the wheel turns counterclockwise, the same way as an angle in standard position. The spoke starts along the positive `x`-axis. Choose the wheel’s radius and the driving distance so that the robot drives 40 to 60 cm, the wheel makes more than one full turn but fewer than two, and the painted spoke stops in quadrant 2. There’s more than one design. Can you find the shortest and the longest drive for your wheel?\u003c/p>","checks":["The robot drives 40 to 60 cm","The wheel makes more than one full turn but fewer than two","The painted spoke stops in quadrant 2"],"tips":["Choose a distance from 40 to 60 cm.","The wheel turns `@t{θ} = d ÷ r` radians. One full turn is 2π ≈ 6.28 and two full turns are 4π ≈ 12.57. Right now `@t{θ}` ≈ {th}.","Take off the full turns: the spoke’s angle is about {phi}. Quadrant 2 runs from π/2 ≈ 1.57 to π ≈ 3.14. Together with line 2, `@t{θ}` must be between 5π/2 ≈ 7.85 and 3π ≈ 9.42."],"invalid":"Enter a whole number from 10 to 100.","explainPrompt":"Explain how you know the spoke stops in quadrant 2. Then explain why a 4 cm or an 8 cm wheel can’t meet all three conditions, whatever distance you choose.","vocab":"Use the words radian, arc length, full turn and quadrant.","success":"Your design works!","more":"There’s more than one answer. Can you find the shortest and longest drive for your wheel?","afterBoth":"Only 5 cm and 6 cm wheels work. `@t{θ}` must be between 5π/2 ≈ 7.85 and 3π ≈ 9.42, so `d` must be between 7.85`r` and 9.42`r`. That range overlaps 40 to 60 only when `r` is 5 or 6."},"cards":[["One radian","The angle at the centre of a circle that cuts off an arc as long as the radius. It’s about 57.3°, on any circle."],["A full turn and a half turn","Full turn: 2π radians = 360°. Half turn: π radians = 180°."],["Degrees → radians","Multiply by π/180. Example: 150° = 150π/180 = 5π/6."],["Radians → degrees","Multiply by 180/π. Example: 7π/4 × 180/π = 315°."],["The benchmarks","π/2 ≈ 1.57, π ≈ 3.14, 3π/2 ≈ 4.71, 2π ≈ 6.28. Example: 4 radians is between π and 3π/2, in quadrant 3."],["Arc length","`a = r@t{θ}`, with `@t{θ}` in radians. Example: `r` = 5 cm and `@t{θ} = 2π/5` give `a` = 2π cm."],["`@t{θ} = a ÷ r`","An angle in radians counts how many radius lengths fit along its arc. An arc of 12 cm on a circle of radius 8 cm makes 1.5 radians."],["Angular velocity","`ω = @t{θ} ÷ t`, the angle turned per unit of time, usually in rad/s."],["rpm → rad/s","Multiply by 2π, then divide by 60. Example: 30 rpm = π rad/s. (“Revolutions per minute” means the same thing.)"],["`v = rω`","All points on one wheel share ω. A point at distance `r` moves at speed `rω`, so farther out is faster."],["Belts, chains and meshing gears","The rims move at the same speed: `r_1ω_1 = r_2ω_2`. The smaller wheel turns faster."],["`sin 2` vs `sin 2°`","`sin 2` means 2 radians: `sin 2 ≈ 0.909`. A calculator in degree mode gives `sin 2° ≈ 0.035` instead."]]}};</script>
