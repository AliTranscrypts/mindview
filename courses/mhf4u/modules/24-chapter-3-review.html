.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 24: hero (glowing equation parts), per-topic tables, Connect (anatomy board, link bar, one page), mixed practice, task */
.hero .hero-eq.sm{font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.5}
.hero .hero-eq .m{white-space:normal}
.hero-eq .hx{border-radius:5px;padding:0 1px;transition:background-color .3s ease,box-shadow .3s ease}
.hero-eq .hx.on{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi)}
#hero-cap{font:400 .95rem/1.5 var(--font-ui);color:var(--ink-2);display:grid;gap:2px}
#hero-cap .hc-l{display:block}
#hero-cap .hc-l.cur{color:var(--ink);font-weight:600}
#hero-cap .m{white-space:normal}
/* toolkit workaround: the visually hidden "(done)" text in a step button escaped the scrolling step bar on phones */
.steps .step{position:relative}
/* per-topic tables */
.tt-wrap{overflow-x:auto;margin:10px 0}
.tt td:nth-child(2){white-space:nowrap}
.tt td:last-child{white-space:nowrap}
.tt tr.tt-rev td{border-bottom:0}
.tt tr.tt-more td{padding-top:0;white-space:normal}
.tt-key{padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.tt-key p{margin:0 0 .3em;max-width:none}
.tt-key p:last-child{margin:0}

/* Connect: N18 connection builder */
.cv-chal{border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--paper)}
.cv-chal .q-prompt{font-weight:700}
.cv-chal .how{margin:8px 0 0}
.cv-chal .fb .m{white-space:nowrap}
.cv-top{flex-wrap:wrap}
.cv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.cv-top .dots{flex:0 0 auto}
.cv-nav{border-top:1px solid var(--rule);padding-top:10px}
.an-row{position:relative;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:14px 22px;align-items:start;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.an-eq{min-width:0;position:relative;z-index:2}
.an-form{margin:0 0 2px}
.an-eqline{font:400 1.3rem/1.5 var(--font-math);margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.an-eqline > .m{margin-right:.25em}
.an-eqline .frac{vertical-align:middle}
.an-eqline .fn,.an-eqline .fd{padding:2px 0}
.an-part{position:relative;z-index:2;margin:1px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:0 .3em;font:inherit;line-height:1.35;min-height:32px;min-width:30px;cursor:pointer}
.an-part:not(:disabled):hover{border-color:var(--pen)}
.an-part:disabled{cursor:default;opacity:1}
.an:not(.live) .an-part:not(.linked){border-color:transparent}
.an-part.linked{border-color:var(--hi);box-shadow:inset 0 -3px 0 var(--hi)}
.an-part.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);box-shadow:none}
.an-divl{font-size:1.05rem}
.an-dl{font:700 .85rem var(--font-ui)}
.an-gr{min-width:0}
.an-gt{margin:0 0 4px;font:700 .85rem var(--font-ui);color:var(--ink-2)}
.an-pw{position:relative}
.an-ft{position:absolute;transform:translate(-50%,-50%);z-index:2}
.an-ft.pt{width:28px;height:28px;border-radius:50%;border:0;background:transparent;padding:0}
.an-ft.pt:not(:disabled){cursor:pointer}
.an-ft.pt:not(:disabled):hover{box-shadow:0 0 0 2px var(--pen) inset}
.an-ft.pt.on{box-shadow:0 0 0 3px var(--ink) inset}
.an-ft.pill{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:0 .6em;font:400 1rem/1.2 var(--font-math);white-space:nowrap;min-height:28px}
.an-ft.pill:not(:disabled){cursor:pointer}
.an-ft.pill:not(:disabled):hover{border-color:var(--pen)}
.an-ft.pill:disabled{opacity:1}
.an-ft.pill.linked{border:2.5px solid var(--hi)}
.an-ft.pill.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.an-ft:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.an-links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.an-ln{stroke:var(--hi);stroke-width:2.5;stroke-linecap:round;stroke-opacity:.7}
.an-ln.cur{stroke-width:5;stroke-opacity:1}
.an-end{fill:var(--ink)}
.an-bar{position:sticky;bottom:0;z-index:5;margin-top:16px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.an-bar[hidden]{display:none}
.an-sel{margin:0;flex:1 1 300px;display:grid;gap:2px;font-size:.95rem;max-width:none}
.an-bar .q-actions{margin:0}
.an-one{margin-top:18px}
.an-one h3{margin:0 0 6px}
.an-onegrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start;margin-top:8px}
.an-flist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.an-flist li{display:flex;gap:10px;align-items:flex-start}
.an-flist .tag{display:inline-block;margin:2px 0 0}
.an-bd{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);font:700 .8rem var(--font-ui);background:var(--sheet)}
@media (max-width:700px){
  .an-row{grid-template-columns:minmax(0,1fr)}
  .an-pw canvas.plot{aspect-ratio:1/1}
  .an-eqline{font-size:1.18rem}
  .an-onegrid{grid-template-columns:minmax(0,1fr)}
}

/* Mixed practice */
@media (max-width:560px){
  .mx-q .q-head{flex-wrap:wrap}
  .mx-q .q-head .tags{order:-1;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
}
.mx-q .q-prompt{font-weight:700}
.mx-q .numrow{flex-wrap:wrap}
.mx-pair{gap:10px 22px}
.mx-cell{display:inline-flex;align-items:center;gap:8px}
.mx-lab .m{font-size:1.05rem}
.mx-unit{font-size:.95rem;color:var(--ink-2)}
.mx-ib{margin-top:6px}
.mx-ib canvas.plot.nl{aspect-ratio:auto;height:104px;min-height:0}
.mx-yours{margin:12px 0 0}
.mx-yours .m{white-space:normal}
.mx-sum{margin-top:6px}

/* Task: build a rational function to spec (N26 factor tiles, from MHF4U 21) */
.pt-conds{margin:8px 0 12px;padding-left:1.4em;display:grid;gap:4px}
.pt-how{margin:4px 0 8px}
.tk-h{margin:0 0 6px}
.tk-eq{font-size:clamp(1.1rem,2.8vw,1.45rem)}
.tk-eq .m{white-space:normal}
.tk-sl{margin:12px 0 4px;font:700 .85rem var(--font-ui);color:var(--ink-2)}
#tk-read{margin-top:10px}
.tk-sc{border-collapse:collapse;font:400 1rem var(--font-math)}
.tk-sc th{font:700 .8rem var(--font-ui);color:var(--ink-2);text-align:left;padding:4px 8px;white-space:nowrap;background:var(--paper)}
.tk-sc td{border:1px solid var(--rule);padding:4px 8px;text-align:center;white-space:nowrap}
.tk-sc td.neg{background:var(--hi-soft);font-weight:700}
.tk-sc td.cv{font:700 .8rem var(--font-ui)}
.ft-wrap{display:grid;gap:4px}
.ft-a{display:flex;align-items:center;gap:8px}
.ft-a .ft-const{flex-direction:row;gap:8px}
.ft-times{display:none}
.ft{position:relative;min-width:0;display:grid;gap:6px;padding:4px 0}
.ft-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:48px;position:relative;z-index:1}
.ft-lab{flex:1 0 100%;font:700 .75rem var(--font-ui);color:var(--ink-2)}
.ft-row[data-row="bot"] .ft-lab{order:9}
.ft-bar{border-top:2.5px solid var(--ink);margin:2px 0}
.ft-const{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.ft-cl{font:400 1.15rem var(--font-math);color:var(--ink)}
.ft-cb{display:inline-flex;align-items:center;gap:3px}
.ft-cv{display:inline-block;min-width:1.6em;text-align:center;font:600 1.2rem var(--font-math)}
.ft-tile{display:inline-flex;align-items:center;gap:2px;border:2px solid var(--rule);border-radius:10px;background:var(--sheet);padding:3px;min-height:42px;position:relative}
.ft-tile.match{background:var(--hi-soft);border-color:var(--hi)}
.ft-f{font:400 1.18rem var(--font-math);padding:0 4px;white-space:nowrap}
.ft-b{min-width:30px;min-height:30px;border:1.5px solid var(--rule);border-radius:7px;background:var(--sheet);color:var(--ink);font-weight:700;font-size:1rem;padding:0}
.ft-b:disabled{opacity:.4}
.ft-x{min-width:26px;min-height:26px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);font-size:1rem;padding:0}
.ft-x:hover{color:var(--red)}
.ft-add{padding:.35em .7em}
.ft-links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ft-links line{stroke:var(--ink-2);stroke-width:1.5}
@media (max-width:560px){
  .ft-f{font-size:1.08rem;padding:0 2px}
}
@media (prefers-reduced-motion:reduce){
  .hero-eq .hx{transition:none}
}

e or no vertical asymptotes; the vertex becomes a local max or min with value 1 ÷ (vertex `y`).","look":"Reciprocal plotter (Explore); Three cases, one routine (Three cases)"},"20":{"idea":"`{ax + b}/{cx + d}`: vertical `x = -d/c`, horizontal `y = a/c`.","look":"Asymptote crosshair (Explore); Sketch from the equation (Sketch)"},"21":{"idea":"A cancelled factor is a hole; numerator degree one higher means divide for the oblique asymptote.","look":"Cancel-and-divide lab (Explore); Hole or asymptote? Under the microscope (Microscope)"},"22":{"idea":"Restrictions first; reject extraneous roots; sign charts with round brackets at restrictions.","look":"Two-sides grapher (Explore); Sign charts with restrictions (Sign charts)"},"23":{"idea":"In context, the horizontal asymptote is a long-run value that is approached, not reached.","look":"Cost and concentration simulator (Explore); What does the asymptote mean here? (Meaning)"}},"start":{"diagnostic":{"title":"Diagnostic: which modules should I revisit?","intro":"Nine questions, at least one from each Chapter 3 module. Pick an answer, say how sure you are, then check it. At the end you’ll see which modules to revisit.","questions":[{"id":"d1","topic":"17","goal":1,"prompt":"What is the domain of `f(x) = {x + 1}/{x^2 - 9}`?","options":[{"t":"`{x ∈ ℝ | x ≠ -1}`","why":"−1 makes the \u003cstrong>numerator\u003c/strong> 0; that’s allowed.","_n":"0ecf","_k":"8bd47c6b"},{"t":"`{x ∈ ℝ | x ≠ 3}`","why":"`(-3)^2 - 9 = 0` too.","_n":"1ebf","_k":"b57cb7a7"},{"t":"`{x ∈ ℝ | x ≠ -3, 3}`","why":"`x^2 - 9 = 0` at `x = ±3`.","_n":"2eaf","_k":"6111063c"},{"t":"`{x ∈ ℝ | x ≠ 9}`","why":"Solve `x^2 = 9`, not `x = 9`.","_n":"3e9f","_k":"ff2943fe"}],"hints":["Where is the denominator 0?","`x^2 - 9 = (x - 3)(x + 3)`.","`x ≠ ±3`."]},{"id":"d2","topic":"18","goal":2,"prompt":"What are the asymptotes of `y = {1}/{2x - 6}`?","options":[{"t":"Vertical `x = -3`; horizontal `y = 0`","why":"The asymptote is where the denominator is 0: `2x - 6 = 0` at `x = 3`.","_n":"4e8f","_k":"8c598350"},{"t":"Vertical `x = 6`; horizontal `y = 0`","why":"Solve `2x - 6 = 0`: `x = 3`.","_n":"5e7f","_k":"7c50d07a"},{"t":"Vertical `x = 3`; horizontal `y = 0`","why":"`2x - 6 = 0` at `x = 3`; 1 ÷ (huge) → 0.","_n":"6e6f","_k":"cf62e983"},{"t":"Vertical `x = 3`; horizontal `y = 2`","why":"The numerator is constant, so `y → 0`.","_n":"7f5f","_k":"0b3df4c3"}],"hints":["Where is the denominator 0?","`x = 3`.","And `y → 0` for large `|x|`."]},{"id":"d3","topic":"19","goal":3,"prompt":"Which is true for `y = {1}/{x^2 - 4x + 5}`?","options":[{"t":"No vertical asymptotes; a local maximum at `(2, 1)`","why":"`x^2 - 4x + 5 = (x - 2)^2 + 1 ≥ 1`, never 0; its minimum 1 at `x = 2` gives the reciprocal’s maximum `1/1`.","_n":"8f4f","_k":"06b87fa6"},{"t":"A vertical asymptote at `x = 2`","why":"The quadratic is never 0.","_n":"9114","_k":"3efa54c2"},{"t":"A local minimum at `(2, 1)`","why":"The smallest denominator gives the largest value: a maximum.","_n":"a124","_k":"f0b092c1"},{"t":"Vertical asymptotes at `x = 1` and `x = 5`","why":"`x^2 - 4x + 5` doesn’t factor; its discriminant is −4.","_n":"b0f4","_k":"d31c5e5d"}],"hints":["Complete the square.","`(x - 2)^2 + 1`.","Minimum 1 → reciprocal maximum 1."]},{"id":"d4","topic":"20","goal":4,"prompt":"What are the asymptotes of `y = {3x - 2}/{x + 4}`?","options":[{"t":"Vertical `x = -4`; horizontal `y = 3`","why":"`x + 4 = 0` at −4; for large `|x|`, `3x/x = 3`.","_n":"c104","_k":"28687592"},{"t":"Vertical `x = -4`; horizontal `y = -1/2`","why":"That’s `b/d`. For large `|x|`, only `3x` and `x` matter: `y → 3`.","_n":"d154","_k":"0574944f"},{"t":"Vertical `x = 2/3`; horizontal `y = 3`","why":"`2/3` is the `x`-intercept.","_n":"e164","_k":"0f564f61"},{"t":"Vertical `x = 4`; horizontal `y = 3`","why":"The asymptote is where the denominator is 0: `x + 4 = 0` at `x = -4`.","_n":"f134","_k":"e07c757f"}],"hints":["Denominator zero?","`x = -4`.","Leading coefficients: `3/1`."]},{"id":"d5","topic":"21","goal":5,"prompt":"What happens at `x = 3` on the graph of `y = {x^2 - x - 6}/{x - 3}`?","options":[{"t":"A hole at `(-2, 0)`","why":"−2 is the `x`-intercept.","_n":"g144","_k":"a14a56dd"},{"t":"A hole at `(3, 0)`","why":"The hole’s height is the simplified function’s value: `3 + 2`.","_n":"h194","_k":"91114517"},{"t":"A vertical asymptote `x = 3`","why":"The factor cancels. If the factor cancels, the graph has a hole there (an open circle), not an asymptote.","_n":"i1a4","_k":"018c7562"},{"t":"A hole at `(3, 5)`","why":"`{(x - 3)(x + 2)}/{x - 3} = x + 2` for `x ≠ 3`; at 3 that would be 5.","_n":"j2b4","_k":"90e20cc8"}],"hints":["Factor the numerator.","`(x - 3)(x + 2)`.","Cancel: `y = x + 2`, hole at `(3, 5)`."]},{"id":"d6","topic":"21","goal":5,"prompt":"What is the oblique asymptote of `y = {x^2 + 3x - 1}/{x - 1}`?","options":[{"t":"`y = x + 2`","why":"Check the division: 1, `1 + 3 = 4`.","_n":"k2a4","_k":"ab19d325"},{"t":"`y = x - 1`","why":"That’s the denominator.","_n":"l294","_k":"123485ce"},{"t":"`y = x + 4`","why":"`x^2 + 3x - 1 = (x - 1)(x + 4) + 3`.","_n":"m284","_k":"59ebf585"},{"t":"`y = x + 3`","why":"That copies the numerator’s coefficients. Divide: the quotient (without the remainder) is the oblique asymptote.","_n":"n274","_k":"1a9f3b82"}],"hints":["Divide by `x - 1`.","Synthetic division with 1: 1 | 4 | 3.","Quotient `x + 4`."]},{"id":"d7","topic":"22","goal":6,"prompt":"Solve `{3}/{x - 1} = {6}/{x + 1}`.","options":[{"t":"`x = 1/3`","why":"Check: `3/(-2/3) ≠ 6/(4/3)`.","_n":"o264","_k":"d6a4f256"},{"t":"`x = -3`","why":"`3x + 3 = 6x - 6` gives `9 = 3x`.","_n":"p254","_k":"b8bef99e"},{"t":"`x = 3`","why":"`3(x + 1) = 6(x - 1)` gives `x = 3`; it isn’t a restricted value.","_n":"q244","_k":"1e8b1f4d"},{"t":"`x = 1`","why":"`x = 1` is a restriction. State the restrictions first; a value that makes a denominator 0 can’t be a solution.","_n":"r234","_k":"e652125a"}],"hints":["Restrictions: `x ≠ ±1`.","Cross-multiply.","`x = 3`."]},{"id":"d8","topic":"22","goal":6,"prompt":"Solve `{x - 2}/{x + 3} ≥ 0`.","options":[{"t":"`(-∞, -3] ∪ [2, ∞)`","why":"`x = -3` makes the denominator 0. A restriction always gets a round bracket.","_n":"s224","_k":"b3a01216"},{"t":"`(-3, 2]`","why":"That’s where it’s ≤ 0.","_n":"ta54","_k":"8b769f4f"},{"t":"`(-∞, -3) ∪ (2, ∞)`","why":"≥ includes the zero at `x = 2`.","_n":"ua64","_k":"fc4279c1"},{"t":"`(-∞, -3) ∪ [2, ∞)`","why":"Critical values −3 (excluded) and 2 (included).","_n":"va74","_k":"a4529378"}],"hints":["Zeros of the top and bottom?","2 and −3; test each interval.","`(-∞, -3) ∪ [2, ∞)`."]},{"id":"d9","topic":"23","goal":7,"prompt":"The average cost per item is `C(n) = {500 + 4n}/{n}` dollars for `n` items. What does its horizontal asymptote tell you?","options":[{"t":"The minimum possible average cost is exactly $4","why":"It approaches $4 but never reaches it.","_n":"wa84","_k":"e6c93691"},{"t":"As production grows, the average cost gets closer and closer to $4 per item","why":"`{500 + 4n}/{n} = {500}/{n} + 4 → 4`.","_n":"xa14","_k":"fcc03bdc"},{"t":"The average cost is $4 when `n = 0`","why":"`C(0)` is undefined.","_n":"ya24","_k":"687f4319"},{"t":"The total cost approaches $4","why":"The total cost `500 + 4n` grows without limit.","_n":"za34","_k":"76677e83"}],"hints":["Split the fraction.","`{500}/{n} + 4`.","`{500}/{n} → 0`."]}]}},"connect":{"heading":"Rational function anatomy","intro":"Chapter 3 taught each feature in its own module. Here every feature of two functions is on one screen. Link each part of an equation to the feature of the graph it creates.","summary":"Anatomy links","how":"Tap a part of an equation, then the feature on a graph that it creates. Then press Link.","ui":{"expanded":"Expanded","factored":"Factored","divide":"Divide","link":"Link","clear":"Clear","part":"Equation part","feat":"Graph feature","none":"none yet","needBoth":"Choose an equation part and a graph feature first.","otherGraph":"That feature is on the other function’s graph. Link a part of an equation to a feature of the same function.","fGraph":"Graph of `f`","gGraph":"Graph of `g`","holeQ":"hole","done":"All eight links made."},"parts":{"lead":"the leading terms `2x^2` and `x^2`","const":"the constants −4 and −6","n1":"`(x - 1)` in the numerator","c2":"the factor `(x + 2)`, top and bottom","d3":"`(x - 3)` in the denominator","gnum":"`g`’s numerator, `x^2 - 4 = (x - 2)(x + 2)`","gden":"`g`’s denominator, `x - 1`","gdiv":"dividing `x^2 - 4` by `x - 1`"},"feats":{"fva":"the dashed line `x = 3` on `f`","fha":"the dashed line `y = 2` on `f`","fhole":"the open circle (hole) on `f`","fx":"the point `(1, 0)` on `f`","fy":"the point `(0, 2/3)` on `f`","gva":"the dashed line `x = 1` on `g`","goa":"the slanted dashed line `y = x + 1` on `g`","gx":"the points `(-2, 0)` and `(2, 0)` on `g`","gy":"the point `(0, 4)` on `g`"},"challenges":[{"id":"AN1","topics":["17","20"],"goal":1,"type":"link","prompt":"Which part of `f` makes the vertical asymptote?","_a":"E1ADH18SAEA=","why":"`(x - 3)` stays in the denominator after cancelling, so `x = 3` is a vertical asymptote.","fb":{"part:c2":"That factor cancels: it makes the hole.","partDefault":"A vertical asymptote comes from a factor of the denominator that doesn’t cancel.","featDefault":"`x - 3 = 0` at `x = 3`. Link it to the feature at `x = 3`."}},{"id":"AN2","topics":["21"],"goal":5,"type":"link","prompt":"Which part makes the hole, and where is it?","_a":"E1cCH18MDg5UFg==","why":"`(x + 2)` cancels, so `f(x) = {2(x - 1)}/{x - 3}` for `x ≠ -2`. The hole’s height is the simplified `f`: `{2(-3)}/{-5} = 6/5` = 1.2. The hole is at `(-2, 6/5)`.","fb":{"featDefault":"The hole’s height is the simplified `f`: `2(-3)/(-5) = 6/5`.","part:d3":"`(x - 3)` doesn’t cancel, so it makes the vertical asymptote. If the factor cancels, the graph has a hole there (an open circle), not an asymptote.","partDefault":"A hole comes from a factor that cancels: it’s in the numerator and the denominator."}},{"id":"AN3","topics":["17","20"],"goal":1,"type":"link","prompt":"What sets the horizontal asymptote?","_a":"E1hVAl0YBwpQFg==","why":"Equal degrees: for large `|x|`, `f(x) ≈ {2x^2}/{x^2} = 2`, so the horizontal asymptote is `y = 2`.","fb":{"part:const":"The constants matter near 0, not far out.","partDefault":"For large `|x|`, only the leading terms matter.","featDefault":"Equal degrees: the ratio of the leading coefficients, `2/1`, gives a horizontal line."}},{"id":"AN4","topics":["20"],"goal":4,"type":"link","prompt":"Which part makes the `x`-intercept?","_a":"E1oBH18cQw==","why":"`(x - 1)` stays in the numerator, so `f(1) = 0`: the `x`-intercept is `(1, 0)`.","fb":{"part:c2":"It cancels, so it can’t make an intercept.","partDefault":"`f(x) = 0` where the simplified numerator is 0.","featDefault":"`x - 1 = 0` at `x = 1`, where the graph meets the `x`-axis."}},{"id":"AN5","topics":["20"],"goal":4,"type":"link","prompt":"Where does the `y`-intercept come from?","_a":"E1dfDUoQHQRIFg==","why":"`f(0) = {-4}/{-6} = 2/3`: the `y`-intercept is `(0, 2/3)`.","fb":{"partDefault":"Substitute `x = 0` into the original or the simplified form.","featDefault":"Substitute `x = 0` into the original or the simplified form."}},{"id":"AN6","topics":["21"],"goal":5,"type":"link","prompt":"What makes `g`’s slanted dashed line?","_a":"E1NUCk8YBg1QFg==","why":"`x^2 - 4 = (x - 1)(x + 1) - 3`, so `g(x) = x + 1 - {3}/{x - 1}`. For large `|x|` the remainder part → 0: the oblique asymptote is `y = x + 1`.","fb":{"partDefault":"`g`’s numerator has degree one more than its denominator: divide.","featDefault":"The quotient `x + 1` is a line. Which feature of `g` is a slanted line?"}},{"id":"AN7","topics":["17","20"],"goal":4,"type":"link","prompt":"Which part makes `g`’s `x`-intercepts?","_a":"E1NeFlQYBhoT","why":"`x^2 - 4 = (x - 2)(x + 2)` is 0 at `x = ±2`, and the denominator `x - 1` isn’t 0 there: the `x`-intercepts are `(-2, 0)` and `(2, 0)`.","fb":{"partDefault":"`g(x) = 0` when the numerator is 0 (and the denominator isn’t).","featDefault":"`g(x) = 0` when the numerator is 0 (and the denominator isn’t)."}},{"id":"AN8","topics":["17","21"],"goal":5,"type":"choose","stretch":true,"prompt":"Which single change to `f`’s numerator would turn its hole into a second vertical asymptote, and what would happen to the horizontal asymptote?","options":[{"t":"Multiply the numerator by `(x + 2)`: then `x = -2` is a vertical asymptote and the horizontal asymptote stays `y = 2`.","why":"That cancels with the denominator again.","_n":"10a44","_k":"e327f8a7"},{"t":"Remove the factor `(x - 1)`: then `x = -2` is a vertical asymptote and the horizontal asymptote becomes `y = 0`.","why":"`(x + 2)` still cancels, so the hole stays. Removing `(x - 1)` only removes the `x`-intercept.","_n":"119d4","_k":"03ab4912"},{"t":"Remove the factor `(x + 2)`: then `x = -2` is a vertical asymptote and the horizontal asymptote stays `y = 2`.","why":"Without `(x + 2)` the numerator has degree 1 and the denominator degree 2. Numerator degree lower: `y = 0`.","_n":"129e4","_k":"3a910448"},{"t":"Remove the factor `(x + 2)`: then `x = -2` is a vertical asymptote and, with the numerator’s degree now lower, the horizontal asymptote becomes `y = 0`.","why":"`f(x) = {2(x - 1)}/{(x - 3)(x + 2)}`: nothing cancels, so `x = -2` and `x = 3` are both vertical asymptotes. Degree 1 over degree 2 gives `y = 0`.","_n":"139f4","_k":"68bab5e1"}]}],"onePage":{"title":"The chapter on one page","intro":"Every feature of `f`, tagged with the module that taught it.","aria":"Anatomy diagram of f of x equals 2(x − 1)(x + 2) over (x − 3)(x + 2): restrictions x ≠ −2 and x ≠ 3; dashed vertical asymptote x = 3; dashed horizontal asymptote y = 2; a hole at (−2, 6/5); x-intercept (1, 0); y-intercept (0, 2/3); the graph is below the x-axis on (1, 3).","feats":[{"id":"restr","t":"Restrictions `x ≠ -2` and `x ≠ 3`: the zeros of the denominator","mods":"17"},{"id":"va","t":"Vertical asymptote `x = 3`: `(x - 3)` doesn’t cancel","mods":"17, 18 and 20"},{"id":"ha","t":"Horizontal asymptote `y = 2`: equal degrees, `{2x^2}/{x^2}`","mods":"17 and 20"},{"id":"hole","t":"Hole at `(-2, 6/5)`: `(x + 2)` cancels","mods":"21"},{"id":"xi","t":"`x`-intercept `(1, 0)`: the simplified numerator `2(x - 1)`","mods":"20"},{"id":"yi","t":"`y`-intercept `(0, 2/3)`: `f(0) = {-4}/{-6}`","mods":"20"},{"id":"neg","t":"`f(x) \u003c 0` on `(1, 3)`: the sign chart","mods":"22"}]}},"mixed":{"heading":"Mixed practice","intro":"Twelve questions from every Chapter 3 module, mixed up on purpose, so you practise choosing the right idea. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Twelve questions from all seven modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"20","goal":4,"kind":"pair","star":true,"prompt":"`y = {ax + 1}/{x + d}` has vertical asymptote `x = 2` and horizontal asymptote `y = -3`. Find `a` and `d`.","labels":["`a =`","`d =`"],"_a":"ahkDTxRWPA==","display":"`a = -3`, `d = -2`","why":"Vertical: `x = -d`, so `d = -2`. Horizontal: `a/1`, so `a = -3`.","wrong":[{"match":[null,2],"fb":"`x + d = 0` at `x = 2` means `d = -2`."}],"hints":["Vertical: `x = -d`.","Horizontal: `a/1`.","`a = -3`, `d = -2`."]},{"id":"mp2","topic":"17","goal":1,"kind":"mc","prompt":"Which function has the horizontal asymptote `y = 0`?","options":[{"t":"`y = 3 + {1}/{x}`","why":"`y → 3`.","_n":"149e4","_k":"539756c2"},{"t":"`y = {5}/{x^2 + 1}`","why":"Numerator degree lower → `y = 0`.","_n":"15a14","_k":"d6314c98"},{"t":"`y = {x^2 + 1}/{x}`","why":"Numerator degree higher: oblique.","_n":"16a04","_k":"e6e60b39"},{"t":"`y = {2x + 1}/{x - 3}`","why":"Degrees equal: `y = 2`.","_n":"17a34","_k":"d117e04f"}],"hints":["Compare degrees.","Numerator degree lower → `y = 0`.","`{5}/{x^2 + 1}`."]},{"id":"mp3","topic":"22","goal":6,"kind":"set","prompt":"Solve `{x^2}/{x - 2} = {4}/{x - 2}`.","label":"Every solution, separated by commas:","_a":"ahkCPg==","display":"`x = -2`","why":"Restriction `x ≠ 2`; then `x^2 = 4` gives ±2, and 2 is extraneous. Only −2.","wrong":[{"match":[2,-2],"fb":"`x = 2` makes the denominator 0: extraneous."},{"match":[2],"fb":"`x = 2` makes the denominator 0: extraneous."}],"hints":["Restriction?","`x ≠ 2`; then `x^2 = 4`.","Only −2."]},{"id":"mp4","topic":"19","goal":3,"kind":"mc","prompt":"`y = {1}/{x^2 - 2x - 8}`. Which describes it between its vertical asymptotes?","options":[{"t":"Below the axis, local maximum `(1, -9)`","why":"At the quadratic’s vertex, the reciprocal’s value is 1 ÷ (the vertex’s `y`-value).","_n":"18a24","_k":"c6143049"},{"t":"Below the axis, local maximum `(1, -1/9)`","why":"`(x - 4)(x + 2)`: asymptotes −2 and 4. The quadratic’s vertex is `x = 1`, value −9, and `1/(-9) = -1/9`, a local max.","_n":"19a54","_k":"42ac1178"},{"t":"Above the axis, local minimum `(1, 1/9)`","why":"The quadratic is negative between its zeros.","_n":"1aa44","_k":"6927371a"},{"t":"Below the axis, local minimum `(1, -1/9)`","why":"The largest denominator in size gives the value closest to 0: a maximum.","_n":"1b974","_k":"48fcbd42"}],"hints":["`(x - 4)(x + 2)`: asymptotes −2 and 4.","The quadratic’s vertex: `x = 1`, value −9.","`1/(-9) = -1/9`, a local max."]},{"id":"mp5","topic":"23","goal":7,"kind":"num","keypad":"decimal","prompt":"A 20 L tank holds 1 kg of salt dissolved in water. Brine with 0.2 kg/L flows in at 5 L/min, so `C(t) = {1 + t}/{20 + 5t}` kg/L. What concentration does it approach in the long run?","unit":"kg/L","_a":"ARoC","display":"0.2 kg/L","why":"Horizontal asymptote: for large `t`, `{t}/{5t} = 1/5`. That’s 0.2 kg/L, the incoming brine’s concentration.","wrong":[{"match":0.05,"fb":"That’s `C(0)`. For large `t`, `t/(5t) = 1/5`."}],"hints":["Horizontal asymptote.","Leading terms: `{t}/{5t}`.","0.2 kg/L, the incoming brine’s concentration."]},{"id":"mp6","topic":"18","goal":2,"kind":"mc","prompt":"For `y = {1}/{x + 4}`, what happens as `x → -4^{+}`?","options":[{"t":"`y → 4`","why":"Try `x = -3.9`: `x + 4 = 0.1`, and `1/0.1 = 10`. Closer to −4, `y` grows.","_n":"1c964","_k":"e40c452e"},{"t":"`y → -∞`","why":"Just right of −4, `x + 4` is a tiny \u003cstrong>positive\u003c/strong> number.","_n":"1d994","_k":"e0d555ce"},{"t":"`y → ∞`","why":"Try `x = -3.9`: `x + 4 = 0.1`, and `1/0.1 = 10`. Closer to −4, `y` keeps growing: `y → ∞`.","_n":"1e9a4","_k":"434e6220"},{"t":"`y → 0`","why":"Try `x = -3.9`: `x + 4 = 0.1`, and `1/0.1 = 10`. Closer to −4, `y` grows.","_n":"1f974","_k":"bdf72ebe"}],"hints":["Try `x = -3.9`.","`x + 4 = 0.1`.","`1/0.1 = 10`, growing: `y → ∞`."]},{"id":"mp7","topic":"21","goal":5,"kind":"pair","star":true,"prompt":"`y = {x^2 + ax - 6}/{x - 2}` has a hole at `x = 2`. Find `a` and the hole’s `y`-coordinate.","labels":["`a =`","Hole’s `y`-coordinate:"],"_a":"agUcVmQ=","display":"`a = 1`; the hole is at `(2, 5)`","why":"For a hole, `x - 2` must also be a factor of the numerator: `4 + 2a - 6 = 0`. Then `{(x + 3)(x - 2)}/{x - 2} = x + 3`, and `2 + 3 = 5`.","general":"For a hole, `x - 2` must also be a factor of the numerator: `4 + 2a - 6 = 0`. Then `{(x + 3)(x - 2)}/{x - 2} = x + 3`, and `2 + 3 = 5`.","hints":["The numerator must be 0 at `x = 2`.","`a = 1`.","Hole `(2, 5)`."]},{"id":"mp8","topic":"17","goal":1,"kind":"mc","prompt":"Domain of `y = {x - 5}/{x^2 + 4}`?","options":[{"t":"`{x ∈ ℝ | x ≠ ±2}`","why":"`x^2 + 4` is never 0.","_n":"1g984","_k":"0179eb4c"},{"t":"`{x ∈ ℝ}`","why":"`x^2 ≥ 0`, so `x^2 + 4 ≥ 4`: the denominator is never 0. All real numbers.","_n":"1h954","_k":"885fcb31"},{"t":"`{x ∈ ℝ | x ≠ 5}`","why":"That’s the numerator.","_n":"1i964","_k":"1e2187e0"},{"t":"`{x ∈ ℝ | x ≠ -4}`","why":"The denominator is `x^2 + 4`, not `x + 4`: `x^2 ≥ 0`, so `x^2 + 4 ≥ 4`.","_n":"1j934","_k":"c6d7612e"}],"hints":["Can `x^2 + 4` be 0?","`x^2 ≥ 0`, so `x^2 + 4 ≥ 4`.","All real numbers."]},{"id":"mp9","topic":"22","goal":6,"kind":"iv","star":true,"prompt":"Solve `{2}/{x + 1} \u003c 1`.","_a":"ExzS66uG6fwdFNLrq1VIQtO8mkMRVU1C07yuShs=","display":"`(-∞, -1) ∪ (1, ∞)`","why":"Get 0 on one side: `{1 - x}/{x + 1} \u003c 0`, which is negative on `(-∞, -1)` and `(1, ∞)`.","wrong":{"(1, ∞)":"Multiplying by `x + 1` assumes it’s positive. Rewrite as `{1 - x}/{x + 1} \u003c 0` and test all intervals."},"hints":["Get 0 on one side.","`{1 - x}/{x + 1} \u003c 0`.","Negative on `(-∞, -1)` and `(1, ∞)`."]},{"id":"mp10","topic":"20","goal":4,"kind":"pair","prompt":"`x`- and `y`-intercepts of `y = {2x - 6}/{x + 3}`?","labels":["`x`-intercept: `x =`","`y`-intercept: `y =`"],"_a":"agccTgs5","display":"`x = 3`; `y = -2`","why":"`x`-intercept: the numerator `2x - 6` is 0 at `x = 3`. `y`-intercept: `x = 0` gives `-6/3 = -2`.","hints":["`x`-intercept: numerator 0.","`y`-intercept: `x = 0`.","3 and `-6/3 = -2`."]},{"id":"mp11","topic":"23","goal":7,"kind":"num","star":true,"prompt":"Average cost `C(n) = {1200 + 8n}/{n}` dollars. How many items make the average cost $10?","unit":"items","_a":"BwQA","display":"600 items","why":"Set `C(n) = 10`: `1200 + 8n = 10n`, so `2n = 1200` and `n = 600`.","wrong":[{"match":120,"fb":"That’s 1200 ÷ 10, ignoring the `8n`. Solve `1200 + 8n = 10n`."}],"hints":["Set `C(n) = 10`.","`1200 + 8n = 10n`.","`n = 600`."]},{"id":"mp12","topic":"19","goal":3,"kind":"mc","prompt":"Which describes `y = {1}/{x^2 + 6x + 9}`?","options":[{"t":"One vertical asymptote `x = -3`; below the axis on one side","why":"`(x + 3)^2 > 0` on both sides.","_n":"1k944","_k":"dbfaa20c"},{"t":"No vertical asymptotes; above the axis everywhere","why":"Factor: `(x + 3)^2` is 0 at `x = -3`.","_n":"1la14","_k":"7b5da1d6"},{"t":"Two vertical asymptotes; above the axis everywhere","why":"`(x + 3)^2` has one zero.","_n":"1ma24","_k":"062acad0"},{"t":"One vertical asymptote `x = -3`; above the axis everywhere","why":"`x^2 + 6x + 9 = (x + 3)^2`: one zero, so one asymptote, and always positive.","_n":"1n934","_k":"9e12cf55"}],"hints":["Factor.","`(x + 3)^2`.","One asymptote; always positive."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which anatomy link surprised you most, and why?"},{"id":"j2","q":"In your own words, how do you tell a hole from a vertical asymptote, from the equation alone?"},{"id":"j3","q":"Explain to a friend how to solve a rational inequality without losing or gaining solutions."},{"id":"j4","q":"Which module will you revisit, and what exactly will you practise there?"}]},"final":{"intro":"This shows what you’ve learned across the whole chapter, so there are no hints here. Answer all 15 questions and say how sure you are. Then submit to see your results by category and by module. Each question is labelled with its achievement chart category and its module.","questions":[{"id":"f1","cat":"K","topic":"17","goal":1,"a":{"prompt":"Where are the vertical asymptotes of `y = {x + 2}/{x^2 - 25}`?","options":[{"t":"`x = 25`","why":"Solve `x^2 = 25`.","_n":"1o924","_k":"5f3028c6"},{"t":"`x = -2`","why":"That’s the numerator’s zero.","_n":"1p914","_k":"0032c442"},{"t":"`x = 5` only","why":"`(-5)^2 - 25 = 0` too.","_n":"1q904","_k":"c2501f46"},{"t":"`x = -5` and `x = 5`","why":"`x^2 - 25 = 0` at `x = ±5`, and nothing cancels.","_n":"1r974","_k":"40aa5d65"}]},"b":{"prompt":"Where are the vertical asymptotes of `y = {x - 1}/{x^2 - 16}`?","options":[{"t":"`x = 1`","why":"That’s the numerator’s zero.","_n":"1s964","_k":"8716023e"},{"t":"`x = 4` only","why":"`(-4)^2 - 16 = 0` too.","_n":"1t954","_k":"89122d32"},{"t":"`x = 16`","why":"Solve `x^2 = 16`.","_n":"1u944","_k":"f2ea81ce"},{"t":"`x = -4` and `x = 4`","why":"`x^2 - 16 = 0` at `x = ±4`, and nothing cancels.","_n":"1v9b4","_k":"54430690"}]}},{"id":"f2","cat":"K","topic":"18","goal":2,"a":{"prompt":"What is the vertical asymptote of `y = {1}/{3x + 6}`?","options":[{"t":"`x = -6`","why":"Divide by 3: `3x = -6` gives `x = -2`.","_n":"1w9a4","_k":"63c1d095"},{"t":"`x = -2`","why":"`3x + 6 = 0` at `x = -2`.","_n":"1x0d3","_k":"d784a8be"},{"t":"`x = 2`","why":"The asymptote is where the denominator is 0: `3x + 6 = 0` at `x = -2`.","_n":"1y0e3","_k":"0e171a89"},{"t":"`x = 3`","why":"That’s the coefficient.","_n":"1z0f3","_k":"8b82fd01"}]},"b":{"prompt":"What is the vertical asymptote of `y = {1}/{4x - 8}`?","options":[{"t":"`x = 2`","why":"`4x - 8 = 0` at `x = 2`.","_n":"20103","_k":"331a481c"},{"t":"`x = -2`","why":"The asymptote is where the denominator is 0: `4x - 8 = 0` at `x = 2`.","_n":"21113","_k":"c8bacbd3"},{"t":"`x = 4`","why":"That’s the coefficient.","_n":"22123","_k":"f7f7bcfb"},{"t":"`x = 8`","why":"Divide by 4: `4x = 8` gives `x = 2`.","_n":"23133","_k":"5abc20df"}]}},{"id":"f3","cat":"K","topic":"20","goal":4,"a":{"prompt":"What is the horizontal asymptote of `y = {5x + 1}/{2x - 3}`?","options":[{"t":"`y = 3/2`","why":"That’s the vertical asymptote’s `x`.","_n":"24143","_k":"15eca907"},{"t":"`y = 5/2`","why":"`a/c`: for large `|x|`, `{5x}/{2x} = 5/2`.","_n":"25153","_k":"a23b8100"},{"t":"`y = 0`","why":"The degrees are equal, so the asymptote isn’t `y = 0`.","_n":"26163","_k":"acbc389b"},{"t":"`y = -1/3`","why":"That’s `b/d`. For large `|x|`, only `5x` and `2x` matter: `y → 5/2`.","_n":"27a76","_k":"d54a6b90"}]},"b":{"prompt":"What is the horizontal asymptote of `y = {-4x + 3}/{3x + 1}`?","options":[{"t":"`y = -4/3`","why":"`a/c`: for large `|x|`, `{-4x}/{3x} = -4/3`.","_n":"28a66","_k":"0d22b1a1"},{"t":"`y = -1/3`","why":"That’s the vertical asymptote’s `x`.","_n":"29a96","_k":"02bb4804"},{"t":"`y = 0`","why":"The degrees are equal, so the asymptote isn’t `y = 0`.","_n":"2aa86","_k":"3d4cdc19"},{"t":"`y = 3`","why":"That’s `b/d`. For large `|x|`, only `-4x` and `3x` matter: `y → -4/3`.","_n":"2ba36","_k":"4061dbb9"}]}},{"id":"f4","cat":"K","topic":"21","goal":5,"a":{"prompt":"Where is the hole in `y = {x^2 - 4}/{x + 2}`?","options":[{"t":"There’s a vertical asymptote at `x = -2` instead","why":"If the factor cancels, the graph has a hole there (an open circle), not an asymptote.","_n":"2ca26","_k":"bfc207f5"},{"t":"`(2, 0)`","why":"That’s the `x`-intercept.","_n":"2da56","_k":"d8c1999d"},{"t":"`(-2, 0)`","why":"The hole’s height is `-2 - 2`.","_n":"2ea46","_k":"2e8ed871"},{"t":"`(-2, -4)`","why":"`y = x - 2` for `x ≠ -2`, and `-2 - 2 = -4`.","_n":"2f9f6","_k":"83d8b047"}]},"b":{"prompt":"Where is the hole in `y = {x^2 - 9}/{x - 3}`?","options":[{"t":"There’s a vertical asymptote at `x = 3` instead","why":"If the factor cancels, the graph has a hole there (an open circle), not an asymptote.","_n":"2g9e6","_k":"1f3b892a"},{"t":"`(3, 0)`","why":"The hole’s height is `3 + 3`.","_n":"2h216","_k":"bc0a065c"},{"t":"`(3, 6)`","why":"`y = x + 3` for `x ≠ 3`, and `3 + 3 = 6`.","_n":"2i226","_k":"3170e965"},{"t":"`(-3, 0)`","why":"That’s the `x`-intercept.","_n":"2j1f6","_k":"49781728"}]}},{"id":"f5","cat":"T","topic":"19","goal":3,"a":{"prompt":"`y = {1}/{x^2 - 6x + 5}`. Which describes the graph between its vertical asymptotes?","options":[{"t":"Below the axis, with a local maximum at `(3, -4)`","why":"At the quadratic’s vertex, the reciprocal’s value is 1 ÷ (the vertex’s `y`-value).","_n":"2k206","_k":"70f1ba8a"},{"t":"Below the axis, with a local maximum at `(3, -1/4)`","why":"`(x - 1)(x - 5)`; vertex `(3, -4)`; `1/(-4)`.","_n":"2l256","_k":"e855558f"},{"t":"Below the axis, with a local minimum at `(3, -1/4)`","why":"The largest denominator in size gives the value closest to 0: a maximum.","_n":"2m266","_k":"76a3beea"},{"t":"Above the axis, with a local minimum at `(3, 1/4)`","why":"The quadratic is negative between its zeros.","_n":"2n236","_k":"9ba2a6a0"}]},"b":{"prompt":"`y = {1}/{x^2 - 4x - 5}`. Which describes the graph between its vertical asymptotes?","options":[{"t":"Below the axis, with a local minimum at `(2, -1/9)`","why":"The largest denominator in size gives the value closest to 0: a maximum.","_n":"2o246","_k":"f31c4062"},{"t":"Below the axis, with a local maximum at `(2, -9)`","why":"At the quadratic’s vertex, the reciprocal’s value is 1 ÷ (the vertex’s `y`-value).","_n":"2p196","_k":"da695dcd"},{"t":"Above the axis, with a local minimum at `(2, 1/9)`","why":"The quadratic is negative between its zeros.","_n":"2q1a6","_k":"9dfe47e4"},{"t":"Below the axis, with a local maximum at `(2, -1/9)`","why":"`(x - 5)(x + 1)`; vertex `(2, -9)`; `1/(-9)`.","_n":"2ra4c","_k":"fcadf676"}]}},{"id":"f6","cat":"T","topic":"21","goal":5,"a":{"prompt":"What is the oblique asymptote of `y = {2x^2 + 3x - 4}/{x + 2}`?","options":[{"t":"`y = 2x + 7`","why":"Synthetic division uses −2, not 2.","_n":"2sa5c","_k":"a7caebf5"},{"t":"`y = 2x - 1`","why":"`2x^2 + 3x - 4 = (x + 2)(2x - 1) - 2`.","_n":"2ta2c","_k":"fb0e1a2a"},{"t":"`y = 2x`","why":"The quotient has a constant term too.","_n":"2ua3c","_k":"fc47e801"},{"t":"`y = 2x + 3`","why":"That copies coefficients without dividing.","_n":"2va0c","_k":"d7cfcd29"}]},"b":{"prompt":"What is the oblique asymptote of `y = {3x^2 - x + 2}/{x - 1}`?","options":[{"t":"`y = 3x`","why":"The quotient has a constant term too.","_n":"2wa1c","_k":"3d4cda2d"},{"t":"`y = 3x - 4`","why":"Synthetic division uses +1, not −1.","_n":"2x9ec","_k":"a63fc30a"},{"t":"`y = 3x + 2`","why":"`(x - 1)(3x + 2) + 4`.","_n":"2y9fc","_k":"64717f03"},{"t":"`y = 3x - 1`","why":"That copies coefficients without dividing.","_n":"2zacc","_k":"62bc621a"}]}},{"id":"f7","cat":"T","topic":"22","goal":6,"a":{"prompt":"Solve `{x}/{x - 3} = {3}/{x - 3} + 2`.","options":[{"t":"`x = -3`","why":"Check: `-3/(-6) ≠ 3/(-6) + 2`.","_n":"30adc","_k":"b3552ed0"},{"t":"`x = 3`","why":"State the restrictions first; a value that makes a denominator 0 can’t be a solution.","_n":"31aad","_k":"3982566d"},{"t":"No solution: the only candidate, `x = 3`, is a restriction","why":"`x = 3 + 2(x - 3)` gives `x = 3`, which makes the denominators 0.","_n":"32a9d","_k":"0932f989"},{"t":"`x = 0`","why":"Check: `0 ≠ -1 + 2`.","_n":"33acd","_k":"f0d20229"}]},"b":{"prompt":"Solve `{x}/{x + 2} = {-2}/{x + 2} + 4`.","options":[{"t":"`x = -2`","why":"State the restrictions first; a value that makes a denominator 0 can’t be a solution.","_n":"34abd","_k":"49c648b7"},{"t":"`x = 0`","why":"Check: `0 ≠ -1 + 4`.","_n":"35aed","_k":"59adec0d"},{"t":"`x = 2`","why":"Check: `2/4 ≠ -2/4 + 4`.","_n":"36add","_k":"5ba22ee7"},{"t":"No solution: the only candidate, `x = -2`, is a restriction","why":"`x = -2 + 4(x + 2)` gives `x = -2`.","_n":"37b0d","_k":"81c23f20"}]}},{"id":"f8","cat":"T","topic":"20","goal":4,"a":{"prompt":"`y = {ax + 4}/{x - 2}` has horizontal asymptote `y = 3`. What is its `x`-intercept?","options":[{"t":"−4","why":"Don’t forget `a = 3`: `ax + 4 = 0`.","_n":"38afd","_k":"6a36eb27"},{"t":"`-4/3`","why":"`a = 3`, so `3x + 4 = 0`.","_n":"39a2d","_k":"55aa16d1"},{"t":"`4/3`","why":"`3x + 4 = 0` gives a negative `x`.","_n":"3aa1d","_k":"10cb392d"},{"t":"2","why":"That’s the vertical asymptote.","_n":"3b18c","_k":"cdde40c6"}]},"b":{"prompt":"`y = {ax - 6}/{x + 1}` has horizontal asymptote `y = 2`. What is its `x`-intercept?","options":[{"t":"−3","why":"`2x - 6 = 0` gives a positive `x`.","_n":"3c19c","_k":"6590ee32"},{"t":"−1","why":"That’s the vertical asymptote.","_n":"3d1ac","_k":"89a1ecd9"},{"t":"3","why":"`a = 2`, so `2x - 6 = 0`.","_n":"3e1bc","_k":"3075c5b0"},{"t":"6","why":"Don’t forget `a = 2`: `ax - 6 = 0`.","_n":"3f1cc","_k":"2e46008d"}]}},{"id":"f9","cat":"C","topic":"17","goal":1,"a":{"prompt":"Which best explains why `y = {1}/{x^2}` has a vertical asymptote at `x = 0` and not a hole?","options":[{"t":"“Because `x^2` has a factor `x` that cancels.”","why":"Nothing cancels with 1.","_n":"3g1dc","_k":"fe5f8b9b"},{"t":"“Because 0 isn’t in the domain.”","why":"Holes are also outside the domain.","_n":"3h1ec","_k":"566eadc9"},{"t":"“As `x` gets close to 0, the denominator gets close to 0 while the numerator stays 1, so `|y|` grows without bound.”","why":"Nothing cancels the zero of the denominator, so the values blow up: an asymptote, not a hole.","_n":"3i1fc","_k":"f521fa48"},{"t":"“Because the graph crosses `x = 0`.”","why":"It never touches `x = 0`.","_n":"3j20c","_k":"4a185aeb"}]},"b":{"prompt":"Which best explains why `y = {x^2 + 1}/{x^2}` has horizontal asymptote `y = 1`?","options":[{"t":"“Because the numerator’s constant is 1.”","why":"Constants don’t decide the far-out behaviour.","_n":"3k21c","_k":"0e74b9ef"},{"t":"“Because the degrees are different.”","why":"They’re equal (2 and 2).","_n":"3l9ec","_k":"6214716d"},{"t":"“For large `|x|`, `x^2 + 1` and `x^2` are almost equal, so their ratio approaches 1.”","why":"Equal degrees: the ratio of the leading coefficients is `1/1 = 1`.","_n":"3m9dc","_k":"1b84a73e"},{"t":"“Because `y = 1` when `x = 0`.”","why":"`y` is undefined at 0.","_n":"3n9cc","_k":"cc51449d"}]}},{"id":"f10","cat":"C","topic":"22","goal":6,"a":{"prompt":"Which is the correct start to solving `{x + 1}/{x - 2} > 0`?","options":[{"t":"“Multiply both sides by `(x - 2)`.”","why":"Its sign changes at 2.","_n":"3o9bc","_k":"d7eb11f9"},{"t":"“Solve `x + 1 > 0`.”","why":"That ignores the denominator’s sign.","_n":"3pa2c","_k":"8492861a"},{"t":"“Cross-multiply to get `x + 1 > x - 2`.”","why":"There’s no second fraction to cross-multiply with.","_n":"3qa1c","_k":"6a36d460"},{"t":"“Mark `x = -1` (numerator 0) and `x = 2` (excluded), then test the sign on each interval.”","why":"The sign can change only at the zeros of the top and the bottom, so a sign chart finds every interval.","_n":"3ra0c","_k":"44baab21"}]},"b":{"prompt":"Which is the correct start to solving `{x - 4}/{x + 1} ≤ 0`?","options":[{"t":"“Mark `x = 4` (numerator 0, included) and `x = -1` (excluded), then test the sign on each interval.”","why":"The sign can change only at 4 and −1; ≤ includes the zero, and the restriction gets a round bracket.","_n":"3s9fc","_k":"d0625276"},{"t":"“Multiply both sides by `(x + 1)`.”","why":"Its sign changes at −1.","_n":"3ta6c","_k":"02e2cd02"},{"t":"“Include both critical values, because of ≤.”","why":"−1 is a restriction.","_n":"3ua5c","_k":"87353d80"},{"t":"“Solve `x - 4 ≤ 0`.”","why":"That ignores the denominator’s sign.","_n":"3v1cd","_k":"4c02edc0"}]}},{"id":"f11","cat":"C","topic":"23","goal":7,"a":{"prompt":"A drug’s concentration in the blood is `C(t) = {10t}/{t^2 + 4}` mg/L after `t` hours. Which best describes the meaning of its horizontal asymptote `y = 0`?","options":[{"t":"“In the long run the drug clears from the blood: the concentration approaches 0 but stays positive.”","why":"Degree 1 over degree 2, so `C(t) → 0`, but `10t > 0` for every `t > 0`.","_n":"3w1dd","_k":"eb96222d"},{"t":"“After some time the concentration reaches exactly 0.”","why":"An asymptote is approached but never reached: the concentration gets closer and closer to 0 but never equals it.","_n":"3x1ad","_k":"150be400"},{"t":"“The concentration is 0 at `t = 0` and stays 0.”","why":"`C` rises first, then falls.","_n":"3y1bd","_k":"897cdd5e"},{"t":"“The drug never enters the blood.”","why":"`C(2) = 2.5 > 0`.","_n":"3z20d","_k":"bfd7fe8a"}]},"b":{"prompt":"The average cost per item is `C(n) = {900 + 6n}/{n}` dollars. Which best describes the meaning of its horizontal asymptote `y = 6`?","options":[{"t":"“The fixed cost is $6.”","why":"The fixed cost is $900.","_n":"4021d","_k":"0b4d885c"},{"t":"“As production grows, the average cost approaches $6 per item but never reaches it.”","why":"`C(n) = {900}/{n} + 6`, and `{900}/{n}` gets close to 0 but is never 0.","_n":"411ed","_k":"080ae177"},{"t":"“With enough items, the average cost is exactly $6.”","why":"An asymptote is approached but never reached: the average cost gets closer and closer to $6 but never equals it.","_n":"421fd","_k":"203dc574"},{"t":"“Making 6 items costs $900.”","why":"That isn’t what the asymptote says.","_n":"4324d","_k":"e168eb9e"}]}},{"id":"f12","cat":"A","topic":"23","goal":7,"a":{"fixedOrder":true,"prompt":"Average cost `C(n) = {2000 + 15n}/{n}` dollars per item. How many items make the average cost $25?","options":[{"t":"50","why":"Check: `(2000 + 750)/50 = 55`.","_n":"4425d","_k":"5d87083c"},{"t":"80","why":"That ignores `15n`: 2000 ÷ 25.","_n":"4522d","_k":"58de661e"},{"t":"133⅓","why":"That’s 2000 ÷ 15.","_n":"4621d","_k":"1eb45c82"},{"t":"200","why":"`2000 + 15n = 25n`.","_n":"4724d","_k":"b0434f55"}]},"b":{"prompt":"Average cost `C(n) = {900 + 6n}/{n}` dollars. How many items make the average cost $9?","options":[{"t":"60","why":"Check: `(900 + 360)/60 = 21`.","_n":"4823d","_k":"7fd9fcee"},{"t":"100","why":"That ignores `6n`: 900 ÷ 9.","_n":"491ed","_k":"154dc24c"},{"t":"150","why":"That’s 900 ÷ 6.","_n":"4a1dd","_k":"24a1c975"},{"t":"300","why":"`900 + 6n = 9n`.","_n":"4b20d","_k":"37a0f5fc"}]}},{"id":"f13","cat":"A","topic":"22","goal":6,"a":{"prompt":"One pump fills a tank in `t` hours; a slower pump takes `t + 3` hours. Together they take 2 hours. Find `t`.","options":[{"t":"3 hours or −2 hours","why":"A time can’t be negative.","_n":"4c1fd","_k":"bd8d6219"},{"t":"6 hours","why":"Check: `1/6 + 1/9 ≠ 1/2`.","_n":"4d2ad","_k":"f46f38e8"},{"t":"3 hours","why":"`1/t + 1/(t + 3) = 1/2` gives `t^2 - t - 6 = 0`, so `t = 3` (reject −2).","_n":"4e29d","_k":"acc9c72a"},{"t":"1 hour","why":"Check: `1 + 1/4 ≠ 1/2`.","_n":"4fb0d","_k":"e15659ab"}]},"b":{"prompt":"One pump fills a tank in `t` hours; a slower pump takes `t + 5` hours. Together they take 6 hours. Find `t`.","options":[{"t":"6 hours","why":"Together they’d be faster than either alone.","_n":"4gb1d","_k":"d20fb71f"},{"t":"10 hours or −3 hours","why":"A time can’t be negative.","_n":"4hb2d","_k":"1a5f78a7"},{"t":"10 hours","why":"`t^2 - 7t - 30 = 0` gives `t = 10` (reject −3).","_n":"4ib3d","_k":"7ea373d0"},{"t":"15 hours","why":"Check: `1/15 + 1/20 ≠ 1/6`.","_n":"4jacd","_k":"89a9df29"}]}},{"id":"f14","cat":"A","topic":"18","goal":2,"a":{"prompt":"A tank drains in `T(r) = {60}/{r - 5}` minutes when the pump removes `r` L/min (`r > 5`; water also flows in at 5 L/min). Which describes the vertical asymptote and `T(17)`?","options":[{"t":"At `r = 5` the tank never drains; `T(17) = 60/17` min","why":"Use `r - 5 = 12`.","_n":"4kadd","_k":"79c23bd3"},{"t":"At `r = 5` the tank drains instantly; `T(17) = 5` min","why":"Near `r = 5`, `T` is huge.","_n":"4laed","_k":"f285c90d"},{"t":"At `r = 5` the pump only matches the inflow, so the tank never drains; `T(17) = 5` min","why":"`r - 5 = 0` at `r = 5`, and near it `T` is huge. `T(17) = 60/12 = 5`.","_n":"4mafd","_k":"8feed030"},{"t":"At `r = 60` the tank never drains; `T(17) = 12` min","why":"The asymptote is where `r - 5 = 0`.","_n":"4na8d","_k":"7c9a7016"}]},"b":{"prompt":"`T(r) = {48}/{r - 3}` minutes, with inflow 3 L/min. Which describes the vertical asymptote and `T(11)`?","options":[{"t":"At `r = 48` the tank never drains; `T(11) = 16` min","why":"The asymptote is where `r - 3 = 0`.","_n":"4oa9d","_k":"87d9e092"},{"t":"At `r = 3` the pump only matches the inflow, so the tank never drains; `T(11) = 6` min","why":"`r - 3 = 0` at `r = 3`, and near it `T` is huge. `T(11) = 48/8 = 6`.","_n":"4p36d","_k":"efa42bbf"},{"t":"At `r = 3` the tank never drains; `T(11) = 48/11` min","why":"Use `r - 3 = 8`.","_n":"4q35d","_k":"0f37ba26"},{"t":"At `r = 3` the tank drains instantly; `T(11) = 6` min","why":"Near `r = 3`, `T` is huge.","_n":"4r34d","_k":"c0d93fb8"}]}},{"id":"f15","cat":"A","topic":"19","goal":3,"a":{"prompt":"A signal’s strength along a road is `S(x) = {20}/{x^2 - 4x + 8}` units, `x` km from a town. Where is it strongest, and how strong?","options":[{"t":"At `x = 0` km, strength 2.5","why":"`S(0) = 20/8`, but it’s stronger at `x = 2`.","_n":"4s33d","_k":"6e243f0e"},{"t":"At `x = 4` km, strength 2.5","why":"The vertex is at `x = 2`.","_n":"4t32d","_k":"25aba274"},{"t":"At `x = 2` km, strength 5","why":"`x^2 - 4x + 8 = (x - 2)^2 + 4`, smallest (4) at `x = 2`; `20/4 = 5`.","_n":"4u31d","_k":"e699bb21"},{"t":"At `x = 2` km, strength 4","why":"4 is the denominator’s minimum; take 20 ÷ 4.","_n":"4v30d","_k":"70847a78"}]},"b":{"prompt":"`S(x) = {30}/{x^2 + 6x + 15}`. Where is it strongest, and how strong?","options":[{"t":"At `x = 3`, strength 5","why":"The vertex is at `x = -3`.","_n":"4w2fd","_k":"5444ef98"},{"t":"At `x = -3`, strength 6","why":"6 is the denominator’s minimum; take 30 ÷ 6.","_n":"4x2ed","_k":"c84b2460"},{"t":"At `x = 0`, strength 2","why":"`S(0) = 30/15`.","_n":"4y2dd","_k":"859db204"},{"t":"At `x = -3`, strength 5","why":"`(x + 3)^2 + 6`, smallest (6) at `x = -3`.","_n":"4zb4e","_k":"12ee840b"}]}}]},"task":{"title":"Build a rational function to spec","summary":"Build a rational function to spec","statement":"\u003cp>Use the factor tiles to build `f(x) = a ×` (numerator factors) / (denominator factors). Meet every check. Each comes from a different module. There’s more than one answer.\u003c/p>\u003col class=\"pt-conds\">\u003cli>Exactly one vertical asymptote: `x = 2`. (modules 17, 18 and 20)\u003c/li>\u003cli>Horizontal asymptote `y = 3`. (module 20)\u003c/li>\u003cli>Exactly one hole, at a negative `x`-value. (module 21)\u003c/li>\u003cli>`f(x) ≤ 0` exactly on `(2, 4]`. (module 22)\u003c/li>\u003c/ol>","checks":["The only uncancelled denominator zero is 2","`y → 3` as `x → ±∞`","Exactly one cancelled factor, at `r \u003c 0`","The solution set of `f(x) ≤ 0` (holes excluded) is `(2, 4]`"],"tips":["A vertical asymptote comes from a denominator factor that doesn’t cancel: you need `(x - 2)` there, and no other uncancelled factor.","Equal degrees: the asymptote is the ratio of leading coefficients, here `a`.","A hole needs the same factor top and bottom.","`{3(x - p)}/{x - 2} ≤ 0` between 2 and `p`: choose `p`."],"tipNow":["Right now the uncancelled denominator zeros are {v}.","Right now {far}.","Right now the holes are {h}.","Right now `f(x) ≤ 0` on {s}."],"ui":{"how":"Set `a` with the − and + buttons. Each tile is a factor `(x - r)`: change `r` with its − and + buttons (whole numbers from −6 to 6). Use Add a factor and × to add or remove tiles.","top":"Numerator","bottom":"Denominator","constant":"a","dec":"one less","inc":"one more","remove":"Remove","addTile":"Add a factor","preview":"Your function","signTitle":"Sign chart of `f(x)`","rows":{"va":"Vertical asymptotes","far":"Far out","holes":"Holes","le0":"`f(x) ≤ 0` on"},"none":"none","farZero":"`y → 0`: horizontal asymptote `y = 0`","farEq":"`y → §1`: horizontal asymptote `y = §1`","farOb":"no horizontal asymptote (oblique asymptote §1)","farConst":"`f` is the constant §1 (with holes), so `y → §1`","farPoly":"no horizontal asymptote (`f` simplifies to a polynomial)","empty":"the empty set","sx":"`x`","sf":"sign of `f(x)`","va":"VA","hole":"hole"},"explainPrompt":"Explain how each check told you one part of your equation.","success":"Your function meets all four checks.","more":"There’s more than one answer. Can you find another?","all6":"That’s all six: `{3(x - 4)(x - h)}/{(x - 2)(x - h)}` with `h` = −1, −2, −3, −4, −5 or −6."},"cards":[["Domain of a rational function","All reals except the zeros of the denominator."],["Vertical asymptote","A denominator zero whose factor doesn’t cancel."],["Hole","A factor that cancels: an open circle at (`a`, simplified value)."],["Horizontal asymptote by degrees","Numerator lower: `y = 0`. Equal: ratio of leading coefficients. Higher by one: oblique (divide)."],["`{ax + b}/{cx + d}`","Vertical `x = -d/c`; horizontal `y = a/c`."],["`{1}/{kx - c}`","The line’s zero `c/k` becomes the vertical asymptote; horizontal `y = 0`."],["Reciprocal of a quadratic","Two, one or no zeros → two, one or no vertical asymptotes; vertex `(h, q)` → `(h, 1/q)`."],["Oblique asymptote","Divide; the quotient (without the remainder) is the line."],["One-sided behaviour","Near `x = a`: test a value just left and just right; write `x → a^{-}`, `y → …`"],["Rational equations","Restrictions first; multiply by the common denominator; reject extraneous roots."],["Rational inequalities","Zeros of top and bottom on a sign chart; restrictions always get round brackets."],["Don’t multiply by `x - 2`","Its sign changes at 2; use a sign chart instead."],["Asymptotes in context","A long-run value that’s approached, not reached (average cost → $4)."]]}};</script>
