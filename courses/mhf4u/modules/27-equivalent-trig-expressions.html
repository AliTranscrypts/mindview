.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 27: hero underline, matcher layout and controls, identity board, cofunction triangle, work-backwards boxes, task inputs */
.hero-u{transition:background-size .6s;background:linear-gradient(var(--hi),var(--hi)) 0 92%/0 .16em no-repeat}
.hero-u.on{background-size:100% .16em}
.hero-fig figcaption .m{white-space:normal}

.eqx-views{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:16px 22px;align-items:start}
.eqx-g,.eqx-c{min-width:0}
.eqx-bridge{margin:8px 0 0}
.eqx-seg{display:none;margin:0 0 10px}
.eqx-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px 28px;align-items:start;margin-top:18px}
.eqx-ctrl,.eqx-read{min-width:0}
.eqx-read .read dd .m{white-space:normal}
.eqx-board{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 12px}
.ctl-lab{font-weight:700;font-size:.9rem;min-width:7.5em}
.rchips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rchips button{border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.25em .75em;font:400 1.1rem var(--font-math);min-height:40px;min-width:44px}
.rchips button[aria-checked="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.rchips.pa button[aria-checked="true"]{border-color:var(--acol);box-shadow:inset 0 0 0 1px var(--acol)}
.rchips.pk button[aria-checked="true"]{border-color:var(--p-k);box-shadow:inset 0 0 0 1px var(--p-k)}
.rchips button:disabled{opacity:.6}
.rchips.tgt button{font-size:1rem}
.tog{border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.35em .8em;min-height:40px;font-weight:700;font-size:.92rem}
.tog-a{border-color:var(--acol)}.tog-k{border-color:var(--p-k)}
.tog-a[aria-pressed="true"]{background:var(--acol);color:var(--sheet)}
.tog-k[aria-pressed="true"]{background:var(--p-k);color:var(--sheet)}
.tog[aria-pressed="true"] .m .p-a,.tog[aria-pressed="true"] .m .p-k,.tog[aria-pressed="true"] .m i{color:var(--sheet)}
.tog:disabled{opacity:.6}
.ctl-slide{margin:0 0 12px}
.ctl-slide label{font-weight:700}
.sl-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.sl-row input[type=range]{flex:1 1 auto;min-width:0;height:44px;accent-color:var(--p-d)}
.sqb{min-width:40px;min-height:40px;padding:0;font-size:1.2rem;font-weight:700;line-height:1}
.stepper{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.stepper output{min-width:4.6em;text-align:center;font:400 1.15rem var(--font-math)}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--info-bg);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.92rem}
.st-good{color:var(--green);font-weight:700}
.bd-wrap{margin-top:8px}
table.bd{border-collapse:collapse;min-width:100%}
table.bd th,table.bd td{border-bottom:1px solid var(--rule);padding:4px;text-align:center}
table.bd thead th{font:400 1.02rem var(--font-math);white-space:nowrap;padding:8px 6px}
table.bd tbody th{font:400 1.02rem var(--font-math);text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--sheet);padding-right:10px;z-index:1}
.bd-c{width:100%;min-width:72px;min-height:48px;border:1.5px dashed var(--rule);background:var(--paper);border-radius:6px;font-size:1rem}
.bd-c.found{border:1.5px solid var(--green);background:var(--good-bg)}
.bd-c.swipe{background:linear-gradient(90deg,var(--hi) 50%,var(--good-bg) 50%) 0 0/200% 100%;animation:bdswipe .4s ease-out forwards}
@keyframes bdswipe{from{background-position:100% 0}to{background-position:0 0}}
.tc3-in{display:inline-flex;align-items:center;gap:6px;margin:10px 10px 0 0;font-weight:400}
.tc3-in .numin{width:6.5rem}

.cf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.cf > *{min-width:0}
.cf-boards h3{margin-top:0}
.cf-fade{font-weight:700;min-height:1.4em}
.rb-row{padding:8px 0;border-bottom:1px solid var(--rule)}
.rb-row:last-child{border-bottom:0}
.rb-q{margin:0 0 6px;font-size:1.05rem}
.rb-ok{color:var(--green);font-weight:700}
.rb-row .chips{margin:0}
.rb-row .chip{min-height:36px;font-family:var(--font-math);font-size:1.02rem}

.wb-st{font-size:1.15rem}
.wb-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:6px 0 4px}
.wb-box{display:inline-flex;align-items:center;gap:6px}
.wb-box .numin{width:6.5rem}
.wb-and{font-weight:700}
.wb-pv{max-width:620px;margin-top:10px}

.tk-c{gap:6px}
.tk-c .numin{width:5rem}
.tk-cap{font-size:clamp(1.3rem,3.5vw,1.8rem);margin-top:4px}

@media (max-width:820px){
  .eqx-seg{display:flex}
  .eqx-views,.eqx-mid,.cf{grid-template-columns:minmax(0,1fr)}
  .eqx-views[data-show="graph"] .eqx-c,.eqx-views[data-show="circle"] .eqx-g{display:none}
}
@media (prefers-reduced-motion:reduce){ .bd-c.swipe{animation:none;background:var(--good-bg)} .hero-u{transition:none} }

unctions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"68e921e9","content":{"id":"27-equivalent-trig-expressions","kind":"topic","title":"Equivalent trig expressions","topic":"Equivalent Trig Expressions","readyTopic":"equivalent trig expressions","hero":{"eq":"\u003cspan class=\"nw\">`sin(`\u003cspan class=\"hero-u\" id=\"hero-u\">`{π}/{2} - x`\u003c/span>`) = cos x`\u003c/span>","eqLabel":"sine of pi over 2 minus x equals cosine x","eqSize":"md","headline":"Sine and cosine are the same wave","text":"Slide the graph of `y = sin x` a quarter period to the left and it lands exactly on `y = cos x`. So expressions that look different, like `sin(x + π/2)` and `cos x`, can be \u003cstrong>equivalent\u003c/strong>: equal for every value of `x`. In this module you’ll find the \u003cstrong>related-angle identities\u003c/strong>, such as `sin(π - x) = sin x`, and the \u003cstrong>cofunction identities\u003c/strong>, such as `sin(π/2 - x) = cos x`, using graphs, the unit circle and right triangles.","fig":{"aria":"Animation: the graph of y = sin x slides left by pi over 2 onto the dashed graph of y = cos x, then flips in the y-axis and slides right by pi over 2 onto it again","shape":"","caps":["`sin(x + π/2) = cos x`","`sin(-x) = -sin x`","`sin(π/2 - x) = cos x`","`sin(x + π/2) = cos x` and `sin(π/2 - x) = cos x`\u003cbr>Same wave, two names."]}},"goals":["I can use the unit circle to explain related-angle identities, such as `sin(π - x) = sin x` and `cos(π + x) = -cos x`.","I can use a right triangle to explain the cofunction identities, such as `sin(π/2 - x) = cos x` and `sec(π/2 - x) = csc x`, and use the unit circle to show they hold for every angle.","I can use slides and flips of graphs to show that two trig expressions are equivalent, such as `cos(x + π/2) = -sin x`.","I can rewrite an expression such as `cos(3π/2 + x)` as `±sin x` or `±cos x` by deciding the function and the sign.","I can use equivalent expressions to find values I don’t know directly, such as `cos(7π/10)` from `sin(π/5)`, and to solve problems."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Sine and cosine graphs","goal":3,"prompt":"On the graph of `y = sin x`, with `x` in radians, where is the first maximum to the right of `x = 0`?","options":[{"t":"`x = π/2`","why":"`sin x` is the height of the point on the unit circle, and the highest point is a quarter turn round: `sin(π/2) = 1`. (In degrees, that’s 90°.)","_n":"04e5","_k":"c89e1f8b"},{"t":"`x = π`","why":"At `x = π` the graph crosses the `x`-axis: `sin π = 0`. The peak comes earlier, at π/2.","_n":"14b5","_k":"142f4cb2"},{"t":"`x = 2π`","why":"At 2π, `sin x = 0`: one period has just finished. It’s `cos x` that has a maximum at 2π.","_n":"24c5","_k":"f03cb2c4"},{"t":"`x = 3π/2`","why":"At 3π/2, `sin x = -1`. That’s the lowest point.","_n":"3515","_k":"05b8a748"}],"hints":["`sin x` is the `y`-coordinate of the point on the unit circle at angle `x`.","The `y`-coordinate is largest at the top of the circle. Which angle points straight up?","Straight up is π/2, and `sin(π/2) = 1`. So the first maximum is at `x = π/2`."]},{"id":"w2","skill":"Unit circle","goal":1,"prompt":"The point on the unit circle for angle θ is (0.6, 0.8). What is the point for the angle π − θ?","options":[{"t":"(−0.6, −0.8)","why":"That’s a half turn, the angle π + θ: both coordinates change sign.","_n":"4525","_k":"04d7102c"},{"t":"(−0.6, 0.8)","why":"π − θ is the mirror image of θ in the `y`-axis: same height, opposite `x`-coordinate.","_n":"54f5","_k":"3c36f915"},{"t":"(0.6, −0.8)","why":"That’s the mirror image in the `x`-axis, which is the angle −θ (or 2π − θ).","_n":"6505","_k":"cbb56280"},{"t":"(0.8, 0.6)","why":"Swapping the coordinates is the reflection in the line `y = x`, which gives the angle π/2 − θ.","_n":"7455","_k":"d0332a6f"}],"hints":["θ is in quadrant 1. Which quadrant is π − θ in?","π − θ is in quadrant 2 and has the same reference angle as θ. In quadrant 2, `x` is negative and `y` is positive.","Same sizes, new signs: (−0.6, 0.8)."]},{"id":"w3","skill":"Unit circle","goal":1,"prompt":"What is the exact value of `cos(5π/6)`?","options":[{"t":"`1/2`","why":"1/2 is `sin(5π/6)`, the `y`-coordinate. Cosine is the `x`-coordinate.","_n":"8465","_k":"aecf15d3"},{"t":"`√3/2`","why":"Right size, wrong sign. 5π/6 is left of the `y`-axis, where cosine is negative.","_n":"97f0","_k":"facc6d08"},{"t":"`-√3/2`","why":"5π/6 is in quadrant 2 with reference angle π/6. `cos(π/6) = √3/2`, and cosine is negative in quadrant 2.","_n":"a7e0","_k":"b3236270"},{"t":"`-1/2`","why":"1/2 is the cosine of π/3. The reference angle here is π/6, whose cosine is `√3/2`.","_n":"b810","_k":"404e2f35"}],"hints":["Find the quadrant and the reference angle of 5π/6.","5π/6 is in quadrant 2, with reference angle π − 5π/6 = π/6. Cosine is negative in quadrant 2.","`cos(π/6) = √3/2`, so `cos(5π/6) = -√3/2`."]},{"id":"w4","skill":"Graph transformations","goal":3,"prompt":"Compared with the graph of `y = f(x)`, the graph of `y = f(x + 2)` is …","options":[{"t":"translated 2 units left","why":"Each output now happens 2 units sooner: the value `f(0)` now appears at `x = -2`. So the graph moves left.","_n":"c800","_k":"865f15ba"},{"t":"translated 2 units up","why":"Moving up 2 is `y = f(x) + 2`, with the 2 outside. Inside the brackets, the change acts on `x`.","_n":"d830","_k":"af4aa401"},{"t":"translated 2 units right","why":"Adding inside the brackets moves the graph left. Check: `y = f(x + 2)` gives `f(0)` when `x = -2`, so the point at `x = 0` has moved to `x = -2`.","_n":"e820","_k":"1db27799"},{"t":"compressed horizontally by a factor of 1/2","why":"That’s `y = f(2x)`. Adding 2 to `x` translates; multiplying `x` by 2 compresses.","_n":"f850","_k":"d5d4bc25"}],"hints":["Ask yourself: which `x`-value now gives the output `f(0)`?","`f(x + 2) = f(0)` when `x + 2 = 0`, so at `x = -2`. The point that was at `x = 0` is now at `x = -2`.","Every point moves 2 units left: the graph is translated 2 units left."]},{"id":"w5","skill":"Graph transformations","goal":3,"prompt":"How is the graph of `y = f(-x)` related to the graph of `y = f(x)`?","options":[{"t":"It is reflected in the `y`-axis.","why":"Replacing `x` with `-x` swaps left and right: the point `(2, f(2))` moves to `(-2, f(2))`.","_n":"g840","_k":"196b39aa"},{"t":"It is rotated a half turn about the origin.","why":"That’s `y = -f(-x)`: both the input and the output change sign.","_n":"h870","_k":"d0b3e209"},{"t":"It is reflected in the line `y = x`.","why":"Swapping `x` and `y` gives the inverse, not `y = f(-x)`.","_n":"i860","_k":"75de9351"},{"t":"It is reflected in the `x`-axis.","why":"That’s `y = -f(x)`, which changes the sign of the output. `y = f(-x)` changes the sign of the input.","_n":"j0d0","_k":"80adbf50"}],"hints":["In `f(-x)`, which changes sign: the input or the output?","The input. A point at `x = 2` on `y = f(x)` appears at `x = -2` on `y = f(-x)`, at the same height.","Same height, mirrored left to right: a reflection in the `y`-axis."]},{"id":"w6","skill":"Right-triangle ratios","goal":2,"prompt":"In right triangle `ABC`, the right angle is at `C`, `AC = 5`, `BC = 12` and `AB = 13`. What is `cos B`?","options":[{"t":"`5/13`","why":"5/13 uses `AC`, the side opposite `B`. That’s `sin B`.","_n":"k0e0","_k":"9b8f0a28"},{"t":"`5/12`","why":"5/12 is opposite over adjacent, which is `tan B`.","_n":"l0f0","_k":"2a6b13e4"},{"t":"`12/13`","why":"From `B`’s corner, the adjacent side is `BC = 12` and the hypotenuse is 13, so `cos B = 12/13`. Notice that `sin A` is also 12/13.","_n":"m100","_k":"e2cf5ecb"},{"t":"`13/12`","why":"13/12 is hypotenuse over adjacent, which is `sec B`, the reciprocal of `cos B`.","_n":"n110","_k":"f48f74f2"}],"hints":["Label the sides from `B`’s point of view: opposite, adjacent and hypotenuse.","From `B`: the hypotenuse is `AB = 13`, the side opposite `B` is `AC = 5`, and the side adjacent to `B` is `BC = 12`.","`cos B` = adjacent/hypotenuse = 12/13."]}],"refreshers":{"Sine and cosine graphs":"`sin x` is the `y`-coordinate of the unit-circle point at angle `x`, and `cos x` is its `x`-coordinate. As `x` runs from 0 to 2π, `sin x` goes 0 → 1 → 0 → −1 → 0, reaching 1 at π/2 and −1 at 3π/2. `cos x` goes 1 → 0 → −1 → 0 → 1, with maximums at 0 and 2π. Both graphs repeat every 2π.","Unit circle":"The point for angle θ is (cos θ, sin θ). Mirror images give related angles: π − θ is the reflection in the `y`-axis (`x` changes sign), −θ is the reflection in the `x`-axis (`y` changes sign), and π + θ is a half turn (both change sign). If θ gives (0.6, 0.8), then π − θ gives (−0.6, 0.8). For a special angle, the reference angle gives the size and CAST gives the sign: `cos(5π/6) = -cos(π/6) = -√3/2`.","Graph transformations":"Changes inside the brackets act on `x`, and they work the opposite way to how they look: `y = f(x + 2)` is `y = f(x)` translated 2 units left, and `y = f(x - 2)` is translated 2 units right. `y = f(-x)` is a reflection in the `y`-axis; `y = -f(x)` is a reflection in the `x`-axis.","Right-triangle ratios":"Label the sides from the angle you’re using: opposite, adjacent and hypotenuse. sin = opp/hyp, cos = adj/hyp, tan = opp/adj, and csc, sec and cot are their reciprocals. With `AC = 5`, `BC = 12`, `AB = 13` and the right angle at `C`: `cos B = 12/13`. From `A`’s corner, `BC` is the opposite side, so `sin A = 12/13` as well. That match is the idea behind Part 3."}}},"explore":{"heading":"Slide, flip, match","intro":"The blue graph is yours to move. Slide it, flip it, and try to land it exactly on the dashed target. When it lands, the two expressions are equal for every `x`, and the unit circle beside the graph shows why.","bridge":"These graphs use radians. One full wave of `y = sin x` runs from 0 to 2π: it peaks at π/2, crosses the axis at π and dips to −1 at 3π/2. `y = cos x` peaks at 0 and at 2π.","ui":{"fn":"Moving function `f`","flipA":"Flip in the `x`-axis (`@a{a} = -1`)","flipK":"Flip in the `y`-axis (`@k{k} = -1`)","slide":"Slide (`@d{d}`)","target":"Target","sample":"Sample angle","sweep":"Sweep `x`","reset":"Reset","views":["Graph","Circle"],"board":"Identity board","boardIntro":"Each match you make with `@a{a} = 1` fills a cell. Filling the board is optional.","found":"Identities found: {n} of 16","rows":["`sin(x + c)`","`sin(c - x)`","`cos(x + c)`","`cos(c - x)`"],"cols":["`= sin x`","`= cos x`","`= -sin x`","`= -cos x`"],"read":["Moving graph","Angle form","Target","Largest gap","Status","On the circle","The move","Compare"],"gap0":"0: the graphs are the same at every `x`","gapN":"Largest gap: {g}","match":"✓ Match for every `x`: {eq}","opp":"Upside-down match: {eq}. Flip it in the `x`-axis, or slide π further, to land it.","none":"No match yet.","aNote":"The board records matches with `a = 1`. Turn the `x`-axis flip off and find the slide that does the same job.","wrapNote":"{a} is the same as {b}: adding 2π changes nothing.","eight":"Notice: in every row, each of 0, π/2, π and 3π/2 appears exactly once. π/2 and 3π/2 always switch sine ↔ cosine. 0 and π never do; they can only change the sign.","circle":"`x` = {x}: `P` = {P}. The angle {ang} = {v}: `Q` = {Q}.","rot":"Rotation by {d} {dir}","half":"Half turn","still":"No move","refl":"Reflection in the line through the origin at angle {h}","reflNamed":"Reflection in the {line}","lines":{"x":"`x`-axis","y":"`y`-axis","yx":"line `y = x`","ynx":"line `y = -x`"},"cmpQ":"{fn} is `Q`’s {c}-coordinate: {v}.","cmpQneg":"{fn} is the opposite of `Q`’s {c}-coordinate: {v}.","cmpP":"{fn} is `P`’s {c}-coordinate: {v}.","cmpPneg":"{fn} is the opposite of `P`’s {c}-coordinate: {v}.","equal":"Equal.","unequal":"Not equal at this `x`.","lockP":"Prediction {n} set the target.","lockC":"Challenge {n} is open, so its target is set.","unlockP":"Unlock the target","unlockC":"Close the challenge","tc3lock":"The slider stays locked until you press Check challenge.","tc3setup":"Turn both flips on (`a = -1` and `k = -1`) and choose `f = sin` first.","tc3empty":"Enter your slide `d` first."},"predIntro":"Make a prediction first. Then the matcher will show you what really happens.","predictions":[{"id":"p1","start":{"f":"sin","a":1,"k":1,"d":0,"t":1},"prompt":"The blue graph is `y = sin x`. If it slides \u003cstrong>left\u003c/strong> by π/2, which graph will it land on?","options":[{"t":"A new wave that is neither a sine nor a cosine graph","_n":"o120","_k":"3efefa4c"},{"t":"`y = -cos x`","_n":"p130","_k":"8849cdfa"},{"t":"`y = cos x`","_n":"q140","_k":"16e4d843"},{"t":"`y = -sin x`","_n":"r050","_k":"7fedf039"}],"explain":"Every peak of `y = sin x` moves from π/2 to 0, which is exactly where `y = cos x` peaks. Sliding left by π/2 replaces `x` with `x + π/2`, so `sin(x + π/2) = cos x` for every `x`. Sliding right by π/2 would give `-cos x`, and sliding by π would give `-sin x`."},{"id":"p2","start":{"f":"cos","a":1,"k":1,"d":0,"t":1},"prompt":"Now flip `y = cos x` in the `y`-axis. That makes `y = cos(-x)`. Which graph do you get?","options":[{"t":"The same graph, `y = cos x`","_n":"s060","_k":"16109e60"},{"t":"`y = -cos x`","_n":"t130","_k":"3543e136"},{"t":"`y = sin x`","_n":"u120","_k":"8a65ff92"},{"t":"`y = -sin x`","_n":"v110","_k":"513a938a"}],"explain":"The cosine graph is symmetric about the `y`-axis (cosine is an even function), so the flip changes nothing: `cos(-x) = cos x`. On the circle, `-x` is the mirror image of `x` in the `x`-axis, which keeps the `x`-coordinate. Careful: `y = f(-x)` is a flip in the \u003cstrong>`y`-axis\u003c/strong>; a flip in the `x`-axis is `y = -f(x)`. Try the same flip on sine: `sin(-x) = -sin x`."},{"id":"p3","start":{"f":"sin","a":1,"k":-1,"d":12,"t":0},"prompt":"On the circle, `Q` is the point for `π - x`. As `x` sweeps all the way from 0 to 2π, how will `sin(π - x)` compare with `sin x`?","options":[{"t":"Equal only while `x` is in quadrant 1","_n":"w100","_k":"46b4d866"},{"t":"Equal only at `x = π/2`","_n":"x170","_k":"ea085cd6"},{"t":"Equal for every `x`","_n":"y160","_k":"0374f67d"},{"t":"Opposite for every `x`","_n":"z150","_k":"5338cd42"}],"explain":"`π - x` is the mirror image of `x` in the `y`-axis for every `x`, not just acute ones. A reflection in the `y`-axis keeps the height, so `sin(π - x) = sin x` always. The `x`-coordinates are opposites, so `cos(π - x) = -cos x`."},{"id":"p4","start":{"f":"cos","a":1,"k":1,"d":0,"t":0},"prompt":"In P1, sliding \u003cstrong>sine\u003c/strong> left by π/2 gave cosine. Now slide \u003cstrong>cosine\u003c/strong> left by π/2 to get `y = cos(x + π/2)`. What does it land on?","options":[{"t":"`y = -cos x`","_n":"10140","_k":"0a521ce6"},{"t":"`y = -sin x`","_n":"110b0","_k":"151ee8b9"},{"t":"`y = sin x`","_n":"120a0","_k":"e01965ee"},{"t":"`y = cos x`","_n":"13111","_k":"5de97d9b"}],"explain":"A quarter-period slide to the left moves one step around the cycle `sin x → cos x → -sin x → -cos x → sin x`. So sine becomes cosine, but cosine becomes \u003cstrong>negative\u003c/strong> sine. On the circle, a quarter turn sends `(cos x, sin x)` to `(-sin x, cos x)`, and the first coordinate of that point is `cos(x + π/2)`."}],"chalIntro":"Opening a challenge sets its target and locks the target chips until you close it. Set the matcher, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,4],"t":1,"prompt":"Slide only. Keep both flips off, choose `f = sin`, and make `y = sin x` land on `y = cos x`.","why":"`d = -π/2` gives the angle form `sin(x + π/2)`, and `d = 3π/2` gives `sin(x - 3π/2)`: both equal `cos x`.","msgs":{"upside":"Your graph is `-cos x`: an upside-down match. Sliding right by π/2 (or left by 3π/2, which draws the same wave) puts a trough at `x = 0`, not a peak. The peak at π/2 has to move \u003cstrong>left\u003c/strong> by π/2 to land at 0.","half":"A half-period slide gives `-sin x`. The peaks of sine and cosine are only a quarter period apart.","whole":"That’s `y = sin x` itself: sliding a whole period, 2π, changes nothing.","flip":"This one is slide only. Turn both flips off.","fn":"This one starts from `y = sin x`: choose `f = sin`.","other":"Watch the peaks: `sin x` peaks at π/2 and `cos x` at 0. Which way, and how far, must the peak move?"},"hints":["Compare where `y = sin x` and `y = cos x` first reach the value 1.","`sin x` reaches 1 at π/2; `cos x` reaches 1 at 0. The sine graph must move left by π/2.","Set `d = -π/2`: `y = sin(x + π/2) = cos x`. (`d = 3π/2` also works: sliding right by 3π/2 lines the peak up with the cosine peak at 2π.)"]},{"id":"tc2","goal":[3,4],"t":0,"prompt":"Use the `y`-axis flip. Choose `f = cos`, turn the `y`-axis flip on (`k = -1`), keep `a = 1`, and make the graph land on `y = sin x`.","why":"`d = π/2` gives the angle form `cos(π/2 - x)`, and `d = -3π/2` gives `cos(-3π/2 - x)`: both equal `sin x`.","msgs":{"whole":"That’s `cos(-x)`, which is still `cos x`. The flip alone changes nothing, because the cosine graph is symmetric about the `y`-axis.","upside":"You’ve made `cos(3π/2 - x)` (or `cos(-π/2 - x)`), which is `-sin x`: an upside-down match. Slide the other way.","half":"That’s `cos(π - x)` (or `cos(-π - x)`, the same wave), which is `-cos x`: a half-period slide changes the sign but keeps cosine.","flip":"For this challenge, keep `a = 1` and the `y`-axis flip on.","fn":"This one starts from `y = cos x`: choose `f = cos`.","other":"With the flip on, the angle form is `cos(d - x)`. Which `d` makes it equal `sin x`?"},"hints":["With `k = -1` the moving graph is `y = cos(d - x)`. Test `x = 0`: what must `cos d` be?","`sin 0 = 0`, so `cos d = 0`, which means `d` is ±π/2 or ±3π/2. Now test `x = π/2`: `sin(π/2) = 1`, so `cos(d - π/2)` must be 1.","`d = π/2`: `cos(π/2 - x) = sin x` for every `x`. That’s a cofunction identity; Part 3 explains it with a triangle."]},{"id":"tc3","goal":[3,4],"stretch":true,"t":1,"prompt":"Commit first. Turn \u003cstrong>both\u003c/strong> flips on (`a = -1` and `k = -1`) and choose `f = sin`. The target is `y = cos x`. Work out the slide `d` (from −2π to 2π) that makes it land, and enter it \u003cstrong>before\u003c/strong> the graph moves. The slider stays locked until you press Check challenge; then the graph glides to your `d`.\u003clabel class=\"tc3-in\">\u003cspan>Your slide: `@d{d} =`\u003c/span>\u003cinput type=\"text\" class=\"numin short\" id=\"tc3-d\" inputmode=\"text\" autocomplete=\"off\" aria-describedby=\"tc3-how\">\u003cspan class=\"m\">π\u003c/span>\u003c/label>\u003cspan class=\"tiny muted\" id=\"tc3-how\">Type the number in front of π, for example −1/2 for −π/2.\u003c/span>","why":"`d = -π/2` gives the angle form `-sin(-π/2 - x)`, and `d = 3π/2` gives `-sin(3π/2 - x)`: both equal `cos x`.","msgs":{"whole":"Two flips together are a half turn about the origin, and a half turn leaves the sine graph unchanged (sine is odd): `-sin(-x) = sin x`. You still need a slide.","upside":"You’ve made `-sin(π/2 - x) = -cos x`: exactly upside down. With both flips on, the slide goes the other way.","half":"`-sin(π - x) = -sin x`.","range":"Keep `d` between −2π and 2π.","other":"Work it out before you check: with both flips on, the graph is `y = -sin(d - x)`. What does that simplify to?"},"hints":["First simplify: `-sin(d - x) = sin(x - d)`, because sine is odd. So on sine, both flips together cancel out.","Now you need `sin(x - d) = cos x`. From TC1, `sin(x + π/2) = cos x`, so you need `x - d = x + π/2`.","`d = -π/2` (or −π/2 + 2π = 3π/2). Check `x = 0`: `-sin(-π/2) = 1 = cos 0`."]}],"blocks":[{"title":"What the matches mean","html":"\u003cp>\u003cstrong>Three ways to see one identity\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Graph:\u003c/strong> the two expressions draw the same curve. A slide of π/2 to the left moves one step around `sin x → cos x → -sin x → -cos x`; a flip in the `y`-axis leaves `cos x` alone and turns `sin x` upside down.\u003c/li>\u003cli>\u003cstrong>Circle:\u003c/strong> `x + c` rotates the point for `x` by `c`; `c - x` reflects it. Read off the coordinates of the moved point.\u003c/li>\u003cli>\u003cstrong>Every `x`:\u003c/strong> an identity must hold for every value of `x`. Matching at one point is not enough.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"cofunctions","name":"Cofunctions","heading":"Cofunction pairs from a right triangle","intro":"A right triangle has two acute angles, `x` and `π/2 - x`. Stand at one corner, then the other, and watch what happens to ‘opposite’ and ‘adjacent’.","ui":{"tris":["8, 15, 17","7, 24, 25","1, √3, 2 (`x = π/6`)","1, 1, √2 (`x = π/4`)"],"caption":"The angles add to π, so the angle at `B` is `π - π/2 - x = π/2 - x`.","stand":["Stand at `A`","Stand at `B`"],"sides":["Numbers","Letters `p`, `q`, `r`"],"corner":"Corner","sideLab":"Side labels","r1":"Round 1: Pair-up board","r1how":"Tap a ratio of `x`, then the ratio of `π/2 - x` that has the same value. Stand at `B` to work out the right-hand ratios.","r1left":"Ratios of `x`","r1right":"Ratios of `π/2 - x`","same":"From `B`’s corner, {sides}, so {R} = {vR}, while {L} = {vL}. Changing corners swaps opposite and adjacent.","recip":"{L} = {vL}, but {R} = {vR}. A cofunction pair keeps the reciprocal type: the partner of a {Ln} is a {Lc}.","other":"From `B`’s corner, {R} = {s} = {vR}, but {L} = {vL}. Look for the ratio of `π/2 - x` that uses the same two sides, in the same order.","done1":"\u003cstrong>Co\u003c/strong> stands for \u003cstrong>complement\u003c/strong>. Cosine is the sine of the complementary angle, cotangent is the tangent of it, and cosecant is the secant of it.","r2":"Round 2: Now with letters","r2how":"The triangle relabels: `BC = p` (opposite `x`), `AC = q` (adjacent to `x`), `AB = r` (hypotenuse). For each ratio of `π/2 - x`, pick its fraction.","r2wrong":"{chip} is {name} from `A`’s corner. From `B`, the opposite side is `q` and the adjacent side is `p`.","alg":"From `A`: `sin x = p/r`, `cos x = q/r`, `tan x = p/q`. From `B`: `sin(π/2 - x) = q/r`, `cos(π/2 - x) = p/r`, `tan(π/2 - x) = q/p`. Comparing: `sin(π/2 - x) = cos x`, `cos(π/2 - x) = sin x`, `tan(π/2 - x) = cot x`, and taking reciprocals, `csc(π/2 - x) = sec x`, `sec(π/2 - x) = csc x`, `cot(π/2 - x) = tan x`. These six statements are the \u003cstrong>cofunction identities\u003c/strong>.","beyond":"Beyond acute angles","beyondIntro":"The triangle is drawn inside the unit circle with `A` at the origin and hypotenuse 1, so its top corner is `P = (cos x, sin x)`. The point for `π/2 - x` is `Q = (sin x, cos x)`: the reflection of `P` in the line `y = x`.","fade":"A right triangle can’t have an angle this big","read":"`P` = {P}. `π/2 - x` = {ang}, so `Q` = {Q}. `Q` is `P` with its coordinates swapped, so `sin(π/2 - x)` = {v} = `cos x`.","closing":"The triangle explains the identity for acute angles. The reflection in `y = x` shows it holds for every `x`."},"pairs":{"_a":"TRoWUFwTXxtVVxYbHhMGVkUaXxtBWAsbGhoRWFwTXxtVVxEbHhMGVkIaXxtGUAsbGhoWXFETXxtVSwYbHhMGSlUaXxtBVAYbSw=="},"build":{"_a":"TRoWUFwTXxtHFxcbHhMGVkUaXxtCHhcbGhoRWFwTXxtHFxUbHhMGSlUaXxtAHhQbGhoWXFETXxtEFxUbHhMGVkIaXxtCHhQbSw=="},"blocks":[{"title":"The two-question rule","html":"\u003cp>\u003cstrong>Rewriting `f(c ± x)` when `c` is a multiple of π/2\u003c/strong>\u003c/p>\u003col>\u003cli>\u003cstrong>Which function?\u003c/strong> If `c` is a multiple of π (0, π, 2π), keep the function. If `c` is an odd multiple of π/2 (π/2, 3π/2), switch to the cofunction: sin ↔ cos, tan ↔ cot, sec ↔ csc.\u003c/li>\u003cli>\u003cstrong>Which sign?\u003c/strong> Pretend `x` is a small positive angle. Find the quadrant of the whole angle and use CAST on the \u003cstrong>original\u003c/strong> function.\u003c/li>\u003c/ol>\u003cp>Example: `cos(π/2 + x)`. π/2 is an odd multiple of π/2, so cosine becomes sine. With `x` small, `π/2 + x` is in quadrant 2, where cosine is negative. So `cos(π/2 + x) = -sin x`.\u003c/p>\u003cp>For `x - c`, think of it as `-c + x`: `x - π/2` is just past −π/2, in quadrant 4. The rule is a shortcut for what the graphs and the circle show, so it works for every `x`, not only small ones.\u003c/p>"}],"quickCheck":{"title":"Cofunction quick check","summary":"Cofunction quick check","items":[{"id":"q1","goal":2,"prompt":"In a right triangle, `sin x = 7/25`. What is `cos(π/2 - x)`?","choices":[{"t":"`7/25`","fb":"Right. `π/2 - x` is the other acute angle, and the side opposite `x` is adjacent to it: `cos(π/2 - x) = sin x = 7/25`.","_n":"14121","_k":"399cafb4"},{"t":"`7/24`","fb":"7/24 is `tan x`. Cosine uses the hypotenuse.","_n":"150f1","_k":"497e43a9"},{"t":"`24/25`","fb":"24/25 is `cos x` (the third side is `√{25^2 - 7^2} = 24`). The cofunction identity says `cos(π/2 - x)` equals `sin x`, not `cos x`.","_n":"16101","_k":"e2ac6453"},{"t":"`25/7`","fb":"25/7 is `csc x`, the reciprocal of `sin x`. A cofunction isn’t a reciprocal.","_n":"17151","_k":"33b7e4f3"}]},{"id":"q2","goal":2,"prompt":"Is `sin(π/2 - x) = 1 - sin x` true for every `x`?","choices":[{"t":"Only for acute angles `x`, because it comes from a right triangle.","fb":"It fails at `x = π/6`, which is acute. The identity that does come from the triangle is `sin(π/2 - x) = cos x`.","_n":"18161","_k":"2464f817"},{"t":"Yes: both sides equal 1 when `x = 0`.","fb":"It does work at `x = 0` (and at `x = π/2`), but an identity must work for every `x`. At `x = π/6` it fails.","_n":"19131","_k":"f56faf37"},{"t":"No: at `x = π/6`, the left side is `√3/2` but the right side is 1/2.","fb":"Right. One counterexample is enough. The true identity is `sin(π/2 - x) = cos x`.","_n":"1a141","_k":"a207161b"},{"t":"Yes: `sin(π/2) = 1`, so `sin(π/2 - x) = sin(π/2) - sin x`.","fb":"Sine doesn’t split over a subtraction. At `x = π/6`: `√3/2 ≠ 1/2`.","_n":"1b091","_k":"863daaa9"}]},{"id":"q3","goal":2,"prompt":"Which angle makes `sec(π/3) = csc( ? )` true?","choices":[{"t":"π/3","fb":"`csc(π/3) = 2√3/3`, but `sec(π/3) = 2`. The cofunction uses the complement, `π/2 - π/3`.","_n":"1c0a1","_k":"3d048fdc"},{"t":"7π/6","fb":"`csc(7π/6) = -2`: the right size, but sine is negative in quadrant 3.","_n":"1d171","_k":"19638a86"},{"t":"π/6","fb":"Right. Secant and cosecant are cofunctions: `sec(π/3) = csc(π/2 - π/3) = csc(π/6) = 2`.","_n":"1e161","_k":"fde1daa5"},{"t":"2π/3","fb":"`csc(2π/3) = 2√3/3`. The complement of π/3 is `π/2 - π/3 = π/6`.","_n":"1f191","_k":"0069060e"}]},{"id":"q4","goal":[2,1],"prompt":"Let `x = 2π/3`, which isn’t acute. Is `sin(π/2 - x) = cos x` still true?","choices":[{"t":"Yes: both sides are −1/2.","fb":"Right. `π/2 - 2π/3 = -π/6`, and `sin(-π/6) = -1/2 = cos(2π/3)`. The reflection in `y = x` works for every angle.","_n":"1g181","_k":"b5bf4dc5"},{"t":"No: the identity only works for acute angles.","fb":"The triangle needs an acute angle, but the unit circle shows the identity for every `x`.","_n":"1h131","_k":"ea91dfd6"},{"t":"No: `sin(π/2 - x) = 1/2` but `cos x = -1/2`.","fb":"`sin(-π/6)` is −1/2, not 1/2: the angle −π/6 ends below the `x`-axis.","_n":"1i121","_k":"2e1a13fa"},{"t":"Yes: both sides are 1/2.","fb":"Both sides are −1/2: 2π/3 is in quadrant 2, where cosine is negative.","_n":"1j151","_k":"09e710de"}]}]}},"practice":{"activities":[{"id":"rewrite","type":"sorter","title":"Rewrite it","summary":"Rewrite it","noun":"expression","goal":4,"instruction":"Sort each expression into the box it equals for every `x`.","how":"Tap an expression, then tap the box it belongs in.","boxes":[{"id":"b1","label":"`sin x`"},{"id":"b2","label":"`-sin x`"},{"id":"b3","label":"`cos x`"},{"id":"b4","label":"`-cos x`"}],"items":[{"id":"i1","t":"`sin(π - x)`","_a":"FFpUGw==","why":"π keeps sine. With `x` small, `π - x` is in quadrant 2, where sine is positive.","goal":[4,1],"wrong":{"b2":"Right function, wrong sign. With `x` small, `π - x` is in quadrant 2, where sine is positive.","b3":"Check the function. `π` is a multiple of π, so sine stays  4.","Sine is negative in quadrant 4, so `sin(2π - x)` = `-sin x`."]},{"id":"i7","t":"`sin(π/2 - x)`","_a":"FFpWGw==","why":"π/2 switches sine to cosine. `π/2 - x` is in quadrant 1, where sine is positive.","goal":[4,2],"wrong":{"b1":"Check the function. `π/2` is an odd multiple of π/2, so sine switches to cosine.","b2":"Check the function. `π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `π/2 - x` is in quadrant 1, where sine is positive.","b4":"Right function, wrong sign. With `x` small, `π/2 - x` is in quadrant 1, where sine is positive."},"hints":["Is the angle subtracted from a multiple of π, or from an odd multiple of π/2?","`π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `π/2 - x` is in quadrant 1.","Sine is positive in quadrant 1, so `sin(π/2 - x)` = `cos x`."]},{"id":"i8","t":"`cos(2π - x)`","_a":"FFpWGw==","why":"2π keeps cosine. `2π - x` is in quadrant 4, where cosine is positive.","goal":[4,1],"wrong":{"b1":"Check the function. `2π` is a multiple of π, so cosine stays cosine.","b2":"Check the function. `2π` is a multiple of π, so cosine stays cosine. With `x` small, `2π - x` is in quadrant 4, where cosine is positive.","b4":"Right function, wrong sign. With `x` small, `2π - x` is in quadrant 4, where cosine is positive."},"hints":["Is the angle subtracted from a multiple of π, or from an odd multiple of π/2?","`2π` is a multiple of π, so cosine stays cosine. With `x` small, `2π - x` is in quadrant 4.","Cosine is positive in quadrant 4, so `cos(2π - x)` = `cos x`."]},{"id":"i9","t":"`sin(x + π/2)`","_a":"FFpWGw==","why":"π/2 switches sine to cosine. `π/2 + x` is in quadrant 2, where sine is positive.","goal":[4,2],"wrong":{"b1":"Check the function. `π/2` is an odd multiple of π/2, so sine switches to cosine.","b2":"Check the function. `π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `π/2 + x` is in quadrant 2, where sine is positive.","b4":"Right function, wrong sign. With `x` small, `π/2 + x` is in quadrant 2, where sine is positive."},"hints":["Is the angle added a multiple of π, or an odd multiple of π/2?","`π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `π/2 + x` is in quadrant 2.","Sine is positive in quadrant 2, so `sin(x + π/2)` = `cos x`."]},{"id":"i10","t":"`cos(π - x)`","_a":"FFpRGw==","why":"π keeps cosine. `π - x` is in quadrant 2, where cosine is negative.","goal":[4,1],"wrong":{"b1":"Check the function. `π` is a multiple of π, so cosine stays cosine. With `x` small, `π - x` is in quadrant 2, where cosine is negative.","b2":"Check the function. `π` is a multiple of π, so cosine stays cosine.","b3":"Right function, wrong sign. With `x` small, `π - x` is in quadrant 2, where cosine is negative."},"hints":["Is the angle subtracted from a multiple of π, or from an odd multiple of π/2?","`π` is a multiple of π, so cosine stays cosine. With `x` small, `π - x` is in quadrant 2.","Cosine is negative in quadrant 2, so `cos(π - x)` = `-cos x`."]},{"id":"i11","t":"`sin(3π/2 - x)`","_a":"FFpRGw==","why":"3π/2 switches sine to cosine. `3π/2 - x` is in quadrant 3, where sine is negative.","goal":[4,2],"wrong":{"b1":"Check the function. `3π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `3π/2 - x` is in quadrant 3, where sine is negative.","b2":"Check the function. `3π/2` is an odd multiple of π/2, so sine switches to cosine.","b3":"Right function, wrong sign. With `x` small, `3π/2 - x` is in quadrant 3, where sine is negative."},"hints":["Is the angle subtracted from a multiple of π, or from an odd multiple of π/2?","3π/2 is an odd multiple of π/2, so sine switches to cosine. With `x` small, `3π/2 - x` is just short of 3π/2, in quadrant 3.","Sine is negative in quadrant 3, so `sin(3π/2 - x)` = `-cos x`."]},{"id":"i12","t":"`sin(x - π/2)`","_a":"FFpRGw==","why":"π/2 switches sine to cosine. `x - π/2 = -π/2 + x` is in quadrant 4, where sine is negative. (On the graph: sine slid right by π/2 is cosine upside down.)","goal":[4,2],"wrong":{"b1":"Check the function. `π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `x - π/2 = -π/2 + x` is in quadrant 4, where sine is negative.","b2":"Check the function. `π/2` is an odd multiple of π/2, so sine switches to cosine.","b3":"Right function, wrong sign. With `x` small, `x - π/2 = -π/2 + x` is in quadrant 4, where sine is negative."},"hints":["Is the angle subtracted a multiple of π, or an odd multiple of π/2?","`π/2` is an odd multiple of π/2, so sine switches to cosine. With `x` small, `x - π/2 = -π/2 + x` is in quadrant 4.","Sine is negative in quadrant 4, so `sin(x - π/2)` = `-cos x`."]}]},{"id":"wb","type":"custom","title":"Work backwards: find the angle","summary":"Work backwards","star":true,"goal":[3,4,5],"instruction":"Find the angle `c`, with 0 ≤ `c` \u003c 2π, that makes each statement true for every `x`.","how":"Type the number in front of π as a fraction, for example 3/2 for 3π/2, then press Check. After each check, a small graph shows both sides, so you can see where they agree.","outside":"That angle works, but it’s outside 0 ≤ `c` \u003c 2π. Add or subtract 2π.","fallback":"Your `c` gives a different graph. The preview shows both sides: where do they disagree first?","bad":"Enter the number in front of π, such as 1/2 or 3/2.","items":[{"id":"wb1","goal":[3,4],"st":"`sin(x + c) = cos x`","_a":"bQhLDG8=","show":"`c = π/2`","wrong":[{"match":1.5,"fb":"`sin(x + 3π/2) = -cos x`: upside down. The sine graph must slide \u003cstrong>left\u003c/strong> a quarter period."},{"match":1,"fb":"`sin(x + π) = -sin x`. A half period changes the sign but keeps sine."},{"match":0,"fb":"`sin(x + 0)` is just `sin x`."}],"hints":["Which slide turns sine into cosine? Compare where they peak.","`sin x` peaks at π/2 and `cos x` peaks at 0, so the sine graph must slide left by π/2. Sliding left by π/2 replaces `x` with `x + π/2`.","`sin(x + π/2) = cos x`, so `c = π/2`."]},{"id":"wb2","goal":[1,4],"st":"`cos(c - x) = -cos x`","_a":"bQk4","show":"`c = π`","wrong":[{"match":0,"fb":"`cos(-x) = cos x`. Cosine is even, so the flip alone doesn’t change the sign."},{"match":0.5,"fb":"`cos(π/2 - x) = sin x`: a cofunction, not the opposite."},{"match":1.5,"fb":"`cos(3π/2 - x) = -sin x`."}],"hints":["Which angle `c - x` ends at the point with the opposite `x`-coordinate to the point for `x`?","On the unit circle, `π - x` is the mirror image of `x` in the `y`-axis, which changes the sign of the `x`-coordinate.","`cos(π - x) = -cos x`, so `c = π`."]},{"id":"wb3","goal":[3,4],"st":"`cos(x + c) = sin x`","_a":"bQlLDG8=","show":"`c = 3π/2`","wrong":[{"match":0.5,"fb":"`cos(x + π/2) = -sin x`: right function, wrong sign. Go a further half turn."},{"match":1,"fb":"`cos(x + π) = -cos x`."},{"match":0,"fb":"`cos(x + 0)` is just `cos x`."}],"hints":["Which slide turns cosine into sine? Compare where they peak.","`cos x` peaks at 0 and `sin x` peaks at π/2, so cosine must slide right by π/2: `cos(x - π/2) = sin x`. But `c` has to be between 0 and 2π.","Sliding right by π/2 draws the same graph as sliding left by 3π/2, because the wave repeats every 2π. So `cos(x + 3π/2) = sin x`, and `c = 3π/2`."]},{"id":"wb4","goal":[2,4],"st":"`sin(c - x) = -cos x`","_a":"bQlLDG8=","show":"`c = 3π/2`","wrong":[{"match":0.5,"fb":"`sin(π/2 - x) = cos x`: the sign is wrong."},{"match":1,"fb":"`sin(π - x) = sin x`."},{"match":0,"fb":"`sin(-x) = -sin x`."}],"hints":["Switching sine to cosine needs an odd multiple of π/2. Which one gives the negative sign?","Try `c = π/2`: `sin(π/2 - x) = cos x`, the wrong sign. With `x` small, `3π/2 - x` is in quadrant 3, where sine is negative.","`sin(3π/2 - x) = -cos x`, so `c = 3π/2`."]},{"id":"wb5","goal":[2,5],"two":true,"st":"`tan(c - x) = cot x`, for every `x` where both sides are defined (enter \u003cstrong>both\u003c/strong> values of `c`)","_a":"bQhLDB4ASwxr","show":"`c = π/2` and `c = 3π/2`","one":"Correct, but tangent repeats every π, not every 2π. There’s a second angle.","wrong":[{"match":1,"fb":"`tan(π - x) = -tan x`."},{"match":0,"fb":"`tan(-x) = -tan x`."}],"hints":["Which cofunction identity turns tangent into cotangent?","`tan(π/2 - x) = cot x`, so `c = π/2` works. Tangent repeats every π, so adding π to the angle gives the same values.","`c = π/2` and `c = π/2 + π = 3π/2`."]},{"id":"wb6","goal":[4,5],"st":"`sin(x + c) = cos(x - π/3)`","_a":"bQhLCAQHUw8ADlMPBAdTDwAOUw9v","show":"`c = π/6`","wrong":[{"match":1.1666666666666667,"fb":"`sin(x + 7π/6) = -cos(x - π/3)`: upside down. Use `cos θ = sin(θ + π/2)`, not `sin(θ - π/2)`."},{"match":0.8333333333333334,"fb":"5π/6 works in the other form, `sin(5π/6 - x)`, but here `x` has a plus sign. Check `x = π/3`: `sin(7π/6) = -1/2`, but `cos 0 = 1`."}],"hints":["Write the right side as a sine first. Which identity turns `cos θ` into a sine?","`cos θ = sin(θ + π/2)`. Use it with `θ = x - π/3`.","`cos(x - π/3) = sin(x - π/3 + π/2) = sin(x + π/6)`, so `c = π/6`."]},{"id":"wb7","goal":[4,5],"st":"`cos(c - x) = sin(x + π/4)`","_a":"bQhLCwds","show":"`c = π/4`","wrong":[{"match":0.75,"fb":"It looks as if you added π/4 to π/2. The cofunction identity `sin θ = cos(π/2 - θ)` with `θ = x + π/4` gives `cos(π/2 - x - π/4) = cos(π/4 - x)`: subtract. Check `x = 0`: `cos(3π/4) = -√2/2`, but `sin(π/4) = √2/2`."},{"match":1.75,"fb":"`cos(7π/4 - x) = cos(x + π/4)`: you switched sine to cosine but kept the angle `x + π/4`. Switching function always needs a quarter-period change in the angle. At `x = π/4` your side gives 0, not 1."}],"hints":["Write the right side as a cosine first. Which identity turns `sin θ` into a cosine?","`sin θ = cos(π/2 - θ)`. Use it with `θ = x + π/4`.","`sin(x + π/4) = cos(π/2 - x - π/4) = cos(π/4 - x)`, so `c = π/4`."]},{"id":"wb8","goal":[4,5],"st":"`-sin(c - x) = cos(x + π/6)`","_a":"bQlLCgECVgoFC1YKAQJWCgULVmQ=","show":"`c = 4π/3`","wrong":[{"match":0.6666666666666666,"fb":"`-sin(2π/3 - x) = -cos(x - π/6)`. Watch the sign when you rewrite: `-sin(c - x) = sin(x - c)`, so `x - c` must equal `x + 2π/3`, which gives `c = -2π/3`, or 4π/3."},{"match":0.3333333333333333,"fb":"`-sin(π/3 - x) = -cos(x + π/6)`: exactly upside down."}],"hints":["Simplify the left side first. Sine is odd, so `-sin(c - x) = sin(x - c)`.","Now write the right side as a sine: `cos θ = sin(θ + π/2)` gives `cos(x + π/6) = sin(x + 2π/3)`. So `x - c` must equal `x + 2π/3`, up to a multiple of 2π.","`c = -2π/3`, and adding 2π gives `c = 4π/3`. Check `x = 0`: `-sin(4π/3) = √3/2 = cos(π/6)`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Chloe","how":"","instruction":"Chloe made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Write `cos(π/2 + x)` in terms of `sin x` or `cos x`.","steps":["π/2 is an odd multiple of π/2, so cosine switches to its cofunction, sine.","Treat `x` as a small positive angle. Then `π/2 + x` is just past π/2, in quadrant 2.","In quadrant 2, sine is positive, so the sign is +.","So `cos(π/2 + x) = sin x`."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking.","","Step 4 uses step 3’s sign. The mistake is earlier."],"fixes":[{"t":"The sign comes from the original function. Cosine is negative in quadrant 2, so `cos(π/2 + x) = -sin x`.","why":"The sign belongs to the function you started with. Check `x = π/6`: `cos(2π/3) = -1/2 = -sin(π/6)`.","_n":"1k141","_k":"e1eb529d"},{"t":"Cosine is negative in quadrant 2, so `cos(π/2 + x) = -cos x`.","why":"The sign is right now, but step 1’s switch to sine has been dropped.","_n":"1l0f1","_k":"606056ac"},{"t":"Step 3 is correct as written.","why":"Check `x = π/6`: Chloe’s answer gives `sin(π/6) = 1/2`, but `cos(2π/3) = -1/2`.","_n":"1m0e1","_k":"05ae2fda"},{"t":"In quadrant 2, sine is negative, so `cos(π/2 + x) = -sin x`.","why":"The final answer is right, but the reason isn’t: sine is positive in quadrant 2. The sign comes from cosine, the original function.","_n":"1n850","_k":"33430e3e"}],"hints":["Which function’s sign decides the answer: the one you start with, or the one you switch to?","The sign comes from the original function, cosine. Is cosine positive or negative in quadrant 2?","Step 3 is wrong. Cosine is negative in quadrant 2, so `cos(π/2 + x) = -sin x`."]},{"id":"e2","goal":1,"task":"Use the unit circle to show what `sin(π - x)` equals.","steps":["Let `P` be the point on the unit circle for angle `x`, so `P = (cos x, sin x)`.","The point `Q` for the angle `π - x` is the reflection of `P` in the `x`-axis.","A reflection in the `x`-axis keeps the `x`-coordinate and changes the sign of `y`, so `Q = (cos x, -sin x)`.","So `sin(π - x) = -sin x`."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 describes a reflection in the `x`-axis correctly. The mistake is in choosing that reflection.","Step 4 reads `Q`’s `y`-coordinate correctly. The mistake is earlier."],"fixes":[{"t":"`Q` is the reflection of `P` in the \u003cstrong>`y`-axis\u003c/strong>, so `Q = (-cos x, sin x)` and `sin(π - x) = sin x`.","why":"`π - x` is measured back from the negative `x`-axis, so it mirrors `x` across the `y`-axis.","_n":"1o860","_k":"1cf413f7"},{"t":"`Q` is `P` turned a half turn, so `Q = (-cos x, -sin x)`.","why":"A half turn gives the angle `π + x`, not `π - x`.","_n":"1p870","_k":"eae555a2"},{"t":"`Q` is the reflection of `P` in the line `y = x`, so `Q = (sin x, cos x)`.","why":"Reflecting in `y = x` gives the angle `π/2 - x`.","_n":"1q880","_k":"1c2071e4"},{"t":"Step 2 is correct; the mistake is in step 4.","why":"Reflecting in the `x`-axis gives the angle `-x`. Check `x = π/6`: `sin(5π/6) = 1/2`, not −1/2.","_n":"1r810","_k":"b5681486"}],"hints":["Try one value: where is the point for `π - x` when `x = π/6`?","`π - π/6 = 5π/6`, in quadrant 2. It’s the mirror image of the π/6 point across the \u003cstrong>`y`-axis\u003c/strong>.","Step 2 is wrong. `Q` is the reflection in the `y`-axis, `Q = (-cos x, sin x)`, so `sin(π - x) = sin x`."]},{"id":"e3","goal":3,"task":"Use the graphs to write `cos x` in terms of sine.","steps":["The graph of `y = sin x` has a maximum at `x = π/2`.","The graph of `y = cos x` has a maximum at `x = 0`.","To move the peak from `x = π/2` to `x = 0`, slide the sine graph right by π/2.","Sliding right by π/2 replaces `x` with `x - π/2`, so `cos x = sin(x - π/2)`."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking.","","Step 4 applies the slide rule correctly to step 3’s direction. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"Check `x = 0` in step 4: `sin(-π/2) = -1`, but `cos 0 = 1`. Going from π/2 to 0 is a move to the left.","_n":"1s820","_k":"c2f26e9c"},{"t":"The slide is right by π/2, but it replaces `x` with `x + π/2`, so `cos x = sin(x + π/2)`.","why":"The final identity is right, but two errors cancel: moving from π/2 to 0 is a move left, and a slide right replaces `x` with `x - π/2`.","_n":"1t830","_k":"f3c58812"},{"t":"Moving the peak from π/2 to 0 is a slide \u003cstrong>left\u003c/strong> by π/2. That replaces `x` with `x + π/2`, so `cos x = sin(x + π/2)`.","why":"Check `x = 0`: `sin(π/2) = 1 = cos 0`.","_n":"1u840","_k":"eda47d8f"},{"t":"The slide is left by π, so `cos x = sin(x + π)`.","why":"`sin(x + π) = -sin x`. The two peaks are only π/2 apart.","_n":"1v8d0","_k":"079e2147"}],"hints":["On the `x`-axis, is 0 to the left or to the right of π/2?","0 is to the left of π/2, so the peak must move left.","Step 3 is wrong. Slide left by π/2: `cos x = sin(x + π/2)`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you slid or flipped the graphs in Explore?"},{"id":"j2","q":"In your own words, why is `sin(π/2 - x)` equal to `cos x`? Use a right triangle, the unit circle, or both."},{"id":"j3","q":"Explain to a friend how to rewrite `cos(π + x)` without any calculation: what decides the function, and what decides the sign?"},{"id":"j4","q":"Which kind of identity, related-angle or cofunction, do you still find harder? What check will you use next time to catch a mistake?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Which expression equals `cos x` for every `x`?","options":[{"t":"`sin(x - π/2)`","why":"That’s sine slid \u003cstrong>right\u003c/strong> by π/2, which is `-cos x`. Check `x = 0`: `sin(-π/2) = -1`, but `cos 0 = 1`.","_n":"1w8e0","_k":"96d7cfcf"},{"t":"`cos(π/2 - x)`","why":"`cos(π/2 - x) = sin x`. The cofunction switches cosine to sine.","_n":"1x8b0","_k":"ece2f74f"},{"t":"`sin(π/2 - x)`","why":"This is a cofunction identity: the sine of the complement is the cosine.","_n":"1y8a0","_k":"d4c10f82"},{"t":"`sin(π - x)`","why":"Subtracting from π keeps sine: `sin(π - x) = sin x`. Only an odd multiple of π/2 switches to cosine.","_n":"1z890","_k":"7be8e0d6"}]},"b":{"prompt":"Which expression equals `sin x` for every `x`?","options":[{"t":"`cos(x + π/2)`","why":"That’s cosine slid \u003cstrong>left\u003c/strong> by π/2, which is `-sin x`. To turn `cos x` into `sin x`, the peak at 0 must move right to π/2, which is `cos(x - π/2)`. Check `x = π/2`: `cos π = -1`, but `sin(π/2) = 1`.","_n":"20880","_k":"13d1825c"},{"t":"`cos(π/2 - x)`","why":"Cofunction identity: the cosine of the complement is the sine.","_n":"21870","_k":"4d25249d"},{"t":"`cos(π - x)`","why":"`cos(π - x) = -cos x`. Subtracting from π doesn’t switch to sine.","_n":"22860","_k":"0d50cee0"},{"t":"`sin(π/2 - x)`","why":"`sin(π/2 - x) = cos x`.","_n":"23850","_k":"dfb8716a"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which expression equals `sin(π + x)` for every `x`?","options":[{"t":"`cos x`","why":"Adding π doesn’t switch to cosine, and the sign changes as well.","_n":"24840","_k":"5f390524"},{"t":"`sin x`","why":"With `x` small, `π + x` is in quadrant 3, where sine is negative.","_n":"25930","_k":"d25f7b4d"},{"t":"`-sin x`","why":"Adding π is a half turn on the unit circle, which changes the sign of both coordinates. So `sin(π + x) = -sin x`.","_n":"26920","_k":"e5d30b7c"},{"t":"`-cos x`","why":"Adding π keeps the function. Only odd multiples of π/2 switch sine to cosine.","_n":"2708f","_k":"dee3605d"}]},"b":{"prompt":"Which expression equals `cos(2π - x)` for every `x`?","options":[{"t":"`-cos x`","why":"With `x` small, `2π - x` is in quadrant 4, where cosine is positive.","_n":"2809f","_k":"2c4876cb"},{"t":"`cos x`","why":"`2π - x` ends at the same point as `-x`, the mirror image of `x` in the `x`-axis. That keeps the `x`-coordinate.","_n":"2906f","_k":"9fed8cea"},{"t":"`sin x`","why":"Subtracting from 2π keeps the function.","_n":"2a07f","_k":"8d304148"},{"t":"`-sin x`","why":"2π is a multiple of π, so cosine stays cosine. It’s `sin(2π - x)` that equals `-sin x`.","_n":"2b04f","_k":"3b3fbc00"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"The two acute angles of a right triangle are α and β. Which statement is always true?","options":[{"t":"`tan α = cot β`","why":"`β = π/2 - α`, and tangent and cotangent are cofunctions: `cot(π/2 - α) = tan α`.","_n":"2c05f","_k":"f49670cb"},{"t":"`sec α = cos β`","why":"`cos β = sin α`, but `sec α = 1/cos α`. A cofunction keeps the reciprocal type: `sec α = csc β`.","_n":"2d02f","_k":"512f34f0"},{"t":"`tan α = -cot β`","why":"Both angles are acute, so all their ratios are positive. There’s no negative sign.","_n":"2e03f","_k":"4e9be0e8"},{"t":"`sin α = sin β`","why":"Only when `α = β = π/4`. The side opposite α is adjacent to β, so `sin α = cos β`.","_n":"2f10f","_k":"053a5b13"}]},"b":{"prompt":"The two acute angles of a right triangle are α and β. Which statement is always true?","options":[{"t":"`csc α = sin β`","why":"`sin β = cos α`, but `csc α = 1/sin α`. The cofunction of csc is sec: `csc α = sec β`.","_n":"2g11f","_k":"43f62ba7"},{"t":"`sec α = -csc β`","why":"Both angles are acute, so all their ratios are positive.","_n":"2h0ef","_k":"02d55817"},{"t":"`cos α = cos β`","why":"Only when `α = β = π/4`. The side adjacent to α is opposite β, so `cos α = sin β`.","_n":"2i0df","_k":"6f291c2f"},{"t":"`sec α = csc β`","why":"`β = π/2 - α`, and secant and cosecant are cofunctions: `csc(π/2 - α) = sec α`.","_n":"2j10f","_k":"be9a34d4"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Three of these expressions are equal to each other for every `x`. Which one is the odd one out?","options":[{"t":"`cos(x + π/2)`","why":"`cos(x + π/2) = -sin x`. Each of the other three equals `sin x`.","_n":"2k0ff","_k":"81af444c"},{"t":"`-sin(x + π)`","why":"You probably read `sin(x + π)` as `sin x`, so the leading minus made it look negative. A half turn changes the sign, `sin(x + π) = -sin x`, so `-sin(x + π) = sin x`: the two sign changes cancel. It matches.","_n":"2l12f","_k":"10d1ceb7"},{"t":"`sin(π - x)`","why":"You probably gave it a negative sign. With `x` small, `π - x` is in quadrant 2, where sine is positive: `sin(π - x) = sin x` (the reflection in the `y`-axis keeps the height). It’s one of the matching three.","_n":"2m11f","_k":"5cefe889"},{"t":"`cos(π/2 - x)`","why":"You probably kept it as a cosine. π/2 is an odd multiple of π/2, so cosine switches to sine: `cos(π/2 - x) = sin x`. It matches.","_n":"2n14f","_k":"2b4e18df"}]},"b":{"prompt":"Three of these expressions are equal to each other for every `x`. Which one is the odd one out?","options":[{"t":"`-cos(π - x)`","why":"You probably read `cos(π - x)` as `cos x`, so the leading minus made it look negative. `cos(π - x) = -cos x`, so `-cos(π - x) = cos x`: the two sign changes cancel. It matches.","_n":"2o13f","_k":"c7091e6d"},{"t":"`sin(x - π/2)`","why":"`sin(x - π/2) = -cos x`. Each of the other three equals `cos x`.","_n":"2p06f","_k":"5ceb9573"},{"t":"`cos(-x)`","why":"You probably treated `cos(-x)` as `-cos x`. Cosine is even: the flip in the `y`-axis leaves its graph unchanged, so `cos(-x) = cos x`. It matches.","_n":"2q05f","_k":"315c6aca"},{"t":"`sin(π/2 + x)`","why":"You probably gave it a negative sign, as in `cos(x + π/2) = -sin x`. With `x` small, `π/2 + x` is in quadrant 2, where sine is positive: `sin(π/2 + x) = cos x` (sine slid left by π/2). It matches.","_n":"2rbfa","_k":"ecca8b79"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`cos(2π/9) = q`. Which expression equals `sin(13π/18)`?","options":[{"t":"`-q`","why":"The switch to cosine is right, but sine is positive in quadrant 2, so there’s no negative sign.","_n":"2sbea","_k":"eaa1dda3"},{"t":"`q`","why":"`13π/18 = π/2 + 2π/9`. π/2 switches sine to cosine, and `π/2 + 2π/9` is in quadrant 2, where sine is positive. So `sin(13π/18) = cos(2π/9) = q`.","_n":"2tbda","_k":"779a7322"},{"t":"`√{1 - q^2}`","why":"`√{1 - q^2}` is `sin(2π/9)`. Adding π/2 switches sine to cosine, so the answer is a cosine: `q`.","_n":"2ubca","_k":"b59949e3"},{"t":"`1/q`","why":"`1/q` is `sec(2π/9)`, a reciprocal. A cofunction isn’t a reciprocal.","_n":"2vc3a","_k":"7b22fb17"}]},"b":{"prompt":"`sin(π/5) = s`. Which expression equals `cos(7π/10)`?","options":[{"t":"`-√{1 - s^2}`","why":"`-√{1 - s^2}` is `-cos(π/5)`. Adding π/2 switches cosine to sine.","_n":"2wc2a","_k":"d2814207"},{"t":"`-s`","why":"`7π/10 = π/2 + π/5`. π/2 switches cosine to sine, and `π/2 + π/5` is in quadrant 2, where cosine is negative. So `cos(7π/10) = -sin(π/5) = -s`.","_n":"2xc1a","_k":"a29a1764"},{"t":"`s`","why":"The switch to sine is right, but cosine is negative in quadrant 2.","_n":"2yc0a","_k":"9f5e00df"},{"t":"`-1/s`","why":"`-1/s` is `-csc(π/5)`, a reciprocal, not a cofunction.","_n":"2zc7a","_k":"68e9efb7"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"For which value of `c`, with 0 ≤ `c` \u003c 2π, is the graph of `y = sin(x + c)` the same as the graph of `y = -cos x`?","options":[{"t":"3π/2","why":"`y = -cos x` peaks at `x = π` and `x = -π`. `y = sin(x + c)` peaks where `x + c = π/2`, at `x = π/2 - c`. Setting `π/2 - c = -π` gives `c = 3π/2`: `sin(x + 3π/2) = -cos x`.","_n":"30c6a","_k":"9c11e68c"},{"t":"0","why":"`c = 0` gives `sin x` itself.","_n":"31b9a","_k":"40c35996"},{"t":"π","why":"`sin(x + π) = -sin x`. A half-period slide keeps sine.","_n":"32baa","_k":"3beef671"},{"t":"π/2","why":"`sin(x + π/2) = cos x`: the right shape, but upside down compared with `-cos x`.","_n":"33bba","_k":"69297a13"}]},"b":{"prompt":"For which value of `c`, with 0 ≤ `c` \u003c 2π, is the graph of `y = cos(x + c)` the same as the graph of `y = -sin x`?","options":[{"t":"0","why":"`c = 0` gives `cos x` itself.","_n":"34bca","_k":"fb536f8d"},{"t":"π/2","why":"`y = -sin x` peaks at `x = -π/2` (and 3π/2). `y = cos(x + c)` peaks where `x + c = 0`, at `x = -c`. Setting `-c = -π/2` gives `c = π/2`: `cos(x + π/2) = -sin x`.","_n":"35bda","_k":"af080cb0"},{"t":"3π/2","why":"`cos(x + 3π/2) = sin x`: upside down compared with `-sin x`.","_n":"36bea","_k":"1610cb91"},{"t":"π","why":"`cos(x + π) = -cos x`.","_n":"37bfa","_k":"fb51262b"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `cos(-x) = cos x` for every `x`?","options":[{"t":"“`-x` is always in quadrant 4, where cosine is positive.”","why":"Only when `x` is between 0 and π/2. For `x = 3π/4`, `-x` is in quadrant 3, where cosine is negative, yet `cos(-x) = cos x` still holds. A sign alone can’t show that two values are equal.","_n":"38c0a","_k":"7f16944d"},{"t":"“On the unit circle, the angle `-x` ends at the mirror image, in the `x`-axis, of the point for `x`. That reflection keeps the `x`-coordinate, which is the cosine.”","why":"This connects the angle, the point and the meaning of cosine, and it works for every `x`.","_n":"39c1a","_k":"7212eb0a"},{"t":"“It’s true at `x = 0`, since both sides equal 1.”","why":"One value doesn’t prove an identity. It must hold for every `x`.","_n":"3ac2a","_k":"28eb2cae"},{"t":"“The negative sign comes out in front, `cos(-x) = -cos x`, and then the two negatives cancel.”","why":"`cos(-x)` isn’t `-cos x`, and there’s no second negative to cancel. That’s sine’s rule: `sin(-x) = -sin x`.","_n":"3b4ba","_k":"01e2b010"}]},"b":{"prompt":"Which is the best explanation of why `sin(π - x) = sin x` for every `x`?","options":[{"t":"“`π - x` is always in quadrant 2, where sine is positive.”","why":"Only when `x` is between 0 and π/2. For `x = 3π/2`, `π - x = -π/2`, which isn’t in any quadrant. A sign alone can’t show that two values are equal.","_n":"3c4aa","_k":"ee2d46be"},{"t":"“`sin(π - x) = sin π - sin x`, and `sin π = 0`, so the signs cancel.”","why":"Sine doesn’t split over a subtraction. (And `0 - sin x` would be `-sin x` anyway.)","_n":"3d4da","_k":"8a6509d0"},{"t":"“It’s true at `x = π/6`, since both sides equal 1/2.”","why":"One value doesn’t prove an identity. It must hold for every `x`.","_n":"3e4ca","_k":"e94a682a"},{"t":"“On the unit circle, the angle `π - x` ends at the mirror image, in the `y`-axis, of the point for `x`. That reflection keeps the `y`-coordinate, which is the sine.”","why":"This connects the angle, the point and the meaning of sine, and it works for every `x`.","_n":"3f4fa","_k":"158f4073"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which statement is written correctly and is true for every `x`?","options":[{"t":"`cos(π/2 - x) = sin x`","why":"The brackets show that cosine acts on the whole angle `π/2 - x`.","_n":"3g4ea","_k":"18538ae1"},{"t":"`cos(π/2) - cos x = sin x`","why":"Cosine doesn’t split over a subtraction. The left side is `0 - cos x = -cos x`.","_n":"3h51a","_k":"2a5e87fe"},{"t":"`cos(π/2 - x) = sin`","why":"‘sin’ needs its angle: `sin x`. On its own, ‘sin’ isn’t a number.","_n":"3i50a","_k":"4f82a61a"},{"t":"`cos π/2 - x = sin x`","why":"Without brackets this reads `cos(π/2) - x = -x`, which isn’t `sin x`.","_n":"3j43a","_k":"2b608fa5"}]},"b":{"prompt":"Which statement is written correctly and is true for every `x`?","options":[{"t":"`sin π + x = -sin x`","why":"Without brackets this reads `sin(π) + x = x`, which isn’t `-sin x`.","_n":"3k42a","_k":"4df4160d"},{"t":"`sin π + sin x = -sin x`","why":"Sine doesn’t split over a sum. The left side is `0 + sin x = sin x`.","_n":"3l45a","_k":"ca0271e5"},{"t":"`sin(π + x) = -sin x`","why":"The brackets show that sine acts on the whole angle `π + x`.","_n":"3m46a","_k":"55a68d08"},{"t":"`sin(π + x) = -sin`","why":"‘sin’ needs its angle: `-sin x`.","_n":"3n43a","_k":"892a9559"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A loading ramp is 5 m long and makes an angle `x` with the ground. The building plan gives the angle between the ramp and a vertical post instead, which is `π/2 - x`, and states `cos(π/2 - x) = 0.28`. How high does the ramp rise?","options":[{"t":"4.8 m","why":"4.8 m = 5 `cos x` is the horizontal run. The rise is opposite `x`, so it uses `sin x = cos(π/2 - x)`.","_n":"3o44a","_k":"7e769883"},{"t":"0.28 m","why":"0.28 is `sin x`, a ratio. Multiply by the length of the ramp, 5 m.","_n":"3p41a","_k":"f3e1d3cd"},{"t":"About 17.9 m","why":"That’s 5 ÷ 0.28. The rise can’t be longer than the 5 m ramp; multiply instead.","_n":"3q42a","_k":"172c0c93"},{"t":"1.4 m","why":"`cos(π/2 - x) = sin x = 0.28`, and the rise is opposite `x`: 5 `sin x` = 5 × 0.28 = 1.4 m.","_n":"3r3fa","_k":"1624077a"}]},"b":{"prompt":"A zip line is 25 m long and makes an angle `x` with the horizontal. A survey gives the angle between the line and the vertical instead, which is `π/2 - x`, and states `sin(π/2 - x) = 0.96`. How far apart are the two ends horizontally?","options":[{"t":"0.96 m","why":"0.96 is `cos x`, a ratio. Multiply by the length of the line, 25 m.","_n":"3s40a","_k":"706cd38b"},{"t":"About 26.0 m","why":"That’s 25 ÷ 0.96. The horizontal distance can’t be longer than the 25 m line; multiply instead.","_n":"3t4da","_k":"323993a0"},{"t":"24 m","why":"`sin(π/2 - x) = cos x = 0.96`, and the horizontal distance is adjacent to `x`: 25 `cos x` = 25 × 0.96 = 24 m.","_n":"3u4ea","_k":"f5f98c03"},{"t":"7 m","why":"7 m = 25 `sin x` is the vertical drop. The horizontal distance uses `cos x = sin(π/2 - x)`.","_n":"3v57b","_k":"62dc9edf"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A wind turbine’s hub is at the origin. One 10 m blade points at the angle 13π/10, measured counterclockwise from the positive `x`-axis. How far above or below the hub is the tip of the blade?","use":" `sin(π/5) ≈ 0.588` and `cos(π/5) ≈ 0.809`","options":[{"t":"About 8.09 m above the hub","why":"13π/10 is in quadrant 3, where sine is negative, so the tip is below the hub.","_n":"3w56b","_k":"afda12db"},{"t":"About 5.88 m below the hub","why":"That uses `sin(π/5)`. Writing `13π/10 = 3π/2 - π/5` brings in 3π/2, which switches sine to cosine. (5.88 m is how far the tip is to the \u003cstrong>left\u003c/strong> of the hub, not below it.)","_n":"3x55b","_k":"a000ab4f"},{"t":"About 5.88 m above the hub","why":"Both the function and the sign are off: the height is −10 `cos(π/5)`.","_n":"3y54b","_k":"717c3043"},{"t":"About 8.09 m below the hub","why":"The tip’s height is 10 `sin(13π/10)`. `13π/10 = 3π/2 - π/5`, so 3π/2 switches sine to cosine, and the angle is in quadrant 3, where sine is negative: `sin(13π/10) = -cos(π/5) ≈ -0.809`. The tip is about 8.09 m below the hub.","_n":"3z53b","_k":"cd3636ac"}]},"b":{"prompt":"A wind turbine’s hub is at the origin. One 10 m blade points at the angle 7π/10, measured counterclockwise from the positive `x`-axis. How far to the left or right of the hub is the tip of the blade?","use":" `sin(π/5) ≈ 0.588` and `cos(π/5) ≈ 0.809`","options":[{"t":"About 5.88 m to the right of the hub","why":"7π/10 is in quadrant 2, where cosine is negative, so the tip is to the left.","_n":"4052b","_k":"0c4b1f5d"},{"t":"About 8.09 m to the left of the hub","why":"That uses `cos(π/5)`. Writing `7π/10 = π/2 + π/5` brings in π/2, which switches cosine to sine. (8.09 m is how far the tip is \u003cstrong>above\u003c/strong> the hub, not to the left.)","_n":"4151b","_k":"beb36013"},{"t":"About 8.09 m to the right of the hub","why":"Both the function and the sign are off: the position is −10 `sin(π/5)`.","_n":"4250b","_k":"54fa7cd9"},{"t":"About 5.88 m to the left of the hub","why":"The tip’s horizontal position is 10 `cos(7π/10)`. `7π/10 = π/2 + π/5`, so π/2 switches cosine to sine, and the angle is in quadrant 2, where cosine is negative: `cos(7π/10) = -sin(π/5) ≈ -0.588`.","_n":"434fb","_k":"bcd38c02"}]}}]},"task":{"title":"Same wave, new name","summary":"Same wave, new name","statement":"\u003cp>The dashed graph is `y = cos(x - π/3)`. Build a \u003cstrong>sine\u003c/strong> expression whose graph lands on it for every `x`. There are four different ones with 0 ≤ `c` \u003c 2π. Can you find them all?\u003c/p>","checks":["Uses sine","`c` is at least 0 and less than 2π","Goes through the target’s `y`-intercept, (0, 1/2)","Goes through the target’s peak, (π/3, 1)"],"tips":["The target is written with cosine. Find a sine form of it: `cos θ = sin(θ + π/2)`.","Choose `c` from 0 up to, but not including, 2π. If your `c` is 2π or more, subtract 2π: the wave repeats every 2π, so the graph won’t change.","At `x = 0` your expression gives {v}, but the target gives 1/2. Check the sign and the angle.","Your graph goes through (0, 1/2), but at `x = π/3` it gives {v}, not 1. One matching point isn’t enough. Try the other inside form, or a different `c`."],"ui":{"fn":"Function","sign":"Outer sign","inside":"Inside","c":"`c` =","p":"`p`","q":"`q`","gap":"Largest gap: {g}","gap0":"Largest gap: 0 (the graphs match at every `x`)","needC":"Enter `c` first: a whole number `p` from 0 to 24, and `q` from the menu.","all4":"You found all four. Each comes from `sin(x + π/6)` by an identity: `sin(π - θ) = sin θ` gives `sin(5π/6 - x)`, and `-sin(θ + π) = sin θ` gives `-sin(x + 7π/6)`. Which identity turns `sin(5π/6 - x)` into `-sin(11π/6 - x)`?"},"explainPrompt":"Choose one of your expressions. Use identities from this module to show why it equals `cos(x - π/3)` for every `x`.","vocab":"Use the words cofunction, related angle and for every x.","success":"Your design works!","more":"There’s more than one answer. Can you find another?"},"cards":[["Equivalent expressions","Expressions that are equal for every value of `x` where both are defined. One matching value isn’t enough. Example: `sin(π - x)` and `sin x`."],["Cofunction identities: sine and cosine","`sin(π/2 - x) = cos x` and `cos(π/2 - x) = sin x`"],["Cofunction identities: the other four","`tan(π/2 - x) = cot x`, `cot(π/2 - x) = tan x`, `sec(π/2 - x) = csc x`, `csc(π/2 - x) = sec x`"],["Why “co”?","In a right triangle the acute angles `x` and `π/2 - x` are complements. Cosine is the sine of the complement; cotangent and cosecant work the same way."],["The angle `π - x`","`sin(π - x) = sin x`, `cos(π - x) = -cos x`, `tan(π - x) = -tan x`. On the unit circle: a reflection in the `y`-axis."],["The angle `π + x`","`sin(π + x) = -sin x`, `cos(π + x) = -cos x`, `tan(π + x) = tan x`. On the unit circle: a half turn."],["The angle `-x` (and `2π - x`)","`sin(-x) = -sin x`, `cos(-x) = cos x`, `tan(-x) = -tan x`. On the unit circle: a reflection in the `x`-axis. `2π - x` gives the same values."],["The angle `π/2 + x`","`sin(π/2 + x) = cos x` and `cos(π/2 + x) = -sin x`. On the unit circle: a quarter turn counterclockwise. On the graph: a slide left by π/2."],["The two-question rule","For `f(c ± x)` with `c` a multiple of π/2: (1) a multiple of π keeps the function; an odd multiple of π/2 switches to the cofunction. (2) For the sign, treat `x` as small and positive, find the quadrant, and use CAST on the original function."],["Slides: `f(x + c)` and `f(x - c)`","`y = f(x + c)` is the graph slid left by `c`; `y = f(x - c)` is slid right by `c`. `sin(x + π/2) = cos x`, but `sin(x - π/2) = -cos x`."],["Flips: `f(-x)` and `-f(x)`","`y = f(-x)` flips the graph in the `y`-axis; `y = -f(x)` flips it in the `x`-axis. `cos(-x) = cos x` (cosine is even); `sin(-x) = -sin x` (sine is odd)."],["On the unit circle: `x + c` and `c - x`","`x + c` rotates the point for `x` by `c`. `c - x` reflects it in the line through the origin at angle `c/2`. For `c = π/2` that’s the line `y = x`, which swaps the coordinates."]]}};</script>
