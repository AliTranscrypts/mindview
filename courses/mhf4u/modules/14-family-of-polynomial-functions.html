tions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"ed66a8f9","content":{"id":"14-family-of-polynomial-functions","kind":"topic","title":"Family of polynomial functions","topic":"Family of Polynomial Functions","readyTopic":"families of polynomial functions","hero":{"eq":"`y = @a{k}(x - r_1)(x - r_2)(x - r_3)`","eqLabel":"y equals k times (x minus r 1)(x minus r 2)(x minus r 3)","eqSize":"md","headline":"One set of zeros, a whole family of graphs","text":"Fixing the zeros of a polynomial doesn’t fix the polynomial. Every function `y = k(x - r_1)(x - r_2)(x - r_3)` with `k ≠ 0` has the same zeros. Together they form a \u003cstrong>family of polynomial functions\u003c/strong>, and each one is a \u003cstrong>member\u003c/strong>. The number `@a{k}` is a \u003cstrong>vertical stretch factor\u003c/strong>: it multiplies every height, so the zeros never move. (Here `k` does the same job that `a` does in `y = a f(x)`.) The member with `k = 1` is the \u003cstrong>base member\u003c/strong>, written `b(x)`, so every member is `k × b(x)`. Give one more point in the right place, and you can find the one member that passes through it. Part of the job is knowing which points can do that.","fig":{"aria":"The cubic y = (x + 2)(x − 1)(x − 3) and members of its family with k = 2, 3, 1/2, −1 and −2, all passing through the zeros −2, 1 and 3. The member with k = 3 passes through the target (2, −12).","shape":"","captions":["Every member passes through the same three zeros.","`k = 3`: the member through (2, −12)."]}},"goals":["I can explain what makes polynomial functions members of the same family, and what the factor `k` does to the graph.","I can write the equation of the family of polynomial functions with given zeros, including repeated zeros and pairs of zeros such as `1 ± √2`.","I can find the member of a family that passes through a given point, and say when no member can.","I can decide whether two functions belong to the same family, even when they’re written in different forms.","I can find a polynomial equation from a set of conditions or a graph, and recognize when more than one polynomial fits."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Zeros and factors","goal":2,"prompt":"What are the zeros of `y = (x + 5)(2x - 3)(x - 1)`?","options":[{"t":"−5, 2/3 and 1","why":"`2x = 3` gives `x = 3/2`. Check: 2 × 2/3 − 3 = −5/3, not 0.","_n":"0208","_k":"18c6e3a2"},{"t":"5, −3/2 and −1","why":"`(x + 5)` is 0 when `x = -5`, not 5. Each zero has the opposite sign to the number in its bracket.","_n":"1218","_k":"c2548f66"},{"t":"−5, 3/2 and 1","why":"Set each factor to 0: `x + 5 = 0` gives −5; `2x - 3 = 0` gives 3/2; `x - 1 = 0` gives 1.","_n":"2228","_k":"d69bbf1d"},{"t":"−5, 3 and 1","why":"`2x - 3 = 0` means `2x = 3`, so `x = 3/2`. At `x = 3` the factor is 3, not 0.","_n":"31b8","_k":"0ed2d25e"}],"hints":["A product is 0 when one of its factors is 0. Set each bracket equal to 0.","`x + 5 = 0` and `x - 1 = 0` are quick. For `2x - 3 = 0`, add 3, then divide by 2.","The zeros are −5, 3/2 and 1."]},{"id":"w2","skill":"Zeros and factors","goal":2,"prompt":"A cubic’s graph crosses the `x`-axis at `x = -1`, touches it at `x = 2` and turns back, and has no other `x`-intercepts. Which could be its equation?","options":[{"t":"`y = (x - 1)(x + 2)^2`","why":"These factors are 0 at 1 and −2. The zero −1 needs `(x + 1)`, and the zero 2 needs `(x - 2)`.","_n":"41c8","_k":"04224910"},{"t":"`y = (x + 1)(x - 2)^3`","why":"Order 3 crosses (and flattens) at `x = 2`. It also makes the degree 4, not a cubic.","_n":"51d8","_k":"945a190a"},{"t":"`y = (x + 1)(x - 2)^2`","why":"Crossing means an odd order: `(x + 1)` to the power 1. Touching means an even order: `(x - 2)^2`. The degree is 1 + 2 = 3.","_n":"61e8","_k":"8163cedb"},{"t":"`y = (x + 1)^2(x - 2)`","why":"This graph touches at −1 and crosses at 2: the orders are the wrong way round.","_n":"7178","_k":"b671475f"}],"hints":["Odd order: the graph crosses. Even order: it touches and turns back.","So −1 has order 1 and 2 has order 2. Write each zero `r` as `(x - r)`.","`(x + 1)^1(x - 2)^2`: degree 3, crossing at −1, touching at 2."]},{"id":"w3","skill":"Evaluating and solving","goal":3,"prompt":"What is the value of `(x + 3)(x - 1)(x - 4)` when `x = -2`?","options":[{"t":"−18","why":"`(-3)(-6) = +18`: two negatives make a positive.","_n":"8188","_k":"a7bf4447"},{"t":"−10","why":"`(2 + 3)(2 - 1)(2 - 4) = -10` is the value at `x = 2`. Put −2 into every bracket.","_n":"9182","_k":"f6399f3c"},{"t":"−8","why":"1 + (−3) + (−6) = −8 is a sum. The brackets are multiplied.","_n":"a172","_k":"800cc4d7"},{"t":"18","why":"`(-2 + 3)(-2 - 1)(-2 - 4) = (1)(-3)(-6) = 18`. Two negative factors make a positive product.","_n":"b162","_k":"aac4a3c2"}],"hints":["Replace `x` with −2 in every bracket first.","The brackets become (1), (−3) and (−6). Now multiply.","(1)(−3) = −3, and (−3)(−6) = 18."]},{"id":"w4","skill":"Evaluating and solving","goal":3,"prompt":"Solve for `k`: `-20 = k(2)(-5)(-1)`.","options":[{"t":"`k = -2`","why":"`(2)(-5)(-1) = 10`, so `-20 = 10k` and `k = -20 ÷ 10 = -2`.","_n":"c152","_k":"ee601e48"},{"t":"`k = -30`","why":"`k` multiplies the 10; it isn’t added to it. Divide: −20 ÷ 10 = −2.","_n":"d142","_k":"97985b65"},{"t":"`k = -1/2`","why":"That’s 10 ÷ (−20). To undo “times 10”, divide −20 by 10.","_n":"e132","_k":"59d45a6f"},{"t":"`k = 2`","why":"There are two negative factors, so the product is +10, and `k = -20 ÷ 10 = -2`.","_n":"f122","_k":"212c1c0d"}],"hints":["Multiply the numbers in brackets first.","`(2)(-5)(-1) = 10`, so the equation is `-20 = 10k`.","Divide both sides by 10: `k = -2`. Check: −2 × 10 = −20."]},{"id":"w5","skill":"Expanding","goal":4,"prompt":"Expand and simplify `-2(x - 3)(x + 1)`.","options":[{"t":"`4x^2 - 8x - 12`","why":"`(-2x + 6)(-2x - 2)` multiplies by −2 twice, which is ×4. The −2 multiplies the product once.","_n":"g112","_k":"c9e0d69b"},{"t":"`-2x^2 + 4x - 6`","why":"−2 × (−3) = +6.","_n":"h202","_k":"9ce705f4"},{"t":"`-2x^2 + 4x + 6`","why":"`(x - 3)(x + 1) = x^2 - 2x - 3`. Multiply every term by −2: `-2x^2 + 4x + 6`.","_n":"i1f2","_k":"a7a033e5"},{"t":"`-2x^2 - 2x - 3`","why":"−2 multiplies every term of `x^2 - 2x - 3`, not just `x^2`.","_n":"j1e2","_k":"d7055aa2"}],"hints":["Multiply the two brackets first. Leave the −2 for last.","`(x - 3)(x + 1) = x^2 + x - 3x - 3 = x^2 - 2x - 3`.","`-2(x^2 - 2x - 3) = -2x^2 + 4x + 6`."]},{"id":"w6","skill":"Roots of an equation","goal":2,"prompt":"What are the roots of `x^3 - 4x = 0`?","options":[{"t":"0 and 4","why":"`x^2 = 4` means `x = ±2`, not 4.","_n":"k1f2","_k":"4ec585dc"},{"t":"−2, 0 and 2","why":"`x^3 - 4x = x(x^2 - 4) = x(x - 2)(x + 2)`. Each factor gives a root.","_n":"l1c2","_k":"0569e541"},{"t":"−2 and 2","why":"Dividing by `x` throws away the root `x = 0`. Factor out `x` instead.","_n":"m1d2","_k":"bac5880c"},{"t":"0 and 2","why":"`x^2 = 4` has two solutions: 2 and −2.","_n":"n222","_k":"b964bf88"}],"hints":["Take out the common factor first.","`x(x^2 - 4) = 0`. The bracket is a difference of squares.","`x(x - 2)(x + 2) = 0`, so `x` = 0, 2 or −2."]}],"refreshers":{"Zeros and factors":"A zero at `x = r` gives the factor `(x - r)`: the zero −5 gives `(x + 5)`, and the zero 0 gives `x`. A factor such as `(2x - 3)` is 0 when `x = 3/2`. The power on a factor is the zero’s order: odd orders cross the `x`-axis, even orders touch it and turn back. Example: `(x + 1)(x - 2)^2` crosses at −1 and touches at 2.","Evaluating and solving":"Substitute into every bracket first, then multiply. An even number of negative factors gives a positive product. To solve `12 = k(-4)`, divide: `k = 12 ÷ (-4) = -3`, and check: −3 × (−4) = 12.","Expanding":"Multiply the brackets first, then multiply every term by the number in front, \u003cstrong>once\u003c/strong>: `-2(x - 3)(x + 1) = -2(x^2 - 2x - 3) = -2x^2 + 4x + 6`. Putting the −2 into both brackets would multiply by −2 twice.","Roots of an equation":"Factor fully, then set each factor to 0. Never divide both sides by `x`: that loses the root 0. Example: `x^3 - 4x = x(x - 2)(x + 2) = 0` gives `x` = 0, 2, −2. The roots of `P(x) = 0` are the `x`-intercepts of `y = P(x)` (module 13)."}}},"explore":{"heading":"Family fan","intro":"Choose a family, then move `@a{k}`. Watch what changes and what never changes. In \u003cstrong>Catch\u003c/strong> mode, find the one member that passes through a target point. The member with `k = 1` is the \u003cstrong>base member\u003c/strong>, `b(x)`; every other member is `k × b(x)`.","chalIntro":"Press \u003cstrong>Set up the explorer\u003c/strong> on a challenge to load its family and target. Then set `k` with the slider or the exact box, and press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","ui":{"setup":"Set up the explorer","setupOn":"Set up for challenge §1: the target is fixed until you leave.","leave":"Leave the challenge","kZero":"`k = 0` is skipped: `y = 0` has no degree, so it isn’t a member.","zeroNon":"No member can catch this point. At `x = §1` every member has height 0, because §1 is a shared zero.","zeroZero":"Every member passes through this point: it’s a shared zero. It can’t pick out one member.","axis":"No member can catch this point. It would need `k = 0`, and `k = 0` isn’t allowed.","far":"Exactly one member passes through this point, with `k = §1`, but that `k` is beyond this explorer’s controls. Try a target nearer the zeros.","high":"Too high by §1","low":"Too low by §1","caught":"Caught ✓","rulerZero":"At `x = §1` every member has height 0.","showK":"Show the `k` that works"},"predictions":[{"id":"p1","start":{"k":1,"fan":false},"prompt":"`k` will change from 1 to 3. What happens to the points where the graph meets the `x`-axis?","options":[{"t":"They spread out, three times as far from the origin","_n":"o232","_k":"4f4eab54"},{"t":"They move closer together","_n":"p202","_k":"6ba8444c"},{"t":"The graph lifts off the axis and meets it at only one point","_n":"q212","_k":"92bc5090"},{"t":"They stay exactly where they are","_n":"r162","_k":"4dce60d2"}],"explain":"`k` multiplies every height by 3. At a zero the height is 0, and 3 × 0 = 0, so the `x`-intercepts can’t move. Spreading or squeezing the zeros would be a \u003cstrong>horizontal\u003c/strong> change, and lifting the graph would be a vertical \u003cstrong>shift\u003c/strong>. `k` is neither: it’s a vertical stretch.","after":"`k` went from 1 to 3; the zeros stayed at −2, 1 and 3."},{"id":"p2","start":{"k":1,"fan":false,"rulers":[0,2]},"prompt":"The base member passes through (0, 6) and (2, −4). When `k` becomes 3, where will these two points be?","options":[{"t":"(0, 9) and (2, −1)","_n":"s172","_k":"f54eefb9"},{"t":"(0, 18) and (2, −4)","_n":"ta42","_k":"946ed185"},{"t":"(0, 18) and (2, −12)","_n":"ua32","_k":"d2d24ddc"},{"t":"(0, 2) and (2, −4/3)","_n":"va62","_k":"6b290489"}],"explain":"Every height is multiplied by 3: 6 × 3 = 18 and −4 × 3 = −12. A negative height becomes \u003cstrong>more\u003c/strong> negative, because it moves away from the `x`-axis. Adding 3 to each height (9 and −1) would be a vertical shift, and the zeros would move. The point (2, −4) doesn’t stay put: only points on the `x`-axis do. And dividing by 3 (2 and −4/3) would squash the graph, which is what a `k` between 0 and 1 does.","after":"`k` went from 1 to 3; (0, 6) moved to (0, 18) and (2, −4) moved to (2, −12)."},{"id":"p3","start":{"k":2,"fan":false},"prompt":"`k` will slide from 2 down to −2. What will you see as `k` passes 0?","options":[{"t":"The zeros slide together, then apart again","_n":"wa52","_k":"1711493f"},{"t":"The curve flattens toward the `x`-axis, then reappears reflected in it","_n":"xa02","_k":"85fdc58a"},{"t":"The curve slides down until it’s below the `x`-axis, keeping its shape","_n":"y9f2","_k":"b37d245a"},{"t":"At `k = 0` the curve becomes the line `y = 0`, which is also a member","_n":"za22","_k":"5b6a6229"}],"explain":"As `k` shrinks, every height shrinks with it, so the curve flattens, but it always passes through the zeros. A negative `k` flips every height: a reflection in the `x`-axis, which also flips the end behaviour. `k = 0` would give `y = 0`, which isn’t a cubic, so it’s left out of the family.","after":"`k` went from 2 to −2, skipping 0; the zeros stayed at −2, 1 and 3, and the end behaviour flipped from Q3 to Q1 to Q2 to Q4."},{"id":"p4","start":{"k":1,"fan":false,"second":2},"prompt":"How many points do the graphs of `y = (x + 2)(x - 1)(x - 3)` and `y = 2(x + 2)(x - 1)(x - 3)` have in common?","options":[{"t":"None: a stretched graph never meets the original","_n":"10a12","_k":"01560eff"},{"t":"Exactly 1: the `y`-intercept","_n":"119c2","_k":"ab717924"},{"t":"Exactly 4: the zeros and the `y`-intercept","_n":"129b2","_k":"fba94cae"},{"t":"Exactly 3: the shared zeros","_n":"139a1","_k":"6088ef36"}],"explain":"Where the graphs meet, `b(x) = 2b(x)`, so `b(x) = 0`: that happens only at the zeros. The `y`-intercepts are 6 and 12, so they don’t match. This is why a point off the `x`-axis lies on at most one member of a family.","after":"The two graphs met only at (−2, 0), (1, 0) and (3, 0); at `x = 0` their heights were 6 and 12."}],"challenges":[{"id":"tc1","goal":[3,5],"setup":{"fam":"F1","targets":[[-1,-16]]},"prompt":"Catch mode, family F1. Make the graph pass through the target (−1, −16).","why":"`b(-1) = (1)(-2)(-4) = 8`, so `k = -16 ÷ 8 = -2`.","named":[{"k":"2","fb":"Your member passes through (−1, 16): right size, wrong sign. The base height 8 is positive and the target is negative, so `k` must be negative."},{"k":"−1/2","fb":"You divided the base height by the target: 8 ÷ (−16). It’s the other way round: `k` = target ÷ base."},{"k":"−16","fb":"`k` isn’t the target height. With `k = -16` the member is at −16 × 8 = −128 when `x = -1`."}],"other":"At `x = -1` your member’s height is `k` × 8 = §1. You need −16.","fam":"This challenge uses family F1. Press \u003cstrong>Set up the explorer\u003c/strong> on this challenge, or choose F1.","hints":["Turn on the height ruler at `x = -1`. What is the base member’s height there?","`b(-1) = (1)(-2)(-4) = 8`. You need `k × 8 = -16`.","`k = -16 ÷ 8 = -2`."]},{"id":"tc2","goal":[3,5],"setup":{"fam":"F2","targets":[[2,6]]},"prompt":"Catch mode, family F2: `y = k(x + 1)^2(x - 3)`. Make the graph pass through the target (2, 6) \u003cstrong>exactly\u003c/strong>.","why":"`b(2) = (3)^2(-1) = -9`, so `k = 6 ÷ (-9) = -2/3`, which only the exact box can reach.","named":[{"k":["−3/4","−1/2"],"fb":"Close, but not exact: your member is at §1 when `x = 2`. The `k` you need isn’t a multiple of 0.25. Work it out and type it in the exact box."},{"k":"2/3","fb":"Your member passes through (2, −6). The base height −9 is negative, so `k` must be negative to give +6."},{"k":"−3/2","fb":"That’s base ÷ target, (−9) ÷ 6. Use target ÷ base."},{"k":"15","fb":"You subtracted: 6 − (−9) = 15. `k` multiplies the base height; it isn’t added to it."}],"other":"At `x = 2` your member’s height is `k` × (−9) = §1. You need 6.","fam":"This challenge uses family F2. Press \u003cstrong>Set up the explorer\u003c/strong> on this challenge, or choose F2.","hints":["Find the base height at `x = 2`. Don’t forget the square.","`b(2) = (2 + 1)^2(2 - 3) = 9 × (-1) = -9`. You need `k × (-9) = 6`.","`k = 6 ÷ (-9) = -2/3`. Type −2/3 in the exact box."]},{"id":"tc3","goal":[3,5],"stretch":true,"setup":{"fam":"tc3","targets":[[0,24],[2,-32]]},"prompt":"The zeros are fixed at −2, 1 and 3, but you choose each zero’s \u003cstrong>order\u003c/strong> (1 or 2) and `k`. Make \u003cstrong>one\u003c/strong> member pass through \u003cstrong>both\u003c/strong> targets (0, 24) and (2, −32).","why":"Only orders 2, 1 and 1 work: `b(0) = 12` and `b(2) = -16`, so `k = 2` catches both, `y = 2(x + 2)^2(x - 1)(x - 3)`.","named":[{"orders":[1,1,1],"k":"4","fb":"You caught (0, 24), but at `x = 2` this member is at 4 × (−4) = −16, not −32. With these orders no `k` catches both, so change an order."},{"orders":[1,1,1],"k":"8","fb":"You caught (2, −32), but the `y`-intercept is 8 × 6 = 48. Change an order."}],"one":"This member passes through one target. Its height at the other is §1.","neither":"Catch (0, 24) first: `k = 24 ÷ b(0)`. Then look at `x = 2`.","fam":"Press \u003cstrong>Set up the explorer\u003c/strong> on this challenge first: it fixes the zeros at −2, 1 and 3 and shows both targets.","hints":["Both targets are on the same member, so `k × b(0) = 24` and `k × b(2) = -32`. Divide the two: `k` cancels, and `b(2) ÷ b(0)` must be −32 ÷ 24 = −4/3.","Compare each factor at `x = 2` with its value at `x = 0`: `(x + 2)` goes from 2 to 4 (×2); `(x - 1)` from −1 to 1 (×(−1)); `(x - 3)` from −3 to −1 (×1/3). Raise each to its order and multiply.","You need `2^p × (-1)^q × (1/3)^s = -4/3`, so `p = 2`, `q = 1`, `s = 1`. Then `b(0) = 4 × (-1) × (-3) = 12` and `k = 24 ÷ 12 = 2`: `y = 2(x + 2)^2(x - 1)(x - 3)`."]}]},"part3":{"slug":"conditions","name":"Conditions","heading":"Build the equation from conditions","intro":"Three rounds. In each one, build the family, then find the member. The graph checks every step you make.","summary":"Build the equation (steps right first try)","general":{"pick":"Tap at least one tile first.","fill":"Fill in every box first.","exact":"Use the exact fraction.","tiles":"Check each tile: which value of `x` makes it equal 0?","num":"Substitute the point’s `x` into every bracket, then multiply. Watch the signs.","frac":"The member’s height is `k` × (base height), so `k` = target height ÷ base height. Check: `k` × base must give the target.","coef":"Expand the base member first, then multiply every coefficient by `k` once.","pair":"Use `(A - B)(A + B) = A^2 - B^2` with `A = x - 1` and `B = √2`.","tileNext":"Now choose the factor for the third zero."},"rounds":[{"id":"r1","name":"Round 1","title":"Round 1: from a description","goal":[2,3],"cond":"A cubic has zeros −1, 2 and 4, and its graph passes through (3, −8).","eqs":["`y = @a{k}(x + 1)(x - 2)(x - 4)`","`y = @a{2}(x + 1)(x - 2)(x - 4)`","`y = 2x^3 - 10x^2 + 4x + 16`"],"steps":[{"kind":"tiles","title":"Factors","ask":"Tap the factor tiles that belong.","tiles":[{"t":"`(x + 1)`","_n":"149b1","_k":"036e307a"},{"t":"`(x - 1)`","fb":"`(x - 1)` is 0 at `x = 1`. The zero −1 needs `(x + 1)`.","_n":"159c1","_k":"02eff531"},{"t":"`(x + 2)`","fb":"`(x + 2)` is 0 at `x = -2`. The zero 2 needs `(x - 2)`.","_n":"169d1","_k":"67627f2d"},{"t":"`(x - 2)`","_n":"179e1","_k":"e9956dc6"},{"t":"`(x + 4)`","fb":"`(x + 4)` is 0 at `x = -4`. The zero 4 needs `(x - 4)`.","_n":"189f1","_k":"9a10c1c5"},{"t":"`(x - 4)`","_n":"19a01","_k":"262de5d1"}],"fewer":"Each of the three zeros needs its own factor. Which zero has no bracket yet?","right":"`(x + 1)(x - 2)(x - 4)`. The fan of `y = k(x + 1)(x - 2)(x - 4)` appears, pinched at the three rings.","hints":["A zero `r` gives the factor `(x - r)`.","The zero −1 gives `(x + 1)`. What do 2 and 4 give?","`(x + 1)`, `(x - 2)` and `(x - 4)`."]},{"kind":"num","title":"Base height","ask":"Substitute the point’s `x` into the family’s product.","label":"`b(3) =`","_a":"SFA=","wrong":[{"match":4,"fb":"`(3 - 4) = -1`, so the product is negative."}],"right":"`b(3) = (4)(1)(-1) = -4`.","hints":["Substitute `x = 3` into each bracket of the base member.","`(3 + 1) = 4`, `(3 - 2) = 1` and `(3 - 4) = -1`.","`b(3) = (4)(1)(-1) = -4`."]},{"kind":"frac","title":"`k`","ask":"Find the `k` of the member through (3, −8).","label":"`k =`","_a":"Vw==","wrong":[{"match":-2,"fb":"That member passes through (3, 8). −8 ÷ (−4) is positive."},{"match":"1/2","fb":"That’s base ÷ target."},{"match":32,"fb":"You multiplied: −8 × (−4) = 32. Divide instead: `k` = target ÷ base."},{"match":-4,"fb":"−4 is the base height itself (it’s also −8 − (−4)). `k` is the number that multiplies the base height: `k × (-4) = -8`."}],"right":"`k = -8 ÷ (-4) = 2`. The `k = 2` member lights up through the target.","hints":["The member’s height at `x = 3` is `k` times the base height there.","You found `b(3) = -4`. So `k × (-4) = -8`.","`k = -8 ÷ (-4) = 2`."]},{"kind":"coef","title":"Expanded form","ask":"Fill in the coefficients of this member.","_a":"PlYaG1AISg1JVQBr","wrong":[{"match":[1,-5,2,8],"fb":"That’s the base member, `(x + 1)(x - 2)(x - 4)`. Multiply every coefficient by `k = 2`."},{"match":[8,-40,16,64],"fb":"You put the 2 into all three brackets, which multiplies by 2³ = 8."}],"right":"The constant term is the `y`-intercept: 16 = 2 × 8.","hints":["Expand the base member first, then multiply every coefficient by `k = 2`.","`(x + 1)(x - 2) = x^2 - x - 2`, and `(x^2 - x - 2)(x - 4) = x^3 - 5x^2 + 2x + 8`.","`2(x^3 - 5x^2 + 2x + 8) = 2x^3 - 10x^2 + 4x + 16`: enter 2, −10, 4 and 16."]}],"alg":["`y = k(x + 1)(x - 2)(x - 4)`","`-8 = k(3 + 1)(3 - 2)(3 - 4) = -4k`","`k = 2`","`y = 2(x + 1)(x - 2)(x - 4) = 2x^3 - 10x^2 + 4x + 16`"]},{"id":"r2","name":"Round 2","title":"Round 2: from a graph","goal":5,"cond":"This graph shows a cubic function.","eqs":["`y = @a{k}(x + 3)(x - 1)^2`","`y = @a{3}(x + 3)(x - 1)^2`","`y = 3x^3 + 3x^2 - 15x + 9`"],"steps":[{"kind":"tilesOrder","title":"Factors and orders","ask":"Tap the factor tiles that belong, then give each one its order.","tiles":[{"t":"`(x + 3)`","ordFb":{"2":"At `x = -3` the graph crosses: that’s an odd order."},"_n":"1aa11","_k":"7136dff0"},{"t":"`(x - 3)`","fb":"`(x - 3)` is 0 at `x = 3`. The zero −3 needs `(x + 3)`.","_n":"1b921","_k":"4abfb2eb"},{"t":"`(x + 1)`","fb":"`(x + 1)` is 0 at `x = -1`. The zero 1 needs `(x - 1)`.","_n":"1c931","_k":"5f60fe8f"},{"t":"`(x - 1)`","ordFb":{"1":"At `x = 1` the graph touches the axis and turns back: that’s an even order.","3":"At `x = 1` the graph touches the axis and turns back: that’s an even order."},"_n":"1da01","_k":"f5dddb88"}],"_a":"HkYGFFsJShtWRgwEHA==","sum":"The graph is a cubic, so the orders add to 3.","fewer":"The graph meets the `x`-axis at −3 and at 1. Each of these zeros needs its own factor.","right":"`(x + 3)` with order 1 and `(x - 1)` with order 2. The fan of `y = k(x + 3)(x - 1)^2` appears.","hints":["Find where the graph meets the `x`-axis, and look at how it behaves there.","It crosses at −3 (odd order) and touches at 1 (even order). A cubic’s orders add to 3.","`(x + 3)` with order 1 and `(x - 1)` with order 2: `y = k(x + 3)(x - 1)^2`."]},{"kind":"num","title":"Base height","ask":"Substitute the labelled point’s `x` into the family’s product.","label":"`b(2) =`","_a":"UA==","wrong":[{"match":15,"fb":"15 is the target height. Step 2 asks for the base member’s height at `x = 2`."}],"right":"`b(2) = (5)(1)^2 = 5`.","hints":["Substitute `x = 2` into the base member `(x + 3)(x - 1)^2`. Don’t forget the square.","`(2 + 3) = 5` and `(2 - 1)^2 = 1`.","`b(2) = (5)(1)^2 = 5`."]},{"kind":"frac","title":"`k`","ask":"Find the `k` of the member through (2, 15).","label":"`k =`","_a":"Vg==","wrong":[{"match":"1/3","fb":"That’s base ÷ target."},{"match":10,"fb":"You subtracted."}],"right":"`k = 15 ÷ 5 = 3`. That’s the member on the graph.","hints":["The member’s height at `x = 2` is `k` times the base height there.","You found `b(2) = 5`. So `k × 5 = 15`.","`k = 15 ÷ 5 = 3`."]},{"kind":"coef","title":"Expanded form","ask":"Fill in the coefficients of this member.","_a":"PlcaBU0VVwxJXWs=","wrong":[{"match":[1,1,-5,3],"fb":"That’s the base member, `(x + 3)(x - 1)^2`. Multiply every coefficient by `k = 3`."},{"match":[27,27,-135,81],"fb":"You put `k` in all three brackets: `(3x + 9)(3x - 3)^2` multiplies by 3³ = 27."}],"right":"Your expanded form predicted the `y`-intercept, and the graph agrees.","hints":["Expand the base member first, then multiply every coefficient by `k = 3`.","`(x - 1)^2 = x^2 - 2x + 1`, and `(x + 3)(x^2 - 2x + 1) = x^3 + x^2 - 5x + 3`.","`3(x^3 + x^2 - 5x + 3) = 3x^3 + 3x^2 - 15x + 9`: enter 3, 3, −15 and 9."]}],"alg":["`y = k(x + 3)(x - 1)^2`","`15 = k(2 + 3)(2 - 1)^2 = 5k`","`k = 3`","`y = 3(x + 3)(x - 1)^2 = 3x^3 + 3x^2 - 15x + 9`"]},{"id":"r3","name":"Round 3","title":"Round 3: zeros that come in a pair","goal":[2,3],"cond":"A cubic has zeros `1 + √2`, `1 - √2` and 3, and passes through (−1, 16).","eqs":["`y = @a{k}(x^2 - 2x - 1)(x - 3)`","`y = @a{-2}(x^2 - 2x - 1)(x - 3)`","`y = -2(x^2 - 2x - 1)(x - 3) = -2x^3 + 10x^2 - 10x - 6`"],"steps":[{"kind":"pair","title":"Factors","ask":"Multiply the factors for the pair of zeros, then choose the factor for the third zero.","frame":"`(x - 1 - √2)(x - 1 + √2) = x^2 +` {b}`x +` {c}","_a":"HkZUFFsVVBVHBxQMTAkb","wrong":[{"match":{"b":-2,"c":3},"fb":"That’s `(x - 1)^2` \u003cstrong>+\u003c/strong> 2. The pattern is `(A - B)(A + B) = A^2 - B^2`, so subtract 2."},{"match":{"b":0,"c":-2},"fb":"That’s `(x - √2)(x + √2)`, which has zeros ±√2. Here `A = x - 1`, not `x`."},{"match":{"b":-2,"c":1},"fb":"You squared `x - 1` correctly but forgot to subtract `(√2)^2 = 2`."}],"tileAsk":"Factor for the zero 3:","tiles":[{"t":"`(x + 3)`","fb":"`(x + 3)` is 0 at `x = -3`. The zero 3 needs `(x - 3)`.","_n":"1e9f1","_k":"f8e3a630"},{"t":"`(x - 3)`","_n":"1f9e1","_k":"0bcc7443"}],"right":"`(x - 1)^2 - 2 = x^2 - 2x - 1`, and the zero 3 gives `(x - 3)`. The fan of `y = k(x^2 - 2x - 1)(x - 3)` appears.","hints":["Group the brackets as `(A - B)(A + B)` with `A = x - 1` and `B = √2`.","`(A - B)(A + B) = A^2 - B^2 = (x - 1)^2 - 2`.","`(x - 1)^2 - 2 = x^2 - 2x + 1 - 2 = x^2 - 2x - 1`. Enter −2 and −1."]},{"kind":"num","title":"Base height","ask":"Substitute the point’s `x` into the family’s product.","label":"`b(-1) =`","_a":"SFw=","wrong":[{"match":8,"fb":"Check the middle term: `-2x` at `x = -1` is +2, so the quadratic is 1 + 2 − 1 = 2, and (2)(−4) = −8."},{"match":2,"fb":"That’s only the quadratic factor. Multiply by the third factor too: `(x - 3)` is −4 at `x = -1`."}],"right":"`b(-1) = (1 + 2 - 1)(-4) = (2)(-4) = -8`.","hints":["Substitute `x = -1` into both factors, `x^2 - 2x - 1` and `(x - 3)`.","`(-1)^2 - 2(-1) - 1 = 1 + 2 - 1 = 2`, and `(-1 - 3) = -4`.","`b(-1) = (2)(-4) = -8`."]},{"kind":"frac","title":"`k`","ask":"Find the `k` of the member through (−1, 16).","label":"`k =`","_a":"SFY=","wrong":[{"match":2,"fb":"The base height −8 is negative, so `k` is negative."},{"match":"−1/2","fb":"That’s base ÷ target."},{"match":24,"fb":"That’s 16 − (−8). `k` multiplies."}],"right":"`k = 16 ÷ (-8) = -2`. The `k = -2` member lights up through the target.","hints":["The member’s height at `x = -1` is `k` times the base height there.","You found `b(-1) = -8`. So `k × (-8) = 16`.","`k = 16 ÷ (-8) = -2`."]},{"kind":"num","title":"`y`-intercept","ask":"What is this member’s `y`-intercept?","label":"`y`-intercept:","_a":"SFI=","wrong":[{"match":3,"fb":"That’s the base member’s `y`-intercept. Multiply by `k = -2`."},{"match":6,"fb":"Check the sign: `k = -2` is negative and `b(0) = 3` is positive."}],"right":"`b(0) = (-1)(-3) = 3` and −2 × 3 = −6. The full equation: `y = -2(x^2 - 2x - 1)(x - 3) = -2x^3 + 10x^2 - 10x - 6`.","hints":["The `y`-intercept is the member’s height at `x = 0`: `k × b(0)`.","`b(0) = (0 - 0 - 1)(0 - 3) = (-1)(-3) = 3`.","The `y`-intercept is −2 × 3 = −6."]}],"alg":["`y = k(x^2 - 2x - 1)(x - 3)`","`16 = k((-1)^2 - 2(-1) - 1)(-1 - 3) = -8k`","`k = -2`","`y = -2(x^2 - 2x - 1)(x - 3) = -2x^3 + 10x^2 - 10x - 6`"]}],"blocks":[{"title":"What the steps mean","html":"\u003cp>\u003cstrong>From conditions to one function\u003c/strong>\u003c/p>\u003col>\u003cli>Each zero `r` gives a factor `(x - r)`, raised to the zero’s order. A pair `p ± √m` gives `(x - p)^2 - m`; for example, `1 ± √2` gives `(x - 1)^2 - 2`.\u003c/li>\u003cli>Put `k` in front: that’s the family.\u003c/li>\u003cli>Substitute a point off the `x`-axis whose `x` isn’t a zero, and solve for `k`: that’s the member.\u003c/li>\u003cli>If you expand, `k` multiplies every coefficient once. The constant term is the `y`-intercept.\u003c/li>\u003c/ol>\u003cp>If the orders aren’t given, more than one family may fit. If the point is a zero, it can’t pick a member.\u003c/p>"}],"quickCheck":{"title":"How many functions fit?","summary":"How many functions fit?","items":[{"id":"q1","goal":5,"prompt":"A cubic with zeros −1, 2 and 4 that passes through (0, 8)","choices":[{"t":"None","fb":"The zeros fix the family `y = k(x + 1)(x - 2)(x - 4)`, and (0, 8) is off the `x`-axis at an `x` that isn’t a zero, so it picks one `k`: 8 ÷ 8 = 1.","_n":"1g9d1","_k":"6e1e751c"},{"t":"Exactly one","fb":"Right. `b(0) = (1)(-2)(-4) = 8`, so `k = 1`: `y = (x + 1)(x - 2)(x - 4)`.","_n":"1ha41","_k":"fae0e280"},{"t":"Exactly two","fb":"The zeros fix the family `y = k(x + 1)(x - 2)(x - 4)`, and (0, 8) is off the `x`-axis at an `x` that isn’t a zero, so it picks one `k`: 8 ÷ 8 = 1.","_n":"1ia31","_k":"a22a2ab5"},{"t":"Infinitely many","fb":"The zeros fix the family `y = k(x + 1)(x - 2)(x - 4)`, and (0, 8) is off the `x`-axis at an `x` that isn’t a zero, so it picks one `k`: 8 ÷ 8 = 1.","_n":"1ja21","_k":"e2b1932b"}]},{"id":"q2","goal":5,"prompt":"A cubic with zeros −1, 2 and 4 that passes through (2, 0)","choices":[{"t":"None","fb":"2 is one of the zeros, so 0 = `k` × 0 for every `k`. Every member fits.","_n":"1ka11","_k":"492b4ea9"},{"t":"Exactly one","fb":"2 is one of the zeros, so 0 = `k` × 0 for every `k`. Every member fits.","_n":"1l981","_k":"631c5f03"},{"t":"Exactly two","fb":"2 is one of the zeros, so 0 = `k` × 0 for every `k`. Every member fits.","_n":"1m971","_k":"9df180d5"},{"t":"Infinitely many","fb":"Right. (2, 0) is a zero, so every member passes through it. It doesn’t narrow anything down.","_n":"1na62","_k":"573860f9"}]},{"id":"q3","goal":5,"prompt":"A cubic with zeros −1, 2 and 4 that passes through (2, 5)","choices":[{"t":"None","fb":"Right. At `x = 2` every member has height 0, never 5.","_n":"1oa72","_k":"9775a6e5"},{"t":"Exactly one","fb":"`x = 2` is a zero, so every member is at height 0 there. No `k` gives 5.","_n":"1pa42","_k":"2deaa8ae"},{"t":"Exactly two","fb":"`x = 2` is a zero, so every member is at height 0 there. No `k` gives 5.","_n":"1qa52","_k":"4345157a"},{"t":"Infinitely many","fb":"`x = 2` is a zero, so every member is at height 0 there. No `k` gives 5.","_n":"1ra22","_k":"272f6926"}]},{"id":"q4","goal":5,"prompt":"A cubic whose only zeros are 0 and 3, that passes through (1, 4)","choices":[{"t":"None","fb":"The orders aren’t given. A cubic with only these zeros is `k` times `x^2(x - 3)` or `x(x - 3)^2` (its third linear factor has to repeat 0 or 3), and each family has one member through (1, 4): `k = -2` and `k = 1`.","_n":"1sa32","_k":"57715f6a"},{"t":"Exactly one","fb":"The orders aren’t given. A cubic with only these zeros is `k` times `x^2(x - 3)` or `x(x - 3)^2` (its third linear factor has to repeat 0 or 3), and each family has one member through (1, 4): `k = -2` and `k = 1`.","_n":"1ta02","_k":"9a656d8e"},{"t":"Exactly two","fb":"Right. The orders could be 2 and 1, or 1 and 2: `y = -2x^2(x - 3)` and `y = x(x - 3)^2`. Each family gives one member through (1, 4).","_n":"1ua12","_k":"71b08e25"},{"t":"Infinitely many","fb":"The orders aren’t given. A cubic with only these zeros is `k` times `x^2(x - 3)` or `x(x - 3)^2` (its third linear factor has to repeat 0 or 3), and each family has one member through (1, 4): `k = -2` and `k = 1`.","_n":"1v9e2","_k":"95ee6551"}]}]}},"practice":{"activities":[{"id":"same","type":"sorter","title":"Same family?","summary":"Same family?","noun":"function","goal":4,"instruction":"The family is `y = k(x + 1)(x - 2)(x - 3)`, `k ≠ 0`. Sort each function into the box that describes it.\u003cbr>\u003cspan class=\"tiny muted\">The base member, for reference: `y = x^3 - 4x^2 + x + 6`\u003c/span>","how":"Tap a function, then tap the box it belongs in.","boxes":[{"id":"b1","label":"In the family"},{"id":"b2","label":"Same zeros, different family"},{"id":"b3","label":"Different zeros"}],"items":[{"id":"s1","t":"`y = -4(x + 1)(x - 2)(x - 3)`","_a":"RwYHFA==","why":"`k = -4`: a stretch by 4 and a reflection. Same zeros, same orders.","wrong":{"b2":"The zeros and their orders both match; only `k` differs, and a negative `k` is allowed.","b3":"−4 doesn’t change the zeros: they’re still −1, 2 and 3."},"hints":["Find the zeros of `y = -4(x + 1)(x - 2)(x - 3)`, and the order of each.","`y = -4(x + 1)(x - 2)(x - 3)`’s zeros are −1, 2 and 3 with orders 1, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","`k = -4`: a stretch by 4 and a reflection. Same zeros, same orders, so it belongs in “In the family”."]},{"id":"s2","t":"`y = (2x + 2)(x - 2)(x - 3)`","_a":"RwYHFA==","why":"`2x + 2 = 2(x + 1)`, so this is 2 times the base: `k = 2`.","wrong":{"b2":"Factor 2 out of `(2x + 2)`: it’s `2(x + 1)`, so the orders match too.","b3":"`2x + 2 = 0` at `x = -1`, so the zeros are unchanged."},"hints":["Find the zeros of `y = (2x + 2)(x - 2)(x - 3)`, and the order of each.","`y = (2x + 2)(x - 2)(x - 3)`’s zeros are −1, 2 and 3 with orders 1, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","`2x + 2 = 2(x + 1)`, so this is 2 times the base: `k = 2`, so it belongs in “In the family”."]},{"id":"s3","t":"`y = (x + 1)(6 - 3x)(x - 3)`","_a":"RwYHFA==","why":"`6 - 3x = -3(x - 2)`, so `k = -3`.","wrong":{"b2":"`(6 - 3x) = -3(x - 2)`: one factor, order 1. Only `k` differs.","b3":"`6 - 3x = 0` at `x = 2`, the same zero."},"hints":["Find the zeros of each factor, and the order of each.","`6 - 3x = 0` at `x = 2`. Factor −3 out of it: `6 - 3x = -3(x - 2)`.","So the function is `-3(x + 1)(x - 2)(x - 3)`: `k = -3`, and it’s in the family."]},{"id":"s4","t":"`y = -x^3 + 4x^2 - x - 6`","_a":"RwYHFA==","why":"It’s −1 times the base member `x^3 - 4x^2 + x + 6`, so `k = -1`.","wrong":{"b2":"Every coefficient is −1 times the base member’s, so it’s `k = -1`, not a new family.","b3":"Compare with the base member: every coefficient has just changed sign."},"hints":["Find the zeros of `y = -x^3 + 4x^2 - x - 6`, and the order of each.","It’s `-(x^3 - 4x^2 + x + 6)`, so its zeros are those of the base member: −1, 2 and 3 with orders 1, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","It’s −1 times the base member `x^3 - 4x^2 + x + 6`, so `k = -1`, so it belongs in “In the family”."]},{"id":"s5","t":"`y = -(x + 1)(x - 2)(3 - x)`","_a":"RwYHFA==","why":"`(3 - x) = -(x - 3)`, so the two minus signs cancel: `k = 1`.","wrong":{"b2":"`(3 - x)` is `-(x - 3)`, order 1; the two negatives make `k = 1`.","b3":"`3 - x = 0` at `x = 3`."},"hints":["Find the zeros of `y = -(x + 1)(x - 2)(3 - x)`, and the order of each.","`y = -(x + 1)(x - 2)(3 - x)`’s zeros are −1, 2 and 3 with orders 1, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","`(3 - x) = -(x - 3)`, so the two minus signs cancel: `k = 1`, so it belongs in “In the family”."]},{"id":"s6","t":"`y = (x + 1)^2(x - 2)(x - 3)`","_a":"RwYEFA==","why":"Same zeros, but −1 now has order 2 and the degree is 4.","wrong":{"b1":"The zeros match, but the order of −1 is 2. A member must be `k` times `(x + 1)(x - 2)(x - 3)` exactly.","b3":"Its `x`-intercepts are still −1, 2 and 3, and nothing else."},"hints":["Find the zeros of `y = (x + 1)^2(x - 2)(x - 3)`, and the order of each.","`y = (x + 1)^2(x - 2)(x - 3)`’s zeros are −1, 2 and 3 with orders 2, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","Same zeros, but −1 now has order 2 and the degree is 4, so it belongs in “Same zeros, different family”."]},{"id":"s7","t":"`y = (x + 1)(x - 2)(x - 3)(x^2 + 4)`","_a":"RwYEFA==","why":"`x^2 + 4` is never 0, so the zeros are still −1, 2 and 3, but the degree is 5.","wrong":{"b1":"`(x^2 + 4)` isn’t a constant, so this isn’t `k` times the base: it’s degree 5.","b3":"`x^2 + 4 ≥ 4`, so it adds no new `x`-intercepts."},"hints":["Does the extra factor `x^2 + 4` ever equal 0?","`x^2 ≥ 0`, so `x^2 + 4 ≥ 4`: no new zeros. But what is the degree now?","The zeros are still −1, 2 and 3, but the degree is 5, so it’s a different family."]},{"id":"s8","t":"`y = -2(x + 1)(x - 2)^3(x - 3)`","_a":"RwYEFA==","why":"Same zeros, but 2 has order 3, so the degree is 5.","wrong":{"b1":"The −2 is fine, but the cube on `(x - 2)` changes the order.","b3":"The zeros are still −1, 2 and 3."},"hints":["Find the zeros of `y = -2(x + 1)(x - 2)^3(x - 3)`, and the order of each.","`y = -2(x + 1)(x - 2)^3(x - 3)`’s zeros are −1, 2 and 3 with orders 1, 3 and 1. Compare them with −1, 2 and 3, each of order 1.","Same zeros, but 2 has order 3, so the degree is 5, so it belongs in “Same zeros, different family”."]},{"id":"s9","t":"`y = (x + 1)(x - 2)(x - 3) + 5`","_a":"RwYFFA==","why":"Adding 5 lifts every point 5 units, so at −1, 2 and 3 the height is 5, not 0.","wrong":{"b1":"+5 is a shift, not a stretch: the zeros move.","b2":"Try `x = 2`: the height is 0 + 5 = 5, so 2 is no longer a zero."},"hints":["Find the zeros of `y = (x + 1)(x - 2)(x - 3) + 5`, and the order of each.","The product is 0 at −1, 2 and 3, so the height there is 0 + 5 = 5: none of them is a zero now. Compare that with the family’s zeros −1, 2 and 3, each of order 1.","Adding 5 lifts every point 5 units, so at −1, 2 and 3 the height is 5, not 0, so it belongs in “Different zeros”."]},{"id":"s10","t":"`y = (x - 1)(x + 2)(x + 3)`","_a":"RwYFFA==","why":"Its zeros are 1, −2 and −3: every sign is flipped.","wrong":{"b1":"`(x - 1)` is 0 at `x = 1`, not −1.","b2":"Check each factor: the zeros are 1, −2 and −3."},"hints":["Find the zeros of `y = (x - 1)(x + 2)(x + 3)`, and the order of each.","`y = (x - 1)(x + 2)(x + 3)`’s zeros are 1, −2 and −3 with orders 1, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","Its zeros are 1, −2 and −3: every sign is flipped, so it belongs in “Different zeros”."]},{"id":"s11","t":"`y = (2x + 1)(x - 2)(x - 3)`","_a":"RwYFFA==","why":"`2x + 1 = 0` at `x = -1/2`, not −1.","wrong":{"b1":"`2x + 1 = 2(x + 1/2)`: its zero is −1/2.","b2":"Solve `2x + 1 = 0`: `x = -1/2`, not −1."},"hints":["Find the zeros of `y = (2x + 1)(x - 2)(x - 3)`, and the order of each.","`y = (2x + 1)(x - 2)(x - 3)`’s zeros are −1/2, 2 and 3 with orders 1, 1 and 1. Compare them with −1, 2 and 3, each of order 1.","`2x + 1 = 0` at `x = -1/2`, not −1, so it belongs in “Different zeros”."]}]},{"id":"member","type":"custom","title":"Find the member","summary":"Find the member","star":true,"goal":3,"instruction":"Find the member of each family that fits the condition. Enter exact values; fractions are fine.","how":"Type your answer, then press Check.","general":"Some boxes aren’t right yet: they’re outlined. Check your work and try again.","items":[{"id":"f1","goal":3,"prompt":"Family `y = k(x - 1)(x + 3)(x - 4)`. Find `k` for the member through (2, 30).","frame":"`k =` {k}","labels":{"k":"k"},"_a":"HkZdFFsVVUQ=","wrong":[{"match":{"k":3},"fb":"`(2 - 4) = -2` makes the base height negative, so `k` is negative."},{"match":{"k":"−1/3"},"fb":"That’s base ÷ target."},{"match":{"k":40},"fb":"You subtracted, 30 − (−10). `k` multiplies the base height."}],"why":"`b(2) = (1)(5)(-2) = -10` and 30 ÷ (−10) = −3.","hints":["Find the base height `b(2)` first.","`b(2) = (2 - 1)(2 + 3)(2 - 4) = (1)(5)(-2) = -10`. Now solve `30 = k(-10)`.","`k = 30 ÷ (-10) = -3`."]},{"id":"f2","goal":3,"prompt":"Family `y = k(x + 2)^2(x - 1)`. Find `k` for the member whose `y`-intercept is −6.","frame":"`k =` {k}","labels":{"k":"k"},"_a":"HkZdFFsaVRZXRks=","wrong":[{"match":{"k":"−3/2"},"fb":"The base `y`-intercept −4 and the target −6 have the same sign, so `k` is positive."},{"match":{"k":"2/3"},"fb":"That’s base ÷ target, −4 ÷ (−6)."},{"match":{"k":3},"fb":"You used (0 + 2) = 2 without squaring it. The factor is `(x + 2)^2`, which is 4 at `x = 0`."}],"why":"`b(0) = (2)^2(-1) = -4` and −6 ÷ (−4) = 3/2.","hints":["The `y`-intercept is the height at `x = 0`.","`b(0) = (0 + 2)^2(0 - 1) = 4 × (-1) = -4`. Solve `-6 = k(-4)`.","`k = -6 ÷ (-4) = 3/2`."]},{"id":"f3","goal":3,"prompt":"A quartic family has zeros −2, −1, 1 and 3 (each of order 1). Its member through (2, −24) has what value of `k`, and what `y`-intercept?","frame":"`k =` {k} \u003cspan class=\"mb-gap\">\u003c/span> `y`-intercept: {y}","labels":{"k":"k","y":"y-intercept"},"_a":"HkZdFFsKShscRgwHU0U=","wrong":[{"match":{"y":6},"fb":"That’s the base member’s. Multiply by `k`."},{"match":{"y":-12},"fb":"(−1)(−3) = +3: check the signs in `b(0)`."}],"why":"`b(2) = (4)(3)(1)(-1) = -12`, so `k = -24 ÷ (-12) = 2`; `b(0) = (2)(1)(-1)(-3) = 6`, so the `y`-intercept is 2 × 6 = 12.","hints":["Write the family: `y = k(x + 2)(x + 1)(x - 1)(x - 3)`.","`b(2) = (4)(3)(1)(-1) = -12`, so `k = 2`. For the `y`-intercept, find `b(0)`.","`b(0) = (2)(1)(-1)(-3) = 6`, so the `y`-intercept is 2 × 6 = 12."]},{"id":"f4","goal":3,"star":true,"prompt":"A member of the family `y = k(x + 1)(x - 2)(x - 5)` has a `y`-intercept of 20. What is its value at `x = 3`?","frame":"Value at `x = 3`: {v}","labels":{"v":"value at x = 3"},"_a":"HkZAFFsVVw8Y","wrong":[{"match":{"v":-8},"fb":"That’s the base member’s value. You still need `k`."},{"match":{"v":16},"fb":"`(3 - 5) = -2` makes `b(3)` negative."},{"match":{"v":-160},"fb":"`k` isn’t 20. The `y`-intercept is `k × b(0)`, so `k = 20 ÷ 10 = 2`."}],"why":"`b(0) = (1)(-2)(-5) = 10`, so `k = 2`; `b(3) = (4)(1)(-2) = -8`, so the value is 2 × (−8) = −16.","hints":["You can’t find the value at 3 until you know `k`. The `y`-intercept gives it.","`b(0) = (1)(-2)(-5) = 10`, so `20 = 10k` and `k = 2`. Now find `b(3)`.","`b(3) = (4)(1)(-2) = -8`, so the value is 2 × (−8) = −16."]},{"id":"f5","goal":2,"star":true,"prompt":"The zeros of a cubic family are the roots of `x^3 - 3x^2 - 6x + 8 = 0`. Find `k` for the member through (3, 20).","frame":"`k =` {k}","labels":{"k":"k"},"_a":"HkZdFFsVVEQ=","wrong":[{"match":{"k":2},"fb":"The base height at `x = 3` is −10, so `k` must be negative to give +20."},{"match":{"k":"−1/2"},"fb":"That’s base ÷ target, −10 ÷ 20."}],"why":"You didn’t need to factor. A polynomial is always a member of its own family (`k = 1`).","hints":["Every member is `k` times one cubic with these zeros. Is `x^3 - 3x^2 - 6x + 8` itself such a cubic?","Yes: its roots are the zeros, so the family is `y = k(x^3 - 3x^2 - 6x + 8)`. Find its value at `x = 3`.","27 − 27 − 18 + 8 = −10, so `k = 20 ÷ (-10) = -2`. (Factoring gives the same thing: `(x - 1)(x + 2)(x - 4)` is −10 at `x = 3`.)"]},{"id":"f6","goal":5,"star":true,"prompt":"A member of the family `y = k(x - 2)(x + 1)^m`, where `m` is 1, 2 or 3, passes through (0, −4) and (1, −8). Find `m` and `k`.","frame":"`m =` {m} \u003cspan class=\"mb-gap\">\u003c/span> `k =` {k}","labels":{"m":"m","k":"k"},"_a":"HkZbFFsKShsORgwEHA==","wrong":[{"match":{"m":1,"k":2},"fb":"This member passes through (0, −4), but at `x = 1` it’s at 2(−1)(2) = −4, not −8."},{"match":{"m":3,"k":2},"fb":"At `x = 1` this member is at 2(−1)(8) = −16."}],"why":"At `x = 0`: `(-2)(1)^m = -2` whatever `m` is, so `k = -4 ÷ (-2) = 2`. At `x = 1`: `2 × (-1) × 2^m = -8`, so `2^m = 4` and `m = 2`. Check: `2(1 - 2)(1 + 1)^2 = -8`.","hints":["Use the point that doesn’t depend on `m` first. What is `(0 + 1)^m`?","`1^m = 1`, so `b(0) = -2` and `k = 2`. Now use (1, −8): `2(1 - 2)(1 + 1)^m = -8`.","`-2 × 2^m = -8`, so `2^m = 4` and `m = 2`: `y = 2(x - 2)(x + 1)^2`."]},{"id":"f7","goal":2,"star":true,"prompt":"A cubic family has zeros `2 + √3`, `2 - √3` and −1. Find `k` for the member through (1, 4), then write that member in expanded form.","frame":"`k =` {k}\u003cbr>`y =` {a}`x^3 +` {b}`x^2 +` {c}`x +` {d}","labels":{"k":"k","a":"coefficient of x cubed","b":"coefficient of x squared","c":"coefficient of x","d":"constant term"},"_a":"HkZdFFsVVxVHBRQMTAlKGwdGDAVNGgUbX1caFAUaXBRUGQ==","wrong":[{"match":{"k":"1/2"},"fb":"That comes from `x^2 - 4x + 7`, which is `(x - 2)^2` \u003cstrong>+\u003c/strong> 3. Subtract: `(x - 2)^2 - 3`."},{"match":{"a":-1,"b":-1,"c":3,"d":3},"fb":"Your `k` is right by coincidence, but the quadratic factor is `(x - 2)^2 - 3 = x^2 - 4x + 1`, not `x^2 - 3`."},{"match":{"a":1,"b":-3,"c":-3,"d":1},"fb":"That’s the base member. Multiply by `k = -1`."}],"why":"The pair gives `(x - 2)^2 - 3 = x^2 - 4x + 1`, so `b(x) = (x^2 - 4x + 1)(x + 1)` and `b(1) = (-2)(2) = -4`, so `k = -1`. Expanded: `y = -x^3 + 3x^2 + 3x - 1`.","hints":["Multiply the two irrational factors first: `(x - 2 - √3)(x - 2 + √3)` is `(A - B)(A + B)`.","It’s `(x - 2)^2 - 3 = x^2 - 4x + 1`. At `x = 1`, `b(1) = (1 - 4 + 1)(1 + 1) = -4`.","`k = 4 ÷ (-4) = -1`. `(x^2 - 4x + 1)(x + 1) = x^3 - 3x^2 - 3x + 1`, so `y = -x^3 + 3x^2 + 3x - 1`."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the Error","student":"Hana","how":"","instruction":"Hana made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the member of the family with zeros −3, 1 and 2 that passes through (−1, 24).","steps":["The family is `y = k(x + 3)(x - 1)(x - 2)`.","Substitute (−1, 24): `24 = k(-1 + 3)(-1 - 1)(-1 - 2)`.","`24 = k(2)(-2)(-3) = -12k`","`k = -2`","`y = -2(x + 3)(x - 1)(x - 2)`"],"_a":"Vw==","stepFb":["Step 1 is correct: each zero `r` gives `(x - r)`. Keep checking the steps after it.","Step 2 is correct. Keep checking.","","Step 4 divides correctly by step 3’s number. The mistake is earlier.","Step 5 uses step 4’s `k`. The mistake is earlier."],"fixes":[{"t":"`(2)(-2)(-3) = 12`, so `24 = 12k` and `k = 2`: `y = 2(x + 3)(x - 1)(x - 2)`.","why":"Two negative factors give a positive product. Check: 2 × 12 = 24.","_n":"1w9f2","_k":"08fdf99c"},{"t":"Step 3 is correct as written.","why":"Count the negative factors: (−2) and (−3). An even number of negatives gives a positive product.","_n":"1x0c2","_k":"8a4c9c9a"},{"t":"`(2)(-2)(-3) = 12`, so `k = 12 ÷ 24 = 1/2`.","why":"The product is right now, but the division is upside down: `k = 24 ÷ 12`.","_n":"1y0b2","_k":"71507082"},{"t":"`(2)(-2)(-3) = -12`, so `k = 24 - (-12) = 36`.","why":"The product is still wrong, and `k` multiplies the product; it isn’t found by subtracting.","_n":"1z0e2","_k":"c8e7eb06"}],"hints":["Check the sign of each product.","In step 3, how many of the factors 2, −2 and −3 are negative?","Step 3 is wrong: (2)(−2)(−3) = +12, so `k = 2` and `y = 2(x + 3)(x - 1)(x - 2)`."]},{"id":"e2","goal":4,"task":"Write the member of `y = k(x - 2)^2(x + 1)` that passes through (1, 6) in expanded form.","steps":["Substitute (1, 6): `6 = k(1 - 2)^2(1 + 1)`.","`6 = k(1)(2) = 2k`, so `k = 3`.","`y = 3(x - 2)^2(x + 1)`","`y = (3x - 6)^2(3x + 3)`","`y = (9x^2 - 36x + 36)(3x + 3) = 27x^3 - 81x^2 + 108`"],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: (−1)² = 1.","Step 3 is correct. The mistake is later.","","Step 5 expands step 4 correctly. The mistake is earlier."],"fixes":[{"t":"`y = 3(x^2 + 4)(x + 1) = 3x^3 + 3x^2 + 12x + 12`.","why":"`(x - 2)^2 = x^2 - 4x + 4`, not `x^2 + 4`.","_n":"200d2","_k":"89c54860"},{"t":"Step 4 is correct as written.","why":"Test it: at `x = 1`, step 4 gives `(-3)^2(6) = 54`, not 6. Putting 3 into every bracket multiplied by 3 three times.","_n":"21102","_k":"23f843ce"},{"t":"Keep the 3 outside: `y = 3(x^2 - 4x + 4)(x + 1) = 3(x^3 - 3x^2 + 4) = 3x^3 - 9x^2 + 12`.","why":"`k` multiplies the whole product once. Check: at `x = 1`, 3 − 9 + 12 = 6.","_n":"220f2","_k":"25be8ce3"},{"t":"`y = (3x - 6)^2(x + 1)`.","why":"`(3x - 6)^2 = 9(x - 2)^2`, so this multiplies by 9, not 3.","_n":"23122","_k":"33eafe22"}],"hints":["Test each equation for `y` with the point (1, 6).","Step 3’s equation gives 3(1)(2) = 6 at `x = 1`. What does step 4’s give?","Step 4 gives 54: the 3 went into every bracket. Keep it outside: `y = 3x^3 - 9x^2 + 12`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you moved `k`? What changed, and what never changed?"},{"id":"j2","q":"In your own words, what makes two polynomial functions members of the same family?"},{"id":"j3","q":"Explain to a friend how to find the member of a family that passes through a given point. Include what goes wrong if the point is on the `x`-axis."},{"id":"j4","q":"Which step of building an equation from conditions is still shaky for you: choosing the factors and orders, finding `k`, or expanding? What will you practise, and how?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":4,"a":{"prompt":"Which function is a member of the family `y = k(x + 2)(x - 1)(x - 4)`, `k ≠ 0`?","options":[{"t":"`y = (x + 2)(x - 1)(x - 4) + 3`","why":"Adding 3 shifts the graph up, so at −2, 1 and 4 the height is 3, not 0. A member multiplies the base member by `k`; it doesn’t add to it.","_n":"24112","_k":"f2f529b6"},{"t":"`y = (3 - 3x)(x + 2)(x - 4)`","why":"`3 - 3x = -3(x - 1)`, so this is `-3(x + 2)(x - 1)(x - 4)`: `k = -3`, with the same zeros and the same orders.","_n":"25142","_k":"4a778ea1"},{"t":"`y = (3x - 1)(x + 2)(x - 4)`","why":"`3x - 1` is 0 at `x = 1/3`, not 1: `3x - 1 = 3(x - 1/3)`. The zero 1 needs `3x - 3` or `3 - 3x`.","_n":"26132","_k":"e37e9eaa"},{"t":"`y = (x + 2)^2(x - 1)(x - 4)`","why":"Same zeros, but −2 has order 2 and the degree is 4. A member is `k` times the cubic exactly.","_n":"27a21","_k":"709df5d3"}]},"b":{"prompt":"Which function is a member of the family `y = k(x + 3)(x - 2)(x - 5)`, `k ≠ 0`?","options":[{"t":"`y = (4 - 2x)(x + 3)(x - 5)`","why":"`4 - 2x = -2(x - 2)`, so this is `-2(x + 3)(x - 2)(x - 5)`: `k = -2`, same zeros, same orders.","_n":"28a31","_k":"6d060f3e"},{"t":"`y = (x + 3)(x - 2)(x - 5) - 4`","why":"Subtracting 4 shifts the graph down, so the zeros move. A member multiplies by `k`.","_n":"29a41","_k":"8c6ea517"},{"t":"`y = (x + 3)(x - 2)(x - 5)^2`","why":"Same zeros, but 5 has order 2 and the degree is 4.","_n":"2aa51","_k":"d0529682"},{"t":"`y = (5x - 2)(x + 3)(x - 5)`","why":"`5x - 2` is 0 at `x = 2/5`, not 2. The zero 2 needs a factor such as `4 - 2x = -2(x - 2)`.","_n":"2b9e1","_k":"fedc6ab9"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which statement is true for \u003cstrong>every\u003c/strong> member of the family `y = k(x - 2)(x + 1)(x + 3)`, `k ≠ 0`?","options":[{"t":"It passes through (1, −8)","why":"Only when `k = 1`: (−1)(2)(4) = −8. Other members are at `-8k`.","_n":"2c9f1","_k":"ef14d1d3"},{"t":"Its `x`-intercepts are −3, −1 and 2","why":"`k` multiplies every height, and `k × 0 = 0`, so every member has these zeros.","_n":"2da01","_k":"355418f9"},{"t":"Its `y`-intercept is −6","why":"That’s only the base member (`k = 1`): (−2)(1)(3) = −6. In general the `y`-intercept is `-6k`.","_n":"2ea11","_k":"069db4a2"},{"t":"It rises to the right (as `x → ∞`, `y → ∞`)","why":"Only when `k > 0`. Members with `k \u003c 0` fall to the right.","_n":"2f9a1","_k":"75cfec29"}]},"b":{"prompt":"Which statement is true for \u003cstrong>every\u003c/strong> member of the family `y = k(x + 2)(x - 1)(x - 4)`, `k ≠ 0`?","options":[{"t":"Its `y`-intercept is 8","why":"Only when `k = 1`: (2)(−1)(−4) = 8.","_n":"2g9b1","_k":"4dac5d4b"},{"t":"It falls to the left (as `x → -∞`, `y → -∞`)","why":"Only when `k > 0`.","_n":"2h281","_k":"e7c9beb7"},{"t":"Its `x`-intercepts are −2, 1 and 4","why":"Every member is 0 wherever a factor is 0.","_n":"2i271","_k":"252aefa6"},{"t":"It passes through (2, −8)","why":"Only when `k = 1`: (4)(1)(−2) = −8.","_n":"2j261","_k":"122e9f73"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which value of `k` gives the member of `y = k(x + 1)(x - 3)` that passes through (1, 12)?","options":[{"t":"−3","why":"`b(1) = (2)(-2) = -4`, so `k = 12 ÷ (-4) = -3`.","_n":"2k251","_k":"4bd5d346"},{"t":"−1/3","why":"That’s base ÷ target, −4 ÷ 12.","_n":"2l241","_k":"b9a52677"},{"t":"3","why":"The base height −4 is negative, so `k` must be negative to give +12.","_n":"2m231","_k":"f8653a99"},{"t":"16","why":"That’s 12 − (−4). `k` multiplies the base height.","_n":"2n221","_k":"9004199b"}]},"b":{"prompt":"Which value of `k` gives the member of `y = k(x - 2)(x + 4)` that passes through (0, 16)?","options":[{"t":"−2","why":"`b(0) = (-2)(4) = -8`, so `k = 16 ÷ (-8) = -2`.","_n":"2o211","_k":"6edab386"},{"t":"−1/2","why":"That’s −8 ÷ 16.","_n":"2p201","_k":"d2b62a47"},{"t":"2","why":"`b(0)` is negative, so `k` must be negative.","_n":"2q1f1","_k":"6d313ed9"},{"t":"24","why":"That’s 16 − (−8).","_n":"2r4e1","_k":"0464689e"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A member of the family `y = k(x + 1)(x - 2)(x - 4)` passes through (3, 12). What is its `y`-intercept?","options":[{"t":"−24","why":"`b(3) = (4)(1)(-1) = -4`, so `k = -3`. `b(0) = (1)(-2)(-4) = 8`, so the `y`-intercept is −3 × 8 = −24.","_n":"2s4d1","_k":"479c6b69"},{"t":"−8/3","why":"That uses `k = -4 ÷ 12 = -1/3`, which is upside down.","_n":"2t501","_k":"8d44e1f2"},{"t":"8","why":"That’s the base member’s `y`-intercept. Multiply by `k = -3`.","_n":"2u4f1","_k":"a85122da"},{"t":"24","why":"`k` is −3, not 3: the base height at `x = 3` is negative.","_n":"2v4a1","_k":"4a6fe1ae"}]},"b":{"prompt":"A member of the family `y = k(x + 2)(x - 1)(x - 3)` passes through (2, 12). What is its `y`-intercept?","options":[{"t":"−18","why":"`b(2) = (4)(1)(-1) = -4`, so `k = -3`. `b(0) = (2)(-1)(-3) = 6`, so the `y`-intercept is −18.","_n":"2w491","_k":"a30cc3c8"},{"t":"−2","why":"That uses `k = -1/3`.","_n":"2x4c1","_k":"4d9574f2"},{"t":"6","why":"That’s the base member’s `y`-intercept.","_n":"2y4b1","_k":"1267b242"},{"t":"18","why":"`k` is negative here.","_n":"2z561","_k":"f1c58216"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"For which point is there \u003cstrong>no\u003c/strong> member of the family `y = k(x^2 - 6x + 5)(x + 2)`, `k ≠ 0`, that passes through it?","options":[{"t":"(2, 24)","why":"`b(2) = (4 - 12 + 5)(4) = (-3)(4) = -12`, so `k = -2` works.","_n":"30551","_k":"0ed6be48"},{"t":"(0, −10)","why":"`b(0) = (5)(2) = 10`, so `k = -1` works.","_n":"31481","_k":"f2d73c8b"},{"t":"(1, 4)","why":"`x^2 - 6x + 5 = (x - 1)(x - 5)`, so `x = 1` is a zero. Every member has height `k × 0 = 0` there, never 4.","_n":"32491","_k":"3403b9ea"},{"t":"(5, 0)","why":"`x = 5` is a zero of `x^2 - 6x + 5`, so (5, 0) is on \u003cstrong>every\u003c/strong> member. It can’t pick one out, but it doesn’t rule them all out either.","_n":"33461","_k":"44c10bff"}]},"b":{"prompt":"For which point is there \u003cstrong>no\u003c/strong> member of the family `y = k(x^2 - 6x + 8)(x + 3)`, `k ≠ 0`, that passes through it?","options":[{"t":"(2, −6)","why":"`x^2 - 6x + 8 = (x - 2)(x - 4)`, so `x = 2` is a zero. Every member is at height 0 there, never −6.","_n":"34471","_k":"4708eb62"},{"t":"(4, 0)","why":"`x = 4` is a zero of `x^2 - 6x + 8`, so (4, 0) is on every member.","_n":"354c1","_k":"80f488c4"},{"t":"(0, 12)","why":"`b(0) = (8)(3) = 24`, so `k = 1/2` works.","_n":"364d1","_k":"ad9cc268"},{"t":"(1, −18)","why":"`b(1) = (1 - 6 + 8)(4) = (3)(4) = 12`, so `k = -3/2` works.","_n":"374a1","_k":"d8bd02fc"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A polynomial function of degree 4 is a constant times a product of the factors `(x + 1)` and `(x - 3)` only, each possibly repeated. Its graph \u003cstrong>crosses\u003c/strong> the `x`-axis at both −1 and 3, and it passes through (0, −9). Which statement is true?","options":[{"t":"Exactly two functions fit: `y = 3(x + 1)^3(x - 3)` and `y = (1/3)(x + 1)(x - 3)^3`","why":"Crossing at both means both orders are odd, and they add to 4: orders 3 and 1, or 1 and 3. Each family has one member through (0, −9).","_n":"384b1","_k":"0c462583"},{"t":"Exactly two functions fit: `y = 3(x + 1)^3(x - 3)` and `y = -(x + 1)^2(x - 3)^2`","why":"The second one passes through (0, −9), but its even orders make the graph touch the axis at −1 and 3, not cross. The other answer swaps the odd orders: `(1/3)(x + 1)(x - 3)^3`.","_n":"39501","_k":"9784e1f8"},{"t":"No function fits, because degree 4 needs four different `x`-intercepts","why":"Repeated zeros count by their order. Two zeros with orders 3 and 1 give degree 4.","_n":"3a511","_k":"7e9ced0d"},{"t":"Exactly one function fits: `y = 3(x + 1)^3(x - 3)`","why":"That one works, but so does the family with the orders swapped: (1/3)(1)(−27) = −9.","_n":"3b621","_k":"3cc76890"}]},"b":{"prompt":"A polynomial function of degree 4 is a constant times a product of the factors `(x + 2)` and `(x - 1)` only, each possibly repeated. Its graph \u003cstrong>crosses\u003c/strong> the `x`-axis at both −2 and 1, and it passes through (0, 16). Which statement is true?","options":[{"t":"Exactly two functions fit: `y = -2(x + 2)^3(x - 1)` and `y = -8(x + 2)(x - 1)^3`","why":"Odd orders adding to 4: 3 and 1, or 1 and 3. Each gives one member through (0, 16).","_n":"3c611","_k":"e04cf935"},{"t":"Exactly two functions fit: `y = -2(x + 2)^3(x - 1)` and `y = 4(x + 2)^2(x - 1)^2`","why":"The second one passes through (0, 16), but its even orders make it touch the axis instead of crossing. The other answer is `-8(x + 2)(x - 1)^3`.","_n":"3d601","_k":"eb08caa4"},{"t":"Exactly one function fits: `y = -2(x + 2)^3(x - 1)`","why":"The orders could also be 1 and 3: −8(2)(−1) = 16.","_n":"3e5f0","_k":"a3f9a689"},{"t":"No function fits, because degree 4 needs four different `x`-intercepts","why":"Orders count: 3 + 1 = 4.","_n":"3f5e0","_k":"bc9a5691"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why every member of `y = k(x - 1)(x + 4)`, `k ≠ 0`, has the same `x`-intercepts?","options":[{"t":"“At `x = 1` or `x = -4` one factor is 0, so `y = 0` whatever `k` is. So every member passes through (1, 0) and (−4, 0).”","why":"True, but it only shows why 1 and −4 are shared. It never explains why no member has another `x`-intercept. The best explanation covers both.","_n":"3g5d0","_k":"d5fbfda5"},{"t":"“Because `k` is a vertical stretch, and a vertical stretch doesn’t move any point of a graph.”","why":"A vertical stretch moves every point that isn’t on the `x`-axis. Only points with height 0 stay put.","_n":"3h5c0","_k":"1e25f8fd"},{"t":"“At `x = 1` or `x = -4` one factor is 0, so `y = 0` whatever `k` is. At any other `x`, `k`, `(x - 1)` and `(x + 4)` are all non-zero, so `y` isn’t 0.”","why":"This explains both halves: why these points are on every member, and why no other `x`-intercepts appear.","_n":"3i5b0","_k":"45300e4e"},{"t":"“Because every member is the same function, written in a different way.”","why":"Members with different `k` are different functions: their heights differ everywhere except at the zeros.","_n":"3j5a0","_k":"d9cb8ce9"}]},"b":{"prompt":"Which is the best explanation of why every member of `y = k(x + 2)(x - 5)`, `k ≠ 0`, has the same `x`-intercepts?","options":[{"t":"“Because `k` is a vertical stretch, and a vertical stretch doesn’t move any point of a graph.”","why":"It moves every point off the `x`-axis. Only points with height 0 stay put.","_n":"3k590","_k":"2a32453c"},{"t":"“At `x = -2` or `x = 5` one factor is 0, so `y = 0` whatever `k` is. So every member passes through (−2, 0) and (5, 0).”","why":"True, but it doesn’t explain why there are no other `x`-intercepts.","_n":"3ldc0","_k":"1b22dc2e"},{"t":"“At `x = -2` or `x = 5` one factor is 0, so `y = 0` whatever `k` is. At any other `x`, `k`, `(x + 2)` and `(x - 5)` are all non-zero, so `y` isn’t 0.”","why":"It explains why these intercepts are shared and why there are no others.","_n":"3mdd0","_k":"11ce4783"},{"t":"“Because every member is the same function, written in a different way.”","why":"Different `k`, different heights everywhere except at the zeros.","_n":"3nde0","_k":"cf8173da"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the correct way to write the family of cubic functions with zeros −2, 0 and 5?","options":[{"t":"`y = kx(x + 2)(x - 5)`, `k ∈ ℝ`, `k ≠ 0`","why":"The zero 0 gives the factor `x`, and `k ≠ 0` keeps every member a cubic.","_n":"3odf0","_k":"751b7fbb"},{"t":"`kx(x + 2)(x - 5) = 0`, `k ∈ ℝ`, `k ≠ 0`","why":"That’s an equation whose roots are the zeros. A family of functions is written `y = …`","_n":"3pd80","_k":"958616b9"},{"t":"`y = kx(x + 2)(x - 5)`, `k ∈ ℝ`","why":"This allows `k = 0`, which gives `y = 0`, not a cubic.","_n":"3qd90","_k":"ab596f11"},{"t":"`y = k(x + 2)(x - 5)`, `k ∈ ℝ`, `k ≠ 0`","why":"The zero 0 needs its own factor, `x - 0 = x`. Without it the degree is 2.","_n":"3rda0","_k":"16740cb2"}]},"b":{"prompt":"Which is the correct way to write the family of cubic functions with zeros −3, 0 and 4?","options":[{"t":"`y = kx(x + 3)(x - 4)`, `k ∈ ℝ`, `k ≠ 0`","why":"Factor `x` for the zero 0, and `k ≠ 0`.","_n":"3sdb0","_k":"e7881b63"},{"t":"`y = k(x + 3)(x - 4)`, `k ∈ ℝ`, `k ≠ 0`","why":"The zero 0 is missing.","_n":"3td40","_k":"3e3254c1"},{"t":"`kx(x + 3)(x - 4) = 0`, `k ∈ ℝ`, `k ≠ 0`","why":"That’s an equation, not a function.","_n":"3ud50","_k":"7ca16c69"},{"t":"`y = kx(x + 3)(x - 4)`, `k ∈ ℝ`","why":"`k = 0` must be excluded.","_n":"3vd60","_k":"2a060ad1"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A section of roller coaster track is modelled by `h = kx(x - 20)(x - 50)`, where `h` is the height in metres relative to the loading platform and `x` is the horizontal distance in metres, `0 ≤ x ≤ 50`. At `x = 10` the track is 12 m above the platform. What is its height at `x = 30`?","options":[{"t":"−12 m","why":"The track isn’t symmetric: the dip is a different size from the hill. Work it out from `k`.","_n":"3wd50","_k":"10b79343"},{"t":"18 m","why":"(30 − 50) = −20 makes `b(30)` negative, so the track is below the platform.","_n":"3xd80","_k":"f8f1c9b1"},{"t":"−18 m (18 m below the platform)","why":"`b(10) = 10(-10)(-40) = 4000`, so `k = 12/4000 = 3/1000`. `b(30) = 30(10)(-20) = -6000`, so `h = (3/1000)(-6000) = -18`.","_n":"3yd70","_k":"51702574"},{"t":"−6 m","why":"That leaves out the factor `x` (the zero at 0): `k(x - 20)(x - 50)` gives `k = 3/100` and −6.","_n":"3zda0","_k":"9f547d3a"}]},"b":{"prompt":"A stretch of mountain-bike trail is modelled by `h = kx(x - 30)(x - 60)`, where `h` is the height in metres relative to a bridge deck and `x` is the horizontal distance in metres, `0 ≤ x ≤ 60`. At `x = 10` the trail is 30 m above the deck. What is its height at `x = 40`?","options":[{"t":"24 m","why":"`b(40)` is negative, so the trail is below the deck.","_n":"40d90","_k":"47091515"},{"t":"−30 m","why":"The dip isn’t a mirror image of the hill.","_n":"41dc0","_k":"ab817e86"},{"t":"−6 m","why":"That leaves out the factor `x`.","_n":"42db0","_k":"f32f71c4"},{"t":"−24 m (24 m below the deck)","why":"`b(10) = 10(-20)(-50) = 10 000`, so `k = 3/1000`. `b(40) = 40(10)(-20) = -8000`, so `h = -24`.","_n":"43ce0","_k":"b305a7a0"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A designer needs a cubic with zeros `1 + √3`, `1 - √3` and 4 whose graph passes through (2, 12). Which equation should she use? (Every option passes through (2, 12).)","options":[{"t":"`y = -(x^2 - 2x - 2)(x + 4)`","why":"`(x + 4)` puts the third zero at −4, not 4.","_n":"44cd0","_k":"938855a9"},{"t":"`y = -(3/2)(x^2 - 2x + 4)(x - 4)`","why":"That’s `(x - 1)^2` \u003cstrong>+\u003c/strong> 3. The pair needs `(x - 1)^2 - 3`; `x^2 - 2x + 4` has no real zeros at all.","_n":"45d00","_k":"3bf0aae1"},{"t":"`y = -6(x^2 - 3)(x - 4)`","why":"`x^2 - 3` has zeros ±√3. The 1 in `1 ± √3` is missing.","_n":"46d10","_k":"14048b33"},{"t":"`y = 3(x^2 - 2x - 2)(x - 4)`","why":"`(x - 1 - √3)(x - 1 + √3) = (x - 1)^2 - 3 = x^2 - 2x - 2`. At `x = 2`: 3(−2)(−2) = 12.","_n":"47ce0","_k":"c438ad8c"}]},"b":{"prompt":"A designer needs a cubic with zeros `2 + √5`, `2 - √5` and −1 whose graph passes through (3, 32). Which equation should he use? (Every option passes through (3, 32).)","options":[{"t":"`y = -4(x^2 - 4x - 1)(x - 1)`","why":"`(x - 1)` puts the third zero at 1, not −1.","_n":"48cf0","_k":"ffb13797"},{"t":"`y = (4/3)(x^2 - 4x + 9)(x + 1)`","why":"That’s `(x - 2)^2 + 5`, which has no real zeros.","_n":"49cc0","_k":"3e305e5b"},{"t":"`y = 2(x^2 - 5)(x + 1)`","why":"`x^2 - 5` has zeros ±√5; the 2 is missing.","_n":"4acd0","_k":"75b3ca84"},{"t":"`y = -2(x^2 - 4x - 1)(x + 1)`","why":"`(x - 2)^2 - 5 = x^2 - 4x - 1`. At `x = 3`: −2(−4)(4) = 32.","_n":"4bca0","_k":"9544ad49"}]}}]},"task":{"title":"Bridge the gap","summary":"Bridge the gap","statement":"\u003cp>Design a cubic function whose graph starts on the `x`-axis at (0, 0), comes back to it at (6, 0), passes through the target (3, 27), and \u003cstrong>stays above the `x`-axis everywhere between 0 and 6\u003c/strong>. There’s more than one answer. Every answer belongs to a different family. Can you find three?\u003c/p>\u003cp class=\"tiny muted\">Fill up to three zero slots with whole numbers from −10 to 10 and choose each zero’s order. A zero can’t be entered twice: repeat it with its order chip. Then set `k` as a fraction.\u003c/p>","checks":["Degree 3","Zeros at 0 and 6","Passes through (3, 27)","Stays above the `x`-axis between 0 and 6"],"tips":["Add the orders: right now they total §1. A cubic needs 3.","The graph must meet the `x`-axis at 0 and at 6, so both must be zeros. The zero 0 gives the factor `x`.","Right now your height at `x = 3` is §1. Substitute: 27 = `k × b(3)`, and your `b(3)` is §2.","Your graph is below the axis in the gap. Check the sign of `k`."],"tipInside":"Your zero at §1 is inside the gap, so the graph meets the axis there (it crosses at an odd order and touches at an even order). Where else could the third zero go?","explainPrompt":"Explain why your third zero (or repeated zero) had to go where you put it, and how you found `k`.","vocab":"Use the words family, member, zero, order and k.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Every design you found is in a different family, but all of them share the zeros 0 and 6 and the point (3, 27). The third zero picks the family, and the point picks `k`: with a third zero `r`, `b(3) = 9(r - 3)`, so `k = 3/(r - 3)`. That only stays above the gap when `r` is outside `0 \u003c r \u003c 6`."},"cards":[["Family of polynomial functions","All polynomials with the same zeros and orders: `y = k(x - r_1)(x - r_2)…`, `k ∈ ℝ`, `k ≠ 0`. Each one is a member; the member with `k = 1` is the base member, `b(x)`."],["What `@a{k}` does","Multiplies every height by `k`: a vertical stretch or compression by `|k|`, plus a reflection in the `x`-axis if `k \u003c 0`. The zeros never move."],["Why `k ≠ 0`","`k = 0` gives `y = 0`, which has no degree, so it isn’t a member of the family."],["Zero ↔ factor","A zero `r` gives `(x - r)`: −3 → `(x + 3)`, 0 → `x`. The order is the power on the factor."],["The member through `(x_0, y_0)`","`y_0 = k × b(x_0)`, so `k = y_0 ÷ b(x_0)`. Example: `k(x + 2)(x - 1)(x - 3)` through (2, −12): `b(2) = -4`, so `k = 3`."],["When a point can’t pick a member","If `x_0` is a zero and `y_0 ≠ 0`, no member works. If `y_0 = 0` and `x_0` isn’t a zero, no member works. If `x_0` is a zero and `y_0 = 0`, every member works. Otherwise exactly one member works."],["`y`-intercept of a member","`k × b(0)`. It’s also the constant term of the expanded form."],["Where two members meet","Only at the shared zeros: `k_1 b(x) = k_2 b(x)` with `k_1 ≠ k_2` forces `b(x) = 0`."],["Same zeros, different family","A different order or degree: `(x - 1)^2(x + 2)` and `(x - 1)(x + 2)^2` share zeros but are different families."],["A pair of zeros `p ± √m`","Multiply the pair: `(x - p)^2 - m`. Example: `1 ± √2` → `(x - 1)^2 - 2 = x^2 - 2x - 1`."],["Expanding a member","`k` multiplies every coefficient once: `2(x^3 - 4x^2 + x + 6) = 2x^3 - 8x^2 + 2x + 12`. Never put `k` into every bracket."],["“More than one may fit”","Without the orders, conditions can fit several families. Degree 4, built only from `(x + 1)` and `(x - 3)`, crossing at both, through (0, −9): `y = 3(x + 1)^3(x - 3)` and `y = (1/3)(x + 1)(x - 3)^3`."]]}};</script>
