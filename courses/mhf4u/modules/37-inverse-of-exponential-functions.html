.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 37: radio groups and step sliders (from MHF4U 32), swap machine (ix-), translator (tr-), twin boxes (tw-), task (lw-) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:38px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.wt-sl{margin:0 0 6px}
.wt-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.wt-sl-top label{font-weight:700;font-size:.92rem}
.wt-sl-top output{font:600 1.15rem var(--font-math);color:var(--sc)}
.wt-sl-row{display:flex;align-items:center;gap:8px}
.wt-pm{min-width:40px;min-height:40px;padding:0;font-size:1.25rem;line-height:1}
.wt-sl input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;cursor:pointer}
.wt-sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.wt-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc);margin-top:-8px}
.wt-sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.wt-sl input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc)}
.wt-sl input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.wt-sl input[type=range]:disabled{opacity:.45;cursor:default}

/* hero equation: long, so a little smaller than the toolkit's md size */
.hero .hero-eq.md{font-size:clamp(1.9rem,5vw,3.4rem)}

/* swap machine */
.ix{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px 26px;align-items:start}
.ix-left,.ix-right{min-width:0}
.ix-pv{display:none}
.eq-cap.ix-cap{font-size:clamp(1.3rem,3vw,1.85rem)}
.ix-gwrap canvas.plot:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.ix-keys{margin:6px 0 10px}
.ix-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.ix-base{margin:0 0 8px}
.ix-tog{min-height:36px}
.ix-tog[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ix-swb{min-height:40px;min-width:62px;font-family:var(--font-ui)}
table.vt.ix-t td{padding:4px 10px}
table.vt.ix-t tr.ix-swr td{background:var(--hi-soft)}
table.vt.ix-t tr.ix-swr td:first-child{box-shadow:inset 2px 0 0 var(--hi)}
.ix-v{display:inline-block}
.ix-mk{color:var(--ink-2);margin-left:4px}
.ix-off{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
.ix-tline{margin:8px 0 0;font-size:.95rem}
.ix-rh{margin:16px 0 6px;font-size:.95rem}
.ix-read .read > div{padding:7px 0}
.ix-read dt .m{font-size:1em}
.ix-swipe{background-image:linear-gradient(var(--hi-soft),var(--hi-soft));background-repeat:no-repeat;animation:ix-sw .4s ease-out forwards}
@keyframes ix-sw{from{background-size:0% 100%}to{background-size:100% 100%}}
.ix-locknote{border:1.5px solid var(--hi);background:var(--hi-soft);border-radius:8px;padding:8px 12px;font-size:.95rem}
.ix.ix-swapm .ix-probeonly{display:none}
.ix.ix-probe .ix-swaponly{display:none}
.ix.ix-tc3 .ix-modes,.ix.ix-tc3 .ix-probeonly,.ix.ix-tc3 .ix-swaponly,.ix.ix-tc3 .ix-show{display:none}
@media (max-width:820px){
  .ix{display:flex;flex-direction:column;align-items:stretch;gap:8px}
  .ix-left,.ix-right{display:contents}
  .ix-pv{display:block;order:0}
  .ix-cap{order:1}.ix .banner{order:2}.ix-gwrap{order:3}.ix-tblbox{order:4}.ix-keys{order:5}.ix-ctl{order:6}.ix-read{order:7}
  .ix[data-pv="graph"] .ix-tblbox{display:none}
  .ix[data-pv="table"] .ix-gwrap{display:none}
}

/* translator */
.tr-rounds{margin:0 0 14px}
.tr-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px 26px;align-items:start}
.tr-board{position:relative;min-width:0}
.tr-side{min-width:0}
.tr-h{margin:0 0 4px}
.tr-forms{display:flex;flex-wrap:wrap;gap:12px 16px;margin:10px 0;position:relative}
.tr-form{flex:1 1 auto;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper);min-width:0}
.tr-target{border-color:var(--ink-2)}
.tr-flab{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.tr-st{display:inline-flex;align-items:center;gap:3px;padding:28px 0 24px;font:400 1.45rem var(--font-math);white-space:nowrap}
.tr-sup{position:relative;top:-24px}
.tr-sub{position:relative;top:20px}
.tr-op{margin:0 2px}
.tr-slot{display:inline-flex;align-items:center;justify-content:center;min-width:50px;min-height:48px;border:2px dashed var(--ink-2);border-radius:8px;background:var(--sheet);padding:2px 3px;color:var(--ink);font:inherit;overflow:visible;vertical-align:middle}
button.tr-slot{cursor:pointer}
button.tr-slot:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tr-slot.full{border-color:transparent;background:transparent}
.tr-slot.on .tr-tile{box-shadow:0 0 0 4px var(--hi)}
.tr-sup .tr-slot,.tr-sub .tr-slot{font-size:1.1rem;min-width:44px}
.tr-tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:2px 6px;border:2px solid var(--ink);border-radius:7px;background:var(--sheet);color:var(--ink);line-height:1.1}
.tr-tile small{font:600 .6rem var(--font-ui);color:var(--ink-2);margin-top:2px;letter-spacing:.02em}
.tr-tv .m{font-size:1em}
.tr-r-exp{border-style:dashed}
.tr-r-res{border:4px double var(--ink)}
.tr-moving{position:relative;z-index:3}
.tr-ghost{opacity:.35}
.tr-arrows{position:absolute;left:0;top:0;pointer-events:none;color:var(--ink);z-index:4;overflow:visible}
.tr-after{font-weight:700;margin:10px 0 0}
.tr-task{font-weight:600;margin:6px 0}
.tr-step{margin:12px 0 6px;font-weight:600}
.tr-chips{display:flex;flex-wrap:wrap;gap:8px}
.tr-chips .chip{min-height:40px;font-size:1rem}
.tr-tally{margin:12px 0 0;font-size:.92rem;color:var(--ink-2)}
.tr-gnote{margin:6px 0 0}
@media (max-width:820px){ .tr-grid{grid-template-columns:minmax(0,1fr)} .tr-side{max-width:440px} }
@media (max-width:560px){ .tr-forms{flex-direction:column} .tr-form{flex:1 1 auto} .tr-st{font-size:1.35rem} }

/* twin boxes (Practice 2) */
.tw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:8px 0}
.tw-lab{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tw-in{width:5.2em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:.3em .4em;font:400 1.1rem var(--font-math);text-align:center;min-height:40px}
.tw-in:focus{border-color:var(--ink)}
.tw-in.bad{border-color:var(--red);background:var(--bad-bg)}
.tw-in:disabled{opacity:.85}
.tw-par{font-size:1.4rem}
.tw-gbox{max-width:380px;margin-top:12px}

/* task: land it in the window */
.lw-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:12px 0}
.lw-frac{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.lw-frac select{min-height:40px;min-width:58px;font:600 1.15rem var(--font-math);color:var(--p-b);border:1.5px solid var(--p-b);border-radius:6px;background:var(--sheet);text-align:center}
.lw-bar{display:block;width:100%;height:2px;background:var(--p-b)}
.lw-blab,.lw-clab{font-size:1.25rem}
#lw-c{width:5em}
.eq-cap.lw-cap{font-size:clamp(1.1rem,2.6vw,1.45rem)}
.lw-pv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lw-pv figure{margin:0;min-width:0}
@media (max-width:560px){ .lw-pv{grid-template-columns:minmax(0,1fr)} }

/* sorter tiles: keep each coordinate pair or equation on one line */
#act-curves .tile .m{white-space:nowrap}

x-trig-functions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"25feea2b","content":{"id":"37-inverse-of-exponential-functions","kind":"topic","title":"Inverse of exponential functions","topic":"Inverse of Exponential Functions","readyTopic":"the inverse of exponential functions","hero":{"eq":"`@b{b}^y = x ⟺ y = log_{@b{b}} x`","eqLabel":"b to the power y equals x, which means y equals log base b of x","eqSize":"md","headline":"A logarithm is an exponent","text":"The exponential function `y = @b{b}^x` takes an exponent and gives a power: `2^3 = 8`. Its \u003cstrong>inverse\u003c/strong> runs the other way: give it 8 and it gives back 3. To find the inverse, swap `x` and `y` to get `x = @b{b}^y`, then give the exponent `y` a name: `y =` \u003cstrong>`log_{@b{b}} x`\u003c/strong>, read “log base `@b{b}` of `x`”. On a graph, the inverse is the \u003cstrong>reflection\u003c/strong> of `y = @b{b}^x` in the line `y = x`.","fig":{"aria":"The line y = x, the graph of y = 2 to the x, and its mirror image y = log base 2 of x, with twin points joined across y = x","shape":"square"}},"goals":["I can find the inverse of an exponential function by swapping `x` and `y`, in a table, on a graph and in an equation.","I can explain why the graph of `y = log_{b} x` is the reflection of `y = b^x` in the line `y = x`, and use the reflection to find its key points, asymptote, domain and range.","I can rewrite `b^y = x` as `log_{b} x = y`, and the reverse, including fractional bases and negative or fractional exponents.","I can solve a simple exponential equation by rewriting it in logarithmic form, such as `3^x = 10 ⟹ x = log_{3} 10`, and say which two whole numbers the answer lies between.","I can explain why `log_{b}(b^x) = x` and `b^{log_{b} x} = x`: a function and its inverse undo each other."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Exponent rules","goal":3,"prompt":"Evaluate `2^{-3}`.","options":[{"t":"`-8`","why":"A negative exponent doesn’t make the number negative. It means “one over”: `2^{-3} = 1/2^3 = 1/8`.","_n":"0cfd","_k":"718bc722"},{"t":"`-6`","why":"That’s 2 × (−3). An exponent counts repeated multiplication, and a negative one means divide: 1/(2 × 2 × 2) = 1/8.","_n":"1ced","_k":"06570ae0"},{"t":"`1/8`","why":"A negative exponent means “one over the positive power”: `2^{-3} = 1/2^3 = 1/8`. It’s small, but positive.","_n":"2cdd","_k":"d794c199"},{"t":"`1/6`","why":"That’s 1/(2 × 3). The exponent 3 means 2 × 2 × 2 = 8, so `2^{-3} = 1/8`.","_n":"3d4d","_k":"208d3626"}],"hints":["A negative exponent means “one over the positive power”.","`2^{-3} = 1/2^3`.","`2^3` = 2 × 2 × 2 = 8, so `2^{-3} = 1/8`."]},{"id":"w2","skill":"Exponent rules","goal":3,"prompt":"Evaluate `8^{2/3}`.","options":[{"t":"`2`","why":"2 is `^{3}√8 = 8^{1/3}`. The 2 on top of the exponent then squares it: `2^2 = 4`.","_n":"4d3d","_k":"3eff10f6"},{"t":"`4`","why":"In a fractional exponent, the bottom is a root and the top is a power: `8^{2/3} = (^{3}√8)^2 = 2^2 = 4`.","_n":"5d2d","_k":"243c6c51"},{"t":"`16/3`","why":"That’s 8 × 2/3. A fractional exponent is a root and a power, not a product.","_n":"6d1d","_k":"606e6566"},{"t":"`64`","why":"64 is `8^2`. The 3 under the 2 means take the cube root as well: `(^{3}√8)^2 = 4`.","_n":"7d8d","_k":"4d013bce"}],"hints":["In `a^{m/n}`, the `n` is a root and the `m` is a power.","`8^{2/3} = (^{3}√8)^2`.","`^{3}√8 = 2`, and `2^2 = 4`."]},{"id":"w3","skill":"Inverse functions","goal":1,"prompt":"The point (2, 5) is on the graph of `y = f(x)`. Which point must be on the graph of `y = f^{-1}(x)`?","options":[{"t":"(−2, −5)","why":"(−2, −5) is a half turn about the origin, on `y = -f(-x)`. The inverse swaps the coordinates instead.","_n":"8d7d","_k":"e39f440e"},{"t":"(−2, 5)","why":"(−2, 5) is the reflection in the `y`-axis, which is on `y = f(-x)`. An inverse swaps the coordinates.","_n":"9248","_k":"77abb82a"},{"t":"(2, 1/5)","why":"(2, 1/5) is on `y = 1/f(x)`. The −1 in `f^{-1}` isn’t an exponent; it means “inverse”.","_n":"a258","_k":"d39c59e3"},{"t":"(5, 2)","why":"`f` sends 2 to 5, so `f^{-1}` sends 5 back to 2. Every point `(a, b)` on `f` becomes `(b, a)` on `f^{-1}`.","_n":"b228","_k":"d056f788"}],"hints":["`f(2) = 5`. What does `f^{-1}` do to 5?","`f^{-1}` undoes `f`, so `f^{-1}(5) = 2`.","So (5, 2) is on `y = f^{-1}(x)`: the coordinates swap."]},{"id":"w4","skill":"Inverse functions","goal":1,"prompt":"`f(x) = 3x - 6`. What is `f^{-1}(x)`?","options":[{"t":"`-3x + 6`","why":"That’s `-f(x)`, the reflection in the `x`-axis. Check: `f(4) = 6`, but −3 × 6 + 6 = −12.","_n":"c238","_k":"fa95e81f"},{"t":"`x/3 + 6`","why":"`f` multiplies by 3, then subtracts 6, so `f^{-1}` must add 6 \u003cstrong>first\u003c/strong>, then divide by 3. Check: `f(4) = 6`, but 6/3 + 6 = 8, not 4.","_n":"d208","_k":"87a5da4f"},{"t":"`1/(3x - 6)`","why":"That’s `1/f(x)`. Check: `f(4) = 6`, but 1/(3 × 6 − 6) = 1/12, not 4.","_n":"e218","_k":"ae10173b"},{"t":"`(x + 6)/3`","why":"Swap `x` and `y`: `x = 3y - 6`. Solve: `x + 6 = 3y`, so `y = (x + 6)/3`. Check: `f(4) = 6`, and (6 + 6)/3 = 4.","_n":"f1e8","_k":"f652502e"}],"hints":["Write `y = 3x - 6`, then swap `x` and `y`.","`x = 3y - 6`. Now solve for `y`.","`x + 6 = 3y`, so `y = (x + 6)/3`."]},{"id":"w5","skill":"One-to-one functions","goal":2,"prompt":"For which function is the inverse \u003cstrong>not\u003c/strong> a function?","options":[{"t":"`y = 2x + 1`","why":"A slanted line never repeats an output, so it passes the horizontal line test. Its inverse, `y = (x - 1)/2`, is a function.","_n":"g1f8","_k":"2dd61d5f"},{"t":"`y = 2^x`","why":"`y = 2^x` always increases, so no two inputs give the same output. Its inverse is a function, and it’s the subject of this module.","_n":"h2c8","_k":"251dffd0"},{"t":"`y = x^2`","why":"`x = 2` and `x = -2` both give 4, so the inverse would have to send 4 back to two different numbers. The graph of `y = x^2` fails the horizontal line test.","_n":"i2d8","_k":"a1867ebd"},{"t":"`y = x^3`","why":"`y = x^3` always increases, so each output comes from exactly one input. Its inverse, `y = ^{3}√x`, is a function.","_n":"j9e7","_k":"6d02acc0"}],"hints":["An inverse is a function only if no two inputs give the same output.","Look for two different `x`-values with the same `y`-value: the horizontal line test.","For `y = x^2`, `2^2 = (-2)^2 = 4`. A horizontal line at `y = 4` hits the graph twice, so the inverse isn’t a function."]},{"id":"w6","skill":"Exponential graphs","goal":2,"prompt":"Which statement about the graph of `y = 3^x` is true?","options":[{"t":"It passes through (0, 0) and has the horizontal asymptote `y = 0`.","why":"Any non-zero base to the power 0 is 1: `3^0 = 1`. The graph never touches `y = 0`.","_n":"k9d7","_k":"838cf414"},{"t":"It passes through (0, 1) and has the horizontal asymptote `y = 0`.","why":"`3^0 = 1`, and as `x` goes to −∞ the values 1/3, 1/9, 1/27, … shrink toward 0 without reaching it.","_n":"l9c7","_k":"9c0aa23f"},{"t":"It passes through (0, 1) and has the vertical asymptote `x = 0`.","why":"Near `x = 0` the values of `3^x` stay close to `3^0 = 1`; they don’t shoot off toward ±∞, so `x = 0` isn’t an asymptote. It’s on the far left that the values shrink toward `y = 0`: a horizontal asymptote.","_n":"m9b7","_k":"bca691d8"},{"t":"It passes through (0, 3) and has the horizontal asymptote `y = 0`.","why":"`3^0` is 1, not 3. It’s `3^1` that equals 3, at the point (1, 3).","_n":"na27","_k":"22968b7f"}],"hints":["Find `y` when `x = 0`.","`3^0 = 1`. Now try `x` = −1, −2, −3: `y` = 1/3, 1/9, 1/27.","The values shrink toward 0 but never reach it: the asymptote is `y = 0`. So the graph passes through (0, 1) with asymptote `y = 0`."]}],"refreshers":{"Exponent rules":"A negative exponent means “one over”: `b^{-n} = 1/b^n`, so `2^{-3} = 1/8`, which is positive. A fractional exponent is a root and a power: `b^{m/n} = (^{n}√b)^m`, so `8^{2/3} = (^{3}√8)^2 = 4`. And `b^0 = 1` for any `b ≠ 0`.","Inverse functions":"The inverse `f^{-1}` undoes `f`. If `f(2) = 5`, then `f^{-1}(5) = 2`, so every point `(a, b)` on `f` becomes `(b, a)` on `f^{-1}`, and the graph reflects in the line `y = x`. To find the equation, swap `x` and `y` and solve for `y`: `y = 3x - 6 -> x = 3y - 6 -> y = (x + 6)/3`. Careful: `f^{-1}(x)` is not `1/f(x)`.","One-to-one functions":"An inverse is a function only when every output comes from exactly one input. The horizontal line test checks this. `y = x^2` fails, because 2 and −2 both give 4. `y = 2^x` passes, because it always increases.","Exponential graphs":"For `b > 1`, `y = b^x` passes through (0, 1) because `b^0 = 1`. It rises, and on the left it approaches `y = 0` without touching it: the horizontal asymptote is `y = 0`. Domain `{x ∈ ℝ}`, range `{y ∈ ℝ | y > 0}`. For `0 \u003c b \u003c 1`, such as `y = (1/2)^x`, the graph falls instead, with the same point (0, 1) and the same asymptote."}}},"explore":{"heading":"The swap machine","intro":"Every point on `y = @b{b}^x` has a twin with its coordinates swapped. Swap the table one row at a time, or fold the whole graph across `y = x`, and watch the inverse appear.","predictions":[{"id":"p1","prompt":"The row (3, 8) of `y = 2^x` is about to be swapped. Where will its twin land?","options":[{"t":"(−3, 8)","_n":"oa17","_k":"0bc89355"},{"t":"(−8, −3)","_n":"pa07","_k":"b1ec1a97"},{"t":"(3, 1/8)","_n":"q9f7","_k":"0703cfc0"},{"t":"(8, 3)","_n":"ra67","_k":"44079214"}],"explain":"Swapping the coordinates sends (3, 8) to (8, 3). The segment between them crosses `y = x` at a right angle, exactly at its midpoint (5.5, 5.5), so (8, 3) is the mirror image of (3, 8) in `y = x`. The other options are other moves: (−3, 8) is the reflection in the `y`-axis, (3, 1/8) is the reciprocal `1/2^3`, and (−8, −3) is the reflection in the line `y = -x`."},{"id":"p2","prompt":"On the left, `y = 2^x` gets closer and closer to the line `y = 0`. After the fold across `y = x`, which line will the new graph get closer and closer to?","options":[{"t":"The line `y = x`","_n":"sa57","_k":"9b866c35"},{"t":"The line `x = 1`","_n":"t987","_k":"f1252163"},{"t":"The `x`-axis, `y = 0`","_n":"u997","_k":"966d0b5f"},{"t":"The `y`-axis, `x = 0`","_n":"v9a7","_k":"9a26c2db"}],"explain":"Every point on the line `y = 0` swaps to a point on `x = 0`. The exponential’s points (−3, 1/8), (−2, 1/4), (−1, 1/2) creep toward `y = 0`; their twins (1/8, −3), (1/4, −2), (1/2, −1) creep toward `x = 0`, heading down. So `y = log_{2} x` has the vertical asymptote `x = 0`: as `x -> 0^{+}`, `y -> -∞`."},{"id":"p3","prompt":"Now the base will change to `b = 1/2`. The graph of `y = (1/2)^x` falls from left to right. What will its inverse, `y = log_{1/2} x`, do?","options":[{"t":"It rises from left to right","_n":"w9b7","_k":"f8549dea"},{"t":"It falls from left to right too","_n":"x9c7","_k":"73b75ee3"},{"t":"There’s no inverse, because the base is a fraction","_n":"y9d7","_k":"85121d2e"},{"t":"It is the same graph as `y = log_{2} x`","_n":"z9e7","_k":"e383ff30"}],"explain":"On `y = (1/2)^x`, bigger `x`-values go with smaller `y`-values. The twins pair the same numbers the other way round, so the inverse falls too. In fact `log_{1/2} x = -log_{2} x` for every `x > 0`: for example, `log_{1/2} 8 = -3`, because `(1/2)^{-3} = 8`."},{"id":"p4","prompt":"The base will slide down to `b = 1`. What will the inverse become?","options":[{"t":"The line `y = x`","_n":"109f7","_k":"7ad1b628"},{"t":"The vertical line `x = 1`, which is not a function","_n":"11a07","_k":"5d82e67c"},{"t":"An ordinary log curve, `y = log_{1} x`","_n":"12a17","_k":"2795f359"},{"t":"The horizontal line `y = 1`","_n":"13a28","_k":"d49b42ca"}],"explain":"`1^x = 1` for every `x`, so `y = 1^x` is the flat line `y = 1`. Swapping gives `x = 1`, a vertical line: at `x = 1` there are infinitely many `y`-values, so it isn’t a function. That’s why a logarithm’s base can’t be 1. A negative base fails too: `(-2)^{1/2}` isn’t a real number, so `y = (-2)^x` doesn’t even make a smooth graph."}],"challenges":[{"id":"tc1","goal":[2,3],"prompt":"Fold and probe, with `b = 2`. Move `P` so that its twin `P′` is the point on `y = log_{2} x` with `x`-coordinate 1/8. Then read off `log_{2}(1/8)`.","why":"`2^{-3} = 1/8`, so `P = (-3, 1/8)`, `P′ = (1/8, -3)` and `log_{2}(1/8) = -3`.","hints":["`P′` has `P`’s numbers, swapped. Which point on `y = 2^x` has `y`-coordinate 1/8?","`2^{-1} = 1/2`, `2^{-2} = 1/4`, …","`2^{-3} = 1/8`, so `P = (-3, 1/8)`, `P′ = (1/8, -3)` and `log_{2}(1/8) = -3`."]},{"id":"tc2","goal":[2,3],"prompt":"Choose the base so that the log curve passes through the ringed point (1/16, 2). The ring sits just right of the `y`-axis, where the curves crowd together, so check with numbers, not just your eyes.","why":"`(1/4)^2 = 1/16`, so `log_{1/4}(1/16) = 2`: the curve passes through the ring.","hints":["Translate: the curve passes through (1/16, 2) means `log_{b}(1/16) = 2`.","In exponential form, that’s `b^2 = 1/16`.","`b = 1/4`, because `(1/4)^2 = 1/16`. (−1/4 also squares to 1/16, but a base must be positive.)"]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Commit first. The log curve must pass through the ringed point (8, 3/2). While this challenge is open, the inverse curve is hidden. Set the base, press \u003cstrong>Check challenge\u003c/strong>, and only then does the curve draw.","why":"`4^{3/2} = (√4)^3 = 8`, so `log_{4} 8 = 3/2`: the curve passes through the ring.","hints":["Translate `log_{b} 8 = 3/2` into exponential form.","`b^{3/2} = 8`. Raise both sides to the power 2/3: `b = 8^{2/3}`.","`8^{2/3} = (^{3}√8)^2 = 2^2 = 4`. Check: `4^{3/2} = (√4)^3 = 8`. So `b = 4`."]}],"blocks":[{"title":"What the machine shows","html":"\u003cp>\u003cstrong>The inverse of `y = @b{b}^x`\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Swap:\u003c/strong> `x = @b{b}^y`. \u003cstrong>Name it:\u003c/strong> `y = log_{@b{b}} x`. So `log_{@b{b}} x` is the exponent you put on `@b{b}` to get `x`.\u003c/li>\u003cli>\u003cstrong>Picture:\u003c/strong> the reflection of `y = @b{b}^x` in `y = x`. The key points `(-1, 1/@b{b})`, (0, 1) and `(1, @b{b})` become `(1/@b{b}, -1)`, (1, 0) and `(@b{b}, 1)`; the asymptote `y = 0` becomes `x = 0`; the domain and range swap.\u003c/li>\u003cli>\u003cstrong>Base rules:\u003c/strong> `@b{b} > 0` and `@b{b} ≠ 1`.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"translator","name":"Translator","heading":"The form translator: one fact, two ways to write it","intro":"Every exponential statement has a logarithmic twin. Move the three pieces (base, exponent and result) into their new places, and see the same fact as two mirrored points.","roundA":{"title":"Round A: Watch the tiles","intro":"Press Play or Step. Each fact starts in exponential form; watch where each piece goes.","facts":[{"b":"2","e":"3","r":"8","view":[-4,10]},{"b":"3","e":"−2","r":"1/9","view":[-4,4]},{"b":"25","e":"1/2","r":"5","view":[-4,7]}],"after":"The log’s value is always the exponent."},"roundB":{"title":"Round B: Translate","intro":"Write each fact in the other form. Tap a tile, then a slot. Press Check when all three tiles are placed.","again":"Move the tiles and check again.","all":"None of the pieces is in its place. Start with the base: it stays the base.","items":[{"id":"r1","goal":3,"given":"`2^5 = 32`","build":"`log_{2} 32 = 5`","form":"log","tiles":["2","5","32"],"_a":"SRcEBBYEEFgCGUQAHREQWAMZRBcAEhBYAEg=","view":[-4,34],"pts":[[5,32],[32,5]],"labels":["2^{5} = 32","log_{2} 32 = 5"],"wrong":{"BR":"`log_{32} 2 = 5` would mean `32^5 = 2`. The base of the power, 2, is also the base of the log.","BE":"`log_{5} 32 = 2` would mean `5^2 = 32`, but `5^2 = 25`. The base doesn’t change between the forms: it’s 2 in both.","ER":"`log_{2} 5 = 32` would mean `2^{32} = 5`. The log’s value is the exponent, 5; the result, 32, goes inside the log."},"hints":["Find the base first: it’s the number being raised to a power, or the small number written under “log”. It stays the base.","The log’s value is the exponent, and the number inside the log is the result of the power.","For `2^5 = 32`: base 2, exponent 5, result 32, so the other form is `log_{2} 32 = 5`."]},{"id":"r2","goal":3,"given":"`log_{3} 9 = 2`","build":"`3^2 = 9`","form":"exp","tiles":["3","9","2"],"_a":"SRcEBBYEEFgCGUQAHREQWAAZRBcAEhBYA0g=","view":[-4,11],"pts":[[2,9],[9,2]],"labels":["3^{2} = 9","log_{3} 9 = 2"],"wrong":{"BR":"`9^2 = 3` isn’t true: `9^2 = 81`. The base of the log, 3, is also the base of the power.","BE":"`2^3 = 9` isn’t true: `2^3 = 8`. The base doesn’t change between the forms: it’s 3 in both.","ER":"`3^9 = 2` isn’t true: `3^9` is far bigger than 2. The log’s value, 2, is the exponent; the number inside the log, 9, is the result."},"hints":["Find the base first: it’s the number being raised to a power, or the small number written under “log”. It stays the base.","The log’s value is the exponent, and the number inside the log is the result of the power.","For `log_{3} 9 = 2`: base 3, exponent 2, result 9, so the other form is `3^2 = 9`."]},{"id":"r3","goal":3,"given":"`10^{-2} = 1/100`","build":"`log_{10}(1/100) = -2`","form":"log","tiles":["10","−2","1/100"],"_a":"SRcEBBYEEFgCGUQAHREQWAMZRBcAEhBYAEg=","view":[-4,4],"pts":[[-2,0.01],[0.01,-2]],"labels":["10^{−2} = 1/100","log_{10}(1/100) = −2"],"wrong":{"BR":"`log_{1/100} 10 = -2` would mean `(1/100)^{-2} = 10`, but `(1/100)^{-2} = 10 000`. The base of the power, 10, is also the base of the log.","BE":"`log_{-2}(1/100) = 10` would mean `(-2)^{10} = 1/100`, but `(-2)^{10} = 1024`. The base doesn’t change between the forms: it’s 10 in both.","ER":"`log_{10}(-2) = 1/100` would mean `10^{1/100} = -2`, and a power of 10 is never negative. The log’s value is the exponent, −2; the result, 1/100, goes inside the log."},"note":"Both points hug an axis: (−2, 1/100) sits just above the `x`-axis, and (1/100, −2) sits just right of the `y`-axis.","hints":["Find the base first: it’s the number being raised to a power, or the small number written under “log”. It stays the base.","The log’s value is the exponent, and the number inside the log is the result of the power.","For `10^{-2} = 1/100`: base 10, exponent −2, result 1/100, so the other form is `log_{10}(1/100) = -2`."]},{"id":"r4","goal":3,"given":"`log_{8} 2 = 1/3`","build":"`8^{1/3} = 2`","form":"exp","tiles":["8","2","1/3"],"_a":"SRcEBBYEEFgCGUQAHREQWAAZRBcAEhBYA0g=","view":[-4,4],"pts":[[0.3333333333333333,2],[2,0.3333333333333333]],"labels":["8^{1/3} = 2","log_{8} 2 = 1/3"],"wrong":{"BR":"`2^{1/3} = 8` isn’t true: `2^{1/3} = ^{3}√2`, which is less than 2. The base of the log, 8, is also the base of the power.","BE":"`(1/3)^8 = 2` isn’t true: `(1/3)^8 = 1/6561`. The base doesn’t change between the forms: it’s 8 in both.","ER":"`8^2 = 1/3` isn’t true: `8^2 = 64`. The log’s value, 1/3, is the exponent; the number inside the log, 2, is the result."},"hints":["Find the base first: it’s the number being raised to a power, or the small number written under “log”. It stays the base.","The log’s value is the exponent, and the number inside the log is the result of the power.","For `log_{8} 2 = 1/3`: base 8, exponent 1/3, result 2, so the other form is `8^{1/3} = 2`."]},{"id":"r5","goal":3,"given":"`(1/2)^{-3} = 8`","build":"`log_{1/2} 8 = -3`","form":"log","tiles":["1/2","−3","8"],"_a":"SRcEBBYEEFgCGUQAHREQWAMZRBcAEhBYAEg=","view":[-4,10],"pts":[[-3,8],[8,-3]],"labels":["(1/2)^{−3} = 8","log_{1/2} 8 = −3"],"wrong":{"BR":"`log_{8}(1/2) = -3` would mean `8^{-3} = 1/2`, but `8^{-3} = 1/512`. The base of the power, 1/2, is also the base of the log.","BE":"`log_{-3} 8 = 1/2` would mean `(-3)^{1/2} = 8`, but `(-3)^{1/2}` isn’t a real number. The base doesn’t change between the forms: it’s 1/2 in both.","ER":"`log_{1/2}(-3) = 8` would mean `(1/2)^8 = -3`, and a power of 1/2 is never negative. The log’s value is the exponent, −3; the result, 8, goes inside the log."},"hints":["Find the base first: it’s the number being raised to a power, or the small number written under “log”. It stays the base.","The log’s value is the exponent, and the number inside the log is the result of the power.","For `(1/2)^{-3} = 8`: base 1/2, exponent −3, result 8, so the other form is `log_{1/2} 8 = -3`."]}]},"roundC":{"title":"Round C: Solve by translating","intro":"Two steps each: choose the translated statement, then the answer. The picture draws after step 2.","items":[{"id":"s1","goal":4,"prompt":"Solve `3^x = 10`.","b":3,"kind":"expEq","c":10,"view":[-4,11],"step1":{"q":"Step 1: which statement is the translation?","options":[{"t":"`x = log_{10} 3`","why":"`log_{10} 3` means `10^x = 3`. Your equation has base 3, so the log has base 3.","_n":"14a18","_k":"64659776"},{"t":"`x = 10^3`","why":"`10^3 = 1000`. That makes 10 the base.","_n":"15a48","_k":"391651f6"},{"t":"`x = log_{3} 10`","why":"The base of the power, 3, stays the base of the log.","_n":"16a38","_k":"171cb215"},{"t":"`x = 10/3`","why":"3 × 10/3 = 10, but 3 to the power 10/3 is about 39. Exponents aren’t undone by dividing.","_n":"179e8","_k":"3783cba1"}]},"step2":{"q":"Step 2: between which two whole numbers is `x`?","options":[{"t":"2 and 3","why":"`3^2 = 9 \u003c 10 \u003c 27 = 3^3`, so `log_{3} 10` is between 2 and 3, just above 2. That’s an exact answer: `log_{3} 10` is a number, and module 38 shows how to pin down its decimals.","_n":"189d8","_k":"8a3e6434"},{"t":"1 and 2","why":"`3^1 = 3` and `3^2 = 9` are both less than 10, so `x` is more than 2.","_n":"19a08","_k":"22f12326"},{"t":"3 and 4","why":"`3^3 = 27` is already more than 10, so `x` is less than 3.","_n":"1a9f8","_k":"11371100"},{"t":"9 and 27","why":"9 and 27 are the powers `3^2` and `3^3`. `x` is the exponent, between 2 and 3.","_n":"1baa8","_k":"268e6cec"}]},"hints":["The base of the power stays the base of the log.","`x = log_{3} 10`. Now compare 10 with the powers `3^1`, `3^2`, `3^3`.","`3^2 = 9 \u003c 10 \u003c 27 = 3^3`, so `x = log_{3} 10` is between 2 and 3."]},{"id":"s2","goal":4,"prompt":"Solve `log_{x} 9 = 2`.","b":3,"kind":"base","view":[-4,11],"step1":{"q":"Step 1: which statement is the translation?","options":[{"t":"`x^2 = 9`","why":"In `log_{x} 9 = 2`, the unknown `x` is the base, so `x^2 = 9`.","_n":"1ca98","_k":"8e80ab0e"},{"t":"`9^2 = x`","why":"That makes 9 the base and gives 81.","_n":"1d9c8","_k":"e1aa051c"},{"t":"`x = 9/2`","why":"A log isn’t a division.","_n":"1e9d8","_k":"d6fb151e"},{"t":"`2^x = 9`","why":"That makes 2 the base. In `log_{x} 9 = 2`, the base is the unknown `x`.","_n":"1f9a8","_k":"0fc463f8"}]},"step2":{"q":"Step 2: what is `x`?","options":[{"t":"`x = 81`","why":"`81 = 9^2`. That puts 9 in the base.","_n":"1g9b8","_k":"6b9b8806"},{"t":"`x = 9/2`","why":"`(9/2)^2 = 81/4`, not 9.","_n":"1ha08","_k":"d4618b4b"},{"t":"`x = 3`","why":"`3^2 = 9`, and a base must be positive.","_n":"1ia18","_k":"99311894"},{"t":"`x = -3`","why":"`(-3)^2 = 9` too, but a log’s base must be positive.","_n":"1j9e8","_k":"63da7478"}]},"hints":["In `log_{x} 9 = 2`, the unknown `x` is the base.","So `x^2 = 9`.","`x = 3`, because `3^2 = 9`. (−3 also squares to 9, but a base must be positive.)"]},{"id":"s3","goal":4,"prompt":"Solve `log_{9} x = 3/2`.","b":9,"kind":"logEq","c":1.5,"view":[-4,30],"step1":{"q":"Step 1: which statement is the translation?","options":[{"t":"`x = 9 × 3/2`","why":"A log isn’t a product.","_n":"1k9f8","_k":"1711f14e"},{"t":"`9 = x^{3/2}`","why":"That makes `x` the base. In `log_{9} x`, the unknown is the result.","_n":"1la48","_k":"67e6c66b"},{"t":"`x = 9^{3/2}`","why":"The base of the log, 9, is the base of the power, and the log’s value 3/2 is the exponent.","_n":"1ma58","_k":"9916a2ac"},{"t":"`x = (3/2)^9`","why":"That makes 3/2 the base. The base of the log, 9, is the base of the power.","_n":"1n368","_k":"c5bbe285"}]},"step2":{"q":"Step 2: what is `x`?","options":[{"t":"`x = 27`","why":"`9^{3/2} = (√9)^3 = 3^3 = 27`.","_n":"1o358","_k":"06cca134"},{"t":"`x = 729`","why":"`729 = 9^3`. The 2 under the 3 means a square root as well: `(√9)^3 = 27`.","_n":"1p348","_k":"5511670d"},{"t":"`x = 27/2`","why":"27/2 = 9 × 3/2. The 3/2 is an exponent.","_n":"1q338","_k":"6e18cb43"},{"t":"`x = 3`","why":"`3 = √9 = 9^{1/2}`. The 3 on top of the exponent also cubes it: `(√9)^3 = 27`.","_n":"1r328","_k":"840d3255"}]},"hints":["In `log_{9} x = 3/2`, the base is 9 and the log’s value 3/2 is the exponent.","`x = 9^{3/2} = (√9)^3`.","`√9 = 3` and `3^3 = 27`, so `x = 27`. Check: `9^{3/2} = 27`."]}]},"blocks":[{"html":"\u003cdetails class=\"alg\">\u003csummary>Check it with algebra\u003c/summary>\u003cp style=\"margin:10px 0 6px\">\u003cstrong>What `log_{@b{b}} x` means\u003c/strong>\u003cbr>For `@b{b} > 0` and `@b{b} ≠ 1`: `y = log_{@b{b}} x` means exactly `@b{b}^y = x`.\u003c/p>\u003cul>\u003cli>\u003cstrong>Round trip 1:\u003c/strong> `log_{@b{b}}(@b{b}^x) = x` for every real `x`, because the exponent on `@b{b}` that gives `@b{b}^x` is `x`. Example: `log_{2}(2^5) = 5`.\u003c/li>\u003cli>\u003cstrong>Round trip 2:\u003c/strong> `@b{b}^{log_{b} x} = x` for every `x > 0`, because `log_{@b{b}} x` is the exponent that turns `@b{b}` into `x`. Example: `3^{log_{3} 10} = 10`.\u003c/li>\u003cli>These are `f^{-1}(f(x)) = x` and `f(f^{-1}(x)) = x` for `f(x) = @b{b}^x`: a function and its inverse undo each other. Module 48 shows this for every kind of function.\u003c/li>\u003cli>\u003cstrong>Why `x > 0`:\u003c/strong> `@b{b}^y` is always positive, so `log_{@b{b}} x` exists only for `x > 0`. `log_{2}(-8)` has no real value.\u003c/li>\u003cli>\u003cstrong>Why `@b{b} > 0` and `@b{b} ≠ 1`:\u003c/strong> `1^y = 1` for every `y` (the vertical line from P4), and a negative base such as `(-2)^{1/2}` isn’t real.\u003c/li>\u003c/ul>\u003c/details>"}],"quickCheck":{"title":"Translator quick check","summary":"Translator quick check","items":[{"id":"q1","goal":3,"prompt":"Which is the exponential form of `log_{10} 0.001 = -3`?","choices":[{"t":"`10^{-3} = 0.001`","fb":"Right. The base 10 stays the base, the log’s value −3 is the exponent, and 0.001 is the result.","_n":"1s318","_k":"2c245464"},{"t":"`0.001^{-3} = 10`","fb":"That swaps the base and the result. `0.001^{-3} = 1 000 000 000`.","_n":"1t308","_k":"a04ceb6d"},{"t":"`10^{0.001} = -3`","fb":"That swaps the exponent and the result. A power of 10 is never negative.","_n":"1u2f8","_k":"53f26ef1"},{"t":"`(-3)^{10} = 0.001`","fb":"That makes the log’s value the base. `(-3)^{10} = 59 049`.","_n":"1v2e8","_k":"fed55d6d"}]},{"id":"q2","goal":4,"prompt":"Solve `7^x = 30` exactly. Which answer is right?","choices":[{"t":"`x = 30/7`, between 4 and 5","fb":"Exponents aren’t undone by dividing. `7^{30/7}` is far more than 30.","_n":"1w2d8","_k":"efc33251"},{"t":"`x = log_{7} 30`, between 1 and 2","fb":"Right. In log form, `x = log_{7} 30`. And `7^1 = 7 \u003c 30 \u003c 49 = 7^2`, so `x` is between 1 and 2.","_n":"1x308","_k":"ccbe4f8e"},{"t":"`x = log_{30} 7`, between 0 and 1","fb":"That makes 30 the base: `log_{30} 7` means `30^x = 7`. The base of the power, 7, is the base of the log.","_n":"1y318","_k":"2e668579"},{"t":"`x = log_{7} 30`, between 4 and 5","fb":"The form is right, but the bracket comes from 30 ÷ 7 ≈ 4.3, and a log isn’t a division: `7^4 = 2401`. Compare 30 with `7^1 = 7` and `7^2 = 49`.","_n":"1z328","_k":"f4b7df5d"}]},{"id":"q3","goal":3,"prompt":"`log_{5} x = -2`. What is `x`?","choices":[{"t":"−25","fb":"A negative exponent doesn’t make a negative number: `5^{-2} = 1/5^2 = 1/25`.","_n":"20338","_k":"e5715f5b"},{"t":"−10","fb":"That’s 5 × (−2). The −2 is an exponent, not a multiplier.","_n":"212c8","_k":"b9291f25"},{"t":"1/25","fb":"Right. In exponential form, `x = 5^{-2} = 1/25`.","_n":"222d8","_k":"6eb9e9aa"},{"t":"25","fb":"`5^2 = 25`, but the exponent is −2, so take one over: 1/25.","_n":"232e8","_k":"625fe459"}]},{"id":"q4","goal":5,"prompt":"`f(x) = 2^x`, so `f^{-1}(x) = log_{2} x`. What is `f^{-1}(f(6))`?","choices":[{"t":"6","fb":"Right. `f` turns 6 into `2^6 = 64`, and `f^{-1}` turns 64 back into `log_{2} 64 = 6`. A function and its inverse undo each other.","_n":"242f8","_k":"64c99156"},{"t":"64","fb":"64 is `f(6)`. Then `f^{-1}` undoes it: `log_{2} 64 = 6`.","_n":"25288","_k":"ce22dca2"},{"t":"1/64","fb":"`f^{-1}` isn’t `1/f`. It undoes `f`, so it gives back 6.","_n":"26298","_k":"d9deafa4"},{"t":"`log_{2} 6`","fb":"That’s `f^{-1}(6)`. Here `f` acts first, then `f^{-1}` undoes it.","_n":"271a9","_k":"2399ad53"}]}]}},"practice":{"activities":[{"id":"curves","type":"sorter","title":"Which curve is it on?","summary":"Which curve is it on?","goal":[3,1,2],"noun":"point","instruction":"Sort each point into the box of the log curve it lies on.","how":"Tap a point, then tap the box it belongs in. For a mirror image, swap the coordinates first.","boxes":[{"id":"b2","label":"`y = log_{2} x`","icon":"\u003csvg width=\"72\" height=\"50\" viewBox=\"0 0 72 50\" aria-hidden=\"true\" style=\"flex:0 0 auto\">\u003cpath d=\"M2 26H71M10 1V49\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".55\" fill=\"none\"/>\u003cpath d=\"M10.3 49.0L10.3 48.4L10.3 47.8L10.4 47.3L10.4 46.7L10.4 46.1L10.5 45.5L10.5 45.0L10.5 44.4L10.6 43.8L10.6 43.3L10.7 42.7L10.8 42.1L10.8 41.5L10.9 41.0L11.0 40.4L11.0 39.8L11.1 39.2L11.2 38.6L11.3 38.1L11.4 37.5L11.5 36.9L11.7 36.4L11.8 35.8L12.0 35.2L12.1 34.6L12.3 34.0L12.5 33.5L12.7 32.9L12.9 32.3L13.2 31.7L13.4 31.2L13.7 30.6L14.0 30.0L14.3 29.5L14.7 28.9L15.1 28.3L15.5 27.7L16.0 27.2L16.5 26.6L17.0 26.0L17.6 25.4L18.2 24.8L18.9 24.3L19.6 23.7L20.4 23.1L21.3 22.5L22.2 22.0L23.2 21.4L24.3 20.8L25.5 20.3L26.8 19.7L28.2 19.1L29.7 18.5L31.4 18.0L33.1 17.4L35.1 16.8L37.1 16.2L39.4 15.7L41.8 15.1L44.5 14.5L47.3 13.9L50.4 13.3L53.8 12.8L57.4 12.2L61.4 11.6L65.6 11.1L70.2 10.5\" fill=\"none\" stroke=\"var(--f3)\" stroke-width=\"2.2\"/>\u003ccircle cx=\"17\" cy=\"26\" r=\"2.4\" fill=\"var(--f3)\"/>\u003ccircle cx=\"24\" cy=\"21\"
