ans `1/b^3 = 1/8`, so `b^3 = 8`.","`b = 2`, because `2^{-3} = 1/8`. The point is on `y = log_{2} x`."]},{"id":"i2","t":"\u003cspan aria-hidden=\"true\">the point `(√2, 1/2)`\u003c/span>\u003cspan class=\"vh\">the point square root of 2, one half\u003c/span>","_a":"EFdURw==","why":"`2^{1/2} = √2`, so `log_{2} √2 = 1/2`.","wrong":{"b4":"Right sign, wrong size. On `y = log_{4} x`, the point with `x = √2` has height 1/4, not 1/2. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`.","bh":"Right size, wrong sign. On `y = log_{1/2} x`, the point with `x = √2` has height −1/2, not 1/2. A base and its reciprocal give opposite logs.","bq":"Check the sign and the size. On `y = log_{1/4} x`, the point with `x = √2` has height −1/4, not 1/2."},"hints":["Write the point as a statement: which base `b` makes `b^{1/2} = √2`?","`b^{1/2}` means `√b`. So `√b = √2`.","`b = 2`, because `2^{1/2} = √2`. The point is on `y = log_{2} x`."]},{"id":"i3","t":"\u003cspan aria-hidden=\"true\">the mirror image of `(6, 64)` in `y = x`\u003c/span>\u003cspan class=\"vh\">the mirror image of 6, 64 in the line y equals x\u003c/span>","_a":"EFdURw==","why":"The mirror image is (64, 6), and `2^6 = 64`.","wrong":{"b4":"Right sign, wrong size. On `y = log_{4} x`, the point with `x = 64` has height 3, not 6. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`.","bh":"Right size, wrong sign. On `y = log_{1/2} x`, the point with `x = 64` has height −6, not 6. A base and its reciprocal give opposite logs.","bq":"Check the sign and the size. On `y = log_{1/4} x`, the point with `x = 64` has height −3, not 6."},"hints":["First swap the coordinates: the mirror image is (64, 6). Which base `b` makes `b^6 = 64`?","64 = 2 × 2 × 2 × 2 × 2 × 2.","`b = 2`, because `2^6 = 64`. The point is on `y = log_{2} x`."]},{"id":"i4","t":"\u003cspan aria-hidden=\"true\">the point `(2, 1/2)`\u003c/span>\u003cspan class=\"vh\">the point 2, one half\u003c/span>","_a":"EFdSRw==","why":"`4^{1/2} = √4 = 2`, so `log_{4} 2 = 1/2`.","wrong":{"b2":"Right sign, wrong size. On `y = log_{2} x`, the point with `x = 2` has height 1, not 1/2. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`.","bh":"Check the sign and the size. On `y = log_{1/2} x`, the point with `x = 2` has height −1, not 1/2.","bq":"Right size, wrong sign. On `y = log_{1/4} x`, the point with `x = 2` has height −1/2, not 1/2. A base and its reciprocal give opposite logs."},"hints":["Write the point as a statement: which base `b` makes `b^{1/2} = 2`?","`b^{1/2}` means `√b`. So `√b = 2`.","`b = 4`, because `4^{1/2} = √4 = 2`. The point is on `y = log_{4} x`."]},{"id":"i5","t":"\u003cspan aria-hidden=\"true\">the mirror image of `(-3, 1/64)` in `y = x`\u003c/span>\u003cspan class=\"vh\">the mirror image of negative 3, one sixty-fourth in the line y equals x\u003c/span>","_a":"EFdSRw==","why":"The mirror image is (1/64, −3), and `4^{-3} = 1/64`.","wrong":{"b2":"Right sign, wrong size. On `y = log_{2} x`, the point with `x = 1/64` has height −6, not −3. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`.","bh":"Check the sign and the size. On `y = log_{1/2} x`, the point with `x = 1/64` has height 6, not −3.","bq":"Right size, wrong sign. On `y = log_{1/4} x`, the point with `x = 1/64` has height 3, not −3. A base and its reciprocal give opposite logs."},"hints":["First swap the coordinates: the mirror image is (1/64, −3). Which base `b` makes `b^{-3} = 1/64`?","`b^{-3} = 1/64` means `1/b^3 = 1/64`, so `b^3 = 64`.","`b = 4`, because `4^{-3} = 1/64`. The point is on `y = log_{4} x`."]},{"id":"i6","t":"\u003cspan aria-hidden=\"true\">the point `(1/8, -3/2)`\u003c/span>\u003cspan class=\"vh\">the point one eighth, negative three halves\u003c/span>","_a":"EFdSRw==","why":"`4^{-3/2} = 1/(√4)^3 = 1/2^3 = 1/8`, so `log_{4}(1/8) = -3/2`.","wrong":{"b2":"Right sign, wrong size. On `y = log_{2} x`, the point with `x = 1/8` has height −3, not −3/2. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`.","bh":"Check the sign and the size. On `y = log_{1/2} x`, the point with `x = 1/8` has height 3, not −3/2.","bq":"Right size, wrong sign. On `y = log_{1/4} x`, the point with `x = 1/8` has height 3/2, not −3/2. A base and its reciprocal give opposite logs."},"hints":["Write the point as a statement: which base `b` makes `b^{-3/2} = 1/8`?","`b^{-3/2} = 1/8` means `(√b)^3 = 8`, so `√b = 2`.","`b = 4`, because `4^{-3/2} = 1/(√4)^3 = 1/8`. The point is on `y = log_{4} x`."]},{"id":"i7","t":"\u003cspan aria-hidden=\"true\">the point `(8, -3)`\u003c/span>\u003cspan class=\"vh\">the point 8, negative 3\u003c/span>","_a":"EFcORw==","why":"`(1/2)^{-3} = 2^3 = 8`, so `log_{1/2} 8 = -3`.","wrong":{"b2":"Right size, wrong sign. On `y = log_{2} x`, the point with `x = 8` has height 3, not −3. A base and its reciprocal give opposite logs.","b4":"Check the sign and the size. On `y = log_{4} x`, the point with `x = 8` has height 3/2, not −3.","bq":"Right sign, wrong size. On `y = log_{1/4} x`, the point with `x = 8` has height −3/2, not −3. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`."},"hints":["Write the point as a statement: which base `b` makes `b^{-3} = 8`?","`b^{-3} = 8` means `1/b^3 = 8`, so `b^3 = 1/8`.","`b = 1/2`, because `(1/2)^{-3} = 2^3 = 8`. The point is on `y = log_{1/2} x`."]},{"id":"i8","t":"\u003cspan aria-hidden=\"true\">the point `(1/4, 2)`\u003c/span>\u003cspan class=\"vh\">the point one quarter, 2\u003c/span>","_a":"EFcORw==","why":"`(1/2)^2 = 1/4`, so `log_{1/2}(1/4) = 2`.","wrong":{"b2":"Right size, wrong sign. On `y = log_{2} x`, the point with `x = 1/4` has height −2, not 2. A base and its reciprocal give opposite logs.","b4":"Check the sign and the size. On `y = log_{4} x`, the point with `x = 1/4` has height −1, not 2.","bq":"Right sign, wrong size. On `y = log_{1/4} x`, the point with `x = 1/4` has height 1, not 2. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`."},"hints":["Write the point as a statement: which base `b` makes `b^2 = 1/4`?","`b^2 = 1/4`, and a base must be positive.","`b = 1/2`, because `(1/2)^2 = 1/4`. The point is on `y = log_{1/2} x`."]},{"id":"i9","t":"\u003cspan aria-hidden=\"true\">the mirror image of `(-5, 32)` in `y = x`\u003c/span>\u003cspan class=\"vh\">the mirror image of negative 5, 32 in the line y equals x\u003c/span>","_a":"EFcORw==","why":"The mirror image is (32, −5), and `(1/2)^{-5} = 2^5 = 32`.","wrong":{"b2":"Right size, wrong sign. On `y = log_{2} x`, the point with `x = 32` has height 5, not −5. A base and its reciprocal give opposite logs.","b4":"Check the sign and the size. On `y = log_{4} x`, the point with `x = 32` has height 5/2, not −5.","bq":"Right sign, wrong size. On `y = log_{1/4} x`, the point with `x = 32` has height −5/2, not −5. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`."},"hints":["First swap the coordinates: the mirror image is (32, −5). Which base `b` makes `b^{-5} = 32`?","`b^{-5} = 32` means `1/b^5 = 32`, so `b^5 = 1/32`.","`b = 1/2`, because `(1/2)^{-5} = 2^5 = 32`. The point is on `y = log_{1/2} x`."]},{"id":"i10","t":"\u003cspan aria-hidden=\"true\">the point `(2, -1/2)`\u003c/span>\u003cspan class=\"vh\">the point 2, negative one half\u003c/span>","_a":"EFcXRw==","why":"`(1/4)^{-1/2} = 4^{1/2} = 2`, so `log_{1/4} 2 = -1/2`.","wrong":{"b2":"Check the sign and the size. On `y = log_{2} x`, the point with `x = 2` has height 1, not −1/2.","b4":"Right size, wrong sign. On `y = log_{4} x`, the point with `x = 2` has height 1/2, not −1/2. A base and its reciprocal give opposite logs.","bh":"Right sign, wrong size. On `y = log_{1/2} x`, the point with `x = 2` has height −1, not −1/2. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`."},"hints":["Write the point as a statement: which base `b` makes `b^{-1/2} = 2`?","`b^{-1/2} = 2` means `1/√b = 2`, so `√b = 1/2`.","`b = 1/4`, because `(1/4)^{-1/2} = 4^{1/2} = 2`. The point is on `y = log_{1/4} x`."]},{"id":"i11","t":"\u003cspan aria-hidden=\"true\">the point `(1/64, 3)`\u003c/span>\u003cspan class=\"vh\">the point one sixty-fourth, 3\u003c/span>","_a":"EFcXRw==","why":"`(1/4)^3 = 1/64`, so `log_{1/4}(1/64) = 3`.","wrong":{"b2":"Check the sign and the size. On `y = log_{2} x`, the point with `x = 1/64` has height −6, not 3.","b4":"Right size, wrong sign. On `y = log_{4} x`, the point with `x = 1/64` has height −3, not 3. A base and its reciprocal give opposite logs.","bh":"Right sign, wrong size. On `y = log_{1/2} x`, the point with `x = 1/64` has height 6, not 3. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`."},"hints":["Write the point as a statement: which base `b` makes `b^3 = 1/64`?","`b^3 = 1/64`. Which number cubes to 64?","`b = 1/4`, because `(1/4)^3 = 1/64`. The point is on `y = log_{1/4} x`."]},{"id":"i12","t":"\u003cspan aria-hidden=\"true\">the mirror image of `(-2, 16)` in `y = x`\u003c/span>\u003cspan class=\"vh\">the mirror image of negative 2, 16 in the line y equals x\u003c/span>","_a":"EFcXRw==","why":"The mirror image is (16, −2), and `(1/4)^{-2} = 4^2 = 16`.","wrong":{"b2":"Check the sign and the size. On `y = log_{2} x`, the point with `x = 16` has height 4, not −2.","b4":"Right size, wrong sign. On `y = log_{4} x`, the point with `x = 16` has height 2, not −2. A base and its reciprocal give opposite logs.","bh":"Right sign, wrong size. On `y = log_{1/2} x`, the point with `x = 16` has height −4, not −2. Base 4 is 2² (and 1/4 is (1/2)²), so it reaches the same number with half the exponent: `4^{3/2} = 2^3 = 8`."},"hints":["First swap the coordinates: the mirror image is (16, −2). Which base `b` makes `b^{-2} = 16`?","`b^{-2} = 16` means `1/b^2 = 16`, so `b^2 = 1/16`.","`b = 1/4`, because `(1/4)^{-2} = 4^2 = 16`. The point is on `y = log_{1/4} x`."]}]},{"id":"twins","type":"custom","title":"Translate, solve, work backwards","summary":"Translate, solve, work backwards","star":true,"goal":[3,4,1,5],"instruction":"Find each value. Type a whole number or a fraction, such as −5 or 2/7, then press Check.","how":"Fractions go in as top/bottom. After each check, the mini-graph shows the twin points your answer makes.","fallback":"Not this one. Write the statement in the other form, then check your answer by putting it back in.","items":[{"id":"n1","goal":4,"prompt":"Solve `(1/5)^x = 40`. `x` lies between two whole numbers next to each other. Type the smaller one, then the larger one.","boxes":[{"id":"lo","label":"Smaller"},{"id":"hi","label":"Larger"}],"_a":"SRcKCkdbH1EeFw4MR1sfUE8=","right":"✓ Correct. `x = log_{1/5} 40`. `(1/5)^{-2} = 25 \u003c 40 \u003c 125 = (1/5)^{-3}`, so `x` is between −3 and −2.","wrong":[{"match":{"lo":2,"hi":3},"fb":"`(1/5)^2 = 1/25` and `(1/5)^3 = 1/125` are both less than 1. To make 40 from a base below 1, the exponent must be negative."},{"match":{"lo":-2,"hi":-1},"fb":"`(1/5)^{-2} = 5^2 = 25` is still less than 40. Should `x` be above or below −2?"},{"match":{"lo":25,"hi":125},"fb":"25 and 125 are the powers `5^2` and `5^3`. `x` is the exponent."},{"match":{"lo":200,"hi":201},"fb":"That’s 40 ÷ 1/5. Exponents aren’t undone by dividing."}],"hints":["Write it in log form, then compare 40 with powers of 1/5.","`(1/5)^x = 5^{-x}`. Which powers of 5 sit just below and just above 40?","`5^2 = 25 \u003c 40 \u003c 125 = 5^3`, so `-x` is between 2 and 3, and `x = log_{1/5} 40` is between −3 and −2."]},{"id":"n2","goal":3,"prompt":"`log_{3} x = -4`. Find `x`.","boxes":[{"id":"v","label":"`x =`"}],"_a":"SRcQR19RHFIDB1VRUFcFWwIEVFZRVARVCkg=","display":"`x = 1/81`","wrong":[{"match":{"v":-81},"fb":"A negative exponent doesn’t make a negative number. What does a negative exponent mean?"},{"match":{"v":-12},"fb":"That’s 3 × (−4). The −4 is an exponent."},{"match":{"v":81},"fb":"`3^4 = 81`, but the exponent is −4."}],"hints":["Write it in exponential form.","`x = 3^{-4}`. A negative exponent means “one over”.","`x = 3^{-4} = 1/3^4 = 1/81`. Check: `log_{3}(1/81) = -4`, because `3^{-4} = 1/81`."]},{"id":"n3","goal":3,"prompt":"`log_{b} 32 = 5/2`. Find `b`.","boxes":[{"id":"v","label":"`b =`"}],"_a":"SRcQR19VTw==","display":"`b = 4`","wrong":[{"match":{"v":2},"fb":"`2^5 = 32` uses the exponent 5, not 5/2."},{"match":{"v":12.8},"fb":"That’s 32 ÷ 5/2. Dividing doesn’t undo an exponent."},{"match":{"v":80},"fb":"That’s 32 × 5/2."}],"hints":["Write it in exponential form.","`b^{5/2} = 32`. Raise both sides to the power 2/5.","`b = 32^{2/5} = (^{5}√32)^2 = 2^2 = 4`. Check: `4^{5/2} = (√4)^5 = 32`."]},{"id":"n4","goal":[1,3],"prompt":"The graph of `y = b^x` passes through (3, 1/27). Its inverse passes through `(k, -2)`. Find `k`.","boxes":[{"id":"v","label":"`k =`"}],"_a":"SRcQR19YTw==","display":"`k = 9`","wrong":[{"match":{"v":0.1111111111111111},"fb":"1/9 is `(1/3)^2` or `3^{-2}`. Check both steps: which `b` makes `b^3 = 1/27`? Then the inverse’s point `(k, -2)` means `k` = `b` to the power −2, not 2."},{"match":{"v":-9},"fb":"A negative exponent doesn’t make `k` negative."}],"hints":["First find the base: which `b` makes `b^3 = 1/27`?","`b = 1/3`, because `(1/3)^3 = 1/27`. The inverse is `y = log_{1/3} x`, so `(k, -2)` means `k = (1/3)^{-2}`.","`k = (1/3)^{-2} = 3^2 = 9`. Check: (−2, 9) is on `y = (1/3)^x`, and its twin is (9, −2)."]},{"id":"n5","goal":3,"prompt":"`log_{2}(log_{4} x) = -1`. Find `x`.","boxes":[{"id":"v","label":"`x =`"}],"_a":"SRcQR19TTw==","display":"`x = 2`","wrong":[{"match":{"v":0.5},"fb":"1/2 is the value of `log_{4} x`, not `x`. Translate once more."},{"match":{"v":0.0625},"fb":"`log_{2} u = -1` means `u = 2^{-1}`, not −2. Redo the inside step."}],"hints":["Work from the outside in. Call the inside `u = log_{4} x`, so `log_{2} u = -1`.","`log_{2} u = -1` means `u = 2^{-1} = 1/2`. So `log_{4} x = 1/2`.","`x = 4^{1/2} = 2`. Check: `log_{4} 2 = 1/2`, and `log_{2}(1/2) = -1`."]},{"id":"n6","goal":[1,5],"prompt":"`f(x) = 2^x + 3`. Find `k` so that `f^{-1}(k) = 5`.","boxes":[{"id":"v","label":"`k =`"}],"_a":"SRcQR19SBx8=","right":"✓ Correct. `f^{-1}(k) = 5` means `(k, 5)` is on `f^{-1}`, so its twin `(5, k)` is on `f`: `k = f(5) = 2^5 + 3 = 35`.","wrong":[{"match":{"v":32},"fb":"`2^5 = 32`, but `f` also adds 3."},{"match":{"v":29},"fb":"`f` adds 3; it doesn’t subtract it."},{"match":{"v":13},"fb":"That’s 2 × 5 + 3. `2^x` is a power, not 2 times `x`."}],"hints":["`f^{-1}(k) = 5` means `f(5) = k`: the twin of `(k, 5)` is `(5, k)`.","So `k = f(5) = 2^5 + 3`.","`k` = 32 + 3 = 35. Check: `f(5) = 35`, so `f^{-1}(35) = 5`."]},{"id":"n7","goal":[1,5],"prompt":"`f(x) = 2^x - 3`. Find `f^{-1}(61)`.","boxes":[{"id":"v","label":"`f^{-1}(61) =`"}],"_a":"SRcQR19XTw==","display":"`f^{-1}(61) = 6`","wrong":[{"match":{"v":64},"fb":"`2^x = 64` is right, but the answer is the exponent `x`."},{"match":{"v":32},"fb":"That’s 64 ÷ 2. The answer is the exponent that turns 2 into 64."}],"hints":["`f^{-1}(61)` is the `x` that makes `f(x) = 61`.","`2^x - 3 = 61`, so `2^x = 64`.","`2^6 = 64`, so `x = 6` and `f^{-1}(61) = 6`. Check: `f(6)` = 64 − 3 = 61."]},{"id":"n8","goal":1,"prompt":"The graphs of `y = (1/16)^x` and its inverse `y = log_{1/16} x` both pass through (1/4, 1/2), which is \u003cstrong>not\u003c/strong> on the line `y = x`. Find another point on \u003cstrong>both\u003c/strong> graphs that is not on `y = x`.","boxes":[{"id":"x","label":"`x`"},{"id":"y","label":"`y`"}],"point":true,"_a":"SRceR19RHFceFx9HX1EcUAdI","right":"✓ Correct. `(1/16)^{1/2} = 1/4`, and `log_{1/16}(1/2) = 1/4` because `(1/16)^{1/4} = 1/2`. Reflecting in `y = x` swaps the two graphs, so the mirror image of a shared point is also shared. These two graphs meet three times: at (1/4, 1/2), at (1/2, 1/4), and once on `y = x`, near (0.36, 0.36). A falling exponential can meet its inverse away from `y = x`; a rising one can’t.","wrong":[{"match":{"x":0.25,"y":0.5},"fb":"That’s the point you were given."},{"match":{"x":0.5,"y":0.5},"fb":"(1/2, 1/2) is on the line `y = x`, which the question rules out. Test your point in `y = (1/16)^x` before you check."},{"match":{"x":-0.25,"y":-0.5},"fb":"That’s a half turn about the origin, not a reflection in `y = x`. `(1/16)^{-1/4} = 2`."}],"hints":["Reflecting in `y = x` sends `y = (1/16)^x` onto its inverse, and the inverse back onto `y = (1/16)^x`. What does it do to a point that’s on both?","The mirror image of (1/4, 1/2) is (1/2, 1/4). Test it on `y = (1/16)^x`.","`(1/16)^{1/2} = 1/4`, and `log_{1/16}(1/2) = 1/4` because `(1/16)^{1/4} = 1/2`. So (1/2, 1/4) is on both graphs."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Maya","how":"","instruction":"Maya made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the inverse of `y = 3^x`, then find the point on the inverse with `x = 9`.","steps":["Swap `x` and `y`: `x = 3^y`.","In `x = 3^y`, the base is 3, the exponent is `y` and the result is `x`.","In log form: `y = log_{x} 3`.","At `x = 9`: `y = log_{9} 3 = 1/2`, because `9^{1/2} = 3`. So the point is (9, 1/2)."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: Maya named the pieces properly. Keep checking.","","Step 4 evaluates step 3’s equation correctly. The mistake is earlier."],"fixes":[{"t":"`y = log_{3} x`, so at `x = 9`, `y = 3^9`.","why":"The equation is right now, but `log_{3} 9` asks “what exponent on 3 gives 9?”. The answer is 2, not `3^9`.","_n":"28199","_k":"2138045c"},{"t":"Step 3 is correct as written.","why":"`log_{x} 3` makes `x` the base. In `x = 3^y` the base is 3, so the log must be `log_{3} x`.","_n":"291c9","_k":"9c2951db"},{"t":"The base stays the base: `y = log_{3} x`. At `x = 9`, `y = log_{3} 9 = 2`, so the point is (9, 2).","why":"Check: (2, 9) is on `y = 3^x`, and its twin is (9, 2).","_n":"2a1b9","_k":"4bf11459"},{"t":"The inverse is `y = 1/3^x`, so at `x = 9`, `y = 1/3^9`.","why":"`1/3^x` is the reciprocal, not the inverse. The inverse undoes `3^x`.","_n":"2b1e9","_k":"8e8e65d2"}],"hints":["In step 2, Maya named the base. Is it still the base in step 3?","`x = 3^y` has base 3, so the log form is `y = log_{3} x`.","Step 3 is wrong. The inverse is `y = log_{3} x`, and at `x = 9`, `y = log_{3} 9 = 2`: the point (9, 2)."]},{"id":"e2","goal":1,"task":"Find `f^{-1}(x)` for `f(x) = 2^x - 3`, then find `f^{-1}(5)`.","steps":["Write `y = 2^x - 3` and swap `x` and `y`: `x = 2^y - 3`.","Write this in log form: `y = log_{2} x - 3`.","So `f^{-1}(x) = log_{2} x - 3`.","`f^{-1}(5) = log_{2} 5 - 3`."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 copies step 2. The mistake is earlier.","Step 4 uses step 3’s formula correctly. The mistake is earlier."],"fixes":[{"t":"First isolate the power: `2^y = x + 3`. Then `y = log_{2}(x + 3)`, and `f^{-1}(5) = log_{2} 8 = 3`.","why":"Check: `f(3) = 2^3 - 3 = 5`, so `f^{-1}(5) = 3`.","_n":"2c1d9","_k":"f6746a31"},{"t":"Step 2 is correct as written.","why":"Check: `f(3) = 5`, so `f^{-1}(5)` should be 3. But `log_{2} 5 - 3` is negative, because `log_{2} 5` is less than 3 (`2^3 = 8 > 5`).","_n":"2d209","_k":"0fe3bce4"},{"t":"First isolate the power: `2^y = x - 3`, so `y = log_{2}(x - 3)`.","why":"To undo “− 3”, add 3 to both sides: `2^y = x + 3`.","_n":"2e1f9","_k":"5a50d386"},{"t":"Translate first, then move the 3 across: `y = log_{2} x + 3`.","why":"Only `b^y = (something)` can be rewritten as a log, so the 3 must move \u003cstrong>before\u003c/strong> you translate, and it ends up inside the log.","_n":"2f229","_k":"986e4264"}],"hints":["Before you rewrite a statement as a log, what must it look like?","It must be `b^y = (something)`. From `x = 2^y - 3`, first add 3 to both sides.","Step 2 is wrong. `2^y = x + 3`, so `f^{-1}(x) = log_{2}(x + 3)` and `f^{-1}(5) = log_{2} 8 = 3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you swapped the table or folded the graph in Explore?"},{"id":"j2","q":"In your own words, what does `log_{2} 8 = 3` mean? Use the word exponent."},{"id":"j3","q":"Explain to a friend how to solve `5^x = 40` by rewriting it in log form, and how to tell which two whole numbers the answer lies between."},{"id":"j4","q":"Which still trips you up: putting the pieces in the right places when you convert, or picturing the reflection? What will you do about it before module 38?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":3,"a":{"prompt":"Which is the logarithmic form of `3^4 = 81`?","options":[{"t":"`log_{81} 3 = 4`","why":"That swaps the base and the result. It would mean `81^4 = 3`.","_n":"2g219","_k":"4ace82ee"},{"t":"`log_{3} 4 = 81`","why":"That swaps the exponent and the result. It would mean `3^{81} = 4`.","_n":"2h349","_k":"14d7524f"},{"t":"`log_{3} 81 = 4`","why":"The base stays the base (3), the exponent (4) becomes the value of the log, and the result (81) goes inside the log.","_n":"2i359","_k":"270e6fc4"},{"t":"`log_{4} 81 = 3`","why":"That makes the exponent the base. It would mean `4^3 = 81`, but `4^3 = 64`.","_n":"2j329","_k":"9d61d7cf"}]},"b":{"prompt":"Which is the logarithmic form of `4^3 = 64`?","options":[{"t":"`log_{4} 64 = 3`","why":"The base stays the base (4), the exponent (3) becomes the value of the log, and the result (64) goes inside the log.","_n":"2k339","_k":"d609718c"},{"t":"`log_{64} 4 = 3`","why":"That swaps the base and the result. It would mean `64^3 = 4`.","_n":"2l309","_k":"d36c7c2f"},{"t":"`log_{3} 64 = 4`","why":"That makes the exponent the base. It would mean `3^4 = 64`, but `3^4 = 81`.","_n":"2m319","_k":"0968b4b7"},{"t":"`log_{4} 3 = 64`","why":"That swaps the exponent and the result. It would mean `4^{64} = 3`.","_n":"2n2e9","_k":"3619e21b"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"The point (2, 9) is on the graph of `y = 3^x`. Which point is on the graph of its inverse?","options":[{"t":"(2, 1/9)","why":"That’s on the reciprocal `y = 1/3^x`. The inverse swaps the coordinates instead.","_n":"2o2f9","_k":"a7d051f1"},{"t":"(9, 2)","why":"The inverse swaps the coordinates: `log_{3} 9 = 2`.","_n":"2p2c9","_k":"76728300"},{"t":"(2, −9)","why":"That’s the reflection in the `x`-axis, on `y = -3^x`.","_n":"2q2d9","_k":"565d5ac5"},{"t":"(−2, 9)","why":"That’s the reflection in the `y`-axis. It’s on `y = 3^{-x} = (1/3)^x`, not on the inverse.","_n":"2re8f","_k":"e4aa77de"}]},"b":{"prompt":"The point (−1, 1/5) is on the graph of `y = 5^x`. Which point is on the graph of its inverse?","options":[{"t":"(−1, 5)","why":"That’s on the reciprocal `y = 1/5^x`.","_n":"2se9f","_k":"25399ca2"},{"t":"(1, 1/5)","why":"That’s the reflection in the `y`-axis, on `y = (1/5)^x`.","_n":"2te6f","_k":"0de6220a"},{"t":"(1/5, −1)","why":"Swap the coordinates: `log_{5}(1/5) = -1`.","_n":"2ue7f","_k":"fec69951"},{"t":"(−1, −1/5)","why":"That’s the reflection in the `x`-axis, on `y = -5^x`.","_n":"2vecf","_k":"e54c06c5"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What is the value of `7^{log_{7} 5}`?","options":[{"t":"5","why":"`log_{7} 5` is the exponent that turns 7 into 5, so putting it on 7 gives 5: `b^{log_{b} x} = x`. You never need the value of `log_{7} 5` itself.","_n":"2wedf","_k":"3e46b1dc"},{"t":"7","why":"7 is the base. The power gives back the number inside the log, 5.","_n":"2xeaf","_k":"92ab54b5"},{"t":"35","why":"That’s 7 × 5. The log and the power undo each other.","_n":"2yebf","_k":"03218cf3"},{"t":"`7^5`","why":"That ignores the log. The exponent is `log_{7} 5`, not 5.","_n":"2zf0f","_k":"93cb2c73"}]},"b":{"prompt":"What is the value of `4^{log_{4} 9}`?","options":[{"t":"`4^9`","why":"That ignores the log. The exponent is `log_{4} 9`, not 9.","_n":"30f1f","_k":"1cbb8ef3"},{"t":"9","why":"`log_{4} 9` is the exponent that turns 4 into 9, so putting it on 4 gives 9: `b^{log_{b} x} = x`.","_n":"31eef","_k":"4807c600"},{"t":"36","why":"That’s 4 × 9. The log and the power undo each other.","_n":"32edf","_k":"ff588a39"},{"t":"4","why":"4 is the base. The power gives back the number inside the log, 9.","_n":"33f0f","_k":"c22684ed"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Solve `log_{x} 16 = -2`.","options":[{"t":"`x = 4`","why":"`4^{-2} = 1/16`, not 16. A negative exponent turns a whole-number base into a fraction, so to get 16 the base must be a fraction.","_n":"34eff","_k":"3597d2e1"},{"t":"`x = -4`","why":"A log’s base must be positive. And `(-4)^{-2} = 1/16`, not 16.","_n":"35eaf","_k":"d9742fe3"},{"t":"`x = -8`","why":"That’s 16 ÷ (−2). A log isn’t a division.","_n":"36e9f","_k":"6ef943b4"},{"t":"`x = 1/4`","why":"In exponential form, `x^{-2} = 16`, so `1/x^2 = 16` and `x^2 = 1/16`. A base must be positive, so `x = 1/4`. Check: `(1/4)^{-2} = 4^2 = 16`.","_n":"37ecf","_k":"4109f73c"}]},"b":{"prompt":"Solve `log_{x} 81 = -4`.","options":[{"t":"`x = -81/4`","why":"That’s 81 ÷ (−4). A log isn’t a division.","_n":"38ebf","_k":"3af90721"},{"t":"`x = -3`","why":"A log’s base must be positive. And `(-3)^{-4} = 1/81`, not 81.","_n":"39f6f","_k":"78412e21"},{"t":"`x = 1/3`","why":"In exponential form, `x^{-4} = 81`, so `1/x^4 = 81` and `x^4 = 1/81`. A base must be positive, so `x = 1/3`. Check: `(1/3)^{-4} = 3^4 = 81`.","_n":"3af5f","_k":"d592fdc1"},{"t":"`x = 3`","why":"`3^{-4} = 1/81`, not 81. To get 81 with a negative exponent, the base must be a fraction.","_n":"3b7cf","_k":"de092c38"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Solve `(1/2)^x = 20`. Between which two whole numbers is the exact solution?","options":[{"t":"40 and 41","why":"That’s 20 ÷ 1/2 = 40. Exponents aren’t undone by dividing.","_n":"3c7df","_k":"0654e0be"},{"t":"−5 and −4","why":"In log form, `x = log_{1/2} 20`. `(1/2)^x = 2^{-x}`, and `2^4 = 16 \u003c 20 \u003c 32 = 2^5`, so `-x` is between 4 and 5 and `x` is between −5 and −4.","_n":"3d7ef","_k":"16214c9f"},{"t":"4 and 5","why":"`(1/2)^4 = 1/16`, far below 20. A base below 1 needs a negative exponent to make a number bigger than 1.","_n":"3e7ff","_k":"bcd3e356"},{"t":"−4 and −3","why":"`(1/2)^{-3} = 8` and `(1/2)^{-4} = 16` are both less than 20, so `x` is below −4. A number such as −4.3 lies between −5 and −4.","_n":"3f78f","_k":"bbf155cb"}]},"b":{"prompt":"Solve `(1/3)^x = 50`. Between which two whole numbers is the exact solution?","options":[{"t":"3 and 4","why":"`(1/3)^3 = 1/27`, far below 50. A base below 1 needs a negative exponent to make a number bigger than 1.","_n":"3g79f","_k":"ca1d0143"},{"t":"−3 and −2","why":"`(1/3)^{-2} = 9` and `(1/3)^{-3} = 27` are both less than 50, so `x` is below −3. A number such as −3.6 lies between −4 and −3.","_n":"3h7af","_k":"9a6571cc"},{"t":"150 and 151","why":"That’s 50 ÷ 1/3 = 150. Exponents aren’t undone by dividing.","_n":"3i7bf","_k":"5c3293c6"},{"t":"−4 and −3","why":"`x = log_{1/3} 50`. `(1/3)^x = 3^{-x}`, and `3^3 = 27 \u003c 50 \u003c 81 = 3^4`, so `-x` is between 3 and 4 and `x` is between −4 and −3.","_n":"3j74f","_k":"0731d108"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"The graph of `y = 2^x + 3` has the horizontal asymptote `y = 3` and passes through (0, 4). Which describes the graph of its inverse?","options":[{"t":"Vertical asymptote `x = 3`; it passes through (4, 0)","why":"Reflecting in `y = x` swaps everything: the line `y = 3` becomes `x = 3`, and (0, 4) becomes (4, 0). (The inverse is `y = log_{2}(x - 3)`, and `log_{2} 1 = 0`.)","_n":"3k75f","_k":"414be590"},{"t":"Vertical asymptote `x = -3`; it passes through (4, 0)","why":"Swapping `y = 3` gives `x = 3`. A sign change would come from a reflection in an axis, not in `y = x`.","_n":"3l82f","_k":"51b3a2da"},{"t":"Vertical asymptote `x = 3`; it passes through (0, 4)","why":"The asymptote swapped, but the point didn’t. (0, 4) becomes (4, 0).","_n":"3m81f","_k":"12317b60"},{"t":"Horizontal asymptote `y = 3`; it passes through (4, 0)","why":"The point swapped, but the asymptote didn’t. The horizontal line `y = 3` becomes the vertical line `x = 3`.","_n":"3n80f","_k":"34a7267a"}]},"b":{"prompt":"The graph of `y = 3^x - 2` has the horizontal asymptote `y = -2` and passes through (0, −1). Which describes the graph of its inverse?","options":[{"t":"Vertical asymptote `x = -2`; it passes through (−1, 0)","why":"`y = -2` becomes `x = -2`, and (0, −1) becomes (−1, 0). (The inverse is `y = log_{3}(x + 2)`, and `log_{3} 1 = 0`.)","_n":"3o7ff","_k":"3f47430b"},{"t":"Vertical asymptote `x = -2`; it passes through (0, −1)","why":"The point didn’t swap.","_n":"3p7ef","_k":"e5f50fd8"},{"t":"Horizontal asymptote `y = -2`; it passes through (−1, 0)","why":"The asymptote didn’t swap.","_n":"3q7df","_k":"570ed490"},{"t":"Vertical asymptote `x = 2`; it passes through (−1, 0)","why":"Swapping `y = -2` gives `x = -2`; the sign stays.","_n":"3r7cf","_k":"2a5d76e8"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why the graph of `y = log_{3} x` is the reflection of the graph of `y = 3^x` in the line `y = x`?","options":[{"t":"`y = log_{3} x` is the inverse of `y = 3^x`, so each point `(p, q)` becomes `(q, p)`, and swapping the coordinates of every point reflects a graph in `y = x`.","why":"This links the inverse, the swap and the reflection, and it works for every point.","_n":"3s7bf","_k":"cf8450a3"},{"t":"`y = log_{3} x` is the reciprocal of `y = 3^x`, so each height `q` becomes `1/q`, and taking one over every height reflects a graph in `y = x`.","why":"`log_{3} x` isn’t `1/3^x`: at `x = 1`, `log_{3} 1 = 0` but `1/3^1 = 1/3`. And taking one over the heights doesn’t reflect a graph in `y = x`.","_n":"3t7af","_k":"9b32dc80"},{"t":"`y = log_{3} x` is `y = 3^x` with `x` replaced by `-x`, so each point `(p, q)` becomes `(-p, q)`, and that change reflects a graph in `y = x`.","why":"Replacing `x` with `-x` reflects in the `y`-axis, and it gives `y = (1/3)^x`, a different exponential.","_n":"3u79f","_k":"a3e1c92d"},{"t":"Both graphs pass through the point (1, 1), which is on `y = x`, and two graphs that share a point on `y = x` are reflections of each other in it.","why":"Neither graph passes through (1, 1): `3^1 = 3` and `log_{3} 1 = 0`. And sharing one point wouldn’t prove a reflection anyway.","_n":"3vf0e","_k":"edb6d761"}]},"b":{"prompt":"Which is the best explanation of why the graph of `y = log_{1/2} x` is the reflection of the graph of `y = (1/2)^x` in the line `y = x`?","options":[{"t":"`y = log_{1/2} x` is the reciprocal of `y = (1/2)^x`, so each height `q` becomes `1/q`, and taking one over every height reflects a graph in `y = x`.","why":"The reciprocal of `(1/2)^x` is `2^x`, not `log_{1/2} x`: at `x = 1`, `log_{1/2} 1 = 0` but `2^1 = 2`. And taking one over the heights doesn’t reflect a graph in `y = x`.","_n":"3wf1e","_k":"f014723d"},{"t":"`y = log_{1/2} x` is `y = (1/2)^x` with `x` replaced by `-x`, so each point `(p, q)` becomes `(-p, q)`, and that change reflects a graph in `y = x`.","why":"Replacing `x` with `-x` reflects in the `y`-axis, and it gives `y = 2^x`, a different exponential.","_n":"3xeee","_k":"31d13eb7"},{"t":"`y = log_{1/2} x` is the inverse of `y = (1/2)^x`, so each point `(p, q)` becomes `(q, p)`, and swapping the coordinates of every point reflects a graph in `y = x`.","why":"This links the inverse, the swap and the reflection, and it works for every point, whether the base is above or below 1.","_n":"3yefe","_k":"e8d91f8a"},{"t":"Both graphs pass through the point (1, 1), which is on `y = x`, and two graphs that share a point on `y = x` are reflections of each other in it.","why":"Neither graph passes through (1, 1): `(1/2)^1 = 1/2` and `log_{1/2} 1 = 0`. And sharing one point wouldn’t prove a reflection anyway.","_n":"3zece","_k":"37280337"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which statement is written correctly and is true?","options":[{"t":"`log_{16} 4 = 1/2`, because `16^{1/2} = 4`","why":"The base 16 is the subscript, 4 is inside the log, and the value 1/2 is the exponent.","_n":"40ede","_k":"c9bbd8b0"},{"t":"`log_{16}(1/2) = 4`, because `16^{1/2} = 4`","why":"The log’s value is the exponent, 1/2, and the result, 4, goes inside: `log_{16} 4 = 1/2`.","_n":"41eae","_k":"e9dd309b"},{"t":"`log_{16} = 1/2`, because `16^{1/2} = 4`","why":"`log_{16}` needs an input: `log_{16} 4`. On its own, “`log_{16}`” isn’t a number.","_n":"42ebe","_k":"53bba373"},{"t":"`log_{4} 16 = 1/2`, because `16^{1/2} = 4`","why":"`log_{4} 16 = 2`, since `4^2 = 16`. The base of the power, 16, must be the base of the log.","_n":"43f8e","_k":"8bd0398d"}]},"b":{"prompt":"Which statement is written correctly and is true?","options":[{"t":"`log_{3} 9 = 1/2`, because `9^{1/2} = 3`","why":"`log_{3} 9 = 2`, since `3^2 = 9`. The base of the power, 9, must be the base of the log.","_n":"44f9e","_k":"12863543"},{"t":"`log_{9} = 1/2`, because `9^{1/2} = 3`","why":"`log_{9}` needs an input: `log_{9} 3`. On its own, “`log_{9}`” isn’t a number.","_n":"4576f","_k":"7cfc5d5b"},{"t":"`log_{9} 3 = 1/2`, because `9^{1/2} = 3`","why":"The base 9 is the subscript, 3 is inside the log, and the value 1/2 is the exponent.","_n":"4675f","_k":"bb3f605c"},{"t":"`log_{9}(1/2) = 3`, because `9^{1/2} = 3`","why":"The log’s value is the exponent, 1/2, and the result, 3, goes inside: `log_{9} 3 = 1/2`.","_n":"4778f","_k":"83f17cfb"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A lab culture triples every hour, so after `t` hours there are `N = 3^t` thousand cells. Which equation gives `t` in terms of `N`, and when does the culture reach 243 thousand cells?","options":[{"t":"`t = N/3`; after 81 hours","why":"Tripling every hour isn’t dividing by 3. After 81 hours the culture would be unimaginably large.","_n":"4877f","_k":"c4714227"},{"t":"`t = log_{3} N`; after 5 hours","why":"Rewrite `N = 3^t` in log form: `t = log_{3} N`. Then `t = log_{3} 243 = 5`, because `3^5 = 243`.","_n":"497af","_k":"cd19c5ef"},{"t":"`t = log_{N} 3`; after 1/5 of an hour","why":"That swaps the base and the input. `log_{243} 3 = 1/5` is true (`243^{1/5} = 3`), but it answers a different question.","_n":"4a79f","_k":"b68bd25c"},{"t":"`t = log_{3} N`; after 81 hours","why":"The equation is right, but `log_{3} 243` isn’t 243 ÷ 3. `3^5 = 243`, so `t = 5`.","_n":"4b7cf","_k":"26fde80d"}]},"b":{"prompt":"The number of people who have seen a video quadruples every day, so after `d` days `N = 4^d` hundred people have seen it. Which equation gives `d` in terms of `N`, and when does `N` reach 1024 hundred?","options":[{"t":"`d = log_{N} 4`; after 1/5 of a day","why":"That swaps the base and the input. `log_{1024} 4 = 1/5` answers a different question.","_n":"4c7bf","_k":"3697cc85"},{"t":"`d = log_{4} N`; after 5 days","why":"`d = log_{4} N`, and `log_{4} 1024 = 5` because `4^5 = 1024`.","_n":"4d6ef","_k":"321ce265"},{"t":"`d = log_{4} N`; after 256 days","why":"The equation is right, but `log_{4} 1024` isn’t 1024 ÷ 4. `4^5 = 1024`, so `d = 5`.","_n":"4e6df","_k":"232b393e"},{"t":"`d = N/4`; after 256 days","why":"Quadrupling every day isn’t dividing by 4.","_n":"4fe4e","_k":"ff213f5d"}]}},{"id":"a2","cat":"A","goal":1,"a":{"prompt":"`f(x) = 3 · 2^x`. Which is the equation of `f^{-1}(x)`?","options":[{"t":"`f^{-1}(x) = log_{6} x`","why":"`3 · 2^x` isn’t `6^x`: only the 2 is raised to the power. Check: `f(2) = 12`, but `log_{6} 12` isn’t 2, since `6^2 = 36`.","_n":"4ge5e","_k":"48999521"},{"t":"`f^{-1}(x) = (1/3) log_{2} x`","why":"The 3 has to be undone \u003cstrong>before\u003c/strong> you rewrite, so it divides `x` inside the log. Check: `f(2) = 12`, but `(1/3) log_{2} 12` is less than 4/3, because `log_{2} 12 \u003c log_{2} 16 = 4`.","_n":"4he6e","_k":"4cfc2d5d"},{"t":"`f^{-1}(x) = log_{2} x - 3`","why":"Subtracting 3 doesn’t undo multiplying by 3. Check: `f(2) = 12`, but `log_{2} 12 - 3` is less than 1.","_n":"4ie7e","_k":"5426d919"},{"t":"`f^{-1}(x) = log_{2}(x/3)`","why":"Swap: `x = 3 · 2^y`. Isolate the power: `2^y = x/3`. Rewrite: `y = log_{2}(x/3)`. Check: `f(2) = 12`, and `log_{2}(12/3) = log_{2} 4 = 2`.","_n":"4je8e","_k":"760a02b2"}]},"b":{"prompt":"`f(x) = 5 · 3^x`. Which is the equation of `f^{-1}(x)`?","options":[{"t":"`f^{-1}(x) = log_{3}(x/5)`","why":"Swap: `x = 5 · 3^y`. Isolate: `3^y = x/5`. Rewrite: `y = log_{3}(x/5)`. Check: `f(2) = 45`, and `log_{3}(45/5) = log_{3} 9 = 2`.","_n":"4ke9e","_k":"d0efea6e"},{"t":"`f^{-1}(x) = (1/5) log_{3} x`","why":"Undo the 5 before you rewrite. Check: `f(2) = 45`, but `(1/5) log_{3} 45` is less than 4/5, because `log_{3} 45 \u003c log_{3} 81 = 4`.","_n":"4leae","_k":"8013fa5e"},{"t":"`f^{-1}(x) = log_{3} x - 5`","why":"Subtracting 5 doesn’t undo multiplying by 5. Check: `f(2) = 45`, but `log_{3} 45 - 5` is negative.","_n":"4mebe","_k":"872cb5fc"},{"t":"`f^{-1}(x) = log_{15} x`","why":"`5 · 3^x` isn’t `15^x`. Check: `f(2) = 45`, but `15^2 = 225`.","_n":"4nece","_k":"e0242cca"}]}}]},"task":{"title":"Land it in the window","summary":"Land it in the window","statement":"\u003cp>Design an exponential equation `@b{b}^x = c` whose solution is \u003cstrong>between −2 and −1\u003c/strong>, with `c` a whole number \u003cstrong>greater than 1\u003c/strong>. There are many answers. Can you find three with different bases?\u003c/p>\u003cp class=\"tiny muted\">Choose the base `@b{b}` as a fraction (top and bottom from 1 to 9) and `c` from 1 to 30.\u003c/p>","checks":["The base is allowed: `@b{b} > 0` and `@b{b} ≠ 1`","`c` is a whole number greater than 1","The solution `x = log_{@b{b}} c` is negative","The solution is between −2 and −1"],"tips":["A base can’t be 1, because `1^x = 1` for every `x`. Choose a numerator and a denominator that are different.","Choose `c` from 2 to 30.","Right now your solution is {sign}. `c` is bigger than 1, but you want a negative exponent. Which bases turn a negative exponent into a number bigger than 1?","Your solution is negative, but not between −2 and −1. For your base, `b^{-1}` = {b1} and `b^{-2}` = {b2}, so `c` must be strictly between them. Right now `c` = {c}, which is {where}."],"explainPrompt":"Explain why your base has to be less than 1, and how you know your solution is between −2 and −1.","vocab":"Use the words exponent, logarithmic form, base and between.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Notice the pattern: with `b = 1/k`, `c` must be strictly between `k` and `k^2`. Those are the heights of `y = (1/k)^x` at the edges of the band, `x = -1` and `x = -2`, because `(1/k)^{-1} = k` and `(1/k)^{-2} = k^2`. In the log view they are where the curve crosses heights −1 and −2."},"cards":[["The inverse of `y = b^x`","Swap `x` and `y`: `x = b^y`. Name the exponent: `y = log_{b} x`."],["What `log_{b} x` means","The exponent you put on `b` to get `x`. `log_{2} 8 = 3`, because `2^3 = 8`."],["Exponential form ⟺ log form","`b^y = x ⟺ log_{b} x = y`. The base stays the base, the exponent is the log’s value, and the result goes inside the log."],["Reflecting a point in `y = x`","`(p, q) -> (q, p)`. The segment between them crosses `y = x` at a right angle, at its midpoint. Example: (3, 8) → (8, 3)."],["Key points of `y = b^x` and `y = log_{b} x`","`(-1, 1/b)`, (0, 1), `(1, b)` on `y = b^x` become `(1/b, -1)`, (1, 0), `(b, 1)` on `y = log_{b} x`."],["Asymptotes","`y = b^x`: horizontal asymptote `y = 0`. `y = log_{b} x`: vertical asymptote `x = 0`. For `b > 1`: as `x -> 0^{+}`, `log_{b} x -> -∞`."],["Domain and range","`y = b^x`: domain `{x ∈ ℝ}`, range `{y ∈ ℝ | y > 0}`. `y = log_{b} x`: domain `{x ∈ ℝ | x > 0}`, range `{y ∈ ℝ}`. They swap."],["Allowed bases","`b > 0` and `b ≠ 1`. With `b = 1`, `x = 1^y` is the vertical line `x = 1`, not a function; a negative base gives values like `(-2)^{1/2}`, which aren’t real."],["Bases between 0 and 1","`y = (1/2)^x` and `y = log_{1/2} x` both fall. `log_{1/2} 8 = -3`, because `(1/2)^{-3} = 8`."],["Solving `b^x = c`","Rewrite in log form: `x = log_{b} c`. Example: `3^x = 10` gives `x = log_{3} 10`, between 2 and 3 because `3^2 = 9 \u003c 10 \u003c 27 = 3^3`."],["Undoing","`log_{b}(b^x) = x` for every `x`; `b^{log_{b} x} = x` for every `x > 0`. Examples: `log_{2}(2^5) = 5` and `3^{log_{3} 10} = 10`."],["Inverse vs reciprocal","`f^{-1}` undoes `f`; `1/f` is one over `f`. The inverse of `2^x` is `log_{2} x`, not `1/2^x = (1/2)^x`."]]}};</script>
