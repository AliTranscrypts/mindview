.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

:"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"e2004603","content":{"id":"01-power-functions","storageKey":"mhf4u-power-functions-v1","kind":"topic","title":"Power functions","topic":"Power Functions","readyTopic":"power functions","hero":{"eq":"y = \u003cspan class=\"va\">a\u003c/span>x\u003csup class=\"vn\">n\u003c/sup>","eqLabel":"y equals a x to the power n","headline":"Two numbers control the whole graph","text":"A power function has the form \u003cspan class=\"m\">\u003ci>y\u003c/i> = \u003ci class=\"va\">a\u003c/i>\u003ci>x\u003c/i>\u003csup>\u003ci class=\"vn\">n\u003c/i>\u003c/sup>\u003c/span>. The number \u003cspan class=\"m\">\u003ci class=\"va\">a\u003c/i>\u003c/span> is the \u003cstrong>leading coefficient\u003c/strong> and the whole number \u003cspan class=\"m\">\u003ci class=\"vn\">n\u003c/i>\u003c/span> is the \u003cstrong>degree\u003c/strong>. In this module you’ll find out exactly how those two numbers shape the graph: by experimenting first, then practising, then checking yourself.","fig":{"aria":"Graphs of y equals x to the power 1 through 6, drawn one after another"}},"goals":["I can tell whether a function is a power function, and name its degree and leading coefficient.","I can describe the end behaviour of `y = ax^n` using the degree and the sign of `a`.","I can state the domain and range of a power function.","I can tell whether a power function is even or odd, and describe its symmetry.","I can describe how the graph changes shape as the degree increases."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Exponents and negative numbers","goal":4,"prompt":"Evaluate `(-2)^3`.","options":[{"t":"`-8`","why":"(−2)(−2)(−2) = −8. Three negative factors give a negative answer.","_n":"0d09","_k":"02fc73c7"},{"t":"`8`","why":"Close! You found the size correctly, but three negative factors multiply to a negative number.","_n":"1d39","_k":"72d2e15a"},{"t":"`-6`","why":"That’s −2 × 3. An exponent means repeated multiplication: (−2)(−2)(−2).","_n":"2d29","_k":"eee02fa4"},{"t":"`6`","why":"That’s 2 × 3. An exponent means repeated multiplication: (−2)(−2)(−2).","_n":"3d59","_k":"a62e583e"}],"hints":["An exponent tells you how many times to multiply the base by itself.","Write it out: (−2)(−2)(−2). Multiply the first two, then the last one.","(−2)(−2) = 4, then 4 × (−2) = −8."]},{"id":"w2","skill":"Exponents and negative numbers","goal":4,"prompt":"Evaluate `(-3)^2`.","options":[{"t":"`9`","why":"(−3)(−3) = 9. Two negative factors give a positive answer.","_n":"4d49","_k":"f536f5b7"},{"t":"`-9`","why":"That would be `-3^2`, where only the 3 is squared. Here the brackets mean the whole −3 is squared.","_n":"5d79","_k":"61bdd65a"},{"t":"`6`","why":"That’s 3 × 2. Squaring means multiplying a number by itself: (−3)(−3).","_n":"6d69","_k":"95099894"},{"t":"`-6`","why":"That’s −3 × 2. Squaring means (−3)(−3), and two negatives make a positive.","_n":"7c99","_k":"cda2cb47"}],"hints":["The brackets matter: the whole −3 is being squared.","Write it as (−3)(−3). What is a negative times a negative?","(−3)(−3) = 9."]},{"id":"w3","skill":"Exponent laws","goal":1,"prompt":"Simplify `x^3 · x^4`.","options":[{"t":"`x^7`","why":"When you multiply powers with the same base, add the exponents: 3 + 4 = 7.","_n":"8c89","_k":"6bc7f45e"},{"t":"`x^12`","why":"That’s what you get by multiplying the exponents. When you multiply powers with the same base, add the exponents instead.","_n":"9f32","_k":"34990259"},{"t":"`2x^7`","why":"There’s no 2 in front. `x^3 · x^4` is just seven x’s multiplied together.","_n":"af42","_k":"cff0222a"},{"t":"`2x^12`","why":"Two mix-ups: there’s no 2 in front, and the exponents should be added, not multiplied.","_n":"bf52","_k":"2095c7ec"}],"hints":["Write it out: `x^3` means x·x·x and `x^4` means x·x·x·x.","How many x’s are multiplied together in total?","3 + 4 = 7 x’s multiplied together, so the answer is `x^7`."]},{"id":"w4","skill":"Domain and range","goal":3,"prompt":"What is the domain of `y = x^2`?","options":[{"t":"`{x ∈ ℝ}`","why":"You can square any real number, so every x-value works.","_n":"cf62","_k":"b51e96dd"},{"t":"`{x ∈ ℝ | x ≥ 0}`","why":"Negative x-values work too: (−3)² = 9. You may be thinking of the range.","_n":"df72","_k":"6ac5eac0"},{"t":"`{y ∈ ℝ | y ≥ 0}`","why":"That’s the range (the y-values). The domain is about the x-values.","_n":"ef82","_k":"bb13b4ea"},{"t":"`{x ∈ ℝ | x ≠ 0}`","why":"x = 0 works fine: 0² = 0.","_n":"ff92","_k":"a7b01574"}],"hints":["Domain means all the x-values you’re allowed to put in.","Is there any number you can’t square?","Every real number can be squared, so the domain is all real numbers: `{x ∈ ℝ}`."]},{"id":"w5","skill":"Domain and range","goal":3,"prompt":"What is the range of `y = x^2`?","options":[{"t":"`{y ∈ ℝ | y ≥ 0}`","why":"Squaring never gives a negative answer, and 0² = 0, so y can be 0 or anything above it.","_n":"gfa2","_k":"fd629fca"},{"t":"`{y ∈ ℝ}`","why":"Can x² ever be negative? Squaring always gives 0 or a positive number.","_n":"heb2","_k":"5f951340"},{"t":"`{y ∈ ℝ | y > 0}`","why":"So close! But y = 0 is reached when x = 0, so use ≥ instead of >.","_n":"iec2","_k":"afaa182c"},{"t":"`{x ∈ ℝ}`","why":"That’s the domain. The range is about the y-values that come out.","_n":"j653","_k":"0af7c86f"}],"hints":["Range means all the y-values the graph can reach.","Can x² ever be negative? What’s the smallest value it can be?","The smallest value is 0 (when x = 0), and it can be any positive number, so `{y ∈ ℝ | y ≥ 0}`."]},{"id":"w6","skill":"Evaluating functions","goal":1,"prompt":"Which point is on the graph of `y = 2x^3`?","options":[{"t":"(2, 16)","why":"2 × 2³ = 2 × 8 = 16.","_n":"k643","_k":"f1deb020"},{"t":"(2, 12)","why":"It looks like you did 2 × 2 × 3. The exponent means 2³ = 2 × 2 × 2 = 8, then multiply by 2.","_n":"l673","_k":"1a1dfb43"},{"t":"(2, 64)","why":"You cubed the 2 in front as well: (2 × 2)³ = 64. Only x is cubed: 2 × 2³ = 16.","_n":"m663","_k":"dfbf1267"},{"t":"(2, 8)","why":"You found 2³ = 8 but forgot to multiply by the 2 in front.","_n":"n693","_k":"3af49ee7"}],"hints":["Substitute x = 2 into the equation.","Do the exponent first (order of operations), then multiply by 2.","2³ = 8, then 2 × 8 = 16, so the point is (2, 16)."]}],"refreshers":{"Exponents and negative numbers":"An exponent means repeated multiplication: (−2)³ = (−2)(−2)(−2). An even number of negative factors gives a positive answer, and an odd number gives a negative answer. Watch the brackets: (−3)² = 9, but −3² = −9 because only the 3 is squared. This exact idea is why even and odd powers behave differently later on.","Exponent laws":"When you multiply powers with the same base, add the exponents. So `x^3 · x^4 = x^7`.","Domain and range":"The domain is every x-value you can put in. The range is every y-value that comes out. For `y = x^2`, any x works, so the domain is `{x ∈ ℝ}`. Squares are never negative, so the range is `{y ∈ ℝ | y ≥ 0}`.","Evaluating functions":"Substitute, then follow the order of operations: exponents before multiplication. For `y = 2x^3` at x = 2, work out 2³ = 8 first, then 2 × 8 = 16."}}},"explore":{"heading":"Power function playground","intro":"Drag the sliders and watch the graph change. The highlighted quadrants show where the graph’s two arms point. The panel lists everything you can say about the function.","predIntro":"Make a prediction first. Then the graph will show you what really happens.","predictions":[{"id":"p1","start":{"a":2,"n":2},"end":{"a":-2,"n":2},"prompt":"The graph shows `y = 2x^2`. What will happen if you change `a` from 2 to −2?","options":[{"t":"Both arms flip to point down","_n":"o683","_k":"f7d40320"},{"t":"Nothing changes","_n":"p6b3","_k":"43c91cd2"},{"t":"Only the right arm flips down","_n":"q6a3","_k":"5ad6e4b8"},{"t":"The graph slides down 2 units","_n":"r6d3","_k":"5596e5ee"}],"explain":"A negative `a` flips the whole graph upside down (a reflection in the x-axis). Both arms now point down, from Q3 to Q4."},{"id":"p2","start":{"a":1,"n":2},"end":{"a":1,"n":3},"prompt":"The graph shows `y = x^2`. What will happen if you change `n` from 2 to 3?","options":[{"t":"The left arm flips down and the right arm stays up","_n":"s6c3","_k":"7907d26b"},{"t":"Both arms point down","_n":"t7f3","_k":"e6687a59"},{"t":"It looks the same, just steeper","_n":"u803","_k":"8f2260bb"},{"t":"The right arm flips down","_n":"v7d3","_k":"8ddf015d"}],"explain":"With an odd degree, the arms point in opposite directions. For `y = x^3`, negative x-values cubed stay negative, so the left arm goes down into Q3 while the right arm goes up into Q1."},{"id":"p3","start":{"a":1,"n":2},"end":{"a":1,"n":6},"prompt":"The graph shows `y = x^2`. If you change `n` to 6, what happens to the graph between x = −1 and x = 1?","options":[{"t":"It gets flatter, hugging the x-axis","_n":"w7e3","_k":"63b2f4a2"},{"t":"It gets steeper","_n":"x7b3","_k":"ceb2c279"},{"t":"It stays exactly the same","_n":"y7c3","_k":"d6e808d1"},{"t":"It becomes a straight line","_n":"z793","_k":"af5db7ec"}],"explain":"Numbers between −1 and 1 get smaller when you raise them to higher powers: 0.5² = 0.25, but 0.5⁶ ≈ 0.016. So higher powers stay flatter near the origin, then shoot up faster once x is past 1 or −1."},{"id":"p4","start":{"a":1,"n":1},"cycle":true,"prompt":"With `a = 1`, which point will the graph pass through no matter what `n` is (for n = 1 and up)?","options":[{"t":"(1, 1)","_n":"107a3","_k":"63091390"},{"t":"(0, 1)","_n":"11773","_k":"2467bcb8"},{"t":"(2, 2)","_n":"12783","_k":"dcced598"},{"t":"(1, 0)","_n":"13f13","_k":"6b9489e7"}],"explain":"1 raised to any power is still 1, so every graph of `y = x^n` passes through (1, 1). They all pass through (0, 0) as well. Even powers also share (−1, 1), and odd powers share (−1, −1)."}],"challenges":[]},"part3":{"slug":"symmetry","name":"Symmetry","heading":"Even or odd? Test the symmetry","intro":"Pick a function, then move a copy of its graph. If the copy lands exactly on the original, the graph has that kind of symmetry.","blocks":[{"title":"What the tests mean","html":"\u003cp>\u003cstrong>Even function:\u003c/strong> fold it over the \u003ci>y\u003c/i>-axis and it lands on itself. This is called \u003cem>line symmetry about the y-axis\u003c/em>. In symbols, `f(-x) = f(x)`.\u003c/p>\u003cp>\u003cstrong>Odd function:\u003c/strong> spin it half a turn (180°) around the origin and it lands on itself. This is called \u003cem>point symmetry about the origin\u003c/em>. In symbols, `f(-x) = -f(x)`.\u003c/p>"}],"quickCheck":{"title":"Quick check: even or odd?","summary":"Symmetry quick check","intro":"Decide without the animation. Use the degree.","store":"sym","items":[{"id":"sq1","goal":4,"prompt":"`y = -4x^6`","choices":[{"t":"Even","fb":"Right. The degree 6 is even, so `(-x)^6 = x^6` and `f(-x) = f(x)`.","_n":"14f03","_k":"2fe969f6"},{"t":"Odd","fb":"Not quite. Look at the exponent: 6 is even. An even number of negative signs cancel out, so the graph folds onto itself.","_n":"15ef3","_k":"322620ff"}]},{"id":"sq2","goal":4,"prompt":"`y = 2x^7`","choices":[{"t":"Even","fb":"Not quite. Look at the exponent: 7 is odd. An odd number of negative signs leaves a negative, so the graph matches itself after a half-turn.","_n":"16ee3","_k":"a583e917"},{"t":"Odd","fb":"Right. The degree 7 is odd, so `(-x)^7 = -x^7` and `f(-x) = -f(x)`.","_n":"17ed3","_k":"cb783e88"}]},{"id":"sq3","goal":4,"prompt":"`y = 5`","choices":[{"t":"Even","fb":"Right. `y = 5` is the same as `5x^0`, and 0 is even. A horizontal line folds onto itself over the y-axis.","_n":"18ec3","_k":"9dc2b960"},{"t":"Odd","fb":"Not quite. Write `y = 5` as `5x^0`. Is the exponent 0 even or odd? Picture the flat line: does it fold onto itself over the y-axis?","_n":"19eb3","_k":"c80f9197"}]},{"id":"sq4","goal":4,"prompt":"`y = -x`","choices":[{"t":"Even","fb":"Not quite. Look at the exponent: 1 is odd. An odd number of negative signs leaves a negative, so the graph matches itself after a half-turn.","_n":"1aea3","_k":"29b39010"},{"t":"Odd","fb":"Right. The degree 1 is odd, so `(-x)^1 = -x^1` and `f(-x) = -f(x)`.","_n":"1bf93","_k":"c2f93c35"}]}]}},"practice":{"activities":[{"id":"match","type":"sorter","title":"End behaviour match","summary":"End behaviour match","instruction":"Sort each function by where its arms point.","noun":"function","goal":2,"boxes":[{"id":"upup","label":"Both arms up","sub":"Q2 to Q1","icon":"\u003csvg width=\"44\" height=\"34\" viewBox=\"0 0 44 34\" aria-hidden=\"true\" style=\"color:var(--pen)\">\u003cpath d=\"M0 17H44M22 0V34\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\u003cpath d=\"M6 4 C14 40 30 40 38 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\u003cpath d=\"M6 4 L11.6 9.9 L3.4 11.7Z\" fill=\"currentColor\"/>\u003cpath d=\"M38 4 L40.6 11.7 L32.4 9.9Z\" fill=\"currentColor\"/>\u003c/svg>"},{"id":"downdown","label":"Both arms down","sub":"Q3 to Q4","icon":"\u003csvg width=\"44\" height=\"34\" viewBox=\"0 0 44 34\" aria-hidden=\"true\" style=\"color:var(--pen)\">\u003cpath d=\"M0 17H44M22 0V34\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\u003cpath d=\"M6 30 C14 -6 30 -6 38 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\u003cpath d=\"M6 30 L3.4 22.3 L11.6 24.1Z\" fill=\"currentColor\"/>\u003cpath d=\"M38 30 L32.4 24.1 L40.6 22.3Z\" fill=\"currentColor\"/>\u003c/svg>"},{"id":"downup","label":"Down on the left, up on the right","sub":"Q3 to Q1","icon":"\u003csvg width=\"44\" height=\"34\" viewBox=\"0 0 44 34\" aria-hidden=\"true\" style=\"color:var(--pen)\">\u003cpath d=\"M0 17H44M22 0V34\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\u003cpath d=\"M6 30 C18 2 26 32 38 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\u003cpath d=\"M6 30 L4.9 21.9 L12.6 25.2Z\" fill=\"currentColor\"/>\u003cpath d=\"M38 4 L39.1 12.1 L31.4 8.8Z\" fill=\"currentColor\"/>\u003c/svg>"},{"id":"updown","label":"Up on the left, down on the right","sub":"Q2 to Q4","icon":"\u003csvg width=\"44\" height=\"34\" viewBox=\"0 0 44 34\" aria-hidden=\"true\" style=\"color:var(--pen)\">\u003cpath d=\"M0 17H44M22 0V34\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\u003cpath d=\"M6 4 C18 32 26 2 38 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\u003cpath d=\"M6 4 L12.6 8.8 L4.9 12.1Z\" fill=\"currentColor\"/>\u003cpath d=\"M38 30 L31.4 25.2 L39.1 21.9Z\" fill=\"currentColor\"/>\u003c/svg>"}],"items":[{"id":"m1","t":"`y = 3x^4`","_a":"R0dARUQU","goal":2,"why":"Both arms point up. The degree 4 is even and `a` is positive.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 4, which is even, so the arms point the same way.","Degree 4 is even and `a = 3` is positive. So: Both arms point up. That’s Q2 to Q1."],"wrong":{"downdown":"Check the sign of `a`: `a = 3` is positive, so both arms point up.","downup":"The degree 4 is even, so both arms point the same way.","updown":"The degree 4 is even, so both arms point the same way."}},{"id":"m2","t":"`y = -x^2`","_a":"R1ZfR1pSX0QLEA==","goal":2,"why":"Both arms point down. The degree 2 is even and `a` is negative.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 2, which is even, so the arms point the same way.","Degree 2 is even and `a = -1` is negative. So: Both arms point down. That’s Q3 to Q4."],"wrong":{"upup":"Check the sign of `a`: `a = -1` is negative, so both arms point down.","downup":"The degree 2 is even, so both arms point the same way.","updown":"The degree 2 is even, so both arms point the same way."}},{"id":"m3","t":"`y = 2x^5`","_a":"R1ZfR1pDQBE=","goal":2,"why":"Starts low on the left and ends high on the right. The degree 5 is odd and `a` is positive.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 5, which is odd, so the arms point in opposite directions.","Degree 5 is odd and `a = 2` is positive. So: Starts low on the left and ends high on the right. That’s Q3 to Q1."],"wrong":{"upup":"The degree 5 is odd, so the arms point in opposite directions.","downdown":"The degree 5 is odd, so the arms point in opposite directions.","updown":"Check the sign of `a`: `a = 2` is positive, so the right arm points up."}},{"id":"m4","t":"`y = -0.5x^3`","_a":"R0dAVFtBXhE=","goal":2,"why":"Starts high on the left and ends low on the right. The degree 3 is odd and `a` is negative.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 3, which is odd, so the arms point in opposite directions.","Degree 3 is odd and `a = -0.5` is negative. So: Starts high on the left and ends low on the right. That’s Q2 to Q4."],"wrong":{"upup":"The degree 3 is odd, so the arms point in opposite directions.","downdown":"The degree 3 is odd, so the arms point in opposite directions.","downup":"Check the sign of `a`: `a = -0.5` is negative, so the right arm points down."}},{"id":"m5","t":"`y = -4x^6`","_a":"R1ZfR1pSX0QLEA==","goal":2,"why":"Both arms point down. The degree 6 is even and `a` is negative.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 6, which is even, so the arms point the same way.","Degree 6 is even and `a = -4` is negative. So: Both arms point down. That’s Q3 to Q4."],"wrong":{"upup":"Check the sign of `a`: `a = -4` is negative, so both arms point down.","downup":"The degree 6 is even, so both arms point the same way.","updown":"The degree 6 is even, so both arms point the same way."}},{"id":"m6","t":"`y = x^7`","_a":"R1ZfR1pDQBE=","goal":2,"why":"Starts low on the left and ends high on the right. The degree 7 is odd and `a` is positive.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 7, which is odd, so the arms point in opposite directions.","Degree 7 is odd and `a = 1` is positive. So: Starts low on the left and ends high on the right. That’s Q3 to Q1."],"wrong":{"upup":"The degree 7 is odd, so the arms point in opposite directions.","downdown":"The degree 7 is odd, so the arms point in opposite directions.","updown":"Check the sign of `a`: `a = 1` is positive, so the right arm points up."}},{"id":"m7","t":"`y = -x`","_a":"R0dAVFtBXhE=","goal":2,"why":"Starts high on the left and ends low on the right. The degree 1 is odd and `a` is negative.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 1, which is odd, so the arms point in opposite directions.","Degree 1 is odd and `a = -1` is negative. So: Starts high on the left and ends low on the right. That’s Q2 to Q4."],"wrong":{"upup":"The degree 1 is odd, so the arms point in opposite directions.","downdown":"The degree 1 is odd, so the arms point in opposite directions.","downup":"Check the sign of `a`: `a = -1` is negative, so the right arm points down."}},{"id":"m8","t":"`y = 0.1x^8`","_a":"R0dARUQU","goal":2,"why":"Both arms point up. The degree 8 is even and `a` is positive.","hints":["Ask two questions: is the degree even or odd? Is `a` positive or negative?","The degree is 8, which is even, so the arms point the same way.","Degree 8 is even and `a = 0.1` is positive. So: Both arms point up. That’s Q2 to Q1."],"wrong":{"downdown":"Check the sign of `a`: `a = 0.1` is positive, so both arms point up.","downup":"The degree 8 is even, so both arms point the same way.","updown":"The degree 8 is even, so both arms point the same way."}}]},{"id":"poly","type":"sorter","title":"Polynomial or not?","summary":"Polynomial or not?","noun":"function","goal":1,"instruction":"A \u003cstrong>power function\u003c/strong> has exactly one term, `ax^n`, with a whole-number exponent. A \u003cstrong>polynomial\u003c/strong> can have several terms, but every exponent must still be a whole number.","boxes":[{"id":"power","label":"Power function","sub":"One term: a number times x to a whole-number power"},{"id":"poly","label":"Polynomial, but not a power function","sub":"More than one term, whole-number exponents"},{"id":"not","label":"Not a polynomial","sub":"Uses an exponent that isn’t a whole number, or x in the exponent"}],"items":[{"id":"s1","t":"`y = 5x^3`","_a":"R0JfR1FEEg==","why":"One term: a number (5) times x to a whole-number power (3).","hints":["Count the terms. Then look at the exponent: is it a whole number?","There’s one term, and the exponent 3 is a whole number.","It matches `y = ax^n` with a = 5 and n = 3, so it’s a power function."],"wrong":{"poly":"A power function has just one term, and this has only one term. That makes it a power function.","not":"The exponent 3 is a whole number, so this is a polynomial, and with one term it’s a power function."}},{"id":"s2","t":"`y = x^½`","_a":"R1xfRBY=","why":"The exponent ½ isn’t a whole number. (This is the square root function, √x.)","hints":["Look closely at the exponent.","Whole numbers are 0, 1, 2, 3, … Is ½ one of them?","½ isn’t a whole number, so this isn’t a polynomial at all."],"wrong":{"power":"It has one term, but the exponent must be a whole number (0, 1, 2, …). ½ isn’t.","poly":"Polynomials only use whole-number exponents, and ½ isn’t one."}},{"id":"s3","t":"`y = 2^x`","_a":"R1xfRBY=","why":"The variable is in the exponent. That makes it an exponential function, not a power function.","hints":["Where is the x? Is it the base or the exponent?","In a power function, x is the base: `ax^n`. Here x is up in the exponent.","With x in the exponent, this is an exponential function, so it isn’t a polynomial."],"wrong":{"power":"Careful: here x is the exponent, not the base. In a power function, x is the base, as in `ax^n`.","poly":"Careful: x is in the exponent here, which polynomials never do."}},{"id":"s4","t":"`y = 4/x`","_a":"R1xfRBY=","why":"4/x is the same as `4x^-1`. The exponent −1 is negative, so it isn’t a whole number.","hints":["Try rewriting the division as a power of x.","Dividing by x is the same as multiplying by `x^-1`.","`4/x = 4x^-1`, and −1 isn’t a whole number, so it isn’t a polynomial."],"wrong":{"power":"Rewrite it: `4/x = 4x^-1`. The exponent −1 isn’t a whole number.","poly":"Rewrite it: `4/x = 4x^-1`. Polynomials can’t have negative exponents."}},{"id":"s5","t":"`y = -7`","_a":"R0JfR1FEEg==","why":"It’s a constant, which you can write as `-7x^0`. Degree 0 is a whole number, so it’s a power function.","hints":["Where’s the x? Remember that `x^0 = 1`.","You can write −7 as `-7x^0`.","That’s `ax^n` with a = −7 and n = 0. Since 0 is a whole number, it’s a power function."],"wrong":{"poly":"There’s only one term here.","not":"Try rewriting it as `-7x^0`. Is 0 a whole number?"}},{"id":"s6","t":"`y = x^2 + 3x`","_a":"R0JfXE0U","why":"Two terms, both with whole-number exponents. It’s a polynomial, but a power function has only one term.","hints":["Count the terms.","There are two terms: `x^2` and `3x`. Are both exponents whole numbers?","Both exponents (2 and 1) are whole numbers, so it’s a polynomial. Two terms means it isn’t a power function."],"wrong":{"power":"A power function has just one term. This has two: `x^2` and `3x`.","not":"Both exponents (2 and 1) are whole numbers, so it is a polynomial."}},{"id":"s7","t":"`y = -0.5x^6`","_a":"R0JfR1FEEg==","why":"One term, with a = −0.5 and n = 6. Decimals and negatives are fine for `a`.","hints":["What rules does `a` have to follow? What about `n`?","`a` can be any real number (except 0). Only `n` has to be a whole number.","a = −0.5 and n = 6 fit `y = ax^n`, so it’s a power function."],"wrong":{"poly":"A power function has just one term, and this has only one term.","not":"The coefficient `a` can be any real number, even a negative decimal. Only the exponent has to be a whole number."}},{"id":"s8","t":"`y = πx^2`","_a":"R0JfR1FEEg==","why":"π is just a number (about 3.14), so a = π and n = 2. It’s the formula for the area of a circle!","hints":["What kind of thing is π?","π is a number, about 3.14. So what are a and n?","a = π and n = 2, so it’s a power function."],"wrong":{"poly":"A power function has just one term, and this has only one term.","not":"π looks unusual, but it’s just a number (about 3.14)."}},{"id":"s9","t":"`y = 3x^4 - 2x + 1`","_a":"R0JfXE0U","why":"Three terms with whole-number exponents (4, 1 and 0). It’s a polynomial, but a power function needs just one term.","hints":["Count the terms.","There are three terms. Are all the exponents whole numbers?","The exponents are 4, 1 and 0, all whole numbers, so it’s a polynomial. Three terms means it isn’t a power function."],"wrong":{"power":"Count the terms: there are three.","not":"All the exponents (4, 1 and 0) are whole numbers, so it’s a polynomial."}},{"id":"s10","t":"`y = x/5`","_a":"R0JfR1FEEg==","why":"x/5 is the same as `(1/5)x^1`, so a = 1/5 and n = 1.","hints":["Dividing by 5 is the same as multiplying by what?","x/5 = (1/5)x. Compare this with 4/x, where x was on the bottom.","`x/5 = (1/5)x^1`: one term, whole-number exponent, so it’s a power function."],"wrong":{"poly":"A power function has just one term, and this has only one term.","not":"Dividing by 5 is the same as multiplying by 1/5, so `x/5 = (1/5)x`. The x isn’t on the bottom."}}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Jordan","instruction":"Jordan made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":2,"task":"Describe the end behaviour and range of `y = -2x^4`.","steps":["The degree is 4, which is even.","The leading coefficient is −2, which is negative.","Even degree and negative `a`, so the graph goes from Q2 to Q4.","Range: `{y ∈ ℝ | y ≤ 0}`."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking the steps after it.","","Step 4 is actually correct: the highest point is (0, 0). The mistake is earlier, and step 4 doesn’t even agree with it!"],"fixes":[{"t":"Even degree and negative `a`, so both arms point down: Q3 to Q4.","why":"Even degree means both arms point the same way, and a negative `a` points them down.","_n":"1cf83","_k":"6ac6ee89"},{"t":"Even degree and negative `a`, so both arms point up: Q2 to Q1.","why":"A negative `a` flips the graph, so the arms point down, not up.","_n":"1deb3","_k":"27cf2a26"},{"t":"Even degree and negative `a`, so the graph goes from Q3 to Q1.","why":"Q3 to Q1 is the pattern for an odd degree with a positive `a`.","_n":"1eec3","_k":"fa37d0fa"},{"t":"Step 3 is correct as written.","why":"Q2 to Q4 means the arms point in opposite directions, which only happens with an odd degree.","_n":"1fed3","_k":"3275038e"}],"hints":["Check each step against the four end-behaviour patterns.","Even degree means both arms point the same way. Do the arms point the same way in ‘Q2 to Q4’?","Step 3 is wrong: Q2 to Q4 means the arms point in opposite directions, which only happens with an odd degree."]},{"id":"e2","goal":4,"task":"Is `y = 3x^5` even, odd, or neither? What symmetry does it have?","steps":["Substitute −x: `f(-x) = 3(-x)^5`.","`(-x)^5 = x^5`, so `f(-x) = 3x^5`.","So `f(-x) = f(x)`, which means the function is even.","It has line symmetry about the y-axis."],"_a":"VA==","stepFb":["Step 1 is correct: replacing x with −x is the right first move.","","This step follows logically from the one before it. The first mistake happens earlier.","This step follows logically from the ones before it. The first mistake happens earlier."],"fixes":[{"t":"`(-x)^5 = -x^5`, so `f(-x) = -3x^5 = -f(x)`. It’s odd, with point symmetry about the origin.","why":"Five negative factors multiply to a negative, so `f(-x) = -f(x)`.","_n":"1gee3","_k":"481135e5"},{"t":"`(-x)^5 = x^5` is right, but it’s odd because 5 is odd.","why":"`(-x)^5` is five negative factors multiplied together, so it’s negative: `-x^5`.","_n":"1he73","_k":"905d520f"},{"t":"`(-x)^5 = -5x`, so `f(-x) = -15x`.","why":"An exponent isn’t multiplication by 5. `(-x)^5` means (−x)(−x)(−x)(−x)(−x).","_n":"1ie83","_k":"c523f7c1"},{"t":"`(-x)^5 = -x^5`, so `f(-x) = -3x^5`, which means it’s even.","why":"The algebra is right this time, but `f(-x) = -f(x)` means odd, not even.","_n":"1je93","_k":"f0b1c617"}],"hints":["Try a number: what is (−2)⁵? Is it the same as 2⁵?","`(-x)^5` is five negative factors multiplied together. Is the result positive or negative?","Step 2 is wrong: `(-x)^5 = -x^5`, because an odd number of negatives multiply to a negative."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you played with the sliders?"},{"id":"j2","q":"In your own words, why does `y = x^4` have line symmetry about the y-axis?"},{"id":"j3","q":"Explain to a friend how to figure out the end behaviour of `y = ax^n` without drawing the graph."},{"id":"j4","q":"What’s one thing you’re still unsure about? What will you do about it?"}]},"final":{"intro":"This shows what you’ve learned, so there are no hints here. Answer all 10 questions and say how sure you are. Then submit to see your results. Each question is labelled with its achievement chart category.","questions":[{"id":"f1","cat":"K","goal":1,"a":{"prompt":"What is the degree of `y = -3x^5`?","options":[{"t":"5","why":"The degree is the exponent, 5.","_n":"1kea3","_k":"82fcf6f5"},{"t":"−3","why":"−3 is the leading coefficient, not the degree.","_n":"1lf33","_k":"364e76b6"},{"t":"3","why":"The degree is the exponent on x, which is 5.","_n":"1mf43","_k":"67a306e0"},{"t":"15","why":"Don’t multiply anything. The degree is just the exponent, 5.","_n":"1nfd3","_k":"06d93d63"}]},"b":{"prompt":"What is the degree of `y = -4x^6`?","options":[{"t":"6","why":"The degree is the exponent, 6.","_n":"1ofc3","_k":"d8fbca42"},{"t":"−4","why":"−4 is the leading coefficient, not the degree.","_n":"1pff3","_k":"4ca7ae5f"},{"t":"4","why":"The degree is the exponent on \u003ci>x\u003c/i>, which is 6. 4 is the size of the coefficient.","_n":"1qfe3","_k":"abbb9aed"},{"t":"24","why":"Don’t multiply anything. The degree is just the exponent, 6.","_n":"1rf93","_k":"fcfaa4b2"}]}},{"id":"f2","cat":"K","goal":1,"a":{"prompt":"Which of these is a power function?","options":[{"t":"`y = 4x^3`","why":"One term with a whole-number exponent: a = 4 and n = 3.","_n":"1sf83","_k":"35c32359"},{"t":"`y = 3^x`","why":"Here x is in the exponent, so it’s an exponential function.","_n":"1tfb3","_k":"a66242a7"},{"t":"`y = x^2 + 1`","why":"It has two terms, so it’s a polynomial but not a power function.","_n":"1ufa3","_k":"920b76dd"},{"t":"`y = x^{1/3}`","why":"The exponent 1/3 isn’t a whole number.","_n":"1vf53","_k":"0ac022c2"}]},"b":{"prompt":"Which of these is a power function?","options":[{"t":"`y = -5x^2`","why":"One term with a whole-number exponent: `a = -5` and `n = 2`.","_n":"1wf43","_k":"75f0cb31"},{"t":"`y = 2^x`","why":"Here \u003ci>x\u003c/i> is in the exponent, so it’s an exponential function.","_n":"1xf73","_k":"e52f22de"},{"t":"`y = x^3 - x`","why":"It has two terms, so it’s a polynomial but not a power function.","_n":"1yf83","_k":"53b55c08"},{"t":"`y = 4x^-1`","why":"The exponent −1 isn’t a whole number.","_n":"1zf53","_k":"98088bae"}]}},{"id":"f3","cat":"K","goal":2,"a":{"prompt":"Which describes the end behaviour of `y = -x^4`?","options":[{"t":"Q3 to Q4 (both arms down)","why":"Even degree means the arms point the same way, and a negative `a` points them down.","_n":"20f63","_k":"86393bc9"},{"t":"Q2 to Q1 (both arms up)","why":"That’s `y = x^4`. The negative sign flips both arms down.","_n":"21fb3","_k":"b0f8aedf"},{"t":"Q2 to Q4","why":"Arms pointing in opposite directions only happens with an odd degree.","_n":"22fc3","_k":"95c0bc75"},{"t":"Q3 to Q1","why":"Arms pointing in opposite directions only happens with an odd degree.","_n":"23f93","_k":"2f3812fe"}]},"b":{"prompt":"Which describes the end behaviour of `y = -3x^5`?","options":[{"t":"Q2 to Q4","why":"Odd degree means the arms point opposite ways, and a negative `a` sends the right arm down.","_n":"24fa3","_k":"68dd424e"},{"t":"Q3 to Q1","why":"That’s `y = 3x^5`. The negative sign flips the graph.","_n":"25ef3","_k":"61470c06"},{"t":"Q3 to Q4 (both arms down)","why":"Arms pointing the same way only happens with an even degree.","_n":"26f03","_k":"86b21e06"},{"t":"Q2 to Q1 (both arms up)","why":"Arms pointing the same way only happens with an even degree.","_n":"27e91","_k":"6edcd8bd"}]}},{"id":"f4","cat":"T","goal":4,"a":{"prompt":"A power function has point symmetry about the origin, and its graph goes from Q2 to Q4. Which could it be?","options":[{"t":"`y = -2x^3`","why":"Point symmetry means an odd degree, and Q2 to Q4 means `a` is negative.","_n":"28e81","_k":"6c14c2e4"},{"t":"`y = 2x^3`","why":"This one goes from Q3 to Q1, because `a` is positive.","_n":"29e71","_k":"2d2444f9"},{"t":"`y = -2x^4`","why":"An even degree gives line symmetry about the y-axis, not point symmetry.","_n":"2ae61","_k":"8ea36ce4"},{"t":"`y = 2x^4`","why":"An even degree gives line symmetry, and both of its arms point up.","_n":"2bed1","_k":"77e75a89"}]},"b":{"prompt":"A power function has line symmetry about the \u003ci>y\u003c/i>-axis, and both of its arms point down. Which could it be?","options":[{"t":"`y = -2x^6`","why":"Line symmetry means an even degree, and both arms down means `a` is negative.","_n":"2cec1","_k":"514c463c"},{"t":"`y = 2x^6`","why":"Both of this one’s arms point up, because `a` is positive.","_n":"2deb1","_k":"463aa43d"},{"t":"`y = -2x^5`","why":"An odd degree gives point symmetry about the origin, not line symmetry.","_n":"2eea1","_k":"e6a4dddf"},{"t":"`y = 2x^5`","why":"An odd degree gives point symmetry, and its arms point opposite ways.","_n":"2ff11","_k":"5f7a70b5"}]}},{"id":"f5","cat":"T","goal":5,"a":{"prompt":"For values of x between 0 and 1, how do `y = x^6` and `y = x^2` compare?","options":[{"t":"`x^6` is smaller, so its graph is closer to the x-axis","why":"Numbers between 0 and 1 shrink with higher powers: 0.5⁶ ≈ 0.016, but 0.5² = 0.25.","_n":"2gf01","_k":"8f5d9dde"},{"t":"`x^6` is larger, so its graph is higher","why":"Try x = 0.5: 0.5⁶ ≈ 0.016 and 0.5² = 0.25. The higher power is smaller here.","_n":"2he31","_k":"43a868ac"},{"t":"They are equal","why":"They’re only equal at x = 0 and x = 1.","_n":"2ie41","_k":"6a148462"},{"t":"`x^6` is negative","why":"An even power is never negative.","_n":"2je51","_k":"5ced5b84"}]},"b":{"prompt":"For values of \u003ci>x\u003c/i> between 0 and 1, how do `y = x^5` and `y = x^3` compare?","options":[{"t":"`x^5` is smaller, so its graph is closer to the \u003ci>x\u003c/i>-axis","why":"Numbers between 0 and 1 shrink with higher powers: 0.5⁵ = 0.03125, but 0.5³ = 0.125.","_n":"2ke61","_k":"22f2a659"},{"t":"`x^5` is larger, so its graph is higher","why":"Try \u003ci>x\u003c/i> = 0.5: 0.5⁵ = 0.03125 and 0.5³ = 0.125. The higher power is smaller here.","_n":"2le71","_k":"5d2b771c"},{"t":"They are equal","why":"They’re only equal at \u003ci>x\u003c/i> = 0 and \u003ci>x\u003c/i> = 1 (and \u003ci>x\u003c/i> = −1).","_n":"2me81","_k":"63da88b2"},{"t":"`x^5` is negative","why":"For \u003ci>x\u003c/i> between 0 and 1, every power of \u003ci>x\u003c/i> is positive.","_n":"2ne91","_k":"77bd6334"}]}},{"id":"f6","cat":"T","goal":4,"a":{"prompt":"The graph of `y = ax^n` passes through (1, −5) and (−1, −5). What can you conclude?","options":[{"t":"`n` is even and `a = -5`","why":"At x = 1, y = a, so a = −5. The same y-value at x = 1 and x = −1 means the graph is symmetric about the y-axis, so n is even.","_n":"2oea1","_k":"3c04f2fa"},{"t":"`n` is odd and `a = -5`","why":"For an odd n, the point at x = −1 would be (−1, 5), the opposite of (1, −5).","_n":"2peb1","_k":"3d782b81"},{"t":"`n` is even and `a = 5`","why":"Substitute
