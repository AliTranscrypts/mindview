r>\u003c/tbody>\u003c/table>\u003c/div>","options":[{"t":"1","why":"That’s `g(f(1)) = g(3) = 1`. In `f(g(1))`, `g` acts first.","_n":"1wbb2","_k":"631b9f00"},{"t":"2","why":"That’s `g(1)`, the inner value. It still has to go into `f`: `f(2) = 5`.","_n":"1xc82","_k":"2fec6f2a"},{"t":"5","why":"Inside out: `g(1) = 2`, then `f(2) = 5`.","_n":"1yc72","_k":"25a86ecf"},{"t":"6","why":"That’s `f(1) × g(1) = 3 × 2`. Composition isn’t multiplication.","_n":"1zc62","_k":"cdc4a98a"}]},"b":{"prompt":"Use the table. What is `f(g(4))`?\u003cdiv class=\"tbl-wrap\" style=\"margin-top:10px;max-width:420px\">\u003ctable class=\"vt\">\u003cthead>\u003ctr>\u003cth scope=\"col\">`x`\u003c/th>\u003cth scope=\"col\">1\u003c/th>\u003cth scope=\"col\">2\u003c/th>\u003cth scope=\"col\">3\u003c/th>\u003cth scope=\"col\">4\u003c/th>\u003cth scope=\"col\">5\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>`f(x)`\u003c/td>\u003ctd>4\u003c/td>\u003ctd>1\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>`g(x)`\u003c/td>\u003ctd>3\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[{"t":"1","why":"That’s `g(4)`, the inner value. It still has to go into `f`.","_n":"20c52","_k":"2c404ff6"},{"t":"2","why":"That’s `f(4) × g(4) = 2 × 1`.","_n":"21c42","_k":"01fa459e"},{"t":"4","why":"`g(4) = 1`, then `f(1) = 4`.","_n":"22c32","_k":"7f3682c9"},{"t":"5","why":"That’s `g(f(4)) = g(2) = 5`.","_n":"23c22","_k":"07662906"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`f(x) = x^2 - 3x` and `g(x) = x + 2`. What is `f(g(x))`?","options":[{"t":"`x^2 + x - 2`","why":"`(x + 2)^2 - 3(x + 2) = x^2 + 4x + 4 - 3x - 6 = x^2 + x - 2`. Check with `x = 0`: `f(2) = 4 - 6 = -2`.","_n":"24c12","_k":"8a998969"},{"t":"`x^3 - x^2 - 6x`","why":"That’s `f(x) · g(x) = (x^2 - 3x)(x + 2)`. Composition isn’t multiplication.","_n":"25c02","_k":"80e974be"},{"t":"`x^2 - 3x + 2`","why":"That’s `g(f(x)) = (x^2 - 3x) + 2`. Check with `x = 0`: it gives 2, but `f(g(0)) = -2`.","_n":"26bf2","_k":"9bc641d4"},{"t":"`x^2 + x + 4`","why":"That replaces only the first `x`: `(x + 2)^2 - 3x`. Check with `x = 0`: `f(g(0)) = f(2) = -2`, not 4.","_n":"27c63","_k":"7e986c61"}]},"b":{"prompt":"`f(x) = x^2 + 2x` and `g(x) = x - 1`. What is `f(g(x))`?","options":[{"t":"`x^2 - 1`","why":"`(x - 1)^2 + 2(x - 1) = x^2 - 2x + 1 + 2x - 2 = x^2 - 1`. Check with `x = 0`: `f(-1) = 1 - 2 = -1`.","_n":"28c73","_k":"0e438c7c"},{"t":"`x^3 + x^2 - 2x`","why":"That’s `f(x) · g(x)`.","_n":"29c43","_k":"9e1aaae9"},{"t":"`x^2 + 1`","why":"That replaces only the first `x`: `(x - 1)^2 + 2x`. Check with `x = 0`: it gives 1, but `f(-1) = -1`.","_n":"2ac53","_k":"00fa9290"},{"t":"`x^2 + 2x - 1`","why":"That’s `g(f(x))`. Check with `x = 0`: it gives −1 too, but try `x = 1`: it gives 2, while `f(g(1)) = f(0) = 0`.","_n":"2bc23","_k":"e7fb2048"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"`f(x) = 2^x + 1`, and `f^{-1}` is its inverse. What is `f(f^{-1}(13))`?","options":[{"t":"13","why":"`f^{-1}` turns 13 into the input that `f` sends to 13, and then `f` sends it back to 13. A function composed with its inverse gives back the input.","_n":"2cc33","_k":"14f0acab"},{"t":"1","why":"That treats `f^{-1}` as `1/f`, as if `f · (1/f) = 1`. `f^{-1}` undoes `f`; it doesn’t divide.","_n":"2dc03","_k":"ab147028"},{"t":"8193","why":"That’s `f(13) = 2^{13} + 1`. It ignores `f^{-1}`, which acts first.","_n":"2ec13","_k":"60ce3370"},{"t":"`log_{2} 12`","why":"That’s `f^{-1}(13)`, the inner value. `f` then turns it back into 13.","_n":"2fbe3","_k":"30df8e40"}]},"b":{"prompt":"`f(x) = log_{3}(x - 1)`, and `f^{-1}` is its inverse. What is `f^{-1}(f(10))`?","options":[{"t":"1","why":"`f^{-1}` isn’t `1/f`. It undoes `f`, so it gives back the input.","_n":"2gbf3","_k":"c3e53e4a"},{"t":"2","why":"That’s `f(10)`, the inner value. `f^{-1}` then turns 2 back into 10.","_n":"2hac3","_k":"e228ddad"},{"t":"10","why":"`f` turns 10 into `log_{3} 9 = 2`, and `f^{-1}` turns 2 back into 10.","_n":"2iab3","_k":"08522996"},{"t":"59 050","why":"That’s `f^{-1}(10) = 3^{10} + 1`. It ignores `f`, which acts first.","_n":"2jae3","_k":"cdcf7e1d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`f(x) = √x` and `g(x) = 4 - x^2`. What is the domain of `f(g(x))`?","options":[{"t":"`{x ∈ ℝ | x ≥ 0}`","why":"That’s the domain of `f` alone. What matters is whether `g(x) ≥ 0`: at `x = 3`, `g(3) = -5`.","_n":"2kad3","_k":"9c86af91"},{"t":"`{x ∈ ℝ | -2 ≤ x ≤ 2}`","why":"`g` accepts every `x`, and √ needs `4 - x^2 ≥ 0`, so `x^2 ≤ 4`: `-2 ≤ x ≤ 2`. Check: `x = 3` gives `√{-5}`, which isn’t real.","_n":"2lb03","_k":"14788320"},{"t":"`{x ∈ ℝ | x ≤ -2 or x ≥ 2}`","why":"That solves `4 - x^2 ≤ 0`, the wrong way round. At `x = 3`, `4 - 9 = -5` and `√{-5}` isn’t real.","_n":"2maf3","_k":"a328e3c1"},{"t":"`{x ∈ ℝ}`","why":"That’s the domain of `g` alone. Some outputs of `g` are negative, and √ can’t accept them.","_n":"2nb23","_k":"19cf83cb"}]},"b":{"prompt":"`f(x) = log_{2} x` and `g(x) = 9 - x^2`. What is the domain of `f(g(x))`?","options":[{"t":"`{x ∈ ℝ | -3 \u003c x \u003c 3}`","why":"`log_{2}` needs `9 - x^2 > 0`, so `x^2 \u003c 9`: `-3 \u003c x \u003c 3`. At `x = 3`, `log_{2} 0` is undefined.","_n":"2ob13","_k":"20752436"},{"t":"`{x ∈ ℝ}`","why":"That’s the domain of `g` alone. Some outputs of `g` are 0 or negative, and `log_{2}` can’t accept them.","_n":"2pb43","_k":"c63e5283"},{"t":"`{x ∈ ℝ | x > 0}`","why":"That’s the domain of `f` alone. What matters is whether `g(x) > 0`.","_n":"2qb33","_k":"ee51bbb5"},{"t":"`{x ∈ ℝ | x \u003c -3 or x > 3}`","why":"That solves `9 - x^2 \u003c 0`, the wrong way round. At `x = 4`, `log_{2}(-7)` is undefined.","_n":"2r2f8","_k":"5a548ca6"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"The graphs show `y = f(x)`, a parabola crossing the `x`-axis at −1 and 2, and `y = g(x)`, a parabola with vertex (0, −2) passing through (±1, −1) and (±2, 2). What are all the solutions of `f(g(x)) = 0`?\u003ccanvas class=\"plot\" data-fig=\"t2a\" role=\"img\" aria-label=\"Two parabolas on one grid: f, in blue, crosses the x-axis at negative 1 and 2; g, in teal, has vertex (0, negative 2) and passes through (plus or minus 1, negative 1) and (plus or minus 2, 2)\">\u003c/canvas>","options":[{"t":"`x = -√2, √2`","why":"Those are the zeros of `g`. But `f(0) = -2`, not 0, so `g(x) = 0` doesn’t help.","_n":"2s2e8","_k":"2a93e228"},{"t":"`x = -1, 1`","why":"That solves `g(x) = -1` only. `g(x) = 2` gives two more solutions, `x = ±2`.","_n":"2t2d8","_k":"3568cfa2"},{"t":"`x = -2, -1, 1, 2`","why":"`f` is 0 only at inputs −1 and 2, so `g(x)` must be −1 or 2. `g(x) = -1` at `x = ±1`, and `g(x) = 2` at `x = ±2`: four solutions.","_n":"2u2c8","_k":"93a99d7b"},{"t":"`x = -1, 2`","why":"Those are the zeros of `f`. They tell you what `g(x)` must \u003cstrong>equal\u003c/strong>, not what `x` is.","_n":"2v338","_k":"16d38a2c"}]},"b":{"prompt":"The graphs show `y = f(x)`, a parabola crossing the `x`-axis at 1 and 6, and `y = g(x)`, a parabola with vertex (0, −3) passing through (±2, 1) and (±3, 6). What are all the solutions of `f(g(x)) = 0`?\u003ccanvas class=\"plot\" data-fig=\"t2b\" role=\"img\" aria-label=\"Two parabolas on one grid: f, in blue, crosses the x-axis at 1 and 6; g, in teal, has vertex (0, negative 3) and passes through (plus or minus 2, 1) and (plus or minus 3, 6)\">\u003c/canvas>","options":[{"t":"`x = -3, -2, 2, 3`","why":"`g(x)` must be 1 or 6. `g(x) = 1` at `x = ±2` and `g(x) = 6` at `x = ±3`.","_n":"2w328","_k":"e0a6596f"},{"t":"`x = -2, 2`","why":"That solves `g(x) = 1` only. `g(x) = 6` gives `x = ±3` as well.","_n":"2x318","_k":"5887553c"},{"t":"`x = 1, 6`","why":"Those are the zeros of `f`: the values `g(x)` must equal.","_n":"2y308","_k":"4f30e014"},{"t":"`x = -√3, √3`","why":"Those are the zeros of `g`. But `f(0) = 6`, not 0.","_n":"2z278","_k":"02ca8cff"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"`h(x) = sin^2 x`, where `sin^2 x` means `(sin x)^2`. Which pair gives `h(x) = f(g(x))`?","options":[{"t":"`g(x) = sin x`, `f(x) = 2x`","why":"That builds `2 sin x`. The ² is a power, not a multiplier: at `x = {π}/{2}` it gives 2, not 1.","_n":"30268","_k":"45f204db"},{"t":"`g(x) = x^2`, `f(x) = sin x`","why":"That builds `sin(x^2)`, which squares `x` first. At `x = {π}/{2}`: `sin({π^2}/{4}) ≈ 0.62`, not 1.","_n":"31297","_k":"5bcdde0c"},{"t":"`g(x) = sin x`, `f(x) = x^2`","why":"`sin x` is worked out first, then squared. Check at `x = {π}/{2}`: `sin({π}/{2}) = 1`, and `1^2 = 1 = sin^2({π}/{2})`.","_n":"322a7","_k":"68dd5fcc"},{"t":"`g(x) = 2x`, `f(x) = sin x`","why":"That builds `sin 2x`. At `x = {π}/{2}`: `sin π = 0`, not 1.","_n":"332b7","_k":"3070bb6d"}]},"b":{"prompt":"`h(x) = cos^3 x`, where `cos^3 x` means `(cos x)^3`. Which pair gives `h(x) = f(g(x))`?","options":[{"t":"`g(x) = 3x`, `f(x) = cos x`","why":"That builds `cos 3x`: at `x = {π}/{3}`, `cos π = -1`, not 1/8.","_n":"342c7","_k":"3cd070a3"},{"t":"`g(x) = cos x`, `f(x) = x^3`","why":"`cos x` first, then cubed. Check at `x = {π}/{3}`: `cos({π}/{3}) = 1/2`, and `(1/2)^3 = 1/8`.","_n":"352d7","_k":"f1eefcca"},{"t":"`g(x) = cos x`, `f(x) = 3x`","why":"That builds `3 cos x`: at `x = {π}/{3}` it gives 3/2, not 1/8.","_n":"362e7","_k":"845cda1f"},{"t":"`g(x) = x^3`, `f(x) = cos x`","why":"That builds `cos(x^3)`, which cubes `x` first. At `x = {π}/{3}`: `cos({π^3}/{27}) ≈ 0.41`, not 1/8.","_n":"372f7","_k":"c6134b25"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"`f(x) = x + 1` and `g(x) = x^2`. Which statement is written correctly and is true?","options":[{"t":"`(f ∘ g)(2) = f(2) + g(2) = 3 + 4 = 7`","why":"That’s `(f + g)(2)`, a sum. Composition feeds one output into the other function.","_n":"38307","_k":"c6c00f93"},{"t":"`(f ∘ g)(2) = f(g(2)) = f(4) = 5`","why":"`(f ∘ g)(2)` means `f(g(2))`: `g` acts first, so 2 → 4 → 5.","_n":"39217","_k":"c0cd6aaf"},{"t":"`(f ∘ g)(2) = g(f(2)) = g(3) = 9`","why":"`f ∘ g` is read “f of g”: the function written on the right, `g`, acts first.","_n":"3a227","_k":"d111ac9b"},{"t":"`(f ∘ g)(2) = f(2) · g(2) = 3 × 4 = 12`","why":"The ∘ means composition, not multiplication.","_n":"3b9b8","_k":"b8ec51a0"}]},"b":{"prompt":"`f(x) = 2x` and `g(x) = x - 3`. Which statement is written correctly and is true?","options":[{"t":"`(g ∘ f)(5) = g(5) + f(5) = 2 + 10 = 12`","why":"That’s a sum, `(g + f)(5)`.","_n":"3c9a8","_k":"79c791b6"},{"t":"`(g ∘ f)(5) = g(f(5)) = g(10) = 7`","why":"`(g ∘ f)(5)` means `g(f(5))`: `f` acts first, so 5 → 10 → 7.","_n":"3d9d8","_k":"deea609f"},{"t":"`(g ∘ f)(5) = f(g(5)) = f(2) = 4`","why":"In `g ∘ f`, the function on the right, `f`, acts first.","_n":"3e9c8","_k":"e8ac15ce"},{"t":"`(g ∘ f)(5) = g(5) · f(5) = 2 × 10 = 20`","why":"The ∘ means composition, not multiplication.","_n":"3f9f8","_k":"aa5d0fd8"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"`f(x) = x^2` and `g(x) = √x`. `f(g(x))` simplifies to `x`. Which is the best explanation of the domain of `f(g(x))`?","options":[{"t":"“`{x ∈ ℝ | x > 0}`. `√0` is undefined, so 0 is excluded.”","why":"`√0 = 0` is defined, and `(√0)^2 = 0`, so 0 is in the domain.","_n":"3g9e8","_k":"c9d19746"},{"t":"“`{x ∈ ℝ | x ≥ 0}`. `g` acts first, and `√x` is defined only for `x ≥ 0`, so negative numbers never reach `f`. The simplified formula `x` hides this restriction.”","why":"This decides the domain from the machines, in order, and explains why the simplified formula misleads.","_n":"3ha18","_k":"d568838a"},{"t":"“`{x ∈ ℝ}`. The simplified formula `x` is defined for every real number.”","why":"The simplified formula forgets that `√x` acts first. `x = -4` never gets through `√x`.","_n":"3ia08","_k":"841fb161"},{"t":"“`{x ∈ ℝ | x ≥ 0}`. Squaring never gives a negative number.”","why":"The set is right, but the reason is about `f`’s outputs. `f = x^2` accepts every input; the restriction comes from `g`.","_n":"3ja38","_k":"24b16c11"}]},"b":{"prompt":"`f(x) = 2^x` and `g(x) = log_{2} x`. `f(g(x))` simplifies to `x`. Which is the best explanation of the domain of `f(g(x))`?","options":[{"t":"“`{x ∈ ℝ | x > 0}`. `g` acts first, and `log_{2} x` is defined only for `x > 0`, so 0 and negative numbers never reach `f`. The simplified formula `x` hides this restriction.”","why":"This decides the domain from the machines, in order.","_n":"3ka28","_k":"0170ae12"},{"t":"“`{x ∈ ℝ | x ≥ 0}`. `log_{2} 0 = 0`, so 0 is allowed.”","why":"`log_{2} 0` is undefined: no power of 2 equals 0.","_n":"3lb58","_k":"3e98dcf4"},{"t":"“`{x ∈ ℝ}`. The simplified formula `x` is defined for every real number.”","why":"`log_{2} x` acts first, and `log_{2}(-4)` doesn’t exist.","_n":"3mb68","_k":"8e615142"},{"t":"“`{x ∈ ℝ | x > 0}`. Powers of 2 are always positive.”","why":"The set is right, but positive powers of 2 describe `f`’s outputs. `2^x` accepts every input; the restriction comes from `g`.","_n":"3nb38","_k":"b5b680a0"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"A stone dropped in a pond makes a circular ripple. Its radius after `t` seconds is `r(t) = 20t` centimetres, and a circle of radius `r` has area `A(r) = πr^2`. After how many seconds is the area inside the ripple 3600π cm²?","options":[{"t":"3","why":"The area as a function of time is `A(r(t)) = π(20t)^2 = 400πt^2`. Set `400πt^2 = 3600π`: `t^2 = 9`, so `t` = 3 s.","_n":"3ob48","_k":"4b17d2ad"},{"t":"9","why":"That’s `t^2`. Take the square root: `t` = 3 s.","_n":"3pb18","_k":"37751eec"},{"t":"60","why":"60 cm is the radius when the area is 3600π cm². The question asks for the time: `r(t) = 60` at `t` = 3 s.","_n":"3qb28","_k":"45d78172"},{"t":"180","why":"That sets the radius `r(t) = 20t` equal to 3600, skipping the area machine `A`.","_n":"3raf8","_k":"7cc9332c"}]},"b":{"prompt":"An oil spill spreads in a circle. Its radius after `t` hours is `r(t) = 25t` metres, and a circle of radius `r` has area `A(r) = πr^2`. After how many hours is the area of the spill 10 000π m²?","options":[{"t":"4","why":"`A(r(t)) = π(25t)^2 = 625πt^2`. Set it equal to 10 000π: `t^2 = 16`, so `t` = 4 h.","_n":"3sb08","_k":"ec6e7a5d"},{"t":"16","why":"That’s `t^2`. Take the square root: `t` = 4 h.","_n":"3tad8","_k":"337c4864"},{"t":"100","why":"100 m is the radius at that moment. The question asks for the time.","_n":"3uae8","_k":"614d01b0"},{"t":"400","why":"That sets the radius `25t` equal to 10 000, skipping the area machine.","_n":"3v278","_k":"605f881c"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"`f(x) = log_{2} x` and `g(x) = 2x - 6`. Which describes the graph of `y = f(g(x))`?","options":[{"t":"Vertical asymptote `x = 3`; `x`-intercept 4","why":"The asymptote is right, but the intercept (1, 0) of `log_{2} x` was moved 3 right without the horizontal compression. Solve `2x - 6 = 1` instead.","_n":"3w268","_k":"fbb63cf0"},{"t":"Vertical asymptote `x = 0`; `x`-intercept 8","why":"That’s `g(f(x)) = 2 log_{2} x - 6`, with the linear function outside. Here it’s inside.","_n":"3x258","_k":"3aebd2e0"},{"t":"Vertical asymptote `x = 6`; `x`-intercept 13/2","why":"That reads `2x - 6` as a shift of 6. Factor first: `2x - 6 = 2(x - 3)`, so the shift is 3.","_n":"3y248","_k":"8c78db7c"},{"t":"Vertical asymptote `x = 3`; `x`-intercept 7/2","why":"`y = log_{2}(2x - 6)` needs `2x - 6 > 0`, so the asymptote is `x = 3`. The `x`-intercept is where `2x - 6 = 1`, so `x = 7/2`.","_n":"3z238","_k":"60154447"}]},"b":{"prompt":"`f(x) = log_{3} x` and `g(x) = 3x + 6`. Which describes the graph of `y = f(g(x))`?","options":[{"t":"Vertical asymptote `x = -2`; `x`-intercept −1","why":"The intercept of `log_{3} x` was moved 2 left without the compression. Solve `3x + 6 = 1`.","_n":"40228","_k":"f0ffe702"},{"t":"Vertical asymptote `x = -6`; `x`-intercept −17/3","why":"Factor first: `3x + 6 = 3(x + 2)`, so the shift is 2 left, not 6.","_n":"41218","_k":"cc6024fc"},{"t":"Vertical asymptote `x = 0`; `x`-intercept 1/9","why":"That’s `g(f(x)) = 3 log_{3} x + 6`, with the linear function outside.","_n":"42208","_k":"53fe29da"},{"t":"Vertical asymptote `x = -2`; `x`-intercept −5/3","why":"`log_{3}(3x + 6)` needs `3x + 6 > 0`, so the asymptote is `x = -2`. The `x`-intercept is where `3x + 6 = 1`: `x = -5/3`.","_n":"432f8","_k":"35c7ce86"}]}}]},"task":{"title":"Break it at 2","summary":"Break it at 2","statement":"\u003cp>Build `h(x) = f(g(x))` from an outer function `f` and a linear inner function `g(x) = mx + b`, so that `h` is \u003cstrong>undefined at `x = 2`\u003c/strong>, \u003cstrong>defined at `x = 3`\u003c/strong>, and \u003cstrong>`h(4) = 1`\u003c/strong>. There’s more than one design. Can you find them all?\u003c/p>","checks":["`h` is undefined at `x = 2`","`h` is defined at `x = 3`","`h(4) = 1`"],"tips":["Right now `h(2) = `#1. To break `h` at 2, `g(2)` must be an input `f` can’t take. #2.","`h` is undefined at 3 as well: `g(3) = `#1, which `f` can’t take. You need `x = 2` on the failing side of `f`’s domain edge and `x = 3` on the working side.","Right now `h(4) = `#1. Work backwards: which input does `f` turn into 1? Make `g(4)` equal that input."],"forbid":{"rt":"√ can’t take negatives","rc":"`1/x` can’t take 0","lg":"`log_{2}` can’t take 0 or negatives","any":"#1 accepts every number, so it can never break: choose another outer function"},"ui":{"outer":"Outer `f`:","m":"`m`","b":"`b`","undef":"undefined","inner":"inner `y = g(x)`","target":"(4, 1)"},"explainPrompt":"Explain how you chose `g` for one of your designs: how did you make `h` fail at 2 but work at 3, and how did you get `h(4) = 1`?","vocab":"Use the words inner, outer, domain and input.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"You found all three. Each one sends 4 to the input that `f` turns into 1 (1 for `√x` and `1/x`, 2 for `log_{2} x`), and puts the edge of `f`’s domain where `h` can’t reach it at 2 but can at 3. `x^2` and `2^x` can never work: they accept every input, so they never break."},"cards":[["`f(g(x))`","Put `x` into `g` first, then put `g(x)` into `f`. Work from the inside out: `f(x) = x^2`, `g(x) = x + 3` gives `f(g(2)) = f(5) = 25`."],["`(f ∘ g)(x)`","Another way to write `f(g(x))`, read “f composed with g”. The function on the right, `g`, acts first."],["Does order matter?","Usually. `f(x) = x^2`, `g(x) = x + 3`: `f(g(x)) = (x + 3)^2` but `g(f(x)) = x^2 + 3`."],["Domain of `f(g(x))`","Every `x` in the domain of `g` whose output `g(x)` is in the domain of `f`. `√{x - 3}` needs `x ≥ 3`."],["Simplify with care","`(√x)^2` simplifies to `x`, but its domain is still `{x ∈ ℝ | x ≥ 0}`. Decide the domain before you simplify."],["`√{x^2}`","Equals `x` when `x ≥ 0` and `-x` when `x \u003c 0`: never negative. `√{(-3)^2} = 3`."],["A composite from tables","Look up `x` in `g`’s table, then look up `g(x)` in `f`’s table. If `g(x)` isn’t an input in `f`’s table, `f(g(x))` is undefined there."],["A composite from graphs","Read `g(x)` on `g`’s graph, then use that number as the input on `f`’s graph. On one grid, the line `y = x` turns the output into an input."],["A function and its inverse","`f(f^{-1}(x)) = x` for every `x` in the domain of `f^{-1}`; `f^{-1}(f(x)) = x` for every `x` in the domain of `f`. Example: `2^{log_{2} x} = x` for `x > 0`, and `log_{2}(2^x) = x` for every `x`."],["Decomposing `h(x) = (2x - 5)^3`","Inner `g(x) = 2x - 5`, outer `f(x) = x^3`. Another split works too: `g(x) = 2x`, `f(x) = (x - 5)^3`."],["A linear function inside","`f(k(x - d))`: horizontal changes, the opposite way to how they look. `f(x - 4)` moves 4 units right; `f(2x)` compresses by a factor of 1/2."],["A linear function outside","`af(x) + c`: vertical changes, as they look. `3f(x) - 6` stretches vertically by a factor of 3, then moves down 6."]]}};</script>
