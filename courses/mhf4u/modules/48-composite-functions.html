.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 48: radio groups and step sliders (from MHF4U 37), hero underlines, machine strip (cf-), pipeline layout,
   table machines, Station A / B, Practice 2 figure and the task controls */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:1.6em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:38px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.cf-fn button{min-height:40px;min-width:3.2em;font:400 1.05rem var(--font-math)}
.cf-fctl .rg-wrap,.cf-tctl .rg-wrap,#bk-f .rg-wrap{flex-wrap:nowrap;align-items:flex-start}
.cf-fctl .rg-wrap .rg-lab,.cf-tctl .rg-wrap .rg-lab,#bk-f .rg-lab{padding-top:.55em;flex:0 0 auto}
.cf-fctl .rg.chips,.cf-tctl .rg.chips,#bk-f .rg.chips{flex:1 1 auto;min-width:0}
.rg button:disabled{opacity:.55}
.wt-sl{margin:0 0 6px}
.wt-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.wt-sl-top label{font-weight:700;font-size:.92rem}
.wt-sl-top output{font:600 1.15rem var(--font-math);color:var(--sc)}
.wt-sl-row{display:flex;align-items:center;gap:8px}
.wt-pm{min-width:40px;min-height:40px;padding:0;font-size:1.25rem;line-height:1}
.wt-sl input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;cursor:pointer}
.wt-sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.wt-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc);margin-top:-8px}
.wt-sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.wt-sl input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc)}
.wt-sl input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.wt-sl input[type=range]:disabled{opacity:.45;cursor:default}

/* hero */
.hero .hero-eq.md{font-size:clamp(2rem,5.4vw,3.6rem)}
.cf-uf{border-bottom:.07em solid var(--pen)}
.cf-ug{border-bottom:.07em solid var(--f3);margin-bottom:-.07em}
.cf-hero{display:grid;gap:10px}
.cf-hs .cf-mach{opacity:0;transition:opacity .5s}
.cf-hs.on .cf-mach{opacity:1}
.cf-hs .cf-mach{flex:0 1 96px;min-width:74px;padding:4px 6px}
.cf-hs .cf-io{min-width:52px}
.hero-fig figcaption{font-size:1.1rem}
.cf-hc{display:block;min-height:1.4em}
.cf-hfin{font-family:var(--font-ui);font-size:1rem;margin-top:4px}

/* machine strip */
.cf-strip{position:relative;margin:4px 0 10px}
.cf-sline{display:flex;align-items:center;justify-content:center;gap:6px}
.cf-io{flex:0 0 auto;min-width:62px;text-align:center;border:1.5px solid var(--rule);border-radius:8px;padding:3px 8px;background:var(--paper);line-height:1.25}
.cf-io small{display:block;font-size:.74rem;color:var(--ink-2)}
.cf-io b{font:400 1.15rem var(--font-math)}
.cf-io .m,.cf-mfront .m,.cf-mf .m{white-space:normal}
.cf-arr{flex:0 0 auto;width:22px;height:2px;background:var(--ink-2);position:relative}
.cf-arr::after{content:"";position:absolute;right:-2px;top:-5px;border-style:solid;border-width:6px 0 6px 8px;border-color:transparent transparent transparent var(--ink-2)}
.cf-mach{flex:0 1 230px;min-width:96px;border:3px solid var(--pen);border-radius:10px;padding:5px 10px;background:var(--sheet);text-align:center;position:relative;z-index:1;line-height:1.3}
.cf-c-g{border-color:var(--f3)}
.cf-c-f{border-color:var(--pen)}
.cf-c-fi{border-color:var(--pen);border-style:dashed}
.cf-mn{display:block;font:italic 600 .95rem var(--font-math);color:var(--ink-2)}
.cf-mf{display:block;font:400 1.15rem var(--font-math)}
.cf-mfront{display:block;font-size:.9rem;min-height:1.35em;overflow-wrap:anywhere}
.cf-mach.cf-rej{border-color:var(--red)}
.cf-rejm{color:var(--red);font-weight:700}
.cf-ball{position:absolute;left:0;top:0;min-width:32px;height:32px;padding:0 7px;border-radius:999px;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font:600 .95rem var(--font-math);z-index:3;pointer-events:none;white-space:nowrap}
.cf-ball .m{color:var(--hi-ink)}
@media (max-width:400px){
  .cf-strip .cf-sline{flex-direction:column;gap:4px}
  .cf-strip .cf-arr{width:2px;height:16px}
  .cf-strip .cf-arr::after{right:auto;left:-5px;top:auto;bottom:-2px;border-width:8px 6px 0 6px;border-color:var(--ink-2) transparent transparent transparent}
  .cf-strip .cf-mach{flex:0 0 auto;width:100%;max-width:280px}
  .cf-hs .cf-mach{max-width:200px}
}

/* pipeline layout */
.cf-ex{position:relative}
.cf-ctl{display:grid;gap:8px;margin-bottom:12px}
.cf-fctl,.cf-tctl{display:grid;gap:8px}
.cf-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cf-ex.is-table .cf-fctl,.cf-ex.is-formula .cf-tctl{display:none}
.cf-ex.is-table #cf-run,.cf-ex.is-table #cf-trace,.cf-ex.is-formula #cf-fill{display:none}
.cf-tog{min-height:40px}
.cf-tog[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cf-cap{font-size:clamp(1.3rem,3.2vw,1.9rem);text-align:center}
.cf-stage .banner{text-align:center}
.cf-runrow{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;margin:4px 0 14px}
.cf-inwrap{flex:1 1 260px;min-width:0}
.cf-btns{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
.cf-btns .btn{min-height:40px}
.cf-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.cf-look{position:relative;min-width:0}
.cf-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cf-gcap{margin:0 0 4px;font-size:.92rem;text-align:center;font-weight:700}
.cf-one{max-width:520px;margin:0 auto}
.cf-ex.v-two .cf-one,.cf-ex.v-one .cf-two,.cf-ex.is-table .cf-two,.cf-ex.is-table .cf-one,.cf-ex.is-formula .cf-tables{display:none}
.cf-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem;margin:6px 0 0;max-width:none}
.cf-legend > span{display:inline-flex;align-items:center;gap:6px}
.cf-sw{display:inline-block;width:26px;height:4px;border-radius:2px}
.cf-sw-ink{background:var(--ink)}
.cf-sw-dash{background:repeating-linear-gradient(90deg,var(--ink) 0 9px,transparent 9px 14px)}
.cf-vchip{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);border-radius:999px;padding:1px 9px;font:600 1rem var(--font-math);z-index:4;pointer-events:none;white-space:nowrap}
.cf-vchip .m{color:var(--hi-ink)}
.cf-read .read > div.cf-flash{background:var(--hi-soft);border-radius:6px;padding-left:6px;padding-right:6px}
.cf-morebtn{display:none;margin-top:8px}
@media (max-width:820px){ .cf-main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  .cf-morebtn{display:inline-block}
  .cf-read:not(.open) .read > div.cf-extra{display:none}
}
@media (max-width:560px){ .cf-two{grid-template-columns:minmax(0,1fr)} }

/* table machines */
.cf-tables{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cf-tw{min-width:0}
.cf-tt{border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.cf-tr{display:grid;grid-template-columns:1fr 1fr;width:100%;border:0;border-top:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:0;min-height:38px;align-items:center;text-align:center;font:400 1.05rem var(--font-math)}
.cf-tr > span + span{border-left:1px solid var(--rule)}
.cf-tr.hd{background:var(--paper);border-top:0;min-height:32px;font-size:.95rem}
button.cf-tr:not(:disabled):hover{background:var(--hi-soft)}
.cf-tr.on{background:var(--hi-soft)}
.cf-notin{color:var(--red);font-weight:700;font-size:.85rem}
.cf-shake{animation:cfshake .45s}
@keyframes cfshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (max-width:560px){ .cf-tables{grid-template-columns:minmax(0,1fr)} }

/* TC3 commit chips */
.cf-commit{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-weight:400}
.cf-cl{font-weight:700}
.cf-cchips{display:inline-flex;flex-wrap:wrap;gap:6px}
.cf-cchips .chip{min-height:36px;font-family:var(--font-ui);font-weight:400}
.cf-commit .chip.on{font-weight:700}
.cf-pnote{font-size:.875rem;font-weight:400;color:var(--ink-2)}
.cf-cnote{font-weight:400}
.cf-cnote{flex-basis:100%}

/* Part 3 */
.cf-h3{font-size:1.25rem}
.cf-station.part{margin-top:34px}
.cf-sa,.cf-sb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.cf-sa-l,.cf-sa-r,.cf-sb-l,.cf-sb-r{min-width:0}
.cf-sa{grid-template-areas:"g c" "t c"}
.cf-sa-l{grid-area:g}.cf-sa-r{grid-area:c;display:grid;gap:10px}.cf-sa .cf-tgt{grid-area:t;margin-top:4px}
.cf-mini{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;min-height:44px}
.cf-mx{font:400 1.2rem var(--font-math)}
.cf-box{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:3px 10px;background:var(--sheet);font:400 1.05rem var(--font-math);position:relative;z-index:1}
.cf-box.cf-L{border-style:dashed}
.cf-mini .cf-arr{width:18px}
.cf-tgt{margin-top:18px}
#sa-tcard{margin-top:10px}
.cf-hbig{font:400 clamp(1.4rem,3.4vw,2rem) var(--font-math);margin:4px 0 12px;max-width:none}
.cf-hbig .m{white-space:normal}
.cf-ul{border-bottom:3px solid var(--f3)}
.cf-cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cf-card{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.cf-card.on{border-color:var(--ink);background:var(--hi-soft)}
.cf-card.tested{box-shadow:0 0 0 2px var(--pen)}
.cf-cardt{margin:0 0 8px;max-width:none}
.cf-cardt .m{white-space:normal}
.cf-cardb{display:flex;flex-wrap:wrap;gap:6px}
.cf-cardb .btn{min-height:40px}
.cf-mini2 .cf-sline{flex-wrap:wrap}
.cf-mini2 .cf-mach{flex:1 1 120px;min-width:0}
.cf-mini2 .cf-mf{font-size:1rem}
#sb-sel{margin-bottom:10px}
@media (max-width:820px){ .cf-sa,.cf-sb{grid-template-columns:minmax(0,1fr)} .cf-sa{grid-template-areas:"g" "c" "t"} }
@media (max-width:560px){ .cf-cards{grid-template-columns:minmax(0,1fr)} }

/* Practice 2 figure and fill-in boxes */
.cf-p2fig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:14px 24px;align-items:center;margin:6px 0 8px}
.cf-p2g canvas.plot{max-width:320px}
.cf-bx{width:5.2rem}
.cf-gx{font-size:1.15rem}
@media (max-width:640px){ .cf-p2fig{grid-template-columns:minmax(0,1fr)} }

/* task */

"group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"0d96a0e4","content":{"id":"48-composite-functions","kind":"topic","title":"Composite functions","topic":"Composite Functions","readyTopic":"composite functions","hero":{"eq":"\u003cspan class=\"m\">(\u003ci>f\u003c/i> ∘ \u003ci>g\u003c/i>)(\u003ci>x\u003c/i>) = \u003cspan class=\"cf-uf\">\u003ci>f\u003c/i>(\u003c/span>\u003cspan class=\"cf-ug\">\u003ci>g\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>\u003cspan class=\"cf-uf\">)\u003c/span>\u003c/span>","eqLabel":"f composed with g of x equals f of g of x","eqSize":"md","headline":"One function’s output is the next one’s input","text":"A \u003cstrong>composite function\u003c/strong> runs two functions one after the other, like two machines on an assembly line. In `f(g(x))`, the \u003cstrong>inner\u003c/strong> function `g` acts first, and the \u003cstrong>outer\u003c/strong> function `f` acts on what comes out. Change the order and you usually get a different function. And a number only makes it through if \u003cstrong>both\u003c/strong> machines can accept it, which is what decides the \u003cstrong>domain\u003c/strong> of the composite.","caps":["`f(g(2)) = f(3) = 9`","`g(f(2)) = g(4) = 5`","Same two functions, different order: `f(g(x)) ≠ g(f(x))`"],"fig":{"html":"\u003cdiv class=\"cf-hero\">\u003cdiv class=\"cf-strip cf-hs\" id=\"cf-hstrip\" aria-hidden=\"true\">\u003c/div>\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"Two machines, g adds 1 and f squares. The input 2 becomes 3, then 9, so f of g of 2 is 9, on the curve y = (x + 1) squared. Swapped, 2 becomes 4, then 5, on the dashed curve y = x squared + 1.\">\u003c/canvas>\u003c/div>"}},"goals":["I can evaluate a composite such as `f(g(3))` from equations, tables and graphs, working from the inside out, and work backwards to find an input.","I can find the equation of `f(g(x))` and `g(f(x))` by substitution and show that, in general, `f(g(x)) ≠ g(f(x))`.","I can find the domain and range of a composite function, including restrictions that a simplified formula hides.","I can decompose a function into an inner and an outer function, `h(x) = f(g(x))`, in more than one way.","I can explain why a function composed with its inverse gives back the input, and on which domain.","I can describe a transformation as a composition with a linear function: inside changes are horizontal, outside changes are vertical, and I can use composition to solve problems in context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Function notation","goal":1,"prompt":"`f(x) = x^2 - 3x`. What is `f(-2)`?","options":[{"t":"−10","why":"`(-2)^2 = (-2)(-2) = +4`, and `-3 × (-2) = +6`. So `f(-2) = 4 + 6 = 10`.","_n":"030e","_k":"7026940c"},{"t":"−2","why":"A negative times a negative is positive: `-3 × (-2) = +6`, so `4 + 6 = 10`.","_n":"12de","_k":"d746b3ba"},{"t":"2","why":"`(-2)^2` means `(-2)(-2) = 4`. Writing `-2^2` without brackets is what gives −4.","_n":"22ee","_k":"3dc68f00"},{"t":"10","why":"Replace `x` with (−2): `(-2)^2 - 3(-2) = 4 + 6 = 10`.","_n":"333e","_k":"47703a93"}],"hints":["Put (−2) in brackets everywhere you see `x`.","`f(-2) = (-2)^2 - 3(-2)`.","`(-2)^2 = 4` and `-3(-2) = 6`, so `f(-2) = 10`."]},{"id":"w2","skill":"Function notation","goal":2,"prompt":"`f(x) = 2x^2 + 1`. Which expression equals `f(x + 3)`?","options":[{"t":"`2x^2 + 19`","why":"`(x + 3)^2 = x^2 + 6x + 9`: the middle term `6x` comes from `2 × 3x`. Check with `x = 1`: `f(4) = 33`, but `2 + 19 = 21`.","_n":"434e","_k":"39c59084"},{"t":"`2x^2 + 12x + 19`","why":"Replace `x` with `(x + 3)`: `2(x + 3)^2 + 1 = 2(x^2 + 6x + 9) + 1 = 2x^2 + 12x + 19`. Check with `x = 1`: `f(4) = 33`, and `2 + 12 + 19 = 33`.","_n":"531e","_k":"403ce733"},{"t":"`2x^2 + 4`","why":"`f(x + 3)` changes the \u003cstrong>input\u003c/strong>: every `x` becomes `x + 3`. `f(x) + 3` would add 3 to the output instead. Check with `x = 1`: 33, not 6.","_n":"632e","_k":"f8b1198c"},{"t":"`2x^2 + 6x + 10`","why":"The 2 multiplies the whole bracket: `2(x^2 + 6x + 9) = 2x^2 + 12x + 18`. Check with `x = 1`: 33, not 18.","_n":"737e","_k":"b011b340"}],"hints":["Replace every `x` in `f` with `(x + 3)`, brackets included.","`f(x + 3) = 2(x + 3)^2 + 1`. Expand `(x + 3)^2` first.","`(x + 3)^2 = x^2 + 6x + 9`, so `2(x^2 + 6x + 9) + 1 = 2x^2 + 12x + 19`."]},{"id":"w3","skill":"Domain and range","goal":3,"prompt":"What is the domain of `y = √{x - 4}`?","options":[{"t":"`{x ∈ ℝ | x ≥ -4}`","why":"Try `x = 0`: `√{0 - 4} = √{-4}` isn’t real. `x - 4 ≥ 0` gives `x ≥ 4`.","_n":"838e","_k":"486bcbfc"},{"t":"`{x ∈ ℝ | x ≥ 4}`","why":"The expression under the root must not be negative: `x - 4 ≥ 0`, so `x ≥ 4`. At `x = 4` the root is `√0 = 0`, which is fine.","_n":"9bc1","_k":"211e4c6e"},{"t":"`{x ∈ ℝ | x > 4}`","why":"`√0 = 0` is a real number, so `x = 4` is allowed.","_n":"abb1","_k":"9db5c45c"},{"t":"`{x ∈ ℝ | x ≥ 0}`","why":"That’s the domain of `√x`. Here the input to the root is `x - 4`, and it must be at least 0.","_n":"bbe1","_k":"d915139c"}],"hints":["What must be true about the number under a square root?","`x - 4 ≥ 0`.","`x ≥ 4`, so the domain is `{x ∈ ℝ | x ≥ 4}`."]},{"id":"w4","skill":"Domain and range","goal":3,"prompt":"What is the range of `y = x^2 + 1`?","options":[{"t":"`{y ∈ ℝ}`","why":"Every `x` is allowed (that’s the domain), but the outputs never go below 1.","_n":"cbd1","_k":"986fd918"},{"t":"`{y ∈ ℝ | y ≥ 0}`","why":"The + 1 lifts every output by 1. `y = 0` would need `x^2 = -1`.","_n":"dc01","_k":"bfbd506c"},{"t":"`{y ∈ ℝ | y > 1}`","why":"`x = 0` gives `y = 1`, so 1 is in the range.","_n":"ebf1","_k":"a19c417c"},{"t":"`{y ∈ ℝ | y ≥ 1}`","why":"`x^2` is never negative, so `x^2 + 1` is never less than 1, and `x = 0` gives exactly 1. Every larger value is reached too.","_n":"fc21","_k":"19c2fa43"}],"hints":["What’s the smallest value `x^2` can take?","`x^2 ≥ 0`, with `x^2 = 0` at `x = 0`.","So `x^2 + 1 ≥ 1`, and 1 is reached at `x = 0`: the range is `{y ∈ ℝ | y ≥ 1}`."]},{"id":"w5","skill":"Inverse functions","goal":5,"prompt":"`f(x) = {x + 4}/{2}`. What is `f^{-1}(x)`?","options":[{"t":"`2x + 4`","why":"To undo “add 4” you subtract 4. Check: `f(6) = 5`, but `2(5) + 4 = 14`, not 6.","_n":"gc11","_k":"6ef61bfe"},{"t":"`2x - 8`","why":"`f` added 4 first, so the inverse must undo that \u003cstrong>last\u003c/strong>. Check: `f(6) = 5`, but `2(5) - 8 = 2`.","_n":"hb41","_k":"5792a1bf"},{"t":"`2x - 4`","why":"`f` adds 4, then halves. The inverse undoes those steps in reverse order: double, then subtract 4. Check: `f(6) = 5`, and `2(5) - 4 = 6`.","_n":"ib31","_k":"ee2814ee"},{"t":"`{2}/{x + 4}`","why":"That’s `1/f(x)`. The −1 in `f^{-1}` means “undo”, not “one over”. Check: `f(6) = 5`, but `{2}/{5 + 4} = {2}/{9}`.","_n":"j2a1","_k":"4bec3ed0"}],"hints":["Write `y = {x + 4}/{2}`, swap `x` and `y`, then solve for `y`.","`x = {y + 4}/{2}`, so `2x = y + 4`.","`y = 2x - 4`, so `f^{-1}(x) = 2x - 4`."]},{"id":"w6","skill":"Transformations","goal":6,"prompt":"How does the graph of `y = f(2x)` compare with the graph of `y = f(x)`?","options":[{"t":"A vertical compression by a factor of 1/2","why":"Nothing outside `f` changed, so the `y`-values aren’t scaled. The `x`-values are halved.","_n":"k2b1","_k":"81f7103a"},{"t":"A horizontal compression by a factor of 1/2","why":"`f(2x)` reaches each output at half the `x`-value: the point `(4, f(4))` on `y = f(x)` becomes `(2, f(4))`. Every `x`-coordinate is halved.","_n":"l2c1","_k":"da668f37"},{"t":"A vertical stretch by a factor of 2","why":"That’s `2f(x)`, with the 2 outside. Inside, the 2 changes the `x`-values.","_n":"m2d1","_k":"2927525a"},{"t":"A horizontal stretch by a factor of 2","why":"Inside the brackets the effect is reversed: multiplying `x` by 2 gets to each output twice as fast, so the graph squeezes toward the `y`-axis.","_n":"n2e1","_k":"af93b4c8"}],"hints":["Is the 2 inside the brackets (acting on `x`) or outside (acting on `f(x)`)?","Inside, so the change is horizontal. Which `x` gives the same output as `x = 4` did before?","`f(2 · 2) = f(4)`, so the point at `x = 4` moves to `x = 2`: a horizontal compression by a factor of 1/2."]}],"refreshers":{"Function notation":"`f(a)` means “replace every `x` in `f`’s formula with `a`”, in brackets. With `f(x) = x^2 - 3x`: `f(-2) = (-2)^2 - 3(-2) = 10`. The same works for expressions: `f(x + 3)` replaces every `x` with `(x + 3)`, so for `f(x) = 2x^2 + 1` it’s `2(x + 3)^2 + 1 = 2x^2 + 12x + 19`. Check by trying a number.","Domain and range":"The domain is every input the formula accepts. Watch for three things: a square root needs a non-negative number (`√{x - 4}` needs `x ≥ 4`), a fraction can’t have 0 on the bottom, and a logarithm needs a positive input. The range is every output: `x^2 + 1` is never below 1, so its range is `{y ∈ ℝ | y ≥ 1}`.","Inverse functions":"`f^{-1}` undoes `f`. To find it, swap `x` and `y` and solve for `y`, or undo the steps in reverse order. `f(x) = {x + 4}/{2}` adds 4 then halves, so `f^{-1}(x) = 2x - 4` doubles then subtracts 4. Check: `f(6) = 5` and `f^{-1}(5) = 6`. `f^{-1}` is not `1/f`.","Transformations":"In `y = af(k(x - d)) + c`, the numbers outside `f` (`a` and `c`) change the graph vertically, as you’d expect. The numbers inside (`k` and `d`) change it horizontally, and the opposite way to how they look: `f(2x)` compresses horizontally by a factor of 1/2, and `f(x - 4)` moves 4 units right."}}},"explore":{"heading":"The two-machine pipeline","intro":"Pick two functions and send a number through them, one after the other. Watch the output of the first machine become the input of the second, on the machines, on the graphs and in the tables. Then swap the order and see what changes.","predictions":[{"id":"p1","start":{"mode":"formula","f":"sq","g":"p3","order":"fg","x":2,"view":"two","ran":true},"prompt":"`f(g(2)) = 25`. Now the two machines will swap places. What will `g(f(2))` be?","options":[{"t":"7","_n":"o2f1","_k":"a19cce6d"},{"t":"9","_n":"p301","_k":"46122bd0"},{"t":"20","_n":"q311","_k":"b4a06b20"},{"t":"25","_n":"r321","_k":"6b7424f4"}],"explain":"With `f` first, 2 becomes `2^2 = 4`, then `4 + 3 = 7`. The two orders give different functions: `f(g(x)) = (x + 3)^2` and `g(f(x)) = x^2 + 3`. Their graphs meet only where `(x + 3)^2 = x^2 + 3`, which is `6x + 9 = 3`, so `x = -1`. (9 is `f(2) + g(2) = 4 + 5`, a sum; 20 is `f(2) × g(2) = 4 × 5`, a product; 25 assumes the order doesn’t matter.)"},{"id":"p2","start":{"mode":"formula","f":"rt","g":"m3","order":"fg","x":7,"view":"one"},"prompt":"The trace will draw `f(g(x)) = √{x - 3}` from left to right. Where will the curve begin?","options":[{"t":"At (3, 0)","_n":"s331","_k":"469d2baf"},{"t":"At (−3, 0)","_n":"t301","_k":"f5963f8c"},{"t":"At (0, 0)","_n":"u2f1","_k":"1b9a367c"},{"t":"At (0, −3)","_n":"v2e1","_k":"8510a790"}],"explain":"√ only accepts inputs that are 0 or more, so `g(x) = x - 3` must be at least 0: `x ≥ 3`. The inner function decided where the composite starts. It moved the graph of `√x` 3 units \u003cstrong>right\u003c/strong>, even though the formula says “− 3”. ((−3, 0) is the shift the wrong way; (0, 0) is where `√x` itself starts; (0, −3) is where `√x - 3` starts, which is `g(f(x))`.)"},{"id":"p3","start":{"mode":"formula","f":"ex","g":"lg","order":"fg","x":4,"view":"one"},"prompt":"`2^x` and `log_{2} x` are inverses. The trace will draw `f(g(x)) = 2^{log_{2} x}`. What will it look like?","options":[{"t":"The horizontal line `y = 1`","_n":"w2d1","_k":"7fc9731c"},{"t":"The curve `y = 2^x`","_n":"x341","_k":"bc996cdc"},{"t":"Part of the line `y = x`: only for `x > 0`","_n":"y331","_k":"4a4d9a41"},{"t":"The whole line `y = x`","_n":"z321","_k":"1484f11c"}],"explain":"Each function undoes the other, so every input comes back unchanged: `2^{log_{2} x} = x`. But `log_{2}` acts first here, and it only accepts `x > 0`, so the composite is the line `y = x` for `x > 0` only. In the other order, `2^x` acts first and accepts every number, so `log_{2}(2^x) = x` for every `x`. A function composed with its inverse gives back the input, on the domain of the function that acts first. (It’s never the line `y = 1`: `f^{-1}` isn’t `1/f`.)"},{"id":"p4","start":{"mode":"formula","f":"rt","g":"sq","order":"fg","x":4,"view":"one","traced":[0,9]},"prompt":"For `x ≥ 0`, `√{x^2}` matched the line `y = x`. The trace will now continue from `x = 0` down to `x = -5`. What will the curve do?","options":[{"t":"Rise to the left, along the line `y = -x`","_n":"10311","_k":"2a4e275d"},{"t":"Follow the parabola `y = x^2`","_n":"11381","_k":"ea408daa"},{"t":"Continue along `y = x`, below the `x`-axis","_n":"12371","_k":"9171eb92"},{"t":"Stop: `√{x^2}` is undefined for `x \u003c 0`","_n":"132e2","_k":"7cbde33f"}],"explain":"Squaring makes −3 into 9, and `√9 = 3`, the \u003cstrong>non-negative\u003c/strong> root. So `√{(-3)^2} = 3`, not −3. `√{x^2}` equals `x` when `x ≥ 0` and `-x` when `x \u003c 0`: squaring and square-rooting undo each other only for `x ≥ 0`. (It isn’t undefined: `x^2` is never negative, so √ always accepts it.)"}],"chalIntro":"Set the pipeline, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Table machines, with `f` outside and `g` inside. Send the row whose final output is 4.","why":"`g(1) = -1` and `f(-1) = 4`, so `f(g(1)) = 4`. Working backwards: `f` turns −1 into 4, and `g` turns 1 into −1.","msgs":{"mode":"Switch to Table machines first.","pair":"Set the outer machine to `f` and the inner machine to `g`.","swapped":"That’s `g(f(x))`. Put `f` outside and `g` inside.","none":"Send a row first: tap a row of the inner table.","rowM1":"That row gives `f(g(-1)) = f(1) = 0`. You may have found where `f` gives 4, which is `f(-1)`. But −1 has to come \u003cstrong>out of\u003c/strong> `g`: which `x` has `g(x) = -1`?","row3":"`g(3) = 5`, and 5 isn’t an input in `f`’s table, so `f(g(3))` doesn’t exist.","other":"That row gives `f(g(#1)) = #2`. Work backwards: which input does `f` turn into 4?"},"hints":["Work backwards from the end: which input does `f` turn into 4?","`f(-1) = 4`. So you need `g(x) = -1`.","`g(1) = -1`, so send `x = 1`: `f(g(1)) = f(-1) = 4`."]},{"id":"tc2","goal":3,"prompt":"Formula machines. Choose `f`, `g` and the order so that the composite’s domain is exactly `{x ∈ ℝ | x ≥ 1}`. \u003cspan class=\"cf-pnote\">(The readout hides its Domain rows until you meet this challenge. The trace still works.)\u003c/span>","why":"`log_{2} x ≥ 0` exactly when `x ≥ 1`, because `log_{2} 1 = 0`. So `√{log_{2} x}` has domain `{x ∈ ℝ | x ≥ 1}`.","msgs":{"mode":"Switch to Formula machines first.","lglg":"So close. Its domain is `x > 1`: at `x = 1`, `log_{2} 1 = 0`, and `log_{2} 0` is undefined. Which outer machine accepts 0?","rtm3":"Its domain is `x ≥ 3`. You need the edge at 1, not 3. None of the shifts puts it there.","lgout":"Its domain is `x > 0`: the outer machine accepts every output of `log_{2} x` (or of `√x`). You need an outer machine that rejects some of them.","other":"Your composite’s domain is #1. You need a first machine whose output is 0 or more exactly when `x ≥ 1`."},"hints":["“≥” means the edge, `x = 1`, is included. Which machine accepts 0 but rejects negatives?","`√x` needs an input of 0 or more. So you need an inner machine whose output is 0 or more exactly when `x ≥ 1`.","`log_{2} x ≥ 0` exactly when `x ≥ 1`, because `log_{2} 1 = 0`. So `f = √x`, `g = log_{2} x`, order `f(g(x))`: `√{log_{2} x}`."]},{"id":"tc3","goal":2,"stretch":true,"prompt":"Commit, then trace. Find two \u003cstrong>different\u003c/strong> machines `f` and `g` whose composites in both orders draw \u003cstrong>exactly the same graph\u003c/strong>: the same outputs, and undefined at the same inputs.\u003cdiv class=\"cf-commit\" data-cf-commit>\u003c/div>","why":"Both orders give the same output wherever either is defined. The three pairs that work are {`x + 3`, `x - 3`}, {`x^2`, `1/x`} and {`√x`, `1/x`}.","commit":{"label":"Before you check:","match":"I think the traces will match","differ":"I think they’ll differ","need":"Choose one before you check. (It’s recorded, not scored.)","said":"You said: #1."},"msgs":{"mode":"Switch to Formula machines first.","explog":"These are inverses, so both orders give back `x` wherever they’re defined. But `2^{log_{2} x}` exists only for `x > 0`, while `log_{2}(2^x)` exists for every `x`: one graph is half a line, the other the whole line.","sqrt":"`√{x^2}` is a V defined for every `x`; `(√x)^2` is the line `y = x` for `x ≥ 0` only. Different graphs.","shiftsq":"`(x + 3)^2` and `x^2 + 3` (or `(x - 3)^2` and `x^2 - 3`) meet at just one point. A shift and a square don’t commute.","same":"Choose two different machines.","other":"Compare the two traces where they separate: at that `x`, the outputs differ, or one exists and the other doesn’t."},"hints":["Both orders must give the same output at every input, and be undefined at the same inputs. Inverse pairs are tempting, but check their domains.","Look for two machines that don’t interfere with each other: a shift up and a shift down, or a reciprocal together with a power.","`x + 3` with `x - 3`: both orders give `x` for every `x`. `1/x` with `x^2`: `(1/x)^2 = 1/x^2` for `x ≠ 0`. `1/x` with `√x`: `√{1/x} = 1/√x` for `x > 0`."]}],"ui":{"modes":["Formula machines","Table machines"],"orders":["`f(g(x))`","`g(f(x))`"],"views":["Two graphs","One graph"],"both":"Both orders","run":"Run","trace":"Trace","stop":"Stop","reset":"Reset","fill":"Fill the table","input":"Input `x`","outer":"outer:","inner":"inner:","more":"More","less":"Less","rows":{"order":"Order","input":"Input","m1":"First machine","m2":"Second machine","result":"Result","other":"Other order","comp":"Composite","dom":"Domain","why":"Why this domain","range":"Range","l1":"First lookup","l2":"Second lookup","ctab":"Composite table","pattern":"Pattern"},"hiddenDom":"Hidden while challenge 2 is open.","pattern":"Every input comes back unchanged: `#1 = x` for each `x` in #2’s table.","tableNone":"Tap a row of the inner table to send it.","notInput":"not an input","inLab":"input","outLab":"output","stripLab":"Machine strip","table":"table","innerG":"Inner:","outerG":"Outer:","innerT":"Inner:","outerT":"Outer:","compT":"Composite","why":{"rt":"is not a real number","rc":"is undefined","lg0":"is undefined (no power of 2 equals 0)","lgn":"is undefined (every power of 2 is positive)"},"is":"is","big":"more than 1 000 000","bigNeg":"less than −1 000 000","undefTail":": undefined","actsFirst":"#1 acts first, then #2","notIn":"#1 is not in the domain of #2.","isUndef":"is undefined: #1 is not in the domain of #2.","lgsqNote":"(not `2 log_{2} x`, which needs `x > 0`)","why1":"#1 needs #2.","why1all":"#1 accepts every `x`.","why2all":"#1 accepts every real number, so nothing more is removed.","why2":"#1 needs #2, and #3.","tOrder":"look up #1 in #2’s table, then look up #3 in #4’s table","tMiss":"#1 isn’t an input in #2’s table, so #3 is undefined.","tHit":"#1, so #2","tDef":"#1 is defined for #2 (#3 of #4 rows).","tDefSoFar":"#1 is defined for #2 (#3 of #4 rows so far).","noRows":"none of the rows sent so far","sendLab":"Send x = #1 (#2)","cant":"✗ can’t accept #1","notes":{"inner":{"rt":"√x needs x ≥ 0","rc":"1/x needs x ≠ 0","lg":"log_{2} x needs x > 0"},"outer":{"rt":"#1(x) is negative: √ can’t accept it","rc":"#1(x) = 0: 1/x can’t accept it","lg":"#1(x) ≤ 0: log_{2} can’t accept it"}}},"blocks":[{"title":"What the pipeline shows","html":"\u003cp>\u003cstrong>Composite functions\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>`f(g(x)) = (f ∘ g)(x)`:\u003c/strong> `g` acts first, then `f`. Work from the inside out.\u003c/li>\u003cli>\u003cstrong>Order:\u003c/strong> `f(g(x))` and `g(f(x))` are usually different.\u003c/li>\u003cli>\u003cstrong>Domain of `f(g(x))`:\u003c/strong> every `x` in the domain of `g` whose output `g(x)` is in the domain of `f`. Decide it \u003cstrong>before\u003c/strong> you simplify.\u003c/li>\u003cli>\u003cstrong>Inverses:\u003c/strong> `f(f^{-1}(x)) = x` for every `x` in the domain of `f^{-1}`, and `f^{-1}(f(x)) = x` for every `x` in the domain of `f`.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"decompose","name":"Decompose","heading":"Inside and outside: decompose it","intro":"A linear function can sit inside another function or outside it, and that decides whether the graph moves sideways or up and down. Then take finished functions apart: find every inner and outer pair that builds them.","stationA":{"title":"Station A: Linear inside or outside","ui":{"parent":"Parent `f`:","A":"`A` in `L(x) = A(x + B)`","B":"`B`","pos":["Inside: `y = f(L(x))`","Outside: `y = L(f(x))`"],"keys":"Key points","rows":{"comp":"Composite","std":"Standard form","what":"What happens","key":"Key point","dom":"Domain","range":"Range"},"targets":"Targets","check":"Check target","met":"✓ Target met.","notYet":"✗ Not yet.","tally":"#1 of 3 targets on the first try","found":"Found: #1","intro":"Pick a target. Set the controls until your graph lies on the faint target curve through the three ringed points, then press \u003cstrong>Check target\u003c/strong>.","with":"with","tName":"Target","inW":"inside","outW":"outside","notFirst":"(not first try)","unfinished":"(unfinished)","sumLine":"Station A targets (first try): #1/3","parentFirst":"This target starts from #1. Choose that parent first.","what":{"reflY":"reflection in the `y`-axis","hStr":"horizontal stretch by a factor of #1","hComp":"horizontal compression by a factor of #1","left":"a translation #1 #2 left","right":"a translation #1 #2 right","reflX":"reflection in the `x`-axis","vStr":"vertical stretch by a factor of #1","vComp":"vertical compression by a factor of #1","up":"a translation #1 #2 up","down":"a translation #1 #2 down","unit":"unit","units":"units","then":", then ","none":"No change"}},"targets":[{"id":"S1","parent":"rt","prompt":"Turn `y = √x` into the target `y = √{2x + 6}`.","_a":"az8bXw8SSQYcV2Rr","named":[{"pos":"in","A":2,"B":6,"fb":"You shifted 6 units left. Factor the 2 out first: `2x + 6 = 2(x + 3)`, so the shift is 3."},{"pos":"in","A":1,"B":3,"fb":"Right shift amount, but the target is also compressed: it reaches height 2 at `x = -1`, not `x = 1`."},{"pos":"out","A":2,"B":3,"fb":"Outside, `L` changes the outputs: your graph starts at (0, 6). The target starts at (−3, 0), so the change is horizontal: put `L` inside."}],"hints":["The target starts at (−3, 0) instead of (0, 0): is that a horizontal or a vertical change?","Horizontal, so `L` goes inside. Factor: `2x + 6 = 2(x + 3)`.","Inside, `A = 2`, `B = 3`: compress by a factor of 1/2, then move 3 left."]},{"id":"S2","parent":"ex","prompt":"Turn `y = 2^x` into the target `y = 2^{x + 1}`. There are \u003cstrong>two\u003c/strong> different settings that work. Find both.","_a":"az8bXw8SSQUcVWQaOhIKQURGFQRNADhp","named":[{"pos":"in","A":1,"B":-1,"fb":"That’s 1 unit right. `2^{x + 1}` reaches each height one step \u003cstrong>sooner\u003c/strong>: left."},{"pos":"out","A":1,"B":1,"fb":"That moves the graph up 1. The target still approaches 0 on the left, so its asymptote hasn’t moved."}],"again":"You’ve found that one. The other uses the other position.","oneMore":"One found. Now find the other setting and press \u003cstrong>Check target\u003c/strong> again.","both":"`2^{x + 1} = 2 · 2^x`. For an exponential, moving 1 unit left and stretching vertically by 2 give exactly the same graph. Two different compositions, one function.","hints":["Exponent law: `2^{x + 1} = 2^1 · 2^x`.","So the target is `2^x` moved 1 left, \u003cstrong>and\u003c/strong> it is `2^x` stretched vertically by 2.","Inside `A = 1`, `B = 1` gives `2^{x + 1}`; outside `A = 2`, `B = 0` gives `2 · 2^x`."]},{"id":"S3","parent":"rt","prompt":"Turn `y = √x` into the target `y = √{3 - x}`.","_a":"az8bXw8SSRkBSBQFPG0=","named":[{"pos":"in","A":-1,"B":3,"fb":"Your graph starts at (−3, 0) and opens left. The target starts at (3, 0). Factor: `3 - x = -(x - 3)`, so `B = -3`."},{"pos":"in","A":1,"B":-3,"fb":"Right starting point, wrong direction: the target opens to the \u003cstrong>left\u003c/strong>, so it needs a reflection in the `y`-axis."},{"pos":"out","A":-1,"fb":"Outside, `A = -1` flips the graph upside down (a reflection in the `x`-axis). The target flips left-to-right."}],"hints":["The target opens to the left and starts at (3, 0). Which reflection is that?","A reflection in the `y`-axis is an inside change with `A = -1`. Factor: `3 - x = -1(x - 3)`.","Inside, `A = -1`, `B = -3`: reflect in the `y`-axis, then move 3 right."]}],"general":"Your graph doesn’t lie on the target yet. Compare where the two curves start and which way they open, then adjust."},"stationB":{"title":"Station B: Decompose it","intro":"\u003cstrong>Test\u003c/strong> a card to run its inner and outer functions through the pipeline and lay its graph over `h`. \u003cstrong>Select\u003c/strong> every card that builds `h`, then press \u003cstrong>Check\u003c/strong>.","ui":{"test":"Test","select":"Select","selected":"Selected","check":"Check","input":"Test input","card":"Card","fn":"Function","hLabel":"`h` (ink)","cLabel":"card (blue)","inLab":"input","outLab":"output","undef":"undefined","pick":"Press \u003cstrong>Test\u003c/strong> on a card to run it through the machines.","hAt":"For comparison, #1 #2.","notFirst":"(not first try)","algLab":"Check it with algebra:","none":"Select at least one card first.","sumLine":"Decompose it (first try): #1/4","unfinished":"(unfinished)"},"wrongCard":"Card #L builds #B, not `h`. At `x =` #X it gives #V, but `h` gives #H.","reversed":"Here #G acts first. In `h`, it’s #I that acts first.","missed":"Card #L works too: `g(x) = `#G, then `f(`#G`) = h(x)`. A function can often be split in more than one way.","end":"Change your selection and check again.","right":"Every card you selected builds `h`, and you found them all.","items":[{"id":"d1","h":"`(2x - 5)^3`","hs":"(2x − 5)^3","test":3,"hv":"1","cards":[{"g":"`2x - 5`","f":"`x^3`","u":"(⟦2x − 5⟧)^3"},{"g":"`x^3`","f":"`2x - 5`","builds":"`2x^3 - 5`","v":"49","rev":true},{"g":"`2x`","f":"`(x - 5)^3`","u":"(⟦2x⟧ − 5)^3"},{"g":"`2x - 5`","f":"`3x`","builds":"`6x - 15`","v":"3","u":"(⟦2x − 5⟧)^3"}],"_a":"a1QVBDw=","inner":"`2x - 5`","alg":"`f(g(x)) = f(2x - 5) = (2x - 5)^3 = h(x)`.","hints":["What happens to `x` first in `(2x - 5)^3`, and what happens last?","First `2x - 5` is worked out, last it’s cubed. So `g = 2x - 5`, `f = x^3` works. Is there another split?","Card c works too: `g(x) = 2x`, then `f(2x) = (2x - 5)^3`. Cards b and d build `2x^3 - 5` and `6x - 15`. Select a and c."]},{"id":"d2","h":"`√{x^2 + 9}`","hs":"√{x^2 + 9}","test":4,"hv":"5","cards":[{"g":"`x^2 + 9`","f":"`√x`","u":"√{⟦x^2 + 9⟧}"},{"g":"`x^2`","f":"`√{x + 9}`","u":"√{⟦x^2⟧ + 9}"},{"g":"`√x`","f":"`x^2 + 9`","builds":"`x + 9` for `x ≥ 0`","v":"13","rev":true},{"g":"`x^2`","f":"`√x + 3`","builds":"`√{x^2} + 3`","v":"7","u":"√{⟦x^2⟧ + 9}","special":"At `x = 0` card d does match `h` (`√0 + 3 = 3 = √9`), but nowhere else: at `x = 4` it gives 7, not 5. One matching input isn’t proof; the graphs show the whole story. `√{x^2 + 9}` is not `x + 3`."}],"_a":"a1QVBzw=","inner":"`x^2 + 9`","alg":"`f(g(x)) = f(x^2 + 9) = √{x^2 + 9} = h(x)`.","hints":["What happens to `x` first in `√{x^2 + 9}`, and what happens last?","First `x^2 + 9` is worked out, last the square root is taken. So `g = x^2 + 9`, `f = √x` works. Is there another split?","Card b works too: `g(x) = x^2`, then `f(x^2) = √{x^2 + 9}`. Cards c and d build `x + 9` (for `x ≥ 0`) and `√{x^2} + 3`. Select a and b."]},{"id":"d3","h":"`{1}/{(x - 4)^2}`","hs":"{1}/{(x − 4)^2}","test":5,"hv":"1","cards":[{"g":"`x - 4`","f":"`1/x^2`","u":"{1}/{(⟦x − 4⟧)^2}"},{"g":"`(x - 4)^2`","f":"`1/x`","u":"{1}/{⟦(x − 4)^2⟧}"},{"g":"`1/x`","f":"`(x - 4)^2`","builds":"`(1/x - 4)^2`","v":"361/25","rev":true},{"g":"`x^2`","f":"`{1}/{x - 4}`","builds":"`{1}/{x^2 - 4}`","v":"1/21"}],"_a":"a1QVBzw=","inner":"`x - 4`","alg":"`f(g(x)) = f(x - 4) = {1}/{(x - 4)^2} = h(x)`.","hints":["What happens to `x` first in `{1}/{(x - 4)^2}`, and what happens last?","First `x - 4` is worked out, then it’s squared, and last you take 1 over it. So `g = x - 4`, `f = 1/x^2` works. Is there another split?","Card b works too: `g(x) = (x - 4)^2`, then `f((x - 4)^2) = {1}/{(x - 4)^2}`. Cards c and d build `(1/x - 4)^2` and `{1}/{x^2 - 4}`. Select a and b."]},{"id":"d4","h":"`(3x + 1)^2 + 5`","hs":"(3x + 1)^2 + 5","test":1,"hv":"21","cards":[{"g":"`3x + 1`","f":"`x^2 + 5`","u":"(⟦3x + 1⟧)^2 + 5"},{"g":"`(3x + 1)^2`","f":"`x + 5`","u":"⟦(3x + 1)^2⟧ + 5"},{"g":"`3x`","f":"`(x + 1)^2 + 5`","u":"(⟦3x⟧ + 1)^2 + 5"},{"g":"`x^2 + 5`","f":"`3x + 1`","builds":"`3x^2 + 16`","v":"19","rev":true}],"_a":"a1QVB00COA==","inner":"`3x + 1`","alg":"`f(g(x)) = f(3x + 1) = (3x + 1)^2 + 5 = h(x)`.","hints":["List the steps `(3x + 1)^2 + 5` does to `x`, in order: times 3, plus 1, square, plus 5.","Any cut between two steps gives a valid pair: the steps before the cut are `g`, the steps after are `f`.","Cards a, b and c each cut the steps in a different place. Card d builds `3x^2 + 16`. Select a, b and c."]}]},"blocks":[{"html":"\u003cdetails class=\"alg\">\u003csummary>Check it with algebra\u003c/summary>\u003cp style=\"margin-top:10px\">\u003cstrong>Building and splitting composites\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>To build `f(g(x))`:\u003c/strong> replace every `x` in `f`’s formula with `(g(x))`, brackets included. `f(x) = x^3` and `g(x) = 2x - 5` give `(2x - 5)^3`.\u003c/li>\u003cli>\u003cstrong>To split `h`:\u003c/strong> list what `h` does to `x`, step by step. Cut the list anywhere: the steps before the cut form `g`, the steps after form `f`. Different cuts give different valid pairs.\u003c/li>\u003cli>\u003cstrong>Linear inside:\u003c/strong> `f(A(x + B)) = f(@k{k}(x - @d{d}))` with `@k{k} = A` and `@d{d} = -B`: every point moves by `(x, y) → (x/A - B, y)`, a horizontal change.\u003c/li>\u003cli>\u003cstrong>Linear outside:\u003c/strong> `A(f(x) + B) = @a{a}f(x) + @c{c}` with `@a{a} = A` and `@c{c} = AB`: every point moves by `(x, y) → (x, Ay + AB)`, a vertical change.\u003c/li>\u003cli>\u003cstrong>So the standard form is three machines:\u003c/strong> `y = @a{a}f(@k{k}(x - @d{d})) + @c{c}` is “`@k{k}(x - @d{d})`”, then `f`, then “`@a{a}( ) + @c{c}`”.\u003c/li>\u003c/ul>\u003c/details>"}],"quickCheck":{"title":"Inside and outside quick check","summary":"Inside and outside quick check","items":[{"id":"q1","goal":6,"prompt":"`y = f(x - 4)` is `f` with the linear function `x - 4` inside. How does its graph compare with `y = f(x)`?","choices":[{"t":"4 units down","fb":"That’s `f(x) - 4`, with the linear function outside. Inside, the change is horizontal.","_n":"142f2","_k":"dbe19267"},{"t":"4 units right","fb":"Right. Inside, the change is horizontal: the point at `x = 0` on `f` is now reached at `x = 4`.","_n":"152c2","_k":"6b32868c"},{"t":"4 units up","fb":"Nothing outside `f` changed, so the graph doesn’t move vertically.","_n":"162d2","_k":"646c17e7"},{"t":"4 units left","fb":"Inside changes look backwards: `f(x - 4)` reaches `f(0)` at `x = 4`, which is to the right.","_n":"17322","_k":"eac43f77"}]},{"id":"q2","goal":6,"prompt":"Which composition is `y = 3f(x) - 6`?","choices":[{"t":"`L(f(x))` with `L(x) = {x + 6}/{3}`","fb":"That’s the inverse of `3x - 6`: it gives `{f(x) + 6}/{3}`, which undoes the change instead of making it.","_n":"18332","_k":"d483532d"},{"t":"`L(f(x))` with `L(x) = 3(x - 6)`","fb":"That gives `3(f(x) - 6) = 3f(x) - 18`.","_n":"19302","_k":"b4f961d7"},{"t":"`L(f(x))` with `L(x) = 3x - 6`","fb":"Right. `f` acts first, then its output is tripled and 6 is subtracted: a linear function outside.","_n":"1a312","_k":"c0271195"},{"t":"`f(L(x))` with `L(x) = 3x - 6`","fb":"That’s `f(3x - 6)`, with the linear function inside, which changes the graph horizontally.","_n":"1b362","_k":"ad9326f2"}]},{"id":"q3","goal":4,"prompt":"Which pair builds `h(x) = 2^{x^2}`?","choices":[{"t":"Inner `2^x`, outer `x^2`","fb":"That builds `(2^x)^2 = 2^{2x}`, a different function: at `x = 3` it gives 64, but `2^{3^2} = 512`.","_n":"1c372","_k":"673b8bc2"},{"t":"Inner `x^2`, outer `2x`","fb":"That builds `2x^2`. `2^x` means 2 to the power `x`, not 2 times `x`.","_n":"1d342","_k":"f0bb784a"},{"t":"Inner `x^2`, outer `x^2`","fb":"That builds `x^4`.","_n":"1e332","_k":"55161e44"},{"t":"Inner `x^2`, outer `2^x`","fb":"Right. `x` is squared first, then used as the exponent on 2.","_n":"1f362","_k":"f6a11159"}]},{"id":"q4","goal":3,"prompt":"`f(x) = 2^x` and `g(x) = x^2`. What is the range of `f(g(x)) = 2^{x^2}`?","choices":[{"t":"`{y ∈ ℝ | y > 0}`","fb":"That’s the range of `2^x` on its own. Here `2^x` only ever receives inputs of 0 or more.","_n":"1g352","_k":"2773a65c"},{"t":"`{y ∈ ℝ}`","fb":"That’s the domain. 2 to any power is positive, and here the power is never negative.","_n":"1h302","_k":"f03f4902"},{"t":"`{y ∈ ℝ | y ≥ 0}`","fb":"That’s the range of `x^2` on its own. The outer function acts last.","_n":"1i2f2","_k":"d1855522"},{"t":"`{y ∈ ℝ | y ≥ 1}`","fb":"Right. The inner `x^2` only gives outputs of 0 or more, and `2^x` turns those into numbers of at least `2^0 = 1`.","_n":"1j322","_k":"27401299"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Where is it defined?","summary":"Where is it defined?","goal":[3,2],"noun":"pair","instruction":"Sort each pair into the box with the domain of `f(g(x))`.","how":"Tap a pair, then tap the box it belongs in. Ask two questions: which `x` can go into `g`, and which outputs of `g` can go into `f`?","boxes":[{"id":"b1","label":"`{x ∈ ℝ}`"},{"id":"b2","label":"`{x ∈ ℝ | x ≥ 2}`"},{"id":"b3","label":"`{x ∈ ℝ | x > 2}`"},{"id":"b4","label":"`{x ∈ ℝ | x ≠ 2}`"}],"items":[{"id":"i1","t":"`f(x) = x^2`, `g(x) = x - 2`","_a":"EgYIFA==","why":"`(x - 2)^2`: both machines accept every real number.","hints":["Which `x` can go into `g(x) = x - 2`?","Every `x`. Now which outputs of `g` can `f(x) = x^2` accept? Squaring accepts anything.","`(x - 2)^2`: both machines accept every real number. The domain is `{x ∈ ℝ}`."],"wrong":{"b2":"Try `x = 0`: `(0 - 2)^2 = 4`. Neither machine rejects anything here.","b3":"Try `x = 0`: `(0 - 2)^2 = 4`. Neither machine rejects anything here.","b4":"Try `x = 2`: `(2 - 2)^2 = 0`. Neither machine rejects anything here."}},{"id":"i2","t":"`f(x) = √x`, `g(x) = (x - 2)^2`","_a":"EgYIFA==","why":"`(x - 2)^2` is never negative, so √ accepts every output of `g`: `√{(x - 2)^2}` exists for every `x`.","hints":["Which `x` can go into `g(x) = (x - 2)^2`?","Every `x`. Now √ needs `(x - 2)^2 ≥ 0`. Can a square be negative?","`(x - 2)^2` is never negative, so √ accepts every output of `g`: `√{(x - 2)^2}` exists for every `x`. The domain is `{x ∈ ℝ}`."],"wrong":{"b2":"Try `x = 0`: `√{(0 - 2)^2} = √4 = 2`. Neither machine rejects anything here.","b3":"Try `x = 0`: `√{(0 - 2)^2} = √4 = 2`. Neither machine rejects anything here.","b4":"Try `x = 2`: `√{(2 - 2)^2} = √0 = 0`. Neither machine rejects anything here."}},{"id":"i3","t":"`f(x) = 1/x`, `g(x) = 2^{x - 2}`","_a":"EgYIFA==","why":"A power of 2 is never 0, so `1/2^{x - 2}` never divides by 0.","hints":["Which `x` can go into `g(x) = 2^{x - 2}`?","Every `x`. Now `1/x` needs `2^{x - 2} ≠ 0`. Can a power of 2 be 0?","A power of 2 is never 0, so `1/2^{x - 2}` never divides by 0. The domain is `{x ∈ ℝ}`."],"wrong":{"b2":"Try `x = 0`: `1/2^{-2} = 4`. Neither machine rejects anything here.","b3":"Try `x = 0`: `1/2^{-2} = 4`. Neither machine rejects anything here.","b4":"Try `x = 2`: `1/2^0 = 1`. Neither machine rejects anything here."}},{"id":"i4","t":"`f(x) = √x`, `g(x) = x - 2`","_a":"EgYLFA==","why":"`√{x - 2}` needs `x - 2 ≥ 0`.","hints":["Which `x` can go into `g(x) = x - 2`?","Every `x`. Now √ needs `x - 2 ≥ 0`.","`√{x - 2}` needs `x - 2 ≥ 0`. The domain is `{x ∈ ℝ | x ≥ 2}`."],"wrong":{"b1":"Try `x = 0`: `√{0 - 2} = √{-2}` isn’t a real number. Something is excluded.","b3":"Test the edge, `x = 2`: `√0 = 0` is fine. So 2 is in.","b4":"Try `x = 0`: `√{-2}` isn’t a real number. Numbers below 2 are excluded too."}},{"id":"i5","t":"`f(x) = x^2`, `g(x) = √{x - 2}`","_a":"EgYLFA==","why":"`(√{x - 2})^2` simplifies to `x - 2`, but `g` acts first and needs `x ≥ 2`.","hints":["Which `x` can go into `g(x) = √{x - 2}`?","Only `x ≥ 2`. Now which outputs of `g` can `f(x) = x^2` accept? Squaring accepts anything.","`(√{x - 2})^2` simplifies to `x - 2`, but `g` acts first and needs `x ≥ 2`. The domain is `{x ∈ ℝ | x ≥ 2}`."],"wrong":{"b1":"Decide the domain \u003cstrong>before\u003c/strong> you simplify. `(√{x - 2})^2` simplifies to `x - 2`, but `x = 0` never gets through `√{x - 2}`.","b3":"Test the edge, `x = 2`: `(√0)^2 = 0` is fine. So 2 is in.","b4":"Try `x = 0`: `g(0) = √{-2}` isn’t a real number. Numbers below 2 are excluded too."}},{"id":"i6","t":"`f(x) = √x`, `g(x) = log_{2}(x - 1)`","_a":"EgYLFA==","why":"`g` needs `x > 1`, and √ needs `log_{2}(x - 1) ≥ 0`, so `x - 1 ≥ 1`: `x ≥ 2`.","hints":["Which `x` can go into `g(x) = log_{2}(x - 1)`?","Only `x > 1`. Now √ needs `log_{2}(x - 1) ≥ 0`. When is a logarithm 0 or more?","`g` needs `x > 1`, and √ needs `log_{2}(x - 1) ≥ 0`, so `x - 1 ≥ 1`: `x ≥ 2`. The domain is `{x ∈ ℝ | x ≥ 2}`."],"wrong":{"b1":"Try `x = 1`: `log_{2}(1 - 1) = log_{2} 0` is undefined. Something is excluded.","b3":"Test the edge, `x = 2`: `√{log_{2} 1} = √0 = 0` is fine. So 2 is in.","b4":"Try `x = 0`: `log_{2}(0 - 1)` is undefined. Numbers below 2 are excluded too."}},{"id":"i7","t":"`f(x) = log_{2} x`, `g(x) = x - 2`","_a":"EgYKFA==","why":"`log_{2}(x - 2)` needs `x - 2 > 0`.","hints":["Which `x` can go into `g(x) = x - 2`?","Every `x`. Now `log_{2}` needs `x - 2 > 0`.","`log_{2}(x - 2)` needs `x - 2 > 0`. The domain is `{x ∈ ℝ | x > 2}`."],"wrong":{"b1":"Try `x = 0`: `log_{2}(0 - 2)` is undefined. Something is excluded.","b2":"Test the edge, `x = 2`: `log_{2} 0` is undefined. So 2 is out.","b4":"Try `x = 0`: `log_{2}(-2)` is undefined. Numbers below 2 are excluded too."}},{"id":"i8","t":"`f(x) = √x`, `g(x) = {1}/{x - 2}`","_a":"EgYKFA==","why":"`g` needs `x ≠ 2`, and √ needs `{1}/{x - 2} ≥ 0`, which happens only when `x - 2 > 0`. (A fraction 1/something is never 0.)","hints":["Which `x` can go into `g(x) = {1}/{x - 2}`?","Every `x` except 2. Now √ needs `{1}/{x - 2} ≥ 0`. When is `{1}/{x - 2}` positive?","`{1}/{x - 2}` is never 0, and it’s positive exactly when `x - 2 > 0`. The domain is `{x ∈ ℝ | x > 2}`."],"wrong":{"b1":"Try `x = 0`: `√{{1}/{0 - 2}} = √{-1/2}` isn’t a real number. Something is excluded.","b2":"Test the edge, `x = 2`: `1/0` is undefined. So 2 is out.","b4":"Try `x = 0`: `√{-1/2}` isn’t a real number. Numbers below 2 are excluded too."}},{"id":"i9","t":"`f(x) = log_{2} x`, `g(x) = √{x - 2}`","_a":"EgYKFA==","why":"`g` needs `x ≥ 2`, but `log_{2}` needs `√{x - 2} > 0`, so `x = 2` (where `√0 = 0`) is out.","hints":["Which `x` can go into `g(x) = √{x - 2}`?","Only `x ≥ 2`. Now `log_{2}` needs `√{x - 2} > 0`. When is `√{x - 2}` equal to 0?","`g` needs `x ≥ 2`, but `log_{2}` needs `√{x - 2} > 0`, so `x = 2` (where `√0 = 0`) is out. The domain is `{x ∈ ℝ | x > 2}`."],"wrong":{"b1":"Try `x = 0`: `√{0 - 2}` isn’t a real number. Something is excluded.","b2":"Test the edge, `x = 2`: `log_{2} √0 = log_{2} 0` is undefined. So 2 is out.","b4":"Try `x = 0`: `√{-2}` isn’t a real number. Numbers below 2 are excluded too."}},{"id":"i10","t":"`f(x) = 1/x`, `g(x) = x - 2`","_a":"EgYNFA==","why":"`{1}/{x - 2}` fails only when `x - 2 = 0`.","hints":["Which `x` can go into `g(x) = x - 2`?","Every `x`. Now `1/x` needs `x - 2 ≠ 0`.","`{1}/{x - 2}` fails only when `x - 2 = 0`. The domain is `{x ∈ ℝ | x ≠ 2}`."],"wrong":{"b1":"Try `x = 2`: `{1}/{2 - 2} = 1/0` is undefined. Something is excluded.","b2":"Try `x = 0`: `{1}/{0 - 2} = -1/2` works. Numbers below 2 are fine; only `x = 2` fails.","b3":"Try `x = 0`: `{1}/{0 - 2} = -1/2` works. Numbers below 2 are fine; only `x = 2` fails."}},{"id":"i11","t":"`f(x) = log_{2} x`, `g(x) = (x - 2)^2`","_a":"EgYNFA==","why":"`(x - 2)^2` is positive everywhere except `x = 2`, where it’s 0. Numbers less than 2 are fine: `(0 - 2)^2 = 4`.","hints":["Which `x` can go into `g(x) = (x - 2)^2`?","Every `x`. Now `log_{2}` needs `(x - 2)^2 > 0`. When is a square \u003cstrong>not\u003c/strong> positive?","`(x - 2)^2 = 0` only at `x = 2`; everywhere else it’s positive. The domain is `{x ∈ ℝ | x ≠ 2}`."],"wrong":{"b1":"Try `x = 2`: `log_{2}((2 - 2)^2) = log_{2} 0` is undefined. Something is excluded.","b2":"Try `x = 0`: `log_{2}((0 - 2)^2) = log_{2} 4 = 2` works. Numbers below 2 are fine; only `x = 2` fails.","b3":"Try `x = 0`: `log_{2}((0 - 2)^2) = log_{2} 4 = 2` works. Numbers below 2 are fine; only `x = 2` fails."}},{"id":"i12","t":"`f(x) = 2^x`, `g(x) = {1}/{x - 2}`","_a":"EgYNFA==","why":"`2^x` accepts every number, so only `g`’s restriction counts: `x ≠ 2`.","hints":["Which `x` can go into `g(x) = {1}/{x - 2}`?","Every `x` except 2. Now which outputs of `g` can `f(x) = 2^x` accept? `2^x` accepts anything.","`2^x` accepts every number, so only `g`’s restriction counts: `x ≠ 2`. The domain is `{x ∈ ℝ | x ≠ 2}`."],"wrong":{"b1":"Try `x = 2`: `g(2) = 1/0` is undefined. Something is excluded.","b2":"Try `x = 0`: `2^{1/(0 - 2)} = 2^{-1/2}` works. Numbers below 2 are fine; only `x = 2` fails.","b3":"Try `x = 0`: `2^{1/(0 - 2)} = 2^{-1/2}` works. Numbers below 2 are fine; only `x = 2` fails."}}]},{"id":"backwards","type":"custom","title":"Inside out, then backwards","summary":"Inside out, then backwards","star":true,"goal":[1,3,2,5],"instruction":"Find each value. Type a whole number or a fraction such as −1/2, or fill in the boxes, then press Check.","how":"N1–N3 use the table of `f` and the graph of `g` below. For “fill in” items, type the two numbers of `g(x) = □x + □`.","fig":{"xs":[-2,-1,0,1,2,3,4],"fs":[4,1,3,-2,0,-1,2],"aria":"Graph of y = g(x), an upward parabola through the dotted points (−2, 7), (−1, 2), (0, −1), (1, −2), (2, −1), (3, 2) and (4, 7)","label":"y = g(x)"},"fallback":"Not this one. Work from the inside out, and check your answer by putting it back through both machines.","bad":"Enter a whole number or a fraction, such as 3 or −1/2.","badBox":"Fill in both boxes with a whole number or a fraction.","tryAgain":"Try again.","label":"Your answer:","notFirst":"(not first try)","items":[{"id":"n1","goal":1,"prompt":"Find `f(g(3))`.","_a":"AA==","display":"`f(g(3)) = f(2) = 0`","wrong":[{"match":2,"fb":"That’s `g(f(3)) = g(-1) = 2`. In `f(g(3))`, read `g(3)` from the graph first."},{"match":-2,"fb":"That’s `f(3) × g(3) = -1 × 2`. Composition isn’t multiplication."}],"hints":["Work from the inside out: find `g(3)` on the graph first.","`g(3) = 2`. Now look up `f(2)` in the table.","`f(2) = 0`, so `f(g(3)) = 0`."]},{"id":"n2","goal":1,"prompt":"Find `g(f(4))`.","_a":"HVU=","display":"`g(f(4)) = g(2) = -1`","wrong":[{"match":14,"fb":"That’s `f(4) × g(4) = 2 × 7`."},{"match":7,"fb":"That’s `g(4)`. Here `f` acts first: `f(4) = 2`, then read `g(2)` from the graph."}],"hints":["Here `f` acts first: find `f(4)` in the table.","`f(4) = 2`. Now read `g(2)` from the graph.","`g(2) = -1`, so `g(f(4)) = -1`."]},{"id":"n3","goal":1,"prompt":"Find the `x`-value for which `f(g(x)) = 4`.","_a":"AQ==","display":"`x = 1`","right":"Work backwards one machine at a time: `f` turns −2 into 4, and `g` turns 1 into −2 (the bottom of its graph). So `f(g(1)) = f(-2) = 4`, and no other `x` works, because `g` outputs −2 only at `x = 1`.","wrong":[{"match":-2,"fb":"`f(-2) = 4`, so −2 is what `g` must \u003cstrong>output\u003c/strong>. Now find the `x` with `g(x) = -2`."},{"match":7,"fb":"`g(-2) = 7` runs `g` forwards from −2. You need the `x` that `g` sends \u003cstrong>to\u003c/strong> −2."}],"hints":["Work backwards. Which input does `f` turn into 4? Look in the table.","`f(-2) = 4`. So you need `g(x) = -2`. Find height −2 on `g`’s graph.","`g(1) = -2` (the lowest point). So `x = 1`."]},{"id":"n4","goal":3,"prompt":"`f(x) = x^2 + 4x` and `g(x) = √x`. What is the least value of `f(g(x))`?","_a":"AA==","display":"0","right":"`f(g(x)) = x + 4√x`, which only grows as `x` grows from 0. The inner `√x` never outputs −2, so `f`’s lowest point (−2, −4) is never reached. The range of `f(g(x))` is `{y ∈ ℝ | y ≥ 0}`.","wrong":[{"match":-4,"fb":"−4 is the least value of `f` on its own, at an input of −2. But `f`’s inputs here are outputs of `√x`, which are never negative."}],"hints":["Which numbers can `f` receive here? They’re outputs of `√x`.","`√x` is never negative, so `f` only receives inputs of 0 or more. Is `f` increasing for inputs of 0 or more?","`f(g(x)) = x + 4√x`. At `x = 0` it’s 0, and it only grows as `x` grows. The least value is 0."]},{"id":"n5","goal":2,"boxes":true,"prompt":"`f(x) = 3x - 2` and `g` is linear. `f(g(x)) = 6x + 7`. Fill in `g(x) = □x + □`.","_a":"az8LGlJtOA==","display":"`g(x) = 2x + 3`","wrong":[{"match":[2,11],"fb":"That `g` solves `g(f(x)) = 6x + 7`: the order is reversed. Here `f` is applied to `g(x)`: `3g(x) - 2`."},{"match":[2,1.6666666666666667],"fb":"Check the constant: `3b - 2 = 7` means `3b = 9`."},{"match":[6,7],"fb":"That’s `f(g(x))` itself. Find the `g` that `f` turns into it."}],"hints":["Write `g(x) = mx + b` and build `f(g(x)) = 3(mx + b) - 2`.","`3mx + 3b - 2` must equal `6x + 7`, so `3m = 6` and `3b - 2 = 7`.","`m = 2` and `b = 3`: `g(x) = 2x + 3`. Check: `3(2x + 3) - 2 = 6x + 7`."]},{"id":"n6","goal":2,"boxes":true,"prompt":"`f(x) = x^2 + 4` and `g` is linear. `f(g(x)) = x^2 - 2x + 5`. Fill in `g(x) = □x + □`.","_a":"az8IGkwBOBhrSQgaUG04","display":"`g(x) = x - 1` or `g(x) = -x + 1`","right":"`x^2 - 2x + 5 = (x - 1)^2 + 4`, so `g(x) = x - 1` works. So does `g(x) = -x + 1`, because `(1 - x)^2 = (x - 1)^2`. Two different inner functions, one composite.","wrong":[{"match":[1,1],"fb":"`(x + 1)^2 + 4 = x^2 + 2x + 5`: the middle term has the wrong sign."},{"match":[1,-2],"fb":"`(x - 2)^2 + 4 = x^2 - 4x + 8`."}],"hints":["Write `g(x) = mx + b` and build `f(g(x)) = (mx + b)^2 + 4`.","`x^2 - 2x + 5 - 4 = x^2 - 2x + 1 = (x - 1)^2`. So `(mx + b)^2` must equal `(x - 1)^2`.","`mx + b = x - 1` works: `m = 1`, `b = -1`. (So does `-x + 1`.)"]},{"id":"n7","goal":5,"prompt":"`g(g(x)) = x` for every `x`. `g(2) = 7` and `g(5) = -1`. Find `g(-1) + g(7)`.","_a":"Bw==","display":"7","right":"`g(g(5)) = 5` says `g(-1) = 5`, and `g(g(2)) = 2` says `g(7) = 2`. So the sum is 7. A function with `g(g(x)) = x` is its own inverse, like `1/x`.","wrong":[{"match":6,"fb":"That’s `-1 + 7`, the two inputs. Use `g(g(x)) = x`: apply it at `x = 5` and at `x = 2`."}],"hints":["`g(g(x)) = x` means `g` undoes itself. What does `g(g(5))` tell you?","`g(5) = -1`, so `g(g(5)) = g(-1) = 5`. Do the same with `g(2) = 7`.","`g(-1) = 5` and `g(7) = 2`, so `g(-1) + g(7) = 7`."]},{"id":"n8","goal":2,"boxes":true,"prompt":"`f(x) = 3x + 2`. Find the linear function `g` with `g(0) = 1` and `f(g(x)) = g(f(x))` for every `x`. Fill in `g(x) = □x + □`.","_a":"az8LGlBtOA==","display":"`g(x) = 2x + 1`","right":"With `g(x) = mx + b`: `f(g(x)) = 3mx + 3b + 2` and `g(f(x)) = 3mx + 2m + b`. These match when `2b + 2 = 2m`, so `m = b + 1`. With `b = g(0) = 1`, `m = 2`.","wrong":[{"match":[3,1],"fb":"`g(x) = 3x + 1` gives `f(g(x)) = 9x + 5` but `g(f(x)) = 9x + 7`."},{"match":[1,1],"fb":"`g(x) = x + 1` gives `3x + 5` one way and `3x + 3` the other."}],"hints":["Let `g(x) = mx + b`. Build both `f(g(x))` and `g(f(x))`.","`f(g(x)) = 3mx + 3b + 2` and `g(f(x)) = 3mx + 2m + b`. The `x`-terms already match. Set the constants equal.","`3b + 2 = 2m + b` gives `m = b + 1`. `g(0) = b = 1`, so `m = 2`: `g(x) = 2x + 1`. Check: both orders give `6x + 5`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Keisha","how":"","instruction":"Keisha made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"`f(x) = x^2 - 2x` and `g(x) = x + 3`. Find `f(g(x))` and simplify.","steps":["`f(g(x))` means: put `g(x) = x + 3` into `f`.","`f(g(x)) = (x + 3)^2 - 2x`","`= x^2 + 6x + 9 - 2x`","`= x^2 + 4x + 9`"],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 expands step 2 correctly. The mistake is earlier.","Step 4 collects step 3’s terms correctly. The mistake is earlier."],"fixes":[{"t":"`f(g(x)) = (x^2 - 2x) + 3 = x^2 - 2x + 3`.","why":"That’s `g(f(x))`: it puts `f` into `g`. In `f(g(x))`, `g(x)` goes into `f`.","_n":"1k312","_k":"52bef3fc"},{"t":"Replace \u003cstrong>both\u003c/strong> `x`’s: `(x + 3)^2 - 2(x + 3) = x^2 + 6x + 9 - 2x - 6 = x^2 + 4x + 3`.","why":"Check with `x = 0`: `g(0) = 3` and `f(3) = 9 - 6 = 3`, which matches `x^2 + 4x + 3`. Keisha’s answer gives 9.","_n":"1l3c2","_k":"27caf236"},{"t":"Step 2 is correct as written.","why":"Check with `x = 0`: `f(g(0)) = f(3) = 3`, but step 2 gives `9 - 0 = 9`. The second `x` in `f` wasn’t replaced.","_n":"1m3b2","_k":"785722e1"},{"t":"`(x + 3)^2 - 2x + 3 = x^2 + 4x + 12`.","why":"The brackets are missing: −2 must multiply all of `(x + 3)`, giving `-2x - 6`, not `-2x + 3`.","_n":"1nc22","_k":"acb85cb2"}],"hints":["How many `x`’s are there in `f(x) = x^2 - 2x`? Did each one get replaced?","Both must become `(x + 3)`: `(x + 3)^2 - 2(x + 3)`.","Step 2 is wrong. `(x + 3)^2 - 2(x + 3) = x^2 + 4x + 3`."]},{"id":"e2","goal":3,"task":"`f(x) = x^2` and `g(x) = √{x - 1}`. Find the domain of `f(g(x))`.","steps":["`f(g(x)) = (√{x - 1})^2`.","Squaring undoes the square root, so this simplifies to `x - 1`.","`x - 1` is a linear function, so it accepts every real number.","So the domain of `f(g(x))` is `{x ∈ ℝ}`."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct for every `x` where `√{x - 1}` exists. The mistake is in what Keisha does with it next.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"Try `x = 0`: `g(0) = √{-1}` isn’t a real number, so `f(g(0))` doesn’t exist, even though the simplified formula gives −1.","_n":"1oc32","_k":"2388b4e2"},{"t":"The domain is `{x ∈ ℝ | x ≥ 0}`, because `f(x) = x^2` never gives a negative number.","why":"That’s about `f`’s outputs, not which `x` can go in. And `x = 0.5` fails: `√{-0.5}` isn’t real.","_n":"1pc42","_k":"c86ec2a6"},{"t":"The domain is `{x ∈ ℝ | x > 1}`, because `√0` is undefined.","why":"`√0 = 0` is defined, so `x = 1` works: `(√0)^2 = 0`.","_n":"1qc52","_k":"bd5dcb1e"},{"t":"`g` acts first, and `√{x - 1}` needs `x - 1 ≥ 0`. So the domain is `{x ∈ ℝ | x ≥ 1}`, even though the simplified formula is `x - 1`.","why":"A number has to get through `g` before `f` ever sees it.","_n":"1rbe2","_k":"35f76bf9"}],"hints":["Does every `x` get through `g(x) = √{x - 1}`?","The domain must be decided from the machines, not from the simplified formula.","Step 3 is wrong. `g` needs `x ≥ 1`, so the domain is `{x ∈ ℝ | x ≥ 1}`."]},{"id":"e3","goal":5,"task":"`f(x) = x^2` and `g(x) = √x`. Decide whether `g(f(x)) = x` for every real number `x`.","steps":["`g(f(x)) = √{x^2}`.","Squaring and square-rooting undo each other, so `√{x^2} = x`.","So `g(f(x)) = x` for every real number `x`.","Check: `x = 4` gives `√16 = 4`. ✓"],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 follows from step 2. The mistake is earlier.","The arithmetic is right, but one positive example can’t show “every real number”. The mistake is earlier."],"fixes":[{"t":"`√{x^2} = x` only when `x ≥ 0`. For `x = -4`: `√{(-4)^2} = √16 = 4`, not −4. So `g(f(x)) = x` is \u003cstrong>not\u003c/strong> true for every real `x`.","why":"√ gives the non-negative root, so it can’t give back a negative input.","_n":"1sbf2","_k":"ea451a5b"},{"t":"Step 2 is correct as written.","why":"Try `x = -4`: `√{(-4)^2} = √16 = 4`, which isn’t
