t steady. Check the second differences.","_n":"2b2e8","_k":"7e24a782"}]},"b":{"prompt":"A table lists `y = 4, 6, 9, 13.5, 20.25` for `x = 0, 1, 2, 3, 4`. Which type of function fits it?","options":[{"t":"Quadratic","why":"The second differences are 1, 1.5, 2.25: not steady. Check the ratios.","_n":"2c2d8","_k":"4328a046"},{"t":"Linear","why":"The first differences are 2, 3, 4.5, 6.75: not steady.","_n":"2d2c8","_k":"31fa7aa2"},{"t":"Sinusoidal","why":"The values keep rising; there’s no cycle.","_n":"2e2b8","_k":"124e0736"},{"t":"Exponential","why":"Each value is 1.5 times the one before: a steady ratio means exponential, `y = 4(1.5)^x`.","_n":"2f2a8","_k":"aa6ff6b5"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A guitar string vibrates back and forth, and its swings halve every 0.5 s. Which structure fits the string’s position?","options":[{"t":"A halving exponential plus a wave","why":"Adding a wave keeps the swings the same size around a falling centre. These swings themselves shrink.","_n":"2g298","_k":"8a3c19e7"},{"t":"A halving exponential multiplied by a wave","why":"The wave gives the back-and-forth; multiplying by a halving exponential makes each swing half as big every 0.5 s.","_n":"2h2c8","_k":"4896caa1"},{"t":"A halving exponential on its own","why":"That only shrinks; it never swings back and forth.","_n":"2i2d8","_k":"173cf694"},{"t":"A wave on its own","why":"A wave alone keeps the same size forever. These swings fade.","_n":"2j2e8","_k":"04eedd0a"}]},"b":{"prompt":"A town’s monthly water use grows by about 2 ML every month, with a summer peak of the same size every year. Which structure fits?","options":[{"t":"A linear function on its own","why":"A line misses the yearly peak.","_n":"2k2f8","_k":"63fe582c"},{"t":"A linear function plus a wave","why":"The line carries the steady growth; adding a wave puts the same-size summer peak on top every year.","_n":"2l288","_k":"d5e6922e"},{"t":"A wave on its own","why":"A wave alone misses the growth.","_n":"2m298","_k":"ae891845"},{"t":"A linear function multiplied by a wave","why":"Multiplying would make the summer peaks grow as the trend grows. These stay the same size.","_n":"2n2a8","_k":"1f6e55ca"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"A drink cools according to `T(t) = 22 + 60(1/2)^{t/8}`, in °C, `t` minutes after it’s poured. What does the 22 represent?","options":[{"t":"The room temperature: the drink cools toward 22&nbsp;°C","why":"As `t` grows, `60(1/2)^{t/8}` shrinks to 0 and leaves 22.","_n":"2o2b8","_k":"4d239c27"},{"t":"The starting temperature","why":"At `t = 0` the drink is 22 + 60 = 82&nbsp;°C.","_n":"2p248","_k":"8109a431"},{"t":"The halving time","why":"The halving time is the 8 in the exponent: every 8 min the 60&nbsp;°C above the room halves.","_n":"2q258","_k":"263a8e4d"},{"t":"How many degrees the drink cools each minute","why":"It doesn’t cool by a fixed amount each minute; the difference from the room halves.","_n":"2r6aa","_k":"e0431db5"}]},"b":{"prompt":"A park’s monthly visitors are modelled by `P(t) = 0.8t + 25 + 5 cos[π/6 (t - 6)]`, in thousands, `t` months after January. What does the 0.8 represent?","options":[{"t":"The size of the yearly swing","why":"The wave’s amplitude is 5.","_n":"2s6ba","_k":"365f7097"},{"t":"The time between peaks","why":"The peaks are 2π ÷ (π/6) = 12 months apart.","_n":"2t6ca","_k":"5091ce69"},{"t":"The trend: on average, monthly visitors grow by 0.8 thousand each month","why":"0.8 is the slope of the linear part.","_n":"2u6da","_k":"f7f1f15c"},{"t":"The model’s value at `t = 0`","why":"`P(0) = 25 + 5 cos(-π) = 20`.","_n":"2v66a","_k":"36579d8e"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A trend-only model of monthly sales leaves these leftovers (data − model) for `t = 0, 1, …, 11`: 2, 3.5, 4, 3.5, 2, 0, −2, −3.5, −4, −3.5, −2, 0. What should be added to the model?","options":[{"t":"A wave with amplitude 4 and period 6 months, peaking at `t = 2`","why":"From the high at `t = 2` to the low at `t = 8` is only half a cycle.","_n":"2w67a","_k":"02b0acb2"},{"t":"The constant 4","why":"Adding 4 would shift every leftover down by 4. The leftovers go up \u003cstrong>and\u003c/strong> down, so they need a wave.","_n":"2x68a","_k":"5697116e"},{"t":"A wave with amplitude 8 and period 12 months, peaking at `t = 2`","why":"8 is the distance from the lowest leftover to the highest. The amplitude is half of it.","_n":"2y69a","_k":"ad000f4a"},{"t":"A wave with amplitude 4 and period 12 months, peaking at `t = 2`","why":"The leftovers swing from 4 down to −4 and back over 12 months, with the high at `t = 2`: `4 cos[π/6 (t - 2)]`.","_n":"2z62a","_k":"14700989"}]},"b":{"prompt":"A model of a pendulum’s position leaves these leftovers for `t = 0, 1, …, 6` seconds: 3, 1.5, −1.5, −3, −1.5, 1.5, 3. What should be added to the model?","options":[{"t":"A wave with amplitude 3 and period 6 s, peaking at `t = 0`","why":"From 3 down to −3 and back to 3 takes 6 s: `3 cos(π/3 t)`.","_n":"3063a","_k":"75337cfd"},{"t":"A wave with amplitude 3 and period 3 s, peaking at `t = 0`","why":"From the high at `t = 0` to the low at `t = 3` is half a cycle.","_n":"3170a","_k":"9d1e4f0b"},{"t":"A wave with amplitude 6 and period 6 s, peaking at `t = 0`","why":"6 is the full swing from −3 to 3. The amplitude is half.","_n":"326fa","_k":"43d5848d"},{"t":"The constant 3","why":"The leftovers go up and down; a constant can’t fix that.","_n":"336ea","_k":"a836832f"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"How many solutions does `2^x = x + 3` have, and between which whole numbers is the positive one?","options":[{"t":"Two; the positive one is between 2 and 3","why":"With `h(x) = 2^x - x - 3`: `h(2) = -1` and `h(3) = 2`, and also `h(-3) = 1/8 > 0` and `h(-2) = -3/4 \u003c 0`. Two sign changes, two solutions.","_n":"346da","_k":"17eae646"},{"t":"Two; the positive one is between 1 and 2","why":"`h(1) = -2` and `h(2) = -1` have the same sign, so no crossing is trapped there.","_n":"356ca","_k":"5540335f"},{"t":"One, between 2 and 3","why":"There’s a second solution for negative `x`: `h(-3) = 1/8` and `h(-2) = -3/4` have opposite signs.","_n":"366ba","_k":"9e1a2435"},{"t":"None, because algebra can’t isolate `x`","why":"Algebra can’t isolate `x`, but the graphs still cross. A sign change proves it.","_n":"376aa","_k":"ddcab8df"}]},"b":{"prompt":"How many solutions does `3^x = 4x + 2` have, and between which whole numbers is the positive one?","options":[{"t":"Two; the positive one is between 2 and 3","why":"With `h(x) = 3^x - 4x - 2`: `h(2) = -1` and `h(3) = 13`, and also `h(-1) = 7/3 > 0` and `h(0) = -1 \u003c 0`. Two solutions.","_n":"3869a","_k":"271c7f97"},{"t":"Two; the positive one is between 1 and 2","why":"`h(1) = -3` and `h(2) = -1` have the same sign.","_n":"3968a","_k":"02eda938"},{"t":"One, between 2 and 3","why":"`h(-1) = 7/3` and `h(0) = -1` have opposite signs: there’s a negative solution too.","_n":"3a67a","_k":"1deccc4f"},{"t":"None, because algebra can’t isolate `x`","why":"No algebra step isolates `x`, but the sign changes show two crossings.","_n":"3bd6a","_k":"20e65a07"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A circular ripple’s radius is `r(t) = 3t + 1` cm after `t` seconds, and its area is `A(r) = πr^2`. At what time is the area 49π cm²?","fixedOrder":true,"options":[{"t":"2 s","why":"`πr^2 = 49π` gives `r = 7`. Then `3t + 1 = 7` gives `t = 2`.","_n":"3cd7a","_k":"014a4f74"},{"t":"7/3 s","why":"That solves `3t = 7`, forgetting the starting radius of 1 cm.","_n":"3dd4a","_k":"4d8400ab"},{"t":"7 s","why":"7 cm is the radius at that moment, not the time.","_n":"3ed5a","_k":"c04b5c03"},{"t":"16 s","why":"That solves `3t + 1 = 49`, skipping the square: the \u003cstrong>area\u003c/strong> is 49π, so `r^2 = 49`.","_n":"3fdaa","_k":"ef607ee4"}]},"b":{"prompt":"A square ice sheet’s side is `s(t) = 2t + 3` m after `t` hours, and its area is `A(s) = s^2`. At what time is the area 81 m²?","fixedOrder":true,"options":[{"t":"3 h","why":"`s^2 = 81` gives `s = 9`. Then `2t + 3 = 9` gives `t = 3`.","_n":"3gdba","_k":"b38cbf4d"},{"t":"4.5 h","why":"That solves `2t = 9`, forgetting the starting side of 3 m.","_n":"3hd8a","_k":"ef06c86b"},{"t":"9 h","why":"9 m is the side at that moment, not the time.","_n":"3id9a","_k":"6a5baa93"},{"t":"39 h","why":"That solves `2t + 3 = 81`, skipping the square.","_n":"3jdea","_k":"c49cbefc"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Lena models tea cooling in a 20&nbsp;°C room with `T(t) = 84(1/2)^{t/15}`. Which is the best explanation of why her model is poor?","options":[{"t":"“Her halving time should be 20 min, because the room is 20&nbsp;°C.”","why":"The room temperature is the level, not the halving time. They’re different jobs.","_n":"3kdfa","_k":"a1e38782"},{"t":"“Exponential functions can only model growth, not cooling.”","why":"`(1/2)^{t/15}` models decay perfectly well; the problem is the level it decays toward.","_n":"3ldca","_k":"9d9f13c4"},{"t":"“Her model is fine, because it gives exactly 84&nbsp;°C at `t = 0`.”","why":"One matching point doesn’t make a good model. By `t = 60` hers gives 5.25&nbsp;°C.","_n":"3mdba","_k":"52d4e93c"},{"t":"“Her model shrinks toward 0&nbsp;°C, but the tea can only cool to the room’s 20&nbsp;°C. The temperature above the room is what halves, so the model should be 20 plus a shrinking exponential.”","why":"This names the flaw, explains it with the situation, and says how to fix it.","_n":"3ndea","_k":"12c20a6b"}]},"b":{"prompt":"Omar models the Spring data with `y(t) = 24 cos(π/2 t)`. Which is the best explanation of why his model is poor?","options":[{"t":"“His period should be 2 s, because the swings halve every 2 s.”","why":"The halving time and the period are different jobs: the swings repeat every 4 s.","_n":"3odda","_k":"138079a8"},{"t":"“A cosine model can’t start at a peak.”","why":"Cosine models start at a peak when `d = 0`: that part is right.","_n":"3pd8a","_k":"263d4773"},{"t":"“His model is fine, because it gives exactly 24 cm at `t = 0`.”","why":"One matching point isn’t enough: at `t = 8` his model gives 24 cm, but the reading is 1.5 cm.","_n":"3qd7a","_k":"7bcc9441"},{"t":"“His swings stay 24 cm forever, but the spring’s swings halve every 2 s. The wave should be multiplied by a shrinking envelope, `24(1/2)^{t/2}`.”","why":"This names the flaw, explains it with the data, and says how to fix it.","_n":"3rdaa","_k":"e7fe4a83"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"The graphs of `y = 2^x` and `y = x^2 + 1` cross at (0, 1), (1, 2) and about (4.26, 19.1), and nowhere else. Which is the correct solution of `2^x > x^2 + 1`?","options":[{"t":"`[0, 1] ∪ [4.26, ∞)`","why":"At the crossings the two sides are equal, so `2^x > x^2 + 1` is false there. Use round brackets.","_n":"3sd9a","_k":"2ae56d65"},{"t":"`(4.26, ∞)`","why":"Between 0 and 1 the exponential is also above: at `x = 1/2`, √2 ≈ 1.41 > 1.25.","_n":"3te4a","_k":"c840ec38"},{"t":"`(1, 2) ∪ (19.1, ∞)`","why":"Those are `y`-values. The solution is a set of `x`-values.","_n":"3ue3a","_k":"7ff56bfe"},{"t":"`(0, 1) ∪ (4.26, ∞)`, with 4.26 approximate","why":"Between 0 and 1 and beyond 4.26 the exponential is above the parabola. The inequality is strict, so the crossings are left out.","_n":"3vd29","_k":"4cc920fc"}]},"b":{"prompt":"The graphs of `y = 3^x` and `y = 2x + 1` cross at (0, 1) and (1, 3), and nowhere else. Which is the correct solution of `3^x ≤ 2x + 1`?","options":[{"t":"`(-∞, 0] ∪ [1, ∞)`","why":"That’s where `3^x ≥ 2x + 1`: the wrong side. At `x = 2`, 9 > 5.","_n":"3wd39","_k":"00cd9ddf"},{"t":"`(0, 1)`","why":"≤ includes equality, and at `x = 0` and `x = 1` the two sides are equal. Use square brackets.","_n":"3xd49","_k":"399cd89f"},{"t":"`[1, 3]`","why":"Those are `y`-values. The solution is a set of `x`-values.","_n":"3yd59","_k":"decac927"},{"t":"`[0, 1]`","why":"Between 0 and 1 the line is above the exponential, and ≤ includes the crossings, where the two sides are equal.","_n":"3zd69","_k":"e83a86a4"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"The Spring is modelled by `y(t) = 24(1/2)^{t/2} cos(π/2 t)`, in cm, `t` in seconds. Where does the model put the weight at `t = 6` s?","fixedOrder":true,"options":[{"t":"−12 cm","why":"That halves only once. In 6 s there are 3 halvings: 24 → 12 → 6 → 3.","_n":"40d79","_k":"d4e47545"},{"t":"−3 cm","why":"The envelope is `24(1/2)^3 = 3`, and `cos(3π) = -1`, so `y(6) = -3`: 3 cm below its resting position.","_n":"41d89","_k":"10142a4c"},{"t":"2 cm","why":"That adds the parts, 3 + (−1). The model multiplies them.","_n":"42d99","_k":"e339d181"},{"t":"3 cm","why":"That’s the envelope’s size. `cos(3π) = -1` puts the weight below its resting position.","_n":"43da9","_k":"64e2ea9c"}]},"b":{"prompt":"A car’s bounce after a bump is modelled by `y(t) = 32(1/2)^{t/3} cos(π/3 t)`, in cm, `t` in seconds. Where does the model put the car body at `t = 9` s?","fixedOrder":true,"options":[{"t":"−16 cm","why":"That halves only once. In 9 s there are 3 halvings: 32 → 16 → 8 → 4.","_n":"44db9","_k":"d9961598"},{"t":"−4 cm","why":"The envelope is `32(1/2)^3 = 4`, and `cos(3π) = -1`, so `y(9) = -4`.","_n":"45d89","_k":"a4d11be8"},{"t":"3 cm","why":"That adds the parts, 4 + (−1). The model multiplies them.","_n":"46d79","_k":"5e0fb08f"},{"t":"4 cm","why":"That’s the envelope’s size. `cos(3π) = -1` puts the car body below its resting height.","_n":"47d69","_k":"7df8b2cf"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A ferry charges $20 a trip and carries 300 riders a day. Each $1 increase in the fare loses 10 riders a day, so the daily revenue is `R(x) = (20 + x)(300 - 10x)` dollars for an increase of `x` dollars. Which fare gives the most revenue?","fixedOrder":true,"options":[{"t":"$20","why":"That’s the current fare: `R(0) = 6000`, but `R(5) = 6250` is more.","_n":"48d59","_k":"7b1a7603"},{"t":"$25","why":"The zeros of `R` are `x = -20` and `x = 30`, so the vertex is halfway, at `x = 5`. The fare is 20 + 5 = $25, for 25 × 250 = $6250.","_n":"49dc9","_k":"df7b56cf"},{"t":"$35","why":"That’s `x = 15`, halfway between 0 and 30. The vertex is halfway between the two \u003cstrong>zeros\u003c/strong>, −20 and 30.","_n":"4adb9","_k":"a3d701e1"},{"t":"$50","why":"At `x = 30` there are no riders at all: revenue $0.","_n":"4bda9","_k":"028f8e79"}]},"b":{"prompt":"A theatre charges $15 a seat and sells 400 seats a night. Each $1 increase loses 20 seats, so the revenue is `R(x) = (15 + x)(400 - 20x)` dollars for an increase of `x` dollars. Which price gives the most revenue?","fixedOrder":true,"options":[{"t":"$15","why":"That’s the current price: `R(0) = 6000`, but `R(2.5) = 6125` is more.","_n":"4cd99","_k":"8f5e2544"},{"t":"$17.50","why":"The zeros of `R` are `x = -15` and `x = 20`, so the vertex is at `x = 2.5`. The price is $17.50, for 17.5 × 350 = $6125.","_n":"4de09","_k":"bd3b2cc6"},{"t":"$25","why":"That’s `x = 10`, halfway between 0 and 20. The vertex is halfway between the zeros, −15 and 20.","_n":"4edf9","_k":"963e9971"},{"t":"$35","why":"At `x = 20` no seats sell: revenue $0.","_n":"4fde9","_k":"2488f4c9"}]}}]},"task":{"title":"Keep the servers ahead","summary":"Keep the servers ahead","statement":"\u003cp>A new streaming service expects `U(t) = 5 · 2^{t/6}` thousand users, `t` months after launch: 5 thousand at launch, doubling every 6 months. You plan its server capacity, `C(t) = mt + b` thousand users: `b` at launch, plus `m` more each month. A new data centre opens at `t = 18`. Choose `m` and `b` so that all four checks pass. There are many working plans. Can you find more than one?\u003c/p>\u003cp class=\"uses\">\u003cstrong>Values you need\u003c/strong>`U(0) = 5`, `U(6) = 10`, `U(12) = 20` and `U(18) = 40` (thousand users)\u003c/p>","checks":["At launch, capacity is at most 4 times the number of users (not wasteful)","Capacity is never below the number of users from launch until the new data centre opens (`0 ≤ t ≤ 18`)","At `t = 12` there are at least 1.5 thousand units of capacity per thousand users","The plan costs at most $30 million (the cost is `b + 6m` million dollars)"],"tips":["At launch there are 5 thousand users, and your capacity is {b} thousand: {r} times as much. Keep `b` at 20 or less.","Check both ends. At `t = 0` there are 5 thousand users and your capacity is {c0}; at `t = 18` there are `5 · 2^3 = 40` thousand and your capacity is {c18}. The users’ curve bends upward, so if you’re ahead at both ends you’re ahead all the way between.","At `t = 12` there are 20 thousand users, so you need `C(12) = 12m + b ≥ 30`. Yours is {c12}.","Your plan costs `b + 6m` = {cost} million dollars. Lower `m` or `b`, then recheck lines 2 and 3."],"explainPrompt":"Explain how you know your capacity stays ahead of the users all the way from `t = 0` to `t = 18`, not just at the two ends.","vocab":"Use the words exponential, linear, difference and ratio.","success":"Your plan works!","more":"There’s more than one answer. Can you find another?","afterM":"Notice the trade-off: a bigger launch capacity lets you grow more slowly, and faster growth lets you launch smaller, but the budget limits both. No plan works with `m = 1` or less: the capacity would have to start above 20 to catch the 40 thousand users at `t = 18`."},"cards":[["Combined model","A model built from two or more functions joined by +, −, ×, ÷ or composition. Example: `P(t) = 0.5t + 20 + 5 cos[π/6 (t - 6)]`, a trend plus a yearly wave."],["Add or multiply?","Add when the swings stay the same size around a moving centre (trend + wave). Multiply when the swings grow or shrink in proportion (envelope × wave)."],["Leftovers","Data − model at each data point. Small leftovers with no pattern: a good model. A pattern in the leftovers shows what the model is missing."],["Level + decay","room + (start − room)`(1/2)^{t/h}`: a cooling drink approaches room temperature, not 0. Example: `T(t) = 20 + 64(1/2)^{t/10}`."],["Choosing a type from a table","Equal steps in `x`. Steady first differences: linear. Steady second differences: quadratic. Steady ratios: exponential. Values that repeat: sinusoidal."],["The largest value of a sum","At most (largest `f`) + (largest `g`), and equal only if both happen at the same `x`. Ferry: trend up to 37.5, wave up to 5, but the busiest month is 40."],["Solving when algebra can’t","Write `f(x) = g(x)` as `h(x) = f(x) - g(x) = 0`. Its zeros are where the graphs cross. Trap each one with a sign change, then zoom ×10."],["The sign-change rule","If `h` has no breaks and `h(p)`, `h(q)` have opposite signs, then `h = 0` somewhere between `p` and `q`. Across an asymptote this can fail: `1/(x - 3)` is never 0."],["Count every crossing","`2^x = x^2` has three solutions: `x ≈ -0.77`, `x = 2` and `x = 4`. Check negative `x`, and zoom in where the graphs are close."],["Inequalities from graphs","`f(x) \u003c g(x)` where `f`’s graph is below `g`’s. Read the `x`-intervals between crossings: &lt; and &gt; leave the crossings out; ≤ and ≥ keep them."],["Forecasting with a model","A fitted model is safest inside the data’s range. Further out, check its prediction makes sense: a cooling drink can’t go below room temperature."],["A composition model","One quantity feeds another: `r(t) = 3t + 1` and `A(r) = πr^2` give `A(r(t)) = π(3t + 1)^2`. Work backwards one function at a time."]]}};</script>
