.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 49: hero equation labels, radio groups, Model lab layout, crossing finder, task steppers */
.ml-heq{display:inline-flex;flex-wrap:wrap;align-items:flex-start;gap:.15em .3em;line-height:1.15}
.ml-hp{display:inline-flex;flex-direction:column;align-items:center}
.ml-hp small{font:400 .82rem/1.2 var(--font-ui);color:var(--ink-2);margin-top:.15rem;letter-spacing:0}
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.ml-lockt{display:block;font-size:.72rem;font-weight:400}
/* Model lab */
.ml-story{border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px 12px;margin:0 0 16px;background:var(--paper)}
.ml-story h3{margin:0 0 4px}
.ml-storyt{margin:0 0 8px;max-width:none}
.ml-tyear{display:none}
.ml-tyear .tbl-wrap{margin-top:8px}
.ml-lab{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"g c" "r c";gap:14px 28px;align-items:start}
.ml-g{grid-area:g;min-width:0}.ml-c{grid-area:c;min-width:0}.ml-r{grid-area:r;min-width:0}
.ml-cap{font-size:clamp(1.25rem,3vw,1.75rem)}
.ml-note{margin:0 0 6px;font-weight:700}
#ml-views,#ml-lsel{margin:0 0 8px}
.ml-tabs{display:flex!important;width:100%}
.ml-tabs button{flex:1 1 0}
#ml-fore{margin-top:10px}
#ml-set{margin:0 0 12px;overflow-x:auto;padding-bottom:4px}
#ml-set .rg-wrap{flex-wrap:nowrap}
#ml-set .rg.seg{flex-wrap:nowrap;flex:0 0 auto}
#ml-set .rg.seg button{white-space:nowrap}
.ml-part{border:1.5px solid var(--rule);border-radius:8px;padding:6px 12px;margin:0 0 10px}
.ml-part summary{font-weight:700;cursor:pointer;min-height:32px;display:list-item;padding-top:4px}
.ml-pbody{padding:6px 0 4px}
.ml-sel{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:700;font-size:.92rem}
.ml-sel select{font:inherit;font-weight:400;padding:.35em .5em;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);min-height:36px}
.ml-sl output{font-size:1.15rem}
.ml-ou{font:400 .85rem var(--font-ui)}
.ml-locked{opacity:.75}
.ml-locknote{margin:-4px 0 8px}
.ml-op{margin:0 0 10px}
#ml-p1d,#ml-p2d{margin-top:6px}
canvas.plot.ml-strip{aspect-ratio:5/2}
.ml-tcload{display:block;margin-top:8px}
.ml-guess{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.ml-guessres{display:block;margin-top:6px;font-weight:700}
.ml-sense{display:block;font-weight:700;margin-bottom:2px}
.ml-ol{margin:6px 0 0;padding-left:1.3em}
.ml-ol li{margin:4px 0}
/* crossing finder */
.ml-cchip .tag{font-size:.7rem;vertical-align:middle}
.ml-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ml-step,.ml-stb{min-width:0}
.ml-step{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.ml-step.cur{border-color:var(--ink)}
.ml-step.todo{opacity:.6}
.ml-step.done .ml-stn{background:var(--good-bg);color:var(--green);border-color:var(--green)}
.ml-sth{margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.ml-stn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;font-size:.85rem}
.ml-stb{margin-top:8px}
.ml-stb > p{margin:0 0 8px}
.ml-tcap{margin:10px 0 4px!important;font-weight:700}
.ml-tbl{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 6px;align-items:stretch}
.ml-tlab,.ml-tc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;min-width:46px;padding:.3em .4em;border-radius:6px;font:400 .95rem var(--font-math)}
.ml-tlab{color:var(--ink-2);background:var(--paper);border:1.5px solid var(--rule)}
.ml-tc{border:2px solid var(--rule);background:var(--sheet);color:var(--ink);min-height:44px}
.ml-tc .ml-tx{font-weight:700}
.ml-tc .ml-th{font-size:.88rem}
.ml-tc[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.ml-tc:disabled{opacity:.85}
.ml-c5{margin:6px 0 0}
.ml-ivrow{display:flex;gap:4px;overflow-x:auto;align-items:stretch;padding:8px 2px 6px}
.ml-st{flex:1 0 auto;min-width:60px;border:2px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:6px;padding:.45em .5em;font-size:.85rem;font-weight:700;white-space:nowrap;min-height:40px}
.ml-st[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);color:var(--ink)}
.ml-pt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;border:1.5px dashed var(--ink-2);background:var(--paper);color:var(--ink);border-radius:6px;padding:.2em .3em;font-size:.78rem;line-height:1.15}
.ml-pt b{font-size:1rem;color:var(--pen)}
.ml-pt:disabled{opacity:.45;border-style:dotted}
.ml-pt[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}
.ml-ivans .m{font-size:1.2rem}
.ml-algt{margin:12px 0 4px}
/* task */
.ml-steprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 10px}
.ml-steprow label{flex:1 1 14rem;font-size:.95rem}
.ml-stepper{display:inline-flex;align-items:center;gap:6px}
.ml-stepper .btn{min-width:40px;min-height:40px;padding:.3em .6em;font-size:1.1rem}
.ml-stepper .numin{width:5rem;text-align:center}
.ml-tkcap{font-size:1.4rem}
.ml-afterm{margin-top:8px}
@media (max-width:820px){
  .ml-lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"g" "c" "r"}
}
@media (max-width:560px){
  .ml-tfull{display:none}
  .ml-tyear{display:block}
  canvas.plot.ml-tall{aspect-ratio:3/4}
  canvas.plot.ml-strip{aspect-ratio:2/1}
  .ml-tabs button{padding:.4em .5em}
}

,"title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"3e92e1a8","content":{"id":"49-modelling-with-combined-functions","kind":"topic","title":"Modelling with combined functions","topic":"Modelling with Combined Functions","readyTopic":"modelling with combined functions","hero":{"eq":"\u003cspan class=\"ml-heq\">\u003cspan class=\"ml-hp\">`P(t) =`\u003c/span> \u003cspan class=\"ml-hp\">`0.5t + 20`\u003csmall>trend\u003c/small>\u003c/span> \u003cspan class=\"ml-hp\">`+`\u003c/span> \u003cspan class=\"ml-hp\">`@a{5} cos[@k{{π}/{6}} (t - @d{6})]`\u003csmall>yearly wave\u003c/small>\u003c/span>\u003c/span>","eqLabel":"P of t equals 0.5 t plus 20, the trend, plus 5 cos of pi over 6 times t minus 6, the yearly wave","eqSize":"sm","headline":"Real data rarely follows one function. Combine two, then check what’s left.","text":"A lake ferry carries more passengers every year as a town grows, and more every summer as tourists arrive. No single function does both. A \u003cstrong>combined model\u003c/strong> does: a linear \u003cstrong>trend\u003c/strong> plus a sinusoidal \u003cstrong>wave\u003c/strong>. Other situations need a product, such as a wave inside a shrinking \u003cstrong>envelope\u003c/strong>, or a level plus a decaying exponential. You’ll judge each model by its \u003cstrong>leftovers\u003c/strong>, the gaps between the data and the model, and you’ll solve equations that algebra can’t by finding where graphs cross.","fig":{"aria":"Ferry passengers each month for three years. A rising trend line runs through the readings; the readings minus the trend form a wave; trend plus wave fits the readings closely."}},"goals":["I can choose a type of function for a situation or a data set from its features: steady differences, steady second differences, steady ratios, a repeating cycle or a level it settles toward.","I can build a model by combining functions (adding a trend and a wave, adding a level and a decay, multiplying a wave by an envelope, or putting one function inside another) and explain what each part means in the situation.","I can judge a model by its leftovers (data − model) and use the pattern in the leftovers to decide what to add or change.","I can solve equations and inequalities that algebra can’t, by finding where two graphs cross and narrowing each crossing down with a table of values.","I can use a combined model to answer questions in context and say where the model stops making sense."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Function types","goal":1,"prompt":"Which table shows an exponential function? Each table lists `y` for `x = 0, 1, 2, 3`.","options":[{"t":"2, 6, 18, 54","why":"Each value is 3 times the one before: 6/2 = 18/6 = 54/18 = 3. A steady ratio means exponential: `y = 2(3)^x`.","_n":"08f3","_k":"a77b556b"},{"t":"2, 3, 6, 11","why":"The first differences are 1, 3, 5 and the second differences are 2, 2: steady second differences mean quadratic. The ratios 3/2, 6/3, 11/6 aren’t equal.","_n":"1923","_k":"8a2361a6"},{"t":"2, 6, 10, 14","why":"The first differences are all 4, so this is linear. Exponential tables have a steady \u003cstrong>ratio\u003c/strong>.","_n":"2913","_k":"43cbc676"},{"t":"2, 6, 2, 6","why":"The values go up and back down again: that’s a repeating pattern, not growth. The ratios are 3, 1/3, 3.","_n":"38c2","_k":"c709629d"}],"hints":["Exponential means the same \u003cstrong>ratio\u003c/strong> from each value to the next.","Divide each value by the one before it. Which table gives the same answer every time?","2, 6, 18, 54: the ratio is 3 every time. That table is exponential."]},{"id":"w2","skill":"Function types","goal":1,"prompt":"Which function’s graph has the horizontal asymptote `y = 20`?","options":[{"t":"`y = 20 + 60 sin x`","why":"This keeps swinging between −40 and 80 forever. `y = 20` is its axis, not a level it settles toward.","_n":"48b2","_k":"61c3b133"},{"t":"`y = 60(1/2)^x`","why":"`60(1/2)^x` shrinks toward 0. Its asymptote is `y = 0`.","_n":"58e3","_k":"b4cd468a"},{"t":"`y = 20x + 60`","why":"A line with slope 20 keeps rising; it never levels off.","_n":"68d2","_k":"6812b057"},{"t":"`y = 20 + 60(1/2)^x`","why":"As `x` grows, `60(1/2)^x` shrinks toward 0, so `y` gets closer and closer to 20 without reaching it.","_n":"7882","_k":"92eca5f9"}],"hints":["A horizontal asymptote is a level the graph settles toward as `x` grows.","Which part of each function shrinks to 0 as `x` grows? What’s left over?","In `20 + 60(1/2)^x` the exponential part shrinks to 0 and leaves 20. The asymptote is `y = 20`."]},{"id":"w3","skill":"Combining functions","goal":2,"prompt":"`f(x) = 3x + 2` and `g(x) = x^2`. What is `(f + g)(2)`?","options":[{"t":"12","why":"`(f + g)(2) = f(2) + g(2) = 8 + 4 = 12`.","_n":"8872","_k":"ca771421"},{"t":"14","why":"14 is `f(g(2)) = f(4) = 14`. `(f + g)(2)` adds the two values at `x = 2`.","_n":"99c9","_k":"026c2e45"},{"t":"32","why":"32 is `f(2) · g(2) = 8 × 4`, the product `(f · g)(2)`.","_n":"a9d9","_k":"63f62a1a"},{"t":"64","why":"64 is `g(f(2)) = g(8)`. The sum just adds `f(2)` and `g(2)`.","_n":"b9e9","_k":"0d944694"}],"hints":["`(f + g)(2)` means `f(2) + g(2)`.","`f(2) = 3(2) + 2 = 8` and `g(2) = 2^2 = 4`.","8 + 4 = 12."]},{"id":"w4","skill":"Combining functions","goal":2,"prompt":"`f(t) = 10(1/2)^t` and `g(t) = cos(πt)`. What is `(f · g)(3)`?","options":[{"t":"−1.25","why":"`f(3) = 10/8 = 1.25` and `g(3) = cos(3π) = -1`, so the product is −1.25.","_n":"c9f9","_k":"a82c5409"},{"t":"0.25","why":"0.25 is 1.25 + (−1), the sum. The product multiplies the two values.","_n":"d989","_k":"20335a53"},{"t":"1.25","why":"`cos(3π) = -1`, so the wave flips the value to the other side: −1.25.","_n":"e999","_k":"84dcefa7"},{"t":"20","why":"20 is `f(g(3)) = f(-1) = 10(1/2)^{-1}`. The product multiplies `f(3)` by `g(3)`.","_n":"f9a9","_k":"618004ec"}],"hints":["`(f · g)(3)` means `f(3) × g(3)`.","`f(3) = 10(1/2)^3 = 10/8`. For `g(3)`, where is 3π on the unit circle?","`f(3) = 1.25` and `cos(3π) = cos π = -1`, so the product is −1.25."]},{"id":"w5","skill":"Sinusoid features","goal":2,"fixedOrder":true,"prompt":"What is the period of `y = 5 cos[π/6 (t - 6)] + 20`?","options":[{"t":"`π/6`","why":"π/6 is `k`. The period is 2π ÷ `k`.","_n":"g9b9","_k":"ad650646"},{"t":"5","why":"5 is the amplitude: the wave goes 5 above and below its axis.","_n":"ha49","_k":"9179144b"},{"t":"12","why":"Period = 2π ÷ (π/6) = 12.","_n":"ia59","_k":"a6f36324"},{"t":"20","why":"20 is the axis, `y = 20`.","_n":"jae9","_k":"91e10754"}],"hints":["Period = `2π/k`. Which number is `k`?","`k = π/6`, the number multiplying `(t - 6)`.","2π ÷ (π/6) = 2π × 6/π = 12."]},{"id":"w6","skill":"Exponential decay","goal":5,"fixedOrder":true,"prompt":"A drink is 48&nbsp;°C above room temperature, and that difference halves every 10 min. How far above room temperature is it after 30 min?","options":[{"t":"6&nbsp;°C","why":"30 min is 3 halvings: 48 → 24 → 12 → 6.","_n":"kad9","_k":"2bc22573"},{"t":"16&nbsp;°C","why":"48 ÷ 3 = 16 divides by 3. Three halvings divide by 2 × 2 × 2 = 8.","_n":"lb09","_k":"3deb2c76"},{"t":"18&nbsp;°C","why":"48 − 30 = 18 takes off 10&nbsp;°C every 10 min. Halving takes half of \u003cstrong>what’s left\u003c/strong> each time.","_n":"maf9","_k":"73ea6cd8"},{"t":"24&nbsp;°C","why":"24 is one halving, after 10 min. In 30 min there are three.","_n":"naa9","_k":"46bfd97c"}],"hints":["How many 10-minute halvings fit in 30 min?","Three. Halve 48 three times.","48 → 24 → 12 → 6. The drink is 6&nbsp;°C above room temperature."]}],"refreshers":{"Function types":"Test a table before you name its type. Equal steps in `x`, then: steady first differences mean linear; steady second differences mean quadratic; a steady ratio from each value to the next means exponential; values that repeat in a cycle mean sinusoidal. Example: 2, 6, 18, 54 has ratio 3 each time, so it’s exponential. A graph that settles toward a level, like `20 + 60(1/2)^x`, has a horizontal asymptote at that level.","Combining functions":"`(f + g)(x) = f(x) + g(x)`; `(f · g)(x) = f(x) · g(x)`; `f(g(x))` puts `g`’s output into `f`. Always find each function’s value at the \u003cstrong>same\u003c/strong> `x` first. Example: `f(x) = 3x + 2` and `g(x) = x^2` at `x = 2`: sum 8 + 4 = 12, product 8 × 4 = 32, `f(g(2)) = f(4) = 14`.","Sinusoid features":"In `y = a cos[k(t - d)] + c`: the amplitude is `|a|`, the period is `2π/|k|`, a maximum is at `t = d` (when `a > 0`), and the axis is `y = c`. Example: `5 cos[π/6 (t - 6)] + 20` has amplitude 5, period 12, a peak at `t = 6` and axis `y = 20`.","Exponential decay":"“Halves every `h` minutes” means `A(1/2)^{t/h}`: after each `h` minutes, half of what’s left remains. Count the halvings, then divide by 2 that many times. Example: 48&nbsp;°C halving every 10 min, after 30 min: 48 → 24 → 12 → 6&nbsp;°C."}}},"explore":{"heading":"Model lab","intro":"Pick a data set. Choose the kind of function for each part, add or multiply them, and tune the sliders until the gaps shrink. Then look at what’s left over: the leftovers tell you what your model is still missing.","data":{"tea":{"name":"Tea","letter":"T","unit":"°C","what":"temperature (°C)","tUnit":"min","tOne":"minute","t0":0,"dt":5,"story":"A mug of tea cools on a desk in a 20&nbsp;°C room. Its temperature is read every 5 minutes for an hour.","y":[84,65.5,51.8,42.7,36,31.2,28.2,25.5,24.1,22.8,22.1,21.3,21]},"ferry":{"name":"Ferry","letter":"P","unit":"thousand","what":"passengers per month (thousands)","tUnit":"months","tOne":"month","t0":0,"dt":1,"story":"A lake ferry’s passengers each month, in thousands, from January of year 1 (`t = 0`) to December of year 3 (`t = 35`). A town on the far shore keeps growing, and summer brings tourists.","y":[15.2,15.9,18.6,21.8,24.3,26.8,28.1,27.7,26.2,24.6,22.5,21,20.9,22.5,24.3,27.5,30.7,32.7,34.3,33.6,32.6,30.2,28.7,27.2,27.1,28,30.5,33.7,36.2,38.9,40.2,39.6,38.5,36.4,34.7,33.1]},"spring":{"name":"Spring","letter":"y","unit":"cm","what":"position above rest (cm)","tUnit":"s","tOne":"second","t0":0,"dt":0.5,"story":"A weight hangs on a long spring in a physics lab, with a paddle in a tub of water to slow it. It’s lifted 24 cm and let go at `t = 0`. Its position (cm above its resting position) is read every 0.5 s.","y":[24,14.4,-0.1,-10,-12,-7.2,0.1,5,5.9,3.7,0,-2.6,-2.9,-1.8,-0.1,1.4,1.5]},"swing":{"name":"Swing","letter":"y","unit":"cm","what":"distance from the lowest point (cm)","tUnit":"s","tOne":"second","t0":0,"dt":0.5,"story":"A parent pushes a swing a little harder each time it comes back. Its distance from the lowest point (cm, + toward the parent) is read every 0.5 s.","y":[6,5.5,-0.1,-7.2,-11.9,-9.7,0,11.8,17.9,14,0,-16.1,-23.9,-18.1,0.2,20.2,30.1]}},"idealised":"Idealised data, made up for this lab.","locked":"Unlocks at challenge 3","productNote":"In a product, Part 1 sets the size.","noneYet":"None yet: choose a part to add or multiply.","zeroNote":"Part 1 is 0 at `t` = {list}, so the data can’t be divided by it there.","fit":{"close":"Close fit: every gap is 1 or less. Now check the leftovers for a pattern.","near":"Getting close: the biggest gaps are at `t` = {t1} and `t` = {t2}.","far":"Not a good fit yet. Switch to Leftovers to see what’s missing.","hidden":"Hidden for this challenge."},"sense":{"teaLow":"Colder than the 20&nbsp;°C room. A drink can’t cool below its room, so the model breaks down here.","teaHigh":"Hotter than the tea started. Something in the model is growing.","teaRoom":"About room temperature: the tea has finished cooling. Sensible.","teaMid":"Between room temperature and the starting temperature. Sensible so far.","ferryNeg":"Negative passengers: impossible.","ferryGrow":"This assumes the town keeps adding {m} thousand passengers a month for {yrs} more years. Three years of data can’t tell you whether that’s likely.","ferryFlat":"This assumes passenger numbers stop growing.","springBig":"Bigger than the spring’s first swing of 24 cm. A damped spring’s swings can’t grow, so the model breaks down here.","springNoFade":"The swings never fade: a real spring with a damper comes to rest.","springOk":"Small and fading: sensible.","swing":"This assumes the parent keeps pushing harder forever. At `t = 24` s the swing would be {env} cm out."},"predIntro":"Make a prediction first. Then the Model lab will show you what really happens.","predictions":[{"id":"p1","prompt":"The trend `0.5t + 20` runs through the middle of the ferry data. If you subtract it from every reading (Leftovers, After Part 1), what will the leftover points look like?","options":[{"t":"Points scattered around 0 with no pattern","_n":"oa99","_k":"44aaff55"},{"t":"A wave centred on 0 that repeats every 12 months, about 5 above and below","_n":"pac9","_k":"833b78a7"},{"t":"A wave whose swings get bigger each year","_n":"qab9","_k":"99d25158"},{"t":"A straight line rising 0.5 per month","_n":"ra69","_k":"1ca233ef"}],"explain":"The trend has taken care of the steady growth. What’s left is what the trend can’t explain: the yearly ups and downs, about 5 above and below 0, peaking every July. That’s the model’s missing second part, a wave. When the leftovers have a pattern, the model isn’t finished."},{"id":"p2","prompt":"Over the three years, the trend is largest in month 35 (37.5), and the wave is largest, 5, in every July. What’s the largest value of the whole model `P(t)` for `t = 0, 1, …, 35`?","options":[{"t":"33.2","_n":"sa59","_k":"aaa909e5"},{"t":"37.5","_n":"ta89","_k":"17718b8b"},{"t":"40","_n":"ua99","_k":"77f7664c"},{"t":"42.5","_n":"va69","_k":"77c94503"}],"explain":"The trend’s largest value and the wave’s largest value happen in different months, so you can’t just add them. In December of year 3 the trend is 37.5, but the wave is near its low, so `P(35) ≈ 33.2`. In July of year 3 the wave peaks while the trend is 35: `P(30) = 40`, the most of any month. The largest value of a sum is at most the sum of the largest values, and usually less."},{"id":"p3","prompt":"The envelope `24(1/2)^{t/2}` fits the shrinking swings. If you \u003cstrong>divide\u003c/strong> every reading by it (Leftovers, After Part 1), what will the leftover points look like?","options":[{"t":"A wave between −1 and 1 whose swings don’t shrink","_n":"wa79","_k":"8c23b03c"},{"t":"A wave whose swings grow","_n":"xac9","_k":"04968d5c"},{"t":"A wave that still shrinks, but more slowly","_n":"yad9","_k":"fc3b230a"},{"t":"A flat line at 1","_n":"zaa9","_k":"23f8e4b0"}],"explain":"Dividing by the envelope undoes the shrinking. What’s left is a plain wave between −1 and 1 that repeats every 4 s and starts at its peak: `cos(π/2 t)`. So the model is the envelope times the wave: `y(t) = 24(1/2)^{t/2} cos(π/2 t)`. Same-size swings: add. Swings that shrink or grow in proportion: multiply."},{"id":"p4","note":"Ravi’s model is within 1.2&nbsp;°C of the first three readings.","prompt":"What does Ravi’s model give at `t = 60` min, where the reading is 21.0&nbsp;°C?","fixedOrder":true,"options":[{"t":"0&nbsp;°C","_n":"10ab9","_k":"98cc08a4"},{"t":"About 5&nbsp;°C","_n":"11a09","_k":"ae196ed0"},{"t":"20&nbsp;°C","_n":"12a19","_k":"ffdad595"},{"t":"21&nbsp;°C","_n":"132a8","_k":"dd507082"}],"explain":"`84(1/2)^{60/15} = 84(1/2)^4 = 84/16 = 5.25` °C. A single exponential shrinks toward 0, so it says the tea will end up colder than the room. Subtract the room temperature from the readings instead: 64.0, 31.8, 16.0, 8.2 at `t = 0, 10, 20, 30`. \u003cstrong>Those\u003c/strong> halve about every 10 min. Room temperature plus a shrinking exponential is the model to try."}],"chalIntro":"Set the lab, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help, and a button that loads its starting state.","challenges":[{"id":"tc1","goal":[2,3,5],"prompt":"The room is 20&nbsp;°C. Build a model of the \u003cstrong>Tea\u003c/strong> data whose gaps are all 1&nbsp;°C or less \u003cstrong>and\u003c/strong> which levels off at the room temperature in the long run. \u003cspan class=\"ml-tcload\">\u003cbutton type=\"button\" class=\"btn ghost sm\" data-tcload=\"tc1\">Load the Tea starting state\u003c/button>\u003c/span>","why":"Room temperature plus a shrinking extra heat: the constant 20 holds the room’s level, and the exponential carries the heat above the room, which halves every 10 min.","hints":["What temperature does the tea end up at? That’s a constant part of the model.","Make Part 1 Linear with `m = 0` and `b = 20`, and Part 2 an exponential that halves. In Leftovers (After Part 1), the points are the extra heat above the room.","The extra heat is 64.0 at `t = 0` and about half that, 31.8, at `t = 10`. Set `A = 64` and `h = 10`: `T(t) = 20 + 64(1/2)^{t/10}`."]},{"id":"tc2","goal":[2,3],"prompt":"Build a model of the \u003cstrong>Ferry\u003c/strong> data whose gaps are all 1 thousand passengers or less. \u003cspan class=\"ml-tcload\">\u003cbutton type=\"button\" class=\"btn ghost sm\" data-tcload=\"tc2\">Load the Ferry starting state\u003c/button>\u003c/span>\u003cspan class=\"ml-guess\" data-guess-host=\"1\">\u003cspan class=\"tiny\">How big do you expect your largest gap to be?\u003c/span> \u003cbutton type=\"button\" class=\"chip\" data-guess=\"lo\" aria-pressed=\"false\">Under 0.5\u003c/button> \u003cbutton type=\"button\" class=\"chip\" data-guess=\"mid\" aria-pressed=\"false\">0.5 to 1\u003c/button> \u003cbutton type=\"button\" class=\"chip\" data-guess=\"hi\" aria-pressed=\"false\">Over 1\u003c/button>\u003c/span>","why":"A rising trend carries the town’s growth and an added wave carries the summer peaks: `P(t) = 0.5t + 20 + 5 cos[π/6 (t - 6)]`.","hints":["Fit the trend first, then look at what’s left.","A line through the middle of the data starts near 20 and rises about 6 per year: `m = 0.5` per month. The leftovers then swing about 5 above and below 0 and peak every July.","Part 1 Linear, `m = 0.5`, `b = 20`. Part 2 Wave, added, `a = 5`, `T = 12`, `d = 6`: `P(t) = 0.5t + 20 + 5 cos[π/6 (t - 6)]`."]},{"id":"tc3","goal":[1,2],"stretch":true,"prompt":"Use the \u003cstrong>Swing\u003c/strong> data. Build a model whose gaps are all 1 cm or less. For this challenge the gap rows and the “After the whole model” leftovers are hidden: read the peaks and reason it out. \u003cspan class=\"ml-tcload\">\u003cbutton type=\"button\" class=\"btn ghost sm\" data-tcload=\"tc3\">Open challenge 3: load the Swing data\u003c/button>\u003c/span>","why":"Linear envelope × wave. The swing’s size grows by equal steps, so the envelope is linear; the spring’s size shrank by equal ratios, so its envelope was exponential.","hints":["List the sizes of the peaks and troughs, and the times they happen. How do the sizes change?","6, 12, 18, 24, 30 at `t = 0, 2, 4, 6, 8`: the same increase, 6 cm, every 2 s. That’s a linear envelope, `3t + 6`, multiplying a wave.","Part 1 Linear, `m = 3`, `b = 6`; ×; Part 2 Wave with `T = 4` (a full swing out and back) and `d = 0`: `y(t) = (3t + 6) cos(π/2 t)`."]}],"guess":{"lo":"Under 0.5","mid":"0.5 to 1","hi":"Over 1","line":"Your prediction: {guess}. Your largest gap at the last check: {gap} thousand."},"fb":{"tc1":{"set":"This challenge uses the Tea data. Choose Tea, or press the button above to load its starting state.","expOnly":"A single exponential heads toward 0&nbsp;°C. The tea can only cool to the room’s 20&nbsp;°C. Make Part 1 Linear with `m = 0` to hold the room temperature, and add an exponential for the extra heat.","drift":"Every gap is 1&nbsp;°C or less, but your trend changes by {m} °C every minute forever. In the Forecast view it predicts {v180} °C at `t = 180` min, but the tea will sit at the room’s 20&nbsp;°C. Set `m = 0`.","level":"Your model levels off at {b} °C. The room is 20&nbsp;°C.","level21":"21.0&nbsp;°C is the last reading, and the tea is still cooling then. The room is 20&nbsp;°C.","doubles":"Your exponential part doubles, so the model heats the tea up. The extra heat should halve.","close":"The structure is right. Your largest gap is {gap} °C at `t` = {at}. The readings minus 20 are 64.0, 31.8, 16.0 and 8.2 at `t = 0, 10, 20` and 30: what’s the starting extra heat, and how long does it take to halve?","other":"Subtract the room temperature first: set Part 1 to Linear, `m = 0`, `b = 20`, and look at Leftovers, After Part 1."},"tc2":{"set":"This challenge uses the Ferry data. Choose Ferry, or press the button above to load its starting state.","none":"One function can’t follow both the growth and the summer peaks. Fit the trend, then look at Leftovers: what’s left?","period":"Your wave repeats every {T} months. In the data, one summer peak to the next is 12 months.","peak":"Your wave peaks at `t` = {d} ({month}). The data peaks every July: `t = 6, 18` and 30.","amp":"Your wave swings {a} above and below the trend. The leftovers only reach about 5 above and below 0: the amplitude is half of the swing from the lowest leftover to the highest.","times":"Multiplying a wave by the trend makes the model swing around 0, not around the trend, and the swings grow as the trend grows. Here the data swings around a rising centre by about the same amount each year, so \u003cstrong>add\u003c/strong> the wave.","trend":"The wave is right. Check the trend: in Leftovers (After Part 1), the leftovers should swing evenly around 0 from the first month to the last. Yours drift {dir}.","other":"Fit the trend first, then the wave. Your largest gap is {gap} at `t` = {at}."},"tc3":{"set":"This challenge uses the Swing data. Press the button above to open it.","expWave":"Your envelope grows by the same \u003cstrong>factor\u003c/strong> each time. The peak sizes 6.0, 11.9, 17.9, 23.9 and 30.1 grow by the same \u003cstrong>amount\u003c/strong>, about 6 every 2 s. Equal steps mean a linear envelope.","add":"Adding a wave keeps every swing the same size. These swings get wider, so the wave must be multiplied by something that grows.","half":"From +6 at `t = 0` to −11.9 at `t = 2` is only half a swing. Back out to the same side takes 4 s.","m6":"Your swings grow 6 cm every second. They grow about 6 cm every \u003cstrong>2\u003c/strong> s, so `m = 3` cm per second.","flip":"Your model starts at −{b} cm, on the other side. The swing starts 6 cm out toward the parent, at a peak.","b0":"At `t = 0` the swing is already 6 cm out, so the envelope starts at 6.","other":"List the size of each peak and the time it happens, then decide: equal steps or equal ratios?"}}},"part3":{"slug":"solve","name":"Solve with graphs","heading":"Solve it with graphs","intro":"Some equations can’t be solved with algebra, but they still have solutions. Pick a problem. Count the crossings, trap each one between two numbers, then zoom in.","steps":{"s1":{"title":"Make one side zero","btn":"Write it as {h0}","text":"Every crossing of the two graphs is a zero of `h`."},"s2":{"title":"Count the crossings","text":"Tap each crossing on the top graph, then press \u003cstrong>Done\u003c/strong>. Zoom in where the graphs are close.","none":"The graphs don’t meet there: `h` is {sign} at that {v}.","empty":"Tap each place where the two graphs cross, then press Done."},"s3":{"title":"Bracket each crossing","text":"The table lists `h` at {unit}. Tap the two neighbouring rows where the sign of `h` changes, once for each crossing, then press Check.","wrong":"`h` is {sign} at both {p} and {q}, so this pair doesn’t trap a crossing.","apart":"Tap two \u003cstrong>neighbouring\u003c/strong> rows for each crossing.","missing":"There’s another sign change in the table. Look for it."},"s4":{"title":"Zoom ×10","text":"The table now lists tenths inside each bracket. Tap the sign change again, then press Check.","again":"Zoom ×10 again","hund":"Hundredths inside the bracket. Tap the sign change to narrow it once more.","zero":"`h` = 0 exactly at {p}: that’s an exact crossing you already know. Find the place where `h` changes sign.","report":"{v} is between {p} and {q}."},"s5":{"title":"Answer the question"}},"cards":[{"id":"s1","chip":"S1","v":"t","title":"Ferry demand meets capacity","problem":"Ferry demand `P(t) = 0.5t + 20 + 5 cos[π/6 (t - 6)]` (thousands per month) meets capacity, 39 thousand. In which months is demand above capacity?","eq":"`P(t) = 39`","h":"`h(t) = P(t) - 39`","fLab":"y = P(t)","gLab":"y = 39","unit":"whole months","missing":["There’s another crossing. Look near `t = 29`, where the demand curve first rises above the capacity line.","There’s another crossing. Look near `t = 32`, where the demand curve falls back below the capacity line."],"ask":"In which months is demand above capacity?","choices":[{"t":"July and August of year 3","fb":"Right. The model is for monthly totals, so read whole months: `t = 30` and `t = 31` are inside the interval. Demand is above capacity in July and August of year 3.","_n":"14298","_k":"83f0150e"},{"t":"29.1 and 31.7","fb":"Those are the crossing times; the question asks for the months between them.","_n":"15288","_k":"1d6bcf7d"},{"t":"June to August of year 3","fb":"`t = 29` is June: `h(29) ≈ -0.2`, just under capacity.","_n":"16278","_k":"ba59f4b5"},{"t":"Every July","fb":"Years 1 and 2 peak at 28 and 34 thousand, under 39.","_n":"172e8","_k":"beaab3e2"}],"_a":"ESRbXRNUQVtSFVhRDEUYGFUKSxIEUw5NR0ULC0sAQR5fEQISBUUBGBUJTQlFAlAWBEkZQQoRFVBWRU5aCl0EGF4KV0YNQkFYR0UEElYBARhSC10SVgBbGHkQVUtFUA9cEyRMVRBCFRhcAxlLAFATGABLGw=="},{"id":"s2","chip":"S2","v":"t","title":"Plan B overtakes Plan A","problem":"Plan A: $1000 plus $150 a year, `A(t) = 1000 + 150t`. Plan B: $500 doubling every 4 years, `B(t) = 500 · 2^{t/4}`. When does Plan B overtake Plan A?","eq":"`B(t) = A(t)`","h":"`h(t) = B(t) - A(t)`","fLab":"y = B(t)","gLab":"y = A(t)","unit":"whole years","missing":["There’s a crossing for `t ≥ 0`. Look where the doubling curve passes the line, between `t = 8` and `t = 10`."],"ask":"When does Plan B overtake Plan A?","choices":[{"t":"Never","fb":"A doubling amount always overtakes a steady one: `B(12) = 4000 > 2800`.","_n":"182d8","_k":"b5e135a8"},{"t":"After 12 years","fb":"By `t = 12` Plan B is already ahead; the crossing is between 8 and 9.","_n":"192c8","_k":"eca52b8a"},{"t":"During the 9th year (between 8 and 9 years)","fb":"Right. `h(8) = -200 \u003c 0` and `h(9) ≈ 28 > 0`, so Plan B passes Plan A after about 8.9 years: during the 9th year.","_n":"1a2b8","_k":"1cc489c0"},{"t":"After 4 years","fb":"That’s one doubling: `B(4) = 1000`, still below `A(4) = 1600`.","_n":"1b228","_k":"22890acc"}],"_a":"ESRfRgBDQVlRCkxGRQlPARMcXFMXQlsYVxBLWwtWQUxbABkLEVlBQVYESxxH"},{"id":"s3","chip":"S3","v":"x","title":"A wave meets a line","problem":"Where does the wave `y = cos x` meet the line `y = x/2`? (`x` in radians)","eq":"`cos x = x/2`","h":"`h(x) = cos x - x/2`","fLab":"y = cos x","gLab":"y = x/2","unit":"whole numbers","missing":["Look between `x = 0` and `x = 2`, where the falling wave meets the rising line."],"near":"`h(-2) = cos(-2) + 1 ≈ 0.58 > 0`: the wave is above the line there. For negative `x` the line stays below the wave.","_a":"EQVBEoe46RgCSwkBBRM="},{"id":"s4","chip":"S4","v":"x","stretch":true,"title":"An inequality","problem":"Solve `x^3 \u003c 3^x`.","eq":"`x^3 = 3^x`","h":"`h(x) = x^3 - 3^x`","fLab":"y = x³","gLab":"y = 3ˣ","unit":"whole numbers","missing":["There’s another crossing. Look between `x = 2` and `x = 3`, where the graphs are close."],"chipQ":"The whole-number table has no sign change, but you counted two crossings. What does that tell you?","chipChoices":[{"t":"The other crossing hides between two whole numbers, where `h` goes above 0 and comes back","fb":"Right.","_n":"1c218","_k":"36d5cf15"},{"t":"There’s only one solution, `x = 3`","fb":"You counted two crossings on the graph. A table at whole numbers can step right over a short stretch where `h > 0`.","_n":"1da48","_k":"07f5bb95"},{"t":"There are no solutions","fb":"`h(3) = 27 - 27 = 0`, so `x = 3` is an exact solution.","_n":"1ea58","_k":"f29b4ec9"},{"t":"The graph must be wrong","fb":"The graph is right: zoom in between 2 and 3 and look.","_n":"1fa68","_k":"a88359b1"}],"after":"`x = 3` is exact, and the other crossing hides between 2 and 3. Whole numbers missed it. Zoom the table to tenths between 2 and 3.","ask":"Build the solution of `x^3 \u003c 3^x`. The number line is cut at the crossings `a ≈ 2.48` and 3. Tap the pieces where `h \u003c 0`, then set each cut ○ left out or ● included.","ivFb":{"mid":"There `h > 0`, so `x^3 > 3^x`. Check `x = 2.8`: 21.95 vs 21.67.","closed":"At the crossings `x^3 = 3^x` exactly, and the inequality is strict (&lt;), so leave them out.","left":"For negative `x`, `x^3` is negative and `3^x` is positive, so `x^3 \u003c 3^x` there.","right":"Beyond 3 the exponential pulls ahead for good: at `x = 4`, 64 \u003c 81, so `x^3 \u003c 3^x` there."},"_a":"EQURH4e5/xQTBBASh7nLGBtWFRKHuf8RU0kZRQ1UE10TBVgSh7jpGAFLDQoFH0M="}],"alg":[{"t":"Why algebra can’t","html":"In `2^x = 3x` or `500 · 2^{t/4} = 1000 + 150t`, the unknown is in an exponent \u003cstrong>and\u003c/strong> outside it. Taking logs gives `(t/4) log 2 + log 500 = log(1000 + 150t)`: `t` is still inside and outside a log. In `cos x = x/2`, `x` is inside the cosine and outside it. No algebra step can isolate it."},{"t":"S1 by hand","html":"`P(29) = 14.5 + 20 + 5 cos(23π/6) = 34.5 + 2.5√3 ≈ 38.83 \u003c 39`, and `P(30) = 15 + 20 + 5 cos(4π) = 40 > 39`. The sign of `h` changes, so a crossing lies between 29 and 30.","use":"`√3 ≈ 1.73`"},{"t":"S2 by hand","html":"`B(8) = 500 · 2^2 = 2000 \u003c 2200 = A(8)`. `B(9) = 2000 · 2^{1/4} ≈ 2000 × 1.19 = 2380 > 2350 = A(9)`. So Plan B overtakes between 8 and 9 years.","use":"`2^{1/4} ≈ 1.19`"},{"t":"S3 by hand, exactly","html":"1 \u003c π/3, and cosine decreases from 0 to π, so `cos 1 > cos(π/3) = 1/2`: `h(1) > 0`. At `x = π/3`: `h = 1/2 - π/6 \u003c 0`, because π > 3. So the crossing is between 1 and π/3 ≈ 1.05. And why there’s only one: from 0 to 2, `cos x` falls and `x/2` rises, so they cross once. Beyond 2, `x/2 > 1 ≥ cos x`; and for negative `x` the line is below the wave."},{"t":"S4 by hand","html":"At `x = 2`: 8 \u003c 9. At `x = 2.5`: `2.5^3 = 15.625` but `3^{2.5} = 9√3 ≈ 15.59` (`√3 ≈ 1.732`), so `x^3 > 3^x`. The sign changes between 2 and 2.5. At `x = 3` both are 27."},{"t":"Why a sign change works","html":"If `h` has an unbroken graph, it can’t get from below 0 to above 0 without crossing 0. That’s why the method needs \u003cstrong>no breaks\u003c/strong>: across a vertical asymptote, a function can jump from negative to positive without ever being 0."}],"blocks":[{"title":"What the method means","html":"\u003cdiv class=\"refresh\">\u003ch4>Solving when algebra can’t\u003c/h4>\u003col class=\"ml-ol\">\u003cli>Move everything to one side: `h(x) = f(x) - g(x)`. The solutions of `f(x) = g(x)` are the zeros of `h`: the `x`-values where the graphs cross.\u003c/li>\u003cli>Graph first and count the crossings. Look at negative `x` too, and zoom in where the graphs are close.\u003c/li>\u003cli>Trap each crossing with a sign change: if `h(p)` and `h(q)` have opposite signs and the graph has no break between them, a zero lies between `p` and `q`.\u003c/li>\u003cli>Zoom ×10 to narrow the bracket to the precision you need.\u003c/li>\u003cli>For an inequality, read where `h` is negative (or positive) between the crossings. &lt; and &gt; leave the crossings out; ≤ and ≥ keep them.\u003c/li>\u003c/ol>\u003c/div>"}],"quickCheck":{"title":"Solve it with graphs","summary":"Solve it with graphs quick check","items":[{"id":"q1","goal":4,"prompt":"`f` and `g` have unbroken graphs, and `h(x) = f(x) - g(x)`. `h(4) = -3` and `h(5) = 2`. Which statement must be true?","right":"Right. `h` goes from negative to positive with no break, so it crosses 0 somewhere between 4 and 5. That’s all the two values tell you.","wrong":"The sign change only guarantees a crossing \u003cstrong>somewhere\u003c/strong> between 4 and 5. It doesn’t say where (4.5 is just the middle), and it says nothing about other crossings or about `x > 5`.","choices":[{"t":"`f(x) = g(x)` has exactly one solution","_n":"1ga78","_k":"03472a45"},{"t":"`f(x) > g(x)` for every `x > 5`","_n":"1ha88","_k":"6956596d"},{"t":"`f(4.5) = g(4.5)`","_n":"1ia98","_k":"691c7a79"},{"t":"`f(x) = g(x)` for some `x` between 4 and 5","_n":"1jaa8","_k":"32f3292d"}]},{"id":"q2","goal":4,"prompt":"`k(x) = 1/(x - 3)`. `k(2) = -1` and `k(4) = 1`. Does `k(x) = 0` have a solution between 2 and 4?\u003ccanvas class=\"plot fig-sm\" data-fig=\"q2\" role=\"img\" aria-label=\"Graph of y equals 1 over x minus 3, in two pieces either side of the vertical asymptote x equals 3, never touching the x-axis\">\u003c/canvas>","right":"Right. `1/(x - 3)` is never 0: a fraction is 0 only when its numerator is, and the numerator is 1. The sign changes across the vertical asymptote `x = 3`, where the graph breaks.","wrong":"The graph breaks at the vertical asymptote `x = 3`: `k` jumps from very negative to very positive without passing through 0. A sign change only proves a crossing when there’s no break.","choices":[{"t":"No","_n":"1kab8","_k":"162f7bb7"},{"t":"There’s no way to tell without a calculator","_n":"1l9c8","_k":"c7d6b5c2"},{"t":"Yes, at `x = 3`","_n":"1m9d8","_k":"11101308"},{"t":"Yes, exactly one","_n":"1n169","_k":"a41ab786"}]},{"id":"q3","goal":4,"prompt":"How many solutions does `2^x = x^2` have?","right":"Right. `x = 2` (4 = 4) and `x = 4` (16 = 16) are exact, and a third hides between −1 and 0: `2^{-1} = 0.5 \u003c 1 = (-1)^2`, but `2^0 = 1 > 0 = 0^2`.","wrong":"Check negative `x`: at `x = -1`, `2^x = 0.5` but `x^2 = 1`; at `x = 0`, `2^x = 1` but `x^2 = 0`. The sign changes, so there’s a crossing between −1 and 0, plus the exact solutions 2 and 4: three in all.","choices":[{"t":"1","_n":"1o159","_k":"a0bf41a4"},{"t":"2","_n":"1p189","_k":"be18f472"},{"t":"3","_n":"1q179","_k":"4be44917"},{"t":"4","_n":"1r1a9","_k":"de623d95"}]},{"id":"q4","goal":4,"prompt":"The graphs of `y = f(x)` and `y = g(x)` cross at about (1.4, 3.9). What is the solution of `f(x) = g(x)`?","right":"Right. The solution is the `x`-value of the crossing. 3.9 is the value both functions share there.","wrong":"An equation in `x` is solved by `x`-values. The crossing’s `x`-coordinate, about 1.4, is the solution; 3.9 is the height where the graphs meet. A graph reading is approximate, not exact.","choices":[{"t":"`x ≈ 1.4` and `x ≈ 3.9`","_n":"1s199","_k":"b856252c"},{"t":"(1.4, 3.9), exactly","_n":"1t1c9","_k":"72bad3a5"},{"t":"`x ≈ 3.9`","_n":"1u1b9","_k":"4430f931"},{"t":"`x ≈ 1.4`","_n":"1v1e9","_k":"321624e2"}]}]}},"practice":{"activities":[{"id":"match","type":"custom","title":"Match the story to its model","summary":"Match the story to its model","goal":2,"instruction":"Match each situation to the model that describes it. `t` is in minutes, hours, milliseconds, seconds or months, as each story says.","how":"Tap a situation, then tap its model.","leftTitle":"Situation","rightTitle":"Model","retry":"Try another model.","left":[{"id":"s1","goal":[1,2],"t":"Soup cools in a 22&nbsp;°C kitchen. It starts at 86&nbsp;°C, and the difference between the soup and the kitchen halves every 8 min.","why":"Level plus a shrinking difference: 22 is where the soup ends up, and 64 = 86 − 22 halves every 8 min.","hints":["What temperature does the soup end up at? What halves?","It ends at the kitchen’s 22&nbsp;°C. The difference, 86 − 22 = 64, halves every 8 min.","Level plus a shrinking difference: `T(t) = 22 + 64(1/2)^{t/8}`, model E1."]},{"id":"s2","goal":[1,2],"t":"An 86 mg dose of a medicine is in the blood, and the amount halves every 8 h.","why":"A decay on its own: the whole 86 mg halves every 8 h and heads toward 0.","hints":["What does the amount of medicine settle toward?","Nothing holds it at a level: the whole 86 mg halves every 8 h, toward 0.","A decay on its own: `M(t) = 86(1/2)^{t/8}`, model E2."]},{"id":"s3","goal":[1,2],"t":"Soup cools in a 22&nbsp;°C kitchen. It starts at 86&nbsp;°C, and the difference halves every 4 min.","why":"Level plus a shrinking difference, halving faster: every 4 min.","hints":["What temperature does the soup end up at? How often does the difference halve?","It ends at the kitchen’s 22&nbsp;°C. The difference, 86 − 22 = 64, halves every 4 min.","Level plus a shrinking difference: `T(t) = 22 + 64(1/2)^{t/4}`, model E3."]},{"id":"s4","t":"A guitar string is plucked 4 mm out. It vibrates once every 2 ms, and its swings halve every 8 ms.","why":"A wave inside a shrinking envelope: 4 mm halving every 8 ms, one vibration every 2 ms.","hints":["Do the swings fade, grow, or stay the same?","They halve every 8 ms from 4 mm: the envelope is `4(1/2)^{t/8}`. One vibration takes 2 ms, so `k = 2π/2 = π`.","Shrinking envelope times a wave: `y(t) = 4(1/2)^{t/8} cos(πt)`, model E4."]},{"id":"s5","t":"A swing is pulled 4 cm out and pushed every time it returns, so its swings grow 1 cm every second. One swing out and back takes 2 s.","why":"A wave inside a growing envelope: `t + 4` grows 1 cm every second, one swing every 2 s.","hints":["Do the swings fade, grow, or stay the same?","They grow by 1 cm every second from 4 cm: the envelope is `t + 4`. One swing takes 2 s, so `k = 2π/2 = π`.","Growing envelope times a wave: `y(t) = (t + 4) cos(πt)`, model E5."]},{"id":"s6","t":"A buoy in steady waves rises 4 cm above its rest level and falls 4 cm below it, once every 2 s, starting at the top.","why":"A wave on its own: amplitude 4, period 2 s, starting at a peak.","hints":["Do the swings fade, grow, or stay the same?","They stay 4 cm every time. One rise and fall takes 2 s, so `k = 2π/2 = π`, and it starts at the top.","A wave on its own: `y(t) = 4 cos(πt)`, model E6."]},{"id":"s7","t":"A park’s monthly visitors, in thousands: a trend that starts at 22 and grows 0.5 per month, plus a yearly swing of 4 above and below it, busiest in July (`t = 6`).","why":"Trend plus a yearly wave whose peak is shifted to July: `(t - 6)`.","hints":["What do the visitors do over the years, and when is it busiest?","A trend `0.5t + 22` plus a yearly wave of 4 that peaks in July, at `t = 6`.","Trend plus wave: `V(t) = 0.5t + 22 + 4 cos[π/6 (t - 6)]`, model E7. The `(t - 6)` puts the peak in July."]},{"id":"s8","t":"A ski hill’s monthly visitors, in thousands: a trend that starts at 22 and grows 0.5 per month, plus a yearly swing of 4 above and below it, busiest in January (`t = 0`).","why":"Trend plus a yearly wave with no shift, so its peak is at `t = 0`: January.","hints":["What do the visitors do over the years, and when is it busiest?","A trend `0.5t + 22` plus a yearly wave of 4 that peaks in January, at `t = 0`.","Trend plus wave: `V(t) = 0.5t + 22 + 4 cos(π/6 t)`, model E8. With no shift, the peak is at `t = 0`: January."]}],"right":[{"id":"e1","t":"E1. `T(t) = 22 + 64(1/2)^{t/8}`"},{"id":"e2","t":"E2. `M(t) = 86(1/2)^{t/8}`"},{"id":"e3","t":"E3. `T(t) = 22 + 64(1/2)^{t/4}`"},{"id":"e4","t":"E4. `y(t) = 4(1/2)^{t/8} cos(πt)`"},{"id":"e5","t":"E5. `y(t) = (t + 4) cos(πt)`"},{"id":"e6","t":"E6. `y(t) = 4 cos(πt)`"},{"id":"e7","t":"E7. `V(t) = 0.5t + 22 + 4 cos[π/6 (t - 6)]`"},{"id":"e8","t":"E8. `V(t) = 0.5t + 22 + 4 cos(π/6 t)`"}],"_a":"SEdKA0cLQ10CRxUQFgNDAhEACxBJExILEV8bV1YTTRpAURsIR1RVGh9HSgdHC0NdBkcVEBYHQwIRAA8QSRMSDxFfG1dSE00aQF0bCEdUWRpO","wrong":{"s1|e2":"E2 heads toward 0. The soup can only cool to the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s1|e3":"E3’s difference halves every 4 min: `(1/2)^{t/4}`. This soup’s halves every 8 min.","s1|e4":"E4’s swings fade: a wave multiplied by a shrinking envelope. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s1|e5":"E5’s swings grow: a wave multiplied by a growing envelope, `(t + 4)`. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s1|e6":"E6 swings the same 4 above and below forever: a wave on its own. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s1|e7":"E7 is a rising trend plus a yearly wave. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s1|e8":"E8 is a rising trend plus a yearly wave. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s2|e1":"E1 starts at 22 + 64 = 86 too, but it levels off at 22. Nothing keeps a medicine at 22 mg: the amount heads toward 0.","s2|e3":"E3 levels off at 22: a level plus a shrinking part. Nothing holds a medicine at a level: the whole amount halves toward 0.","s2|e4":"E4’s swings fade: a wave multiplied by a shrinking envelope. Nothing holds a medicine at a level: the whole amount halves toward 0.","s2|e5":"E5’s swings grow: a wave multiplied by a growing envelope, `(t + 4)`. Nothing holds a medicine at a level: the whole amount halves toward 0.","s2|e6":"E6 swings the same 4 above and below forever: a wave on its own. Nothing holds a medicine at a level: the whole amount halves toward 0.","s2|e7":"E7 is a rising trend plus a yearly wave. Nothing holds a medicine at a level: the whole amount halves toward 0.","s2|e8":"E8 is a rising trend plus a yearly wave. Nothing holds a medicine at a level: the whole amount halves toward 0.","s3|e1":"E1’s difference halves every 8 min: `(1/2)^{t/8}`. This soup’s halves every 4 min.","s3|e2":"E2 heads toward 0: a decay on its own, with no level and no swings. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s3|e4":"E4’s swings fade: a wave multiplied by a shrinking envelope. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s3|e5":"E5’s swings grow: a wave multiplied by a growing envelope, `(t + 4)`. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s3|e6":"E6 swings the same 4 above and below forever: a wave on its own. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s3|e7":"E7 is a rising trend plus a yearly wave. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s3|e8":"E8 is a rising trend plus a yearly wave. This soup cools toward the kitchen’s 22&nbsp;°C, so its model needs the constant 22 plus a shrinking part.","s4|e1":"E1 levels off at 22: a level plus a shrinking part. The string’s swings halve every 8 ms, so the wave is multiplied by a shrinking envelope.","s4|e2":"E2 heads toward 0: a decay on its own, with no level and no swings. The string’s swings halve every 8 ms, so the wave is multiplied by a shrinking envelope.","s4|e3":"E3 levels off at 22: a level plus a shrinking part. The string’s swings halve every 8 ms, so the wave is multiplied by a shrinking envelope.","s4|e5":"E5’s swings grow, `(t + 4)` gets bigger. The string’s swings fade.","s4|e6":"E6’s swings never fade. The string’s swings halve every 8 ms, so the wave is multiplied by `4(1/2)^{t/8}`.","s4|e7":"E7 is a rising trend plus a yearly wave. The string’s swings halve every 8 ms, so the wave is multiplied by a shrinking envelope.","s4|e8":"E8 is a rising trend plus a yearly wave. The string’s swings halve every 8 ms, so the wave is multiplied by a shrinking envelope.","s5|e1":"E1 levels off at 22: a level plus a shrinking part. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s5|e2":"E2 heads toward 0: a decay on its own, with no level and no swings. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s5|e3":"E3 levels off at 22: a level plus a shrinking part. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s5|e4":"E4’s swings fade: a wave multiplied by a shrinking envelope. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s5|e6":"E6 swings the same 4 above and below forever: a wave on its own. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s5|e7":"E7 is a rising trend plus a yearly wave. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s5|e8":"E8 is a rising trend plus a yearly wave. The swing’s swings grow 1 cm every second, so the wave is multiplied by a growing envelope.","s6|e1":"E1 levels off at 22: a level plus a shrinking part. The buoy’s waves are steady: the same 4 cm every time.","s6|e2":"E2 heads toward 0: a decay on its own, with no level and no swings. The buoy’s waves are steady: the same 4 cm every time.","s6|e3":"E3 levels off at 22: a level plus a shrinking part. The buoy’s waves are steady: the same 4 cm every time.","s6|e4":"E4’s swings fade. The buoy’s waves are steady: the same 4 cm every time.","s6|e5":"E5’s swings grow: a wave multiplied by a growing envelope, `(t + 4)`. The buoy’s waves are steady: the same 4 cm every time.","s6|e7":"E7 is a rising trend plus a yearly wave. The buoy’s waves are steady: the same 4 cm every time.","s6|e8":"E8 is a rising trend plus a yearly wave. The buoy’s waves are steady: the same 4 cm every time.","s7|e1":"E1 levels off at 22: a level plus a shrinking part. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s7|e2":"E2 heads toward 0: a decay on its own, with no level and no swings. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s7|e3":"E3 levels off at 22: a level plus a shrinking part. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s7|e4":"E4’s swings fade: a wave multiplied by a shrinking envelope. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s7|e5":"E5’s swings grow: a wave multiplied by a growing envelope, `(t + 4)`. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s7|e6":"E6 swings the same 4 above and below forever: a wave on its own. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s7|e8":"E8 is busiest when `π/6 t = 0`, at `t = 0`: January. This park is busiest in July, so the wave needs `(t - 6)`.","s8|e1":"E1 levels off at 22: a level plus a shrinking part. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s8|e2":"E2 heads toward 0: a decay on its own, with no level and no swings. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s8|e3":"E3 levels off at 22: a level plus a shrinking part. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s8|e4":"E4’s swings fade: a wave multiplied by a shrinking envelope. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s8|e5":"E5’s swings grow: a wave multiplied by a growing envelope, `(t + 4)`. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s8|e6":"E6 swings the same 4 above and below forever: a wave on its own. These visitors grow steadily, with the same yearly swing on top: a trend plus a wave.","s8|e7":"E7 is busiest when `π/6 (t - 6) = 0`, at `t = 6`: July. This ski hill is busiest in January, so the wave needs no shift: `cos(π/6 t)`."}},{"id":"spot","type":"spot","title":"Spot the error","student":"Samuel","how":"","instruction":"Samuel made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Ana’s ferry model is `P(t) = 0.5t + 20 + 5 cos[π/6 (t - 6)]`, in thousands of passengers, `t` months after January of year 1, for `t = 0` to 35. Find the busiest month and its passengers.","steps":["The trend `0.5t + 20` is largest in the last month, `t = 35`: 0.5(35) + 20 = 37.5.","The wave `5 cos[π/6 (t - 6)]` is largest, 5, in every July: `t = 6, 18` and 30.","So the busiest month has 37.5 + 5 = 42.5 thousand passengers.","It’s December of year 3, `t = 35`."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: the bracket is 0 at `t = 6`, and again every 12 months.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"42.5 is right, but it happens in July of year 3.","why":"In July of year 3 the trend is 35, not 37.5: `P(30) = 40`. 42.5 never happens.","_n":"1w1d9","_k":"c11273d9"},{"t":"Step 3 is correct as written.","why":"In December of year 3 the wave is near its low: `P(35) = 37.5 + 5 cos(29π/6) = 37.5 - 2.5√3 ≈ 33.2`, not 42.5.","_n":"1x308","_k":"4f3d8faf"},{"t":"Use averages instead: the trend averages 28.75 and the wave averages 0, so the busiest month has 28.75.","why":"An average isn’t a maximum. The busiest month is far above the average.","_n":"1y318","_k":"75df66df"},{"t":"The two largest values happen in different months, so they can’t be added. In July of year 3, `P(30) = 15 + 20 + 5 = 40`, more than any other month: the busiest month is July of year 3, with 40 thousand.","why":"Add the values at the \u003cstrong>same\u003c/strong> `t`. July of year 3 has the biggest wave and nearly the biggest trend.","_n":"1z2e8","_k":"d410e900"}],"hints":["Check step 3: do the trend’s maximum and the wave’s maximum happen in the same month?","The trend peaks at `t = 35` (December); the wave peaks in July. Evaluate `P` at the July of year 3.","Step 3 is wrong. `P(30) = 15 + 20 + 5 = 40`, the busiest month (July of year 3)."]},{"id":"e2","goal":2,"task":"A mug of tea cools in a 20&nbsp;°C room. It reads 84&nbsp;°C, 52&nbsp;°C, 36&nbsp;°C and 28&nbsp;°C at `t = 0, 10, 20` and 30 min. Build a model.","steps":["The ratios 52/84, 36/52 and 28/36 aren’t equal, so a single exponential won’t fit.","Subtract the room temperature: 64, 32, 16, 8.","These halve every 10 min, so the extra heat is `64(1/2)^{t/10}`.","So the model is `T(t) = 64(1/2)^{t/10}`.","After a long time, the tea approaches 0&nbsp;°C."],"_a":"AA==","stepFb":["Step 1 is correct: about 0.62, 0.69 and 0.78. Keep checking.","Step 2 is correct: these are the degrees above the room.","Step 3 is correct.","","Step 5 follows from step 4. The mistake is earlier."],"fixes":[{"t":"The model is `T(t) = 84(1/2)^{t/10}`.","why":"That halves the whole temperature: `T(10) = 42`, not 52. It’s the temperature \u003cstrong>above the room\u003c/strong> that halves.","_n":"202f8","_k":"a1c62db3"},{"t":"The model is `T(t) = 20 + 64(1/2)^{10t}`.","why":"`(1/2)^{10t}` halves 10 times every minute. Halving every 10 min is `(1/2)^{t/10}`.","_n":"212c8","_k":"7f98467b"},{"t":"Step 4 is correct as written.","why":"Check `t = 0`: `64(1/2)^0 = 64`, but the tea is 84&nbsp;°C. Step 3 found the extra heat; step 4 forgot the room.","_n":"222d8","_k":"610a3953"},{"t":"Add the room temperature back: `T(t) = 20 + 64(1/2)^{t/10}`, so the tea approaches 20&nbsp;°C.","why":"Check: `T(0) = 84` and `T(10) = 20 + 32 = 52`.","_n":"232a8","_k":"4b58dd00"}],"hints":["Test Samuel’s model at `t = 0`.","It gives 64&nbsp;°C, not 84&nbsp;°C. What did step 2 take away that never came back?","Step 4 is wrong: `T(t) = 20 + 64(1/2)^{t/10}`."]},{"id":"e3","goal":4,"task":"Solve `2^x = x + 2`.","steps":["Let `h(x) = 2^x - x - 2`. The solutions are the zeros of `h`.","`h(1) = 2 - 3 = -1` and `h(2) = 4 - 4 = 0`, so `x = 2` is a solution.","`h(3) = 8 - 5 = 3`. The sign of `h` only changes once, at `x = 2`, so `x = 2` is the only solution.","The solution is `x = 2`."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: `2^2 = 4 = 2 + 2`.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"Samuel only looked at `x ≥ 1`. `h(-2) = 1/4` is positive and `h(-1) = -1/2` is negative, so `h` changes sign there too.","_n":"242b8","_k":"94e0d5f3"},{"t":"Algebra can’t isolate `x`, so `x = 2` is only approximate.","why":"`2^2 = 4 = 2 + 2` exactly. Graphical methods find approximations, but an exact check like this is exact.","_n":"25288","_k":"a45f05dc"},{"t":"There’s a second solution between 0 and 1.","why":"`h(0) = 1 - 2 = -1` and `h(1) = -1`: no sign change between 0 and 1. Look further left.","_n":"26298","_k":"97cff74a"},{"t":"Check negative `x` too: `h(-2) = 1/4 + 2 - 2 = 1/4 > 0` and `h(-1) = 1/2 + 1 - 2 = -1/2 \u003c 0`, so there’s a second solution between −2 and −1. The solutions are `x = 2` and `x ≈ -1.7`.","why":"The line `y = x + 2` crosses the exponential twice: once on each side of the `y`-axis.","_n":"27328","_k":"d77bcd28"}],"hints":["Did Samuel check every part of the graph?","Try negative `x`: find `h(-2)` and `h(-1)`.","Step 3 is wrong: `h(-2) > 0 > h(-1)`, so there’s another solution between −2 and −1 (`x ≈ -1.7`)."]}]},{"id":"model","type":"numeric","title":"Model it, solve it","summary":"Model it, solve it","star":true,"instruction":"Each question needs more than one step. Answer in the box, then press Check.","how":"Type a number. Decimals are fine.","items":[{"id":"r1","goal":2,"prompt":"Cocoa is 76&nbsp;°C in a 20&nbsp;°C room, and its temperature above the room halves every 12 min. What is its temperature after 36 min, in °C?","_a":"AVI=","unit":"°C","display":"27&nbsp;°C","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> 27&nbsp;°C is between the room’s 20&nbsp;°C and the start, 76&nbsp;°C, and closer to the room after three halvings.","wrong":[{"match":9.5,"fb":"That halves the whole temperature, 76/8. It’s the 56&nbsp;°C above the room that halves: 20 + 56/8 = 27."},{"match":34,"fb":"That’s two halvings, 20 + 56/4. 36 min is three halvings of 12 min."},{"match":38,"fb":"That’s 76/2, one halving of the whole temperature."}],"hints":["What halves: the whole temperature, or the part above the room?","The cocoa starts 76 − 20 = 56&nbsp;°C above the room. 36 min is 3 halvings of 12 min.","56 → 28 → 14 → 7&nbsp;°C above the room, so the temperature is 20 + 7 = 27&nbsp;°C."]},{"id":"r2","goal":2,"prompt":"Soup cools in a 22&nbsp;°C kitchen. It’s 86&nbsp;°C at `t = 0` and 30&nbsp;°C at `t = 24` min. The difference from the kitchen halves at a steady rate. What is the halving time, in minutes?","_a":"Cw==","unit":"min","display":"8 min","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> Halving every 8 min, the difference goes 64 → 32 → 16 → 8&nbsp;°C at 8, 16 and 24 min, and 22 + 8 = 30&nbsp;°C matches the reading at 24 min.","wrong":[{"match":3,"fb":"3 is the number of halvings (64 → 32 → 16 → 8). They take 24 min, so each takes 24 ÷ 3."},{"match":12,"fb":"64 → 16 is two halvings, but the difference fell to 30 − 22 = 8: three halvings."},{"match":24,"fb":"The difference fell from 64 to 8, which is more than one halving."}],"hints":["Work with the difference from the kitchen, not the temperature.","The difference goes from 86 − 22 = 64 to 30 − 22 = 8&nbsp;°C. How many halvings is that?","64 → 32 → 16 → 8 is 3 halvings in 24 min, so each halving takes 24 ÷ 3 = 8 min."]},{"id":"r3","goal":5,"prompt":"A bike-share’s monthly rides (thousands) are modelled by `S(t) = 2t + 30 + 8 cos[π/6 (t - 6)]`, `t` months after January of year 1. In which month of year 2 (`t = 12` to 23) does the model give the most rides? Enter `t`.","use":"`√3 ≈ 1.73`","_a":"Alw=","label":"`t` =","display":"`t = 19` (August of year 2)","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> August comes one month after the wave’s July peak, while the trend still adds 2 thousand rides a month, so a month just after July is believable: `S(19) ≈ 74.9` is a little more than `S(18) = 74`.","wrong":[{"match":18,"fb":"July is the wave’s peak, and `S(18) = 74`. But the trend adds 2 every month: `S(19) = 38 + 30 + 4√3 ≈ 74.9`, more than July."},{"match":23,"fb":"December has the biggest trend in year 2, but the wave is near its low: `S(23) = 76 - 4√3 ≈ 69.1`."},{"match":20,"fb":"`S(20) = 40 + 30 + 4 = 74`, a little less than `S(19)`."}],"hints":["The trend keeps rising during the July peak. Compare `S` at July and the months either side.","`S(18) = 36 + 30 + 8 = 74`. `S(19) = 38 + 30 + 8 cos(13π/6) = 68 + 4√3`.","68 + 4 × 1.73 = 74.92 > 74, and `S(20) = 74`. The busiest month of year 2 is `t = 19` (August)."]},{"id":"r4","goal":4,"prompt":"The positive solution of `2^x = 3x + 5` lies between two consecutive whole numbers. Enter the smaller one.","_a":"Bw==","display":"4 (the solution is between 4 and 5)","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> `h(4) = -1 \u003c 0` and `h(5) = 12 > 0`, so `h(x) = 2^x - 3x - 5` changes sign between 4 and 5: the doubling `2^x` passes the line there.","wrong":[{"match":5,"fb":"That’s the larger one. Enter the smaller."},{"match":3,"fb":"`h(3) = 8 - 14 = -6` and `h(4) = 16 - 17 = -1` have the same sign. `h(5) = 32 - 20 = 12` is the first positive value."},{"match":-2,"fb":"There \u003cstrong>is\u003c/strong> a solution between −2 and −1, but it’s negative. The question asks for the positive one."}],"hints":["Let `h(x) = 2^x - 3x - 5` and look for a sign change at whole numbers.","`h(3) = 8 - 14 = -6` and `h(4) = 16 - 17 = -1` are both negative. Try `x = 5`.","`h(5) = 32 - 20 = 12 > 0`, so the positive solution is between 4 and 5. The smaller one is 4."]},{"id":"r5","goal":5,"prompt":"A climbing gym charges $25 a visit and gets 400 visits a week. Each $1 increase loses 10 visits a week. What price gives the most weekly revenue, in dollars?","_a":"AFcXBw==","unit":"dollars","display":"$32.50","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> At $32.50 there are 400 − 75 = 325 visits, for $10 562.50 a week: more than the $10 000 at $25. The price sits between the current $25 and the $65 where visits stop.","wrong":[{"match":7.5,"fb":"That’s the increase `x`. The price is 25 + 7.5."},{"match":45,"fb":"That’s `x = 20`, halfway between 0 and the 40 where visits reach 0. The vertex is halfway between the \u003cstrong>zeros\u003c/strong> of `R(x) = (25 + x)(400 - 10x)`: `x = -25` and `x = 40`."},{"match":65,"fb":"At $65 there are no visits at all: revenue $0."}],"hints":["Let `x` be the price increase in dollars. Write the revenue as (price)(visits).","`R(x) = (25 + x)(400 - 10x)`. Its zeros are `x = -25` and `x = 40`.","The vertex is halfway between the zeros: `x = (-25 + 40)/2 = 7.5`. The price is 25 + 7.5 = $32.50."]},{"id":"r6","goal":2,"prompt":"An oil spill is a circle whose radius is `r(t) = 4t + 2` metres after `t` hours. Its area is `A = πr^2`. After how many hours is the area 100π m²?","_a":"AQ==","unit":"h","display":"2 h","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> After 2 h the radius is 4(2) + 2 = 10 m, and π(10)² = 100π m².","wrong":[{"match":24.5,"fb":"That solves `4t + 2 = 100`, skipping the square. First `πr^2 = 100π` gives `r = 10`."},{"match":2.5,"fb":"That solves `4t = 10`, forgetting the starting radius of 2 m."},{"match":10,"fb":"10 m is the radius at that moment. Now solve `4t + 2 = 10`."}],"hints":["Work backwards: first find the radius that gives that area, then the time.","`πr^2 = 100π` gives `r^2 = 100`, so `r = 10` m.","`4t + 2 = 10` gives `4t = 8`, so `t = 2` h."]},{"id":"r7","goal":5,"prompt":"A plucked string’s swings start at 40 mm and halve every 3 ms. The note is silent once the swings are under 2 mm. What is the first whole number of milliseconds at which it’s silent?","use":"`2^{1/3} ≈ 1.26`","_a":"AlY=","unit":"ms","display":"13 ms","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> 40 → 20 → 10 → 5 → 2.5 mm takes 12 ms, still just above 2 mm, so silence a little after 12 ms makes sense.","wrong":[{"match":12,"fb":"`40(1/2)^4 = 2.5` mm: not under 2 yet."},{"match":15,"fb":"At 15 ms the swings are 1.25 mm, but they were already under 2 mm at 13 ms: 40 ÷ (16 × 1.26) ≈ 1.98."},{"match":6,"fb":"That takes 20 mm off every 3 ms. Halving takes half of what’s left: 40, 20, 10, 5, 2.5 …"}],"hints":["Write the swing size as `40(1/2)^{t/3}` and test whole numbers of ms.","At 12 ms: `40(1/2)^4 = 2.5`. At 13 ms: `40 ÷ (2^4 × 2^{1/3}) = 40 ÷ (16 × 1.26)`.","40 ÷ 20.16 ≈ 1.98 \u003c 2, so it’s silent at 13 ms."]},{"id":"r8","goal":2,"prompt":"Two tones are added. One repeats every 4 ms, the other every 6 ms. After how many milliseconds does the combined signal first repeat?","_a":"Alc=","unit":"ms","display":"12 ms","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> After 12 ms the first tone has done exactly 3 cycles and the second exactly 2, so both start over together.","wrong":[{"match":10,"fb":"4 + 6 = 10, but after 10 ms the first tone is halfway through a cycle. You need a time that’s a whole number of both cycles."},{"match":24,"fb":"24 works, but 12 comes first: 3 cycles of 4 ms and 2 cycles of 6 ms."},{"match":2,"fb":"After 2 ms neither tone has finished a cycle."}],"hints":["The combined signal repeats when both tones finish whole cycles at the same moment.","The first tone repeats at 4, 8, 12, 16, … ms; the second at 6, 12, 18, … ms.","The first time on both lists is 12 ms: 3 cycles of 4 ms and 2 cycles of 6 ms."]},{"id":"r9","goal":5,"prompt":"A club’s budget is `B(t) = 200 + 10t` thousand dollars, and its membership is `M(t) = 1000 · 2^{t/20}` people, `t` years from now. Budget per member starts at $200. After how many years does it first fall to half of that, $100?","_a":"BVU=","unit":"years","display":"60 years","why":"\u003cspan class=\"ml-sense\">Sense check: does your answer fit the story?\u003c/span> At `t = 60` the budget is 800 thousand dollars for 8000 members: $100 each. The budget grows by a steady amount while the membership keeps doubling, so the share per member has to fall in the end.","wrong":[{"match":20,"fb":"At 20 years, 400 000 ÷ 2000 = $200: the budget grew too. Test `t = 40` and 60."},{"match":40,"fb":"At 40 years, 600 000 ÷ 4000 = $150: still above $100."},{"match":80,"fb":"At 80 years it’s 1 000 000 ÷ 16 000 = $62.50, but it already reached $100 at 60."}],"hints":["Budget per member = `B(t) ÷ M(t)`, in dollars: 1000 × `(200 + 10t) ÷ (1000 · 2^{t/20})`.","Try `t = 20, 40, 60`: `(200 + 10t) ÷ 2^{t/20}` = 400/2, 600/4, 800/8.","800/8 = 100 at `t = 60`, and it’s above 100 at every earlier time: it first falls to $100 after 60 years."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you looked at the leftovers in the Model lab?"},{"id":"j2","q":"In your own words, how do you decide whether to add two functions or multiply them in a model?"},{"id":"j3","q":"Explain to a friend, step by step, how to solve `2^x = 3x` without algebra, and how to be sure you found every solution."},{"id":"j4","q":"Which part of modelling are you least sure about: choosing the type, combining the parts, judging the fit, or solving with graphs? What will you do to practise it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A table lists `y = 5, 8, 13, 20, 29` for `x = 0, 1, 2, 3, 4`. Which type of function fits it?","options":[{"t":"Quadratic","why":"The first differences are 3, 5, 7, 9 and the second differences are all 2. Steady second differences mean quadratic.","_n":"28318","_k":"113061e0"},{"t":"Linear","why":"The first differences are 3, 5, 7, 9: not steady, so not linear.","_n":"29308","_k":"a3a22423"},{"t":"Sinusoidal","why":"The values keep rising and never come back down, so there’s no cycle.","_n":"2a2f8","_k":"76844c2e"},{"t":"Exponential","why":"It curves upward, but the ratios 8/5 = 1.6, 13/8 ≈ 1.63, 20/13 ≈ 1.54 aren’
