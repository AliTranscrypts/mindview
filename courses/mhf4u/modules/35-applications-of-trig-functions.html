4, but this situation’s is 8.","S5|E8":"E8 has amplitude 4, but this situation’s is 8.","S6|E1":"E1 turns once every 2π ÷ (π/20) = 40 s. This wheel takes 80 s.","S6|E2":"E2 turns once every 2π ÷ (π/20) = 40 s. This wheel takes 80 s.","S6|E3":"E3 has amplitude 4, but this situation’s is 8.","S6|E4":"E4 turns once every 2π ÷ (π/10) = 20 s. This wheel takes 80 s.","S6|E5":"E5 turns once every 2π ÷ (π/20) = 40 s. This wheel takes 80 s.","S6|E7":"E7 has amplitude 4, but this situation’s is 8.","S6|E8":"E8 has amplitude 4, but this situation’s is 8.","S7|E1":"E1 has amplitude 8, but this situation’s is 4.","S7|E2":"E2 has amplitude 8, but this situation’s is 4.","S7|E3":"Check the axis: E3’s is 10 m, but this situation’s is 5 m.","S7|E4":"E4 has amplitude 8, but this situation’s is 4.","S7|E5":"E5 has amplitude 8, but this situation’s is 4.","S7|E6":"E6 has amplitude 8, but this situation’s is 4.","S7|E8":"Check the start. E8 gives 1 m at 2:00: low tide. In S7, 2:00 is high tide.","S8|E1":"E1 has amplitude 8, but this situation’s is 4.","S8|E2":"E2 has amplitude 8, but this situation’s is 4.","S8|E3":"Check the axis: E3’s is 10 m, but this situation’s is 5 m.","S8|E4":"E4 has amplitude 8, but this situation’s is 4.","S8|E5":"E5 has amplitude 8, but this situation’s is 4.","S8|E6":"E6 has amplitude 8, but this situation’s is 4.","S8|E7":"Check the start. E7 gives 9 m at 2:00: high tide. In S8, 2:00 is low tide."}},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Jun","how":"","instruction":"Jun made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"A Ferris wheel is 30 m across, its lowest seat is 2 m above the ground, and it turns once every 50 s. A rider boards at the bottom at `t = 0`. Write a model for her height.","steps":["The radius is 30 ÷ 2 = 15 m, so the amplitude is 15.","The axle is 15 m above the ground, so `c = 15`.","One turn takes 50 s, so `k = 2π/50 = π/25`.","She starts at the bottom, so `h(t) = -15 cos({π}/{25} t) + 15`."],"_a":"VQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 is true. The mistake is earlier.","Step 4 uses step 2’s axle height. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct as written.","why":"Check `h(0)` with Jun’s model: −15 + 15 = 0 m. The rider would board at ground level, but the lowest seat is 2 m up.","_n":"1o1d4","_k":"25e84209"},{"t":"The axle is one radius above the lowest seat: 2 + 15 = 17 m. So `h(t) = -15 cos({π}/{25} t) + 17`.","why":"Check: `h(0)` = −15 + 17 = 2 m, the lowest seat.","_n":"1p1e4","_k":"3c99fcac"},{"t":"The axle is at the top of the wheel: 2 + 30 = 32 m, so `c = 32`.","why":"32 m is the height of the top. The axle is at the centre, halfway up.","_n":"1q1f4","_k":"54214a51"},{"t":"`c = 15` is right, but the amplitude should be 30, so `h(t) = -30 cos({π}/{25} t) + 15`.","why":"30 m is the diameter. And this would put the rider 15 m \u003cstrong>below\u003c/strong> the ground at `t = 0`.","_n":"1r204","_k":"31af1825"}],"hints":["Test Jun’s model at `t = 0`. Where should the rider be?","`h(0)` should be 2 m, the lowest seat. Jun’s model gives 0 m. Which step decides the axle height?","Step 2 is wrong: the axle is 2 + 15 = 17 m, so `h(t) = -15 cos({π}/{25} t) + 17`."]},{"id":"e2","goal":5,"task":"For `h(t) = -10 cos({π}/{30} t) + 12`, find the average rate of change of height from `t` = 10 s to `t` = 20 s.","steps":["`h(10) = -10 cos(π/3) + 12 = -5 + 12 = 7` m.","`h(20) = -10 cos(2π/3) + 12 = 5 + 12 = 17` m.","Average rate of change = (17 − 7)/20 = 0.5 m/s.","So on average the rider rises 0.5 m each second."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: `cos(2π/3) = -1/2`.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"The run is the time that passed. The interval starts at 10 s, so 10 s passed, not 20 s.","_n":"1s214","_k":"f50e9d01"},{"t":"Average rate of change = (17 + 7)/2 = 12 m.","why":"That’s the average \u003cstrong>height\u003c/strong>, 12 m, not a rate. A rate divides a change in height by a change in time.","_n":"1t224","_k":"6e796fb1"},{"t":"Average rate of change = (17 − 7)/(20 − 10) = 10/10 = 1 m/s.","why":"Divide by the time that passed, 20 − 10 = 10 s.","_n":"1u234","_k":"e8271f32"},{"t":"Average rate of change = (17 − 7) ÷ (2π/3 − π/3) = 30/π ≈ 9.55 m/s.","why":"π/3 is the angle the wheel turned, in radians, not the time. Dividing by it gives metres per radian.","_n":"1v144","_k":"e4dae29c"}],"hints":["In a rate of change, what goes in the denominator?","The change in time: from 10 s to 20 s.","Step 3 is wrong: (17 − 7)/(20 − 10) = 1 m/s."]},{"id":"e3","goal":4,"task":"For `h(t) = -10 cos({π}/{30} t) + 12`, when during the first turn (`0 ≤ t ≤ 60`) is the rider higher than 17 m?","steps":["Set `-10 cos({π}/{30} t) + 12 = 17`.","So `cos({π}/{30} t) = -1/2`.","Cosine is −1/2 at 2π/3, so π/30 `t` = 2π/3 and `t` = 20 s.","So the rider is higher than 17 m from `t` = 20 s until the end of the turn, `t` = 60 s."],"_a":"Vg==","stepFb":["Step 1 is correct: find where she is exactly 17 m high first. Keep checking.","Step 2 is correct: `-10 cos({π}/{30} t) = 5`.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Cosine is −1/2 at 2π/3 and 5π/3, so `t` = 20 s and `t` = 50 s.","why":"`cos(5π/3) = +1/2`: quadrant 4. Cosine is negative in quadrants 2 and 3.","_n":"1w154","_k":"95183270"},{"t":"Cosine is −1/2 at 2π/3 \u003cstrong>and\u003c/strong> 4π/3, so `t` = 20 s and `t` = 40 s. She’s higher than 17 m for `20 \u003c t \u003c 40`.","why":"She passes 17 m going up at 20 s and coming down at 40 s.","_n":"1x224","_k":"fa87278a"},{"t":"Step 3 is correct as written.","why":"At `t = 50` the rider is at `-10 cos(5π/3) + 12 = 7` m, well below 17 m, so she can’t be above 17 m all the way to 60 s.","_n":"1y214","_k":"c515a663"},{"t":"Cosine is −1/2 at π/3, so `t` = 10 s.","why":"`cos(π/3) = +1/2`. And at `t = 10` the rider is only 7 m high.","_n":"1z204","_k":"54dd0efd"}],"hints":["How many times in one turn does the rider pass 17 m?","Twice: once going up, once coming down. On `0 ≤ {π}/{30} t ≤ 2π`, where is cosine −1/2?","Step 3 is wrong: π/30 `t` = 2π/3 or 4π/3, so `t` = 20 or 40. She’s above 17 m for `20 \u003c t \u003c 40`."]}]},{"id":"ride","type":"numeric","title":"Ride, tide and daylight problems","summary":"Ride, tide and daylight problems","star":true,"instruction":"Each question needs more than one step. Answer in the box, then press Check.","how":"Type a number. Decimals are fine where the question says so.","general":"Write the model first, then decide what the question is asking for: a height, a time, a length of time, or a rate.","items":[{"id":"r1","goal":4,"prompt":"A wheel has radius 12 m and its axle 14 m above the ground, and turns once every 48 s. The rider boards at the bottom. How high is she 8 s after boarding?","_a":"XA==","unit":"m","display":"8 m","wrong":[{"match":20,"fb":"That uses +12 cos: a rider who starts at the top. Boarding at the bottom needs `-12 cos({π}/{24} t) + 14`."},{"match":2,"fb":"2 m is where she boards, at `t = 0`."}],"why":"Sense check: does your answer fit the story? 8 m is between the lowest seat (2 m) and the axle (14 m): 8 s is one-sixth of the turn, and the first sixth lifts her only `r/2` = 6 m.","hints":["Write the model: the radius, the axle, `k = 2π/48`, and −cos for a bottom boarding.","`h(t) = -12 cos({π}/{24} t) + 14`. At `t = 8` the angle is 8π/24 = π/3.","`h(8) = -12 cos(π/3) + 14 = -6 + 14 = 8` m."]},{"id":"r2","goal":4,"prompt":"Same wheel. When does the rider \u003cstrong>first\u003c/strong> reach 20 m?","_a":"VQY=","unit":"s","display":"16 s","wrong":[{"match":32,"fb":"At 32 s she passes 20 m on the way \u003cstrong>down\u003c/strong>. The first time is earlier."},{"match":8,"fb":"`cos({π}/{24} t) = -1/2`, not +1/2. At 8 s she’s only 8 m high."}],"why":"Sense check: does your answer fit the story? 20 m is the axle plus half the radius (14 + 6), so she first reaches it one-third of the way through the turn: 48 ÷ 3 = 16 s.","hints":["Set the model equal to 20 and solve for the cosine.","`-12 cos({π}/{24} t) = 6`, so `cos({π}/{24} t) = -1/2`. The first angle is 2π/3.","π/24 `t` = 2π/3 gives `t` = 16 s."]},{"id":"r3","goal":4,"prompt":"Same wheel. For how many seconds of each turn is she higher than 20 m?","_a":"VQY=","unit":"s","display":"16 s","wrong":[{"match":32,"fb":"That runs from 16 s to the end of the turn, but she comes back down through 20 m at 32 s."},{"match":24,"fb":"24 s is half the turn: the time she spends above the \u003cstrong>axle\u003c/strong>, 14 m."}],"why":"Sense check: does your answer fit the story? 16 s is one-third of the 48 s turn: the arc above 20 m is the third of the wheel centred on the top.","hints":["Find both times in the turn when she’s exactly 20 m high.","`cos({π}/{24} t) = -1/2` at π/24 `t` = 2π/3 and 4π/3: `t` = 16 and `t` = 32.","She’s above 20 m from 16 s to 32 s: 32 − 16 = 16 s."]},{"id":"r4","goal":5,"prompt":"Same wheel. What is her average rate of change of height from `t` = 8 s to `t` = 16 s, in m/s?","_a":"VR5T","tol":0.0033,"unit":"m/s","display":"1.5 m/s","wrong":[{"match":2.5,"fb":"20 ÷ 8 uses only the height at 16 s. Use the change: (20 − 8) ÷ (16 − 8)."},{"match":12,"fb":"12 m is the change in height. Divide by the 8 s it took."},{"match":0.67,"fb":"That’s time ÷ height, upside down."}],"why":"Sense check: does your answer fit the story? 1.5 m/s is a little less than her speed along the rim, 2π × 12 ÷ 48 = π/2 ≈ 1.57 m/s, as an average climb must be.","hints":["Find her height at 8 s and at 16 s.","`h(8)` = 8 m and `h(16)` = 20 m.","(20 − 8) ÷ (16 − 8) = 12 ÷ 8 = 1.5 m/s."]},{"id":"r5","goal":1,"prompt":"A wheel turns once every 60 s, and a rider boards at the bottom, 2 m above the ground. 10 s later she is 8 m above the ground. What is the radius?","_a":"VQI=","unit":"m","display":"12 m","wrong":[{"match":6,"fb":"She has risen 6 m, but in one-sixth of a turn the rise is only half the radius."},{"match":9,"fb":"That assumes a steady climb (1/6 of a turn → 1/3 of the 2`r` climb). Near the bottom she rises slowly: the rise is `r(1 - cos(π/3)) = r/2`."},{"match":36,"fb":"6 ÷ (1/6) treats the 6 m rise as one-sixth of the radius. In one-sixth of a turn the rise is `r/2`."}],"why":"Sense check: does your answer fit the story? With `r = 12` the axle is 14 m and the top 26 m, and one-sixth of a turn lifts the rider `r/2` = 6 m.","hints":["Write the height after one-sixth of a turn in terms of `r`.","`k = π/30`, so after 10 s the wheel has turned π/3. `h(10) = -r cos(π/3) + (2 + r) = 2 + r/2`.","`2 + r/2 = 8`, so `r` = 12 m."]},{"id":"r6","goal":1,"prompt":"A wheel has radius 10 m, axle 12 m, and the rider boards at the bottom. She \u003cstrong>first\u003c/strong> reaches 17 m 12 s after boarding. How long does one turn take?","_a":"VwY=","unit":"s","display":"36 s","wrong":[{"match":24,"fb":"That treats 17 m as the top (half a turn). The top is 22 m."},{"match":48,"fb":"That treats 17 m as the axle (a quarter turn). The axle is 12 m."},{"match":72,"fb":"`cos(k × 12) = -1/2` gives `k × 12 = 2π/3`: one-\u003cstrong>third\u003c/strong> of a turn, not one-sixth."}],"why":"Sense check: does your answer fit the story? 17 m is the axle plus half the radius, which she reaches one-third of the way through the turn: 36 ÷ 3 = 12 s.","hints":["Set `-10 cos(kt) + 12 = 17` with `t = 12`.","`cos(12k) = -1/2`, and the first angle is 2π/3: one-third of a turn.","One-third of a turn takes 12 s, so one turn takes 3 × 12 = 36 s."]},{"id":"r7","goal":4,"star":true,"prompt":"A paddle wheel on a riverboat has radius 3 m, and its axle is 1.5 m above the water. It turns once every 12 s. For how many seconds of each turn is a given paddle tip under water?","_a":"UA==","unit":"s","display":"4 s","wrong":[{"match":6,"fb":"That’s half a turn: it would be right if the axle were at water level. Here the axle is 1.5 m up."},{"match":8,"fb":"That’s the time the tip spends \u003cstrong>above\u003c/strong> the water."},{"match":2,"fb":"That’s only from entering the water to the lowest point. The tip has to come back up too."}],"why":"Sense check: does your answer fit the story? The axle is 1.5 m up, half the radius, so the tip is under water for the third of the turn centred on the bottom: 12 ÷ 3 = 4 s.","hints":["When is the paddle tip below the water? Write its height above the water.","Height = 1.5 + 3 sin φ, where φ is the angle turned. It’s under water when sin φ \u003c −1/2.","sin φ \u003c −1/2 for 7π/6 \u003c φ \u003c 11π/6: an arc of 2π/3, one-third of a turn. One-third of 12 s is 4 s."]},{"id":"r8","goal":5,"prompt":"Daylight is modelled by `D(t) = 4 sin({π}/{6} t) + 12` hours, `t` months after March 21. How many more hours of daylight are there on May 21 than on April 21? Answer to two decimal places.","use":"`√3 ≈ 1.73`","_a":"VR5SBQ==","tol":0.0034,"unit":"h","display":"1.46 h","wrong":[{"match":2,"fb":"Daylight doesn’t grow by a steady 2 h each month. `D(2) - D(1) = (12 + 2√3) - 14 = 2√3 - 2`."},{"match":0.54,"fb":"That’s June 21 minus May 21, `4 - 2√3`."}],"why":"Sense check: does your answer fit the story? 1.46 h is less than the 2 h gained the month before: the gains slow down as June 21, the longest day, gets closer.","hints":["Find `D(1)` and `D(2)`.","`D(1) = 4 sin(π/6) + 12 = 14` and `D(2) = 4 sin(π/3) + 12 = 12 + 2√3`.","`D(2) - D(1) = 2√3 - 2` ≈ 2(1.73) − 2 = 1.46 h."]},{"id":"r9","goal":6,"star":true,"prompt":"A wheel has radius 15 m. The operator wants the rider’s height never to change faster than 1 m/s. What is the shortest whole number of seconds one turn can take?","use":"π ≈ 3.14","_a":"XQU=","unit":"s","display":"95 s","wrong":[{"match":60,"fb":"That keeps the \u003cstrong>average\u003c/strong> climb over the half-turn at 1 m/s (30 m in 30 s). At the axle she climbs at her full speed, 30π/`T`, which is faster."},{"match":94,"fb":"30π ≈ 30 × 3.14 = 94.2, so 94 s is just too fast: 94.2 ÷ 94 ≈ 1.002 m/s."},{"match":30,"fb":"30 s is how long a steady 1 m/s climb up the 30 m diameter would take. That’s only half a turn, and her climb isn’t steady."}],"why":"Sense check: does your answer fit the story? At 95 s per turn her fastest climb is 30π ÷ 95 ≈ 0.99 m/s, just under 1 m/s; at 94 s it would be just over.","hints":["Her height changes fastest as she passes the axle, where she moves straight up at her speed along the rim.","Her speed is 2π × 15 ÷ `T` = 30π/`T`. You need 30π/`T` ≤ 1.","`T` ≥ 30π ≈ 30 × 3.14 = 94.2, so the shortest whole number of seconds is 95 s."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you about how the rider’s climb is shared among equal parts of a turn?"},{"id":"j2","q":"In your own words, explain why the rider’s height changes fastest as she passes the axle and not at all at the top."},{"id":"j3","q":"Explain to a friend how to turn a description of a Ferris wheel (radius, axle height, time per turn, boarding point) into an equation."},{"id":"j4","q":"Which part of modelling (building the equation, finding times, or rates of change) are you still unsure about, and what will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A Ferris wheel rider’s height is `h(t) = -9 cos({π}/{25} t) + 11`, with `h` in metres and `t` in seconds. How long does one turn take?","options":[{"t":"50 s","why":"`T` = 2π ÷ (π/25) = 2π × 25/π = 50 s.","_n":"201f4","_k":"351dfe36"},{"t":"π/25 s","why":"π/25 is `k`, the angle the wheel turns each second, in radians.","_n":"21264","_k":"91e0fb49"},{"t":"1/50 s","why":"That’s `k` ÷ 2π, upside down. The period is 2π ÷ `k`.","_n":"22254","_k":"f744e1ad"},{"t":"25 s","why":"That’s π ÷ `k`, which is half a turn: in 25 s the rider goes from the bottom to the top.","_n":"23244","_k":"6b3617a9"}]},"b":{"prompt":"A Ferris wheel rider’s height is `h(t) = -6 cos({π}/{40} t) + 8`, with `h` in metres and `t` in seconds. How long does one turn take?","options":[{"t":"π/40 s","why":"π/40 is `k`, the angle turned each second.","_n":"24234","_k":"b498bf9d"},{"t":"80 s","why":"`T` = 2π ÷ (π/40) = 80 s.","_n":"251a4","_k":"9599b36c"},{"t":"1/80 s","why":"That’s `k` ÷ 2π, upside down.","_n":"26194","_k":"5ee2c704"},{"t":"40 s","why":"That’s π ÷ `k`, half a turn.","_n":"27903","_k":"e910b105"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In `h(t) = -9 cos({π}/{25} t) + 11` for a Ferris wheel, what does the 11 tell you?","options":[{"t":"The axle is 11 m above the ground.","why":"The axis `h = 11` is the height of the centre of the wheel.","_n":"28913","_k":"59b59d0c"},{"t":"The top of the wheel is 11 m above the ground.","why":"The top is 11 + 9 = 20 m.","_n":"298e3","_k":"35d3034d"},{"t":"The lowest seat is 11 m above the ground.","why":"The lowest seat is 11 − 9 = 2 m.","_n":"2a8f3","_k":"1e67a7fa"},{"t":"The radius of the wheel is 11 m.","why":"The radius is the amplitude, 9 m.","_n":"2b943","_k":"2f09cce0"}]},"b":{"prompt":"In `h(t) = -6 cos({π}/{40} t) + 8` for a Ferris wheel, what does the 8 tell you?","options":[{"t":"The radius of the wheel is 8 m.","why":"The radius is the amplitude, 6 m.","_n":"2c953","_k":"fc9e39a4"},{"t":"The lowest seat is 8 m above the ground.","why":"The lowest seat is 8 − 6 = 2 m.","_n":"2d923","_k":"6eaee91c"},{"t":"The axle is 8 m above the ground.","why":"The axis `h = 8` is the height of the centre.","_n":"2e933","_k":"1b4820eb"},{"t":"The top of the wheel is 8 m above the ground.","why":"The top is 8 + 6 = 14 m.","_n":"2f983","_k":"54891620"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"`h(t) = -10 cos({π}/{30} t) + 12` gives a rider’s height in metres after `t` seconds. What is the average rate of change of her height from `t = 0` to `t` = 15 s?","options":[{"t":"0.8 m/s","why":"12 ÷ 15 uses only the height at 15 s. Use the change in height: 12 − 2 = 10 m.","_n":"2g993","_k":"b136b6dc"},{"t":"10 m/s","why":"10 m is the change in height. Divide by the 15 s it took.","_n":"2h164","_k":"b9efdf31"},{"t":"2/3 m/s","why":"`h(0) = 2` and `h(15) = -10 cos(π/2) + 12 = 12`, so (12 − 2)/(15 − 0) = 10/15 = 2/3 m/s.","_n":"2i154","_k":"02b2040c"},{"t":"1.5 m/s","why":"15 ÷ 10 is time ÷ height, upside down.","_n":"2j184","_k":"a89cdfe1"}]},"b":{"prompt":"`h(t) = -8 cos({π}/{20} t) + 10` gives a rider’s height in metres after `t` seconds. What is the average rate of change of her height from `t = 0` to `t` = 10 s?","options":[{"t":"1 m/s","why":"10 ÷ 10 uses only the height at 10 s.","_n":"2k174","_k":"257ba17b"},{"t":"0.8 m/s","why":"`h(0) = 2` and `h(10) = -8 cos(π/2) + 10 = 10`, so (10 − 2)/10 = 0.8 m/s.","_n":"2l124","_k":"9a4a20fe"},{"t":"8 m/s","why":"8 m is the change in height. Divide by the 10 s.","_n":"2m114","_k":"1d44df07"},{"t":"1.25 m/s","why":"10 ÷ 8 is time ÷ height, upside down.","_n":"2n144","_k":"ce1c2921"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"`h(t) = -10 cos({π}/{30} t) + 12` gives a rider’s height in metres after `t` seconds. For how many seconds of each turn is she higher than 7 m?","options":[{"t":"50 s","why":"50 s is when she comes back down through 7 m. She was already above it from 10 s on.","_n":"2o134","_k":"4afaeabb"},{"t":"40 s","why":"`-10 cos({π}/{30} t) + 12 = 7` gives `cos({π}/{30} t) = 1/2`, so `t` = 10 or `t` = 50. She’s above 7 m from 10 s to 50 s: 40 s.","_n":"2p1e4","_k":"9deddc15"},{"t":"10 s","why":"10 s is the \u003cstrong>first\u003c/strong> time she’s at 7 m, on the way up. She stays above 7 m until she comes back down through it.","_n":"2q1d4","_k":"72f3307e"},{"t":"20 s","why":"20 s is the time she spends \u003cstrong>below\u003c/strong> 7 m: 10 s at the start of the turn and 10 s at the end.","_n":"2rbe8","_k":"ee038769"}]},"b":{"prompt":"`h(t) = -8 cos({π}/{24} t) + 10` gives a rider’s height in metres after `t` seconds. For how many seconds of each turn is she higher than 6 m?","options":[{"t":"8 s","why":"8 s is the first time she’s at 6 m.","_n":"2sbd8","_k":"4bcf8ced"},{"t":"16 s","why":"16 s is the time she spends \u003cstrong>below\u003c/strong> 6 m.","_n":"2tbc8","_k":"05c90959"},{"t":"40 s","why":"40 s is when she comes back down through 6 m.","_n":"2ubb8","_k":"3db52b6d"},{"t":"32 s","why":"`cos({π}/{24} t) = 1/2` gives `t` = 8 or `t` = 40. She’s above 6 m for 40 − 8 = 32 s.","_n":"2vba8","_k":"6463c4ae"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"A wheel turns once every 60 s, and a rider boards at the bottom. 20 s after boarding she has risen 15 m. What is the radius of the wheel?","options":[{"t":"10 m","why":"20 s is 20/60 = 1/3 of a turn, an angle of 2π/3. Her rise is `r - r cos(2π/3) = r + r/2 = 1.5r = 15`, so `r` = 10 m.","_n":"2wb98","_k":"2ab76247"},{"t":"15 m","why":"15 m is the rise. One-third of a turn takes her past the axle, so the rise is more than the radius.","_n":"2xb88","_k":"0a063096"},{"t":"11.25 m","why":"That assumes a steady climb: one-third of a turn as two-thirds of the 2`r` climb, so 4`r`/3 = 15. Her climb isn’t steady: by one-third of a turn she has been through the fast middle part, so she has risen 1.5`r`, more than a steady climb gives.","_n":"2yb78","_k":"c6ac2474"},{"t":"45 m","why":"15 ÷ (1/3) treats the rise as one-third of the radius.","_n":"2zc68","_k":"54fa4701"}]},"b":{"prompt":"A wheel turns once every 36 s, and a rider boards at the bottom. 12 s after boarding she has risen 18 m. What is the radius of the wheel?","options":[{"t":"12 m","why":"12 s is 12/36 = 1/3 of a turn, an angle of 2π/3. Her rise is `r - r cos(2π/3) = 1.5r = 18`, so `r` = 12 m.","_n":"30c58","_k":"4945b6a8"},{"t":"54 m","why":"18 ÷ (1/3) treats the rise as one-third of the radius.","_n":"31b88","_k":"47d5ce54"},{"t":"18 m","why":"18 m is the rise. One-third of a turn takes her past the axle, so the rise is more than the radius.","_n":"32b98","_k":"43dc1322"},{"t":"13.5 m","why":"That assumes a steady climb: one-third of a turn as two-thirds of the 2`r` climb, so 4`r`/3 = 18. Her climb isn’t steady: by one-third of a turn she has risen 1.5`r`.","_n":"33ba8","_k":"290faff7"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A bicycle is upside down on a repair stand, and its wheel spins at exactly 2 turns per second. A reflector is clipped to the spokes 30 cm from the hub. At its fastest, how quickly is the reflector’s height changing?","use":"π ≈ 3.14","options":[{"t":"0 cm/s","why":"That’s the rate at the very top or bottom, where the reflector moves sideways: the slowest moment, not the fastest.","_n":"34bb8","_k":"810ebe2f"},{"t":"240 cm/s","why":"That’s the \u003cstrong>average\u003c/strong> rate for the half-turn climb: 60 cm in 1/4 s. Passing the hub, the reflector moves straight up at its full speed, which is faster.","_n":"35b48","_k":"6db3f934"},{"t":"30π cm/s (about 94 cm/s)","why":"That divides the circumference by 2. At 2 turns per second the reflector travels \u003cstrong>two\u003c/strong> circumferences each second: 2 × 60π = 120π cm.","_n":"36b58","_k":"6506a36a"},{"t":"120π cm/s (about 377 cm/s)","why":"Level with the hub, the reflector moves straight up, so its height changes at its full speed: 2 × (2π × 30) = 120π ≈ 377 cm/s.","_n":"37b68","_k":"f44abfbf"}]},"b":{"prompt":"A wind turbine’s blades turn at exactly 15 turns per minute. The tip of a blade is 20 m from the hub. At its fastest, how quickly is the tip’s height changing?","use":"π ≈ 3.14","options":[{"t":"20 m/s","why":"That’s the \u003cstrong>average\u003c/strong> rate for the half-turn climb: 40 m in 2 s. Level with the hub the tip moves straight up, which is faster.","_n":"38b78","_k":"c901b186"},{"t":"0 m/s","why":"That’s the rate at the very top or bottom, where the tip moves sideways.","_n":"39c08","_k":"782677b7"},{"t":"10π m/s (about 31.4 m/s)","why":"One turn takes 4 s, so the tip’s speed is 2π × 20 ÷ 4 = 10π ≈ 31.4 m/s. Level with the hub it moves straight up, so that’s how fast its height changes.","_n":"3ac18","_k":"a90989d1"},{"t":"8π/3 m/s (about 8.4 m/s)","why":"That divides the circumference by 15. 15 is turns per \u003cstrong>minute\u003c/strong>: one turn takes 60 ÷ 15 = 4 s.","_n":"3bca8","_k":"dee5d7c9"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why a Ferris wheel rider’s height changes fastest as she passes the axle?","options":[{"t":"The axle height is the average height, and an average always changes fastest.","why":"That isn’t a rule. The reason is the direction of her motion.","_n":"3cc98","_k":"32386c88"},{"t":"At the axle height she is moving straight up or down, so all of her motion changes her height. At the top and bottom she is moving sideways, so for an instant her height stops changing.","why":"This links the rate to the direction she’s moving.","_n":"3dcc8","_k":"d72fedae"},{"t":"Her height is greatest at the axle, so it changes fastest there.","why":"Her height is greatest at the top, where it changes slowest. A large value doesn’t mean a large rate.","_n":"3ecb8","_k":"d628dc91"},{"t":"The wheel turns faster when the rider is halfway up.","why":"The wheel turns at a steady speed. What changes is the direction she’s moving.","_n":"3fc68","_k":"20b7b14a"}]},"b":{"prompt":"Daylight is modelled by a sinusoid with axis 12 h. Which is the best explanation of why daylight changes fastest around the spring equinox, when there are 12 h of daylight?","options":[{"t":"The months around March are longer, so more daylight is added.","why":"Every month counts as 1/12 of a year here. The reason is the shape of the graph.","_n":"3gc58","_k":"70fe8780"},{"t":"The equinox is where the daylight graph crosses its axis, the steepest part of a sinusoid. Around the longest and shortest days the graph is at a maximum or minimum, where it is flat for an instant.","why":"This links the rate to where the sinusoid is steepest.","_n":"3hc88","_k":"e01cbc21"},{"t":"At the equinox, daylight is the average of the year, and an average always changes fastest.","why":"That isn’t a rule. The reason is where the graph is steepest.","_n":"3ic78","_k":"644e87a0"},{"t":"Daylight is greatest at the equinox, so it changes fastest.","why":"Daylight is greatest at the summer solstice, where it changes slowest.","_n":"3jc28","_k":"e1f8fec2"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"For `h(t) = -10 cos({π}/{30} t) + 12` (metres, seconds), the average rate of change from `t` = 10 s to `t` = 20 s is 1 m/s. Which statement best explains what this means?","options":[{"t":"Her height at `t` = 20 s is 1 m.","why":"A rate isn’t a height. At 20 s she’s 17 m high.","_n":"3kc18","_k":"382c06f8"},{"t":"She rose 1 m in total between 10 s and 20 s.","why":"She rose 10 m in total. 1 m/s is per second.","_n":"3lc48","_k":"eff31b1e"},{"t":"Between 10 s and 20 s her height rose by 10 m, which is 1 m per second on average. She climbed faster in some of those seconds and slower in others.","why":"Net change ÷ time, and an average, not a steady rate.","_n":"3mc58","_k":"5056f321"},{"t":"She rose exactly 1 m during every one of those 10 seconds.","why":"That describes a steady climb. Her rate is changing the whole time; 1 m/s is only the average.","_n":"3nc28","_k":"048bb1a6"}]},"b":{"prompt":"A tide’s depth is `w(t) = 4 cos[{π}/{6} (t - 2)] + 5` (metres, hours after midnight). The average rate of change from `t = 2` to `t = 8` is −4/3 m/h. Which statement best explains what this means?","options":[{"t":"The depth at 8:00 is −4/3 m.","why":"A rate isn’t a depth. At 8:00 the depth is 1 m.","_n":"3oc38","_k":"539e944e"},{"t":"The depth fell by exactly 4/3 m in each of those six hours.","why":"That describes a steady fall. The tide falls slowly near high and low tide and fastest in between.","_n":"3pc88","_k":"b697d1b6"},{"t":"The depth fell by 4/3 m in total between 2:00 and 8:00.","why":"It fell by 8 m in total. −4/3 m/h is per hour.","_n":"3qc98","_k":"b1e94066"},{"t":"Between 2:00 and 8:00 the depth fell by 8 m in 6 h, which is 4/3 m per hour on average. It fell faster in some hours and slower in others.","why":"Net change ÷ time, and an average, not a steady rate.","_n":"3rc68","_k":"934b4991"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"In a harbour, high tide is 8.6 m deep at 3:00 a.m. The next low tide is 2.2 m deep at 9:00 a.m. Which model gives the depth `t` hours after midnight?","options":[{"t":"`w(t) = 6.4 cos[{π}/{6} (t - 3)] + 5.4`","why":"6.4 is the whole range from low to high. The amplitude is half of it.","_n":"3sc78","_k":"b8ab4c26"},{"t":"`w(t) = 3.2 cos[{π}/{6} (t + 3)] + 5.4`","why":"(`t` + 3) puts the high at `t = -3`. A high at 3:00 needs (`t` − 3).","_n":"3tbc8","_k":"f63e7cfe"},{"t":"`w(t) = 3.2 cos[{π}/{6} (t - 3)] + 5.4`","why":"Axis (8.6 + 2.2)/2 = 5.4, amplitude (8.6 − 2.2)/2 = 3.2. High to low is half a cycle, so the period is 12 h and `k = π/6`. With `a > 0`, `d` is the time of a high: 3.","_n":"3ubd8","_k":"3d12e5d7"},{"t":"`w(t) = 3.2 cos[{π}/{3} (t - 3)] + 5.4`","why":"`k = π/3` means a 6-hour period. High to low is only half a cycle, so the period is 12 h.","_n":"3v467","_k":"ca4aa9ce"}]},"b":{"prompt":"In a harbour, high tide is 7.4 m deep at 5:00 a.m. The next low tide is 1.8 m deep at 11:00 a.m. Which model gives the depth `t` hours after midnight?","options":[{"t":"`w(t) = 5.6 cos[{π}/{6} (t - 5)] + 4.6`","why":"5.6 is the whole range.","_n":"3w457","_k":"e9060da0"},{"t":"`w(t) = 2.8 cos[{π}/{3} (t - 5)] + 4.6`","why":"That’s a 6-hour period.","_n":"3x447","_k":"2b695a0a"},{"t":"`w(t) = 2.8 cos[{π}/{6} (t - 5)] + 4.6`","why":"Axis (7.4 + 1.8)/2 = 4.6, amplitude (7.4 − 1.8)/2 = 2.8, period 12 h so `k = π/6`, and a high at 5.","_n":"3y437","_k":"fbb7f023"},{"t":"`w(t) = 2.8 cos[{π}/{6} (t + 5)] + 4.6`","why":"A high at 5:00 needs (`t` − 5).","_n":"3z4a7","_k":"ab118801"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A cyclist’s pedal is on a crank 17 cm long. The crank’s axle is 30 cm above the ground. For what fraction of each turn of the crank is the pedal higher than 38.5 cm above the ground?","options":[{"t":"1/6","why":"That’s only from the moment the pedal passes 38.5 cm to the top. It stays above 38.5 cm until it comes back down.","_n":"40497","_k":"bdc6084e"},{"t":"1/3","why":"38.5 = 30 + 8.5: the axle plus half the crank. The pedal is that high when sin φ = 1/2, at φ = π/6 and 5π/6. The arc between them is 2π/3, one-third of a turn.","_n":"41487","_k":"a3798dd1"},{"t":"1/2","why":"Half the turn is the time the pedal spends above the \u003cstrong>axle\u003c/strong>, 30 cm. 38.5 cm is higher.","_n":"42477","_k":"1717ea52"},{"t":"2/3","why":"That’s the fraction of the turn the pedal spends \u003cstrong>below\u003c/strong> 38.5 cm.","_n":"433e7","_k":"e2ff1340"}]},"b":{"prompt":"A buoy bobs on steady waves. Its height above the sea floor rises and falls sinusoidally between 11.4 m and 12.6 m, and one wave passes every 4 s. For what fraction of each wave is the buoy lower than 11.7 m?","options":[{"t":"1/6","why":"That’s only from passing 11.7 m to the lowest point. It stays below 11.7 m until it comes back up.","_n":"443d7","_k":"16002b6e"},{"t":"1/3","why":"Axis (12.6 + 11.4) ÷ 2 = 12, amplitude 0.6. 11.7 = 12 − 0.3: the axis minus half the amplitude. With height 12 + 0.6 sin φ, that’s sin φ \u003c −1/2, for 7π/6 \u003c φ \u003c 11π/6: 2π/3 of the 2π in each wave, one-third.","_n":"45c07","_k":"6877fb00"},{"t":"1/2","why":"That’s the time below the \u003cstrong>axis\u003c/strong>, 12 m. 11.7 m is lower than the axis.","_n":"46c17","_k":"fe5fdd99"},{"t":"2/3","why":"That’s the fraction of each wave the buoy spends \u003cstrong>above\u003c/strong> 11.7 m.","_n":"47c27","_k":"24d14227"}]}}]},"task":{"title":"Design a viewing wheel","summary":"Design a viewing wheel","statement":"\u003cp>A city wants a Ferris wheel beside a 20 m viewing deck. Choose the radius `r`, the axle height `c` and the time per turn `T` so that all four checks pass. Riders board at the bottom at `t = 0`. There are many working designs, on three different wheels. Can you find more than one?\u003c/p>","use":"π ≈ 3.14","inputs":[{"id":"r","label":"Radius `r` (m)","min":4,"max":20},{"id":"c","label":"Axle height `c` (m)","min":5,"max":40},{"id":"T","label":"Time per turn `T` (s)","min":20,"max":120}],"checks":["The lowest seat is between 2 m and 8 m above the ground (the boarding platform)","The rider is above the viewing deck for exactly one-third of each turn","Her height never changes faster than 1 m/s","One turn takes at most 90 s"],"tips":["The lowest seat is `c - r` = {v} m. It must be between 2 m and 8 m.","Right now the rider is above 20 m for {v} of each turn. One-third of a turn is an arc of 2π/3 centred on the top: its ends are π/3 from the top. How high is a seat π/3 from the top, in terms of `c` and `r`?","At the axle the rider moves straight up, at her full speed along the rim: 2π`r`/`T` = {v} m/s. Use a longer turn, or a smaller wheel.","Riders won’t wait more than 90 s for a turn. Use a smaller `T`, and check line 3 still passes."],"tipWords":{"more":"more than a third","less":"less than a third","none":"none","all":"all"},"explainPrompt":"Explain why your wheel keeps the rider above the deck for exactly one-third of each turn, and how you chose `T`.","vocab":"Use the words amplitude, axis, period and rate of change.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","twoWheels":"Every working wheel has `c + r/2 = 20`, and the bigger the wheel, the longer each turn must take: `T ≥ 2πr`. With π ≈ 3.14 the shortest turns are 51 s, 63 s and 76 s.","deck":"viewing deck","invalid":"Enter whole numbers: `r` from 4 to 20, `c` from 5 to 40 and `T` from 20 to 120."},"cards":[["Ferris wheel model, boarding at the bottom","`h(t) = -r cos(2π/T · t) + c`: radius `r`, axle height `c`, `T` seconds per turn. Check: `h(0) = c - r`, the lowest seat."],["Amplitude in a situation","(max − min) ÷ 2. For a wheel, the radius. Example: lowest 2 m, top 22 m → 10 m."],["Axis in a situation","`y` = (max + min) ÷ 2: the axle height, the mean water level, or the average day length."],["`k` from the period","`k = 2π/T` and `T = 2π/k`. A 60 s turn gives `k = π/30`; `k = π/6` means a 12-hour (or 12-month) cycle."],["Starting point → function","Bottom: −cos. Top: +cos. Axle level going up: +sin. Axle level going down: −sin."],["Phase shift `d` in context","In `a cos[k(t - d)] + c` with `a > 0`, `d` is the time of a maximum. High tide at 2:00 → (`t` − 2)."],["Average rate of change","[`h(t_2) - h(t_1)`] ÷ (`t_2 - t_1`), with units such as m/s: the net change per unit of time. Over a whole cycle it’s 0."],["Where is a sinusoid’s rate greatest? zero?","Greatest (up or down) where the graph crosses its axis; zero at every maximum and minimum."],["Steepest rate of climb on a wheel","The rider’s speed along the rim, 2π`r`/`T`, because at axle height she moves straight up. `r` = 10 m, `T` = 60 s → π/3 ≈ 1.05 m/s."],["Equal times, unequal changes","From the bottom, each sixth of a turn lifts the rider `r/2`, then `r`, then `r/2` (5 m, 10 m, 5 m when `r = 10`)."],["How many times per cycle is a level reached?","Twice for any level between the min and the max: once going up, once coming down. `h = 17` for `-10 cos(π/30 t) + 12` at `t` = 20 and 40."],["Levels `c ± a/2` (`a` = the amplitude)","A sinusoid is above `c + a/2` for one-third of each cycle (an arc of 2π/3 around the top) and above `c - a/2` for two-thirds. Example: 17 m on the 10 m wheel with axle 12 m."]]}};</script>
