.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 35: hero labels, wheel–graph link, Ferris wheel lab controls, real-data builder, change bars, task steppers */
.hero .hero-eq.sm{font-style:italic;padding-bottom:2.9rem;line-height:1.15}
.heq-l{position:relative;display:inline-block}
.heq-l small{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:8.6em;margin-top:.3rem;font:400 .74rem/1.2 var(--font-ui);font-style:normal;color:var(--ink-2);text-align:center;letter-spacing:0;white-space:normal}
.hero-eq .m{white-space:nowrap}
@media (max-width:560px){
  .hero .hero-eq.sm{padding-bottom:4.4rem}
  .heq-l small{width:6.4em;font-size:.64rem}
}
#hero-cap .m{white-space:normal}
/* wheel–graph link: one canvas above 560 px, two stacked canvases at 560 px and below */
.wg-two{display:none}
canvas.plot.wg-c1{aspect-ratio:16/10}
@media (max-width:560px){
  .wg-one{display:none}
  .wg-two{display:grid;gap:8px}
  .lab-hrow{outline:2.5px solid var(--hi);outline-offset:2px;border-radius:6px}
}
/* radio groups (from MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}
/* Ferris wheel lab */
.lab-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.lab-lock{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 10px;border:1.5px dashed var(--ink-2);border-radius:8px;background:var(--paper)}
.lab-cap{font-size:clamp(1.35rem,3.4vw,2rem)}
.lab-unch{display:inline-block;font:700 .9rem var(--font-ui);color:var(--p-k);background:var(--hi-soft);border:1.5px solid var(--p-k);border-radius:6px;padding:.05em .45em;vertical-align:middle}
.lab-unch .m{font-size:1.05em}
.lab-rate{margin-top:8px}
canvas#lab-rate{aspect-ratio:auto;height:120px}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px 28px;align-items:start;margin-top:16px}
.lab-ctrl,.lab-read{min-width:0}
.lab-grp{margin:0 0 12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.lab-grp > summary{font-weight:700;cursor:pointer;min-height:28px}
.lab-row{margin:8px 0 4px}
.lab-note{min-height:1.2em;margin:4px 0 0}
.lab-tb{margin-top:6px}
.lab-tog{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab-tog .chip{min-height:34px}
.lab-tog .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.lab-read .tbl-wrap{margin-top:4px}
.lab-read table.vt td,.lab-read table.vt th{padding:4px 10px}
@media (max-width:820px){ .lab-grid{grid-template-columns:minmax(0,1fr)} }
/* Part 3: real data */
.dt-set{margin:0 0 12px}
.dt-story{margin:0 0 12px}
.dt-story p{margin:0 0 6px}
.dt-main{margin-top:14px}
.dt-pts{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%)}
.dt-pts:focus-within{position:static;width:auto;height:auto;overflow:visible;clip:auto;clip-path:none;display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dt-pts .chip{font-size:.8rem;min-height:30px}
.dt-pts .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.dt-card{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;min-width:0}
.dt-h{margin:0 0 8px}
.dt-done{margin:4px 0;color:var(--ink)}
.dt-later{margin:4px 0;color:var(--ink-2);opacity:.75}
.dt-step{margin:8px 0;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.dt-sname{margin:0 0 4px}
.dt-step .numrow,.dt-uq .numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.dt-kask{margin:10px 0 4px;font-weight:700}
.dt-k{display:flex;flex-wrap:wrap;gap:6px}
.dt-k .fchip{min-width:52px}
.dt-form{margin:4px 0 8px}
.dt-fit{margin-top:10px}
.dt-fitc{display:flex;flex-wrap:wrap;gap:6px}
.dt-fitc .chip{min-height:34px}
.dt-alg-lines p{margin:8px 0 0;font-size:1.02rem}
.dt-alg-lines p.dt-cur{background:var(--hi-soft);border-radius:6px;padding:2px 6px}
.dt-frame{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.dt-frame label{display:inline-flex;gap:6px;align-items:center}
.dt-frame .numin{width:4.6rem}
.dt-uq{margin:10px 0 0}
#dt-rplot{margin-top:10px}
.dt-bars{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.dt-bt{margin:0 0 6px}
.dt-bscroll{overflow-x:auto}
.dt-brow{display:flex;gap:4px;align-items:stretch;min-width:max-content;height:128px;position:relative;background:linear-gradient(var(--ink-2),var(--ink-2)) 0 56px/100% 1.5px no-repeat}
.dt-bar{position:relative;width:24px;height:128px;border:0;background:transparent;padding:0;border-radius:4px}
.dt-bar.on{background:var(--hi-soft)}
.dt-bb{position:absolute;left:4px;right:4px;background:var(--pen);border-radius:2px}
.dt-bb.up{bottom:72px}
.dt-bb.dn{top:57px}
.dt-bm{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:.72rem;color:var(--ink-2)}
.dt-bsel{margin:6px 0 4px;font-weight:700}
/* task */
.tk-in{display:flex;flex-wrap:wrap;gap:12px 18px;margin:10px 0 14px}
.tk-f label{display:block;font-weight:700;margin-bottom:4px}
.tk-row{display:flex;align-items:center;gap:6px}
.tk-row input{width:4.8rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.4em .6em;font:400 1.2rem var(--font-math);text-align:center}
.tk-row input:focus{border-color:var(--ink)}
.tk-pm{min-width:40px;min-height:40px;padding:0 .4em;font-size:1.2rem;line-height:1}
.tk-cap{font-size:clamp(1.2rem,3vw,1.6rem)}
/* long models and worked lines wrap on phones */
.sbtn .m,.mitem .m,.q-prompt .m,.task .m,.dt-card .m,.lab-read .m{white-space:normal}
.m .frac{white-space:nowrap}

:"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"d0f32309","content":{"id":"35-applications-of-trig-functions","kind":"topic","title":"Applications of trig functions","topic":"Applications of Trig Functions","readyTopic":"applications of trig functions","hero":{"eq":"`h(t) =` \u003cspan class=\"heq-l\">`@a{-10}`\u003csmall>radius 10 m (the − starts her at the bottom)\u003c/small>\u003c/span> `cos(`\u003cspan class=\"heq-l\">`@k{{π}/{30}}`\u003csmall>one turn every 60 s\u003c/small>\u003c/span>&#8201;`t) +` \u003cspan class=\"heq-l\">`@c{12}`\u003csmall>axle height\u003c/small>\u003c/span>","eqLabel":"h of t equals negative 10 cos of pi over 30 t, plus 12. Negative 10: radius 10 metres, the minus starts her at the bottom. Pi over 30: one turn every 60 seconds. 12: axle height.","eqSize":"sm","headline":"Every number in the model is something you can point to","text":"A Ferris wheel turns, and the rider’s height rises and falls in a wave. That wave is a \u003cstrong>sinusoidal model\u003c/strong>: the radius is its \u003cstrong>amplitude\u003c/strong>, the axle height is its \u003cstrong>axis\u003c/strong>, and the time for one turn is its \u003cstrong>period\u003c/strong>. The same model tells you when the rider reaches any height, and how fast her height is changing: her \u003cstrong>average rate of change\u003c/strong> over an interval and her \u003cstrong>instantaneous rate of change\u003c/strong> at a moment. Tides and hours of daylight follow the same pattern.","fig":{"html":"\u003cdiv id=\"hero-wg\" class=\"wg-hero\">\u003c/div>"},"cap":{"end":"`h(t) = @a{-10} cos(@k{{π}/{30}} t) + @c{12}`"}},"goals":["I can build a sinusoidal model for a Ferris wheel or another turning object from its radius, axle height, time per turn and starting position.","I can explain what each parameter means in a situation, with units: amplitude, axis, period and phase shift.","I can build a sinusoidal model from data, such as tide depths or hours of daylight, and use it to make a prediction.","I can use a model to find the value at a given time, and every time in a cycle when the quantity is at or above a given level.","I can calculate an average rate of change from a model, with units, and explain what it means in the situation.","I can estimate an instantaneous rate of change with shrinking intervals, and explain where in the cycle it is greatest, zero, positive or negative."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Sinusoid features","goal":2,"prompt":"What are the maximum and minimum values of `y = -5 cos[2(x - π/3)] + 7`?","options":[{"t":"max 17, min −3","why":"That goes 10 above and below the axis. The amplitude is 5, the distance from the axis to a peak.","_n":"0ed3","_k":"ffa34f4c"},{"t":"max 12, min 2","why":"The axis is `y = 7` and the amplitude is `|-5| = 5`, so the values run from 7 − 5 = 2 to 7 + 5 = 12. The negative sign only flips the wave; it doesn’t change the max or min.","_n":"1ea3","_k":"f672786f"},{"t":"max 9, min 5","why":"2 changes the period, not the height. The amplitude is `|-5| = 5`.","_n":"2eb3","_k":"c4058b14"},{"t":"max 5, min −5","why":"That’s `y = 5 cos x` without the + 7. The axis is `y = 7`, so the values are 7 + 5 and 7 − 5.","_n":"3e83","_k":"d29e7f97"}],"hints":["Find the axis and the amplitude first.","Axis `y = 7`. Amplitude `|a| = |-5| = 5`.","max = 7 + 5 = 12, min = 7 − 5 = 2."]},{"id":"w2","skill":"Sinusoid features","goal":1,"prompt":"Which function has a period of 20?","options":[{"t":"`y = sin({x}/{20})`","why":"Its period is 2π ÷ (1/20) = 40π, about 126. `k = 2π/20`, not 1/20.","_n":"4e93","_k":"4ffc07dd"},{"t":"`y = sin({π}/{20} x)`","why":"Its period is 2π ÷ (π/20) = 40. You need `k = 2π/20 = π/10`.","_n":"5e63","_k":"c30743ab"},{"t":"`y = sin(20x)`","why":"With `k = 20` the period is 2π/20 = π/10. `k` is not the period; it’s 2π ÷ period.","_n":"6e73","_k":"d30e2355"},{"t":"`y = sin({π}/{10} x)`","why":"Period = 2π ÷ (π/10) = 20.","_n":"7e43","_k":"2b37b284"}],"hints":["Period = 2π/`k`. So `k` = 2π ÷ period.","`k = 2π/20`. Simplify.","`k = π/10`, so the function is `y = sin({π}/{10} x)`."]},{"id":"w3","skill":"Exact values and equations","goal":4,"prompt":"What is the exact value of `cos(2π/3)`?","options":[{"t":"`-{1}/{2}`","why":"2π/3 is in quadrant 2 with reference angle π/3. `cos(π/3) = 1/2`, and cosine is negative in quadrant 2.","_n":"8e53","_k":"3ddcfb02"},{"t":"`-{√3}/{2}`","why":"`-√3/2` is `cos(5π/6)`. 2π/3 has reference angle π/3, and `cos(π/3) = 1/2`.","_n":"9265","_k":"33ec1af0"},{"t":"`{1}/{2}`","why":"1/2 is `cos(π/3)`. 2π/3 is left of the `y`-axis, so its cosine is negative.","_n":"a255","_k":"4fd247fb"},{"t":"`{√3}/{2}`","why":"`√3/2` is `sin(2π/3)`. The question asks for cosine.","_n":"b285","_k":"1e137e4d"}],"hints":["Find the quadrant and the reference angle of 2π/3.","Quadrant 2, reference angle π − 2π/3 = π/3. Is cosine positive or negative in quadrant 2?","`cos(π/3) = 1/2`, and cosine is negative in quadrant 2: `cos(2π/3) = -1/2`."]},{"id":"w4","skill":"Exact values and equations","goal":4,"prompt":"Solve `cos x = -1/2` for `0 ≤ x ≤ 2π`.","options":[{"t":"`x = 2π/3` and `4π/3`","why":"Reference angle π/3; cosine is negative in quadrants 2 and 3: π − π/3 = 2π/3 and π + π/3 = 4π/3.","_n":"c275","_k":"c647c0e8"},{"t":"`x = π/3` and `5π/3`","why":"`cos(π/3) = +1/2`. The sign puts the angles left of the `y`-axis, in quadrants 2 and 3.","_n":"d225","_k":"fce98e09"},{"t":"`x = 2π/3` only","why":"Cosine is negative in quadrants 2 \u003cstrong>and\u003c/strong> 3, so there’s a second angle: π + π/3 = 4π/3.","_n":"e215","_k":"21adafbb"},{"t":"`x = 5π/6` and `7π/6`","why":"`cos(5π/6) = -√3/2`. The size 1/2 belongs to reference angle π/3.","_n":"f245","_k":"66d499ad"}],"hints":["Ignore the sign first: which reference angle has cosine 1/2?","π/3. Cosine is negative in quadrants 2 and 3.","`x` = π − π/3 = 2π/3 and `x` = π + π/3 = 4π/3."]},{"id":"w5","skill":"Rates of change","goal":5,"prompt":"A drone is 4 m above the ground at `t` = 2 s and 22 m above the ground at `t` = 8 s. What is its average rate of change of height?","options":[{"t":"3 m/s","why":"(22 − 4)/(8 − 2) = 18/6 = 3 m/s: on average the drone rose 3 m each second.","_n":"g235","_k":"04dc2148"},{"t":"1/3 m/s","why":"That’s run ÷ rise. Rate of change of height = change in height ÷ change in time.","_n":"h1e5","_k":"0f284d6f"},{"t":"2.75 m/s","why":"22 ÷ 8 ignores where the drone started. Use the changes: (22 − 4) ÷ (8 − 2).","_n":"i1d5","_k":"d183a3fb"},{"t":"18 m/s","why":"18 m is the change in height. It took 6 s, so the rate is 18 ÷ 6.","_n":"j944","_k":"6ec50fe3"}],"hints":["Average rate = (change in height) ÷ (change in time).","Change in height: 22 − 4 = 18 m. Change in time: 8 − 2 = 6 s.","18 ÷ 6 = 3 m/s."]},{"id":"w6","skill":"Rates of change","goal":6,"prompt":"For `f(x) = x^2`, the slopes of the secants from `P`(1, 1) to points `Q` closer and closer to `P` are 2.6, 2.15, 2.015 and 2.0015. What value are the slopes settling toward?","options":[{"t":"0","why":"When `Q` is very close to `P`, both the rise and the run are tiny, but their ratio isn’t. The slopes are heading toward 2, not 0.","_n":"k954","_k":"3e86f68f"},{"t":"2","why":"Each slope is closer to 2 than the last (2.6, 2.15, 2.015, 2.0015). That value is the instantaneous rate of change at `P`.","_n":"l964","_k":"da31bff0"},{"t":"2.19","why":"The mean of the four slopes is about 2.19, but the early, wide secants are the worst estimates. Look where the sequence is heading.","_n":"m974","_k":"3c93b7ff"},{"t":"2.6","why":"2.6 comes from the widest interval. The narrower the interval, the better the estimate.","_n":"n904","_k":"65e4dd73"}],"hints":["Look at how the numbers change as `Q` gets closer to `P`.","The part after the 2 keeps shrinking: 0.6, 0.15, 0.015, 0.0015.","The slopes are settling toward 2."]}],"refreshers":{"Sinusoid features":"In `y = a sin[k(x - d)] + c` (or the cosine version), the axis is `y = c`, the amplitude is `|a|`, the maximum is `c + |a|`, the minimum is `c - |a|`, and the period is 2π/`|k|`. Example: `y = -5 cos[2(x - π/3)] + 7` has axis `y = 7`, amplitude 5, max 12, min 2 and period 2π/2 = π. To build `k` from a period `T`, use `k = 2π/T`: a period of 20 gives `k = π/10`.","Exact values and equations":"For an angle in any quadrant, the reference angle gives the size and CAST gives the sign: `cos(2π/3) = -cos(π/3) = -1/2`. To solve `cos x = -1/2` on `0 ≤ x ≤ 2π`, find the reference angle (π/3), then every quadrant where cosine is negative: `x` = 2π/3 and 4π/3. There are usually \u003cstrong>two\u003c/strong> answers in one cycle.","Rates of change":"The average rate of change over an interval is (change in output) ÷ (change in input), the slope of the secant, with units such as m/s. Example: from (2 s, 4 m) to (8 s, 22 m) it’s 18/6 = 3 m/s. To estimate the instantaneous rate at a point, shrink the interval and watch where the secant slopes settle."}}},"explore":{"heading":"Ferris wheel lab","intro":"Build a wheel, then ride it. The rider’s height is drawn on the graph as the wheel turns. Switch to Rates to measure how fast her height is changing.","ui":{"modes":["Ride","Rates"],"boards":["Bottom","Axle level, going up","Top","Axle level, going down"],"raised":"Axle raised so the wheel stays above the ground.","locked":"Locked for this challenge.","camera":"camera at 17 m","setup":"Set up this challenge","tc3Hidden":"hidden for this challenge"},"predictions":[{"id":"p1","start":{"mode":"ride","r":10,"c":12,"T":60,"b":0,"t":0},"prompt":"The park replaces this wheel with one of radius 15 m. The axle is raised so the lowest seat stays 2 m above the ground, and one turn still takes 60 s. Which numbers in the model change?","options":[{"t":"−10 only","_n":"o914","_k":"90a473a7"},{"t":"−10 and 12 only","_n":"p924","_k":"2e47d070"},{"t":"−10, 12 and π/30","_n":"q934","_k":"d08e3a37"},{"t":"12 only","_n":"r9c4","_k":"f245044c"}],"explain":"The radius is the amplitude, so `a` goes from −10 to −15. The axle sits one radius above the lowest seat: 2 + 15 = 17. One turn still takes 60 s, so `k = 2π/60 = π/30` doesn’t change. The rider on the bigger wheel does move faster along the rim (π/2 m/s instead of π/3 m/s), but `k` counts radians per second, not metres."},{"id":"p2","start":{"mode":"rates","r":10,"c":12,"T":60,"b":0,"t1":0,"t2":10},"prompt":"In the first 30 s the rider rises 20 m, from 2 m to 22 m. How is that climb shared among the three 10-second intervals 0–10 s, 10–20 s and 20–30 s?","options":[{"t":"Most in the middle interval","_n":"s9d4","_k":"21932ec1"},{"t":"Most in the last interval","_n":"t9a4","_k":"1c36d86c"},{"t":"Most in the first interval","_n":"u994","_k":"4a89aca9"},{"t":"The same in each: about 6.7 m","_n":"v984","_k":"4945c6a3"}],"explain":"Each interval turns the wheel through the same angle, π/3, but the rise depends on where that arc is. Near the bottom the rider moves mostly sideways: only 5 m up. The middle arc goes almost straight up: 10 m. Near the top she’s moving sideways again: 5 m. `h(0) = 2`, `h(10) = 7`, `h(20) = 17`, `h(30) = 22`."},{"id":"p3","start":{"mode":"rates","r":10,"c":12,"T":60,"b":0,"t1":0,"t2":10},"prompt":"What is the rider’s average rate of change of height over one full turn, from `t = 0` to `t` = 60 s?","options":[{"t":"π/3 m/s (about 1.05 m/s)","_n":"w974","_k":"572a7439"},{"t":"0 m/s","_n":"x964","_k":"1ed1016c"},{"t":"2/3 m/s","_n":"y954","_k":"8a6ea9c9"},{"t":"1/3 m/s","_n":"z944","_k":"4bba8953"}],"explain":"Average rate of change = change in height ÷ change in time. She ends the turn at 2 m, where she started, so the change is 0. 1/3 m/s is the 20 m from the bottom to the top divided by 60 s; 2/3 m/s is the 40 m she travels up \u003cstrong>and\u003c/strong> down divided by 60 s; π/3 m/s is her speed along the rim. None of those is a net change in height."},{"id":"p4","start":{"mode":"ride","r":10,"c":12,"T":60,"b":0,"t":0,"camera":true},"prompt":"A camera on a post is 17 m above the ground. During the first turn, how many times is the rider exactly 17 m high?","options":[{"t":"0","_n":"10934","_k":"68e9bd91"},{"t":"1","_n":"11a24","_k":"aa88dd25"},{"t":"2","_n":"12a14","_k":"84f4d59a"},{"t":"4","_n":"13284","_k":"9d9df118"}],"explain":"`-10 cos(π/30 t) + 12 = 17` gives `cos(π/30 t) = -1/2`, so π/30 `t` = 2π/3 or 4π/3: `t` = 20 s or `t` = 40 s. A level line cuts a circle at two points, so the rider passes 17 m once going up and once coming down. 17 m is the axle plus half the radius (12 + 5), which puts those seats π/3 on either side of the top: the arc between them is one-third of the wheel."}],"challenges":[{"id":"tc1","goal":[1,2],"prompt":"A wheel is 18 m across, and its lowest seat is 3 m above the ground. It makes 1.5 turns every minute, and the rider boards at the bottom at `t = 0`. Set the lab to model this ride.","why":"Radius 18 ÷ 2 = 9 m, axle 3 + 9 = 12 m, 60 ÷ 1.5 = 40 s per turn, boarding at the bottom: `h(t) = -9 cos({π}/{20} t) + 12`.","msgs":{"r18":"18 m is the distance across the wheel, its diameter. The radius, and so the amplitude, is half of it: 9 m.","r":"Start with the radius. The wheel is 18 m \u003cstrong>across\u003c/strong>, and the radius is half of that.","c9":"Your lowest seat is at 0 m, on the ground. It should be 3 m up, so the axle is 3 + 9 = 12 m.","c21":"21 m is the height of the \u003cstrong>top\u003c/strong> (3 + 18). The axle is halfway between the lowest seat and the top: 12 m.","c":"The radius is right. Your lowest seat is `c - 9` = {v} m, but it should be 3 m. The axle is one radius above the lowest seat.","T90":"90 is 60 × 1.5. At 1.5 turns per minute, each turn takes 60 ÷ 1.5 = 40 s.","T60":"That’s one turn per minute. This wheel makes 1.5 turns per minute, so each turn is shorter: 40 s.","T":"Radius and axle are right. How many seconds does one turn take at 1.5 turns per minute?","b":"The wheel is right. Check `h(0)`: the rider boards at the bottom, so `h(0)` should be 3 m."},"hints":["Radius first: what’s half of the width?","`r = 9`. The axle is the lowest seat plus one radius: 3 + 9 = 12 m. How many seconds does one turn take at 1.5 turns per minute?","60 ÷ 1.5 = 40 s. Set `r = 9`, `c = 12`, `T = 40` and Boarding point: Bottom. The model is `h(t) = -9 cos({π}/{20} t) + 12`."]},{"id":"tc2","goal":[5,6],"prompt":"Using Rates mode, place a 10-second interval where the rider’s \u003cstrong>average rate of change of height is as large as possible\u003c/strong>.","why":"1 m/s is the best 10-second average. Now press \u003cstrong>Shrink toward `t_1`\u003c/strong> with `t_1 = 15`: the slopes settle at π/3 ≈ 1.047 m/s, exactly the rider’s speed along the rim.","msgs":{"down":"This is the steepest part of the graph, but the rider is coming \u003cstrong>down\u003c/strong>: the rate is −1 m/s. You want the largest rate, so look where she’s going up.","top":"This interval is centred on the top, where she’s moving sideways. Her height ends where it began: 0 m/s.","start":"You \u003cstrong>started\u003c/strong> at the steepest moment. Half of your interval is on the flatter part above it. Centre the interval on the steepest moment instead.","low":"She’s climbing, but slowly: near the bottom she moves mostly sideways.","other":"Your average rate is {v} m/s. Find where the graph climbs most steeply, then centre the interval there.","setup":"Press \u003cstrong>Set up this challenge\u003c/strong> first: it puts the wheel back to `r = 10`, `c = 12`, `T = 60`, Bottom, and locks `t_2` to `t_1` + 10 in Rates mode."},"hints":["Where is the graph steepest on the way \u003cstrong>up\u003c/strong>?","Steepest going up is where the rider passes the axle on the way up, at `t` = 15 s. Centre the 10-second interval there.","`t_1 = 10`, `t_2 = 20`: (17 − 7) ÷ 10 = 1 m/s."]},{"id":"tc3","goal":[1,6],"stretch":true,"prompt":"Design a wheel whose top is 30 m above the ground and whose lowest seat is 2 m above the ground, so that \u003cstrong>at its steepest the rider’s height changes at exactly π/2 m/s\u003c/strong> (about 1.57 m/s).","why":"`r` = (30 − 2) ÷ 2 = 14 and `c = 16`. At the axle she moves straight up at her speed along the rim, 28π/`T`, and 28π/`T` = π/2 gives `T` = 56 s. Any boarding point works: the steepest rate doesn’t depend on where she boards.","msgs":{"ends":"Check the top (`c + r`) and the lowest seat (`c - r`) first. Right now they’re {v} m and {w} m.","T36":"That makes the \u003cstrong>average\u003c/strong> climb over the half-turn 28 m ÷ 18 s ≈ 1.56 m/s. The steepest moment is faster than the average climb. At the axle she moves straight up, at her full speed along the rim.","T112":"2π × 28 ÷ 112 = π/2 uses the diameter. In one turn the rider travels 2π × 14 = 28π m, so her speed is 28π/`T`.","T":"Top and bottom are right. At the steepest point she climbs at her speed along the rim, 28π/`T` m/s. With `T` = {v} that’s {w} m/s."},"hints":["Get `r` and `c` from the top and the lowest seat first.","`r` = (30 − 2) ÷ 2 = 14 and `c = 16`. At the axle the rider moves straight up, so her steepest rate of climb is her speed along the rim: 2π × 14 ÷ `T`.","28π/`T` = π/2 gives `T` = 56 s."]}]},"part3":{"slug":"data","name":"Real data","heading":"Real data: tides and daylight","intro":"Pick a data set. Build its model one number at a time; each number you enter draws its own guide on the plot. Then see how well your model fits, and use it to answer questions.","sets":{"tide":{"label":"Tide","fn":"w","unit":"m","tUnit":"h","tName":"hours after midnight","story":"A tide gauge in a harbour records the water depth every hour, from midnight (`t = 0`) to the next midnight (`t = 24`). The readings are rounded to 0.1 m. (Real tides repeat about every 12 h 25 min. These readings are idealized to a 12-hour cycle.)","note":"The depth model is written `w(t)`, for water depth, so that the letter `d` stays free for the phase shift.","rowLabel":"Depth (m)","data":[7,8.5,9,8.5,7,5.2,3,1.5,1,1.5,3,4.9,7,8.5,9,8.5,6.8,5,3,1.6,1,1.5,3,5.1,7],"periodHow":"Tap two neighbouring maximums on the plot (or enter `T`).","phaseHow":"Cosine form with `a > 0`: tap a maximum to set `d`, or enter `d`.","steps":[{"id":"c","_a":"UQ==","wrong":[{"match":4.5,"fb":"That’s half of the high-tide depth. The axis is halfway between high and low: (9 + 1) ÷ 2 = 5."},{"match":8,"fb":"8 is the range, 9 − 1. The axis is the average of high and low."}]},{"id":"a","_a":"UA==","wrong":[{"match":8,"fb":"8 is the whole range from low to high. The amplitude is half of it."},{"match":9,"fb":"That’s the highest value, which is `c + a`."}]},{"id":"T","_a":"VQI=","wrong":[{"match":6,"fb":"From a high to the next low is only half a cycle. Tide: tap the next \u003cstrong>high\u003c/strong>. Daylight: a full cycle runs from March 21 to the next March 21."},{"match":24,"fb":"There are two high tides in the day, so 24 h holds two cycles."}]},{"id":"d","_a":"Vg==","wrong":[{"match":-2,"fb":"`cos[k(t - d)]` is largest when `t = d`. A high at `t = 2` gives `cos[{π}/{6} (t - 2)]`, so `d = 2`."},{"match":8,"fb":"That’s the time of a \u003cstrong>low\u003c/strong>. With `a > 0` the cosine form starts at a high."},{"match":20,"fb":"That’s the time of a \u003cstrong>low\u003c/strong>. With `a > 0` the cosine form starts at a high."}]}],"also":"Also correct; the simplest is `d = 2`.","model":"`w(t) = 4 cos[{π}/{6} (t - 2)] + 5`","readout":"Model: `w(t) = 4 cos[{π}/{6} (t - 2)] + 5`. Largest gap: {gap} m (at {where}). You predicted: {pred}."},"day":{"label":"Daylight","fn":"D","unit":"h","tUnit":"months","tName":"months after March 21","story":"Hours of daylight in a Prairie city near 50° N, on the 21st of each month, starting with the spring equinox on March 21 (`t = 0`). Each month is counted as 1/12 of a year. The values are rounded and idealized to follow the yearly pattern of such a city.","rowLabel":"Daylight (h)","dates":["Mar 21","Apr 21","May 21","Jun 21","Jul 21","Aug 21","Sep 21","Oct 21","Nov 21","Dec 21","Jan 21","Feb 21","Mar 21"],"data":[12,14,15.5,16,15.5,14,12.2,10,8.5,8,8.5,9.9,12],"periodHow":"One year of data has only one longest day, so tap the two points one full cycle apart where the data crosses its axis going up: March 21 and the next March 21 (or enter `T`).","phaseHow":"Cosine form with `a > 0`: tap a maximum to set `d`, or enter `d`. Or switch to the sine form: `d` is the time the data crosses the axis going up.","steps":[{"id":"c","_a":"VQI=","wrong":[{"match":8,"fb":"8 h is the shortest day. (It’s also half of the longest day, and the range 16 − 8.) The axis is halfway between the longest and shortest days: (16 + 8) ÷ 2 = 12."}]},{"id":"a","_a":"UA==","wrong":[{"match":8,"fb":"8 is the whole range from low to high. The amplitude is half of it."},{"match":16,"fb":"That’s the highest value, which is `c + a`."}]},{"id":"T","_a":"VQI=","wrong":[{"match":6,"fb":"From a high to the next low is only half a cycle. Tide: tap the next \u003cstrong>high\u003c/strong>. Daylight: a full cycle runs from March 21 to the next March 21."}],"equinox":"September 21 is near 12 h again, but daylight is \u003cstrong>falling\u003c/strong> then. A cycle ends where the pattern repeats: the same value, changing the same way."},{"id":"d","_a":"Vw==","wrong":[{"match":9,"fb":"That’s the time of a \u003cstrong>low\u003c/strong>. With `a > 0` the cosine form starts at a high."}]},{"id":"ds","_a":"VA==","wrong":[{"match":6,"fb":"September 21 is where the data crosses its axis going \u003cstrong>down\u003c/strong>. With `a > 0`, `a sin[k(t - d)] + c` crosses its axis going \u003cstrong>up\u003c/strong> at `t = d`: March 21, `d = 0`."}]}],"also":"Also correct; the simplest is `d = 3`.","alsoSin":"Also correct; the simplest is `d = 0`.","model":"`D(t) = 4 cos[{π}/{6} (t - 3)] + 12`","readout":"Model: `D(t) = 4 cos[{π}/{6} (t - 3)] + 12`, the same as `4 sin({π}/{6} t) + 12`. Largest gap: {gap} h ({where}). You predicted: {pred}."}},"stepNames":["1. Axis","2. Amplitude","3. Period","4. Phase shift"],"stepAsk":["Enter `c`.","Enter `a` (positive).","",""],"stepGeneral":["The axis is halfway between the highest and lowest values: (max + min) ÷ 2.","The amplitude is half the distance from the lowest value to the highest: (max − min) ÷ 2.","The period is the time for the pattern to repeat: from one high to the \u003cstrong>next high\u003c/strong>, or between two points with the same value, changing the same way.","In `a cos[k(t - d)] + c` with `a > 0`, `d` is the time of a high.","With `a > 0`, `a sin[k(t - d)] + c` crosses its axis going up at `t = d`."],"kChips":[{"t":"`{1}/{12}`","fb":"That’s cycles per hour (or month). `k` counts radians: 2π/12.","_n":"14294","_k":"642c1262"},{"t":"`{π}/{12}`","fb":"That’s π ÷ 12. `k = 2π/T`.","_n":"15264","_k":"53746eb0"},{"t":"`{π}/{6}`","fb":"Right: `k = 2π/12 = π/6`.","_n":"16274","_k":"fb16f981"},{"t":"`12`","fb":"12 is the period itself, not `k`.","_n":"17244","_k":"6a6d22c8"}],"kAsk":"Then choose `k`:","sineForm":"Sine form","cosForm":"Cosine form","fitAsk":"How close do you expect your model to be?","fitChips":["Within 0.5 everywhere","Off by 0.5 to 1 somewhere","Off by more than 1 somewhere"],"fitBtn":"Show my model on the data","algSteps":["\u003cstrong>Tide, `t = 4`:\u003c/strong> `4 cos[{π}/{6} (4 - 2)] + 5 = 4 cos(π/3) + 5 = 2 + 5 = 7`. The reading is 7.0. ✓","\u003cstrong>Tide, `t = 7`:\u003c/strong> `4 cos(5π/6) + 5 = 5 - 2√3 ≈ 1.54`. The reading is 1.5. ✓","\u003cstrong>Tide, `t = 5`:\u003c/strong> `4 cos(π/2) + 5 = 5`. The reading is 5.2: a gap of 0.2 m. “Real readings scatter a little around the model.”","\u003cstrong>Daylight, `t = 1`:\u003c/strong> `4 cos(-π/3) + 12 = 14`. The reading is 14.0. ✓","\u003cstrong>Daylight, `t = 8`:\u003c/strong> `4 cos(5π/6) + 12 = 12 - 2√3 ≈ 8.54`. The reading is 8.5. ✓"],"use":{"harbour":{"id":"u1","goal":4,"title":"Harbour closed","_a":"PwZKAgIfAQFIAlRu","prompt":"A ferry needs at least 3 m of water. Today, between midnight and midnight, when is the harbour closed to it?","frame":["closed from","to","and from","to"],"work":"`4 cos[{π}/{6} (t - 2)] + 5 \u003c 3` means `cos[{π}/{6} (t - 2)] \u003c -1/2`, so π/6 (`t` − 2) is between 2π/3 and 4π/3: `t` − 2 is between 4 and 8, and 12 h later again.","wrongReadings":"You used only the readings below 3 m. The water keeps falling between readings: at 6:00 and 10:00 it’s exactly 3 m, and below 3 m all the way between.","wrongLows":"Those are the low tides. The harbour is closed for a stretch of time around each one.","general":"Write the model first, then find where it equals 3: the harbour is closed between those times."},"d1":{"id":"u2","goal":5,"title":"Minutes per day","_a":"UA==","unit":"min per day","prompt":"Between March 21 and April 21, how many minutes of daylight does the city gain per day, on average? (Use a 30-day month.)","wrong":[{"match":2,"fb":"2 is hours per month."},{"match":120,"fb":"120 is minutes per month; divide by 30 days."}],"work":"`D(1) - D(0)` = 2 h = 120 min over 30 days: 4 min per day.","general":"Find `D(1) - D(0)` in hours, change it to minutes, then divide by 30 days."},"d2":{"id":"u3","goal":5,"_a":"VR5X","unit":"min per day","use":"`√3 ≈ 1.73`","prompt":"Between May 21 and June 21? Answer to one decimal place.","wrong":[{"match":4,"fb":"Daylight doesn’t grow at a steady rate. Near the longest day the graph is nearly flat."},{"match":32,"fb":"That’s minutes per month."}],"work":"`D(3) - D(2) = 4 - 2√3` ≈ 0.54 h ≈ 32 min, over 30 days ≈ 1.1 min per day.","general":"Find `D(3) - D(2)` in hours, change it to minutes, then divide by 30 days."}},"useIntro":"These questions unlock after the model is drawn over the data.","bars":{"title":"Monthly change in daylight (from the model)","caption":"Daylight changes fastest around the equinoxes, where the graph crosses its axis, and hardly at all around the solstices, where it’s at a max or min. From the shortest day to the longest, the monthly gains run 0.54, 1.46, 2, 2, 1.46, 0.54 h: slow, fast, slow. That’s the rider’s pattern again: 5 m, 10 m, 5 m."},"reality":{"title":"Model vs reality","btn":"Run 3 days","text":"A model is only as good as its period. Real tide tables use many more terms; this one would need correcting every day."},"blocks":[{"title":"What the data tells you","html":"\u003cdiv class=\"refresh\">\u003ch4>From data to a sinusoidal model\u003c/h4>\u003col>\u003cli>\u003cstrong>Axis:\u003c/strong> `c` = (max + min) ÷ 2.\u003c/li>\u003cli>\u003cstrong>Amplitude:\u003c/strong> `a` = (max − min) ÷ 2.\u003c/li>\u003cli>\u003cstrong>Period:\u003c/strong> the time for the pattern to repeat: from one high to the \u003cstrong>next high\u003c/strong> (not to the next low), or between two points with the same value, changing the same way; then `k = 2π/T`.\u003c/li>\u003cli>\u003cstrong>Phase shift:\u003c/strong> in `a cos[k(t - d)] + c` with `a > 0`, `d` is the time of a high.\u003c/li>\u003cli>\u003cstrong>Check\u003c/strong> the model at a few data times, and remember it’s a model: real data scatters around it, and a slightly wrong period drifts over time.\u003c/li>\u003c/ol>\u003c/div>"}],"quickCheck":{"title":"Quick check: “Real data”","summary":"Real data quick check","items":[{"id":"q1","goal":2,"prompt":"In the model `w(t) = 4 cos[{π}/{6} (t - 2)] + 5` (`w` in metres, `t` in hours after midnight), what does the 2 tell you?","choices":[{"t":"The time of a high tide","fb":"Right. With `a > 0` the cosine form is highest when `t - 2 = 0`: high tide is at 2:00.","_n":"18254","_k":"516d2f95"},{"t":"The number of high tides each day","fb":"That comes from the period, 2π ÷ (π/6) = 12 h: two highs a day. The 2 is a time. In `cos[k(t - d)]`, `d` is a \u003cstrong>time\u003c/strong>: the model is highest when `t = d`, so high tide is at 2:00.","_n":"19224","_k":"0c720ae0"},{"t":"The depth at low tide","fb":"The low tide is 5 − 4 = 1 m deep. The 2 sits in the bracket with `t`, so it’s measured in hours. In `cos[k(t - d)]`, `d` is a \u003cstrong>time\u003c/strong>: the model is highest when `t = d`, so high tide is at 2:00.","_n":"1a234","_k":"5fa72579"},{"t":"The amplitude","fb":"The amplitude is 4, the number in front of cos. In `cos[k(t - d)]`, `d` is a \u003cstrong>time\u003c/strong>: the model is highest when `t = d`, so high tide is at 2:00.","_n":"1b204","_k":"3b017995"}]},{"id":"q2","goal":3,"prompt":"A city has 9 h of daylight on its shortest day and 15 h on its longest. What is the amplitude of its daylight model?","choices":[{"t":"15 h","fb":"15 h is the longest day: the axis plus the amplitude, 12 + 3.","_n":"1c214","_k":"3be55771"},{"t":"3 h","fb":"Right. (15 − 9) ÷ 2 = 3 h. The axis is (15 + 9) ÷ 2 = 12 h.","_n":"1d8e4","_k":"e0883e77"},{"t":"12 h","fb":"12 h is the axis, (15 + 9) ÷ 2. The amplitude is how far the longest day is above it: 3 h.","_n":"1e8d4","_k":"09f663cc"},{"t":"6 h","fb":"6 h is the whole difference, 15 − 9. The amplitude is half of it: 3 h.","_n":"1f904","_k":"265f4c30"}]},{"id":"q3","goal":3,"prompt":"High tide is at 3:00 a.m., and the next low tide is at 9:15 a.m. What is the period of the tide?","choices":[{"t":"12.5 h","fb":"Right. High to low is half a cycle, 6.25 h, so a full cycle is 12.5 h.","_n":"1g8f4","_k":"bdf4b80f"},{"t":"12 h","fb":"That doubles 6 h, but 3:00 to 9:15 is 6.25 h. Double that: 12.5 h.","_n":"1h924","_k":"0e3a4fc8"},{"t":"6.25 h","fb":"6.25 h is high to the next low: half a cycle. Double it: 12.5 h.","_n":"1i914","_k":"3f1c692e"},{"t":"6 h","fb":"3:00 to 9:15 is 6 h 15 min, and high to the next low is only half a cycle. Double 6.25 h: 12.5 h.","_n":"1j944","_k":"b7ed26a8"}]},{"id":"q4","goal":3,"prompt":"A tide model uses a 12-hour period, but the real period is about 12.4 h. The model is right at today’s first high tide. About how far off is its prediction for the 6th high tide after that?","choices":[{"t":"2.4 h","fb":"Right. Each cycle the model gains 0.4 h on the real tide: 6 × 0.4 = 2.4 h.","_n":"1k934","_k":"f94b5af5"},{"t":"6 h","fb":"6 is the number of cycles, not the error. Each cycle adds 0.4 h: 6 × 0.4 = 2.4 h.","_n":"1l964","_k":"56772300"},{"t":"0.4 h","fb":"That’s the error after one cycle. It grows by 0.4 h every cycle: 6 × 0.4 = 2.4 h.","_n":"1m954","_k":"363c36be"},{"t":"12.4 h","fb":"That’s the real period. The error is the difference per cycle, 0.4 h, times 6 cycles: 2.4 h.","_n":"1n1c4","_k":"11fa6543"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Match the ride to its model","summary":"Match the ride to its model","goal":2,"instruction":"Match each situation to the model that describes it. `h` or `w` is in metres; `t` is in seconds for wheels and in hours after midnight for tides.","how":"Tap a situation, then tap its model.","leftTitle":"Situation","rightTitle":"Model","left":[{"id":"S1","goal":[1,2],"t":"S1. Radius 8 m, axle 10 m above the ground, one turn every 40 s. The rider boards at the bottom.","why":"Radius 8 is the amplitude, the axle 10 is the axis, 40 s gives `k = π/20`, and boarding at the bottom means −cos.","hints":["Work out the amplitude, axis, period and starting value of the situation.","Amplitude 8 m (the radius), axis 10 m (the axle), period 40 s, so `k = 2π/40`. She starts at the lowest seat, 2 m.","`k = π/20`, and boarding at the bottom means −cos: `h(t) = -8 cos({π}/{20} t) + 10`, model E1."]},{"id":"S2","goal":[1,2],"t":"S2. Radius 8 m, axle 10 m, one turn every 40 s. The rider starts at the top.","why":"Starting at the top means +cos: `h(0)` = 8 + 10 = 18 m.","hints":["Work out the amplitude, axis, period and starting value of the situation.","Amplitude 8, axis 10, period 40 s, so `k = π/20`. She starts at the top, 18 m.","Starting at the top means +cos: `h(t) = 8 cos({π}/{20} t) + 10`, model E2."]},{"id":"S3","goal":[1,2],"t":"S3. A wheel 8 m across, axle 10 m, one turn every 40 s. The rider boards at the bottom.","why":"8 m across is the diameter, so the radius, and amplitude, is 4 m.","hints":["Work out the amplitude, axis, period and starting value of the situation.","The wheel is 8 m across, so the radius is 4 m: amplitude 4, axis 10, period 40 s. She starts at the lowest seat, 6 m.","The radius is half the width: `h(t) = -4 cos({π}/{20} t) + 10`, model E3."]},{"id":"S4","goal":[1,2],"t":"S4. Radius 8 m, axle 10 m, one turn every 20 s. The rider boards at the bottom.","why":"A 20 s turn gives `k = 2π/20 = π/10`.","hints":["Work out the amplitude, axis, period and starting value of the situation.","Amplitude 8, axis 10, period 20 s, so `k = 2π/20`. She starts at the lowest seat, 2 m.","`k = π/10` and she boards at the bottom: `h(t) = -8 cos({π}/{10} t) + 10`, model E4."]},{"id":"S5","goal":[1,2],"t":"S5. Radius 8 m, axle 10 m, one turn every 40 s. The rider starts level with the axle, going up.","why":"Starting level with the axle, going up, means +sin: `h(0)` = 10 m and rising.","hints":["Work out the amplitude, axis, period and starting value of the situation.","Amplitude 8, axis 10, period 40 s. She starts at 10 m, level with the axle, going up.","Starting at the axle going up means +sin: `h(t) = 8 sin({π}/{20} t) + 10`, model E5."]},{"id":"S6","goal":[1,2],"t":"S6. Lowest seat 2 m above the ground, top 18 m, one turn every 80 s. The rider boards at the bottom.","why":"Radius (18 − 2) ÷ 2 = 8, axle (18 + 2) ÷ 2 = 10, and an 80 s turn gives `k = π/40`.","hints":["Find the radius and the axle from the lowest seat and the top.","Radius (18 − 2) ÷ 2 = 8 m, axle (18 + 2) ÷ 2 = 10 m. One turn takes 80 s, so `k = 2π/80`.","`k = π/40` and she boards at the bottom: `h(t) = -8 cos({π}/{40} t) + 10`, model E6."]},{"id":"S7","goal":[3,2],"t":"S7. Tide: high tide 9 m deep at 2:00, low tide 1 m deep at 8:00.","why":"Axis 5, amplitude 4, period 12 h, and the high at 2:00 gives (`t` − 2).","hints":["Work out the amplitude, axis, period and starting value of the situation.","Axis (9 + 1) ÷ 2 = 5, amplitude 4, period 2 × 6 = 12 h, so `k = π/6`. High tide is at 2:00.","In the cosine form with `a > 0`, `d` is the time of a high: `w(t) = 4 cos[{π}/{6} (t - 2)] + 5`, model E7."]},{"id":"S8","goal":[3,2],"t":"S8. Tide: low tide 1 m deep at 2:00, high tide 9 m deep at 8:00.","why":"The high is at 8:00, so `d = 8`: at 2:00 the model gives 1 m, low tide.","hints":["Find the axis, amplitude and period, then decide when the high tide is.","Axis (9 + 1) ÷ 2 = 5, amplitude 4, period 2 × 6 = 12 h, so `k = π/6`. High tide is at 8:00.","In the cosine form with `a > 0`, `d` is the time of a high: `w(t) = 4 cos[{π}/{6} (t - 8)] + 5`, model E8."]}],"right":[{"id":"E1","t":"E1. `h(t) = -8 cos({π}/{20} t) + 10`"},{"id":"E2","t":"E2. `h(t) = 8 cos({π}/{20} t) + 10`"},{"id":"E3","t":"E3. `h(t) = -4 cos({π}/{20} t) + 10`"},{"id":"E4","t":"E4. `h(t) = -8 cos({π}/{10} t) + 10`"},{"id":"E5","t":"E5. `h(t) = 8 sin({π}/{20} t) + 10`"},{"id":"E6","t":"E6. `h(t) = -8 cos({π}/{40} t) + 10`"},{"id":"E7","t":"E7. `w(t) = 4 cos[{π}/{6} (t - 2)] + 5`"},{"id":"E8","t":"E8. `w(t) = 4 cos[{π}/{6} (t - 8)] + 5`"}],"_a":"HxI1AhAJEnxVEkoRYQESA0Z1VBEeEWMKRgpEdgERHBs3BEQJEHYEG0gSNQYQCRJ8URJKEWEFEgNGdVARHhFjDkYKRHYFERwbNwhECRB2CBsZ","wrong":{"S1|E2":"Check the start. E2 gives 8 + 10 = 18 m at `t = 0`: the top. This rider boards at the bottom, 2 m.","S1|E3":"E3 has amplitude 4, but this situation’s is 8.","S1|E4":"E4 turns once every 2π ÷ (π/10) = 20 s. This wheel takes 40 s.","S1|E5":"Check the start. E5 gives 0 + 10 = 10 m at `t = 0`: level with the axle. This rider boards at the bottom, 2 m.","S1|E6":"E6 turns once every 2π ÷ (π/40) = 80 s. This wheel takes 40 s.","S1|E7":"E7 has amplitude 4, but this situation’s is 8.","S1|E8":"E8 has amplitude 4, but this situation’s is 8.","S2|E1":"Check the start. E1 gives −8 + 10 = 2 m at `t = 0`: the lowest seat. This rider starts at the top, 18 m.","S2|E3":"E3 has amplitude 4, but this situation’s is 8.","S2|E4":"E4 turns once every 2π ÷ (π/10) = 20 s. This
