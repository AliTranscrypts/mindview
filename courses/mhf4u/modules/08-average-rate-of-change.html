.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 08: hero equation, secant lab controls, Part 3 rounds, N29 sentence builder, sketch options, road-trip task */
.hero .hero-eq.sm{display:flex;flex-wrap:wrap;align-items:center;gap:.05em .3em;line-height:1.15}
.hero .hero-eq .ar-w{font:700 .52em var(--font-ui);color:var(--ink-2)}
.hero .hero-eq .ar-big{font-size:1.5em}
.hero .hero-eq .ar-big .frac{font-size:1em}
.hero .hero-eq .ar-eq{font-size:.9em;white-space:nowrap}
.hero-fig figcaption{font-size:1.2rem;line-height:1.45}

.sl-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 8px}
.sl-row .chips{margin:0}
.sl-lab{font-weight:700;font-size:.92rem}
.sl-what{display:block;font:400 .9rem/1.35 var(--font-ui);color:var(--ink-2);margin-top:4px}
.sl-how{margin:4px 0 0}
.stp-row{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0 2px}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp-l{font-size:1.2rem;min-width:1.5em;text-align:right}
.stp .btn{min-width:38px;min-height:36px;justify-content:center;padding:.2em .5em}
.stp-v{font:400 1rem var(--font-math);min-width:5.2em;text-align:center}
.read .rd-h{color:var(--ink);font-size:.95rem}
.sl-leg{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 0;font-weight:700;font-size:.95rem;max-width:none;min-height:1.5em}
.sl-leg > span{display:inline-flex;align-items:center;gap:8px}
.sl-sw{display:inline-block;width:30px;height:0;border-top:2.5px solid var(--ink-2)}
.sl-sw.dash{border-top-style:dashed}
.sl-sw.dot{border-top-style:dotted;border-top-width:3px}

.cx-ch{margin-bottom:16px}
.cx-prompt{font-weight:700}
.cx-plot{margin-top:12px}
.cx-h{margin:18px 0 8px}
.cx-grid > div > .cx-h:first-child{margin-top:0}
.cx-box{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:0 0 8px}
.cx-box label{flex:1 1 11rem;font-weight:600}
.cx-in{display:inline-flex;align-items:center;gap:6px}
.cx-in input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.4em .6em;font:400 1.15rem var(--font-math)}
.cx-in input:focus{border-color:var(--ink)}
.cx-in input.good{border-color:var(--green)}
.cx-in input.bad{border-color:var(--red)}
.cx-in .u{min-width:2.4em;color:var(--ink-2)}
.cx-units{margin:0}
.chip.good{box-shadow:0 0 0 2px var(--green)}
.chip.bad{box-shadow:0 0 0 2px var(--red)}
.fb ul{margin:6px 0 0;padding-left:1.2em}
.fb li{margin:0 0 .3em}

.sb-line{font-size:1.06rem;line-height:2.5;max-width:none;margin:0}
.sb-slot{display:inline-block;min-width:4.4em;min-height:34px;margin:0 .12em;padding:.05em .55em;border:0;border-bottom:2.5px solid var(--ink);background:var(--paper);border-radius:5px 5px 0 0;font:700 1rem/1.6 var(--font-ui);color:var(--ink);vertical-align:baseline}
.sb-slot.on{background:var(--hi);color:var(--hi-ink)}
.sb-slot.good{border-bottom-color:var(--green);background:var(--good-bg)}
.sb-slot.bad{border-bottom-color:var(--red);background:var(--bad-bg)}
.sb-slot:disabled{opacity:1}
.sb-bank{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed var(--ink-2);border-radius:8px;margin-top:8px}
.sb-bank-lab{font-weight:700;font-size:.9rem}
.sb-tip{margin:6px 0 0}

.opt svg.sk{display:block;margin:0 0 4px;color:var(--ink-2);max-width:100%;height:auto}
.cx-sk{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.vase-row{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);gap:12px;align-items:end}
.vase-row canvas.plot{max-width:100%}

.rt-plan{margin:6px 0 0;padding-left:1.3em}
.rt-plan li{margin:0 0 .2em}
.rt-in{gap:10px}
.rt-in input{width:4.7rem}
.rt-in input:disabled{opacity:.7}
.rt-lg{margin-top:10px}

ind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"d2bf9836","content":{"id":"08-average-rate-of-change","kind":"topic","title":"Average rate of change","topic":"Average Rate of Change","readyTopic":"average rates of change","hero":{"eq":"\u003cspan class=\"ar-w\">average rate =\u003c/span> \u003cspan class=\"ar-big\">`{Δy}/{Δx}`\u003c/span> \u003cspan class=\"ar-eq\">`= {f(b) - f(a)}/{b - a}`\u003c/span>","eqLabel":"average rate equals delta y over delta x, which equals f of b minus f of a, over b minus a","eqSize":"sm","headline":"How fast, on average?","text":"Between two moments, a quantity changes by `Δy` while the input changes by `Δx`. Their ratio `Δy/Δx` is the \u003cstrong>average rate of change\u003c/strong>: the slope of the \u003cstrong>secant\u003c/strong> line joining the two points. It always comes with units, such as metres per second or dollars per item.","fig":{"aria":"A ball’s height h of t equals negative 5 t squared plus 20 t plus 1, for t from 0 to 4 seconds, with a secant line from t = 0 to a second point that slides to t = 1, 2 and 4 seconds"}},"goals":["I can calculate an average rate of change from an equation, a table or a graph.","I can state an average rate with its units and explain what it means in context.","I can connect the average rate of change to the slope of a secant line.","I can recognize zero, constant and changing rates, and sketch a graph from a description of how something changes.","I can compare average rates over different intervals and for different kinds of functions."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Slope","goal":3,"prompt":"What is the slope of the line through (2, 5) and (6, 13)?","options":[{"t":"−2","why":"(13 − 5)/(2 − 6) mixes the order.","_n":"0db1","_k":"bb9a4e4c"},{"t":"1/2","why":"Slope is rise ÷ run: 8 ÷ 4.","_n":"1da1","_k":"4da1e99a"},{"t":"2","why":"(13 − 5)/(6 − 2) = 8/4 = 2.","_n":"2d91","_k":"228a4e4e"},{"t":"13/6","why":"Slope compares changes between two points.","_n":"3e01","_k":"0b50e86e"}],"hints":["Slope = change in `y` ÷ change in `x`.","`Δy` = 13 − 5, `Δx` = 6 − 2.","8/4 = 2."]},{"id":"w2","skill":"Slope","goal":3,"prompt":"A line falls 6 units as `x` increases by 3. What is its slope?","options":[{"t":"−18","why":"Slope divides the changes.","_n":"4df1","_k":"5276a79c"},{"t":"−2","why":"`Δy = -6`, `Δx = 3`: −6/3.","_n":"5de1","_k":"0c0ac03d"},{"t":"−1/2","why":"−6 ÷ 3, not 3 ÷ (−6).","_n":"6dd1","_k":"c0f112cc"},{"t":"2","why":"Falling means `Δy` is negative.","_n":"7e41","_k":"ba0cac06"}],"hints":["Is `Δy` positive or negative?","−6 over 3.","−2."]},{"id":"w3","skill":"Evaluating functions","goal":1,"prompt":"`f(x) = x^2 - 3x`. What is `f(5) - f(1)`?","options":[{"t":"4","why":"5 − 1 = 4 is `Δx`.","_n":"8e31","_k":"aa8c3a7e"},{"t":"8","why":"`f(1)` = 1 − 3 = −2.","_n":"9309","_k":"4f1c5346"},{"t":"10","why":"You need both values.","_n":"a319","_k":"a96d4fab"},{"t":"12","why":"`f(5) = 10`, `f(1) = -2`; 10 − (−2) = 12.","_n":"b2e9","_k":"4bb63364"}],"hints":["Find each value first.","`f(5)` = 25 − 15; `f(1)` = 1 − 3.","10 − (−2) = 12."]},{"id":"w4","skill":"Evaluating functions","goal":1,"prompt":"`N(t) = 200 · 2^t`. What is `N(3)`?","options":[{"t":"`400^3`","why":"Powers come before multiplication.","_n":"c2f9","_k":"cf7ff73d"},{"t":"800","why":"The exponent is 3.","_n":"d2c9","_k":"6a26e7d7"},{"t":"1200","why":"`2^3` means 2 × 2 × 2 = 8.","_n":"e2d9","_k":"3a772d51"},{"t":"1600","why":"`2^3 = 8`, and 200 × 8 = 1600.","_n":"f2a9","_k":"f1b16bc4"}],"hints":["Work out `2^3` first.","`2^3 = 8`.","200 × 8 = 1600."]},{"id":"w5","skill":"Units","goal":2,"prompt":"A pump moves 120 L in 8 minutes. What is its average rate?","options":[{"t":"960 L/min","why":"Rate divides.","_n":"g2b9","_k":"e9d51dd5"},{"t":"15 L/min","why":"120 L ÷ 8 min.","_n":"h389","_k":"476e83f0"},{"t":"15 min/L","why":"Litres ÷ minutes gives L/min.","_n":"i399","_k":"9bbbca9b"},{"t":"0.067 L/min","why":"8 ÷ 120 is minutes per litre.","_n":"j2a8","_k":"5ab4b270"}],"hints":["Rate = amount ÷ time.","120 ÷ 8.","15 L/min."]},{"id":"w6","skill":"Reading graphs","goal":4,"prompt":"A distance–time graph is a horizontal segment from `t` = 2 h to `t` = 3 h. What was happening?","options":[{"t":"Moving very fast","why":"Height is distance, not speed.","_n":"k298","_k":"29416e4d"},{"t":"The traveller was stopped","why":"Distance didn’t change: speed 0.","_n":"l288","_k":"ba8c5bfc"},{"t":"Moving backward","why":"Backward would slope down.","_n":"m278","_k":"fbb76d15"},{"t":"Moving at a steady speed","why":"Steady speed is a straight line that slopes up.","_n":"n2e8","_k":"6a147330"}],"hints":["What does the slope of a distance–time graph mean?","Slope = speed.","Flat: slope 0, stopped."]}],"refreshers":{"Slope":"Slope = `Δy/Δx = (y_2 - y_1)/(x_2 - x_1)`, same order on top and bottom. Falling lines have negative slopes.","Evaluating functions":"Substitute in brackets and do powers first: `f(1)` for `x^2 - 3x` is 1 − 3 = −2.","Units":"A rate’s units are (units of the top) per (units of the bottom): L ÷ min = L/min.","Reading graphs":"On a distance–time graph, steepness is speed. Flat means stopped; steeper means faster."}}},"explore":{"heading":"Secant lab","intro":"Pick a situation, then drag the two points along the curve. The rise-and-run triangle and the secant line show the average rate of change, with its units.","predIntro":"Make a prediction first. Then the secant lab will show you what really happens.","predictions":[{"id":"p1","start":{"sit":"ball","P":0,"Q":1},"run":{"to":{"Q":4}},"prompt":"Ball, with `P` at 0. `Q` will move to `t` = 4 s. What is the average rate over `[0, 4]`?","options":[{"t":"It can’t be found","_n":"o2d8","_k":"5e675ecc"},{"t":"0 m/s","_n":"p2c8","_k":"f8ac5a9b"},{"t":"5 m/s","_n":"q2b8","_k":"57f13d04"},{"t":"21 m/s","_n":"r328","_k":"9150ad7c"}],"explain":"`h(4) = h(0) = 1`: no net change. The ball went up 20 m and came down 20 m."},{"id":"p2","start":{"sit":"bact","P":0,"Q":1},"run":{"from":{"P2":0,"Q2":1},"to":{"P2":4,"Q2":5}},"prompt":"Bacteria. Compare the average rate over `[0, 1]` with the rate over `[4, 5]`. How many times bigger is the second?","options":[{"t":"5 times","_n":"s318","_k":"84ae7eee"},{"t":"The same","_n":"t248","_k":"4de14c2b"},{"t":"2 times","_n":"u258","_k":"5ba524bf"},{"t":"16 times","_n":"v268","_k":"81c7ee98"}],"explain":"Each hour the count doubles, so the hourly change doubles too: 200, 400, 800, 1600, 3200. Over 4 doublings: `2^4 = 16`."},{"id":"p3","start":{"sit":"taxi","P":0,"Q":1},"run":{"from":{"P2":0,"Q2":1},"to":{"P2":3,"Q2":8},"extra":[9,10]},"prompt":"Taxi. Which interval gives the biggest average rate: `[0, 1]`, `[3, 8]` or `[9, 10]` km?","options":[{"t":"`[3, 8]`","_n":"w278","_k":"826a7e47"},{"t":"`[0, 1]`","_n":"x288","_k":"1fbcb3eb"},{"t":"They’re all the same","_n":"y298","_k":"b5452ca4"},{"t":"`[9, 10]`","_n":"z2a8","_k":"0a387de0"}],"explain":"A linear function’s secant is the line itself: 2 $/km on every interval."},{"id":"p4","start":{"sit":"wheel","P":0,"Q":4},"run":{"from":{"P2":0,"Q2":4},"to":{"P2":2,"Q2":6}},"prompt":"Ferris wheel. Which is bigger: the average rate over `[0, 4]` or over `[2, 6]`?","options":[{"t":"`[2, 6]`","_n":"102b8","_k":"b5f3efac"},{"t":"`[0, 4]`","_n":"112c8","_k":"76a12583"},{"t":"You can’t compare them","_n":"122d8","_k":"84c91900"},{"t":"They’re equal","_n":"132e9","_k":"da4232ef"}],"explain":"`[0, 4]`: (21 − 1)/4 = 5 m/s; `[2, 6]`: (11 − 11)/4 = 0. `[2, 6]` contains the top of the wheel, but it starts and ends at 11 m, so its secant is flat. Height isn’t rate."}],"chalIntro":"Use the secant lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. The check looks at the main pair, `P` and `Q`. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,5],"prompt":"Ball: place `P` and `Q` so the average rate is 10 m/s.","why":"`[0, 2]`: 20 ÷ 2 = 10. It’s the only interval on the 1-s grid with rate 10 m/s.","hints":["You need `Δh ÷ Δt = 10`.","From `t = 0` the heights are 1, 16, 21.","`[0, 2]`: 20 ÷ 2 = 10."]},{"id":"tc2","goal":[1,5],"prompt":"Bacteria: find an interval whose average rate is exactly 1200 bacteria per hour.","why":"3200 − 800 = 2400 on `[2, 4]`, and 2400 ÷ 2 = 1200. No other interval on the 1-h grid gives 1200.","hints":["Try intervals 2 h long: what change would give 1200 per hour?","A change of 2400 over 2 h.","3200 − 800 = 2400 on `[2, 4]`."]},{"id":"tc3","goal":[1,5],"stretch":true,"prompt":"Ferris wheel: find an interval 4 s long with average rate 0 that does \u003cstrong>not\u003c/strong> contain the top of the wheel.","why":"The bottom is at `t` = 8: `[6, 10]` starts and ends at 11 m. It’s the only such interval on the grid from 0 to 16.","hints":["Zero average rate means equal heights at the two ends.","The wheel is symmetric about its lowest points too.","The bottom is at `t` = 8: `[6, 10]` starts and ends at 11 m."]}]},"part3":{"slug":"context","name":"Context","heading":"Rates in context","intro":"Real rates come from tables and words, with units to manage and meaning to state. In the first two rounds, work out `Δy`, `Δx` and the rate, choose its units, then build the sentence that says what it means. The last round goes the other way: from words to a sketch.","rounds":[{"id":"c1","name":"C1 Tank","kind":"rate","prompt":"The table shows the volume of water in a tank. What is the average rate of change of the volume from 0 to 10 min?","table":{"head":["`t` (min)","0","5","10","15"],"rows":[["`V` (L)","600","450","350","300"]],"caption":"Volume of water in the tank"},"pts":[[0,600],[5,450],[10,350],[15,300]],"iv":[0,10],"view":{"xmin":-3,"xmax":16.5,"ymin":-60,"ymax":690},"xLabel":"t (min)","yLabel":"V (L)","boxes":[{"k":"dy","label":"Change in volume, `ΔV`","unit":"L"},{"k":"dx","label":"Change in t  graph can rise and fall inside the interval and still have average rate 0.","n":"A graph can rise and fall inside the interval and still have average rate 0."},"hints":["Read `h` at `t = 0` and at `t = 4`.","`h` = 5 at both ends.","No net change: Zero."]},{"id":"i5","t":"“A ball is thrown up and caught at the same height.”","_a":"RkhA","why":"Same height at the start and end.","wrong":{"p":"A graph can rise and fall inside the interval and still have average rate 0.","n":"A graph can rise and fall inside the interval and still have average rate 0."},"hints":["Compare the height at the start with the height at the end.","It’s caught at the same height it was thrown from.","No net change: Zero."]},{"id":"i6","t":"`y = 2^x` on `[-3, -1]`","_a":"RkJA","why":"1/2 − 1/8 > 0.","hints":["Find `2^{-3}` and `2^{-1}`.","1/8 and 1/2.","It increased: Positive."]},{"id":"i7","t":"`y = (x - 1)(x - 5)` on `[1, 3]`","_a":"RlxA","why":"From 0 to −4: (−4 − 0)/2 = −2.","hints":["Find `f(1)` and `f(3)`.","`f(1) = 0` and `f(3) = (2)(-2) = -4`.","It decreased: (−4 − 0)/2 = −2. Negative."]},{"id":"i8","t":"“12 °C at 6 a.m., 9 °C at 9 a.m.”","_a":"RlxA","why":"It cooled 1 °C per hour.","hints":["Compare the first temperature with the last.","12 °C down to 9 °C over 3 hours.","It cooled 3 °C in 3 hours: Negative."]},{"id":"i9","t":"`y = x^3 - 4x` on `[-2, 2]`","_a":"RkhA","why":"`f(-2) = f(2) = 0`.","wrong":{"p":"A graph can rise and fall inside the interval and still have average rate 0.","n":"A graph can rise and fall inside the interval and still have average rate 0."},"hints":["Find `f(-2)` and `f(2)`.","`f(-2) = -8 + 8 = 0`; `f(2) = 8 - 8 = 0`.","No net change: Zero."]},{"id":"i10","t":"`y = -x^2 + 6x` on `[1, 4]`","_a":"RkJA","why":"`f(1) = 5`, `f(4) = 8`: (8 − 5)/3 = 1.","hints":["Find `f(1)` and `f(4)`.","`f(1) = -1 + 6 = 5`; `f(4) = -16 + 24 = 8`.","It increased: (8 − 5)/3 = 1. Positive."]}]},{"id":"back","type":"numeric","title":"Work it backwards","summary":"Work it backwards","star":true,"goal":[1,2,5],"instruction":"Find each value. In the starred questions the unknown is inside the rate, so work backwards from it.","items":[{"id":"r1","goal":1,"prompt":"Average rate of `f(x) = x^2 - 3x` from `x = 1` to `x = 5`.","_a":"Vw==","display":"3","why":"`f(5) - f(1)` = 10 − (−2) = 12, and 12 ÷ 4 = 3.","wrong":[{"match":12,"fb":"That’s `Δy`. Divide by `Δx = 4`."}],"hints":["Find `f(1)` and `f(5)` first.","`f(5) = 25 - 15 = 10` and `f(1) = 1 - 3 = -2`, so `Δy = 12` and `Δx = 4`.","12 ÷ 4 = 3."]},{"id":"r2","goal":1,"prompt":"Average rate of `f(x) = 3^x` from `x = 0` to `x = 2`.","_a":"UA==","display":"4","why":"(9 − 1) ÷ 2 = 4.","wrong":[{"match":8,"fb":"Divide by 2."},{"match":4.5,"fb":"That’s `f(2)/2`."}],"hints":["Find `f(0)` and `f(2)`.","`3^0 = 1` and `3^2 = 9`: `Δy = 8`, `Δx = 2`.","8 ÷ 2 = 4."]},{"id":"r3","goal":1,"star":true,"prompt":"`f(x) = x^2 + bx` has average rate 7 from `x = 1` to `x = 3`. Find `b`.","_a":"Vw==","display":"`b = 3`","why":"(9 + 3`b` − 1 − `b`)/2 = 4 + `b` = 7.","wrong":[{"match":7,"fb":"That’s the rate, not `b`. (9 + 3`b` − 1 − `b`)/2 = 4 + `b`."}],"hints":["Write the rate with `b` in it.","`f(3) = 9 + 3b` and `f(1) = 1 + b`, so the rate is (9 + 3`b` − 1 − `b`)/2 = 4 + `b`.","4 + `b` = 7, so `b` = 3."]},{"id":"r4","goal":[1,2],"star":true,"prompt":"The average rate of `f` from 0 to 4 is 5, and `f(0) = 2`. Find `f(4)`.","_a":"VgA=","display":"`f(4) = 22`","why":"The change is 5 × 4 = 20, so `f(4)` = 2 + 20.","wrong":[{"match":20,"fb":"That’s the change. Add it to `f(0)`."},{"match":7,"fb":"That adds the rate once."}],"hints":["Rate × run = change.","The change is 5 × 4 = 20.","`f(4) = f(0) + 20` = 2 + 20 = 22."]},{"id":"r5","goal":[2,5],"star":true,"prompt":"A car averages 60 km/h for 2 h, then 90 km/h for 1 h. What is its average speed for the whole 3 h?","_a":"UwI=","display":"70 km/h","unit":"km/h","why":"Total distance 120 km + 90 km = 210 km, in 3 h.","wrong":[{"match":75,"fb":"That averages the two speeds, but the car spent twice as long at 60. Total distance 210 km ÷ 3 h."}],"hints":["Average speed = total distance ÷ total time.","120 km + 90 km in 3 h.","210 ÷ 3 = 70 km/h."]},{"id":"r6","goal":[1,5],"star":true,"prompt":"For `f(x) = x^2`, find `a` so that the average rate from `a` to `a + 2` is 10.","_a":"UA==","display":"`a = 4`","why":"`((a + 2)^2 - a^2)/2 = 2a + 2`, and 2(4) + 2 = 10.","wrong":[{"match":5,"fb":"`((a + 2)^2 - a^2)/2 = 2a + 2`, so `2a + 2 = 10`."}],"hints":["Write the rate in terms of `a`.","`((a + 2)^2 - a^2)/2 = (4a + 4)/2`.","`2a + 2 = 10`, so `a = 4`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ethan","how":"","goal":[1,2,5],"instruction":"Ethan made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Average rate of `h(t) = -5t^2 + 25t` (m) from `t` = 1 to `t` = 3 s.","steps":["`h(1) = 20`.","`h(3) = 30`.","Rate = (30 − 20)/(1 − 3) = −5 m/s.","So the height fell 5 m per second."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 uses step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"The top subtracts later minus earlier; the bottom must too.","_n":"2zcd9","_k":"6e727af5"},{"t":"(30 − 20)/(3 − 1) = 5 m/s: it rose 5 m per second on average.","why":"Subtract in the same order: `(y_2 - y_1)/(x_2 - x_1)`.","_n":"30ce9","_k":"a1013b06"},{"t":"30/3 = 10 m/s.","why":"A rate compares two \u003cstrong>changes\u003c/strong>. `h(3) = 30` is a height; the rate needs `h(3) - h(1)`.","_n":"31cb9","_k":"1314d07b"},{"t":"(1 − 3)/(30 − 20) = −0.2.","why":"Rate of `y` per unit of `x`: change in `y` on top, change in `x` underneath.","_n":"32ca9","_k":"9048ed9f"}],"hints":["Check the order of subtraction.","Top: 30 − 20 (later − earlier). Bottom?","3 − 1 = 2: 5 m/s."]},{"id":"e2","goal":2,"task":"A car’s tank has 40 L at 0 km and 28 L at 150 km. Find and interpret the average rate.","steps":["`ΔF` = 28 − 40 = −12 L.","`Δd` = 150 km.","Rate = −12 ÷ 150 = −0.08.","Units: km/L.","So the car uses 0.08 km per litre."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.","","Step 5 uses step 4. The mistake is earlier."],"fixes":[{"t":"Units L: it used 0.08 L.","why":"The rate compares two changes.","_n":"33cd9","_k":"e13e11a3"},{"t":"Step 4 is correct.","why":"L ÷ km = L/km.","_n":"34cc9","_k":"bae585a7"},{"t":"Units km: it drove 0.08 km.","why":"The rate compares two changes: litres per kilometre.","_n":"35c79","_k":"d6928d26"},{"t":"Units L/km: the car uses 0.08 L each kilometre, on average.","why":"The units follow the division: litres ÷ kilometres = L/km.","_n":"36c69","_k":"de8b543f"}],"hints":["What did you divide by what?","Litres ÷ kilometres.","L/km."]},{"id":"e3","goal":5,"task":"A runner averages 12 km/h for 1 h, then 6 km/h for 2 h. Average speed overall?","steps":["First part: 12 km/h.","Second part: 6 km/h.","Average speed = (12 + 6)/2 = 9 km/h."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.",""],"fixes":[{"t":"12 × 6 ÷ 18 = 4 km/h.","why":"Average speed = total distance ÷ total time: 24 km in 3 h.","_n":"37c99","_k":"e134b87e"},{"t":"Step 3 is correct.","why":"Averaging speeds only works for equal times; the runner spent 2 h at 6 km/h.","_n":"38c89","_k":"794fc9e8"},{"t":"(12 + 6)/3 = 6 km/h.","why":"That divides the sum of two speeds by the time.","_n":"39d39","_k":"3f68285b"},{"t":"Total distance 12 + 12 = 24 km in 3 h: 8 km/h.","why":"The average rate over a whole trip is total change ÷ total time, not the mean of the separate rates (unless the times are equal).","_n":"3ad29","_k":"f994b6f9"}],"hints":["Average speed = total distance ÷ total time.","12 km in the first hour, 12 km in the next two.","24 ÷ 3 = 8."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the secant lab: the ball’s 0 m/s, or the bacteria’s 16 times?"},{ 00 · 2^t`. Which interval has the greatest average rate of change?","options":[{"t":"`[0, 3]`","why":"It has the largest total change (700), but over 3 hours.","_n":"43558","_k":"afce5816"},{"t":"`[2, 3]`","why":"(800 − 400)/1 = 400 per hour. The others: `[0, 3]`: 700/3 ≈ 233; `[0, 2]`: 150; `[1, 2]`: 200.","_n":"44568","_k":"52a036ed"},{"t":"`[0, 2]`","why":"300 over 2 hours: 150 per hour.","_n":"45538","_k":"872f0c8a"},{"t":"`[1, 2]`","why":"200 per hour; growth is faster later.","_n":"46528","_k":"ee68dcb0"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A car pulls away from a stop sign, speeds up, then drives at a steady speed. Which distance–time graph fits?","options":[{"t":"\u003csvg class=\"sk\" width=\"124\" height=\"62\" viewBox=\"0 0 124 62\" aria-hidden=\"true\">\u003cpath d=\"M12 4V54H118\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003ctext x=\"116\" y=\"50\" font-size=\"11\" font-style=\"italic\" text-anchor=\"end\" fill=\"currentColor\">t\u003c/text>\u003ctext x=\"16\" y=\"12\" font-size=\"11\" font-style=\"italic\" fill=\"currentColor\">d\u003c/text>\u003cpath d=\"M14.0 50.0L19.9 49.5L25.8 48.0L31.6 45.6L37.5 42.1L43.4 37.7L49.3 32.3L55.1 26.0L61.0 18.6L66.9 12.0L72.8 12.0L78.6 12.0L84.5 12.0L90.4 12.0L96.3 12.0L102.1 12.0L108.0 12.0\" fill=\"none\" stroke=\"var(--pen)\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003cspan>Curving upward, then flat\u003c/span>","why":"Flat means stopped, not steady speed.","_n":"47558","_k":"ee28bac2"},{"t":"\u003csvg class=\"sk\" width=\"124\" height=\"62\" viewBox=\"0 0 124 62\" aria-hidden=\"true\">\u003cpath d=\"M12 4V54H118\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003ctext x=\"116\" y=\"50\" font-size=\"11\" font-style=\"italic\" text-anchor=\"end\" fill=\"currentColor\">t\u003c/text>\u003ctext x=\"16\" y=\"12\" font-size=\"11\" font-style=\"italic\" fill=\"currentColor\">d\u003c/text>\u003cpath d=\"M14.0 50.0L19.9 49.8L25.8 4 nges: `200 · 2^t` changes by 200, 400, 800, … per hour."],["Steeper vs higher","Rate is steepness between two points, not how high the graph is."],["Converting time","45 min = 0.75 h. Convert before giving a per-hour rate."],["Concave down rising graph","Rising, but more and more slowly: average rates on later intervals are smaller."],["Predicting with an average rate","New value = known value + rate × (change in input)."]]}};</script>
