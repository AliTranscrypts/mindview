.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 29: hero proof, proof workbench (board, graph twin, proof map, move menu), counterexample hunter, ordering with a tray, identity boxes, task */
.tiny.b{font-weight:700}
/* hero */
.hero .hero-eq.md{font-size:clamp(2rem,5.4vw,3.4rem);transition:opacity .3s}
.hero-eq.fade{opacity:0}
.he-part{white-space:nowrap;display:inline-block}
.he-hl{border-radius:3px;transition:background .3s}
.he-hl.on{background:linear-gradient(transparent 60%,var(--hi) 60%)}
.h29-row{margin-top:8px}
.h29-proof{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 8px;font-size:.95rem;min-height:5.2em}
.h29-col{min-width:0}
.h29-l{margin:0 0 4px;opacity:0;transition:opacity .4s;overflow-x:auto;overflow-y:hidden;max-width:none;font-size:.95rem}
.h29-l.on{opacity:1}
.h29-l.glow .m{background:linear-gradient(transparent 74%,var(--hi) 74%)}
.h29-mid{display:flex;align-items:center}
.h29-chip{opacity:0;border:1.5px solid var(--green);background:var(--good-bg);color:var(--green);border-radius:999px;padding:.1em .6em;font-weight:700;font-size:.85rem;white-space:nowrap;transition:opacity .4s}
.h29-chip.on{opacity:1}
#h29-player .player{margin-top:6px}
.hero-fig figcaption{font-size:1.15rem}
@media (max-width:560px){ .h29-proof{font-size:.88rem} }

/* workbench */
.wb-top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.wb-top .seg-wrap{margin-top:0}
.wb-sel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0;max-width:100%}
.wb-sel select{font:inherit;font-size:.95rem;padding:.35em .5em;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%;min-height:38px}
.wb-shelf{margin:8px 0 0;color:var(--ink-2)}
.wb-star{white-space:nowrap;margin-left:6px}
.wb-star.on{color:var(--green);font-weight:700}
.wb-banner{margin-top:8px}
.wb-banner .m{white-space:normal}
.wb-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"left right" "moves read";gap:16px 26px;align-items:start;margin-top:6px}
.wb-left{grid-area:left;min-width:0}.wb-right{grid-area:right;min-width:0}.wb-moves{grid-area:moves;min-width:0}.wb-read{grid-area:read;min-width:0}
.wb-claim{display:none}
.wb[data-mode="test"] .wb-claim{display:block}
.wb[data-mode="test"] .wb-board,.wb[data-mode="test"] .wb-map,.wb[data-mode="test"] .wb-rseg,.wb[data-mode="test"] .wb-pvseg,.wb[data-mode="test"] .wb-moves{display:none!important}
.wb[data-mode="test"] .wb-graph{display:block!important}
.wb-card{border:1.5px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--sheet)}
.wb-claim-t{font:400 clamp(1.4rem,3.4vw,1.9rem)/1.4 var(--font-math);margin:0;overflow-x:auto}
.wb-note{font-size:.95rem;border-left:3px solid var(--ink-2);padding-left:10px;margin:10px 0 0;max-width:none}
.wb-note .m{white-space:normal}
/* board */
.wb-goal{font-weight:700;margin:0 0 4px;overflow-x:auto}
.wb-board .seg-wrap{margin-top:4px}
.wb-cols{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 10px;margin-top:12px;align-items:start}
.wb-col{min-width:0;border-top:4px solid var(--rule);padding-top:6px}
.wb-col.on{border-top-color:var(--hi)}
.wb-col h4{margin:0 0 6px;font-size:.95rem}
.wb-eq{align-self:start;margin-top:4px;font:400 1.6rem var(--font-math);color:var(--ink-2);text-align:center;min-width:1.2em}
.wb-eq.flash{color:var(--red);animation:wbFlash .45s ease-out}
@keyframes wbFlash{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.wb-lsrs{display:inline-block;font:700 .8rem var(--font-ui);color:var(--green);border:1.5px solid var(--green);background:var(--good-bg);border-radius:999px;padding:.15em .55em;white-space:nowrap}
.wb-lines{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.wb-line{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:4px 6px;border-radius:6px;min-width:0}
.wb-line .wb-ex{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;font-size:1.05rem;padding:2px 0}
.wb-line .wb-ex .m{font-size:1em}
.wb-line.cur .wb-ex{font-weight:700}
.wb-line.hl{background:var(--hi-soft)}
.wb-line.new{animation:wbIn .5s ease-out}
@keyframes wbIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.wb-line.meet .wb-ex .m{background:linear-gradient(transparent 78%,var(--hi) 78%)}
.wb-line.trap{background:var(--bad-bg);box-shadow:inset 3px 0 0 var(--red)}
.wb-line.strike{opacity:.55;transition:opacity .4s}
.wb-line.strike .wb-ex{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.wb-tag{font-size:.75rem;font-weight:700;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:.05em .5em;white-space:nowrap;background:var(--paper)}
.wb-tag .m{font-size:1em}
.wb-tag.bad{color:var(--red);border-color:var(--red);background:var(--sheet)}
/* graph twin */
.wb-graph canvas.plot{cursor:crosshair}
.wb-chip{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--good-bg);color:var(--green);border:1.5px solid var(--green);border-radius:999px;padding:.15em .7em;font-weight:700;font-size:.85rem;pointer-events:none;white-space:nowrap}
.wb-pr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.wb-pr input[type=range]{flex:1 1 140px;min-width:120px;accent-color:var(--ink)}
.btn.pr-btn{min-width:40px;min-height:40px;font-size:1.25rem;line-height:1;padding:0 .5em}
.pr-x{font-size:1.1rem;min-width:4.6em}
.hu-fine.on,#hu-diff.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
/* proof map */
.pm-scroll{overflow-x:auto;padding-bottom:4px}
.pm-cols{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:8px 14px;min-width:290px}
.pm-col{display:flex;flex-direction:column;align-items:center;min-width:0}
.pm-h{font-size:.8rem;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.pm-node{border:1.5px solid var(--rule);background:var(--sheet);border-radius:12px;padding:5px 9px;text-align:center;font-size:.9rem;min-width:120px;max-width:100%;overflow-x:auto}
.pm-node .m{font-size:1em}
.pm-node.start{border-color:var(--ink-2)}
.pm-node.route{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.pm-node.grow{animation:pmGrow .4s ease-out}
@keyframes pmGrow{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pm-node.trap{border:1.5px dashed var(--red);color:var(--red);background:var(--bad-bg)}
.pm-node.fade{opacity:0;transition:opacity .6s}
.pm-arr{display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--ink-2);text-align:center;padding:2px 0}
.pm-arr::before{content:"";width:2px;height:12px;background:var(--ink-2)}
.pm-arr::after{content:"▼";font-size:.6rem;line-height:1;color:var(--ink-2)}
.pm-arr span{padding:1px 4px}
.pm-arr .m{font-size:1em}
.pm-arr.trap::before{background:none;border-left:2px dashed var(--red)}
.pm-arr.trap,.pm-arr.trap::after{color:var(--red)}
.pm-meet{margin:10px auto 0;max-width:280px;border:2.5px solid var(--green);background:var(--good-bg);border-radius:14px;padding:6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pm-meet.grow{animation:pmGrow .6s ease-out}
.pm-mh{font-size:.78rem;font-weight:700;color:var(--green)}
.pm-route{margin:10px 0 4px;font-weight:700}
/* moves */
.wb-coach{border-left:4px solid var(--hi);background:var(--hi-soft);padding:8px 12px;border-radius:4px;margin:0 0 10px}
.wb-coach .m{white-space:normal}
.wb-tabs{display:none}
.mv-group{margin-bottom:12px}
.mv-group h4{margin:0 0 4px;font-size:.95rem}
.mv-key{margin:0 0 6px}
.mv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.mvb{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .6em;text-align:left;min-height:44px;min-width:0}
.mvb:not(:disabled):hover{border-color:var(--pen)}
.mvb:disabled{opacity:.55}
.mvn{font-weight:700;font-size:.88rem}
.mve{font-size:.82rem;color:var(--ink-2);max-width:100%;overflow:hidden}
.mve .m{white-space:normal;font-size:1em}
.mvb.coach{border-color:var(--ink);box-shadow:0 0 0 3px var(--hi)}
.mvb.eqm{border-style:dashed}
.wb-pop{margin-top:10px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet)}
.wb-pop .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.wb-ok{color:var(--green);font-weight:700}
.wb-read .read dd .m{white-space:normal}
@media (min-width:821px){
  .wb[data-mode="test"] .wb-grid{grid-template-areas:"left right" "read right"}
  .wb-pvseg{display:none}
  .wb[data-panel="graph"] .wb-map{display:none}
  .wb[data-panel="map"] .wb-graph{display:none}
}
@media (max-width:820px){
  .wb-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"left" "right" "moves" "read"}
  .wb-rseg{display:none}
  .wb[data-mode="prove"] .wb-board,.wb[data-mode="prove"] .wb-graph,.wb[data-mode="prove"] .wb-map{display:none}
  .wb[data-mode="prove"][data-pv="board"] .wb-board,.wb[data-mode="prove"][data-pv="graph"] .wb-graph,.wb[data-mode="prove"][data-pv="map"] .wb-map{display:block}
  .wb-cols{grid-template-columns:minmax(0,1fr)}
  .wb-eq{text-align:left;margin:0}
  .wb-goal{position:sticky;top:calc(var(--mv-top, 0px) + 96px);background:var(--sheet);z-index:1;padding:4px 0}
  .wb-tabs{display:block;margin-bottom:8px}
  .wb[data-tab="id"] .mv-group:not([data-g="id"]),.wb[data-tab="alg"] .mv-group:not([data-g="alg"]),.wb[data-tab="eq"] .mv-group:not([data-g="eq"]){display:none}
  .mv-group h4{display:none}
  .mvb{min-height:44px}
  .wb-line .wb-ex{font-size:max(.95rem,1em)}
}
/* hunter */
.hu-claim{margin:4px 0 12px}
.hu-ct{font:400 clamp(1.35rem,3.4vw,1.8rem)/1.4 var(--font-math);margin:0;overflow-x:auto}
.hu-q{font-weight:700;margin:14px 0 6px}
.hu-q .m{white-space:normal}
.hu-v{display:flex;flex-wrap:wrap;gap:6px}
#hu-alg[hidden]{display:none}
#hu-alg-t{margin:10px 0 0;max-width:none}
#hu-alg-t .m{white-space:normal}
/* ordering with a tray */
.po-fixed{display:flex;align-items:baseline;padding:.5em .75em;border:2px dashed var(--rule);border-radius:6px;background:var(--paper);min-width:0}
.po-in{min-width:0;overflow-wrap:anywhere}
.po-in .m{white-space:normal}
.ostep .wb-tag{margin-left:auto;align-self:center}
.po-tray{margin-top:12px;border:2px dashed var(--ink-2);border-radius:8px;padding:8px 10px}
.po-tray.bad{border-color:var(--red);background:var(--bad-bg)}
.po-tray > p{margin:0 0 6px}
.po-empty{margin:0}
.po-trow{display:flex;gap:8px;align-items:stretch}
/* identity boxes */
.mk-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.mk-st{font:400 clamp(1.25rem,3vw,1.6rem)/1.8 var(--font-math);margin:4px 0 8px;max-width:none}
.mk-st .m{white-space:normal;font-size:1em}
.mk-box{width:3.3rem;font:400 1.1rem var(--font-math);text-align:center;border:1.5px solid var(--ink-2);border-radius:6px;padding:.1em .2em;background:var(--sheet);color:var(--ink);min-height:34px;vertical-align:middle;margin:0 .12em;-moz-appearance:textfield;appearance:textfield}
.mk-box::-webkit-outer-spin-button,.mk-box::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mk-box:focus{border-color:var(--pen);outline:2px solid var(--pen);outline-offset:1px}
.mk-sup{vertical-align:.9em;font-size:1rem}
.mk-sup .mk-box{width:2.6rem;font-size:.9rem;min-height:30px}
.mk-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.3}
.mk-fn{border-bottom:1.5px solid currentColor;padding:0 .2em 4px}
.mk-fd{padding:4px .2em 0}
.mk-pv[hidden]{display:none}
@media (max-width:820px){ .mk-wrap{grid-template-columns:minmax(0,1fr)} }
/* task */
.fw-in{display:flex;flex-wrap:wrap;gap:10px 22px;margin:10px 0}
.fw-row{display:flex;align-items:center;gap:6px}
.fw-name{font:400 1.4rem var(--font-math);min-width:2.4em}
.fw-box{width:4rem;font:400 1.2rem var(--font-math);text-align:center;border:1.5px solid var(--ink-2);border-radius:6px;padding:.2em;background:var(--sheet);color:var(--ink);min-height:40px}
.fw-cap{font:400 clamp(1.15rem,3vw,1.55rem)/1.4 var(--font-math);min-height:1.5em;margin:4px 0 10px;overflow-x:auto}

:"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"539d5ed7","content":{"id":"29-proving-trig-identities","kind":"topic","title":"Proving trig identities","topic":"Proving Trig Identities","readyTopic":"proving trig identities","hero":{"eq":"\u003cspan class=\"he-part\">`sec^2x` \u003cspan class=\"he-hl\" id=\"he-plus\">+\u003c/span> `csc^2x`\u003c/span> \u003cspan class=\"he-part\">= \u003cspan class=\"he-hl\" id=\"he-prod\">`sec^2x csc^2x`\u003c/span>\u003c/span>","eqLabel":"secant squared x plus cosecant squared x equals secant squared x times cosecant squared x","eqSize":"md","contrastEq":"\u003cspan class=\"he-part\">`sec x + csc x`\u003c/span> \u003cspan class=\"he-part\">= `sec x csc x` ?\u003c/span>","headline":"A sum that equals a product, for every `x`","text":"An \u003cstrong>identity\u003c/strong> is an equation that is true for every value of `x` where both sides are defined, like `sin^2x + cos^2x = 1`. A statement that isn’t an identity can be knocked down by a single \u003cstrong>counterexample\u003c/strong>. To \u003cstrong>prove\u003c/strong> an identity, you rewrite the \u003cstrong>left side (LS)\u003c/strong> and the \u003cstrong>right side (RS)\u003c/strong> separately, using identities you already know, until both sides are the same expression.","fig":{"html":"\u003cdiv class=\"h29\">\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"Graphs of y = sec squared x + csc squared x and y = sec squared x csc squared x for x from 0 to 2π: one curve in four U-shaped pieces, lowest point y = 4, with asymptotes at π/2, π and 3π/2\">\u003c/canvas>\u003cdiv class=\"h29-row\">\u003cdiv class=\"h29-proof\" id=\"h29-proof\">\u003c/div>\u003c/div>\u003cdiv id=\"h29-player\">\u003c/div>\u003c/div>"},"caps":{"same":"Different on paper. The same graph.","one":"One counterexample is enough to sink a claim.","id":"✓ identity"},"proof":{"ls":["{1}/{cos^2x} + {1}/{sin^2x}","{sin^2x + cos^2x}/{sin^2x cos^2x}","{1}/{sin^2x cos^2x}"],"rs":["{1}/{cos^2x} · {1}/{sin^2x}","{1}/{sin^2x cos^2x}"]}},"goals":["I can explain the difference between an identity and an equation, and use a counterexample to show that a statement is not an identity.","I can use the reciprocal, quotient and Pythagorean identities, including `1 + tan^2x = sec^2x` and `1 + cot^2x = csc^2x`, to rewrite trig expressions.","I can write a proof in left side / right side form, working on one side at a time and never doing the same thing to both sides.","I can choose a strategy for a proof: rewrite in sine and cosine, combine or split fractions, expand or factor, or multiply by a conjugate.","I can use the compound-angle and double-angle formulas in proofs, choosing the form of `cos 2x` that fits.","I can say where the sides of an identity are undefined, and explain why those values of `x` are not counterexamples."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Algebra of fractions","goal":4,"prompt":"Write `1/a + 1/b` as a single fraction (`a, b ≠ 0`).","options":[{"t":"`{1}/{a + b}`","why":"Try `a = b = 1`: the sum is 2, but `{1}/{1 + 1} = 1/2`.","_n":"01fe","_k":"c08940eb"},{"t":"`{2}/{ab}`","why":"Over the denominator `ab`, `1/a` becomes `{b}/{ab}`, not `{1}/{ab}`. Try `a = 1`, `b = 2`: the sum is `3/2`, not `2/2 = 1`.","_n":"11ee","_k":"2db01c21"},{"t":"`{2}/{a + b}`","why":"Fractions don’t add top-to-top and bottom-to-bottom. Try `a = b = 1`: `1/1 + 1/1 = 2`, but `{2}/{1 + 1} = 1`.","_n":"21de","_k":"3e175c07"},{"t":"`{a + b}/{ab}`","why":"The common denominator is `ab`: `1/a + 1/b = {b}/{ab} + {a}/{ab} = {a + b}/{ab}`.","_n":"31ce","_k":"c1dfa31e"}],"hints":["What’s a common denominator for `a` and `b`?","Use `ab`. Rewrite `1/a = {b}/{ab}` and `1/b = {a}/{ab}`.","Add the tops: `{b + a}/{ab} = {a + b}/{ab}`."]},{"id":"w2","skill":"Expanding and factoring","goal":4,"prompt":"Expand `(a + b)^2`.","options":[{"t":"`a^2 + ab + b^2`","why":"There are two middle products, `ab` and `ba`, so the middle term is `2ab`. Try `a = b = 1`: you’d get 3, not 4.","_n":"41be","_k":"ae4d10e3"},{"t":"`a^2 + 2ab + b^2`","why":"`(a + b)(a + b) = a^2 + ab + ba + b^2 = a^2 + 2ab + b^2`.","_n":"51ae","_k":"57fb682e"},{"t":"`a^2 + b^2`","why":"That misses the middle term. Try `a = b = 1`: `(1 + 1)^2 = 4`, but `1^2 + 1^2 = 2`.","_n":"619e","_k":"60baa0b2"},{"t":"`2a + 2b`","why":"Squaring means multiplying the bracket by itself, not by 2. Try `a = b = 1`: 2 + 2 = 4 happens to match, but try `a = 2`, `b = 1`: `(2 + 1)^2 = 9`, not 6.","_n":"728e","_k":"bfa147d3"}],"hints":["Write `(a + b)^2` as `(a + b)(a + b)`.","Multiply each term in the first bracket by each term in the second. There are four products.","`a^2 + ab + ba + b^2 = a^2 + 2ab + b^2`."]},{"id":"w3","skill":"Algebra of fractions","goal":4,"prompt":"Simplify `{s + s^2}/{s}`, for `s ≠ 0`.","options":[{"t":"`s^2`","why":"You crossed out the term `s` on top against the `s` below. Only factors cancel. Try `s = 2`: `(2 + 4)/2 = 3`, not 4.","_n":"827e","_k":"d0c2be37"},{"t":"`1 + s^2`","why":"Every term on top must be divided by `s`: `s/s + s^2/s = 1 + s`.","_n":"9303","_k":"8b4e434c"},{"t":"`1 + s`","why":"Factor the top: `{s(1 + s)}/{s}`. Now `s` is a factor of the whole top and the whole bottom, so it cancels, leaving `1 + s`.","_n":"a313","_k":"aa3f0052"},{"t":"It can’t be simplified, because the top is a sum.","why":"A sum can have a common factor: `s + s^2 = s(1 + s)`. Factor first, then cancel.","_n":"b2e3","_k":"d7f02f49"}],"hints":["Look for a factor common to every term on top.","`s + s^2 = s(1 + s)`.","`{s(1 + s)}/{s} = 1 + s`."]},{"id":"w4","skill":"Identities you know","goal":2,"prompt":"Which statement is true for every angle `x`?","options":[{"t":"`sin^2x - cos^2x = 1`","why":"Try `x = 0`: `0 - 1 = -1`, not 1.","_n":"c2f3","_k":"8d1d2113"},{"t":"`sin^2x + cos^2x = 1`","why":"The point `(cos x, sin x)` on the unit circle is 1 unit from the origin, so `cos^2x + sin^2x = 1^2 = 1`.","_n":"d343","_k":"05b5e79a"},{"t":"`tan x = cos x/sin x`","why":"`cos x/sin x` is `cot x`. At `x = π/3`, `tan x = √3` but `cos x/sin x = √3/3`.","_n":"e353","_k":"49e3f505"},{"t":"`sin x + cos x = 1`","why":"Try `x = π/4`: `√2/2 + √2/2 = √2`, not 1. Only the squares add to 1.","_n":"f323","_k":"8f406ead"}],"hints":["Think of the point `(cos x, sin x)` on the unit circle.","Its distance from the origin is 1. Use the Pythagorean theorem.","`cos^2x + sin^2x = 1` for every `x`."]},{"id":"w5","skill":"Exact values","goal":1,"prompt":"What is the exact value of `sin^2(π/3)`?","options":[{"t":"`√3/2`","why":"`√3/2` is `sin(π/3)`. `sin^2(π/3)` means `(sin(π/3))^2`.","_n":"g333","_k":"c8e809fd"},{"t":"`3/2`","why":"`(√3/2)^2 = (√3)^2/2^2 = 3/4`. The bottom is squared too.","_n":"h383","_k":"e3b108ed"},{"t":"`3/4`","why":"`sin(π/3) = √3/2`, and `(√3/2)^2 = 3/4`.","_n":"i393","_k":"fc158b42"},{"t":"`1/4`","why":"`1/4 = (1/2)^2` is `sin^2(π/6)`. `π/3` is the larger angle, with the larger sine, `√3/2`.","_n":"j4a3","_k":"4d76e90f"}],"hints":["`sin^2(π/3)` means `(sin(π/3))^2`.","`sin(π/3) = √3/2`.","`(√3/2)^2 = 3/4`."]},{"id":"w6","skill":"Identities you know","goal":5,"prompt":"Which expression equals `sin(x + y)` for every `x` and `y`?","options":[{"t":"`sin x + sin y`","why":"Try `x = y = π/2`: `sin π = 0`, but `sin(π/2) + sin(π/2) = 2`.","_n":"k493","_k":"ac1120ae"},{"t":"`cos x cos y + sin x sin y`","why":"That’s `cos(x - y)`. At `x = y = 0` it gives 1, but `sin 0 = 0`.","_n":"l483","_k":"f7d6f8bc"},{"t":"`sin x cos y + cos x sin y`","why":"This is the compound-angle formula for sine (module 28).","_n":"m473","_k":"8aaad081"},{"t":"`sin x cos y - cos x sin y`","why":"That’s `sin(x - y)`. At `x = y = π/4` it gives 0, but `sin(π/2) = 1`.","_n":"n463","_k":"510acb40"}],"hints":["The sine formula mixes sine and cosine: “sin cos, cos sin”.","For a sum, the sign in the middle is +.","`sin(x + y) = sin x cos y + cos x sin y`."]}],"refreshers":{"Algebra of fractions":"To add fractions, rewrite each one over a common denominator, then add the tops: `1/a + 1/b = {b + a}/{ab}`. In this module the “numbers” are trig expressions: `{1}/{sin x} - sin x = {1 - sin^2x}/{sin x}`. To cancel, factor first, then cancel a factor of the whole top and the whole bottom: `{s + s^2}/{s} = {s(1 + s)}/{s} = 1 + s`. Never cancel a single term.","Expanding and factoring":"`(a + b)^2 = a^2 + 2ab + b^2`: don’t drop the middle term. `(a - b)(a + b) = a^2 - b^2`, so `(1 - sin x)(1 + sin x) = 1 - sin^2x`, which the Pythagorean identity turns into `cos^2x`.","Identities you know":"`sin^2x + cos^2x = 1` for every `x`. `tan x = sin x/cos x` and `cot x = cos x/sin x`. `csc x = 1/sin x`, `sec x = 1/cos x`, `cot x = 1/tan x`. From module 28: `sin(x + y) = sin x cos y + cos x sin y`. Test any claim at a special angle: at `x = π/4`, `sin x + cos x = √2`, so “`sin x + cos x = 1`” is not an identity.","Exact values":"`sin(π/6) = 1/2`, `sin(π/4) = √2/2`, `sin(π/3) = √3/2`; the cosines are the same three values in reverse order. A squared ratio means the whole value is squared: `sin^2(π/3) = (√3/2)^2 = 3/4`."}}},"explore":{"heading":"Proof workbench","intro":"Pick a side, then pick a move. Each legal move rewrites that side without changing its value, so its graph stays exactly where it is. Keep going until the two sides are the same expression.","predIntro":"Each prediction sets up the workbench above. Make a prediction first. Then the workbench will show you what really happens.","wb":{"modes":{"prove":"Prove","test":"Test a claim"},"proofLabel":"Proof","claimLabel":"Claim","sideLabels":{"L":"Left side","R":"Right side"},"colHeads":{"L":"Left side (LS)","R":"Right side (RS)"},"panels":{"graph":"Graph twin","map":"Proof map"},"phone":{"board":"Board","graph":"Graph","map":"Map"},"groups":[{"id":"id","t":"Identities"},{"id":"alg","t":"Algebra"},{"id":"eq","t":"Equation moves"}],"keyLine":"↓ unpacks a ratio into a fraction (`sec x → 1/cos x`). ↑ packs a fraction back into a ratio.","moves":[{"id":"recipDown","g":"id","t":"Reciprocal ↓","ex":"sec x → {1}/{cos x}"},{"id":"recipUp","g":"id","t":"Reciprocal ↑","ex":"{1}/{cos x} → sec x"},{"id":"quotDown","g":"id","t":"Quotient ↓","ex":"tan x → {sin x}/{cos x}"},{"id":"quotUp","g":"id","t":"Quotient ↑","ex":"{sin x}/{cos x} → tan x"},{"id":"pyth","g":"id","t":"Pythagorean","ex":"1 - sin^2x → cos^2x"},{"id":"compound","g":"id","t":"Compound angle","ex":"sin(a + b) → sin a cos b + cos a sin b"},{"id":"double","g":"id","t":"Double angle","ex":"sin 2x → 2 sin x cos x"},{"id":"exact","g":"id","t":"Exact value","ex":"cos(π/6) → {√3}/{2}"},{"id":"commonDen","g":"alg","t":"Common denominator","ex":"{1}/{a} + {1}/{b} → {a + b}/{ab}"},{"id":"split","g":"alg","t":"Split the fraction","ex":"{A + B}/{C} → {A}/{C} + {B}/{C}"},{"id":"multOut","g":"alg","t":"Multiply out","ex":"{1}/{a} · {1}/{b} → {1}/{ab}"},{"id":"asProduct","g":"alg","t":"Write as a product","ex":"{sin^2x}/{cos x} → sin x · {sin x}/{cos x}"},{"id":"expand","g":"alg","t":"Expand","ex":"(1 - s)(1 + s) → 1 - s^2"},{"id":"factor","g":"alg","t":"Factor","ex":"2 - 2s^2 → 2(1 - s^2)"},{"id":"collect","g":"alg","t":"Collect like terms","ex":"A + A → 2A"},{"id":"cancel","g":"alg","t":"Cancel a common factor","ex":"{AB}/{AC} → {B}/{C}"},{"id":"conj","g":"alg","t":"Multiply by the conjugate","ex":"{1}/{1 - c} → {1 + c}/{1 - c^2}"},{"id":"eqSame","g":"eq","t":"Do the same to both sides","ex":"A = B → kA = kB"},{"id":"eqCross","g":"eq","t":"Cross-multiply","ex":"{A}/{B} = {C}/{D} → AD = BC"},{"id":"eqSquare","g":"eq","t":"Square both sides","ex":"A = B → A^2 = B^2"}],"dbl":{"title":"Double angle: what should it rewrite?","sin":"sin 2x → 2 sin x cos x","cs":"cos 2x → cos^2x - sin^2x","c2":"cos 2x → 2cos^2x - 1","s2":"cos 2x → 1 - 2sin^2x","cancel":"Cancel"},"eqMsg":"That’s a move for solving an equation. In a proof you don’t know yet that the two sides are equal, so you can’t do the same thing to both. Work on one side at a time.","neutral":"That move doesn’t fit here, or it leads away from the goal. Undo is free; try another.","doneMsg":"This proof is complete. Undo a line or press Reset proof to try another route.","coachOther":"In this first proof, follow the coach marks.","coach":["The left side is selected. Tap \u003cstrong>Quotient ↓\u003c/strong> to write `cot x` in sine and cosine.","`sin x` is now a factor of the top and of the bottom. Tap \u003cstrong>Cancel a common factor\u003c/strong>.","Both sides are `cos x`, so LS = RS. Notice the graph never moved: every line is the same function."],"p2coach":"Two legal routes: on the left, Split the fraction, Cancel a common factor, Quotient ↑ (3 moves); or on the right, Quotient ↓ then Common denominator (2 moves).","read":{"goal":"Goal","ls":"Left side now","rs":"Right side now","status":"Status","last":"Last move","probe":"Probe","undef":"Undefined at","moves":"Moves used","claim":"Claim","here":"Here"},"notYet":"Not yet: the two sides are still different expressions.","complete":"✓ LS = RS. Both sides are now {e}. Proof complete in {n} moves.","legal":"{move}: same graph ✓","trapLast":"✗ {move}: that line draws a different graph, so the move changed the value. It has been removed.","refused":"Refused: that’s an equation move.","agree":"They happen to agree at this `x`, but the graphs are different. Move the probe to see.","oneUndef":"One of the lines is undefined at this `x`. Move the probe to see.","sameChip":"Same graph ✓","diffLabel":"✗ different graph","lsrs":"LS = RS ✓","route":"Your route: {n} moves.","shortest":"Shortest possible: {m} moves.","bonus":"Bonus proofs completed: {x}/3","undo":"Undo","reset":"Reset proof","probeLabel":"Value probe","hidden":"The graphs appear when the prediction is revealed.","reasons":{"sin":"`sin x = 0` on a bottom","cos":"`cos x = 0` on a bottom","sc":"`sin x = 0` or `cos x = 0` on a bottom","c2x":"`1 + cos 2x = 0` on a bottom","omc":"`1 - cos x = 0` on a bottom"},"trapFb":{"split":"A fraction splits over a sum on top, never on the bottom: `{1}/{1 + 1}` isn’t `1/1 + 1/1`.","two":"The 2 in `2x` belongs to the angle, not to a factor of the bottom. Only factors of the whole top and whole bottom cancel."}},"proofs":[{"id":"G0","label":"Guided proof: sin x cot x = cos x","ls":"A0","rs":"A2","ywin":[-2,2],"undef":{"ls":"sin"},"guided":true,"shortest":2,"undefAt":"`x = 0`, `π` and `2π` (where `sin x = 0`). The identity is claimed for every other `x`.","states":{"A0":"sin x cot x","A1":"sin x · {cos x}/{sin x}","A2":"cos x"},"map":{"A0":{"quotDown":"A1"},"A1":{"cancel":"A2"}}},{"id":"G1","label":"Raj’s proof: (sin x + cos x)/sin x = 1 + cot x","ls":"Q0","rs":"Q3","ywin":[-6,6],"undef":{"ls":"sin","rs":"sin"},"shortest":2,"undefAt":"`x = 0`, `π` and `2π` (where `sin x = 0`). The identity is claimed for every other `x`.","mapNote":"The 2-move route works on the right side: Quotient ↓, then Common denominator turns `1 + cot x` back into the left side. Sometimes the simpler-looking side is the one to rewrite.","states":{"Q0":"{sin x + cos x}/{sin x}","Q1":"{sin x}/{sin x} + {cos x}/{sin x}","Q1b":"{sin x}/{sin x} + cot x","Q2":"1 + {cos x}/{sin x}","Q3":"1 + cot x"},"map":{"Q0":{"split":"Q1","cancel":{"trap":"q"}},"Q1":{"cancel":"Q2","quotUp":"Q1b","commonDen":"Q0"},"Q1b":{"cancel":"Q3","quotDown":"Q1"},"Q2":{"quotUp":"Q3","commonDen":"Q0"},"Q3":{"quotDown":"Q2"}},"traps":{"q":{"m":"1 + cos x","fb":"You can cancel only a factor of the whole top and the whole bottom. In `{sin x + cos x}/{sin x}`, `sin x` is a term on top, not a factor: split the fraction instead.","who":"Raj’s line"}}},{"id":"TC1","label":"Challenge 1: sec x − cos x = sin x tan x","ls":"L0","rs":"L5","ywin":[-6,6],"undef":{"ls":"cos","rs":"cos"},"shortest":5,"undefAt":"`x = π/2` and `3π/2` (where `cos x = 0`). The identity is claimed for every other `x`.","states":{"L0":"sec x - cos x","L1":"{1}/{cos x} - cos x","L2":"{1 - c
