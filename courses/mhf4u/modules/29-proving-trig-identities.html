des are defined for every `x`.","states":{"C0":"sin(x + π/6) + sin(x - π/6)","C1":"sin x cos(π/6) + cos x sin(π/6) + sin x cos(π/6) - cos x sin(π/6)","C1e":"{√3}/{2} sin x + {1}/{2} cos x + {√3}/{2} sin x - {1}/{2} cos x","C2":"2 sin x cos(π/6)","C3":"2 sin x · {√3}/{2}","C4":"√3 sin x"},"map":{"C0":{"compound":"C1"},"C1":{"collect":"C2","exact":"C1e"},"C1e":{"collect":"C4"},"C2":{"exact":"C3"},"C3":{"multOut":"C4"}}},{"id":"B2","label":"Bonus 2: (1 − sin x)(1 + sin x) sec²x = 1","ls":"E0","rs":"E4","ywin":[-0.5,2],"undef":{"ls":"cos"},"shortest":4,"bonus":true,"undefAt":"`x = π/2` and `3π/2` (where `cos x = 0`). The identity is claimed for every other `x`.","states":{"E0":"(1 - sin x)(1 + sin x) sec^2x","E0r":"(1 - sin x)(1 + sin x) · {1}/{cos^2x}","E1":"(1 - sin^2x) sec^2x","E1r":"(1 - sin^2x) · {1}/{cos^2x}","E2":"cos^2x sec^2x","E3":"cos^2x · {1}/{cos^2x}","E3m":"{cos^2x}/{cos^2x}","E4":"1"},"map":{"E0":{"expand":"E1","recipDown":"E0r","pyth":{"trap":"p"}},"E0r":{"expand":"E1r","recipUp":"E0"},"E1":{"pyth":"E2","recipDown":"E1r"},"E1r":{"pyth":"E3"},"E2":{"recipDown":"E3"},"E3":{"cancel":"E4","multOut":"E3m"},"E3m":{"cancel":"E4"}},"traps":{"p":{"m":"cos x (1 + sin x) sec^2x","fb":"“`1 - sin x = cos x`” drops the squares: the Pythagorean identity is `1 - sin^2x = cos^2x`. Every Pythagorean identity comes from `sin^2x + cos^2x = 1`. Test any form at `x = 0` or `π/4` before you use it."}}},{"id":"B3","label":"Bonus 3: sin x/(1 − cos x) = (1 + cos x)/sin x","ls":"K0","rs":"K4","ywin":[-6,6],"undef":{"ls":"omc","rs":"sin"},"shortest":4,"bonus":true,"undefAt":"`x = 0`, `π` and `2π` (where `sin x = 0` or `1 - cos x = 0`). The identity is claimed for every other `x`.","states":{"K0":"{sin x}/{1 - cos x}","K1":"{sin x (1 + cos x)}/{(1 - cos x)(1 + cos x)}","K2":"{sin x (1 + cos x)}/{1 - cos^2x}","K3":"{sin x (1 + cos x)}/{sin^2x}","K4":"{1 + cos x}/{sin x}"},"map":{"K0":{"conj":"K1","split":{"trap":"s"}},"K1":{"expand":"K2"},"K2":{"pyth":"K3"},"K3":{"cancel":"K4"}},"traps":{"s":{"m":"{sin x}/{1} - {sin x}/{cos x}","fb":"A fraction splits over a sum on top, never on the bottom: `{1}/{1 + 1}` isn’t `1/1 + 1/1`."}}}],"claims":[{"id":"c1","label":"sin 2x = 2 sin x","ls":"sin 2x","rs":"2 sin x","ywin":[-2.5,2.5],"angles":"x2","undefAt":"Nowhere: both sides are defined for every `x`."},{"id":"c2","label":"cos x = √(1 − sin²x)","ls":"cos x","rs":"√{1 - sin^2x}","ywin":[-1.5,1.5],"undefAt":"Nowhere: both sides are defined for every `x`.","note":"Tia’s argument: “Square both sides: `cos^2x = 1 - sin^2x`. That’s the Pythagorean identity, so the claim is an identity.”"}],"predictions":[{"id":"p1","prompt":"The left side is `sin x cot x` and the right side is `cos x`. Before any moves are made, both sides will be graphed. What will you see?","options":[{"t":"One curve: the two graphs lie on top of each other, with open circles on the left side’s graph where `cot x` is undefined","_n":"o453","_k":"53a9a219"},{"t":"Two different curves that the proof will gradually bring together","_n":"p443","_k":"55a02abc"},{"t":"Two curves that are mirror images in the `x`-axis","_n":"q433","_k":"876a1b56"},{"t":"Two curves that cross at only a few points","_n":"r423","_k":"87915128"}],"explain":"An identity’s two sides are already equal at every `x` where both are defined, so their graphs are already one curve. The proof doesn’t change the graph; it shows \u003cem>why\u003c/em> the two expressions are equal. The open circles are where `sin x = 0`, because `cot x = cos x/sin x` has `sin x` on the bottom. Those `x`-values are left out of the identity; they aren’t counterexamples."},{"id":"p2","prompt":"Raj “cancels” `sin x` on the left side and writes `1 + cos x`. When his line is added, what will the graph twin show?","options":[{"t":"The new line’s graph moves onto the right side’s graph","_n":"s413","_k":"332f50de"},{"t":"The graph stays the same except at `x = 0`","_n":"t443","_k":"823a8ca8"},{"t":"The graph stays exactly the same, because cancelling is always allowed","_n":"u453","_k":"672c2c30"},{"t":"The new line’s graph jumps away from the line above it","_n":"v463","_k":"f1e6c56b"}],"explain":"You can cancel only a factor of the \u003cem>whole\u003c/em> top and the \u003cem>whole\u003c/em> bottom. In `{sin x + cos x}/{sin x}`, `sin x` is one term on top, not a factor. The legal move is to split the fraction: `{sin x}/{sin x} + {cos x}/{sin x} = 1 + cot x`. At `x = π/4` the left side is 2, but Raj’s line gives `1 + √2/2`, so his move changed the value."},{"id":"p3","prompt":"The two sides are equal at `x = 0` and at `x = π`. The probe will now sweep every position from 0 to 2π. Where will the two sides be equal?","options":[{"t":"At every multiple of `π/4`","_n":"w473","_k":"0c333fe8"},{"t":"Only at 0, π and 2π","_n":"x403","_k":"9d70f823"},{"t":"At every multiple of `π/2`","_n":"y413","_k":"6b609b78"},{"t":"At every `x`: it’s an identity","_n":"z423","_k":"b9f3b540"}],"explain":"`sin 2x = 2 sin x cos x`, not `2 sin x`: the 2 in `2x` doubles the angle, not the value. The sides are equal only where `2 sin x cos x = 2 sin x`, which means `sin x = 0` or `cos x = 1`: at 0, π and 2π. Two matching values proved nothing; one counterexample, `x = π/2`, shows it isn’t an identity."},{"id":"p4","prompt":"Tia squared both sides and got a true identity. When both sides of her \u003cstrong>original\u003c/strong> claim are graphed, what will you see?","options":[{"t":"They match only where `cos x ≥ 0` (from 0 to `π/2` and from `3π/2` to 2π)","_n":"10433","_k":"7ec64779"},{"t":"They match only where `sin x ≥ 0` (from 0 to π)","_n":"113c3","_k":"c83496b2"},{"t":"They match everywhere, because squaring proved it","_n":"123d3","_k":"5fe4674a"},{"t":"They never match","_n":"13be2","_k":"95924516"}],"explain":"`√{1 - sin^2x}` is a square root, so it’s never negative, but `cos x` is negative between `π/2` and `3π/2`. Squaring both sides threw that sign away: −1 and 1 have the same square. That’s why an identity proof never does the same thing to both sides. Squaring (or multiplying both sides) can turn a false statement into a true one."}],"chalIntro":"Work on the workbench, then press \u003cstrong>Check challenge\u003c/strong>. Choose the challenge’s proof in the Proof menu first. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Prove `sec x - cos x = sin x tan x` working on the \u003cstrong>left side only\u003c/strong>: take it all the way to `sin x tan x`.","why":"Reciprocal ↓, Common denominator, Pythagorean, Write as a product, Quotient ↑: every line rewrites the left side alone, so nothing is assumed.","hints":["Write everything in sine and cosine first. Which move turns `sec x` into a fraction?","Reciprocal ↓ gives `{1}/{cos x} - cos x`. Combine it into one fraction, then use a Pythagorean identity on the top.","Reciprocal ↓, Common denominator, Pythagorean: `{sin^2x}/{cos x}`. Then Write as a product: `sin x · {sin x}/{cos x}`, and Quotient ↑: `sin x tan x`."],"msgs":{"pick":"Choose “Challenge 1” in the Proof menu, then work on the left side.","rs":"This challenge is left side only. Undo the right-side lines (or press Reset) and take the left side all the way to `sin x tan x`.","L0":"Write everything in sine and cosine first. Which move turns `sec x` into a fraction?","L1":"Two terms, one of them a fraction: combine them over one denominator.","L2":"Which identity rewrites `1 - cos^2x`?","L3":"Nearly there. `sin^2x` is `sin x · sin x`: use Write as a product to split off `sin x · {sin x}/{cos x}`.","L4":"One move left. Which ratio is `sin x/cos x`?"}},{"id":"tc2","goal":[2,4],"prompt":"Prove `tan x + cot x = sec x csc x` in \u003cstrong>at most 5 moves\u003c/strong> in total. You may work on both sides.","why":"Three moves on the left and two on the right meet at `{1}/{sin x cos x}`. Working on both sides, one at a time, is still a proof.","hints":["Write the left side in sine and cosine and combine the fractions. What does the top become?","Quotient ↓, Common denominator, Pythagorean gives `{1}/{sin x cos x}`. That’s 3 moves. What can the right side do in 2?","On the right: Reciprocal ↓ gives `{1}/{cos x} · {1}/{sin x}`, and Multiply out gives `{1}/{sin x cos x}`. The sides meet after 5 moves."],"msgs":{"pick":"Choose “Challenge 2” in the Proof menu, then start moving.","viaT":"Proof complete, in {n} moves. Rewriting `cot x` as `1/tan x` keeps tan in the way. Try writing everything in sine and cosine first.","long":"Proof complete in {n} moves. Can you do it without the detour?","notYet":"Not yet: the left side is {L}, the right side is {R}. Can the right side meet the left side halfway?"}},{"id":"tc3","goal":[4,5],"stretch":true,"prompt":"Prove `{sin 2x}/{1 + cos 2x} = tan x` in \u003cstrong>at most 4 moves\u003c/strong>.","why":"The form `2cos^2x - 1` turns `1 + cos 2x` into `2cos^2x` in one move, so `2 sin x cos x` cancels straight away.","hints":["Look at the bottom, `1 + cos 2x`. Which form of `cos 2x` will cancel the 1?","`cos 2x = 2cos^2x - 1` makes the bottom `2cos^2x` in one move. Expand `sin 2x` too.","Double angle (`sin 2x`): `{2 sin x cos x}/{1 + cos 2x}`. Double angle (`2cos^2x - 1`): `{2 sin x cos x}/{2cos^2x}`. Cancel `2 cos x`: `{sin x}/{cos x}`. Quotient ↑: `tan x`. Four moves."],"msgs":{"pick":"Choose “Challenge 3” in the Proof menu, then start moving.","cs":"Proof complete in {n} moves. With `cos^2x - sin^2x`, the bottom `1 + cos^2x - sin^2x` needs a Pythagorean step. Which form of `cos 2x` makes `1 + cos 2x` collapse straight away?","s2":"Proof complete in {n} moves. `1 + (1 - 2sin^2x) = 2 - 2sin^2x` needs factoring and a Pythagorean step. A different form of `cos 2x` cancels the 1 at once.","notYet":"Not yet. Look at the bottom: which form of `cos 2x` turns `1 + cos 2x` into a single term?"}}],"blocks":[{"title":"How a proof works","html":"\u003cp>\u003cstrong>Proving an identity\u003c/strong>\u003c/p>\u003cul>\u003cli>Every legal move rewrites an expression as one that is equal to it for every `x` where both are defined. That’s why the graph never moves.\u003c/li>\u003cli>Work on one side at a time, until both sides are the same expression. Then write LS = RS.\u003c/li>\u003cli>Never do the same thing to both sides, cross-multiply, or move a term across the equals sign. Those are equation moves, and they assume what you’re trying to prove.\u003c/li>\u003cli>Good first moves: rewrite in sine and cosine; combine fractions; expand double angles; look for `1 - sin^2x`, `1 - cos^2x`, `sec^2x - 1` or `csc^2x - 1` to swap with a Pythagorean identity; multiply by a conjugate when the bottom is `1 ± sin x` or `1 ± cos x`.\u003c/li>\u003cli>The graph twin is your check, not your proof: it can show a move is wrong, but only the chain of legal moves proves the identity for every `x`.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"counterexamples","name":"Counterexamples","heading":"Identity or equation? Hunt for a counterexample","intro":"Each round shows a claim. Give your hunch first, then look at the graphs and use the probe. If the claim isn’t an identity, find an `x` that proves it.","ui":{"verdicts":[{"id":"id","t":"Identity"},{"id":"some","t":"True for some `x` only"},{"id":"never","t":"Never true"}],"lock":"Lock in my hunch","use":"Use this `x` as my counterexample","submit":"Submit verdict","fine":"Fine","diff":"Show where they differ","probe":"Probe","hunchQ":"Your hunch: is this claim an identity, true for some `x` only, or never true?","finalQ":"Your final verdict","hidden":"Lock in your hunch to see the graphs.","equal":"Equal","differ":"Not equal. This `x` is a counterexample.","undef":"{side} side undefined ({reason}). Not a counterexample.","cxNone":"No counterexample chosen yet.","cxSet":"Your counterexample: {x}","cxNeed":"Set the probe on a counterexample and press \u003cstrong>Use this `x` as my counterexample\u003c/strong> before you submit.","summary":"Your hunch: {h}. Final verdict: {v}.","solved":"✓ Round solved.","notFirst":"(not first try)","rightCx":"Your verdict is right, but this `x` isn’t a counterexample.","alg":"Check it with algebra","prev":"Previous round","next":"Next round","round":"Round {i} of 6","rightSide":"right side: `y = 0`"},"rounds":[{"id":"R1","goal":1,"claim":"cos 2x = 2 cos x","ywin":[-2.5,2.5],"_a":"F0BWCVBH","angles":"x2","fb":{"id":"Put the probe at `x = 0`: the left side is `cos 0 = 1`, but the right side is `2 cos 0 = 2`.","never":"The graphs cross twice. At those two `x`-values the sides are equal, so the claim is true for some `x`."},"alg":"`cos 2x = 2cos^2x - 1`, so the claim says `2cos^2x - 1 = 2 cos x`. At `x = 0`: 1 ≠ 2, so it isn’t an identity. The 2 in `2x` doubles the angle, not the value. (The sides are equal only where `2cos^2x - 2 cos x - 1 = 0`, at two `x`-values that aren’t special angles.)"},{"id":"R2","goal":[1,6],"claim":"tan x cos x = sin x","ywin":[-1.5,1.5],"_a":"F1pdRg==","undef":{"ls":"cos"},"reasons":{"ls":"`cos x = 0` under tan"},"fb":{"some":"Where both sides are defined, the graphs are one curve. The open circles at `π/2` and `3π/2` are where `tan x` is undefined; they aren’t counterexamples.","never":"Where both sides are defined, the graphs are one curve. The open circles at `π/2` and `3π/2` are where `tan x` is undefined; they aren’t counterexamples.","cxUndef":"The left side is undefined here (`cos x = 0` under tan), so this isn’t a counterexample."},"alg":"LS = `{sin x}/{cos x} · cos x = sin x` = RS, for every `x` with `cos x ≠ 0`. In `0 ≤ x ≤ 2π` that leaves out `π/2` and `3π/2`."},{"id":"R3","goal":1,"claim":"cos(x - π/3) = cos x - cos(π/3)","ywin":[-2,2],"_a":"F0BWCVBH","angles":"r3","fb":{"id":"It works at `x = 0`, but put the probe at `π/3`: the left side is `cos 0 = 1`, the right side is `1/2 - 1/2 = 0`.","never":"At `x = 0` both sides are `1/2`, so it’s true for some `x`.","cxEqual":"Both sides are equal here ({v}). A counterexample needs them to differ. Try another `x`."},"alg":"`cos(x - π/3) = cos x cos(π/3) + sin x sin(π/3) = {1}/{2} cos x + {√3}/{2} sin x`. That is not `cos x - 1/2`: at `x = π/3` the left side is 1 and the right side is 0. Cosine doesn’t split over a subtraction; the claim is true only at 0, `4π/3` and 2π."},{"id":"R4","goal":[1,6],"claim":"tan^2x - sec^2x = 1","ywin":[-2,2],"_a":"F11cElAXRg==","undef":{"ls":"cos"},"reasons":{"ls":"`cos x = 0`, so `tan x` and `sec x` are undefined"},"fb":{"some":"The two graphs are parallel lines, 2 apart: the left side is −1 wherever it’s defined. They never meet.","id":"The left side is always −1 and the right side is 1.","cxUndef":"Both `tan x` and `sec x` are undefined here. Pick an `x` where the left side has a value."},"alg":"`1 + tan^2x = sec^2x`, so `tan^2x - sec^2x = -1` wherever both are defined. −1 never equals 1, so no `x` works."},{"id":"R5","goal":[1,2],"claim":"(sin x + cos x)^2 = 1 + sin 2x","ywin":[-0.5,2.5],"_a":"F1pdRg==","angles":"x2","fb":{"some":"The graphs are one curve everywhere. Hunt for an `x` where they differ: you won’t find one. The algebra panel shows why.","never":"The graphs are one curve everywhere. Hunt for an `x` where they differ: you won’t find one. The algebra panel shows why."},"alg":"LS = `sin^2x + 2 sin x cos x + cos^2x = (sin^2x + cos^2x) + 2 sin x cos x = 1 + sin 2x` = RS. The middle term of the square is what makes it work."},{"id":"R6","goal":1,"stretch":true,"claim":"sin 12x = 0","ywin":[-1.5,1.5],"_a":"F0BWCVBH","angles":"r6","zeroRS":true,"note":"Marco checked this at all 25 probe positions (every multiple of `π/12` from 0 to 2π), and it was true every time.","fb":{"id":"Turn on \u003cstrong>Fine\u003c/strong> and look between the probe positions. The wave rises and falls between them.","never":"At every multiple of `π/12` the sides are equal (both 0), so it’s true for some `x`.","cxEqual":"Equal here: `12x` is a multiple of π, so `sin 12x = 0`. Those were exactly the positions Marco checked. Look between them with Fine."},"alg":"At `x = π/24`, `12x = π/2` and `sin 12x = 1 ≠ 0`. Every probe position made `12x` a multiple of π, which is exactly where `sin 12x = 0`. No number of checked values proves an identity."}],"blocks":[{"title":"What the hunt shows","html":"\u003cp>\u003cstrong>Identity, equation, or never true?\u003c/strong>\u003c/p>\u003cul>\u003cli>An \u003cstrong>identity\u003c/strong> is true for every `x` where both sides are defined. Only a proof shows that; graphs and values can only suggest it.\u003c/li>\u003cli>A statement that is \u003cstrong>true for some `x` only\u003c/strong> is an equation with solutions. \u003cstrong>One counterexample\u003c/strong>, an `x` where both sides are defined but different, shows it isn’t an identity.\u003c/li>\u003cli>A statement can be \u003cstrong>never true\u003c/strong>, like `tan^2x - sec^2x = 1`.\u003c/li>\u003cli>An `x` where a side is undefined is \u003cstrong>not\u003c/strong> a counterexample. It’s outside the domain.\u003c/li>\u003cli>Checking many values, even every probe position, never proves an identity.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Identity or not?","summary":"Identity or not? quick check","items":[{"id":"q1","goal":1,"prompt":"Which value of `x` is a counterexample to `tan x = sin x`?","choices":[{"t":"`x = π/4`","fb":"Right. `tan(π/4) = 1` but `sin(π/4) = √2/2`, and both are defined. One counterexample is enough.","_n":"14bd2","_k":"f7eebaa7"},{"t":"`x = π/2`","fb":"`tan(π/2)` is undefined, so the claim says nothing there. A counterexample needs both sides defined.","_n":"15c02","_k":"47be9896"},{"t":"None: it’s an identity, since both sides are 0 at `x = 0`","fb":"Agreeing at one value doesn’t make an identity. It fails at `π/4`.","_n":"16bf2","_k":"38acb86c"},{"t":"`x = π`","fb":"`tan π = 0 = sin π`. The sides are equal there, so it isn’t a counterexample.","_n":"17c22","_k":"7af7407a"}]},{"id":"q2","goal":6,"prompt":"The left side of `sec x - cos x = sin x tan x` is undefined at `x = π/2`. Is `x = π/2` a counterexample?","choices":[{"t":"Yes: the sides aren’t equal there","fb":"Neither side has a value at `π/2` (both need `cos x ≠ 0`), so there’s nothing to compare.","_n":"18c12","_k":"5cdf254a"},{"t":"No: an identity only claims the sides are equal where both are defined","fb":"Right. This is the identity from TC1; `π/2` is simply outside its domain.","_n":"19c42","_k":"3b4d8fc1"},{"t":"Yes: so the statement is an equation, not an identity","fb":"Undefined values are left out, not counted against an identity.","_n":"1ac32","_k":"bdb65805"},{"t":"No: both sides equal 0 there","fb":"Neither side is 0 at `π/2`. Both are undefined, because `cos(π/2) = 0` sits on a bottom.","_n":"1bb62","_k":"bb7746f8"}]},{"id":"q3","goal":1,"prompt":"Ana checks a claim at `x = 0`, `π/6`, `π/4`, `π/3` and `π/2`. It’s true at all five. What can she conclude?","choices":[{"t":"It’s an equation, not an identity","fb":"She hasn’t found a counterexample, so she can’t say that either. `sin^2x + cos^2x = 1` would pass her five checks too.","_n":"1cb52","_k":"f3847916"},{"t":"It’s an identity","fb":"Five values can’t cover every `x`. `sin 12x = 0` passes all five checks and fails at `π/24`.","_n":"1db82","_k":"236dc200"},{"t":"Nothing for sure yet: it might be an identity, but only a proof can show that","fb":"Right. `sin 12x = 0` is true at all five of those values and still isn’t an identity.","_n":"1eb92","_k":"94d06487"},{"t":"It’s an identity, at least for `0 ≤ x ≤ π/2`","fb":"`sin 12x = 0` fails at `π/24`, which is between 0 and `π/2`.","_n":"1fb62","_k":"0cf8a8cc"}]},{"id":"q4","goal":1,"prompt":"Which statement is \u003cstrong>never\u003c/strong> true?","choices":[{"t":"`sin^2x - cos^2x = 1`","fb":"At `x = π/2`: `1 - 0 = 1`. It’s true at `π/2` and `3π/2`.","_n":"1gb72","_k":"56e63840"},{"t":"`1 + cot^2x = csc^2x`","fb":"That’s a Pythagorean identity: true for every `x` where both sides are defined.","_n":"1hb42","_k":"c991a878"},{"t":"`sin 2x = 2 sin x`","fb":"Both sides are 0 at 0, π and 2π, so it’s sometimes true.","_n":"1ib52","_k":"c2e312d4"},{"t":"`csc^2x - cot^2x = 0`","fb":"Right. `1 + cot^2x = csc^2x`, so `csc^2x - cot^2x = 1` wherever both are defined. It can never be 0.","_n":"1jb22","_k":"ef1a0dff"}]}]}},"practice":{"activities":[{"id":"order","type":"custom","title":"Put the proof in order","summary":"Put the proof in order","goal":[3,4],"instruction":"Put the lines of each proof in order. One line doesn’t belong in the proof at all: move it to the tray.","how":"Tap a line, then use Move up or Move down. Use \u003cstrong>To tray\u003c/strong> for the line that doesn’t belong. Press Check when you’re done.","ui":{"tray":"Tray (one line)","trayEmpty":"Empty: move the line that doesn’t belong here.","up":"Move up","down":"Move down","toTray":"To tray","back":"Back to list","check":"Check","trayBad":"The tray holds a line that belongs in the proof.","decoyIn":"A line in the proof doesn’t belong; one move can’t produce it.","out":"Line {n} is out of place. Ask what has to happen before it can be done.","good":"✓ That proof works.","notFirst":"(not first try)","seq":"Proof {i}: "},"sequences":[{"id":"o1","goal":4,"prompt":"Prove `{1}/{1 - cos x} + {1}/{1 + cos x} = 2csc^2x`.","first":"LS = `{1}/{1 - cos x} + {1}/{1 + cos x}`","last":"= RS, so LS = RS.","steps":["= `{2}/{sin^2x}`","Multiply both sides by `(1 - cos x)(1 + cos x)`.","= `{(1 + cos x) + (1 - cos x)}/{(1 - cos x)(1 + cos x)}`","= `2csc^2x`","= `{2}/{1 - cos^2x}`"],"_a":"ThFWFlEAFhUPaAtIAUlUGwZuFUZRAAdYTBEDVRlHEFZSQBtebkcnWFheVgoVAQFZWl5QClQRC0UXHxsnWgkIUlZHGQhcDgEXQVZLCUZeRFJNQ1gKUUUQX1ATWwtBEQtaFx8bNEwRDFZSXEsBVAtGGxdhXAdcFRZYVlJVRNfj9RVoHxsAUAYLTmFSXkYPRyBSVlxAXhUEChdQQkwFQQwLWRVeVhJQRxk=","wrong":[{"above":3,"below":2,"fb":"`sin^2x` can only appear once the bottom is `1 - cos^2x`, so line 2 comes first."},{"above":4,"below":3,"fb":"`2csc^2x = {2}/{sin^2x}` needs `sin^2x` on the bottom first."},{"above":2,"below":1,"fb":"The top 2 comes from adding the two tops over the common denominator, so line 1 comes first."}],"decoyFb":"Multiplying both sides is an equation move. A proof only rewrites one side at a time.","hints":["Start by combining the two fractions. Which line does that?","After the common denominator, the tops add to 2 and the bottom multiplies out to `1 - cos^2x`. Then a Pythagorean identity, then a reciprocal.","Order: common denominator, `{2}/{1 - cos^2x}`, `{2}/{sin^2x}`, `2csc^2x`. The “multiply both sides” line goes in the tray."]},{"id":"o2","goal":5,"prompt":"Prove `csc 2x + cot 2x = cot x`.","first":"LS = `csc 2x + cot 2x`","last":"= `cot x` = RS, so LS = RS.","steps":["= `{2cos^2x}/{2 sin x cos x}`","= `{1}/{sin 2x} + {cos 2x}/{sin 2x}`","= `{1 + cos 2x}/{2 sin 2x}`","= `{cos x}/{sin x}`","= `{1 + 2cos^2x - 1}/{2 sin x cos x}`","= `{1 + cos 2x}/{sin 2x}`"],"_a":"ThFWFlEAFhUPaAhIAElQGwUfCjkZRwBSVlxARg9XSBVBUl4XF18/FWdWWg1FFwtUVF8ZhrP2RFZbVxk1QAoQXlBdTUTX4/cVGRF6C1gIC1kVV1wKWggNWVRHVhYXSUZzWkZbCFBFBVlSX1xEHQcLQ10aG0gXJgtbWVZaEBUJDVxQE00BRwgXFRkRegVbBgFbFVIZB1oICVhbE18FVhELRRduFUZRAAdYTGdYAxdfRnNQUFYdD0UFU1FAGRBdAERVWkdNC1gWRko=","wrong":[{"above":3,"below":2,"fb":"Line 3 is a single fraction, so the two fractions have to be combined first."},{"above":5,"below":4,"fb":"Cancel after the like terms are collected: `1 + 2cos^2x - 1` becomes `2cos^2x` first."}],"decoyFb":"Fractions with the same bottom add their tops; the bottom stays `sin 2x`, it doesn’t double.","hints":["Write csc and cot in terms of sine and cosine of `2x` first.","Both fractions have the bottom `sin 2x`, so add the tops. Then choose the double-angle form that cancels the 1.","Order: `{1}/{sin 2x} + {cos 2x}/{sin 2x}`; `{1 + cos 2x}/{sin 2x}`; `{1 + 2cos^2x - 1}/{2 sin x cos x}`; `{2cos^2x}/{2 sin x cos x}`; `{cos x}/{sin x}`. The `{1 + cos 2x}/{2 sin 2x}` line goes in the tray."]},{"id":"o3","goal":5,"prompt":"Prove `sin(x + π/6) + cos(x + π/3) = cos x`.","first":"LS = `sin(x + π/6) + cos(x + π/3)`","last":"= RS, so LS = RS.","steps":["= `{√3}/{2} sin x + {1}/{2} cos x + {1}/{2} cos x - {√3}/{2} sin x`","= `cos x`","= `sin x + sin(π/6) + cos x + cos(π/3)`","= `sin x cos(π/6) + cos x sin(π/6) + cos x cos(π/3) - sin x sin(π/3)`","= `{1}/{2} cos x + {1}/{2} cos x`"],"_a":"ThFWFlEAFhUPaApIBUlQGwRuFUZRAAdYTBEDVhlHEFZSQBtebkcnWFhDVhFbAURWW1RVARdJRnJNUloQFRMFW0BWG0gXJgtbWVZaEBUJDVxQE00BRwgXFx1HUQEVFg1ZUBNNAUcIFxdWUlcHUAlNFRkRegtZCQFUQRNVDV4ARENQQVQXFzhIFVFWWgtMMQVQFwkbIFAGC04PE0oUWQwQRBVAUApQRQVZURNaC0YMClIVXE8BR0UFF0ZGVEZI","wrong":[{"above":2,"below":1,"fb":"The exact values replace `cos(π/6)`, `sin(π/6)` and so on, which only appear after the compound-angle expansion."},{"above":4,"below":3,"fb":"Line 3 shows the sine terms cancelling; line 4 then adds the two halves."}],"decoyFb":"`sin(x + π/6)` isn’t `sin x + sin(π/6)`. Test `x = π/3`: `sin(π/2) = 1`, but `sin(π/3) + sin(π/6) = {√3 + 1}/{2}`.","hints":["Both terms are a function of a sum. Which formulas expand `sin(x + π/6)` and `cos(x + π/3)`?","Expand both, then replace `cos(π/6)`, `sin(π/6)`, `cos(π/3)` and `sin(π/3)` with their exact values. Watch the minus sign in the cosine formula.","Order: the compound-angle expansion; the exact values; `{1}/{2} cos x + {1}/{2} cos x` once the sine terms cancel; `cos x`. The line `sin x + sin(π/6) + cos x + cos(π/3)` goes in the tray."]}]},{"id":"make","type":"custom","title":"Make it an identity","summary":"Make it an identity","star":true,"goal":[2,4,5],"instruction":"Fill in the boxes so that the statement is true for every `x` where both sides are defined. Prove it on paper first; then check.","how":"Type an integer in each box (a fraction in MI8), then press Check. After each check, a small graph shows both sides, so you can see where they agree.","ui":{"item":"MI{i} of 8","check":"Check","prev":"Previous","next":"Next statement","range":"Use an integer from −6 to 6 for `a` and `b`, from 1 to 6 for `k`, and from 1 to 4 for `n`.","fracRange":"Type a whole number on top and a nonzero whole number on the bottom.","fill":"Fill in every box first.","gap":"Largest gap: {g}","gap0":"Largest gap: 0. The two graphs are one curve.","gapNote":"(where both sides are on screen)","good":"✓ Correct.","notFirst":"(not first try)","fallback":"Those numbers give a different graph. The preview shows where the sides part: test that `x` by hand to see which part of your working went wrong."},"items":[{"id":"mi1","goal":2,"parts":["(1 - sin x)(1 + sin x) = ","#a","cos","^n"," x"],"boxes":{"a":"ab","n":"n"},"ywin":[-2,2],"_a":"ThFYRg9USBVbEQNWSA==","wrong":[{"v":{"a":1,"n":1},"fb":"`(1 - sin x)(1 + sin x) = 1 - sin^2x = cos^2x`. The squares matter: at `x = π`, `cos x = -1` but `1 - sin^2x = 1`."},{"v":{"a":-1,"n":2},"fb":"The left side is 1 at `x = 0`, but `-cos^2 0 = -1`. `1 - sin^2x` is `cos^2x`, with a plus sign."}],"hints":["Expand the left side: it’s a difference of squares.","`(1 - sin x)(1 + sin x) = 1 - sin^2x`. Which Pythagorean identity rewrites it?","`1 - sin^2x = cos^2x`, so `a = 1` and `n = 2`."]},{"id":"mi2","goal":[2,5],"parts":["tan x + cot x = ","#a"," csc(","#k","x)"],"boxes":{"a":"ab","k":"k"},"ywin":[-6,6],"_a":"ThFYRg9XSBVeEQNWSA==","wrong":[{"v":{"a":1,"k":2},"fb":"`csc 2x = {1}/{2 sin x cos x}`, which is half of `tan x + cot x = {1}/{sin x cos x}`. At `x = π/4` you’d get 1, not 2."},{"v":{"a":2,"k":1},"fb":"`2 csc x = 2/sin x`. At `x = π/4` that’s `2√2`, but tan + cot = 2."}],"hints":["You proved `tan x + cot x = {1}/{sin x cos x}` in Explore. Which double angle has `sin x cos x` in it?","`sin 2x = 2 sin x cos x`, so `sin x cos x = {1}/{2} sin 2x`.","`{1}/{sin x cos x} = {2}/{sin 2x} = 2 csc 2x`. So `a = 2` and `k = 2`."]},{"id":"mi3","goal":[2,5],"parts":["sin^4x - cos^4x = ","#a"," cos(","#k","x)"],"boxes":{"a":"ab","k":"k"},"ywin":[-2,2],"_a":"ThFYRg9IVRsXWBteBxg=","wrong":[{"v":{"a":1,"k":2},"fb":"Factor: `(sin^2x - cos^2x)(sin^2x + cos^2x) = sin^2x - cos^2x`, which is `-(cos^2x - sin^2x) = -cos 2x`. At `x = 0` the left side is −1."},{"v":{"a":-1,"k":1},"fb":"At `x = π/2` the left side is 1, but `-cos(π/2) = 0`."}],"hints":["`sin^4x - cos^4x` is a difference of squares: `(sin^2x)^2 - (cos^2x)^2`.","`(sin^2x - cos^2x)(sin^2x + cos^2x) = sin^2x - cos^2x`. Compare it with `cos 2x = cos^2x - sin^2x`.","`sin^2x - cos^2x = -(cos^2x - sin^2x) = -cos 2x`, so `a = -1` and `k = 2`."]},{"id":"mi4","goal":[2,5],"parts":["sec^2x + csc^2x = ","#a"," csc^2(","#k","x)"],"boxes":{"a":"ab","k":"k"},"ywin":[0,16],"_a":"ThFYRg9RSBVeEQNWSA==","wrong":[{"v":{"a":1,"k":2},"fb":"`csc^2 2x = {1}/{4 sin^2x cos^2x}`, a quarter of the left side."},{"v":{"a":2,"k":2},"fb":"Squaring `sin 2x = 2 sin x cos x` squares the 2 as well: `sin^2 2x = 4 sin^2x cos^2x`."}],"hints":["Write the left side in sine and cosine and combine the fractions.","`{1}/{cos^2x} + {1}/{sin^2x} = {1}/{sin^2x cos^2x}`. Which double angle has `sin x cos x` in it?","`sin^2 2x = 4 sin^2x cos^2x`, so `{1}/{sin^2x cos^2x} = {4}/{sin^2 2x} = 4csc^2 2x`. So `a = 4` and `k = 2`."]},{"id":"mi5","goal":5,"star":true,"parts":["cos 3x = ","#a"," cos^3x + ","#b"," cos x"],"boxes":{"a":"ab","b":"ab"},"ywin":[-3,3],"_a":"ThFYRg9RSBVXEQNJBhg=","wrong":[{"v":{"a":3,"b":-2},"fb":"That comes from forgetting the 2 in `sin 2x = 2 sin x cos x`."},{"v":{"a":0,"b":1},"fb":"`cos 2x cos x + sin 2x sin x` is `cos(2x - x) = cos x`. For `cos(2x + x)` the middle sign is minus."},{"v":{"a":2,"b":-1},"fb":"That’s only `cos 2x cos x`: the `-sin 2x sin x` part is missing."}],"hints":["Write `3x = 2x + x` and use the compound-angle formula for cosine.","`cos 3x = cos 2x cos x - sin 2x sin x`. Use `cos 2x = 2cos^2x - 1` and `sin 2x = 2 sin x cos x`.","`(2cos^2x - 1) cos x - 2sin^2x cos x = 2cos^3x - cos x - 2(1 - cos^2x) cos x = 4cos^3x - 3 cos x`. So `a = 4`, `b = -3`."]},{"id":"mi6","goal":5,"star":true,"parts":["sin 3x = ","#a"," sin x + ","#b"," sin^3x"],"boxes":{"a":"ab","b":"ab"},"ywin":[-3,3],"_a":"ThFYRg9WSBVXEQNJARg=","wrong":[{"v":{"a":2,"b":-3},"fb":"That comes from forgetting the 2 in `sin 2x`."},{"v":{"a":1,"b":-2},"fb":"That’s only `cos 2x sin x`: the `sin 2x cos x` part is missing."},{"v":{"a":3,"b":0},"fb":"`cos^2x = 1 - sin^2x`, not `1 + sin^2x`."}],"hints":["Write `3x = 2x + x` and use the compound-angle formula for sine.","`sin 3x = sin 2x cos x + cos 2x sin x`. Use `sin 2x = 2 sin x cos x` and `cos 2x = 1 - 2sin^2x`.","`2 sin x cos^2x + (1 - 2sin^2x) sin x = 2 sin x(1 - sin^2x) + sin x - 2sin^3x = 3 sin x - 4sin^3x`. So `a = 3`, `b = -4`."]},{"id":"mi7","goal":5,"star":true,"parts":["tan(x + π/4) = ",{"num":["#a"," + tan x"],"den":["#b"," - tan x"]}],"boxes":{"a":"ab","b":"ab"},"ywin":[-6,6],"_a":"ThFYRg9USBVXEQNVSA==","wrong":[{"v":{"a":-1,"b":1},"fb":"That simplifies to −1 for every `x`: the top and bottom are opposites. `tan(x + π/4) = {tan x + tan(π/4)}/{1 - tan x tan(π/4)}`, and `tan(π/4) = 1`."},{"v":{"a":1,"b":-1},"fb":"That simplifies to −1 for every `x`: the top and bottom are opposites. `tan(x + π/4) = {tan x + tan(π/4)}/{1 - tan x tan(π/4)}`, and `tan(π/4) = 1`."}],"hints":["Use the compound-angle formula for tangent: `tan(a + b) = {tan a + tan b}/{1 - tan a tan b}`.","`tan(π/4) = 1`.","`tan(x + π/4) = {tan x + 1}/{1 - tan x} = {1 + tan x}/{1 - tan x}`. So `a = 1` and `b = 1`."]},{"id":"mi8","goal":5,"star":true,"parts":["cos(x + π/6) cos(x - π/6) = cos^2x - ",{"num":["#p"],"den":["#q"]}],"boxes":{"p":"int","q":"int"},"ywin":[-1.5,1.5],"_a":"ThFfFlQGRg0FHQtRSA==","wrong":[{"val":0.75,"fb":"That’s `cos^2(π/6)`. Multiplying out gives `{3}/{4}cos^2x - {1}/{4}sin^2x`; replace `sin^2x` with `1 - cos^2x` and the constant is `sin^2(π/6) = 1/4`."},{"val":0.5,"fb":"That’s `sin(π/6)`. The constant is `sin^2(π/6) = 1/4`."}],"hints":["Expand both brackets with the compound-angle formulas. The product has the form `(A - B)(A + B)`.","`(cos x cos(π/6) - sin x sin(π/6))(cos x cos(π/6) + sin x sin(π/6)) = cos^2x cos^2(π/6) - sin^2x sin^2(π/6) = {3}/{4}cos^2x - {1}/{4}sin^2x`.","Replace `sin^2x` with `1 - cos^2x`: `{3}/{4}cos^2x - {1}/{4} + {1}/{4}cos^2x = cos^2x - {1}/{4}`. The fraction is `1/4`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Grace","how":"","instruction":"Grace made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Prove `sec x - tan x sin x = cos x`.","steps":["To prove: `sec x - tan x sin x = cos x`.","Multiply both sides by `cos x`: `1 - sin^2x = cos^2x`.","By the Pythagorean identity, `cos^2x = cos^2x`.","The two sides are the same, so the identity is proved."],"_a":"BA==","stepFb":["Step 1 just states the goal. Keep checking the steps after it.","","Step 3 uses the Pythagorean identity correctly. The mistake is in how Grace got to step 3’s starting point.","Step 4 is the conclusion of the earlier steps. The mistake is earlier."],"fixes":[{"t":"Move `tan x sin x` to the right side: `sec x = cos x + tan x sin x`.","why":"Moving a term across the equals sign is also an equation move.","_n":"1kb32","_k":"a451e1b8"},{"t":"Step 2 is correct as written.","why":"Multiplying both sides assumes the sides are equal, which is what Grace is trying to prove. Remember Tia’s squaring in P4: a “both sides” move can make a false claim look true.","_n":"1lc02","_k":"13f39e63"},{"t":"Work on the left side alone: LS = `{1}/{cos x} - {sin x}/{cos x} · sin x = {1 - sin^2x}/{cos x} = {cos^2x}/{cos x} = cos x` = RS.","why":"Every line rewrites one side, so nothing is assumed. The arithmetic Grace did is still useful; it just has to happen on one side.","_n":"1mc12","_k":"0a4389b8"},{"t":"Multiply both sides by `sin x` instead.","why":"That’s still doing the same thing to both sides. Any “both sides” move assumes the identity is already true.","_n":"1nb22","_k":"b473a528"}],"hints":["Look at what each step does to the equals sign.","In a proof, are you allowed to do the same thing to both sides?","Step 2 is wrong. Work on the left side alone: `{1}/{cos x} - {sin^2x}/{cos x} = {1 - sin^2x}/{cos x} = {cos^2x}/{cos x} = cos x`."]},{"id":"e2","goal":2,"task":"Is `(1 + tan x)^2 = sec^2x + 2 tan x` an identity? Prove it or disprove it.","steps":["LS = `(1 + tan x)^2`","= `1 + tan^2x`","= `sec^2x`","At `x = π/4` the left side is `sec^2(π/4) = 2`, but the right side is 2 + 2 = 4. That’s a counterexample, so the statement is not an identity."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 uses `1 + tan^2x = sec^2x` correctly. The mistake is earlier.","Step 4 would be right if step 3 were: it tests one `x` with both sides defined, which is how to disprove a claim. The mistake is earlier."],"fixes":[{"t":"= `1 + tan x + tan^2x`.","why":"The middle term is `2 tan x`: there are two middle products, `tan x` and `tan x`.","_n":"1ob12","_k":"44d7082e"},{"t":"= `1 + 2 tan x + tan^2x = sec^2x + 2 tan x` = RS, so it \u003cstrong>is\u003c/strong> an identity.","why":"`(a + b)^2` has a middle term `2ab`. With it, the left side becomes the right side.","_n":"1pb02","_k":"52254a3f"},{"t":"Step 2 is correct; the error is in step 3, which should be `1 + tan^2x = csc^2x`.","why":"`1 + tan^2x = sec^2x` is right; csc pairs with cot. The real error is the missing middle term in step 2.","_n":"1qaf2","_k":"3de3002a"},{"t":"= `1 + 2 tan x`.","why":"Squaring `tan x` gives `tan^2x`; it can’t disappear.","_n":"1rb62","_k":"bcdc0248"}],"hints":["Check step 2: how do you square a sum?","`(a + b)^2 = a^2 + 2ab + b^2`. What’s the middle term here?","Step 2 is wrong. `(1 + tan x)^2 = 1 + 2 tan x + tan^2x = sec^2x + 2 tan x`, so it is an identity."]},{"id":"e3","goal":5,"task":"Prove `{cos 2x}/{cos x + sin x} = cos x - sin x`.","steps":["LS = `{cos 2x}/{cos x + sin x}`","= `{cos^2x + sin^2x}/{cos x + sin x}`","= `{1}/{cos x + sin x}`","At `x = π/4` the left side is `{1}/{√2/2 + √2/2} = √2/2`, but the right side is `√2/2 - √2/2 = 0`. That’s a counterexample, so the statement is not an identity."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 applies `sin^2x + cos^2x = 1` correctly to step 2’s top. The mistake is earlier.","Step 4 would be right if step 3 were: it tests one `x` with both sides defined, which is how to disprove a claim. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct; the error is in step 4.","why":"`cos^2x + sin^2x` is 1, not `cos 2x`. At `x = π/2`, `cos 2x = -1`.","_n":"1sb52","_k":"49da0f26"},{"t":"`cos 2x = 1 - 2cos^2x`, so LS = `{1 - 2cos^2x}/{cos x + sin x}`.","why":"`1 - 2cos^2x` is `-cos 2x`. The three correct forms are `cos^2x - sin^2x`, `2cos^2x - 1` and `1 - 2sin^2x`.","_n":"1tb42","_k":"0870a024"},{"t":"`cos 2x = cos^2x - sin^2x = (cos x - sin x)(cos x + sin x)`, so LS = `cos x - sin x` = RS.","why":"With the minus sign, the top is a difference of squares, and the factor `cos x + sin x` cancels.","_n":"1ub32","_k":"9cd041f9"},{"t":"`cos 2x = 2 cos x`, so LS = `{2 cos x}/{cos x + sin x}`.","why":"The 2 in `2x` doubles the angle, not the value: at `x = 0`, `cos 0 = 1` but `2 cos 0 = 2`.","_n":"1vba2","_k":"466b37f7"}],"hints":["Check step 2 against the three forms of `cos 2x`.","`cos 2x = cos^2x - sin^2x`: a minus, not a plus. What does `cos^2x - sin^2x` factor into?","Step 2 is wrong. `cos 2x = (cos x - sin x)(cos x + sin x)`; cancel `cos x + sin x` to get `cos x - sin x` (for `cos x + sin x ≠ 0`)."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the proof workbench: what the graphs did before you made any moves, or what happened when a move wasn’t legal?"},{"id":"j2","q":"In your own words, what is the difference between an identity and an equation? Give an example of each, and a counterexample for the equation."},{"id":"j3","q":"Explain to a friend how you would start proving `tan x + cot x = sec x csc x`, and why you aren’t allowed to multiply both sides by something."},{"id":"j4","q":"Which identity or algebra move do you still reach for last, or get wrong? What will you do to make it automatic?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Which statement is an identity?","options":[{"t":"`tan^2x - 1 = sec^2x`","why":"The sign is wrong. At `x = 0` the left side is −1 and the right side is 1.","_n":"1wb92","_k":"3c6904be"},{"t":"`sec^2x + tan^2x = 1`","why":"At `x = π/4`: 2 + 1 = 3, not 1. The identity is `sec^2x - tan^2x = 1`.","_n":"1xac2","_k":"c33603a2"},{"t":"`1 + tan^2x = sec^2x`","why":"Divide `sin^2x + cos^2x = 1` by `cos^2x`: `tan^2x + 1 = sec^2x`.","_n":"1yad2","_k":"59957f1b"},{"t":"`1 + tan^2x = csc^2x`","why":"tan pairs with sec. At `x = π/3`: 1 + 3 = 4, but `csc^2(π/3) = 4/3`.","_n":"1zae2","_k":"2edd6d92"}]},"b":{"prompt":"Which statement is an identity?","options":[{"t":"`csc^2x + cot^2x = 1`","why":"At `x = π/4`: 2 + 1 = 3, not 1. The identity is `csc^2x - cot^2x = 1`.","_n":"20af2","_k":"f5d2d352"},{"t":"`1 + cot^2x = csc^2x`","why":"Divide `sin^2x + cos^2x = 1` by `sin^2x`: `1 + cot^2x = csc^2x`.","_n":"21b02","_k":"3de43f67"},{"t":"`cot^2x - 1 = csc^2x`","why":"At `x = π/2` the left side is −1 and the right side is 1.","_n":"22b12","_k":"8f322172"},{"t":"`1 + cot^2x = sec^2x`","why":"cot pairs with csc. At `x = π/6`: 1 + 3 = 4, but `sec^2(π/6) = 4/3`.","_n":"23b22","_k":"0c687b4c"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"You are proving `tan x sin x + cos x = sec x`. Which step is \u003cstrong>not\u003c/strong> allowed?","options":[{"t":"Rewrite `tan x` on the left side as `sin x/cos x`.","why":"That’s allowed: the quotient identity replaces `tan x` with an expression equal to it wherever `tan x` is defined.","_n":"24b32","_k":"dd743c2e"},{"t":"Rewrite `sec x` on the right side as `1/cos x`.","why":"That’s allowed: you may work on the right side too, as long as you work on it alone.","_n":"25b42","_k":"97cc4b6c"},{"t":"Multiply both sides by `cos x`.","why":"That’s an equation move: it treats the two sides as already equal. In a proof you work on each side on its own.","_n":"26b52","_k":"a541a425"},{"t":"Write the left side over the common denominator `cos x`.","why":"That’s allowed: combining fractions doesn’t change the value.","_n":"27c64","_k":"d204ceed"}]},"b":{"prompt":"You are proving `(1 - cos^2x) csc x = sin x`. Which step is \u003cstrong>not\u003c/strong> allowed?","options":[{"t":"Replace `1 - cos^2x` on the left side with `sin^2x`.","why":"That’s allowed: it’s the Pythagorean identity.","_n":"28c54","_k":"7c03ae85"},{"t":"Rewrite `csc x` on the left side as `1/sin x`.","why":"That’s allowed: it’s the reciprocal identity.","_n":"29c84","_k":"dccbaa31"},{"t":"Expand the left side to `csc x - cos^2x csc x`.","why":"That’s allowed, though it isn’t the quickest route: expanding doesn’t change the value.","_n":"2ac74","_k":"5d0ed16e"},{"t":"Square both sides.","why":"Squaring both sides is an equation move, and it can make a false claim look true. Work on one side at a time.","_n":"2bc24","_k":"29196627"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"`tan x = sin x/cos x` is an identity. For `0 ≤ x ≤ 2π`, at which values of `x` are its sides undefined?","options":[{"t":"Nowhere: an identity is true for every real `x`.","why":"An identity is true for every `x` where both sides are \u003cstrong>defined\u003c/strong>. Here that leaves out `π/2` and `3π/2`.","_n":"2cc14","_k":"af0502ae"},{"t":"`x = π/2` and `x = 3π/2`","why":"Both sides need `cos x ≠ 0`, and `cos x = 0` at `π/2` and `3π/2`.","_n":"2dc44","_k":"c173cd0b"},{"t":"`x = π/2` only","why":"`cos x` is also 0 at `3π/2`.","_n":"2ec34","_k":"b4b7070e"},{"t":"`x = 0`, `π` and `2π`","why":"Those are where `sin x = 0`, which is where `cot x = cos x/sin x` is undefined.","_n":"2fbe4","_k":"a5d09898"}]},"b":{"prompt":"`cot x = cos x/sin x` is an identity. For `0 ≤ x ≤ 2π`, at which values of `x` are its sides undefined?","options":[{"t":"`x = π/2` and `3π/2`","why":"Those are where `cos x = 0`, which is where `tan x` is undefined.","_n":"2gbd4","_k":"d630823c"},{"t":"`x = π` only","why":"`sin x` is also 0 at 0 and 2π.","_n":"2hc04","_k":"d1abd400"},{"t":"`x = 0`, `π` and `2π`","why":"Both sides need `sin x ≠ 0`, and `sin x = 0` at 0, π and 2π.","_n":"2ic14","_k":"1cc4fcab"},{"t":"Nowhere: an identity is true for every real `x`.","why":"An identity is true for every `x` where both sides are \u003cstrong>defined\u003c/strong>. Here that leaves out 0, π and 2π.","_n":"2jbe4","_k":"d0492054"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"To prove `{cos x}/{1 - sin x} = {1 + sin x}/{cos x}`, which first step on the left side is legal \u003cstrong>and\u003c/strong> leads to the right side?","options":[{"t":"Split the fraction into `{cos x}/{1} - {cos x}/{sin x}`.","why":"A fraction splits over a sum on top, never on the bottom. At `x = π/6` the left side is `√3`, but `cos(π/6) - {cos(π/6)}/{sin(π/6)} = -√3/2`.","_n":"2kbf4","_k":"dd810592"},{"t":"Multiply both sides by `cos x(1 - sin x)`.","why":"That’s cross-multiplying, an equation move. It assumes the sides are already equal.","_n":"2lc44","_k":"2bce72a0"},{"t":"Multiply the top and bottom by `1 + sin x`.","why":"That multiplies by 1, so it’s legal, and it brings in a Pythagorean identity: `{cos x(1 + sin x)}/{1 - sin^2x} = {cos x(1 + sin x)}/{cos^2x} = {1 + sin x}/{cos x}`.","_n":"2mc54","_k":"e7c6d7cb"},{"t":"Replace `cos x` on top with `1 - sin x`.","why":"`cos^2x = 1 - sin^2x` has squares; without them it’s false. At `x = π/6`, `cos x = √3/2` but `1 - sin x = 1/2`.","_n":"2nc24","_k":"dfc63580"}]},"b":{"prompt":"To prove `{sin x}/{1 + cos x} = {1 - cos x}/{sin x}`, which first step on the left side is legal \u003cstrong>and\u003c/strong> leads to the right side?","options":[{"t":"Replace `sin x` on top with `1 - cos x`.","why":"`sin^2x = 1 - cos^2x` has squares. At `x = π/3`, `sin x = √3/2` but `1 - cos x = 1/2`.","_n":"2oc34","_k":"b283b170"},{"t":"Cross-multiply to get `sin^2x = (1 - cos x)(1 + cos x)`.","why":"Cross-multiplying is an equation move. It assumes the sides are already equal.","_n":"2pb84","_k":"3ced6543"},{"t":"Split the fraction into `{sin x}/{1} + {sin x}/{cos x}`.","why":"A fraction can’t be split over a sum in its bottom. At `x = π/3` the left side is `√3/3`, but `sin(π/3) + tan(π/3) = {3√3}/{2}`.","_n":"2qb94","_k":"63a97db7"},{"t":"Multiply the top and bottom by `1 - cos x`.","why":"`{sin x(1 - cos x)}/{1 - cos^2x} = {sin x(1 - cos x)}/{sin^2x} = {1 - cos x}/{sin x}`.","_n":"2rfcc","_k":"9e46c924"}]}},{"id":"t2","cat":"T","goal":1,"a":{"fixedOrder":true,"prompt":"Which value of `x` is a counterexample showing that `tan x + cot x = 2` is \u003cstrong>not\u003c/strong> an identity?","options":[{"t":"`x = π/6`","why":"`tan(π/6) + cot(π/6) = √3/3 + √3 = {4√3}/{3}`, which isn’t 2, and both sides are defined. One such value is enough.","_n":"2sfdc","_k":"0629f7fe"},{"t":"`x = π/4`","why":"`tan(π/4) + cot(π/4) = 1 + 1 = 2`. The sides are equal there, so it isn’t a counterexample.","_n":"2tfac","_k":"507bbc8b"},{"t":"`x = π/2`","why":"`tan(π/2)` is undefined, so `π/2` is outside the domain. A counterexample needs both sides defined.","_n":"2ufbc","_k":"e67e05b9"},{"t":"`x = 5π/4`","why":"In quadrant 3, tan and cot are both positive: 1 + 1 = 2. Equal again.","_n":"2vf8c","_k":"75719744"}]},"b":{"fixedOrder":true,"prompt":"Which value of `x` is a counterexample showing that `tan x - cot x = 0` is \u003cstrong>not\u003c/strong> an identity?","options":[{"t":"`x = π/4`","why":"1 − 1 = 0: the sides are equal there.","_n":"2wf9c","_k":"342a8be0"},{"t":"`x = π/3`","why":"`tan(π/3) - cot(π/3) = √3 - √3/3 = {2√3}/{3}`, which isn’t 0, and both sides are defined.","_n":"2xf6c","_k":"61efb557"},{"t":"`x = 3π/4`","why":"(−1) − (−1) = 0: equal again.","_n":"2yf7c","_k":"e9002ab8"},{"t":"`x = π`","why":"`cot π` is undefined (`sin π = 0`), so π is outside the domain.","_n":"2z04c","_k":"f194bb36"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Which expression equals `{1 - cos 2x}/{sin 2x}` for every `x` where both are defined?","options":[{"t":"`cot x`","why":"That comes from `cos 2x = 1 - 2cos^2x`, which is the wrong form (it equals `-cos 2x`). At `x = π/6` the fraction is `{1/2}/{√3/2} = √3/3 = tan(π/6)`, not `cot(π/6) = √3`.","_n":"3005c","_k":"968f7e92"},{"t":"`tan x`","why":"`1 - cos 2x = 1 - (1 - 2sin^2x) = 2sin^2x`, and `sin 2x = 2 sin x cos x`. So the fraction is `{2sin^2x}/{2 sin x cos x} = {sin x}/{cos x} = tan x`.","_n":"3102c","_k":"e7d5b0e3"},{"t":"`-tan x`","why":"`1 - (1 - 2sin^2x) = 1 - 1 + 2sin^2x = +2sin^2x`: the minus sign changes both terms in the bracket.","_n":"3201c","_k":"13671ea8"},{"t":"`2 tan x`","why":"That forgets the 2 in `sin 2x = 2 sin x cos x`: the bottom becomes `sin x cos x`, and `{2sin^2x}/{sin x cos x} = 2 tan x`.","_n":"3304c","_k":"65ea9d84"}]},"b":{"prompt":"Which expression equals `{sin 2x}/{1 - cos 2x}` for every `x` where both are defined?","options":[{"t":"`tan x`","why":"That comes from the wrong form `cos 2x = 1 - 2cos^2x`. At `x = π/6` the fraction is `{√3/2}/{1/2} = √3 = cot(π/6)`.","_n":"3403c","_k":"68cbd81c"},{"t":"`-cot x`","why":"`1 - (1 - 2sin^2x) = +2sin^2x`: the minus sign changes both terms in the bracket.","_n":"3506c","_k":"9680ea10"},{"t":"`cot x`","why":"`{sin 2x}/{1 - cos 2x} = {2 sin x cos x}/{2sin^2x} = {cos x}/{sin x} = cot x`.","_n":"3605c","_k":"52fb809b"},{"t":"`{1}/{2} cot x`","why":"That forgets the 2 in `sin 2x = 2 sin x cos x`: the top becomes `sin x cos x`, and `{sin x cos x}/{2sin^2x} = {1}/{2} cot x`.","_n":"3708c","_k":"c207dc2c"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is a correctly written proof that `csc x - sin x = cos x cot x`?","options":[{"t":"“At `x = π/6`, LS = 2 − 1/2 = 3/2 and RS = `(√3/2)(√3) = 3/2`. The sides are equal, so it’s an identity.”","why":"The values are right, but one value can agree by coincidence. This checks `π/6`; it doesn’t prove every `x`.","_n":"3807c","_k":"5ce44a34"},{"t":"“LS = `{1}/{sin x} - sin x = {1 - sin^2x}/{sin x} = {cos^2x}/{sin x} = cos x · {cos x}/{sin x} = cos x cot x` = RS. Therefore LS = RS.”","why":"It works on the left side alone, every line is a legal rewrite, and it ends by showing LS = RS.","_n":"39fac","_k":"090e053a"},{"t":"“Multiply both sides by `sin x`: `1 - sin^2x = cos^2x`, so `cos^2x = cos^2x`. This is true, so the identity is proved.”","why":"It starts from the statement it’s trying to prove and changes both sides. That’s solving an equation, not proving an identity.","_n":"3af9c","_k":"e6ce2b9d"},{"t":"“RS = `cos x · {cos x}/{sin x} = {cos^2x}/{sin x}`. Since `cos^2x = 1 - sin^2x`, LS = RS.”","why":"The left side is never rewritten, so the proof never shows that `csc x - sin x` equals `{cos^2x}/{sin x}`. Each side must be carried to the same expression.","_n":"3bf0c","_k":"a996d07f"}]},"b":{"prompt":"Which is a correctly written proof that `sin x + cos x cot x = csc x`?","options":[{"t":"“LS = `sin x + cos x · {cos x}/{sin x} = sin x + {cos^2x}/{sin x} = {sin^2x + cos^2x}/{sin x} = {1}/{sin x} = csc x` = RS. Therefore LS = RS.”","why":"It works on the left side alone, every line is a legal rewrite, and it ends by showing LS = RS.","_n":"3cf1c","_k":"c7633ef0"},{"t":"“Multiply both sides by `sin x`: `sin^2x + cos^2x = 1`, so 1 = 1. This is true, so the identity is proved.”","why":"It starts from the statement it’s trying to prove and changes both sides. That’s solving an equation, not proving an identity.","_n":"3df2c","_k":"14103e1b"},{"t":"“At `x = π/6`, LS = `1/2 + (√3/2)(√3) = 2` and RS = 2. The sides are equal, so it’s an identity.”","why":"The values are right, but one value can agree by coincidence. This checks `π/6`; it doesn’t prove every `x`.","_n":"3ef3c","_k":"46c7a1cf"},{"t":"“RS = `{1}/{sin x} = {sin^2x + cos^2x}/{sin x}`. Since `cot x = cos x/sin x`, LS = RS.”","why":"The left side is never rewritten, so the proof never shows that `sin x + cos x cot x` equals `{sin^2x + cos^2x}/{sin x}`. Each side must be carried to the same expression.","_n":"3ff4c","_k":"d45a9067"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Emma says: “`sin(x + π/6) = sin x + sin(π/6)` is an identity, because it’s true when `x = 0`.” Which is the best response?","options":[{"t":"“It is an identity, but only for `x = 0`.”","why":"“Identity” means every `x`. A claim that’s true only at some `x` is an equation with those solutions.","_n":"3gf5c","_k":"29cf7e13"},{"t":"“It isn’t an identity, because the two sides look different.”","why":"The conclusion is right, but the reason isn’t: `sin^2x + cos^2x` and 1 look different and are identical. You need a counterexample.","_n":"3hf6c","_k":"53c2275b"},{"t":"“It is an identity, because sine can be split over a sum.”","why":"Sine isn’t a multiplier, so it doesn’t split: `sin(π/2 + π/2) = 0`, but `sin(π/2) + sin(π/2) = 2`.","_n":"3if7c","_k":"61acdd17"},{"t":"“An identity has to be true for every `x` where both sides are defined. At `x = π/3` the left side is 1, but the right side is `√3/2 + 1/2`, so it isn’t an identity.”","why":"This says what an identity is and gives one counterexample, which is all it takes.","_n":"3jf8c","_k":"c49cf8dc"}]},"b":{"prompt":"Jun says: “`cos(x - π/2) = cos x - cos(π/2)` is an identity, because it’s true when `x = π/4`.” Which is the best response?","options":[{"t":"“It is an identity, but only for `x = π/4`.”","why":"“Identity” means every `x`. A claim that’s true only at some `x` is an equation with those solutions.","_n":"3kf9c","_k":"2f26f8b3"},{"t":"“An identity has to be true for every `x` where both sides are defined. At `x = 0` the left side is 0, but the right side is 1, so it isn’t an identity.”","why":"This says what an identity is and gives one counterexample, which is all it takes.","_n":"3lf6c","_k":"6d27463c"},{"t":"“It is an identity, because cosine can be split over a subtraction.”","why":"Cosine doesn’t split: `cos(π/2 - π/2) = cos 0 = 1`, but `cos(π/2) - cos(π/2) = 0`.","_n":"3mf5c","_k":"2f98b65d"},{"t":"“It isn’t an identity, because the two sides look different.”","why":"The conclusion is right, but the reason isn’t: different-looking sides can be identical. You need a counterexample.","_n":"3nf4c","_k":"2f527a3f"}]}},{"id":"a1" e wheel. `d` is the straight-line distance.","_n":"437cd","_k":"2051fa52"}]}}]},"task":{"title":"Flatten the wave","summary":"Flatten the wave","statement":"\u003cp>Choose integers `p`, `q` and `r` from −6 to 6 so that the graph of `y = p sin^2x + q cos^2x + r cos 2x` is the horizontal line `y = 3`, with `p ≠ q`. There are six answers. Can you find them all?\u003c/p>","checks":["`p`, `q` and `r` are integers from −6 to 6","`p` and `q` are different","The graph is flat: the same height at every `x`","The graph passes through `(π/4, 3)`"],"tips":["Use integers from −6 to 6 in every box.","With `p = q` the expression is `p(sin^2x + cos^2x) + r cos 2x`. That uses only the Pythagorean identity. Make `p` and `q` different, so `cos 2x` has work to do.","Your graph still waves, from {min} to {max}. Rewrite `sin^2x` and `cos^2x` using `cos 2x = 1 - 2sin^2x = 2cos^2x - 1`. What must `r` be to cancel every `cos 2x`?","Your graph is flat, but at height {v}, not 3. At `x = π/4`, `sin^2x = cos^2x = 1/2` and `cos 2x = 0`. What does that tell you about `p + q`?"],"ui":{"hi":"Highest value: {max}. Lowest value: {min}.","empty":"Enter `p`, `q` and `r` to see your graph.","target":"target `y = 3`","minus":"Decrease","plus":"Increase"},"explainPrompt":"Prove, in left side / right side form, that your expression equals 3 for every `x`.","vocab":"Use the words double-angle identity, Pythagorean identity and left side.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","all6":"You found all six. In every one, `p + q = 6` and `r = (p - q)/2`. Your proof in the box below shows why."},"cards":[["Identity","An equation that is true for every value of `x` where both sides are defined. Example: `sin^2x + cos^2x = 1`."],["Counterexample","One `x` where both sides are defined but not equal. One is enough to show a claim is not an identity. Example: `x = π/2` for `sin 2x = 2 sin x` (0 ≠ 2)."],["The reciprocal identities","`csc x = 1/sin x`, `sec x = 1/cos x`, `cot x = 1/tan x`"],["The quotient identities","`tan x = sin x/cos x` and `cot x = cos x/sin x`"],["The Pythagorean identities","`sin^2x + cos^2x = 1`; `1 + tan^2x = sec^2x`; `1 + cot^2x = csc^2x`. The last two come from dividing the first by `cos^2x` or `sin^2x`."],["The double-angle identities","`sin 2x = 2 sin x cos x`; `cos 2x = cos^2x - sin^2x = 2cos^2x - 1 = 1 - 2sin^2x`"],["The compound-angle identities","`sin(a ± b) = sin a cos b ± cos a sin b`; `cos(a ± b) = cos a cos b ∓ sin a sin b`"],["The LS/RS proof format","Write “LS = …” and rewrite the left side alone (or each side separately) until both sides are the same expression. Finish with “LS = RS”."],["Why not do the same thing to both sides?","It assumes the sides are already equal. Squaring both sides of `cos x = √{1 - sin^2x}` gives a true identity, yet the original is false at `x = π` (−1 ≠ 1)."],["Good first moves in a proof","Rewrite in sine and cosine; combine fractions; expand double angles; swap `1 - sin^2x`, `1 - cos^2x` or `sec^2x - 1` using a Pythagorean identity; multiply by a conjugate."],["The conjugate trick","`(1 - sin x)(1 + sin x) = 1 - sin^2x = cos^2x`. Multiply the top and bottom by the conjugate to bring in a Pythagorean identity."],["Restrictions","An identity holds only where both sides are defined. `tan x cos x = sin x` leaves out `π/2` and `3π/2` (in `0 ≤ x ≤ 2π`). An `x` where a side is undefined is not a counterexample."]]}};</script>
