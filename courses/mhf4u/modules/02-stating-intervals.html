.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 02: hero number lines, detective axis strip */
.hero-nl canvas.plot{margin-top:4px}
.hero-forms{font:400 1.15rem var(--font-math);text-align:center;min-height:1.6em;margin:6px 0 12px;max-width:none}
.hero-forms .m{white-space:normal}
.hf{opacity:0;transition:opacity .6s}
.hf.on{opacity:1}
.dt-strip{display:flex;gap:4px;overflow-x:auto;align-items:stretch;padding:2px 2px 6px}
.dt-st{flex:1 0 auto;min-width:56px;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.45em .5em;font-size:.82rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.dt-st[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);color:var(--ink)}
.dt-st:not(:disabled):hover{border-color:var(--pen)}
.dt-pt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;border:1.5px dashed var(--ink-2);background:var(--paper);border-radius:6px;padding:.2em .25em;font-size:.78rem;line-height:1.15}
.dt-pt b{font-size:1rem;color:var(--pen)}
.dt-pt:disabled{opacity:.4;border-style:dotted}
.dt-pt[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}

</style>

ug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"68044b54","content":{"id":"02-stating-intervals","kind":"topic","title":"Stating intervals","topic":"Stating Intervals","readyTopic":"stating intervals","hero":{"eq":"`(-2, 5]`","eqLabel":"the interval from negative 2, not included, to 5, included","eqSize":"md","headline":"One set, three ways to write it","text":"Mathematicians describe sets of numbers all the time: where a graph rises, where it’s above the axis, which inputs are allowed. An \u003cstrong>inequality\u003c/strong> (`-2 \u003c x ≤ 5`), \u003cstrong>set notation\u003c/strong> (`{x ∈ ℝ | -2 \u003c x ≤ 5}`) and \u003cstrong>interval notation\u003c/strong> (`(-2, 5]`) all say the same thing. The brackets do the work: a \u003cstrong>square bracket\u003c/strong> includes the endpoint and a \u003cstrong>round bracket\u003c/strong> leaves it out.","fig":{"html":"\u003cdiv class=\"hero-nl\">\u003ccanvas class=\"plot nl\" id=\"hero-nl1\" role=\"img\" aria-label=\"Number line with an open dot at negative 2, a closed dot at 5 and the segment between them shaded\">\u003c/canvas>\u003cp class=\"hero-forms\" id=\"hero-f1\" aria-live=\"polite\">\u003c/p>\u003ccanvas class=\"plot nl\" id=\"hero-nl2\" role=\"img\" aria-label=\"Number line with a closed dot at negative 3 shaded to the left, and an open dot at 1 shaded to the right\">\u003c/canvas>\u003cp class=\"hero-forms\" id=\"hero-f2\" aria-live=\"polite\">\u003c/p>\u003c/div>"}},"goals":["I can translate between an inequality, set notation and interval notation, including pieces joined with ∪.","I can choose round or square brackets correctly, including at ±∞.","I can read from a graph the intervals where a function is increasing or decreasing.","I can read from a graph the intervals where a function is positive or negative.","I can state the domain and range of a graph that has open or closed endpoints.","I can combine conditions (for example “increasing and positive”) and work backwards from intervals to a graph."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Inequalities on a number line","goal":2,"prompt":"A number line has an open dot at 3, with shading from the dot to the left. Which inequality does it show?","options":[{"t":"`x ≤ 3`","why":"An open dot means the endpoint is \u003cstrong>not\u003c/strong> in the set. A closed (filled) dot would mean ≤.","_n":"0468","_k":"d904cf02"},{"t":"`x ≥ 3`","why":"This has the direction and the dot both reversed. Left of 3 means smaller than 3; an open dot means 3 is left out.","_n":"1478","_k":"26689a2a"},{"t":"`x \u003c 3`","why":"The open dot means 3 itself is left out, and the shading goes left, toward smaller numbers.","_n":"2488","_k":"647943b9"},{"t":"`x > 3`","why":"Shading to the left covers the numbers \u003cstrong>smaller\u003c/strong> than 3, like 2, 0 and −5.","_n":"3498","_k":"c82d8f96"}],"hints":["Ask two questions: which way does the shading go, and is the dot filled in?","Shading to the left means smaller numbers. An open dot means the endpoint isn’t included.","Smaller than 3, not including 3: `x \u003c 3`."]},{"id":"w2","skill":"Inequalities on a number line","goal":1,"prompt":"Which list gives \u003cstrong>every\u003c/strong> integer that satisfies `-2 \u003c x ≤ 1`?","options":[{"t":"−2, −1, 0","why":"This includes −2 but leaves out 1. The inequality says the opposite: `-2 \u003c x` excludes −2 and `x ≤ 1` includes 1.","_n":"44a8","_k":"8c9d9831"},{"t":"−1, 0, 1","why":"−2 is left out (the \u003c is strict) and 1 is included (≤). The integers in between are −1 and 0.","_n":"54b8","_k":"f6635e58"},{"t":"−1, 0","why":"`x ≤ 1` includes 1. Only the strict sign (\u003c) leaves its endpoint out.","_n":"64c8","_k":"efb2aac9"},{"t":"−2, −1, 0, 1","why":"`-2 \u003c x` means `x` must be bigger than −2, so −2 itself doesn’t count.","_n":"73d8","_k":"fdfdb3a6"}],"hints":["Check each end separately: is the sign strict (\u003c) or not (≤)?","`-2 \u003c x`: −2 is left out. `x ≤ 1`: 1 is included.","The integers bigger than −2 and up to 1 are −1, 0 and 1."]},{"id":"w3","skill":"Solving linear inequalities","goal":1,"prompt":"Solve `5 - 2x > 11`.","options":[{"t":"`x > 3`","why":"The term is `-2x`, not `2x`. Test `x = 4`: 5 − 8 = −3, which isn’t greater than 11.","_n":"83e8","_k":"20b2714c"},{"t":"`x > -3`","why":"Dividing both sides by −2 reverses the inequality. Test `x = 0`: 5 > 11 is false, so `x > -3` can’t be right.","_n":"9dd3","_k":"d58ce7a8"},{"t":"`x \u003c -3`","why":"Subtract 5: `-2x > 6`. Divide by −2 and flip the sign: `x \u003c -3`. Check `x = -4`: 5 + 8 = 13 > 11.","_n":"adc3","_k":"b1a15770"},{"t":"`x \u003c -8`","why":"Moving the 5 means subtracting it from both sides: `-2x > 11 - 5 = 6`, not 16.","_n":"bdb3","_k":"a6ec38d5"}],"hints":["Get `-2x` alone first, then divide.","Subtract 5 from both sides: `-2x > 6`. What happens to the sign when you divide by a negative?","Dividing by −2 flips > to \u003c: `x \u003c -3`."]},{"id":"w4","skill":"Domain and range","goal":5,"prompt":"What is the range of `y = x^2 - 4`?","options":[{"t":"`{y ∈ ℝ | y ≥ 4}`","why":"The vertex is (0, −4). The graph goes down to −4, below the `x`-axis.","_n":"cda3","_k":"9ea224b3"},{"t":"`{x ∈ ℝ}`","why":"That’s the domain: every `x` is allowed. The range is about the `y`-values the graph reaches.","_n":"de13","_k":"ad27beb7"},{"t":"`{y ∈ ℝ | y ≥ -4}`","why":"`x^2` is never negative, so the smallest `y` is 0 − 4 = −4, at `x = 0`. Every value above −4 is reached too.","_n":"ee03","_k":"fbe69060"},{"t":"`{y ∈ ℝ | y ≤ -4}`","why":"The coefficient of `x^2` is +1, so the parabola opens up. −4 is its lowest point, not its highest.","_n":"fdf3","_k":"00e79115"}],"hints":["What’s the smallest value `x^2` can be?","`x^2 ≥ 0`, so `x^2 - 4 ≥ -4`. Does the parabola open up or down?","It opens up with lowest point (0, −4), so the range is `{y ∈ ℝ | y ≥ -4}`."]},{"id":"w5","skill":"Domain and range","goal":5,"prompt":"A graph is a single straight segment from a closed dot at (−3, 2) to an open dot at (4, −1). What is its domain?","options":[{"t":"`{x ∈ ℝ | -3 ≤ x \u003c 4}`","why":"The `x`-values run from −3 (closed dot, included) to 4 (open dot, left out).","_n":"gde3","_k":"0fb058f0"},{"t":"`{x ∈ ℝ | -3 \u003c x ≤ 4}`","why":"The closed dot is at `x = -3`, so −3 is included; the open dot at `x = 4` leaves 4 out.","_n":"hd53","_k":"2add4a90"},{"t":"`{x ∈ ℝ | -3 ≤ x ≤ 4}`","why":"The open dot at (4, −1) means the graph stops just before `x = 4`, so 4 is not in the domain.","_n":"id43","_k":"779ab3a8"},{"t":"`{x ∈ ℝ | -1 \u003c x ≤ 2}`","why":"−1 and 2 are the `y`-coordinates. That’s the range. The domain uses the `x`-coordinates.","_n":"j633","_k":"d5ee0cf6"}],"hints":["The domain is the set of `x`-values the graph covers. Look at the `x`-coordinates of the two ends.","The ends are at `x = -3` (closed) and `x = 4` (open).","From −3, included, up to 4, not included: `{x ∈ ℝ | -3 ≤ x \u003c 4}`."]},{"id":"w6","skill":"Reading a graph","goal":3,"prompt":"The graph of `y = (x - 1)^2 - 4` is shown (vertex (1, −4), zeros −1 and 3). For which `x`-values does the graph go \u003cstrong>down\u003c/strong> as you move to the right?\u003ccanvas class=\"plot\" data-fig=\"w6\" role=\"img\" aria-label=\"Parabola opening up with vertex (1, negative 4) and zeros at negative 1 and 3\">\u003c/canvas>","options":[{"t":"`x \u003c 1`","why":"Left of the vertex, the parabola falls as you move right. After `x = 1` it rises.","_n":"k643","_k":"e00bfa93"},{"t":"`y > -4`","why":"The question asks for `x`-values: where along the horizontal axis the graph is falling.","_n":"l613","_k":"59526382"},{"t":"`x > 1`","why":"Right of the vertex the parabola rises. Trace it with your finger from left to right.","_n":"m623","_k":"1c60a070"},{"t":"`-1 \u003c x \u003c 3`","why":"Between the zeros the graph is \u003cstrong>below\u003c/strong> the axis, but it falls only until `x = 1` and then rises.","_n":"n5f3","_k":"ae134806"}],"hints":["Imagine walking along the graph from left to right. Where are you walking downhill?","The lowest point is the vertex (1, −4). You walk downhill until you reach it.","The graph falls for every `x` less than 1: `x \u003c 1`."]}],"refreshers":{"Inequalities on a number line":"A closed dot means the endpoint is included (≤ or ≥); an open dot means it’s left out (\u003c or >). The shading shows which side: left for smaller numbers, right for bigger ones. Example: `-2 \u003c x ≤ 1` has an open dot at −2, a closed dot at 1, and shading between them.","Solving linear inequalities":"Solve like an equation, with one extra rule: multiplying or dividing both sides by a negative number reverses the sign. Example: `-2x > 6` becomes `x \u003c -3`. Check with a test value: `x = -4` gives 8 > 6, which is true.","Domain and range":"The domain is every `x`-value the graph covers; the range is every `y`-value. Look at the ends of the graph and at its highest and lowest points. A closed dot includes its value; an open dot leaves it out. Example: a segment from a closed dot at (−3, 2) to an open dot at (4, −1) has domain `-3 ≤ x \u003c 4`.","Reading a graph":"Read graphs from left to right. Going up means increasing; going down means decreasing. Above the `x`-axis means positive; below means negative. These are four different questions, and each answer is a set of `x`-values."}}},"explore":{"heading":"Interval builder","intro":"Drag the endpoints, choose open or closed, and watch the three notations change together. Add a second piece, or switch to “Everything else” to see the numbers left out.","predIntro":"Make a prediction first. Then the builder will show you what really happens.","predictions":[{"id":"p1","start":{"pieces":[{"a":-2,"b":5,"aIn":true,"bIn":false}]},"prompt":"The right handle will be dragged off the end of the line, to ∞. What will the interval notation become?","options":[{"t":"`[-2, ∞)`","_n":"o603","_k":"76b687e3"},{"t":"`(-∞, -2]`","_n":"p5d3","_k":"acc94e5e"},{"t":"`(-2, ∞)`","_n":"q5e3","_k":"1360cb42"},{"t":"`[-2, ∞]`","_n":"r5b3","_k":"db09a9f6"}],"explain":"Only the right end changed. −2 is still included, so its square bracket stays. ∞ isn’t a number the set can reach, so it always takes a round bracket. `[-2, ∞]` would claim ∞ is in the set, and `(-∞, -2]` is the numbers on the other side."},{"id":"p2","start":{"pieces":[{"a":-5,"b":1,"aIn":false,"bIn":false,"aInf":true,"bInf":false},{"a":3,"b":7,"aIn":false,"bIn":false,"aInf":false,"bInf":true}]},"prompt":"The second piece’s left handle will slide from 3 down to 1 and be set to closed. What will the set be?","options":[{"t":"`(-∞, 1) ∪ (1, ∞)`","_n":"s5c3","_k":"a6954faa"},{"t":"The pieces overlap, so the set is empty","_n":"t493","_k":"624c6910"},{"t":"`(-∞, 1) ∪ [1, ∞)`, which can’t be simplified","_n":"u483","_k":"844160f8"},{"t":"Every real number, `(-∞, ∞)`","_n":"v4b3","_k":"4ee8e17e"}],"explain":"The first piece gives every number below 1, and the second now starts at 1 and includes it. Together they cover every real number with no gap, so the set is `(-∞, ∞)`, all of ℝ. If both pieces were open at 1, the value 1 would be missing."},{"id":"p3","start":{"pieces":[{"a":-3,"b":4,"aIn":false,"bIn":true}]},"prompt":"Switch to “Everything else”. What is the set of numbers \u003cstrong>not\u003c/strong> in `(-3, 4]`?","options":[{"t":"`(-∞, -3) ∪ [4, ∞)`","_n":"w4a3","_k":"dfb275ff"},{"t":"`(-∞, -3) ∪ (4, ∞)`","_n":"x4d3","_k":"90dd5e61"},{"t":"`(-∞, -3] ∪ (4, ∞)`","_n":"y4c3","_k":"b47fbcf8"},{"t":"`(-∞, -3] ∩ (4, ∞)`","_n":"z4f3","_k":"2bd6b299"}],"explain":"−3 wasn’t in the set, so it belongs to everything else: closed. 4 was in the set, so it’s left out of everything else: open. Every endpoint flips. The two outside pieces are joined with ∪, because a number is in one piece \u003cstrong>or\u003c/strong> the other. ∩ would ask for numbers in both, and there are none."},{"id":"p4","start":{"pieces":[{"a":-3,"b":3,"aIn":false,"bIn":false,"aInf":true,"bInf":true}]},"prompt":"A tool will punch out the single value 2. How do you write what’s left?","options":[{"t":"`(-∞, ∞)`, since one number doesn’t matter","_n":"104e3","_k":"a92cad57"},{"t":"`(-∞, 2) ∪ (2, ∞)`","_n":"11513","_k":"9ae55466"},{"t":"`(-∞, 2) ∩ (2, ∞)`","_n":"12503","_k":"2974702f"},{"t":"`(-∞, 2] ∪ [2, ∞)`","_n":"134f3","_k":"b36d868f"}],"explain":"Leaving out one value splits the line into two pieces that touch at an open dot. Square brackets at 2 would put 2 back in. You’ll meet this shape again in module 17, where a function like `y = 1/(x - 2)` has domain `{x ∈ ℝ | x ≠ 2}`."}],"chalIntro":"Set the builder, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build the set of numbers that are \u003cstrong>at least −4 but less than 6\u003c/strong>.","why":"“At least −4” is −4 ≤ `x` (closed) and “less than 6” is `x \u003c 6` (open): `[-4, 6)`.","hints":["“At least” means ≥. “Less than” means \u003c.","`-4 ≤ x \u003c 6`: closed at −4, open at 6.","Drag the handles to −4 and 6. Set −4 to closed and 6 to open: `[-4, 6)`."]},{"id":"tc2","goal":[1,2],"prompt":"Build the set whose “Everything else” is \u003cstrong>`[-1, 4)`\u003c/strong>. (The check looks at the set itself.)","why":"−1 is in `[-1, 4)`, so it’s left out of your set; 4 isn’t, so it’s in your set: `(-∞, -1) ∪ [4, ∞)`.","hints":["Your set is everything to the left of −1 and everything from 4 on. What happens at each endpoint?","Each endpoint belongs to exactly one of the two sets. −1 is in `[-1, 4)`; 4 is not.","So your set leaves out −1 and includes 4: `(-∞, -1) ∪ [4, ∞)`."]},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"Using \u003cstrong>two pieces\u003c/strong> whose endpoints are all \u003cstrong>integers\u003c/strong>, build a set that contains \u003cstrong>exactly\u003c/strong> these integers: −3, −2, 2 and 3. No other integer may be in the set.","why":"Each integer endpoint is closed if you want that integer and open if you don’t. There are 16 answers, such as `[-3, -2] ∪ [2, 3]` and `(-4, -1) ∪ (1, 4)`.","hints":["You need a gap that removes −1, 0 and 1. That means two pieces.","Endpoints must be integers. At each one, ask: do I want this integer? If yes, closed. If no, open.","One answer: `[-3, -2] ∪ [2, 3]`. Another: `(-4, -1) ∪ (1, 4)`. The open dots at −4, −1, 1 and 4 leave those integers out. There are 16 answers in all."]}]},"part3":{"slug":"detective","name":"Detective","heading":"Graph detective","intro":"Each graph comes with four questions. Tap the stretches of the axis that answer the question, then decide at each split point whether it belongs.","blocks":[{"title":"What the split points mean","html":"\u003cp>\u003cstrong>Four rules for split points\u003c/strong>\u003c/p>\u003col>\u003cli>A \u003cstrong>zero\u003c/strong> is never in a positive or negative interval: 0 is neither.\u003c/li>\u003cli>A \u003cstrong>turning point\u003c/strong> is never in an increasing or decreasing interval: there the graph is neither rising nor falling.\u003c/li>\u003cli>A point where the graph \u003cstrong>levels off without turning\u003c/strong> does not split an increasing or decreasing interval.\u003c/li>\u003cli>A \u003cstrong>domain endpoint\u003c/strong> is in the domain if its dot is closed. For the range, check whether any solid point of the graph reaches that height.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Detective’s questions","summary":"Detective’s questions","items":[{"id":"q1","goal":4,"prompt":"On Graph A, is `x = 3` in the positive interval?","choices":[{"t":"Yes","fb":"`f(3) = 0`. Zeros are neither positive nor negative, so 3 is left out, even though the graph is positive on both sides.","_n":"14503","_k":"eddf7f19"},{"t":"No","fb":"Right. `f(3) = 0`: the graph touches the axis there, and 0 isn’t positive.","_n":"15513","_k":"e1adba82"}]},{"id":"q2","goal":3,"prompt":"On Graph B, is `g` increasing on `(-1, 1)`?","choices":[{"t":"Yes","fb":"Right. `g(-1) = -5`, `g(0) = 0` and `g(1) = 3`: it rises the whole way, even though it levels off at 0.","_n":"16523","_k":"c74969fa"},{"t":"No","fb":"Check the values: `g(-1) = -5 \u003c g(0) = 0 \u003c g(1) = 3`. Levelling off for an instant is not turning.","_n":"174b3","_k":"034b8f5f"}]},{"id":"q3","goal":5,"prompt":"On Graph C, is 4 in the range?","choices":[{"t":"Yes","fb":"Right. The open dot misses `y = 4` at `x = 5`, but the solid peak (−1, 4) reaches it.","_n":"184c3","_k":"709248f2"},{"t":"No","fb":"The peak (−1, 4) is a solid point of the graph, so the height 4 is reached.","_n":"194d3","_k":"5b75491f"}]},{"id":"q4","goal":3,"prompt":"On Graph C, should the decreasing interval be written `[-1, 3]`?","choices":[{"t":"Yes","fb":"At `x = -1` and `x = 3` the graph turns. It’s neither rising nor falling there, so the brackets are round: `(-1, 3)`.","_n":"1a4e3","_k":"123f3d3e"},{"t":"No","fb":"Right. −1 and 3 are turning points, so the interval is `(-1, 3)`.","_n":"1b573","_k":"f3048a47"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Same set, different clothes","summary":"Same set, different clothes","instruction":"Sort each description into the box with the same set of numbers.","noun":"description","goal":[1,2],"boxes":[{"id":"b1","label":"`(-∞, 2]`"},{"id":"b2","label":"`[-3, 2)`"},{"id":"b3","label":"`(-3, 2)`"},{"id":"b4","label":"`(-∞, -3) ∪ [2, ∞)`"}],"items":[{"id":"i1","t":"`x ≤ 2`","_a":"FFoBFg==","why":"Every number up to 2, including 2.","goal":[1,2],"wrong":{"b2":"Check the left end: this set has no lower bound, so it runs all the way to −∞.","b3":"Check the left end: this set has no lower bound, so it runs all the way to −∞.","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","`x ≤ 2` is `x ≤ 2`, which is `(-∞, 2]`."]},{"id":"i2","t":"`{x ∈ ℝ | 2 ≥ x}`","_a":"FFoBFg==","why":"2 ≥ `x` is `x ≤ 2` read from the other side.","goal":[1,2],"wrong":{"b2":"Read 2 ≥ `x` as “`x` is at most 2”. There’s no lower bound, so the set runs to −∞.","b3":"Read 2 ≥ `x` as “`x` is at most 2”. There’s no lower bound, so the set runs to −∞.","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Read the inequality starting from `x`.","2 ≥ `x` means `x ≤ 2`: every number up to 2, including 2.","`(-∞, 2]`."]},{"id":"i3","t":"“at most 2”","_a":"FFoBFg==","why":"“At most” means ≤.","goal":[1,2],"wrong":{"b2":"Check the left end: this set has no lower bound, so it runs all the way to −∞.","b3":"Check the left end: this set has no lower bound, so it runs all the way to −∞.","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","“at most 2” is `x ≤ 2`, which is `(-∞, 2]`."]},{"id":"i4","t":"`-3 ≤ x \u003c 2`","_a":"FFoCFg==","why":"Closed at −3, open at 2.","goal":[1,2],"wrong":{"b1":"Check the left end: this set starts at −3, so it doesn’t run to −∞.","b3":"The numbers match, but check each end: is the endpoint included (≤, ≥, closed dot, “at least”, “at most”) or not (\u003c, >, open dot, “not including”)?","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","`-3 ≤ x \u003c 2` is `-3 ≤ x \u003c 2`, which is `[-3, 2)`."]},{"id":"i5","t":"\u003csvg width=\"160\" height=\"30\" viewBox=\"0 0 160 30\" aria-hidden=\"true\" style=\"vertical-align:middle\">\u003cpath d=\"M4 12H156\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003cpath d=\"M10 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M24 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M38 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M52 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M66 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M80 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M94 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M108 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M122 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M136 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M150 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M38 12H108\" stroke=\"var(--pen)\" stroke-width=\"4\"/>\u003ccircle cx=\"38\" cy=\"12\" r=\"4.5\" fill=\"var(--pen)\" stroke=\"var(--pen)\" stroke-width=\"2\"/>\u003ccircle cx=\"108\" cy=\"12\" r=\"4.5\" fill=\"var(--sheet)\" stroke=\"var(--pen)\" stroke-width=\"2\"/>\u003ctext x=\"38\" y=\"28\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">−3\u003c/text>\u003ctext x=\"108\" y=\"28\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">2\u003c/text>\u003c/svg>\u003cspan class=\"vh\">Number line: closed dot at −3, open dot at 2, shaded between\u003c/span>","_a":"FFoCFg==","why":"A closed dot is a square bracket; an open dot is a round one.","goal":[1,2],"wrong":{"b1":"Check the left end: this set starts at −3, so it doesn’t run to −∞.","b3":"The numbers match, but check each end: is the endpoint included (≤, ≥, closed dot, “at least”, “at most”) or not (\u003c, >, open dot, “not including”)?","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","This number line is `-3 ≤ x \u003c 2`, which is `[-3, 2)`."]},{"id":"i6","t":"`{x ∈ ℝ | x ≥ -3 and x \u003c 2}`","_a":"FFoCFg==","why":"Both conditions at once give one piece from −3 (in) to 2 (out).","goal":[1,2],"wrong":{"b1":"Check the left end: this set starts at −3, so it doesn’t run to −∞.","b3":"The numbers match, but check each end: is the endpoint included (≤, ≥, closed dot, “at least”, “at most”) or not (\u003c, >, open dot, “not including”)?","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","`{x ∈ ℝ | x ≥ -3 and x \u003c 2}` is `-3 ≤ x \u003c 2`, which is `[-3, 2)`."]},{"id":"i7","t":"`-3 \u003c x \u003c 2`","_a":"FFoDFg==","why":"Both inequalities are strict, so both ends are open.","goal":[1,2],"wrong":{"b1":"Check the left end: this set starts at −3, so it doesn’t run to −∞.","b2":"The numbers match, but check each end: is the endpoint included (≤, ≥, closed dot, “at least”, “at most”) or not (\u003c, >, open dot, “not including”)?","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","`-3 \u003c x \u003c 2` is `-3 \u003c x \u003c 2`, which is `(-3, 2)`."]},{"id":"i8","t":"“between −3 and 2, not including either”","_a":"FFoDFg==","why":"Neither endpoint is included.","goal":[1,2],"wrong":{"b1":"Check the left end: this set starts at −3, so it doesn’t run to −∞.","b2":"The numbers match, but check each end: is the endpoint included (≤, ≥, closed dot, “at least”, “at most”) or not (\u003c, >, open dot, “not including”)?","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","“between −3 and 2, not including either” is `-3 \u003c x \u003c 2`, which is `(-3, 2)`."]},{"id":"i9","t":"\u003csvg width=\"160\" height=\"30\" viewBox=\"0 0 160 30\" aria-hidden=\"true\" style=\"vertical-align:middle\">\u003cpath d=\"M4 12H156\" stroke=\"currentColor\" stroke-width=\"1.3\"/>\u003cpath d=\"M10 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M24 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M38 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M52 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M66 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M80 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M94 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M108 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M122 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M136 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M150 8V16\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M38 12H108\" stroke=\"var(--pen)\" stroke-width=\"4\"/>\u003ccircle cx=\"38\" cy=\"12\" r=\"4.5\" fill=\"var(--sheet)\" stroke=\"var(--pen)\" stroke-width=\"2\"/>\u003ccircle cx=\"108\" cy=\"12\" r=\"4.5\" fill=\"var(--sheet)\" stroke=\"var(--pen)\" stroke-width=\"2\"/>\u003ctext x=\"38\" y=\"28\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">−3\u003c/text>\u003ctext x=\"108\" y=\"28\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">2\u003c/text>\u003c/svg>\u003cspan class=\"vh\">Number line: open dots at −3 and 2, shaded between\u003c/span>","_a":"FFoDFg==","why":"Two open dots: two round brackets.","goal":[1,2],"wrong":{"b1":"Check the left end: this set starts at −3, so it doesn’t run to −∞.","b2":"The numbers match, but check each end: is the endpoint included (≤, ≥, closed dot, “at least”, “at most”) or not (\u003c, >, open dot, “not including”)?","b4":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","This number line is `-3 \u003c x \u003c 2`, which is `(-3, 2)`."]},{"id":"i10","t":"`x \u003c -3` or `x ≥ 2`","_a":"FFoEFg==","why":"Two separate pieces joined by “or”, so ∪.","goal":[1,2],"wrong":{"b1":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece.","b2":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece.","b3":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","`x \u003c -3` or `x ≥ 2` is `x \u003c -3` or `x ≥ 2`, which is `(-∞, -3) ∪ [2, ∞)`."]},{"id":"i11","t":"“every number \u003cstrong>not\u003c/strong> in `[-3, 2)`”","_a":"FFoEFg==","why":"The outside of `[-3, 2)`: −3 was in, so now it’s out; 2 was out, so now it’s in.","goal":[1,2],"wrong":{"b1":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece.","b2":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece.","b3":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Picture `[-3, 2)` on a number line. What’s outside it?","Outside means left of −3 or right of 2. −3 is inside `[-3, 2)`, so it’s not outside; 2 is not inside, so it is outside.","`(-∞, -3) ∪ [2, ∞)`."]},{"id":"i12","t":"`{x ∈ ℝ | x \u003c -3 or x ≥ 2}`","_a":"FFoEFg==","why":"Set notation for the same two pieces.","goal":[1,2],"wrong":{"b1":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece.","b2":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece.","b3":"“Or” (or “not in”) makes two separate pieces. “And” with two bounds makes one piece."},"hints":["Rewrite the item as an inequality in `x`, smaller number on the left.","Is each endpoint included? Is there one piece or two?","`{x ∈ ℝ | x \u003c -3 or x ≥ 2}` is `x \u003c -3` or `x ≥ 2`, which is `(-∞, -3) ∪ [2, ∞)`."]}]},{"id":"builds","type":"custom","title":"Work backwards from the clues","summary":"Work backwards from the clues","star":true,"goal":[3,4,6],"instruction":"Build each answer on the number line. Some clues take more than one step.","how":"Drag the handles, choose open or closed, add a second piece if you need it, then press Check.","items":[{"id":"r1","goal":4,"clue":"A parabola opens down and has zeros −1 and 5. Build where it’s positive.","_a":"FBDSvKZTGRQDERI=","wrong":{"[−1, 5]":"At the zeros the value is 0, so they’re left out.","(−∞, −1) ∪ (5, ∞)":"That’s where it’s negative. Opening down, it’s above the axis \u003cstrong>between\u003c/strong> the zeros."},"hints":["Opening down, where is the parabola above the axis: between the zeros or outside them?","Between −1 and 5. Are the zeros themselves positive?","The value at each zero is 0, so both ends are open: `(-1, 5)`."]},{"id":"r2","goal":3,"clue":"A parabola opens up and its vertex is (3, −2). Build where it’s decreasing.","_a":"FBDSvKaAvaoaGAMdFg==","wrong":{"(3, ∞)":"Opening up, it falls until the vertex and rises after.","(−∞, −2)":"−2 is the `y`-coordinate of the vertex. Intervals use `x`-values."},"hints":["Picture a parabola opening up. Which side of the vertex goes downhill?","It falls until it reaches the vertex at `x = 3`.","Decreasing on `(-∞, 3)`; the turning point 3 is left out."]},{"id":"r3","goal":4,"star":true,"clue":"A function is defined only for `-6 \u003c x \u003c 4` (open dots at both ends). It’s positive on `(-2, 1)` and has no zeros except −2 and 1. Build where it’s negative.","_a":"FBDSvKZUGRTUsKIGHULXvJwYGAUYQgEdFA==","wrong":{"(−∞, −2) ∪ (1, ∞)":"The function only exists for `-6 \u003c x \u003c 4`.","[−2, 1]":"−2 and 1 are zeros, so they’re left out.","(−6, −2] ∪ [1, 4)":"−2 and 1 are zeros, so they’re left out.","(−2, 1)":"That’s where it’s positive. Where else is the function defined?"},"hints":["Where is the function defined? Where is it positive?","Everywhere in the domain that isn’t positive and isn’t a zero must be negative.","Negative on `(-6, -2) ∪ (1, 4)`: the domain minus `[-2, 1]`."]},{"id":"r4","goal":5,"star":true,"clue":"A function is defined for every `x ≥ -8` except `x = -5`. Build its domain.","_a":"FGPSvKZaGRTUsKIBHULXvJwYGNa88AAYFtq4qh1A","wrong":{"[−8, ∞)":"−5 is excluded. Leaving out one value splits the piece in two.","(−8, −5) ∪ (−5, ∞)":"“Every `x ≥ -8`” includes −8."},"hints":["Start with every `x ≥ -8`. Then remove one value.","Removing −5 splits the piece into two pieces that meet at an open dot.","`[-8, -5) ∪ (-5, ∞)`."]},{"id":"r5","goal":6,"star":true,"clue":"`y = x^2 - 6x + 5`. Build where it is \u003cstrong>both\u003c/strong> decreasing \u003cstrong>and\u003c/strong> positive.","_a":"FBDSvKaAvaoaGAEdFg==","wrong":{"(−∞, 3)":"That’s where it decreases. It’s only positive outside its zeros, 1 and 5.","(−∞, 1) ∪ (5, ∞)":"That’s where it’s positive. Right of 5 it’s rising."},"hints":["Answer two questions separately, then keep only the `x`-values that pass both.","`x^2 - 6x + 5 = (x - 1)(x - 5)`. It opens up, so it decreases on `(-∞, 3)` (the vertex is halfway between the zeros) and is positive on `(-∞, 1) ∪ (5, ∞)`.","Both at once: the overlap of `(-∞, 3)` with `(-∞, 1) ∪ (5, ∞)` is `(-∞, 1)`."]},{"id":"r6","goal":6,"star":true,"clue":"A graph rises from the lower left to a local maximum at `x = -4`, falls to a local minimum at `x = 2`, then rises forever. It meets the `x`-axis only at −6, −1 and 5, crossing each time. Build where it is \u003cstrong>both\u003c/strong> decreasing \u003cstrong>and\u003c/strong> negative.","_a":"FBDSvKZTGRQEERI=","wrong":{"(−4, 2)":"That’s where it decreases. Between −4 and −1 it’s still above the axis.","(−1, 5)":"That’s where it’s negative. From 2 to 5 it’s below the axis but already rising."},"hints":["Sketch it from the description: low on the left, up to a peak at `x = -4`, down to a valley at `x = 2`, then up forever.","It crosses the axis at −6 (going up), at −1 (coming down) and at 5 (going up). So it’s below the axis for `x \u003c -6` and for `-1 \u003c x \u003c 5`.","Decreasing is `(-4, 2)`. Negative is `(-∞, -6) ∪ (-1, 5)`. The overlap is `(-1, 2)`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Mateo","how":"","instruction":"Mateo made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"`f(x) = x^2 - 4x` (graph shown, vertex (2, −4)). State where `f` is negative and where it’s decreasing.","fig":"\u003ccanvas class=\"plot fig-sm\" data-fig=\"e1\" role=\"img\" aria-label=\"Parabola opening up through (0, 0) and (4, 0) with vertex (2, negative 4)\">\u003c/canvas>","steps":["`x^2 - 4x = x(x - 4)`, so the zeros are 0 and 4.","The parabola opens up, so it’s below the `x`-axis between the zeros.","Negative: `[0, 4]`.","The vertex is (2, −4), so `f` falls until `x = 2`.","Decreasing: `(-∞, 2)`."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","","Step 4 is true. The mistake is earlier.","Step 5 is correct. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"Square brackets would include 0 and 4, where `f = 0`. Zero isn’t negative.","_n":"1c583","_k":"fcf907b2"},{"t":"Negative: `(0, 4]`.","why":"4 is a zero too: `f(4) = 16 - 16 = 0`. Both zeros are left out.","_n":"1dd53","_k":"0ed04b1b"},{"t":"Negative: `(-4, 0)`.","why":"−4 and 0 are `y`-values (the vertex’s height and the axis). Intervals use `x`-values.","_n":"1ed43","_k":"3133b65b"},{"t":"Negative: `(0, 4)`, because `f(0) = f(4) = 0`, and 0 isn’t negative.","why":"Zeros are left out of positive and negative intervals.","_n":"1fd33","_k":"cfb8f6f4"}],"hints":["Check every bracket. What is `f` at each endpoint?","`f(0) = 0` and `f(4) = 0`. Is 0 negative?","Step 3 is wrong: the zeros are left out, so the negative interval is `(0, 4)`."]},{"id":"e2","goal":5,"task":"A graph is a single straight segment from an open dot at (−2, 1) to a closed dot at (3, 6). State its domain and range.","steps":["The graph runs from `x = -2` to `x = 3`.","The dot at (−2, 1) is open, so −2 is not in the domain.","Domain: `(-2, 3]`.","The `y`-values run from 1 up to 6.","Range: `[1, 6]`.","So the range is `{y ∈ ℝ | 1 ≤ y ≤ 6}`."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","Step 3 is correct.","Step 4 is true. The question is which ends are included.","","Step 6 copies step 5. The mistake is earlier."],"fixes":[{"t":"Range: `(1, 6]`, because the only point at height 1 is the open dot.","why":"The segment rises steadily, so `y = 1` happens only at the missing point (−2, 1).","_n":"1gd23","_k":"2d16873c"},{"t":"Range: `(-2, 3]`.","why":"That’s the domain again. The range uses `y`-values.","_n":"1hd13","_k":"d1cc2d23"},{"t":"Step 5 is correct as written.","why":"`y = 1` is reached only at (−2, 1), and that point is missing, so 1 is not in the range.","_n":"1id03","_k":"475ba493"},{"t":"Range: `[1, 6)`.","why":"The brackets are swapped: the closed dot (3, 6) means 6 \u003cstrong>is\u003c/strong> reached.","_n":"1jcf3","_k":"c5d05573"}],"hints":["For each end of the range, find the point of the graph at that height. Is it a solid point?","Height 1 occurs only at (−2, 1). What kind of dot is that?","Step 5 is wrong: the open dot leaves 1 out, so the range is `(1, 6]`."]},{"id":"e3","goal":2,"task":"Write `x ≤ -1` or `x > 4` in interval notation.","steps":["`x ≤ -1` is every number from −∞ up to −1, including −1.","That piece is `(-∞, -1]`.","`x > 4` is every number above 4, not including 4: `(4, ∞]`.","Joined: `(-∞, -1] ∪ (4, ∞]`."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","","Step 4 copies step 3’s bracket. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"A square bracket at ∞ would claim ∞ is in the set. ∞ isn’t a number, so it always gets a round bracket.","_n":"1kce3","_k":"e01ab0fd"},{"t":"`(4, ∞)`, and join the pieces with ∩.","why":"“Or” is ∪. ∩ would ask for numbers in both pieces, and there aren’t any.","_n":"1ldd3","_k":"aa45c86a"},{"t":"`(4, ∞)`, because ∞ is not a number the set can include.","why":"∞ always takes a round bracket.","_n":"1mdc3","_k":"3bd6e603"},{"t":"`[4, ∞)`.","why":"`x > 4` is strict, so 4 is left out: round bracket.","_n":"1ndb4","_k":"e12479df"}],"hints":["Look closely at the bracket next to ∞.","Can a set of real numbers include ∞?","Step 3 is wrong: write `(4, ∞)`. The full answer is `(-∞, -1] ∪ (4, ∞)`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the interval builder? Think about P2 (pieces joining) or P3 (“everything else”)."},{"id":"j2","q":"In your own words, why does ∞ always get a round bracket?"},{"id":"j3","q":"Explain to a friend how to decide, at each split point on a graph, whether that `x`-value belongs in the interval."},{"id":"j4","q":"Which do you still mix up: brackets, `x`- vs `y`-values, or increasing vs positive? What will you do to keep them straight?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is `-4 \u003c x ≤ 7` in interval notation?","options":[{"t":"`[-4, 7)`","why":"The brackets are swapped: −4 is the strict end.","_n":"1odc4","_k":"81d3ab07"},{"t":"`[-4, 7]`","why":"That includes −4, but `-4 \u003c x` leaves it out.","_n":"1pd94","_k":"8494a002"},{"t":"`(-4, 7]`","why":"−4 is left out (\u003c), so round; 7 is included (≤), so square.","_n":"1qda4","_k":"74523180"},{"t":"`(-4, 7)`","why":"That leaves out 7, but ≤ includes it.","_n":"1rdf4","_k":"29a03da7"}]},"b":{"prompt":"Which is `-6 ≤ x \u003c 1` in interval notation?","options":[{"t":"`(-6, 1]`","why":"The brackets are swapped: 1 is the strict end.","_n":"1se04","_k":"1f94d49b"},{"t":"`[-6, 1)`","why":"−6 is included (≤), so square; 1 is left out (\u003c), so round.","_n":"1tdd4","_k":"b22be9c0"},{"t":"`[-6, 1]`","why":"That includes 1, but `x \u003c 1` leaves it out.","_n":"1ude4","_k":"d1c7f453"},{"t":"`(-6, 1)`","why":"That leaves out −6, but ≤ includes it.","_n":"1vd34","_k":"30d776ce"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which is `x ≥ -2` in interval notation?","options":[{"t":"`[-2, ∞)`","why":"−2 is included, and ∞ always takes a round bracket.","_n":"1wd44","_k":"83d9b92b"},{"t":"`(-∞, -2]`","why":"That’s `x ≤ -2`, the other direction.","_n":"1xe14","_k":"23e0e4b9"},{"t":"`(-2, ∞)`","why":"≥ includes −2, so it needs a square bracket.","_n":"1ye04","_k":"86eaa4dd"},{"t":"`[-2, ∞]`","why":"∞ can’t be included: always a round bracket.","_n":"1ze34","_k":"f62ad905"}]},"b":{"prompt":"Which is `x \u003c 9` in interval notation?","options":[{"t":"`(-∞, 9)`","why":"Every number below 9; 9 itself is left out.","_n":"20e24","_k":"726d0740"},{"t":"`[-∞, 9)`","why":"−∞ can’t be included: always a round bracket.","_n":"21dd4","_k":"42892b1b"},{"t":"`(9, ∞)`","why":"That’s `x > 9`, the other direction.","_n":"22dc4","_k":"975dbae7"},{"t":"`(-∞, 9]`","why":"\u003c leaves 9 out, so it needs a round bracket.","_n":"23df4","_k":"f0c8abeb"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"The graph of `y = (x + 1)(x - 5)` is shown, with vertex (2, −9). Where is it negative?\u003ccanvas class=\"plot\" data-fig=\"k3a\" role=\"img\" aria-label=\"Parabola opening up with zeros at negative 1 and 5 and vertex (2, negative 9)\">\u003c/canvas>","options":[{"t":"`(-1, 5)`","why":"It opens up, so it’s below the axis between its zeros, −1 and 5. The zeros themselves are left out.","_n":"24de4","_k":"16d6a8dc"},{"t":"`[-1, 5]`","why":"At −1 and 5 the value is 0, which isn’t negative.","_n":"25d94","_k":"06b52e3a"},{"t":"`(-9, 0)`","why":"Those are `y`-values: the heights below the axis. Intervals use `x`-values.","_n":"26d84","_k":"e8b84068"},{"t":"`(-∞, -1) ∪ (5, ∞)`","why":"That’s where it’s positive.","_n":"27c71","_k":"87f6443c"}]},"b":{"prompt":"The graph of `y = -(x - 2)(x + 4)` is shown, with vertex (−1, 9). Where is it positive?\u003ccanvas class=\"plot\" data-fig=\"k3b\" role=\"img\" aria-label=\"Parabola opening down with zeros at negative 4 and 2 and vertex (negative 1, 9)\">\u003c/canvas>","options":[{"t":"`(-∞, -4) ∪ (2, ∞)`","why":"That’s where it’s negative.","_n":"28c81","_k":"4c9528a0"},{"t":"`[-4, 2]`","why":"At −4 and 2 the value is 0, which isn’t positive.","_n":"29c91","_k":"2c02a470"},{"t":"`(0, 9)`","why":"Those are `y`-values. Intervals use `x`-values.","_n":"2aca1","_k":"1f291de0"},{"t":"`(-4, 2)`","why":"It opens down, so it’s above the axis between its zeros, −4 and 2.","_n":"2bcb1","_k":"05fface7"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"No graph is given. On which interval is `f(x) = x^2 + 6x + 5` decreasing?","options":[{"t":"`(-∞, -4)`","why":"−4 is the `y`-coordinate of the vertex, `f(-3) = -4`. Intervals use `x`-values.","_n":"2ccc1","_k":"dd53057c"},{"t":"`(-3, ∞)`","why":"That’s where it rises. An upward parabola falls first, then rises.","_n":"2dcd1","_k":"4475dd68"},{"t":"`(-∞, -3)`","why":"The parabola opens up, with its vertex at `x = -6/2 = -3` (halfway between the zeros −5 and −1). It falls until the vertex.","_n":"2ece1","_k":"5c6bc4eb"},{"t":"`(-5, -1)`","why":"That’s where it’s negative, between the zeros. Negative isn’t the same as decreasing.","_n":"2fcf1","_k":"e259acb4"}]},"b":{"prompt":"No graph is given. On which interval is `g(x) = -x^2 + 4x + 5` increasing?","options":[{"t":"`(-1, 5)`","why":"That’s where it’s positive, between the zeros. Positive isn’t the same as increasing.","_n":"2gd01","_k":"e3c3e482"},{"t":"`(-∞, 2)`","why":"The parabola opens down, with its vertex at `x = 2` (halfway between the zeros −1 and 5). It rises until the vertex.","_n":"2hcd2","_k":"98ceaeda"},{"t":"`(2, ∞)`","why":"That’s where it falls. A downward parabola rises first, then falls.","_n":"2icc2","_k":"a0b241cb"},{"t":"`(-∞, 9)`","why":"9 is the `y`-coordinate of the vertex, `g(2) = 9`. Intervals use `x`-values.","_n":"2jcb2","_k":"5b7d9ead"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"`p(x) = (x + 4)(x - 2)^2` is shown, with a local maximum at (−2, 32) and a local minimum at (2, 0). Where is `p` \u003cstrong>both\u003c/strong> increasing \u003cstrong>and\u003c/strong> positive?\u003ccanvas class=\"plot\" data-fig=\"t2a\" role=\"img\" aria-label=\"Cubic through (negative 4, 0) with a local maximum at (negative 2, 32) and touching the x-axis at (2, 0)\">\u003c/canvas>","options":[{"t":"`(-4, -2) ∪ (2, ∞)`","why":"Increasing: `(-∞, -2) ∪ (2, ∞)`. Positive: `(-4, 2) ∪ (2, ∞)`. The overlap is `(-4, -2) ∪ (2, ∞)`.","_n":"2kca2","_k":"0523ead4"},{"t":"`(-4, -2] ∪ [2, ∞)`","why":"−2 and 2 are turning points, so they can’t be in an increasing interval; and `p(2) = 0`.","_n":"2ld12","_k":"b47645d5"},{"t":"`(-∞, -2) ∪ (2, ∞)`","why":"That’s where it increases. Left of −4 it’s rising but below the axis.","_n":"2md02","_k":"bee604e5"},{"t":"`(-4, 2) ∪ (2, ∞)`","why":"That’s where it’s positive. Between −2 and 2 it’s above the axis but falling.","_n":"2ncf2","_k":"5040dc4d"}]},"b":{"prompt":"`q(x) = -(x - 4)(x + 2)^2` is shown, with a local minimum at (−2, 0) and a local maximum at (2, 32). Where is `q` \u003cstrong>both\u003c/strong> decreasing \u003cstrong>and\u003c/strong> positive?\u003ccanvas class=\"plot\" data-fig=\"t2b\" role=\"img\" aria-label=\"Cubic touching the x-axis at (negative 2, 0), with a local maximum at (2, 32) and crossing at (4, 0)\">\u003c/canvas>","options":[{"t":"`(-∞, -2] ∪ [2, 4)`","why":"−2 and 2 are turning points, so they can’t be in a decreasing interval; and `q(-2) = 0`.","_n":"2oce2","_k":"786d8a87"},{"t":"`(-∞, -2) ∪ (2, ∞)`","why":"That’s where it decreases. Right of 4 it’s falling but below the axis.","_n":"2pd52","_k":"4c19675d"},{"t":"`(-∞, -2) ∪ (2, 4)`","why":"Decreasing: `(-∞, -2) ∪ (2, ∞)`. Positive: `(-∞, -2) ∪ (-2, 4)`. The overlap is `(-∞, -2) ∪ (2, 4)`.","_n":"2qd42","_k":"816e378a"},{"t":"`(-∞, -2) ∪ (-2, 4)`","why":"That’s where it’s positive. Between −2 and 2 it’s above the axis but rising.","_n":"2rd95","_k":"d920fcca"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A graph is made of two straight segments: from a closed dot at (−5, 3) down to (−1, −3), then up to an open dot at (4, 7). What are its domain and range?","options":[{"t":"Domain `[-5, 4)`, range `[3, 7)`","why":"The range uses the lowest point the graph reaches, (−1, −3), not just the ends.","_n":"2sd85","_k":"583d4132"},{"t":"Domain `[-5, 4)`, range `[-3, 7)`","why":"`x` runs from −5 (closed) to 4 (open). `y` goes down to −3 (reached at (−1, −3)) and up toward 7, which the open dot never reaches.","_n":"2tdb5","_k":"25f56cb0"},{"t":"Domain `[-3, 7)`, range `[-5, 4)`","why":"These are swapped: the domain uses `x`-values.","_n":"2uda5","_k":"2bbd2b05"},{"t":"Domain `[-5, 4]`, range `[-3, 7]`","why":"The open dot at (4, 7) leaves out `x = 4` and `y = 7`.","_n":"2vdd5","_k":"aadacaff"}]},"b":{"prompt":"A graph is made of two straight segments: from an open dot at (−6, −4) up to (0, 5), then down to a closed dot at (3, 1). What are its domain and range?","options":[{"t":"Domain `(-4, 5]`, range `(-6, 3]`","why":"These are swapped: the domain uses `x`-values.","_n":"2wdc5","_k":"a51bc055"},{"t":"Domain `(-6, 3]`, range `(-4, 1]`","why":"The range uses the highest point the graph reaches, (0, 5), not just the ends.","_n":"2xdf5","_k":"2c21ac0b"},{"t":"Domain `(-6, 3]`, range `(-4, 5]`","why":"`x` runs from −6 (open) to 3 (closed). `y` starts just above −4 (the open dot) and reaches 5 at (0, 5).","_n":"2yde5","_k":"ccf392ca"},{"t":"Domain `[-6, 3]`, range `[-4, 5]`","why":"The open dot at (−6, −4) leaves out `x = -6` and `y = -4`.","_n":"2ze15","_k":"94b05d19"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which statement is written correctly?","options":[{"t":"`{x ∈ ℝ | x \u003c -1 or x ≥ 3} = (-∞, -1) ∪ [3, ∞)`","why":"Correct brackets, and ∪ for “or”.","_n":"30e05","_k":"abb6edde"},{"t":"`{x ∈ ℝ | x \u003c -1 or x ≥ 3} = (-∞, -1] ∪ [3, ∞]`","why":"−1 is left out (\u003c), and ∞ always takes a round bracket.","_n":"31735","_k":"268f7c95"},{"t":"`{x ∈ ℝ | x \u003c -1 or x ≥ 3} = (-∞, -1) ∩ [3, ∞)`","why":"∩ means “in both”. No number is in both pieces.","_n":"32745","_k":"14fb9385"},{"t":"`{x ∈ ℝ | x \u003c -1 or x ≥ 3} = (-1, -∞) ∪ [3, ∞)`","why":"Write the smaller endpoint first: `(-∞, -1)`.","_n":"33715","_k":"101e43a1"}]},"b":{"prompt":"Which statement is written correctly?","options":[{"t":"`{x ∈ ℝ | x ≤ 0 or x > 5} = [0, -∞) ∪ (5, ∞)`","why":"Write the smaller endpoint first: `(-∞, 0]`.","_n":"34725","_k":"1926ddb1"},{"t":"`{x ∈ ℝ | x ≤ 0 or x > 5} = [-∞, 0] ∪ (5, ∞]`","why":"∞ and −∞ always take round brackets.","_n":"356f5","_k":"fc48e4e7"},{"t":"`{x ∈ ℝ | x ≤ 0 or x > 5} = (-∞, 0] ∪ (5, ∞)`","why":"Correct brackets, and ∪ for “or”.","_n":"36705","_k":"74ee947a"},{"t":"`{x ∈ ℝ | x ≤ 0 or x > 5} = (-∞, 0] ∩ (5, ∞)`","why":"∩ means “in both”. No number is in both pieces.","_n":"376d5","_k":"ffad68f7"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"`f` is increasing on `(-∞, 2)` and decreasing on `(2, ∞)`. Which is the best explanation of why `x = 2` is left out of both intervals?","options":[{"t":"Because interval notation always uses round brackets.","why":"Square brackets are used whenever an endpoint is included, as in `[-2, ∞)`.","_n":"386e5","_k":"79a5c3a9"},{"t":"At `x = 2` the graph turns: for an instant it is neither rising nor falling, so it belongs to neither interval.","why":"That’s the meaning of a turning point.","_n":"396b5","_k":"032cab74"},{"t":"Because 2 is a zero of `f`.","why":"A turning point isn’t necessarily a zero. Nothing here says `f(2) = 0`.","_n":"3a6c5","_k":"8201da62"},{"t":"Because `f(2)` is negative.","why":"The height at the turning point doesn’t matter. What matters is that the graph is neither rising nor falling there.","_n":"3b6d5","_k":"4ac8cf02"}]},"b":{"prompt":"`f` is positive on `(-3, ∞)`. Which is the best explanation of why `x = -3` is left out?","options":[{"t":"`f(-3) = 0`, and 0 is neither positive nor negative.","why":"Zeros are always left out of positive and negative intervals.","_n":"3c6c5","_k":"1e5a3b2f"},{"t":"Because −3 is a turning point.","why":"Nothing here says the graph turns at −3. It’s left out because the value there is 0.","_n":"3d6b5","_k":"1496bb52"},{"t":"Because −3 is a negative number.","why":"The sign of the `x`-value doesn’t matter: `f` could be positive at `x = -2`. What matters is the value of `f`.","_n":"3e6a5","_k":"64146b90"},{"t":"Because interval notation always uses round brackets.","why":"Square brackets are used whenever an endpoint is included.","_n":"3f715","_k":"03f77f78"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A diver’s height above the water is `h(t) = -5t^2 + 10t + 15` metres, `t` seconds after leaving the board, for `0 ≤ t ≤ 3`. During which time interval is the diver rising?","options":[{"t":"`(15, 20)`","why":"Those are heights in metres, from the board (15 m) to the top (20 m). The question asks for times.","_n":"3g705","_k":"9112e120"},{"t":"`(0, 1)`","why":"The vertex is at `t = -10/(2 × (-5)) = 1`, where `h` = 20 m. The diver rises from the board until `t` = 1 s.","_n":"3h6f5","_k":"18c88e7d"},{"t":"`(0, 3)`","why":"That’s the whole time the diver is in the air (positive height). Above the water isn’t the same as rising.","_n":"3i6e5","_k":"6e8ee0b0"},{"t":"`(1, 3)`","why":"After `t = 1` the height decreases: that’s the fall.","_n":"3j655","_k":"52ff19a7"}]},"b":{"prompt":"A drone’s height is `h(t) = -2t^2 + 12t` metres, `t` seconds after take-off, for `0 ≤ t ≤ 6`. During which time interval is the drone descending?","options":[{"t":"`(0, 18)`","why":"Those are heights in metres. The question asks for times.","_n":"3k645","_k":"d8a23093"},{"t":"`(0, 3)`","why":"Before `t = 3` the drone is climbing.","_n":"3l675","_k":"682c8bc3"},{"t":"`(0, 6)`","why":"That’s the whole flight (positive height). In the air isn’t the same as descending.","_n":"3m685","_k":"b5974725"},{"t":"`(3, 6)`","why":"The vertex is at `t = -12/(2 × (-2)) = 3`, where `h` = 18 m. After that the drone comes down until it lands at `t = 6`.","_n":"3n695","_k":"573b49ec"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A company’s monthly profit, in thousands of dollars, is `P(x) = -(x - 2)(x - 8)`, where `x` is the number of units made, in hundreds, with `0 \u003c x \u003c 10`. For which production levels does the company \u003cstrong>lose\u003c/strong> money?","options":[{"t":"`(2, 8)`","why":"That’s where `P` is positive: the profitable levels.","_n":"3o6a5","_k":"e1d1122e"},{"t":"`(0, 2) ∪ (8, 10)`","why":"`P` opens down with zeros 2 and 8, so it’s negative outside them. Inside the allowed levels, that’s `(0, 2) ∪ (8, 10)`.","_n":"3p6b5","_k":"bed5f1d1"},{"t":"`[0, 2] ∪ [8, 10]`","why":"At `x = 2` and `x = 8` the profit is exactly 0 (break-even), not a loss. Also, `0 \u003c x \u003c 10` leaves out 0 and 10.","_n":"3q6c5","_k":"a4df4b52"},{"t":"`(0, 2) ∩ (8, 10)`","why":"∩ asks for levels in both pieces at once, and there are none. “Either piece” is ∪.","_n":"3r6d5","_k":"eda57672"}]},"b":{"prompt":"A greenhouse’s temperature, in degrees above its target, is `T(h) = (h - 3)(h - 9)`, `h` hours after midnight, with `0 \u003c h \u003c 12`. During which times is the greenhouse \u003cstrong>above\u003c/strong> its target?","options":[{"t":"`(0, 3) ∪ (9, 12)`","why":"`T` opens up with zeros 3 and 9, so it’s positive outside them. Inside the allowed times, that’s `(0, 3) ∪ (9, 12)`.","_n":"3s6e5","_k":"8f6e13f1"},{"t":"`(3, 9)`","why":"That’s where `T` is negative: below target.","_n":"3t5f5","_k":"1fe98b57"},{"t":"`(0, 3) ∩ (9, 12)`","why":"∩ asks for times in both pieces at once, and there are none. “Either piece” is ∪.","_n":"3u605","_k":"be054a95"},{"t":"`[0, 3] ∪ [9, 12]`","why":"At `h = 3` and `h = 9` the temperature is exactly on target, not above it. Also, `0 \u003c h \u003c 12` leaves out 0 and 12.","_n":"3v716","_k":"e51a63d9"}]}}]},"task":{"title":"Build the graph from its report","summary":"Build the graph from its report","statement":"\u003cp>A detective’s report describes a graph. Build a graph that matches the whole report. There are many answers. Can you find more than one?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The report\u003c/h4>\u003cp>Domain: `[-4, 4)`\u003cbr>Increasing on `(-4, -2) ∪ (0, 4)`; decreasing on `(-2, 0)`\u003cbr>Exactly three zeros\u003cbr>Range: `[-3, 5)`\u003c/p>\u003c/div>\u003cp class=\"tiny muted\">Set the height of the graph at \u003ci>x\u003c/i> = −4, −2, 0, 2 and 4 (whole numbers from −6 to 6). The graph joins the five points with straight segments.\u003c/p>","checks":["Domain is `[-4, 4)`","Increasing on `(-4, -2) ∪ (0, 4)`; decreasing on `(-2, 0)`","Exactly three zeros","Range is `[-3, 5)`"],"tips":["`[-4, 4)` means `x = -4` is in (closed dot) and `x = 4` is out (open dot).","","",""],"explainPrompt":"Write your graph’s positive and negative intervals in interval notation, and explain how you made the range `[-3, 5)` and not `[-3, 5]`.","vocab":"Use the words open dot, closed dot, zero and range.","success":"Your design works!","after3":"Notice what every answer shares: the height at `x = 4` must be 5 with an open dot, and the lowest height must be exactly −3."},"cards":[["Round bracket ( ) vs square bracket [ ]","Round: the endpoint is left out (\u003c, >, open dot). Square: the endpoint is included (≤, ≥, closed dot)."],["Brackets at ∞","Always round: `[-2, ∞)`. ∞ is a direction, not a number the set can contain."],["`-2 \u003c x ≤ 5` in three forms","Inequality `-2 \u003c x ≤ 5`; set `{x ∈ ℝ | -2 \u003c x ≤ 5}`; interval `(-2, 5]`."],["∪ (union)","“Or”: joins separate pieces. `x ≤ -3` or `x > 1` is `(-∞, -3] ∪ (1, ∞)`."],
