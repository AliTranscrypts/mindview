.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 07: hero memory hook, key-point mapper (legend, steppers, factor strip, mapping table), Order matters cards, parameter boxes */
.hero .hero-eq.md{font-size:clamp(1.9rem,4.6vw,3rem)}
.hero .hero-eq .m{white-space:normal}
.hero p.hook{font-size:1rem;padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.kp-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;max-width:none}
.kp-leg span{display:inline-flex;align-items:center;gap:6px}
.kp-leg .ln{display:inline-block;width:26px;height:0;border-top:2px dashed var(--ink-2)}
.kp-leg .ln.cur{border-top:3px solid var(--pen)}
.kp-leg .ln.tg{border-top:2.5px dashed var(--ink);width:30px}
.kp-leg .dt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.kp-leg .dt.cr{background:var(--ink-2)}
.kp-sl .slider-top > span .m{font-size:1.15em}
.kp-pq-note{margin:10px 0 2px}
.stp-row{display:flex;flex-wrap:wrap;gap:10px 22px;margin:6px 0 4px}
.stp{display:flex;align-items:center;gap:6px}
.stp-l{font-weight:700;margin-right:2px}
.stp .btn{min-width:40px;min-height:36px;justify-content:center;font-size:1.15rem;padding:.2em .6em}
.stp-v{font:600 1.35rem var(--font-math);min-width:2.2em;text-align:center}
.fx-strip{font:400 1.3rem/1.5 var(--font-math);margin:6px 0 10px;min-height:3em;max-width:none}
.fx-strip .m{white-space:normal}
.fx2,.fx3{opacity:0;transition:opacity .5s}
.fx2.on,.fx3.on{opacity:1}
.fx3{font:400 .95rem var(--font-ui)}
.kp-tbl{margin-top:16px}
.kp-th{margin:0 0 6px;font-size:.85rem;color:var(--ink-2)}
.kp-tbl table.vt th,.kp-tbl table.vt td{padding:5px 10px}
.kp-tbl table.vt th .m{font-size:1.05rem}
.kp-tbl tr.hl td{background:var(--hi-soft);font-weight:600}
.kp-tbl .kp-all{display:none;margin-top:8px}
@media (max-width:560px){
  .kp-tbl:not(.all) tr.kp-x{display:none}
  .kp-tbl .kp-all{display:inline-flex}
}
.om-target{font:400 1.3rem var(--font-math);margin:0 0 8px}
.om-target .m{white-space:normal}
.om-now{font:400 1.15rem var(--font-math);min-height:1.5em;margin:8px 0}
.om-now .m{white-space:normal}
.om-h{margin-top:18px}
.om-tray{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);min-height:56px}
.om-card{border:2px solid var(--ink);background:var(--sheet);border-radius:6px;padding:.45em .8em;text-align:left;font-weight:700;font-size:.95rem;min-height:40px}
.om-card:hover{border-color:var(--pen)}
.om-empty{padding:.6em .2em}
.om .olist{margin-top:6px}
.pbox-row{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px}
.pbox{display:flex;align-items:center;gap:6px;font-weight:700}
.pbox .m{font-size:1.2rem}
.pbox .numin{width:6.5rem}
ol.spec{margin:0;padding-left:1.3em}
.lg-cap{font-size:clamp(1.3rem,3.4vw,1.8rem)}
.seg button[aria-pressed="true"] .p-n{color:inherit}
.opt .m{white-space:normal}
.om-target .tiny{white-space:nowrap}

le":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"3847e038","content":{"id":"07-transformations-of-power-functions","kind":"topic","title":"Transformations of power functions","topic":"Transformations of Power Functions","readyTopic":"transformations of power functions","hero":{"eq":"`y = @a{a}[@k{k}(x - @d{d})]^{@n{n}} + @c{c}`","eqLabel":"y equals a times the quantity k times x minus d, all to the power n, plus c","eqSize":"md","headline":"Four dials, one rule for every point","text":"Each parameter does one job. The ones \u003cstrong>outside\u003c/strong> the bracket act vertically: `@a{a}` stretches (and flips), `@c{c}` shifts up or down. The ones \u003cstrong>inside\u003c/strong> act horizontally, and backwards: `@k{k}` compresses by `1/@k{k}`, and `(x - @d{d})` shifts right by `@d{d}`. Every point follows the \u003cstrong>mapping rule\u003c/strong> `(x, y) -> (x/@k{k} + @d{d}, @a{a}y + @c{c})`.\u003c/p>\u003cp class=\"hook\">\u003cstrong>Memory hook:\u003c/strong> Stretches are warm colours (`@a{a}`, `@k{k}`); shifts are cool colours (`@d{d}`, `@c{c}`).","fig":{"aria":"y equals x cubed, then stretched vertically by 2, compressed horizontally by a factor of 1/2, moved 2 right and lifted 3 up, leaving a faded copy after each step","shape":"square"}},"goals":["I can describe the effect of `@a{a}`, `@k{k}`, `@d{d}` and `@c{c}` in `y = @a{a}[@k{k}(x - @d{d})]^{@n{n}} + @c{c}`, using stretch and compression factors, reflections and translations.","I can map key points with `(x, y) -> (x/@k{k} + @d{d}, @a{a}y + @c{c})`.","I can apply the transformations in a correct order and sketch the result.","I can write the equation from a description, a graph or mapped points.","I can state the domain, range, end behaviour and vertex or point of inflection of a transformed power function.","I can factor `@k{k}` out of the bracket to find the true horizontal shift."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Transformations","goal":1,"prompt":"How does `y = (x - 4)^2 + 1` compare with `y = x^2`?","options":[{"t":"4 left and 1 up","why":"`x - 4 = 0` at `x = 4`: the vertex moves to (4, 1).","_n":"0579","_k":"b4ee783c"},{"t":"4 right and 1 up","why":"`(x - 4)` moves it right 4; +1 moves it up 1.","_n":"15a9","_k":"68c2d284"},{"t":"4 right and 1 down","why":"+1 outside the bracket raises every point.","_n":"2599","_k":"c09fc554"},{"t":"4 left and 1 down","why":"The vertex is at (4, 1).","_n":"3549","_k":"c4edfbe4"}],"hints":["Where is the new vertex?","`(x - 4)^2` is 0 when `x = 4`.","Vertex (4, 1): right 4, up 1."]},{"id":"w2","skill":"Transformations","goal":1,"prompt":"What does `y = 3f(x)` do to the graph of `y = f(x)`?","options":[{"t":"A vertical compression by a factor of 1/3","why":"Multiplying `y` by 3 makes points 3 times as far from the `x`-axis.","_n":"4539","_k":"f462feec"},{"t":"A shift up 3","why":"That’s `f(x) + 3`.","_n":"5569","_k":"6c6e469c"},{"t":"A vertical stretch by a factor of 3","why":"Every `y`-value is tripled.","_n":"6559","_k":"bbaa73e7"},{"t":"A horizontal stretch by a factor of 3","why":"The 3 is outside: it acts on `y`.","_n":"7509","_k":"7f0f9874"}],"hints":["Is the 3 inside or outside `f`?","Outside: it multiplies the `y`-values.","Vertical stretch by 3."]},{"id":"w3","skill":"Transformations","goal":1,"prompt":"What does `y = f(2x)` do to the graph of `y = f(x)`?","options":[{"t":"A vertical compression by a factor of 1/2","why":"The 2 is inside: it acts on `x`.","_n":"84f9","_k":"2e741f1a"},{"t":"A horizontal compression by a factor of 1/2","why":"The point that was at `x = 4` is now reached at `x = 2`.","_n":"9a44","_k":"0d6ae0e6"},{"t":"A vertical stretch by a factor of 2","why":"That would be `2f(x)`.","_n":"aa54","_k":"ed300e50"},{"t":"A horizontal stretch by a factor of 2","why":"Inside changes work backwards: `2x` reaches each value twice as fast.","_n":"ba64","_k":"560c4940"}],"hints":["Inside or outside?","Inside acts on `x`, backwards.","Compression by 1/2."]},{"id":"w4","skill":"Key points","goal":5,"prompt":"Which point is on `y = x^4`?","options":[{"t":"(3, 12)","why":"`3^4 = 81`.","_n":"ca74","_k":"9a9c0df4"},{"t":"(−2, 16)","why":"`(-2)^4 = 16`.","_n":"da04","_k":"d5f7064f"},{"t":"(2, 8)","why":"`2^3 = 8`; `2^4 = 16`.","_n":"ea14","_k":"fbe6a988"},{"t":"(−2, −16)","why":"An even power of −2 is positive.","_n":"fa24","_k":"8d586a38"}],"hints":["Substitute the `x`-value.","`(-2)^4 = (-2)(-2)(-2)(-2)`.","16."]},{"id":"w5","skill":"Factoring","goal":6,"prompt":"Factor `3x - 12`.","options":[{"t":"`3(x - 12)`","why":"`3(x - 12) = 3x - 36`.","_n":"ga34","_k":"72437a14"},{"t":"`3(x + 4)`","why":"`3(x + 4) = 3x + 12`.","_n":"hac4","_k":"7a020c73"},{"t":"`3(x - 4)`","why":"3 × `x` − 3 × 4 = `3x - 12`.","_n":"iad4","_k":"c5983566"},{"t":"`x(3 - 12)`","why":"−12 has no factor of `x`.","_n":"jb65","_k":"f200977a"}],"hints":["Divide each term by 3.","`3x ÷ 3 = x`; `-12 ÷ 3 = -4`.","`3(x - 4)`."]},{"id":"w6","skill":"Mapping points","goal":2,"prompt":"Under `y = 2f(x) + 3`, where does the point (1, 4) on `y = f(x)` go?","options":[{"t":"(1, 11)","why":"Multiply the `y`-value by 2, then add 3: 8 + 3 = 11. `x` doesn’t change.","_n":"kb55","_k":"c3270973"},{"t":"(1, 14)","why":"(4 + 3) × 2 = 14 does the steps in the wrong order.","_n":"lb85","_k":"2ff92242"},{"t":"(2, 7)","why":"Only `y` changes here.","_n":"mb75","_k":"7856a484"},{"t":"(5, 4)","why":"2 and 3 are outside `f`: they act on `y`.","_n":"nb25","_k":"d1d501da"}],"hints":["Outside changes act on `y`.","`y -> 2y + 3`.","2 × 4 + 3 = 11: (1, 11)."]}],"refreshers":{"Transformations":"Outside the function: `a` multiplies `y` (vertical stretch), `c` adds to `y` (vertical shift). Inside: `x - d` shifts right by `d`; `kx` compresses horizontally by `1/k`. Inside changes work backwards.","Key points":"`y = x^3`: (−2, −8), (−1, −1), (0, 0), (1, 1), (2, 8). `y = x^4`: (−2, 16), (−1, 1), (0, 0), (1, 1), (2, 16).","Factoring":"Take out the common factor: `3x - 12 = 3(x - 4)`. Check by expanding.","Mapping points":"For `y = af(x) + c`, each point `(x, y)` goes to `(x, ay + c)`: multiply first, then add."}}},"explore":{"heading":"Key-point mapper","intro":"Move the four sliders. The parent graph stays as a dashed ghost, and the table shows where every key point goes.","predictions":[{"id":"p1","start":{"n":3,"a":1,"k":1,"d":0,"c":0,"hl":0},"prompt":"Start with `y = x^3`. The equation will become `y = (x + 3)^3`. Where will the point (0, 0) go?","options":[{"t":"(−3, 0)","_n":"ob15","_k":"0418a48b"},{"t":"(0, −3)","_n":"pb45","_k":"54ab7192"},{"t":"(0, 3)","_n":"qb35","_k":"9e3e8904"},{"t":"(3, 0)","_n":"rae5","_k":"bf6e9158"}],"explain":"`x + 3 = 0` at `x = -3`. `(x - d)` with `d = -3` moves everything 3 left."},{"id":"p2","start":{"n":4,"a":1,"k":1,"d":0,"c":0,"hl":2},"prompt":"Start with `y = x^4`, key point (2, 16) highlighted. `k` will change to 2: `y = (2x)^4`. Where will (2, 16) go?","options":[{"t":"(4, 16)","_n":"sad5","_k":"b413878c"},{"t":"(2, 8)","_n":"tb05","_k":"9e5f89f2"},{"t":"(2, 32)","_n":"ub15","_k":"dee68dae"},{"t":"(1, 16)","_n":"vae5","_k":"daf74f57"}],"explain":"`(2 · 1)^4 = 16`, so the height 16 is now reached at `x = 1`. Points move to `x/k`: a compression by 1/2, not a stretch by 2."},{"id":"p3","start":{"n":3,"a":1,"k":1,"d":0,"c":0,"hl":1},"prompt":"Start with `y = x^3` and the point (1, 1). `y = 2(x - 1)^3 + 3`. Where does (1, 1) go?","options":[{"t":"(2, 8)","_n":"waf5","_k":"79a7e8fe"},{"t":"(0, 5)","_n":"xb45","_k":"a70e080a"},{"t":"(3, 5)","_n":"yb55","_k":"f3f60ece"},{"t":"(2, 5)","_n":"zb25","_k":"1d1889e9"}],"explain":"`x`: 1/1 + 1 = 2. `y`: 2 × 1 + 3 = 5. Adding before multiplying gives (1 + 3) × 2 = 8; doubling `x` gives 3; subtracting `d` gives 0."},{"id":"p4","start":{"n":4,"a":1,"k":1,"d":0,"c":0},"prompt":"Start with `y = x^4`. `k` will change to −1: `y = (-x)^4`. What will happen to the graph?","options":[{"t":"It flips upside down","_n":"10b35","_k":"65711638"},{"t":"Nothing visible changes","_n":"11a85","_k":"9b74239c"},{"t":"It shifts left 1","_n":"12a95","_k":"90839bf9"},{"t":"Its arms point left and right","_n":"13324","_k":"783fcb8e"}],"explain":"`(-x)^4 = x^4`: the reflection in the `y`-axis maps an even function onto itself. A negative `k` still reflects; you just can’t see it for `x^4`."}],"chalIntro":"Use the mapper to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Choose the challenge’s number under \u003cstrong>Show a target\u003c/strong> to see its target on the graph. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,4],"target":{"pts":[[-2,5]]},"prompt":"Move `y = x^3`, without stretching it, so its point of inflection is at (−2, 5).","why":"`y = (x + 2)^3 + 5`.","hints":["The point of inflection is at `(d, c)`.","`d = -2`, `c = 5`.","`y = (x + 2)^3 + 5`."]},{"id":"tc2","goal":[1,4],"target":{"n":4,"a":-2,"k":1,"d":3,"c":4,"pts":[[3,4],[4,2]]},"prompt":"Match the dashed target: a quartic opening down with vertex (3, 4), passing through (4, 2).","why":"`a + 4 = 2`, so `a = -2`.","hints":["Set the vertex first.","Then `y = a(x - 3)^4 + 4` must pass through (4, 2).","`a + 4 = 2`, so `a = -2`."]},{"id":"tc3","goal":[1,4],"stretch":true,"target":{"pts":[[1,-4],[2,4],[3,12]]},"prompt":"Make `y = x^3` pass through (1, −4), (2, 4) and (3, 12).","why":"`a` can’t reach 8, but `k = 2` gives `k^3 = 8`: `y = [2(x - 2)]^3 + 4`.","hints":["A cubic is symmetric about its point of inflection. Which of the three points is the centre?","(2, 4). From there, one step right raises the graph by 8: `a·k^3 = 8`.","`a` can’t reach 8, but `k = 2` gives `k^3 = 8`: `y = [2(x - 2)]^3 + 4`."]}],"chalFb":{"tc1":{"d2":"Your point is at (2, {c}). `(x - d)` with `d = -2` moves it left.","cm5":"`c` moves it up or down: you need +5.","stretch":"The challenge says no stretch: `a = 1`, `k = 1`."},"tc2":{"value":"At `x = 4` your graph is at {v}. `a(1)^4 + 4 = 2` gives `a = -2`.","dm3":"Vertex at (−3, {c}): check the sign of `d`.","apos":"Opening down needs `a \u003c 0`."},"tc3":{"a3":"`a` alone can only reach 3; you need the vertical change of 8 from the centre to `x = 3`. What else stretches the graph vertically?","d13":"The point of symmetry of the three points is the middle one, (2, 4)."}}},"part3":{"slug":"order","name":"Order","heading":"Order matters","intro":"Put the transformation cards in order. Press Play to watch each one happen to the key points. Reach the dashed target.","rounds":[{"id":"r1","n":4,"target":{"a":-2,"k":1,"d":-1,"c":3},"eq":"`y = -2(x + 1)^4 + 3`","keyName":"vertex (−1, 3)","cards":[{"id":"sv2","t":"Stretch vertically by 2","sy":2},{"id":"rx","t":"Reflect in the `x`-axis","sy":-1},{"id":"l1","t":"Translate 1 left","tx":-1},{"id":"u3","t":"Translate 3 up","ty":3},{"id":"rt1","t":"Translate 1 right","tx":1,"decoy":true}],"named":[{"uses":"rt1","fb":"`(x - d)` moves the graph `d` units right, so `(x + 1) = (x - (-1))` moves it 1 unit \u003cstrong>left\u003c/strong>."},{"first":"u3","then":"rx","fb":"Your vertex ended at {v}: the reflection flipped the shift. Stretch and reflect first."}],"keyPts":"(1, 1) → (0, 1), (2, 16) → (1, −29), vertex (−1, 3)"},{"id":"r2","n":3,"target":{"a":0.5,"k":2,"d":3,"c":-1},"eq":"`y = ½[2(x - 3)]^3 - 1`","keyName":"point of inflection (3, −1)","cards":[{"id":"cv","t":"Compress vertically by 1/2","sy":0.5},{"id":"ch","t":"Compress horizontally by 1/2","sx":0.5},{"id":"r3","t":"Translate 3 right","tx":3},{"id":"d1","t":"Translate 1 down","ty":-1},{"id":"r6","t":"Translate 6 right","tx":6,"decoy":true}],"named":[{"uses":"r6","fb":"That’s the shift for `(2x - 6)`, compressing \u003cstrong>after\u003c/strong> shifting. With the compression first, the shift is 3."}],"keyPts":"(1, 1) → (3.5, −0.5), (2, 8) → (4, 3)"},{"id":"r3","n":4,"target":{"a":1,"k":2,"d":-3,"c":-5},"eq":"`y = (2x + 6)^4 - 5`","keyName":"vertex (−3, −5)","cards":[{"id":"ch","t":"Compress horizontally by 1/2","sx":0.5},{"id":"l3","t":"Translate 3 left","tx":-3},{"id":"l6","t":"Translate 6 left","tx":-6},{"id":"d5","t":"Translate 5 down","ty":-5}],"named":[{"first":"ch","then":"l6","without":"l3","fb":"Vertex at (−6, −5). After compressing, the shift is the factored `d = -3`."},{"first":"l3","then":"ch","without":"l6","fb":"Vertex at (−1.5, −5): compressing after the shift halves it. Shift 6 first, or compress first."}],"keyPts":"(1, 1) → (−2.5, −4), (−1, 1) → (−3.5, −4)","after":"Both paths work, with different shift amounts. The course’s standard order is stretches and reflections first, then translations, using the factored form `[k(x - d)]`."}],"quickCheck":{"title":"Quick check","summary":"Order matters quick check","items":[{"id":"q1","goal":5,"prompt":"Vertex of `y = 3(x - 2)^4 + 1`?","choices":[{"t":"(2, 3)","_n":"14314","_k":"e218bb06"},{"t":"(−2, 1)","_n":"15304","_k":"35177a36"},{"t":"(2, 1)","_n":"162f4","_k":"2a166a83"},{"t":"(1, 2)","_n":"17364","_k":"ccf3b46e"}],"right":"Right. The vertex is `(d, c)` = (2, 1).","wrong":"The vertex is `(d, c)` = (2, 1)."},{"id":"q2","goal":2,"prompt":"In `y = [½(x + 4)]^3`, the horizontal change is…","choices":[{"t":"stretch by 4","_n":"18354","_k":"9b165736"},{"t":"shift 4 right","_n":"19344","_k":"3511d3e6"},{"t":"compress by 1/2","_n":"1a334","_k":"3d807741"},{"t":"stretch by 2","_n":"1b2a4","_k":"40340f68"}],"right":"Right. `k = 1/2`: points move to `x/(1/2) = 2x`, twice as far out.","wrong":"`k = 1/2`: points move to `x/(1/2) = 2x`, twice as far out."},{"id":"q3","goal":2,"prompt":"Where does (2, 16) on `y = x^4` go under `y = -(x - 1)^4 + 5`?","choices":[{"t":"(1, −11)","_n":"1c294","_k":"c67e93e6"},{"t":"(3, 21)","_n":"1dac4","_k":"056bc2ee"},{"t":"(3, −21)","_n":"1ead4","_k":"a0b8a4dc"},{"t":"(3, −11)","_n":"1fae4","_k":"a496ea51"}],"right":"Right. `x`: 2 + 1 = 3. `y`: −16 + 5 = −11. e (horizontal)?","l2|r1":"Is the 2 outside (vertical) or inside (horizontal)?","l2|r3":"Factor `2x - 3 = 2(x - 3/2)`.","l3|r2":"Factor `2x - 3 = 2(x - 3/2)`.","l4|r5":"A minus outside reflects in the `x`-axis; inside, in the `y`-axis. And `-x + 3 = -(x - 3)`: 3 right.","l5|r4":"A minus outside reflects in the `x`-axis; inside, in the `y`-axis. And `-x + 3 = -(x - 3)`: 3 right."},"wrongDefault":"Check outside (vertical) and inside (horizontal) separately."},{"id":"params","type":"custom","title":"Find the parameters","summary":"Find the parameters","star":true,"goal":[2,4,6],"instruction":"Fill in `@a{a}`, `@k{k}`, `@d{d}` and `@c{c}` for each description. Items marked ★ work backwards from points.","how":"Type a number in each box, then press Check. Fractions such as 3/4 are fine.","items":[{"id":"n1","goal":4,"ask":["a","k","d","c"],"prompt":"`y = x^4` is reflected in the `x`-axis, compressed horizontally by a factor of 1/3, then translated 2 left and 5 up.","_a":"SBpVFV8dAhQRUxYNVhwRXBECGQVJElAaCQ1J","wrong":{"k":[{"v":0.3333333333,"fb":"Compression by 1/3 means `k = 3`."}],"d":[{"v":2,"fb":"`(x - d)` moves the graph `d` units right, so `(x + 2) = (x - (-2))` moves it 2 units \u003cstrong>left\u003c/strong>."}]}},{"id":"n2","goal":6,"ask":["a","k","d","c"],"prompt":"Write `y = -(4x + 8)^3 + 1` as `a[k(x - d)]^3 + c`.","_a":"SBpVFV8dAhQRUxYNURwRXBECGQVJElAaCQlJ","wrong":{"d":[{"v":-8,"fb":"Factor out 4: `4x + 8 = 4(x + 2)`."}]},"hints":["Factor the inside.","`-(4x + 8)^3 = -[4(x + 2)]^3`.","`a = -1`, `k = 4`, `d = -2`, `c = 1`."]},{"id":"n3","goal":4,"star":true,"ask":["a"],"prompt":"`y = a(x - d)^3 + c` has point of inflection (2, −1) and passes through (3, 1). Find `a`.","_a":"SBpVFV8CTg==","wrong":{"a":[{"v":1,"fb":"`a(1)^3 - 1 = 1` gives `a = 2`."}]}},{"id":"n4","goal":4,"star":true,"ask":["a"],"prompt":"`y = a(x - d)^4 + c` has vertex (−1, 6) and passes through (1, −10). Find `a`.","_a":"SBpVFV8dAkU=","wrong":{"a":[{"v":-4,"fb":"`(1 - (-1))^4 = 2^4 = 16`, so ` `.","_n":"1ma54","_k":"632e5912"},{"t":"36 right.","why":"Factoring divides by 3; it doesn’t multiply.","_n":"1n1e4","_k":"5dd640a6"}],"hints":["Where is the bracket equal to 0?","`3x - 12 = 0` at `x = 4`.","Step 2 is wrong: 4 right; vertex (4, 2)."]},{"id":"e2","goal":2,"task":"Where does (1, 1) on `y = x^3` go under `y = 2[½(x + 1)]^3 - 3`?","steps":["`a = 2`, `k = ½`, `d = -1`, `c = -3`.","New `x = kx + d = ½(1) - 1 = -½`.","New `y = ay + c = 2(1) - 3 = -1`.","Image: (−½, −1)."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is correct. The mistake is earlier.","Step 4 uses step 2. The mistake is earlier."],"fixes":[{"t":"New `x = kx - d = ½ + 1 = 3/2`.","why":"Solve `k(X - d) = x` for the new `X`: `X = x/k + d`. And `(x - d)` moves the graph `d` units right, so `(x + 1) = (x - (-1))` moves it 1 unit \u003cstrong>left\u003c/strong>.","_n":"1o1d4","_k":"c17005e2"},{"t":"Step 2 is correct.","why":"Inside changes work backwards: divide by `k`.","_n":"1p204","_k":"a13d6170"},{"t":"New `x = x/k - d = 2 + 1 = 3`.","why":"`(x - d)` moves the graph `d` units right, so `(x + 1) = (x - (-1))` moves it 1 unit \u003cstrong>left\u003c/strong>.","_n":"1q1f4","_k":"deeeb142"},{"t":"New `x = x/k + d = 1 ÷ ½ - 1 = 1`: the image is (1, −1).","why":"Solve `k(X - d) = x` for the new `X`: `X = x/k + d`.","_n":"1r224","_k":"e5ff636b"}],"hints":["Check the `x`-part of the mapping rule.","It’s `x/k + d`.","1 ÷ ½ − 1 = 1: (1, −1)."]},{"id":"e3","goal":5,"task":"State the range of `y = -½(x - 2)^4 + 3`.","steps":["The vertex is (2, 3).","`a = -½ \u003c 0`, so the graph opens down.","So 3 is the lowest value.","Range: `{y ∈ ℝ | y ≥ 3}`."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 uses step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"A downward quartic’s vertex is its highest point.","_n":"1s214","_k":"80ecef5e"},{"t":"Range `{y ∈ ℝ | y ≤ 2}`.","why":"2 is the vertex’s `x`-coordinate.","_n":"1t244","_k":"492e9e78"},{"t":"Range `{y ∈ ℝ}`.","why":"That’s for odd powers; `x^4` is even.","_n":"1u234","_k":"39bc00fa"},{"t":"Opening down, the vertex is the highest point: range `{y ∈ ℝ | y ≤ 3}`.","why":"With `a \u003c 0` the quartic opens down: the vertex is the highest point, so the range is `y ≤ c`.","_n":"1v264","_k":"6c3864f3"}],"hints":["Opening down: is the vertex a top or a bottom?","A top.","Range `y ≤ 3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the key-point mapper: inside changes working backwards, or `(-x)^4`?"},{"id":"j2","q":"In your own words, why does the shift in `(2x - 6)^3` turn out to be 3, not 6?"},{"id":"j3","q":"Explain to a friend how to sketch `y = -2[½(x - 1)]^4 + 3` from three key points."},{"id":"j4","q":"Which parameter do you still misread? What will you check every time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In `y = 3[½(x + 2)]^4 - 1`, what is the horizontal change?","options":[{"t":"A horizontal stretch by a factor of 2, and a translation 2 right","why":"`(x + 2) = (x - (-2))`: left.","_n":"1w254","_k":"49ad413e"},{"t":"A horizontal compression by a factor of ½, and a translation 2 left","why":"`k = ½` moves points to `x/(½) = 2x`: a stretch.","_n":"1x384","_k":"9ffd45a3"},{"t":"A horizontal stretch by a factor of 2, and a translation 2 left","why":"`k = ½` stretches by `1/k = 2`; `(x + 2)` is 2 left.","_n":"1y394","_k":"3b7329c0"},{"t":"A horizontal compression by a factor of ½, and a translation 2 right","why":"Both parts are reversed.","_n":"1z364","_k":"4e071463"}]},"b":{"prompt":"In `y = -[4(x - 1)]^3 + 5`, what is the horizontal change?","options":[{"t":"A horizontal stretch by a factor of 4, and a translation 1 right","why":"`k = 4` compresses by ¼.","_n":"20374","_k":"afe77209"},{"t":"A horizontal compression by a factor of ¼, and a translation 1 right","why":"`k = 4` compresses by `1/k = ¼`; `(x - 1)` is 1 right.","_n":"21344","_k":"04cfd988"},{"t":"A horizontal c
