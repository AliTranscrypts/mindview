.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 45: hero caption, per-topic tables, Connect (concept map, link bar, one page), mixed practice, task */
.hero .hero-eq.md{font-size:clamp(1.7rem,4.2vw,2.8rem);white-space:nowrap}
#hero-cap{font:400 .95rem/1.5 var(--font-ui);color:var(--ink-2);display:grid;gap:2px}
#hero-cap .hc-l{display:block}
#hero-cap .hc-l.cur{color:var(--ink);font-weight:600}
#hero-cap .hc-l.wait{visibility:hidden}
#hero-cap .m{white-space:normal}
/* toolkit workaround: the visually hidden "(done)" text in a step button escaped the scrolling step bar on phones */
.steps .step{position:relative}
/* per-topic tables */
.tt-wrap{overflow-x:auto;margin:10px 0}
.tt td:nth-child(2){white-space:nowrap}
.tt td:last-child{white-space:nowrap}
.tt tr.tt-rev td{border-bottom:0}
.tt tr.tt-more td{padding-top:0;white-space:normal}
.tt-key{padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.tt-key p{margin:0 0 .3em;max-width:none}
.tt-key p:last-child{margin:0}

/* Connect: N18 connection builder, concept map */
.cv-chal{border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--paper)}
.cv-chal .q-prompt{font-weight:700}
.cv-chal .how{margin:8px 0 0}
.cv-top{flex-wrap:wrap}
.cv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.cv-top .dots{flex:0 0 auto}
.cv-nav{border-top:1px solid var(--rule);padding-top:10px}
.tm-sq{margin:12px 0 6px;font-weight:600}
.tm-split{display:flex;flex-wrap:wrap;gap:8px}
.tm-sp{text-align:left;white-space:normal;max-width:100%}
.tm-sp .m{white-space:normal}
.tm-board{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 44px;align-items:start;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tm-col{min-width:0;position:relative;z-index:2}
.tm-h{margin:0 0 6px;font:700 .85rem var(--font-ui);color:var(--ink-2);text-transform:none}
.tm-cards{display:grid;gap:8px}
.tm-card{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:.98rem;line-height:1.4;min-height:40px;cursor:pointer}
.tm-card .m{white-space:normal}
.tm-n{display:block;font:700 .8rem var(--font-ui);color:var(--ink-2)}
.tm-card:not(:disabled):hover{border-color:var(--pen)}
.tm-card:disabled{cursor:default;opacity:1;color:var(--ink)}
.tm-card.linked{border-color:var(--hi);box-shadow:inset 5px 0 0 var(--hi)}
.tm-card.stem{outline:2px dashed var(--ink-2);outline-offset:2px}
.tm-card.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);box-shadow:none}
.tm-card.on .tm-n{color:var(--hi-ink)}
.tm-card:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tm-links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.tm-ln{fill:none;stroke:var(--hi);stroke-width:2.5;stroke-opacity:.8}
.tm-ln.cur{stroke-width:5;stroke-opacity:1}
.tm-ln.pend{stroke:var(--ink-2);stroke-dasharray:6 5;stroke-width:2}
.tm-end{fill:var(--ink)}
.tm-bar{position:sticky;bottom:0;z-index:5;margin-top:16px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.tm-bar[hidden]{display:none}
.tm-sent{margin:0;max-width:none;font-size:.98rem;flex:1 1 260px}
.tm-sent .m{white-space:normal}
.tm-arr{font-weight:700;margin:0 4px}
.tm-acts{margin:0}
.tm-one{margin-top:18px}
.tm-one h3{margin:0 0 6px}
@media (max-width:760px){
  .tm-board{grid-template-columns:minmax(0,1fr);padding-left:30px;gap:14px}
}
/* the chapter on one page */
.op-centre{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 12px}
.op-eq{margin:0;font:400 clamp(1.3rem,3.4vw,1.8rem) var(--font-math);text-align:center}
.op-graph{width:100%;max-width:300px}
.op-pairs{display:grid;gap:8px}
.op-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 12px;align-items:center}
.op-head{font:700 .85rem var(--font-ui);color:var(--ink-2)}
.op-c{border:1.5px solid var(--rule);border-left:5px solid var(--hi);border-radius:8px;background:var(--sheet);padding:6px 10px;min-width:0}
.op-c .m{white-space:normal}
.op-c .tag,.op-tools .tag{margin-left:4px;white-space:nowrap}
.op-link{font:600 .85rem var(--font-ui);color:var(--ink-2);text-align:center;max-width:9.5em}
.op-th{margin:14px 0 4px}
.op-tools{margin:0;padding-left:1.3em;display:grid;gap:6px}
.op-tools .m{white-space:normal}
@media (max-width:640px){
  .op-row{grid-template-columns:minmax(0,1fr)}
  .op-head{display:none}
  .op-link{text-align:left;max-width:none}
}

/* Mixed practice */
@media (max-width:560px){
  .mx-q .q-head{flex-wrap:wrap}
  .mx-q .q-head .tags{order:-1;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
}
.mx-q .q-prompt{font-weight:700}
.mx-q .numrow{flex-wrap:wrap;align-items:center;gap:8px 18px}
.mx-pair{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.mx-cell{display:inline-flex;align-items:center;gap:8px}
.mx-lab .m{font-size:1.05rem}
.mx-unit{font-size:.95rem;color:var(--ink-2)}
.mx-sum{margin-top:6px}

/* Task: a positive root that fails */
.pt-how{margin:4px 0 8px}
.pr-row{flex-wrap:wrap;gap:10px 18px;margin:6px 0 12px}
.pr-row label{display:flex;align-items:center;gap:8px}
.pr-name{font:400 1.35rem var(--font-math);min-width:1.1em}
.pr-box{display:inline-flex;align-items:center;gap:4px}
.pr-box input{width:4.2rem;text-align:center;font:400 1.1rem var(--font-math)}
.btn.pr-pm{font-size:1.2rem;line-height:1;min-width:40px;min-height:40px;padding:.1em .45em}
.pr-h{margin:0 0 6px}
.pr-eq{margin:0 0 8px;font-size:1.15rem}
.pr-eq .m{white-space:normal}
.pr-read dd .m{white-space:nowrap}
.pr-tbl{margin:8px 0 14px}
.pr-tbl td,.pr-tbl th{white-space:nowrap}
.pr-tbl th .m,.pr-tbl td .m{white-space:nowrap}
.pr-tbl td.pr-ok,.pr-tbl td.pr-no{white-space:normal;min-width:7.5em}
.pr-tbl td.pr-ok{color:var(--green);font-weight:600}
.pr-tbl td.pr-no{color:var(--red);font-weight:600}
.pr-tbl td .m{color:var(--ink)}
.pr-gwrap{border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
canvas.pr-gate{display:block;width:100%;height:150px}

tions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"9ddae56c","content":{"id":"45-chapters-6-7-review","kind":"review","title":"Chapters 6–7 summary and review","topic":"Chapters 6–7 Summary & Review","hero":{"eq":"`@b{b}^x = y ⟺ log_{@b{b}} y = x`","eqLabel":"b to the power x equals y means log base b of y equals x","eqSize":"md","headline":"Every logarithm is an exponent","text":"A logarithm answers one question: what exponent turns `b` into `y`? That single idea makes the log graph the mirror image of the exponential graph, makes the log laws copies of the exponent laws, and turns pH, decibels and earthquakes into counts of powers of 10.","muted":"Work through the five parts in order. Your answers save on this device as you go.","fig":{"shape":"square","aria":"Graph of y = 2ˣ through (0, 1), (1, 2) and (3, 8), and its mirror image y = log₂ x through (1, 0), (2, 1) and (8, 3), reflected in the dotted line y = x. The asymptote x = 0 is labelled domain x > 0, and the point (8, 3) is labelled log₂ 8 = 3. A stretch and shift give y = 2 log₂(x − 1). A Richter ruler at the top marks ×10 for each step. On the x-axis, 4 is ticked as a solution and −2 is crossed out.","steps":[{"cap":"`y = 2^x` through `(0, 1)`, `(1, 2)` and `(3, 8)` · module 37"},{"cap":"Swap each point’s coordinates across `y = x`: `y = log_2 x` · modules 37 and 38"},{"cap":"Asymptote `x = 0`, so the domain is `x > 0`; `log_2 8 = 3` · module 38"},{"cap":"A stretch and a shift: `y = 2 log_2(x - 1)` · module 39"},{"cap":"`log_2 8^5 = 15` and `log_2 4 + log_2 8 = 5` · modules 40 and 41"},{"cap":"A Richter ruler: each step is ×10 · module 42"},{"cap":"`2^x = 20 → x = log 20/log 2` · module 43"},{"cap":"`log_2 x + log_2(x - 2) = 3 → x = 4` ✓, −2 ✗ · module 44"}]}},"goals":["I can describe `y = log_b x` as the inverse of `y = b^x` and convert between exponential and logarithmic form.","I can evaluate logarithms and describe the key features of `y = log_b x`.","I can describe and sketch transformations of `y = log_b x`.","I can use the power law and change of base to simplify and estimate logarithms.","I can use the product and quotient laws to simplify and evaluate.","I can compare quantities on logarithmic scales using ratios.","I can solve exponential equations and growth, decay and interest problems.","I can solve logarithmic equations and reject extraneous roots."],"keyIdeas":{"37":{"idea":"`log_b y = x ⟺ b^x = y`; the log graph is the reflection of the exponential in `y = x`.","look":"The swap machine (Explore); The form translator: one fact, two ways to write it (Translator)"},"38":{"idea":"A log is an exponent; `log_b x` needs `x > 0`; vertical asymptote `x = 0`; passes through `(1, 0)` and `(b, 1)`.","look":"Power ladder (Explore); From ladder to graph: the features of `y = log_b x` (Features)"},"39":{"idea":"`y = a log_b[k(x - d)] + c`: the asymptote moves to `x = d`; map key points.","look":"Domain wall (Explore); Wall, domain and key points by hand (By hand)"},"40":{"idea":"`log_b(x^n) = n log_b x`; `log_b x = log x/log b`.","look":"Power stacker (Explore); Base bridge: change of base without a calculator (Change base)"},"41":{"idea":"`log_b(mn) = log_b m + log_b n`; `log_b(m/n) = log_b m - log_b n`; `log(m + n)` has no law.","look":"Multiply by adding lengths, the slide rule (Explore); Law or impostor? The log law clinic (Clinic)"},"42":{"idea":"Each unit is a factor of 10: compare by 10\u003csup>difference\u003c/sup>.","look":"The scale switcher (Explore); Same ratio, same rise (Ratios)"},"43":{"idea":"Common base, or take logs of both sides; count doubling or halving periods.","look":"Doubling timeline (Explore); Equation lab: two sides, one solution (Solve)"},"44":{"idea":"Combine, convert to exponential form, solve, then check every argument is positive.","look":"Domain gate (Explore); Root audit: kept, gained or lost? (Root audit)"}},"start":{"diagnostic":{"title":"Diagnostic: which modules should I revisit?","intro":"Nine questions, one or two from each module in Chapters 6 and 7. Pick an answer, say how sure you are, then check it. At the end you’ll see which modules to revisit.","questions":[{"id":"d1","topic":"37","goal":1,"prompt":"Write `5^3 = 125` in logarithmic form.","options":[{"t":"`log_5 125 = 3`","why":"The base stays 5; the exponent 3 is the log’s value.","_n":"015a","_k":"482b0154"},{"t":"`log_5 3 = 125`","why":"The log’s value is the exponent, 3. In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"112a","_k":"b37bba99"},{"t":"`log_{125} 5 = 3`","why":"125 is the result, inside the log. In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"213a","_k":"f8e45d77"},{"t":"`log_3 125 = 5`","why":"3 is the exponent, not the base. In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"318a","_k":"868bd905"}],"hints":["`log_b y = x` means `b^x = y`.","`b = 5`, `x = 3`, `y = 125`.","`log_5 125 = 3`."]},{"id":"d2","topic":"38","goal":2,"prompt":"Evaluate `log_2(1/8)`.","options":[{"t":"`-3`","why":"`2^{-3} = 1/8`.","_n":"419a","_k":"af521294"},{"t":"`-1/3`","why":"The exponent is −3.","_n":"516a","_k":"03d07fd9"},{"t":"`1/3`","why":"`(1/8)` isn’t `2^{1/3}`.","_n":"617a","_k":"8ae3bf97"},{"t":"3","why":"`2^3 = 8`, not `1/8`.","_n":"70ca","_k":"9b28fc85"}],"hints":["2 to what power is `1/8`?","`1/8 = 2^{-3}`.","−3."]},{"id":"d3","topic":"38","goal":2,"prompt":"What is the domain of `y = log_3 x`?","options":[{"t":"`{x ∈ ℝ | x > 0}`","why":"3 to any power is positive, so only positive `x` have a log.","_n":"80da","_k":"11c83382"},{"t":"`{x ∈ ℝ | x >= 0}`","why":"`log_3 0` is undefined. `b` to any power is positive, so `log_b` of 0 or a negative number is undefined.","_n":"9839","_k":"7eb18cd7"},{"t":"`{y ∈ ℝ | y > 0}`","why":"That’s the range of `3^x`, and it uses `y`.","_n":"a829","_k":"661f6d62"},{"t":"`{x ∈ ℝ}`","why":"`b` to any power is positive, so `log_b` of 0 or a negative number is undefined.","_n":"b859","_k":"71a797e6"}],"hints":["Which values can `3^y` take?","Only positive values.","`x > 0`."]},{"id":"d4","topic":"39","goal":3,"prompt":"What is the vertical asymptote of `y = 2 log(x - 4) + 1`?","options":[{"t":"`x = -4`","why":"`(x - 4)` moves the vertical asymptote to `x = 4`; stretches and reflections come before translations.","_n":"c849","_k":"32921e2e"},{"t":"`x = 0`","why":"The shift moves the asymptote.","_n":"d879","_k":"b7f5c36a"},{"t":"`x = 4`","why":"The argument `x - 4` is 0 at `x = 4`.","_n":"e869","_k":"c3a382e5"},{"t":"`y = 1`","why":"The log graph has no horizontal asymptote; `c = 1` shifts it up.","_n":"f899","_k":"3223bd0e"}],"hints":["Where is the argument 0?","`x - 4 = 0`.","`x = 4`."]},{"id":"d5","topic":"40","goal":4,"prompt":"Simplify `log_2 8^5`.","options":[{"t":"8","why":"`log_2 8 = 3`, times 5.","_n":"g889","_k":"107cb866"},{"t":"15","why":"`5 log_2 8 = 5 × 3`.","_n":"h8b9","_k":"9b3044cc"},{"t":"40","why":"That multiplies 8 × 5. `log_b(x^n) = n log_b x`: the exponent on the argument comes out in front.","_n":"i8a9","_k":"449bb931"},{"t":"243","why":"That’s `3^5`.","_n":"j118","_k":"a75d2b5e"}],"hints":["Power law.","`5 log_2 8`.","15."]},{"id":"d6","topic":"41","goal":5,"prompt":"Evaluate `log_6 4 + log_6 9`.","options":[{"t":"`log_6 13`","why":"Adding logs multiplies the arguments. The laws work on products and quotients inside \u003cstrong>one\u003c/strong> log: `log m + log n = log(mn)`.","_n":"k128","_k":"a6832948"},{"t":"1","why":"`log_6 6 = 1`, but 4 × 9 = 36.","_n":"l138","_k":"0c610596"},{"t":"2","why":"`log_6 36 = 2`.","_n":"m148","_k":"a025e347"},{"t":"6","why":"`log_6 36 = 2`, not 6.","_n":"n158","_k":"81dde21e"}],"hints":["Product law.","`log_6(4 × 9)`.","`log_6 36 = 2`."]},{"id":"d7","topic":"42","goal":6,"prompt":"Solution A has pH 3 and solution B has pH 6. How many times more acidic is A?","options":[{"t":"2","why":"That’s 6 ÷ 3. Each unit on a log scale is a factor of 10: a difference of 3 means `10^3` = 1000 times.","_n":"o168","_k":"cc0f6bf0"},{"t":"3","why":"That’s the difference of the pH values. Each unit on a log scale is a factor of 10: a difference of 3 means `10^3` = 1000 times.","_n":"p178","_k":"e6e1bc56"},{"t":"30","why":"That’s 3 × 10. Each unit on a log scale is a factor of 10: a difference of 3 means `10^3` = 1000 times.","_n":"q188","_k":"7c210174"},{"t":"1000","why":"Each pH unit is a factor of 10: `10^3`.","_n":"r098","_k":"8178292a"}],"hints":["pH counts powers of 10.","6 − 3 = 3 steps.","`10^3` = 1000."]},{"id":"d8","topic":"43","goal":7,"fixedOrder":true,"prompt":"Solve `2^{x + 1} = 32`.","options":[{"t":"`x = 3`","why":"`x + 1 = 5` gives 4.","_n":"s0a8","_k":"2f10090c"},{"t":"`x = 4`","why":"`32 = 2^5`, so `x + 1 = 5`.","_n":"t179","_k":"7b6f606a"},{"t":"`x = 5`","why":"That’s `x + 1`.","_n":"u169","_k":"56608461"},{"t":"`x = 16`","why":"That’s 32 ÷ 2.","_n":"v159","_k":"43b3a0a9"}],"hints":["Write 32 as a power of 2.","`2^5`.","`x = 4`."]},{"id":"d9","topic":"44","goal":8,"prompt":"Solve `log_2 x + log_2(x - 2) = 3`.","options":[{"t":"`x = 4` or `x = -2`","why":"`x = -2` makes `log_2 x` undefined. Check each candidate in \u003cstrong>every\u003c/strong> original log: all arguments must be positive. A positive candidate can still fail.","_n":"w149","_k":"0de122ad"},{"t":"`x = 5`","why":"Check: 5 × 3 = 15 ≠ 8.","_n":"x1b9","_k":"0d8b4120"},{"t":"`x = 4`","why":"`x(x - 2) = 8` gives `x = 4` or −2; −2 makes `log_2 x` undefined.","_n":"y1a9","_k":"209e2c25"},{"t":"`x = -2`","why":"That’s the candidate to reject: it makes `log_2 x` undefined. Check each candidate in \u003cstrong>every\u003c/strong> original log: all arguments must be positive. A positive candidate can still fail.","_n":"z199","_k":"71d838e9"}],"hints":["Combine the logs.","`x^2 - 2x - 8 = 0`.","4 (reject −2)."]}]}},"connect":{"heading":"Exponential ↔ logarithm concept map","intro":"Chapters 6 and 7 taught eight tools. A concept map shows they’re one idea seen from different sides: every log fact is an exponent fact, and every log equation’s danger comes from the domain. Link the cards to build the map.","summary":"Concept map","how":"The highlighted card is already chosen. Tap the card it links to, then press Link.","ui":{"exp":"Exponent side","log":"Logarithm side","use":"Tools and uses","link":"Link","clear":"Clear","card2":"tap a card","arrow":"↔","needAll":"Tap a second card first.","notStem":"This link starts from §1. Keep it as one of your two cards.","linked":"✓ Linked:","done":"All eight links made."},"cards":{"exp":[{"id":"e_form","t":"`b^x = y`"},{"id":"e_prod","t":"`b^m · b^n = b^{m + n}`"},{"id":"e_pow","t":"`(b^m)^n = b^{mn}`"},{"id":"e_range","t":"range of `b^x`: `y > 0`"},{"id":"e_ha","t":"horizontal asymptote `y = 0`"}],"log":[{"id":"l_form","t":"`log_b y = x`"},{"id":"l_prod","name":"product law","t":"`log_b(mn) = log_b m + log_b n`"},{"id":"l_pow","name":"power law","t":"`log_b(x^n) = n log_b x`"},{"id":"l_cob","name":"change of base","t":"`log_b x = log x/log b`"},{"id":"l_dom","t":"domain of `log_b x`: `x > 0`"},{"id":"l_va","t":"vertical asymptote `x = 0`"},{"id":"l_com","t":"common log: each step of 1 is ×10"}],"use":[{"id":"u_refl","t":"reflection in `y = x`"},{"id":"u_solve","t":"solving `3^x = 20`"},{"id":"u_ext","t":"extraneous roots"},{"id":"u_scale","t":"log scales (×10 per unit)"}]},"challenges":[{"id":"CM1","topics":["37"],"goal":1,"stem":"e_form","prompt":"Link `b^x = y` to its partner on the logarithm side.","_a":"Gwg7BwpHW0E=","why":{"l_form":"Same base, same exponent, same result: `log_b y = x` names the exponent that turns `b` into `y`."},"ask":{"q":"How are `b^x = y` and `log_b y = x` linked? Tap one.","opts":[{"t":"They say the same thing.","why":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"10189","_k":"e12218b2"},{"t":"One is the reciprocal of the other.","why":"Logs and exponentials are inverses, not reciprocals.","_n":"110f9","_k":"56faa2cd"}]},"fb":{"def":"Which card uses the same three letters, `b`, `x` and `y`, written with a logarithm?"}},{"id":"CM2","topics":["41"],"goal":5,"stem":"l_prod","prompt":"Link the \u003cstrong>product law\u003c/strong> to the exponent law it comes from.","_a":"GwE7ERdaUkE=","why":{"e_prod":"Multiplying powers adds exponents: `b^m · b^n = b^{m + n}`. Logs are exponents, so the log of a product is the sum of the logs."},"fb":{"e_pow":"Multiplying numbers adds exponents: that’s the product law.","def":"Logs are exponents. Which exponent law adds exponents when you multiply?"}},{"id":"CM3","topics":["40"],"goal":4,"stem":"l_pow","prompt":"Link the \u003cstrong>power law\u003c/strong> to the exponent law it comes from.","_a":"GwE7EQpCFA==","why":{"e_pow":"A power of a power multiplies exponents: `(b^m)^n = b^{mn}`. So `log_b(x^n) = n log_b x`: the exponent comes out in front as a multiplier."},"fb":{"e_prod":"That law adds exponents when you multiply: it’s behind the product law. Which law multiplies exponents?","def":"`log_b(x^n) = n log_b x`: the exponent on the argument comes out in front. Which exponent law multiplies an exponent by `n`?"}},{"id":"CM4","topics":["37","38"],"goal":[1,2],"stem":"e_ha","prompt":"Link the \u003cstrong>horizontal asymptote `y = 0`\u003c/strong> of `b^x` to its partner for `log_b x`.","_a":"Gwg7FwQX","why":{"l_va":"By reflection in `y = x`, which swaps `x` and `y`, the horizontal asymptote `y = 0` of `b^x` becomes the vertical asymptote `x = 0` of `log_b x`."},"fb":{"u_refl":"The reflection is \u003cem>how\u003c/em> they’re linked. Which feature of `log_b x` does the line `y = 0` turn into?","def":"Reflect the line `y = 0` in `y = x`. Which card is the line you get?"}},{"id":"CM5","topics":["37","38"],"goal":[1,2],"stem":"e_range","prompt":"Link the \u003cstrong>range of `b^x`: `y > 0`\u003c/strong> to its partner for `log_b x`.","_a":"Gwg7BQpYFA==","why":{"l_dom":"Reflection in `y = x` swaps inputs and outputs, so the range `y > 0` of `b^x` becomes the domain `x > 0` of `log_b x`. `b` to any power is positive, so `log_b` of 0 or a negative number is undefined."},"fb":{"u_refl":"The reflection is how they’re linked. Which feature of `log_b x` does the range `y > 0` turn into?","def":"`b` to any power is positive, so `log_b` of 0 or a negative number is undefined. Which card says which `x` a log can take?"}},{"id":"CM6","topics":["42"],"goal":6,"stem":"u_scale","prompt":"Link \u003cstrong>log scales\u003c/strong> to the idea that makes them work.","_a":"Gwg7AgpYFA==","why":{"l_com":"pH, decibels and the Richter scale are built on the common log, base 10, so each step of 1 on the scale is a factor of 10."},"fb":{"def":"Log scales count powers of 10. Which card is about base 10?"}},{"id":"CM7","topics":["43","40"],"goal":[7,4],"stem":"u_solve","prompt":"Link \u003cstrong>solving `3^x = 20`\u003c/strong> to a tool that solves it.","_a":"Gwg7EQpCSg9mBwsDRw==","why":{"l_pow":"Take log of both sides, then the power law: `x log 3 = log 20`, so `x = log 20/log 3`.","l_cob":"That works too: `3^x = 20` means `x = log_3 20`, and change of base gives `x = log 20/log 3`."},"fb":{"l_prod":"There’s no product here; the unknown is an exponent.","def":"The unknown is an exponent. Which tool brings an exponent down?"}},{"id":"CM8","topics":["44"],"goal":8,"stem":"u_ext","stretch":true,"prompt":"Link \u003cstrong>extraneous roots\u003c/strong> to the idea that explains them, then choose the explanation.","_a":"Gwg7BQpYFA==","why":{"l_dom":"An extraneous root comes out of the algebra but makes some argument 0 or negative, so the original log is undefined there."},"ask":{"q":"Which explanation goes with this link? Tap one.","opts":[{"t":"A candidate must make every argument positive, even if the candidate itself is positive.","why":"Check each candidate in \u003cstrong>every\u003c/strong> original log: all arguments must be positive. A positive candidate can still fail.","_n":"120e9","_k":"5c18c7d2"},{"t":"Extraneous roots are the negative answers.","why":"Not just negatives: `log_2(x - 6)` rejects `x = 4`.","_n":"13959","_k":"2504f2af"}]},"fb":{"e_range":"Close: the range of `b^x` becomes the domain of the log. Link to the logarithm side.","def":"An extraneous root fails in the original equation. Which card says which `x` a log can take?"}}],"onePage":{"title":"The chapter on one page","intro":"The finished map, centred on the two equivalent forms. The exponent side and the logarithm side match up, fact for fact; the tools below use both.","centre":"`b^x = y ⟺ log_b y = x`","aria":"Graph of y = 2ˣ and y = log₂ x, mirror images in the dotted line y = x. The horizontal asymptote y = 0 of 2ˣ reflects to the vertical asymptote x = 0 of log₂ x.","expHead":"Exponent side","logHead":"Logarithm side","toolsHead":"Tools that use both","pairs":[{"e":"`b^m · b^n = b^{m + n}`","link":"say the same thing","l":"product law: `log_b(mn) = log_b m + log_b n`","mods":"41"},{"e":"`(b^m)^n = b^{mn}`","link":"say the same thing","l":"power law: `log_b(x^n) = n log_b x`","mods":"40"},{"e":"range of `b^x`: `y > 0`","link":"reflection in `y = x`","l":"domain of `log_b x`: `x > 0`","mods":"37 and 38"},{"e":"horizontal asymptote `y = 0`","link":"reflection in `y = x`","l":"vertical asymptote `x = 0`","mods":"37 and 38"}],"tools":[{"t":"\u003cstrong>Log scales\u003c/strong> use the common log: each step of 1 is ×10.","mods":"42"},{"t":"\u003cstrong>Solving `3^x = 20`:\u003c/strong> take log of both sides, then the power law: `x = log 20/log 3`. Change of base gives the same answer.","mods":"43 and 40"},{"t":"\u003cstrong>Extraneous roots:\u003c/strong> a candidate must make every argument positive, even if the candidate itself is positive.","mods":"44"},{"t":"\u003cstrong>Change of base:\u003c/strong> `log_b x = log x/log b` turns any log into common logs.","mods":"40"}]}},"mixed":{"heading":"Mixed practice","intro":"Fourteen questions from every module in Chapters 6 and 7, mixed up on purpose, so you practise choosing the right idea. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Fourteen questions from all eight modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"43","goal":7,"kind":"num","star":true,"prompt":"A culture of 500 bacteria doubles every 3 h. When will it reach 8000?","label":"Time:","unit":"h","_a":"CFY=","display":"12 h","keypad":"decimal","why":"8000/500 = 16 = `2^4`: four doublings of 3 h is 12 h.","wrong":[{"match":16,"fb":"8000/500 = 16 = `2^4`: four doublings of 3 h."},{"match":4,"fb":"That’s the number of doublings. Each one takes 3 h."}],"hints":["How many times larger than 500 is 8000?","8000/500 = 16 = `2^4`: that’s 4 doublings.","4 doublings × 3 h = 12 h."]},{"id":"mp2","topic":"38","goal":2,"kind":"num","prompt":"`log_4 64`?","label":"`log_4 64 =`","_a":"Cg==","display":"`log_4 64 = 3`","keypad":"decimal","why":"`4^3 = 64`.","wrong":[{"match":16,"fb":"That’s 64 ÷ 4. Ask: 4 to what power gives 64?"}],"hints":["4 to what power gives 64?","`4^2 = 16`, so try the next power.","`4^3 = 64`, so `log_4 64 = 3`."]},{"id":"mp3","topic":"41","goal":5,"kind":"mc","prompt":"Which equals `log(x^2 y/z)`?","options":[{"t":"`2 log x + log y - log z`","why":"Product law for `x^2 y`, quotient law for dividing by `z`, then the power law brings the 2 out in front.","_n":"14969","_k":"5e18ccd0"},{"t":"`2 log x · log y/log z`","why":"The laws work on products and quotients inside \u003cstrong>one\u003c/strong> log: `log m + log n = log(mn)`.","_n":"15939","_k":"7138a63b"},{"t":"`(2 log x + log y)/log z`","why":"The laws work on products and quotients inside \u003cstrong>one\u003c/strong> log: `log m + log n = log(mn)`.","_n":"16949","_k":"864967f7"},{"t":"`log 2x + log y - log z`","why":"`log_b(x^n) = n log_b x`: the exponent on the argument comes out in front.","_n":"17999","_k":"ff85a96f"}],"hints":["Split the product and the quotient first.","`log(x^2 y/z) = log x^2 + log y - log z`.","Power law: `log x^2 = 2 log x`, so it’s `2 log x + log y - log z`."]},{"id":"mp4","topic":"37","goal":1,"kind":"mc","prompt":"What is the inverse of `y = 3^x`?","options":[{"t":"`y = log_x 3`","why":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"189a9","_k":"9ee28e20"},{"t":"`y = log_3 x`","why":"Swap `x` and `y`: `x = 3^y`, which in log form is `y = log_3 x`.","_n":"19979","_k":"38a18ec0"},{"t":"`y = x^3`","why":"That swaps the base and the exponent. An inverse swaps `x` and `y`.","_n":"1a989","_k":"dcc2acb4"},{"t":"`y = 1/3^x`","why":"That’s the reciprocal.","_n":"1b8d9","_k":"01a3cca0"}],"hints":["Swap `x` and `y`.","`x = 3^y`: now write it in log form.","`y = log_3 x`."]},{"id":"mp5","topic":"44","goal":8,"kind":"num","star":true,"prompt":"Solve `log_3(x + 6) - log_3(x - 2) = 2`.","label":"`x =`","_a":"Cg==","display":"`x = 3`","keypad":"decimal","why":"`(x + 6)/(x - 2) = 9`, so `x = 3`; check: `x - 2 = 1 > 0`.","wrong":[{"match":10,"fb":"`log_3 A = 2` means `A = 3^2 = 9`, not 2."},{"match":3.6,"fb":"`3^2 = 9`, not 6."},{"match":-1.5,"fb":"At `x = -1.5`, `x - 2` is negative. Check each candidate in \u003cstrong>every\u003c/strong> original log: all arguments must be positive. A positive candidate can still fail."}],"hints":["Quotient law: make one log on the left.","`log_3({x + 6}/{x - 2}) = 2`, so `{x + 6}/{x - 2} = 3^2 = 9`.","`x + 6 = 9x - 18`, so `x = 3`. Check: `x + 6 = 9` and `x - 2 = 1` are both positive."]},{"id":"mp6","topic":"39","goal":3,"kind":"mc","prompt":"`y = log_2(-x)` is the reflection of `y = log_2 x` in…","options":[{"t":"the `y`-axis","why":"Replacing `x` with `-x` reflects the graph in the `y`-axis.","_n":"1c8e9","_k":"23db22fb"},{"t":"the origin","why":"That’s `-log_2(-x)`: both signs change.","_n":"1d1ba","_k":"176205a7"},{"t":"the `x`-axis","why":"That’s `-log_2 x`.","_n":"1e1aa","_k":"2210f5a5"},{"t":"the line `y = x`","why":"That’s `2^x`.","_n":"1f1da","_k":"2f6558f7"}],"hints":["Is the minus sign with `x`, inside the log, or in front of the log?","A change to `x` inside the log is horizontal.","`x → -x` reflects in the `y`-axis."]},{"id":"mp7","topic":"42","goal":6,"kind":"num","star":true,"prompt":"A concert speaker measures 90 dB and a busy office 60 dB. The speaker’s sound is how many times as intense?","label":"Times as intense:","_a":"CFRUUQ==","display":"1000 times","keypad":"decimal","why":"90 − 60 = 30 dB, and every 10 dB is a factor of 10: `10^3` = 1000.","wrong":[{"match":30,"fb":"Every 10 dB is a factor of 10: 30 dB is `10^3`."},{"match":1.5,"fb":"Every 10 dB is a factor of 10: 30 dB is `10^3`."}],"hints":["Find the difference in decibels.","30 dB is three steps of 10 dB.","Each 10 dB is ×10: `10^3` = 1000."]},{"id":"mp8","topic":"40","goal":4,"kind":"mc","star":true,"fixedOrder":true,"prompt":"Which is the best estimate of `log_2 3`?","use":"`log 2 ≈ 0.301`, `log 3 ≈ 0.477`","options":[{"t":"about 0.18","why":"That’s `log 3 - log 2`.","_n":"1g1ca","_k":"1d6c4ad1"},{"t":"about 0.63","why":"That’s `log 2/log 3`.","_n":"1h17a","_k":"44455bfa"},{"t":"exactly 1.5","why":"3 isn’t `2^{1.5} ≈ 2.83`.","_n":"1i16a","_k":"5b231516"},{"t":"about 1.58","why":"Change of base: `log_2 3 = log 3/log 2 ≈ 0.477/0.301 ≈ 1.58`.","_n":"1j19a","_k":"5b34d67d"}],"hints":["Change of base: `log_2 3 = log 3/log 2`.","`2 \u003c 3 \u003c 4`, so the answer is between 1 and 2.","`0.477/0.301 ≈ 1.58`."]},{"id":"mp9","topic":"43","goal":7,"kind":"num","prompt":"Solve `9^x = 27`.","label":"`x =`","_a":"CEpR","display":"`x = 3/2`","why":"`9^x = 3^{2x}` and `27 = 3^3`, so `2x = 3`.","wrong":[{"match":3,"fb":"`9^x = 3^{2x}`, so `2x = 3`."}],"hints":["Write both sides as powers of 3.","`3^{2x} = 3^3`.","`2x = 3`, so `x = 3/2`."]},{"id":"mp10","topic":"38","goal":2,"kind":"mc","prompt":"Which point is on `y = log_5 x`?","options":[{"t":"`(5, 0)`","why":"`log_5 5 = 1`.","_n":"1k18a","_k":"989fa87e"},{"t":"`(1/5, -1)`","why":"`log_5(1/5) = -1`, because `5^{-1} = 1/5`.","_n":"1l13a","_k":"b3086405"},{"t":"`(0, 1)`","why":"`log_5 0` is undefined.","_n":"1m12a","_k":"1c8eb4b6"},{"t":"`(-1, 1/5)`","why":"Swapped: that’s on `5^x`.","_n":"1n899","_k":"4acbb25d"}],"hints":["For each point, ask: is `5^y = x`?","`5^{-1} = 1/5`.","`(1/5, -1)`."]},{"id":"mp11","topic":"41","goal":5,"kind":"num","star":true,"prompt":"`log_2 40 - log_2 5`?","label":"`log_2 40 - log_2 5 =`","_a":"Cg==","display":"`log_2 40 - log_2 5 = 3`","keypad":"text","why":"Quotient law: `log_2(40/5) = log_2 8 = 3`.","wrong":[{"match":35,"fb":"That subtracts the arguments. The laws work on products and quotients inside \u003cstrong>one\u003c/strong> log: `log m + log n = log(mn)`."}],"logWrong":{"has":"35","fb":"`log_2 35` subtracts the arguments. The laws work on products and quotients inside \u003cstrong>one\u003c/strong> log: `log m + log n = log(mn)`."},"hints":["Quotient law.","`log_2(40/5) = log_2 8`.","`log_2 8 = 3`."]},{"id":"mp12","topic":"44","goal":8,"kind":"num","prompt":"Solve `log x = 3`.","label":"`x =`","_a":"CFRUUQ==","display":"`x = 1000`","keypad":"decimal","why":"`log x` is base 10, and `log x = 3` means `10^3 = x`.","wrong":[{"match":30,"fb":"`log x = 3` means `10^3 = x`."}],"hints":["`log x` means base 10.","Convert: `10^3 = x`.","`x = 1000`."]},{"id":"mp13","topic":"39","goal":3,"kind":"two","star":true,"prompt":"For `y = log_3[3(x + 1)] - 2`, find the `x`-intercept and the vertical asymptote.","boxes":[{"label":"`x`-intercept: `x =`"},{"label":"Vertical asymptote: `x =`"}],"_a":"YlZITFRo","display":"`x`-intercept 2; asymptote `x = -1`","why":"`3(x + 1) = 3^2` gives `x = 2`; the argument is 0 at `x = -1`.","boxWrong":[{"def":"At the `x`-intercept, `y = 0`: solve `log_3[3(x + 1)] = 2` by writing it in exponential form."},{"match":[1],"fb":"`(x - ":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"1q8c9","_k":"717c081c"},{"t":"`3^4 = 64`","why":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"1r859","_k":"6c23238d"}]},"b":{"prompt":"Which is `log_9 3 = 1/2` in exponential form?","options":[{"t":"`(1/2)^9 = 3`","why":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"1s869","_k":"a9fc378b"},{"t":"`3^{1/2} = 9`","why":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"1t879","_k":"9b8d6e21"},{"t":"`9^{1/2} = 3`","why":"The base stays 9, and the log’s value, `1/2`, is the exponent: `√9 = 3`.","_n":"1u889","_k":"9b131a20"},{"t":"`9^3 = 1/2`","why":"In `log_b y = x`, the base stays the base and the log’s value is the exponent: `b^x = y`.","_n":"1v919","_k":"2b7c8496"}]}},{"id":"f2","cat":"K","topic":"38","goal":2,"a":{"prompt":"Evaluate `log_3 81`.","options":[{"t":"`1/4`","why":"Upside down: `3^4 = 81`, so the exponent is 4.","_n":"1w929","_k":"0287c574"},{"t":"3","why":"`3^3 = 27`, not 81.","_n":"1x8f9","_k":"10210738"},{"t":"4","why":"`3^4 = 81`.","_n":"1y8e9","_k":"a0413f59"},{"t":"27","why":"That’s 81 ÷ 3.","_n":"1z8d9","_k":"e62f3318"}]},"b":{"prompt":"Evaluate `log_2 32`.","options":[{"t":"`1/5`","why":"Upside down: `2^5 = 32`, so the exponent is 5.","_n":"208c9","_k":"01e3b334"},{"t":"2","why":"2 is the base. Ask: 2 to what power gives 32?","_n":"218b9","_k":"2f474bfc"},{"t":"5","why":"`2^5 = 32`.","_n":"228a9","_k":"ee8a5537"},{"t":"16","why":"That’s 32 ÷ 2.","_n":"23899","_k":"ab6860f1"}]}},{"id":"f3","cat":"K","topic":"40","goal":4,"a":{"prompt":"Which expression equals `log_5 12`?","options":[{"t":"`log 12 - log 5`","why":"That’s `log(12/5)`, the log of a quotient. The laws work on products and quotients inside \u003cstrong>one\u003c/strong> log: `log m + log n = log(mn)`.","_n":"24889","_k":"d8bf813b"},{"t":"`{lo idic.”","why":"That’s 3 × 10. Each unit on a log scale is a factor of 10: a difference of 3 means `10^3` = 1000 times.","_n":"43896","_k":"01402f46"}]}},{"id":"f12","cat":"A","topic":"43","goal":7,"a":{"fixedOrder":true,"prompt":"A radioactive sample’s mass halves every 8 days. How long until 400 g becomes 25 g?","options":[{"t":"4 days","why":"That’s the number of half-lives. Count halvings: 400 → 200 → 100 → 50 → 25 is 4 half-lives.","_n":"44886","_k":"4dc7bdd0"},{"t":"16 days","why":"16 is the ratio 400/25, not a time. Count halvings: 400 → 200 → 100 → 50 → 25 is 4 half-lives.","_n":"458b5","_k":"297889f2"},{"t":"32 days","why":"400 → 200 → 100 → 50 → 25: 4 half-lives of 8 days.","_n":"468c5","_k":"778d6067"},{"t":"48 days","why":"That’s 6 half-lives: 400/64.","_n":"478d5","_k":"130f7cbe"}]},"b":{"fixedOrder":true,"prompt":"A car loses half its value every 4 years. How long until $32 000 becomes $4000?","options":[{"t":"3 years","why":"That’s the number of halvings. Count halvings: 32 000 → 16 000 → 8000 → 4000 is 3 half-lives of 4 years.","_n":"488e5","_k":"eb4e9fdc"},{"t":"8 years","why":"8 is the ratio 32 000/4000, not a time. Count halvings: 32 000 → 16 000 → 8000 → 4000 is 3 half-lives of 4 years.","_n":"49875","_k":"07f557e7"},{"t":"12 years","why":"3 halvings: 32 000 → 16 000 → 8000 → 4000.","_n":"4a885","_k":"f5d0b3b3"},{"t":"16 years","why":"That’s 4 halvings, down to $2000.","_n":"4b895","_k":"579d515e"}]}},{"id":"f13","cat":"A","topic":"42","goal":6,"a":{"fixedOrder":true,"prompt":"Loudness is `L = 10 log(I/I_0)` dB. A sound is 1000 times as intense as another. How many decibels louder is it?","options":[{"t":"3 dB","why":"That’s `log 1000`. Multiply by 10.","_n":"4c8a5","_k":"e7c2450b"},{"t":"30 dB","why":"`10 log 1000 = 10 × 3`.","_n":"4d835","_k":"3fbf270d"},{"t":"300 dB","why":"`log 1000 = 3`, not 30.","_n":"4e845","_k":"c74cab78"},{"t":"1000 dB","why":"That’s the ratio, not the change in level: every 10 dB is a factor of 10.","_n":"4ffd6","_k":"5b6a7ca4"}]},"b":{"fixedOrder":true,"prompt":"A sound is 100 000 times as intense as another. How many decibels louder is it?","options":[{"t":"5 dB","why":"That’s `log 100 000`. Multiply by 10.","_n":"4gfc6","_k":"755fe9c6"},{"t":"50 dB","why":"`10 log 100 000 = 10 × 5`.","_n":"4hff6","_k":"7e01bb6b"},{"t":"500 dB","why":"`log 100 000 = 5`, not 50.","_n":"4ife6","_k":"7d4367ae"},{"t":"100 000 dB","why":"That’s the ratio, not the change in level: every 10 dB is a factor of 10.","_n":"4jf96","_k":"abb71199"}]}},{"id":"f14","cat":"A","topic":"40","goal":4,"a":{"prompt":"Between which two whole numbers is `log_2 10`, and which is it closer to?","use":"`log 2 ≈ 0.301`","options":[{"t":"Between 3 and 4, closer to 4","why":"`1/0.301 ≈ 3.3`.","_n":"4kf86","_k":"e42b6245"},{"t":"Between 4 and 5","why":"`2^4 = 16 > 10`.","_n":"4lfb6","_k":"c9144200"},{"t":"Between 0 and 1","why":"That’s `log 2`.","_n":"4mfa6","_k":"d9c17d5e"},{"t":"Between 3 and 4, closer to 3","why":"`2^3 = 8 \u003c 10 \u003c 16 = 2^4`; `log_2 10 = 1/log 2 ≈ 3.32`.","_n":"4n056","_k":"fc3ee510"}]},"b":{"prompt":"Between which two whole numbers is `log_3 20`, and which is it closer to?","use":"`log 2 ≈ 0.301`, `log 3 ≈ 0.477`","options":[{"t":"Between 6 and 7","why":"That’s 20 ÷ 3.","_n":"4o046","_k":"06cb75bb"},{"t":"Between 2 and 3, closer to 2","why":"`1.301/0.477 ≈ 2.7`, which is nearer 3.","_n":"4pf76","_k":"29a207ad"},{"t":"Between 2 and 3, closer to 3","why":"9 \u003c 20 \u003c 27; `log 20/log 3 ≈ 1.301/0.477 ≈ 2.73`.","_n":"4qf86","_k":"dff3eacc"},{"t":"Between 1 and 2","why":"`3^2 = 9 \u003c 20`.","_n":"4rf56","_k":"218e8dfd"}]}},{"id":"f15","cat":"A","topic":"43","goal":7,"a":{"prompt":"$1000 is invested at 6% per year, compounded annually. Which equation gives the number of years `n` to reach $2000, and what’s the best estimate?","use":"`log 2 ≈ 0.301`, `log 1.06 ≈ 0.0253`","options":[{"t":"`1000 + 60n = 2000`; about 17 years","why":"That’s simple interest.","_n":"4sf66","_k":"70e5f623"},{"t":"`1.06
