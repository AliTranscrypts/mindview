.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 05: hero equation, N21 zero builder, equation from a graph, find-the-equation inputs, matching thumbnails */
.hero .hero-eq .m{white-space:normal}
.hero-eq .ord{text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.08em}
/* N21 zero builder */
.zb-sub{font:400 1.05rem/1.6 var(--font-math);margin:0 0 8px;max-width:none}
.zb-sub:empty{display:none}
.zb-sub .zb-sep{margin-right:.2em}
.zb-cap .zb-f{border-radius:4px;transition:background-color .3s}
.zb-cap .zb-hl{background:var(--hi);color:var(--hi-ink)}
.zb-zeros{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-top:12px}
.zb-g{flex:0 0 auto;display:grid;gap:6px;justify-items:start;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.zb-g.sel{border-color:var(--ink);background:var(--hi-soft)}
.zb-zl{font-weight:700;font-size:.9rem}
button.zb-zl{border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.2em .6em;min-height:30px}
button.zb-zl[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.zb-ord{display:flex;gap:4px;align-items:center}
.zb-ord .tiny{margin-right:2px;color:var(--ink-2)}
.zb-ord .chip{min-width:34px;padding:.2em .6em}
.zb-ord .chip:disabled{opacity:.4}
.zb-ord .chip.on:disabled{opacity:1}
.zb-addrow{margin-top:4px}
.zb-win{margin-top:4px}
.zb-win > .tiny:first-child{font-weight:700}
.zb-help{margin:10px 0 0}
.zb-tg{margin:10px 0 0}
.zb-lensnote{margin:8px 0 0;max-width:none}
.zb-lensnote:empty{display:none}
canvas.plot.zb-lensc{max-width:240px;margin:8px auto 0;border:0;background:transparent}
.zb-strip{margin-top:10px}
.zb-strip:empty{display:none}
.zb-tbl th,.zb-tbl td{text-align:center;white-space:nowrap}
.zb-tbl td.zb-pos{background:var(--hi-soft);font-weight:700}
.zb-tbl tr.zb-prod th,.zb-tbl tr.zb-prod td{border-top:2px solid var(--ink)}
.zb-task-read{margin-top:14px}
.zb-task-ctrl{margin-bottom:16px}
/* Part 3: equation from a graph */
.eq-keys{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.eq-keys:not(:focus-within){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.eq-keys .chip{min-width:40px}
.eq-fan{margin:8px 0 0}
.eq-fan:empty{display:none}
.eq-eq{font-size:clamp(1.3rem,3.4vw,1.85rem)}
.eq-step{margin:0 0 10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.eq-step.now{border-color:var(--ink)}
.eq-step h4{margin:0 0 6px;font-size:.95rem}
.eq-step.done h4{color:var(--green)}
.eq-step p{margin:0 0 6px}
.eq-step p:last-child{margin-bottom:0}
.eq-ords{display:flex;flex-wrap:wrap;gap:10px 16px}
.eq-og{display:grid;gap:4px}
.eq-pts{margin:6px 0 0}
.eq-step p.eq-sub{font:400 1.2rem var(--font-math);overflow-wrap:anywhere;margin:10px 0 0}
.eq-sub .m{white-space:normal}
.eq-step .numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
/* Practice 2: find the equation */
.ff-row{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px}
.ff-f{display:flex;align-items:center;gap:8px;font-weight:700}
/* Practice 1: matching thumbnails, two per row */
[data-act-id="match"] .match-col:nth-child(2){grid-template-columns:repeat(2,minmax(0,1fr))}
[data-act-id="match"] .match-col:nth-child(2) h4{grid-column:1/-1}
[data-act-id="match"] .match-col:nth-child(2) .mitem{flex-direction:column;align-items:stretch;padding:.35em}
[data-act-id="match"] .match-col:nth-child(2) .mitem > span{width:100%}
[data-act-id="match"] .mitem canvas.plot{width:100%;max-width:none;margin:0;pointer-events:none}

ind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"92306e9b","content":{"id":"05-graphing-from-factored-form","kind":"topic","title":"Graphing from factored form","topic":"Graphing from Factored Form","readyTopic":"graphing from factored form","hero":{"eq":"\u003cspan class=\"m\">\u003ci>y\u003c/i> = \u003cspan class=\"p-a\">\u003ci>a\u003c/i>\u003c/span>\u003cspan class=\"nw\">(\u003ci>x\u003c/i> − \u003ci>r\u003c/i>\u003csub>1\u003c/sub>)\u003c/span>\u003cspan class=\"nw\">(\u003ci>x\u003c/i> − \u003ci>r\u003c/i>\u003csub>2\u003c/sub>)\u003csup class=\"ord\">2\u003c/sup>\u003c/span>\u003cspan class=\"nw\">(\u003ci>x\u003c/i> − \u003ci>r\u003c/i>\u003csub>3\u003c/sub>)\u003csup class=\"ord\">3\u003c/sup>\u003c/span>\u003c/span>","eqLabel":"y equals a, times x minus r 1, times x minus r 2 squared, times x minus r 3 cubed","eqSize":"md","headline":"The factors draw the graph","text":"In \u003cstrong>factored form\u003c/strong>, every bracket is a \u003cstrong>zero\u003c/strong>: `(x - r)` is zero at `x = r`. The bracket’s power is the zero’s \u003cstrong>order\u003c/strong>, and the order tells you how the graph meets the axis there. Add the orders for the degree, use `@a{a}` for the end behaviour, put in `x = 0` for the `y`-intercept, and you can sketch the whole graph without expanding anything.","fig":{"shape":"wide","caption":"`y = (x + 2)(x - 1)^2(x - 3)^3`","aria":"An x-axis from −4 to 4 with zeros at −2, 1 and 3, of orders 1, 2 and 3. A round lens above each zero shows the shape there: a straight crossing at −2, a touch-and-turn at 1, and a crossing that flattens at 3."},"lensCaps":["order 1: crosses","order 2: touches","order 3: crosses and flattens"]},"goals":["I can find the zeros of a polynomial in factored form, and the order of each zero.","I can describe how a graph behaves at a zero of order 1, 2 or 3.","I can find the degree, leading coefficient, end behaviour and `y`-intercept from factored form without expanding.","I can sketch a polynomial from its factored form and state where it is positive and negative.","I can find the equation of a polynomial from its graph, using one extra point to find `a`.","I can decide whether given conditions fix exactly one polynomial, and what extra information would."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Zeros of factors","goal":1,"prompt":"What value of `x` makes `2x + 5` equal to 0?","options":[{"t":"`-5`","why":"`2(-5) + 5 = -5`, not 0.","_n":"0065","_k":"66634538"},{"t":"`-5/2`","why":"`2x + 5 = 0` gives `2x = -5`, so `x = -5/2`.","_n":"1055","_k":"b4342279"},{"t":"`-2/5`","why":"`2(-2/5) + 5 = 21/5`, not 0. It’s −5 ÷ 2.","_n":"2045","_k":"a5dadcc8"},{"t":"`5/2`","why":"Check: `2(5/2) + 5 = 10`, not 0.","_n":"30b5","_k":"80bb1887"}],"hints":["Set `2x + 5 = 0` and solve.","Subtract 5, then divide by 2.","`x = -5/2`."]},{"id":"w2","skill":"Zeros of factors","goal":1,"prompt":"Which `x`-values make `(x - 4)(x + 1)` equal to 0?","options":[{"t":"4 only","why":"`x = -1` makes the second bracket 0, so the product is 0 too.","_n":"40a5","_k":"4ff6b9fb"},{"t":"−4 and 1","why":"At `x = -4`, `(-8)(-3) = 24`, not 0.","_n":"5095","_k":"33b119ae"},{"t":"4 and −1","why":"A product is 0 when a factor is 0: `x - 4 = 0` or `x + 1 = 0`.","_n":"6085","_k":"6cfcf053"},{"t":"4 and 1","why":"`x + 1 = 0` at `x = -1`.","_n":"70f5","_k":"39fc8ec7"}],"hints":["When is a product equal to 0?","Set each bracket to 0.","`x = 4` or `x = -1`."]},{"id":"w3","skill":"Leading term and end behaviour","goal":3,"prompt":"What is the end behaviour of `y = -x^4 + 3x`?","options":[{"t":"Q2 to Q1","why":"`-x^4` is negative for large `|x|`, so both arms point down.","_n":"80e5","_k":"c19b2683"},{"t":"Q3 to Q4","why":"Even degree with a negative leading coefficient: both arms down.","_n":"9736","_k":"82195e3f"},{"t":"Q2 to Q4","why":"Degree 4 is even, so the arms point the same way.","_n":"a746","_k":"75bc2c17"},{"t":"Q3 to Q1","why":"Far out, `-x^4` outgrows `3x`.","_n":"b716","_k":"470e1f55"}],"hints":["Find the leading term.","`-x^4`: even degree, negative coefficient.","Both arms down: Q3 to Q4."]},{"id":"w4","skill":"Leading term and end behaviour","goal":3,"prompt":"What is the leading term of `(x - 1)^2(2x + 3)`?","options":[{"t":"`x^3`","why":"`(2x + 3)` contributes `2x`, not `x`.","_n":"c726","_k":"d3e04c7f"},{"t":"`2x^2`","why":"The square makes `(x - 1)^2` degree 2; with the degree-1 factor, that’s 2 + 1 = 3.","_n":"d6f6","_k":"2a9df67b"},{"t":"`2x^3`","why":"`x^2` from `(x - 1)^2`, times `2x` from `(2x + 3)`.","_n":"e706","_k":"8b65ee54"},{"t":"`-2x^3`","why":"The −1 in `(x - 1)` doesn’t affect the leading term: `(x - 1)^2` starts with `x^2`.","_n":"f6d6","_k":"b3287bfb"}],"hints":["Take the highest-power term from each factor.","`(x - 1)^2` starts with `x^2`; `(2x + 3)` starts with `2x`.","`x^2 × 2x = 2x^3`."]},{"id":"w5","skill":"Intervals","goal":4,"prompt":"`y = (x - 1)(x - 5)` is a parabola that opens up. Where is it negative?","options":[{"t":"`(-∞, 1) ∪ (5, ∞)`","why":"Outside the zeros an upward parabola is above the axis.","_n":"g6e6","_k":"a3a59cd7"},{"t":"`(1, 5)`","why":"Opening up, it’s below the axis between its zeros.","_n":"h7b6","_k":"6557dca7"},{"t":"`(-∞, 3)`","why":"Decreasing isn’t the same as negative.","_n":"i7c6","_k":"4c8cef0c"},{"t":"`[1, 5]`","why":"At 1 and 5 the value is 0, which isn’t negative.","_n":"jed5","_k":"e67b6e5f"}],"hints":["Where is an upward parabola below the axis?","Between its zeros, 1 and 5.","`(1, 5)`, with round brackets because the zeros give 0."]},{"id":"w6","skill":"Solving for \u003ci>a\u003c/i>","goal":5,"prompt":"`y = a(x - 2)(x + 1)` passes through (0, 4). What is `a`?","options":[{"t":"−2","why":"At `x = 0`: `a(-2)(1) = -2a = 4`, so `a = -2`.","_n":"kec5","_k":"e86d231e"},{"t":"`-1/2`","why":"`-2a = 4` gives `a = 4 ÷ (-2) = -2`.","_n":"leb5","_k":"73a2b6eb"},{"t":"2","why":"`(0 - 2) = -2`, so `-2a = 4`.","_n":"mea5","_k":"82b12ea9"},{"t":"4","why":"4 is `y` at `x = 0`. It equals `a` times the brackets.","_n":"nf15","_k":"83d99847"}],"hints":["Substitute `x = 0` and `y = 4`.","`4 = a(0 - 2)(0 + 1) = -2a`.","`a = 4 ÷ (-2) = -2`."]}],"refreshers":{"Zeros of factors":"A product is 0 exactly when one of its factors is 0. Set each bracket to 0 and solve: `x + 1 = 0` gives `x = -1`; `2x + 5 = 0` gives `x = -5/2`.","Leading term and end behaviour":"Multiply the highest-power term of each factor: `(x - 1)^2(2x + 3)` starts with `x^2 · 2x = 2x^3`. Then use module 03: even degree, same direction; odd degree, opposite; `a > 0` sends the right arm up.","Intervals":"Positive means above the `x`-axis; negative means below. Zeros are left out, so the brackets at zeros are round: an upward parabola with zeros 1 and 5 is negative on `(1, 5)`.","Solving for \u003ci>a\u003c/i>":"Substitute a point that is on the graph but isn’t a zero, then solve: (0, 4) on `y = a(x - 2)(x + 1)` gives `4 = -2a`, so `a = -2`."}}},"explore":{"heading":"Zero builder","intro":"Drop zeros on the axis, give each one an order, and set `@a{a}`. The graph and the equation update together. Use the lens to zoom in on any zero.","predictions":[{"id":"p1","start":{"z":[[-2,1],[1,1],[3,1]],"a":1},"end":{"z":[[-2,1],[1,2],[3,1]],"a":1},"prompt":"The zero at 1 will change from order 1 to order 2. What will the graph do at `x = 1`?","options":[{"t":"Cross the axis more steeply","_n":"of05","_k":"5f965afb"},{"t":"Stop being a zero","_n":"pef5","_k":"628dabeb"},{"t":"Touch the axis and turn back","_n":"qee5","_k":"f6940ece"},{"t":"Cross the axis and flatten","_n":"rf55","_k":"3f3aecdf"}],"explain":"`(x - 1)^2` is never negative, so the sign of `y` is the same on both sides of 1: the graph comes down to the axis and turns back. The degree also went up by 1, so now both arms point up."},{"id":"p2","start":{"z":[[2,1]],"a":1,"mode":"lens","lens":2},"end":{"z":[[2,3]],"a":1},"prompt":"The order at 2 will change to 3, making `y = (x - 2)^3`. In the lens, what will the graph look like at `x = 2`?","options":[{"t":"It turns around: a local maximum at 2","_n":"sf45","_k":"f9189feb"},{"t":"It crosses in a straight line","_n":"te75","_k":"a033b30a"},{"t":"It touches and turns back","_n":"ue85","_k":"04465144"},{"t":"It crosses, flattening out for an instant","_n":"ve95","_k":"f220aab5"}],"explain":"`(x - 2)^3` is negative left of 2 and positive right of it, so the graph crosses. But near 2 it’s very small (`0.1^3 = 0.001`), so it flattens as it crosses. It never turns around: an order 3 zero is not a turning point."},{"id":"p3","start":{"z":[[-1,1],[2,2],[3,1]],"a":1,"hideY":true},"prompt":"What is the `y`-intercept?","options":[{"t":"−12","_n":"wea5","_k":"a1364f68"},{"t":"−6","_n":"xeb5","_k":"ff4fd1c7"},{"t":"6","_n":"yec5","_k":"a68abe33"},{"t":"12","_n":"zed5","_k":"187f22af"}],"explain":"Substitute `x = 0` into every bracket, keeping the powers: `(0 + 1)(0 - 2)^2(0 - 3) = (1)(4)(-3) = -12`. Forgetting the square gives `(1)(-2)(-3) = 6`; dropping a sign gives 12; −6 multiplies the zeros −1, 2, 3 instead of the brackets."},{"id":"p4","start":{"z":[[-1,2],[2,1]],"a":1},"end":{"a":-0.5},"prompt":"`@a{a}` will change from 1 to −½. What changes?","options":[{"t":"The zeros move","_n":"10ee5","_k":"2fa81999"},{"t":"The graph shifts down by ½","_n":"11ef5","_k":"2f750de3"},{"t":"Only the end behaviour changes","_n":"12f05","_k":"1a828c37"},{"t":"The graph flips over the `x`-axis and becomes half as tall; the zeros and their orders stay the same","_n":"13f16","_k":"4e77ab59"}],"explain":"`a` multiplies every `y`-value. A zero stays a zero (`-½ × 0 = 0`), so the zeros and their orders can’t change. Every other point is multiplied by −½: flipped and halved."}],"challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build a cubic with `@a{a} > 0` that crosses the axis at −3 and touches it at 2.","why":"`y = a(x + 3)(x - 2)^2` with any positive `a`: order 1 at −3 (crosses), order 2 at 2 (touches), degree 1 + 2 = 3.","named":{"signs":"Check the signs: the graph should cross at `x = -3` and touch at `x = 2`.","swapped":"At −3 your graph touches and at 2 it crosses. Swap the orders.","order3":"That flattens as it crosses and makes the degree 5. A plain crossing is order 1.","aneg":"The challenge asks for `a > 0`."},"general":"Check the challenge: a crossing at −3 (odd order), a touch at 2 (even order), degree 3 in all, and `a > 0`.","hints":["Crossing means an odd order; touching means an even order.","Put a zero of order 1 at −3 and a zero of order 2 at 2.","`y = a(x + 3)(x - 2)^2` with any positive `a`."]},{"id":"tc2","goal":[1,5],"prompt":"Match the dashed target graph: it crosses at −4, crosses and flattens at 0, touches at 3, and passes through the marked point (1, −10). \u003cspan class=\"tiny muted\">(Turn on \u003cstrong>Show the TC2 target\u003c/strong> under the graph to see it.)\u003c/span>","why":"`y = -0.5(x + 4)x^3(x - 3)^2`: at `x = 1` the brackets give (5)(1)(4) = 20, and `20a = -10` gives `a = -0.5`.","named":{"wrongA":"Your graph is the right shape but passes through (1, {v}). At `x = 1` the brackets give (5)(1)(4) = 20, so `20a = -10`.","at0":"At 0 the target flattens as it crosses: that’s order 3.","at3":"At 3 the target touches without crossing: an even order."},"general":"Compare your graph with the dashed target: set the zeros first, then the order at each zero, then `a`.","hints":["Set the zeros and orders from the target’s behaviour first. `a` comes last.","`y = a(x + 4)x^3(x - 3)^2`. Substitute `x = 1`.","`a(5)(1)(4) = -10`, so `a = -0.5`."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"Build the polynomial of \u003cstrong>lowest possible degree\u003c/strong> that is positive exactly on `(-2, 1) ∪ (1, 4)`, negative exactly on `(-∞, -2) ∪ (4, ∞)`, and has `y`-intercept 16.","why":"It’s the only one: the sign doesn’t change at 1, so that’s an even-order zero, and the lowest choice is order 2; the sign changes at −2 and 4, so order 1; negative at both ends with even degree means `a \u003c 0`; the `y`-intercept gives `a(2)(1)(-4) = 16`, so `a = -2`.","named":{"cross1":"With a crossing at 1, the graph would change sign there. But it’s positive on both sides of 1.","degree":"That works for the signs, but the degree isn’t the lowest possible.","apos":"With `a > 0` and even degree, both ends would be positive.","wrongA":"Your `y`-intercept is {v}. At `x = 0` the brackets give (2)(1)(−4) = −8, so `-8a = 16`."},"general":"Check the signs: the graph must change sign at −2 and at 4, stay positive on both sides of 1, and have `y`-intercept 16.","hints":["Where does the sign change? Where does it stay the same?","Sign changes at −2 and 4 (odd orders); no change at 1 (even order). Both ends negative: even degree with `a \u003c 0`.","`y = a(x + 2)(x - 1)^2(x - 4)`. At `x = 0`: `-8a = 16`, so `a = -2`."]}]},"part3":{"slug":"equation","name":"Equation","heading":"Equation from a graph","intro":"Read the zeros and how the graph meets the axis there. Then use one more point to find `@a{a}`.","steps":["1. Tap the zeros","2. Set each order","3. The fan","4. Pick a point","5. Enter `@a{a}`"],"fan":"Same zeros, many graphs. One more point picks the right one.","fb":{"miss":"No zero there. Tap the `x`-axis exactly where the graph meets it.","evenAtCross":"The graph changes sides here: odd order.","oneAtFlat":"Look closely: it flattens as it crosses. That’s order 3.","threeAtCross":"That flattens as it crosses. A plain crossing is order 1.","oddAtTouch":"An even power never changes sign, so at an even-order zero the graph touches and turns back. An odd power changes sign, so the graph crosses.","zeroPick":"That’s a zero: every member of the fan passes through it, so it can’t tell you `a`.","aSign":"Your curve is the mirror image. Check the sign of each bracket at the point you chose.","aInv":"Divide the `y`-value by the bracket product, not the other way round.","aOther":"Substitute a point that is \u003cstrong>not\u003c/strong> a zero; then `a` = (its `y`-value) ÷ (the product of the brackets there)."},"rounds":[{"id":"r1","name":"Round 1","kind":"cubic","points":[[0,4],[3,-2]],"desc":"Round 1 graph, a cubic: rises from the lower left, crosses the x-axis at −1, 2 and 4, and ends in the upper right. Labelled points (0, 4) and (3, −2).","_a":"QhBJEgw+Yk8IHgJtGj4LTghvH2sCSQg/ZB4RURRfCUwMTw=="},{"id":"r2","name":"Round 2","kind":"quartic","points":[[0,-27],[2,25]],"desc":"Round 2 graph, a quartic with both arms down: touches the x-axis at −3, crosses it at 1 and at 3. Labelled points (0, −27) and (2, 25).","_a":"QhBJEgw+Yk8KHgFtGj4ITghvH2sFSQg/ZB4RURRfFFNE"},{"id":"r3","name":"Round 3","kind":"degree 5","points":[[0,-3],[2,2]],"desc":"Round 3 graph, degree 5, from the upper left to the lower right: crosses the x-axis at −2, flattens as it crosses at 1, and crosses at 3. Labelled points (0, −3) and (2, 2).","note":"The leading coefficient is −½, and the end behaviour (Q2 to Q4) agrees: degree 5, `a \u003c 0`.","_a":"QhBJEgw+Yk8LHgJtGj4ITgpvH2sFSQg/ZB4RURRfFFIXB04="}],"quickCheck":{"title":"Which equation?","summary":"Which equation?","items":[{"id":"q1","goal":[1,5],"prompt":"A graph crosses at −1 and 3, touches at 0, and both arms point down. Which could it be?","choices":[{"t":"`y = -x^2(x + 1)(x - 3)`","fb":"Right. Touching at 0 needs `x^2`; crossing at −1 and 3 needs `(x + 1)` and `(x - 3)`; both arms down needs a negative leading coefficient.","_n":"14f06","_k":"bdb5e93f"},{"t":"`y = x^2(x + 1)(x - 3)`","fb":"Touching at 0 needs `x^2`; crossing at −1 and 3 needs `(x + 1)` and `(x - 3)`; both arms down needs a negative leading coefficient.","_n":"15f36","_k":"aecd42aa"},{"t":"`y = -x(x + 1)^2(x - 3)`","fb":"Touching at 0 needs `x^2`; crossing at −1 and 3 needs `(x + 1)` and `(x - 3)`; both arms down needs a negative leading coefficient.","_n":"16f26","_k":"1ffc075c"},{"t":"`y = -x^2(x - 1)(x + 3)`","fb":"Touching at 0 needs `x^2`; crossing at −1 and 3 needs `(x + 1)` and `(x - 3)`; both arms down needs a negative leading coefficient.","_n":"17ed6","_k":"8d1c04de"}]},{"id":"q2","goal":3,"prompt":"What is the `y`-intercept of `y = -2(x - 1)^2(x + 4)`?","choices":[{"t":"−8","fb":"Right. At 0: `-2 × (-1)^2 × 4 = -2 × 1 × 4 = -8`.","_n":"18ec6","_k":"12d820f1"},{"t":"8","fb":"At 0: `-2 × (-1)^2 × 4 = -2 × 1 × 4 = -8`.","_n":"19ef6","_k":"e688d9de"},{"t":"−2","fb":"At 0: `-2 × (-1)^2 × 4 = -2 × 1 × 4 = -8`.","_n":"1aee6","_k":"07a8ead1"},{"t":"−32","fb":"At 0: `-2 × (-1)^2 × 4 = -2 × 1 × 4 = -8`.","_n":"1bf96","_k":"c5f46f3f"}]},{"id":"q3","goal":2,"prompt":"A zero of order 3 at `x = -2`. What does the graph do there?","choices":[{"t":"Crosses and flattens","fb":"Right. Odd order: it crosses. Order 3: it flattens as it crosses, without turning.","_n":"1cf86","_k":"0621b6b8"},{"t":"Touches","fb":"Odd order: it crosses. Order 3: it flattens as it crosses, without turning.","_n":"1deb6","_k":"0953b5e7"},{"t":"Crosses straight","fb":"Odd order: it crosses. Order 3: it flattens as it crosses, without turning.","_n":"1eec6","_k":"bc2e898b"},{"t":"Turns around","fb":"Odd order: it crosses. Order 3: it flattens as it crosses, without turning.","_n":"1fe96","_k":"b06774de"}]},{"id":"q4","goal":3,"prompt":"What is the leading coefficient of `y = (3 - x)(x + 2)^2`?","choices":[{"t":"−1","fb":"Right. `(3 - x)` starts with `-x` and `(x + 2)^2` with `x^2`: `-x · x^2 = -x^3`.","_n":"1gea6","_k":"a015753c"},{"t":"1","fb":"`(3 - x)` starts with `-x` and `(x + 2)^2` with `x^2`: `-x · x^2 = -x^3`.","_n":"1hef6","_k":"671d4c8f"},{"t":"3","fb":"`(3 - x)` starts with `-x` and `(x + 2)^2` with `x^2`: `-x · x^2 = -x^3`.","_n":"1if06","_k":"f7d5ee89"},{"t":"−3","fb":"`(3 - x)` starts with `-x` and `(x + 2)^2` with `x^2`: `-x · x^2 = -x^3`.","_n":"1jed6","_k":"e337efd3"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Equation ↔ graph","summary":"Equation ↔ graph","goal":[2,3,4],"instruction":"Match each equation to its graph.","how":"Tap an equation, then tap its graph.","leftTitle":"Equation","rightTitle":"Graph","left":[{"id":"l1","t":"`y = (x + 2)(x - 1)(x - 3)`","why":"Q3 to Q1; crosses at −2, 1, 3; `y`-intercept 6.","hints":["Which zeros are there, and does the graph cross or touch at each?","All three brackets are to the first power: it crosses at −2, 1 and 3. Degree 3, `a = 1`: Q3 to Q1.","`y`-intercept `(2)(-1)(-3) = 6`. That’s the graph that crosses three times, rises to the right and passes through (0, 6)."]},{"id":"l2","t":"`y = -(x + 2)(x - 1)(x - 3)`","why":"Q2 to Q4; crosses at −2, 1, 3; `y`-intercept −6.","hints":["Compare with the first equation. What does the minus sign in front do?","It flips the graph: it still crosses at −2, 1 and 3, but now goes from Q2 to Q4.","`y`-intercept `-(2)(-1)(-3) = -6`. That’s the graph that falls to the right and passes through (0, −6)."]},{"id":"l3","t":"`y = (x + 2)^2(x - 1)`","why":"Q3 to Q1; touches at −2, crosses at 1; `y`-intercept −4.","hints":["Which zero is squared?","`(x + 2)^2`: the graph touches at −2. `(x - 1)` to the first power: it crosses at 1.","Degree 3, `a = 1`: Q3 to Q1; `y`-intercept `(4)(-1) = -4`. That’s the graph that touches at −2 and passes through (0, −4)."]},{"id":"l4","t":"`y = (x + 2)(x - 1)^2`","why":"Q3 to Q1; crosses at −2, touches at 1; `y`-intercept 2.","hints":["Which zero is squared?","`(x - 1)^2`: the graph touches at 1. `(x + 2)` to the first power: it crosses at −2.","Degree 3, `a = 1`: Q3 to Q1; `y`-intercept `(2)(1) = 2`. That’s the graph that touches at 1 and passes through (0, 2)."]},{"id":"l5","t":"`y = (x - 1)^3`","why":"Q3 to Q1; crosses and flattens at 1; `y`-intercept −1.","hints":["What is the order of the zero at 1?","Order 3: the graph crosses at 1 and flattens as it crosses. Degree 3, `a = 1`: Q3 to Q1.","`y`-intercept `(-1)^3 = -1`. That’s the graph with one zero, flattening through 1 and passing through (0, −1)."]},{"id":"l6","t":"`y = -(x + 2)^2(x - 1)^2`","why":"Both arms down; touches at −2 and 1; `y`-intercept −4.","hints":["Add the orders for the degree, and look at the sign in front.","2 + 2 = 4 and the leading coefficient is −1: both arms down. Both zeros are squared, so it touches at −2 and at 1.","`y`-intercept `-(4)(1) = -4`. That’s the graph with both arms down that touches the axis twice."]},{"id":"l7","t":"`y = x(x + 2)(x - 1)(x - 3)`","why":"Both arms up; crosses at −2, 0, 1, 3; `y`-intercept 0.","hints":["How many brackets are there, and what are their orders?","Four zeros, all of order 1: it crosses at −2, 0, 1 and 3. Degree 4, `a = 1`: both arms up.","`x = 0` is a zero, so the `y`-intercept is 0. That’s the graph that crosses four times."]},{"id":"l8","t":"`y = (x + 2)(x - 1)^3`","why":"Both arms up; crosses at −2; crosses and flattens at 1; `y`-intercept −2.","hints":["Add the orders for the degree. What does that say about the arms?","1 + 3 = 4, `a = 1`: both arms up. At 1 the order is 3.","Crosses at −2, flattens through 1, `y`-intercept `(2)(-1) = -2`."]}],"right":[{"id":"rA","t":"\u003ccanvas class=\"plot\" data-fig=\"gA\" role=\"img\" aria-label=\"Graph: rises from the lower left, crosses the x-axis at −2, touches at 1, ends upper right; y-intercept 2\">\u003c/canvas>"},{"id":"rB","t":"\u003ccanvas class=\"plot\" data-fig=\"gB\" role=\"img\" aria-label=\"Graph: falls from the upper left to the lower right, crossing the x-axis at −2, 1 and 3; y-intercept −6\">\u003c/canvas>"},{"id":"rC","t":"\u003ccanvas class=\"plot\" data-fig=\"gC\" role=\"img\" aria-label=\"Graph: both arms down, touching the x-axis at −2 and at 1; y-intercept −4\">\u003c/canvas>"},{"id":"rD","t":"\u003ccanvas class=\"plot\" data-fig=\"gD\" role=\"img\" aria-label=\"Graph: both arms up, crossing the x-axis at −2 and flattening as it crosses at 1; y-intercept −2\">\u003c/canvas>"},{"id":"rE","t":"\u003ccanvas class=\"plot\" data-fig=\"gE\" role=\"img\" aria-label=\"Graph: rises from the lower left to the upper right, crossing the x-axis at −2, 1 and 3; y-intercept 6\">\u003c/canvas>"},{"id":"rF","t":"\u003ccanvas class=\"plot\" data-fig=\"gF\" role=\"img\" aria-label=\"Graph: rises from the lower left to the upper right, flattening as it crosses the x-axis at 1; y-intercept −1\">\u003c/canvas>"},{"id":"rG","t":"\u003ccanvas class=\"plot\" data-fig=\"gG\" role=\"img\" aria-label=\"Graph: both arms up, crossing the x-axis at −2, 0, 1 and 3; y-intercept 0\">\u003c/canvas>"},{"id":"rH","t":"\u003ccanvas class=\"plot\" data-fig=\"gH\" role=\"img\" aria-label=\"Graph: rises from the lower left, touches the x-axis at −2, crosses at 1, ends upper right; y-intercept −4\">\u003c/canvas>"}],"_a":"QhBfARRfGxB8EB8SWlcbWBtAcRIaR1VRGwgRQn5HFUBVBhEKFBd4QBUQXwUUXxsQfxAfElpTG1gbQHASGkdVVRsIEUJxRxVAVQoRChQXfUBE","wrong":{"l1|rB":"These two are mirror images. Check the leading coefficient’s sign: the end behaviour shows it.","l2|rE":"These two are mirror images. Check the leading coefficient’s sign: the end behaviour shows it.","l3|rA":"Same zeros, different orders. Which zero is squared? That’s where the graph touches.","l4|rH":"Same zeros, different orders. Which zero is squared? That’s where the graph touches.","l6|rH":"Both have `y`-intercept −4. Check the end behaviour: one has both arms down.","l3|rC":"Both have `y`-intercept −4. Check the end behaviour: one has both arms down.","l5|rH":"An order 3 zero crosses (flattening); it doesn’t touch.","l5|rA":"An order 3 zero crosses (flattening); it doesn’t touch.","l5|rC":"An order 3 zero crosses (flattening); it doesn’t touch.","l8|rH":"An order 3 zero crosses (flattening); it doesn’t touch.","l8|rA":"An order 3 zero crosses (flattening); it doesn’t touch.","l8|rC":"An order 3 zero crosses (flattening); it doesn’t touch."},"wrongDefault":"Compare the zeros, then the order at each zero, then the ends."},{"id":"find","type":"custom","title":"Find the equation","summary":"Find the equation","star":true,"goal":[5,6],"instruction":"Use the conditions to find what’s asked. No graph is given: picture it, or sketch on paper.","how":"Type your answer, then press Check. Fractions like −1/3 are fine.","items":[{"id":"f1","goal":5,"prompt":"A cubic has zeros −1, 2 and 5 and passes through (0, 20). Find `a`.","fields":[{"id":"v","label":"`a` ="}],"_a":"Cw==","display":"`a = 2`","why":"At 0 the brackets give `(1)(-2)(-5) = 10`, so `10a = 20` and `a = 2`.","wrong":[{"match":20,"fb":"That’s the `y`-intercept, not `a`. At 0 the brackets give `(1)(-2)(-5) = 10`."},{"match":0.5,"fb":"Divide 20 by 10, not 10 by 20."}],"hints":["Write the family first: `y = a(x + 1)(x - 2)(x - 5)`.","At (0, 20): `a(1)(-2)(-5) = 10a = 20`.","`a = 20 ÷ 10 = 2`."]},{"id":"f2","goal":5,"prompt":"A quartic touches the axis at −3 and at 3 and passes through (0, −27). Find `a`.","fields":[{"id":"v","label":"`a` ="}],"_a":"FAIdAwVWClEKAQADBVYKUQoBAA==","display":"`a = -1/3`","why":"The family is `y = a(x + 3)^2(x - 3)^2`. At 0 the brackets give `(3)^2(-3)^2 = 81`, so `81a = -27` and `a = -1/3`.","wrong":[{"match":-3,"fb":"Divide −27 by 81, not 81 by −27."},{"match":0.3333333333333333,"fb":"Check the sign: `(3)^2(-3)^2 = 81` is positive, so `a` has the sign of −27."}],"hints":["Touching means an even order. Write the family: `y = a(x + 3)^2(x - 3)^2`.","At (0, −27): `a(3)^2(-3)^2 = 81a = -27`.","`a = -27 ÷ 81 = -1/3`."]},{"id":"f3","goal":5,"star":true,"prompt":"A cubic has a zero of order 2 at 2 and a zero at −4, and passes through (1, 10). Find `a`.","fields":[{"id":"v","label":"`a` ="}],"_a":"Cw==","display":"`a = 2`","why":"`y = a(x - 2)^2(x + 4)`. At `x = 1`: `(1 - 2)^2(1 + 4) = 5`, so `5a = 10` and `a = 2`.","wrong":[{"match":0.625,"fb":"That substitutes `x = 0`, where the brackets give 16. The point is at `x = 1`: `(1 - 2)^2(1 + 4) = 5`."},{"match":-2,"fb":"`(1 - 2)^2 = (-1)^2 = 1`, not −1."}],"hints":["Write the family first: `y = a(x - 2)^2(x + 4)`.","Substitute the point (1, 10), not `x = 0`: `(1 - 2)^2(1 + 4) = (1)(5) = 5`.","`5a = 10`, so `a = 2`."]},{"id":"f4","goal":[2,6],"star":true,"kind":"select","prompt":"A polynomial of degree 5 has zeros only at −1 and 2. It crosses the axis at −1 and touches it at 2. Which orders are possible? Select every pair that works.","note":"Each pair is (order at −1, order at 2).","options":[{"t":"(1, 4)","why":"","_n":"1kee6","_k":"82e43ee4"},{"t":"(3, 2)","why":"","_n":"1lf36","_k":"ffe1a3b0"},{"t":"(2, 3)","why":"Crossing needs an odd order at −1; touching needs an even order at 2.","_n":"1mf46","_k":"60974279"},{"t":"(1, 2)","why":"That adds to 3, not 5.","_n":"1n856","_k":"5b010d8d"},{"t":"(4, 1)","why":"Crossing needs an odd order at −1; touching needs an even order at 2.","_n":"1o846","_k":"13c146d5"}],"partial":"There’s another pair: the orders must add to 5, odd at −1 and even at 2.","why":"1 + 4 = 5 and 3 + 2 = 5: `(x + 1)(x - 2)^4` and `(x + 1)^3(x - 2)^2` both work.","hints":["Crossing means odd order; touching means even order; the orders add to the degree.","Odd + even = 5. List the odd choices for −1: 1, 3 (5 would leave nothing for 2).","1 + 4 = 5 and 3 + 2 = 5. Both work: `(x + 1)(x - 2)^4` and `(x + 1)^3(x - 2)^2`."]},{"id":"f5","goal":[5,3],"star":true,"prompt":"`y = a(x + 1)(x - 3)^2` passes through (1, −16). Find `a`, then the `y`-intercept.","fields":[{"id":"a","label":"`a` ="},{"id":"y","label":"`y`-intercept ="}],"_a":"QhBSEgxIC04bSxEKG1QBHw==","display":"`a = -2`; `y`-intercept −18","why":"`a(2)(4) = 8a = -16`, so `a = -2`. At 0: `-2(1)(9) = -18`.","wrong":[{"field":"a","match":2,"fb":"`(1 - 3)^2 = 4` and `(1 + 1) = 2`, so `8a = -16`."},{"field":"y","match":18,"fb":"At 0: `-2(1)(9) = -18`."}],"hints":["Substitute (1, −16) to find `a` first.","`a(1 + 1)(1 - 3)^2 = a(2)(4) = 8a = -16`, so `a = -2`.","At `x = 0`: `-2(0 + 1)(0 - 3)^2 = -2(1)(9) = -18`."]},{"id":"f6","goal":[5,6],"star":true,"prompt":"A cubic crosses the axis at −2, touches it at 3, and passes through (1, 12). Find `y` when `x = -3`.","fields":[{"id":"v","label":"`y` ="}],"_a":"FAEF","display":"`y = -36`","why":"`y = a(x + 2)(x - 3)^2`; at (1, 12), `12a = 12`, so `a = 1`. Then `y(-3) = (-1)(36) = -36`.","wrong":[{"match":36,"fb":"At `x = -3`, `(x + 2) = -1` is negative: `(-1)(36) = -36`."},{"match":6,"fb":"Keep the square: `(-3 - 3)^2 = (-6)^2 = 36`, not −6."}],"hints":["Write the family first: `y = a(x + 2)(x - 3)^2`.","At (1, 12): `a(3)(4) = 12`, so `a = 1`.","`y(-3) = (-3 + 2)(-3 - 3)^2 = (-1)(36) = -36`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Mei","how":"","instruction":"Mei made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"State the zeros of `y = (x + 4)(x - 1)^2` and how the graph behaves at each.","steps":["The zeros come from `x + 4 = 0` and `x - 1 = 0`.","So the zeros are 4 and 1.","`(x - 1)` is squared, so the graph touches at 1.","`(x + 4)` is to the first power, so the graph crosses at 4."],"_a":"CA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 is correct. The mistake is earlier.","Step 4 uses step 2’s zero. The mistake is earlier."],"fixes":[{"t":"The zeros are −4 and −1.","why":"`x - 1 = 0` gives `x = +1`.","_n":"1p836","_k":"8d171e15"},{"t":"`x + 4 = 0` gives `x = -4`, so the zeros are −4 (crosses) and 1 (touches).","why":"Solve each bracket = 0.","_n":"1q826","_k":"d0ad9b9a"},{"t":"The zeros are 4 and −1.","why":"Both signs are flipped now. Solve each bracket = 0.","_n":"1r816","_k":"14034875"},{"t":"Step 2 is correct as written.","why":"At `x = 4`, `x + 4 = 8`, not 0.","_n":"1s806","_k":"04f5e60d"}],"hints":["Check step 2 by substituting each zero into its bracket.","Does `x = 4` make `x + 4` equal to 0?","Step 2 is wrong: the zeros are −4 and 1."]},{"id":"e2","goal":3,"task":"Find the `y`-intercept of `y = -2(x + 1)(x - 3)^2`.","steps":["Set `x = 0`.","`y = -2(0 + 1)(0 - 3)^2`.","`(0 - 3)^2 = -9`.","`y = -2(1)(-9) = 18`."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","","Step 4 uses step 3’s value. The mistake is earlier."],"fixes":[{"t":"`(0 - 3)^2 = -6`.","why":"Squaring isn’t doubling: `(-3)^2 = 9`.","_n":"1t7f6","_k":"03bdf219"},{"t":"`(0 - 3)^2 = (-3)^2 = 9`, so `y = -2(1)(9) = -18`.","why":"The square applies to the whole bracket, including its sign.","_n":"1u7e6","_k":"3096eaa0"},{"t":"`(0 - 3)^2 = 9`, so `y = 2(1)(9) = 18`.","why":"The −2 in front still counts: `y = -18`.","_n":"1v7d6","_k":"acccc67d"},{"t":"Step 3 is correct as written.","why":"`-3^2` and `(-3)^2` are different: `(-3)^2 = (-3)(-3) = 9`.","_n":"1w7c6","_k":"40c15513"}],"hints":["Check the square in step 3.","`(0 - 3) = -3`. What is `(-3) × (-3)`?","Step 3 is wrong: `(-3)^2 = 9`, so the `y`-intercept is −18."]},{"id":"e3","goal":5,"task":"A cubic crosses the axis at −2, touches it at 1, and passes through (0, 4). Find its equation.","steps":["`y = a(x + 2)^2(x - 1)`.","At (0, 4): `4 = a(2)^2(-1) = -4a`.","`a = -1`.","`y = -(x + 2)^2(x - 1)`."],"_a":"CQ==","stepFb":["","Step 2 substitutes correctly into step 1’s equation. The mistake is earlier.","Step 3 solves step 2 correctly. The mistake is earlier.","Step 4 follows. The mistake is earlier."],"fixes":[{"t":"`y = a(x - 2)(x + 1)^2`.","why":"The signs are flipped: zeros at −2 and 1 come from `(x + 2)` and `(x - 1)`.","_n":"1x7f6","_k":"ec1a0155"},{"t":"`y = a(x + 2)(x - 1)^2`, because the graph touches at 1. Then `4 = a(2)(1)`, so `a = 2`.","why":"The squared factor goes with the touching zero.","_n":"1y806","_k":"f8a62b74"},{"t":"`y = a(x + 2)(x - 1)`.","why":"That’s a quadratic. A cubic that touches at 1 needs `(x - 1)^2`.","_n":"1z816","_k":"1f1e61bd"},{"t":"Step 1 is correct as written.","why":"Step 1 squares the bracket for −2, so its graph touches at −2 and crosses at 1: the opposite of the description.","_n":"20826","_k":"8ec2a845"}],"hints":["Which zero should have the square?","Touching means an even order. The graph touches at 1.","Step 1 is wrong: `y = a(x + 2)(x - 1)^2`, which gives `a = 2`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the zero builder? Think about the lens, or what `a` did and didn’t change."},{"id":"j2","q":"In your own words, why does a squared factor make the graph touch the axis instead of crossing?"},{"id":"j3","q":"Explain to a friend how to find the equation of a polynomial from its graph, step by step."},{"id":"j4","q":"Which part of sketching from factored form is still slow for you: zeros, orders, the `y`-intercept, or the ends? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What are the zeros of `y = (x + 5)(2x - 3)`?","options":[{"t":"−5 and 2/3","why":"`2x = 3` gives `x = 3 ÷ 2`, not 2 ÷ 3.","_n":"217b6","_k":"3dd82411"},{"t":"−5 and 3","why":"`2x - 3 = 0` gives `x = 3/2`, not 3.","_n":"227c6","_k":"7b75a1e7"},{"t":"−5 and 3/2","why":"`x + 5 = 0` gives −5; `2x - 3 = 0` gives 3/2.","_n":"237d6","_k":"aea16266"},{"t":"5 and −3/2","why":"Both signs are flipped.","_n":"247e6","_k":"293c809b"}]},"b":{"prompt":"What are the zeros of `y = (x - 6)(3x + 2)`?","options":[{"t":"6 and −2/3","why":"`x - 6 = 0` gives 6; `3x + 2 = 0` gives −2/3.","_n":"25776","_k":"300c45c7"},{"t":"6 and −2","why":"`3x + 2 = 0` gives `x = -2/3`, not −2.","_n":"26786","_k":"85c52554"},{"t":"−6 and 2/3","why":"Both signs are flipped.","_n":"27697","_k":"d911bdc0"},{"t":"6 and −3/2","why":"`3x = -2` gives `x = -2 ÷ 3`, not −3 ÷ 2.","_n":"28687","_k":"85768226"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"At which zero does the graph of `y = (x - 1)^2(x + 3)^3` cross the axis while flattening?","options":[{"t":"1","why":"At 1 the order is 2: the graph touches and turns back.","_n":"296b7","_k":"07a66b2d"},{"t":"−3","why":"`(x + 3)^3` has odd order 3: it crosses and flattens at −3.","_n":"2a6a7","_k":"ed9479dd"},{"t":"Both −3 and 1","why":"Only the odd-order zero crosses.","_n":"2b6d7","_k":"a5631e14"},{"t":"3","why":"The zero from `(x + 3)` is −3, not 3.","_n":"2c6c7","_k":"5c09e6aa"}]},"b":{"prompt":"At which zero does the graph of `y = (x + 2)^3(x - 4)^2` cross the axis while flattening?","options":[{"t":"−2","why":"`(x + 2)^3` has odd order 3: it crosses and flattens at −2.","_n":"2d6f7","_k":"1e0beac3"},{"t":"2","why":"The zero from `(x + 2)` is −2, not 2.","_n":"2e6e7","_k":"3bb95ff2"},{"t":"4","why":"At 4 the order is 2: the graph touches and turns back.","_n":"2f717","_k":"cf0318a6"},{"t":"Both −2 and 4","why":"Only the odd-order zero crosses.","_n":"2g707","_k":"40a1caae"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"What is the `y`-intercept of `y = 3(x - 2)(x + 1)^2`?","options":[{"t":"−6","why":"`3 × (-2) × (1)^2 = -6`.","_n":"2h837","_k":"7ca2e778"},{"t":"−2","why":"Don’t forget the factor 3 in front.","_n":"2i847","_k":"bdecb349"},{"t":"6","why":"`(0 - 2) = -2` is negative, so the product is negative.","_n":"2j817","_k":"1aae9beb"},{"t":"12","why":"That squares the wrong bracket: `3 × (-2)^2 × 1`.","_n":"2k827","_k":"6369d77d"}]},"b":{"prompt":"What is the `y`-intercept of `y = -2(x + 3)(x - 1)^2`?","options":[{"t":"−6","why":"`-2 × 3 × (-1)^2 = -2 × 3 × 1 = -6`.","_n":"2l7f7","_k":"054da17c"},{"t":"3","why":"Don’t forget the −2 in front.","_n":"2m807","_k":"b50c80d9"},{"t":"6","why":"The −2 in front makes the product negative.","_n":"2n7d7","_k":"92645193"},{"t":"18","why":"That squares the wrong bracket: `-2 × 3^2 × (-1)`.","_n":"2o7e7","_k":"f85ac8db"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"What is the end behaviour of `y = (2 - x)(x + 1)^2`?","options":[{"t":"Q2 to Q1","why":"Both arms the same way needs an even degree. Here it’s 3.","_n":"2p7b7","_k":"2bebf5e7"},{"t":"Q3 to Q4","why":"That treats the degree as 2 (two factors). Add the orders: 1 + 2 = 3.","_n":"2q7c7","_k":"02bfeabf"},{"t":"Q3 to Q1","why":"`(2 - x)` starts with `-x`, which makes the leading coefficient negative.","_n":"2r953","_k":"dfde24d4"},{"t":"Q2 to Q4","why":"Leading term: `(-x)(x^2) = -x^3`. Odd degree, negative: Q2 to Q4.","_n":"2s963","_k":"be1f30d9"}]},"b":{"prompt":"What is the end behaviour of `y = (5 - x)(x - 1)^2`?","options":[{"t":"Q2 to Q1","why":"Both arms the same way needs an even degree. Here it’s 3.","_n":"2t933","_k":"ae660908"},{"t":"Q3 to Q4","why":"That treats the degree as 2. Add the orders: 1 + 2 = 3.","_n":"2u943","_k":"0aca217e"},{"t":"Q3 to Q1","why":"`(5 - x)` starts with `-x`, which makes the leading coefficient negative.","_n":"2v993","_k":"11fb6f8c"},{"t":"Q2 to Q4","why":"Leading term: `(-x)(x^2) = -x^3`. Odd degree, negative: Q2 to Q4.","_n":"2w9a3","_k":"0e114ff6"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A cubic crosses the `x`-axis at −3, touches it at 2, and has `y`-intercept −6. What is its equation?","options":[{"t":"`y = -½(x - 3)(x + 2)^2`","why":"Zeros at −3 and 2 come from `(x + 3)` and `(x - 2)`. This one’s `y`-intercept is 6.","_n":"2x973","_k":"7dc707c8"},{"t":"`y = -½(x + 3)(x - 2)^2`","why":"At 0: `a(3)(4) = 12a = -6`, so `a = -½`.","_n":"2y983","_k":"eeb8dd41"},{"t":"`y = -2(x + 3)(x - 2)^2`","why":"`12a = -6` gives `a = -6 ÷ 12 = -½`, not −2. This one’s `y`-intercept is −24.","_n":"2z9d3","_k":"f1a0b95d"},{"t":"`y = -½(x + 3)^2(x - 2)`","why":"This touches at −3 and crosses at 2: the wrong way round. Its `y`-intercept is 9.","_n":"309e3","_k":"d8ee429d"}]},"b":{"prompt":"A cubic crosses the `x`-axis at 4, touches it at −1, and has `y`-intercept 8. What is its equation?","options":[{"t":"`y = -2(x - 4)^2(x + 1)`","why":"This touches at 4 and crosses at −1: the wrong way round. Its `y`-intercept is −32.","_n":"319b3","_k":"58276d93"},{"t":"`y = -2(x + 4)(x - 1)^2`","why":"Zeros at 4 and −1 come from `(x - 4)` and `(x + 1)`. This one’s `y`-intercept is −8.","_n":"329a3","_k":"893740db"},{"t":"`y = -2(x - 4)(x + 1)^2`","why":"At 0: `a(-4)(1) = -4a = 8`, so `a = -2`.","_n":"339d3","_k":"1793d1a8"},{"t":"`y = -½(x - 4)(x + 1)^2`","why":"`-4a = 8` gives `a = 8 ÷ (-4) = -2`, not −½. This one’s `y`-intercept is 2.","_n":"349c3","_k":"b1e60b03"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Which set of conditions describes \u003cstrong>exactly one\u003c/strong> polynomial?","options":[{"t":"Zeros −1, 2 and 5, passing through (0, 10).","why":"Without the degree, `(x + 1)^2(x - 2)(x - 5)` and others can be scaled to fit too.","_n":"35973","_k":"89df6dda"},{"t":"Degree 3, zeros −1, 2 and 5.","why":"That’s a whole family `y = a(x + 1)(x - 2)(x - 5)`: every `a ≠ 0` fits.","_n":"36963","_k":"bbf1cbec"},{"t":"Degree 3, zeros −1, 2 and 5, passing through (0, 10).","why":"The degree and zeros give the family; the point gives `a = 1`: `(1)(-2)(-5)a = 10`.","_n":"37993","_k":"b0094295"},{"t":"Degree 3, passing through (0, 10) and (1, 0).","why":"Two points can’t fix a cubic: it has more freedom than that.","_n":"38983","_k":"818ceea8"}]},"b":{"prompt":"Which set of conditions describes \u003cstrong>exactly one\u003c/strong> polynomial?","options":[{"t":"Degree 4, touching the axis at −2 and at 3, passing through (1, 36).","why":"The family is `a(x + 2)^2(x - 3)^2`; at 1, `36a = 36`, so `a = 1`.","_n":"39a33","_k":"15f26f6d"},{"t":"Touching the axis at −2 and at 3, passing through (1, 36).","why":"Without the degree, higher-degree polynomials with extra factors can fit too.","_n":"3aa23","_k":"67fb097b"},{"t":"Degree 4, touching the axis at −2, passing through (1, 36).","why":"The other two zeros aren’t known, so many quartics fit.","_n":"3b293","_k":"08cfd51e"},{"t":"Degree 4, touching the axis at −2 and at 3.","why":"That’s a family `y = a(x + 2)^2(x - 3)^2`.","_n":"3c2a3","_k":"913186e3"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of what the graph of `y = (x + 3)^2(x - 1)` does at `x = -3`?","options":[{"t":"It touches the axis and turns back: `(x + 3)^2` is never negative, so `y` has the same sign just left and just right of −3.","why":"Even order means no sign change.","_n":"3d2b3","_k":"0cc70d40"},{"t":"It crosses and flattens, because every repeated zero flattens.","why":"Order 3 flattens as it crosses; order 2 touches.","_n":"3e2c3","_k":"b9c1447f"},{"t":"It turns back because the degree, 2, is even.","why":"The degree is 2 + 1 = 3. The exponent 2 is the order of this one zero.","_n":"3f253","_k":"8fa484ee"},{"t":"It crosses, because −3 is a negative zero.","why":"Positive or negative zeros can both cross or touch. The order decides.","_n":"3g263","_k":"c1acabc4"}]},"b":{"prompt":"Which is the best explanation of what the graph of `y = (x + 1)^3(x - 4)` does at −1?","options":[{"t":"It turns around, because a cube makes a turning point.","why":"An order 3 zero flattens but keeps going: no turn.","_n":"3h273","_k":"07cd31fa"},{"t":"It crosses in a straight line, because the degree is 4.","why":"The degree affects the ends. The order at −1 is 3.","_n":"3i283","_k":"621c5984"},{"t":"`(x + 1)^3` changes sign at −1 (an odd power), so the graph crosses. Near −1 it behaves like a cubic, which is flat at its zero, so it flattens as it crosses.","why":"Odd order means a sign change, and order 3 makes the graph flatten as it crosses.","_n":"3j213","_k":"0e2efa51"},{"t":"It touches, because −1 is negative.","why":"The sign of the zero doesn’t decide. The order does.","_n":"3k223","_k":"d2e4b44c"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which equation has zeros −2 (order 2) and 5 (order 1), and leading coefficient −3?","options":[{"t":"`y = -3(x + 2)^2(x - 5)`","why":"Each zero `r` gives `(x - r)`; the order is the power; −3 multiplies the whole product.","_n":"3l2f3","_k":"ab087e64"},{"t":"`y = (x + 2)^2(x - 5) - 3`","why":"Subtracting 3 shifts the graph down; it doesn’t set the leading coefficient, and it moves the zeros.","_n":"3m2e3","_k":"c0e1517d"},{"t":"`y = -3(x + 2)(x - 5)^2`","why":"The orders are swapped: here 5 has order 2.","_n":"3n2d3","_k":"3704105f"},{"t":"`y = -3(x - 2)^2(x + 5)`","why":"These zeros are 2 and −5.","_n":"3o2c3","_k":"8854f5f9"}]},"b":{"prompt":"Which equation has zeros 4 (order 3) and −1 (order 1), and leading coefficient 2?","options":[{"t":"`y = 2(x - 4)(x + 1)^3`","why":"The orders are swapped: here −1 has order 3.","_n":"3p2b3","_k":"b41dc467"},{"t":"`y = 2(x + 4)^3(x - 1)`","why":"These zeros are −4 and 1.","_n":"3q2a3","_k":"a70015c5"},{"t":"`y = (x - 4)^3(x + 1) + 2`","why":"Adding 2 shifts the graph up and moves the zeros.","_n":"3r293","_k":"f26c728e"},{"t":"`y = 2(x - 4)^3(x + 1)`","why":"Each zero `r` gives `(x - r)`; the order is the power; 2 multiplies the whole product.","_n":"3s283","_k":"9cfa1fe5"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A skateboard ramp’s profile is a cubic `h(x)`, in metres, where `x` is the horizontal distance. It starts on the ground at `x = 0`, levelling into the ground there (it touches), and comes back to the ground at `x = 9`. At `x = 3` it is 4.5 m high. How high is it at `x = 6`?","options":[{"t":"2.25 m","why":"That puts the touch at 9 instead of 0: `h = ax(x - 9)^2`.","_n":"3t273","_k":"cd73c116"},{"t":"−9 m","why":"Check the sign of `a`: `-54a = 4.5` makes `a` negative, and `h(6)` comes out positive.","_n":"3u263","_k":"80d7036a"},{"t":"4.5 m","why":"That assumes the ramp is symmetric. A cubic with a touch at one end isn’t.","_n":"3v9d2","_k":"52e9e4d5"},{"t":"9 m","why":"`h = ax^2(x - 9)`. At 3: `a(9)(-6) = -54a = 4.5`, so `a = -1/12`. At 6: `-(1/12)(36)(-3) = 9`.","_n":"3w9e2","_k":"4c0e5216"}]},"b":{"prompt":"A drainage channel’s profile is a cubic `h(x)`, in metres. It meets ground level at `x = 0`, crossing it, and at `x = 8`, where it levels into the ground (it touches). At `x = 4` it is −8 m (8 m deep). What is `h` at `x = 6`?","options":[{"t":"−3 m","why":"`h = ax(x - 8)^2`. At 4: `a(4)(16) = 64a = -8`, so `a = -1/8`. At 6: `-(1/8)(6)(4) = -3`.","_n":"3x9b2","_k":"926b9396"},{"t":"−8 m","why":"That assumes the depth stays the same from 4 to 6.","_n":"3y9c2","_k":"1a0fd375"},{"t":"3 m","why":"Check the sign of `a`: `64a = -8` makes `a` negative.","_n":"3z992","_k":"10b0d460"},{"t":"−9 m","why":"That puts the touch at 0 instead of 8: `h = ax^2(x - 8)`.","_n":"409a2","_k":"636dd64f"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A company’s monthly profit, in thousands of dollars, is `P(x) = -(x - 2)^2(x - 8)`, where `x` is the number of units made, in hundreds, with `0 \u003c x \u003c 10`. For which production levels is the profit positive?","options":[{"t":"`(0, 8)`","why":"At `x = 2` the profit is exactly 0, which isn’t positive.","_n":"41972","_k":"3708cf10"},{"t":"`(0, 2) ∪ (2, 8)`","why":"`(x - 2)^2 ≥ 0` and `-(x - 8) > 0` when `x \u003c 8`. So `P > 0` for `x \u003c 8`, except at the touch point 2.","_n":"42982","_k":"12b5da47"},{"t":"`(2, 8)`","why":"`P` is positive before 2 as well: the square doesn’t change sign at 2.","_n":"43a52","_k":"5c8f1474"},{"t":"`(8, 10)`","why":"That ignores the minus sign in front.","_n":"44a62","_k":"5aacebe0"}]},"b":{"prompt":"A pond’s level changes at a rate of `L(t) = (t - 1)^2(t - 5)` cm per month, `t` months after a dam opens, with `0 \u003c t \u003c 7`. When is the level falling (`L \u003c 0`)?","options":[{"t":"`(5, 7)`","why":"That’s where `L > 0`, the level rising.","_n":"45233","_k":"61299b7a"},{"t":"`(0, 5)`","why":"At `t = 1` the rate is exactly 0, which isn’t negative.","_n":"46223","_k":"aab48cb0"},{"t":"`(0, 1) ∪ (1, 5)`","why":"`(t - 1)^2 ≥ 0` and `(t - 5) \u003c 0` when `t \u003c 5`. So `L \u003c 0` for `t \u003c 5`, except at the touch point 1.","_n":"47253","_k":"bb2f4551"},{"t":"`(1, 5)`","why":"`L` is negative before 1 as well: the square doesn’t change sign at 1.","_n":"48243","_k":"503ce358"}]}}]},"task":{"title":"Hit the checkpoints","summary":"Hit the checkpoints","statement":"\u003cp>Use the zero builder to design a polynomial that meets every checkpoint. There are many answers. Can you find more than one?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The checkpoints\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>Degree exactly 4.\u003c/li>\u003cli>Exactly 3 `x`-intercepts.\u003c/li>\u003cli>Both arms point down.\u003c/li>\u003cli>`y`-intercept 8.\u003c/li>\u003cli>The graph touches the axis at a positive `x`-value.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">In this builder the zeros snap to whole numbers from −6 to 6. Each zero has order chips (1, 2, 3), and `@a{a}` runs from −3 to 3 in steps of 0.25.\u003c/p>","checks":["Degree exactly 4","Exactly 3 `x`-intercepts","Both arms point down","`y`-intercept 8","Touches the axis at a positive `x`-value"],"tips":["Your orders add to {n}. Degree 4 with 3 zeros needs orders 2, 1 and 1.","You have {k} zeros. Use three, one of them squared.","Both arms down needs an even degree and a negative `a`.","Your `y`-intercept is {v} = `a` × {p}. With `a \u003c 0`, you need a negative bracket product. Try changing which zero is squared, or the sign of one zero.","Touching means an even order. Put the squared factor on a zero to the right of the `y`-axis."],"explainPrompt":"Explain how you chose the zeros and `a` so that the `y`-intercept came out to 8 with both arms down.","vocab":"Use the words order, zero, leading coefficient and y-intercept.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Notice that `a \u003c 0` and the `y`-intercept is positive, so the bracket product at 0 must be negative: that’s what decides which zeros can work together."},"cards":[["Zero from a factor","`(x - r)` is 0 at `x = r`; `(x + 3)` gives −3; `(2x - 3)` gives 3/2."],["Order of a zero","The power on its factor: in `(x - 1)^2(x + 3)`, 1 has order 2 and −3 has order 1."],["Order 1","The graph crosses the axis, like a line."],["Order 2","The graph touches the axis and turns back, like a parabola. No sign change."],["Order 3","The graph crosses and flattens for an instant, like a cubic. No turning point there."],["Degree from factored f
