.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 31: circle-to-graph unwrapper (N24), reciprocal builder, property grid, Track it down, task */
canvas.plot.hero-cgl,canvas.plot.cgl-c{aspect-ratio:auto;min-height:90px}
#hero-cap{font:400 1.15rem var(--font-math);min-height:1.6em}
.m .p-t{font-style:italic}
/* radio groups (copied from MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:1rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
/* Explore */
.cg-top{display:flex;flex-wrap:wrap;gap:10px 26px;margin:0 0 12px}
.cgl canvas:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.cgl-cw{max-width:260px;margin:0 auto 10px}
.cg-note{margin:6px 0 0;min-height:1.2em}
.cg-cap{margin:4px 0 0;font-weight:700;min-height:0}
.cg-cap:empty{display:none}
.cg-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px 28px;align-items:start;margin-top:14px}
.cg-ctrl,.cg-read{min-width:0}
.cg-angtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cg-xval{font-size:1.3rem}
.cg-slrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.cg-slrow input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.cg-pm{min-width:40px;min-height:40px;padding:0 .4em;font-size:1.25rem;line-height:1}
.cg-lock{margin:6px 0 0;padding:6px 10px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:6px;font-weight:700}
.cg-tog,.cg-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cg-t{min-height:36px}
.cg-t[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cg-pins{margin-top:12px}
.cg-pins:empty{display:none}
.cg-pinrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cg-pinchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cg-pinchip{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);min-height:32px}
.cg-mnote{display:block;margin-top:4px}
.read > div.hl{background:var(--hi-soft);border-radius:6px;padding-left:8px;padding-right:8px;box-shadow:inset 3px 0 0 var(--hi)}
.cg-more{display:none;margin-top:8px}
.tc3-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font:400 1.2rem var(--font-math)}
.tc3-p{width:5.2rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .5em;font:400 1.15rem var(--font-math)}
.tc3-q{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .4em;font:400 1.15rem var(--font-math);min-height:40px}
.wg-tbl th[scope=row]{text-align:left;white-space:nowrap}
.wg-tbl td,.wg-tbl th{vertical-align:middle}
/* Part 3: reciprocal builder */
.rb-builds{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rcb{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.rb-g,.rb-card{min-width:0}
.rb-card h3{margin-top:0}
.rb-taps button{position:absolute;padding:0;border-radius:50%;z-index:2;touch-action:manipulation}
.rb-t{width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--ink-2);background:transparent}
.rb-m{width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--ink);background:transparent}
.rb-taps button[aria-pressed="true"]{background:var(--hi);border-color:var(--ink)}
.rb-taps button:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.rb-line{min-height:1.6em;margin:8px 0 0;font-size:1.05rem}
.rb-steps{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0;margin:0 0 12px;list-style:none;font-size:.88rem;color:var(--ink-2)}
.rb-steps li.cur{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--hi);text-decoration-thickness:3px}
.rb-steps li.done{color:var(--green)}
.rb-ins{font-weight:700}
.rb-piece{padding:10px 0;border-bottom:1px solid var(--rule)}
.rb-piece:last-child{border-bottom:0}
.rb-plab{font-size:1.1rem;margin-bottom:6px}
.rb-chip{min-height:36px}
.rb-chip[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.rb-probe{margin-top:12px}
.rb-band{margin-top:8px;min-height:36px}
.rb-band[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rb-bandmsg{margin:8px 0 0}
.rb-sum{margin-top:14px}
/* Practice 1: property grid */
.pgd-head,.pgd-row{display:grid;grid-template-columns:6.2rem minmax(0,.8fr) minmax(0,1.5fr) minmax(0,1.15fr) minmax(0,1.15fr);gap:8px 12px;align-items:start}
.pgd-head{font-size:.85rem;font-weight:700;color:var(--ink-2);padding:0 0 6px;border-bottom:1.5px solid var(--rule)}
.pgd-row{padding:12px 0;border-bottom:1px solid var(--rule)}
.pgd-fn{font:400 1.2rem var(--font-math);padding-top:4px}
.pgd-cell{position:relative;border:1.5px solid transparent;border-radius:8px;padding:4px 22px 4px 4px;min-width:0}
.pgd-cell.bad{border-color:var(--red);background:var(--bad-bg)}
.pgd-cell.good{border-color:var(--green)}
.pgd-cl{display:none;font-size:.82rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.pgd-chips{display:flex;flex-wrap:wrap;gap:5px}
.pgd-chip{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.2em .65em;font:400 1rem var(--font-math);min-height:32px}
.pgd-chip[aria-checked="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);font-weight:700}
.pgd-chip:disabled{opacity:1}
.pgd-mk{position:absolute;top:4px;right:6px;font-weight:700}
.pgd-cell.bad .pgd-mk{color:var(--red)}
.pgd-cell.good .pgd-mk{color:var(--green)}
.pgd-foot{grid-column:1/-1}
.pgd-foot .q-actions{margin-top:2px}
/* Practice 2: Track it down */
.td-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:8px 0}
.td-box{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.td-box > span:first-child{font-weight:700}
.td-box .numin{width:7rem}
.td-and{font-weight:700}
.td-pv{max-width:440px;margin-top:12px}
/* task */
.rq-fn{margin-bottom:10px}
.rq-ab{gap:12px}
.rq-d{display:inline-flex;flex-direction:column;gap:4px;width:48%;max-width:12rem;font-weight:700}
.rq-sel{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.45em .6em;font:400 1.15rem var(--font-math);min-height:44px}
.rq-cap{font:400 1.15rem var(--font-math);margin:10px 0 0;min-height:1.5em}
.rq-warn{font:700 1rem var(--font-ui);color:var(--red)}
@media (min-width:820px){ .cgl-two{display:none} }
@media (max-width:819.98px){
  .cgl-one{display:none}
  .cg-body,.rcb{grid-template-columns:minmax(0,1fr)}
  .cg-more{display:inline-flex}
  #cg-read > div.more{display:none}
  #cg-read.open > div.more{display:block}
  .pgd-head{display:none}
  .pgd-row{grid-template-columns:minmax(0,1fr);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:10px 0}
  .pgd-cl{display:block}
}
@media (max-width:560px){
  .cg-top .rg-wrap,.cg-top .rg.seg{width:100%}
  .cg-top .rg.seg{display:flex;flex-wrap:nowrap}
  .cg-top .rg.seg button{flex:1 1 0;padding-left:.4em;padding-right:.4em}
  .rq-d{width:48%}
}

tle":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"337201ed","content":{"id":"31-graphing-the-six-trig-functions","kind":"topic","title":"Graphing the six trig functions","topic":"Graphing the 6 Trig Functions","readyTopic":"graphing the six trig functions","hero":{"eq":"`y = sin @t{x}`","eqLabel":"y equals sine x","headline":"One circle, six graphs","text":"A point `P` travels around the unit circle. After it has travelled a distance `x`, its height is `sin x` and its run is `cos x`. Plot them as `P` moves and two waves appear, each with \u003cstrong>period\u003c/strong> 2π and \u003cstrong>amplitude\u003c/strong> 1. The \u003cstrong>tangent function\u003c/strong> comes from where `P`’s arm meets a line touching the circle. The \u003cstrong>reciprocal functions\u003c/strong> `csc x`, `sec x` and `cot x` come from flipping the first three: wherever a function is 0, its reciprocal has a \u003cstrong>vertical asymptote\u003c/strong>.","fig":{"html":"\u003ccanvas class=\"plot hero-cgl\" id=\"hero-plot\" role=\"img\" aria-label=\"A point travels once around the unit circle while its height traces the graph of y = sin x from 0 to 2π. The lap unrolls onto the x-axis as 2π. Then the graph of y = csc x appears beside the dashed sine curve, with vertical asymptotes at 0, π and 2π.\">\u003c/canvas>"},"cap":{"lap":"One lap = 2π along the axis","end":"`sin x` and its reciprocal, `csc x`"}},"goals":["I can explain how the graphs of `y = sin x` and `y = cos x` come from the height and the run of a point travelling around the unit circle, with `x` in radians as the distance travelled.","I can sketch `y = sin x` and `y = cos x` and state their key properties: period 2π, amplitude 1, maximum and minimum points, zeros, domain and range, and where they increase or decrease.","I can sketch `y = tan x` and explain its zeros, its vertical asymptotes and its period of π, using the unit circle or `tan x = sin x/cos x`.","I can sketch `y = csc x`, `y = sec x` and `y = cot x` from the graphs of `sin x`, `cos x` and `tan x`: zeros become asymptotes, points at height 1 or −1 stay put, and maximums and minimums swap.","I can state the domain, range, period, zeros and asymptotes of all six functions in correct notation, and explain why `csc x = 1/sin x` is not `sin^{-1} x`.","I can use the six graphs to solve problems: find where a function has a given value or sign, count solutions over several laps, and apply the graphs in a context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Unit circle","goal":1,"prompt":"`P` is the point on the unit circle at angle 4π/3. What is `P`’s `y`-coordinate?","options":[{"t":"`√3`","why":"`√3` is `tan(4π/3) = y/x`. The `y`-coordinate itself is `-√3/2`.","_n":"0550","_k":"5256393e"},{"t":"`√3/2`","why":"Right size, wrong sign. 4π/3 is below the `x`-axis, so the `y`-coordinate is negative.","_n":"1560","_k":"861ee0f0"},{"t":"`-√3/2`","why":"4π/3 = π + π/3 is in quadrant 3 with reference angle π/3. The `y`-coordinate is `sin(4π/3)`: size `√3/2` from π/3, negative below the `x`-axis.","_n":"2570","_k":"f6a77e4d"},{"t":"`-1/2`","why":"`-1/2` is `cos(4π/3)`, `P`’s `x`-coordinate. The `y`-coordinate is the sine.","_n":"3500","_k":"b048c3a0"}],"hints":["Find the quadrant and the reference angle of 4π/3.","4π/3 = π + π/3: quadrant 3, reference angle π/3. `P`’s `y`-coordinate is `sin(4π/3)`.","`sin(π/3) = √3/2`, and `y` is negative in quadrant 3, so the `y`-coordinate is `-√3/2`."]},{"id":"w2","skill":"Unit circle","goal":5,"prompt":"What is the exact value of `csc(5π/6)`?","options":[{"t":"`1/2`","why":"`1/2` is `sin(5π/6)`. csc is its reciprocal, `1 ÷ 1/2`.","_n":"4510","_k":"91cabfee"},{"t":"`-2√3/3`","why":"`-2√3/3 = 1/cos(5π/6)`, which is `sec(5π/6)`. csc pairs with sine.","_n":"5520","_k":"77082f08"},{"t":"−2","why":"In quadrant 2 sine is positive, so its reciprocal is positive too.","_n":"6530","_k":"6fcef602"},{"t":"2","why":"csc = 1/sin, and `sin(5π/6) = 1/2` (quadrant 2, reference angle π/6, sine positive). `1 ÷ 1/2 = 2`.","_n":"75c0","_k":"b00b7094"}],"hints":["csc is the reciprocal of which ratio?","`csc θ = 1/sin θ`. 5π/6 is in quadrant 2 with reference angle π/6, so `sin(5π/6) = 1/2`.","`csc(5π/6) = 1 ÷ 1/2 = 2`."]},{"id":"w3","skill":"Radian measure","goal":1,"prompt":"A point starts at (1, 0) and travels counterclockwise around the unit circle a distance of 3π/2. Where does it stop?","options":[{"t":"(−1, 0)","why":"(−1, 0) is a distance of π, half a lap. 3π/2 goes a further quarter lap.","_n":"85d0","_k":"91180e37"},{"t":"(0, −1)","why":"On the unit circle, the distance travelled equals the angle in radians. A lap is 2π, so 3π/2 is three quarters of a lap: the bottom of the circle.","_n":"94ae","_k":"ba330a8c"},{"t":"(0, 1)","why":"Three quarters of a lap \u003cstrong>clockwise\u003c/strong> ends at the top. Counterclockwise, it ends at the bottom.","_n":"a49e","_k":"30ab105f"},{"t":"`(-√2/2, √2/2)`","why":"That’s the angle 3π/4, which you’d get from `3π/2 = 2θ`. On a circle of radius 1 the arc length \u003cem>is\u003c/em> the angle: `θ = 3π/2`.","_n":"b48e","_k":"ee69ae31"}],"hints":["On a circle of radius 1, arc length = angle in radians (`a = rθ` with `r = 1`).","So the angle is 3π/2. A full lap is 2π, and 3π/2 is three quarters of it.","Three quarters of a lap counterclockwise from (1, 0) ends at the bottom of the circle: (0, −1)."]},{"id":"w4","skill":"Reciprocals","goal":4,"prompt":"The numbers 0.1, 0.01, 0.001, … get closer and closer to 0. What happens to their reciprocals?","options":[{"t":"They switch to negative values.","why":"The reciprocal of a positive number is positive: 1 ÷ 0.001 = 1000.","_n":"c47e","_k":"d7c138b3"},{"t":"They get closer and closer to 1.","why":"1 ÷ 0.1 = 10 and 1 ÷ 0.01 = 100: they move away from 1.","_n":"d46e","_k":"562f4df1"},{"t":"They grow larger and larger, without limit.","why":"1 ÷ 0.1 = 10, 1 ÷ 0.01 = 100, 1 ÷ 0.001 = 1000. Each number is one-tenth of the one before, so its reciprocal is 10 times as large.","_n":"e45e","_k":"34221854"},{"t":"They get closer and closer to 0 as well.","why":"1 ÷ 0.01 = 100, which is far from 0. A tiny number fits into 1 many times.","_n":"f44e","_k":"c94918e9"}],"hints":["Work out 1 ÷ 0.1 and 1 ÷ 0.01.","1 ÷ 0.1 = 10 and 1 ÷ 0.01 = 100.","Each time the number becomes one-tenth as large, its reciprocal becomes 10 times as large: 10, 100, 1000, … without limit."]},{"id":"w5","skill":"Reciprocals","goal":4,"prompt":"Which numbers are equal to their own reciprocals?","options":[{"t":"1 only","why":"−1 works too: 1 ÷ (−1) = −1.","_n":"g43e","_k":"22b119a3"},{"t":"0, 1 and −1","why":"0 has no reciprocal: `1/0` has no value.","_n":"h42e","_k":"d0d3e529"},{"t":"Every number between −1 and 1","why":"`1 ÷ 1/2 = 2`, which isn’t `1/2`. Numbers between −1 and 1 have reciprocals outside that band.","_n":"i41e","_k":"a165ddff"},{"t":"1 and −1 only","why":"`x = 1/x` means `x^2 = 1`, so `x = 1` or `x = -1`. Check: 1 ÷ (−1) = −1.","_n":"j30f","_k":"3948a302"}],"hints":["Solve `x = 1/x`.","Multiply both sides by `x` (which can’t be 0): `x^2 = 1`.","`x = 1` or `x = -1`. 0 can’t be one, because `1/0` has no value."]},{"id":"w6","skill":"Sine graph in degrees","goal":2,"prompt":"In Grade 11 you graphed `y = sin x` with `x` in degrees. What are its period and amplitude?","options":[{"t":"Period 90°, amplitude 1","why":"90° is where the first maximum is. One full cycle takes four times as long.","_n":"k31f","_k":"b949eb65"},{"t":"Period 360°, amplitude 1","why":"The graph repeats every full turn, 360°. It rises 1 above its axis `y = 0` and falls 1 below it.","_n":"l2ef","_k":"c911b5a2"},{"t":"Period 180°, amplitude 1","why":"sin 180° = sin 0° = 0, but the graph doesn’t repeat after 180°: it’s above the axis from 0° to 180° and below it from 180° to 360°.","_n":"m2ff","_k":"2ed186db"},{"t":"Period 360°, amplitude 2","why":"2 is the distance from the maximum, 1, down to the minimum, −1. The amplitude is half of that.","_n":"n34f","_k":"05fb7b6d"}],"hints":["Period: how far along the `x`-axis before the whole pattern starts again? Amplitude: how far above its middle line does the graph rise?","The maximum is 1 and the minimum is −1, so the middle line is `y = 0`. The pattern starts again after one full turn.","Period 360°; amplitude `(1 - (-1))/2 = 1`."]}],"refreshers":{"Unit circle":"The point at angle `x` on the unit circle is `(cos x, sin x)`. For a special angle, the reference angle gives the size and the quadrant gives the sign: 4π/3 is in quadrant 3 with reference angle π/3, so its point is `(-1/2, -√3/2)`. The reciprocal ratios are `csc x = 1/sin x`, `sec x = 1/cos x` and `cot x = cos x/sin x`, so `csc(5π/6) = 1 ÷ 1/2 = 2`. `tan x = sin x/cos x` is undefined where its denominator, `cos x`, is 0.","Radian measure":"On a circle of radius 1, an arc’s length equals its angle in radians (`a = rθ` with `r = 1`). A full lap is 2π, half a lap is π and a quarter lap is π/2. Travelling 3π/2 counterclockwise from (1, 0) is three quarters of a lap, ending at (0, −1).","Reciprocals":"The reciprocal of a number is 1 divided by it. Reciprocals keep the sign and swap big and small: 1 ÷ 0.01 = 100 and 1 ÷ 100 = 0.01. Only 1 and −1 are their own reciprocals. 0 has no reciprocal, because `1/0` has no value.","Sine graph in degrees":"`y = sin x` (in degrees) starts at 0, rises to 1 at 90°, is back to 0 at 180°, falls to −1 at 270° and is back to 0 at 360°. Then the whole pattern repeats, so the period is 360°. The amplitude is half the distance from the maximum to the minimum: `(1 - (-1))/2 = 1`."}}},"explore":{"heading":"Unwrap the circle","intro":"Move `P` around the unit circle and watch its height and run become graphs. Then switch to the tangent line and watch `tan x` appear, asymptotes and all. The panel lists every value as you go.","ui":{"halfNote":"The `x`-axis is drawn at half scale in this view.","trueNote":"Drawn to true scale on wider screens.","carryCap":"The run, stood up, is the height of the cosine graph.","unrollLab":"distance travelled = x","offScreen":"T is off the screen","tangentLab":"tangent line x = 1","p4Banner":"No meeting point: `tan(π/2)` is undefined","movingNote":"Increasing and decreasing describe the graph read from left to right, which is `P` moving counterclockwise.","waveFacts":"Period 2π (one lap) · Amplitude `1 = (1 - (-1))/2` · Range `{y ∈ ℝ | -1 ≤ y ≤ 1}`","lock":"The slider is locked until you check your angle for challenge 3.","tc3Hint":"Type the number in front of π as a fraction: choose the top and the bottom."},"predictions":[{"id":"p1","prompt":"`P` is about to travel one lap, tracing both `y = sin x` and `y = cos x`. On which interval will \u003cstrong>both\u003c/strong> graphs be going down?","options":[{"t":"`π \u003c x \u003c 3π/2`","_n":"o35f","_k":"2ede77bd"},{"t":"`0 \u003c x \u003c π/2`","_n":"p32f","_k":"b9eaeb09"},{"t":"`π/2 \u003c x \u003c π`","_n":"q33f","_k":"1819219e"},{"t":"`3π/2 \u003c x \u003c 2π`","_n":"r38f","_k":"82ccce15"}],"explain":"`sin x` falls while `P` moves down, from the top (π/2) to the bottom (3π/2). `cos x` falls while `P` moves left, from the far right (0) to the far left (π). Both happen only in quadrant 2, where `P` is moving down \u003cstrong>and\u003c/strong> to the left. In quadrant 1 the height is rising; in quadrant 3 the run is rising; in quadrant 4 both are rising."},{"id":"p2","prompt":"You’ve traced `y = sin x` from 0 to 2π. Now `P` will travel \u003cstrong>clockwise\u003c/strong>, from `x = 0` to `x = -2π`. What will the new piece of graph, from −2π to 0, look like?","options":[{"t":"A wave that stays below the `x`-axis the whole way, because the angles are negative","_n":"s39f","_k":"53e5a505"},{"t":"An exact copy of the piece from 0 to 2π, moved 2π to the left","_n":"tb6f","_k":"acc170f5"},{"t":"The mirror image of the piece from 0 to 2π in the `y`-axis","_n":"ub5f","_k":"7df0be14"},{"t":"Nothing: negative angles have no sine","_n":"vb8f","_k":"84781d4e"}],"explain":"Going clockwise a distance π/2 puts `P` at the bottom of the circle, the same point as 3π/2, so `sin(-π/2) = sin(3π/2) = -1`. Every `x` and `x + 2π` end at the same point, so the graph repeats every 2π, in both directions: that’s what period 2π means. A mirror image would need `sin(-π/2)` to equal `sin(π/2) = 1`, but it’s −1. And negative angles don’t force negative heights: at −3π/2, `P` is at the top."},{"id":"p3","prompt":"The arm is at π/6, where `tan x = √3/3`. It will turn half a lap further, to 7π/6. What will `tan(7π/6)` be?","options":[{"t":"Undefined: an arm pointing into quadrant 3 can’t reach the tangent line","_n":"wb7f","_k":"0d1bf074"},{"t":"`√3`","_n":"xb2f","_k":"c6c14b92"},{"t":"`√3/3`","_n":"yb1f","_k":"ba448b0f"},{"t":"`-√3/3`","_n":"zb4f","_k":"377a5896"}],"explain":"At 7π/6 the arm points the opposite way along the \u003cstrong>same line\u003c/strong> as at π/6. Extended back through the origin, it meets the tangent line at the same point, so `tan(7π/6) = tan(π/6) = √3/3`. In numbers: both `sin x` and `cos x` change sign, so their quotient doesn’t. Tangent repeats every half lap: its period is π, not 2π."},{"id":"p4","prompt":"The arm will turn slowly from 5π/12 to 7π/12, passing straight up at π/2. What happens to `tan x`?","options":[{"t":"It levels off at 1 near π/2","_n":"10b3f","_k":"edc00c04"},{"t":"It falls through 0 at π/2","_n":"11bef","_k":"b34d01fb"},{"t":"It reaches a maximum at π/2, then decreases smoothly","_n":"12bdf","_k":"8a25ca65"},{"t":"It grows larger and larger, has no value at π/2, then continues from very large negative values","_n":"13ace","_k":"a97d0eb0"}],"explain":"Just before π/2 the arm is very steep, so its line meets `x = 1` very high up. At π/2 the arm is vertical, parallel to the tangent line, so there’s no meeting point: `tan(π/2) = 1/0` is undefined. Just after π/2 the arm leans left, and its line, extended back through the origin, meets `x = 1` very far \u003cstrong>below\u003c/strong> the axis. That jump is a vertical asymptote. It happens wherever `cos x = 0`, the denominator of `sin x/cos x`."}],"chalIntro":"Set the unwrapper, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,6],"prompt":"Two laps view. Set the angle so that `P`’s height is −1/2 \u003cstrong>and\u003c/strong> `P` is to the right of the `y`-axis.","why":"Quadrant 4 with reference angle π/6: 11π/6, or −π/6 going clockwise. Both are the same point.","named":{"side":"The height is right, −1/2, but `P` is left of the `y`-axis: its run is negative. Go to the other side, still below the axis.","plus":"Here `sin x = +1/2`: `P` is above the `x`-axis. You need a height of −1/2.","deep":"`P` is in the right quadrant, but its height is `-√3/2 ≈ -0.87`. A drop of only 1/2 needs reference angle π/6.","bottom":"That’s the bottom of the circle: height −1.","swap":"Here the \u003cstrong>run\u003c/strong> is −1/2 and `P` is above the axis. The height is `sin x`, the `y`-coordinate: you need `P` below the `x`-axis at height −1/2, and to the right of the `y`-axis.","other":"Check the readout: you need `sin x = -1/2` (the height) and `cos x > 0` (`P` right of the `y`-axis)."},"hints":["Which quadrant has `P` below the `x`-axis and to the right of the `y`-axis?","Quadrant 4. A height of −1/2 means reference angle π/6.","2π − π/6 = 11π/6. Going clockwise, −π/6 is the same point. Either works."]},{"id":"tc2","goal":[3,6],"prompt":"Tangent line mode, Two laps view. Find \u003cstrong>every\u003c/strong> slider angle from −2π to 2π where `tan x = -1`. Press \u003cstrong>Pin this angle\u003c/strong> at each one (tap a pin to remove it), then press \u003cstrong>Check challenge\u003c/strong>.","why":"`tan x = -1` at 3π/4 and 7π/4, and tan repeats every π: −5π/4, −π/4, 3π/4 and 7π/4.","named":{"one":"At {a}, `tan x = 1`: the arm’s line slopes up. `tan x = -1` needs the arm in quadrant 2 or 4.","undef":"At {a} the arm is vertical, so `tan x` is undefined.","other":"At {a}, `tan x = ` {v}, not −1.","half":"Both right, but the slider goes back to −2π too. `tan x` repeats every π: keep subtracting π from 3π/4 until you pass −2π.","some":"You have {n} of them. From any answer, add or subtract π to find the next one on the line.","none":"Pin at least one angle first: set the slider, then press \u003cstrong>Pin this angle\u003c/strong>."},"hints":["`tan x` is the slope of the arm’s line. Where does the line have slope −1?","`tan x = -1` at 3π/4 (quadrant 2) and at 7π/4 (quadrant 4). `tan x` repeats every π.","Step back π at a time from 3π/4: 3π/4 − π = −π/4, then −π/4 − π = −5π/4 (one more step, −9π/4, is past −2π). The four angles are −5π/4, −π/4, 3π/4 and 7π/4."]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Commit first. Find an angle `x`, with `-2π ≤ x ≤ 2π`, where, as `x` increases, `P`’s height is \u003cstrong>decreasing\u003c/strong> and its run is \u003cstrong>increasing\u003c/strong>, and `tan x = √3`. Enter it before `P` moves.\u003cp class=\"tiny muted\" style=\"margin:6px 0 0\">“As `x` increases” means `P` moves counterclockwise, which is how the graphs are read, left to right.\u003c/p>\u003cdiv class=\"tc3-box\">\u003c/div>","why":"Quadrant 3 has `P` moving down and to the right, and reference angle π/3 gives `tan x = √3`: 4π/3, or −2π/3 going clockwise.","named":{"q1":"`tan x = √3` here, but `P` is in quadrant 1: as `x` increases it moves up and to the left, so its height is increasing and its run is decreasing.","sixth":"Right quadrant, but here `tan x = √3/3`. `√3` needs reference angle π/3.","quarter":"Right quadrant, but here `tan x = 1`.","neg":"`tan x = -√3` here: the arm’s line slopes down. In the quadrant you need, `tan x` is positive.","range":"Keep `x` between −2π and 2π.","other":"Work it out before you check: which quadrant has `P` moving down and to the right? Which reference angle has tangent `√3`?","empty":"Enter your angle first: choose the number on top and the number underneath."},"hints":["As `x` increases, `P` moves counterclockwise. Which quadrant has `P` moving down and to the right?","Quadrant 3: the height falls and the run rises. `tan x = √3` needs reference angle π/3.","π + π/3 = 4π/3. Going clockwise, 4π/3 − 2π = −2π/3 is the same point."]}],"blocks":[{"title":"What the graphs show","html":"\u003cp class=\"tiny muted\">`n` is any integer, written `n ∈ ℤ`.\u003c/p>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt wg-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003c/th>\u003cth scope=\"col\">`y = sin x`\u003c/th>\u003cth scope=\"col\">`y = cos x`\u003c/th>\u003cth scope=\"col\">`y = tan x`\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Period\u003c/th>\u003ctd>2π\u003c/td>\u003ctd>2π\u003c/td>\u003ctd>π\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Amplitude\u003c/th>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>none (no maximum or minimum)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Domain\u003c/th>\u003ctd>`{x ∈ ℝ}`\u003c/td>\u003ctd>`{x ∈ ℝ}`\u003c/td>\u003ctd>`{x ∈ ℝ | x ≠ {π}/{2} + nπ, n ∈ ℤ}`\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Range\u003c/th>\u003ctd>`{y ∈ ℝ | -1 ≤ y ≤ 1}`\u003c/td>\u003ctd>`{y ∈ ℝ | -1 ≤ y ≤ 1}`\u003c/td>\u003ctd>`{y ∈ ℝ}`\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Zeros\u003c/th>\u003ctd>`x = nπ`\u003c/td>\u003ctd>`x = {π}/{2} + nπ`\u003c/td>\u003ctd>`x = nπ`\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Vertical asymptotes\u003c/th>\u003ctd>none\u003c/td>\u003ctd>none\u003c/td>\u003ctd>`x = {π}/{2} + nπ`\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">One lap, `0 ≤ x ≤ 2π`\u003c/th>\u003ctd>max `({π}/{2}, 1)`, min `({3π}/{2}, -1)`\u003c/td>\u003ctd>max (0, 1) and (2π, 1), min (π, −1)\u003c/td>\u003ctd>rises on every piece\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},"part3":{"slug":"reciprocals","name":"Reciprocals","heading":"Build the reciprocal graphs","intro":"Each reciprocal function is built from its partner: `csc x = 1/sin x`, `sec x = 1/cos x`, `cot x = 1/tan x`. Build each graph in layers. The curve draws only when every layer is right.","builder":{"layerNames":["Asymptotes","Zeros","Points that stay put","The shape of each piece","Draw and probe"],"l1":"Tap every `x`-value where the partner is 0. The reciprocal has a vertical asymptote there.","l1b":"Now tap where `tan x` has its own asymptotes. What happens to `cot x` there?","l1bRight":"Where `tan x` is undefined, `cos x = 0` and `sin x = ±1`, so `cot x = cos x/sin x = 0`. Where the partner is huge, the reciprocal is tiny.","l1bWrong":"Those are `tan x`’s zeros; they’re already the asymptotes of `cot x`.","l2":"Tap every point of the dashed graph at height 1 or −1. These points are on both graphs.","l3":"Between the asymptotes, how does each piece of the reciprocal look? Use the signs and ‘big ↔ small’.","l4":"Press \u003cstrong>Play\u003c/strong> to draw the pieces left to right, or \u003cstrong>Step\u003c/strong> to draw one piece at a time.","chips":[{"id":"up","t":"∪ opens up"},{"id":"down","t":"∩ opens down"},{"id":"rise","t":"↗ rises"},{"id":"fall","t":"↘ falls"}],"stay1":"1/1 = 1: stays put","stayM1":"1/(−1) = −1: stays put","zeroLab":"cot x = 0","fb":{"cscHalf":"At {v}, `sin x = ` {s}, not 0, and 1 ÷ {s} is a perfectly good value. Asymptotes come only from the zeros of the partner.","secPi":"At {v}, `cos x = ` {s}, not 0. Those are the zeros of `sin x`. `sec x` is `1/cos x`, so look for the zeros of `cos x`.","cotHalf":"At {v}, `tan x` is undefined, not 0. Asymptotes of `cot x` come from the \u003cstrong>zeros\u003c/strong> of `tan x`. (You’ll deal with π/2 and 3π/2 in the next step.)","odd":"At {v}, the partner is {s}, not 0.","edge":"The edges of the window count too: `sin 0 = 0` and `sin 2π = 0` (and `tan 0 = tan 2π = 0`).","other1":"Check each tap: does the dashed graph cross the `x`-axis there? You may have missed one.","other1b":"Look at where the dashed graph of `tan x` breaks and jumps: that’s where `tan x` is undefined.","moves":"At `x = ` {v}, {p} ≈ {pd}. Its reciprocal is {r} ≈ {rd}, so this point moves.","zero":"At {v} the partner is 0; that’s an asymptote, not a point that stays put.","missing2":"Some points at height 1 or −1 are still untapped.","none":"Tap at least one first.","partner":"Big ↔ small: where the partner is largest in size, its reciprocal is smallest in size, and where the partner rises, its reciprocal falls. The reciprocal’s piece is the partner’s shape turned the other way.","whole":"The partner turns around inside this piece (at a peak or a trough), so its reciprocal turns around too: the piece is ∪ or ∩.","half":"This piece runs from an edge of the window to an asymptote, so it only goes one way. Is `cos x` rising or falling here?","cot":"`tan x` rises all the way across each of its pieces, so `cot x` never turns around: it only goes one way."},"band":"Band `-1 \u003c y \u003c 1`","bandLab":"small heights","bandMsg":"Wherever the dashed graph is inside the band (but not 0), its reciprocal is outside it, and the other way round. Where the dashed graph is 0, the reciprocal has no value at all: that’s an asymptote.","builds":[{"id":"csc","fn":"csc","partner":"sin","chip":"`csc x` from `sin x`","asym":[0,4,8],"stay":[[2,1],[6,-1]],"pieces":[{"lab":"`0 \u003c x \u003c π`","_a":"EUZHEA==","whole":true,"why":"`sin x` is positive here, rising to 1 at π/2 and falling back. Its reciprocal is positive, falls to 1 at π/2 and rises again: a ∪ with lowest point (π/2, 1)."},{"lab":"`π \u003c x \u003c 2π`","_a":"EVdYRV4T","whole":true,"why":"`sin x` is negative here, with its minimum −1 at 3π/2. Its reciprocal is negative, with its \u003cstrong>highest\u003c/strong> point (3π/2, −1): a ∩."}],"summary":"`csc x`: period 2π; domain `{x ∈ ℝ | x ≠ nπ, n ∈ ℤ}`; range `{y ∈ ℝ | y ≤ -1 or y ≥ 1}`; no zeros; local minimum (π/2, 1), local maximum (3π/2, −1) in each lap.","describe":"Graph of y = csc x with the dashed graph of y = sin x. Vertical asymptotes at 0, π and 2π. Local minimum (π/2, 1), local maximum (3π/2, −1)."},{"id":"sec","fn":"sec","partner":"cos","chip":"`sec x` from `cos x`","asym":[2,6],"stay":[[0,1],[4,-1],[8,1]],"pieces":[{"lab":"`0 ≤ x \u003c π/2`","_a":"EUFeQVUT","half":true,"why":"`cos x` falls from 1 toward 0, so `sec x` rises from 1 toward +∞."},{"lab":"`π/2 \u003c x \u003c 3π/2`","_a":"EVdYRV4T","whole":true,"why":"`cos x` is negative here, lowest (−1) at π. `sec x` is negative, highest (−1) at π."},{"lab":"`3π/2 \u003c x ≤ 2π`","_a":"EVVWXlwT","half":true,"why":"`cos x` rises from 0 to 1, so `sec x` falls from +∞ to 1."}],"summary":"`sec x`: period 2π; domain `{x ∈ ℝ | x ≠ π/2 + nπ, n ∈ ℤ}`; range `{y ∈ ℝ | y ≤ -1 or y ≥ 1}`; no zeros; local minimum (0, 1), local maximum (π, −1) in each lap.","describe":"Graph of y = sec x with the dashed graph of y = cos x. Vertical asymptotes at π/2 and 3π/2. Local minimum (0, 1), local maximum (π, −1)."},{"id":"cot","fn":"cot","partner":"tan","chip":"`cot x` from `tan x`","asym":[0,4,8],"zeros":[2,6],"stay":[[1,1],[3,-1],[5,1],[7,-1]],"pieces":[{"lab":"`0 \u003c x \u003c π`","_a":"EVVWXlwT","cot":true,"why":"`tan x` rises on every piece, so its reciprocal falls: from +∞ near 0, through 0 at π/2, to −∞ near π."},{"lab":"`π \u003c x \u003c 2π`","_a":"EVVWXlwT","cot":true,"why":"The same shape again: `cot x` has period π."}],"summary":"`cot x`: period π; domain `{x ∈ ℝ | x ≠ nπ, n ∈ ℤ}`; range `{y ∈ ℝ}`; zeros `x = π/2 + nπ`; falls on every piece.","describe":"Graph of y = cot x with the dashed graph of y = tan x. Vertical asymptotes at 0, π and 2π. Zeros at π/2 and 3π/2. It falls on every piece."}],"alg":{"tables":{"csc":{"head":["`x`","`{π}/{6}`","`{π}/{4}`","`{π}/{3}`","`{π}/{2}`","`{2π}/{3}`","`{3π}/{4}`","`{5π}/{6}`","π"],"rows":[["`sin x`","`{1}/{2}`","`{√2}/{2}`","`{√3}/{2}`","1","`{√3}/{2}`","`{√2}/{2}`","`{1}/{2}`","0"],["`csc x = 1/sin x`","2","`√2`","`{2√3}/{3}`","1","`{2√3}/{3}`","`√2`","2","undefined"]]},"sec":{"head":["`x`","0","`{π}/{6}`","`{π}/{4}`","`{π}/{3}`","`{π}/{2}`","`{2π}/{3}`","`{3π}/{4}`","`{5π}/{6}`","π"],"rows":[["`cos x`","1","`{√3}/{2}`","`{√2}/{2}`","`{1}/{2}`","0","`-{1}/{2}`","`-{√2}/{2}`","`-{√3}/{2}`","−1"],["`sec x = 1/cos x`","1","`{2√3}/{3}`","`√2`","2","undefined","−2","`-√2`","`-{2√3}/{3}`","−1"]]},"cot":{"head":["`x`","`{π}/{6}`","`{π}/{4}`","`{π}/{3}`","`{π}/{2}`","`{2π}/{3}`","`{3π}/{4}`","`{5π}/{6}`"],"rows":[["`tan x`","`{√3}/{3}`","1","`√3`","undefined","`-√3`","−1","`-{√3}/{3}`"],["`cot x = cos x/sin x`","`√3`","1","`{√3}/{3}`","0","`-{√3}/{3}`","−1","`-√3`"]]}},"closeTitle":"Close-up near the asymptote `x = π` (values computed by the tool)","closeSec":"Close-up near the asymptote `x = π/2` (values computed by the tool)","words":"`csc x = 1/sin x` is undefined exactly where `sin x = 0`, so its domain leaves out `x = nπ`. Because `-1 ≤ sin x ≤ 1`, its reciprocal is never between −1 and 1, so the range is `y ≤ -1` or `y ≥ 1`. 1 divided by a number is never 0, so `csc x` has no zeros. `cot x` is defined as `cos x/sin x`, which equals `1/tan x` wherever both are defined; at `x = π/2 + nπ`, `tan x` is undefined but `cot x = 0`.","notation":"The reciprocal of `f(x) = sin x` can be written `csc x`, `1/sin x` or `1/f(x)`. It is \u003cstrong>not\u003c/strong> `sin^{-1} x` or `f^{-1}(x)`: those mean the inverse function."}},"blocks":[{"title":"What the builder shows","html":"\u003cp>\u003cstrong>Building `y = 1/f(x)` from `y = f(x)`\u003c/strong>\u003c/p>\u003col>\u003cli>Zeros of `f` become vertical asymptotes. (Where `f` has a vertical asymptote of its own, as `tan x` does at π/2, `1/f(x)` shrinks toward 0; `cot x = cos x/sin x` is exactly 0 there.)\u003c/li>\u003cli>Points at height 1 or −1 stay put.\u003c/li>\u003cli>Same sign, but big ↔ small: a maximum of `f` becomes a local minimum, a minimum becomes a local maximum, and where `f` rises, `1/f` falls.\u003c/li>\u003cli>Same period as `f`.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Reciprocal quick check","summary":"Reciprocal quick check","items":[{"id":"q1","goal":5,"prompt":"The graph of `y = sin x` passes through (`a`, 0.2). Which point is on the graph of `y = csc x`?","choices":[{"t":"(`a`, 0.8)","fb":"0.8 is 1 − 0.2. The reciprocal is 1 ÷ 0.2.","_n":"14ade","_k":"4e4331ab"},{"t":"(`a`, −5)","fb":"Reciprocals keep the sign: 1 ÷ 0.2 = +5.","_n":"15aee","_k":"01f3877f"},{"t":"(`a`, 5)","fb":"Right. Same `x`, reciprocal height: 1 ÷ 0.2 = 5.","_n":"16afe","_k":"1144ce9c"},{"t":"(0.2, `a`)","fb":"Swapping the coordinates is what an inverse does (`sin^{-1}`). The reciprocal keeps `x` and flips the height.","_n":"17b0e","_k":"6a693b4d"}]},{"id":"q2","goal":4,"prompt":"On `0 \u003c x \u003c π`, where is `y = csc x` increasing?","choices":[{"t":"All of `0 \u003c x \u003c π`","fb":"`csc x` has a local minimum at π/2: it falls first, then rises.","_n":"18b1e","_k":"d25b5aeb"},{"t":"Nowhere","fb":"It rises on the right half of the piece, (π/2, π).","_n":"19b2e","_k":"ed3a5f19"},{"t":"`π/2 \u003c x \u003c π`","fb":"Right. `csc x` rises where `sin x` falls, and `sin x` falls from 1 to 0 on (π/2, π).","_n":"1ab3e","_k":"93cd53ff"},{"t":"`0 \u003c x \u003c π/2`","fb":"There `sin x` rises from 0 to 1, so `csc x` falls toward 1.","_n":"1bb4e","_k":"0a5c3bd4"}]},{"id":"q3","goal":4,"prompt":"Which function has zeros exactly where `y = tan x` has its vertical asymptotes?","choices":[{"t":"`sin x`","fb":"`sin x` is 0 at `x = nπ`, which are `tan x`’s zeros, not its asymptotes.","_n":"1cb5e","_k":"8f672d40"},{"t":"`sec x`","fb":"`sec x` has asymptotes there too (`cos x = 0`), not zeros.","_n":"1db2e","_k":"712eda54"},{"t":"`csc x`","fb":"`csc x` has its asymptotes at `x = nπ`, and no zeros at all.","_n":"1eb1e","_k":"68746796"},{"t":"`cot x`","fb":"Right. Where `tan x` is undefined, `cos x = 0` and `sin x = ±1`, so `cot x = cos x/
