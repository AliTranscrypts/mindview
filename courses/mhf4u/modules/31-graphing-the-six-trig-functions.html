 (the arm’s line repeats every half lap); range `(-∞, ∞)` (near each asymptote it takes every value)."]},{"id":"csc","label":"`y = csc x`","_a":"SBFHV0JYCgARCRVCAhNJRkFSWVVVE19GXEZDEBwTHwFBXEQQChMLC11WFR4SUBYdXhENEF4TGA==","fb":{"period":{"h":"π/2 is a quarter lap, and the values don’t repeat after it: `sin 0 = 0`, but `sin(π/2) = 1`.","p":"Half a lap later `P` is on the opposite side: `csc(x + π) = -csc x`, not `csc x`. These repeat only every full lap, 2π. A reciprocal repeats exactly when its partner does."},"range":{"b":"That’s the partner’s range. Reciprocals of numbers between −1 and 1 are 1 or more in size.","all":"`csc x` is never strictly between −1 and 1: that would need `sin x` to be bigger than 1 in size.","outo":"`csc(π/2) = 1` and `sec 0 = 1`, so ±1 are reached: use square brackets."},"zeros":{"h":"1 divided by a number is never 0, so a reciprocal function has no zeros. Where the partner is 0, the reciprocal is undefined: an asymptote.","n":"1 divided by a number is never 0, so a reciprocal function has no zeros. Where the partner is 0, the reciprocal is undefined: an asymptote."},"asym":{"h":"csc pairs with sine and sec pairs with cosine. Asymptotes are at the zeros of the partner.","none":"`csc x` divides by `sin x`, which is 0 at `x = nπ`: those are vertical asymptotes."}},"hints":["Write `csc x` in terms of `sin x`. Where is its denominator 0, and can it ever be 0 itself?","`csc x = 1/sin x`. The denominator is 0 at `x = nπ`. The numerator is 1, which is never 0.","Asymptotes `x = nπ`; no zeros; period 2π (the same as `sin x`); range `(-∞, -1] ∪ [1, ∞)` (reciprocals of numbers in `[-1, 1]`, leaving out 0)."]},{"id":"sec","label":"`y = sec x`","_a":"SBFHV0JYCgARCRVCAhNJRkFSWVVVE19GXEZDEBwTHwFBXEQQChMLC11WFR4SUBYdXhENEFgTGA==","fb":{"period":{"h":"π/2 is a quarter lap, and the values don’t repeat after it: `sin 0 = 0`, but `sin(π/2) = 1`.","p":"Half a lap later `P` is on the opposite side: `sec(x + π) = -sec x`, not `sec x`. These repeat only every full lap, 2π. A reciprocal repeats exactly when its partner does."},"range":{"b":"That’s the partner’s range. Reciprocals of numbers between −1 and 1 are 1 or more in size.","all":"`sec x` is never strictly between −1 and 1: that would need `cos x` to be bigger than 1 in size.","outo":"`csc(π/2) = 1` and `sec 0 = 1`, so ±1 are reached: use square brackets."},"zeros":{"h":"1 divided by a number is never 0, so a reciprocal function has no zeros. Where the partner is 0, the reciprocal is undefined: an asymptote.","n":"1 divided by a number is never 0, so a reciprocal function has no zeros. Where the partner is 0, the reciprocal is undefined: an asymptote."},"asym":{"n":"csc pairs with sine and sec pairs with cosine. Asymptotes are at the zeros of the partner.","none":"`sec x` divides by `cos x`, which is 0 at `x = π/2 + nπ`: those are vertical asymptotes."}},"hints":["Write `sec x` in terms of `cos x`. Where is its denominator 0, and can it ever be 0 itself?","`sec x = 1/cos x`. The denominator is 0 at `x = π/2 + nπ`. The numerator is 1, which is never 0.","Asymptotes `x = π/2 + nπ`; no zeros; period 2π (the same as `cos x`); range `(-∞, -1] ∪ [1, ∞)` (reciprocals of numbers in `[-1, 1]`, leaving out 0)."]},{"id":"cot","label":"`y = cot x`","_a":"SBFHV0JYCgARCRVCEh1HFlJdUFcSC0cFX18VHhJLABZcQBUIEllHSBFSREtdE19GXRFK","fb":{"period":{"h":"π/2 is a quarter lap, and the values don’t repeat after it: `sin 0 = 0`, but `sin(π/2) = 1`.","p2":"`tan x` repeats every half lap: the arm for `x + π` lies on the same line. Its period is π, and `cot x = 1/tan x` repeats whenever `tan x` does."},"range":{"outo":"`cot x` takes every value: near its asymptotes it gets as large as you like in size, and `cot(π/3) = √3/3` is between −1 and 1.","out":"`cot x` takes every value: near its asymptotes it gets as large as you like in size, and `cot(π/3) = √3/3` is between −1 and 1.","b":"`cot x` takes every value: near its asymptotes it gets as large as you like in size, and `cot(π/3) = √3/3` is between −1 and 1."},"zeros":{"n":"At `x = π`, `cot x = cos π/sin π = -1/0`: undefined. `cot x = 0` where `cos x = 0`: `x = π/2 + nπ`.","none":"`cot x` is 0 at `x = π/2 + nπ`: for example, `cot(π/2) = 0`."},"asym":{"h":"At π/2, `tan x` is undefined, but `cot x = cos x/sin x = 0/1 = 0`: a zero. `cot x` is undefined where `sin x = 0`.","none":"`cot x` divides by `sin x`, which is 0 at `x = nπ`: those are vertical asymptotes."}},"hints":["Write `cot x` in terms of `sin x` and `cos x`. Where is its denominator 0, and where is its numerator 0?","`cot x = cos x/sin x`. The denominator is 0 at `x = nπ`; the numerator is 0 at `x = π/2 + nπ`.","Asymptotes `x = nπ`; zeros `x = π/2 + nπ`; period π (the same as `tan x`); range `(-∞, ∞)` (near each asymptote it takes every value)."]}]},{"id":"track","type":"custom","title":"Track it down","summary":"Track it down","star":true,"goal":[6,3,4],"instruction":"Use the graphs to find each value. Type the number in front of π as a fraction (5/2 for 5π/2), or a whole number for a count, then press Check.","how":"After each check, a small graph of the function over the stated interval appears, with your answer marked, so you can see why it’s right or wrong.","outside":"That’s outside the interval. Add or subtract 2π (or π for tan and cot) to move into it.","fallback":"Not quite. The preview shows the graph over the interval: find the feature you need and read its `x`-value.","both":"Enter both `x`-values.","items":[{"id":"td1","goal":[6,4],"kind":"pi","prompt":"`y = csc x` has a local minimum at (`a`, 1) with `2π \u003c a \u003c 4π`. Find `a`.","lab":"`a =`","lo":2,"hi":4,"_a":"aAEZB20=","show":"5π/2","wrong":[{"v":[3.5],"fb":"`csc(7π/2) = -1`: that’s a local \u003cstrong>maximum\u003c/strong>, on a piece below the axis."},{"v":[3],"fb":"At 3π, `sin x = 0`: that’s an asymptote of `csc x`."}],"hints":["In the first lap, where does `csc x` have its local minimum at height 1?","At `x = π/2`, where `sin x = 1`. The graph repeats every 2π.","π/2 + 2π = 5π/2, which is between 2π and 4π. `a = 5π/2`."]},{"id":"td2","goal":[6,3],"kind":"pi","prompt":"Find the vertical asymptote of `y = tan x` that lies strictly between −2π and −π.","lab":"`x =`","lo":-2,"hi":-1,"_a":"aB4GHAVs","show":"−3π/2","wrong":[{"v":[-1],"fb":"`tan(-π) = 0`: that’s a zero, and it’s an end of the interval."},{"v":[1.5],"fb":"3π/2 is an asymptote, but it isn’t between −2π and −π: watch the sign."}],"hints":["Where is `tan x` undefined?","`tan x` has vertical asymptotes where `cos x = 0`: `x = π/2 + nπ`. Which of these lies between −2π and −π?","The asymptotes are …, −5π/2, −3π/2, −π/2, π/2, …; only −3π/2 is strictly between −2π and −π."]},{"id":"td3","goal":[6,4],"kind":"pi","prompt":"The graph of `y = cot x` passes through (`a`, −1) with `π \u003c a \u003c 2π`. Find `a`.","lab":"`a =`","lo":1,"hi":2,"_a":"aAIZBQVs","show":"7π/4","wrong":[{"v":[1.25],"fb":"`cot(5π/4) = 1`: in quadrant 3, `cos x` and `sin x` are both negative."},{"v":[1.5],"fb":"`cot(3π/2) = 0/(-1) = 0`."}],"hints":["In which quadrants is `cot x` negative?","`cot x = cos x/sin x` is negative in quadrants 2 and 4. Between π and 2π, that means quadrant 4. `cot x = ±1` needs reference angle π/4.","2π − π/4 = 7π/4: `cot(7π/4) = (√2/2)/(-√2/2) = -1`. `a = 7π/4`."]},{"id":"td4","goal":[6,4],"kind":"pi2","prompt":"On `0 \u003c x \u003c 2π`, where do the graphs of `y = sec x` and `y = csc x` cross? Enter both `x`-values.","lab":"`x =`","lo":0,"hi":2,"_a":"aAMZAAUdVEoBBmo=","show":"π/4 and 5π/4","wrong":[{"v":[0.25],"fb":"There’s a second crossing, where `sin x` and `cos x` are both negative."},{"v":[0.75,1.75],"fb":"There `sec x = -csc x`: the sizes match (`√2`), but the signs are opposite."}],"hints":["`sec x = csc x` means `1/cos x = 1/sin x`. What does that say about `cos x` and `sin x`?","`cos x = sin x`, so `tan x = 1`. Where is `tan x = 1` between 0 and 2π?","`x = π/4` and `x = 5π/4`. Check: `sec(π/4) = csc(π/4) = √2`, and `sec(5π/4) = csc(5π/4) = -√2`."]},{"id":"td5","goal":[6,4],"kind":"count","prompt":"On `0 ≤ x ≤ 2π`, at how many points do the graphs of `y = sin x` and `y = csc x` meet?","lab":"Number of points:","_a":"aAFq","wrong":[{"v":[0],"fb":"They do meet: a number equals its own reciprocal when it’s 1 or −1."},{"v":[4],"fb":"Each meeting point is on both graphs, so count it once: (π/2, 1) and (3π/2, −1)."},{"v":[1],"fb":"`sin x = -1` counts too: (3π/2, −1)."}],"hints":["A point is on both graphs when `sin x = 1/sin x`. Which numbers equal their own reciprocals?","Only 1 and −1. Where on `0 ≤ x ≤ 2π` is `sin x = 1` or `sin x = -1`?","`sin x = 1` at π/2 and `sin x = -1` at 3π/2: the graphs meet at (π/2, 1) and (3π/2, −1). That’s 2 points."]},{"id":"td6","goal":[6,4],"kind":"count","prompt":"How many vertical asymptotes does `y = sec x` have on `0 ≤ x ≤ 6π`?","lab":"Number of asymptotes:","_a":"aAVq","wrong":[{"v":[3],"fb":"`cos x` is 0 twice in every lap (top and bottom of the circle), not once."},{"v":[7],"fb":"Those are `x = 0`, π, …, 6π, the asymptotes of `csc x`. `sec x` is undefined where `cos x = 0`."}],"hints":["Where is `sec x` undefined?","`sec x = 1/cos x` is undefined where `cos x = 0`: twice in every lap, at the top and bottom of the circle.","`0 ≤ x ≤ 6π` is three laps, so 3 × 2 = 6 asymptotes: π/2, 3π/2, 5π/2, 7π/2, 9π/2 and 11π/2."]},{"id":"td7","goal":[6,4],"kind":"count","prompt":"How many solutions does `csc x = 4` have on `0 ≤ x ≤ 6π`?","lab":"Number of solutions:","_a":"aAVq","wrong":[{"v":[0],"fb":"4 is outside the range of `sin x`, but not of `csc x`: `csc x = 4` means `sin x = 1/4`."},{"v":[3],"fb":"`sin x = 1/4` happens twice per lap, once in quadrant 1 and once in quadrant 2."},{"v":[12],"fb":"That counts `csc x = -4` as well."}],"hints":["Rewrite `csc x = 4` using `sin x`.","`csc x = 4` means `sin x = 1/4`. How many times per lap does `sin x` equal 1/4?","Twice per lap (once in quadrant 1, once in quadrant 2). `0 ≤ x ≤ 6π` is three laps: 3 × 2 = 6 solutions."]},{"id":"td8","goal":[6,3],"kind":"count","star":true,"prompt":"How many solutions does `tan x = 5` have on `-2π ≤ x ≤ 2π`?","lab":"Number of solutions:","_a":"aAdq","wrong":[{"v":[2],"fb":"`tan x` repeats every π, not every 2π: each piece of the graph reaches 5 once."},{"v":[5],"fb":"Five pieces of the graph touch this interval, but the piece at the right edge, `3π/2 \u003c x ≤ 2π`, only climbs from −∞ to 0, so it never reaches 5."}],"hints":["How many times does one whole piece of `y = tan x` reach the value 5?","Each whole piece rises from −∞ to +∞, so it crosses `y = 5` exactly once. Count the whole pieces inside `-2π ≤ x ≤ 2π`, then look closely at the two pieces cut off by the edges.","Whole pieces: (−3π/2, −π/2), (−π/2, π/2) and (π/2, 3π/2): 3 solutions. Left edge, `-2π ≤ x \u003c -3π/2`: `tan x` starts at `tan(-2π) = 0`, below 5, and climbs to +∞, so it passes 5 once: 1 more. Right edge, `3π/2 \u003c x ≤ 2π`: `tan x` climbs from −∞ only up to 0, so it never reaches 5. Total: 4."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Arjun","how":"","instruction":"Arjun made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the vertical asymptotes and the period of `y = tan x`.","steps":["`tan x = sin x/cos x`.","A fraction is undefined where its numerator is 0, so `tan x` is undefined where `sin x = 0`.","`sin x = 0` at `x = 0`, π, 2π, …, so the asymptotes are `x = nπ`.","The asymptotes are π apart, so the period is π."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 solves `sin x = 0` correctly. The mistake is in why step 2 chose `sin x`.","The period π happens to be right, but it rests on step 3’s asymptotes. The mistake is earlier."],"fixes":[{"t":"A fraction is undefined where its numerator or its denominator is 0, so the asymptotes are `x = nπ/2`.","why":"A 0 on top is fine: `0/(-1) = 0`. Only a 0 on the bottom makes a fraction undefined.","_n":"1kb3e","_k":"e846a682"},{"t":"A fraction is undefined where its \u003cstrong>denominator\u003c/strong> is 0, so `tan x` is undefined where `cos x = 0`: the asymptotes are `x = π/2 + nπ`.","why":"At π/2, `tan x = 1/0`: undefined. At π, `tan x = 0/(-1) = 0`: a zero, not an asymptote.","_n":"1lbae","_k":"42c4160c"},{"t":"`tan x` is undefined where `sin x = cos x`, at `x = π/4 + nπ`.","why":"There `tan x = 1`. Undefined means dividing by 0.","_n":"1mb9e","_k":"b0f89116"},{"t":"Step 2 is correct as written.","why":"Try `x = π`: `sin π = 0` and `cos π = -1`, so `tan π = 0/(-1) = 0`, which is defined. The graph crosses the `x`-axis there.","_n":"1nb8e","_k":"913be5f4"}],"hints":["When is a fraction undefined?","Only when its denominator is 0. Which part of `sin x/cos x` is the denominator?","Step 2 is wrong: `tan x` is undefined where `cos x = 0`, so the asymptotes are `x = π/2 + nπ`. The zeros are at `x = nπ`."]},{"id":"e2","goal":4,"task":"Describe the graph of `y = csc x` on `0 \u003c x \u003c π`.","steps":["`csc x = 1/sin x`.","On `0 \u003c x \u003c π`, `sin x` is positive, so `csc x` is positive too.","`sin x` has a maximum of 1 at `x = π/2`, so `csc x` also has a maximum there, at (π/2, 1).","So on `0 \u003c x \u003c π`, `csc x` is never more than 1."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: reciprocals keep the sign. Keep checking.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"`sin x` is largest at π/2, so its reciprocal is smallest there: `csc x` has a local \u003cstrong>minimum\u003c/strong> at (π/2, 1), and `csc x ≥ 1` on `0 \u003c x \u003c π`.","why":"Check π/6: `sin(π/6) = 1/2`, so `csc(π/6) = 2`, which is more than 1.","_n":"1ob9e","_k":"3132111b"},{"t":"`csc x` has no turning point on `0 \u003c x \u003c π`, because it has asymptotes at both ends.","why":"Asymptotes at both ends don’t rule out a turning point between them: the piece comes down from +∞, turns at (π/2, 1), and goes back up.","_n":"1pb6e","_k":"c0c99424"},{"t":"Step 3 is correct as written.","why":"Check `x = π/6`: `csc(π/6) = 2`, which is more than 1, so (π/2, 1) can’t be the highest point.","_n":"1qb7e","_k":"fc2fc988"},{"t":"`csc x` has a maximum at (π/2, −1).","why":"Reciprocals keep the sign. On `0 \u003c x \u003c π` the piece is above the axis.","_n":"1rb4e","_k":"ff743384"}],"hints":["Test one more point: what is `csc(π/6)`?","`csc(π/6) = 1 ÷ 1/2 = 2`, which is bigger than `csc(π/2) = 1`.","Step 3 is wrong. Where `sin x` is largest, `csc x` is smallest: a local minimum at (π/2, 1)."]},{"id":"e3","goal":2,"task":"State the amplitude and the range of `y = cos x`.","steps":["The maximum value of `cos x` is 1 (for example, at `x = 0`).","The minimum value of `cos x` is −1 (for example, at `x = π`).","The amplitude is the maximum minus the minimum: 1 − (−1) = 2.","So the graph reaches 2 above and 2 below its axis, and the range is `{y ∈ ℝ | -2 ≤ y ≤ 2}`."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking.","","Step 4 uses step 3’s amplitude. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"If the amplitude were 2, the graph would reach `y = 2`. But `cos x` is never more than 1.","_n":"1sb5e","_k":"f68bd130"},{"t":"The amplitude is the maximum plus the minimum: 1 + (−1) = 0.","why":"Adding the maximum and minimum (then halving) finds the axis, `y = 0`, not the amplitude. The graph clearly rises above its axis.","_n":"1tb2e","_k":"d8537e44"},{"t":"The amplitude is 2, but the range is `{y ∈ ℝ | -1 ≤ y ≤ 1}`.","why":"The range is right now, but 2 is still the full drop from peak to trough. The graph rises only 1 above its axis.","_n":"1ub3e","_k":"02acaa40"},{"t":"The amplitude is \u003cstrong>half\u003c/strong> of that: `(1 - (-1))/2 = 1`, and the range is `{y ∈ ℝ | -1 ≤ y ≤ 1}`.","why":"Amplitude is the distance from the axis, `y = 0`, up to a peak.","_n":"1vc0e","_k":"44fe88f4"}],"hints":["How far above its middle line does the graph of `y = cos x` rise?","Its middle line is `y = 0`, halfway between 1 and −1, and its highest point is `y = 1`.","Step 3 is wrong: amplitude = (max − min)/2 = 1. The range is `{y ∈ ℝ | -1 ≤ y ≤ 1}`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you watched `P` unwrap the circle into graphs, or when `tan x` jumped at π/2?"},{"id":"j2","q":"In your own words, why does `y = tan x` have a vertical asymptote at `x = π/2`, and why does it repeat every π instead of every 2π?"},{"id":"j3","q":"Explain to a friend, step by step, how to sketch `y = sec x` from the graph of `y = cos x`."},{"id":"j4","q":"Which of the six graphs do you still find hardest to sketch or describe? What will you do to fix that?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"On `0 ≤ x ≤ 2π`, where does the graph of `y = sin x` reach its minimum?","options":[{"t":"`x = π/2`","why":"That’s the top of the circle: `sin(π/2) = 1`, the maximum.","_n":"1wc1e","_k":"9ee10eff"},{"t":"`x = π`","why":"At `x = π`, `P = (-1, 0)`: its height is 0. π is where `cos x` has its minimum.","_n":"1xbee","_k":"4ae8050f"},{"t":"`x = 2π`","why":"At 2π, `P` is back at (1, 0), so `sin 2π = 0`. The lowest point comes earlier.","_n":"1ybde","_k":"6d873353"},{"t":"`x = 3π/2`","why":"`sin x` is `P`’s height, and `P` is lowest at the bottom of the circle, three quarters of a lap round: `sin(3π/2) = -1`.","_n":"1zc0e","_k":"f7f14408"}]},"b":{"prompt":"On `0 ≤ x ≤ 2π`, where does the graph of `y = cos x` reach its minimum?","options":[{"t":"`x = 3π/2`","why":"That’s where `sin x` has its minimum. At 3π/2, `P = (0, -1)`, so `cos(3π/2) = 0`.","_n":"20bfe","_k":"60986889"},{"t":"`x = π/2`","why":"`cos(π/2) = 0`: that’s a zero of `cos x`, not its minimum.","_n":"21c2e","_k":"db67b943"},{"t":"`x = 0`","why":"`cos 0 = 1`: that’s the maximum.","_n":"22c1e","_k":"d0b7b0cf"},{"t":"`x = π`","why":"`cos x` is `P`’s run, most negative on the far left of the circle: `cos π = -1`.","_n":"23c4e","_k":"e15cd750"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"The graph of `y = tan x` passes through `(π/6, √3/3)`. Which of these points is also on the graph?","options":[{"t":"`(-π/6, √3/3)`","why":"That treats `tan x` like `cos x`, whose graph is symmetric about the `y`-axis. But `tan(-π/6) = -√3/3`.","_n":"24c3e","_k":"4ecdd82f"},{"t":"`(5π/6, √3/3)`","why":"That mirrors the graph in `x = π/2`, the way the sine graph is symmetric. But `tan(5π/6) = -√3/3`: tan is negative in quadrant 2.","_n":"25b6e","_k":"315268f4"},{"t":"`(7π/6, √3/3)`","why":"`tan x` has period π. Half a lap later the arm lies on the same line, so `tan(7π/6) = tan(π/6) = √3/3`.","_n":"26b5e","_k":"e5997513"},{"t":"`(2π/3, √3/3)`","why":"That uses a period of π/2. `tan(2π/3) = -√3`.","_n":"27350","_k":"e9b77a81"}]},"b":{"prompt":"The graph of `y = tan x` passes through `(π/3, √3)`. Which of these points is also on the graph?","options":[{"t":"`(4π/3, √3)`","why":"`tan x` has period π: `tan(4π/3) = tan(π/3) = √3`.","_n":"28360","_k":"52bd7e06"},{"t":"`(-π/3, √3)`","why":"`tan(-π/3) = -√3`. The tangent graph isn’t symmetric about the `y`-axis.","_n":"29370","_k":"1c904d49"},{"t":"`(2π/3, √3)`","why":"That mirrors the graph in `x = π/2`. But `tan(2π/3) = -√3`.","_n":"2a380","_k":"ae41067e"},{"t":"`(5π/6, √3)`","why":"That uses a period of π/2. `tan(5π/6) = -√3/3`.","_n":"2b310","_k":"ff9643c8"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What is the domain of `y = csc x`?","options":[{"t":"`{x ∈ ℝ}`","why":"`sin x = 0` at 0, π, 2π, …, and `1/0` has no value, so those `x`-values must be left out.","_n":"2c320","_k":"201bd992"},{"t":"`{x ∈ ℝ | x ≠ π/2 + nπ, n ∈ ℤ}`","why":"Those are the zeros of `cos x`, so this is the domain of `sec x`. csc pairs with sin.","_n":"2d330","_k":"caaf9fc8"},{"t":"`{x ∈ ℝ | x ≤ -1 or x ≥ 1}`","why":"That’s the set of values `csc x` takes, its range, written with `x`. The domain lists the allowed inputs.","_n":"2e340","_k":"82f5b8de"},{"t":"`{x ∈ ℝ | x ≠ nπ, n ∈ ℤ}`","why":"`csc x = 1/sin x` is undefined exactly where `sin x = 0`, at every multiple of π.","_n":"2f3d0","_k":"812c7066"}]},"b":{"prompt":"What is the domain of `y = sec x`?","options":[{"t":"`{x ∈ ℝ}`","why":"`cos x = 0` at π/2, 3π/2, …, and `1/0` has no value, so those `x`-values must be left out.","_n":"2g3e0","_k":"a8857be1"},{"t":"`{x ∈ ℝ | x ≤ -1 or x ≥ 1}`","why":"That’s the range of `sec x`, written with `x`. The domain lists the allowed inputs.","_n":"2h3b0","_k":"165cbb1d"},{"t":"`{x ∈ ℝ | x ≠ π/2 + nπ, n ∈ ℤ}`","why":"`sec x = 1/cos x` is undefined exactly where `cos x = 0`, at `π/2 + nπ`.","_n":"2i3a0","_k":"6bc5a7dc"},{"t":"`{x ∈ ℝ | x ≠ nπ, n ∈ ℤ}`","why":"Those are the zeros of `sin x`, so this is the domain of `csc x`. sec pairs with cos.","_n":"2j390","_k":"f1e4beb8"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Between `x = π` and `x = 2π`, the graph of `y = csc x` has exactly one turning point. What is it?","options":[{"t":"(3π/2, −1), a local minimum","why":"`sin x` has a minimum there, but reciprocals swap them: `csc x = -2` when `sin x = -1/2`, which is lower than −1.","_n":"2k380","_k":"ce9f90f0"},{"t":"(3π/2, −1), a local maximum","why":"On (π, 2π), `sin x` is negative and reaches its lowest value, −1, at 3π/2. Elsewhere on the piece `sin x` is between −1 and 0, so `csc x` is below −1 (`sin x = -1/2` gives −2). So −1 is the \u003cstrong>highest\u003c/strong> value: a local maximum.","_n":"2l370","_k":"7b395b67"},{"t":"(3π/2, 1), a local minimum","why":"`csc x` has the same sign as `sin x`, which is negative on (π, 2π). The whole piece is below the `x`-axis.","_n":"2m360","_k":"9435a004"},{"t":"(π/2, 1), a local minimum","why":"That’s the turning point of the other piece, `0 \u003c x \u003c π`.","_n":"2n350","_k":"ce265930"}]},"b":{"prompt":"Between `x = π/2` and `x = 3π/2`, the graph of `y = sec x` has exactly one turning point. What is it?","options":[{"t":"(π, 1), a local minimum","why":"`sec x` has the same sign as `cos x`, which is negative on (π/2, 3π/2).","_n":"2o340","_k":"924d63b8"},{"t":"(π, −1), a local maximum","why":"On (π/2, 3π/2), `cos x` is negative, lowest (−1) at π. Elsewhere on the piece `cos x` is between −1 and 0, so `sec x` is below −1. So −1 is the highest value: a local maximum.","_n":"2p430","_k":"d0191b02"},{"t":"(0, 1), a local minimum","why":"That’s the turning point of the piece `-π/2 \u003c x \u003c π/2`.","_n":"2q420","_k":"b5cca085"},{"t":"(π, −1), a local minimum","why":"`cos x` has a minimum there, but reciprocals swap them: `sec x = -2` when `cos x = -1/2`.","_n":"2r83a","_k":"b2ba4b00"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"On which interval are `y = tan x` and `y = sec x` both negative?","options":[{"t":"`3π/2 \u003c x \u003c 2π`","why":"`tan x` is negative here, but `sec x = 1/cos x` is positive, since `cos x` is positive in quadrant 4.","_n":"2s82a","_k":"6b10fe38"},{"t":"`π/2 \u003c x \u003c π`","why":"`tan x` is negative in quadrants 2 and 4. `sec x` has the sign of `cos x`, negative in quadrants 2 and 3. Only quadrant 2 is in both.","_n":"2t85a","_k":"2f488b33"},{"t":"`π \u003c x \u003c 3π/2`","why":"`sec x` is negative here, but `tan x = sin x/cos x` is positive: both `sin x` and `cos x` are negative.","_n":"2u84a","_k":"1aca58c8"},{"t":"`0 \u003c x \u003c π/2`","why":"Both are positive here: every ratio is positive in quadrant 1.","_n":"2v7fa","_k":"52f7c04c"}]},"b":{"prompt":"On which interval are `y = cot x` and `y = csc x` both negative?","options":[{"t":"`3π/2 \u003c x \u003c 2π`","why":"`cot x` is negative in quadrants 2 and 4. `csc x` has the sign of `sin x`, negative in quadrants 3 and 4. Only quadrant 4 is in both.","_n":"2w7ea","_k":"b57a87ad"},{"t":"`π/2 \u003c x \u003c π`","why":"`cot x` is negative here, but `csc x = 1/sin x` is positive, since `sin x` is positive in quadrant 2.","_n":"2x81a","_k":"c54ee9d8"},{"t":"`π \u003c x \u003c 3π/2`","why":"`csc x` is negative here, but `cot x = cos x/sin x` is positive: both are negative.","_n":"2y80a","_k":"a2e87910"},{"t":"`0 \u003c x \u003c π/2`","why":"Both are positive here: every ratio is positive in quadrant 1.","_n":"2z7ba","_k":"3105b164"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"How many solutions does `sec x = 3` have on `0 ≤ x ≤ 4π`?","options":[{"t":"0","why":"3 is outside the range of `cos x`, but not of `sec x`: `sec x` takes every value of 1 or more. `sec x = 3` where `cos x = 1/3`.","_n":"307aa","_k":"d80d8dfe"},{"t":"2","why":"That’s one lap. `0 ≤ x ≤ 4π` is two full laps.","_n":"317da","_k":"34c795fa"},{"t":"4","why":"`sec x = 3` means `cos x = 1/3`. In each lap the cosine graph crosses the line `y = 1/3` twice (in quadrants 1 and 4). Two laps give 4 solutions.","_n":"327ea","_k":"1e80e82b"},{"t":"8","why":"That also counts `sec x = -3`. Only `cos x = 1/3` gives `sec x = 3`, twice per lap.","_n":"337ba","_k":"cbcef2aa"}]},"b":{"prompt":"How many solutions does `csc x = -2` have on `0 ≤ x ≤ 4π`?","options":[{"t":"0","why":"−2 is outside the range of `sin x`, but not of `csc x`. `csc x = -2` where `sin x = -1/2`.","_n":"347ca","_k":"a18a8aec"},{"t":"2","why":"That’s one lap. `0 ≤ x ≤ 4π` is two full laps.","_n":"3581a","_k":"25dac29e"},{"t":"4","why":"`csc x = -2` means `sin x = -1/2`, which happens twice per lap (7π/6 and 11π/6 in the first). Two laps give 4.","_n":"3682a","_k":"a1800649"},{"t":"8","why":"That also counts `csc x = 2`. Only `sin x = -1/2` gives `csc x = -2`.","_n":"377fa","_k":"a6309fd2"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why the graph of `y = sin x` repeats every 2π?","options":[{"t":"“Because `sin 2π = 0 = sin 0`.”","why":"One matching value doesn’t make a period: `sin π = 0` too, but `sin(π/2) = 1` while `sin(3π/2) = -1`, so π isn’t a period.","_n":"3880a","_k":"d06d0472"},{"t":"“On the unit circle, `x` is the distance `P` has travelled. The circumference is 2π, so after travelling another 2π, `P` is back at the same point, with the same height.”","why":"This explains why \u003cstrong>every\u003c/strong> value repeats, using what `sin x` means.","_n":"3975a","_k":"75b5a95c"},{"t":"“Because the graph reaches its maximum at π/2, and 2π is four times π/2.”","why":"That’s a pattern in the numbers, not a reason the heights must repeat.","_n":"3a76a","_k":"aa0ad334"},{"t":"“Because 2π radians is 360°, and every trig function has period 360°.”","why":"Not every trig function: `tan x` has period π (180°). And changing 2π to 360° only renames the number; it doesn’t explain why the heights repeat. The reason is what happens to `P`.","_n":"3b77a","_k":"e10fe83e"}]},"b":{"prompt":"Which is the best explanation of why the graph of `y = cos x` repeats every 2π?","options":[{"t":"“On the unit circle, `x` is the distance `P` has travelled. The circumference is 2π, so after travelling another 2π, `P` is back at the same point, with the same run.”","why":"This explains why every value repeats, using what `cos x` means.","_n":"3c76a","_k":"8fa64a99"},{"t":"“Because 2π radians is 360°, and every trig function has period 360°.”","why":"Not every trig function: `tan x` has period π (180°). And changing 2π to 360° only renames the number; it doesn’t explain why the runs repeat. The reason is what happens to `P`.","_n":"3d75a","_k":"7a854a8e"},{"t":"“Because `cos 2π = 1 = cos 0`.”","why":"One matching value doesn’t make a period: `cos(π/3) = cos(5π/3) = 1/2`, but `cos x` doesn’t repeat every 4π/3 (`cos 0 = 1`, `cos(4π/3) = -1/2`).","_n":"3e74a","_k":"9b5648e6"},{"t":"“Because the graph reaches its minimum at π, and 2π is twice π.”","why":"That’s a pattern in the numbers, not a reason the run must repeat.","_n":"3f73a","_k":"07de0a96"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why `y = csc x` has a vertical asymptote at `x = π`?","options":[{"t":"“`csc π = 1/0 = 0`, so the graph touches the `x`-axis there.”","why":"`1/0` isn’t 0: it has no value. An asymptote is a line the graph approaches, not a point on the axis.","_n":"3g72a","_k":"63b7326e"},{"t":"“The graph of `y = sin x` has a vertical asymptote at `x = π`, and its reciprocal keeps it.”","why":"`y = sin x` has no asymptotes: it’s defined for every `x`. The asymptote comes from `sin π = 0`.","_n":"3h71a","_k":"03f9d376"},{"t":"“`csc x = sin^{-1} x`, and `sin^{-1} π` doesn’t exist.”","why":"`sin^{-1}` means the inverse function. `csc x` is the reciprocal, `1/sin x`.","_n":"3i70a","_k":"473909ce"},{"t":"“`csc x = 1/sin x`, and `sin π = 0`. Close to `x = π`, `sin x` is very close to 0, so its reciprocal is very large in size; at π itself, `csc x` is undefined.”","why":"This links the asymptote to dividing by a number close to 0.","_n":"3j7fa","_k":"8f59d720"}]},"b":{"prompt":"Which is the best explanation of why `y = sec x` has a vertical asymptote at `x = π/2`?","options":[{"t":"“`sec x = cos^{-1} x`, and `cos^{-1}(π/2)` doesn’t exist.”","why":"`cos^{-1}` means the inverse function. `sec x` is the reciprocal, `1/cos x`.","_n":"3k7ea","_k":"01e52235"},{"t":"“The graph of `y = cos x` has a vertical asymptote at `x = π/2`, and its reciprocal keeps it.”","why":"`y = cos x` has no asymptotes. The asymptote comes from `cos(π/2) = 0`.","_n":"3l71a","_k":"95856f0a"},{"t":"“`sec(π/2) = 1/0 = 0`, so the graph touches the `x`-axis there.”","why":"`1/0` isn’t 0: it has no value.","_n":"3m72a","_k":"07a7543c"},{"t":"“`sec x = 1/cos x`, and `cos(π/2) = 0`. Close to `x = π/2`, `cos x` is very close to 0, so its reciprocal is very large in size; at π/2 itself, `sec x` is undefined.”","why":"This links the asymptote to dividing by a number close to 0.","_n":"3n73a","_k":"95cf6d01"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A security light `L` is 1 m from a long, straight wall; `N` is the point on the wall nearest the light. The light turns so that its beam makes an angle `x` with the segment `LN`. It turns from `x = π/6` to `x = π/3`. How far does the spot of light move along the wall?\u003ccanvas class=\"plot fig-sm\" data-fig=\"a1\" role=\"img\" aria-label=\"Diagram: a light L is 1 metre from a straight wall. N is the point on the wall nearest the light, so LN is 1 metre. The beam leaves L at angle x to LN and lights a spot on the wall. No lengths along the wall are marked.\">\u003c/canvas>","options":[{"t":"`(√3 - 1)/2` m","why":"That’s `sin(π/3) - sin(π/6)`. The beam, `LN` and the wall make a right triangle with adjacent side 1, so the spot is 1 × `tan x` = `tan x` from `N`: the wall plays the part of the tangent line `x = 1`.","_n":"3o74a","_k":"12720184"},{"t":"`√3` m","why":"That’s where the spot ends up, `tan(π/3)`. It started at `tan(π/6) = √3/3`, so subtract.","_n":"3p6da","_k":"86e927ac"},{"t":"`2√3/3` m","why":"In the right triangle with adjacent side `LN` = 1, the spot is `tan x` from `N`, just as `T` is `tan x` up the tangent line. `tan(π/3) - tan(π/6) = √3 - √3/3 = 2√3/3 ≈ 1.15` m.","_n":"3q6ea","_k":"03046c33"},{"t":"π/6 m","why":"That’s the angle the light turned through, π/3 − π/6. The spot moves along a straight wall, not around a circle.","_n":"3r6fa","_k":"9613908c"}]},"b":{"prompt":"A security light `L` is 1 m from a long, straight wall; `N` is the point on the wall nearest the light. The light turns so that its beam makes an angle `x` with the segment `LN`. It turns from `x = π/4` to `x = π/3`. How far does the spot of light move along the wall?\u003ccanvas class=\"plot fig-sm\" data-fig=\"a1\" role=\"img\" aria-label=\"Diagram: a light L is 1 metre from a straight wall. N is the point on the wall nearest the light, so LN is 1 metre. The beam leaves L at angle x to LN and lights a spot on the wall. No lengths along the wall are marked.\">\u003c/canvas>","options":[{"t":"`√3` m","why":"That’s where the spot ends up. It started at `tan(π/4) = 1`, so subtract.","_n":"3s70a","_k":"775836f4"},{"t":"π/12 m","why":"That’s the angle the light turned through, π/3 − π/4.","_n":"3t79a","_k":"40fd2f8a"},{"t":"`√3 - 1` m","why":"With adjacent side `LN` = 1, the spot is `tan x` from `N`. `tan(π/3) - tan(π/4) = √3 - 1 ≈ 0.73` m.","_n":"3u7aa","_k":"29e105c4"},{"t":"`(√3 - √2)/2` m","why":"That’s `sin(π/3) - sin(π/4)`. The beam, `LN` and the wall make a right triangle with adjacent side 1, so the spot is `tan x` from `N`.","_n":"3veb9","_k":"acb840a9"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Use the reciprocal ideas on a new function, `y = 1/(2 + sin x)`. What is its largest value, and where on `0 ≤ x ≤ 2π` does it occur?","options":[{"t":"1, at `x = π/2`","why":"At π/2 the denominator is 2 + 1 = 3, so `y = 1/3` there, not 1.","_n":"3wea9","_k":"1822998b"},{"t":"There is no largest value, because the graph has vertical asymptotes.","why":"Asymptotes come from zeros of the denominator, and `2 + sin x` is never 0: it’s always at least 1.","_n":"3xed9","_k":"c71fa0ed"},{"t":"1, at `x = 3π/2`","why":"`2 + sin x` is between 1 and 3 and is never 0, so there are no asymptotes. Its reciprocal is largest where `2 + sin x` is smallest: 2 + (−1) = 1 at `x = 3π/2`, giving 1/1 = 1.","_n":"3yec9","_k":"203f3528"},{"t":"1/3, at `x = π/2`","why":"At π/2, `2 + sin x` is largest (3), so its reciprocal is \u003cstrong>smallest\u003c/strong> there: 1/3 is the minimum.","_n":"3zef9","_k":"ddc2e461"}]},"b":{"prompt":"Use the reciprocal ideas on a new function, `y = 1/(3 - cos x)`. What is its smallest value, and where on `0 ≤ x ≤ 2π` does it occur?","options":[{"t":"1/4, at `x = 0`","why":"At 0 the denominator is 3 − 1 = 2, so `y = 1/2` there, not 1/4.","_n":"40ee9","_k":"7943023d"},{"t":"1/4, at `x = π`","why":"`3 - cos x` is between 2 and 4 and is never 0. Its reciprocal is smallest where `3 - cos x` is largest: 3 − (−1) = 4 at `x = π`, giving 1/4.","_n":"41f19","_k":"9abe6b6e"},{"t":"There is no smallest value, because the graph has vertical asymptotes.","why":"`3 - cos x` is never 0 (it’s at least 2), so there are no asymptotes.","_n":"42f09","_k":"480deed3"},{"t":"1/2, at `x = 0`","why":"At 0, `3 - cos x` is smallest (2), so its reciprocal is \u003cstrong>largest\u003c/strong> there: 1/2 is the maximum.","_n":"43f39","_k":"d2316261"}]}}]},"task":{"title":"Rising below the axis","summary":"Rising below the axis","statement":"\u003cp>Choose one of the six functions and an interval `a \u003c x \u003c b`, with `0 ≤ a \u003c b ≤ 2π`, at least π/2 long, on which the function is defined everywhere, \u003cstrong>increasing\u003c/strong> and \u003cstrong>negative\u003c/strong>. There are six different answers. Can you find them all?\u003c/p>","checks":["The interval is at least π/2 long","No vertical asymptote inside the interval","Increasing on the whole interval","Negative on the whole interval"],"tips":["Make the interval longer: at least π/2, a whole quadrant.","{f} has a vertical asymptote at `x = ` {v}, inside your interval. Move `a` or `b` so the asymptote is at an end or outside.","{f} isn’t increasing on all of your interval: it falls on {part}. For csc and sec, remember that the reciprocal rises where its partner falls.","{f} isn’t negative on all of your interval: it’s {sign} on {part}. Check the signs quadrant by quadrant."],"tipJump":"{f} rises on each piece, but at `x = ` {v} it jumps from +∞ down to −∞, so it isn’t increasing across the whole interval. Fix line 2 first.","chooseB":"Choose `b > a`","explainPrompt":"Pick one of your answers. Explain why the function is increasing and negative there, using the unit circle or the function’s partner.","vocab":"Use the words quadrant, increasing, reciprocal and asymptote.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","allSix":"You found all six. Every answer is exactly one quadrant. Notice that `cot x` never works: between its asymptotes it always falls. And `csc x` and `sec x` rise exactly where `sin x` and `cos x` fall."},"cards":[["`y = sin x`","`P`’s height on the unit circle. Period 2π, amplitude 1, range `[-1, 1]`, zeros `x = nπ`. In each lap: maximum (π/2, 1), minimum (3π/2, −1)."],["`y = cos x`","`P`’s run (its `x`-coordinate). Period 2π, amplitude 1, range `[-1, 1]`, zeros `x = π/2 + nπ`. In each lap: maximum (0, 1), minimum (π, −1)."],["Why the graphs use radians","On the unit circle, the angle in radians is the distance `P` has travelled. One lap is 2π, so `sin x` and `cos x` repeat every 2π along the `x`-axis."],["Period","The length of the shortest stretch that repeats: `f(x + p) = f(x)` for \u003cstrong>every\u003c/strong> `x`. One matching value isn’t enough: `sin π = sin 0`, but π is not a period of `sin x`."],["Amplitude","Half the distance from the maximum to the minimum: `(1 - (-1))/2 = 1` for `sin x` and `cos x`. `tan x` has no amplitude: it has no maximum or minimum."],["`y = tan x`","`sin x/cos x`. Period π; range `(-∞, ∞)`; zeros `x = nπ`; vertical asymptotes `x = π/2 + nπ`, where `cos x = 0`. Rises on every piece."],["`tan x` on the unit circle","Extend `P`’s arm to meet the tangent line `x = 1`: the meeting point is `(1, tan x)`. Half a lap later the arm lies on the same line, so `tan x` repeats every π."],["`y = csc x`","`1/sin x`. Asymptotes `x = nπ`; no zeros; range `(-∞, -1] ∪ [1, ∞)`; period 2π. In each lap: local minimum (π/2, 1), local maximum (3π/2, −1)."],["`y = sec x`","`1/cos x`. Asymptotes `x = π/2 + nπ`; no zeros; range `(-∞, -1] ∪ [1, ∞)`; period 2π. In each lap: local minimum (0, 1), local maximum (π, −1)."],["`y = cot x`","`cos x/sin x`. Period π; range `(-∞, ∞)`; zeros `x = π/2 + nπ`; asymptotes `x = nπ`. Falls on every piece."],["Building `y = 1/f(x)`","Zeros of `f` → vertical asymptotes. Height ±1 → stays put. Same sign; big ↔ small, so a maximum becomes a local minimum and rising becomes falling. Same period."],["`csc x` vs `sin^{-1} x`","`csc x = 1/sin x = 1/f(x)`, the reciprocal: same `x`, height flipped (`sin x = 1/2` → `csc x = 2`). `sin^{-1} x` and `f^{-1}(x)` mean the inverse function, which swaps `x` and `y`."]]}};</script>
