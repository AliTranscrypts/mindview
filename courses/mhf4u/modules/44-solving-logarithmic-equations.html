.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 44: hero, Domain gate (graph + argument lanes, move chooser, Build sliders), Root audit, solution-set entry, task */
.hero .hero-eq .m{white-space:normal}
.hero .hero-eq.md{font-size:clamp(1.5rem,4vw,2.6rem)}
#hero-cap .m,.lg .m,.ra .m,.ss-q .m,.fb .m,.hints .m,.pred-q .m,.chal .q-prompt .m,.sq-p .m,.refresh .m,.face .m,.sbtn .m,.task .m,.read dd .m,.lg-alg .m,.sa-eq .m{white-space:normal}
canvas.lg-lanes{display:block;width:100%;height:110px;margin-top:4px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lg-pic .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.lg-hero{max-width:560px}
/* radio groups (copied from MHF4U 39) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:36px;min-width:44px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button[aria-checked="true"] .p-b{color:inherit}
.rg button:disabled{opacity:.6}
.lg-bch .p-b{font-weight:700}
.lg-lockic{font-size:.9rem}
/* Domain gate layout */
.lg-modes{margin-bottom:10px}
.lg-sbar,.lg-bbar{display:grid;gap:8px;margin-bottom:12px}
.lg-sbar[hidden],.lg-bbar[hidden],.lg-solve[hidden],.lg-build[hidden],.lg-hist[hidden]{display:none}
.lg-eqs .rg.chips button{font:400 1.02rem var(--font-math)}
.lg-tag{font:700 .78rem var(--font-ui);color:var(--ink-2);margin-right:2px}
.lg-eqs button[aria-checked="true"] .lg-tag{color:var(--hi-ink)}
.lg-note{margin:0}
.lg-main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.lg-main > *{min-width:0}
.lg-hist{list-style:none;margin:0 0 2px;padding:0 0 0 10px;border-left:3px solid var(--rule)}
.lg-l{font:400 1rem/1.45 var(--font-math);color:var(--ink-2);overflow-wrap:anywhere}
.lg-cap{font-size:clamp(1.2rem,2.8vw,1.6rem);line-height:1.3;min-height:1.4em}
.lg-stop{margin:0 0 4px;font-weight:700;min-height:1.2em}
.lg-stop:empty{display:none}
.lg-shows{margin:8px 0 0}
.lg-h{font-weight:700;margin:0 0 6px}
.lg-moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lg-mv{text-align:left;min-height:44px;font-size:.9rem;padding:.4em .7em;line-height:1.25}
.lg-pbox{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.lg-q{margin:0 0 8px;font-weight:700}
.lg-chips{display:flex;flex-wrap:wrap;gap:6px}
.lg-chip{font:400 1.02rem var(--font-math);min-height:36px}
.lg-cards{display:grid;gap:6px}
.lg-card{text-align:left}
.lg-fb{margin-top:8px}
.lg-fb:empty{display:none}
.lg-nav{margin-top:10px}
.lg-build{display:grid;gap:4px;margin-bottom:12px}
.lg-locknote{margin:4px 0 0;color:var(--ink-2)}
.lg-locknote:empty{display:none}
.lg-read{margin-top:14px}
.lg-ph{margin:16px 0 6px;font-size:.95rem}
/* sliders (stepSlider, copied from MHF4U 39) */
.lw-sl1{margin:0 0 4px}
.lw-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap}
.lw-sl-top label{font-weight:700;font-size:.95rem}
.lw-sl-top output{font:600 1.15rem var(--font-math);color:var(--sc)}
.lw-sl-row{display:flex;align-items:center;gap:6px}
.lw-pm{min-width:40px;min-height:40px;padding:0;font-size:1.2rem;line-height:1;justify-content:center}
.lw-sl1 input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:40px;background:transparent;margin:0;cursor:pointer}
.lw-sl1 input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.lw-sl1 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc);margin-top:-8px}
.lw-sl1 input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.lw-sl1 input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc)}
.lw-sl1 input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.lw-sl1 input[type=range]:disabled{opacity:.45;cursor:default}
@media (max-width:760px){
  .lg-main{grid-template-columns:minmax(0,1fr)}
}
/* Root audit */
.ra-chains{margin-bottom:8px}
.ra-sub{font-weight:400;font-size:.85em}
.ra-tally{font-weight:700;color:var(--ink-2);margin:0 0 10px}
.ra-gwrap{max-width:460px;margin:0 0 12px}
.ra-gwrap[hidden]{display:none}
.ra-gcap{margin:0 0 6px}
ol.ra-list{list-style:none;margin:0;padding:0}
.ra-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 20px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.ra-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.ra-n{font:700 .85rem var(--font-ui);color:var(--ink-2)}
.ra-eq{font:400 1.15rem var(--font-math)}
.ra-dom{flex-basis:100%;font-size:.88rem;color:var(--ink-2)}
.ra-gb{padding:.25em .6em;font-size:.82rem}
.ra-gb[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
canvas.ra-strip{display:block;width:100%;height:58px}
.ra-hide{margin:0}
.ra-step{display:flex;gap:10px;padding:6px 0 10px}
.ra-arrow{font-size:1.6rem;line-height:1;color:var(--ink-2);padding-top:2px}
.ra-sbody{flex:1;min-width:0}
.ra-sname{margin:0 0 6px}
.ra-calls{display:flex;flex-wrap:wrap;gap:6px}
.ra-calls .chip{min-height:36px}
.ra-note{margin-top:10px}
ul.lg-alg{margin:10px 0 0;padding-left:1.2em}
ul.lg-alg li{margin:0 0 6px}
@media (max-width:760px){
  .ra-line{grid-template-columns:minmax(0,1fr)}
}
/* solution-set entry */
.ss-q{font-size:1.15rem;margin:8px 0 10px}
.ss-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 6px}
.ss-x{font-size:1.15rem}
.ss-or{color:var(--ink-2);font-size:.9rem}
.ss-box{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ss-lab .m{font-size:1.1rem}
.ss-in{width:6.2rem}
.ss-unit{font-weight:400;color:var(--ink-2)}
.ss-none{min-height:36px}
/* task */
.sa-eq{font-size:clamp(1.15rem,2.6vw,1.5rem)}
.sa-base{margin:0 0 6px}

.sa-box{display:inline-flex;align-items:center;gap:4px}

.sa-box .btn{min-width:36px;min-height:36px;padding:0}

ions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"fa780c29","content":{"id":"44-solving-logarithmic-equations","kind":"topic","title":"Solving logarithmic equations","topic":"Solving Logarithmic Equations","readyTopic":"solving logarithmic equations","hero":{"eq":"`log_{@b{b}} A = m ⟺ A = @b{b}^m`","eqLabel":"log base b of A equals m, exactly when A equals b to the power m","eqSize":"md","headline":"The algebra finds candidates. The original equation decides.","text":"A \u003cstrong>logarithmic equation\u003c/strong> has the unknown inside a logarithm, as in `log_2 x + log_2(x - 2) = 3`. To solve one, combine the logs with the laws you know, then switch to \u003cstrong>exponential form\u003c/strong>: `log_b A = m` means `A = b^m`. But a logarithm only exists when its \u003cstrong>argument\u003c/strong> is positive, so the equation comes with \u003cstrong>restrictions\u003c/strong>. Combining logs can quietly widen them, and a root that sneaks in that way is an \u003cstrong>extraneous root\u003c/strong>. That’s why every candidate is checked in the original equation.","fig":{"html":"\u003cdiv class=\"lg-pic lg-hero\">\u003cdiv class=\"plot-wrap\">\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"Graph of y = log base 2 of x plus log base 2 of (x − 2) for x greater than 2 and the line y = 3, crossing at (4, 3). A ghost branch for x less than 0 crosses y = 3 at x = −2. Argument lanes under the graph: the candidate 4 passes the gate x > 2; the candidate −2 stops at the first lane.\">\u003c/canvas>\u003c/div>\u003ccanvas class=\"lg-lanes\" id=\"hero-lanes\" role=\"img\" aria-label=\"Argument lanes for x and x − 2, and the gate x > 2.\">\u003c/canvas>\u003c/div>","caption":"`log_2 x + log_2(x - 2) = 3`"},"caps":["`log_2(x(x - 2)) = 3`","Two candidates, one solution: `x = 4`"]},"goals":["I can state the restrictions on a logarithmic equation before solving: every argument must be positive, and a base that contains `x` must be positive and not 1.","I can solve equations of the form `log_b A = m` by converting to `A = b^m`, and of the form `log_b A = log_b B` by setting `A = B`.","I can use the product, quotient and power laws to rewrite an equation with several logs as one with a single log on each side, then solve it.","I can check every candidate in the original equation, reject extraneous roots, and explain which step let them in (or which step can lose a root).","I can set up and solve logarithmic equations from problems, such as sound levels in decibels, and work backwards from a known solution."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Log laws","goal":3,"prompt":"Write `log_2 x + log_2(x - 2)` as a single logarithm (for `x > 2`).","options":[{"t":"`log_2(2x - 2)`","why":"A sum of logs is the log of a \u003cstrong>product\u003c/strong>. Test `x = 4`: `log_2 4 + log_2 2 = 2 + 1 = 3`, but `log_2(2 × 4 - 2) = log_2 6`, which isn’t 3.","_n":"02a4","_k":"a28fb646"},{"t":"`log_4(x^2 - 2x)`","why":"The base stays 2. At `x = 4`, `log_4 8 = 3/2`, but the sum is 3.","_n":"1294","_k":"89b6ae6b"},{"t":"`log_2(x^2 - 2x)`","why":"Product law: `log_2 x + log_2(x - 2) = log_2(x(x - 2)) = log_2(x^2 - 2x)`.","_n":"2284","_k":"6c29c382"},{"t":"`log_2 x · log_2(x - 2)`","why":"Multiplying logs isn’t a law. At `x = 4`: `log_2 4 × log_2 2 = 2 × 1 = 2`, but the sum is 3.","_n":"32f4","_k":"44feb2b6"}],"hints":["Which law turns a sum of logs with the same base into one log?","The product law: `log_b A + log_b B = log_b(AB)`.","`log_2 x + log_2(x - 2) = log_2(x(x - 2)) = log_2(x^2 - 2x)`."]},{"id":"w2","skill":"Log laws","goal":3,"prompt":"Write `2 log_3 x - log_3 5` as a single logarithm (for `x > 0`).","options":[{"t":"`log_3({2x}/{5})`","why":"The 2 becomes an exponent, not a multiplier. Test `x = 3`: `2 log_3 3 = 2 = log_3 9`, but `log_3 6` isn’t 2.","_n":"42e4","_k":"5e4b9586"},{"t":"`log_3({x^2}/{5})`","why":"Power law first: `2 log_3 x = log_3(x^2)`. Then the quotient law: `log_3(x^2) - log_3 5 = log_3({x^2}/{5})`.","_n":"52d4","_k":"d7bcdab5"},{"t":"`2 log_3({x}/{5})`","why":"`2 log_3({x}/{5}) = 2 log_3 x - 2 log_3 5`. The 2 belongs only to the first log.","_n":"62c4","_k":"47b9a862"},{"t":"`log_3(x^2 - 5)`","why":"A difference of logs is the log of a \u003cstrong>quotient\u003c/strong>, not of a difference.","_n":"7334","_k":"233351f4"}],"hints":["Deal with the coefficient 2 first.","Power law: `2 log_3 x = log_3(x^2)`. Now you have `log_3(x^2) - log_3 5`.","Quotient law: `log_3(x^2) - log_3 5 = log_3({x^2}/{5})`."]},{"id":"w3","skill":"Exponential and logarithmic form","goal":2,"prompt":"If `log_4 N = 3`, what is `N`?","options":[{"t":"12","why":"12 is 4 × 3. A logarithm is an exponent: 4 is raised to the power 3.","_n":"8324","_k":"21b5c96e"},{"t":"`∛4`","why":"`∛4` is `4^{1/3}`. `log_4 N = 3` means 4 cubed, not the cube root of 4.","_n":"9b6d","_k":"8066efec"},{"t":"81","why":"81 is `3^4`. The base of the log, 4, is the base of the power: `4^3`.","_n":"ab7d","_k":"f859e3d5"},{"t":"64","why":"`log_4 N = 3` means `4^3 = N`, so `N = 64`.","_n":"bb4d","_k":"3c988956"}],"hints":["A logarithm is an exponent. What does `log_4 N = 3` say about 4?","It says 4 to the power 3 is `N`.","`N = 4^3 = 64`."]},{"id":"w4","skill":"Domain of logarithms","goal":1,"prompt":"For which values of `x` is `log_5(x + 3)` defined?","options":[{"t":"`x > 3`","why":"`x + 3 > 0` gives `x > -3`: subtract 3 from both sides.","_n":"cb5d","_k":"e536d50d"},{"t":"`x > -3`","why":"The argument must be positive: `x + 3 > 0`, so `x > -3`.","_n":"db2d","_k":"d5c5ead6"},{"t":"`x > 0`","why":"The argument `x + 3` must be positive, not `x`. For example, `x = -1` gives `log_5 2`, which exists.","_n":"eb3d","_k":"55e1747d"},{"t":"`x ≥ -3`","why":"At `x = -3` the argument is 0, and `log_5 0` doesn’t exist: no power of 5 is 0.","_n":"fb0d","_k":"4fd19649"}],"hints":["What must be true about the number inside a logarithm?","It must be positive: `x + 3 > 0`.","`x + 3 > 0` means `x > -3`."]},{"id":"w5","skill":"Solving equations","goal":4,"prompt":"Solve `x(x - 3) = 10`.","options":[{"t":"`x = 10` or `x = 13`","why":"Setting each factor equal to a number only works when the product is 0. Check `x = 10`: 10 × 7 = 70.","_n":"gb1d","_k":"851d1335"},{"t":"`x = 0` or `x = 3`","why":"Those solve `x(x - 3) = 0`. Here the right side is 10.","_n":"hbed","_k":"8de0fc7a"},{"t":"`x = -5` or `x = 2`","why":"`(x + 5)(x - 2) = x^2 + 3x - 10`. Check `x = 2`: 2 × (−1) = −2, not 10.","_n":"ibfd","_k":"7ed4d42c"},{"t":"`x = 5` or `x = -2`","why":"Expand and bring everything to one side: `x^2 - 3x - 10 = 0`, which factors as `(x - 5)(x + 2) = 0`.","_n":"jb0d","_k":"93508a92"}],"hints":["The zero product rule needs 0 on one side. Expand first.","`x^2 - 3x = 10` becomes `x^2 - 3x - 10 = 0`. Find two numbers that multiply to −10 and add to −3.","`(x - 5)(x + 2) = 0`, so `x = 5` or `x = -2`."]},{"id":"w6","skill":"Solving equations","goal":2,"prompt":"Solve `{x + 6}/{x} = 9`.","options":[{"t":"`x = 3/5`","why":"From `x + 6 = 9x`, subtracting `x` gives `6 = 8x`, not `10x = 6`.","_n":"kafd","_k":"4e33294f"},{"t":"`x = 3`","why":"That solves `x + 6 = 9`. Check: (3 + 6)/3 = 3, not 9.","_n":"laed","_k":"18cca793"},{"t":"`x = 4/3`","why":"`8x = 6` gives `x = 6/8`, not 8/6.","_n":"madd","_k":"cae73887"},{"t":"`x = 3/4`","why":"Multiply both sides by `x`: `x + 6 = 9x`, so `6 = 8x` and `x = 6/8 = 3/4`.","_n":"nb4d","_k":"41772e32"}],"hints":["Clear the fraction: multiply both sides by `x`.","`x + 6 = 9x`. Collect the `x` terms on one side.","`6 = 8x`, so `x = 3/4`. Check: (3/4 + 6) ÷ (3/4) = (27/4) ÷ (3/4) = 9."]}],"refreshers":{"Log laws":"For positive `A` and `B`: `log_b A + log_b B = log_b(AB)` (product law), `log_b A - log_b B = log_b(A/B)` (quotient law), and `n log_b A = log_b(A^n)` (power law). Use the power law first: `2 log_3 x - log_3 5 = log_3(x^2) - log_3 5 = log_3({x^2}/{5})`. The laws never add or subtract the arguments (modules 40–41).","Exponential and logarithmic form":"`log_b N = m` and `b^m = N` say the same thing: the log is the exponent. `log_4 N = 3` means `N = 4^3 = 64`. The base of the log is the base of the power (module 37).","Domain of logarithms":"`log_b A` exists only when `A > 0`, because `b` to any power is positive. So `log_5(x + 3)` needs `x + 3 > 0`, which is `x > -3`. It’s the argument that must be positive; `x` itself can be negative (module 38).","Solving equations":"Get 0 on one side before you factor: `x(x - 3) = 10` becomes `x^2 - 3x - 10 = 0`, then `(x - 5)(x + 2) = 0`, so `x = 5` or `x = -2`. For a fraction equal to a number, multiply both sides by the denominator: `{x + 6}/{x} = 9` gives `x + 6 = 9x`, so `x = 3/4`."}}},"explore":{"heading":"Domain gate","intro":"Solve log equations one move at a time and watch what each move does to the graph. Every log has a gate: its argument must be positive. A candidate that can’t get through the gate is extraneous. Then build your own equations and make the gate do what you want.","chalIntro":"These use Build mode. Choose the challenge under \u003cstrong>Lock values for\u003c/strong> to fix its locked values, set the other sliders, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","modes":[{"id":"solve","t":"Solve"},{"id":"build","t":"Build"}],"bankNote":"Solve at least S1 and S4. The others show something new.","moves":[{"id":"restr","t":"State the restrictions"},{"id":"combine","t":"Combine (product or quotient law)"},{"id":"power","t":"Power law: move the coefficient inside"},{"id":"convert","t":"Convert to exponential form"},{"id":"drop","t":"Drop the logs (set the arguments equal)"},{"id":"solve","t":"Solve the polynomial equation"},{"id":"check","t":"Check each candidate in the original equation"}],"moveFb":{"first":"Write the restrictions first, while every log is still in its original form. Combining can change where the equation exists.","c_convert":"Exponential form needs one log equal to a number, `log_b A = m`. Combine the logs first.","c_drop":"Drop the logs only when each side is a single log with the same base. Here one side is a number.","c_power":"There’s no coefficient in front of a log here.","inLogs":"The unknown is still inside logs. There’s nothing to solve or check yet.","p_combine":"Each side already has one log; the 2 in front has to move inside first.","p_drop":"`2 log_5 x` isn’t a single log yet. Dropping now would give `2x = 3x + 4`, which treats `2 log_5 x` as `log_5(2x)`.","p_convert":"Neither side is a number. Both sides are logs.","v_drop":"The right side is a number, not a log. Convert instead: `log_b A = m` means `A = b^m`.","v_one":"There’s only one log left, with no coefficient.","d_convert":"Both sides are logs. Set the arguments equal instead.","d_other":"Each side is already a single log with the same base.","s_logs":"There are no logs left. Solve the equation.","s_check":"Find the candidates first.","k_other":"You have the candidates. Now check each one in the original equation.","restrDone":"The restrictions are already stated. Choose the next move.","done":"This equation is solved. Choose another equation, or press Start again."},"restrictQ":"Which values of `x` can this equation have?","cardQ":"Which line comes next? Pick it.","gateQ":"Tap every candidate you expect the gate to reject, or tap None.","gateRun":"Run the check","gateNone":"None","gateRight":"Your prediction was right.","gateWrong":"The gate disagreed with your prediction. Read why below.","gateSummary":"Gate predictions right: {r}/{n}","back":"Back","again":"Start again","bank":[{"id":"S1","eq":"`log_2 x + log_2(x - 2) = 3`","shows":"The ghost branch (`x \u003c 0`) carries the extraneous root −2.","restr":"`x > 0` and `x - 2 > 0`, so `x > 2`","lines":{"comb":"`log_2(x(x - 2)) = 3`","conv":"`x(x - 2) = 8`","exp":"`x^2 - 2x - 8 = 0`","fac":"`(x - 4)(x + 2) = 0`"},"cands":"`x = 4` or `x = -2`","solution":"`x = 4` (`x = -2` is extraneous)","dom":{"orig":"`{x ∈ ℝ | x > 2}`","comb":"`{x ∈ ℝ | x \u003c 0 or x > 2}`","conv":"`{x ∈ ℝ}`","solve":"`{x ∈ ℝ}`"},"ghost":{"comb":"`x \u003c 0`","conv":"`x ≤ 2`","solve":"`x ≤ 2`"},"restrict":{"options":[{"t":"`x ≥ 2`","why":"An argument of 0 isn’t allowed either: `log_b 0` doesn’t exist.","_n":"ob3d","_k":"fc1e7f3f"},{"t":"`x \u003c 0` or `x > 2`","why":"That’s where the equation exists \u003cstrong>after\u003c/strong> combining. Restrictions come from the original equation, where each log needs its own positive argument.","_n":"pb2d","_k":"e9bc82ed"},{"t":"`x > 0`","why":"That’s where one of the logs exists. Every log in the equation needs a positive argument, so the gate is where \u003cstrong>all\u003c/strong> the lanes are solid.","_n":"qb1d","_k":"d2fd8b33"},{"t":"`x > 2`","_n":"rb8d","_k":"e9a684c2"}]},"cards":{"combine":[{"t":"`log_2(x(x - 2)) = 3`","_n":"sb7d","_k":"d536992c"},{"t":"`log_2(2x - 2) = 3`","why":"That adds the arguments. Adding logs multiplies them.","_n":"t2ad","_k":"d3a15a12"},{"t":"`log_2 x · log_2(x - 2) = 3`","why":"Logs don’t multiply. The product law makes one log of a product.","_n":"u2bd","_k":"329c95cc"}],"convert":[{"t":"`x(x - 2) = 8`","_n":"v2cd","_k":"5d2be125"},{"t":"`x(x - 2) = 9`","why":"That’s `3^2`. The base, 2, is the one raised to the power: `2^3 = 8`.","_n":"w2dd","_k":"b513fd90"},{"t":"`x(x - 2) = 6`","why":"That’s 2 × 3. The log is an exponent: `2^3 = 8`.","_n":"x2ed","_k":"13e3077a"}]}},{"id":"S2","eq":"`log_3(x + 6) - log_3 x = 2`","shows":"A ghost branch (`x \u003c -6`) that stays below 0 and never meets `y = 2`: widening doesn’t always add a root.","restr":"`x + 6 > 0` and `x > 0`, so `x > 0`","lines":{"comb":"`log_3({x + 6}/{x}) = 2`","conv":"`{x + 6}/{x} = 9`","exp":"`x + 6 = 9x`","fac":"`8x = 6`"},"cands":"`x = 3/4`","solution":"`x = 3/4`","dom":
