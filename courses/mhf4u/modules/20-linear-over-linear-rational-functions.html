.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 20: hero note, asymptote crosshair, sketch builder, match thumbnails, coefficient boxes, design task */
.hero p.hero-note{font-size:.95rem;color:var(--ink-2)}
.hero-fig figcaption .hero-sent{display:inline-block;margin-top:6px;font:400 1rem/1.4 var(--font-ui);color:var(--ink-2)}
.hero-fig figcaption .hero-sent .m{font-size:1.05em}

/* Explore */
.ax .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.ax-mode .seg-wrap{margin:0 0 10px}
.ax .eq-cap{font-size:clamp(1.25rem,3.2vw,1.9rem)}
.ax-sl{margin-top:4px}
.ax-st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:4px}
.ax-st[hidden]{display:none}
.ax-stp{display:flex;align-items:center;gap:6px}
.ax-stl{font-size:1.35rem;min-width:1.1em;text-align:center}
.ax-stp .btn{min-width:38px;min-height:38px;padding:.2em .5em;font-size:1.1rem}
.ax-in{width:4.2rem;text-align:center;padding:.35em .3em}
.ax-stnote{grid-column:1/-1;margin:0}
#ax-lens .seg-wrap{margin-top:14px}
.ax .q-actions .btn.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.ax-tbl{margin-top:10px}
.ax-tbl:empty{display:none}
.ax-tbl table.vt td,.ax-tbl table.vt th{padding:5px 12px}
.ax-tbl tr.ax-pos td{background:var(--info-bg)}
.ax-tbl tr.ax-neg td{background:var(--hi-soft)}
.ax-tnote{margin:6px 0 0}
.ax-read > div.hl{background:var(--hi-soft);border-radius:6px;padding-left:8px;padding-right:8px}
.ax-read dd .m{white-space:normal}
.ax-all{display:none}
.ax-busy .plot-wrap{cursor:progress}
@media (max-width:560px){
  .ax-read:not(.all) > div:nth-child(n+7){display:none}
  .ax-all{display:inline-block;margin-top:8px}
  .ax-st{grid-template-columns:minmax(0,1fr)}
}

/* Part 3: sketch builder */
.sk-eq{margin-bottom:12px}
.sk .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.sk-steps{margin:0 0 12px;padding-left:1.3em;display:grid;gap:12px}
.sk-steps li > p{margin:2px 0 0}
.sk-steps .q-actions{margin-top:6px}
.sk-v{font-size:1.1rem}
.sk-int{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.sk-int label{font-weight:700}
.sk-in{width:6.5rem}
.sk-corn{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:6px 8px;margin-top:6px}
.sk-cmsg{min-height:1.2em;margin:6px 0 0;font-weight:700;color:var(--red)}
.sk-cmsg:empty{display:none}
.sk-checks li.bad .mk{color:var(--red)}
.sk-why{display:block;font-size:.9rem;color:var(--ink-2);margin-top:2px}
.sk-fbl{margin:.3em 0 0;padding-left:1.2em}
.sk-fbl li{margin:.25em 0}
.sk-leg{margin:8px 0 0}
#sk-algb p{margin:10px 0 0}

/* Practice 1: match the graph */
.mg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,2fr);gap:14px 18px;margin-top:12px}
.mg h4{margin:0 0 6px;color:var(--ink-2);font-size:.85rem}
.mg-eqrow{display:grid;gap:8px}
.mg-eq .m{font-size:1.1em}
.mg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mg-th{display:grid;gap:4px;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px;min-width:0}
.mg-th:not(:disabled):hover{border-color:var(--pen)}
.mg-th.done{border-color:var(--green);background:var(--good-bg);color:var(--ink)}
.mg-tag{font-weight:700;font-size:.95rem}
.mg-c{border:0!important;border-radius:4px}
.mg-eqd{font-size:.9rem;overflow-wrap:anywhere}
.mg-eqd:empty{display:none}
.mg-eqd .pair-n,.mg-eq .pair-n{font-weight:700;color:var(--green)}
.mg-eq .pair-n:empty{display:none}
@media (max-width:820px){ .mg{grid-template-columns:minmax(0,1fr)} .mg-eqrow{display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px} .mg-eq{flex:0 0 auto;width:auto} }
@media (max-width:560px){
  .mg{margin-left:-10px;margin-right:-10px}
  .mg-grid{grid-template-columns:repeat(2,minmax(160px,1fr))}
}

/* Coefficient boxes (Practice 3 and the task) */
.bf{display:flex;align-items:center;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.bf-y{font-size:1.4rem}
.bf-frac{display:inline-flex;flex-direction:column;align-items:center}
.bf-row{display:flex;align-items:center;gap:6px;padding:4px 2px}
.bf-row .m{font-size:1.3rem}
.bf-bot{border-top:2px solid var(--ink)}
.bf-in{width:4.6rem;text-align:center;padding:.35em .3em}
.bd-cap{min-height:1.4em;margin-top:6px}
.tk-read{margin-top:10px}
@media (min-width:821px){ .sk > div:first-child{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top, 0px) + 150px)} }

trig-functions","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"9d3598d4","content":{"id":"20-linear-over-linear-rational-functions","kind":"topic","title":"Linear over linear rational functions","topic":"Linear over Linear Rational Functions","readyTopic":"linear over linear rational functions","hero":{"eq":"`y = {ax + b}/{cx + d}`","eqLabel":"y equals a x plus b, all over c x plus d","eqSize":"md","headline":"Find the crosshair, and the graph draws itself","text":"When the top and the bottom of a rational function are both linear, the graph is always the same shape: `y = 1/x`, stretched and moved. Its \u003cstrong>vertical asymptote\u003c/strong> comes from the bottom and its \u003cstrong>horizontal asymptote\u003c/strong> from the `x`-coefficients. The two dashed lines cross at a point this module calls the \u003cstrong>crosshair\u003c/strong>. For short, the module calls the vertical asymptote the \u003cstrong>wall\u003c/strong> (the graph never crosses it) and the horizontal asymptote the \u003cstrong>level line\u003c/strong> (far away, the graph levels off toward it). Find the crosshair, the \u003cstrong>intercepts\u003c/strong> and which two \u003cstrong>corners\u003c/strong> hold the branches, and you can sketch any of these graphs by hand.\u003c/p>\u003cp class=\"hero-note\">In this module `a`, `b`, `c` and `d` are just the numbers in the equation, written in plain ink. They are not the stretch and shift parameters from module 07. When the graph is written as a stretched and moved `y = 1/x`, the stretch and shifts appear in their usual colours: \u003cspan class=\"p-a\">violet\u003c/span> stretches, \u003cspan class=\"p-d\">teal\u003c/span> moves sideways, \u003cspan class=\"p-c\">magenta\u003c/span> moves up or down.","fig":{"aria":"Animation: y = 1/x is stretched by 3, then its crosshair moves 2 right and 1 up, giving y = (x + 1)/(x − 2) with asymptotes x = 2 and y = 1 and intercepts (−1, 0) and (0, −1/2)"}},"goals":["I can find the vertical and horizontal asymptotes of `y = {ax + b}/{cx + d}` from its equation, and explain where each one comes from.","I can find the intercepts, the domain and the range, and say when an intercept doesn’t exist.","I can describe the behaviour next to the vertical asymptote and far away, using arrow notation such as “as `x -> 2^{-}`, `y -> -∞`” and “`y -> 3^{+}`”.","I can see the graph as `y = 1/x` stretched and moved: I can write it in crosshair form and use the sign of the stretch to tell which two corners hold the branches and whether the graph rises or falls.","I can sketch the graph from its key features and state where it is positive, negative, increasing and decreasing.","I can work backwards from asymptotes, intercepts or points to an equation `{ax + b}/{cx + d}`."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Reciprocal functions","goal":1,"prompt":"What is the vertical asymptote of `y = {1}/{2x - 6}`?","options":[{"t":"`x = 6`","why":"At `x = 6` the bottom is `2(6) - 6 = 6`. Divide both sides of `2x = 6` by 2.","_n":"0f72","_k":"4ba01428"},{"t":"`x = -3`","why":"At `x = -3` the bottom is `2(-3) - 6 = -12`, not 0. Solve `2x - 6 = 0`: `x = 3`.","_n":"1fa2","_k":"a703b3c7"},{"t":"`x = 3`","why":"The bottom is 0 when `2x - 6 = 0`, so `2x = 6` and `x = 3`. You can’t divide by 0, so the graph has a vertical asymptote there.","_n":"2f92","_k":"d6efb4ff"},{"t":"`y = 0`","why":"`y = 0` is the horizontal asymptote, a height the graph approaches far away. A vertical asymptote is an `x`-value where the bottom is 0.","_n":"3f42","_k":"71b8959c"}],"hints":["A vertical asymptote of 1/(linear) is where the bottom is 0.","Solve `2x - 6 = 0`.","`2x = 6`, so `x = 3`. The vertical asymptote is `x = 3`."]},{"id":"w2","skill":"Reciprocal functions","goal":3,"prompt":"For `y = {1}/{x - 2}`, what happens to `y` as `x -> 2^{-}` (as `x` approaches 2 from the left)?","options":[{"t":"`y -> 0`","why":"`y` is close to 0 when `x` is far from 2. Near `x = 2` the bottom is tiny, so `y` is huge in size.","_n":"4f32","_k":"62ddf6b8"},{"t":"`y -> 2`","why":"2 is an `x`-value, the position of the wall. Try `x = 1.9`: `y = 1/(-0.1) = -10`.","_n":"5f62","_k":"0c81ff18"},{"t":"`y -> -∞`","why":"Just left of 2, `x - 2` is a tiny negative number, like −0.01, and `1/(-0.01) = -100`. The closer `x` gets, the more negative `y` gets.","_n":"6f52","_k":"826f2967"},{"t":"`y -> ∞`","why":"That happens as `x -> 2^{+}`. Try `x = 1.99`: `1/(-0.01) = -100`.","_n":"7f02","_k":"dd21e3f4"}],"hints":["Try an `x`-value just left of 2, like 1.9, then 1.99.","At `x = 1.9` the bottom is −0.1, so `y = -10`. At 1.99, `y = -100`.","The values head down without bound, so as `x -> 2^{-}`, `y -> -∞`."]},{"id":"w3","skill":"Transformations","goal":4,"prompt":"The graph of `y = 1/x` is stretched vertically by a factor of 3, then translated 2 units right and 1 unit up. What is the new equation?","options":[{"t":"`y = {1}/{3(x - 2)} + 1`","why":"`{1}/{3(x - 2)}` makes every height a third as big. A vertical stretch by 3 multiplies the whole fraction: `{3}/{x - 2}`.","_n":"8ef2","_k":"fc860fc8"},{"t":"`y = {3}/{x + 2} + 1`","why":"`(x + 2)` moves the graph left. Right 2 is `(x - 2)`: the bottom is 0 at `x = 2`.","_n":"93b3","_k":"6a799ae8"},{"t":"`y = {3}/{x - 1} + 2`","why":"This moves 1 right and 2 up. The horizontal shift goes with `x`; the vertical shift is added at the end.","_n":"a3c3","_k":"e9f7fec1"},{"t":"`y = {3}/{x - 2} + 1`","why":"The stretch multiplies the whole fraction by 3; “2 right” replaces `x` with `x - 2`; “1 up” adds 1 at the end.","_n":"b3d3","_k":"fda44b16"}],"hints":["Do one change at a time: a vertical stretch multiplies the whole function, a move right changes `x`, and a move up adds at the end.","Stretch by 3: `3 · 1/x = 3/x`. Move 2 right: replace `x` with `x - 2`.","`{3}/{x - 2}`, then add 1: `y = {3}/{x - 2} + 1`."]},{"id":"w4","skill":"Transformations","goal":1,"prompt":"What are the asymptotes of `y = {4}/{x + 5} - 2`?","options":[{"t":"`x = 5` and `y = -2`","why":"`x + 5 = 0` at `x = -5`, not 5.","_n":"c3e3","_k":"2bc3fa81"},{"t":"`x = -5` and `y = 4`","why":"4 is the stretch. Far away the fraction `{4}/{x + 5}` shrinks to 0, leaving −2.","_n":"d373","_k":"f2e7b978"},{"t":"`x = -2` and `y = -5`","why":"The vertical asymptote comes from the bottom (`x = -5`); the horizontal one is the number added at the end (`y = -2`).","_n":"e383","_k":"4a71359a"},{"t":"`x = -5` and `y = -2`","why":"The bottom `x + 5` is 0 at `x = -5`. Far away, `{4}/{x + 5}` shrinks to 0, so `y` approaches `0 - 2 = -2`.","_n":"f393","_k":"f2eae723"}],"hints":["The vertical asymptote is where the bottom is 0. The horizontal one is what `y` approaches when `x` is huge.","`x + 5 = 0` at `x = -5`. When `x` is huge, `{4}/{x + 5}` is almost 0.","`x = -5` and `y = 0 - 2 = -2`."]},{"id":"w5","skill":"Rational expressions","goal":4,"prompt":"Write `2 + {3}/{x - 1}` as a single fraction.","options":[{"t":"`{5}/{x - 1}`","why":"2 isn’t `{2}/{x - 1}`. Check with `x = 3`: `2 + 3/2 = 3.5`, but `5/2 = 2.5`.","_n":"g3a3","_k":"79233121"},{"t":"`{2x + 1}/{x - 1}`","why":"Write 2 as `{2(x - 1)}/{x - 1} = {2x - 2}/{x - 1}`. Then `{2x - 2 + 3}/{x - 1} = {2x + 1}/{x - 1}`.","_n":"h433","_k":"20d1dece"},{"t":"`{2x + 3}/{x - 1}`","why":"`2(x - 1)` is `2x - 2`, not `2x`. Check with `x = 3`: `2 + 3/2 = 3.5`, but `9/2 = 4.5`.","_n":"i443","_k":"12b2c2d3"},{"t":"`{2x + 5}/{x - 1}`","why":"`2(x - 1) = 2x - 2`, so the top is `2x - 2 + 3 = 2x + 1`. Check with `x = 3`: this option gives `11/2 = 5.5`, not 3.5.","_n":"jcd3","_k":"05bbaf71"}],"hints":["To add, give 2 the same denominator: `x - 1`.","`2 = {2(x - 1)}/{x - 1} = {2x - 2}/{x - 1}`.","`{2x - 2 + 3}/{x - 1} = {2x + 1}/{x - 1}`."]},{"id":"w6","skill":"Domain and range notation","goal":2,"prompt":"What is the domain of `y = {3}/{x + 4}`?","options":[{"t":"`{x ∈ ℝ | x ≠ -4}`","why":"Every `x` works except the one that makes the bottom 0: `x + 4 = 0` at `x = -4`.","_n":"kcc3","_k":"d5c21f88"},{"t":"`{x ∈ ℝ | x ≠ 0}`","why":"`y = 1/x` excludes 0, but here the bottom is `x + 4`, which is 0 at `x = -4`. At `x = 0`, `y = 3/4` is fine.","_n":"lcf3","_k":"13d610f1"},{"t":"`{y ∈ ℝ | y ≠ 0}`","why":"That’s the range: the heights the graph can reach. The domain lists the `x`-values.","_n":"mce3","_k":"ec73ab2f"},{"t":"`{x ∈ ℝ | x ≠ 4}`","why":"At `x = 4` the bottom is 8. The excluded value is −4.","_n":"nc93","_k":"d9177e68"}],"hints":["Which `x`-value makes the bottom 0?","`x + 4 = 0` when `x = -4`.","All real `x` except −4: `{x ∈ ℝ | x ≠ -4}`."]}],"refreshers":{"Reciprocal functions":"For `y = {1}/{2x - 6}`, the bottom is 0 at `x = 3`, so there’s a vertical asymptote `x = 3`. Far away the bottom is huge, so `y -> 0`: the horizontal asymptote is `y = 0`. Next to the wall the sign of the tiny bottom decides: just left of 3, `2x - 6` is negative, so `y -> -∞`; just right of 3, `y -> ∞`.","Transformations":"A vertical stretch by 3 multiplies the whole function by 3 (a negative number also flips it). Moving 2 units right replaces `x` with `x - 2`, and moving 1 unit up adds 1 at the end. For `y = 1/x` the asymptotes move with the graph: `y = {3}/{x - 2} + 1` has vertical asymptote `x = 2` and horizontal asymptote `y = 1`. (This is module 07’s transformation form, applied to `1/x`.)","Rational expressions":"To add a number and a fraction, write the number over the same denominator: `2 + {3}/{x - 1} = {2(x - 1) + 3}/{x - 1} = {2x + 1}/{x - 1}`. Check by substituting a value such as `x = 3`: `2 + 3/2 = 3.5` and `7/2 = 3.5`.","Domain and range notation":"To write the domain of a rational function, exclude the `x`-values that make the bottom 0: `y = {3}/{x + 4}` has domain `{x ∈ ℝ | x ≠ -4}`. The range lists the `y`-values; for `y = {3}/{x + 4}` it is `{y ∈ ℝ | y ≠ 0}`."}}},"explore":{"heading":"Asymptote crosshair","intro":"Drag the crosshair to move the graph, and drag the violet handle to stretch it. The equation updates in both forms. Then switch to coefficient mode and change `a`, `b`, `c` and `d` directly to see which numbers move what. The \u003cstrong>stretch\u003c/strong> is the number `y = 1/x` is multiplied by: its size says how far the branches sit from the crosshair (a size below 1 is really a compression), and a negative stretch also reflects the graph in the `x`-axis.","ui":{"modes":["Move the crosshair","Set the coefficients"],"lenses":["Off","Near the wall","Far away","Rectangle"],"rounded":"Rounded so the handles can hold it","refuse":"This one is a line with a hole, not a stretched `1/x`.","nearest":"A coefficient would be outside −9 to 9, so the nearest function that fits is shown.","panned":"View moved to keep the crosshair in sight.","halfTurn":"It lands on itself: the graph has half-turn symmetry about {pt}.","special":"The top is a multiple of the bottom, so this is the horizontal line {line} with a hole at {hole}. Holes are module 21’s topic.","noXint":"None: the top is a non-zero constant, so it’s never 0","noYint":"None: `x = 0` is the vertical asymptote"},"predIntro":"Make a prediction first. Then the crosshair explorer will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"coef","a":3,"b":-6,"c":1,"d":2},"prompt":"The view is about to zoom far out, to `x = ±1000`. Which line will the curve hug at both ends?","options":[{"t":"`y = -3`","_n":"oc83","_k":"ee1c7a90"},{"t":"`y = 3`","_n":"pcb3","_k":"ff500abe"},{"t":"`y = -6`","_n":"qca3","_k":"f05a284f"},{"t":"`y = 0`","_n":"rc53","_k":"d1b98258"}],"explain":"Far from the origin, −6 and +2 are tiny next to `3x` and `x`, so `y ≈ 3x/x = 3`. The horizontal asymptote is the ratio of the `x`-coefficients, `a/c = 3/1`. −3 is `b/d`, the `y`-intercept: the height at `x = 0`, which is the opposite of far away. `y = 0` is the asymptote of `y = 1/x`, but here the top grows as fast as the bottom. −6 is just the constant on top."},{"id":"p2","start":{"mode":"coef","a":2,"b":1,"c":1,"d":-1},"prompt":"`b` will step down from 1 to −5 while `a`, `c` and `d` stay fixed. What happens to the graph?","options":[{"t":"The asymptotes stay put, and the branches stay in the same corners","_n":"sc43","_k":"51b77db0"},{"t":"The horizontal asymptote moves down 6 units","_n":"t473","_k":"7f9b7709"},{"t":"The vertical asymptote moves 6 units right","_n":"u483","_k":"759e58c3"},{"t":"The asymptotes stay put, and the branches end up in the other two corners","_n":"v453","_k":"a60dfd46"}],"explain":"The asymptotes depend only on `a`, `c` and `d`: `x = 1` and `y = 2/1 = 2`. `b` changes the stretch: in crosshair form, `y = 2 + {b + 2}/{x - 1}`. From `b = 1` down to −5 the stretch goes 3, 2, 1, 0, −1, −2, −3. At 0 the top is `2(x - 1)`, a multiple of the bottom, so the graph collapses to a line with a hole (module 21). Past 0 the stretch is negative, which puts the branches in the other two corners.","rmNote":"Stretch as `b` steps from 1 to −5: 3, 2, 1, 0, −1, −2, −3."},{"id":"p3","start":{"mode":"cross","h":2,"q":1,"s":6},"prompt":"The point will slide along the graph from `x = 0` toward the vertical asymptote `x = 2`. What happens to its `y`-value?","options":[{"t":"It reaches a lowest point, then turns back up","_n":"w463","_k":"8fa0836f"},{"t":"It rises without bound: `y -> ∞`","_n":"x4b3","_k":"44a15940"},{"t":"It levels off at `y = 1`","_n":"y4c3","_k":"f5b29600"},{"t":"It falls without bound: `y -> -∞`","_n":"z493","_k":"74339796"}],"explain":"Near `x = 2` the top is about 6, which is positive, and the bottom `x - 2` is a tiny negative number. A positive number divided by a tiny negative one is a huge negative number, so as `x -> 2^{-}`, `y -> -∞`. On the other side the bottom is a tiny positive number, so as `x -> 2^{+}`, `y -> ∞`. A linear-over-linear graph always heads in opposite directions on the two sides of its vertical asymptote, and it has no turning points."},{"id":"p4","start":{"mode":"cross","h":2,"q":1,"s":6},"prompt":"This function is decreasing on each branch. Compare `f(1)` and `f(3)`.","options":[{"t":"`f(3) = f(1)`","_n":"104a3","_k":"0e76b292"},{"t":"`f(3) \u003c f(1)`, because the function is decreasing","_n":"113f3","_k":"f076c2a9"},{"t":"`f(3) > f(1)`","_n":"12403","_k":"ad88daa2"},{"t":"They can’t be compared, because `x = 2` lies between them","_n":"13c92","_k":"28554d8b"}],"explain":"`f(1) = 5/(-1) = -5` and `f(3) = 7/1 = 7`, so `f(3)` is larger. “Decreasing” is true on each branch on its own. Between `x = 1` and `x = 3` sits the wall `x = 2`, where the graph breaks and jumps from the bottom (−∞) to the top (∞). That’s why the intervals are written “on `(-∞, 2)` and on `(2, ∞)`”, never as one decreasing stretch. Both values exist, so they can be compared."}],"chalIntro":"Set the explorer, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[4,6],"mode":"cross","prompt":"Make the vertical asymptote `x = -3` and the horizontal asymptote `y = 2`, with the branches in the upper-left and lower-right corners. (Use “Move the crosshair”.)","why":"Crosshair (−3, 2) with a negative stretch, such as `y = {-2}/{x + 3} + 2 = {2x + 4}/{x + 3}`. Any of the 16 negative stretches from −0.5 to −8 works.","fb":{"mode":"This challenge is set in crosshair mode. Switch to “Move the crosshair”, then shape the graph there.","c32":"Your vertical asymptote is `x = 3`. The wall must be at `x = -3`; in the equation that’s `(x + 3)` in the bottom.","c2m3":"You’ve swapped them. The vertical asymptote is an `x`-value (left–right position); the horizontal one is a `y`-value (height).","pos":"Right crosshair, wrong corners. A positive stretch puts the branches upper right and lower left. Drag the stretch handle below the dashed line `y = 2`.","cm3m2":"The level line is at `y = -2`. Move the crosshair up to `y = 2`.","other":"Get the crosshair to (−3, 2) first, then choose the corners."},"hints":["The crosshair is where the two asymptotes cross. Where do `x = -3` and `y = 2` meet?","Drag the crosshair to (−3, 2). For upper-left and lower-right branches, which way must the stretch handle point?","With the crosshair at (−3, 2), drag the handle below the level line, to any negative stretch such as −2. That gives `y = {-2}/{x + 3} + 2 = {2x + 4}/{x + 3}`."]},{"id":"tc2","goal":[4,6],"mode":"coef","prompt":"Set `a`, `b`, `c` and `d` so that the graph has `x`-intercept (3, 0), vertical asymptote `x = -1` and horizontal asymptote `y = 2`. (Use “Set the coefficients”.)","why":"`y = {2x - 6}/{x + 1}`: `(a, b, c, d) = (2, -6, 1, 1)` or `(-2, 6, -1, -1)`. No other whole-number settings from −9 to 9 work.","fb":{"mode":"This challenge is set in coefficient mode. Switch to “Set the coefficients”, then set `a`, `b`, `c` and `d`.","w1":"Your `x`-intercept is (−3, 0). For the top to be 0 at `x = 3`, it must be `2x - 6`.","w2":"Your vertical asymptote is `x = 1`. The bottom must be 0 at `x = -1`: `x + 1`.","w3":"Your horizontal asymptote is `y = 1/2`: `a/c` is upside down. You need `a/c = 2`.","w4":"Right intercept and right wall, but the horizontal asymptote is `y = 1`. Double the top: `2x - 6`.","special":"The top is a multiple of the bottom, so the graph collapsed to a line with a hole.","other":"Check each feature in turn: the top must be 0 at `x = 3`, the bottom 0 at `x = -1`, and `a/c` must be 2."},"hints":["Each feature pins down one piece: the `x`-intercept fixes the top’s zero, the vertical asymptote the bottom’s zero, and `a/c` the horizontal asymptote.","Top: zero at `x = 3`, so it’s a multiple of `(x - 3)`. Bottom: zero at `x = -1`, so it’s a multiple of `(x + 1)`.","`y = {2(x - 3)}/{x + 1} = {2x - 6}/{x + 1}`: `a = 2`, `b = -6`, `c = 1`, `d = 1`. Check: `a/c = 2`."]},{"id":"tc3","goal":[4,6],"prompt":"\u003cstrong>Challenge 3: the hardest.\u003c/strong> Make the graph pass through both marked points, (0, 3) and (4, −1), with horizontal asymptote `y = 1`. (Either mode; the two points are the yellow rings.)","why":"`y = {x - 6}/{x - 2}`: crosshair (2, 1) with stretch −4, or coefficients `(1, -6, 1, -2)` or `(-1, 6, -1, 2)`. No other setting works.","fb":{"wall":"A marked point can’t sit on the vertical asymptote: the function has no value there.","both":"Your curve passes through both marked points, but its horizontal asymptote is {ha}. Two points alone don’t pin the curve down: several pass through both. Keep the level line at `y = 1` and find the one that still passes through both.","corners":"Right crosshair, wrong corners. Your curve passes through (0, −1) and (4, 3): the two heights are swapped.","level":"Put the crosshair on the line `y = 1` first. That’s the horizontal asymptote the challenge asks for.","other":"At `x = 0` your curve is at {f0}, and at `x = 4` it’s at {f4}."},"hints":["Compare each point with the level line `y = 1`: one is 2 above it and the other is 2 below it.","Points equally far above and below the horizontal asymptote are half-turn partners about the crosshair, so the crosshair is their midpoint. (Try the Half-turn test.)","The midpoint of (0, 3) and (4, −1) is (2, 1), so the wall is `x = 2`. At `x = 4`, two units right of the wall, the curve is 2 below the level line, so the rectangle rule gives stretch = 2 × (−2) = −4. `y = {-4}/{x - 2} + 1 = {x - 6}/{x - 2}`."]}]},"part3":{"slug":"sketch","name":"Sketch","heading":"Sketch from the equation","intro":"Read each feature from the equation and place it on the grid. When your sketch agrees with itself, check it against the real graph.","ui":{"steps":["Wall (vertical asymptote)","Level line (horizontal asymptote)","Intercepts","Corners","Draw my sketch"],"wallHow":"Tap the `x`-axis, or press the button and use the arrow keys.","levelHow":"Tap the `y`-axis, or press the button and use the arrow keys.","cornerHow":"Tap two opposite corner regions around your crosshair.","notDiagonal":"Branches always sit in opposite corners.","checks":["Vertical asymptote","Horizontal asymptote","`x`-intercept","`y`-intercept","Branches in the right corners","My features agree with each other"],"agreeI":"Your {which} {pt} is in the {corner} corner of your crosshair, but you shaded {pair}.","agreeOn":"Your {which} {pt} sits on one of your dashed lines, but the graph never touches its asymptotes.","agreeY":"You chose “None” for the `y`-intercept, but your wall isn’t the `y`-axis, so the graph must cross the `y`-axis somewhere.","agreeX":"You chose “None” for the `x`-intercept, but your level line isn’t the `x`-axis, so the graph must cross the `x`-axis somewhere.","agreeIII":"Your intercepts can’t both be on one curve with your asymptotes: the rectangle rule gives {ry} from {py}, but {rx} from {px}. Recheck one of them.","generic":{"va":"The wall is where the bottom is 0: `x = -d/c`.","ha":"The level line comes from the `x`-coefficients only, with their signs: `y = a/c`.","xi":"For the `x`-intercept, set the top equal to 0.","yi":"For the `y`-intercept, put `x = 0`: `y = b/d`.","none":"This graph does cross that axis. Find the value instead of “None”."},"allRight":"All five features are right. The true graph is drawn over your sketch."},"rounds":[{"id":"r1","goal":[1,2,5],"abcd":[2,5,1,1],"eq":"`y = {2x + 5}/{x + 1}`","wrong":{"va":{"1":"`x + 1` is 0 at `x = -1`, not 1."},"ha":{"0":"`y = 0` is the level line of `y = 1/x`. Here the top grows as fast as the bottom: `2x/x = 2`.","5":"5 = `b/d` is the `y`-intercept. The level line is `a/c = 2/1 = 2`.","1/2":"That’s `c/a`, upside down. Use `a/c = 2`."},"xi":{"5/2":"`2x + 5 = 0` gives `x = -5/2`. Keep the sign.","-5":"Divide by 2: `2x = -5` gives `x = -5/2`."},"yi":{"2":"2 is `a/c`, the level line. At `x = 0`, `y = 5/1 = 5`."},"corners":"(0, 5) is right of the wall and above the level line: that’s the upper-right corner, so the branches are upper right and lower left."},"hints":["Start with the bottom: where is `x + 1 = 0`? Then divide the `x`-coefficients for the level line.","Wall `x = -1`, level line `y = 2/1 = 2`. For the intercepts, solve `2x + 5 = 0`, and put `x = 0`.","`x`-intercept `(-{5}/{2}, 0)`, `y`-intercept (0, 5). (0, 5) is right of the wall and above the level line, so the branches are upper right and lower left."],"alg":"`2x + 5 = 2(x + 1) + 3`, so `{2x + 5}/{x + 1} = 2 + {3}/{x + 1}`. Crosshair (−1, 2), stretch 3. Check with the rectangle rule at (0, 5): `(0 - (-1))(5 - 2) = 3`."},{"id":"r2","goal":[1,2,4],"abcd":[3,-6,2,4],"eq":"`y = {3x - 6}/{2x + 4}`","wrong":{"va":{"2":"`2x + 4` is 0 at `x = -2`, not 2.","-4":"`2x + 4 = 0` gives `2x = -4`, so `x = -2`. Divide by 2."},"ha":{"3":"Divide by `c = 2` as well: `3x/2x = 3/2`.","2/3":"That’s `c/a`, upside down: 3/2.","-3/2":"That’s `b/d`, the `y`-intercept."},"xi":{"-2":"`3x - 6 = 0` gives `x = 2`. (`x = -2` is the wall.)"},"yi":{"3/2":"`-6/4 = -3/2`. Keep the sign: the `y`-intercept is below the level line."},"corners":"(2, 0) is right of the wall and below the level line: lower right. So the other branch is upper left."},"hints":["Solve `2x + 4 = 0` for the wall. For the level line, divide 3 by 2.","Wall `x = -2`, level line `y = 3/2`. `x`-intercept from `3x - 6 = 0`; `y`-intercept `-6/4`.","(2, 0) and `(0, -{3}/{2})` are both right of the wall and below the level line, in the lower-right corner. The branches are upper left and lower right."],"alg":"`3x - 6 = (3/2)(2x + 4) - 12`, so `{3x - 6}/{2x + 4} = {3}/{2} - {12}/{2x + 4} = {3}/{2} - {6}/{x + 2}`. Crosshair `(-2, {3}/{2})`, stretch −6: negative, so upper left and lower right."},{"id":"r3","goal":[1,2,5],"abcd":[-1,4,2,-3],"eq":"`y = {4 - x}/{2x - 3}`","wrong":{"va":{"-3/2":"`2x - 3 = 0` gives `x = 3/2`."},"ha":{"2":"4 is the constant, not the `x`-coefficient. Rewrite the top as `-x + 4`: the level line is `y = -1/2`.","1/2":"The `x`-coefficient on top is −1, so the level line is `y = -1/2`. Keep the sign."},"xi":{"-4":"`4 - x = 0` gives `x = 4`."},"yi":{"4/3":"At `x = 0`, `y = 4/(-3) = -4/3`."},"corners":"(4, 0) is right of the wall `x = 3/2` and above the level line `y = -1/2`: upper right. The branches are upper right and lower left."},"hints":["Rewrite the top as `-x + 4` so the `x`-term comes first.","Wall: `2x - 3 = 0`, so `x = 3/2`. Level line: `y = -1/2`. `x`-intercept: `4 - x = 0`. `y`-intercept: `4/(-3)`.","(4, 0) is upper right of the crosshair `({3}/{2}, -{1}/{2})`, so the branches are upper right and lower left; `(0, -{4}/{3})` sits in the lower-left corner."],"alg":"`4 - x = -(1/2)(2x - 3) + 5/2`, so `{4 - x}/{2x - 3} = -{1}/{2} + {5/2}/{2x - 3} = -{1}/{2} + {5/4}/{x - 3/2}`. Crosshair `({3}/{2}, -{1}/{2})`, stretch `{5}/{4}`."}],"algGeneral":[["Why the wall is `x = -d/c`","The bottom `cx + d` is 0 there, and the top isn’t (if it were, the top would be a multiple of the bottom)."],["Why the level line is `y = a/c`","Divide every term by `x`: `{a + b/x}/{c + d/x}`. As `x -> ±∞`, `b/x` and `d/x -> 0`, so `y -> a/c`."],["Why the graph never reaches the level line","`{ax + b}/{cx + d} = a/c` means `c(ax + b) = a(cx + d)`, so `bc = ad`. That only happens when the top is a multiple of the bottom."],["Why every other height is reached exactly once","Solving `{ax + b}/{cx + d} = k` gives `ax + b = k(cx + d)`, a linear equation with exactly one solution, `x = {kd - b}/{a - kc}`, whenever `k ≠ a/c`. That solution is never the excluded value `-d/c`, because that would again need `bc = ad`. So every height except `a/c` is reached exactly once, and two different `x`-values never give the same `y`-value."],["Crosshair form in general","`{ax + b}/{cx + d} = a/c + {(bc - ad)/c^2}/{x + d/c}`. The stretch is `(bc - ad)/c^2`: its sign is the sign of `bc - ad`."]],"blocks":[{"title":"Sketching `y = {ax + b}/{cx + d}` in five steps","html":"\u003col>\u003cli>\u003cstrong>Wall (vertical asymptote):\u003c/strong> set the bottom to 0: `x = -d/c`.\u003c/li>\u003cli>\u003cstrong>Level line (horizontal asymptote):\u003c/strong> `y = a/c` (`x`-coefficients only, with their signs).\u003c/li>\u003cli>\u003cstrong>Intercepts:\u003c/strong> top = 0 for the `x`-intercept; `x = 0` for the `y`-intercept, `b/d`.\u003c/li>\u003cli>\u003cstrong>Corners:\u003c/strong> find which corner one intercept (or any test point) is in. The other branch is in the opposite corner.\u003c/li>\u003cli>\u003cstrong>Draw:\u003c/strong> two smooth branches that hug both dashed lines and pass through the intercepts. No turning points, and no touching the lines.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Read it from the equation","summary":"Read it from the equation","items":[{"id":"q1","goal":4,"prompt":"`y = {x - 4}/{x + 2}`. Which corners hold the branches?","choices":[{"t":"Upper right and lower left","fb":"Test one point. At `x = 0`, `y = -2`, which is below the level line `y = 1` and right of the wall `x = -2`: the lower-right corner.","_n":"14c82","_k":"ba8d8a81"},{"t":"Upper left and lower right","fb":"Right. At `x = 0`, `y = -4/2 = -2`: right of the wall `x = -2` and below the level line `y = 1`. That’s the lower-right corner, so the other branch is upper left.","_n":"15c72","_k":"4044ce2c"}]},{"id":"q2","goal":1,"prompt":"What is the horizontal asymptote of `y = {6 - 2x}/{x + 3}`?","choices":[{"t":"`y = 0`","fb":"That’s the level line of `y = 1/x`. Here the top grows as fast as the bottom.","_n":"16c62","_k":"0d99a9b9"},{"t":"`y = 2`","fb":"The sign belongs to the coefficient: `-2x/x = -2`.","_n":"17cd2","_k":"02d12d16"},{"t":"`y = -2`","fb":"Right. The `x`-term on top is `-2x`, so far away `y ≈ -2x/x = -2`.","_n":"18cc2","_k":"84fa74b5"},{"t":"`y = 6`","fb":"6 is the constant on top. The level line comes from the `x`-coefficients.","_n":"19cb2","_k":"1af12292"}]},{"id":"q3","goal":1,"prompt":"Does `y = {2x + 1}/{x - 3}` ever equal 2?","choices":[{"t":"Yes, once","fb":"Solve it: `2x + 1 = 2(x - 3)` gives `1 = -6`, which is never true. The graph never reaches its horizontal asymptote.","_n":"1aca2","_k":"862f21e5"},{"t":"No, never","fb":"Right. `{2x + 1}/{x - 3} = 2` would mean `2x + 1 = 2x - 6`, so `1 = -6`: impossible. `y = 2` is the horizontal asymptote.","_n":"1bc12","_k":"74ecb7a1"},{"t":"Yes, twice","fb":"The equation `2x + 1 = 2x - 6` has no solutions at all, let alone two.","_n":"1cc02","_k":"47482dd6"}]},{"id":"q4","goal":3,"prompt":"`y = {3x}/{x - 1}`. As `x -> 1^{-}`, what happens to `y`?","choices":[{"t":"`y -> 0`","fb":"Near the wall the bottom is tiny, so `y` is huge in size, not small.","_n":"1dc32","_k":"581b292e"},{"t":"`y -> ∞`","fb":"That’s the right side. Left of 1, `x - 1` is negative.","_n":"1ec42","_k":"7dcc77a8"},{"t":"`y -> 3`","fb":"3 is the horizontal asymptote, reached only far away.","_n":"1fc52","_k":"5edd34ee"},{"t":"`y -> -∞`","fb":"Right. Just left of 1 the top is about 3 and the bottom is a tiny negative number: at `x = 0.9`, `y = 2.7/(-0.1) = -27`.","_n":"1gc62","_k":"49323e8f"}]}]}},"practice":{"activities":[{"id":"match","type":"custom","title":"Match the graph","summary":"Match the graph","goal":[4,5,1],"instruction":"Match each equation to its graph.","how":"Tap an equation, then tap its graph.","fb":{"wall":"That graph’s vertical asymptote is {gva}. This equation’s bottom is 0 at {va}.","level":"That graph’s horizontal asymptote is {gha}. This equation’s is `a/c` = {ha}.","corners":"Same asymptotes, wrong corners. Check one point: this equation’s `y`-intercept is {yi}.","tail":"Try another graph."},"left":[{"id":"l1","abcd":[2,2,1,-1],"t":"`y = {2x + 2}/{x - 1}`","why":"Wall `x = 1`, level line `y = 2/1 = 2`, and (0, −2) is lower left, so the branches are upper right and lower left.","hints":["Start with the crosshair: where is the bottom 0, and what is `a/c`?","`x - 1 = 0` at `x = 1`, and `a/c = 2/1 = 2`, so the crosshair is (1, 2). Two graphs have that crosshair.","Use the `y`-intercept to choose: `y = 2/(-1) = -2`, left of the wall and below the level line. The branches are lower left and upper right."]},{"id":"l2","abcd":[2,-4,1,-1],"t":"`y = {2x - 4}/{x - 1}`","why":"Same crosshair as the one before, but (0, 4) is left of the wall and above the level line: upper left.","hints":["Start with the crosshair: where is the bottom 0, and what is `a/c`?","`x - 1 = 0` at `x = 1`, and `a/c = 2/1 = 2`, so the crosshair is (1, 2). Two graphs have that crosshair.","Use the `y`-intercept to choose: `y = -4/(-1) = 4`, left of the wall and above the level line. The branches are upper left and lower right."]},{"id":"l3","abcd":[1,1,2,-2],"t":"`y = {x + 1}/{2x - 2}`","why":"`2x - 2 = 0` at `x = 1`, and the level line is `y = 1/2`.","hints":["Find the level line carefully: divide the `x`-coefficients.","`a/c = 1/2`, and `2x - 2 = 0` at `x = 1`. The crosshair is `(1, {1}/{2})`.","Only one graph has its level line halfway between 0 and 1, with its wall at `x = 1`. Its `y`-intercept is `(0, -{1}/{2})`."]},{"id":"l4","abcd":[1,2,1,-2],"t":"`y = {x + 2}/{x - 2}`","why":"Wall `x = 2`, level line `y = 1`: the crosshair is (2, 1), not (1, 2).","hints":["Start with the crosshair: where is the bottom 0, and what is `a/c`?","`x - 2 = 0` at `x = 2`, and `a/c = 1/1 = 1`, so the crosshair is (2, 1).","Use the `y`-intercept to choose: `y = 2/(-2) = -1`, left of the wall and below the level line. The branches are lower left and upper right."]},{"id":"l5","abcd":[-2,-2,1,-1],"t":"`y = {-2x - 2}/{x - 1}`","why":"The level line is `y = -2/1 = -2`. This graph is the first one reflected in the `x`-axis.","hints":["Start with the crosshair: where is the bottom 0, and what is `a/c`?","`x - 1 = 0` at `x = 1`, and `a/c = -2/1 = -2`, so the crosshair is (1, −2).","Use the `y`-intercept to choose: `y = -2/(-1) = 2`, left of the wall and above the level line. The branches are upper left and lower right."]},{"id":"l6","abcd":[2,-2,1,1],"t":"`y = {2x - 2}/{x + 1}`","why":"`x + 1 = 0` at `x = -1`, so the wall is left of the `y`-axis.","hints":["Start with the crosshair: where is the bottom 0, and what is `a/c`?","`x + 1 = 0` at `x = -1`, and `a/c = 2/1 = 2`, so the crosshair is (−1, 2).","Use the `y`-intercept to choose: `y = -2/1 = -2`, right of the wall and below the level line. The branches are upper left and lower right."]}],"right":[{"id":"r1","name":"P","abcd":[1,2,1,-2]},{"id":"r2","name":"Q","abcd":[2,-4,1,-1]},{"id":"r3","name":"R","abcd":[2,-2,1,1]},{"id":"r4","name":"S","abcd":[2,2,1,-1]},{"id":"r5","name":"T","abcd":[-2,-2,1,-1]},{"id":"r6","name":"U","abcd":[1,1,2,-2]}],"_a":"QkZfBBsCRkYNRh8XVQpGDhsWARcVGggHG14RRw8aSBZVUBEPG0pVFhVGXwAbAkZGDEYfF1UORg4bFgAXRA=="},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the Error","student":"Marcus","how":"","instruction":"Marcus made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find the asymptotes of `y = {6x - 3}/{2x + 8}`.","steps":["The bottom is 0 when `2x + 8 = 0`, so `x = -4`.","At `x = -4` the top is `6(-4) - 3 = -27`, not 0, so `x = -4` is a vertical asymptote.","For the horizontal asymptote, divide the constant terms: `y = -3/8`.","So far to the left and right, the graph levels off at `y = -3/8`."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct, and checking the top is a good habit.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Divide the `x`-coefficients the other way: `y = 2/6 = 1/3`.","why":"That’s `c/a`, upside down. The top’s coefficient goes on top: `6/2 = 3`.","_n":"1hc72","_k":"3348f25e"},{"t":"Every rational function has horizontal asymptote `y = 0`.","why":"That’s true for `y = 1/x`, where the top doesn’t grow. Here the top grows as fast as the bottom: at `x = 1000`, `y = 5997/2008 ≈ 2.99`.","_n":"1ic82","_k":"b8c44e80"},{"t":"Divide the `x`-coefficients: `y = 6/2 = 3`.","why":"Far from the origin the constants hardly matter: `{6x - 3}/{2x + 8} ≈ 6x/2x = 3`.","_n":"1jc92","_k":"dfd859b1"},{"t":"Step 3 is correct as written.","why":"`-3/8` is `b/d`, which is the `y`-intercept: the height at `x = 0`, not far away.","_n":"1kca2","_k":"b68066ab"}],"hints":["Ask what happens to `y` when `x` is huge, like 1000.","For huge `x`, −3 and +8 are tiny next to `6x` and `2x`.","Step 3 is wrong: `y ≈ 6x/2x = 3`, so the horizontal asymptote is `y = 3`. (`-3/8` is the `y`-intercept.)"]},{"id":"e2","goal":5,"task":"Find where `y = {x + 5}/{x - 3}` is positive and where it is negative.","steps":["The top is 0 at `x = -5`, so the `x`-intercept is (−5, 0).","The bottom is 0 at `x = 3`, so `x = 3` is a vertical asymptote.","The sign can only change at the `x`-intercept, so there are two intervals to test: `x \u003c -5` and `x > -5`.","Test `x = -6`: `y = (-1)/(-9) = 1/9 > 0`. Test `x = 0`: `y = 5/(-3) \u003c 0`.","So `y` is positive on `(-∞, -5)` and negative on `(-5, ∞)`."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","","Both calculations in step 4 are right. The mistake is in choosing the intervals.","Step 5 follows from step 3. The mistake is earlier."],"fixes":[{"t":"The sign can only change at the vertical asymptote: negative on `(-∞, 3)` and positive on `(3, ∞)`.","why":"This drops the `x`-intercept instead. At `x = -6`, `y = 1/9` is positive, not negative.","_n":"1lbb2","_k":"cfbf6e4c"},{"t":"The sign can change at the `x`-intercept \u003cstrong>and\u003c/strong> at the vertical asymptote, so test three intervals: positive on `(-∞, -5) ∪ (3, ∞)`, negative on `(-5, 3)`.","why":"A fraction can change sign where its top is 0 or where its bottom is 0. Try `x = 4`: `y = 9/1 = 9 > 0`.","_n":"1mbc2","_k":"5d08cd0b"},{"t":"Step 3 is correct as written.","why":"Try `x = 4`, which is in `(-5, ∞)`: `y = 9/1 = 9`, which is positive. The sign changed again at `x = 3`.","_n":"1n352","_k":"e6208af6"},{"t":"Test three intervals: positive on `(-∞, -5] ∪ [3, ∞)` and negative on `(-5, 3)`.","why":"The intervals are right, but the brackets aren’t: at `x = -5`, `y = 0`, which isn’t positive, and `x = 3` isn’t in the domain.","_n":"1o342","_k":"0ca5177e"}],"hints":["Where can a fraction change sign? Think about the top \u003cstrong>and\u003c/strong> the bottom.","A fraction can change sign where its top is 0 or where its bottom is 0: here, at −5 and at 3.","Step 3 is wrong. Test `(-∞, -5)`, `(-5, 3)` and `(3, ∞)`: positive on `(-∞, -5) ∪ (3, ∞)`, negative on `(-5, 3)`."]},{"id":"e3","goal":1,"task":"List the key features of `y = {4 - 2x}/{x + 1}`.","steps":["Vertical asymptote: `x + 1 = 0`, so `x = -1`.","Horizontal asymptote: the first number on top is 4, so `y = 4/1 = 4`.","`x`-intercept: `4 - 2x = 0`, so `x = 2`.","`y`-intercept: `y = 4/1 = 4`.","So the graph crosses the `y`-axis on its horizontal asymptote."],"_a":"CA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 is correct.","Step 4 is true: at `x = 0`, `y = 4`. The mistake is earlier.","Step 5 follows from step 2, and it should ring an alarm: these graphs never reach their horizontal asymptote."],"fixes":[{"t":"The `x`-coefficient on top is −2, so the horizontal asymptote is `y = -2/1 = -2`.","why":"Write the top as `-2x + 4`. The `x`-term decides the far-away height, sign included. Now the `y`-intercept (0, 4) is above the level line, which is fine.","_n":"1p372","_k":"30d463b9"},{"t":"The horizontal asymptote is `y = -1/2`.","why":"That’s `c/a`, upside down: use `a/c = -2/1`.","_n":"1q362","_k":"49d0a856"},{"t":"Step 2 is correct as written.","why":"Step 5 shows the problem: a linear-over-linear graph never reaches its horizontal asymptote, yet here the `y`-intercept would be on it. 4 is the constant term, not the coefficient of `x`.","_n":"1r392","_k":"6c190236"},{"t":"The horizontal asymptote is `y = 2`, the size of the `x`-coefficient.","why":"The sign matters: `-2x/x = -2`.","_n":"1s382","_k":"68d406ce"}],"hints":["Which part of the top grows when `x` is huge?","Write the top as `-2x + 4`. For huge `x`, `y ≈ -2x/x`.","Step 2 is wrong: the horizontal asymptote is `y = -2`."]}]},{"id":"build","type":"custom","title":"Build the function","summary":"Build the function","star":true,"goal":[6,1,2,4],"instruction":"Fill in the boxes to make a function with all the listed features.","how":"Each box takes a whole number or a simple fraction such as 1/2. Press Check to see your function on the mini-graph.","msgs":{"empty":"Fill in all four boxes with a whole number or a simple fraction.","c0":"With `c = 0` the bottom is a constant, so this is a line, not a linear-over-linear graph.","special":"Your top is a multiple of your bottom, so this is the line {line} with a hole at {hole}, not a linear-over-linear graph.","generic":"Your function: {list}."},"items":[{"id":"b1","goal":[6,1],"feats":[{"k":"va","v":4},{"k":"ha","v":3},{"k":"xi","v":2}],"clue":"Vertical asymptote `x = 4`, horizontal asymptote `y = 3`, `x`-intercept (2, 0)","_a":"YlcfGA8UVRgUUG4=","wrong":[{"abcd":[3,6,1,-4],"fb":"`x`-intercept (−2, 0). The top must be 0 at `x = 2`."},{"abcd":[3,-6,1,4],"fb":"Wall at `x = -4`. The bottom must be 0 at `x = 4`."},{"abcd":[1,-2,3,-12],"fb":"Level line `y = 1/3`: `a/c` is upside down."},{"abcd":[1,-2,1,-4],"fb":"Level line `y = 1`. Multiply the top by 3."}],"hints":["Each feature fixes one piece: the top’s zero, the bottom’s zero, and `a/c`.","Top: a multiple of `x - 2`. Bottom: a multiple of `x - 4`. Level line `y = 3`: `a/c = 3`.","`y = {3(x - 2)}/{x - 4} = {3x - 6}/{x - 4}`."]},{"id":"b2","goal":[6,4],"feats":[{"k":"va","v":-2},{"k":"ha","v":-1},{"k":"pt","x":0,"y":3}],"clue":"Vertical asymptote `x = -2`, horizontal asymptote `y = -1`, passes through (0, 3)","_a":"YkkCGQ8UVRgLOQ==","wrong":[{"abcd":[-1,3,1,2],"fb":"At `x = 0` this gives 3/2. The `y`-intercept is `b/d`, so `b` must be 3 × 2 = 6."},{"abcd":[-1,6,1,-2],"fb":"Wall at `x = 2`."},{"abcd":[1,6,1,2],"fb":"Level line `y = 1`. The `x`-coefficients must give −1."}],"hints":["Start in crosshair form: `y = -1 + {stretch}/{x + 2}`.","At `x = 0`: `-1 + stretch/2 = 3`, so the stretch is 8.","`y = -1 + {8}/{x + 2} = {-(x + 2) + 8}/{x + 2} = {-x + 6}/{x + 2}`."]},{"id":"b3","goal":[6,1],"feats":[{"k":"va","v":1.5},{"k":"ha","v":2},{"k":"yi","v":1}],"clue":"Vertical asymptote `x = 3/2`, horizontal asymptote `y = 2`, `y`-intercept (0, 1)","_a":"YlAfGAoUVhgUV24=","wrong":[{"abcd":[2,-3,1,-3],"fb":"Wall at `x = 3`. For `x = 3/2` the bottom must be `2x - 3` (or a multiple)."},{"abcd":[4,3,2,3],"fb":"Wall at `x = -3/2`."},{"abcd":[2,-3,2,-3],"fb":"That’s the same expression top and bottom, so the graph collapses to the line `y = 1` with a hole."}],"hints":["For a wall at `x = 3/2`, use the bottom `2x - 3`.","Level line `y = 2` with `c = 2` means `a = 4`. Then `y`-intercept `b/(-3) = 1`.","`b = -3`: `y = {4x - 3}/{2x - 3}`."]},{"id":"b4","goal":[6,2],"feats":[{"k":"xi","v":-3},{"k":"yi","v":1},{"k":"ha","v":-0.5}],"clue":"`x`-intercept (−3, 0), `y`-intercept (0, 1), horizontal asymptote `y = -1/2`","_a":"YlUfBhUVVhgKOQ==","wrong":[{"abcd":[1,3,2,3],"fb":"Level line `y = 1/2`. For −1/2, `a` and `c` need opposite signs."},{"abcd":[1,3,-2,-3],"fb":"`y`-intercept `3/(-3) = -1`."},{"abcd":[1,-3,-2,-3],"fb":"`x`-intercept (3, 0). The top must be 0 at `x = -3`."}],"hints":["The `x`-intercept −3 means the top can be `x + 3`.","`y`-intercept 1: `3/d = 1`, so `d = 3`. Level line `y = -1/2`: `1/c = -1/2`, so `c = -2`.","`y = {x + 3}/{-2x + 3}`, which you can also write `{x + 3}/{3 - 2x}`."]},{"id":"b5","goal":[6,1],"star":true,"feats":[{"k":"pt","x":0,"y":4},{"k":"pt","x":2,"y":0},{"k":"never","v":2}],"clue":"`f(0) = 4`, `f(2) = 0`, and the graph never reaches the height `y = 2`","_a":"YlYfGA0UVRgUVW4=","wrong":[{"abcd":[2,-4,2,-1],"fb":"Both intercepts are right, but your level line is `y = 1`, and your graph reaches `y = 2` at `x = -1`. The only height these graphs never reach is the horizontal asymptote, so the level line must be `y = 2`."},{"abcd":[1,-2,1,-0.5],"fb":"Same function as the one above: level line `y = 1`."}],"hints":["Which height does a linear-over-linear graph never reach?","Its horizontal asymptote, so `a/c = 2`. `f(2) = 0` makes the top a multiple of `x - 2`: try `2x - 4` with `c = 1`.","`f(0) = -4/d = 4`, so `d = -1`: `y = {2x - 4}/{x - 1}`."]},{"id":"b6","goal":[6,4],"star":true,"feats":[{"k":"pt","x":-1,"y":0},{"k":"pt","x":0,"y":2},{"k":"pt","x":1,"y":3}],"clue":"Passes through (−1, 0), (0, 2) and (1, 3)","_a":"YlIfAxUJSAdk","wrong":[{"abcd":[2,2,1,1],"fb":"Your top is a multiple of your bottom, so this is the line `y = 2` with a hole at `x = -1`. It misses (1, 3) and isn’t defined at (−1, 0)."},{"abcd":[6,6,2,3],"fb":"This passes through (−1, 0) and (0, 2), but at `x = 1` it gives 12/5, not 3."}],"hints":["(−1, 0) is the `x`-intercept, so the top can be `x + 1`. Now find the bottom, `cx + d`.","(0, 2): `1/d = 2`, so `d = 1/2`. (1, 3): `2/(c + 1/2) = 3`.","`c + 1/2 = 2/3`, so `c = 1/6`. `y = {x + 1}/{x/6 + 1/2}`; multiply the top and bottom by 6: `{6x + 6}/{x + 3}`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"In Explore, what surprised you most: how the graph changed when only `b` changed, how far away the graph settled, or what happened next to the wall? Describe it."},{"id":"j2","q":"In your own words, why is the horizontal asymptote `y = a/c` and not `y = b/d`?"},{"id":"j3","q":"Explain to a friend how to decide which two corners of the crosshair hold the branches, using `y = {5 - x}/{x + 2}` as your example."},{"id":"j4","q":"Which step of sketching a linear-over-linear function do you still find hardest? What will you do to get it right next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What are the asymptotes of `y = {5x - 2}/{x + 3}`?","options":[{"t":"`x = -3` and `y = 5`","why":"The bottom is 0 at `x = -3` (the top is −17 there, not 0). Far away, `y ≈ 5x/x = 5`.","_n":"1t3b2","_k":"c97f7d18"},{"t":"`x = 3` and `y = 5`","why":"`x + 3` is 0 at `x = -3`, not 3.","_n":"1u3a2","_k":"5d712189"},{"t":"`x = -3` and `y = -{2}/{3}`","why":"`-2/3` is `b/d`, the `y`-intercept. The horizontal asymptote comes from the `x`-coefficients: `5/1 = 5`.","_n":"1v3d2","_k":"8ea8d5eb"},{"t":"`x = {2}/{5}` and `y = 5`","why":"`x = 2/5` makes the \u003cstrong>top\u003c/strong> 0: that’s the `x`-intercept, not an asymptote.","_n":"1w3c2","_k":"45b696e5"}]},"b":{"prompt":"What are the asymptotes of `y = {4x + 1}/{x - 6}`?","options":[{"t":"`x = 6` and `y = -{1}/{6}`","why":"`-1/6` is `b/d`, the `y`-intercept.","_n":"1xcf2","_k":"8c205b6b"},{"t":"`x = -{1}/{4}` and `y = 4`","why":"`x = -1/4` makes the top 0: that’s the `x`-intercept.","_n":"1yd02","_k":"a6548a9d"},{"t":"`x = 6` and `y = 4`","why":"The bottom is 0 at `x = 6` (the top is 25 there). Far away, `y ≈ 4x/x = 4`.","_n":"1zcd2","_k":"b5aa83a4"},{"t":"`x = -6` and `y = 4`","why":"`x - 6` is 0 at `x = 6`.","_n":"20ce2","_k":"9b5f024d"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What are the intercepts of `y = {2x - 3}/{x + 6}`?","options":[{"t":"`({3}/{2}, 0)` and (0, 2)","why":"2 is `a/c`, the horizontal asymptote. The `y`-intercept is `b/d = -3/6 = -1/2`.","_n":"21cb2","_k":"93182acb"},{"t":"(−6, 0) and `(0, -{1}/{2})`","why":"`x = -6` makes the bottom 0: that’s the vertical asymptote. `x`-intercepts come from the top.","_n":"22cc2","_k":"24e9f125"},{"t":"`({3}/{2}, 0)` and `(0, -{1}/{2})`","why":"Top = 0: `2x - 3 = 0`, so `x = 3/2`. At `x = 0`: `y = -3/6 = -1/2`.","_n":"23c92","_k":"b7ec3c4d"},{"t":"`({2}/{3}, 0)` and `(0, -{1}/{2})`","why":"`2x - 3 = 0` gives `x = 3/2`, not 2/3: divide 3 by 2.","_n":"24ca2","_k":"330452a5"}]},"b":{"prompt":"What are the intercepts of `y = {3x + 4}/{x - 8}`?","options":[{"t":"`(-{3}/{4}, 0)` and `(0, -{1}/{2})`","why":"`3x + 4 = 0` gives `x = -4/3`, not −3/4.","_n":"25c72","_k":"78cb2666"},{"t":"`(-{4}/{3}, 0)` and `(0, -{1}/{2})`","why":"`3x + 4 = 0` gives `x = -4/3`. At `x = 0`: `y = 4/(-8) = -1/2`.","_n":"26c82","_k":"b54535a1"},{"t":"`(-{4}/{3}, 0)` and (0, 3)","why":"3 is `a/c`, the horizontal asymptote.","_n":"27511","_k":"2a9d6ce9"},{"t":"(8, 0) and `(0, -{1}/{2})`","why":"`x = 8` makes the bottom 0: that’s the vertical asymptote.","_n":"28501","_k":"c660261b"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"What are the domain and range of `y = {x - 1}/{2x + 5}`?","options":[{"t":"Domain `{x ∈ ℝ | x ≠ -{5}/{2}}`, range `{y ∈ ℝ | y ≠ {1}/{2}}`","why":"The bottom is 0 at `x = -5/2`, and the only height never reached is the horizontal asymptote, `a/c = 1/2`.","_n":"294f1","_k":"463bf2ac"},{"t":"Domain `{x ∈ ℝ | x ≠ -{5}/{2}}`, range `{y ∈ ℝ | y ≠ -{1}/{5}}`","why":"`-1/5` is the `y`-intercept, which the graph \u003cstrong>does\u003c/strong> reach at `x = 0`.","_n":"2a4e1","_k":"4fe66ce4"},{"t":"Domain `{x ∈ ℝ | x ≠ -{5}/{2}}`, range `{y ∈ ℝ | y ≠ 2}`","why":"2 is `c/a`, upside down. The excluded height is `a/c = 1/2`.","_n":"2b4d1","_k":"35170eda"},{"t":"Domain `{x ∈ ℝ | x ≠ {5}/{2}}`, range `{y ∈ ℝ | y ≠ {1}/{2}}`","why":"`2x + 5 = 0` at `x = -5/2`.","_n":"2c4c1","_k":"4cc93f58"}]},"b":{"prompt":"What are the domain and range of `y = {3x + 2}/{4x - 1}`?","options":[{"t":"Domain `{x ∈ ℝ | x ≠ -{1}/{4}}`, range `{y ∈ ℝ | y ≠ {3}/{4}}`","why":"`4x - 1 = 0` at `x = 1/4`.","_n":"2d4b1","_k":"4a3fc31a"},{"t":"Domain `{x ∈ ℝ | x ≠ {1}/{4}}`, range `{y ∈ ℝ | y ≠ -2}`","why":"−2 is the `y`-intercept, `2/(-1)`, which the graph reaches at `x = 0`.","_n":"2e4a1","_k":"c8036e44"},{"t":"Domain `{x ∈ ℝ | x ≠ {1}/{4}}`, range `{y ∈ ℝ | y ≠ {4}/{3}}`","why":"`4/3` is `c/a`, upside down.","_n":"2f491","_k":"843e467f"},{"t":"Domain `{x ∈ ℝ | x ≠ {1}/{4}}`, range `{y ∈ ℝ | y ≠ {3}/{4}}`","why":"The bottom is 0 at `x = 1/4`; the excluded height is `a/c = 3/4`.","_n":"2g481","_k":"54ec9764"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Which statement describes `y = {3x + 1}/{x - 2}`?","options":[{"t":"As `x -> 2^{+}`, `y -> 3`, and as `x -> ∞`, `y -> ∞`.","why":"This swaps the asymptotes’ jobs: next to `x = 2` the graph shoots off; far away it levels off at 3.","_n":"2hcb1","_k":"3f6bf873"},{"t":"As `x -> 2^{+}`, `y -> -∞`, and as `x -> ∞`, `y -> 3` from below.","why":"That’s the picture for a negative stretch. Test `x = 3`: `y = 10/1 = 10`, above the level line.","_n":"2icc1","_k":"35b5d943"},{"t":"As `x -> 2^{+}`, `y -> ∞`, and as `x -> ∞`, `y -> 3` from above.","why":"In crosshair form `y = 3 + {7}/{x - 2}`. The stretch 7 is positive, so the right branch is in the upper-right corner: it shoots up next to the wall and comes down toward `y = 3` from above. Check: `f(3) = 10`.","_n":"2jcd1","_k":"4f1f9bf8"},{"t":"As `x -> 2^{+}`, `y -> ∞`, and as `x -> ∞`, `y -> 3` from below.","why":"A branch in the upper-right corner stays above `y = 3` the whole way, because it never reaches its horizontal asymptote.","_n":"2kce1","_k":"cb25b683"}]},"b":{"prompt":"Which statement describes `y = {2x - 9}/{x - 3}`?","options":[{"t":"As `x -> 3^{+}`, `y -> ∞`, and as `x -> ∞`, `y -> 2` from above.","why":"That’s the picture for a positive stretch. Test `x = 4`: `y = -1/1 = -1`, below the level line.","_n":"2lc71","_k":"4dea70ee"},{"t":"As `x -> 3^{+}`, `y -> -∞`, and as `x -> ∞`, `y -> 2` from above.","why":"A branch in the lower-right corner stays below `y = 2` the whole way.","_n":"2mc81","_k":"f30924a4"},{"t":"As `x -> 3^{+}`, `y -> -∞`, and as `x -> ∞`, `y -> 2` from below.","why":"In crosshair form `y = 2 - {3}/{x - 3}`. The stretch is negative, so the right branch is in the lower-right corner. Check: `f(4) = -1`.","_n":"2nc91","_k":"983225a9"},{"t":"As `x -> 3^{+}`, `y -> 2`, and as `x -> ∞`, `y -> -∞`.","why":"This swaps the asymptotes’ jobs.","_n":"2oca1","_k":"37a07b63"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"Which equation has vertical asymptote `x = 3`, horizontal asymptote `y = -2`, and passes through (4, 1)?","options":[{"t":"`y = {-2x + 9}/{x + 3}`","why":"Its vertical asymptote is `x = -3`, and at `x = 4` it gives 1/7, not 1.","_n":"2pc31","_k":"a1cb444e"},{"t":"`y = {-2x + 3}/{x - 3}`","why":"This writes `-2(x - 3)` as `-2x`, dropping the +6. `-2(x - 3) = -2x + 6`, so the top is `-2x + 6 + 3`. At `x = 4` this option gives −5.","_n":"2qc41","_k":"ef5add5c"},{"t":"`y = {-2x + 9}/{x - 3}`","why":"Start from `y = -2 + {stretch}/{x - 3}`. At `x = 4`: `-2 + stretch = 1`, so the stretch is 3. Then `y = {-2(x - 3) + 3}/{x - 3} = {-2x + 9}/{x - 3}`.","_n":"2rca5","_k":"dea36501"},{"t":"`y = {2x - 7}/{x - 3}`","why":"It passes through (4, 1) and has the right wall, but its horizontal asymptote is `y = 2`, not −2.","_n":"2scb5","_k":"5407d080"}]},"b":{"prompt":"Which equation has vertical asymptote `x = -1`, horizontal asymptote `y = 3`, and passes through (1, 2)?","options":[{"t":"`y = {3x - 2}/{x + 1}`","why":"This writes `3(x + 1)` as `3x`, dropping the +3. `3(x + 1) = 3x + 3`, so the top is `3x + 3 - 2`. At `x = 1` this option gives 1/2.","_n":"2tcc5","_k":"447601ee"},{"t":"`y = {3x + 1}/{x + 1}`","why":"Start from `y = 3 + {stretch}/{x + 1}`. At `x = 1`: `3 + stretch/2 = 2`, so the stretch is −2. Then `y = {3(x + 1) - 2}/{x + 1} = {3x + 1}/{x + 1}`.","_n":"2ucd5","_k":"c039c67f"},{"t":"`y = {3x + 1}/{x - 1}`","why":"Its vertical asymptote is `x = 1`, so (1, 2) can’t even be on it.","_n":"2vc65","_k":"987e4c3d"},{"t":"`y = {-3x + 7}/{x + 1}`","why":"It passes through (1, 2) and has the right wall, but its horizontal asymptote is `y = -3`, not 3.","_n":"2wc75","_k":"35f0e675"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"`f(x) = {ax + b}/{cx + d}`, where `c ≠ 0` and the top isn’t a multiple of the bottom. Which of these \u003cstrong>could\u003c/strong> be true?","options":[{"t":"The graph crosses its horizontal asymptote at `x = 3`.","why":"Impossible: `f(x) = a/c` would need `bc = ad`, which would make the top a multiple of the bottom.","_n":"2xc85","_k":"3fa84b99"},{"t":"`f(1) = f(5)`.","why":"Impossible: every horizontal line except the asymptote meets the graph exactly once, so two different inputs never give the same output.","_n":"2yc95","_k":"bd74ecc9"},{"t":"`f(x) \u003c 0` exactly when `2 \u003c x \u003c 5`.","why":"Possible: `y = {x - 5}/{x - 2}` does it. Its sign changes only at its `x`-intercept 5 and its wall 2, and it is negative between them.","_n":"2zc24","_k":"42467725"},{"t":"`f` has `x`-intercepts at 1 and at 4.","why":"Impossible: the top is linear, so it is 0 at only one `x`-value.","_n":"30c34","_k":"31075062"}]},"b":{"prompt":"`g(x) = {ax + b}/{cx + d}`, where `c ≠ 0` and the top isn’t a multiple of the bottom. Which of these \u003cstrong>could\u003c/strong> be true?","options":[{"t":"`g(0) = g(-6)`.","why":"Impossible: each height other than the asymptote is reached exactly once.","_n":"31d05","_k":"5e003b02"},{"t":"The graph touches the line `y = a/c` at one point.","why":"Impossible: `g(x) = a/c` would need `bc = ad`.","_n":"32cf5","_k":"35694116"},{"t":"`g(x) > 0` exactly when `-1 \u003c x \u003c 4`.","why":"Possible: `y = {x + 1}/{4 - x}` does it. Its sign changes only at −1 and 4, and it is positive between them.","_n":"33ce5","_k":"889ffab3"},{"t":"`g` has vertical asymptotes `x = 1` and `x = -1`.","why":"Impossible: the bottom is linear, so it is 0 at only one `x`-value.","_n":"34cd5","_k":"513acdf6"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"`f(x) = {2x + 3}/{x - 1}` is decreasing on `(-∞, 1)` and on `(1, ∞)`. Yet `f(0) = -3` and `f(2) = 7`. Which is the best explanation?","options":[{"t":"“`f(0)` and `f(2)` can’t be compared, because `f` is undefined at `x = 1`.”","why":"Both values exist, so they can be compared. Being undefined at `x = 1` only means the graph has a break there.","_n":"35cc5","_k":"579daeac"},{"t":"“The function is really increasing, because `f(2) > f(0)`.”","why":"On each branch it falls: for example `f(2) = 7` and `f(3) = 9/2`.","_n":"36cb5","_k":"4a64b7ee"},{"t":"“One of the values must be wrong, because a decreasing function can’t have `f(2) > f(0)`.”","why":"Both values are right: `3/(-1) = -3` and `7/1 = 7`. “Bigger `x`, smaller `y`” holds only within one branch.","_n":"37ca5","_k":"d674dfd8"},{"t":"“Decreasing describes each branch on its own. Between `x = 0` and `x = 2` sits the asymptote `x = 1`, where the graph breaks and jumps from the lower-left branch to the upper-right branch, so `f(2)` can be larger than `f(0)`.”","why":"This explains why both facts are true at once.","_n":"38c95","_k":"77c23ed0"}]},"b":{"prompt":"`g(x) = {x - 4}/{x + 2}` is increasing on `(-∞, -2)` and on `(-2, ∞)`. Yet `g(-3) = 7` and `g(0) = -2`. Which is the best explanation?","options":[{"t":"“`g(-3)` and `g(0)` can’t be compared, because `g` is undefined at `x = -2`.”","why":"Both values exist, so they can be compared.","_n":"39c85","_k":"1fba969b"},{"t":"“One of the values must be wrong, because an increasing function can’t have `g(0) \u003c g(-3)`.”","why":"Both values are right: `(-7)/(-1) = 7` and `-4/2 = -2`.","_n":"3ac75","_k":"3c041cac"},{"t":"“Increasing describes each branch on its own. Between `x = -3` and `x = 0` sits the asymptote `x = -2`, where the graph breaks and jumps from the upper-left branch to the lower-right branch, so `g(0)` can be smaller than `g(-3)`.”","why":"This explains why both facts are true at once.","_n":"3b365","_k":"23afe319"},{"t":"“The function is really decreasing, because `g(0) \u003c g(-3)`.”","why":"On each branch it rises: for example `g(0) = -2` and `g(1) = -1`.","_n":"3c375","_k":"c9528236"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `y = {3x + 2}/{x - 5}` has horizontal asymptote `y = 3`?","options":[{"t":"“As `x` gets closer to 5, `y` gets closer to 3.”","why":"Near `x = 5` the bottom is close to 0, so `y` shoots off to ±∞. Levelling off happens far away, not next to the wall.","_n":"3d345","_k":"f98a94e6"},{"t":"“When `|x|` is very large, the 2 and the −5 hardly matter, so `y ≈ 3x/x = 3`.”","why":"It names the reason: far away, only the `x`-terms count.","_n":"3e355","_k":"b9d6f3a1"},{"t":"“The horizontal asymptote is always the coefficient of `x` on top.”","why":"That rule works here only because `c = 1`. For `{3x + 2}/{2x - 5}` the asymptote is `y = 3/2`.","_n":"3f3a5","_k":"3ba2f8ad"},{"t":"“At `x = 0` the graph is at height 3.”","why":"At `x = 0`, `y = 2/(-5) = -2/5`: that’s the `y`-intercept. The asymptote is about very large `x`.","_n":"3g3b5","_k":"4509e1ab"}]},"b":{"prompt":"Which is the best explanation of why `y = {2x - 1}/{x + 3}` has horizontal asymptote `y = 2`?","options":[{"t":"“The horizontal asymptote is always the coefficient of `x` on top.”","why":"That rule works here only because `c = 1`. For `{2x - 1}/{4x + 3}` the asymptote is `y = 1/2`.","_n":"3h385","_k":"acbc2cb6"},{"t":"“At `x = 0` the graph is at height 2.”","why":"At `x = 0`, `y = -1/3`: that’s the `y`-intercept. The asymptote is about very large `x`.","_n":"3i395","_k":"9357a8ce"},{"t":"“As `x` gets closer to −3, `y` gets closer to 2.”","why":"Near `x = -3` the bottom is close to 0, so `y` shoots off to ±∞. Levelling off happens far away, not next to the wall.","_n":"3j3e5","_k":"090165cd"},{"t":"“When `|x|` is very large, the −1 and the 3 hardly matter, so `y ≈ 2x/x = 2`.”","why":"It names the reason: far away, only the `x`-terms count.","_n":"3k3f5","_k":"0ae57758"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A camera lens has focal length 5 cm. When an object is `u` cm in front of the lens (`u > 5`), its sharp image forms `v = {5u}/{u - 5}` cm behind the lens. Which statement describes the image distance?","options":[{"t":"As `u -> ∞`, `v -> 0`; as `u -> 5^{+}`, `v -> ∞`.","why":"`v -> 0` would be right for `1/u`. Here the top grows as fast as the bottom: `v ≈ 5u/u = 5`.","_n":"3l3c5","_k":"67306df1"},{"t":"As `u -> ∞`, `v -> 5`; as `u -> 5^{+}`, `v -> ∞`.","why":"Far away, `v ≈ 5u/u = 5`: a very distant object focuses about 5 cm behind the lens. Just beyond `u = 5`, the top is about 25 and the bottom is a tiny positive number, so `v` is huge.","_n":"3m3b5","_k":"6a481ec6"},{"t":"As `u -> ∞`, `v -> 5`; as `u -> 5^{+}`, `v -> -∞`.","why":"Just beyond 5, `u - 5` is a tiny \u003cstrong>positive\u003c/strong> number and `5u ≈ 25` is positive, so `v` is large and positive.","_n":"3n3e5","_k":"9e27b1a9"},{"t":"As `u -> ∞`, `v -> ∞`; as `u -> 5^{+}`, `v -> 5`.","why":"This swaps the asymptotes’ jobs. Far away `v` levels off; next to the wall it shoots up.","_n":"3o3d5","_k":"dad9d2b9"}]},"b":{"prompt":"A projector lens has focal length 8 cm. When a slide is `u` cm from the lens (`u > 8`), its sharp image forms `v = {8u}/{u - 8}` cm away. Which statement describes the image distance?","options":[{"t":"As `u -> ∞`, `v -> 0`; as `u -> 8^{+}`, `v -> ∞`.","why":"`v ≈ 8u/u = 8`, not 0.","_n":"3p385","_k":"cec11cde"},{"t":"As `u -> ∞`, `v -> 8`; as `u -> 8^{+}`, `v -> -∞`.","why":"Just beyond 8, both the top and the bottom are positive.","_n":"3q375","_k":"b60211ac"},{"t":"As `u -> ∞`, `v -> ∞`; as `u -> 8^{+}`, `v -> 8`.","why":"This swaps the asymptotes’ jobs.","_n":"3r3a5","_k":"1bd9bb89"},{"t":"As `u -> ∞`, `v -> 8`; as `u -> 8^{+}`, `v -> ∞`.","why":"Far away, `v ≈ 8u/u = 8`. Just beyond 8, the top is about 64 and the bottom is a tiny positive number.","_n":"3s395","_k":"5041098f"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"The graph of `y = {2x + 1}/{x - 3}` is translated 4 units left and 1 unit down. Which equation describes the new graph?","options":[{"t":"`y = {2x + 8}/{x + 1}`","why":"This subtracts 1 from the top only. Moving the whole graph down means subtracting 1 from the whole fraction: `{2x + 9}/{x + 1} - 1 = {x + 8}/{x + 1}`.","_n":"3t445","_k":"8d306937"},{"t":"`y = {2x + 9}/{x + 1}`","why":"This moves 4 left but forgets to move down: its horizontal asymptote is still `y = 2`.","_n":"3u435","_k":"d53bde8d"},{"t":"`y = {x}/{x - 7}`","why":"This moves the crosshair right, to (7, 1). Moving left 4 replaces `x` with `x + 4`.","_n":"3v324","_k":"fff03ab1"},{"t":"`y = {x + 8}/{x + 1}`","why":"The crosshair (3, 2) moves to (−1, 1), and the stretch, 7, doesn’t change: `y = 1 + {7}/{x + 1} = {x + 8}/{x + 1}`.","_n":"3w334","_k":"c5489dce"}]},"b":{"prompt":"The graph of `y = {3x - 1}/{x + 2}` is translated 3 units right and 2 units up. Which equation describes the new graph?","options":[{"t":"`y = {3x - 8}/{x - 1}`","why":"This adds 2 to the top only. Moving the whole graph up means adding 2 to the whole fraction: `{3x - 10}/{x - 1} + 2 = {5x - 12}/{x - 1}`.","_n":"3x344","_k":"95014ae5"},{"t":"`y = {5x + 18}/{x + 5}`","why":"This moves the crosshair left, to (−5, 5). Moving right 3 replaces `x` with `x - 3`.","_n":"3y354","_k":"8f2a826d"},{"t":"`y = {5x - 12}/{x - 1}`","why":"The crosshair (−2, 3) moves to (1, 5), and the stretch, −7, doesn’t change: `y = 5 - {7}/{x - 1} = {5x - 12}/{x - 1}`.","_n":"3z364","_k":"405b0f3e"},{"t":"`y = {3x - 10}/{x - 1}`","why":"This moves 3 right but forgets to move up: its horizontal asymptote is still `y = 3`.","_n":"40374","_k":"d0816163"}]}}]},"task":{"title":"Design to spec","summary":"Design to spec","statement":"\u003cp>Design a function `y = {ax + b}/{cx + d}` whose graph:\u003c/p>\u003cul>\u003cli>never reaches the height `y = 2` (its range is `{y ∈ ℝ | y ≠ 2}`);\u003c/li>\u003cli>crosses the `y`-axis at (0, −1);\u003c/li>\u003cli>is decreasing on each branch;\u003c/li>\u003cli>has its `x`-intercept at a whole number.\u003c/li>\u003c/ul>\u003cp>There’s more than one answer. Can you find them all?\u003c/p>","checks":["A linear-over-linear function","Range `{y ∈ ℝ | y ≠ 2}`","`y`-intercept (0, −1)","Decreasing on each branch","`x`-intercept at a whole number"],"tips":["`c` can’t be 0, and the top can’t be a multiple of the bottom (that collapses the graph to a line with a hole).","The only height a linear-over-linear graph never reaches is its horizontal asymptote, `y = a/c`. Make `a/c = 2`.","At `x = 0`, `y = b/d`. Make `b/d = -1`: `b` and `d` are opposites.","Right now the graph rises on each branch. Falling branches need a positive stretch, which means `ad - bc \u003c 0`.","The `x`-intercept is `-b/a`, which is {v} right now. Choose `b` and `a` so that it’s a whole number."],"tipsMore":{"gate":"Fix line 1 first.","d0":"Right now `d = 0`, so `x = 0` is the vertical asymptote and the graph never crosses the `y`-axis. `d` can’t be 0.","dec23":"Right now the graph rises on each branch. The `y`-intercept (0, −1) is below the level line `y = 2`. For falling branches (upper right and lower left), that point must be on the lower-left branch, so the vertical asymptote must be to its right.","a0":"Right now `a = 0`, so the top is a constant and the graph has no `x`-intercept.","empty":"Fill in all four boxes with whole numbers from −9 to 9.","same":"Same function as one you already found.","all4":"You found all four. Notice the pattern: the wall is always right of the `y`-axis and the `x`-intercept left of it. The point (0, −1) is below the level line, so on a falling graph it has to be on the lower-left branch."},"explainPrompt":"Explain why the vertical asymptote of every answer is to the right of the `y`-axis.","vocab":"Use the words horizontal asymptote, branch and corner.","success":"Your design works!","more":"There’s more than one answer. Can you find another?"},"cards":[["Linear over linear","`y = {ax + b}/{cx + d}` with `c ≠ 0` and the top not a multiple of the bottom. Its graph is `y = 1/x`, stretched and moved."],["Vertical asymptote of `{ax + b}/{cx + d}`","`x = -d/c`, where the bottom is 0. Example: `{x + 1}/{2x - 6}` has `x = 3`."],["Horizontal asymptote of `{ax + b}/{cx + d}`","`y = a/c`. Far away the constants hardly matter: `y ≈ ax/cx`. Example: `{6x - 3}/{2x + 8}` has `y = 3`."],["Intercepts","`x`-intercept: top = 0, `x = -b/a` (none if `a = 0`). `y`-intercept: `y = b/d` (none if `d = 0`)."],["Domain and range","`{x ∈ ℝ | x ≠ -d/c}` and `{y ∈ ℝ | y ≠ a/c}`. The graph never reaches its horizontal asymptote."],["Crosshair form","`y = {stretch}/{x - wall} + level`, where the wall and the level are the asymptotes’ numbers. Example: `{x + 1}/{x - 2} = {3}/{x - 2} + 1` (wall 2, level 1, stretch 3). In general the stretch is `(bc - ad)/c^2`; a negative stretch also reflects the graph in the `x`-axis."],["Which corners?","Positive stretch: upper right and lower left, decreasing on each branch. Negative stretch: upper left and lower right, increasing on each branch."],["The rectangle rule","For every point on the graph, (`x` − wall)(`y` − level) = the stretch. Example: on `y = {3}/{x - 2} + 1`, the point (5, 2) gives (3)(1) = 3."],["Next to the vertical asymptote","The graph heads to ∞ on one side and −∞ on the other. Example: `{x + 4}/{x - 2}`: as `x -> 2^{-}`, `y -> -∞`; as `x -> 2^{+}`, `y -> ∞`."],["Does the graph ever reach `y = a/c`?","Never. `{ax + b}/{cx + d} = a/c` would force `bc = ad`. Each other height is reached exactly once."],["“Decreasing on `(-∞, 2)` and on `(2, ∞)`”","True on each branch separately, not across the wall. For `{x + 4}/{x - 2}`, `f(1) = -5` but `f(3) = 7`."],["Positive and negative intervals","Split the number line at the `x`-intercept \u003cstrong>and\u003c/strong> the vertical asymptote, then test each piece. `{x + 5}/{x - 3}` is positive on `(-∞, -5) ∪ (3, ∞)`."]]}};</script>
