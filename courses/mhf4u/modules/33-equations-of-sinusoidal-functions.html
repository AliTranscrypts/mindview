mum value 1; period 3π.","_a":"bRVXDkoQHRkEGwRPDwQHAgABAlcPBAcCAAECVxUBHRkHag==","view":[-24,24,-5,3],"rings":[[3,-3]],"lines":[1],"wrong":[{"on":"k","v":1.5,"msg":"That’s period ÷ 2π. `k` = 2π ÷ 3π = 2/3."},{"on":"a","v":-4,"msg":"The amplitude is half of 1 − (−3): 2."},{"on":"c","v":2,"msg":"(1 − (−3)) ÷ 2 = 2 is the amplitude. The axis is (1 + (−3)) ÷ 2 = −1."},{"on":"d","v":[21],"msg":"Upside down: 7π/4 is a maximum, half a period after the minimum. With `a \u003c 0`, cosine starts at a minimum."},{"on":"d","v":[-3],"msg":"A start at `x = π/4` is written `(x - π/4)`."}],"hints":["With `a \u003c 0`, cosine starts at a minimum. Which clue is a minimum?","The minimum is (π/4, −3), so `d = π/4`. The axis is halfway between 1 and −3.","`c = -1`, the amplitude is 2 so `a = -2`, and `k` = 2π ÷ 3π = 2/3: `y = -2 cos[(2/3)(x - π/4)] - 1`."]},{"id":"c4","goal":[2,3,4],"form":["sin",1],"clue":"Axis `y = 4`; amplitude 3; the graph crosses its axis going down at `x = π/2` and next going up at `x = 3π/2`.","_a":"bRVHCFcQHQcaBhhMDx4FaQ==","view":[-24,24,0,8],"rings":[[6,4],[18,4]],"lines":[4],"wrong":[{"on":"d","v":[6],"msg":"Upside down: at π/2 the graph goes \u003cstrong>down\u003c/strong> through its axis. Sine with `a > 0` starts going up."},{"on":"k","v":2,"msg":"Neighbouring axis crossings are half a period apart, so the period is 2π and `k = 1`."},{"on":"d","v":[-18],"msg":"A start at 3π/2 is written `(x - 3π/2)`. −3π/2 is one period before π/2, the crossing going down, so this graph is upside down."}],"hints":["How much of a period lies between two neighbouring axis crossings?","Half a period: 3π/2 − π/2 = π, so the period is 2π and `k = 1`. Sine with `a > 0` starts on its axis going up.","The crossing going up is at 3π/2, and one period earlier is −π/2. `y = 3 sin(x + π/2) + 4` (or `d = 3π/2`)."]},{"id":"c5","goal":[2,3,4,6],"form":["sin",-1],"clue":"The graph crosses its axis going up at (−π/6, 2); the next maximum is (π/6, 5).","_a":"bRVHCFcQHRkFGwVPDB4HGARq","view":[-24,24,-3,7],"rings":[[-2,2],[2,5]],"wrong":[{"on":"ac","v":[-5,0],"msg":"The crossing point is on the axis, so `c = 2`, and the amplitude is 5 − 2 = 3."},{"on":"k","v":3,"msg":"π/3 is a quarter period, not half: the period is 4π/3 and `k = 3/2`."},{"on":"k","v":6,"msg":"π/3 is a quarter period, not the whole period."},{"on":"d","v":[-2],"msg":"Upside down: with `a \u003c 0`, sine starts on its axis going down, not up."},{"on":"d","v":[2],"msg":"That’s the maximum. With `a \u003c 0`, sine starts on its axis going down, a quarter period after the maximum."}],"hints":["How much of a period lies between a crossing going up and the next maximum?","A quarter period: π/6 − (−π/6) = π/3. So the period is 4π/3 and `k` = 2π ÷ (4π/3) = 3/2. With `a \u003c 0`, sine starts on its axis going down.","The crossing going down is half a period after the one going up: −π/6 + 2π/3 = π/2. With `c = 2` and `a = -3`: `y = -3 sin[(3/2)(x - π/2)] + 2`."]},{"id":"c6","goal":[1,2,3,4],"form":["cos",1],"clue":"A table showing one full period:\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt\">\u003cthead>\u003ctr>\u003cth scope=\"col\">`x`\u003c/th>\u003cth scope=\"col\">0\u003c/th>\u003cth scope=\"col\">π/6\u003c/th>\u003cth scope=\"col\">π/3\u003c/th>\u003cth scope=\"col\">π/2\u003c/th>\u003cth scope=\"col\">2π/3\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">`y`\u003c/th>\u003ctd>2\u003c/td>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>−1\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","_a":"bRVXDkoQHQcaBBhTFQBs","view":[-12,24,-3,7],"rings":[[0,2],[2,5],[4,2],[6,-1],[8,2]],"wrong":[{"on":"d","v":[0],"msg":"At `x = 0` the value 2 is on the axis, rising toward 5. Cosine starts at the maximum, (π/6, 5)."},{"on":"k","v":6,"msg":"From the maximum at π/6 to the minimum at π/2 is π/3, half a period. The period is 2π/3, so `k = 3`."},{"on":"a","v":6,"msg":"The amplitude is half of 5 − (−1): 3."}],"hints":["Find the maximum and the minimum in the table. Where is the maximum?","The maximum is (π/6, 5) and the minimum is (π/2, −1): `c = 2`, `a = 3`. From π/6 to π/2 is half a period, so the period is 2π/3.","`k` = 2π ÷ (2π/3) = 3, and cosine starts at the maximum: `y = 3 cos[3(x - π/6)] + 2`."]},{"id":"c7","goal":[2,3,5,6],"form":["cos",1],"clue":"`y = 2 sin[k(x - π/12)] + 3` has a maximum at (π/3, 5), and it’s the first maximum to the right of `x = π/12`. Find `k`, then write the same wave as a cosine.","_a":"bRVXDkoQHQYaBRhVFQFs","view":[-24,24,0,6],"rings":[[4,5]],"wrong":[{"on":"k","v":8,"msg":"π/3 − π/12 = π/4 is a quarter period, not the whole period."},{"on":"k","v":4,"msg":"π/4 is a quarter period, not half."},{"on":"k","v":6,"msg":"π/3 is where the maximum is, not a length. Measure from the sine’s start at π/12."},{"on":"d","v":[1],"msg":"That’s where the sine form starts. Cosine with `a > 0` starts at the maximum."},{"on":"c","v":5,"msg":"5 is the maximum value. The equation already shows the axis: `c = 3`."}],"hints":["The sine form starts going up at π/12. How much of a period lies between that start and the first maximum?","A quarter period: π/3 − π/12 = π/4. So the period is π and `k = 2`. The amplitude 2 and the axis `y = 3` come from the equation.","Cosine with `a > 0` starts at the maximum, π/3: `y = 2 cos[2(x - π/3)] + 3`."]},{"id":"c8","goal":[1,2,3,6],"form":["sin",1],"clue":"Maximum value 6 and minimum value −2. The graph passes through (0, 4) while rising, and its first maximum to the right of `x = 0` is at `x = π/6`.","_a":"bRVHCFcQHQAaBRhMCB4DaQ==","view":[-24,24,-4,8],"rings":[[0,4],[2,6]],"lines":[6,-2],"wrong":[{"on":"kd","v":[3,0],"msg":"That treats `x = 0` as the start of a cycle, but (0, 4) isn’t on the axis (`y = 2`). The wave is already part-way up at `x = 0`, so the gap to the maximum is less than a quarter period."},{"on":"kd","v":[2,0],"msg":"At `x = 0` your graph is on its axis (`y = 2`), but the clue says `y = 4` there."},{"on":"d","v":[1],"msg":"A start at `x = -π/12` is written `(x + π/12)`."}],"hints":["Find `c` and the amplitude first. Then ask: how far through its cycle is the wave at `x = 0`? Solve `4 sin θ + 2 = 4` for the angle θ, with the wave rising.","`sin θ = 1/2` while rising gives θ = π/6 at `x = 0`. The maximum is at θ = π/2, reached at `x = π/6`. So the angle grows by π/2 − π/6 = π/3 while `x` grows by π/6.","`k` = (π/3) ÷ (π/6) = 2. The angle is 0 a quarter period (π/4) before the maximum: `x` = π/6 − π/4 = −π/12. So `y = 4 sin[2(x + π/12)] + 2`."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Malik","instruction":"Malik made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":4,"task":"Write an equation, as a cosine with `a > 0`, for the wave with a maximum at (π/6, 4) and the next minimum at (π/2, −2).","steps":["The axis is halfway between the maximum and the minimum: `c` = (4 + (−2)) ÷ 2 = 1.","The amplitude is half the distance between them: `a` = (4 − (−2)) ÷ 2 = 3.","From the maximum to the next minimum is half a period, so the period is 2(π/2 − π/6) = 2π/3 and `k` = 2π ÷ (2π/3) = 3.","Cosine starts at the maximum, `x = π/6`, so the bracket is `3x - π/6`.","`y = 3 cos(3x - π/6) + 1`."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking.","Step 3 is correct: half a period is π/3.","","Step 5 writes out step 4. The mistake is earlier."],"fixes":[{"t":"The bracket is `3x + π/6`.","why":"Changing the sign doesn’t help: `3x + π/6 = 0` at `x = -π/18`, not at π/6. The real problem is the factoring: the bracket should be `3(x - π/6)`.","_n":"1kc68","_k":"c6e3bb90"},{"t":"The start π/6 goes inside a bracket that `k` multiplies: `3(x - π/6) = 3x - π/2`. So `y = 3 cos[3(x - π/6)] + 1`.","why":"Check: the maximum is where `3(x - π/6) = 0`, at `x = π/6`.","_n":"1lbb8","_k":"df346da3"},{"t":"The bracket is `x - π/6`, so `y = 3 cos(x - π/6) + 1`.","why":"That drops `k = 3`, so the period becomes 2π instead of 2π/3.","_n":"1mbc8","_k":"9e6906e4"},{"t":"Step 4 is correct as written.","why":"Malik’s graph peaks where `3x - π/6 = 0`, at `x = π/18`, not at π/6. The shift π/6 belongs inside a bracket that `k` multiplies.","_n":"1nbd8","_k":"1dc7ebcc"}],"hints":["Where does Malik’s graph have its maximum? Solve `3x - π/6 = 0`.","At `x = π/18`, not π/6. A phase shift is read only after `k` is factored out.","Step 4 is wrong. The bracket should be `3(x - π/6) = 3x - π/2`, so `y = 3 cos[3(x - π/6)] + 1`."]},{"id":"e2","goal":5,"task":"Rewrite `y = 2 sin[3(x - π/6)] - 1` as a cosine with `a > 0`.","steps":["Sine with `a > 0` starts on its axis going up, so this graph crosses its axis going up at `x = π/6`.","Cosine with `a > 0` starts at a maximum, which comes a quarter period after the sine start.","A quarter period is π/2, so the maximum is at π/6 + π/2 = 2π/3.","So `y = 2 cos[3(x - 2π/3)] - 1`."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking.","","Step 4 uses step 3’s value correctly. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct as written.","why":"Check `x = 2π/3` in the original: `2 sin[3(2π/3 - π/6)] - 1 = 2 sin(3π/2) - 1 = -3`. That’s the minimum, not the maximum.","_n":"1obc8","_k":"53f09786"},{"t":"The period is 2π/3, so a quarter period is π/6, and the maximum is at π/6 − π/6 = 0: `y = 2 cos 3x - 1`.","why":"Right size, wrong direction. `x = 0` is a quarter period \u003cstrong>before\u003c/strong> the start, where the wave is at its minimum, so this cosine graph would be upside down.","_n":"1pbb8","_k":"b8457cc4"},{"t":"The maximum is at the sine start itself, `x = π/6`, so `y = 2 cos[3(x - π/6)] - 1`.","why":"At `x = π/6` the original is on its axis (`2 sin 0 - 1 = -1`), not at its maximum. Step 2 was right: the maximum is a quarter period later.","_n":"1qba8","_k":"93ba325a"},{"t":"The period is 2π ÷ 3 = 2π/3, so a quarter period is π/6. The maximum is at π/6 + π/6 = π/3, and `y = 2 cos[3(x - π/3)] - 1`.","why":"Check: at `x = π/3` the original gives `2 sin(π/2) - 1 = 1`, its maximum.","_n":"1rb98","_k":"e8a0ae42"}],"hints":["How long is one period of this wave?","The period is 2π ÷ 3 = 2π/3, so a quarter period is (2π/3) ÷ 4 = π/6.","Step 3 is wrong. The maximum is at π/6 + π/6 = π/3: `y = 2 cos[3(x - π/3)] - 1`."]},{"id":"e3","goal":6,"task":"Do `y = -4 cos[2(x - π/2)] + 1` and `y = 4 sin[2(x - π/4)] + 1` draw the same graph?","steps":["Both have amplitude 4 and axis `y = 1`.","Both have `k = 2`, so both have period π.","The first is −cos, which starts at a minimum, so the first graph has a minimum at `x = π/2`.","The second is sin, which starts on its axis going up at `x = π/4`, so its minimum is a quarter period later, at π/4 + π/4 = π/2.","The minimums line up, so the two equations draw the same graph."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct. Keep checking.","Step 3 is correct: −cos starts at a minimum, at `x = d`.","","Step 5 follows from step 4. The mistake is earlier."],"fixes":[{"t":"After the crossing going up comes the minimum, half a period later: π/4 + π/2 = 3π/4.","why":"Half a period after a crossing going up is a crossing going down, not a minimum.","_n":"1sb88","_k":"127950f1"},{"t":"Step 4 is correct as written.","why":"At `x = π/2` the second equation gives `4 sin[2(π/2 - π/4)] + 1 = 4 sin(π/2) + 1 = 5`: a maximum, not a minimum.","_n":"1tb78","_k":"3515088d"},{"t":"A quarter period after the crossing going up comes the \u003cstrong>maximum\u003c/strong>, at π/2. The minimum is three quarters of a period after the start, at π/4 + 3π/4 = π. The minimums at π/2 and π are half a period apart, so the graphs are different: one is the other upside down.","why":"The order along a cycle is: crossing going up, maximum, crossing going down, minimum.","_n":"1ub68","_k":"83787ae6"},{"t":"A sine graph’s minimum is always at 3π/2, so the minimums are at π/2 and 3π/2.","why":"3π/2 is the minimum of `y = sin x` only. Here `k = 2` and `d = π/4` move it.","_n":"1vc58","_k":"78b9b466"}],"hints":["List the key points of a sine cycle in order, starting from the crossing going up.","Crossing going up, then the maximum a quarter period later, then the crossing going down, then the minimum. The period here is π.","Step 4 is wrong. The second graph has its maximum at π/2 and its minimum at π, so the minimums don’t line up: the graphs are different."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the Gallery: how many equations did you find for one wave, and what did they have in common?"},{"id":"j2","q":"In your own words, why can one graph have more than one correct equation? Use the words period and starting point."},{"id":"j3","q":"Explain to a friend, step by step, how to write an equation from a maximum and the next minimum, without a calculator."},{"id":"j4","q":"Which step do you still slip on: the amplitude, the period, factoring out `k`, or choosing the starting point? What check will you use next time to catch it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A sinusoidal graph has maximum value 7 and minimum value −3. What are its amplitude and its axis?","options":[{"t":"Amplitude 10; axis `y = 2`","why":"10 is the whole distance from the minimum to the maximum. The amplitude is half of it.","_n":"1wc48","_k":"24b008b6"},{"t":"Amplitude 5; axis `y = 2`","why":"The amplitude is half of 7 − (−3) = 10, which is 5. The axis is halfway: (7 + (−3)) ÷ 2 = 2.","_n":"1x378","_k":"85879881"},{"t":"Amplitude 7; axis `y = 0`","why":"That uses the maximum as the amplitude and leaves the axis at 0. The axis is halfway between 7 and −3.","_n":"1y388","_k":"80048098"},{"t":"Amplitude 5; axis `y = 5`","why":"(7 − (−3)) ÷ 2 = 5 is the amplitude. The axis uses a sum: (7 + (−3)) ÷ 2 = 2.","_n":"1z398","_k":"1be7a1de"}]},"b":{"prompt":"A sinusoidal graph has maximum value 4 and minimum value −6. What are its amplitude and its axis?","options":[{"t":"Amplitude 10; axis `y = -1`","why":"10 is max − min. The amplitude is half of it.","_n":"203a8","_k":"0a9d0621"},{"t":"Amplitude 5; axis `y = -1`","why":"Half of 4 − (−6) = 10 is 5. The axis is (4 + (−6)) ÷ 2 = −1.","_n":"21338","_k":"70e932fd"},{"t":"Amplitude 5; axis `y = 5`","why":"5 is the amplitude. The axis is (4 + (−6)) ÷ 2 = −1.","_n":"22348","_k":"cf1d0f62"},{"t":"Amplitude 4; axis `y = 0`","why":"That uses the maximum as the amplitude and leaves the axis at 0.","_n":"23358","_k":"923dd8b2"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Two neighbouring maximums of a sinusoidal graph are at `x = π/6` and `x = 5π/6`. What is `k` (with `k > 0`) in `y = a sin[k(x - d)] + c`?","options":[{"t":"3","why":"Neighbouring maximums are one period apart: 5π/6 − π/6 = 2π/3. So `k` = 2π ÷ (2π/3) = 3.","_n":"24368","_k":"6feb1f55"},{"t":"`3/2`","why":"That treats the gap between neighbouring maximums as half a period. Neighbouring maximums are a whole period apart.","_n":"253f8","_k":"8b682a9b"},{"t":"`2π/3`","why":"2π/3 is the period. `k` = 2π ÷ period.","_n":"26408","_k":"cba2bdf3"},{"t":"`1/3`","why":"That’s period ÷ 2π: the formula turned upside down.","_n":"27416","_k":"1e2e831d"}]},"b":{"prompt":"Two neighbouring minimums of a sinusoidal graph are at `x = -π/4` and `x = 3π/4`. What is `k` (with `k > 0`) in `y = a cos[k(x - d)] + c`?","options":[{"t":"1","why":"That treats the gap as half a period. Neighbouring minimums are a whole period apart.","_n":"28406","_k":"f169cf93"},{"t":"`π`","why":"π is the period, not `k`.","_n":"29436","_k":"596dc9e9"},{"t":"`1/2`","why":"That’s period ÷ 2π: the formula turned upside down.","_n":"2a426","_k":"aa1a14c4"},{"t":"2","why":"The period is 3π/4 − (−π/4) = π, so `k` = 2π ÷ π = 2.","_n":"2b456","_k":"967c4f63"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"You want to write a graph’s equation as `y = a cos[k(x - d)] + c` with `a > 0`. Which kind of point on the graph gives `d`?","options":[{"t":"A maximum","why":"`cos 0 = 1`, so a cosine graph with `a > 0` is at its highest point when `x = d`.","_n":"2c446","_k":"de242073"},{"t":"A point where the graph crosses its axis going up","why":"That’s where a sine graph with `a > 0` starts.","_n":"2d476","_k":"40ebacec"},{"t":"The point where the graph crosses the `y`-axis","why":"The `y`-intercept is a start only if it happens to be a maximum. `d` is the `x`-coordinate of a maximum.","_n":"2e466","_k":"6d7ed8b4"},{"t":"A minimum","why":"A minimum is the start when `a \u003c 0`.","_n":"2f396","_k":"4e7eee4d"}]},"b":{"prompt":"You want to write a graph’s equation as `y = a sin[k(x - d)] + c` with `a \u003c 0`. Which kind of point on the graph gives `d`?","options":[{"t":"A maximum","why":"A maximum is where cosine with `a > 0` starts.","_n":"2g386","_k":"9bcba91d"},{"t":"A minimum","why":"A minimum is where cosine with `a \u003c 0` starts.","_n":"2hbb6","_k":"64951b17"},{"t":"A point where the graph crosses its axis going down","why":"`-sin θ` is 0 and decreasing at θ = 0, so this graph crosses its axis going down at `x = d`.","_n":"2ibc6","_k":"bffab408"},{"t":"A point where the graph crosses its axis going up","why":"That’s the start when `a > 0`.","_n":"2jb96","_k":"300f8aa2"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Which equation draws the same graph as `y = 2 sin[2(x - π/3)] + 1`?","options":[{"t":"`y = 2 cos[2(x - 5π/6)] + 1`","why":"That moves the start by π/2, which is half a period here: at 5π/6 the wave crosses its axis going down. A quarter period is π ÷ 4 = π/4.","_n":"2kba6","_k":"a44e17d3"},{"t":"`y = 2 cos[2(x - 7π/12)] + 1`","why":"The sine version starts going up at π/3. The period is π, so the maximum is a quarter period (π/4) later, at π/3 + π/4 = 7π/12, and that’s where cosine starts.","_n":"2lb76","_k":"40571d2d"},{"t":"`y = 2 cos[2(x - π/3)] + 1`","why":"Sine and cosine don’t start at the same point. This cosine graph peaks at π/3, where the wave is only on its axis: it’s a quarter period too early.","_n":"2mb86","_k":"b8eb9e30"},{"t":"`y = 2 cos[2(x - π/12)] + 1`","why":"That moves a quarter period the wrong way: `x = π/12` is a minimum of this wave, so this graph is upside down.","_n":"2nb56","_k":"7ff538fa"}]},"b":{"prompt":"Which equation draws the same graph as `y = 3 cos[2(x - π/4)] - 1`?","options":[{"t":"`y = 3 sin[2(x + π/4)] - 1`","why":"That moves the start back π/2, which is half a period here: −π/4 is a minimum of the wave. A quarter period is π ÷ 4 = π/4.","_n":"2ob66","_k":"a1b05adc"},{"t":"`y = 3 sin 2x - 1`","why":"The maximum is at π/4. The period is π, so the sine start is a quarter period (π/4) earlier, at 0.","_n":"2pc36","_k":"cf50b90a"},{"t":"`y = 3 sin[2(x - π/4)] - 1`","why":"Sine and cosine don’t start at the same point. This sine graph is on its axis at π/4, where the wave has its maximum: it’s a quarter period too late.","_n":"2qc46","_k":"25e640b3"},{"t":"`y = 3 sin[2(x - π/2)] - 1`","why":"That moves a quarter period the wrong way: at π/2 the wave crosses its axis going down, so this graph is upside down.","_n":"2r40e","_k":"8089c778"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A sinusoidal function has a minimum at (π/2, −1), and its next maximum is at (5π/4, 5). Which equation is correct?","options":[{"t":"`y = 3 cos[(4/3)(x - 5π/4)] + 2`","why":"Axis (5 + (−1)) ÷ 2 = 2, amplitude 3. Minimum to the next maximum is half a period, 3π/4, so the period is 3π/2 and `k` = 2π ÷ (3π/2) = 4/3. Cosine with `a > 0` starts at the maximum, 5π/4.","_n":"2s41e","_k":"7534eb3b"},{"t":"`y = 3 cos[(4/3)(x - π/2)] + 2`","why":"That starts cosine at the minimum. With `a > 0`, cosine starts at a maximum.","_n":"2t3ee","_k":"3ce878a2"},{"t":"`y = 3 cos[(8/3)(x - 5π/4)] + 2`","why":"That takes 3π/4 as the whole period. From a minimum to the next maximum is only half a period.","_n":"2u3fe","_k":"4f279db4"},{"t":"`y = 3 cos[(4/3)(x + 5π/4)] + 2`","why":"A start at `x = 5π/4` is written `(x - 5π/4)`.","_n":"2v44e","_k":"79beec68"}]},"b":{"prompt":"A sinusoidal function has a minimum at (π/4, −5), and its next maximum is at (7π/4, 1). Which equation is correct?","options":[{"t":"`y = 3 cos[(2/3)(x + 7π/4)] - 2`","why":"A start at `x = 7π/4` is written `(x - 7π/4)`.","_n":"2w45e","_k":"729eba48"},{"t":"`y = 3 cos[(4/3)(x - 7π/4)] - 2`","why":"That takes 3π/2 as the whole period.","_n":"2x42e","_k":"6dc81300"},{"t":"`y = 3 cos[(2/3)(x - 7π/4)] - 2`","why":"Axis −2, amplitude 3. Minimum to the next maximum is half a period, 3π/2, so the period is 3π and `k = 2/3`. Cosine with `a > 0` starts at the maximum, 7π/4.","_n":"2y43e","_k":"2aa9197b"},{"t":"`y = 3 cos[(2/3)(x - π/4)] - 2`","why":"That starts cosine at the minimum.","_n":"2z38e","_k":"cc52b29d"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"`y = 4 sin[k(x - π/12)] + 1` has its first maximum to the right of `x = π/12` at `x = π/3`. What is `k`?","options":[{"t":"`1/2`","why":"That’s period ÷ 2π: the formula turned upside down.","_n":"3039e","_k":"0aaf6d11"},{"t":"2","why":"The sine graph starts going up at π/12, and its first maximum is a quarter period later: π/3 − π/12 = π/4. So the period is π and `k = 2`.","_n":"3146f","_k":"3daeb8e8"},{"t":"4","why":"That treats π/4 as half a period. From the start to the first maximum is a quarter period.","_n":"3245f","_k":"5aaf9473"},{"t":"8","why":"That treats π/4 as the whole period.","_n":"3348f","_k":"828f21d7"}]},"b":{"prompt":"`y = 3 cos[k(x - π/6)] - 2` first crosses its axis to the right of `x = π/6` at `x = π/3`. What is `k`?","options":[{"t":"`1/3`","why":"That’s period ÷ 2π: the formula turned upside down.","_n":"3447f","_k":"3f0a958f"},{"t":"3","why":"The cosine graph starts at a maximum at π/6, and the next axis crossing is a quarter period later: π/3 − π/6 = π/6. So the period is 2π/3 and `k = 3`.","_n":"3542f","_k":"8c09f5b8"},{"t":"6","why":"That treats π/6 as half a period.","_n":"3641f","_k":"d50bb2e3"},{"t":"12","why":"That treats π/6 as the whole period.","_n":"3744f","_k":"3f3dd3cf"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Two students write different equations for the same graph: `y = 2 sin(x - π/2)` and `y = -2 cos x`. Which statement is best?","options":[{"t":"“They draw different graphs, because one has a phase shift and the other doesn’t.”","why":"A different `d` can still give the same graph when the form changes too.","_n":"3843f","_k":"e0a32687"},{"t":"“Both are correct. `y = 2 sin(x - π/2)` starts going up at `x = π/2`, a quarter period after its minimum at `x = 0`, and `y = -2 cos x` starts at that same minimum. The two equations draw the same graph.”","why":"This compares the starting points on one cycle, which is how you decide.","_n":"393ef","_k":"de2021d6"},{"t":"“Only one of them can be correct, because a graph has exactly one equation.”","why":"One graph has many equations: `sin(x - π/2) = -cos x` for every `x`.","_n":"3a3df","_k":"c477dea4"},{"t":"“Both are correct, because both equal −2 at `x = 0`.”","why":"The conclusion is right, but one shared point proves nothing: many different waves pass through (0, −2).","_n":"3bb4e","_k":"81cb3f3d"}]},"b":{"prompt":"Two students write different equations for the same graph: `y = 3 cos[2(x - π/4)]` and `y = 3 sin 2x`. Which statement is best?","options":[{"t":"“Both are correct. `y = 3 sin 2x` starts going up at `x = 0` and reaches its maximum a quarter period (π/4) later, at `x = π/4`, which is where the cosine version starts. The two equations draw the same graph.”","why":"This compares the starting points on one cycle, which is how you decide.","_n":"3cb5e","_k":"04703f8e"},{"t":"“Both are correct, because both equal 0 at `x = 0`.”","why":"The conclusion is right, but one shared point proves nothing: many different waves pass through (0, 0).","_n":"3db6e","_k":"2e8ec811"},{"t":"“They draw different graphs, because one has a phase shift and the other doesn’t.”","why":"A different `d` can still give the same graph when the form changes too.","_n":"3eb7e","_k":"bdac129d"},{"t":"“Only one of them can be correct, because a graph has exactly one equation.”","why":"`cos[2(x - π/4)] = sin 2x` for every `x`.","_n":"3fb0e","_k":"5951afb5"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"A wave has `k = 2` and a phase shift of π/6 to the right. Which equation shows this correctly?","options":[{"t":"`y = sin(2x - π/6)`","why":"`2x - π/6 = 2(x - π/12)`: that’s a shift of only π/12.","_n":"3gb1e","_k":"845f7041"},{"t":"`y = sin[2(x - π/6)]`","why":"With `k` factored out, the bracket `(x - π/6)` shows a shift of π/6 to the right.","_n":"3hb2e","_k":"2951929e"},{"t":"`y = sin[2(x + π/6)]`","why":"`(x + π/6)` shifts the graph left.","_n":"3ib3e","_k":"e3256255"},{"t":"`y = sin 2x - π/6`","why":"Outside the bracket, − π/6 moves the graph down, not right.","_n":"3jbce","_k":"997a973a"}]},"b":{"prompt":"A wave has `k = 3` and a phase shift of π/4 to the left. Which equation shows this correctly?","options":[{"t":"`y = cos 3x + π/4`","why":"Outside the bracket, + π/4 moves the graph up.","_n":"3kbde","_k":"0358d214"},{"t":"`y = cos(3x + π/4)`","why":"`3x + π/4 = 3(x + π/12)`: that’s a shift of only π/12.","_n":"3l3ae","_k":"688fe2f5"},{"t":"`y = cos[3(x - π/4)]`","why":"`(x - π/4)` shifts the graph right.","_n":"3m39e","_k":"f61b0998"},{"t":"`y = cos[3(x + π/4)]`","why":"With `k` factored out, `(x + π/4)` shows a shift of π/4 to the left.","_n":"3n38e","_k":"d291a06d"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A buoy rises and falls on the waves. Its highest point, 9 m above the sea floor, comes at `t` = 1 s, and its next lowest point, 5 m above the sea floor, comes at `t` = 4 s. Which equation gives its height `h`, in metres, after `t` seconds?","options":[{"t":"`h = 4 cos[(π/3)(t - 1)] + 7`","why":"4 m is the whole rise from lowest to highest. The amplitude is half of it.","_n":"3o37e","_k":"6b5125d0"},{"t":"`h = 2 cos[(π/3)(t - 1)] + 7`","why":"Axis (9 + 5) ÷ 2 = 7, amplitude 2. Highest to next lowest is half a period, 3 s, so the period is 6 s and `k` = 2π ÷ 6 = π/3. Cosine starts at the highest point, `t = 1`.","_n":"3p36e","_k":"9d2eda99"},{"t":"`h = 2 cos[(2π/3)(t - 1)] + 7`","why":"That takes 3 s as the whole period. Highest to next lowest is only half a period.","_n":"3q35e","_k":"fb5ac510"},{"t":"`h = 2 cos[(π/3)(t - 4)] + 7`","why":"That starts the cosine at the lowest point. With `a > 0`, cosine starts at the highest point.","_n":"3r34e","_k":"d4ea74ba"}]},"b":{"prompt":"A piston moves up and down. Its highest position, 12 cm, comes at `t` = 0.5 s, and its next lowest, 4 cm, comes at `t` = 1.5 s. Which equation gives its height `h`, in centimetres, after `t` seconds?","options":[{"t":"`h = 4 cos[π(t - 0.5)] + 8`","why":"Axis 8, amplitude 4. Highest to next lowest is half a period, 1 s, so the period is 2 s and `k` = 2π ÷ 2 = π. Cosine starts at the highest point, `t = 0.5`.","_n":"3s33e","_k":"40931f5b"},{"t":"`h = 4 cos[2π(t - 0.5)] + 8`","why":"That takes 1 s as the whole period.","_n":"3t42e","_k":"67816bcb"},{"t":"`h = 8 cos[π(t - 0.5)] + 8`","why":"8 cm is the whole rise. The amplitude is half of it.","_n":"3u41e","_k":"d36092ad"},{"t":"`h = 4 cos[π(t - 1.5)] + 8`","why":"That starts the cosine at the lowest point.","_n":"3vc8e","_k":"28a30652"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"This table shows one full period of a sinusoidal function, including its maximum and its minimum. Which equation fits?\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt\">\u003cthead>\u003ctr>\u003cth scope=\"col\">`x`\u003c/th>\u003cth scope=\"col\">0\u003c/th>\u003cth scope=\"col\">π/3\u003c/th>\u003cth scope=\"col\">2π/3\u003c/th>\u003cth scope=\"col\">π\u003c/th>\u003cth scope=\"col\">4π/3\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">`y`\u003c/th>\u003ctd>1\u003c/td>\u003ctd>4\u003c/td>\u003ctd>1\u003c/td>\u003ctd>−2\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[{"t":"`y = 3 cos(3x/2) + 1`","why":"Cosine starts at a maximum, but at `x = 0` the table is on the axis. This equation gives 4 at `x = 0`.","_n":"3wc9e","_k":"7628a1ca"},{"t":"`y = 3 sin(3x/2) + 1`","why":"Axis 1, amplitude 3. From the maximum at π/3 to the minimum at π is half a period, 2π/3, so the period is 4π/3 and `k = 3/2`. At `x = 0` the value 1 is on the axis and rising toward 4: a sine start with `d = 0`.","_n":"3xc6e","_k":"2fde0321"},{"t":"`y = 3 sin 3x + 1`","why":"That takes 2π/3, the gap from the maximum to the minimum, as the whole period. It gives 1, not 4, at `x = π/3`.","_n":"3yc7e","_k":"b86676be"},{"t":"`y = 4 sin(3x/2)`","why":"That uses the maximum as the amplitude and puts the axis at 0. It gives 0, not 1, at `x = 0`.","_n":"3zc4e","_k":"53aceaa2"}]},"b":{"prompt":"This table shows one full period of a sinusoidal function, including its maximum and its minimum. Which equation fits?\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt\">\u003cthead>\u003ctr>\u003cth scope=\"col\">`x`\u003c/th>\u003cth scope=\"col\">0\u003c/th>\u003cth scope=\"col\">π/3\u003c/th>\u003cth scope=\"col\">2π/3\u003c/th>\u003cth scope=\"col\">π\u003c/th>\u003cth scope=\"col\">4π/3\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">`y`\u003c/th>\u003ctd>5\u003c/td>\u003ctd>2\u003c/td>\u003ctd>−1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[{"t":"`y = 3 cos 3x + 2`","why":"That takes 2π/3 as the whole period. It gives −1, not 2, at `x = π/3`.","_n":"40c5e","_k":"c09fc800"},{"t":"`y = 5 cos(3x/2)`","why":"That uses the maximum as the amplitude and puts the axis at 0. It gives 0, not 2, at `x = π/3`.","_n":"41c2e","_k":"c335afca"},{"t":"`y = 3 cos(3x/2) + 2`","why":"Axis 2, amplitude 3. From the maximum at 0 to the minimum at 2π/3 is half a period, so the period is 4π/3 and `k = 3/2`. The maximum is at `x = 0`: a cosine start with `d = 0`.","_n":"42c3e","_k":"ab39208b"},{"t":"`y = 3 sin(3x/2) + 2`","why":"Sine starts on the axis, but at `x = 0` the table shows the maximum, 5. This equation gives 2 there.","_n":"43c0e","_k":"d5855fd6"}]}}]},"task":{"title":"One wave, four clues","summary":"One wave, four clues","statement":"\u003cp>Build an equation for a wave that fits all four clues. (1) Its maximum value is 5 and its minimum value is −1. (2) It has a maximum at `x = π/3`. (3) Its graph passes through (0, 2). (4) Its period is at least π. There’s more than one correct equation. How many can you find?\u003c/p>","checks":["Maximum value 5 and minimum value −1","A maximum at `x = π/3`","Passes through (0, 2)","Period at least π"],"tips":["Right now your graph runs from {min} to {max}. The axis is halfway between 5 and −1, and the amplitude is half the gap.","At `x = π/3` your graph is at {v}, not at its maximum. Make `x = π/3` a start for cosine with `a > 0`, or put a sine start a quarter period before it.","At `x = 0` your graph gives {v}. The axis is `y = 2`, so (0, 2) is on the axis: `x = 0` must be a place where the wave crosses its axis.","Your period is {P}, shorter than π. From an axis crossing to a maximum is one quarter of a period, or three quarters, or five quarters… Which choice makes the period at least π?"],"explainPrompt":"Explain how the clues told you the period, and why your equation passes through (0, 2).","vocab":"Use the words axis, quarter period and maximum.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","ui":{"caption":"Your equation","fill":"Fill in every box: `a`, `k`, `d` and `c`.","bracket":"at least π","forms":"You’ve written the same wave as sin, cos, −sin and −cos. Each start is a quarter period (π/3) after the one before: sin at 0, cos at π/3, −sin at 2π/3, −cos at π.","all":"You found all 13 with `-2π ≤ d ≤ 2π`. Outside that range there are infinitely many more.","whyT":"Why does this work?","why":"Clue 1 gives `c = 2` and `|a|
