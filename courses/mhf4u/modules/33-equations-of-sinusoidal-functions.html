.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 33: hero, "Read the wave" layout and controls, equation builder, Gallery board, cycle ruler, Match the wave, clues, task */
.hero .hero-eq.md{font-size:clamp(1.55rem,4.6vw,2.9rem);font-style:normal}
.hero-or{display:block;font-size:.55em;margin-top:.35em}
.hero-fig figcaption .m{white-space:normal}
.hero-list{display:grid;gap:2px;font-size:.86em}
.hero-done{font:700 1rem var(--font-ui);margin-top:6px}

.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 12px}
.ctl-lab{font-weight:700;font-size:.9rem;min-width:6.5em}
.rchips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rchips button{border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:.25em .75em;font:400 1.1rem var(--font-math);min-height:40px;min-width:44px}
.rchips button[aria-checked="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.rchips button:disabled{opacity:.55}
.sx-md button{font:700 .95rem var(--font-ui)}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--info-bg);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.92rem}
.tog{border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .8em;min-height:40px;font-weight:700;font-size:.92rem}
.tog-a{border-color:var(--acol)}.tog-k{border-color:var(--p-k)}.tog-c{border-color:var(--p-c)}.tog-d{border-color:var(--p-d)}
.tog-a[aria-pressed="true"]{background:var(--acol);color:var(--sheet)}
.tog-k[aria-pressed="true"]{background:var(--p-k);color:var(--sheet)}
.tog-c[aria-pressed="true"]{background:var(--p-c);color:var(--sheet)}
.tog-d[aria-pressed="true"]{background:var(--p-d);color:var(--sheet)}
.tog:disabled{opacity:.6}
.ctl-slide{margin:0 0 12px}
.ctl-slide label{font-weight:700}
.ctl-slide output{font:600 1.25rem var(--font-math)}
.sl-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.sl-row input[type=range]{flex:1 1 auto;min-width:0;height:44px;accent-color:var(--p-d)}
.sqb{min-width:40px;min-height:40px;padding:0;font-size:1.2rem;font-weight:700;line-height:1}
.st-good{color:var(--green);font-weight:700}

.sx-main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"g r" "c r";gap:14px 28px;align-items:start}
.sx-g{grid-area:g;min-width:0}.sx-r{grid-area:r;min-width:0}.sx-c{grid-area:c;min-width:0}
.sx-cap{font-size:clamp(1.25rem,3vw,1.75rem)}
.sx-note{min-height:1.4em;margin:6px 0 0;font-size:.92rem}
.sx-err{min-height:1.2em;margin:6px 0 0;color:var(--red);font-weight:700;font-size:.92rem}
.sx-bl{margin:4px 0 6px}
.sx-r .read dd .m{white-space:normal}
.sx-board{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.bd-wrap{margin-top:8px}
table.bd{border-collapse:collapse;min-width:100%}
table.bd th,table.bd td{border-bottom:1px solid var(--rule);padding:4px}
table.bd tbody th{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--sheet);padding-right:10px;z-index:1;font:400 1.05rem var(--font-math)}
.bd-sub{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
.bd-c{width:100%;min-width:76px;min-height:52px;border:1.5px dashed var(--rule);background:var(--paper);border-radius:6px;font-size:.95rem;color:var(--ink)}
.bd-c.found{border:1.5px solid var(--p-d);background:var(--good-bg)}
.bd-c.drop{animation:bddrop .3s ease-out}
@keyframes bddrop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

.bld{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px;font-size:1.1rem}
.bld-l{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.bld .m{font-size:1.15em}
.bld-g{display:inline-flex;align-items:center;gap:6px}
.bld-fx{font-size:1.2em}
.fx{display:inline-flex;align-items:center;gap:2px;border:2px solid var(--rule);border-radius:8px;padding:2px 4px;background:var(--sheet)}
.fx-a{border-color:var(--acol)}.fx-k{border-color:var(--p-k)}.fx-d{border-color:var(--p-d)}.fx-c{border-color:var(--p-c)}
.fx-sg{min-width:30px;min-height:44px;border:0;background:var(--paper);color:var(--ink);border-radius:6px;font:700 1.2rem var(--font-math);padding:0}
.fx-n{width:3.2rem;height:48px;border:1.5px solid var(--rule);border-radius:6px;font:400 1.15rem var(--font-math);text-align:center;background:var(--sheet);color:var(--ink);padding:0 2px}

.fx-sl{font:400 1.1rem var(--font-math);padding:0 1px}
.fx-den{height:44px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1.05rem var(--font-math);padding:0 2px}

.rw-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.rw-g,.rw-p{min-width:0}
.rw-cap{font-size:clamp(1.15rem,2.8vw,1.55rem)}
.ruler{position:relative;height:98px;margin-top:4px}
.rl-bar{position:absolute;top:8px;height:4px;background:var(--p-k);border-radius:2px;opacity:.55}
.rl-t{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;padding:16px 2px 4px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:.75rem;line-height:1.15}
span.rl-t{border-style:dashed}
.rl-t.rl-s{border-color:var(--p-d)}
.rl-t.on{border:2px solid var(--green);background:var(--good-bg)}
.rl-t:disabled{opacity:1}
.rl-ic{font-size:1rem;font-weight:700}
.rl-lab{font-weight:700;max-width:52px;text-align:center}
.rl-v{font:400 .95rem var(--font-math);min-height:1.3em}

.rl-cap{margin:6px 0 0;font-size:.95rem}
.r2-eqs p{margin:0 0 4px;font-size:1.1rem}

.r2-q{margin:0 0 6px;font-weight:700}
.r2-a{margin:0}
.r2-steps .chip{min-height:40px}

.mw-sel{position:sticky;top:44px;z-index:3;background:var(--sheet)}
.mw-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.mw-th{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;border:2px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:6px;min-width:0}

.mw-tag{font-weight:700;font-size:.85rem}
.mw-eqd{font-size:.9rem;min-height:0}

.mw-h{margin:16px 0 6px;color:var(--ink-2);font-size:.85rem}
.mw-eqs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.mw-eq .m{white-space:normal}
.mw-eq.on{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.mw-eq.done{border-color:var(--green);background:var(--good-bg)}
.mw-l{font-weight:700;margin-right:4px}
.mw-to{font-weight:700}

.cl .pred-q{font-weight:400}
.cl .tbl-wrap{margin-top:8px}
.tk-cl{margin:10px 0 2px}
.tk-cap{font-size:clamp(1.2rem,3vw,1.6rem)}

@media (max-width:820px){

  .ctl-lab{min-width:0}
}

ons","title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"674a9214","content":{"id":"33-equations-of-sinusoidal-functions","kind":"topic","title":"Equations of sinusoidal functions","topic":"Equations of Sinusoidal Functions","readyTopic":"equations of sinusoidal functions","hero":{"eq":"`y = @a{a} sin[@k{k}(x - @d{d})] + @c{c}`\u003cspan class=\"hero-or\">or `y = @a{a} cos[@k{k}(x - @d{d})] + @c{c}`\u003c/span>","eqLabel":"y equals a sine of k times x minus d, plus c; or y equals a cosine of k times x minus d, plus c","eqSize":"md","headline":"One wave, many right equations","text":"Every sinusoidal graph can be described by four numbers. The \u003cstrong>axis\u003c/strong> `y = c` sits halfway between the maximum and the minimum. The \u003cstrong>amplitude\u003c/strong> `|a|` is half the distance between them. The \u003cstrong>period\u003c/strong> gives `k` = 2π ÷ period. A \u003cstrong>starting point\u003c/strong> on the wave gives the \u003cstrong>phase shift\u003c/strong> `d`. Choose a different starting point, or switch between sine and cosine, and you get a different equation for the very same graph.","fig":{"aria":"The wave y = 3 sin[2(x − π/6)] + 1 with its axis y = 1, amplitude 3, period π, and four starting flags: an axis crossing going up at π/6, a maximum at 5π/12, an axis crossing going down at 2π/3 and a minimum at 11π/12","shape":"","labels":{"axis":"axis *y* = 1","amp":"3","per":"period π","done":"Same wave, four of its names."}}},"goals":["I can find the axis `y = c` and the amplitude `|a|` of a sinusoidal graph from its maximum and minimum values.","I can find the period from a graph, a table or a description (neighbouring maximums, or twice the distance from a maximum to the next minimum) and find `k` = 2π ÷ period.","I can choose the right starting point for each form (a maximum for cosine, an axis crossing going up for sine, and the opposite points when `a` is negative) and read the phase shift `d` from it.","I can write an equation `y = a sin[k(x - d)] + c` or `y = a cos[k(x - d)] + c` for a sinusoidal function given its graph, a table or a description of its properties.","I can explain why one graph has many correct equations, and rewrite an equation in another form (sine or cosine, positive or negative `a`, a different `d`) that draws the same graph.","I can decide whether two equations, or an equation and a set of clues, describe the same wave, and work backwards from clues to a missing value such as `k`."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Reading a sinusoidal equation","goal":2,"prompt":"What is the period of `y = 4 sin[3(x - π/6)] - 2`?","options":[{"t":"`6π`","why":"Multiplying by 3 would stretch the wave. A larger `k` squeezes it, so divide: 2π ÷ 3.","_n":"0e7b","_k":"bd00016f"},{"t":"`π/6`","why":"π/6 is the phase shift `d`. The period depends only on `k`.","_n":"1e6b","_k":"f74948cb"},{"t":"3","why":"3 is `k`, the number of cycles that fit in 2π. One cycle is 2π ÷ 3 long.","_n":"2e5b","_k":"8dbe1073"},{"t":"`2π/3`","why":"The period is 2π ÷ `k` = 2π ÷ 3 = 2π/3.","_n":"3ecb","_k":"5a4e19ff"}],"hints":["The period is the length of one full cycle. Which parameter controls it?","For `y = a sin[k(x - d)] + c`, the period is 2π ÷ `k`. Here `k = 3`.","2π ÷ 3 = 2π/3."]},{"id":"w2","skill":"Reading a sinusoidal equation","goal":1,"prompt":"What is the maximum value of `y = -3 cos 2x + 5`?","options":[{"t":"2","why":"5 + (−3) = 2 is the minimum. The amplitude is `|a| = 3`, so the wave reaches 3 above the axis as well as 3 below it.","_n":"4ebb","_k":"a3d3d0da"},{"t":"3","why":"3 is the amplitude: how far the maximum is above the axis.","_n":"5eab","_k":"27bdb164"},{"t":"5","why":"`y = 5` is the axis, the middle of the wave.","_n":"6e9b","_k":"5771127b"},{"t":"8","why":"The axis is `y = 5` and the amplitude is `|-3| = 3`, so the maximum is 5 + 3 = 8. The negative sign only changes \u003cem>where\u003c/em> the maximum happens.","_n":"7e0b","_k":"b5716aac"}],"hints":["Find the axis `y = c` and the amplitude `|a|`.","`c = 5` and `|a| = |-3| = 3`. The maximum is the axis plus the amplitude.","5 + 3 = 8."]},{"id":"w3","skill":"Key points of sine and cosine","goal":3,"prompt":"On `0 ≤ x ≤ 2π`, where does the graph of `y = sin x` cross the `x`-axis going \u003cstrong>down\u003c/strong>?","options":[{"t":"`x = 0`","why":"At `x = 0`, `sin x` is increasing: the graph crosses going \u003cstrong>up\u003c/strong>. That’s where sine starts.","_n":"8dfb","_k":"7d1406a9"},{"t":"`x = π`","why":"`sin x` rises from 0 to 1 at π/2, then falls back to 0 at π, crossing the axis on the way down.","_n":"94b7","_k":"4df773a4"},{"t":"`x = 3π/2`","why":"At 3π/2, `sin x = -1`, its minimum.","_n":"a4c7","_k":"9832a81e"},{"t":"`x = π/2`","why":"At π/2, `sin x = 1`, its maximum. It isn’t crossing the axis there.","_n":"b497","_k":"93c4f45f"}],"hints":["`sin x` is the height of the point on the unit circle at angle `x`. Where is that height 0?","The height is 0 at 0, π and 2π. At which of these is the point moving downward?","Just after π/2 the height falls from 1 to 0 at π: the crossing going down is at `x = π`."]},{"id":"w4","skill":"Phase shift and factoring","goal":3,"prompt":"Compared with `y = cos 2x`, the graph of `y = cos[2(x - π/4)]` is translated …","options":[{"t":"π/8 to the right","why":"That’s `y = cos(2x - π/4) = cos[2(x - π/8)]`. Here `k` is already factored out, so the shift is π/4.","_n":"c4a7","_k":"29596c96"},{"t":"π/2 to the right","why":"The 2 multiplies the whole bracket `(x - π/4)`, so the shift is π/4, not 2 × π/4.","_n":"d477","_k":"c5f4d027"},{"t":"π/4 to the right","why":"`x - π/4` inside the bracket moves every point π/4 right: the maximum at `x = 0` moves to where `2(x - π/4) = 0`, at `x = π/4`.","_n":"e487","_k":"91e4f352"},{"t":"π/4 to the left","why":"`x - π/4` moves right. Check: the maximum is where `2(x - π/4) = 0`, at `x = π/4`.","_n":"f457","_k":"1b8bf037"}],"hints":["Where does `y = cos 2x` have a maximum? Where does the new graph have it?","`y = cos 2x` has a maximum at `x = 0`. The new graph has one where `2(x - π/4) = 0`.","That’s `x = π/4`: the graph moved π/4 to the right."]},{"id":"w5","skill":"Phase shift and factoring","goal":3,"prompt":"Write `y = sin(3x + 3π/4)` in the form `y = sin[k(x - d)]`.","options":[{"t":"`y = sin(x + π/4)`","why":"Dividing the whole inside by 3 changes the wave: `sin(x + π/4)` has period 2π, not 2π/3. Factor the 3 out instead: `3x + 3π/4 = 3(x + π/4)`.","_n":"g467","_k":"944de391"},{"t":"`y = sin[3(x + π/4)]`","why":"Factor 3 out of both terms: `3x + 3π/4 = 3(x + π/4)`. So `d = -π/4`: a shift of π/4 to the left.","_n":"h437","_k":"b8b1a19c"},{"t":"`y = sin[3(x + 3π/4)]`","why":"`3(x + 3π/4) = 3x + 9π/4`, not `3x + 3π/4`. Divide 3π/4 by 3.","_n":"i447","_k":"4e10f285"},{"t":"`y = sin[3(x - π/4)]`","why":"`3(x - π/4) = 3x - 3π/4`. Factoring doesn’t change the sign: `3x + 3π/4 = 3(x + π/4)`.","_n":"jc57","_k":"1e3a5552"}],"hints":["Factor the 3 out of `3x + 3π/4`.","`3x + 3π/4 = 3(x + ?)`. What number times 3 gives 3π/4?","3π/4 ÷ 3 = π/4, so `3x + 3π/4 = 3(x + π/4)` and `y = sin[3(x + π/4)]`."]},{"id":"w6","skill":"Equivalent expressions","goal":5,"prompt":"Which expression equals `-sin x` for every `x`?","options":[{"t":"`sin(x + π/2)`","why":"`sin(x + π/2) = cos x`. Check `x = 0`: `sin(π/2) = 1`, but `-sin 0 = 0`.","_n":"kc47","_k":"998c8d82"},{"t":"`cos(x - π/2)`","why":"`cos(x - π/2) = sin x`. Check `x = π/2`: `cos 0 = 1`, but `-sin(π/2) = -1`.","_n":"lc37","_k":"bf74633e"},{"t":"`cos(x + π/2)`","why":"Sliding the cosine graph left by π/2 moves it one step round the cycle `sin x → cos x → -sin x → -cos x`. Check `x = π/2`: `cos π = -1 = -sin(π/2)`.","_n":"mc27","_k":"b304ef69"},{"t":"`cos(x + π)`","why":"A half-period slide only flips cosine: `cos(x + π) = -cos x`.","_n":"nc97","_k":"092ad432"}],"hints":["Test one value. At `x = π/2`, `-sin x = -1`. Which options give −1 there?","At `x = π/2`: `cos(π) = -1`, `cos 0 = 1`, `cos(3π/2) = 0` and `sin π = 0`. Only one option gives −1. Test it at a second value to be sure.","`cos(x + π/2)`: at `x = 0` it gives `cos(π/2) = 0 = -sin 0`, and at `x = π/2` it gives −1. It’s the cosine graph slid left by π/2, which is `-sin x` for every `x`."]}],"refreshers":{"Reading a sinusoidal equation":"In `y = a sin[k(x - d)] + c` (or cos), the axis is `y = c` and the amplitude is `|a|`. The maximum is `c + |a|`, the minimum is `c - |a|`, the period is 2π ÷ `k` (with `k > 0`) and the phase shift is `d`. Example: `y = -3 cos 2x + 5` has axis `y = 5`, amplitude 3, maximum 8, minimum 2 and period π.","Key points of sine and cosine":"Over one period, `y = sin x` is on its axis going up at 0, at its maximum at π/2, on its axis going down at π, at its minimum at 3π/2, and back on its axis at 2π. `y = cos x` is at its maximum at 0, on its axis going down at π/2, at its minimum at π, on its axis going up at 3π/2, and at its maximum again at 2π. The key points are a quarter period apart.","Phase shift and factoring":"Read the phase shift only after `k` is factored out of the bracket. `y = sin(3x + π/2) = sin[3(x + π/6)]` is shifted π/6 left. `(x - d)` means a shift right by `d`; `(x + d)` means left. In `y = cos[2(x - π/3)]`, the maximum moves from 0 to π/3.","Equivalent expressions":"Sliding a graph left by π/2 moves one step round the cycle `sin x → cos x → -sin x → -cos x`, so `sin(x + π/2) = cos x` and `cos(x + π/2) = -sin x`. Sliding by π only changes the sign. To test a claim, try one or two values of `x`: if the two sides disagree anywhere, they aren’t equal."}}},"explore":{"heading":"Read the wave","intro":"The dashed wave is a mystery. Tap its key points to measure it, build an equation, and draw your equation on top. Then switch to Gallery and find every other equation that draws the very same wave.","chalIntro":"Commit first: build your equation in Read mode, then press \u003cstrong>Check challenge\u003c/strong>. Your curve, the gap and the status line appear only when you check. Each challenge has three levels of help.","ui":{"modes":["Read","Gallery"],"mode":"Mode","wave":"Wave","waveNames":{"A":"Wave A","B":"Wave B","C":"Wave C","D":"Wave D","E":"Wave E (hidden)"},"tools":["Axis","Amplitude","Period"],"toolsLab":"Measuring tools","clear":"Clear markers","draw":"Draw my equation","check":"Check challenge","reset":"Reset","build":"Your equation","base":"Base","flag":"Start flag `@d{d}`","showAll":"Show all starts","tapFar":"Tap closer to a peak, a trough or a point where the wave crosses its axis.","tapMax":"You can place up to 3 markers. Tap a marker to remove it, or press Clear markers.","tapHidden":"Hidden wave: work from the two points.","kNeg":"In this module `k` is positive. (A negative `k` flips the graph in the `y`-axis and gives yet another correct equation; see module 27.)","empty":"Fill in `a`, `k`, `d` and `c`, then press Draw my equation.","aZero":"`a` can’t be 0.","numRange":"Use a numerator from 0 to 12 for `a` and `c`, from 1 to 12 for `k`, and from 0 to 24 for `d`.","dRange":"Keep `d` between −2π and 2π.","read":["Wave","Markers","Axis (`@c{c}`)","Amplitude (`|@a{a}|`)","Period","`@k{k}`","Your equation","Largest gap","Status"],"types":{"max":"Maximum","min":"Minimum","up":"Axis crossing ↑","down":"Axis crossing ↓"},"words":{"max":"maximum","min":"minimum","up":"axis crossing going up","down":"axis crossing going down"},"noMarks":"None yet. Tap a peak, a trough or an axis crossing.","axisMM":"{y}, halfway between {max} and {min}: {calc}","axisX":"{y}, the height of an axis crossing","axisNeed":"Mark a maximum and a minimum.","ampMM":"{v}, half the distance from {min} up to {max}: {calc}","ampXmax":"{v}, the distance from the axis {axis} up to the maximum {max}","ampXmin":"{v}, the distance from the minimum {min} up to the axis {axis}","ampNeed":"Mark a maximum and a minimum.","ampNeedX":"Mark a maximum or a minimum too.","per":"{P}: the {t1} at {x1} and the {t2} at {x2} are {rel} apart ({dist})","perNeed":"Mark a maximum and the next minimum, or two neighbouring maximums.","rel":{"1":"one period","2":"half a period","4":"a quarter period"},"kRow":"{k} = 2π ÷ {P}","kNeed":"Needs the period.","perBr":{"1":"period","2":"half a period","4":"a quarter period"},"notDrawn":"Press Draw my equation to compare.","commit":"Appears when you press Check challenge.","hidden":"Work these out from your markers","st":{"period":"Different period: your graph repeats every {yp}; the wave repeats every {wp}. Check `k`.","height":"Different height: your graph runs from {ymin} to {ymax}; the wave runs from {wmin} to {wmax}. Check `a` and `c`.","upside":"Upside down: your graph has a maximum where the wave has a minimum. Change the sign of `a`, or move `d` by half a period ({h}).","slid":"Right shape, slid sideways: slide your graph {dir} by {s} to land. Check `d`.","match":"✓ Same wave: your equation draws it at every `x`.","added":"✓ Same wave. Added to the gallery.","already":"✓ Same wave. Already in the gallery.","right":"right","left":"left"},"lock":"Challenge {n} is open: Read mode, {w}.","leave":"Leave challenge","galLock":"Waves B–D join the Gallery after Challenges 1 and 2.","gread":["Base","Start","Equation","The wave at `x = d`","Status","Gallery"],"bases":{"sin":"sin with `a > 0`: starts on the axis going up","cos":"cos with `a > 0`: starts at a maximum","nsin":"−sin with `a \u003c 0`: starts on the axis going down","ncos":"−cos with `a \u003c 0`: starts at a minimum"},"at":{"max":"a maximum, {pt}","min":"a minimum, {pt}","up":"on its axis, going up","down":"on its axis, going down","between":"between key points: {dir}, {side} its axis, at {y}","rising":"rising","falling":"falling","above":"above","below":"below"},"count":"{n} of {N} found for wave {w} (`-2π ≤ d ≤ 2π`)","board":"The Gallery board","boardIntro":"Every equation you land in Gallery mode fills a slot. Filling the board is optional.","rows":[["sin","on the axis going up"],["cos","at a maximum"],["−sin","on the axis going down"],["−cos","at a minimum"]],"notTaken":"not found yet","noteTwo":"These starts differ by a whole number of periods (one period is {P}). Sliding by whole periods lands the wave on itself.","noteRows":"Going down the rows, each start comes a quarter period ({Q}) after the one above: axis going up → maximum → axis going down → minimum.","noteFull":"You found all {N}. And there are more outside `-2π ≤ d ≤ 2π`: one wave has infinitely many equations of this kind.","tc3pts":["maximum (π/6, 2)","axis crossing (π/2, −1)"],"p3arrow":"π/4: a quarter period","galLine":"Gallery: {n}/16 equations found for wave A","changed":{"p1":"The bracket doubled: the period is 2π/3, and k = 3.","p2":"The flag moved to 17π/12, and the graph landed on the wave again.","p3":"The graph slid right by π/4. Then the flag moved back to π/6, and the sine graph landed.","p4":"The flag moved half a period, to the minimum at 11π/12, and the graph landed."}},"predictions":[{"id":"p1","start":{"mode":"read","wave":"B","marks":[2,6],"tools":[1,1,0],"hidePeriod":true},"prompt":"The maximum is at `x = π/6` and the next minimum is at `x = π/2`. What is the period of wave B?","options":[{"t":"`π/3`","_n":"oc87","_k":"2742ef62"},{"t":"`π/2`","_n":"pc77","_k":"60704f16"},{"t":"`2π/3`","_n":"qc67","_k":"e305b3a1"},{"t":"`4π/3`","_n":"rbd7","_k":"3e11e160"}],"fixedOrder":true,"explain":"From a maximum down to the next minimum, the wave does only half a cycle. So the period is 2 × (π/2 − π/6) = 2 × π/3 = 2π/3, and `k` = 2π ÷ (2π/3) = 3. (π/3 is only half the period; π/2 is where the minimum is, not a length; 4π/3 treats the maximum-to-minimum gap as a quarter of a cycle.)"},{"id":"p2","start":{"mode":"gallery","wave":"A","base":"cos","d":5},"prompt":"The flag is on the maximum at `x = 5π/12`. If it moves to the next maximum, at `x = 17π/12`, what will the graph of the new equation do?","options":[{"t":"It no longer lands on the wave: it sits one period (π) to the right of it","_n":"sbc7","_k":"05463886"},{"t":"It lands on the wave again","_n":"tbf7","_k":"5f26d3e7"},{"t":"It stretches to twice the period","_n":"uc07","_k":"04187698"},{"t":"It turns upside down","_n":"vc17","_k":"ecb6f612"}],"explain":"Sliding a wave by exactly one period puts every peak where the next peak was, so the graph doesn’t change. `d = 5π/12` and `d = 5π/12 + π = 17π/12` draw the same graph, and so does `d = 5π/12 + nπ` for any whole number `n`. It does move one period to the right, but a wave moved one period lands exactly on itself."},{"id":"p3","start":{"mode":"gallery","wave":"A","base":"cos","d":5},"prompt":"Now switch the base from cos to sin and keep `d = 5π/12`. What happens to the graph?","options":[{"t":"It slides left by a quarter period, π/4","_n":"wc27","_k":"5b9bb84c"},{"t":"Nothing: it still lands on the wave","_n":"xc37","_k":"38b98ce2"},{"t":"It slides right by a quarter period, π/4","_n":"yc47","_k":"c0111883"},{"t":"It slides right by π/2","_n":"zc57","_k":"b1c536c2"}],"explain":"Sine starts on its axis going up; cosine starts at a maximum. With the same `d`, the sine graph reaches its maximum a quarter period later. Here the period is π, so a quarter period is π/4. (π/2 is a quarter of 2π, the period of `y = sin x`; with `k = 2` a slide of π/2 is half a period, which would turn the wave upside down.) To keep the same wave with sine, move `d` back a quarter period: 5π/12 − π/4 = π/6."},{"id":"p4","start":{"mode":"gallery","wave":"A","base":"ncos","d":5},"prompt":"The base is −cos, so the equation is `y = -3 cos[2(x - d)] + 1`. Where must the flag go for this graph to land on the wave?","options":[{"t":"On a maximum, where it is now","_n":"10c67","_k":"475902d6"},{"t":"Nowhere: a negative `a` always leaves the graph upside down","_n":"11b77","_k":"dd5477b9"},{"t":"On a minimum","_n":"12b87","_k":"278ba21e"},{"t":"On an axis crossing going down","_n":"13c98","_k":"3fc11067"}],"explain":"−cos θ is −1 when θ = 0, so `y = -3 cos[2(x - d)] + 1` is at its lowest point at `x = d`. Put `d` on a minimum. Turning a wave upside down is the same as sliding it half a period, so a negative `a` never stops you from matching. It only changes which key point you start from."}],"challenges":[{"id":"tc1","goal":[1,2,3,4],"wave":"B","form":["cos",1],"prompt":"Wave B. Write it as `y = a cos[k(x - d)] + c` with `a > 0`.","why":"Any start one period (2π/3) away works too.","form_msg":"This challenge asks for cosine with `a > 0`.","named":[{"on":"k","v":6,"msg":"Your period is π/3: that’s the distance from a maximum to the next minimum, which is half a period. The wave’s period is 2π/3, so `k = 3`."},{"on":"k","v":0.3333333333333333,"msg":"1/3 is period ÷ 2π: the formula turned upside down. `k` = 2π ÷ period = 2π ÷ (2π/3) = 3."},{"on":"ac","v":[5,0],"msg":"Your graph runs from −5 to 5: the maximum was used as the amplitude. Find the axis first, `c` = (5 + 1) ÷ 2 = 3; then `a` = 5 − 3 = 2."},{"on":"a","v":4,"msg":"Your graph runs from −1 to 7. The amplitude is half of 5 − 1, so `a = 2`."},{"on":"ac","v":[2,0],"msg":"Your graph’s axis is `y = 0`. The wave’s axis is halfway between 5 and 1: `c = 3`."},{"on":"d","v":[0],"msg":"`x = 0` is where the wave crosses its axis going up. That’s where a sine graph starts; a cosine graph with `a > 0` starts at a maximum."},{"on":"d","v":[-2],"msg":"Upside down: this cosine graph peaks at `x = -π/6`, where the wave has a minimum. A start at `x = π/6` is written `(x - π/6)`."},{"on":"d","v":[6],"msg":"Upside down: `x = π/2` is a minimum. With `a > 0`, cosine starts at a maximum."}],"hints":["Mark a maximum and the next minimum. The axis is halfway between their `y`-values, and the amplitude is half the gap.","`c` = (5 + 1) ÷ 2 = 3 and `a` = (5 − 1) ÷ 2 = 2. From the maximum at π/6 to the minimum at π/2 is half a period: π/3.","The period is 2π/3, so `k = 3`. Cosine starts at the maximum, so `d = π/6`: `y = 2 cos[3(x - π/6)] + 3`."]},{"id":"tc2","goal":[1,2,3,4],"wave":"D","form":["sin",-1],"prompt":"Wave D. Write it as `y = a sin[k(x - d)] + c` with `a \u003c 0`.","why":"With `a \u003c 0`, sine starts on the axis going down.","form_msg":"This challenge asks for sine with `a \u003c 0`.","named":[{"on":"k","v":2,"msg":"From the maximum at π/3 to the minimum at 4π/3 is π, which is half a period. The period is 2π, so `k = 1`."},{"on":"ac","v":[-5,0.5],"msg":"Your graph runs from −9/2 to 11/2. The amplitude is half of 3 − (−2): 5/2."},{"on":"ac","v":[-3,0],"msg":"Your graph runs from −3 to 3: the maximum was used as the amplitude, and the axis was left at 0. `c` = (3 + (−2)) ÷ 2 = 1/2, so the amplitude is 3 − 1/2 = 5/2."},{"on":"c","v":2.5,"msg":"That’s (3 − (−2)) ÷ 2, the amplitude. The axis is (3 + (−2)) ÷ 2 = 1/2."},{"on":"d","v":[-2,22],"msg":"Upside down: at `x = -π/6` the wave crosses its axis going \u003cstrong>up\u003c/strong>. With `a \u003c 0`, sine starts on the axis going down."},{"on":"d","v":[4,-20],"msg":"`x = π/3` is the maximum. With `a \u003c 0`, sine starts on the axis going down, a quarter period (π/2) after the maximum."}],"hints":["With `a \u003c 0`, does a sine graph start going up or going down through its axis?","Going down. On wave D that’s halfway between the maximum at π/3 and the minimum at 4π/3.","(π/3 + 4π/3) ÷ 2 = 5π/6. With `c = 1/2`, `a = -5/2` and `k = 1`: `y = -(5/2) sin(x - 5π/6) + 1/2`."]},{"id":"tc3","goal":[1,2,3,6],"wave":"E","form":["sin",1],"stretch":true,"prompt":"Commit first. Wave E is hidden. You know only two points: its maximum (π/6, 2), and (π/2, −1), the next point where it crosses its axis. Write it as `y = a sin[k(x - d)] + c` with `a > 0`. The wave appears after your first Check.","why":"","form_msg":"This challenge asks for sine with `a > 0`.","named":[{"on":"k","v":6,"msg":"π/2 − π/6 = π/3 is the gap from the maximum to the next axis crossing. That’s a quarter period, not a whole one."},{"on":"k","v":3,"msg":"π/3 is a quarter period, not half. The period is 4 × π/3 = 4π/3, so `k` = 2π ÷ (4π/3) = 3/2."},{"on":"a","v":2,"msg":"The second point is on the axis, so the axis is `y = -1`. The amplitude is 2 − (−1) = 3."},{"on":"c","v":0,"msg":"The second point is on the axis, so the axis is `y = -1`. The amplitude is 2 − (−1) = 3."},{"on":"d","v":[6],"msg":"Upside down: the crossing at π/2 comes right after the maximum, so the wave is going down there. With `a > 0`, sine starts on the axis going up, half a period earlier: π/2 − 2π/3 = −π/6."},{"on":"d","v":[2],"msg":"Your sine graph starts at `x = π/6`, which is the maximum. Sine starts on its axis a quarter period before the maximum: π/6 − π/3 = −π/6, written `(x + π/6)`."},{"on":"d","v":[-4],"msg":"You moved back π/2 from the maximum. A quarter period here is π/3, the gap from the maximum to the crossing, so the start is π/6 − π/3 = −π/6."}],"hints":["The second point is on the axis: what does that tell you about `c`? And how much of a cycle lies between a maximum and the next axis crossing?","`c = -1`, so the amplitude is 3. From the maximum to the next crossing is a quarter period: π/2 − π/6 = π/3. So the period is 4π/3 and `k` = 2π ÷ (4π/3) = 3/2.","Sine (with `a > 0`) starts a quarter period before the maximum: π/6 − π/3 = −π/6. So `y = 3 sin[(3/2)(x + π/6)] - 1`."]}],"blocks":[{"title":"Reading a wave, in four steps","html":"\u003col>\u003cli>\u003cstrong>Axis:\u003c/strong> `c` = (max + min) ÷ 2.\u003c/li>\u003cli>\u003cstrong>Amplitude:\u003c/strong> `|a|` = (max − min) ÷ 2.\u003c/li>\u003cli>\u003cstrong>Period:\u003c/strong> the distance between neighbouring maximums, or twice the distance from a maximum to the next minimum. Then `k` = 2π ÷ period.\u003c/li>\u003cli>\u003cstrong>Start:\u003c/strong> choose a form and find its starting point: cos at a maximum, sin on the axis going up, −cos at a minimum, −sin on the axis going down. `d` is that point’s `x`-coordinate. A start one period earlier or later works just as well.\u003c/li>\u003c/ol>"}]},"part3":{"slug":"rewrite","name":"Rewrite","heading":"Many right answers","intro":"Start from an equation, not a graph. Use the cycle ruler to find where another form starts, work out its `d`, then check it with algebra.","ui":{"r1":"Round 1: Rewrite it","r1intro":"One equation at a time. The ruler under the graph spans one period of the given wave.","r2":"Round 2: Same graph? The three checks","r2intro":"For each pair, answer the three checks in order, then give your verdict. The overlay runs only after your verdict.","given":"Given","item":"Rewrite {n} of 4","step1":"Step 1: Tap the tick where the new form starts.","step2":"Step 2: Enter `@d{d}` for the new form.","check":"Check `d`","prev":"Previous","next":"Next equation","ticks":["start","+¼","+½","+¾","+1 period"],"tickSay":["start","plus a quarter period","plus half a period","plus three quarters of a period","plus one period"],"kp":{"max":"maximum","min":"minimum","up":"axis crossing going up","down":"axis crossing going down"},"quarter":"Quarter period = (2π ÷ `@k{k}`) ÷ 4 = {q}","tickRight":"✓ Right tick: {what}.","empty":"Enter a numerator for `d` first.","dRange":"Use a numerator from 0 to 24.","outRange":"That works, but keep `d` between −2π and 2π: add or subtract a period.","solved":"✓ Correct: {eq}","notFirst":"(not first try)","alg":"Check it with algebra","lands":"Your equation draws the same graph.","pair":"Pair {n} of 2","checks":["Same maximum and minimum?","Same period?","Do the starting points line up?","Your verdict"],"chips":[["Yes","No"],["Yes","No"],["Same key point","Different key point"],["Same graph","Different graph"]],"drop":"The second equation’s start, `x` = {x}, lands on the {tick} tick of the first ruler: {what} of the first wave.","overlay":"Overlay: largest gap {g}.","rewriteLine":"Rewrite it (first try): {f}/4","checksLine":"The three checks, verdict (first try): {f}/2"},"rewrites":[{"id":"r1","goal":[3,5],"view":[-6,18,-3,5],"given":["sin",3,2,2,1],"form":["cos",1],"target":"Rewrite as a \u003cstrong>cosine\u003c/strong> with `a > 0`.","_a":"Bw==","tickFb":["That’s where this sine form starts, on its axis going up. Cosine with `a > 0` starts at a maximum.","","That’s a crossing going down: −sin starts there.","That’s a minimum: −cos starts there.","That’s the next crossing going up: another start for sine."],"wrongD":[{"n":8,"msg":"You added π/2. The period is 2π ÷ 2 = π, so a quarter period is π/4. 2π/3 is the crossing going down."},{"n":-1,"msg":"You went back a quarter period, to a minimum: your cosine would be upside down. The maximum comes a quarter period \u003cstrong>after\u003c/strong> the sine start."},{"n":2,"msg":"Sine and cosine don’t start at the same point: cosine’s start is a quarter period later."}],"hints":["Cosine with `a > 0` starts at a maximum. Which tick is the maximum?","The maximum is a quarter period after the sine start. The period is 2π ÷ 2 = π, so a quarter period is π/4.","`d` = π/6 + π/4 = 5π/12, so `y = 3 cos[2(x - 5π/12)] + 1`."],"alg":"`sin θ = cos(θ - π/2)` for every θ (module 27). With `θ = 2(x - π/6)`: `3 sin[2(x - π/6)] + 1 = 3 cos[2(x - π/6) - π/2] + 1`. Factor out the 2: `2(x - π/6) - π/2 = 2(x - π/6 - π/4) = 2(x - 5π/12)`. So `y = 3 cos[2(x - 5π/12)] + 1`. The π/2 inside became π/4 outside: π/2 ÷ `k`, a quarter period."},{"id":"r2","goal":[3,5],"view":[-4,12,0,6],"given":["cos",2,3,2,3],"form":["sin",1],"target":"Rewrite as a \u003cstrong>sine\u003c/strong> with `a > 0`.","_a":"BQ==","tickFb":["That’s the maximum, where this cosine form starts.","That’s the crossing going \u003cstrong>down\u003c/strong>, where −sin starts. Sine with `a > 0` starts going up.","That’s a minimum.","","That’s the next maximum."],"wrongD":[{"n":4,"msg":"π/3 is a quarter period \u003cstrong>after\u003c/strong> the maximum: the crossing going down. Your sine graph would be upside down."},{"n":-4,"msg":"You went back π/2. The period is 2π/3, so a quarter period is π/6: the sine start is π/6 − π/6 = 0. (−π/3 is a crossing going down, so this graph is upside down.)"},{"n":2,"msg":"Sine and cosine don’t start at the same point."}],"hints":["Sine with `a > 0` starts on its axis going up. On this ruler, which tick is that?","It’s the +¾ tick, which is the same as a quarter period \u003cstrong>before\u003c/strong> the maximum. The period is 2π ÷ 3 = 2π/3, so a quarter period is π/6.","`d` = π/6 − π/6 = 0 (or π/6 + 3 × π/6 = 2π/3, one period later). So `y = 2 sin 3x + 3`."],"alg":"`cos θ = sin(θ + π/2)`. With `θ = 3(x - π/6)`: `2 cos[3(x - π/6)] + 3 = 2 sin[3(x - π/6) + π/2] + 3`. Factor out the 3: `3(x - π/6) + π/2 = 3(x - π/6 + π/6) = 3x`. So `y = 2 sin 3x + 3`. The sine start is a quarter period (π/6) \u003cstrong>before\u003c/strong> the maximum, which is the same point as three quarters of a period after it."},{"id":"r3","goal":[3,5],"view":[-24,60,-4,2],"given":["sin",2,0.5,4,-1],"form":["sin",-1],"target":"Rewrite as a \u003cstrong>sine\u003c/strong> with `a \u003c 0`.","_a":"BA==","tickFb":["That’s where this form starts, going up. With `a \u003c 0`, sine starts going down.","That’s the maximum, where cos starts.","","That’s the minimum, where −cos starts.","That’s the next crossing going up."],"wrongD":[{"n":16,"msg":"You added π. The period is 2π ÷ (1/2) = 4π, so half a period is 2π. 4π/3 is the maximum."},{"n":4,"msg":"With the same `d`, a negative `a` just turns the original upside down."}],"hints":["With `a \u003c 0`, sine starts on its axis going down. Which tick is that?","Half a period after the start. The period is 2π ÷ (1/2) = 4π, so half a period is 2π: π/3 + 2π = 7π/3.","7π/3 is more than 2π, so subtract a period: 7π/3 − 4π = −5π/3. `y = -2 sin[(1/2)(x + 5π/3)] - 1`."],"alg":"`sin θ = -sin(θ - π)` (a half-period slide flips the sign). With `θ = (1/2)(x - π/3)`: `2 sin[(1/2)(x - π/3)] - 1 = -2 sin[(1/2)(x - π/3) - π] - 1`. Factor out 1/2: `(1/2)(x - π/3) - π = (1/2)(x - π/3 - 2π) = (1/2)(x - 7π/3)`. The period is 4π, so `d` = 7π/3 − 4π = −5π/3 also works: `y = -2 sin[(1/2)(x + 5π/3)] - 1`."},{"id":"r4","goal":[3,5],"view":[-3,21,-2,6],"given":["cos",-3,2,3,2],"form":["sin",1],"target":"Rewrite as a \u003cstrong>sine\u003c/strong> with `a > 0`.","_a":"Bw==","tickFb":["That’s the minimum, where this −cos form starts.","","That’s the maximum, where cos starts.","That’s the crossing going down, where −sin starts.","That’s the next minimum."],"wrongD":[{"n":0,"msg":"You went back a quarter period: `x = 0` is a crossing going \u003cstrong>down\u003c/strong>, so your sine graph would be upside down."},{"n":9,"msg":"You added π/2, which is half a period here: 3π/4 is the maximum. A quarter period is (2π ÷ 2) ÷ 4 = π/4."},{"n":3,"msg":"Starting sine at the minimum puts it a quarter period early."}],"hints":["This −cos form starts at a minimum. Where along a cycle does sine with `a > 0` start, compared with a minimum?","After a minimum the wave rises through its axis a quarter period later: the +¼ tick. The period is 2π ÷ 2 = π, so a quarter period is π/4.","`d` = π/4 + π/4 = π/2, so `y = 3 sin[2(x - π/2)] + 2`."],"alg":"`-cos θ = sin(θ - π/2)`. With `θ = 2(x - π/4)`: `-3 cos[2(x - π/4)] + 2 = 3 sin[2(x - π/4) - π/2] + 2 = 3 sin[2(x - π/4 - π/4)] + 2 = 3 sin[2(x - π/2)] + 2`."}],"pairs":[{"id":"pr1","goal":[5,6],"view":[-6,18,-3,5],"eqs":[["sin",3,2,2,1],["cos",-3,2,11,1]],"_a":"bQcYURUCHQRr","facts":["Both have amplitude 3 and axis `y = 1`.","Both have `k = 2`, so both have period π.","−cos starts at a minimum, and on the first ruler (start π/6, quarter period π/4) the minimum is at +¾ = π/6 + 3π/4 = 11π/12.","Same height, same period, and the −cos start lands exactly on the first wave’s minimum."]},{"id":"pr2","goal":[5,6],"view":[-4,12,0,6],"eqs":[["cos",2,3,2,3],["sin",2,3,4,3]],"_a":"bQcYURUDHQVr","facts":["Both have amplitude 2 and axis `y = 3`.","Both have `k = 3`, so both have period 2π/3.","The sine start at π/3 lands on the +¼ tick of the cosine ruler, which is a crossing going \u003cstrong>down\u003c/strong>.","The sine version starts going up at π/3, but the first wave goes down there: the second graph is the first one upside down. The sine start is a quarter period \u003cstrong>before\u003c/strong> the maximum: π/6 − π/6 = 0."]}],"blocks":[{"title":"What the rule means","html":"\u003cp>\u003cstrong>Rewriting a sinusoidal equation\u003c/strong>\u003c/p>\u003col>\u003cli>Keep `|a|`, `k` and `c`: the height, the axis and the period don’t change.\u003c/li>\u003cli>Along one cycle the starts come in this order, a quarter period apart: sin (axis, going up) → cos (maximum) → −sin (axis, going down) → −cos (minimum) → back to sin.\u003c/li>\u003cli>A quarter period is (2π ÷ `k`) ÷ 4 = `π/(2k)`. It equals π/2 only when `k = 1`.\u003c/li>\u003cli>Adding or subtracting whole periods to `d` never changes the graph.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>The algebra behind it:\u003c/strong> `sin θ = cos(θ - π/2)`, `cos θ = sin(θ + π/2)` and `sin θ = -sin(θ - π)`. Put `θ = k(x - d)`, then factor `k` back out: `k(x - d) - π/2 = k(x - d - π/(2k))`.\u003c/p>"}],"quickCheck":{"title":"Same graph?","summary":"Same graph? quick check","items":[{"id":"q1","goal":[5,6],"prompt":"`y = 3 cos[2(x - π/3)] + 1` and `y = 3 cos[2(x - 4π/3)] + 1`","choices":[{"t":"Same graph","fb":"Right. Same amplitude, axis and period (π), and the values of `d` differ by π, exactly one period.","_n":"14c88","_k":"f1ffca5a"},{"t":"Different: one is slid sideways","fb":"They are π apart, but π is one whole period here, so the wave lands on itself.","_n":"15cb8","_k":"1fd9834e"},{"t":"Different: the periods differ","fb":"Both have `k = 2`, so both have period π.","_n":"16ca8","_k":"01d958d2"},{"t":"Different: the heights differ","fb":"Both have amplitude 3 and axis `y = 1`.","_n":"17c58","_k":"be577847"}]},{"id":"q2","goal":[5,6],"prompt":"`y = 2 sin 3x` and `y = 2 cos[3(x - π/2)]`","choices":[{"t":"Same graph","fb":"Check `x = π/6`: `2 sin(π/2) = 2`, but `2 cos[3(π/6 - π/2)] = 2 cos(-π) = -2`.","_n":"18c48","_k":"e934c3fd"},{"t":"Different: one is slid sideways","fb":"Right. Cosine’s start comes a quarter period after sine’s, and a quarter period here is π/6, not π/2. With `d = π/2`, the cosine graph peaks at π/2, where `2 sin 3x` has a minimum: slid half a period.","_n":"19c78","_k":"5a4c3a74"},{"t":"Different: the periods differ","fb":"Both have `k = 3`.","_n":"1ac68","_k":"01b61e8e"},{"t":"Different: the heights differ","fb":"Both have amplitude 2 and axis `y = 0`.","_n":"1bc18","_k":"a1054ede"}]},{"id":"q3","goal":[5,6],"prompt":"`y = 4 sin[(1/2)(x - π)] - 1` and `y = -4 cos(x/2) - 1`","choices":[{"t":"Same graph","fb":"Right. The period is 4π, so a quarter period is π. The sine version starts going up at `x = π`, so its minimum is a quarter period earlier, at `x = 0`, which is exactly where −cos starts.","_n":"1cc08","_k":"b9284c01"},{"t":"Different: one is slid sideways","fb":"The starts do line up: the sine version’s minimum is at π − π = 0, where the −cos version starts. Test `x = 0`: both give −5.","_n":"1dc38","_k":"77b5b016"},{"t":"Different: the periods differ","fb":"`x/2` means `(1/2)x`, so both have `k = 1/2` and period 4π.","_n":"1ec48","_k":"83b89578"},{"t":"Different: the heights differ","fb":"Both have amplitude 4 and axis `y = -1`.","_n":"1fc18","_k":"1eb007d2"}]},{"id":"q4","goal":[5,6],"prompt":"`y = 2 cos(2x - π/3) + 1` and `y = 2 cos[2(x - π/3)] + 1`","choices":[{"t":"Same graph","fb":"The first isn’t factored: `2x - π/3 = 2(x - π/6)`, a phase shift of π/6, not π/3.","_n":"1gc28","_k":"145f3630"},{"t":"Different: one is slid sideways","fb":"Right. Factor the first: `2x - π/3 = 2(x - π/6)`, so its maximum is at π/6, while the second’s is at π/3. They’re π/6 apart, which isn’t a whole period (π).","_n":"1hc78","_k":"2541c8a1"},{"t":"Different: the periods differ","fb":"Both have `k = 2`.","_n":"1ic88","_k":"a65e9418"},{"t":"Different: the heights differ","fb":"Both have amplitude 2 and axis `y = 1`.","_n":"1jc58","_k":"1fc00f32"}]}]}},"practice":{"activities":[{"id":"match","type":"custom","title":"Match the wave","summary":"Match the wave","instruction":"Match each graph with the equation that draws it.","how":"Tap a graph, then tap its equation.","goal":[3,4,5],"ui":{"graph":"Graph","graphs":"Graphs","eqs":"Equations","sel":"Selected","pick":"Tap a graph first, then tap its equation.","done":"All matched! You got {f} of {n} right on the first try, without the worked solution.","max":"maximum","min":"minimum","next":"next"},"graphs":[{"id":"g1","n":1,"max":[3,3],"min":[9,-1]},{"id":"g2","n":2,"max":[6,3],"min":[12,-1]},{"id":"g3","n":3,"max":[3,3],"min":[15,-1]},{"id":"g4","n":4,"max":[0,3],"min":[6,-1]},{"id":"g5","n":5,"max":[3,5],"min":[9,-3]},{"id":"g6","n":6,"max":[3,3],"min":[9,1]},{"id":"g7","n":7,"max":[4,3],"min":[8,-1]},{"id":"g8","n":8,"max":[9,3],"min":[3,-1]}],"eqs":[{"id":"a","t":"`y = -2 cos[2(x - 3π/4)] + 1`","why":"With `a \u003c 0`, cosine starts at a minimum: 3π/4. Half a period (π/2) earlier is the maximum at π/4.","hints":["With `a \u003c 0`, where does a cosine graph start?","It starts at a minimum, at `x = 3π/4`. The period is π, so half a period is π/2.","The maximum is half a period before the minimum: 3π/4 − π/2 = π/4. Maximum (π/4, 3), minimum (3π/4, −1): Graph 1."]},{"id":"b","t":"`y = 2 sin[2(x - π/4)] + 1`","why":"Sine starts on its axis going up at π/4. Its maximum is a quarter period (π/4) later, at π/2.","hints":["Where does a sine graph with `a > 0` start, and what comes a quarter period later?","It starts on its axis going up at `x = π/4`. The period is π, so a quarter period is π/4.","The maximum is at π/4 + π/4 = π/2 and the next minimum at π: Graph 2."]},{"id":"c","t":"`y = 2 sin(x + π/4) + 1`","why":"`k = 1`, so the period is 2π and the minimum is π after the maximum. Sine starts at −π/4 and peaks π/2 later, at π/4.","hints":["What is the period, and where does this sine graph start?","`k = 1`, so the period is 2π. `(x + π/4)` means the start is at `x = -π/4`.","The maximum is a quarter period (π/2) after the start, at π/4, and the minimum is π later, at 5π/4: Graph 3."]},{"id":"d","t":"`y = 2 cos[2(x - π)] + 1`","why":"The period is π, so `d = π` is one whole period: the maximum lands back at 0.","hints":["What is the period of this equation?","`k = 2`, so the period is π. A shift of π is one whole period.","`y = 2 cos[2(x - π)] + 1` draws the same graph as `y = 2 cos 2x + 1`, with a maximum at `x = 0`: Graph 4."]},{"id":"e","t":"`y = 4 sin 2x + 1`","why":"Amplitude 4 about the axis `y = 1`: from −3 to 5. Sine starts at 0 and peaks a quarter period later, at π/4.","hints":["What are the maximum and minimum values of this equation?","The axis is `y = 1` and the amplitude is 4, so the graph runs from −3 to 5.","Sine starts at 0 and peaks a quarter period (π/4) later. Maximum (π/4, 5), minimum (3π/4, −3): Graph 5."]},{"id":"f","t":"`y = sin[2(x + π)] + 2`","why":"Axis `y = 2` and amplitude 1: from 1 to 3. `d = -π` is a whole period, so this is `sin 2x + 2`, which peaks at π/4.","hints":["What are the axis and the amplitude?","The axis is `y = 2` and the amplitude is 1, so the graph runs from 1 to 3. The period is π, so `d = -π` is a whole period.","This is `y = sin 2x + 2`: maximum (π/4, 3), minimum (3π/4, 1): Graph 6."]},{"id":"g","t":"`y = 2 sin[3(x - π/6)] + 1`","why":"`k = 3` gives period 2π/3, so a quarter period is π/6. Sine starts at π/6 and peaks at π/6 + π/6 = π/3.","hints":["What is the period, and what is a quarter of it?","`k = 3` gives period 2π/3, so a quarter period is π/6. Sine starts going up at π/6.","The maximum is at π/6 + π/6 = π/3 and the next minimum half a period later, at 2π/3: Graph 7."]},{"id":"h","t":"`y = -2 sin 2x + 1`","why":"With `a \u003c 0`, sine starts on its axis going \u003cstrong>down\u003c/strong> at 0: the minimum comes first, at π/4, then the maximum at 3π/4.","hints":["With `a \u003c 0`, does this sine graph start going up or going down?","It starts on its axis going down at `x = 0`. The period is π, so a quarter period is π/4.","The minimum comes first, at π/4, then the maximum at 3π/4: Graph 8."]}],"_a":"TRVTUBsIE1UUGxYGCxALFlQVGENeARMOFFQWTRtVBRYMFVBDFRBWARQNFgQbHhNTABUOQ18QHRZRABZbG1UTGBRQDEMDEFkWSw==","wrong":{"b|g1":"This sine graph starts on its axis at `x = π/4`, so its maximum is a quarter period later, at π/2. Graph 1 peaks at π/4.","a|g8":"With `a \u003c 0`, cosine starts at a minimum. This equation’s minimum is at 3π/4, where Graph 8 has its maximum.","c|g1":"`k = 1` means a period of 2π, so the minimum is π after the maximum, at 5π/4, not at 3π/4.","d|g2":"A shift of π is a whole period here, so the graph lands back on itself, with a maximum at 0.","e|g1":"The amplitude is 4, so this graph runs from 1 − 4 = −3 up to 5.","f|g1":"The axis is `y = 2` and the amplitude is 1, so this graph runs from 1 to 3.","h|g1":"With `a \u003c 0`, sine starts on its axis going down, so the minimum comes first, at π/4.","h|g5":"With `a \u003c 0`, sine starts on its axis going down, so the minimum comes first, at π/4."},"wrongDefault":"Find this equation’s start and its period, then compare them with the labelled points.","tail":"Try another equation."},{"id":"clues","type":"custom","title":"Equations from clues","summary":"Equations from clues","star":true,"instruction":"Use the clues to write the equation in the form asked for.","how":"Fill in `a`, `k`, `d` and `c`, then press Check. Enter `d` as a multiple of π, like −1/6 for −π/6. After each check, a small graph shows your equation against the clues.","goal":[4,6],"ui":{"item":"Clue set {n} of 8","form":"Form: {f}","check":"Check","prev":"Previous","next":"Next clues","sign":"This item asks for {s}.","outRange":"That works, but keep `d` between −2π and 2π: add or subtract a period.","solved":"✓ Correct: {eq}","notFirst":"(not first try)","clues":"Clues","preview":"Your equation against the clues"},"items":[{"id":"c1","goal":[1,2,3,4],"
