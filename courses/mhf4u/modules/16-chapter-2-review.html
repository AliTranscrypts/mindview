.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 16: hero caption, per-topic tables, Connect (sorter, tool chains, the chapter on one page), mixed practice, task */
.hero .hero-eq.md{font-size:clamp(1.5rem,3.7vw,2.35rem)}
.hero .hero-eq .m{white-space:normal}
#hero-cap{font:400 .95rem/1.5 var(--font-ui);color:var(--ink-2);display:grid;gap:2px}
#hero-cap .hc-l{display:block}
#hero-cap .m{white-space:normal}
/* toolkit workaround: the visually hidden "(done)" text in a step button escaped the scrolling step bar on phones */
.steps .step{position:relative}
/* per-topic tables */
.tt-wrap{overflow-x:auto;margin:10px 0}
.tt td:nth-child(2){white-space:nowrap}
.tt td:last-child{white-space:nowrap}
.tt tr.tt-rev td{border-bottom:0}
.tt tr.tt-more td{padding-top:0;white-space:normal}
.tt-key{padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.tt-key p{margin:0 0 .3em;max-width:none}
.tt-key p:last-child{margin:0}
/* Connect: sorter with five boxes */
@media (min-width:821px){ [data-act-id="sort"] .bins{grid-template-columns:repeat(3,minmax(0,1fr))} }
[data-act-id="sort"] .bin-items .chip-in{font-size:.88rem}
[data-act-id="sort"] .tile .m,[data-act-id="sort"] .chip-in .m{white-space:normal}
/* Connect: tool chains */
.ch-seq .q-head{flex-wrap:wrap}
.ch-seq .q-prompt{font-weight:700}
.ch-seq .ostep .m{white-space:normal}
.ch-spare-lab{margin:14px 0 0;font:700 .85rem var(--font-ui);color:var(--ink-2)}
.ch-spare{margin-top:4px}
.ch-spare .ostep{border-style:dashed}
.ostep.ch-left{opacity:.7}
/* The chapter on one page */
.op-flow{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.op-step{border:1.5px solid var(--ink-2);border-radius:8px;background:var(--paper);padding:10px 14px;position:relative;margin-bottom:30px}
.op-step:last-child{margin-bottom:0}
.op-step p{margin:6px 0 0;max-width:none}
.op-step .m{white-space:normal}
.op-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.op-n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);font:700 .95rem var(--font-ui);background:var(--sheet)}
.op-arr{position:absolute;left:50%;bottom:-29px;transform:translateX(-50%);font:700 1.3rem/28px var(--font-ui);color:var(--ink-2)}
/* Mixed practice */
@media (max-width:560px){
  .mx-q .q-head{flex-wrap:wrap}
  .mx-q .q-head .tags{order:-1;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
}
.mx-q .q-prompt{font-weight:700}
.mx-q .numrow{flex-wrap:wrap}
.mx-pair{gap:10px 22px}
.mx-cell{display:inline-flex;align-items:center;gap:8px}
.mx-lab .m{font-size:1.05rem}
.mx-ib{margin-top:6px}
.mx-ib canvas.plot.nl{aspect-ratio:auto;height:104px;min-height:0}
.mx-ptrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:12px 0 0}
.mx-ptlab{font-weight:700;font-size:.9rem}
.mx-ptadd{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}
.mx-pt{min-height:32px}
.mx-yours{margin:12px 0 0}
.mx-yours .m{white-space:normal}
.mx-sum{margin-top:6px}
/* Task: one polynomial, five conditions */
.pt-conds{margin:8px 0 12px;padding-left:1.4em;display:grid;gap:4px}
.pt-how{margin:4px 0 8px}
.tk-h{margin:10px 0 4px;font-size:1rem}
.tk-k{margin-top:10px}
.tk-eq{font-size:clamp(1.15rem,3vw,1.6rem)}
.tk-eq .m{white-space:normal}
.tk-sl{margin:12px 0 2px;font:700 .85rem var(--font-ui);color:var(--ink-2)}
canvas.plot.tk-nl{aspect-ratio:auto;height:78px;min-height:0}
.tk-read{margin-top:10px}
/* zero slots (N21, from MHF4U 14) */
.zs{display:grid;gap:0;container-type:inline-size}
.zs-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.zs-row:last-child{border-bottom:0}
.zs-row.empty .zs-lab{color:var(--ink-2)}
.zs-lab{font-weight:700;min-width:4.4em}
.zs-pos{display:inline-flex;align-items:center;gap:4px}
.zs-st{min-width:36px;min-height:36px;padding:.2em .5em;font-size:1.1rem}
.zs-in{width:4.4rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .4em;font:400 1.1rem var(--font-math);text-align:center}
.zs-in:focus{border-color:var(--ink)}
.zs-ord{display:inline-flex;align-items:center;gap:4px}
.zs-ord .chip{min-width:34px;padding:.2em .55em}
.zs-clr{padding:.3em .6em;order:5}
@container (max-width:460px){
  .zs-lab{flex:1 0 55%}
  .zs-clr{order:1}
  .zs-pos{order:2}
  .zs-ord{order:3}
}
.zs-msg{min-height:1.1em;color:var(--red);margin:4px 0 0}

. `P(x)` = (divisor)(quotient) + remainder.","look":"Division stepper (Explore); The remainder shortcut (Shortcut)"},"12":{"idea":"`P(b) = 0` ⟺ `x - b` is a factor. Test candidates `±p/q`, divide out each factor, and use grouping and cube patterns.","look":"Root hunter (Explore); Cube patterns and grouping (Cubes)"},"13":{"idea":"Get 0 on one side, factor, set each factor to 0. Real roots are `x`-intercepts; never divide by `x`.","look":"Strategy path (Explore); Roots ↔ intercepts (Roots)"},"14":{"idea":"Same zeros, many functions: `y = k(x - r_1)(x - r_2)…`; one more point fixes `k`.","look":"Family fan (Explore); Build the equation from conditions (Conditions)"},"15":{"idea":"Factor, mark the zeros, test each interval’s sign, and choose brackets for \u003c, ≤, >, ≥.","look":"Sign chart builder, with its Build and Scan modes (Explore); Above or below? Two graphs, one inequality (Compare)"}},"start":{"diagnostic":{"title":"Diagnostic: which modules should I revisit?","intro":"Eight questions, at least one from each Chapter 2 module. Pick an answer, say how sure you are, then check it. At the end you’ll see which modules to revisit.","questions":[{"id":"d1","topic":"11","goal":1,"prompt":"What is the remainder when `2x^3 - 5x^2 + x + 3` is divided by `x - 2`?","options":[{"t":"−35","why":"That’s `P(-2)`. The divisor `x - 2` uses `P(2)`.","_n":"0d44","_k":"d7db48c7"},{"t":"0","why":"Only a factor leaves remainder 0.","_n":"1d74","_k":"3129f275"},{"t":"1","why":"`P(2) = 16 - 20 + 2 + 3 = 1`.","_n":"2d64","_k":"a2bc4764"},{"t":"3","why":"3 is the constant term, `P(0)`.","_n":"3d94","_k":"8ee1b7f1"}],"hints":["Remainder theorem.","Evaluate `P(2)`.","`16 - 20 + 2 + 3 = 1`."]},{"id":"d2","topic":"11","goal":1,"prompt":"What is the remainder when `4x^3 - 2x + 5` is divided by `2x - 1`?","options":[{"t":"`9/2`","why":"`P(1/2) = 4(1/8) - 1 + 5 = 9/2`.","_n":"4d84","_k":"96ad9f5c"},{"t":"`11/2`","why":"That’s `P(-1/2)`.","_n":"5db4","_k":"ae3ab1e4"},{"t":"7","why":"That’s `P(1)`. The zero of `2x - 1` is `1/2`.","_n":"6da4","_k":"adca9834"},{"t":"33","why":"That’s `P(2)`.","_n":"7dd4","_k":"df544388"}],"hints":["Where is `2x - 1` zero?","At `x = 1/2`.","`1/2 - 1 + 5 = 9/2`."]},{"id":"d3","topic":"12","goal":2,"prompt":"Which is a factor of `x^3 - 7x - 6`?","options":[{"t":"`x + 3`","why":"`P(-3) = -12`. (`x - 3` is a factor.)","_n":"8dc4","_k":"7dfb4bf8"},{"t":"`x + 1`","why":"`P(-1) = -1 + 7 - 6 = 0`.","_n":"99d6","_k":"db75cec4"},{"t":"`x - 1`","why":"`P(1) = -12`.","_n":"a9e6","_k":"6a3349d2"},{"t":"`x - 2`","why":"`P(2) = -12`. (`x + 2` is a factor.)","_n":"b9f6","_k":"cfbff7d2"}],"hints":["Test the zero of each option.","`x + 1` is zero at −1.","`P(-1) = 0`."]},{"id":"d4","topic":"12","goal":2,"prompt":"Factor `27x^3 - 8`.","options":[{"t":"`(3x - 2)(9x^2 - 6x + 4)`","why":"The middle sign is the opposite of the first factor’s: +.","_n":"ca06","_k":"b71476fd"},{"t":"`(3x + 2)(9x^2 - 6x + 4)`","why":"That’s `27x^3 + 8`.","_n":"da16","_k":"6643a243"},{"t":"`(3x - 2)^3`","why":"That expands to more than two terms.","_n":"ea26","_k":"cb40c0ed"},{"t":"`(3x - 2)(9x^2 + 6x + 4)`","why":"`a = 3x`, `b = 2`: `(a - b)(a^2 + ab + b^2)`.","_n":"fa36","_k":"da5377fc"}],"hints":["Difference of cubes.","`(3x)^3 - 2^3`.","Same, Opposite, Always plus."]},{"id":"d5","topic":"13","goal":3,"prompt":"Solve `x^4 - 10x^2 + 9 = 0`.","options":[{"t":"`x = ±1 or ±3`","why":"`(x^2 - 1)(x^2 - 9) = 0`.","_n":"ga46","_k":"5e6c3fca"},{"t":"`x = ±1 or ±9`","why":"`x^2 = 9` gives ±3.","_n":"ha56","_k":"cde2cf7b"},{"t":"`x = 1 or 3`","why":"Each square has two roots.","_n":"ia66","_k":"cb3b1a9d"},{"t":"`x = 1 or 9`","why":"Those are the values of `x^2`.","_n":"jaf7","_k":"238391a5"}],"hints":["Let `u = x^2`.","`(u - 1)(u - 9) = 0`.","`x = ±1, ±3`."]},{"id":"d6","topic":"14","goal":4,"prompt":"Which member of the family with zeros −1, 2 and 4 (each of order 1) passes through `(0, 16)`?","options":[{"t":"`y = 2(x - 1)(x + 2)(x + 4)`","why":"Zeros −1, 2, 4 come from `(x + 1)(x - 2)(x - 4)`.","_n":"kae7","_k":"d1063adf"},{"t":"`y = 16(x + 1)(x - 2)(x - 4)`","why":"16 is the `y`-value, not `k`.","_n":"lb17","_k":"dd8dabb9"},{"t":"`y = 2(x + 1)(x - 2)(x - 4)`","why":"At 0: `k(1)(-2)(-4) = 8k = 16`, so `k = 2`.","_n":"mb07","_k":"ea922d92"},{"t":"`y = {1}/{2}(x + 1)(x - 2)(x - 4)`","why":"`8k = 16` gives `k = 2`.","_n":"nb37","_k":"4309e199"}],"hints":["Write `y = k(x + 1)(x - 2)(x - 4)`.","Substitute `(0, 16)`.","`8k = 16`."]},{"id":"d7","topic":"15","goal":5,"prompt":"Solve `(x + 1)(x - 3) ≤ 0`.","options":[{"t":"`(-1, 3)`","why":"≤ includes the zeros: square brackets.","_n":"ob27","_k":"f46c97cd"},{"t":"`(-∞, -1] ∪ [3, ∞)`","why":"That’s where it’s ≥ 0.","_n":"pb57","_k":"01146191"},{"t":"`[-1, 3]`","why":"Negative between the zeros; ≤ includes them.","_n":"qb47","_k":"2674d962"},{"t":"`[-3, 1]`","why":"The zeros are −1 and 3.","_n":"ra77","_k":"a03d35ec"}],"hints":["Zeros?","−1 and 3; test 0: `(1)(-3) \u003c 0`.","`[-1, 3]`."]},{"id":"d8","topic":"15","goal":5,"prompt":"Solve `(x - 2)^2(x + 1) > 0`.","options":[{"t":"`(-∞, -1)`","why":"That’s where it’s negative.","_n":"sa67","_k":"8c564960"},{"t":"`(-1, ∞)`","why":"At `x = 2` the expression is 0, which isn’t > 0.","_n":"ta97","_k":"1dc80a10"},{"t":"`(-1, 2) ∪ (2, ∞)`","why":"Positive for `x > -1`, except at `x = 2`, where it’s 0.","_n":"uaa7","_k":"d58f9442"},{"t":"`(-1, 2)`","why":"The squared factor doesn’t change the sign at 2: it’s positive again after 2.","_n":"va77","_k":"9bd40200"}],"hints":["Only `(x + 1)` can change sign.","`(x - 2)^2 ≥ 0`, and `= 0` at 2.","`(-1, 2) ∪ (2, ∞)`."]}]}},"connect":{"heading":"Which tool solves this?","intro":"Every Chapter 2 module taught one tool, but real problems don’t say which tool to use. First sort eleven problems by the \u003cstrong>first\u003c/strong> tool you’d use. Then put the tools in order for two problems that need several of them.","activities":[{"id":"sort","type":"sorter","title":"Part A: Which tool first?","summary":"Connec - 3)` and use the point.","sign":"Write `k(x - 1)(x - 2)(x - 3)` and use the point."}},{"id":"c5","topic":"15","goal":6,"t":"Solve `x^3 - 2x^2 - 5x + 6 > 0`.","_a":"ERBRUVlG","why":"It’s an inequality: factor, then test intervals.","wrong":{"rem":"It’s an inequality: factor, then test intervals.","fac":"It’s an inequality: factor, then test intervals.","pat":"It’s an inequality: factor, then test intervals.","fam":"It’s an inequality: factor, then test intervals."}},{"id":"c6","topic":"12","goal":6,"t":"Find `k` so that `x + 2` is a factor of `x^3 + kx + 6`.","_a":"EQVZVRU=","why":"Set `P(-2) = 0`.","wrong":{"rem":"Set `P(-2) = 0`.","pat":"Set `P(-2) = 0`.","fam":"Set `P(-2) = 0`.","sign":"Set `P(-2) = 0`."}},{"id":"c7","topic":"12","goal":6,"t":"Factor `125x^3 - 1`.","_a":"ERNZQhU=","why":"Difference of cubes.","wrong":{"rem":"Difference of cubes.","fac":"Difference of cubes.","fam":"Difference of cubes.","sign":"Difference of cubes."}},{"id":"c8","topic":"13","goal":6,"t":"Solve `2x^3 - 3x^2 - 3x + 2 = 0`.","_a":"EQVZVRU=","why":"No pattern or grouping: test ±1, ±2, `±1/2`.","wrong":{"rem":"No pattern or grouping: test ±1, ±2, `±1/2`.","pat":"No pattern or grouping: test ±1, ±2, `±1/2`.","fam":"No pattern or grouping: test ±1, ±2, `±1/2`.","sign":"No pattern or grouping: test ±1, ±2, `±1/2`."}},{"id":"c9","topic":"15","goal":6,"t":"For which `x` is `(x - 1)^2(x + 3) ≥ 0`?","_a":"ERBRUVlG","why":"An inequality, already factored.","wrong":{"rem":"An inequality, already factored.","fac":"An inequality, already factored.","pat":"An inequality, already factored.","fam":"An inequality, already factored."}},{"id":"c10","topic":"14","goal":6,"t":"Which quartic touches the axis at 2 and at −2 and passes through `(0, 32)`?","_a":"EQVZWxU=","why":"`k(x - 2)^2(x + 2)^2`, then the point.","wrong":{"rem":"`k(x - 2)^2(x + 2)^2`, then the point.","fac":"`k(x - 2)^2(x + 2)^2`, then the point.","pat":"`k(x - 2)^2(x + 2)^2`, then the point.","sign":"`k(x - 2)^2(x + 2)^2`, then the p st: synthetic division needs a polynomial to divide.","fbTwice":"You only need one way to find the remainder. Move the other card to “Not needed in the chain”."}]},{"id":"onepage","type":"custom","title":"The chapter on one page","goal":6,"how":"","intro":"Five tools, one polynomial: `P(x) = x^3 - 3x^2 - 10x + 24`. Each step answers one question with one module’s tool.","locked":"“The chapter on one page” appears when the sorter and both tool chains are done.","steps":[{"name":"Remainder","mod":"11","html":"`P(1) = 1 - 3 - 10 + 24 = 12`: the remainder when `P(x)` is divided by `x - 1`."},{"name":"Factor","mod":"12","html":"`P(2) = 0`, so `x - 2` is a factor. Dividing gives `x^2 - x - 12`, so `P(x) = (x - 2)(x - 4)(x + 3)`."},{"name":"Solve","mod":"13","html":"`(x - 2)(x - 4)(x + 3) = 0`: the roots are −3, 2 and 4, the graph’s `x`-intercepts."},{"name":"Family","mod":"14","html":"Every `y = k(x - 2)(x - 4)(x + 3)` has the same zeros. `P` is the member with `k = 1`, through `(0, 24)`."},{"name":"Inequality","mod":"15","html":"Sign chart: −, +, −, +. So `P(x) \u003c 0` on `(-∞, -3) ∪ (2, 4)`, and `P(x) ≤ 0` on `(-∞, -3] ∪ [2, 4]`."}]}]},"mixed":{"heading":"Mixed practice","intro":"Twelve questions from every Chapter 2 module, mixed up on purpose, so you practise choosing the right tool. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Twelve questions from all five modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"12","goal":2,"kind":"pair","star":true,"prompt":"`x^3 + ax^2 + bx - 6` has factors `x - 1` and `x + 2`. Find `a` and `b`.","labels":["`a =`","`b =`"],"_a":"aFcUB2o=","display":"`a = 4`, `b = 1`","why":"Two equations: `P(1) = a + b - 5 = 0` and `P(-2) = 4a - 2b - 14 = 0`.","general":"Two equations: `P(1) = a + b - 5 = 0` and `P(-2) = 4a - 2b - 14 = 0`.","wrong":[{"match":[1,4],"fb":"Those are the right numbers in the wrong boxes. Which one multiplies `x^2`?"}],"hints":["Us "},{"t":"`k = -1`","why":"`k(4)(2) = -8`, so `k = -1`.","_n":"11b17","_k":"03b4e41e"},{"t":"`k = -1/8`","why":"That divides the wrong way: `k` = (its `y`-value) ÷ (the bracket product there) = `-8 ÷ 8`.","_n":"12b27","_k":"a1e73685"},{"t":"`k = 1`","why":"Check the sign: `8k = -8`, so `k` is negative.","_n":"133b7","_k":"d7bf8c27"}],"hints":["Substitute `(1, -8)`.","`k(4)(2) = -8`.","`k = -1`."]},{"id":"mp11","topic":"12","goal":2,"kind":"mc","prompt":"Is `2x + 1` a factor of `2x^3 + 5x^2 + x - 2`?","options":[{"t":"No: `P(-1/2) = -3/2`","why":"`P(-1/2) = -1/4 + 5/4 - 1/2 - 2 = -3/2`: not a factor.","_n":"143a7","_k":"068c53e4"},{"t":"No, because `P(1) ≠ 0`","why":"`P(1)` tests `x - 1`.","_n":"15397","_k":"cfc6dabe"},{"t":"Yes, `P(1/2) = 0`","why":"`P(1/2) = 1/4 + 5/4 + 1/2 - 2 = 0`, but the zero of `2x + 1` is `-1/2`.","_n":"16387","_k":"70c852a4"},{"t":"Yes, because 2 divides the leading coefficient","why":"The leading coefficient only limits the candidates. Test the zero of `2x + 1`.","_n":"17377","_k":"1faf3ac6"}],"hints":["Zero of `2x + 1`?","`x = -1/2`.","`P(-1/2) = -1/4 + 5/4 - 1/2 - 2 = -3/2`: not a factor."]},{"id":"mp12","topic":"15","goal":5,"kind":"iv","star":true,"prompt":"Solve `x^3 ≥ 4x^2`.","_a":"ERgISxeG684TOAwaF4br+hpB","display":"`{x ∈ ℝ | x = 0 or x ≥ 4}`","why":"`x^2 ≥ 0` always, so you need `x - 4 ≥ 0`, or `x^2 = 0`: `x = 0` or `x ≥ 4`.","wrong":{"[4, ∞)":"`x^3 - 4x^2 = x^2(x - 4)`. At `x = 0` it equals 0, which satisfies ≥."},"hints":["Move everything to one side and factor.","`x^2(x - 4) ≥ 0`.","`x^2 ≥ 0` always, so you need `x - 4 ≥ 0`, or `x^2 = 0`: `x = 0` or `x ≥ 4`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which Connect problem was hardest to sort, and what finally told you which tool it needed?"},{"id":"j2","q":"In your own words, how are the remainder theorem and the factor theorem connected?"},{"id":"j3","q":"Explain to a friend the full chain for solving a cubic inequality like `x^3 - 3x^2 - 10x + 24 ≤ 0`."},{"id":"j4","q":"Which module will you revisit, and what exactly will you practise there?"}]},"final":{"intro":"This shows what you’ve learned across the whole chapter, so there are no hints here. Answer all 15 questions and say how sure you are. Then submit to see your results by category and by module. Each question is labelled with its achievement chart category and its module.","questions":[{"id":"f1","cat":"K","topic":"11","goal":1,"a":{"prompt":"What is the remainder when `x^3 + 4x^2 - x - 7` is divided by `x + 3`?","options":[{"t":"−7","why":"That’s `P(0)`.","_n":"18367","_k":"46901400"},{"t":"0","why":"Only a factor leaves remainder 0.","_n":"19357","_k":"8534e006"},{"t":"5","why":"`P(-3) = -27 + 36 + 3 - 7 = 5`.","_n":"1a347","_k":"fc50663c"},{"t":"53","why":"That’s `P(3)`.","_n":"1b337","_k":"8ee3875f"}]},"b":{"prompt":"What is the remainder when `x^3 - 3x^2 + 2x + 4` is divided by `x - 4`?","options":[{"t":"−116","why":"That’s `P(-4)`.","_n":"1c327","_k":"152d6b87"},{"t":"0","why":"Only a factor leaves remainder 0.","_n":"1d357","_k":"61c88a9b"},{"t":"4","why":"That’s `P(0)`.","_n":"1e367","_k":"4b9e1575"},{"t":"28","why":"`P(4) = 64 - 48 + 8 + 4 = 28`.","_n":"1f377","_k":"c52333ec"}]}},{"id":"f2","cat":"K","topic":"12","goal":2,"a":{"prompt":"By the rational zero theorem, which could be a zero of `4x^3 - x + 3`?","options":[{"t":"`3/4`","why":"`p = 3` divides 3; `q = 4` divides 4.","_n":"1g387","_k":"bd4553da"},{"t":"`4/3`","why":"Upside down: the denominator divides the leading coefficient.","_n":"1h317","_k":"0f8f0abb"},{"t":"2","why":"2 doesn’t divide 3.","_n":"1i327","_k":"79c2adb5"},{"t":"4","why":"4 doesn’t divide the constant 3.","_n":"1j337","_k":"8f5ba357"}]},"b":{"prompt":"By the rational zero theorem, which could be a zero of `6x^3 + x - 5`?","options":[{"t":"`5/6`","why":"`p = 5` divides 5; `q = 6` divides 6.","_n":"1k347","_k":"97c60a9a"},{"t":"`6/5`","why":"Upside down.","_n":"1l2d7","_k":"68e7433d"},{"t":"3","why":"3 doesn’t divide 5.","_n":"1m2e7","_k":"ba229e59"},{"t":"6","why":"6 doesn’t divide 5.","_n":"1na77","_k":"7eb49949"}]}},{"id":"f3","cat":"K","topic":"14","goal":4,"a":{"prompt":"Which function is \u003cstrong>not\u003c/strong> a member of the family `y = k(x - 1)(x + 4)`?","options":[{"t":"`y = 3x^2 + 9x - 12`","why":"That’s `3(x - 1)(x + 4)`: a member, just expanded.","_n":"1oa67","_k":"67b8acb5"},{"t":"`y = -(x - 1)(x + 4)`","why":"`k = -1`: a member.","_n":"1pa97","_k":"6270f93d"},{"t":"`y = {1}/{2}x^2 + 1.5x - 2`","why":"That’s `{1}/{2}(x - 1)(x + 4)`: a member.","_n":"1qa87","_k":"c16371b1"},{"t":"`y = (x + 1)(x - 4)`","why":"Its zeros are −1 and 4, not 1 and −4.","_n":"1ra37","_k":"3eb051ce"}]},"b":{"prompt":"Which function is \u003cstrong>not\u003c/strong> a member of the family `y = k(x + 2)(x - 3)`?","options":[{"t":"`y = (x - 2)(x + 3)`","why":"Its zeros are 2 and −3.","_n":"1sa27","_k":"37afb4e2"},{"t":"`y = {1}/{4}x^2 - {1}/{4}x - 1.5`","why":"That’s `{1}/{4}(x + 2)(x - 3)`.","_n":"1ta57","_k":"573436dd"},{"t":"`y = 2x^2 - 2x - 12`","why":"That’s `2(x + 2)(x - 3)`.","_n":"1ua47","_k":"2da03b09"},{"t":"`y = -(x + 2)(x - 3)`","why":"`k = -1`.","_n":"1vaf7","_k":"9a6cbe50"}]}},{"id":"f4","cat":"K","topic":"15","goal":5,"a":{"prompt":"Solve `x^2 - x - 12 \u003c 0`.","options":[{"t":"`(-3, 4)`","why":"`(x - 4)(x + 3) \u003c 0` between the zeros.","_n":"1wae7","_k":"09b26ea5"},{"t":"`(-4, 3)`","why":"The zeros are 4 and −3.","_n":"1x217","_k":"63163ce4"},{"t":"`[-3, 4]`","why":"\u003c leaves the zeros out.","_n":"1y227","_k":"d4784d4e"},{"t":"`(-∞, -3) ∪ (4, ∞)`","why":"That’s > 0.","_n":"1z1f7","_k":"f8ec04ec"}]},"b":{"prompt":"Solve `x^2 + 2x - 15 ≥ 0`.","options":[{"t":"`(-∞, -5] ∪ [3, ∞)`","why":"`(x + 5)(x - 3) ≥ 0` outside the zeros, including them.","_n":"20207","_k":"df1e513f"},{"t":"`(-∞, -5) ∪ (3, ∞)`","why":"≥ includes the zeros.","_n":"21257","_k":"f0dc6bdc"},{"t":"`[-5, 3]`","why":"That’s ≤ 0.","_n":"22267","_k":"f32838d8"},{"t":"`(-∞, -3] ∪ [5, ∞)`","why":"The zeros are −5 and 3.","_n":"23237","_k":"0844c4d0"}]}},{"id":"f5","cat":"T","topic":"11","goal":1,"a":{"prompt":"When `x^3 + kx^2 - 3x + 1` is divided by `x - 2`, the remainder is 7. Find `k`.","options":[{"t":"−3/4","why":"That sets the remainder to 0: `3 + 4k = 0`.","_n":"24247","_k":"a9590a8c"},{"t":"1","why":"`P(2) = 8 + 4k - 6 + 1 = 3 + 4k = 7`.","_n":"25297","_k":"14e14daf"},{"t":"7/4","why":"That drops `8 - 6 + 1`: `4k = 7`.","_n":"262a7","_k":"ebee6d4f"},{"t":"2","why":"That uses `P(-2) = 4k - 1 = 7`.","_n":"27b38","_k":"07012ca9"}]},"b":{"prompt":"When `2x^3 - x^2 + kx - 4` is divided by `x + 1`, the remainder is −3. Find `k`.","options":[{"t":"−7","why":"That sets the remainder to 0.","_n":"28b28","_k":"61b11213"},{"t":"−4","why":"`P(-1) = -2 - 1 - k - 4 = -7 - k = -3`.","_n":"29b18","_k":"558062d2"},{"t":"0","why":"That uses `P(1) = k - 3 = -3`.","_n":"2ab08","_k":"8534861c"},{"t":"3","why":"That drops the constants: `-k = -3`.","_n":"2bb78","_k":"94fb09ac"}]}},{"id":"f6","cat":"T","topic":"12","goal":2,"a":{"prompt":"Fully factor `2x^3 - 5x^2 - x + 6`.","options":[{"t":"`(x - 2)(2x^2 - x - 3)`","why":"The quadratic factors.","_n":"2cb68","_k":"6ae088e0"},{"t":"`(x - 2)(2x + 3)(x - 1)`","why":"`(2x + 3)(x - 1) = 2x^2 + x - 3`, not `2x^2 - x - 3`.","_n":"2db58","_k":"e585b518"},{"t":"`(x - 2)(2x - 3)(x + 1)`","why":"`P(2) = 0`; the quotient `2x^2 - x - 3 = (2x - 3)(x + 1)`.","_n":"2eb48","_k":"e3addbc7"},{"t":"`(x + 2)(2x + 3)(x - 1)`","why":"Signs flipped: `P(-2) ≠ 0`.","_n":"2fab8","_k":"2ad9c958"}]},"b":{"prompt":"Fully factor `3x^3 - 4x^2 - 5x + 2`.","options":[{"t":"`(x - 2)(3x - 1)(x + 1)`","why":"`P(2) = 0`; quotient `3x^2 + 2x - 1 = (3x - 1)(x + 1)`.","_n":"2gaa8","_k":"688f90a1"},{"t":"`(x + 2)(3x + 1)(x - 1)`","why":"Signs flipped: `P(-2) ≠ 0`.","_n":"2had8","_k":"28fe7b7c"},{"t":"`(x - 2)(3x + 1)(x - 1)`","why":"`(3x + 1)(x - 1) = 3x^2 - 2x - 1`.","_n":"2iae8","_k":"e1dfca68"},{"t":"`(x - 2)(3x^2 + 2x - 1)`","why":"The quadratic factors.","_n":"2jaf8","_k":"53325d38"}]}},{"id":"f7","cat":"T","topic":"13","goal":3,"a":{"prompt":"Solve `x^3 - 6x^2 = 16x`.","options":[{"t":"`x = 8 or -2`","why":"Dividing by `x` loses 0.","_n":"2kb08","_k":"02081f6e"},{"t":"`x = 0, -8 or 2`","why":"Signs flipped: `x - 8 = 0` gives 8, and `x + 2 = 0` gives −2.","_n":"2lb18","_k":"340367a4"},{"t":"`x = 8 or 2`","why":"`x + 2 = 0` gives −2.","_n":"2mb28","_k":"91788d0a"},{"t":"`x = 0, 8 or -2`","why":"`x(x - 8)(x + 2) = 0`.","_n":"2nb38","_k":"972b2ed7"}]},"b":{"prompt":"Solve `x^3 + 3x^2 = 10x`.","options":[{"t":"`x = 0, 5 or -2`","why":"Signs flipped: `x + 5 = 0` gives −5, and `x - 2 = 0` gives 2.","_n":"2ob48","_k":"8219f5a6"},{"t":"`x = 0, -5 or 2`","why":"`x(x + 5)(x - 2) = 0`.","_n":"2pa58","_k":"f88f2092"},{"t":"`x = -5 or 2`","why":"Dividing by `x` loses 0.","_n":"2qa68","_k":"68896ca3"},{"t":"`x = 5 or 2`","why":"`x + 5 = 0` gives −5.","_n":"2r32d","_k":"202c1466"}]}},{"id":"f8","cat":"T","topic":"15","goal":5,"a":{"prompt":"Solve `x^3 - 4x ≥ 0`.","options":[{"t":"`[2, ∞)`","why":"Dividing by `x` lost the interval `[-2, 0]`.","_n":"2s33d","_k":"7eacbade"},{"t":"`(-2, 0) ∪ (2, ∞)`","why":"≥ includes the zeros.","_n":"2t34d","_k":"a9cce40a"},{"t":"`[-2, 0] ∪ [2, ∞)`","why":"`x(x - 2)(x + 2)`: + on `(-2, 0)` and `(2, ∞)`; ≥ includes the zeros.","_n":"2u35d","_k":"2144706d"},{"t":"`(-∞, -2] ∪ [0, 2]`","why":"That’s ≤ 0.","_n":"2v36d","_k":"d251b826"}]},"b":{"prompt":"Solve `x^3 - 9x \u003c 0`.","options":[{"t":"`(-∞, -3] ∪ [0, 3]`","why":"\u003c leaves the zeros out.","_n":"2w37d","_k":"c1675f1e"},{"t":"`(-3, 3)`","why":"Dividing by `x` (which can be negative) changes the inequality.","_n":"2x38d","_k":"e3803962"},{"t":"`(-∞, -3) ∪ (0, 3)`","why":"`x(x - 3)(x + 3)`: − on `(-∞, -3)` and `(0, 3)`.","_n":"2y39d","_k":"b922d5a5"},{"t":"`(-3, 0) ∪ (3, ∞)`","why":"That’s > 0.","_n":"2z3ad","_k":"4ff58af5"}]}},{"id":"f9","cat":"C","topic":"12","goal":2,"a":{"prompt":"Which is the best reason why `x - 3` is a factor of `x^3 - 2x^2 - 2x - 3`?","options":[{"t":"“Because −3 is the constant term.”","why":"The constant term only limits the candidates.","_n":"303bd","_k":"cc8daa77"},{"t":"“`P(3) = 27 - 18 - 6 - 3 = 0`, so by the factor theorem `x - 3` is a factor.”","why":"The factor theorem: `x - b` is a factor exactly when `P(b) = 0`.","_n":"3138d","_k":"471cc6e7"},{"t":"“Because `P(-3) = 0`.”","why":"`P(-3) = -42`, and it would test `x + 3`.","_n":"3237d","_k":"b1777a7c"},{"t":"“Because 3 divides every coefficient.”","why":"It doesn’t divide −2.","_n":"3336d","_k":"c6b5574c"}]},"b":{"prompt":"Which is the best reason why `x + 2` is a factor of `x^3 + x^2 - x + 2`?","options":[{"t":"“`P(-2) = -8 + 4 + 2 + 2 = 0`, so by the factor theorem `x + 2` is a factor.”","why":"The factor theorem: `x - b` is a factor exactly when `P(b) = 0`, and `x + 2 = x - (-2)`.","_n":"3435d","_k":"a85497f7"},{"t":"“Because `P(2) = 0`.”","why":"`P(2) = 12`.","_n":"353cd","_k":"b040064b"},{"t":"“Because the coefficients add to 0.”","why":"They add to 3; that test is for `x - 1`.","_n":"363bd","_k":"89badd95"},{"t":"“Because 2 is the constant term.”","why":"The constant term only limits the candidates.","_n":"373ad","_k":"37238187"}]}},{"id":"f10","cat":"C","topic":"13","goal":3,"a":{"prompt":"Which correctly describes the real roots of `x^4 - x^2 - 12 = 0`?","options":[{"t":"“The roots are ±2 and `±√3`.”","why":"`x^2 = -3` has no real solutions.","_n":"3839d","_k":"56af2934"},{"t":"“The roots are ±2 and ±3.”","why":"Check: `3^4 - 9 - 12 = 60`.","_n":"3940d","_k":"c1763011"},{"t":"“`(x^2 - 4)(x^2 + 3) = 0`; `x^2 = 4` gives ±2, and `x^2 = -3` gives no real roots.”","why":"Treat it as a quadratic in `x^2`, then solve each factor. A square can’t be negative.","_n":"3a3fd","_k":"d47f9625"},{"t":"“The roots are 4 and −3.”","why":"Those are the values of `x^2`.","_n":"3b3ed","_k":"22a7cdc6"}]},"b":{"prompt":"Which correctly describes the real roots of `x^4 + x^2 - 20 = 0`?","options":[{"t":"“The roots are ±2 and ±5.”","why":"Check: `5^4 + 25 - 20 = 630`.","_n":"3c3fd","_k":"473699ec"},{"t":"“The roots are ±2 and `±√5`.”","why":"`x^2 = -5` has no real solutions.","_n":"3d3cd","_k":"5e6e412a"},{"t":"“The roots are 4 and −5.”","why":"Those are the values of `x^2`.","_n":"3e3dd","_k":"541182cc"},{"t":"“`(x^2 + 5)(x^2 - 4) = 0`; `x^2 = 4` gives ±2, and `x^2 = -5` gives no real roots.”","why":"Treat it as a quadratic in `x^2`, then solve each factor. A square can’t be negative.","_n":"3f3ad","_k":"a97542c1"}]}},{"id":"f11","cat":"C","topic":"15","goal":5,"a":{"prompt":"Which is the solution of `(x - 1)^2(x + 2) ≤ 0`?","options":[{"t":"`(-∞, -2]`","why":"At `x = 1` the expression is 0, which satisfies ≤.","_n":"3g3bd","_k":"7ef0d5b4"},{"t":"`(-∞, -2] ∪ [1, ∞)`","why":"For `x > 1` it’s positive.","_n":"3h38d","_k":"39c1d0a5"},{"t":"`{x ∈ ℝ | x ≤ -2 or x = 1}`","why":"Negative for `x \u003c -2`; zero at −2 and at 1.","_n":"3i39d","_k":"92b6f0aa"},{"t":"`[-2, 1]`","why":"Between −2 and 1 it’s positive.","_n":"3j46d","_k":"eb45f0d4"}]},"b":{"prompt":"Which is the solution of `(x + 3)^2(x - 1) ≥ 0`?","options":[{"t":"`[-3, 1]`","why":"Between −3 and 1 it’s negative.","_n":"3k47d","_k":"de4e19a4"},{"t":"`{x ∈ ℝ | x = -3 or x ≥ 1}`","why":"Positive for `x > 1`; zero at −3 and at 1.","_n":"3lc4d","_k":"ac62cada"},{"t":"`(-∞, -3] ∪ [1, ∞)`","why":"For `x \u003c -3` it’s negative.","_n":"3mc3d","_k":"65909ee3"},{"t":"`[1, ∞)`","why":"At −3 it’s 0, which satisfies ≥.","_n":"3nc6d","_k":"e6187e79"}]}},{"id":"f12","cat":"A","topic":"13","goal":3,"a":{"prompt":"A tank’s dimensions are `x`, `x + 2` and `x - 1` metres, and its volume is 30 m³. Find `x`.","options":[{"t":"3 m or −5 m","why":"The quadratic factor has no real roots, and a length can’t be negative.","_n":"3oc5d","_k":"b21702cb"},{"t":"5 m","why":"That’s `x + 2`.","_n":"3pc8d","_k":"877ae7ed"},{"t":"3 m","why":"`x^3 + x^2 - 2x - 30 = (x - 3)(x^2 + 4x + 10) = 0`; the quadratic has no real roots.","_n":"3qc7d","_k":"c44e6a98"},{"t":"2 m","why":"That’s `x - 1`.","_n":"3rcad","_k":"c65c8c22"}]},"b":{"prompt":"A tank’s dimensions are `x`, `x - 1` and `x + 3` metres, and its volume is 36 m³. Find `x`.","options":[{"t":"2 m","why":"That’s `x - 1`.","_n":"3sc9d","_k":"c6386f93"},{"t":"3 m or −4 m","why":"No other real roots.","_n":"3tbcd","_k":"e474377d"},{"t":"6 m","why":"That’s `x + 3`.","_n":"3ubbd","_k":"c65a2ea9"},{"t":"3 m","why":"`(x - 3)(x^2 + 5x + 12) = 0`.","_n":"3vcad","_k":"831b2f41"}]}},{"id":"f13","cat":"A","topic":"14","goal":4,"a":{"prompt":"An arch is modelled by a member of `y = k(x + 10)(x - 10)`, in metres, with its top 25 m high at `x = 0`. How high is it at `x = 6`?","options":[{"t":"9 m","why":"That subtracts `16 = 6 + 10` from 25.","_n":"3wcbd","_k":"5896c234"},{"t":"16 m","why":"`-100k = 25` gives `k = -{1}/{4}`; `-{1}/{4}(16)(-4) = 16`.","_n":"3xccd","_k":"86fd9629"},{"t":"19 m","why":"That assumes the arch drops 1 m per metre.","_n":"3ycdd","_k":"f26a8f40"},{"t":"−16 m","why":"`k` is negative, and so is `(6 - 10)`, so the height is positive.","_n":"3zc6d","_k":"d1d2a275"}]},"b":{"prompt":"An arch is modelled by a member of `y = k(x + 8)(x - 8)`, in metres, with its top 32 m high at `x = 0`. How high is it at `x = 4`?","options":[{"t":"28 m","why":"That assumes it drops 1 m per metre.","_n":"40c7d","_k":"687692cf"},{"t":"20 m","why":"That subtracts `12 = 4 + 8`.","_n":"41c8d","_k":"7c5bee09"},{"t":"−24 m","why":"`k` is negative, and so is `(4 - 8)`, so the height is positive.","_n":"42c9d","_k":"88c9ffaf"},{"t":"24 m","why":"`-64k = 32` gives `k = -{1}/{2}`; `-{1}/{2}(12)(-4) = 24`.","_n":"43c2d","_k":"06945132"}]}},{"id":"f14","cat":"A","topic":"11","goal":1,"a":{"prompt":"A company’s cost is `C(x) = x^3 - 6x^2 + 15x + 20` thousand dollars for `x` hundred units. Without dividing, what is the remainder when `C(x)` is divided by `x - 4`, and what does it mean?","options":[{"t":"−200: it’s `C(-4)`","why":"The divisor `x - 4` is zero at `x = 4`: use `C(4)`, not `C(-4)`.","_n":"44c3d","_k":"4e19d66f"},{"t":"0: `x - 4` is a factor","why":"`C(4) ≠ 0`.","_n":"45d0e","_k":"3e2d3d1b"},{"t":"20: the fixed cost","why":"That’s `C(0)`.","_n":"46cfe","_k":"67d46d67"},{"t":"48: it’s `C(4)`, the cost of 400 units, $48 000","why":"64 − 96 + 60 + 20 = 48.","_n":"47cee","_k":"b2c98fe6"}]},"b":{"prompt":"`C(x) = 2x^3 - 3x^2 + x + 10` thousand dollars for `x` hundred units. What is the remainder when `C(x)` is divided by `x - 3`, and what does it mean?","options":[{"t":"10: the fixed cost","why":"That’s `C(0)`.","_n":"48cde","_k":"7836b1ef"},{"t":"0: `x - 3` is a factor","why":"`C(3) ≠ 0`.","_n":"49cce","_k":"336ebac5"},{"t":"−74: it’s `C(-3)`","why":"The divisor `x - 3` is zero at `x = 3`: use `C(3)`, not `C(-3)`.","_n":"4acbe","_k":"bc511d28"},{"t":"40: it’s `C(3)`, the cost of 300 units, $40 000","why":"54 − 27 + 3 + 10 = 40.","_n":"4bcae","_k":"038eebdf"}]}},{"id":"f15","cat":"A","topic":"15","goal":5,"a":{"prompt":"A ball’s height is `h(t) = -5t^2 + 40t - 35` metres. When is it more than 40 m high?","options":[{"t":"`(3, 5)`","why":"`-5t^2 + 40t - 75 > 0` gives `t^2 - 8t + 15 \u003c 0`, so `(t - 3)(t - 5) \u003c 0`.","_n":"4cc9e","_k":"f503bb06"},{"t":"`(-∞, 3) ∪ (5, ∞)`","why":"Dividing by −5 flips the inequality.","_n":"4dc8e","_k":"69768aaf"},{"t":"`(1, 7)`","why":"That’s when it’s above 0 m.","_n":"4ec7e","_k":"6ad18e5d"},{"t":"`[3, 5]`","why":"At exactly 3 s and 5 s it’s 40 m, not more.","_n":"4f36e","_k":"b6e7c417"}]},"b":{"prompt":"A ball’s height is `h(t) = -5t^2 + 50t - 80` metres. When is it more than 40 m high?","options":[{"t":"`(-∞, 4) ∪ (6, ∞)`","why":"Dividing by −5 flips the inequality.","_n":"4g37e","_k":"37e67d47"},{"t":"`(4, 6)`","why":"`t^2 - 10t + 24 \u003c 0`: `(t - 4)(t - 6) \u003c 0`.","_n":"4h34e","_k":"62105b8c"},{"t":"`(2, 8)`","why":"That’s when it’s above 0 m.","_n":"4i35e","_k":"55261af7"},{"t":"`[4, 6]`","why":"At exactly 4 s and 6 s it’s 40 m, not more.","_n":"4j3ae","_k":"1aa61b64"}]}}]},"task":{"title":"One polynomial, five conditions","summary":"One polynomial, five
