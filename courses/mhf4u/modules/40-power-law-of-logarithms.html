.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 40: radio groups, Power stacker controls, Base bridge, Power moves, task */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:36px;min-width:40px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.pl-b button{color:var(--p-b);border-color:var(--p-b)}
.rg.chips.pl-b button[aria-checked="true"]{background:var(--hi);border-color:var(--p-b);color:var(--hi-ink);box-shadow:inset 0 0 0 1px var(--p-b)}
.rg button:disabled{opacity:.55}
.nm-row{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Power stacker */
.pl-top{margin:0 0 12px}
.pl-chal{border:1.5px solid var(--hi);background:var(--hi-soft);border-radius:8px;padding:8px 12px;margin:0 0 12px}
.pl-chal p{margin:0 0 8px}
.eq-cap.pl-cap{font-size:clamp(1.15rem,2.6vw,1.6rem)}
.pl-note{min-height:1.2em;margin:6px 0 0}
.pl-row{margin:0 0 12px}
.pl-scroll{overflow-x:auto;padding:4px 2px}
.pl-lab{display:block;margin:0 0 2px}
.pl-scroll .rg-wrap{flex-wrap:nowrap}
.pl-scroll .rg.chips{flex-wrap:nowrap}
.pl-scroll .rg.chips button{flex:0 0 auto}
.pl-exact{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pl-exl{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.pl-in{width:3.4rem;padding:.35em .4em;text-align:center}
.pl-in2{width:6rem}
.pl-sign{min-width:40px;min-height:40px;font:600 1.2rem var(--font-math);padding:0}
.pl-exmsg{flex-basis:100%;color:var(--ink-2);min-height:0}
.pl-exmsg:empty{display:none}
.pl-help{margin:-4px 0 12px}
.pl-tog[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.pl-sl{margin:0 0 4px}
.pl-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.pl-sl-top label{font-weight:700;font-size:.92rem}
.pl-sl-top output{font:600 1.15rem var(--font-math);color:var(--sc)}
.pl-sl-row{display:flex;align-items:center;gap:8px}
.pl-pm{min-width:40px;min-height:40px;padding:0;font-size:1.25rem;line-height:1}
.pl-sl input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;cursor:pointer}
.pl-sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.pl-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc);margin-top:-12px}
.pl-sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.pl-sl input[type=range]::-moz-range-thumb{width:27px;height:27px;border-radius:50%;background:var(--sc);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--sc)}
.pl-sl input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.pl-sl input[type=range]:disabled{opacity:.45;cursor:default}
canvas.plot:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

/* Base bridge */
.bb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 28px;align-items:start}
.bb > *{min-width:0}
.bb-say{margin:6px 0 0;min-height:1.2em}
.bb-h{margin:12px 0 4px}
.bb-find{font-size:1.1rem;margin:0}
.bb-step{border-left:3px solid var(--rule);padding:6px 0 6px 12px;margin:12px 0 0}
.bb-step.done{border-left-color:var(--green)}
.bb-step.locked{opacity:.7}
.bb-lab{margin:0 0 6px}
.bb-ans,.bb-check{margin:2px 0;font-size:1.05rem}
.bb-frame{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;font-size:1.15rem;margin:4px 0 8px}
.bb-frame .bb-pre{font-family:var(--font-math)}
.bb-in{width:4.6rem;padding:.3em .45em;text-align:center;font-size:1.05rem}
.bb-sup .bb-in{width:3.2em;font-size:.95rem;vertical-align:super}
.bb-sup{font-size:1rem;vertical-align:baseline}
.bb-chips{margin:4px 0 8px}
.bb-chip{min-width:48px;min-height:40px;font-size:1.05rem}
.bb-why{margin-top:22px}
.bb-proof{margin:12px 0 0}
.bb-proof ol{margin:6px 0 0;padding-left:1.4em}
.bb-proof li{margin:0 0 12px}
.bb-line{margin:0 0 6px;font-size:1.08rem}
.bb-reason{color:var(--green);font-size:.9rem;font-weight:700}
.bb-rc{margin:0 0 6px}
.bb-rc .chip{min-height:36px}
.bb-ph{margin:0}

/* Task */
.rc-in{margin:8px 0 6px}
.rc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 10px}
.rc-lab{font:600 1.2rem var(--font-math);min-width:1.4em}
.rc-pm{min-width:40px;min-height:40px;padding:0;font-size:1.2rem}
.rc-frac{min-width:44px;min-height:40px;font:600 1.1rem var(--font-math);padding:0 .4em}
.rc-frac[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.rc-box{width:5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .5em;font:400 1.15rem var(--font-math)}
.rc-box:focus{border-color:var(--ink)}
.rc-cap{font-size:clamp(1.2rem,3vw,1.6rem);margin:6px 0 0}

@media (max-width:760px){
  .bb{grid-template-columns:minmax(0,1fr)}
  .pl-sl input[type=range]{height:48px}
  .pl-sl input[type=range]::-webkit-slider-thumb{width:40px;height:40px;margin-top:-17px}
  .pl-sl input[type=range]::-moz-range-thumb{width:36px;height:36px}
}

the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"cf7dc8b2","content":{"id":"40-power-law-of-logarithms","kind":"topic","title":"Power law of logarithms","topic":"Power Law of Logarithms","readyTopic":"the power law of logarithms","hero":{"eq":"`log_{@b{b}}(x^{@n{n}}) = @n{n} log_{@b{b}} x`","eqLabel":"log base b of x to the power n equals n times log base b of x","eqSize":"md","headline":"A power inside a log comes out as a multiplier","text":"A logarithm is an exponent: `log_{@b{b}} x` is the power you raise `@b{b}` to, to get `x`. So the exponent law `(@b{b}^m)^{@n{n}} = @b{b}^{m@n{n}}` has a logarithm twin, the \u003cstrong>power law of logarithms\u003c/strong>: `log_{@b{b}}(x^{@n{n}}) = @n{n} log_{@b{b}} x`, for `x > 0`. It turns a power into a multiplication. It also gives the \u003cstrong>change of base formula\u003c/strong>, `log_{@b{b}} x = log x / log @b{b}`, which lets you find a logarithm in any base using only common logarithms.","fig":{"aria":"A base-2 log ruler with numbers 1, 2, 4, 8, 16, 32 and 64 equally spaced. A block from 1 to 4 is copied end to end three times and lands on 64. Then the length labels change to base-10 lengths while the blocks stay where they are."}},"goals":["I can explain why `log_{@b{b}}(x^{@n{n}}) = @n{n} log_{@b{b}} x`, using the exponent law `(@b{b}^m)^{@n{n}} = @b{b}^{m@n{n}}` and the picture of `@n{n}` equal lengths laid end to end.","I can use the power law to evaluate logarithms of powers, roots and reciprocals, such as `log_2 ∛16` or `log(1/1000)`, and to write `@n{n} log_{@b{b}} x` as a single logarithm.","I can use the change of base formula `log_{@b{b}} x = log x / log @b{b}`: exactly when both numbers are powers of a common base, and approximately from given values when they aren’t.","I can tell equivalent logarithmic expressions from ones that only look alike, such as `log(x^2)` and `(log x)^2`, and say for which `x` the power law holds.","I can use the power law and change of base to solve problems: estimate a logarithm, work backwards to an unknown base or number, and answer questions about size and number of steps."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Exponent laws","goal":1,"prompt":"Simplify `(2^3)^4`.","options":[{"t":"`2^{12}`","why":"A power of a power: multiply the exponents. `(2^3)^4 = 2^3 × 2^3 × 2^3 × 2^3 = 2^{3 + 3 + 3 + 3} = 2^{12}`.","_n":"0725","_k":"25fe14db"},{"t":"`6^4`","why":"`2^3` is 8, not 2 × 3 = 6. `(2^3)^4 = 8^4 = 2^{12}`.","_n":"1735","_k":"ff271870"},{"t":"`2^7`","why":"Adding exponents is for multiplying two powers, like `2^3 × 2^4`. Here `2^3` is used 4 times, so the exponent is 3 × 4 = 12.","_n":"2745","_k":"f5002450"},{"t":"`2^{81}`","why":"That’s 2 to the power `3^4`. `(2^3)^4` means `2^3` multiplied by itself 4 times, so the exponent is 3 × 4.","_n":"3755","_k":"39266558"}],"hints":["`(2^3)^4` means `2^3 × 2^3 × 2^3 × 2^3`.","Multiplying powers of 2 adds their exponents: 3 + 3 + 3 + 3.","That’s 3 × 4 = 12, so `(2^3)^4 = 2^{12} = 4096`."]},{"id":"w2","skill":"Exponent laws","goal":1,"prompt":"`5^m = 7`. What is `5^{3m}`?","options":[{"t":"10","why":"Adding 3 to 7 isn’t an exponent law. `5^{3m} = (5^m)^3`.","_n":"4765","_k":"eadd4038"},{"t":"21","why":"21 = 3 × 7 would be `3 × 5^m`. Tripling the \u003cstrong>exponent\u003c/strong> cubes the power: `5^{3m} = (5^m)^3`.","_n":"5775","_k":"51ac9fe0"},{"t":"343","why":"`5^{3m} = (5^m)^3 = 7^3 = 343`.","_n":"6785","_k":"91ba3993"},{"t":"2187","why":"That’s `3^7`. You need `7^3 = 343`.","_n":"7795","_k":"cfd0f2a8"}],"hints":["Write `5^{3m}` using `5^m`.","By the power-of-a-power law, `5^{3m} = (5^m)^3`.","`(5^m)^3 = 7^3 = 343`."]},{"id":"w3","skill":"Rational and negative exponents","goal":2,"prompt":"Write `1/√8` as a power of 2.","options":[{"t":"`2^{3/2}`","why":"That’s `√8` itself. Putting a power under 1 makes its exponent negative.","_n":"87a5","_k":"2f2783a3"},{"t":"`2^{-3/2}`","why":"8 = `2^3`, so `√8 = (2^3)^{1/2} = 2^{3/2}`, and 1 over it is `2^{-3/2}`.","_n":"9a44","_k":"64305921"},{"t":"`2^{-2/3}`","why":"A square root multiplies the exponent by 1/2: 3 × 1/2 = 3/2, not 2/3.","_n":"aa34","_k":"b9fd6b09"},{"t":"`2^{-3}`","why":"`2^{-3} = 1/8`. The square root halves the exponent, so `1/√8 = 2^{-3/2}`.","_n":"ba24","_k":"44cc781b"}],"hints":["Write 8 as a power of 2 first.","8 = `2^3`. A square root is the power 1/2, so `√8 = 2^{3/2}`.","`1/√8 = 1/2^{3/2} = 2^{-3/2}`."]},{"id":"w4","skill":"Exponential and logarithmic form","goal":1,"prompt":"If `log_b x = m`, which equation must be true?","options":[{"t":"`m^b = x`","why":"Test it with `log_2 8 = 3`: `3^2 = 9`, not 8. The base is the one being raised to a power.","_n":"ca14","_k":"79077bad"},{"t":"`b^m = x`","why":"A logarithm is an exponent: `log_b x = m` says that `b` to the power `m` is `x`.","_n":"da84","_k":"cf8f99d8"},{"t":"`b^x = m`","why":"Test it with `log_2 8 = 3`: `2^8 = 256`, not 3.","_n":"ea74","_k":"8c91f3f1"},{"t":"`x^m = b`","why":"Test it with `log_2 8 = 3`: `2^3 = 8` is true, but `8^3 = 2` is not.","_n":"fa64","_k":"aaf5bf83"}],"hints":["Try a log you know: `log_2 8 = 3`.","`log_2 8 = 3` because `2^3 = 8`. Which letter plays the part of 2, which plays 3, and which plays 8?","The base `b` raised to the log `m` gives the number `x`: `b^m = x`."]},{"id":"w5","skill":"Evaluating logarithms","goal":2,"prompt":"Evaluate `log_2 32`.","options":[{"t":"1/5","why":"1/5 is `log_32 2`. `log_2 32` asks what power of 2 gives 32.","_n":"ga54","_k":"2526a84d"},{"t":"4","why":"That product has four × signs but five 2s: `2^5 = 32`.","_n":"hac4","_k":"15ace3cc"},{"t":"5","why":"`2^5 = 32`, so `log_2 32 = 5`.","_n":"iab4","_k":"10a24d83"},{"t":"16","why":"`log_2 32` isn’t 32 ÷ 2. It’s the exponent: 2 to what power is 32?","_n":"jaa4","_k":"a0ca2220"}],"hints":["What power of 2 gives 32?","Count the doublings from 1: 2, 4, 8, 16, 32.","Five doublings: `2^5 = 32`, so `log_2 32 = 5`."]},{"id":"w6","skill":"Evaluating logarithms","goal":2,"prompt":"Evaluate `log 0.001`.","options":[{"t":"−2","why":"0.001 has two zeros after the point, but it is 1/1000 = `10^{-3}`.","_n":"kab4","_k":"96a9a37e"},{"t":"It’s undefined","why":"The number inside, 0.001, is positive, so its log exists. It’s the log itself that’s negative: −3.","_n":"la84","_k":"95b96e33"},{"t":"3","why":"`log 1000 = 3`. 0.001 is less than 1, so its log is negative.","_n":"ma94","_k":"5c094e07"},{"t":"−3","why":"0.001 = 1/1000 = `10^{-3}`, so `log 0.001 = -3`.","_n":"na64","_k":"b40e9da8"}],"hints":["Write 0.001 as a power of 10.","0.001 = 1/1000 = `1/10^3 = 10^{-3}`.","`log 0.001 = log 10^{-3} = -3`."]}],"refreshers":{"Exponent laws":"Multiplying powers of the same base adds the exponents: `2^3 × 2^4 = 2^7`. A power of a power multiplies them: `(2^3)^4 = 2^{12}`, because `2^3` is used four times. The same law works backwards: `5^{3m} = (5^m)^3`. This law is the whole reason the power law of logarithms works.","Rational and negative exponents":"A negative exponent means “one over”: `2^{-3} = 1/8`. A fractional exponent means a root: `x^{1/2} = √x` and `x^{1/3} = ∛x`. They combine: `1/√8 = 1/(2^3)^{1/2} = 2^{-3/2}`.","Exponential and logarithmic form":"`log_b x = m` and `b^m = x` say the same thing. A logarithm is an exponent: `log_2 8 = 3` because `2^3 = 8`. “`log x`” with no base written means base 10 (module 38).","Evaluating logarithms":"Ask: what power of the base gives the number? `log_2 32 = 5` because `2^5 = 32`; `log 0.001 = -3` because `10^{-3} = 0.001`. The number inside must be positive, but the log can be negative, zero or positive (module 38)."}}},"explore":{"heading":"Power stacker","intro":"A logarithm is a length on a log ruler. Lay copies of one length end to end and see where they land. Then measure one length in steps of another, and compare the graphs. Three modes, one idea.","predictions":[{"id":"p1","start":{"mode":"stack","b":10,"x":"2","n":[1,1]},"prompt":"One block runs from 1 to 2 on a base-10 ruler. The stack will grow to three of these blocks in all, laid end to end. Where will the stack end?","options":[{"t":"6","_n":"oa74","_k":"455a75a7"},{"t":"8","_n":"pa44","_k":"172ef8d0"},{"t":"9","_n":"qa54","_k":"8106c1af"},{"t":"1000","_n":"rb24","_k":"c14e07ba"}],"explain":"Each block is a factor of 2: 1 to 2, 2 to 4 and 4 to 8 are the same length on a log ruler. Three blocks reach 2 × 2 × 2 = `2^3 = 8`, so `log 8 = 3 log 2`. The stack doesn’t add 2 each time (that would give 6), it doesn’t reach `3^2 = 9`, and three blocks reach 1000 only when each block runs from 1 to 10.","rm":"`@n{n}` went from 1 to 3; the stack now ends at 8."},{"id":"p2","start":{"mode":"stack","b":3,"x":"9","n":[1,1]},"prompt":"`@n{n}` will change from 1 to 1/2, so only half of the block is used. Where will the half block end?","options":[{"t":"1","_n":"sb34","_k":"1e77be8e"},{"t":"3","_n":"tb04","_k":"ed0f5141"},{"t":"4.5","_n":"uaf4","_k":"7c1d10d0"},{"t":"81","_n":"vb24","_k":"8a4f9466"}],"explain":"Half the \u003cstrong>length\u003c/strong> means half the \u003cstrong>exponent\u003c/strong>: `9^{1/2} = √9 = 3`, and `log_3 3 = 1`, which is half of `log_3 9 = 2`. Halving the number gives 4.5, but `log_3 4.5 ≈ 1.37`, not 1. The half block’s length is 1, but it ends at the number 3. And 81 is what two blocks reach (`@n{n} = 2`).","rm":"`@n{n}` went from 1 to 1/2; the half block now ends at 3, and 4.5 is marked further right."},{"id":"p3","start":{"mode":"measure","b":"8","x":"32","units":"2","swap":false},"prompt":"The ruler’s units will change from base 2 to base 10. Both lengths will be relabelled. What will happen to the count of 8-sticks?","options":[{"t":"It shrinks to about 0.3 times as much, because the lengths are multiplied by `log 2 ≈ 0.301`","_n":"wb14","_k":"3815f5d0"},{"t":"It stays 5/3","_n":"xb44","_k":"6f84dd71"},{"t":"It becomes `log 4 ≈ 0.602`","_n":"yb34","_k":"d829735c"},{"t":"It becomes 4, because 32 ÷ 8 = 4","_n":"zb64","_k":"657d5d96"}],"explain":"Changing the units multiplies \u003cstrong>both\u003c/strong> lengths by the same number (here `log 2 ≈ 0.301`), so their ratio doesn’t change. That’s the change of base formula: `log_8 32 = log 32 / log 8 = log_2 32 / log_2 8 = 5/3`, whichever base you measure in. Dividing 32 by 8, or taking `log(32/8)`, treats a ratio of \u003cstrong>logs\u003c/strong> as if it were a ratio of numbers.","rm":"The units changed from base 2 to base 10: the lengths now read ≈ 1.505 and ≈ 0.903, and the count is still 5/3."},{"id":"p4","start":{"mode":"graph","law":"power","b":10,"n":2},"prompt":"The teal curve is `y = 2 log x`. The blue curve `y = log(x^2)` will be drawn next. What will you see?","options":[{"t":"It’s a U-shaped curve, the graph of `(log x)^2`","_n":"10b54","_k":"a88861e8"},{"t":"It lies on the teal curve only where `x > 1`","_n":"11a84","_k":"968745d9"},{"t":"It lies exactly on the teal curve for `x > 0`, and also has a mirror-image branch for `x \u003c 0`","_n":"12a74","_k":"df47d612"},{"t":"It lies exactly on the teal curve, and nowhere else","_n":"13364","_k":"b4529a43"}],"explain":"For `x > 0`, `log(x^2) = 2 log x`: that’s the power law, including `0 \u003c x \u003c 1`, where both are negative. But `x^2` is positive for negative `x` too, so `log(x^2)` also exists for `x \u003c 0`, where `2 log x` doesn’t. The power law needs `x > 0`. And `(log x)^2` is something else again: at `x = 1000`, `log(1000^2) = 6` but `(log 1000)^2 = 9`.","rm":"The blue curve `y = log(x^2)` was drawn: it lies on the teal curve for `x > 0` and has a second branch for `x \u003c 0`."}],"challenges":[{"id":"tc1","goal":[2,5],"prompt":"Stack mode. The base is 3 and the block is `log_3 9` (both locked). Choose `@n{n}` so the stack lands \u003cstrong>exactly\u003c/strong> on 1/81.","fb":{"n2":"Your stack lands on 81: right distance, wrong direction. 1/81 is between 0 and 1, so it’s to the left of 1, and the blocks must point backwards.","nm4":"Your stack lands on 1/6561. Each 9-block is 2 units long on the base-3 ruler, so four of them go 8 units left. 1/81 = `3^{-4}` is only 4 units left of 1.","nmh":"Half a backward block reaches `9^{-1/2} = 1/3`. You need to go further.","nm1":"One backward block reaches 1/9. 1/81 is twice as far.","other":"Your stack lands on `9^{@n{n}}` = {v}. You need 1/81."},"general":"Set up the stacker for this challenge first: Stack mode, base 3, block 9.","hints":["1/81 is less than 1. Which way must the blocks point?","On the base-3 ruler, 1/81 = `3^{-4}` is 4 units left of 1, and each block is `log_3 9 = 2` units long.","−4 ÷ 2 = −2, so `@n{n} = -2`. Check: `9^{-2} = 1/81`."]},{"id":"tc2","goal":[2,3],"prompt":"Stack mode. The base is 2 and the block is `log_2 8` (both locked). Make the stack land \u003cstrong>exactly\u003c/strong> on 4. No slider step reaches it, so use the exact `@n{n}` box.","fb":{"nh":"Half a block is a square root: `8^{1/2} = √8 ≈ 2.828`. 4 is a little further than half a block.","n13":"A third of a block is a cube root: `∛8 = 2`. 4 is two of those thirds.","n32":"You flipped the fraction: `8^{3/2} = 16√2 ≈ 22.627`. You need (length to 4) ÷ (length of the block).","n1":"One whole block reaches 8. 4 is less than one block.","other":"Your stack lands on `8^{@n{n}}` = {v}. You need 4."},"general":"Set up the stacker for this challenge first: Stack mode, base 2, block 8.","hints":["On the base-2 ruler, how long is the block, and how far is 4 from 1?","The block is `log_2 8 = 3` units, and 4 is `log_2 4 = 2` units from 1. You need `@n{n} × 3 = 2`.","`@n{n} = 2/3`. Check: `8^{2/3} = (∛8)^2 = 2^2 = 4`. (You’ve just found `log_8 4 = 2/3` by change of base.)"]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Measure mode. Choose a base `@b{b}` and a number `x`, with `x ≠ @b{b}`, so that `log_{@b{b}} x` and `log_x @b{b}` are \u003cstrong>equal\u003c/strong>. Turn on Swap roles to see both measurements.","fb":{"same":"Both values are 1, but that’s the same number twice. Choose `x ≠ @b{b}`.","one":"`log_{@b{b}} 1 = 0`, and 1 can’t be a base, so `log_1 @b{b}` doesn’t exist.","pair":"{L1} = {v1} but {L2} = {v2}. Swapping the two numbers always turns the value into its reciprocal. Which numbers equal their own reciprocal?","other":"Your values are {v1} and {v2}: reciprocals, as always when you swap. Make them equal."},"general":"Switch the stacker to Measure mode first.","hints":["Turn on Swap roles. What happens to the count when `@b{b}` and `x` trade places?","Swapping turns `log_{@b{b}} x` into `1/(log_{@b{b}} x)`, because (length to `@b{b}`) ÷ (length to `x`) is the upside-down ratio. So you need a number equal to its own reciprocal.","Only 1 and −1 equal their own reciprocals. 1 needs `x = @b{b}`, which isn’t allowed. So `log_{@b{b}} x = -1`, which means `x = 1/@b{b}`: for example `@b{b} = 2` and `x = 1/2`."]}]},"part3":{"slug":"base","name":"Change base","heading":"Base bridge: change of base without a calculator","intro":"Three rounds. In each one, find the logarithm without a calculator. The block bars check every step you make.","rounds":[{"id":"r1","goal":3,"title":"Round 1: a common base","find":"Find `log_4 128`.","base":"4","num":"128","c":2,"p":2,"q":7,"copies":"3½ copies = 7/2","steps":[{"id":"r1s1","kind":"chips","label":"Step 1, choose a common base","chips":["2","3","4","10"],"_a":"QVQV","wrong":{"3":"4 and 128 aren’t powers of 3. Both are built from 2s.","4":"4 is a power of 4, but 128 isn’t a whole-number power of 4: `4^3 = 64` and `4^4 = 256`. Choose a base that builds both numbers in whole steps.","10":"4 and 128 aren’t powers of 10. Both are built from 2s."},"hints":["Which small number multiplies by itself to make both 4 and 128?","4 = 2 × 2. Is 128 made only of 2s too?","Choose 2: `4 = 2^2` and `128 = 2^7`."]},{"id":"r1s2","kind":"boxes","label":"Step 2, write the powers","boxes":[{"pre":"`4 = 2`","sup":true},{"pre":"and `128 = 2`","sup":true}],"_a":"OFQbUz4=","wrong":[{"box":1,"v":6,"fb":"`2^6 = 64`. Double once more."},{"box":1,"v":64,"fb":"64 is 128 ÷ 2. The exponent counts the 2s: `2^7 = 128`."}],"general":"Check each power: 2 to your exponent should give the number.","hints":["Count the doublings from 1.","2, 4 is two doublings. Keep going: 8, 16, 32, 64, 128.","Enter 2 and 7."]},{"id":"r1s3","kind":"frac","label":"Step 3, the logarithm","boxes":[{"pre":"`log_4 128 = log_2 128 / log_2 4 =`"}],"_a":"UEgC","display":"`7/2`","wrong":[{"v":0.2857142857142857,"fb":"Upside down. The number’s exponent goes on top: 7 ÷ 2."},{"v":32,"fb":"That’s 128 ÷ 4. Divide the \u003cstrong>exponents\u003c/strong>, not the numbers."},{"v":5,"fb":"That’s 7 − 2. Counting 4-steps divides: 7 ÷ 2."},{"v":14,"fb":"That’s 7 × 2. Each 4-step is two 2-steps, so there are \u003cstrong>fewer\u003c/strong> 4-steps, not more."}],"general":"Divide the number’s exponent by the base’s exponent.","check":"`4^{7/2} = (√4)^7 = 2^7 = 128` ✓","hints":["`log_4 128` asks: how many 4-bars fit into the 128-bar?","The 4-bar is 2 blocks long and the 128-bar is 7 blocks long.","7 ÷ 2 = 7/2. Check: `4^{7/2} = 2^7 = 128`."]}]},{"id":"r2","goal":[2,3],"title":"Round 2: roots and reciprocals","find":"Find `log_{√3}(1/27)`.","base":"√3","num":"1/27","c":3,"p":0.5,"q":-3,"copies":"−6","steps":[{"id":"r2s1","kind":"chips","label":"Step 1, choose a common base","chips":["2","3","10"],"_a":"QVUV","wrongAll":"`√3` and 1/27 are both built from 3s.","hints":["What number is under the root sign, and what is 27 made of?","`√3` is built from 3, and 27 = 3 × 3 × 3.","Choose 3."]},{"id":"r2s2","kind":"boxes","label":"Step 2, write the powers","boxes":[{"pre":"`√3 = 3`","sup":true},{"pre":"and `1/27 = 3`","sup":true}],"_a":"OFYZUU8VUW8=","wrong":[{"box":0,"v":2,"fb":"A square root is the power 1/2, not 2: `(3^{1/2})^2 = 3`."},{"box":1,"v":3,"fb":"27 = `3^3`, so 1/27 = `3^{-3}`. One over a power makes its exponent negative."}],"general":"Check each power: 3 to your exponent should give the number.","hints":["Write each number as 3 to some power. A square root is a power, and so is a reciprocal.","`√3 = 3^{1/2}`. 27 = `3^3`, so 1/27 = `3^{-3}`.","Enter 1/2 and −3."]},{"id":"r2s3","kind":"frac","label":"Step 3, the logarithm","boxes":[{"pre":"`log_{√3}(1/27) = log_3(1/27) / log_3 √3 =`"}],"_a":"TlA=","display":"−6","wrong":[{"v":-1.5,"fb":"That’s (−3) × (1/2). A half block is a short step, so it takes \u003cstrong>more\u003c/strong> steps: divide by 1/2."},{"v":6,"fb":"Right size, wrong sign. 1/27 is to the left of the start and `√3` is to the right, so the count is negative."},{"v":-0.16666666666666666,"fb":"Upside down: that’s (1/2) ÷ (−3). The number’s exponent goes on top."}],"general":"Divide the number’s exponent by the base’s exponent.","check":"`(√3)^{-6} = (3^{1/2})^{-6} = 3^{-3} = 1/27` ✓","hints":["How many `√3`-steps reach 1/27? Divide the number’s exponent by the base’s exponent.","`log_3(1/27) = -3` and `log_3 √3 = 1/2`, so you need (−3) ÷ (1/2).","(−3) ÷ (1/2) = −3 × 2 = −6. Check: `(√3)^{-6} = (3^{1/2})^{-6} = 3^{-3} = 1/27`."]}]},{"id":"r3","goal":[3,5],"title":"Round 3: no common base","find":"Estimate `log_2 5`.","use":"`log 2 ≈ 0.301`, `log 5 ≈ 0.699`","base":"2","num":"5","c":2,"p":1,"q":2.32,"steps":[{"id":"r3s1","kind":"boxes","label":"Step 1, bracket it","boxes":[{"pre":"`2`","sup":true},{"pre":"`\u003c 5 \u003c 2`","sup":true}],"post":", so `log_2 5` is between those two whole numbers.","_a":"OFQbVz4=","wrong":[{"v":[1,2],"fb":"`2^1 = 2` and `2^2 = 4` are both less than 5."},{"v":[4,8],"fb":"Those are the powers. Enter the exponents: `4 = 2^2` and `8 = 2^3`."}],"general":"Find the two whole-number powers of 2 on either side of 5.","note":"5 isn’t a whole-number power of 2, and 2 and 5 have no common base, so there’s no exact fraction. `log_2 5` still exists: it’s the exponent that turns 2 into 5.","hints":["List the powers of 2: 2, 4, 8, 16. Where does 5 fit?","`2^2 = 4` is less than 5, and `2^3 = 8` is more.","Enter 2 and 3."]},{"id":"r3s2","kind":"boxes","label":"Step 2, change of base with the given values","boxes":[{"pre":"`log_2 5 = log 5 / log 2 ≈`"},{"pre":"/"}],"_a":"OFYZUloBTgJNVQdVPg==","wrong":[{"v":[0.301,0.699],"fb":"Upside down: that’s `log_5 2`, which is less than 1. The number goes on top."}],"general":"Use the given values: the number’s log over the base’s log.","hints":["Change of base: the number’s log over the base’s log.","The number is 5 and the base is 2, so `log 5 ≈ 0.699` goes on top.","Enter 0.699 / 0.301."]},{"id":"r3s3","kind":"dec","label":"Step 3, estimate","boxes":[{"pre":"`log_2 5 ≈`"}],"post":" (to one decimal place)","_a":"GERBRlkKTAFPRFsLQQJQHFBKFQwKGlgATVUDGQ==","display":"2.3","wrong":[{"v":2.5,"fb":"That’s 5 ÷ 2: the logs were cancelled. Divide 0.699 by 0.301."},{"v":0.4,"fb":"That’s 0.699 − 0.301 = 0.398, which is `log 2.5`, not `log_2 5`. Change of base divides."},{"v":0.398,"fb":"That’s 0.699 − 0.301 = 0.398, which is `log 2.5`, not `log_2 5`. Change of base divides."},{"v":0.43,"fb":"That’s 0.301 ÷ 0.699, upside down."}],"outside":"Your answer should be between 2 and 3 (step 1).","inside":"Inside the bracket, but not close enough. Test it: 0.301 × {a} = {p}, and you need 0.699. Is your product too big or too small?","check":"0.301 × 2.3 ≈ 0.692 and 0.301 × 2.4 ≈ 0.722. 0.699 is between them, so 2.3 \u003c `log_2 5` \u003c 2.4 ✓","hints":["Divide 0.699 by 0.301. You can do it by testing products: 0.301 × 2.3 and 0.301 × 2.4.","0.301 × 2.3 = 0.6923 and 0.301 × 2.4 = 0.7224. 0.699 is between them, much closer to the first.","`log_2 5 ≈ 2.3` (more precisely about 2.32). It’s between 2 and 3, as step 1 said."]}]}],"why":{"title":"Why it works","intro":"Two short proofs. Choose the reason for each line. A wrong pick gets one line of feedback and another try.","reasons":["Definition of a logarithm","Power-of-a-power law","Power law of logarithms","Take the common log of both sides","Divide both sides by `log b`"],"wrongFb":["The definition switches between `log_b x = m` and `b^m = x`. This line doesn’t switch forms.","That law is about exponents: `(b^m)^n = b^{mn}`. This line doesn’t raise a power to a power.","That law brings an exponent out of a logarithm. No exponent comes out of a log on this line.","This line doesn’t take the logarithm of both sides of an equation.","Nothing is divided on this line."],"proofs":[{"id":"pf1","title":"Proof 1: the power law","lines":[{"t":"Let `m = log_b x`. Then `b^m = x`.","_a":"Uw=="},{"t":"`x^n = (b^m)^n = b^{mn}`.","_a":"Ug=="},{"t":"So `log_b(x^n) = mn = n log_b x`.","_a":"Uw=="}]},{"id":"pf2","title":"Proof 2: change of base","lines":[{"t":"Let `y = log_b x`. Then `b^y = x`.","_a":"Uw=="},{"t":"`log(b^y) = log x`.","_a":"UA=="},{"t":"`y log b = log x`.","_a":"UQ==","special":{"1":"That law is about exponents: `(b^m)^n = b^{mn}`. This line brings an exponent out of a \u003cstrong>logarithm\u003c/strong>. That’s the power law of logarithms."}},{"t":"`y = log x / log b`.","_a":"Vw==","note":"This is allowed because `b ≠ 1`, so `log b ≠ 0`."}]}],"closing":"Change of base is the power law at work: line 3 brings the exponent `y` down."},"blocks":[{"title":"What the methods mean","html":"\u003cp>\u003cstrong>Change of base without a calculator\u003c/strong>\u003c/p>\u003col>\u003cli>\u003cstrong>Look for a common base.\u003c/strong> Write both numbers as powers of it: `b = c^p` and `x = c^q`. Then `log_b x = q/p`, exactly.\u003c/li>\u003cli>\u003cstrong>No common base?\u003c/strong> Bracket first with whole-number powers of `b`. Then use the given common logs: `log_b x = log x / log b`. Check that your answer sits inside the bracket.\u003c/li>\u003cli>\u003cstrong>Check:\u003c/strong> `b` raised to your answer should give `x`.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Base check","summary":"Base check","items":[{"id":"q1","goal":3,"prompt":"`log_16 32`","choices":[{"t":"4/5","fb":"Upside down: that’s `log_32 16`.","_n":"14374","_k":"51c9c8d1"},{"t":"1","fb":"That’s 5 − 4. Change of base divides the exponents: 5 ÷ 4.","_n":"15384","_k":"a0395d8f"},{"t":"5/4","fb":"Right. 16 = `2^4` and 32 = `2^5`, so `log_16 32 = 5/4`. Check: `16^{5/4} = (2^4)^{5/4} = 2^5 = 32`.","_n":"16394","_k":"c83f41be"},{"t":"2","fb":"That’s 32 ÷ 16: the logs were cancelled.","_n":"17324","_k":"d7577a83"}]},{"id":"q2","goal":3,"prompt":"`log_8(1/16)`","choices":[{"t":"−4/3","fb":"Right. 8 = `2^3` and 1/16 = `2^{-4}`, so the count is −4 ÷ 3 = −4/3. Check: `8^{-4/3} = 1/(∛8)^4 = 1/2^4 = 1/16`.","_n":"18334","_k":"7649107e"},{"t":"−3/4","fb":"Upside down: that’s `log_{1/16} 8`.","_n":"19344","_k":"c671c7f7"},{"t":"−1/3","fb":"That’s `log_8(1/2)`. 1/16 is four halvings, not one.","_n":"1a354","_k":"f80f7ba6"},{"t":"4/3","fb":"Right size, wrong sign: 1/16 is less than 1.","_n":"1b2e4","_k":"e3263c92"}]},{"id":"q3","goal":3,"fixedOrder":true,"prompt":"`log_2 10` lies between…","choices":[{"t":"1 and 2","fb":"`log 10 = 1` is the base-10 log. In base 2, count doublings: 2, 4, 8, 16.","_n":"1c2f4","_k":"c48b7bc4"},{"t":"2 and 3","fb":"`2^3 = 8` is still less than 10.","_n":"1d3c4","_k":"abf1d845"},{"t":"3 and 4","fb":"Right. `2^3 = 8 \u003c 10 \u003c 16 = 2^4`. (In fact `log_2 10 = 1/log 2 ≈ 3.32`.)","_n":"1e3b4","_k":"61779742"},{"t":"5 and 6","fb":"That’s 10 ÷ 2 = 5. A logarithm isn’t a division.","_n":"1f3a4","_k":"a2ce0169"}]},{"id":"q4","goal":3,"prompt":"Which expression equals `log_5 7`?","choices":[{"t":"`log 5 / log 7`","fb":"Upside down: that’s `log_7 5`, which is less than 1.","_n":"1g394","_k":"06c0e868"},{"t":"`log(7/5)`","fb":"A quotient of logs isn’t the log of a quotient.","_n":"1h384","_k":"035fe0d2"},{"t":"7/5","fb":"The logs can’t be cancelled.","_n":"1i374","_k":"c1a6f764"},{"t":"`log 7 / log 5`","fb":"Right. Change of base: the number’s log over the base’s log.","_n":"1j364","_k":"d6d30c6d"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Sort by value","summary":"Sort by value","noun":"expression","goal":[3,2],"instruction":"Sort each logarithm into the box with its value. No calculator needed.","how":"Tap an expression, then tap the box it belongs in.","boxes":[{"id":"b1","label":"`3/2`"},{"id":"b2","label":"`2/3`"},{"id":"b3","label":"`-3/2`"},{"id":"b4","label":"`-2/3`"}],"items":[{"id":"s1","t":"`log_4 8`","_a":"QQQGRg==","why":"4 = `2^2` and 8 = `2^3`, so the count is 3 ÷ 2.","wrong":{"b2":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 3 ÷ 2.","b3":"Right size, wrong sign. The base and the number are both greater than 1, so the count is positive.","b4":"Upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 3 ÷ 2. Wrong sign too. The base and the number are both greater than 1, so the count is positive."},"hints":["Write 4 and 8 as powers of one common base.","4 = `2^{2}` and 8 = `2^{3}`.","3 ÷ 2 = 3/2, so it goes in the 3/2 box."]},{"id":"s2","t":"`log_9 27`","_a":"QQQGRg==","why":"9 = `3^2` and 27 = `3^3`: 3 ÷ 2.","wrong":{"b2":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 3 ÷ 2.","b3":"Right size, wrong sign. The base and the number are both greater than 1, so the count is positive.","b4":"Upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 3 ÷ 2. Wrong sign too. The base and the number are both greater than 1, so the count is positive."},"hints":["Write 9 and 27 as powers of one common base.","9 = `3^{2}` and 27 = `3^{3}`.","3 ÷ 2 = 3/2, so it goes in the 3/2 box."]},{"id":"s3","t":"`log √1000`","_a":"QQQGRg==","why":"`√1000 = 10^{3/2}`, so `log √1000 = (1/2) × 3 = 3/2`. That’s the power law with `n = 1/2`.","wrong":{"b2":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u  ÷ (−2). The base is less than 1, so its sticks point left while 8 is to the right.","wrong":{"b1":"Right size, wrong sign. The base is less than 1, so the count is negative.","b2":"Upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 3 ÷ (−2). Wrong sign too. The base is less than 1, so the count is negative.","b4":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 3 ÷ (−2)."},"hints":["Write 1/4 and 8 as powers of one common base.","1/4 = `2^{-2}` and 8 = `2^3`. How many (1/4)-steps reach 8?","3 ÷ (−2) = −3/2. Check: `(1/4)^{-3/2} = 4^{3/2} = 8`."]},{"id":"s10","t":"`log_8(1/4)`","_a":"QQQDRg==","why":"8 = `2^3` and 1/4 = `2^{-2}`: −2 ÷ 3.","wrong":{"b1":"Upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: (−2) ÷ 3. Wrong sign too. The number is less than 1, so the count is negative.","b2":"Right size, wrong sign. The number is less than 1, so the count is negative.","b3":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: (−2) ÷ 3."},"hints":["Write 8 and 1/4 as powers of one common base.","8 = `2^{3}` and 1/4 = `2^{−2}`.","(−2) ÷ 3 = −2/3, so it goes in the −2/3 box."]},{"id":"s11","t":"`log_{1/27} 9`","_a":"QQQDRg==","why":"1/27 = `3^{-3}` and 9 = `3^2`: 2 ÷ (−3).","wrong":{"b1":"Upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 2 ÷ (−3). Wrong sign too. The base is less than 1, so the count is negative.","b2":"Right size, wrong sign. The base is less than 1, so the count is negative.","b3":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: 2 ÷ (−3)."},"hints":["Write 1/27 and 9 as powers of one common base.","1/27 = `3^{−3}` and 9 = `3^{2}`.","2 ÷ (−3) = −2/3, so it goes in the −2/3 box."]},{"id":"s12","t":"`log_{√8}(1/2)`","_a":"QQQDRg==","why":"`√8 = 2^{3/2}` and 1/2 = `2^{-1}`: −1 ÷ (3/2) = −2/3.","wrong":{"b1":"Upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: (−1) ÷ (3/2). Wrong sign too. The number is less than 1, so the count is negative.","b2":"Right size, wrong sign. The number is less than 1, so the count is negative.","b3":"Right sign, but upside down. Divide the \u003cstrong>number’s\u003c/strong> exponent by the \u003cstrong>base’s\u003c/strong> exponent: (−1) ÷ (3/2)."},"hints":["Write `√8` and 1/2 as powers of 2.","`√8 = (2^3)^{1/2} = 2^{3/2}`, and 1/2 = `2^{-1}`.","−1 ÷ (3/2) = −2/3. Check: `(√8)^{-2/3} = 2^{-1} = 1/2`."]}]},{"id":"moves","type":"custom","title":"Power moves","summary":"Power moves","star":true,"goal":[2,3,5],"instruction":"Find each value without a calculator. The last four are puzzles: they need more than one step.","how":"Type your answer, then press Check. Fractions like −4/3 are fine.","items":[{"id":"n1","goal":2,"box":"fraction","prompt":"Evaluate `log_2(1/∛16)`.","_a":"TlcZV1ALUQFQVQRXUAtRAVBVBA==","display":"`-4/3`","wrong":[{"v":1.3333333333333333,"fb":"Right size, wrong sign. `1/∛16` is less than 1, so its log is negative."},{"v":-4,"fb":"That’s `log_2(1/16)`. The cube root takes a third of that."},{"v":-0.75,"fb":"Upside down. The cube root multiplies the exponent −4 by 1/3."},{"v":-5.333333333333333,"fb":"That divides the \u003cstrong>number\u003c/strong> 16 by 3. Take a third of its \u003cstrong>log\u003c/strong>, `log_2 16 = 4`."}],"hints":["Write `1/∛16` as a power of 2.","16 = `2^4`, so `∛16 = 2^{4/3}` and `1/∛16 = 2^{-4/3}`.","`log_2 2^{-4/3} = -4/3`."]},{"id":"n2","goal":3,"box":"fraction","prompt":"Evaluate `log_32 8`.","_a":"U0gB","display":"`3/5`","wrong":[{"v":1.6666666666666667,"fb":"Upside down: that’s `log_8 32`."},{"v":4,"fb":"That’s 32 ÷ 8. Divide the exponents, not the numbers."},{"v":2,"fb":"That’s 5 − 3. Divide: 3 ÷ 5."}],"hints":["Write 32 and 8 as powers of 2.","32 = `2^5` and 8 = `2^3`. What fraction of a 32-step is an 8?","3 ÷ 5 = 3/5. Check: `32^{3/5} = 2^3 = 8`."]},{"id":"n3","goal":3,"box":"number","prompt":"`log_2 x = 12`. Find `log_8 x`.","_a":"Vw==","display":"`log_8 x = 4`","wrong":[{"v":36,"fb":"8 = `2^3` is a bigger base, so it takes \u003cstrong>fewer\u003c/strong> steps: 12 ÷ 3, not 12 × 3."},{"v":1.5,"fb":"That’s 12 ÷ 8. Divide by `log_2 8 = 3`, not by 8."},{"v":4096,"fb":"That’s `x` itself (`2^{12}`). The question asks for `log_8 x`."}],"hints":["Change of base: `log_8 x = log_2 x / log_2 8`.","`log_2 8 = 3`.","`log_8 x = 12 ÷ 3 = 4`. Check: `8^4 = 2^{12}`, and `log_2 2^{12} = 12`."]},{"id":"n4","goal":5,"box":"number","prompt":"`log_b 32 = 5/2`. Find `b`.","_a":"Vw==","display":"`b = 4`","wrong":[{"v":2,"fb":"`log_2 32 = 5`, not 5/2. You took the fifth root of 32 but didn’t square it."},{"v":80,"fb":"That’s 32 × 5/2. The log is an exponent: `b^{5/2} = 32`."},{"v":12.8,"fb":"That’s 32 ÷ 5/2. Solve `b^{5/2} = 32` instead."}],"hints":["Rewrite in exponential form: `b^{5/2} = 32`.","Raise both sides to the power 2/5: `b = 32^{2/5}`.","The fifth root of 32 is 2, and `2^2 = 4`, so `b = 4`. Check: `4^{5/2} = 2^5 = 32`."]},{"id":"n5","goal":5,"box":"decimal","star":true,"prompt":"Estimate `log_3 29` to one decimal place.","use":"`log 3 ≈ 0.477` and `log 29 ≈ 1.462`","_a":"GERBRlkLTANPRFsLQQJRHFNTG0YLUUAIUEgGGQ==","display":"`log_3 29 ≈ 3.1`","wrong":[{"v":3,"fb":"`3^3 = 27` is less than 29, so `log_3 29` is a little more than 3: 0.477 × 3 = 1.431 \u003c 1.462."},{"v":0.33,"fb":"Upside down: 0.477 ÷ 1.462 is `log_29 3`."},{"v":0.99,"fb":"That’s 1.462 − 0.477. Change of base divides."},{"v":0.985,"fb":"That’s 1.462 − 0.477. Change of base divides."},{"v":9.7,"fb":"That’s 29 ÷ 3: the logs were cancelled."}],"hints":["Change of base: `log_3 29 = log 29 / log 3`. Bracket first: 27 \u003c 29 \u003c 81, so it’s between 3 and 4.","≈ 1.462 ÷ 0.477. Test 0.477 × 3 = 1.431 and 0.477 × 3.1 = 1.4787.","1.462 is between 1.431 and 1.479, nearer the second, so `log_3 29 ≈ 3.06`, which is 3.1 to one decimal place."]},{"id":"n6","goal":5,"box":"number","star":true,"prompt":"How many digits does `2^{100}` have when it’s written out in full?","use":"`log 2 ≈ 0.301`","_a":"UFc=","display":"31 digits","wrong":[{"v":30,"fb":"`log(2^{100}) = 100 log 2 ≈ 30.1`, so `2^{100} ≈ 10^{30.1}`. That’s more than `10^{30}`, which already has 31 digits (a 1 and thirty 0s)."},{"v":100,"fb":"100 is the exponent. Each factor of 2 adds only about 0.301 of a digit."}],"hints":["A whole number with `k` digits is at least `10^{k - 1}` and less than `10^k`. Find the common log of `2^{100}`.","`log(2^{100}) = 100 log 2 ≈ 30.1`, so `2^{100} ≈ 10^{30.1}`: between `10^{30}` and `10^{31}`.","Numbers from `10^{30}` up to just below `10^{31}` have 31 digits, so `2^{100}` has 31 digits."]},{"id":"n7","goal":5,"box":"number","star":true,"prompt":"`log_8 x = log_2 3`. Find `x`.","_a":"UVE=","display":"`x = 27`","wrong":[{"v":3,"fb":"The bases are different, so the numbers can’t match: `log_8 3` is smaller than `log_2 3`."},{"v":24,"fb":"That multiplies 8 by 3. Use change of base: `log_8 x = log_2 x / 3`."},{"v":9,"fb":"8 = `2^3`, not `2^2`. So `log_2 x = 3 log_2 3`."}],"hints":["Write `log_8 x` in base 2 using change of base.","`log_8 x = log_2 x / log_2 8 = log_2 x / 3`. So `log_2 x / 3 = log_2 3`.","`log_2 x = 3 log_2 3 = log_2 3^3 = log_2 27` (the power law), so `x = 27`."]},{"id":"n8","goal":5,"box":"fraction","star":true,"prompt":"Exactly one fraction `p/q` in lowest terms, with `q` = 2, 3 or 4, lies strictly between `log_3 5` and `log_2 3`. Find it without a calculator.","_a":"UkgC","display":"`3/2`","wrong":[{"v":1.3333333333333333,"fb":"4/3 is below `log_3 5`: `3^4 = 81 \u003c 125 = 5^3`, so `3^{4/3} \u003c 5`."},{"v":1.6666666666666667,"fb":"5/3 is above `log_2 3`: `2^5 = 32 > 27 = 3^3`, so `2^{5/3} > 3`."},{"v":1.25,"fb":"5/4 is below `log_3 5`: `3^5 = 243 \u003c 625 = 5^4`."},{"v":1.75,"fb":"7/4 is above `log_2 3`: `2^7 = 128 > 81 = 3^4`."}],"hints":["Try 3/2. Is `log_2 3` bigger or smaller than 3/2? Compare `2^{3/2}` with 3 by squaring both.","`(2^{3/2})^2 = 8 \u003c 9 = 3^2`, so `2^{3/2} \u003c 3` and `log_2 3 > 3/2`. Now compare `3^{3/2}` with 5 the same way.","`(3^{3/2})^2 = 27 > 25 = 5^2`, so `3^{3/2} > 5` and `log_3 5 \u003c 3/2`. So 3/2 lies between them."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the Error","student":"Nathan","how":"","instruction":"Nathan made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Evaluate `log_4 32` without a calculator.","steps":["By change of base, `log_4 32 = log 32 / log 4`.","`log 32 / log 4 = log(32/4)`","`= log 8`","`= 3 log 2 ≈ 0.903`"],"_a":"Ug==","stepFb":["Step 1 is correct: the number’s log over the base’s log. Keep checking the steps after it.","","Step 3 simplifies step 2 correctly. The mistake is earlier.","Step 4 uses the power law correctly on `log 8`. The mistake is earlier."],"fixes":[{"t":"`log 32 / log 4 = log 4 / log 32 = 2/5`.","why":"Upside down: 2/5 is `log_32 4`.","_n":"1k354","_k":"6c294218"},{"t":"Step 2 is correct as written.","why":"Nathan’s answer, about 0.903, is less than 1, so 4 to that power is less than `4^1 = 4`, nowhere near 32. And `4^2 = 16 \u003c 32 \u003c 64 = 4^3`, so `log_4 32` must be between 2 and 3. A quotient of logs isn’t the log of a quotient.","_n":"1l344","_k":"e64e9b02"},{"t":"Use the power law on both logs: `log 32 / log 4 = 5 log 2 / (2 log 2) = 5/2`.","why":"`log 2` cancels because it’s a common \u003cstrong>factor\u003c/strong> of the top and bottom. Check: `4^{5/2} = (√4)^5 = 2^5 = 32`.","_n":"1m334","_k":"2d2364bf"},{"t":"`log 32 / log 4 = 32/4 = 8`.","why":"The word “log” isn’t a number you can cancel. `log 32 / log 4 = 5/2`, not 8.","_n":"1n224","_k":"0e328551"}],"hints":["Test the final answer: does 4 raised to it give 32?","0.903 is less than 1, so `4^{0.903}` is less than 4. But `4^2 = 16 \u003c 32 \u003c 64 = 4^3`, so `log_4 32` is between 2 and 3. Which step changed the value? Is (`log 32`) ÷ (`log 4`) the same as `log(32 ÷ 4)`?","Step 2 is wrong. Use the power law: `log 32 = 5 log 2` and `log 4 = 2 log 2`, so `log_4 32 = 5/2`."]},{"id":"e2","goal":4,"task":"Find every value of `x` that makes `log(x^2) = 4` true.","steps":["By the power law, `log(x^2) = 2 log x`.","So `2 log x = 4`, and `log x = 2`.","`x = 10^2 = 100`.","The only solution is `x = 100`."],"_a":"Uw==","stepFb":["","Step 2 follows correctly from step 1. The mistake is earlier.","Step 3 converts `log x = 2` correctly. The mistake is earlier.","Step 4 sums up the steps before it. Something earlier lost a solution."],"fixes":[{"t":"`log(x^2) = (log x)^2`, so `log x = ±2` and `x = 100` or `x = 1/100`.","why":"`log(x^2)` isn’t `(log x)^2`. Check `x = 1/100`: `log(1/10 000) = -4`, not 4.","_n":"1o234","_k":"0b5b68e5"},{"t":"`log(x^2) = 4` means `x^2 = 10^4 = 10 000`, so `x = 100` or `x = -100`.","why":"`x^2` is positive for both. Check: `log((-100)^2) = log 10 000 = 4`. The power law only works for `x > 0`, so step 1 threw away the negative solution.","_n":"1p204","_k":"c3e60b7a"},{"t":"Step 1 is right, and `x = -100` can’t be a solution, because `log(-100)` is undefined.","why":"Test `x = -100` in the \u003cstrong>original\u003c/strong> equation: `log((-100)^2) = log 10 000 = 4`. It works, and `log(-100)` never appears.","_n":"1q214","_k":"cfe57b69"},{"t":"Step 1 is correct as written.","why":"Try `x = -100`: `log((-100)^2) = 4`, so it’s a solution, but `2 log(-100)` is undefined. Step 1 is only true when `x > 0`.","_n":"1r264","_k":"39f08d59"}],"hints":["Test `x = -100` in the original equation.","`log((-100)^2) = log 10 000 = 4`, so −100 is a solution. Which step lost it?","Step 1: `log(x^2) = 2 log x` is only true for `x > 0`. Convert instead: `x^2 = 10 000`, so `x = ±100`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the Power stacker? Think about the half block, the backward blocks, or the two branches of `log(x^2)`."},{"id":"j2","q":"In your own words, why does `log_b(x^n) = n log_b x`? Use the idea that a logarithm is an exponent."},{"id":"j3","q":"Explain to a friend how to find `log_27 81` without a calculator, and what you would do differently for `log_3 20`."},{"id":"j4","q":"Which part is still shaky for you: the power law, change of base, or knowing when the power law needs `x > 0`? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"What is the value of `log_2(16^3)`?","options":[{"t":"7","why":"That adds: 4 + 3. The power law multiplies the log by the exponent: 3 × 4.","_n":"1s274","_k":"fe889b85"},{"t":"12","why":"`log_2(16^3) = 3 log_2 16 = 3 × 4 = 12`. Check: `16^3 = (2^4)^3 = 2^{12}`.","_n":"1t244","_k":"0f218fda"},{"t":"48","why":"That’s 3 × 16: you multiplied the number, not its log. `log_2 16 = 4`, so the answer is 3 × 4.","_n":"1u254","_k":"50627431"},{"t":"64","why":"That’s `(log_2 16)^3 = 4^3`. The exponent is on 16, inside the log, so it comes out as a multiplier.","_n":"1v2a4","_k":"7c04aae2"}]},"b":{"prompt":"What is the value of `log_3(9^4)`?","options":[{"t":"6","why":"That adds: 2 + 4. The power law multiplies: 4 × 2.","_n":"1w2b4","_k":"a239f6fc"},{"t":"8","why":"`log_3(9^4) = 4 log_3 9 = 4 × 2 = 8`. Check: `9^4 = (3^2)^4 = 3^8`.","_n":"1xa85","_k":"e209e57c"},{"t":"16","why":"That’s `(log_3 9)^4 = 2^4`. The exponent comes out as a multiplier.","_n":"1ya75","_k":"0db2c6a9"},{"t":"36","why":"That’s 4 × 9: you multiplied the number, not its log.","_n":"1zaa5","_k":"a9028e60"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which expression is equal to `log_6 11`?","options":[{"t":"`log 6 / log 11`","why":"Upside down: that’s `log_11 6`. Check the pattern with `log_2 8 = 3`: `log 8 / log 2 = 3`, but `log 2 / log 8 = 1/3`.","_n":"20a95","_k":"a741a547"},{"t":"`log 11 / log 6`","why":"Change of base: `log_b x = log x / log b`. The number’s log goes on top.","_n":"21a45","_k":"7af25e34"},{"t":"`log 11 - log 6`","why":"Change of base divides the logs. `log 11 - log 6 ≈ 0.26`, but `log_6 11` is more than 1, because 11 > 6.","_n":"22a35","_k":"a74618eb"},{"t":"`(log 11)/6`","why":"Divide by `log 6`, not by 6. The base enters through its logarithm.","_n":"23a65","_k":"7bf6d36b"}]},"b":{"prompt":"Which expression is equal to `log_7 20`?","options":[{"t":"`log 20 - log 7`","why":"Change of base divides the logs. `log 20 - log 7 ≈ 0.46`, but `log_7 20` is more than 1, because 20 > 7.","_n":"24a55","_k":"7d9c1827"},{"t":"`log 7 / log 20`","why":"Upside down: that’s `log_20 7`, which is less than 1.","_n":"25b05","_k":"1fd06fc2"},{"t":"`(log 20)/7`","why":"Divide by `log 7`, not by 7.","_n":"26af5","_k":"04be48ee"},{"t":"`log 20 / log 7`","why":"Change of base: the number’s log over the base’s log.","_n":"27ae5","_k":"4c26c487"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which single logarithm is equal to `3 log_5 2`?","options":[{"t":"`log_5 9`","why":"That’s `3^2`, with the base and exponent swapped. The 3 becomes the exponent on 2: `2^3 = 8`.","_n":"28af5","_k":"8b958c10"},{"t":"`log_125 2`","why":"That moves the 3 onto the base, `5^3 = 125`. But `log_125 2 = (1/3) log_5 2`: a third, not three times.","_n":"29b05","_k":"a8ec74c6"},{"t":"`log_5 6`","why":"That multiplies the number 2 by 3. A multiplier in front of a log becomes an exponent on the number: `2^3`, not 2 × 3.","_n":"2ab15","_k":"7fc263eb"},{"t":"`log_5 8`","why":"The power law in reverse: `3 log_5 2 = log_5(2^3) = log_5 8`.","_n":"2bb25","_k":"9bf57cac"}]},"b":{"prompt":"Which single logarithm is equal to `2 log_3 5`?","options":[{"t":"`log_9 5`","why":"That moves the 2 onto the base, `3^2 = 9`. But `log_9 5 = (1/2) log_3 5`.","_n":"2cb35","_k":"7097fb0b"},{"t":"`log_3 10`","why":"That multiplies 5 by 2. The 2 becomes an exponent: `5^2`.","_n":"2db45","_k":"a3c5dcaf"},{"t":"`log_3 25`","why":"`2 log_3 5 = log_3(5^2) = log_3 25`.","_n":"2eb55","_k":"d51d9eb8"},{"t":"`log_3 32`","why":"That’s `2^5`, with the base and exponent swapped.","_n":"2fa65","_k":"5543a08e"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"For which values of `x` is the statement `log(x^4) = 4 log x` true?","options":[{"t":"Only for `x ≥ 1`","why":"Try `x = 1/10`: `log(10^{-4}) = -4` and `4 log(1/10) = 4 × (-1) = -4`. Negative logs are fine.","_n":"2ga75","_k":"692a8d1a"},{"t":"For every `x ≠ 0`","why":"Try `x = -10`: `log((-10)^4) = log 10 000 = 4`, but `4 log(-10)` is undefined.","_n":"2hb45","_k":"184d4dfb"},{"t":"Only for `x > 0`","why":"`log(x^4)` exists for every `x ≠ 0`, because `x^4 > 0`. But `4 log x` exists only for `x > 0`. Where both exist, the power law makes them equal, so the statement is true exactly when `x > 0`.","_n":"2ib35","_k":"556c3ae2"},{"t":"For every real number `x`","why":"At `x = 0` neither side exists, and for `x \u003c 0` the right side doesn’t.","_n":"2jb25","_k":"270d9477"}]},"b":{"prompt":"For which values of `x` is the statement `log_2(x^{-2}) = -2 log_2 x` true?","options":[{"t":"Only for `x ≥ 1`","why":"Try `x = 1/2`: `log_2 4 = 2` and `-2 log_2(1/2) = 2`.","_n":"2kb15","_k":"9ffa1095"},{"t":"Only for `x > 0`","why":"`x^{-2} = 1/x^2` is positive for every `x ≠ 0`, so the left side exists for `x ≠ 0`. The right side needs `x > 0`. Where both exist, the power law makes them equal.","_n":"2lb85","_k":"610164c8"},{"t":"For every `x ≠ 0`","why":"Try `x = -2`: `log_2((-2)^{-2}) = log_2(1/4) = -2`, but `-2 log_2(-2)` is undefined.","_n":"2mb75","_k":"ae147215"},{"t":"Never, because a negative exponent makes the logarithm undefined","why":"`x^{-2}` is still positive. Try `x = 2`: `log_2(1/4) = -2` and `-2 log_2 2 = -2`.","_n":"2nb65","_k":"06d118ef"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`log_b 64 = 3/2`. What is `b`?","options":[{"t":"4","why":"That’s `∛64` without the square. `log_4 64 = 3`, not 3/2.","_n":"2ob55","_k":"a8626db5"},{"t":"16","why":"`b^{3/2} = 64`, so `b = 64^{2/3} = (∛64)^2 = 4^2 = 16`. Check: `16^{3/2} = (√16)^3 = 4^3 = 64`.","_n":"2pac5","_k":"aebc7e8e"},{"t":"96","why":"That’s 64 × 3/2. The log is an exponent: `b^{3/2} = 64`.","_n":"2qab5","_k":"fdacbdf5"},{"t":"512","why":"That’s `64^{3/2}`: the power is the wrong way up. `log_512 64 = 2/3`.","_n":"2r3e1","_k":"02576d6b"}]},"b":{"prompt":"`log_b 729 = 3/2`. What is `b`?","options":[{"t":"9","why":"That’s `∛729` without the square. `log_9 729 = 3`, not 3/2.","_n":"2s3d1","_k":"26613813"},{"t":"81","why":"`b = 729^{2/3} = (∛729)^2 = 9^2 = 81`. Check: `81^{3/2} = 9^3 = 729`.","_n":"2t401","_k":"837497de"},{"t":"1093.5","why":"That’s 729 × 3/2. The log is an exponent: `b^{3/2} = 729`.","_n":"2u3f1","_k":"0693f333"},{"t":"19 683","why":"That’s `729^{3/2} = 27^3`: the power is the wrong way up. `log_19683 729 = 2/3`.","_n":"2v421","_k":"070edf99"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Which is the best estimate of `log_3 8`?","use":"`log 2 ≈ 0.301` and `log 3 ≈ 0.477`","options":[{"t":"0.43","why":"That’s 0.903 − 0.477: you subtracted the logs. Change of base divides them.","_n":"2w411","_k":"a47d3277"},{"t":"0.53","why":"That’s 0.477 ÷ 0.903, upside down. It’s `log_8 3`, which is less than 1 because 3 \u003c 8.","_n":"2x441","_k":"238196e9"},{"t":"1.89","why":"`log_3 8 = log 8 / log 3 = 3 log 2 / log 3 ≈ 0.903 / 0.477 ≈ 1.89`. It fits the bracket: 3 \u003c 8 \u003c 9, so `log_3 8` is between 1 and 2.","_n":"2y431","_k":"cb357f58"},{"t":"2.67","why":"That’s 8 ÷ 3: the logs were cancelled. `log 8 / log 3` isn’t 8/3, and 2.67 is outside the bracket 1 to 2.","_n":"2z361","_k":"ab8e9ba0"}]},"b":{"prompt":"Which is the best estimate of `log_7 16`?","use":"`log 2 ≈ 0.301` and `log 7 ≈ 0.845`","options":[{"t":"0.36","why":"That’s 1.204 − 0.845: you subtracted the logs.","_n":"30351","_k":"8dc19f6a"},{"t":"0.70","why":"That’s 0.845 ÷ 1.204, upside down. It’s `log_16 7`, which is less than 1.","_n":"31381","_k":"fbec4e46"},{"t":"1.42","why":"`log_7 16 = log 16 / log 7 = 4 log 2 / log 7 ≈ 1.204 / 0.845 ≈ 1.42`. It fits the bracket: 7 \u003c 16 \u003c 49.","_n":"32391","_k":"c87ba3cf"},{"t":"2.29","why":"That’s 16 ÷ 7: the logs were cancelled. 2.29 is outside the bracket 1 to 2.","_n":"33361","_k":"cc4ed236"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `log_b(x^n) = n log_b x` for `x > 0`?","options":[{"t":"Test it with `b = 2` and `x = 8`: `log_2(8^2) = log_2 64 = 6`, and `2 log_2 8 = 2 × 3 = 6`. The two sides agree, so the law is always true.","why":"One example can’t show that something is always true. You need a reason that works for every `x`.","_n":"34371","_k":"37a2e3a0"},{"t":"`log_b(x^n)` means `(log_b x)^n`, the log raised to the power `n`. Raising a number to the power `n` is the same as multiplying it by `n`, so this equals `n log_b x`.","why":"`(log_b x)^n` is a different expression, and raising to a power isn’t multiplying.","_n":"35341","_k":"f82e1b1e"},{"t":"Let `m = log_b x`, so `b^m = x`. Then `x^n = (b^m)^n = b^{mn}`. The exponent that turns `b` into `x^n` is `mn`, so `log_b(x^n) = mn = n log_b x`.","why":"This uses what a logarithm is, an exponent, and the power-of-a-power law. It works for every `x > 0`.","_n":"36351","_k":"44215cff"},{"t":"An exponent can always be moved to the front of an expression as a multiplier. So the `n` on `x` can come down in front of the log, and `log_b(x^n) = n log_b x` for any `x`.","why":"Not true in general: `(x + 1)^2` isn’t `2(x + 1)`. It works for logs because a log is an exponent.","_n":"37321","_k":"4c9eb55e"}]},"b":{"prompt":"Which is the best explanation of why `log_b √x = (1/2) log_b x` for `x > 0`?","options":[{"t":"Taking a square root always halves a number. So `√x` is half of `x`, and the log of half a number is half its log: `log_b √x = (1/2) log_b x`.","why":"A square root doesn’t halve a number: `√16 = 4`, not 8. It’s the \u003cstrong>log\u003c/strong> that halves.","_n":"38331","_k":"68e5b898"},{"t":"Test it with `x = 100`: `log √100 = log 10 = 1`, and `(1/2) log 100 = (1/2) × 2 = 1`. The two sides agree, so the law is always true.","why":"One example can’t show that something is always true. You need a reason that works for every `x`.","_n":"39401","_k":"ffb72fc7"},{"t":"Let `m = log_b x`, so `b^m = x`. Then `√x = (b^m)^{1/2} = b^{m/2}`. The exponent that turns `b` into `√x` is `m/2`, so `log_b √x = (1/2) log_b x`.","why":"This uses what a logarithm is and the power-of-a-power law, so it works for every `x > 0`.","_n":"3a411","_k":"91cd1d05"},{"t":"`log_b √x` means `√(log_b x)`, the square root of the log. Taking a square root is the same as dividing by 2, so this equals `(1/2) log_b x`.","why":"`√(log_b x)` is a different expression, and a square root isn’t division by 2.","_n":"3bb21","_k":"932a9d70"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Mei writes `log_2 5 = 2.32`. Which comment about her work is correct?","options":[{"t":"The value is right, but it’s an approximation, so she should write `log_2 5 ≈ 2.32`.","why":"`log_2 5 = log 5 / log 2 ≈ 2.32`, and `2^{2.32} ≈ 4.99`, not exactly 5. The exact value is `log_2 5` itself (or `log 5 / log 2`).","_n":"3cb11","_k":"041df57d"},{"t":"It’s wrong: `log_2 5` doesn’t exist, because 5 isn’t a power of 2.","why":"`log_2 5` exists: it’s the exponent between 2 and 3 that turns 2 into 5, since `2^2 = 4 \u003c 5 \u003c 8 = 2^3`. It just isn’t a whole number.","_n":"3db01","_k":"8674ce54"},{"t":"It’s exact, because `2^{2.32} = 5`.","why":"`2^{2.32} ≈ 4.993`. `log_2 5` has no exact decimal form, so use ≈.","_n":"3eaf1","_k":"040afc76"},{"t":"It’s wrong: `log_2 5 = log 5 / log 2 = 5/2 = 2.5`.","why":"`log 5 / log 2 ≈ 0.699 / 0.301 ≈ 2.32`. The logs can’t be cancelled.","_n":"3fb61","_k":"48298bd0"}]},"b":{"prompt":"Jae writes `log_3 10 = 2.1`. Which comment about his work is correct?","options":[{"t":"It’s exact, because `3^{2.1} = 10`.","why":"`3^{2.1} ≈ 10.05`. `log_3 10` has no exact decimal form, so use ≈.","_n":"3gb51","_k":"a2d71c72"},{"t":"The value is right to one decimal place, but it’s an approximation, so he should write `log_3 10 ≈ 2.1`.","why":"`log_3 10 = log 10 / log 3 = 1/log 3 ≈ 2.096`, and `3^{2.1} ≈ 10.05`, not exactly 10.","_n":"3hb41","_k":"279ef21f"},{"t":"It’s wrong: `log_3 10 = log 10 / log 3 = 10/3 ≈ 3.3`.","why":"The logs can’t be cancelled. `log 10 / log 3 = 1/log 3 ≈ 2.1`.","_n":"3ib31","_k":"1138556a"},{"t":"It’s wrong: `log_3 10` doesn’t exist, because 10 isn’t a power of 3.","why":"`log_3 10` exists: it’s between 2 and 3, since `3^2 = 9 \u003c 10 \u003c 27 = 3^3`.","_n":"3jba1","_k":"90f7582b"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A data centre gives every file an ID made of `n` binary digits (bits), which allows `2^n` different IDs. What is the smallest `n` that allows at least `10^{12}` IDs?","use":"`log 2 ≈ 0.301`","options":[{"t":"4","why":"That’s 12 × 0.301 ≈ 3.6, rounded up: you multiplied by `log 2` instead of dividing. `2^4 = 16` IDs is far too few.","_n":"3kb91","_k":"65a8efaa"},{"t":"6","why":"That’s 12 ÷ 2: you divided by the base, not by its logarithm.","_n":"3lac1","_k":"911a552e"},{"t":"39","why":"That’s 39.9 rounded down. `2^{39} ≈ 5.5 × 10^{11}` IDs, which is fewer than `10^{12}`. Round \u003cstrong>up\u003c/strong>.","_n":"3mad1","_k":"33fe45a8"},{"t":"40","why":"The exponent that gives exactly `10^{12}` is `log_2(10^{12}) = 12 log_2 10 = 12/log 2 ≈ 12/0.301 ≈ 39.9`. So `n` must be at least 39.9, and the smallest whole number that works is 40.","_n":"3nae1","_k":"d7c2d3a9"}]},"b":{"prompt":"A code uses `n` symbols, each one of 3 colours, which allows `3^n` different codes. What is the smallest `n` that allows at least `10^6` codes?","use":"`log 3 ≈ 0.477`","options":[{"t":"2","why":"That’s 6 ÷ 3: you divided by the base, not by its logarithm.","_n":"3oaf1","_k":"ad2c20bc"},{"t":"3","why":"That’s 6 × 0.477 ≈ 2.9, rounded up: you multiplied by `log 3` instead of dividing.","_n":"3pb01","_k":"6b112080"},{"t":"12","why":"That’s 12.6 rounded down. `3^{12} = 531 441` codes, which is fewer than `10^6`. Round \u003cstrong>up\u003c/strong>.","_n":"3qb11","_k":"5d13be5c"},{"t":"13","why":"The exponent that gives exactly `10^6` is `log_3(10^6) = 6 log_3 10 = 6/log 3 ≈ 6/0.477 ≈ 12.6`, so the smallest whole number that works is 13.","_n":"3rb21","_k":"c92e6a33"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"On a piano, each key up multiplies a note’s frequency by `2^{1/12}`. How many keys up from a 220 Hz note is the 880 Hz note?","options":[{"t":"1/6","why":"That’s 2 ÷ 12. Each key is a small step of 1/12 of a doubling, so it takes \u003cstrong>many\u003c/strong> keys: divide by 1/12.","_n":"3sb31","_k":"f438be94"},{"t":"2","why":"That’s `log_2 4 = 2` doublings (octaves). Each doubling takes 12 keys.","_n":"3tb41","_k":"62a8c360"},{"t":"24","why":"880 ÷ 220 = 4, so you need `(2^{1/12})^k = 4`. Then `k = log_{2^{1/12}} 4 = log_2 4 / log_2 2^{1/12} = 2 ÷ (1/12) = 24`.","_n":"3ub51","_k":"61c20737"},{"t":"48","why":"That’s 12 × 4: you multiplied by the ratio 4 instead of by its logarithm, `log_2 4 = 2`.","_n":"3vb62","_k":"cd721cf1"}]},"b":{"prompt":"On a piano, each key up multiplies a note’s frequency by `2^{1/12}`. How many keys up from a 110 Hz note is the 880 Hz note?","options":[{"t":"1/4","why":"That’s 3 ÷ 12. Divide by 1/12, not by 12.","_n":"3wb52","_k":"bf94f65f"},{"t":"3","why":"That’s `log_2 8 = 3` doublings (octaves). Each doubling takes 12 keys.","_n":"3xb82","_k":"80a650b1"},{"t":"36","why":"880 ÷ 110 = 8 = `2^3`, so `k = log_2 8 ÷ (1/12) = 3 × 12 = 36`.","_n":"3yb72","_k":"83f0a0c0"},{"t":"96","why":"That’s 12 × 8: you multiplied by the ratio 8 instead of by its logarithm, `log_2 8 = 3`.","_n":"3zb22","_k":"9c39e209"}]}}]},"task":{"title":"Same graph, new recipe","summary":"Same graph, new recipe","statement":"\u003cp>The dashed target graph has two mirror-image branches. It passes through (1/2, −1), (2, 1), (4, 2) and (8, 3), and through (−2, 1), (−4, 2) and (−8, 3). Design `y = log_{@b{b}}(x^{@n{n}})` whose graph is exactly the target. One base is off limits: `@b{b} = 4`. There’s more than one answer. Can you find them all?\u003c/p>","checks":["The right branch passes through (4, 2)","There is a left branch, like the target","The left branch passes through (−8, 3)","Not the off-limits base: `@b{b} ≠ 4`"],"tips":["At `x = 4` your graph is at {v}. You need 2. Try writing `@b{b}` as a power of 2: if `@b{b} = 2^k`, then `log_{@b{b}}(4^{@n{n}}) = 2@n{n}/k`.","With an odd `@n{n}`, `x^{@n{n}}` is negative whenever `x` is negative, and negative numbers have no logarithm. So your graph has no left branch. Use an even `@n{n}`.","Your left branch is at {v} when `x = -8`, but the target is at 3. Get the right branch through (4, 2) first: with an even `@n{n}`, the left branch is its mirror image.","`log_4(x^2)` is the off-limits recipe. What happens to the graph if you double `@n{n}`? What must happen to `@b{b}` to undo it?"],"explainPrompt":"Explain why your recipe draws exactly the target graph.","vocab":"Use the words power law, change of base and even.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Every recipe you’ve found has `@b{b} = 2^{@n{n}}` with an even `@n{n}`. Here’s why. For `x > 0`, `log_{@b{b}}(x^{@n{n}}) = @n{n} log_{@b{b}} x = @n{n} · log_2 x / log_2 @b{b}` (the power law, then change of base). That equals `log_2 x`, the target’s right branch, exactly when `log_2 @b{b} = @n{n}`. An even `@n{n}` gives the mirror-image left branch.","after5":"You found all five. With `@b{b} = 4` allowed, `@n{n} = 2` would make six. A negative `@n{n}` works with a fractional base because the two reflections cancel."},"cards":[["The power law of logarithms","`log_{@b{b}}(x^{@n{n}}) = @n{n} log_{@b{b}} x`, for `x > 0` and any real `@n{n}`. Example: `log_2(8^5) = 5 × 3 = 15`."],["Why the power law works","If `log_b x = m`, then `x = b^m`, so `x^n = b^{mn}`. The exponent is `mn`, so `log_b(x^n) = mn = n log_b x`."],["Roots and reciprocals","`log_b √x = (1/2) log_b x` and `log_b(1/x) = -log_b x`. Example: `log √1000 = 3/2` and `log(1/100) = -2`."],["`log(x^2)` vs `(log x)^2`","Different! At `x = 1000`: `log(1000^2) = 6`, but `(log 1000)^2 = 9`."],["Change of base formula","`log_b x = log x / log b`. Example: `log_4 32 = log 32 / log 4 = 5 log 2 / (2 log 2) = 5/2`."],["Why change of base works","`y = log_b x` means `b^y = x`. Take logs: `y log b = log x` (the power law), so `y = log x / log b`."],["`log_b x` as a measurement","How many `b`-lengths fit into the `x`-length on a log ruler. It’s a ratio of two lengths, so any ruler gives the same count."],["The common base method","Write both numbers as powers of one base: `log_9 27 = log_3 27 / log_3 9 = 3/2`."],["No common base?","Bracket, then use given values: `2^2 \u003c 5 \u003c 2^3`, and `log_2 5 = log 5 / log 2 ≈ 0.699 / 0.301 ≈ 2.32`. Write ≈, not =."],["`log 8 / log 2` vs `log(8/2)`","Not the same! `log 8 / log 2 = 3 log 2 / log 2 = 3`, but `log(8/2) = log 4 ≈ 0.602`."],["When the power law needs care","`log(x^2)` exists for every `x ≠ 0`, but `2 log x` only for `x > 0`. They agree only when `x > 0`, so `log(x^2) = 4` has two solutions, ±100."],["Swapping the base and the number","`log_a b = 1/log_b a`. Example: `log_8 2 = 1/3`, because `log_2 8 = 3`."]]}};</script>
