"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"20ecccb2","content":{"id":"10-chapter-1-review","kind":"review","title":"Chapter 1 summary and review","topic":"Chapter 1 Summary & Review","hero":{"eq":"`P(x) = @a{-}(x + 2)(x - 1)^2`","eqLabel":"P of x equals negative (x plus 2) times (x minus 1) squared","eqSize":"md","headline":"One function, nine ideas","text":"Everything in Chapter 1 shows up in this one function: its end behaviour, its zeros and how the graph behaves at each one, its turning points, the intervals where it rises and falls, its finite differences, its symmetry and its rates of change. This review connects those ideas, mixes them up, and helps you find the modules to revisit before Chapter 2.","muted":"Work through the five parts in order. Your answers save on this device as you go.","fig":{"aria":"Graph of P of x equals negative (x + 2)(x − 1) squared, from quadrant 2 to quadrant 4, crossing the x-axis at (−2, 0) and touching it at (1, 0), with turning points (−1, −4) and (1, 0), an increasing interval from −1 to 1, a secant of slope 2 and a tangent of slope 0."}},"goals":["I can describe the end behaviour, domain, range and symmetry of a power function.","I can use interval and set notation to describe where a function is increasing, decreasing, positive or negative.","I can connect a polynomial’s degree and leading coefficient to its end behaviour, turning points and `x`-intercepts.","I can use finite differences to find a polynomial’s degree and leading coefficient.","I can sketch a polynomial from its factored form, and find an equation from a graph.","I can decide algebraically whether a polynomial function is even, odd or neither.","I can describe and apply the transformations in `y = a[k(x - d)]^n + c`.","I can calculate an average rate of change and interpret it with units.","I can estimate an instantaneous rate of change using secants, and tell where it is positive, negative or zero."],"keyIdeas":{"01":{"idea":"Even degree: both arms the same way. Odd degree: opposite ways. Negative `a` flips them. Say it with quadrants (Q3 to Q4) or arrows (as `x → ∞`, `y → -∞`).","look":"Power function playground: the `a` and `n` sliders (Explore); Even or odd? Test the symmetry (Symmetry)"},"02":{"idea":"Intervals describe `x`-values. A round bracket leaves the endpoint out, a square bracket includes it, ∞ always takes a round bracket, and ∪ joins pieces. Increasing, decreasing, positive and negative intervals are open.","look":"Interval builder (Explore); Graph detective (Detective)"},"03":{"idea":"Degree `n`: at most `n` `x`-intercepts and at most `n - 1` turning points. Only the leading term decides the ends, wherever it’s written.","look":"Polynomial shape lab (Explore); Possible or impossible? (Possible?)"},"04":{"idea":"With `x`-values 1 apart, constant `n`th differences mean degree `n`, and `a` = (`n`th difference) ÷ `n!`.","look":"Difference table machine (Explore); Reverse engineering: from a table to its equation (Reverse)"},"05":{"idea":"Order 1: crosses. Order 2: touches. Order 3: crosses and flattens. Write `y = a(x - r_1)(x - r_2)…`, then use one more point to find `a`.","look":"Zero builder (Explore); Equation from a graph (Equation)"},"06":{"idea":"Replace `x` with `-x`: only the odd-power terms flip sign. Even: `f(-x) = f(x)`. Odd: `f(-x) = -f(x)`. A constant is an even-power term, so check with algebra, not just the degree.","look":"Term sign-flipper (Explore); Mirror lab: make it even, make it odd (Mirror)"},"07":{"idea":"`(x, y) → (x/k + d, ay + c)`. Stretches and reflections first, then translations. `(x - d)` moves the graph `d` units right.","look":"Key-point mapper (Explore); Order matters (Order)"},"08":{"idea":"Average rate of change = `Δy/Δx` = slope of the secant, in units of `y` per unit of `x`. It describes a whole interval, not one instant.","look":"Secant lab (Explore); Rates in context (Context)"},"09":{"idea":"Shrink the interval and the secant slopes settle on the tangent’s slope: the instantaneous rate. Positive: rising. Negative: falling. Zero: a horizontal tangent.","look":"Secant-to-tangent zoom (Explore); Sign of the rate (Sign)"}},"start":{"diagnostic":{"title":"Diagnostic: which modules should I revisit?","intro":"Twelve questions, at least one from each Chapter 1 module. Pick an answer, say how sure you are, then check it. At the end you’ll see which modules to revisit.","msgs":["You’re ready. The review will still sharpen your connections.","Good base. Revisit the flagged modules after this review, or before it if you’d rather.","Revisit the flagged modules first. This review will make more sense after that."],"questions":[{"id":"d1","topic":"01","goal":1,"prompt":"A power function `y = ax^n` passes through `(-1, -3)`. As `x → -∞`, `y → -∞`, and as `x → ∞`, `y → -∞`. Which could it be?","options":[{"t":"`y = 3x^5`","why":"It does pass through `(-1, -3)`, since `3(-1)^5 = -3`. But as `x → ∞` it rises: `y → ∞`. An odd degree sends the arms opposite ways.","_n":"045b","_k":"7c153c20"},{"t":"`y = -3x^4`","why":"Both ends go to `-∞`, so the arms point the same way (even degree) and down (`a \u003c 0`): Q3 to Q4. And `-3(-1)^4 = -3`, so `(-1, -3)` is on the graph.","_n":"148b","_k":"1a27a667"},{"t":"`y = -3x^5`","why":"Odd degree sends the arms opposite ways: as `x → -∞`, this one goes to `+∞`. Also, `-3(-1)^5 = +3`, not `-3`.","_n":"247b","_k":"37e21670"},{"t":"`y = 3x^4`","why":"Even degree is right, but `a > 0` sends both arms \u003cstrong>up\u003c/strong>: `y → ∞` at both ends. And `3(-1)^4 = +3`.","_n":"342b","_k":"1e7e6954"}],"hints":["Both ends go to `-∞`. Do the arms point the same way or opposite ways? Up or down?","Same way means an even degree, and down means `a \u003c 0`. Then substitute `x = -1` to check the point.","`y = -3x^4`: even degree, `a \u003c 0`, both arms down (Q3 to Q4), and `-3(-1)^4 = -3`."]},{"id":"d2","topic":"02","goal":2,"prompt":"A cubic with a positive leading coefficient has turning points at `(-2, 5)` and `(3, -4)`. On which interval is it decreasing?","options":[{"t":"`(-∞, -2) ∪ (3, ∞)`","why":"That’s where it’s \u003cstrong>increasing\u003c/strong>: up to the first turning point and after the second.","_n":"441b","_k":"d683f8b0"},{"t":"`(-4, 5)`","why":"Those are `y`-values. Increasing and decreasing intervals describe `x`-values.","_n":"544b","_k":"70b5873c"},{"t":"`(-∞, 3)`","why":"The graph rises all the way to `x = -2` first, so it can’t be decreasing on all of `(-∞, 3)`.","_n":"643b","_k":"ca625920"},{"t":"`(-2, 3)`","why":"With `a > 0`, a cubic rises to `(-2, 5)`, falls to `(3, -4)`, then rises again. Intervals use the `x`-values.","_n":"73eb","_k":"c002ed85"}],"hints":["Sketch it: a cubic with `a > 0` starts low on the left and ends high on the right.","It rises to the turning point at `x = -2`, then falls to the one at `x = 3`.","It’s decreasing between the `x`-values −2 and 3: the interval `(-2, 3)`."]},{"id":"d3","topic":"03","goal":3,"prompt":"A polynomial function’s graph has 3 turning points. What is the smallest degree it could have?","options":[{"t":"2","why":"A quadratic has exactly 1 turning point.","_n":"83db","_k":"2364fc40"},{"t":"3","why":"A cubic has at most `3 - 1 = 2` turning points.","_n":"96b1","_k":"1d239309"},{"t":"4","why":"Degree `n` allows at most `n - 1` turning points, so 3 turning points need `n - 1 ≥ 3`, which means `n ≥ 4`.","_n":"a6c1","_k":"8c756327"},{"t":"6","why":"Degree 6 is possible, but 4 is smaller and also works.","_n":"b6d1","_k":"e192452c"}],"hints":["What is the most turning points a degree-`n` polynomial can have?","At most `n - 1`. You need `n - 1` to be at least 3.","`n - 1 ≥ 3` means `n ≥ 4`. The smallest degree is 4."]},{"id":"d4","topic":"04","goal":4,"prompt":"A table with `x`-values 1 apart has constant second differences of −6. What are the degree and the leading coefficient?","options":[{"t":"Degree 2, `a = -6`","why":"The second differences are `a × 2!`, not `a`. Divide by `2! = 2`.","_n":"c6e1","_k":"73437fe0"},{"t":"Degree 3, `a = -1`","why":"Constant \u003cstrong>second\u003c/strong> differences mean degree 2, not 3.","_n":"d671","_k":"309c2cb5"},{"t":"Degree 2, `a = -12`","why":"Divide by `2!`, don’t multiply: `-6 ÷ 2 = -3`.","_n":"e681","_k":"635513c3"},{"t":"Degree 2, `a = -3`","why":"Constant second differences mean degree 2, and they equal `a × 2!`, so `a = -6 ÷ 2 = -3`.","_n":"f691","_k":"8fcfd3ae"}],"hints":["Which differences are constant? That’s the degree.","Constant `n`th differences = `a × n!`. Here `n = 2`.","`a × 2 = -6`, so `a = -3`. Degree 2, `a = -3`."]},{"id":"d5","topic":"05","goal":5,"prompt":"How does the graph of `y = (x - 4)^2(x + 1)` behave at `x = 4`?","options":[{"t":"It crosses the `x`-axis without flattening","why":"That’s the behaviour at an order-1 zero, like `x = -1` here. A squared factor doesn’t change sign, so the graph can’t cross at `x = 4`.","_n":"g6a1","_k":"a5aa5538"},{"t":"It crosses the `x`-axis, flattening as it goes","why":"That’s an order-3 zero, from a cubed factor.","_n":"h731","_k":"37918aea"},{"t":"It touches the `x`-axis and turns back","why":"`(x - 4)` is squared: a zero of order 2. The sign doesn’t change, so the graph bounces.","_n":"i741","_k":"df4ddfbb"},{"t":"It doesn’t reach the `x`-axis","why":"`y = 0` when `x = 4`, so the graph does reach the axis.","_n":"j7d1","_k":"b556ee27"}],"hints":["What power is the factor `(x - 4)` raised to?","Order 2. Does `(x - 4)^2` ever change sign?","It never goes negative, so the graph touches the axis at `x = 4` and turns back."]},{"id":"d6","topic":"05","goal":5,"prompt":"Which is an equation of the cubic with zeros −1, 2 and 3 whose graph passes through `(0, 12)`?","options":[{"t":"`y = 12(x + 1)(x - 2)(x - 3)`","why":"12 is the `y`-value at `x = 0`, not `a`. Substitute to find `a`.","_n":"k7c1","_k":"de91c435"},{"t":"`y = 2(x + 1)(x - 2)(x - 3)`","why":"At `x = 0`: `a(1)(-2)(-3) = 6a = 12`, so `a = 2`.","_n":"l7f1","_k":"dbee6f8c"},{"t":"`y = 2(x - 1)(x + 2)(x + 3)`","why":"A zero at −1 comes from `(x + 1)`, not `(x - 1)`. The signs of all three are flipped.","_n":"m7e1","_k":"62873bb1"},{"t":"`y = -2(x + 1)(x - 2)(x - 3)`","why":"`(-2)(-3) = +6`, so `6a = 12` gives `a = +2`.","_n":"n791","_k":"27400992"}],"hints":["Write `y = a(x + 1)(x - 2)(x - 3)`, then use the point to find `a`.","Substitute `(0, 12)`: `12 = a(0 + 1)(0 - 2)(0 - 3)`.","`12 = 6a`, so `a = 2`."]},{"id":"d7","topic":"06","goal":6,"prompt":"`f(x) = x^4 - 3x^2 + 2`. Which is true?","options":[{"t":"`f` is neither, because of the constant term","why":"A constant is a term with `x^0`, and 0 is even. It doesn’t stop `f` from being even.","_n":"o781","_k":"c32f577a"},{"t":"`f` is even, because `f(-x) = f(x)`","why":"Every power (4, 2 and 0) is even, so replacing `x` with `-x` changes nothing.","_n":"p7b1","_k":"39b7a18c"},{"t":"`f` is odd, because `f(-x) = -f(x)`","why":"Try `x = 2` and `x = -2`: both give 6. For an odd function, `f(-2)` would be −6. The values match; they don’t flip.","_n":"q7a1","_k":"71b58021"},{"t":"`f` is neither, because the signs of the terms alternate","why":"The signs of the coefficients don’t matter. The powers do.","_n":"r751","_k":"9896f702"}],"hints":["Find `f(-x)` by replacing every `x` with `-x`.","`(-x)^4 = x^4` and `(-x)^2 = x^2`, so `f(-x) = x^4 - 3x^2 + 2`.","`f(-x) = f(x)`, so `f` is even."]},{"id":"d8","topic":"07","goal":7,"prompt":"Which transformations map `y = x^3` onto `y = @a{3}(x - @d{2})^3 + @c{1}`?","options":[{"t":"Horizontal stretch by a factor of 3, translation 2 right and 1 up","why":"The 3 is outside the brackets, so it’s `@a{a}`: a \u003cstrong>vertical\u003c/strong> stretch.","_n":"s741","_k":"749c6afa"},{"t":"Vertical stretch by a factor of 3, translation 2 right and 1 up","why":"`@a{a} = 3` stretches vertically, `@d{d} = 2` moves right, `@c{c} = 1` moves up.","_n":"t771","_k":"b9ba69ad"},{"t":"Vertical stretch by a factor of 3, translation 2 right and 1 down","why":"+1 outside the brackets moves the graph \u003cstrong>up\u003c/strong> 1.","_n":"u781","_k":"82344550"},{"t":"Vertical stretch by a factor of 3, translation 2 left and 1 up","why":"`(x - 2)` moves the graph 2 units \u003cstrong>right\u003c/strong>.","_n":"v751","_k":"27bbf08e"}],"hints":["Match to `y = @a{a}[@k{k}(x - @d{d})]^n + @c{c}`. What are `@a{a}`, `@k{k}`, `@d{d}` and `@c{c}`?","`@a{a} = 3`, `@k{k} = 1`, `@d{d} = 2`, `@c{c} = 1`.","Vertical stretch by 3, then 2 right and 1 up."]},{"id":"d9","topic":"07","goal":7,"prompt":"`(2, 8)` is on `y = x^3`. Where does it end up on `y = @a{-}(x + @d{1})^3 @c{- 4}`?","options":[{"t":"`(1, -12)`","why":"`x`: `2 + (-1) = 1`. `y`: `-1 × 8 - 4 = -12`.","_n":"w761","_k":"8e63c8f3"},{"t":"`(1, -4)`","why":"That’s `-(8 - 4)`. Multiply by `@a{a}` first, then add `@c{c}`: `-8 - 4 = -12`.","_n":"x7b1","_k":"60bee497"},{"t":"`(3, -12)`","why":"`(x + 1)` moves the graph 1 \u003cstrong>left\u003c/strong>, so `x` goes from 2 to 1.","_n":"y7c1","_k":"7c5b373f"},{"t":"`(1, 4)`","why":"The reflection was skipped: `@a{a} = -1` turns 8 into −8 before the shift.","_n":"z791","_k":"bf70deee"}],"hints":["The mapping rule is `(x, y) → (x/@k{k} + @d{d}, @a{a}y + @c{c})`.","Here `@a{a} = -1`, `@k{k} = 1`, `@d{d} = -1` and `@c{c} = -4`.","`(2/1 - 1, -1 × 8 - 4) = (1, -12)`."]},{"id":"d10","topic":"08","goal":8,"prompt":"What is the average rate of change of `f(x) = 2x^2` from `x = 1` to `x = 4`?","options":[{"t":"8","why":"That’s `32 ÷ 4`, which starts from `x = 0`. Use both endpoints.","_n":"107a1","_k":"1feb4a95"},{"t":"10","why":"`{f(4) - f(1)}/{4 - 1} = {32 - 2}/{3} = 10`.","_n":"116f1","_k":"b9548dcb"},{"t":"17","why":"That’s the average of the two heights, `{2 + 32}/{2}`. An average rate of change is a slope: change in `y` ÷ change in `x`.","_n":"12701","_k":"4617e7ba"},{"t":"30","why":"That’s the change in `y`. Divide by the change in `x`, 3.","_n":"13f90","_k":"6d06094e"}],"hints":["Average rate of change = `{change in y}/{change in x}`.","`f(1) = 2` and `f(4) = 32`.","`{32 - 2}/{4 - 1} = {30}/{3} = 10`."]},{"id":"d11","topic":"09","goal":9,"prompt":"Which secant gives the best estimate of the instantaneous rate of change of `f` at `x = 3`?","options":[{"t":"From `x = 3` to `x = 4`","why":"That interval is wide, so its secant can be far from the tangent.","_n":"14f80","_k":"fac41454"},{"t":"From `x = 3` to `x = 3.001`","why":"The closer the second point, the closer the secant is to the tangent at `x = 3`.","_n":"15f70","_k":"25964a29"},{"t":"From `x = 0` to `x = 3`","why":"That’s the average rate over a long interval, not the rate at `x = 3`. Its secant can be far from the tangent.","_n":"16f60","_k":"1dad3da8"},{"t":"From `x = 3` to `x = 3`","why":"A secant needs two different points. Here the run is 0, and you can’t divide by 0.","_n":"17fd0","_k":"d495c887"}],"hints":["Secants over smaller intervals get closer to the tangent.","Which interval around `x = 3` is the smallest without being zero?","From 3 to 3.001."]},{"id":"d12","topic":"09","goal":9,"prompt":"On a distance–time graph, the tangent at `t = 5` s is horizontal. What does this tell you?","options":[{"t":"The object moves at a constant speed","why":"A constant speed gives a straight graph. A slope of 0 means a speed of 0.","_n":"18fc0","_k":"6b43982b"},{"t":"The object’s speed is 0 at `t = 5` s","why":"A horizontal tangent has slope 0, so the instantaneous rate of change of distance is 0.","_n":"19fb0","_k":"cd3020fc"},{"t":"The object’s average speed is 0","why":"Average speed comes from a secant over an interval. This is about one instant.","_n":"1afa0","_k":"0a403704"},{"t":"The object has travelled 0 m","why":"The slope is 0, not the distance. The graph’s height at `t = 5` is the distance.","_n":"1bf10","_k":"7dcb75f3"}],"hints":["What does the slope of a distance–time graph measure?","The tangent’s slope is the instantaneous speed. What’s the slope of a horizontal line?","Slope 0, so the speed at `t = 5` is 0. The object is momentarily stopped."]}]}},"connect":{"heading":"Four views of one function","intro":"`P` is shown four ways: as an equation, a graph, a table and words. Each challenge points to a feature in one view. Find the same feature in another view.","summary":"Four views of one function","words":{"incBlank":"`P` rises on … and falls on …","inc":"`P` is increasing on `(-1, 1)` and decreasing on `(-∞, -1) ∪ (1, ∞)`.","negBlank":"`P(x) \u003c 0` on …","neg":"`P` is negative on `(-2, 1) ∪ (1, ∞)`."},"challenges":[{"id":"L1","topics":["01","03"],"goal":3,"type":"eq","view":"eq","prompt":"\u003cstrong>Graph:\u003c/strong> the left arm rises and the right arm falls (Q2 to Q4). Tap the term in the \u003cstrong>expanded\u003c/strong> equation that decides this.","_a":"EFVUQQ==","why":"For very large `|x|`, `-x^3` outgrows `3x` and −2. Odd degree and negative `a` give Q2 to Q4.","fb":{"e2":"The middle terms shape the graph near the origin, not the ends. For large `|x|`, the highest power wins.","e3":"−2 is the `y`-intercept. It moves the graph up or down but doesn’t change where the arms point.","factored":"Tap a term in the expanded form. In factored form, the end behaviour comes from multiplying the leading parts: `-(x)(x^2) = -x^3`."},"hints":["Which term matters most when `x` is huge, say 1000?","Compare `-1000^3` with `3 × 1000` and −2.","`-x^3` dominates: odd degree, negative coefficient, Q2 to Q4."]},{"id":"L2","topics":["05"],"goal":5,"type":"graph","view":"graph","prompt":"\u003cstrong>Equation:\u003c/strong> the factor `(x - 1)^2`. Tap the point on the graph where you see its effect.","_a":"EEBUU0E=","why":"The squared factor gives an order-2 zero: the graph touches the axis at `x = 1` and turns back.","fb":{"pm20":"That zero comes from `(x + 2)`, order 1, so the graph crosses there.","p0m2":"That’s the `y`-intercept: `P(0) = -(2)(1) = -2`.","pm1m4":"That’s a turning point, but it isn’t on the `x`-axis. Zeros come from factors.","arm":"That’s an arm of the graph. Tap one of the four marked points."},"hints":["Which `x`-value makes `(x - 1)^2` equal 0?","`x = 1`. Because the factor is squared, what does the graph do there?","It touches the axis at `(1, 0)` and turns back."]},{"id":"L3","topics":["04"],"goal":4,"type":"choose","view":"table","prompt":"\u003cstrong>Table:\u003c/strong> the third differences are all −6. What does that tell you about the equation?","options":[{"t":"Degree 3, leading coefficient −2","why":"You divided by 3. Divide by `3! = 3 × 2 × 1 = 6`.","_n":"1cf00","_k":"ee08f197"},{"t":"Degree 3, leading coefficient −6","why":"Third differences are `a × 3!`. Divide by 6.","_n":"1d730","_k":"8a8503ec"},{"t":"Degree 3, leading coefficient −1","why":"`-6 = a × 3! = 6a`, so `a = -1`, matching `-x^3`.","_n":"1e740","_k":"f6c491d5"},{"t":"Degree 6","why":"The \u003cem>value\u003c/em> −6 isn’t the degree. The degree is which column is constant: the third.","_n":"1f750","_k":"273ee43c"}],"hints":["Which column became constant? That’s the degree.","Constant `n`th differences equal `a × n!`.","`-6 ÷ 3! = -6 ÷ 6 = -1`. Degree 3, `a = -1`."]},{"id":"L4","topics":["02","03"],"goal":2,"type":"choose","view":"graph","prompt":"\u003cstrong>Graph:\u003c/strong> turning points at `(-1, -4)` and `(1, 0)`. Where is `P` increasing?","options":[{"t":"`(-∞, -1) ∪ (1, ∞)`","why":"That’s where `P` is \u003cstrong>decreasing\u003c/strong>: it falls from the left, and falls again after `x = 1`.","_n":"1g760","_k":"11953766"},{"t":"`(-4, 0)`","why":"Those are `y`-values. Use the `x`-values of the turning points.","_n":"1h770","_k":"fbaaa1ac"},{"t":"`(-2, 1)`","why":"−2 is a zero, not a turning point. The climb starts at the lowest point, `x = -1`.","_n":"1i780","_k":"9602cada"},{"t":"`(-1, 1)`","why":"Between the turning points the graph climbs from −4 to 0. Intervals use `x`-values.","_n":"1j790","_k":"1c55f85f"}],"hints":["Trace the graph from left to right. Where does it go up?","It goes up from the turning point at `x = -1` to the one at `x = 1`.","Increasing on `(-1, 1)`."]},{"id":"L5","topics":["02","05"],"goal":2,"type":"choose","view":"words","prompt":"\u003cstrong>Words:\u003c/strong> “`P(x) \u003c 0` on …”. Which completes the sentence?","options":[{"t":"`(-2, 1)`","why":"After `x = 1` the graph doesn’t cross back up. The double zero only touches, so `P` stays negative.","_n":"1k7a0","_k":"577b6fbd"},{"t":"`(-2, 1) ∪ (1, ∞)`","why":"The graph is below the axis after `x = -2`, except at `x = 1`, where it touches the axis (`P(1) = 0` is not less than 0).","_n":"1l6b0","_k":"28cba399"},{"t":"`(-∞, -2)`","why":"There the graph is \u003cstrong>above\u003c/strong> the axis: `P(-3) = 16`.","_n":"1m6c0","_k":"7bcffc3a"},{"t":"`(-2, ∞)`","why":"At `x = 1`, `P = 0`, which isn’t less than 0. The touch point must be left out.","_n":"1ne51","_k":"146f96d1"}],"hints":["Look for where the graph is below the `x`-axis.","It’s below from `x = -2` onward. What happens exactly at `x = 1`?","At `x = 1` it touches 0 and dips again, so leave 1 out: `(-2, 1) ∪ (1, ∞)`."]},{"id":"L6","topics":["08"],"goal":8,"type":"num","view":"graph","prompt":"\u003cstrong>Graph:\u003c/strong> the secant from `(-1, -4)` to `(1, 0)` is drawn. Enter its slope: the average rate of change of `P` on `[-1, 1]`.","_a":"AA==","tol":0,"why":"Rise `0 - (-4) = 4` over run `1 - (-1) = 2` gives a slope of 2.","wrong":[{"match":4,"fb":"That’s the rise. Divide by the run, `1 - (-1) = 2`."},{"match":-2,"fb":"Check the order: `{0 - (-4)}/{1 - (-1)} = {4}/{2} = 2`."},{"match":0.5,"fb":"That’s run ÷ rise. The slope is rise ÷ run."}],"hints":["Slope = `{change in y}/{change in x}`.","Rise: `0 - (-4) = 4`. Run: `1 - (-1) = 2`.","`4 ÷ 2 = 2`."]},{"id":"L7","topics":["09"],"goal":9,"type":"graph2","view":"graph","prompt":"Tap \u003cstrong>both\u003c/strong> points on the graph where the instantaneous rate of change is 0.","_a":"aRIVDlIOVhAeEhVSU0E/","why":"At both turning points the tangent is horizontal, so the instantaneous rate of change is 0.","fb":{"pm20":"That’s a zero of `P`, not of its rate. The graph is steep there.","p0m2":"At `x = 0` the graph is rising steeply; its tangent slope is 3.","one":"There’s a second place where the tangent is flat.","arm":"That’s an arm of the graph. Tap one of the four marked points."},"hints":["Rate of change 0 means a horizontal tangent.","Where does the graph stop rising and start falling, or the other way round?","At the turning points `(-1, -4)` and `(1, 0)`."]},{"id":"L8","topics":["06","07"],"goal":6,"type":"choose","view":"eq","stretch":true,"prompt":"Is `P` even, odd or neither? And what happens if you translate its graph up 2 units?","options":[{"t":"Odd, because its degree is 3","why":"The −2 is an `x^0` term, an even power. With mixed powers, `P(-x) = x^3 - 3x - 2`, which is neither `P(x)` nor `-P(x)`.","_n":"1oe41","_k":"540604c5"},{"t":"Neither, and no translation can change that","why":"Translate it up 2 and the constant disappears: `-x^3 + 3x` is odd.","_n":"1pe71","_k":"d7a9b3d1"},{"t":"Neither; but translated up 2 it becomes odd","why":"`P(x) + 2 = -x^3 + 3x`, which has only odd powers. So `P` has point symmetry about `(0, -2)`, not the origin.","_n":"1qe61","_k":"a1a94c6a"},{"t":"Even, because it touches the `x`-axis","why":"Touching the axis isn’t symmetry. Fold the graph over the `y`-axis: it doesn’t land on itself.","_n":"1re91","_k":"a5c2cde1"}],"hints":["Find `P(-x)` from the expanded form.","`P(-x) = x^3 - 3x - 2`. Compare with `P(x)` and `-P(x)`. Which term spoils both?","The −2. Remove it (translate up 2) and `-x^3 + 3x` is odd."]}],"onePage":{"title":"The chapter on one page","intro":"Each line joins the same fact in two views. The number on the line matches the challenge.","links":[{"n":1,"a":"eq","b":"graph","t":"`-x^3` ⟷ arms Q2 to Q4 · modules 01 and 03"},{"n":2,"a":"eq","b":"graph","t":"`(x - 1)^2` ⟷ bounce at `(1, 0)` · module 05"},{"n":3,"a":"table","b":"eq","t":"third differences −6 ⟷ `-x^3`: degree 3, `a = -1` · module 04"},{"n":4,"a":"graph","b":"words","t":"turning points `(-1, -4)` and `(1, 0)` ⟷ increasing on `(-1, 1)` · modules 02 and 03"},{"n":5,"a":"graph","b":"words","t":"touch at `(1, 0)` ⟷ negative on `(-2, 1) ∪ (1, ∞)` · modules 02 and 05"},{"n":6,"a":"table","b":"graph","t":"`P(-1) = -4`, `P(1) = 0` ⟷ secant slope 2 · module 08"},{"n":7,"a":"table","b":"graph","t":"first differences change sign ⟷ flat tangents at `x = -1` and `x = 1` · module 09"},{"n":8,"a":"eq","b":"graph","t":"constant −2 ⟷ point symmetry about `(0, -2)` · modules 06 and 07"}]}},"mixed":{"heading":"Mixed practice","intro":"Fifteen questions from every Chapter 1 module, mixed up on purpose, so you practise choosing the right tool. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Fifteen questions from all nine modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"03","goal":3,"kind":"mc","star":true,"prompt":"A polynomial function’s graph has 3 `x`-intercepts and 4 turning points, and as `x → ∞`, `y → ∞`. What is the smallest degree it could have, and what does its left arm do?","options":[{"t":"Degree 5; as `x → -∞`, `y → ∞`","why":"Degree 5 is right, but odd degree sends the arms opposite ways. The right arm rises, so the left arm falls.","_n":"1se81","_k":"f6bea85d"},{"t":"Degree 5; as `x → -∞`, `y → -∞`","why":"4 turning points need `n - 1 ≥ 4`, so `n ≥ 5`. Degree 5 is odd, so the arms point opposite ways: the right arm rises, so the left arm falls. (One example: `y = x^5 - 5x^3 + 4x + 2`.)","_n":"1teb1","_k":"3ed2cddf"},{"t":"Degree 4; as `x → -∞`, `y → ∞`","why":"A quartic has at most `4 - 1 = 3` turning points. You need room for 4.","_n":"1uea1","_k":"d5ed4316"},{"t":"Degree 3; as `x → -∞`, `y → -∞`","why":"3 `x`-intercepts only need degree 3, but the turning points set the bar higher: a cubic has at most 2.","_n":"1ved1","_k":"432990cc"}],"hints":["Work backwards: which degrees allow 4 turning points?","`n - 1 ≥ 4` means `n ≥ 5`. Is 5 even or odd, and what does that say about the arms?","Degree 5. Odd degree: the arms point opposite ways. The right arm rises, so as `x → -∞`, `y → -∞`."]},{"id":"mp2","topic":"02","goal":2,"kind":"mc","star":true,"prompt":"On which interval is `y = @a{-3}(x + @d{1})^4 + @c{2}` increasing?","options":[{"t":"`(-∞, 1)`","why":"`(x + 1) = (x - (-1))` moves the turning point 1 unit \u003cstrong>left\u003c/strong>, to `x = -1`.","_n":"1wec1","_k":"241a3eea"},{"t":"`(-∞, -1)`","why":"`@d{d} = -1` and `@c{c} = 2` move the turning point of `y = x^4` to `(-1, 2)`, and `@a{a} = -3 \u003c 0` flips the graph, so that point is a maximum. The graph rises until `x = -1`, then falls. The turning point belongs to neither interval.","_n":"1xff1","_k":"28f958fe"},{"t":"`(-∞, -1]`","why":"Increasing and decreasing intervals are open. At `x = -1` the graph is turning, neither rising nor falling, so −1 is left out: round bracket.","_n":"1y001","_k":"0b7d6980"},{"t":"`(-1, ∞)`","why":"That’s where it’s decreasing. With `@a{a} \u003c 0` the graph opens down: it rises \u003cstrong>before\u003c/strong> the turning point, not after.","_n":"1zfd1","_k":"8e289731"}],"hints":["Where is the turning point, and is it a maximum or a minimum?","The turning point is `(-1, 2)`. `@a{a} = -3` is negative, so the graph opens down: is it rising before or after `x = -1`?","It rises up to the maximum at `x = -1`, then falls. Increasing on `(-∞, -1)`, with a round bracket at the turning point."]},{"id":"mp3","topic":"05","goal":5,"kind":"mc","prompt":"Which equation has zeros at −3 (order 1) and 2 (order 2), and a graph passing through `(0, 6)`?","options":[{"t":"`y = {1}/{2}(x + 3)^2(x - 2)`","why":"The orders are swapped: the zero at 2 should be squared.","_n":"20fe1","_k":"06e3a03f"},{"t":"`y = 2(x + 3)(x - 2)^2`","why":"`12a = 6` means `a = 6/12 = {1}/{2}`, not `12/6`.","_n":"21fb1","_k":"c95900c1"},{"t":"`y = {1}/{2}(x - 3)(x + 2)^2`","why":"A zero at −3 comes from `(x + 3)`. The signs are flipped.","_n":"22fc1","_k":"401639db"},{"t":"`y = {1}/{2}(x + 3)(x - 2)^2`","why":"At `x = 0`: `a(3)(4) = 12a = 6`, so `a = {1}/{2}`.","_n":"23f91","_k":"7444427f"}],"hints":["Build `y = a(x + 3)(x - 2)^2`, then use `(0, 6)`.","`6 = a(0 + 3)(0 - 2)^2 = 12a`.","`a = 6/12 = {1}/{2}`."]},{"id":"mp4","topic":"08","goal":8,"kind":"num","prompt":"`f(x) = x^3 - 2x`. Find the average rate of change from `x = 1` to `x = 3`.","_a":"AwE=","display":"11","why":"`{21 - (-1)}/{3 - 1} = {22}/{2} = 11`.","wrong":[{"match":10,"fb":"`f(1) = 1 - 2 = -1`, so the change in `y` is `21 - (-1) = 22`."},{"match":22,"fb":"That’s the change in `y`. Divide by the change in `x`, 2."},{"match":7,"fb":"That’s `f(3) ÷ 3`, as if starting at `x = 0`. Use both endpoints."}],"hints":["Find `f(1)` and `f(3)`.","`f(1) = -1` and `f(3) = 27 - 6 = 21`.","`{21 - (-1)}/{3 - 1} = {22}/{2} = 11`."]},{"id":"mp5","topic":"07","goal":7,"kind":"mc","prompt":"`y = x^4` is transformed to `y = @a{-2}(x + @d{3})^4 + @c{1}`. Where does the point `(1, 1)` end up?","options":[{"t":"`(4, -1)`","why":"`(x + 3)` moves the graph 3 units \u003cstrong>left\u003c/strong>.","_n":"24fa1","_k":"534d5aef"},{"t":"`(-2, 3)`","why":"`@a{a} = -2` includes a reflection: `-2 × 1 = -2`, then `+ 1 = -1`.","_n":"25f71","_k":"5cc392cc"},{"t":"`(-2, -4)`","why":"That’s `-2 × (1 + 1)`. Multiply by `@a{a}` first, then add `@c{c}`.","_n":"26f81","_k":"751facf4"},{"t":"`(-2, -1)`","why":"`x`: `1 - 3 = -2`. `y`: `-2 × 1 + 1 = -1`.","_n":"27010","_k":"7a10e266"}],"hints":["Use `(x, y) → (x/@k{k} + @d{d}, @a{a}y + @c{c})`.","`@a{a} = -2`, `@k{k} = 1`, `@d{d} = -3`, `@c{c} = 1`.","`(1 - 3, -2 + 1) = (-2, -1)`."]},{"id":"mp6","topic":"04","goal":4,"kind":"mc","star":true,"prompt":"A polynomial function has leading coefficient −2. In its table of values (`x`-values 1 apart), one column of differences is constant at −48. Which column is it, and what is the degree?","options":[{"t":"Third differences; degree 3","why":"For a cubic with `a = -2`, the constant third differences would be `-2 × 3! = -12`, not −48.","_n":"28000","_k":"2665cc3f"},{"t":"24th differences; degree 24","why":"24 is `n!`, not `n`. Constant differences are `a × n!`, not `a × n`. Which `n` has `n! = 24`?","_n":"29ff0","_k":"3e657332"},{"t":"Third differences; degree 4","why":"Degree 4 is right, but degree `n` makes the \u003cstrong>`n`th\u003c/strong> differences constant: here, the fourth.","_n":"2afe0","_k":"2e7f5ac9"},{"t":"Fourth differences; degree 4","why":"Constant `n`th differences equal `a × n!`, so `-2 × n! = -48` and `n! = 24 = 4!`. Degree 4, with constant fourth differences.","_n":"2bfd0","_k":"cbf45c94"}],"hints":["Constant `n`th differences equal `a × n!`. Work backwards from −48.","`-2 × n! = -48`, so `n! = 24`. Try `3!` and `4!`.","`4! = 24`, so the degree is 4 and the fourth differences are constant."]},{"id":"mp7","topic":"09","goal":9,"kind":"mc","prompt":"For `f(x) = x^3 - 8x`, the secants from `x = 2` to `x = 2.1`, 2.01 and 2.001 have slopes 4.61, 4.0601 and 4.006001. What is the best estimate of the instantaneous rate of change at `x = 2`?","options":[{"t":"−8","why":"`f(2) = 8 - 16 = -8` is the height of the graph, not its slope.","_n":"2cfc0","_k":"1186e5bd"},{"t":"0","why":"A single point has no run, which is why we use secants that approach it. The slopes approach 4, not 0.","_n":"2dfb0","_k":"6a109137"},{"t":"4","why":"The slopes are settling toward 4 as the interval shrinks.","_n":"2efa0","_k":"a637a4be"},{"t":"4.61","why":"That’s the widest secant, the least accurate one.","_n":"2ff90","_k":"aef99c6e"}],"hints":["What number are the secant slopes getting closer to?","4.61 → 4.0601 → 4.006001.","They approach 4."]},{"id":"mp8","topic":"01","goal":1,"kind":"mc","star":true,"prompt":"A power function `y = ax^n` passes through `(-1, 2)` and `(2, -64)`. Which is it?","options":[{"t":"`y = 2x^6`","why":"It passes through `(-1, 2)`, but `2x^6` is never negative, so it can’t reach `(2, -64)`.","_n":"2gf80","_k":"dd354c8a"},{"t":"`y = -2x^5`","why":"The two `y`-values have opposite signs, so the degree is odd (an even power never changes sign). Then `a(-1)^n = -a = 2` gives `a = -2`, and `-2 × 2^n = -64` gives `2^n = 32`, so `n = 5`. Its range is `{y ∈ ℝ}`, and it goes from Q2 to Q4.","_n":"2hfb0","_k":"0054e3a8"},{"t":"`y = 2x^5`","why":"For an odd `n`, `(-1)^n = -1`, so `2(-1)^5 = -2`, not 2. The `y`-value at `x = -1` is `-a`, so `a = -2`.","_n":"2ifc0","_k":"57402587"},{"t":"`y = -2x^6`","why":"`(-1)^6 = 1`, so this gives −2 at `x = -1`, not 2. With an even degree, `y` has the same sign on both sides of 0, but these two points have opposite signs.","_n":"2jfd0","_k":"b215291f"}],"hints":["One point has a positive `y`-value and the other a negative one. Which degrees allow that?","An odd degree. Then `(-1)^n = -1`, so the first point gives `-a = 2`.","`a = -2`. Then `-2 × 2^n = -64`, so `2^n = 32` and `n = 5`: `y = -2x^5`."]},{"id":"mp9","topic":"06","goal":6,"kind":"mc","star":true,"prompt":"None of these is expanded. Which function is odd?","options":[{"t":"`f(x) = (x + 1)^3 + (x - 1)^3`","why":"Expanded, it’s `2x^3 + 6x`: only odd powers, because the `x^2` terms and the constants cancel. So `f(-x) = -f(x)`.","_n":"2kfe0","_k":"5bbf3560"},{"t":"`f(x) = x(x + 1)^2`","why":"A factor of `x` doesn’t make it odd: it expands to `x^3 + 2x^2 + x`, and the `2x^2` term makes it neither.","_n":"2lf70","_k":"2f884bda"},{"t":"`f(x) = (x + 1)^3`","why":"Odd degree isn’t enough: it expands to `x^3 + 3x^2 + 3x + 1`, which has even powers too, so it’s neither.","_n":"2mf80","_k":"606799d0"},{"t":"`f(x) = (x + 1)^3 - (x - 1)^3`","why":"Expanded, it’s `6x^2 + 2`. Subtracting cancels the \u003cstrong>odd\u003c/strong> powers this time, so this one is even.","_n":"2nf90","_k":"72d675f6"}],"hints":["Expand each one, or find `f(-x)` and compare it with `-f(x)`.","`(x + 1)^3 = x^3 + 3x^2 + 3x + 1` and `(x - 1)^3 = x^3 - 3x^2 + 3x - 1`. What happens when you add them? When you subtract?","Adding gives `2x^3 + 6x` (odd powers only), so `(x + 1)^3 + (x - 1)^3` is odd."]},{"id":"mp10","topic":"03","goal":3,"kind":"graphs","star":true,"fixedOrder":true,"prompt":"Which could be the graph of `y = 4x^3 - x^4`?","options":[{"t":"\u003ccanvas class=\"plot mx-thumb\" data-fig=\"mp10a\" role=\"img\" aria-label=\"Graph A: both arms point down; one turning point at (3, 27); it crosses the x-axis at (0, 0) with a flattening and at (4, 0).\">\u003c/canvas>","why":"The leading term is `-x^4`, even though it’s written second: even degree and a negative coefficient, so both arms point down. One turning point is within the limit of `4 - 1 = 3`.","_n":"2ofa0","_k":"9d0cc0d8"},{"t":"\u003ccanvas class=\"plot mx-thumb\" data-fig=\"mp10b\" role=\"img\" aria-label=\"Graph B: from quadrant 3 to quadrant 1, with two turning points.\">\u003c/canvas>","why":"Those are the ends `4x^3` alone would give. It’s written first and has the bigger coefficient, but `-x^4` has the higher power, so it wins for large `|x|`. Try `x = 10`: `4000 - 10 000 = -6000`.","_n":"2pf30","_k":"9431b7a2"},{"t":"\u003ccanvas class=\"plot mx-thumb\" data-fig=\"mp10c\" role=\"img\" aria-label=\"Graph C: both arms point down, with five turning points.\">\u003c/canvas>","why":"The arms are right, but a quartic has at most `4 - 1 = 3` turning points.","_n":"2qf40","_k":"9a3daca8"},{"t":"\u003ccanvas class=\"plot mx-thumb\" data-fig=\"mp10d\" role=\"img\" aria-label=\"Graph D: both arms point up, with three turning points.\">\u003c/canvas>","why":"Both arms up needs a \u003cstrong>positive\u003c/strong> leading coefficient, and here it’s −1.","_n":"2rffb","_k":"6875a3ff"}],"hints":["Which term has the highest power? That term decides the ends, wherever it’s written.","The leading term is `-x^4`: both arms point down. A quartic has at most 3 turning points.","Only Graph A has both arms down and no more than 3 turning points."]},{"id":"mp11","topic":"05","goal":5,"kind":"tap","prompt":"Here is the graph of `y = (x + 1)^3(x - 2)`. Tap the zero where the graph flattens as it crosses.","view":{"xmin":-2.5,"xmax":3,"ymin":-12,"ymax":8},"_a":"aR1UT1M+","tol":0.3,"why":"`(x + 1)^3` gives an order-3 zero at `x = -1`: the graph crosses there and flattens as it does.","other":{"at":[2,0],"fb":"`(x - 2)` has order 1, so the graph crosses there without flattening."},"elsewhere":"Tap a point on the `x`-axis where the graph crosses.","describe":"Graph of y = (x + 1) cubed times (x − 2): it comes down from the upper left, crosses the x-axis at x = −1 while flattening, dips to a low point near (1.25, −8.5), then rises and crosses the x-axis at x = 2.","hints":["Which factor is cubed?","`(x + 1)^3` gives an order-3 zero at `x = -1`.","Tap `(-1, 0)`."]},{"id":"mp12","topic":"02","goal":2,"kind":"mc","prompt":"Using the same graph, `y = (x + 1)^3(x - 2)`, where is `y ≥ 0`?","options":[{"t":"`(-∞, -1] ∪ [2, ∞)`","why":"The graph is above the axis left of −1 and right of 2, and the zeros themselves count because of ≥.","_n":"2s00b","_k":"07ec5ead"},{"t":"`(-∞, -1) ∪ (2, ∞)`","why":"≥ includes the zeros, so use square brackets at −1 and 2.","_n":"2t01b","_k":"a163ba64"},{"t":"`[-1, 2]`","why":"That’s where `y ≤ 0`, between the zeros.","_n":"2u02b","_k":"97d16bc6"},{"t":"`(-∞, -1] ∩ [2, ∞)`","why":"∩ means \u003cem>both at once\u003c/em>, and no `x` is both ≤ −1 and ≥ 2. Use ∪ for “or”.","_n":"2vfbb","_k":"1dae9ccf"}],"hints":["Where is the graph on or above the `x`-axis?","Left of −1 and right of 2. Are the zeros included?","Yes (≥): `(-∞, -1] ∪ [2, ∞)`."]},{"id":"mp13","topic":"09","goal":9,"kind":"mc","prompt":"A cyclist’s distance is `d(t) = t^2 + 4t` metres after `t` seconds. Using the secant from `t = 2` to `t = 2.01`, estimate the instantaneous speed at `t = 2`.","use":"`d(2.01) = 12.0801`","options":[{"t":"About 12 m/s","why":"12 m is the distance at `t = 2`, not the speed.","_n":"2wfcb","_k":"cf75ef4b"},{"t":"About 6 m/s","why":"That’s the average speed from 0 to 2 s (`12/2`). Use the tiny interval at `t = 2`.","_n":"2xfdb","_k":"4f381057"},{"t":"About 0.08 m/s","why":"You forgot to divide by the run, 0.01.","_n":"2yfeb","_k":"96ade53b"},{"t":"About 8 m/s","why":"`d(2) = 12` and `d(2.01) = 12.0801`, so the slope is `0.0801/0.01 = 8.01 ≈ 8` m/s.","_n":"2zf7b","_k":"bcfe444d"}],"hints":["Slope = `{d(2.01) - d(2)}/{2.01 - 2}`.","`d(2) = 4 + 8 = 12`, so the rise is 0.0801 and the run is 0.01.","`0.0801 ÷ 0.01 = 8.01`, about 8 m/s."]},{"id":"mp14","topic":"07","goal":7,"kind":"mc","prompt":"Which describes how `y = x^3` is transformed to `y = @a{{1}/{2}}[@k{2}(x - @d{4})]^3 @c{- 3}`?","options":[{"t":"Vertical stretch by a factor of 2, horizontal compression by a factor of `{1}/{2}`, translation 4 right and 3 down","tb":"\u003cstrong>Vertical stretch by a factor of 2\u003c/strong>, horizontal compression by a factor of `{1}/{2}`, translation 4 right and 3 down","why":"`@a{a} = {1}/{2}` is outside the brackets and less than 1: a vertical \u003cstrong>compression\u003c/strong> by a factor of `{1}/{2}`.","_n":"30f8b","_k":"fa6e5048"},{"t":"Vertical compression by a factor of `{1}/{2}`, horizontal compression by a factor of `{1}/{2}`, translation 4 right and 3 down","tb":"\u003cstrong>Vertical compression by a factor of `{1}/{2}`\u003c/strong>, \u003cstrong>horizontal compression by a factor of `{1}/{2}`\u003c/strong>, translation \u003cstrong>4 right\u003c/strong> and 3 down","why":"`@a{a} = {1}/{2}` (vertical), `@k{k} = 2` (horizontal factor `1/@k{k} = {1}/{2}`), `@d{d} = 4`, `@c{c} = -3`.","_n":"3105b","_k":"dd689031"},{"t":"Vertical compression by a factor of `{1}/{2}`, horizontal compression by a factor of `{1}/{2}`, translation 4 left and 3 down","tb":"Vertical compression by a factor of `{1}/{2}`, horizontal compression by a factor of `{1}/{2}`, translation \u003cstrong>4 left\u003c/strong> and 3 down","why":"`(x - 4)` moves the graph 4 units \u003cstrong>right\u003c/strong>.","_n":"3204b","_k":"c627c07c"},{"t":"Vertical compression by a factor of `{1}/{2}`, horizontal stretch by a factor of 2, translation 4 right and 3 down","tb":"Vertical compression by a factor of `{1}/{2}`, \u003cstrong>horizontal stretch by a factor of 2\u003c/strong>, translation 4 right and 3 down","why":"`@k{k} = 2` squeezes the graph horizontally by a factor of `1/@k{k} = {1}/{2}`. Horizontal changes act “backwards”.","_n":"3303b","_k":"c95668b2"}],"hints":["Identify `@a{a}`, `@k{k}`, `@d{d}` and `@c{c}`.","`@a{a} = {1}/{2}`, `@k{k} = 2`, `@d{d} = 4`, `@c{c} = -3`. Horizontal factor = `1/@k{k}`.","Vertical compression `{1}/{2}`, horizontal compression `{1}/{2}`, 4 right, 3 down."]},{"id":"mp15","topic":"04","goal":4,"kind":"num","prompt":"A table has `x = 0, 1, 2, 3, 4` and `y = 1, 0, 3, 10, 21`. Enter the leading coefficient of the polynomial.","_a":"AA==","display":"`a = 2`","why":"First differences −1, 3, 7, 11; second differences 4, 4, 4. So `a = 4 ÷ 2! = 2`, and the equation is `y = 2x^2 - 3x + 1`.","wrong":[{"match":4,"fb":"4 is the constant second difference. Divide by `2! = 2`."},{"match":8,"fb":"Divide the second difference by `2!`, don’t multiply: `4 ÷ 2 = 2`."},{"match":-1,"fb":"−1 is the first of the first differences (−1, 3, 7, 11), which aren’t constant. Go to the second differences."},{"match":1,"fb":"1 is the `y`-value at `x = 0`, the constant term. The leading coefficient comes from the constant differences."}],"hints":["Find the first and second differences.","First: −1, 3, 7, 11. Second: 4, 4, 4. Degree 2.","`a = 4 ÷ 2! = 2`. (The equation is `y = 2x^2 - 3x + 1`.)"]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which connection between two Chapter 1 ideas surprised you most?"},{"id":"j2","q":"Explain how the table, the equation and the graph of `P` told the same story. Pick one feature and follow it through all three."},{"id":"j3","q":"Explain to a friend how to sketch a polynomial from its factored form, using at least three Chapter 1 ideas."},{"id":"j4","q":"Which module will you revisit, and what exactly will you practise there?"}]},"final":{"intro":"This shows what you’ve learned across the whole chapter, so there are no hints here. Answer all 15 questions and say how sure you are. Then submit to see your results by category and by module. Each question is labelled with its achievement chart category and its module.","questions":[{"id":"f1","cat":"K","topic":"01","goal":1,"a":{"prompt":"Which power function’s graph falls to the left and rises to the right?","options":[{"t":"`y = -4x^5`","why":"Negative `a` flips it: rises to the left, falls to the right.","_n":"3402b","_k":"71a3e72c"},{"t":"`y = 4x^5`","why":"Odd degree, positive `a`: Q3 to Q1.","_n":"3501b","_k":"1ed36651"},{"t":"`y = -4x^6`","why":"Even degree, negative `a`: both arms down.","_n":"3600b","_k":"67a5fe3c"},{"t":"`y = 4x^6`","why":"Even degree: both arms up.","_n":"37ffb","_k":"df27fa69"}]},"b":{"prompt":"Which power function has both arms pointing down?","options":[{"t":"`y = -x^7`","why":"Odd degree: the arms point opposite ways.","_n":"38feb","_k":"a1706329"},{"t":"`y = x^7`","why":"Odd degree, positive `a`: Q3 to Q1.","_n":"39fdb","_k":"036d7955"},{"t":"`y = x^8`","why":"Positive `a`: both arms up.","_n":"3afcb","_k":"cdd3056e"},{"t":"`y = -x^8`","why":"Even degree, negative `a`.","_n":"3b6bb","_k":"ea2c30a3"}]}},{"id":"f2","cat":"K","topic":"02","goal":2,"a":{"prompt":"Which is the interval notation for `x ≥ -3`?","options":[{"t":"`(-∞, -3]`","why":"That’s `x ≤ -3`: the wrong direction.","_n":"3c6cb","_k":"b4ad6244"},{"t":"`(-3, ∞)`","why":"≥ includes −3, so use a square bracket.","_n":"3d69b","_k":"8ab8c1c1"},{"t":"`[-3, ∞]`","why":"∞ isn’t a number you can reach, so it always gets a round bracket.","_n":"3e6ab","_k":"e5e18a98"},{"t":"`[-3, ∞)`","why":"−3 is included (square bracket), and ∞ always gets a round bracket.","_n":"3f6fb","_k":"ce145c6b"}]},"b":{"prompt":"Which is the interval notation for `x \u003c 5`?","options":[{"t":"`(5, ∞)`","why":"That’s `x > 5`.","_n":"3g70b","_k":"1e95d55c"},{"t":"`(-∞, 5)`","why":"`x \u003c 5` has no lower limit, so it starts at `-∞`. 5 is excluded (round bracket), and ∞ always gets a round bracket.","_n":"3h6db","_k":"a174a767"},{"t":"`(-∞, 5]`","why":"\u003c excludes 5: round bracket.","_n":"3i6eb","_k":"eec338c0"},{"t":"`[-∞, 5)`","why":"∞ isn’t a number you can reach, so `-∞` always gets a round bracket.","_n":"3j73b","_k":"d3653da2"}]}},{"id":"f3","cat":"K","topic":"04","goal":4,"a":{"prompt":"A polynomial’s fourth differences are constant at 48, with `x`-values 1 apart. What is its leading coefficient?","options":[{"t":"2","why":"`48 = a × 4! = 24a`, so `a = 2`.","_n":"3k74b","_k":"9eb0d3cf"},{"t":"8","why":"That’s `48 ÷ 3! = 48 ÷ 6`. Fourth differences need `4!`.","_n":"3l71b","_k":"5befc322"},{"t":"12","why":"Divide by `4! = 24`, not by 4.","_n":"3m70b","_k":"229136aa"},{"t":"48","why":"Divide by `4! = 24`.","_n":"3n73b","_k":"2a123fe6"}]},"b":{"prompt":"A polynomial’s third differences are constant at −30, with `x`-values 1 apart. What is its leading coefficient?","options":[{"t":"−30","why":"The third differences are `a × 3!`, not `a`. Divide by `3! = 6`.","_n":"3o72b","_k":"b59d600e"},{"t":"−10","why":"Divide by `3! = 6`, not by 3.","_n":"3p6db","_k":"19d55a6c"},{"t":"−5","why":"`-30 ÷ 3! = -30 ÷ 6 = -5`.","_n":"3q6cb","_k":"a878f381"},{"t":"5","why":"The sign of the differences carries over: `a` is negative.","_n":"3r6fb","_k":"ae624e1c"}]}},{"id":"f4","cat":"K","topic":"06","goal":6,"a":{"prompt":"Which statement is true for \u003cstrong>every\u003c/strong> odd function `f`?","options":[{"t":"`f(-x) = -f(x)`","why":"That’s the definition of an odd function.","_n":"3s6eb","_k":"b41fc945"},{"t":"Its degree is odd.","why":"`x^3 + 1` has odd degree but isn’t odd. Also, odd functions don’t have to be polynomials.","_n":"3t79b","_k":"41c1bef2"},{"t":"`f(-x) = f(x)`","why":"That defines an \u003cstrong>even\u003c/strong> function.","_n":"3u78b","_k":"b1d6690a"},{"t":"Its graph is symmetric about the `y`-axis.","why":"That’s an even function. Odd functions have point symmetry about the origin.","_n":"3v67a","_k":"672456fc"}]},"b":{"prompt":"Which statement is true for \u003cstrong>every\u003c/strong> even function `f`?","options":[{"t":"Its graph has point symmetry about the origin.","why":"That’s an odd function. Even functions have line symmetry about the `y`-axis.","_n":"3w68a","_k":"b20c42ea"},{"t":"`f(-x) = -f(x)`","why":"That defines an \u003cstrong>odd\u003c/strong> function.","_n":"3x69a","_k":"58a24f44"},{"t":"Its degree is even.","why":"`x^4 + x` has even degree but isn’t even: `f(-x) = x^4 - x`. Also, even functions don’t have to be polynomials.","_n":"3y6aa","_k":"79d221bd"},{"t":"`f(-x) = f(x)`","why":"That’s the definition of an even function.","_n":"3z6ba","_k":"a1449696"}]}},{"id":"f5","cat":"T","topic":"03","goal":3,"a":{"prompt":"A polynomial’s graph has both arms pointing up and exactly 5 turning points. Which degree is possible?","options":[{"t":"4","why":"A quartic has at most `4 - 1 = 3` turning points.","_n":"406ca","_k":"a954dbdf"},{"t":"5","why":"An odd degree makes the arms point opposite ways. (A quintic also has at most 4 turning points.)","_n":"416da","_k":"6cff9059"},{"t":"6","why":"Both arms up needs an even degree, and 5 turning points need a degree of at least 6. So 6 works.","_n":"426ea","_k":"afff4928"},{"t":"7","why":"Degree 7 is odd, so the arms would point opposite ways.","_n":"436fa","_k":"f58a15d9"}]},"b":{"prompt":"A polynomial’s graph goes from Q2 to Q4 and has exactly 4 turning points. Which degree is possible?","options":[{"t":"3","why":"A cubic has at most 2 turning points.","_n":"4470a","_k":"f132f78b"},{"t":"4","why":"An even degree makes both arms point the same way. (A quartic also has at most 3 turning points.)","_n":"456da","_k":"2f9c4a5d"},{"t":"5","why":"Q2 to Q4 needs an odd degree, and 4 turning points need a degree of at least 5. So 5 works.","_n":"466ca","_k":"dc7bb3f2"},{"t":"6","why":"Degree 6 is even, so both arms would point the same way.","_n":"476ba","_k":"9b457631"}]}},{"id":"f6","cat":"T","topic":"05","goal":5,"a":{"prompt":"Which equation could match a graph that crosses the `x`-axis at −1, touches it at 3, and falls to the right?","options":[{"t":"`y = -(x + 1)(x - 3)^2`","why":"Order 1 at −1 (crosses), order 2 at 3 (touches); degree 3 with `a \u003c 0` falls to the right.","_n":"486aa","_k":"7ad1b23e"},{"t":"`y = (x + 1)(x - 3)^2`","why":"With `a > 0` a cubic \u003cstrong>rises\u003c/strong> to the right.","_n":"4971a","_k":"12fcbbef"},{"t":"`y = -(x - 1)(x + 3)^2`","why":"These factors give zeros at 1 and −3. The signs are flipped.","_n":"4a70a","_k":"0404de7a"},{"t":"`y = -(x + 1)^2(x - 3)`","why":"This one touches at −1 and crosses at 3: the orders are swapped.","_n":"4b6fa","_k":"36a91a78"}]},"b":{"prompt":"Which equation could match a graph that touches the `x`-axis at −2, crosses with a flattening at 1, and rises to the right?","options":[{"t":"`y = (x - 2)^2(x + 1)^3`","why":"The zeros would be 2 and −1.","_n":"4c6ea","_k":"7bb073a2"},{"t":"`y = (x + 2)^3(x - 1)^2`","why":"The orders are swapped: this one crosses with a flattening at −2 and touches at 1.","_n":"4d75a","_k":"97f990d2"},{"t":"`y = (x + 2)^2(x - 1)^3`","why":"Order 2 at −2, order 3 at 1; degree 5 with `a > 0` rises to the right.","_n":"4e74a","_k":"5edf7ddd"},{"t":"`y = -(x + 2)^2(x - 1)^3`","why":"Negative `a` makes a degree 5 graph fall to the right.","_n":"4f73b","_k":"f3aaedef"}]}},{"id":"f7","cat":"T","topic":"07","goal":7,"a":{"prompt":"A transformation of `y = x^4` has the form `y = @a{a}(x - @d{d})^4 + @c{c}`. Its turning point is `(3, -2)`, and its graph passes through `(4, -4)`. Which equation is it?","options":[{"t":"`y = -2(x + 3)^4 - 2`","why":"A turning point at `x = 3` needs `(x - 3)`. `(x + 3)` puts it at `x = -3`.","_n":"4g74b","_k":"cc93c501"},{"t":"`y = -2(x - 3)^4 - 2`","why":"The turning point `(0, 0)` of `y = x^4` moved to `(3, -2)`, so `@d{d} = 3` and `@c{c} = -2`. Then `(4, -4)` gives `a(4 - 3)^4 - 2 = -4`, so `@a{a} = -2`: a reflection in the `x`-axis and a vertical stretch by a factor of 2.","_n":"4h71b","_k":"eb558bc4"},{"t":"`y = -4(x - 3)^4 - 2`","why":"−4 is the point’s `y`-value, not `@a{a}`. Substitute the point: `a(1)^4 - 2 = -4`.","_n":"4i72b","_k":"ab13c7fd"},{"t":"`y = -6(x - 3)^4 - 2`","why":"`a - 2 = -4` gives `a = -2`: add 2 to both sides. Subtracting 2 gives −6, and then `x = 4` gives `y = -8`, not −4.","_n":"4j6fb","_k":"ae0fc121"}]},"b":{"prompt":"A transformation of `y = x^3` has the form `y = @a{a}(x - @d{d})^3 + @c{c}`. It moves the point `(0, 0)` of `y = x^3` to `(-4, 5)`, and its graph passes through `(-3, 2)`. Which equation is it?","options":[{"t":"`y = -3(x + 4)^3 + 5`","why":"`(0, 0)` moved to `(-4, 5)`, so `@d{d} = -4` and `@c{c} = 5`. Then `(-3, 2)` gives `a(-3 + 4)^3 + 5 = 2`, so `@a{a} = -3`: a reflection in the `x`-axis and a vertical stretch by a factor of 3.","_n":"4k70b","_k":"7836432e"},{"t":"`y = -3(x - 4)^3 + 5`","why":"Moving the point to `x = -4` needs `(x + 4)`. `(x - 4)` puts it at `x = 4`.","_n":"4l6db","_k":"6a306fb5"},{"t":"`y = 7(x + 4)^3 + 5`","why":"`a + 5 = 2` gives `a = -3`: subtract 5 from both sides. Adding 5 gives 7, and then `x = -3` gives `y = 12`, not 2.","_n":"4m6eb","_k":"fbe1aa69"},{"t":"`y = 2(x + 4)^3 + 5`","why":"2 is the point’s `y`-value, not `@a{a}`. Substitute the point: `a(1)^3 + 5 = 2`.","_n":"4n7bb","_k":"a26632aa"}]}},{"id":"f8","cat":"T","topic":"09","goal":9,"a":{"prompt":"Secant slopes for a polynomial `f` near `x = 2`: 0.01 (from 1.99 to 2), 0.001 (from 1.999 to 2), −0.001 (from 2 to 2.001) and −0.01 (from 2 to 2.01). Which conclusion do they best support?","options":[{"t":"The rate of change at `x = 2` is about 0.01, so `f` is increasing there","why":"0.01 comes from the widest secant on the left. The slopes on \u003cstrong>both\u003c/strong> sides close in on 0, not 0.01.","_n":"4o7cb","_k":"3de577d2"},{"t":"`f(2) = 0`, so the graph touches the `x`-axis at `x = 2`","why":"The slopes describe the rate of change, not the height. A rate of 0 means a horizontal tangent, wherever the graph is.","_n":"4pf9b","_k":"db25a6f0"},{"t":"The rate of change at `x = 2` is about 0, and `f` has a local maximum there","why":"From both sides the slopes close in on 0, so the tangent at `x = 2` is horizontal. Just before 2 the secants are positive (rising); just after, they’re negative (falling). Rising then falling is a local maximum.","_n":"4qf8b","_k":"ef6722bf"},{"t":"The rate of change at `x = 2` is about 0, and `f` has a local minimum there","why":"A local minimum is falling then rising: negative slopes just before `x = 2` and positive just after. These are the other way round.","_n":"4rfbb","_k":"62d9baad"}]},"b":{"prompt":"Secant slopes for a polynomial `g` near `x = -1`: −0.01 (from −1.01 to −1), −0.001 (from −1.001 to −1), 0.001 (from −1 to −0.999) and 0.01 (from −1 to −0.99). Which conclusion do they best support?","options":[{"t":"The rate of change at `x = -1` is about −0.01, so `g` is decreasing there","why":"−0.01 comes from the widest secant on the left. The slopes on \u003cstrong>both\u003c/strong> sides close in on 0, not −0.01.","_n":"4sfab","_k":"65f2843b"},{"t":"The rate of change at `x = -1` is about 0, and `g` has a local maximum there","why":"A local maximum is rising then falling: positive slopes just before `x = -1` and negative just after. These are the other way round.","_n":"4tfdb","_k":"9ba1c4bd"},{"t":"The rate of change at `x = -1` is about 0, and `g` has a local minimum there","why":"From both sides the slopes close in on 0, so the tangent at `x = -1` is horizontal. Just before −1 the secants are negative (falling); just after, they’re positive (rising). Falling then rising is a local minimum.","_n":"4ufcb","_k":"4f40f894"},{"t":"`g(-1) = 0`, so the graph touches the `x`-axis at `x = -1`","why":"The slopes describe the rate of change, not the height. A rate of 0 means a horizontal tangent, wherever the graph is.","_n":"4vffb","_k":"7e8d1c9d"}]}},{"id":"f9","cat":"C","topic":"02","goal":2,"a":{"prompt":"Which is the correct way to write “`x` is less than −1 or greater than 4”?","options":[{"t":"`(-∞, -1) ∪ (4, ∞)`","why":"Two pieces joined by ∪, which means “or”.","_n":"4wfeb","_k":"421daac0"},{"t":"`(-∞, -1) ∩ (4, ∞)`","why":"∩ means “and” (in both), and no number is in both, so this set is empty.","_n":"4xf1b","_k":"d25ed620"},{"t":"`(-1, 4)`","why":"That’s \u003cem>between\u003c/em> −1 and 4: the opposite.","_n":"4yf0b","_k":"f6c82b9c"},{"t":"`(4, -1)`","why":"The smaller endpoint always comes first, so this isn’t a valid interval.","_n":"4zefc","_k":"a256376f"}]},"b":{"prompt":"Which is the correct way to write “`x` is less than −5 or greater than 2”?","options":[{"t":"`(-∞, -5) ∩ (2, ∞)`","why":"∩ means “and” (in both), and no number is in both, so this set is empty.","_n":"50f0c","_k":"7737c90d"},{"t":"`(-∞, -5) ∪ (2, ∞)`","why":"Two pieces joined by ∪, which means “or”. Neither −5 nor 2 is included, so both brackets are round.","_n":"51f1c","_k":"a8ef2b2e"},{"t":"`(-5, 2)`","why":"That’s \u003cem>between\u003c/em> −5 and 2: the opposite.","_n":"52f2c","_k":"f8f7737d"},{"t":"`(2, -5)`","why":"The smaller endpoint always comes first, so this isn’t a valid interval.","_n":"53ebc","_k":"190bc0fd"}]}},{"id":"f10","cat":"C","topic":"05","goal":5,"a":{"prompt":"Which is the best explanation of why `y = (x - 2)^2(x + 1)` touches the `x`-axis at `x = 2` instead of crossing it?","options":[{"t":"2 is a positive zero, and a graph can only cross the axis at a negative zero. So at `x = 2` it meets the axis and turns back.","why":"Whether a zero is positive or negative doesn’t matter. The order of its factor does: `y = (x - 2)(x + 1)` crosses at 2.","_n":"54ecc","_k":"3751e677"},{"t":"The degree of `y` is 3, which is odd, so one of its zeros has to be a touch point. At `x = 2` the graph meets the axis and turns back.","why":"The degree describes the ends of the graph, not how it behaves at one zero.","_n":"55edc","_k":"b6e13659"},{"t":"`(x - 2)^2` gives two zeros, `x = 2` and `x = -2`, and the graph has to turn between them. So at `x = 2` it meets the axis and turns back.","why":"`(x - 2)^2 = 0` only when `x = 2`. Squaring a factor doesn’t add a zero at −2.","_n":"56eec","_k":"b04b68df"},{"t":"`(x - 2)^2` is never negative, so `y` has the same sign on both sides of `x = 2`. The graph meets the axis there and turns back.","why":"The order of the factor decides the behaviour: an even power can’t change sign.","_n":"57f7c","_k":"58a059fe"}]},"b":{"prompt":"Which is the best explanation of why `y = (x + 3)^3(x - 1)` crosses the `x`-axis at `x = -3` but flattens as it does?","options":[{"t":"−3 is a negative zero, and a graph always flattens when it crosses at a negative zero. So at `x = -3` it crosses and flattens.","why":"The sign of the zero doesn’t decide this. The order of its factor does: `y = (x + 3)(x - 1)` crosses at −3 without flattening.","_n":"58f8c","_k":"4d1c6a4d"},{"t":"`(x + 3)^3` changes sign at −3, so the graph crosses. Because the factor is cubed, it stays very close to 0 near −3, so the graph flattens as it crosses.","why":"An odd power changes sign, so the graph crosses; a power above 1 makes it flatten.","_n":"5975c","_k":"a90e5f61"},{"t":"The degree of `y` is 4, which is even, so one of its zeros has to be a flattening point. At `x = -3` the graph crosses and flattens.","why":"The degree describes the ends of the graph, not how it behaves at one zero.","_n":"5a74c","_k":"e016403f"},{"t":"`(x + 3)^3` gives three zeros, −3, 0 and 3, and the graph has to flatten between them. So at `x = -3` it crosses and flattens.","why":"`(x + 3)^3 = 0` only at `x = -3`. Cubing a factor doesn’t add zeros at 0 and 3.","_n":"5b73c","_k":"6f6cf257"}]}},{"id":"f11","cat":"C","topic":"08","goal":8,"a":{"prompt":"A car’s distance is 0 m at `t = 0` s, 30 m at `t = 2` s and 80 m at `t = 4` s. Which statement correctly interprets the average rate of change from `t = 2` s to `t = 4` s?","options":[{"t":"The car was travelling at exactly 25 m/s at `t = 4` s.","why":"That’s an instantaneous speed. An average rate describes the whole interval.","_n":"5c72c","_k":"670a965f"},{"t":"The car’s speed increased by 25 m/s.","why":"The rate is the speed itself, not a change in speed.","_n":"5d71c","_k":"3479ddaf"},{"t":"The car travelled at an average speed of 25 m/s between 2 s and 4 s.","why":"`{80 - 30}/{4 - 2} = 25` m/s, an average over the interval.","_n":"5e70c","_k":"bf307ee4"},{"t":"The car travelled 25 m between 2 s and 4 s.","why":"It travelled 50 m. 25 is the rate: metres per second.","_n":"5f6fc","_k":"dfddafc5"}]},"b":{"prompt":"A tank holds 200 L at `t = 0` min, 170 L at `t = 5` min and 150 L at `t = 10` min. Which statement correctly interprets the average rate of change from `t = 0` to `t = 10` min?","options":[{"t":"On average, the volume decreased by 5 L each minute over the first 10 minutes.","why":"`{150 - 200}/{10} = -5` L/min.","_n":"5g6ec","_k":"872cd9fc"},{"t":"The tank lost 5 L in 10 minutes.","why":"It lost 50 L. −5 is the rate: litres per minute.","_n":"5h7dc","_k":"eacbf1b6"},{"t":"The tank’s draining rate went up by 5 L/min.","why":"The rate is the change in volume per minute itself, not a change in how fast the tank drains.","_n":"5i7cc","_k":"342188fc"},{"t":"At `t = 10` min the tank was draining at exactly 5 L/min.","why":"That’s an instantaneous rate. An average rate describes the whole interval.","_n":"5j3b7","_k":"7a83e876"}]}},{"id":"f12","cat":"A","topic":"05","goal":5,"a":{"prompt":"An open box is made from a 20 cm by 30 cm sheet by cutting a square of side `x` from each corner and folding up the sides. Its volume is `V(x) = x(20 - 2x)(30 - 2x)`. What is a reasonable domain?","options":[{"t":"`(10, 15)`","why":"Between the zeros 10 and 15, one of the box’s sides would have a negative length.","_n":"5k3a7","_k":"57fe6e88"},{"t":"`(0, 10)`","why":"Every length must be positive: `x > 0` and `20 - 2x > 0`, so `x \u003c 10`.","_n":"5l397","_k":"a8c2d844"},{"t":"`(0, ∞)`","why":"`x` can’t be 10 or more, or the box has no base.","_n":"5m387","_k":"c6398907"},{"t":"`(0, 15)`","why":"At `x = 12`, the 20 cm side would be `20 - 24 = -4` cm. The shorter side limits `x`.","_n":"5n377","_k":"57cca897"}]},"b":{"prompt":"The same kind of box is made from a 16 cm by 24 cm sheet: `V(x) = x(16 - 2x)(24 - 2x)`. What is a reasonable domain?","options":[{"t":"`(0, 8)`","why":"Every length must be positive: `x > 0` and `16 - 2x > 0`, so `x \u003c 8`.","_n":"5o367","_k":"876cc40c"},{"t":"`(0, ∞)`","why":"`x` must be less than 8.","_n":"5p357","_k":"cef19d2f"},{"t":"`(8, 12)`","why":"Between those zeros, one of the box’s sides would have a negative length.","_n":"5q347","_k":"8bd00a5f"},{"t":"`(0, 12)`","why":"At `x = 10`, the 16 cm side would be `16 - 20 = -4` cm. The shorter side limits `x`.","_n":"5r437","_k":"d32ed922"}]}},{"id":"f13","cat":"A","topic":"08","goal":8,"a":{"prompt":"A ball’s height is `h(t) = -5t^2 + 20t` metres after `t` seconds. What is its average velocity from `t = 1` s to `t = 3` s?","options":[{"t":"5 m/s","why":"That’s the total distance travelled (5 m up to 20 m at `t = 2`, then 5 m down) divided by 2 s, which is an average \u003cstrong>speed\u003c/strong>. (`h(3) ÷ 3`, starting at `t = 0`, also gives 5.) Average velocity uses the change in height: `h(3) - h(1) = 0`.","_n":"5s427","_k":"c69bdfba"},{"t":"0 m/s","why":"`h(1) = 15` and `h(3) = 15`, so the change in height is 0 and `{15 - 15}/{2} = 0`. The ball is at the same height going up and coming down, so on average its height didn’t change.","_n":"5t357","_k":"ef482b98"},{"t":"7.5 m/s","why":"That’s `h(3) ÷ 2`, without subtracting `h(1)`.","_n":"5u367","_k":"43e12205"},{"t":"15 m/s","why":"That’s the average of the two heights, `{15 + 15}/{2}`. A rate is a change in height divided by a change in time.","_n":"5v377","_k":"a846b98f"}]},"b":{"prompt":"A ball’s height is `h(t) = -5t^2 + 30t` metres after `t` seconds. What is its average velocity from `t = 2` s to `t = 4` s?","options":[{"t":"0 m/s","why":"`h(2) = 40` and `h(4) = 40`, so the change in height is 0 and `{40 - 40}/{2} = 0`. The ball is at the same height going up and coming down, so on average its height didn’t change.","_n":"5w387","_k":"61e47eea"},{"t":"20 m/s","why":"That’s `h(4) ÷ 2`, without subtracting `h(2)`.","_n":"5x317","_k":"9e0ead4b"},{"t":"40 m/s","why":"That’s the average of the two heights, `{40 + 40}/{2}`. A rate is a change in height divided by a change in time.","_n":"5y327","_k":"1e61d8c5"},{"t":"5 m/s","why":"That’s the total distance travelled (5 m up to 45 m at `t = 3`, then 5 m down) divided by 2 s, which is an average \u003cstrong>speed\u003c/strong>. Average velocity uses the change in height: `h(4) - h(2) = 0`.","_n":"5z337","_k":"2055aee7"}]}},{"id":"f14","cat":"A","topic":"09","goal":9,"a":{"prompt":"A population is `P(t) = 2t^3 + 100` after `t` years. Use the secant from `t = 2` to `t = 2.01` to estimate its instantaneous growth rate at `t = 2`.","use":"`P(2.01) ≈ 116.2412`","options":[{"t":"About 24 per year","why":"`P(2) = 116`, so the slope `≈ (116.2412 - 116)/0.01 = 24.12`.","_n":"60347","_k":"8ea114c0"},{"t":"About 8 per year","why":"That’s the average from `t = 0` to `t = 2`: `(116 - 100)/2`.","_n":"613d7","_k":"ac7c2e52"},{"t":"About 116 per year","why":"116 is the population at `t = 2`, not its rate of change.","_n":"623e7","_k":"816cf518"},{"t":"About 0.24 per year","why":"Divide the rise by the run, 0.01.","_n":"63c78","_k":"befe1a56"}]},"b":{"prompt":"A tank’s volume is `V(t) = 5t^2 + 50` litres after `t` minutes. Use the secant from `t = 4` to `t = 4.01` to estimate its rate of change at `t = 4`.","use":"`V(4.01) = 130.4005`","options":[{"t":"About 0.4 L/min","why":"Divide by the run, 0.01.","_n":"64c68","_k":"b9344044"},{"t":"About 130 L/min","why":"130 L is the volume at `t = 4`, not its rate of change.","_n":"65c98","_k":"2e6ac55a"},{"t":"About 40 L/min","why":"`V(4) = 130`, so the slope `= 0.4005/0.01 = 40.05`.","_n":"66c88","_k":"9e62b4f7"},{"t":"About 20 L/min","why":"That’s the average from 0 to 4 min: `(130 - 50)/4`.","_n":"67c38","_k":"77c46af6"}]}},{"id":"f15","cat":"A","topic":"07","goal":7,"a":{"prompt":"A designer uses `y = x^3` on `0 ≤ x ≤ 2` to model a curved ramp. She wants a new ramp that is twice as tall over the same horizontal distance, starting at `(1, 0)` instead of `(0, 0)`. Which equation should she use?","options":[{"t":"`y = 2(x - 1)^3`","why":"`@a{a} = 2` doubles every height, and `@d{d} = 1` moves the start to `x = 1`. At `x = 3` the height is 16, twice the original 8.","_n":"68c28","_k":"a2aa57b7"},{"t":"`y = [2(x - 1)]^3`","why":"That’s `@k{k} = 2`, a horizontal compression. It makes the heights `2^3 = 8` times as big.","_n":"69c58","_k":"ae7c9b92"},{"t":"`y = 2(x + 1)^3`","why":"`(x + 1)` moves the ramp \u003cstrong>left\u003c/strong>, to start at `x = -1`.","_n":"6ac48","_k":"a606ed6b"},{"t":"`y = 2x^3 - 1`","why":"−1 moves the ramp \u003cstrong>down\u003c/strong>. The start has to move \u003cstrong>right\u003c/strong>.","_n":"6bbf8","_k":"ffd559dd"}]},"b":{"prompt":"She now wants a ramp half as tall over the same horizontal distance, starting at `(-2, 0)`. Which equation should she use?","options":[{"t":"`y = [{1}/{2}(x + 2)]^3`","why":"That’s a horizontal stretch, which gives heights `{1}/{8}` as big.","_n":"6cbe8","_k":"ff5a8fc3"},{"t":"`y = {1}/{2}x^3 + 2`","why":"+2 moves the ramp \u003cstrong>up\u003c/strong>. The start has to move \u003cstrong>left\u003c/strong>.","_n":"6dc17","_k":"bd3749fa"},{"t":"`y = {1}/{2}(x + 2)^3`","why":"`@a{a} = {1}/{2}` halves every height, and `@d{d} = -2` moves the start to `x = -2`. At `x = 0` the height is 4, half of the original 8.","_n":"6ec27","_k":"8945bae7"},{"t":"`y = {1}/{2}(x - 2)^3`","why":"`(x - 2)` moves the ramp \u003cstrong>right\u003c/strong>, to start at `x = 2`.","_n":"6fbf7","_k":"b6e317dc"}]}}]},"task":{"title":"Design a polynomial","summary":"Design a polynomial","statement":"\u003cp>Design a polynomial function in factored form that:\u003c/p>\u003cul>\u003cli>has degree 4;\u003c/li>\u003cli>has both arms pointing up;\u003c/li>\u003cli>has exactly three different `x`-intercepts;\u003c/li>\u003cli>has a `y`-intercept of −6;\u003c/li>\u003cli>is negative on exactly one interval (one piece, not two or more).\u003c/li>\u003c/ul>\u003cp>There’s more than one answer.\u003c/p>","checks":["Valid entries","Degree 4","Both arms point up","Exactly three different `x`-intercepts","`y`-intercept is −6","Negative on exactly one interval"],"tips":["Check your entries: `a` can’t be 0, each zero must be a whole number from −5 to 5 with an order of 1, 2 or 3, and no zero can be used twice.","Add the orders. Right now they total {sum}, and you need 4. With three different zeros, one must have order 2.","For both arms up you need an even degree \u003cstrong>and\u003c/strong> `a > 0`.","Fill all three zero slots with different numbers. Each different zero gives its own `x`-intercept.","Substitute `x = 0`. Each factor `(x - r)` becomes `-r`, so right now `y = ` {value}. A squared factor is always positive, so the sign comes from `a` and the two single zeros: put them on opposite sides of 0. Then choose `a` so the product is exactly −6. A fraction is fine.","Right now `y \u003c 0` on {intervals}. A double zero only touches the axis, so if it sits between the two single zeros it splits the negative part in two. Move the double zero outside the single zeros, then find `a` again."],"explainPrompt":"Explain how you know your function rises at both ends, and why it is negative on only one interval. State that interval in interval notation.","vocab":"Use the words degree, leading coefficient, order, touches and interval.","success":"Your design meets all six conditions.","more":"There’s more than one answer. Can you find another?"},"cards":[["End behaviour from the leading term","Even degree: both arms the same way. Odd degree: opposite ways. Negative leading coefficient: flip both. Only the leading term matters for large `|x|`. Example: `-2x^3` goes Q2 to Q4: as `x → -∞`, `y → ∞`, and as `x → ∞`, `y → -∞`."],["Degree `n`: the maximums","At most `n` `x`-intercepts and at most `n - 1` turning points."],["Brackets in interval notation","[ ] includes the endpoint, ( ) excludes it, and ∞ always takes ( ). Example: `x ≥ -3` is `[-3, ∞)`."],["∪ in interval notation","“Or”: joins pieces. `(-∞, -1) ∪ (4, ∞)` means `x \u003c -1` or `x > 4`."],["Finite differences","Constant `n`th differences (`x` step 1) mean degree `n`, and leading coefficient = `n`th difference ÷ `n!`."],["Order of a zero","Order 1: crosses. Order 2: touches and turns. Order 3: crosses and flattens."],["Equation from a graph","Write `y = a(x - r_1)…`, using the zeros and their orders, then substitute one other point to find `a`."],["Even function","`f(-x) = f(x)`: line symmetry about the `y`-axis. Polynomial with only even powers (constants count)."],["Odd function","`f(-x) = -f(x)`: point symmetry about the origin. Polynomial with only odd powers, and no constant term."],["Mapping rule for `y = a[k(x - d)]^{@n{n}} + c`","`(x, y) → (x/k + d, ay + c)`"],["Inside vs outside the brackets","Inside (`k`, `d`): horizontal changes, and they act “backwards”. Outside (`a`, `c`): vertical changes."],["Average rate of change","Slope of the secant: `{f(x_2) - f(x_1)}/{x_2 - x_1}`, in units of `y` per unit of `x`. It describes the whole interval from `x_1` to `x_2`, not one instant."],["Instantaneous rate of change","The slope of the tangent. Estimate it with secant slopes over smaller and smaller intervals."],["Horizontal tangent","Instantaneous rate of change = 0. Every turning point (local max or min) has one, but a graph can also flatten without turning, as `y = x^3` does at `(0, 0)`. Check the sign of the rate on each side."]]}};</script>
