.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 19: reciprocal plotter, three cases sketch builder, match thumbnails, work backwards, design task */
.hero-caps{margin:6px 0 0;padding-left:1.2em;text-align:left}
.rq .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.rq-cap .w{font:400 .5em var(--font-ui);color:var(--ink-2);vertical-align:middle}
.rq-cap{font-size:clamp(1.15rem,3vw,1.6rem)}
.rq-strip{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0;padding:0}
.rq-strip li{display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:8px;padding:5px 8px;font-size:.82rem;line-height:1.2;color:var(--ink-2);min-width:0}
.rq-strip li.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rq-strip li.pulse{animation:rqpulse .2s ease-out}
@keyframes rqpulse{from{transform:scale(1.06)}to{transform:scale(1)}}
.rq-ic{flex:0 0 auto;display:inline-flex}
.rq-dot{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2}
.rq-dot:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.rq-dot[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.rq-entry{margin-top:10px}
.rq-entry:empty{display:none}
.rq-q{margin:0 0 8px;font-weight:700}
.rq-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rq-lhs{font-size:1.15rem}
.frbox{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.frbox input{width:5.4rem;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:.3em .4em;font:400 1.1rem var(--font-math);text-align:center}
.frbox input:focus{border-color:var(--ink)}
.frbar{display:block;width:100%;height:2px;background:var(--ink)}
.rq-prog{margin:4px 0 0;font-weight:700}
.rq-pre{margin-bottom:6px}
.rq-tg{margin:12px 0 0}
.rq-note{margin-top:8px}
.rq-tcap{margin:12px 0 4px;font-weight:700}
.rq-tnote{margin-top:12px}
.rq-snaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rq-snaps figure{margin:0}
.rq-snaps figcaption{font-size:.82rem;margin-top:4px}
.rq-all{display:none}
@media (max-width:560px){
  .rq-read:not(.all) > .rq-x{display:none}
  .rq-all{display:inline-block;margin-top:8px}
  .rq-strip li{flex-direction:column;align-items:flex-start;font-size:.76rem;padding:4px 6px}
}

/* Part 3: three cases */
.sk-tri{display:grid;grid-template-columns:repeat(3,minmax(0,170px));gap:8px;margin:0 0 12px}
.sk-tc{margin:0;border:2px solid var(--rule);border-radius:8px;padding:4px;min-width:0}
.sk-tc.on{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.sk-tc canvas.plot{border:0;border-radius:4px}
.sk-tc figcaption{font-size:.8rem;line-height:1.2;margin-top:3px;color:var(--ink-2)}
.sk-tc.on figcaption{color:var(--ink);font-weight:700}
.sk-eq{font-size:clamp(1.3rem,3.4vw,1.9rem)}
.sk-steps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:.92rem}
.sk-steps li{display:flex;gap:8px;align-items:baseline;color:var(--ink-2)}
.sk-steps li.cur{color:var(--ink)}
.sk-steps li.done{color:var(--ink)}
.sk-steps .mk{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;border:1.5px solid var(--rule);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.sk-steps li.done .mk{border-color:var(--green);color:var(--green)}
.sk-steps li.cur .mk{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.sk-h{font-size:1.02rem;margin:4px 0 4px}
.sk-ch{display:inline-flex;flex-wrap:wrap;gap:6px}
.sk-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0}
.sk-lab{min-width:8.5rem;font-size:.92rem}
.sk-strip{overflow-x:auto;max-width:100%;margin-top:10px}
.sk-strip:empty{display:none}
.sk-sign th[scope="row"]{text-align:left}
.sk-sign td{white-space:nowrap}
.sk-sign .chip{min-width:2.4rem;font-size:1rem;padding:.2em .6em}
.sk-axis:not(:focus-within){position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.sk-axis:focus-within{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sk-axis .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.sk-card{margin-top:14px}
.sk-card .sk-kv{display:grid;grid-template-columns:minmax(7rem,auto) minmax(0,1fr);gap:4px 12px;padding:4px 0;border-bottom:1px solid var(--rule)}
.sk-card .sk-kv:last-child{border-bottom:0}
.sk-card dt{font-weight:700;font-size:.88rem;color:var(--ink-2)}
.sk-card dd{margin:0}
.sk .opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}

/* Practice 1: match the graph */
.gm-eqs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.gm-eq{display:inline-flex;align-items:center;gap:4px;font-size:1rem;padding:.3em .8em}
.gm-eq .m{font-size:1em}
.gm-eq.done{border-color:var(--green);background:var(--good-bg);color:var(--ink)}
.gm-n{font-weight:700}
.gm-to{font-size:.85rem;font-weight:700}
.gm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.gm-th{display:grid;gap:4px;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px;min-width:0;color:var(--ink)}
.gm-th:not(:disabled):hover{border-color:var(--pen)}
.gm-th.done{border-color:var(--green);background:var(--good-bg)}
.gm-tag{font-weight:700;font-size:.9rem}
.gm-c{border:0!important;border-radius:4px}
.gm-eqd{font-size:.88rem;overflow-wrap:anywhere}
.gm-eqd:empty{display:none}
.gm-eqd .pair-n{font-weight:700;color:var(--green)}
@media (max-width:560px){ .gm-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* Practice 2: work backwards */
.wb-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.25rem;margin:6px 0 4px}
.wb-frame .numin{width:5.2rem;font-size:1.1rem;padding:.3em .5em}
.wb-in.p-a{border-color:var(--acol)}
.wb-in.p-d{border-color:var(--p-d)}
.wb-in.p-c{border-color:var(--p-c)}
.wb-in[aria-invalid="true"]{border-color:var(--red);background:var(--bad-bg)}
.wb .pred-q{margin-top:0}
@media (max-width:560px){ .wb-frame{font-size:1rem;gap:3px} .wb-frame .numin{width:3.2rem;padding:.3em .3em;font-size:1rem} }

/* Performance task */
.ds{display:grid;gap:10px;margin:10px 0}
.ds-row,.ds-st{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ds-lab{min-width:1.6rem;font-size:1.2rem}
.ds-a .chip{min-width:2.6rem}
.ds-a .chip.on{background:var(--hi);border-color:var(--acol)!important;color:var(--hi-ink)}
.ds-in{width:5.4rem!important;text-align:center}
.ds-in.p-d{border-color:var(--p-d)}
.ds-in.p-c{border-color:var(--p-c)}
.ds-bad{color:var(--red);font-weight:700}
.ds-eq{font-size:clamp(1.1rem,3vw,1.5rem);margin:4px 0 0}
.ds-read{margin-top:10px}

"title":"Graphing the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"ddce8490","content":{"id":"19-reciprocal-of-quadratic-functions","kind":"topic","title":"Reciprocal of quadratic functions","topic":"Reciprocal of Quadratic Functions","readyTopic":"the reciprocals of quadratic functions","hero":{"eq":"`y = {1}/{@a{a}(x - @d{d})^2 + @c{c}}`","eqLabel":"y equals 1 over a times x minus d, all squared, plus c","eqSize":"md","headline":"Small turns big, and every zero becomes an asymptote","text":"The \u003cstrong>reciprocal\u003c/strong> of a quadratic `f` is `y = 1/f(x)`. Every point keeps its `x`-value, and its height becomes 1 divided by the old height. Heights near 0 turn into huge heights, so each \u003cstrong>zero\u003c/strong> of `f` becomes a \u003cstrong>vertical asymptote\u003c/strong>. Large heights turn tiny, so far out the graph hugs the \u003cstrong>horizontal asymptote\u003c/strong> `y = 0`. And the parabola’s \u003cstrong>vertex\u003c/strong> becomes a \u003cstrong>local maximum or minimum\u003c/strong>, unless it sits on the `x`-axis.","fig":{"aria":"The parabola f(x) = x squared minus 4x, dashed, with seven points that fly to their reciprocal heights; vertical asymptotes at x = 0 and x = 4 and the reciprocal drawn in three pieces","caps":["Two zeros → three pieces","One zero → two pieces","No zeros → one piece"]}},"goals":["I can explain how each value of a quadratic `f` turns into a value of `1/f`: same `x`, same sign, small ↔ large, and heights of 1 and −1 stay put.","I can decide whether a quadratic has two, one or no zeros, and find the vertical asymptotes, the horizontal asymptote and the `y`-intercept of its reciprocal.","I can find the local maximum or minimum of `y = 1/f(x)` from the vertex of `f`, and say when there isn’t one.","I can describe the behaviour of `1/f` near each vertical asymptote and as `x → ±∞`, and state where it is positive, negative, increasing and decreasing.","I can state the domain and range of `y = 1/f(x)` and sketch its graph from its key features.","I can work backwards from features to an equation, and use reciprocals of quadratics in new situations."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Factoring","goal":2,"prompt":"Factor `x^2 - 2x - 15`.","options":[{"t":"`(x - 5)(x + 3)`","why":"−5 × 3 = −15 and −5 + 3 = −2.","_n":"0ba9","_k":"28fb76a7"},{"t":"`(x - 15)(x + 1)`","why":"This expands to `x^2 - 14x - 15`. The product −15 is right, but the two numbers must also add to −2.","_n":"1bb9","_k":"3989112e"},{"t":"`(x + 5)(x - 3)`","why":"This expands to `x^2 + 2x - 15`: the middle term has the wrong sign. To add to −2, the larger number must be the negative one.","_n":"2bc9","_k":"d5f9209c"},{"t":"`(x - 5)(x - 3)`","why":"This expands to `x^2 - 8x + 15`. A negative constant needs one positive and one negative number.","_n":"3bd9","_k":"18f20d22"}],"hints":["Find two numbers that multiply to −15 and add to −2.","The product is negative, so one number is negative. Try 3 and 5 with one sign changed.","−5 × 3 = −15 and −5 + 3 = −2, so `x^2 - 2x - 15 = (x - 5)(x + 3)`."]},{"id":"w2","skill":"Zeros of a quadratic","goal":2,"prompt":"What are the zeros of `f(x) = x^2 + 6x + 10`?","options":[{"t":"There are none","why":"Complete the square: `x^2 + 6x + 10 = (x + 3)^2 + 1`, which is at least 1. It’s never 0. (The discriminant agrees: 36 − 40 = −4 \u003c 0.)","_n":"4be9","_k":"3caff05f"},{"t":"`x = -2` and `x = -5`","why":"`(x + 2)(x + 5) = x^2 + 7x + 10`. The product 10 is right, but the sum is 7, not 6.","_n":"5bf9","_k":"ee87ff8e"},{"t":"`x = -3` only (a double zero)","why":"`(x + 3)^2` would be `x^2 + 6x + 9`. The extra 1 lifts the vertex to (−3, 1), above the axis.","_n":"6c09","_k":"583765c0"},{"t":"`x = 2` and `x = 5`","why":"`(x - 2)(x - 5) = x^2 - 7x + 10`: both the sum and the signs are off.","_n":"7c19","_k":"057ab350"}],"hints":["Try completing the square, or check the discriminant `b^2 - 4ac`.","`x^2 + 6x + 10 = (x + 3)^2 + 1`. Can `(x + 3)^2 + 1` ever be 0?","`(x + 3)^2 >= 0`, so `(x + 3)^2 + 1 >= 1`. There are no zeros."]},{"id":"w3","skill":"Vertex form","goal":3,"prompt":"What is the vertex of `y = 2(x + 3)^2 - 5`?","options":[{"t":"(−6, −5)","why":"The 2 stretches the parabola vertically. It doesn’t move the vertex sideways.","_n":"8c29","_k":"3b5de168"},{"t":"(−3, −5)","why":"`x + 3 = x - (-3)`, so `d = -3` and `c = -5`.","_n":"9b8d","_k":"19d28ad4"},{"t":"(3, −5)","why":"`(x + 3)^2` is 0 when `x = -3`, not 3.","_n":"ab7d","_k":"41e159c0"},{"t":"(−5, −3)","why":"The `x`-value comes from the bracket and the `y`-value from the constant at the end.","_n":"bb6d","_k":"3d0dd08e"}],"hints":["In `y = a(x - d)^2 + c`, the vertex is (`d`, `c`).","Rewrite `x + 3` as `x - (-3)`.","`d = -3` and `c = -5`, so the vertex is (−3, −5)."]},{"id":"w4","skill":"Vertex form","goal":3,"prompt":"Write `x^2 - 8x + 13` in vertex form.","options":[{"t":"`(x - 4)^2 + 13`","why":"`(x - 4)^2` already contains 16, so this equals `x^2 - 8x + 29`.","_n":"cb5d","_k":"78544f20"},{"t":"`(x - 4)^2 - 3`","why":"Half of −8 is −4, and `(x - 4)^2 = x^2 - 8x + 16`. To get 13 instead of 16, subtract 3.","_n":"dbcd","_k":"8ed71c32"},{"t":"`(x - 8)^2 - 51`","why":"`(x - 8)^2 - 51 = x^2 - 16x + 13`. Use half of −8.","_n":"ebbd","_k":"d10466d1"},{"t":"`(x + 4)^2 - 3`","why":"`(x + 4)^2 = x^2 + 8x + 16`: the middle term has the wrong sign.","_n":"fbad","_k":"2e9b7efd"}],"hints":["Take half of the `x`-coefficient: half of −8 is −4.","`(x - 4)^2 = x^2 - 8x + 16`. How far is 16 from 13?","`x^2 - 8x + 13 = (x - 4)^2 - 16 + 13 = (x - 4)^2 - 3`."]},{"id":"w5","skill":"Reciprocal of a linear function","goal":2,"prompt":"What is the vertical asymptote of `y = 1/(2x - 6)`?","options":[{"t":"`x = 3`","why":"The denominator is 0 when `2x - 6 = 0`, that is, when `x = 3`.","_n":"gb9d","_k":"c44251cb"},{"t":"`x = 6`","why":"At `x = 6`, `2x - 6 = 6`. Divide by 2: `2x = 6` gives `x = 3`.","_n":"hc0d","_k":"727e1f35"},{"t":"`x = -3`","why":"At `x = -3`, `2x - 6 = -12`, not 0.","_n":"ibfd","_k":"c9e7eec9"},{"t":"`x = 1/3`","why":"That’s 2 ÷ 6. From `2x = 6`, `x` = 6 ÷ 2 = 3.","_n":"jbed","_k":"b618ce2d"}],"hints":["A vertical asymptote of 1/(linear) is where the denominator is 0.","Solve `2x - 6 = 0`.","`2x = 6`, so `x = 3`."]},{"id":"w6","skill":"Reciprocal of a linear function","goal":1,"prompt":"For what value of `x` does `1/(x - 2) = -10`?","options":[{"t":"`x = -8`","why":"That makes `x - 2 = -10`, so `1/(x - 2) = -1/10`.","_n":"kbfd","_k":"6484e10b"},{"t":"`x = 12`","why":"At 12, `x - 2 = 10`, and 1/10 is small and positive.","_n":"lbcd","_k":"eee0d83d"},{"t":"`x = 1.9`","why":"`x - 2` must be the reciprocal of −10, which is −0.1. So `x = 1.9`. A large reciprocal needs a small denominator.","_n":"mbdd","_k":"8fd8af0c"},{"t":"`x = 2.1`","why":"At 2.1, `x - 2 = 0.1`, and 1/0.1 = +10.","_n":"nbad","_k":"8f9bbb15"}],"hints":["If `1/(x - 2) = -10`, what must `x - 2` be?","`x - 2` is the reciprocal of −10, which is −1/10 = −0.1.","`x - 2 = -0.1`, so `x = 1.9`."]}],"refreshers":{"Factoring":"To factor `x^2 + bx + c`, find two numbers that multiply to `c` and add to `b`. Example: −5 × 3 = −15 and −5 + 3 = −2, so `x^2 - 2x - 15 = (x - 5)(x + 3)`, with zeros `x = 5` and `x = -3` (the opposite signs of the numbers in the brackets). A difference of squares factors, `x^2 - 9 = (x - 3)(x + 3)`, but a sum such as `x^2 + 9` doesn’t factor at all.","Zeros of a quadratic":"A quadratic has two zeros, one (double) zero, or none. Completing the square shows which: `x^2 + 6x + 10 = (x + 3)^2 + 1` is never below 1, so it has none. The discriminant `b^2 - 4ac` says the same: positive means two zeros, 0 means one, negative means none.","Vertex form":"`y = a(x - d)^2 + c` has its vertex at (`d`, `c`). (Grade 11 wrote `y = a(x - h)^2 + k`; `d` and `c` do the same jobs.) If `a > 0` the vertex is a minimum; if `a \u003c 0` it’s a maximum. To get vertex form, complete the square: `x^2 - 8x + 13 = (x - 4)^2 - 16 + 13 = (x - 4)^2 - 3`, so the vertex is (4, −3).","Reciprocal of a linear function":"`y = 1/(kx - c)` has a vertical asymptote where `kx - c = 0`. The reciprocal of a small number is large (1/0.1 = 10), and it keeps the sign (1/(−0.1) = −10). Example: `1/(x - 2) = -10` when `x - 2 = -0.1`, at `x = 1.9`, just left of the asymptote `x = 2`."}}},"explore":{"heading":"Reciprocal plotter","intro":"Build the reciprocal of a parabola one point at a time. Then slide the parabola and watch the reciprocal change shape. The panel lists every key feature as you go.","note":"Here `a`, `d` and `c` do the jobs they did in module 07: `a` stretches or flips the parabola, `d` moves it sideways and `c` moves it up or down. So they appear in their course colours. Grade 11 wrote the same form as `y = a(x - h)^2 + k`; this course uses `d` and `c`, so the vertex is (`d`, `c`). (In module 18’s `y = 1/(kx - c)`, the letters were plain coefficients, written in ink.)","modes":[{"id":"plot","t":"Plot by hand"},{"id":"slide","t":"Slide the parabola"}],"caseStrip":["Two zeros · three pieces","One zero · two pieces","No zeros · one piece"],"caseNames":["two zeros","one zero","no zeros"],"caseSay":{"two":"Now: two zeros. Two vertical asymptotes, at {xs}.","one":"Now: one zero. One vertical asymptote, at {xs}.","none":"Now: no zeros. No vertical asymptotes."},"toggles":[["para","Show the parabola"],["flight","Flight lines"],["ones","Lines `y = 1` and `y = -1`"],["band","Big ↔ small band"],["table","Close-up table"]],"presets":[{"id":"two","name":"Two zeros","a":1,"d":2,"c":-4,"view":{"xmin":-2,"xmax":6,"ymin":-5,"ymax":6},"xs":[-1,0,1,2,3,4,5],"zero":4,"tableXs":[3.9,3.99,4.01,4.1]},{"id":"one","name":"One zero","a":1,"d":1,"c":0,"view":{"xmin":-2,"xmax":4,"ymin":-1.5,"ymax":5},"xs":[-1,0,1,2,3],"zero":1,"tableXs":[0.9,0.99,1.01,1.1]},{"id":"none","name":"No zeros","a":1,"d":-1,"c":2,"view":{"xmin":-4.5,"xmax":2.5,"ymin":-1.5,"ymax":7},"xs":[-3,-2,-1,0,1]},{"id":"down","name":"Opens down","a":-1,"d":0,"c":4,"view":{"xmin":-4,"xmax":4,"ymin":-6,"ymax":5},"xs":[-3,-2,-1,0,1,2,3],"zero":2,"tableXs":[1.9,1.99,2.01,2.1]}],"plot":{"prompt":"{fx} = {v}. Plot 1/{fx}.","pick":"Tap a dot on the parabola (or use the arrow keys and Enter) to plot its reciprocal.","num":"Numerator","den":"Denominator (blank means 1)","noValue":"No value: `f(x) = 0`","plotIt":"Plot it","progress":"Plotted {n} of {N} ({f} right first time)","draw":"Draw the curve","toGo":"Plot all the points first: {n} to go","another":"Try another preset","right":"{fx} = {v}, so 1/{fx} = {r}.","rightZero":"{fx} = 0, so there’s no point here: {xa} is a vertical asymptote.","stay":"{fx} = {v}, and 1/{vp} = {v}: this point stays put. Points at height 1 or −1 are on both graphs.","fb":{"zero0":"1/0 isn’t 0: dividing by 0 has no answer, so there’s no point here. Press ‘No value’.","zeroNum":"{fx} = 0 here, so 1/{fx} would be 1/0, which has no value. There’s no point to plot. Press ‘No value’.","self":"That’s {fx} itself, the parabola’s height. The reciprocal is 1 divided by that height.","sign":"Right size, wrong sign. Reciprocals keep the sign: {fx} = {v}, so 1/{fx} is {pn} too.","neg":"That reflects the point in the `x`-axis. The reciprocal keeps the sign and flips the size.","recipX":"You took the reciprocal of the `x`-value. Keep {xx} and take the reciprocal of the height, {fx}.","noValue":"{fx} = {v}, which isn’t 0, so 1/{fx} has a value. Only zeros of `f` have no reciprocal.","other":"Not quite. {fx} = {v}. Divide 1 by that height and write the result as a fraction.","empty":"Type a whole number in the numerator box (and the denominator, if you need one), or press ‘No value’."},"banner":"Your {n} points, joined. Far out, the curve hugs `y = 0`. Near {xs} it shoots off, because `f` is close to 0 there.","bannerNone":"Your {n} points, joined. Far out, the curve hugs `y = 0`. `f` never gets close to 0, so the curve never shoots off: it’s one unbroken piece."},"table":{"head":["`x`","`f(x)`","`1/f(x)`"],"cap":"Close-up near {xa}","offs":["zero − 0.1","zero − 0.01","zero + 0.01","zero + 0.1"],"none":"No zeros: nothing to zoom in on. The closest `f` gets to 0 is its vertex height, {c}, so `1/f` never gets above {rc}.","noneBelow":"No zeros: nothing to zoom in on. The closest `f` gets to 0 is its vertex height, {c}, so `1/f` never gets below {rc}."},"sliders":{"a":"`@a{a}`, stretch or flip","d":"`@d{d}`, sideways shift","c":"`@c{c}`, up or down","skip":"`@a{a}` skips 0 (the thumb jumps from 0.25 to −0.25 and back).","handle":"Vertex handle at ({d}, {c}). Arrow keys move `d` by 0.5 or `c` by 0.25; Shift + arrow moves by 1."},"reset":"Reset to the start graph","graph":{"ha":"y = 0 (horizontal asymptote)","min":"min","max":"max","lmax":"local max","lmin":"local min","onAxis":"({d}, 0): on the axis, so it becomes the asymptote","stay":"stays put","small":"small heights"},"read":{"quad":"Quadratic","recip":"Reciprocal","kase":"Case","zeros":"Zeros of `f`","va":"Vertical asymptotes","ha":"Horizontal asymptote","vtx":"Vertex of `f` → turning point of `1/f`","yint":"`y`-intercept","xint":"`x`-intercepts","dom":"Domain","rng":"Range","sign":"Positive / negative","incdec":"Increasing / decreasing","near":"Near the asymptotes","ends":"End behaviour","stay":"Points that stay put (`f(x) = ±1`)","cases":["Two zeros","One zero (a double zero)","No zeros"],"noZeros":"none: `f(x)` is never 0","none":"none","haVal":"`y = 0` (the `x`-axis)","xintVal":"none: `1/f(x)` is never 0","yintNone":"none: `x = 0` is a vertical asymptote","min":"a minimum","max":"a maximum","lmax":"a local maximum","lmin":"a local minimum","vtxZero":"({d}, 0) is on the `x`-axis → no turning point; {xa} is an asymptote instead","posAll":"positive everywhere","negAll":"negative everywhere","split":"(on each piece separately: the asymptote at {xa} splits the interval)","splitTwo":"(on each piece separately: the asymptotes at {xa} and {xb} split the intervals)","noStay":"none: the parabola never reaches 1 or −1","more":"More facts","fewer":"Fewer facts"},"predIntro":"Make a prediction first. Then the plotter will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"plot","preset":"one","plotted":[-1,3]},"prompt":"At `x = 0`, 1 and 2 the parabola’s heights are 1, 0 and 1. What happens to the reciprocal at those three `x`-values?","options":[{"t":"Heights −1, 0 and −1","_n":"obbd","_k":"6594e86b"},{"t":"Heights 1, ∞ and 1: the point at `x = 1` is at infinity","_n":"pb8d","_k":"5d3000ea"},{"t":"Heights 1 and 1 at `x = 0` and 2, and no point at `x = 1`: a vertical asymptote","_n":"qb9d","_k":"ef30c5b9"},{"t":"Heights 1, 0 and 1: the reciprocal touches the `x`-axis at `x = 1`","_n":"rc6d","_k":"8b3a27c5"}],"explain":"At `x = 0` and 2, `f = 1` and 1/1 = 1, so those points stay put. At `x = 1`, `f = 0` and 1/0 has no value, so there’s no point, and certainly no `x`-intercept. Close to `x = 1`, `f` is tiny and positive (`f(1.1) = 0.01`), so `1/f` is huge (100). That’s a vertical asymptote. Because `(x - 1)^2` is never negative, both pieces go \u003cstrong>up\u003c/strong>. (There’s no point ‘at infinity’ either: ∞ isn’t a number, so it can’t be a height. The heights just grow without bound as `x` gets close to 1.)"},{"id":"p2","start":{"mode":"slide","a":1,"d":1,"c":2,"hide":true},"prompt":"The parabola’s lowest point is (1, 2). What will the reciprocal have at `x = 1`?","options":[{"t":"A highest point, at (1, 1/2)","_n":"sc7d","_k":"963dcde2"},{"t":"A lowest point, at (1, 1/2)","_n":"tc4d","_k":"3ff3e7ad"},{"t":"A highest point, at (1, 2)","_n":"uc3d","_k":"ded50523"},{"t":"A lowest point, at (1, −2)","_n":"vc6d","_k":"226bc5b9"}],"label":"local max (1, 1/2)","explain":"Everywhere else `f(x)` is more than 2, so `1/f(x)` is less than 1/2: `f(0) = 3` gives 1/3, and `f(3) = 6` gives 1/6. The smallest value of `f` gives the largest value of `1/f`. So the parabola’s minimum becomes the reciprocal’s local maximum, at the same `x`, with height 1/2."},{"id":"p3","start":{"mode":"slide","a":1,"d":0,"c":2},"prompt":"`c` will slide slowly from 2 down to −2. How many vertical asymptotes will the reciprocal have at `c = 1`, `c = 0` and `c = -1`, in that order?","options":[{"t":"2, 1, 0","_n":"wc5d","_k":"ebefe10b"},{"t":"0, 2, 2","_n":"xc8d","_k":"24f40b7d"},{"t":"0, 0, 2","_n":"yc7d","_k":"d567e03b"},{"t":"0, 1, 2","_n":"zcad","_k":"1fecce25"}],"snaps":["`c = 1`: no zeros, one piece","`c = 0`: one zero, two pieces","`c = -1`: two zeros, three pieces"],"explain":"The vertical asymptotes are the zeros of `f`. At `c = 1` the parabola is above the axis: no zeros. At `c = 0` it touches the axis at `x = 0`: one double zero, one asymptote. At `c = -1` it crosses at `x = -1` and 1: two zeros, two asymptotes. (A double zero gives \u003cstrong>one\u003c/strong> asymptote, not two.)"},{"id":"p4","start":{"mode":"slide","a":-1,"d":0,"c":4,"hide":true},"prompt":"Just to the right of `x = 2`, which way does the reciprocal go?","options":[{"t":"It crosses the `x`-axis at `x = 2`","_n":"10c9d","_k":"c6a5ef03"},{"t":"Up, toward +∞","_n":"11bcd","_k":"43a33eab"},{"t":"Down, toward −∞","_n":"12bbd","_k":"90c46bfa"},{"t":"It levels off toward `y = 0`","_n":"13cad","_k":"403ca114"}],"walk":[3,2.5,2.1,2.01],"explain":"Just right of 2, `f(x)` is negative and close to 0: `f(2.1) = -0.41`. A small negative number has a large negative reciprocal, so as `x → 2^{+}`, `y → -∞`. Between −2 and 2 the parabola is above the axis, so the middle piece is above it too, with a local minimum at (0, 1/4), the reciprocal of the vertex height 4."}],"chalIntro":"Use \u003cstrong>Slide the parabola\u003c/strong>. Each challenge starts from the start graph, `a = 1`, `d = 2`, `c = -4` (the plotter resets after each one you meet). Set the sliders, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Make the reciprocal have vertical asymptotes at `x = -1` and `x = 1`.","why":"With `d = 0` and `c = -a`, `f(x) = a(x^2 - 1)`, which is 0 at `x = -1` and `x = 1`.","named":{"offCentre":"Your asymptotes are at {r1} and {r2}, centred on {xd}. They always sit symmetrically about the parabola’s axis, {xd}. You need them centred on 0.","gap":"Centred correctly, but the gap is wrong. The asymptotes are at `±√{-c/a}`, so you need `-c/a = 1`.","none":"Your parabola never reaches the `x`-axis, so there’s nothing to divide by zero. `a` and `c` need opposite signs.","c0":"One asymptote: the vertex is on the `x`-axis, a double zero. Move `c` off 0, to the opposite sign from `a`.","other":"Check where the parabola crosses the `x`-axis. Those are the asymptotes."},"hints":["Where are the asymptotes? Where the parabola meets the `x`-axis.","The asymptotes sit symmetrically about the axis `x = d`, so `d = 0`. Then the zeros are `±√{-c/a}`.","With `d = 0`, you need `√{-c/a} = 1`, so `c = -a`. For example, `a = 1` and `c = -1` give `f(x) = x^2 - 1 = (x - 1)(x + 1)`."]},{"id":"tc2","goal":3,"prompt":"Make the reciprocal have a local minimum at (−2, 1/3).","why":"`d = -2`, `c = 3` and a negative `a`: the parabola’s maximum (−2, 3) becomes the local minimum (−2, 1/3).","named":{"aPos":"Your reciprocal has a local \u003cstrong>maximum\u003c/strong> at (−2, 1/3). The parabola opens up, so its vertex is a minimum, and that turns into a maximum. Make `a` negative.","small":"Your turning point is at (−2, 1/`c`) = (−2, {v}). Its height is the reciprocal of `c`, not `c` itself. Which `c` has 1/`c` = 1/3?","cNeg":"Your turning point is at (−2, −1/3), below the axis. You need +1/3.","d2":"The turning point is at `x = d`. You’re on the right side of the `y`-axis; you need `x = -2`.","other":"The turning point is (`d`, 1/`c`). Set `d` first, then `c`, then decide the sign of `a`."},"hints":["The reciprocal’s turning point comes from the parabola’s vertex (`d`, `c`). It’s at (`d`, 1/`c`).","1/`c` = 1/3 means `c = 3`, and `d = -2`. Should the vertex be a maximum or a minimum?","A local minimum of `1/f` comes from a maximum of `f`, so the parabola must open down: `d = -2`, `c = 3` and any negative `a`, such as `a = -1`, which gives `f(x) = -(x + 2)^2 + 3`."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"Keep the asymptotes at `x = 0` and `x = 4`, but change the graph so that it has a local \u003cstrong>minimum\u003c/strong> at (2, 1/2).","why":"`f(x) = -{1}/{2}(x - 2)^2 + 2`: its maximum (2, 2) becomes the local minimum (2, 1/2), and `f(0) = f(4) = 0`. It’s the only slider state that works.","named":{"start":"This is the starting graph: the asymptotes are right, but its turning point is a local maximum at (2, −1/4).","maxBelow":"Asymptotes at 0 and 4 ✓, but the turning point is a local \u003cstrong>maximum\u003c/strong> at (2, {v}), below the axis. A local minimum above the axis needs a parabola that opens down with its vertex above the axis.","minHeight":"Asymptotes ✓ and a local minimum ✓, but it’s at (2, {v}). The height of the turning point is 1/`c`, so which `c` gives 1/2? Then make `f(4) = 0` again.","wrongA":"Local minimum (2, 1/2) ✓, but the asymptotes are at {rs}, not 0 and 4. Check: `f(4) = 4a + 2` = {v}, not 0.","aPos":"With `a > 0` and `c > 0` the parabola never reaches the `x`-axis, so there are no asymptotes, and the turning point is a maximum.","cHalf":"Your turning point is at (2, 2). Its height is 1/`c`, not `c`.","other":"Work in order: the turning point fixes `d` and `c`; then the asymptote at `x = 4` fixes `a`."},"hints":["The turning point (2, 1/2) comes from the vertex. What must `d` and `c` be?","`d = 2` and `c = 2`, and a local minimum needs `a \u003c 0`. The asymptote `x = 4` means `f(4) = 0`.","`f(4) = a(4 - 2)^2 + 2 = 4a + 2 = 0`, so `a = -1/2`. The answer is `f(x) = -{1}/{2}(x - 2)^2 + 2`."]}]},"part3":{"slug":"cases","name":"Three cases","heading":"Three cases, one routine","intro":"Each case file gives you an equation. Answer six questions about it. Each right answer adds a layer to the sketch, and the curve draws itself at the end.","triptych":[{"t":"Two zeros · three pieces","a":1,"d":0,"c":-1,"aria":"Thumbnail: reciprocal of x squared minus 1, three pieces with asymptotes x = −1 and x = 1"},{"t":"One zero · two pieces","a":1,"d":0,"c":0,"aria":"Thumbnail: reciprocal of x squared, two pieces rising along the asymptote x = 0"},{"t":"No zeros · one piece","a":1,"d":0,"c":1,"aria":"Thumbnail: reciprocal of x squared plus 1, one hump with a local maximum at (0, 1)"}],"stepNames":["Which case?","Vertical asymptotes","Signs","Turning point","Arrows","Range"],"stepGoals":[2,2,4,3,4,5],"stepHow":["Count the zeros of the denominator.","Tap the `x`-axis at each vertical asymptote (tap again to remove one), or press \u003cstrong>None\u003c/strong>. Then press Check.","Set + or − for each interval of the sign strip under the graph. Then press Check.","Choose the turning point of the reciprocal.","For each asymptote, choose where the graph goes on its left and right. For each end, choose how it approaches `y = 0`. Then press Check.","Choose the range of the reciprocal."],"ui":{"none":"None","check":"Check","drawIt":"Draw it","next":"Next case file","prev":"Previous","tapped":"Your asymptotes: {xs}","tappedNone":"Your asymptotes: none yet","noneChosen":"Your answer: none","lives":"1/f lives here","left":"left of {x}","right":"right of {x}","endL":"Left end","endR":"Right end","up":"↑ +∞","down":"↓ −∞","zp":"`y → 0^{+}`","zm":"`y → 0^{-}`","file":"Case file {n} of 4","done":"Case file finished: {n} of 6 steps right first time.","fileOf":"Case file","alg":"Check it with algebra","card":"Feature card","dom":"Domain","rng":"Range","yint":"`y`-intercept","xint":"`x`-intercepts","xintVal":"none","inc":"Increasing","dec":"Decreasing","interval":"Interval","sign":"Sign of `f`","axisBtns":"Asymptote positions (buttons for keyboard use)","stepOf":"Step {n} of 6: "},"fallback":{"1":"Try to factor it. If it won’t factor, complete the square and look at the vertex height. Then count the zeros. Try again.","2":"The asymptotes are exactly the zeros of the denominator. Set each factor equal to 0, and tap only those `x`-values. Try again.","3":"Test one `x`-value inside each interval. The sign of `f` there is the sign of `1/f`. Try again.","5":"Use your signs from step 3: on each side of an asymptote, positive and tiny → +∞, negative and tiny → −∞. Far out, `f` is large with the sign of `a`, so `1/f → 0` from that side. Try again."},"files":[{"id":"cf1","goal":[2,3,4,5],"eq":"`y = 1/(x^2 - 2x - 8)`","eqs":"`y = {1}/{x^2 - 2x - 8}`","a":1,"d":1,"c":-9,"view":{"xmin":-5,"xmax":7,"ymin":-1.5,"ymax":1.5},"s1":{"choices":[{"t":"Two zeros","_n":"14cbd","_k":"7323e297"},{"t":"One zero","fb":"A single double zero needs a perfect square like `(x - 1)^2`. These two factors are different.","_n":"15ccd","_k":"be52c874"},{"t":"No zeros","fb":"It factors: `x^2 - 2x - 8 = (x + 2)(x - 4)`.","_n":"16cdd","_k":"d630f93c"}],"hints":["Try to factor. If it won’t, complete the square.","`x^2 - 2x - 8 = (x + 2)(x - 4)`.","Two different factors, so two zeros: the case is two zeros."]},"s2":{"_a":"P0lRSQxp","wrong":[{"set":[-4,2],"fb":"`(x + 2)` is 0 at `x = -2`, not 2: the zero has the opposite sign."},{"set":[1],"fb":"`x = 1` is the axis of symmetry, where the turning point will be. Asymptotes come from zeros."}],"hints":["Asymptotes are where `f(x) = 0`.","Set each factor equal to 0.","`x = -2` and `x = 4`."]},"s3":{"_a":"P0ZIRxQWFBJIRkhHZQ==","anyWrong":"Test a value in that interval: `f(-3) = 7`, `f(0) = -8` and `f(5) = 7`. `1/f` has the same sign as `f`.","hints":["Pick a test value in each interval.","`f(-3) = 7`, `f(0) = -8` and `f(5) = 7`.","+, −, +; `1/f` has the same signs."]},"s4":{"tp":[1,-0.1111111111111111],"tpLabel":"(1, −1/9) local max","options":[{"t":"Local maximum (1, −1/9)","why":"The parabola’s minimum (1, −9) becomes a local maximum at height 1/(−9) = −1/9.","_n":"17c6d","_k":"8529c794"},{"t":"Local maximum (1, −9)","why":"Right type, but the height must be the reciprocal: −1/9.","_n":"18c7d","_k":"52c5ffd5"},{"t":"Local minimum (1, −1/9)","why":"The parabola’s vertex is a minimum (it opens up), so the reciprocal has a local \u003cstrong>maximum\u003c/strong> there.","_n":"19c8d","_k":"8ec5f30b"},{"t":"Local minimum (1, −9)","why":"(1, −9) is the parabola’s vertex. Flip both the height (1/(−9) = −1/9) and the type.","_n":"1ac9d","_k":"3f2725da"}],"hints":["Find the vertex (`d`, `c`) of `f`.","The vertex is (1, −9), a minimum.","The turning point is a local maximum at (1, −1/9)."]},"s5":{"_a":"H0YQDFxRShJePzhHExYVEklGPkljFhQSSEZIR2VpFRIBCgcWGg5iEk9GT0cTFmRN","side":"Follow the signs from step 3: just left of −2, `f` is positive and tiny, so `1/f → +∞`; just right, it’s negative and tiny, so `1/f → -∞`.","end":"Far out, `f` is large and positive, so `1/f` is small and positive: `0^{+}`.","hints":["Use the signs from step 3 on each side of each asymptote.","Positive and tiny → +∞; negative and tiny → −∞.","As `x → -2^{-}`, `y → +∞`; as `x → -2^{+}`, `y → -∞`; as `x → 4^{-}`, `y → -∞`; as `x → 4^{+}`, `y → +∞`; at both ends, `y → 0^{+}`."]},"s6":{"pieces":[{"a":null,"b":-0.1111111111111111,"bIn":true},{"a":0,"b":null,"aIn":false}],"options":[{"t":"`[-1/9, 0) ∪ (0, ∞)`","why":"−1/9 is the top of the middle piece, not the bottom. Near the asymptotes it drops to −∞.","_n":"1bc2d","_k":"13c37dc6"},{"t":"`[-9, ∞)`","why":"That’s the range of the parabola, not its reciprocal.","_n":"1cc3d","_k":"33edf79e"},{"t":"`(-∞, -1/9] ∪ (0, ∞)`","why":"The middle piece climbs only to −1/9; the outer pieces take every positive value.","_n":"1d50e","_k":"af0eb084"},{"t":"`(-∞, 0) ∪ (0, ∞)`","why":"The middle piece only climbs to −1/9. Values between −1/9 and 0 are never reached.","_n":"1e4fe","_k":"b1c42043"}],"hints":["Where is the turning point, and which pieces are above or below the axis?","The oute
