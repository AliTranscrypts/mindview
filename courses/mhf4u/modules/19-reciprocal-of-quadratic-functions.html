` goes from 0 to −3, so it isn’t a maximum.","_n":"1k49e","_k":"69fe663e"},{"t":"None: the vertex (−3, 0) is on the `x`-axis, so it becomes the asymptote","why":"1/0 has no value, so the vertex can’t become a turning point. It becomes the asymptote `x = -3`.","_n":"1l48e","_k":"29198687"}],"hints":["Find the vertex (`d`, `c`) of `f`.","The vertex is (−3, 0), a minimum on the `x`-axis.","None: the vertex (−3, 0) is on the `x`-axis, so it becomes the asymptote."]},"s5":{"_a":"H0YQDFxRShJePzhHExYVEk9GPjgUFlxeABdBX2MWEhJIRkhHZUk=","named":[{"at":0,"side":0,"val":"-","fb":"That’s the `1/x` pattern. Here the denominator is squared, so it’s positive on the left too: +∞ on both sides."}],"hints":["Use the signs from step 3 on each side of each asymptote.","Positive and tiny → +∞; negative and tiny → −∞.","As `x → -3^{-}`, `y → +∞`; as `x → -3^{+}`, `y → +∞`; at both ends, `y → 0^{+}`."]},"s6":{"pieces":[{"a":0,"b":null,"aIn":false}],"options":[{"t":"`(0, ∞)`","why":"Both pieces are above the axis and rise without bound near `x = -3`, and the graph never reaches 0.","_n":"1m47e","_k":"ee5c6d61"},{"t":"`(0, 1/9]`","why":"1/9 is only the `y`-intercept. Near `x = -3` the graph rises without bound.","_n":"1n36e","_k":"74542d61"},{"t":"`(-∞, 0) ∪ (0, ∞)`","why":"Both pieces are above the axis, so no negative values.","_n":"1o37e","_k":"4669b8d9"},{"t":"`[0, ∞)`","why":"`1/f` is never 0, so 0 isn’t in the range.","_n":"1p34e","_k":"0e9ccd69"}],"hints":["Where is the turning point, and which pieces are above or below the axis?","There’s no turning point. Both pieces are above the axis and rise without bound near `x = -3`.","Range: `(0, ∞)`."]},"alg":["`x^2 + 6x + 9 = (x + 3)^2`, zero at −3 (order 2).","`f(0) = 9`, so the `y`-intercept is 1/9.","A square is never negative: + on both sides."],"card":{"dom":"`{x ∈ ℝ | x ≠ -3}`","rng":"`(0, ∞)`","yint":"(0, 1/9)","inc":"`(-∞, -3)`","dec":"`(-3, ∞)`"}},{"id":"cf3","goal":[2,3,4,5],"eq":"`y = 1/(x^2 - 4x + 8)`","eqs":"`y = {1}/{x^2 - 4x + 8}`","a":1,"d":2,"c":4,"view":{"xmin":-3,"xmax":7,"ymin":-0.2,"ymax":0.5},"s1":{"choices":[{"t":"Two zeros","fb":"Complete the square: `x^2 - 4x + 8 = (x - 2)^2 + 4`, which is at least 4. It never reaches 0.","_n":"1q35e","_k":"118314d9"},{"t":"One zero","fb":"`(x - 2)^2` alone would touch the axis; the + 4 lifts the vertex to (2, 4).","_n":"1r3ae","_k":"2b95ac0a"},{"t":"No zeros","_n":"1s3be","_k":"727881cf"}],"hints":["Try to factor. If it won’t, complete the square.","`x^2 - 4x + 8 = (x - 2)^2 + 4`.","It’s at least 4, so it’s never 0: the case is no zeros."]},"s2":{"_a":"Pzk=","wrong":[{"set":[2],"fb":"`x = 2` is where the vertex is, but `f(2) = 4`, not 0."}],"hints":["Asymptotes are where `f(x) = 0`.","Set each factor equal to 0. Here `x^2 - 4x + 8 = (x - 2)^2 + 4` has no real factors.","None."]},"s3":{"_a":"P0ZIR2U=","wrong":[{"signs":["-"],"fb":"`f` is at least 4 everywhere, so `1/f` is positive everywhere."}],"hints":["Pick a test value in each interval.","`f(0) = 8`.","+ everywhere; `1/f` has the same sign."]},"s4":{"tp":[2,0.25],"tpLabel":"(2, 1/4) local max","options":[{"t":"Local maximum (2, 1/4)","why":"The parabola’s minimum (2, 4) becomes a local maximum at height 1/4.","_n":"1t38e","_k":"e2517e36"},{"t":"Local maximum (0, 1/8)","why":"(0, 1/8) is the `y`-intercept; the graph is still climbing there.","_n":"1u39e","_k":"6d8a6e19"},{"t":"Local minimum (2, 1/4)","why":"The parabola’s minimum turns into a maximum.","_n":"1v3ee","_k":"c79bc74a"},{"t":"Local maximum (2, 4)","why":"The height is the reciprocal of 4.","_n":"1w3fe","_k":"39bdac7c"}],"hints":["Find the vertex (`d`, `c`) of `f`.","The vertex is (2, 4), a minimum.","The turning point is a local maximum at (2, 1/4)."]},"s5":{"_a":"H0YQDFxRShJePz5JGlFXVBdGWT4aHxscRk9BOEU=","end":"`f` is positive, so `1/f` approaches 0 from above.","hints":["Use the signs from step 3 on each side of each asymptote.","Positive and tiny → +∞; negative and tiny → −∞.","There are no asymptotes. At both ends, `y → 0^{+}`."]},"s6":{"pieces":[{"a":0,"b":0.25,"aIn":false,"bIn":true}],"options":[{"t":"`[4, ∞)`","why":"That’s the range of the parabola.","_n":"1x3ce","_k":"687d4e3e"},{"t":"`(0, ∞)`","why":"The graph never gets higher than its local maximum, 1/4.","_n":"1y3be","_k":"9ac0948e"},{"t":"`(0, 1/4]`","why":"One piece above the axis, with its highest point at 1/4; it never reaches 0.","_n":"1z3ee","_k":"e0f2ca51"},{"t":"`[0, 1/4]`","why":"`1/f` is never 0.","_n":"203de","_k":"a1e300f0"}],"hints":["Where is the turning point, and which pieces are above or below the axis?","One piece, above the axis, with its highest point at 1/4.","Range: `(0, 1/4]`."]},"alg":["Half of −4 is −2, (−2)² = 4, and 8 − 4 = 4, so `x^2 - 4x + 8 = (x - 2)^2 + 4 >= 4`.","Vertex (2, 4), so the turning point is (2, 1/4).","`f(0) = 8`, so the `y`-intercept is 1/8."],"card":{"dom":"`{x ∈ ℝ}`","rng":"`(0, 1/4]`","yint":"(0, 1/8)","inc":"`(-∞, 2)`","dec":"`(2, ∞)`"}},{"id":"cf4","goal":[2,3,4,5],"eq":"`y = 1/(-x^2 + 2x + 3)`","eqs":"`y = {1}/{-x^2 + 2x + 3}`","a":-1,"d":1,"c":4,"view":{"xmin":-4,"xmax":6,"ymin":-1.5,"ymax":1.5},"s1":{"choices":[{"t":"Two zeros","_n":"2138e","_k":"477bd00e"},{"t":"One zero","fb":"One zero needs a perfect square, such as `-(x - 1)^2`. Here the factors `(x + 1)` and `(x - 3)` are different, so there are two zeros.","_n":"2237e","_k":"f26ae729"},{"t":"No zeros","fb":"A negative leading coefficient doesn’t mean no zeros. `-x^2 + 2x + 3 = -(x + 1)(x - 3)`: the vertex (1, 4) is above the axis and the parabola opens down, so it crosses twice.","_n":"233ae","_k":"2cecebfe"}],"hints":["Try to factor. Take out −1 first.","Taking out −1 leaves a trinomial that factors: `-x^2 + 2x + 3 = -(x + 1)(x - 3)`. Expand to check.","Two different factors, so two zeros."]},"s2":{"_a":"P0lSSQtp","wrong":[{"set":[-3,1],"fb":"`-(x + 1)(x - 3)` is 0 at `x = -1` and `x = 3`."},{"set":[1],"fb":"`x = 1` is the axis of symmetry."}],"hints":["Asymptotes are where `f(x) = 0`.","Set each factor equal to 0.","`x = -1` and `x = 3`."]},"s3":{"_a":"P0ZORxQWEhJIRk5HZQ==","wrong":[{"signs":["+","-","+"],"fb":"This parabola opens down, so it’s positive \u003cstrong>between\u003c/strong> its zeros: `f(0) = 3`. And `1/f` has the same sign as `f`, not the opposite one."}],"hints":["Pick a test value in each interval: −2, 0 and 4 work.","`f(-2) = -5`, `f(0) = 3`, `f(4) = -5`.","−, +, −, and `1/f` has the same signs."]},"s4":{"tp":[1,0.25],"tpLabel":"(1, 1/4) local min","options":[{"t":"Local maximum (1, 4)","why":"(1, 4) is the parabola’s vertex. Flip both the height and the type.","_n":"2439e","_k":"09543c15"},{"t":"Local minimum (1, 1/4)","why":"The parabola’s maximum (1, 4) becomes a local minimum at height 1/4.","_n":"2544e","_k":"f96e6e2f"},{"t":"Local minimum (1, 4)","why":"Right type, but the height is 1/4, the reciprocal of 4.","_n":"2643e","_k":"0219e2a0"},{"t":"Local maximum (1, 1/4)","why":"The parabola’s vertex is a \u003cstrong>maximum\u003c/strong> here (it opens down), so the reciprocal has a local minimum.","_n":"27c2e","_k":"24d60661"}],"hints":["Complete the square: `-x^2 + 2x + 3 = -(x - 1)^2 + 4`.","The vertex (1, 4) is a maximum, because the parabola opens down.","A maximum of 4 becomes a local minimum of 1/4: the turning point is (1, 1/4)."]},"s5":{"_a":"H0YQDFxRShJePzhHFRYVEk9GPkljFhISSEZOR2VpFRIBCgcWGg5iEklGT0cVFmRN","side":"Use the signs from step 3: left of −1, `f` is negative, so `1/f → -∞` there.","end":"Far out, `f` is large and negative, so `1/f → 0^{-}`.","hints":["Use the signs from step 3 on each side of each asymptote.","Positive and tiny → +∞; negative and tiny → −∞.","As `x → -1^{-}`, `y → -∞`; as `x → -1^{+}`, `y → +∞`; as `x → 3^{-}`, `y → +∞`; as `x → 3^{+}`, `y → -∞`; at both ends, `y → 0^{-}`."]},"s6":{"pieces":[{"a":null,"b":0,"bIn":false},{"a":0.25,"b":null,"aIn":true}],"options":[{"t":"`(-∞, 0) ∪ (0, ∞)`","why":"The middle piece never goes below its local minimum, 1/4. Values between 0 and 1/4 are never reached.","_n":"28c3e","_k":"1666fd6f"},{"t":"`(-∞, 4]`","why":"That’s the range of the parabola.","_n":"29c4e","_k":"c123761d"},{"t":"`(-∞, 0) ∪ [1/4, ∞)`","why":"The outer pieces take every negative value; the middle piece starts at 1/4 and rises without bound.","_n":"2ac5e","_k":"afff4aa3"},{"t":"`(-∞, 0) ∪ (0, 1/4]`","why":"1/4 is the \u003cstrong>bottom\u003c/strong> of the middle piece, not its top.","_n":"2bc6e","_k":"4577cbd4"}],"hints":["Which pieces are above the axis, and how low does the middle one go?","The outer pieces are below the axis and take every negative value. The middle piece is above, with its lowest point at 1/4.","Range: `(-∞, 0) ∪ [1/4, ∞)`."]},"alg":["`-x^2 + 2x + 3 = -(x + 1)(x - 3) = -(x - 1)^2 + 4`.","Vertex (1, 4) is a maximum.","`f(0) = 3`, so the `y`-intercept is 1/3.","Signs: test −2, 0, 4 → −5, 3, −5."],"card":{"dom":"`{x ∈ ℝ | x ≠ -1, 3}`","rng":"`(-∞, 0) ∪ [1/4, ∞)`","yint":"(0, 1/3)","inc":"`(1, 3) ∪ (3, ∞)`","dec":"`(-∞, -1) ∪ (-1, 1)`"}}],"blocks":[{"title":"What the routine means","html":"\u003cp>\u003cstrong>Sketching `y = 1/f(x)` when `f` is a quadratic\u003c/strong>\u003c/p>\u003col>\u003cli>Factor or complete the square to find the case: two zeros, one or none.\u003c/li>\u003cli>Zeros of `f` → vertical asymptotes. `y = 0` is always the horizontal asymptote, and the graph never touches it.\u003c/li>\u003cli>Signs of `f` → signs of `1/f` (the same).\u003c/li>\u003cli>Vertex (`d`, `c`) of `f` → turning point (`d`, 1/`c`) of `1/f`, with minimum ↔ maximum. No turning point if `c = 0`.\u003c/li>\u003cli>Near each asymptote, follow the sign on that side: positive → +∞, negative → −∞.\u003c/li>\u003cli>Range: read it off the pieces, remembering the turning point’s height and that 0 is never reached.\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Three cases","summary":"Three cases quick check","items":[{"id":"q1","goal":2,"prompt":"How many vertical asymptotes does `y = 1/(x^2 + 9)` have?","choices":[{"t":"0","fb":"Right. `x^2 + 9 >= 9`, so it’s never 0.","_n":"2cc7e","_k":"0d2db42f"},{"t":"1","fb":"There’s no double zero either: `x^2 + 9` is never 0.","_n":"2dc8e","_k":"98c793b0"},{"t":"2","fb":"`x^2 + 9` doesn’t factor; `(x + 3)(x - 3)` is `x^2 - 9`.","_n":"2ec9e","_k":"353bd360"}]},{"id":"q2","goal":2,"prompt":"What does `y = 1/(x^2 - 10x + 25)` have at `x = 5`?","choices":[{"t":"Local maximum","fb":"The vertex is (5, 0), on the `x`-axis. 1/0 has no value, so there’s no turning point: there’s an asymptote.","_n":"2fbae","_k":"4b4f66e0"},{"t":"Local minimum","fb":"The vertex is (5, 0), on the `x`-axis. 1/0 has no value, so there’s no turning point: there’s an asymptote.","_n":"2gbbe","_k":"c126a842"},{"t":"Vertical asymptote","fb":"Right. `x^2 - 10x + 25 = (x - 5)^2`, so the vertex (5, 0) is on the axis and becomes the asymptote.","_n":"2hc8e","_k":"d4bd2697"}]},{"id":"q3","goal":3,"prompt":"What does `y = 1/(x^2 - 6x + 5)` have at `x = 3`?","choices":[{"t":"Local max (3, −1/4)","fb":"Right. `f(3) = 9 - 18 + 5 = -4`, a minimum of the parabola, so the reciprocal has a local maximum of −1/4.","_n":"2ic7e","_k":"421a1581"},{"t":"Vertical asymptote","fb":"`f(3) = -4`, not 0. The asymptotes are at `x = 1` and `x = 5`.","_n":"2jc6e","_k":"eb60eb0c"},{"t":"Local min (3, −1/4)","fb":"The parabola’s minimum becomes a maximum.","_n":"2kc5e","_k":"6ca3fd1a"},{"t":"Local min (3, −4)","fb":"That’s the parabola’s vertex unchanged.","_n":"2lcce","_k":"d5592dd3"}]},{"id":"q4","goal":4,"prompt":"For `y = 1/(4 - x^2)`, as `x → 2^{-}`, `y` → ?","choices":[{"t":"+∞","fb":"Right. Just left of 2 (say 1.9), `4 - x^2 = 0.39` is small and positive, so its reciprocal is large and positive.","_n":"2mcbe","_k":"f42f0910"},{"t":"−∞","fb":"Test `x = 1.9`: 4 − 3.61 = 0.39, which is positive.","_n":"2ncae","_k":"f5c85b4f"},{"t":"0","fb":"`4 - x^2` is approaching 0, so its reciprocal grows without bound.","_n":"2oc9e","_k":"8c509202"}]}]}},"practice":{"activities":[{"id":"match","type":"custom","title":"Match the graph","summary":"Match the graph","goal":[2,3,4,5],"instruction":"Match each equation to its graph.","how":"Tap an equation, then tap its graph.","view":{"xmin":-6,"xmax":6,"ymin":-1.5,"ymax":1.5},"left":[{"id":"l1","n":1,"t":"`y = {1}/{x^2 - 4}`","hints":["Find the zeros of the denominator: they give the vertical asymptotes.","Now decide the sign of the denominator between and outside the zeros, or its vertex and whether it opens up or down.","`x^2 - 4 = (x - 2)(x + 2)`: asymptotes `x = -2` and `x = 2`. Between them the denominator is negative with minimum −4, so the middle piece is below the axis with a local maximum at (0, −1/4); the outer pieces are above. That’s graph C."]},{"id":"l2","n":2,"t":"`y = {1}/{4 - x^2}`","hints":["Find the zeros of `4 - x^2`.","`4 - x^2 = (2 - x)(2 + x)`: asymptotes at `x = ±2`. It opens down, with vertex (0, 4).","Between ±2 the denominator is positive with maximum 4, so the middle piece is above the axis with a local minimum at (0, 1/4); the outer pieces are below. That’s graph F."]},{"id":"l3","n":3,"t":"`y = {1}/{x^2 + 4}`","hints":["Find the zeros of the denominator: they give the vertical asymptotes.","Now decide the sign of the denominator between and outside the zeros, or its vertex and whether it opens up or down.","`x^2 + 4` has no zeros, so there are no asymptotes. Its minimum, 4 at `x = 0`, gives one hump above the axis with a local maximum at (0, 1/4). That’s graph A."]},{"id":"l4","n":4,"t":"`y = {1}/{-x^2 - 4}`","hints":["Find the zeros of the denominator: they give the vertical asymptotes.","Now decide the sign of the denominator between and outside the zeros, or its vertex and whether it opens up or down.","`-x^2 - 4` has no zeros and is always negative, with maximum −4 at `x = 0`. So there are no asymptotes, and one dip below the axis with a local minimum at (0, −1/4). That’s graph H."]},{"id":"l5","n":5,"t":"`y = {1}/{x^2 - 4x + 4}`","hints":["Find the zeros of the denominator: they give the vertical asymptotes.","Now decide the sign of the denominator between and outside the zeros, or its vertex and whether it opens up or down.","`x^2 - 4x + 4 = (x - 2)^2`: one asymptote at `x = 2`, no turning point, and both pieces above the axis, rising toward it. That’s graph E."]},{"id":"l6","n":6,"t":"`y = {1}/{x^2 + 4x + 4}`","hints":["Find the zeros of the denominator: they give the vertical asymptotes.","Now decide the sign of the denominator between and outside the zeros, or its vertex and whether it opens up or down.","`x^2 + 4x + 4 = (x + 2)^2`: one asymptote at `x = -2`, no turning point, and both pieces above the axis, rising toward it. That’s graph B."]},{"id":"l7","n":7,"t":"`y = {1}/{-x^2 + 4x - 4}`","hints":["Take out −1 from the denominator and look for a perfect square.","`-x^2 + 4x - 4 = -(x - 2)^2`: a double zero at `x = 2`, and the denominator is never positive.","One asymptote at `x = 2`, with both pieces below the axis: graph G."]},{"id":"l8","n":8,"t":"`y = {1}/{x^2 + 4x}`","hints":["Find the zeros of the denominator: they give the vertical asymptotes.","Now decide the sign of the denominator between and outside the zeros, or its vertex and whether it opens up or down.","`x^2 + 4x = x(x + 4)`: asymptotes `x = -4` and `x = 0`. The vertex (−2, −4) gives a middle piece below the axis with a local maximum at (−2, −1/4); the outer pieces are above. That’s graph D."]}],"graphs":[{"id":"A","a":1,"d":0,"c":4,"desc":"No asymptotes. One hump above the axis, with a local maximum at (0, 1/4)."},{"id":"B","a":1,"d":-2,"c":0,"desc":"One asymptote, `x = -2`. Both pieces above the axis, rising toward it."},{"id":"C","a":1,"d":0,"c":-4,"desc":"Asymptotes `x = -2` and `x = 2`. Outer pieces above the axis; middle piece below, with a local maximum at (0, −1/4)."},{"id":"D","a":1,"d":-2,"c":-4,"desc":"Asymptotes `x = -4` and `x = 0`. Outer pieces above the axis; middle piece below, with a local maximum at (−2, −1/4)."},{"id":"E","a":1,"d":2,"c":0,"desc":"One asymptote, `x = 2`. Both pieces above the axis, rising toward it."},{"id":"F","a":-1,"d":0,"c":4,"desc":"Asymptotes `x = -2` and `x = 2`. Outer pieces below the axis; middle piece above, with a local minimum at (0, 1/4)."},{"id":"G","a":-1,"d":2,"c":0,"desc":"One asymptote, `x = 2`. Both pieces below the axis, falling toward it."},{"id":"H","a":-1,"d":0,"c":-4,"desc":"No asymptotes. One dip below the axis, with a local minimum at (0, −1/4)."}],"_a":"H0YPVBoOG3NGSEEJChYDEiJGT0dUBxsKRiVBSRpYDRJeRitHFBZVBUZeQSAaGBtcUkZZR3oWFRIIU0FfGnMbHEYIW0cCFn0SGQ==","wrong":{"l1|F":"Check the sign between the asymptotes: at `x = 0`, `x^2 - 4 = -4` (negative) but `4 - x^2 = 4` (positive). The reciprocal has the same sign.","l2|C":"Check the sign between the asymptotes: at `x = 0`, `x^2 - 4 = -4` (negative) but `4 - x^2 = 4` (positive). The reciprocal has the same sign.","l1|A":"`x^2 - 4` has zeros at ±2, so its reciprocal has asymptotes. `x^2 + 4` is never 0, so its reciprocal has none.","l3|C":"`x^2 - 4` has zeros at ±2, so its reciprocal has asymptotes. `x^2 + 4` is never 0, so its reciprocal has none.","l3|H":"`x^2 + 4` is positive everywhere, so its reciprocal is above the axis; `-x^2 - 4` is negative everywhere.","l4|A":"`x^2 + 4` is positive everywhere, so its reciprocal is above the axis; `-x^2 - 4` is negative everywhere.","l5|C":"A double zero gives one asymptote, not two.","l5|D":"A double zero gives one asymptote, not two.","l5|F":"A double zero gives one asymptote, not two.","l6|C":"A double zero gives one asymptote, not two.","l6|D":"A double zero gives one asymptote, not two.","l6|F":"A double zero gives one asymptote, not two.","l7|C":"A double zero gives one asymptote, not two.","l7|D":"A double zero gives one asymptote, not two.","l7|F":"A double zero gives one asymptote, not two.","l5|B":"`x^2 - 4x + 4 = (x - 2)^2`, which is 0 at `x = 2`; `x^2 + 4x + 4 = (x + 2)^2`, which is 0 at `x = -2`.","l6|E":"`x^2 - 4x + 4 = (x - 2)^2`, which is 0 at `x = 2`; `x^2 + 4x + 4 = (x + 2)^2`, which is 0 at `x = -2`.","l5|G":"`(x - 2)^2` is never negative, so both pieces of its reciprocal are above the axis. `-(x - 2)^2` is never positive.","l7|E":"`(x - 2)^2` is never negative, so both pieces of its reciprocal are above the axis. `-(x - 2)^2` is never positive.","l8|C":"`x^2 + 4x = x(x + 4)`, so the asymptotes are `x = -4` and `x = 0`, not ±2."},"wrongDefault":"Compare the asymptotes first, then which side of the axis each piece is on.","tail":"Try another graph.","ui":{"eqs":"Equations","graphs":"Graphs","graph":"Graph","pick":"Tap an equation first, then tap its graph.","sel":"Selected","done":"All matched! You got {f} of {n} right on the first try, without the worked solution."}},{"id":"wb","type":"custom","title":"Work backwards","summary":"Work backwards","star":true,"goal":[6,3,5],"instruction":"Each graph’s features are given. Fill in the boxes to make its equation.","how":"Type a number in each box (fractions like −1/2 are fine), then press Check.","generic":"This box doesn’t fit the features yet. Check it against each feature in turn.","tail":"Fix that box and press Check again.","empty":"Type a number in every box first.","azero":"`a` can’t be 0: then there’s no quadratic at all.","ui":{"item":"Graph {n} of 6","check":"Check","prev":"Previous","next":"Next graph","features":"Features"},"items":[{"id":"wb1","goal":[6,2],"tpl":"roots","features":"Vertical asymptotes `x = 1` and `x = 5`; `y`-intercept (0, 1/5)","view":{"xmin":-2,"xmax":8,"ymin":-1,"ymax":1},"asym":[1,5],"pts":[[0,0.2,"(0, 1/5)"]],"_a":"H0YCRwIFFRIWRlk+CRgMbRk=","wrong":[{"box":"a","v":0.04,"fb":"You made `f(0)` equal 1/5. The graph’s `y`-intercept is `1/f(0)`, so `f(0) = 5`."},{"box":"a","v":-1,"fb":"(0 − 1)(0 − 5) = (−1)(−5) = +5, so `5a = 5`."},{"box":"r","v":[-1,-5],"fb":"`x - r` is 0 at `x = r`: the asymptote `x = 1` needs `(x - 1)`."}],"hints":["Asymptotes at 1 and 5 mean factors `(x - 1)` and `(x - 5)`.","`f(0) = a(-1)(-5) = 5a`, and the `y`-intercept 1/5 means `f(0) = 5`.","`5a = 5`, so `a = 1`: `y = 1/((x - 1)(x - 5))`."]},{"id":"wb2","goal":[6,2],"tpl":"double","features":"One vertical asymptote, `x = -3`; passes through (−1, 1/8)","view":{"xmin":-7,"xmax":1,"ymin":-0.5,"ymax":1},"asym":[-3],"pts":[[-1,0.125,"(−1, 1/8)"]],"_a":"H0YCRwIGFRIARllIC0k=","wrong":[{"box":"a","v":0.03125,"fb":"`4a = 1/8` uses the graph’s height as `f`’s. `f(-1)` is the reciprocal: 8."},{"box":"a","v":4,"fb":"(−1 + 3)² = 4, not 2. Square it: `4a = 8`."},{"box":"d","v":3,"fb":"The bracket must be 0 at `x = -3`, so `d = -3`."}],"hints":["One asymptote means a double zero: `f(x) = a(x + 3)^2`.","The point (−1, 1/8) means `f(-1) = 8`.","`a(-1 + 3)^2 = 4a = 8`, so `a = 2`: `y = 1/(2(x + 3)^2)`."]},{"id":"wb3","goal":[6,3],"tpl":"vertex","features":"No vertical asymptotes; local maximum (2, 1/5); passes through (0, 1/9)","view":{"xmin":-3,"xmax":7,"ymin":-0.1,"ymax":0.3},"asym":[],"pts":[[2,0.2,"(2, 1/5) local max"],[0,0.1111111111111111,"(0, 1/9)"]],"_a":"H0YCRwIFFRIARllXFBZaEl5RHg==","wrong":[{"box":"c","v":0.2,"fb":"The turning point’s height is 1/`c`, so `c = 5`."},{"box":"a","v":2.25,"fb":"`f(0) = 4a + c`: don’t drop the `c`. `4a + 5 = 9`."},{"box":"a","neg":true,"fb":"A local maximum of `1/f` comes from a minimum of `f`, so `a > 0`. (With `a \u003c 0` and `c = 5`, the parabola would cross the axis twice and the graph would have asymptotes.)"}],"hints":["The turning point (2, 1/5) comes from the vertex: `d = 2` and `c = 5`.","The point (0, 1/9) means `f(0) = 9`.","`a(0 - 2)^2 + 5 = 4a + 5 = 9`, so `a = 1`: `y = 1/((x - 2)^2 + 5)`."]},{"id":"wb4","goal":[6,3],"tpl":"vertex","features":"Local minimum (2, 1/3); vertical asymptotes `x = -1` and `x = 5`","view":{"xmin":-3,"xmax":7,"ymin":-1.5,"ymax":1.5},"asym":[-1,5],"pts":[[2,0.3333333333333333,"(2, 1/3) local min"]],"_a":"H0YCRwIZCR5XV1BWCwcKA1dXUFYLBwoDSEYHRwIGFRIHRllWRQ==","wrong":[{"box":"a","v":0.3333333333333333,"fb":"A local minimum of `1/f` comes from a maximum of `f`, so `a \u003c 0`."},{"box":"a","v":-1,"fb":"`f(5) = a(5 - 2)^2 + 3 = 9a + 3`. Square the 3."},{"box":"c","v":0.3333333333333333,"fb":"The height of the turning point is 1/`c`, so `c = 3`."}],"hints":["The turning point gives `d = 2` and `c = 3`, and a local minimum needs `a \u003c 0`.","The asymptote `x = 5` means `f(5) = 0`.","`a(5 - 2)^2 + 3 = 9a + 3 = 0`, so `a = -1/3`: `y = 1/(-{1}/{3}(x - 2)^2 + 3)`."]},{"id":"wb5","goal":[6,5],"tpl":"vertex","features":"Range `(-∞, -1/2] ∪ (0, ∞)`; vertical asymptotes `x = -1` and `x = 3`","view":{"xmin":-4,"xmax":6,"ymin":-1.5,"ymax":1.5},"asym":[-1,3],"pts":[],"range":[{"a":null,"b":-0.5,"bIn":true},{"a":0,"b":null,"aIn":false}],"_a":"H0YCRwIEFwVIRgdHAgUVEgdGWUgKSQ==","wrong":[{"box":"c","v":-0.5,"fb":"The range’s −1/2 is the turning point’s height, which is 1/`c`, so `c = -2`."},{"box":"a","v":1,"fb":"`f(3) = a(3 - 1)^2 - 2 = 4a - 2`. Square the 2."},{"box":"d","v":2,"fb":"The asymptotes are 4 apart, but the axis is halfway between them: `d = 1`."},{"box":"a","v":-0.5,"fb":"A range topping out at −1/2 means a local maximum, so the parabola opens up: `a > 0`."}],"hints":["The axis of symmetry is halfway between the asymptotes: `d = 1`. The range tops out at −1/2, so that’s a local maximum.","A local maximum at height −1/2 means `c = -2` and `a > 0`. The asymptote `x = 3` means `f(3) = 0`.","`a(3 - 1)^2 - 2 = 4a - 2 = 0`, so `a = 1/2`: `y = 1/({1}/{2}(x - 1)^2 - 2)`."]},{"id":"wb6","goal":[6,5],"tpl":"vertex","features":"Range `[-1/2, 0)`; passes through (−3, −1/6) and (1, −1/6)","view":{"xmin":-5,"xmax":3,"ymin":-0.8,"ymax":0.2},"asym":[],"pts":[[-3,-0.16666666666666666,"(−3, −1/6)"],[1,-0.16666666666666666,"(1, −1/6)"]],"range":[{"a":-0.5,"b":0,"aIn":true,"bIn":false}],"_a":"H0YCRwIZCBxGAEFfFQUVEgdGWUgKSQ==","wrong":[{"box":"c","v":-0.5,"fb":"The range starts at the turning point’s height, 1/`c` = −1/2, so `c = -2`."},{"box":"d","v":1,"fb":"Two points at the same height sit symmetrically about the axis: halfway between −3 and 1 is −1."},{"box":"a","v":1,"fb":"With `a > 0` and `c \u003c 0` the parabola crosses the axis, so the graph would have asymptotes. A range of `[-1/2, 0)` means it stays below the axis: `a \u003c 0`."},{"box":"a","v":0.4583333333333333,"fb":"You used −1/6 as `f(1)`. The graph’s height is −1/6, so `f(1) = -6`."}],"hints":["The two points have the same height, so the axis is halfway between `x = -3` and `x = 1`: `d = -1`.","The range `[-1/2, 0)` is all below the axis and starts at −1/2: a local minimum at height −1/2, so `c = -2`, and no asymptotes, so `a \u003c 0`.","The point (1, −1/6) means `f(1) = -6`: `a(1 + 1)^2 - 2 = 4a - 2 = -6`, so `a = -1`: `y = 1/(-(x + 1)^2 - 2)`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Leila","how":"","goal":[2,3,4],"instruction":"Leila made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the vertical asymptotes and the domain of `y = 1/(x^2 + 16)`.","steps":["The vertical asymptotes come from the zeros of the denominator, `x^2 + 16`.","`x^2 + 16 = (x + 4)(x - 4)`.","So `x^2 + 16 = 0` at `x = -4` and `x = 4`.","The vertical asymptotes are `x = -4` and `x = 4`.","Domain: `{x ∈ ℝ | x ≠ -4, 4}`."],"_a":"VQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 follows from step 2. The mistake is earlier.","Step 4 follows from step 2. The mistake is earlier.","Step 5 follows from step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct as written.","why":"`(x + 4)(x - 4) = x^2 - 16`, a \u003cstrong>difference\u003c/strong> of squares. `x^2 + 16` is a sum.","_n":"2pc0e","_k":"b7ffc0a4"},{"t":"`x^2 + 16 = (x + 4)^2`, so the only asymptote is `x = -4`.","why":"`(x + 4)^2 = x^2 + 8x + 16`. Expand to check.","_n":"2qbfe","_k":"026e76ec"},{"t":"`x^2 + 16 = (x + 16)(x - 16)`, so the asymptotes are `x = ±16`.","why":"`(x + 16)(x - 16) = x^2 - 256`.","_n":"2rb3d","_k":"5f19d785"},{"t":"`x^2 + 16` doesn’t factor. Since `x^2 >= 0`, `x^2 + 16 >= 16`, so it’s never 0: no vertical asymptotes, and the domain is `{x ∈ ℝ}`.","why":"A sum of squares is never 0, so there’s nothing to divide by zero.","_n":"2sb2d","_k":"bb3580be"}],"hints":["Expand step 2’s factors and compare with `x^2 + 16`.","`(x + 4)(x - 4) = x^2 - 16`. Can `x^2 + 16` ever be 0?","Step 2 is wrong. `x^2 + 16 >= 16`, so there are no zeros, no vertical asymptotes, and the domain is `{x ∈ ℝ}`."]},{"id":"e2","goal":3,"task":"Find the turning point and the range of `y = 1/(x^2 - 8x + 12)`.","steps":["`x^2 - 8x + 12 = (x - 2)(x - 6)`, so the vertical asymptotes are `x = 2` and `x = 6`.","The vertex is halfway between the zeros, at `x = 4`, and `f(4) = 16 - 32 + 12 = -4`.","The parabola has a minimum at (4, −4), so the reciprocal also has a minimum there, at (4, −1/4).","So on the middle piece, between `x = 2` and `x = 6`, the reciprocal’s values are −1/4 or more.","Range: `[-1/4, 0) ∪ (0, ∞)`."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: the vertex is (4, −4).","","Step 4 follows from step 3. The mistake is earlier.","Step 5 follows from step 3. The mistake is earlier."],"fixes":[{"t":"The reciprocal has a local maximum at (4, −4).","why":"The type is fixed, but the height still has to be the reciprocal of −4.","_n":"2tb5d","_k":"a6258155"},{"t":"A minimum of `f` becomes a local \u003cstrong>maximum\u003c/strong> of `1/f`. The reciprocal has a local maximum at (4, −1/4), so its range is `(-∞, -1/4] ∪ (0, ∞)`.","why":"On the middle piece, `f` is between −4 and 0, so `1/f` is −1/4 or \u003cstrong>less\u003c/strong>.","_n":"2ub4d","_k":"ad61807e"},{"t":"Step 3 is correct as written.","why":"Test `x = 3`: `f(3) = -3`, and 1/(−3) = −1/3, which is \u003cstrong>below\u003c/strong> −1/4. So −1/4 is the top of the middle piece.","_n":"2vb7d","_k":"db21fb1d"},{"t":"The reciprocal has a local minimum at (4, −4).","why":"That keeps the parabola’s vertex unchanged. The height must be flipped to −1/4.","_n":"2wb6d","_k":"13ddb7f1"}],"hints":["Test a value near the vertex, such as `x = 3`. Is `1/f(3)` above or below −1/4?","`f(3) = 9 - 24 + 12 = -3`, so `1/f(3) = -1/3 \u003c -1/4`. The reciprocal is lower beside the vertex.","Step 3 is wrong: the minimum of `f` becomes a local maximum of `1/f`, at (4, −1/4). The range is `(-∞, -1/4] ∪ (0, ∞)`."]},{"id":"e3","goal":4,"task":"Find where `y = 1/(x^2 - 9)` is increasing and where it is decreasing.","steps":["`x^2 - 9 = (x + 3)(x - 3)`, so the vertical asymptotes are `x = -3` and `x = 3`.","The parabola `y = x^2 - 9` decreases on `(-∞, 0)` and increases on `(0, ∞)`.","So the reciprocal also decreases on `(-∞, 0)` and increases on `(0, ∞)`, except at the asymptotes.","Answer: decreasing on `(-∞, -3) ∪ (-3, 0)`; increasing on `(0, 3) ∪ (3, ∞)`."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: its vertex is (0, −9), a minimum.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Where `f` decreases, `1/f` increases, and the other way round. So the reciprocal is increasing on `(-∞, -3) ∪ (-3, 0)` and decreasing on `(0, 3) ∪ (3, ∞)`.","why":"Bigger values of `f` (with the same sign) give smaller reciprocals, so the directions swap.","_n":"2xb9d","_k":"0b0e1ada"},{"t":"The reciprocal is increasing on `(-∞, 0)` and decreasing on `(0, ∞)`.","why":"The directions are right, but `1/f` isn’t defined at `x = ±3`. The asymptotes must split the intervals.","_n":"2yb8d","_k":"ecbd02b1"},{"t":"Step 3 is correct as written.","why":"Test `x = -5` and `x = -4`: `f` goes down from 16 to 7, but `1/f` goes \u003cstrong>up\u003c/strong> from 1/16 to 1/7.","_n":"2zabd","_k":"cb4fdae9"},{"t":"The reciprocal decreases everywhere, because `1/x` is decreasing.","why":"Test `x = -5` and `x = -4`: `f` = 16 and 7, so `1/f` goes from 1/16 up to 1/7. It’s increasing there.","_n":"30aad","_k":"2501d75b"}],"hints":["Compare the parabola and its reciprocal at two nearby points, such as `x = -5` and `x = -4`.","`f(-5) = 16` and `f(-4) = 7`: `f` is decreasing. What do 1/16 and 1/7 do?","Step 3 is wrong: `1/f` moves the opposite way to `f`. Increasing on `(-∞, -3) ∪ (-3, 0)`; decreasing on `(0, 3) ∪ (3, ∞)`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you plotted reciprocal points by hand, or when you slid the parabola through the three cases?"},{"id":"j2","q":"In your own words, why does a zero of the quadratic become a vertical asymptote, and why does its vertex become a turning point of the opposite type?"},{"id":"j3","q":"Explain to a friend, step by step, how to sketch `y = 1/(x^2 - 2x - 8)` without technology."},{"id":"j4","q":"Which feature of these graphs is still tricky for you (signs near an asymptote, the range, increasing intervals, …)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"What are the vertical asymptotes of `y = 1/(x^2 - x - 6)`?","options":[{"t":"`x = 2` and `x = -3`","why":"Those make `x - 2` and `x + 3` zero. The factors are `(x + 2)(x - 3)`, so the zeros have the opposite signs: −2 and 3.","_n":"312dc","_k":"cc89fa1f"},{"t":"`x = 1/2` only","why":"`x = 1/2` is the axis of symmetry, where the turning point is. Asymptotes come from zeros.","_n":"322ec","_k":"f38588bd"},{"t":"`x = -2` and `x = 3`","why":"`x^2 - x - 6 = (x + 2)(x - 3)`, which is 0 at `x = -2` and `x = 3`.","_n":"332bc","_k":"062bdf48"},{"t":"`x = -1` and `x = 6`","why":"`(x + 1)(x - 6) = x^2 - 5x - 6`. The product is right, but the middle term isn’t.","_n":"342cc","_k":"e713bc9d"}]},"b":{"prompt":"What are the vertical asymptotes of `y = 1/(x^2 + 2x - 8)`?","options":[{"t":"`x = -4` and `x = 2`","why":"`x^2 + 2x - 8 = (x + 4)(x - 2)`, which is 0 at `x = -4` and `x = 2`.","_n":"3529c","_k":"c6107f69"},{"t":"`x = 4` and `x = -2`","why":"The zeros have the opposite signs to the numbers in the brackets: −4 and 2.","_n":"362ac","_k":"8f8ba3fd"},{"t":"`x = -8` and `x = 1`","why":"`(x + 8)(x - 1) = x^2 + 7x - 8`. The product is right, but the middle term isn’t.","_n":"3727c","_k":"1d26cf9a"},{"t":"`x = -1` only","why":"`x = -1` is the axis of symmetry, where the turning point is. Asymptotes come from zeros.","_n":"3828c","_k":"7bf99b9e"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Where is the local maximum of `y = 1/(x^2 + 6x + 13)`?","options":[{"t":"(−3, 4)","why":"(−3, 4) is the parabola’s vertex. The reciprocal’s height there is 1/4.","_n":"3935c","_k":"2b46dbad"},{"t":"(0, 1/13)","why":"(0, 1/13) is the `y`-intercept. The turning point is at the vertex’s `x`-value, −3.","_n":"3a36d","_k":"79acc42b"},{"t":"(3, 1/4)","why":"`(x + 3)^2` is smallest at `x = -3`, not 3.","_n":"3b27c","_k":"30c515eb"},{"t":"(−3, 1/4)","why":"`x^2 + 6x + 13 = (x + 3)^2 + 4`. Its minimum, 4 at `x = -3`, becomes the reciprocal’s maximum, 1/4.","_n":"3c26c","_k":"b4c2b204"}]},"b":{"prompt":"Where is the local maximum of `y = 1/(x^2 - 8x + 18)`?","options":[{"t":"(0, 1/18)","why":"(0, 1/18) is the `y`-intercept. The turning point is at the vertex’s `x`-value, 4.","_n":"3d25c","_k":"63747127"},{"t":"(−4, 1/2)","why":"`(x - 4)^2` is smallest at `x = 4`, not −4.","_n":"3e24c","_k":"f4e4428b"},{"t":"(4, 1/2)","why":"`x^2 - 8x + 18 = (x - 4)^2 + 2`. Its minimum, 2 at `x = 4`, becomes the reciprocal’s maximum, 1/2.","_n":"3f2bc","_k":"30ec4815"},{"t":"(4, 2)","why":"(4, 2) is the parabola’s vertex. The reciprocal’s height there is 1/2.","_n":"3g2ac","_k":"0a53f9e0"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"The point (3, 4) is on the graph of `y = f(x)`. Which point must be on the graph of `y = 1/f(x)`?","options":[{"t":"(3, −4)","why":"`1/f` keeps the sign. The reciprocal of 4 is 1/4, not −4.","_n":"3h29c","_k":"c30f3247"},{"t":"(1/3, 4)","why":"The reciprocal changes the height, not the `x`-value.","_n":"3i28c","_k":"c63dd4b3"},{"t":"(3, 1/4)","why":"Same `x`; the height 4 becomes 1/4.","_n":"3j2fc","_k":"115f9aad"},{"t":"(4, 3)","why":"Swapping the coordinates gives the inverse `f^{-1}`, not the reciprocal `1/f`.","_n":"3k2ec","_k":"91d14910"}]},"b":{"prompt":"The point (−2, −5) is on the graph of `y = f(x)`. Which point must be on the graph of `y = 1/f(x)`?","options":[{"t":"(−2, 1/5)","why":"`1/f` keeps the sign: the reciprocal of −5 is −1/5.","_n":"3l21c","_k":"388ca583"},{"t":"(−2, −1/5)","why":"Same `x`; the height −5 becomes −1/5, keeping its sign.","_n":"3m22c","_k":"76ca1e1e"},{"t":"(−5, −2)","why":"Swapping the coordinates gives the inverse `f^{-1}`, not the reciprocal `1/f`.","_n":"3n23c","_k":"c1172b03"},{"t":"(−1/2, −5)","why":"The reciprocal changes the height, not the `x`-value.","_n":"3o24c","_k":"3c662bed"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"On which intervals is `y = 1/(x^2 + 6x)` increasing?","options":[{"t":"`(-∞, -6) ∪ (-6, -3)`","why":"`x^2 + 6x = x(x + 6)` has its vertex at `x = -3` and decreases on `(-∞, -3)`. Where `f` decreases, `1/f` increases, and the asymptote `x = -6` splits the interval.","_n":"3p25c","_k":"2e4c94a8"},{"t":"`(-∞, -6) ∪ (0, ∞)`","why":"That’s where the reciprocal is positive, not where it’s increasing.","_n":"3q26c","_k":"dae2b541"},{"t":"`(-3, 0) ∪ (0, ∞)`","why":"That’s where the parabola increases. The reciprocal moves the opposite way.","_n":"3r27c","_k":"64333a3b"},{"t":"`(-∞, -3)`","why":"`x = -6` is a vertical asymptote: `1/f` isn’t defined there, so the interval must be split at −6.","_n":"3s28c","_k":"071f1135"}]},"b":{"prompt":"On which intervals is `y = 1/(x^2 + 4x - 5)` decreasing?","options":[{"t":"`(-2, 1) ∪ (1, ∞)`","why":"`x^2 + 4x - 5 = (x + 5)(x - 1)` has its vertex at `x = -2` and increases on `(-2, ∞)`. Where `f` increases, `1/f` decreases, and the asymptote `x = 1` splits the interval.","_n":"3t29c","_k":"f1f43da0"},{"t":"`(-∞, -5) ∪ (1, ∞)`","why":"That’s where the reciprocal is positive, not where it’s decreasing.","_n":"3u2ac","_k":"e0669bee"},{"t":"`(-∞, -5) ∪ (-5, -2)`","why":"That’s where the parabola decreases. The reciprocal moves the opposite way.","_n":"3v2bd","_k":"f542f643"},{"t":"`(-2, ∞)`","why":"`x = 1` is a vertical asymptote, so the interval must be split at 1.","_n":"3w2ad","_k":"a9c203ed"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"The graph of `y = 1/f(x)`, where `f` is a quadratic, has two vertical asymptotes and a local minimum at (2, 1/4). Which could be `f(x)`?","options":[{"t":"`f(x) = -(x + 2)^2 + 4`","why":"The turning point is at `x = 2`, so the vertex is at `x = 2`: `(x - 2)^2`.","_n":"3x2dd","_k":"5720e07b"},{"t":"`f(x) = (x - 2)^2 + 4`","why":"This parabola opens up, so the reciprocal has a local \u003cstrong>maximum\u003c/strong> at (2, 1/4). It also has no zeros, so no asymptotes.","_n":"3y2cd","_k":"deffe411"},{"t":"`f(x) = -(x - 2)^2 + 4`","why":"The turning point (2, 1/4) comes from the vertex (2, 4). A local minimum of `1/f` comes from a maximum of `f`, so the parabola opens down; with its vertex above the axis, it has two zeros.","_n":"3z27d","_k":"7debba75"},{"t":"`f(x) = -(x - 2)^2 + 1/4`","why":"This gives a local minimum at (2, 4). The vertex height of `f` must be the reciprocal of 1/4, which is 4.","_n":"4026d","_k":"590c7e50"}]},"b":{"prompt":"The graph of `y = 1/f(x)`, where `f` is a quadratic, has two vertical asymptotes and a local maximum at (−1, −1/3). Which could be `f(x)`?","options":[{"t":"`f(x) = (x - 1)^2 - 3`","why":"The turning point is at `x = -1`, so the vertex is at `x = -1`: `(x + 1)^2`.","_n":"4129d","_k":"934c40a2"},{"t":"`f(x) = (x + 1)^2 - 1/3`","why":"This gives a local maximum at (−1, −3). The vertex height of `f` must be the reciprocal of −1/3, which is −3.","_n":"4228d","_k":"9a60afc4"},{"t":"`f(x) = (x + 1)^2 - 3`","why":"The turning point (−1, −1/3) comes from the vertex (−1, −3). A local maximum of `1/f` comes from a minimum of `f`, so the parabola opens up; with its vertex below the axis, it has two zeros.","_n":"4333d","_k":"83ce22aa"},{"t":"`f(x) = -(x + 1)^2 - 3`","why":"This parabola opens down and stays below the axis: no zeros, and the reciprocal has a local \u003cstrong>minimum\u003c/strong> at (−1, −1/3).","_n":"4432d","_k":"9171ef0f"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"What is the range of `y = 1/(x^2 + 2x - 15)`?","options":[{"t":"`(-∞, 0) ∪ (0, ∞)`","why":"The middle piece never gets above −1/16, so values between −1/16 and 0 are never reached.","_n":"4525d","_k":"cfa497aa"},{"t":"`[-16, ∞)`","why":"That’s the range of the parabola, not of its reciprocal.","_n":"4626d","_k":"3717c47e"},{"t":"`[-1/16, 0) ∪ (0, ∞)`","why":"−1/16 is the \u003cstrong>highest\u003c/strong> value of the middle piece, not its lowest. Near the asymptotes it drops to −∞.","_n":"4723d","_k":"063245ee"},{"t":"`(-∞, -1/16] ∪ (0, ∞)`","why":"`x^2 + 2x - 15 = (x + 1)^2 - 16`. Between the asymptotes `x = -5` and `x = 3` the middle piece climbs to a local maximum of −1/16 at `x = -1`. The outer pieces take every positive value.","_n":"4824d","_k":"369b9855"}]},"b":{"prompt":"What is the range of `y = 1/(x^2 - 4x - 5)`?","options":[{"t":"`[-9, ∞)`","why":"That’s the range of the parabola, not of its reciprocal.","_n":"4929d","_k":"36cba8ea"},{"t":"`[-1/9, 0) ∪ (0, ∞)`","why":"−1/9 is the \u003cstrong>highest\u003c/strong> value of the middle piece, not its lowest.","_n":"4a2ad","_k":"8f3fe88a"},{"t":"`(-∞, -1/9] ∪ (0, ∞)`","why":"`x^2 - 4x - 5 = (x - 2)^2 - 9`. Between the asymptotes `x = -1` and `x = 5` the middle piece climbs to a local maximum of −1/9 at `x = 2`. The outer pieces take every positive value.","_n":"4b27d","_k":"abdcff08"},{"t":"`(-∞, 0) ∪ (0, ∞)`","why":"The middle piece never gets above −1/9, so values between −1/9 and 0 are never reached.","_n":"4c28d","_k":"9fccda59"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which statement correctly describes `y = 1/(x^2 - 1)` near `x = 1`?","options":[{"t":"“As `x → 1^{-}`, `y → -∞`, and as `x → 1^{+}`, `y → +∞`.”","why":"Just left of 1 (say 0.9), `x^2 - 1 = -0.19` is small and negative; just right of 1 it’s small and positive.","_n":"4d2dd","_k":"26593e19"},{"t":"“As `x → 1^{-}`, `y → 0^{-}`, and as `x → 1^{+}`, `y → 0^{+}`.”","why":"That describes `x^2 - 1` itself, which approaches 0. Its reciprocal grows without bound.","_n":"4e2ed","_k":"3d0668aa"},{"t":"“As `x → 1`, `y → ∞`.”","why":"This ignores the two sides. Just left of 1, `x^2 - 1` is negative, so `y → -∞` there.","_n":"4fbfd","_k":"d152d40e"},{"t":"“As `x → 1^{-}`, `y → +∞`, and as `x → 1^{+}`, `y → -∞`.”","why":"The sides are swapped. Test `x = 0.9`: 0.81 − 1 = −0.19, which is negative.","_n":"4gbed","_k":"55101f00"}]},"b":{"prompt":"Which statement correctly describes `y = 1/(4 - x^2)` near `x = -2`?","options":[{"t":"“As `x → -2^{-}`, `y → -∞`, and as `x → -2^{+}`, `y → +∞`.”","why":"Just left of −2 (say −2.1), `4 - x^2 = -0.41` is small and negative; just right (−1.9) it’s 0.39, small and positive.","_n":"4hbdd","_k":"38485045"},{"t":"“As `x → -2^{-}`, `y → 0^{-}`, and as `x → -2^{+}`, `y → 0^{+}`.”","why":"That describes `4 - x^2` itself, which approaches 0. Its reciprocal grows without bound.","_n":"4ibcd","_k":"ac441e78"},{"t":"“As `x → -2`, `y → ∞`.”","why":"This ignores the two sides. Just left of −2, `4 - x^2` is negative, so `y → -∞` there.","_n":"4jbbd","_k":"d539512e"},{"t":"“As `x → -2^{-}`, `y → +∞`, and as `x → -2^{+}`, `y → -∞`.”","why":"The sides are swapped. Test `x = -2.1`: 4 − 4.41 = −0.41, which is negative.","_n":"4kbad","_k":"62b64a58"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why `y = 1/(x^2 + 2)` has a local maximum at `x = 0`?","options":[{"t":"“`x^2 + 2` is largest at `x = 0`, so 1 divided by it is largest there too.”","why":"That misreads the parabola: `x^2` is never negative, so `x^2 + 2` is \u003cstrong>smallest\u003c/strong> at `x = 0`. And a reciprocal reverses sizes: a larger positive `f` gives a smaller `1/f`.","_n":"4lb9d","_k":"03edba9b"},{"t":"“`x^2 + 2` is smallest at `x = 0`, so 1 divided by it is largest there, 1/2.”","why":"This links the parabola’s minimum to the reciprocal’s maximum and says why: dividing 1 by a smaller positive number gives a larger result.","_n":"4mb8d","_k":"7c9180f4"},{"t":"“`x^2 + 2` is smallest at `x = 0`, so 1 divided by it is smallest there too.”","why":"Dividing 1 by a smaller positive number gives a \u003cstrong>larger\u003c/strong> result: 1/2 at `x = 0` beats 1/3 at `x = 1`. So the smallest `f` gives the largest `1/f`.","_n":"4nb7d","_k":"519ea1af"},{"t":"“Reciprocals turn small into large, so every parabola’s vertex becomes a local maximum.”","why":"That over-generalizes the vertex rule. A parabola’s \u003cstrong>maximum\u003c/strong> becomes a local \u003cstrong>minimum\u003c/strong>: `1/(-x^2 - 2)` dips to −1/2 at `x = 0`. It works here only because `x^2 + 2` has its minimum at `x = 0`.","_n":"4ob6d","_k":"75c9042b"}]},"b":{"prompt":"Which is the best explanation of why `y = 1/(x^2 - 2x + 5) = 1/((x - 1)^2 + 4)` has a local maximum at `x = 1`?","options":[{"t":"“`(x - 1)^2 + 4` is largest at `x = 1`, so 1 divided by it is largest there too.”","why":"That misreads the parabola: `(x - 1)^2` is never negative, so `(x - 1)^2 + 4` is \u003cstrong>smallest\u003c/strong> at `x = 1`. And a reciprocal reverses sizes: a larger positive `f` gives a smaller `1/f`.","_n":"4pb9d","_k":"60c90a8f"},{"t":"“`(x - 1)^2 + 4` is smallest at `x = 1`, so 1 divided by it is smallest there too.”","why":"Dividing 1 by a smaller positive number gives a \u003cstrong>larger\u003c/strong> result: 1/4 at `x = 1` beats 1/5 at `x = 0`. So the smallest `f` gives the largest `1/f`.","_n":"4qbad","_k":"68e5d50a"},{"t":"“Reciprocals turn small into large, so every parabola’s vertex becomes a local maximum.”","why":"That over-generalizes the vertex rule. A parabola’s \u003cstrong>maximum\u003c/strong> becomes a local \u003cstrong>minimum\u003c/strong>: `1/(-(x - 1)^2 - 4)` dips to −1/4 at `x = 1`. It works here only because `(x - 1)^2 + 4` has its minimum at `x = 1`.","_n":"4rbbd","_k":"7674a386"},{"t":"“`(x - 1)^2 + 4` is smallest at `x = 1`, so 1 divided by it is largest there, 1/4.”","why":"This links the parabola’s minimum to the reciprocal’s maximum and says why: dividing 1 by a smaller positive number gives a larger result.","_n":"4sbcd","_k":"125dbdfd"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A light hangs 3 m above a straight path. The brightness at a point on the path, `x` metres from the spot directly below the light, is modelled by `L(x) = 90/(x^2 + 9)` lux. How far from that spot is the brightness half of its greatest value?","options":[{"t":"9 m","why":"That’s `x^2`, not `x`. Take the square root: `x = 3`.","_n":"4tb5d","_k":"5fb9032f"},{"t":"1.5 m","why":"Halving the distance doesn’t halve the brightness. Check: `L(1.5)` = 90/11.25 = 8, not 5.","_n":"4ub6d","_k":"d081a101"},{"t":"`3√2` m","why":"That solves `90/x^2 = 5` and leaves out the + 9 in the denominator.","_n":"4vb7d","_k":"2da77bc7"},{"t":"3 m","why":"The greatest value is `L(0)` = 90/9 = 10 lux, where `x^2 + 9` is smallest. Half is 5: `90/(x^2 + 9) = 5` gives `x^2 + 9 = 18`, so `x^2 = 9` and `x = 3`.","_n":"4wb8d","_k":"f6010b1a"}]},"b":{"prompt":"A speaker is mounted 4 m above a walkway. The sound level at a point on the walkway, `x` metres from the spot directly below the speaker, is modelled by `S(x) = 160/(x^2 + 16)` units. How far from that spot is the level half of its greatest value?","options":[{"t":"16 m","why":"That’s `x^2`, not `x`. Take the square root: `x = 4`.","_n":"4xb1d","_k":"bf8ca40f"},{"t":"`4√2` m","why":"That solves `160/x^2 = 5` and leaves out the + 16 in the denominator.","_n":"4yb2d","_k":"d978eab9"},{"t":"4 m","why":"The greatest value is `S(0)` = 160/16 = 10. Half is 5: `160/(x^2 + 16) = 5` gives `x^2 + 16 = 32`, so `x^2 = 16` and `x = 4`.","_n":"4za3e","_k":"ab8a6d66"},{"t":"2 m","why":"Halving the distance doesn’t halve the level. Check: `S(2)` = 160/20 = 8, not 5.","_n":"50a2e","_k":"8da45785"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Where does the graph of `y = 1/(x^2 - 4) + 1` cross the `x`-axis?","options":[{"t":"At `x = -√3` and `x = √3`","why":"`y = 0` means `1/(x^2 - 4) = -1`, so `x^2 - 4 = -1` and `x^2 = 3`.","_n":"51a5e","_k":"32739f88"},{"t":"Nowhere: it never crosses the `x`-axis.","why":"`1/(x^2 - 4)` is never 0, but adding 1 lifts the graph. Now `y = 0` wherever `1/(x^2 - 4) = -1`.","_n":"52a4e","_k":"735522fd"},{"t":"At `x = -√5` and `x = √5`","why":"That solves `x^2 - 4 = 1`. You need `1/(x^2 - 4) = -1`, so `x^2 - 4 = -1`.","_n":"53a7e","_k":"8fc5afff"},{"t":"At `x = -2` and `x = 2`","why":"Those are the vertical asymptotes: the graph isn’t defined there.","_n":"54a6e","_k":"57593965"}]},"b":{"prompt":"Where does the graph of `y = 1/(x^2 - 9) + 1` cross the `x`-axis?","options":[{"t":"Nowhere: it never crosses the `x`-axis.","why":"`1/(x^2 - 9)` is never 0, but adding 1 lifts the graph. Now `y = 0` wherever `1/(x^2 - 9) = -1`.","_n":"55a9e","_k":"8d963fbb"},{"t":"At `x = -√10` and `x = √10`","why":"That solves `x^2 - 9 = 1`. You need `1/(x^2 - 9) = -1`, so `x^2 - 9 = -1`.","_n":"56a8e","_k":"47cf629d"},{"t":"At `x = -2√2` and `x = 2√2`","why":"`y = 0` means `1/(x^2 - 9) = -1`, so `x^2 - 9 = -1` and `x^2 = 8`.","_n":"57abe","_k":"783cbd75"},{"t":"At `x = -3` and `x = 3`","why":"Those are the vertical asymptotes: the graph isn’t defined there.","_n":"58aae","_k":"9d207e4e"}]}}]},"task":{"title":"Design a reciprocal","summary":"Design a reciprocal","statement":"\u003cp>Choose `a`, `d` and `c` so that the graph of `y = 1/(a(x - d)^2 + c)` has all three features below. There’s more than one answer. Can you find them all?\u003c/p>","checks":["Range: `(-∞, -1/4] ∪ (0, ∞)`","Two vertical asymptotes, both at whole numbers","`y`-intercept: (0, −1/3)"],"tips":["Right now your range is {range}. A range of `(-∞, -1/4] ∪ (0, ∞)` means a middle piece that tops out at −1/4: a local \u003cstrong>maximum\u003c/strong> at height −1/4. Which vertex height and which way of opening give that?","Right now your asymptotes are {list}. They sit at `d - √{-c/a}` and `d + √{-c/a}`. For whole numbers, `√{-c/a}` has to come out nicely.","Substitute `x = 0`: the `y`-intercept is `1/(a · d^2 + c)`. Right now `a · d^2 + c` = {v}; you need −3."],"ui":{"a":"`@a{a}`","d":"`@d{d}`","c":"`@c{c}`","dBad":"Use a multiple of 1/2 from −5 to 5","cBad":"Use a whole number from −9 to 9","minus":"Decrease","plus":"Increase","eq":"Your function","va":"Vertical asymptotes","yint":"`y`-intercept","tp":"Turning point","rng":"Range","none":"none","noTp":"none: the vertex is on the `x`-axis","lmax":"local maximum","lmin":"local minimum"},"explainPrompt":"Explain how each feature told you something about `a`, `d` or `c`.","vocab":"Use the words vertex, local maximum, vertical asymptote and range.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","all4":"You found all four. Each one has `c = -4` (from the range) and `a · d^2 = 1` (from the `y`-intercept). On these inputs that leaves `a = 1` with `d = ±1`, `a = 1/4` with `d = ±2`, and `a = 4` with `d = ±1/2`, and only the first two put both asymptotes at whole numbers."},"cards":[["From `y = f(x)` to `y = 1/f(x)`","Each point keeps its `x`; its height `h` becomes 1/`h`, with the same sign. Example: (6, 3) → (6, 1/3)."],["Zeros of `f`","They become vertical asymptotes of `1/f`. Example: `x^2 - 4x = x(x - 4)` gives `x = 0` and `x = 4`."],["Horizontal asymptote of `1/f` (`f` quadratic)","Always `y = 0`, approached from above if `a > 0` and from below if `a \u003c 0`."],["Points that stay put","Where `f(x) = 1` or `f(x) = -1`, since 1/1 = 1 and 1/(−1) = −1."],["Two zeros (`a > 0`)","Three pieces: outer pieces above the axis, middle piece below with a local maximum (`d`, 1/`c`). Range `(-∞, 1/c] ∪ (0, ∞)`."],["One zero: `f(x) = a(x - d)^2`","One asymptote `x = d`; both pieces on the same side (up if `a > 0`); no turning point; range `(0, ∞)` if `a > 0`."],["No zeros (`a > 0`)","One piece, a hump above the axis, with a local maximum (`d`, 1/`c`). Range `(0, 1/c]`."],["The vertex rule","Vertex (`d`, `c`) of `f` → turning point (`d`, 1/`c`) of `1/f`, with minimum ↔ maximum. None if `c = 0`."],["Increasing and decreasing","`1/f` increases where `f` decreases, and the other way round, split at every asymptote."],["Behaviour near a vertical asymptote","Follow the sign of `f` on each side: positive → +∞, negative → −∞. `1/(x^2 - 4x)`: as `x → 0^{-}`, `y → +∞`; as `x → 0^{+}`, `y → -∞`."],["`x`-intercepts of `1/f`","None. A fraction with numerator 1 is never 0."],["Reciprocal vs inverse","`1/f(x)` keeps `x` and flips the height: (6, 3) → (6, 1/3). `f^{-1}` swaps `x` and `y`: (6, 3) → (3, 6). They’re different things."]]}};</script>
