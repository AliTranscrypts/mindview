.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 12: hero tiles, N28 root hunter, volume model, grouping tiles, factor builder, task */
.hero .hero-eq .m{white-space:normal}
.opt .m,.chip .m,.sq .m{white-space:normal}
/* hero */
.hero-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.ht{min-width:2.4em;text-align:center;border:1.5px solid var(--rule);border-radius:6px;padding:.15em .45em;font:400 1.05rem var(--font-math);background:var(--sheet);opacity:0;transform:translateY(-14px);transition:opacity .35s,transform .35s,background-color .3s,border-color .3s}
.ht.in{opacity:1;transform:none}
.ht.hit{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);font-weight:700}
#hero-cap .m{white-space:normal}
/* N28 root hunter */
.rh-chips .fchip.txt{font:700 .92rem var(--font-ui)}
.rh-chips .fchip .m{font-size:1em}
.rh-k .slider output{color:var(--ink)!important}
.rh-k input[type=range]{accent-color:var(--ink)!important}
.rh-own-in{display:flex;flex-wrap:wrap;gap:8px 10px;margin:8px 0 4px}
.rh-own-in label{display:grid;gap:2px;font-size:.85rem;font-weight:700}
.rh-own-in input{width:4.4rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.35em .5em;font:400 1.1rem var(--font-math)}
.rh-own-in input:focus{border-color:var(--ink)}
.rh-own-msg.bad{color:var(--red);font-weight:700}
.rh-note{margin:12px 0 6px;max-width:none}
.rh-board{display:flex;flex-wrap:wrap;gap:6px;min-height:8px}
.rh-tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:3.2rem;min-height:44px;padding:.25em .55em;border:2px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1.15rem var(--font-math)}
.rh-tile:disabled{opacity:1}
.rh-tile:not(:disabled):hover{border-color:var(--pen)}
.rh-tile .rh-v{font:400 .78rem var(--font-ui);color:var(--ink-2);white-space:nowrap}
.rh-tile .rh-v .m{font-size:1em}
.rh-tile.miss{border-color:var(--rule);color:var(--ink-2);background:var(--paper)}
.rh-tile.hit{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.rh-tile.hit .rh-v{color:var(--hi-ink);font-weight:700}
.rh-tile.ghost{border-style:dashed;border-color:var(--ink-2);color:var(--ink-2);opacity:.85}
.rh-tile.hid{outline:3px solid var(--pen);outline-offset:1px}
.rh-board.static .rh-tile{min-height:36px;min-width:2.8rem;font-size:1.05rem}
.rh-quad{margin-top:12px}
.rh-pick{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.rh-pick > p{margin:0 0 8px}
.rh-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px}
.rh-count{font-weight:700}
.rh-tray{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:1.05rem}
.rh-tray-l{font:700 .9rem var(--font-ui);margin-right:2px}
.rh-fac{border:1.5px solid var(--green);background:var(--good-bg);border-radius:5px;padding:.08em .45em}
.rh-rest{border:1.5px dashed var(--ink-2);border-radius:5px;padding:.08em .45em}
.rh-fac .m,.rh-rest .m{white-space:normal}
.rh-done{font:700 .9rem var(--font-ui);color:var(--green)}
.pg-read .read dd .m{white-space:normal}
.rh-sd{margin-top:14px}
.rh-sd-box{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.rh-sd-box h4{margin:0 0 8px}
table.rh-sdt td,table.rh-sdt th{text-align:center;min-width:2.6em;font-family:var(--font-math);white-space:nowrap}
table.rh-sdt th.rh-z{border-right:2px solid var(--ink)}
table.rh-sdt tr.rh-bot td{border-top:2px solid var(--ink)}
table.rh-sdt td.rh-rem{box-shadow:inset 0 0 0 2px var(--ink-2)}
.rh-sd-cap{margin:8px 0 0;min-height:2.6em}
.rh-sd-cap .m{white-space:normal}
/* Part 3: volume model */
.vm{margin-top:6px}
.vm-cap{margin:10px 0 0;min-height:3em}
.vm-cap .m,.vm-num .m,.vm-hook .m{white-space:normal}
.vm-num{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.vm-num p{margin:0 0 6px}
.vm-num p:last-child{margin-bottom:0}
.vm-hook{margin:14px 0 0}
/* Part 3: grouping tiles */
.gt-tiles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.gt-tile{min-height:44px}
.gt-tile.on{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.gt-line{font:400 clamp(1.15rem,3.2vw,1.45rem)/1.5 var(--font-math);margin:8px 0;overflow-wrap:anywhere}
.gt-line .m{white-space:nowrap}
.gt-br{border-radius:5px;padding:0 .1em;transition:background-color .5s,box-shadow .5s}
.gt-br.glow{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.gt-merge{animation:gtIn .6s ease-out}
@keyframes gtIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Practice 2: factor builder */
.fx-tray{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.fx-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 0;border-bottom:1px solid var(--rule)}
.fx-f{min-width:6.5em;font-size:1.15rem}
.fx-lab{color:var(--ink-2)}
.fx-pq{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fx-st{display:inline-flex;align-items:center;gap:4px}
.fx-st .btn{min-width:34px;justify-content:center;padding:.3em .55em}
.fx-st output{min-width:2.2em;text-align:center;font:400 1.1rem var(--font-math)}
.fx-qin{display:inline-flex;align-items:center;gap:4px}
.fx-qin input{width:4rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.3em .45em;font:400 1.1rem var(--font-math)}
.fx-qin input:focus{border-color:var(--ink)}
.fx-prev{margin:10px 0 0;font-size:1.05rem}
.fx-prev .m{white-space:normal}
/* Performance task */
.hz-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0}
.hz-row > label{font-size:1.15rem;min-width:2.6em}
.hz-row .numin.short{width:4.6rem}
.hz-q{display:inline-flex;align-items:center;gap:8px}
.hz-row .seg-wrap{margin-top:0}
.hz-sl{font:400 1.3rem var(--font-math)}
.hz-eq{font:400 1.2rem/1.5 var(--font-math);margin:0 0 4px;overflow-wrap:anywhere}
.hz-eq .m{white-space:normal}

"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"7b9e2125","content":{"id":"12-factor-theorem-and-sum-difference-of-cubes","kind":"topic","title":"Factor theorem and sum/difference of cubes","topic":"Factor Theorem and Sum/Difference of Cubes","readyTopic":"the factor theorem","hero":{"eq":"`P(b) = 0` ⟺ `(x - b)` is a factor","eqLabel":"P of b equals 0 if and only if x minus b is a factor","eqSize":"sm","headline":"A remainder of zero means a factor","text":"In module 11, dividing `P(x)` by `x - b` left the remainder `P(b)`. When that remainder is 0, `x - b` divides in exactly: it’s a \u003cstrong>factor\u003c/strong>, and `b` is a zero. The \u003cstrong>integral and rational zero theorems\u003c/strong> tell you which values are worth testing. Some polynomials also factor by patterns: \u003cstrong>grouping\u003c/strong> and the \u003cstrong>sum or difference of cubes\u003c/strong>.","fig":{"html":"\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"Graph of P of x equals x cubed minus 2 x squared minus 5 x plus 6. Candidate tiles plus or minus 1, 2, 3 and 6 sit under it; the tiles 1, negative 2 and 3 light up as dots land on the x-intercepts, and the caption builds (x − 1)(x + 2)(x − 3).\">\u003c/canvas>\u003cdiv class=\"hero-tiles\" id=\"hero-tiles\" aria-hidden=\"true\">\u003c/div>"}},"goals":["I can use the factor theorem to decide whether `x - b` or `ax - b` is a factor.","I can list the possible rational zeros with the integral and rational zero theorems, and choose good test values.","I can factor a polynomial of degree 3 or 4 fully by finding a factor and dividing it out.","I can factor by grouping.","I can factor a sum or difference of cubes and explain why its quadratic factor doesn’t factor further.","I can use the factor theorem to find an unknown coefficient."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Remainder theorem","goal":1,"prompt":"What is the remainder when `x^3 - 3x + 4` is divided by `x - 2`?","options":[{"t":"0","why":"The remainder is 0 only if `P(2) = 0`.","_n":"0954","_k":"3c22f6dc"},{"t":"2","why":"Dividing by `x - 2` uses the zero 2: `P(2)`, not `P(-2) = -8 + 6 + 4 = 2`.","_n":"1924","_k":"f2132506"},{"t":"6","why":"`P(2) = 8 - 6 + 4 = 6`.","_n":"2934","_k":"9888ca77"},{"t":"18","why":"`-3(2) = -6`, not +6.","_n":"3904","_k":"93080f02"}],"hints":["Remainder theorem: substitute the divisor’s zero.","`x - 2 = 0` at `x = 2`.","`P(2) = 6`."]},{"id":"w2","skill":"Remainder theorem","goal":1,"prompt":"`P(x) ÷ (x + 1)` has remainder 0. What does that tell you?","options":[{"t":"The quotient is 0","why":"The remainder is 0; the quotient is a polynomial.","_n":"4914","_k":"64408004"},{"t":"`P(-1) = 0`","why":"The divisor’s zero is −1.","_n":"58e4","_k":"47641d69"},{"t":"`P(1) = 0`","why":"`x + 1 = 0` at `x = -1`.","_n":"68f4","_k":"30f0effe"},{"t":"`P(0) = -1`","why":"The `y`-intercept isn’t involved.","_n":"79c4","_k":"04953bc5"}],"hints":["Remainder = `P`(divisor’s zero).","The zero of `x + 1` is −1.","`P(-1) = 0`."]},{"id":"w3","skill":"Factoring quadratics","goal":3,"prompt":"Factor `x^2 - x - 6`.","options":[{"t":"`(x - 6)(x + 1)`","why":"−6 + 1 = −5.","_n":"89d4","_k":"2e4b4105"},{"t":"`(x - 3)(x + 2)`","why":"−3 × 2 = −6 and −3 + 2 = −1.","_n":"9684","_k":"d5141f7e"},{"t":"`(x - 3)(x - 2)`","why":"That gives +6.","_n":"a674","_k":"8fc5316e"},{"t":"`(x + 3)(x - 2)`","why":"That expands to `x^2 + x - 6`.","_n":"b6a4","_k":"f48eff77"}],"hints":["Two numbers with product −6 and sum −1.","−3 and 2.","`(x - 3)(x + 2)`."]},{"id":"w4","skill":"Factoring quadratics","goal":3,"prompt":"Factor `2x^2 - x - 1`.","options":[{"t":"`2(x - 1)(x + 1)`","why":"That gives `2x^2 - 2`.","_n":"c694","_k":"f9da4be2"},{"t":"`(2x - 1)(x + 1)`","why":"That gives `2x^2 + x - 1`.","_n":"d644","_k":"816589fc"},{"t":"`(2x + 1)(x - 1)`","why":"`2x^2 - 2x + x - 1`.","_n":"e634","_k":"56a45ff1"},{"t":"`(2x + 1)(x + 1)`","why":"That gives +1.","_n":"f664","_k":"e3157a4c"}],"hints":["Try `(2x ± 1)(x ± 1)`.","The middle term must be `-x`.","`(2x + 1)(x - 1)`."]},{"id":"w5","skill":"Special products","goal":5,"prompt":"Which equals `x^2 - 9`?","options":[{"t":"`(x - 3)(x + 3)`","why":"Difference of squares.","_n":"g654","_k":"82a1494d"},{"t":"`(x - 3)^2`","why":"`(x - 3)^2 = x^2 - 6x + 9`.","_n":"h704","_k":"a79ddbbf"},{"t":"`(x - 9)(x + 1)`","why":"That gives `x^2 - 8x - 9`.","_n":"i6f4","_k":"5ca3a43f"},{"t":"It can’t be factored.","why":"Only a \u003cstrong>sum\u003c/strong> of squares can’t be factored over the reals.","_n":"jf63","_k":"6ea0c845"}],"hints":["Is it a difference of two squares?","`x^2 - 3^2`.","`(x - 3)(x + 3)`."]},{"id":"w6","skill":"Special products","goal":5,"prompt":"Which is `2x` cubed?","options":[{"t":"`6x^3`","why":"2³ = 8.","_n":"kf73","_k":"1a00e661"},{"t":"`2x^3`","why":"The 2 is cubed too.","_n":"lf83","_k":"2b801c75"},{"t":"`8x^3`","why":"`(2x)^3 = 2^3x^3`.","_n":"mf93","_k":"9d4da4a6"},{"t":"`8x`","why":"`x` is cubed too.","_n":"nf23","_k":"7e6a524d"}],"hints":["Cube every factor.","2³ and `x^3`.","`8x^3`."]}],"refreshers":{"Remainder theorem":"Dividing `P(x)` by `x - b` leaves `P(b)`. For `x + 1` the zero is −1.","Factoring quadratics":"For `x^2 + bx + c`, find two numbers with product `c` and sum `b`. For `2x^2` …, try the factor pairs of the first and last terms and check the middle term.","Special products":"`a^2 - b^2 = (a - b)(a + b)`; `(2x)^3 = 8x^3`."}}},"explore":{"heading":"Root hunter","intro":"Tap a candidate to test it. A hit lands on the graph as an `x`-intercept, and its factor is divided out. Hunt down every factor.","predIntro":"Make a prediction first. Then the root hunter will show you what really happens.","predictions":[{"id":"p1","start":{"pid":"p1","mode":"int"},"prompt":"Which of these can’t be a zero of `x^3 - 2x^2 - 5x + 6`?","options":[{"t":"−2","_n":"of33","_k":"98e1c2d1"},{"t":"1","_n":"pf43","_k":"51c0620d"},{"t":"3","_n":"qf53","_k":"dc2c21e9"},{"t":"4","_n":"ree3","_k":"9559d184"}],"explain":"If `b` is an integer zero, `P(b) = 0` forces `b` to divide the constant 6. 4 doesn’t.","ghost":{"n":4,"note":"4 doesn’t divide 6"}},{"id":"p2","start":{"pid":"p1","mode":"int","hits":[[1,1]]},"prompt":"The quotient is `x^2 - x - 6`. How many more zeros will the hunter find?","options":[{"t":"0","_n":"sef3","_k":"d03512ed"},{"t":"1","_n":"tfc4","_k":"8ea88e9b"},{"t":"2","_n":"ufb4","_k":"60fea614"},{"t":"3","_n":"vfa4","_k":"4429760b"}],"explain":"`x^2 - x - 6 = (x + 2)(x - 3)`."},{"id":"p3","start":{"pid":"p3","mode":"int"},"prompt":"The hunter can only test ±1 and ±2. Will it find all three zeros of `2x^3 - 3x^2 - 3x + 2`?","options":[{"t":"It needs ±3 too","_n":"wf94","_k":"1a130d36"},{"t":"It will find none","_n":"xf84","_k":"26034c54"},{"t":"No","_n":"yf74","_k":"15610a69"},{"t":"Yes","_n":"zf64","_k":"4d610e58"}],"explain":"With leading coefficient 2, a zero can be a fraction `p/2`. `(2x - 1)` is a factor: `P(1/2) = 0`."},{"id":"p4","start":{"pid":"p4","mode":"int"},"prompt":"After the hit at 3, the quotient is `x^2 - 2`. No candidate (±1, ±2) works. What does that mean?","options":[{"t":"The other zeros are irrational: `±√2`","_n":"10f54","_k":"a6223381"},{"t":"There are no more zeros","_n":"11f44","_k":"4b98f2ea"},{"t":"3 is a double zero","_n":"12f34","_k":"26592c2a"},{"t":"The polynomial was entered wrongly","_n":"136a3","_k":"4f2aadc8"}],"explain":"The candidate lists only rational zeros. `x^2 - 2 = 0` gives `x = ±√2`."}],"chalIntro":"Each challenge has its own polynomial chip in the hunter. Hunt, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Fully factor `P_1`.","why":"`x^3 - 2x^2 - 5x + 6 = (x - 1)(x + 2)(x - 3)`.","msgs":{"m4":"Not fully factored: the quadratic factors.","pick":"Choose `P_1` on the polynomial chips first.","more":"Keep hunting: the tray must hold every factor of `P_1`."},"hints":["Test the small candidates first.","`P(1) = 0`. Divide out `(x - 1)`.","`x^2 - x - 6 = (x + 2)(x - 3)`."]},{"id":"tc2","goal":[6,3],"prompt":"Set `k` so that `(x - 2)` is a factor of `x^3 + kx^2 - 4x + 12`, then factor it fully.","why":"`k = -3`: `x^3 - 3x^2 - 4x + 12 = (x - 2)(x + 2)(x - 3)`.","msgs":{"k":"`P(2) = 8 + 4k - 8 + 12 = 4k + 12`. Solve `4k + 12 = 0`.","m4":"Factor the quadratic.","pick":"Choose the Challenge 2 chip, `x^3 + kx^2 - 4x + 12`, first.","more":"`k` is right. Now hunt: the tray must hold every factor."},"hints":["`(x - 2)` is a factor exactly when `P(2) = 0`.","`4k + 12 = 0`.","`k = -3`: `x^3 - 3x^2 - 4x + 12 = (x - 2)(x + 2)(x - 3)`."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"Fully factor `x^4 + 2x^3 - 7x^2 - 8x + 12` using \u003cstrong>at most 5 tests\u003c/strong>.","why":"`x^4 + 2x^3 - 7x^2 - 8x + 12 = (x - 1)(x - 2)(x + 2)(x + 3)`.","msgs":{"tests":"You got there, but in {n} tests. Test small values first, and factor the quadratic as soon as you reach one.","pick":"Choose the Challenge 3 chip, `x^4 + 2x^3 - 7x^2 - 8x + 12`, first.","more":"Keep going: the tray must hold four linear factors."},"hints":["Test ±1 first: they’re quick to compute.","`P(1) = 1 + 2 - 7 - 8 + 12 = 0`. The quotient is `x^3 + 3x^2 - 4x - 12`: try grouping or test 2.","`x^3 + 3x^2 - 4x - 12 = (x + 3)(x^2 - 4)`: two tests are enough."]}],"demo":"The prediction’s replay did this hunt. Press \u003cstrong>Start over\u003c/strong> and hunt the factors yourself."},"part3":{"slug":"cubes","name":"Cubes","heading":"Cube patterns and grouping","intro":"Two stations. A volume model shows where the cube pattern comes from, and grouping tiles make the shared bracket visible.","model":{"title":"Station 1: the volume model","how":"Step through the model. Move the sliders to see the numbers.","steps":["A big cube of side `a` (volume `a^3`) with a small cube of side `b` cut from one corner.","The remaining solid splits into three boxes, each with one edge `(a - b)`: `a × a × (a - b)`, `a × b × (a - b)` and `b × b × (a - b)`.","The boxes slide apart and their volumes add: `(a - b)(a^2 + ab + b^2)`."],"alg":"\u003csummary>Check it with algebra\u003c/summary>\u003cdiv class=\"alg-lines\">\u003cspan>`(a - b)(a^2 + ab + b^2)`\u003c/span>\u003cspan>`= a^3 + a^2b + ab^2 - a^2b - ab^2 - b^3`\u003c/span>\u003cspan>\u003csmall>The `a^2b` and `ab^2` terms cancel.\u003c/small>\u003c/span>\u003cspan>`= a^3 - b^3`\u003c/span>\u003cspan style=\"margin-top:8px\">`(a + b)(a^2 - ab + b^2)`\u003c/span>\u003cspan>`= a^3 - a^2b + ab^2 + a^2b - ab^2 + b^3`\u003c/span>\u003cspan>\u003csmall>The same two terms cancel.\u003c/small>\u003c/span>\u003cspan>`= a^3 + b^3`\u003c/span>\u003c/div>","hook":"\u003cstrong>Memory hook:\u003c/strong> “Same sign, Opposite sign, Always plus” for the three signs in the factors: `a^3 - b^3 = (a - b)(a^2 + ab + b^2)` and `a^3 + b^3 = (a + b)(a^2 - ab + b^2)`."},"grouping":{"title":"Station 2: grouping tiles","how":"Tap two tiles to make the first pair. The other two tiles make the second pair.","examples":[{"label":"`x^3 + 3x^2 - 4x - 12`","terms":[[1,3],[3,2],[-4,1],[-12,0]],"full":"`(x + 3)(x - 2)(x + 2)`","win":"The shared bracket comes out, and `x^2 - 4` splits again as a difference of squares.","miss":"These brackets don’t match. Pair the tiles another way."},{"label":"`x^3 + 2x^2 + 3x + 4`","terms":[[1,3],[2,2],[3,1],[4,0]],"miss":"The brackets don’t match, so grouping doesn’t work here; use the factor theorem."}],"take":"Take out each pair’s common factor","merge":"Merge the shared bracket","again":"Pair again","glow":"The shared bracket glows: both groups contain it."},"quickCheck":{"title":"Cube patterns quick check","summary":"Cube patterns quick check","items":[{"id":"q1","goal":5,"prompt":"`x^3 - 64 =`","choices":[{"t":"`(x - 4)(x^2 + 4x + 16)`","fb":"Right. Same, Opposite, Always plus: `(x - 4)(x^2 + 4x + 16)`.","_n":"146b3","_k":"53945deb"},{"t":"`(x - 4)(x^2 - 4x + 16)`","fb":"Same, Opposite, Always plus: `(x - 4)(x^2 + 4x + 16)`.","_n":"15683","_k":"a40a4c9b"},{"t":"`(x - 4)^3`","fb":"Same, Opposite, Always plus: `(x - 4)(x^2 + 4x + 16)`.","_n":"16693","_k":"a8f340a1"},{"t":"`(x - 8)(x^2 + 8)`","fb":"Same, Opposite, Always plus: `(x - 4)(x^2 + 4x + 16)`.","_n":"17663","_k":"fedc7a3f"}]},{"id":"q2","goal":5,"prompt":"`27x^3 + 1 =`","choices":[{"t":"`(3x + 1)(9x^2 - 3x + 1)`","fb":"Right. `a = 3x`, `b = 1`: `(a + b)(a^2 - ab + b^2)`.","_n":"18673","_k":"07b301ae"},{"t":"`(3x + 1)(9x^2 + 3x + 1)`","fb":"`a = 3x`, `b = 1`: `(a + b)(a^2 - ab + b^2)`.","_n":"19643","_k":"5db3cd33"},{"t":"`(3x + 1)^3`","fb":"`a = 3x`, `b = 1`: `(a + b)(a^2 - ab + b^2)`.","_n":"1a653","_k":"0ed99ec2"},{"t":"`(27x + 1)(x^2 - x + 1)`","fb":"`a = 3x`, `b = 1`: `(a + b)(a^2 - ab + b^2)`.","_n":"1b723","_k":"9bd7b861"}]},{"id":"q3","goal":5,"prompt":"Does `x^2 + 4x + 16` factor over the real numbers?","choices":[{"t":"No","fb":"Right. Its discriminant 16 − 64 = −48 is negative.","_n":"1c733","_k":"f45260c6"},{"t":"Yes, `(x + 4)^2`","fb":"Its discriminant 16 − 64 = −48 is negative.","_n":"1df03","_k":"66a8415e"},{"t":"Yes, `(x + 8)(x + 2)`","fb":"Its discriminant 16 − 64 = −48 is negative.","_n":"1eef3","_k":"3678e58c"},{"t":"Yes, `(x + 4)(x - 4)`","fb":"Its discriminant 16 − 64 = −48 is negative.","_n":"1ff23","_k":"fffe9bbe"}]},{"id":"q4","goal":4,"prompt":"`x^3 - 2x^2 - 9x + 18` by grouping =","choices":[{"t":"`(x - 2)(x - 3)(x + 3)`","fb":"Right. `x^2(x - 2) - 9(x - 2) = (x - 2)(x^2 - 9)`.","_n":"1gf13","_k":"bcf2b2e7"},{"t":"`(x - 2)(x^2 + 9)`","fb":"`x^2(x - 2) - 9(x - 2) = (x - 2)(x^2 - 9)`.","_n":"1hf43","_k":"f81b1dd6"},{"t":"`(x + 2)(x - 3)(x + 3)`","fb":"`x^2(x - 2) - 9(x - 2) = (x - 2)(x^2 - 9)`.","_n":"1if33","_k":"44e5fb00"},{"t":"`(x - 2)(x - 9)`","fb":"`x^2(x - 2) - 9(x - 2) = (x - 2)(x^2 - 9)`.","_n":"1jf63","_k":"129fb176"}]}]}},"practice":{"activities":[{"id":"method","type":"sorter","title":"Which method first?","summary":"Which method first?","goal":[3,4,5],"instruction":"Sort each polynomial by the best first method.","noun":"polynomial","boxes":[{"id":"b1","label":"Difference of squares"},{"id":"b2","label":"Sum or difference of cubes"},{"id":"b3","label":"Grouping"},{"id":"b4","label":"Factor theorem","sub":"(no pattern fits)"}],"items":[{"id":"i1","t":"`x^3 - 27`","_a":"FQALRw==","goal":5,"why":"`x^3 - 3^3`.","wrong":{"b1":"Check the powers: squares need even powers, cubes need multiples of 3."}},{"id":"i2","t":"`8x^3 + 1`","_a":"FQALRw==","goal":5,"why":"`(2x)^3 + 1^3`.","wrong":{"b1":"Check the powers: squares need even powers, cubes need multiples of 3."},"hints":["Is each term a perfect cube?","`8x^3 = (2x)^3`, `1 = 1^3`.","Sum of cubes."]},{"id":"i3","t":"`27x^3 - 64`","_a":"FQALRw==","goal":5,"why":"`(3x)^3 - 4^3`.","wrong":{"b1":"Check the powers: squares need even powers, cubes need multiples of 3."}},{"id":"i4","t":"`x^3 + 2x^2 - 9x - 18`","_a":"FQAKRw==","goal":4,"why":"`x^2(x + 2) - 9(x + 2)`.","wrong":{"b4":"That works, but grouping is faster here: look for a shared bracket."}},{"id":"i5","t":"`x^3 - 5x^2 - 4x + 20`","_a":"FQAKRw==","goal":4,"why":"`x^2(x - 5) - 4(x - 5)`.","wrong":{"b4":"That works, but grouping is faster here: look for a shared bracket."}},{"id":"i6","t":"`x^4 - 16`","_a":"FQAIRw==","goal":3,"why":"`(x^2)^2 - 4^2`.","wrong":{"b2":"Check the powers: squares need even powers, cubes need multiples of 3."}},{"id":"i7","t":"`9x^2 - 25`","_a":"FQAIRw==","goal":3,"why":"`(3x)^2 - 5^2`.","wrong":{"b2":"Check the powers: squares need even powers, cubes need multiples of 3."}},{"id":"i8","t":"`2x^3 - 3x^2 - 3x + 2`","_a":"FQANRw==","goal":3,"why":"No pattern; `P(2) = 0`.","wrong":{"b3":"Try it: the brackets don’t match."}},{"id":"i9","t":"`x^3 - 7x + 6`","_a":"FQANRw==","goal":3,"why":"No pattern; `P(1) = 0`.","wrong":{"b3":"Try it: the brackets don’t match."}},{"id":"i10","t":"`x^3 + 4x^2 + x - 6`","_a":"FQANRw==","goal":3,"why":"Grouping gives `x^2(x + 4) + (x - 6)`: no shared bracket. `P(1) = 0`.","wrong":{"b3":"Try it: the brackets don’t match."},"hints":["Try grouping first.","`x^2(x + 4) + 1(x - 6)`: the brackets differ.","Use the factor theorem: `P(1) = 0`."]}]},{"id":"factor","type":"custom","title":"Fully factor","summary":"Fully factor","star":true,"goal":[3,5,6],"instruction":"Build the full factorization of each polynomial in the factor tray. Problems 3 to 6 are non-routine.","how":"Add linear factors `px + q` and set them with the steppers. Add a quadratic factor if you need one. \u003cstrong>Check\u003c/strong> expands your factors and compares.","items":[{"id":"f1","goal":3,"prompt":"`x^3 - 4x^2 + x + 6`","poly":[1,-4,1,6],"_a":"TEBfRwgTUh1PQhJFAxgaTRdPGVcbGUoVGkIKTFITTw==","wrong":[{"zeros":[1,-2,-3],"fb":"`P(3) = 0` means `x - 3` is a factor: the factor is zero at `x = 3`."}]},{"id":"f2","goal":5,"prompt":"`x^3 - 64`","poly":[1,0,0,-64],"_a":"TEBfRwgTUh1PQhRFBhgaTWlQGU4SBUoVHEIIUxtREEg=","wrong":[{"zeros":[4],"quad":[1,-4,16],"fb":"Same sign, opposite sign, always plus: `a^3 - b^3 = (a - b)(a^2 + ab + b^2)`."}]},{"id":"f3","goal":3,"star":true,"prompt":"`2x^3 + x^2 - 13x + 6`","poly":[2,1,-13,6],"_a":"TEBfRwgTUh1PQhRFABgaB09CFEUDGBpNF0kZVhtREEg=","wrong":[{"zeros":[2],"quad":[2,5,-3],"fb":"`P(2) = 0`; the quotient `2x^2 + 5x - 3` factors too."}],"hints":["Candidates ±1, ±2, ±3, ±6, ±1/2, ±3/2.","`P(2) = 16 + 4 - 26 + 6 = 0`.","`2x^2 + 5x - 3 = (2x - 1)(x + 3)`."]},{"id":"f4","goal":5,"star":true,"prompt":"`x^4 - 81`","poly":[1,0,0,0,-81],"_a":"TEBfRwgTUh1PQhRFARgaTRdJGVYbGUprBUISRQsYUhdK","wrong":[{"quad":[1,0,-9],"fb":"`x^2 - 9` factors again."},{"lin":4,"fb":"A sum of squares doesn’t factor over the reals."}]},{"id":"f5","goal":6,"star":true,"prompt":"Find `k` so that `x + 2` is a factor of `2x^3 + kx^2 - 13x - 6`, then factor fully.","poly":[2,0,-13,-6],"kAt":1,"_a":"TEBSRwgcAxkVBBtfEFFZFQpCFFRSChJVHxoZThIDGx1PQhRFARgaB09CEkUDGFIXSg==","kWrong":[{"k":1,"fb":"`P(-2) = -16 + 4k + 26 - 6 = 4k + 4`."}],"kGeneral":"`x + 2` is a factor exactly when `P(-2) = 0`."},{"id":"f6","goal":5,"star":true,"prompt":"`(x + 1)^3 - 8`","poly":[1,3,3,-7],"_a":"TEBfRwgTUh1PQhRFAxgaTWlQGU4SBUoVHEIOTFITTw==","general":"Let `a = x + 1` and `b = 2`: `(a - b)(a^2 + ab + b^2) = (x - 1)((x + 1)^2 + 2(x + 1) + 4)`.","hints":["Treat `x + 1` as one quantity `a`.","`a^3 - 2^3 = (a - 2)(a^2 + 2a + 4)`.","`(x - 1)(x^2 + 2x + 1 + 2x + 2 + 4) = (x - 1)(x^2 + 4x + 7)`."]}],"m4":"Fully factored means every factor is linear or can’t be factored further."},{"id":"spot","type":"spot","title":"Spot the error","student":"Amara","how":"","instruction":"Amara made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Is `x + 3` a factor of `P(x) = x^3 - 2x^2 - 5x + 6`?","steps":["Test `x = 3`: `P(3) = 27 - 18 - 15 + 6 = 0`.","So `x + 3` is a factor."],"_a":"Bw==","stepFb":["","Step 2 follows step 1’s choice. The mistake is earlier."],"fixes":[{"t":"Test `x = 0`: `P(0) = 6`.","why":"`x = 0` tests the factor `x`.","_n":"1kf53","_k":"180e7444"},{"t":"Step 1 is correct.","why":"`P(3) = 0` tells you about `x - 3`, not `x + 3`.","_n":"1le83","_k":"3889ecc3"},{"t":"`P(3) = 0`, so `x - 3` and `x + 3` are both factors.","why":"Each factor needs its own test.","_n":"1me73","_k":"f30014c5"},{"t":"Test `x = -3`, the zero of `x + 3`: `P(-3) = -27 - 18 + 15 + 6 = -24 ≠ 0`, so `x + 3` is \u003cstrong>not\u003c/strong> a factor (`x - 3` is).","why":"`P(3) = 0` means `x - 3` is a factor: the factor is zero at `x = 3`.","_n":"1n5e3","_k":"5ce7b83f"}],"hints":["Which `x` makes `x + 3 = 0`?","−3.","`P(-3) = -24`: not a factor."]},{"id":"e2","goal":5,"task":"Factor `8x^3 + 27`.","steps":["`8x^3 = (2x)^3` and 27 = 3³.","`a^3 + b^3 = (a + b)(a^2 + ab + b^2)`.","So `8x^3 + 27 = (2x + 3)(4x^2 + 6x + 9)`."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 uses step 2’s pattern. The mistake is earlier."],"fixes":[{"t":"`(2x + 3)^3`.","why":"`(2x + 3)^3` has extra terms.","_n":"1o5f3","_k":"d9903456"},{"t":"Step 2 is correct.","why":"Expand `(a + b)(a^2 + ab + b^2)`: it gives `a^3 + 2a^2b + 2ab^2 + b^3`.","_n":"1p603","_k":"e7e68172"},{"t":"`a^3 + b^3 = (a + b)(a^2 - ab + b^2)`, so `(2x + 3)(4x^2 - 6x + 9)`.","why":"`a^3 + b^3 = (a + b)(a^2 - ab + b^2)`: same sign, opposite sign, always plus.","_n":"1q613","_k":"3f58d741"},{"t":"`(2x - 3)(4x^2 + 6x + 9)`.","why":"That’s the difference pattern.","_n":"1r623","_k":"413c6752"}],"hints":["Check the pattern by expanding.","Same, Opposite, Always plus.","`(2x + 3)(4x^2 - 6x + 9)`."]},{"id":"e3","goal":4,"task":"Factor `x^3 - 2x^2 - 9x + 18`.","steps":["`(x^3 - 2x^2) + (-9x + 18)`.","`x^2(x - 2) - 9(x + 2)`.","The brackets differ, so grouping fails."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows from step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"Expand `-9(x + 2)`: `-9x - 18`, not `-9x + 18`.","_n":"1s633","_k":"440ada0e"},{"t":"`-9(x - 18)`.","why":"−9 × −18 = 162.","_n":"1t643","_k":"7e910ec2"},{"t":"`9(x - 2)`.","why":"`9(x - 2) = 9x - 18`: the sign of `-9x` is lost.","_n":"1u653","_k":"7a05b376"},{"t":"`-9x + 18 = -9(x - 2)`, so `(x - 2)(x^2 - 9) = (x - 2)(x - 3)(x + 3)`.","why":"Taking out −9 from `-9x + 18` leaves `(x - 2)`, not `(x + 2)`. Check by expanding.","_n":"1v663","_k":"081b95d5"}],"hints":["Expand step 2’s second group.","It should give `-9x + 18`.","`-9(x - 2)`: the brackets match."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the root hunter: how short the candidate list is, or the irrational zeros?"},{"id":"j2","q":"In your own words, why is `x - b` a factor exactly when `P(b) = 0`?"},{"id":"j3","q":"Explain to a friend how the volume model shows `a^3 - b^3 = (a - b)(a^2 + ab + b^2)`."},{"id":"j4","q":"Which factoring method do you reach for last? What will remind you to try it earlier?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a factor of `P(x) = x^3 - 4x^2 + x + 6`?","options":[{"t":"`x - 1`","why":"`P(1) = 4`.","_n":"1w673","_k":"5ad0a0a6"},{"t":"`x + 1`","why":"`P(-1) = -1 - 4 - 1 + 6 = 0`.","_n":"1x643","_k":"d2c10be9"},{"t":"`x + 3`","why":"`P(3) = 0` makes `x - 3` a factor; `P(-3) = -60`.","_n":"1y633","_k":"9bb36660"},{"t":"`x + 2`","why":"`P(2) = 0` makes `x - 2` a factor; `P(-2) = -20`.","_n":"1z623","_k":"b6a9845a"}]},"b":{"prompt":"Which is a factor of `P(x) = x^3 - 2x^2 - 5x + 6`?","options":[{"t":"`x + 3`","why":"`P(3) = 0` makes `x - 3` a factor; `P(-3) = -24`.","_n":"20613","_k":"20f70626"},{"t":"`x - 2`","why":"`P(2) = -4`.","_n":"21683","_k":"25826172"},{"t":"`x + 2`","why":"`P(-2) = -8 - 8 + 10 + 6 = 0`.","_n":"22673","_k":"06df81bd"},{"t":"`x + 1`","why":"`P(1) = 0` makes `x - 1` a factor; `P(-1) = 8`.","_n":"23663","_k":"a598f4e6"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"By the rational zero theorem, which could be a zero of `3x^3 - 4x^2 + x - 2`?","options":[{"t":"2/3","why":"`p = 2` divides −2 and `q = 3` divides 3.","_n":"24653","_k":"82ea0a41"},{"t":"3/2","why":"Upside down: `q` must divide 3, the leading coefficient.","_n":"256c3","_k":"b93bacb1"},{"t":"3","why":"3 doesn’t divide the constant −2.","_n":"266b3","_k":"e03983eb"},{"t":"4","why":"4 is a coefficient, not a divisor of −2.","_n":"27725","_k":"eff2e2e3"}]},"b":{"prompt":"By the rational zero theorem, which could be a zero of `2x^3 + x^2 - 5x + 3`?","options":[{"t":"2/3","why":"Upside down.","_n":"28735","_k":"99aa7c15"},{"t":"3/2","why":"`p = 3` divides 3 and `q = 2` divides 2.","_n":"29705","_k":"75f15c18"},{"t":"2","why":"2 doesn’t divide the constant 3.","_n":"2a715","_k":"c58c6bd6"},{"t":"5","why":"5 is a coefficient, not a divisor of 3.","_n":"2b765","_k":"bb6577b6"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Factor `x^3 - 125`.","options":[{"t":"`(x - 5)(x^2 - 5x + 25)`","why":"Middle sign: opposite of the first factor’s sign, so +.","_n":"2c775","_k":"57eb285e"},{"t":"`(x - 5)(x^2 + 25)`","why":"The `ab` term is missing.","_n":"2d745","_k":"13cd2b3e"},{"t":"`(x - 5)(x^2 + 5x + 25)`","why":"Same sign, Opposite sign, Always plus, with `a = x` and `b = 5`.","_n":"2e755","_k":"8c6b9a59"},{"t":"`(x - 5)^3`","why":"`(x - 5)^3` has extra terms.","_n":"2f6a5","_k":"54ec11ae"}]},"b":{"prompt":"Factor `x^3 + 216`.","options":[{"t":"`(x + 6)(x^2 + 6x + 36)`","why":"Middle sign: opposite of the first factor’s sign, so −.","_n":"2g6b5","_k":"16625e14"},{"t":"`(x + 6)(x^2 - 6x + 36)`","why":"Same sign, Opposite sign, Always plus, with `a = x` and `b = 6`.","_n":"2h785","_k":"da0e8161"},{"t":"`(x + 6)^3`","why":"`(x + 6)^3` has extra terms.","_n":"2i775","_k":"2003fa9c"},{"t":"`(x + 6)(x^2 + 36)`","why":"The `ab` term is missing.","_n":"2j7a5","_k":"610ee081"}]}},{"id":"t1","cat":"T","goal":6,"a":{"prompt":"For which `k` is `x - 2` a factor of `x^3 + kx^2 - 5x + 6`?","options":[{"t":"−2","why":"That makes `P(-2) = 0`.","_n":"2k795","_k":"cf62796c"},{"t":"−1","why":"`P(2) = 8 + 4k - 10 + 6 = 4k + 4 = 0`.","_n":"2l745","_k":"09143b29"},{"t":"1/2","why":"That drops the constant 6: `8 + 4k - 10 = 0`.","_n":"2m735","_k":"4ccd46ec"},{"t":"1","why":"Sign slip: `4k + 4 = 0` gives `k = -1`.","_n":"2n765","_k":"e725701a"}]},"b":{"prompt":"For which `k` is `x + 1` a factor of `2x^3 + kx^2 - x - 6`?","options":[{"t":"−7","why":"Sign slip: `k - 7 = 0` gives `k = 7`.","_n":"2o755","_k":"d557cc6c"},{"t":"1","why":"That drops the constant −6: `-2 + k + 1 = 0`.","_n":"2p705","_k":"3a7074de"},{"t":"5","why":"That makes `P(1) = 0`.","_n":"2q6f5","_k":"d02d7e9a"},{"t":"7","why":"`P(-1) = -2 + k + 1 - 6 = k - 7 = 0`.","_n":"2rf51","_k":"e03239a5"}]}},{"id":"t2","cat":"T","goal":[3,4],"a":{"prompt":"Fully factor `x^3 - 3x^2 - 4x + 12`.","options":[{"t":"`(x - 3)(x^2 - 4)`","why":"`x^2 - 4` factors further.","_n":"2sf41","_k":"61fcd06e"},{"t":"`(x - 3)(x - 2)^2`","why":"`x^2 - 4` is `(x - 2)(x + 2)`, not `(x - 2)^2`.","_n":"2tf31","_k":"75f0183a"},{"t":"`(x - 3)(x - 2)(x + 2)`","why":"`x^2(x - 3) - 4(x - 3) = (x - 3)(x^2 - 4)`.","_n":"2uf21","_k":"eea1a751"},{"t":"`(x + 3)(x - 2)(x + 2)`","why":"The shared bracket is `(x - 3)`.","_n":"2vf11","_k":"d6bbceea"}]},"b":{"prompt":"Fully factor `x^3 + 2x^2 - 25x - 50`.","options":[{"t":"`(x + 2)(x - 5)(x + 5)`","why":"`x^2(x + 2) - 25(x + 2) = (x + 2)(x^2 - 25)`.","_n":"2wf01","_k":"7dccd9b1"},{"t":"`(x - 2)(x - 5)(x + 5)`","why":"The shared bracket is `(x + 2)`.","_n":"2xef1","_k":"2b56eee6"},{"t":"`(x + 2)(x - 5)^2`","why":"`x^2 - 25` is `(x - 5)(x + 5)`.","_n":"2yee1","_k":"9ad9f8e4"},{"t":"`(x + 2)(x^2 - 25)`","why":"`x^2 - 25` factors further.","_n":"2zed1","_k":"50b3b502"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"`P(x) = 3x^3 + 4x^2 - 13x + 6` has `P(2/3) = 0`. Which is the full factorization?","options":[{"t":"`(3x - 2)(x - 3)(x + 1)`","why":"Signs: `(x - 3)(x + 1) = x^2 - 2x - 3`, not `x^2 + 2x - 3`.","_n":"30ec1","_k":"b22026e4"},{"t":"`(x - 2/3)(x + 3)(x - 1)`","why":"That’s `P(x) ÷ 3`: the leading coefficient 3 is lost.","_n":"31ef1","_k":"1012b7d4"},{"t":"`(3x - 2)(x + 3)(x - 1)`","why":"`(3x - 2)` is a factor; the quotient is `x^2 + 2x - 3 = (x + 3)(x - 1)`.","_n":"32f01","_k":"98f8e32f"},{"t":"`(3x - 2)(x^2 + 2x - 3)`","why":"The quadratic factors further.","_n":"33f11","_k":"72c9f418"}]},"b":{"prompt":"`P(x) = 2x^3 - 5x^2 - 4x + 3` has `P(1/2) = 0`. Which is the full factorization?","options":[{"t":"`(2x - 1)(x^2 - 2x - 3)`","why":"The quadratic factors further.","_n":"34f21","_k":"a72b8748"},{"t":"`(2x - 1)(x + 3)(x - 1)`","why":"Signs: that quadratic is `x^2 + 2x - 3`.","_n":"35eb1","_k":"f9e503ec"},{"t":"`(x - 1/2)(x - 3)(x + 1)`","why":"That’s `P(x) ÷ 2`.","_n":"36ec1","_k":"602bad0a"},{"t":"`(2x - 1)(x - 3)(x + 1)`","why":"Quotient `x^2 - 2x - 3 = (x - 3)(x + 1)`.","_n":"37ed1","_k":"003bc9ff"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is a correct statement of the factor theorem?","options":[{"t":"`x - b` is a factor of `P(x)` if and only if `P(b) = 0`.","why":"The factor `x - b` is zero at `x = b`, so dividing leaves the remainder `P(b)`, and a factor leaves remainder 0.","_n":"38ee1","_k":"abdfe6b1"},{"t":"`x - b` is a factor of `P(x)` if and only if `P(0) = b`.","why":"That’s about the `y`-intercept.","_n":"39e71","_k":"9b4937a9"},{"t":"`x - b` is a factor of `P(x)` if and only if `P(-b) = 0`.","why":"`x - b` is zero at `x = b`, not at `x = -b`.","_n":"3ae81","_k":"841fc16e"},{"t":"`x - b` is a factor of `P(x)` if and only if the remainder is `b`.","why":"A factor leaves remainder 0.","_n":"3b612","_k":"d000c758"}]},"b":{"prompt":"Which is a correct statement of the factor theorem for `ax - b`?","options":[{"t":"`ax - b` is a factor of `P(x)` if and only if `P(b/a) = 0`.","why":"`ax - b = 0` at `x = b/a`.","_n":"3c602","_k":"27731d27"},{"t":"`ax - b` is a factor of `P(x)` if and only if `P(-b/a) = 0`.","why":"Sign: `ax - b = 0` gives `x = b/a`, not `-b/a`.","_n":"3d632","_k":"351873a4"},{"t":"`ax - b` is a factor of `P(x)` if and only if `P(a/b) = 0`.","why":"Upside down: `ax - b = 0` gives `x = b/a`.","_n":"3e622","_k":"c94bc670"},{"t":"`ax - b` is a factor of `P(x)` if and only if `P(b) = 0`.","why":"The zero of `ax - b` is `b/a`.","_n":"3f5d2","_k":"c328e73c"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"`x^3 - 8 = (x - 2)(x^2 + 2x + 4)`. Which is the best explanation of why `x^2 + 2x + 4` doesn’t factor further?","options":[{"t":"Its discriminant `2^2 - 4(1)(4) = -12` is negative, so it has no real zeros and no real linear factors.","why":"No real zeros means no real linear factors.","_n":"3g5c2","_k":"03fab4b1"},{"t":"Because 4 is a perfect square.","why":"That has nothing to do with factoring.","_n":"3h5f2","_k":"ac9a1a34"},{"t":"Because it has a plus sign in the middle.","why":"`x^2 + 5x + 4` has a plus sign and factors.","_n":"3i5e2","_k":"bf05b1e2"},{"t":"Because it’s a perfect square.","why":"`(x + 2)^2 = x^2 + 4x + 4`, not `x^2 + 2x + 4`.","_n":"3j692","_k":"9b376ee8"}]},"b":{"prompt":"`8x^3 + 27 = (2x + 3)(4x^2 - 6x + 9)`. Which is the best explanation of why it is fully factored?","options":[{"t":"Because every cube factorization stops at two factors.","why":"`x^3 - x = x(x - 1)(x + 1)` has three.","_n":"3k682","_k":"e5029f24"},{"t":"Because `4x^2 - 6x + 9 = (2x - 3)^2`.","why":"`(2x - 3)^2 = 4x^2 - 12x + 9`.","_n":"3l5b2","_k":"f51ffc44"},{"t":"Because 9 is a perfect square.","why":"Irrelevant.","_n":"3m5c2","_k":"a1b762c0"},{"t":"`4x^2 - 6x + 9` has discriminant 36 − 144 = −108 \u003c 0, so it has no real zeros and can’t split into real linear factors.","why":"No real zeros means no real linear factors.","_n":"3n592","_k":"68972072"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A box has volume `V(x) = x^3 + 2x^2 - 5x - 6` cm³, and its edges are linear expressions in `x`. One edge is `x + 1`. What are the box’s dimensions when `x = 5`?","options":[{"t":"6 cm, 7 cm and 2 cm","why":"That uses `(x + 2)(x - 3)`: signs flipped. 6 × 7 × 2 = 84 ≠ 144.","_n":"3o5a2","_k":"a5f4033c"},{"t":"6 cm, 4 cm and 11 cm","why":"`(x - 1)(x + 6) = x^2 + 5x - 6`, not `x^2 + x - 6`.","_n":"3p5f2","_k":"b5742a8c"},{"t":"6 cm, 6 cm and −1 cm","why":"A length can’t be negative; `(x + 1)(x - 6)` is the wrong quotient.","_n":"3q602","_k":"8247e0de"},{"t":"6 cm, 3 cm and 8 cm","why":"`V = (x + 1)(x^2 + x - 6) = (x + 1)(x - 2)(x + 3)`. At `x = 5`: 6, 3, 8 (and 6 × 3 × 8 = 144 = `V(5)`).","_n":"3r5d2","_k":"8dcfb3bb"}]},"b":{"prompt":"A box has volume `V(x) = x^3 - x^2 - 10x - 8` cm³. One edge is `x + 1`. What are the box’s dimensions when `x = 6`?","options":[{"t":"7 cm, 5 cm and 14 cm","why":"`(x - 1)(x + 8)` is the wrong quotient.","_n":"3s5e2","_k":"26383544"},{"t":"7 cm, 2 cm and 8 cm","why":"`V = (x + 1)(x - 4)(x + 2)`. At `x = 6`: 7, 2, 8 (7 × 2 × 8 = 112 = `V(6)`).","_n":"3t632","
