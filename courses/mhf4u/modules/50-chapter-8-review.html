.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 50: hero caption, per-topic tables, Connect (Combination detective, one page), mixed practice, task */
.hero .hero-eq.sm{font-size:clamp(1.45rem,3.4vw,2.3rem);line-height:1.25}
.hero .hero-eq.sm .m{white-space:nowrap}
#hero-cap{font:400 .95rem/1.5 var(--font-ui);color:var(--ink-2);display:grid;gap:2px}
#hero-cap .hc-l{display:block}
#hero-cap .hc-l.cur{color:var(--ink);font-weight:600}
#hero-cap .hc-l.wait{visibility:hidden}
#hero-cap .m{white-space:normal}
/* toolkit workaround: the visually hidden "(done)" text in a step button escaped the scrolling step bar on phones */
.steps .step{position:relative}
/* per-topic tables */
.tt-wrap{overflow-x:auto;margin:10px 0}
.tt td:nth-child(2){white-space:nowrap}
.tt td:last-child{white-space:nowrap}
.tt tr.tt-rev td{border-bottom:0}
.tt tr.tt-more td{padding-top:0;white-space:normal}
.tt-key{padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.tt-key p{margin:0 0 .3em;max-width:none}
.tt-key p:last-child{margin:0}

/* Connect: Combination detective */
.c8-sus{margin:0 0 12px;padding:8px 12px;border:1.5px solid var(--rule);border-left:5px solid var(--ink);border-radius:8px;background:var(--sheet);max-width:none}
.cv-chal{border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--paper)}
.cv-top{flex-wrap:wrap}
.cv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.cv-top .dots{flex:0 0 auto}
.cv-nav{border-top:1px solid var(--rule);padding-top:10px;margin-top:12px}
.c8-ct{margin:0 0 8px;font:700 .85rem var(--font-ui);color:var(--ink-2);letter-spacing:.02em}
.c8-face{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 14px;margin:0 0 12px}
.c8-fl{display:block;font:700 .78rem var(--font-ui);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
.c8-eq{margin:4px 0;font-size:clamp(1.35rem,3.4vw,1.9rem);max-width:none}
.c8-eq .m{white-space:normal}
.c8-gwrap{max-width:420px}
.c8-gcap{margin:6px 0 0;font-size:.95rem;color:var(--ink-2);max-width:none}
.c8-tw{max-width:100%}
.c8-tb{min-width:0;width:auto}
.c8-tb th,.c8-tb td{min-width:3em}
.c8-ask{margin:4px 0 8px;font-weight:700;max-width:none}
.c8-chips{display:flex;flex-wrap:wrap;gap:8px}
.c8-chip{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.25em .95em;min-height:42px;min-width:56px;font:inherit;font-size:1.05rem;cursor:pointer}
.c8-chip .m{white-space:nowrap}
.c8-chip:not(:disabled):hover{border-color:var(--pen)}
.c8-chip:focus-visible,.c8-op:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.c8-chip.right{background:var(--good-bg);border-color:var(--green);color:var(--ink);font-weight:700;opacity:1}
.c8-chip.wrong{background:var(--bad-bg);border-color:var(--red);color:var(--ink);opacity:.85}
.c8-chip:disabled{cursor:default}
.c8-opts{display:grid;gap:8px}
.c8-op{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;min-height:44px;cursor:pointer}
.c8-op .m{white-space:normal}
.c8-op:not(:disabled):hover{border-color:var(--pen)}
.c8-op.right{background:var(--good-bg);border-color:var(--green);opacity:1}
.c8-op.wrong{background:var(--bad-bg);border-color:var(--red);opacity:.85}
.c8-op:disabled{cursor:default}
.c8-mk{flex:0 0 1.1em;font-weight:700}
.cv-chal .fb{margin-top:12px}
.c8-one{margin-top:18px}
.c8-one h3{margin:0 0 6px}
.c8-opw{margin-top:8px}
.c8-op1{border-collapse:collapse;width:100%;min-width:620px;font-size:.95rem}
.c8-op1 th,.c8-op1 td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
.c8-op1 thead th{font:700 .82rem var(--font-ui);color:var(--ink-2);background:var(--paper)}
.c8-op1 tbody th{font-weight:400;min-width:10.5em}
.c8-op1 tbody th .tag{margin-top:4px;display:inline-block}
.c8-op1 .m{white-space:normal}

/* Mixed practice */
@media (max-width:560px){
  .mx-q .q-head{flex-wrap:wrap}
  .mx-q .q-head .tags{order:-1;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
}
.mx-q .q-prompt{font-weight:700}
.mx-q .numrow{flex-wrap:wrap;align-items:center;gap:8px 18px}
.mx-pair{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.mx-cell{display:inline-flex;align-items:center;gap:8px}
.mx-lab .m{font-size:1.05rem}
.mx-unit{font-size:.95rem;color:var(--ink-2)}
.mx-sum{margin-top:6px}
.mx-figw{max-width:360px;margin:4px 0 10px}
.mx-yours{margin:8px 0}

/* Task: build a function to spec */
.c8-props{margin:6px 0 10px;padding-left:1.4em}
.c8-props li{margin:2px 0}
.c8-pk{--sc:var(--ink);margin:0 0 10px}
.c8-pk-u{--sc:var(--pen)}
.c8-pk-v{--sc:var(--f3)}
.c8-pk-lab{display:block;font:700 .9rem var(--font-ui);color:var(--ink-2);margin:0 0 4px}
.c8-pk-u .c8-pk-lab,.c8-pk-v .c8-pk-lab{font:400 1.15rem var(--font-math);color:var(--ink)}
.c8-pk-row{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.c8-pk-row button{border:2px solid var(--sc);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.15em .6em;min-height:42px;min-width:44px;font:400 1.08rem var(--font-math);cursor:pointer}
.c8-pk-row button[aria-checked="true"]{background:var(--sc);color:var(--sheet);font-weight:700;box-shadow:0 0 0 2px var(--sheet) inset}
.c8-pk-row .m{font-size:1em;white-space:nowrap}
.c8-pk-row .frac{font-size:.82em}
.c8-pk-row button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
@media (max-width:560px){
  .c8-pk-row{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
  .c8-pk-row button{flex:0 0 auto}
}
.c8-tcap{font-size:clamp(1.15rem,2.4vw,1.45rem);margin-top:10px}
.c8-tcap .m{white-space:normal}
.c8-th{margin:12px 0 6px}
.c8-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 0;font-size:1rem}
.c8-leg > span{display:inline-flex;align-items:center;gap:8px}
.c8-sw{display:inline-block;width:26px;height:4px;border-radius:2px;opacity:.6}
.c8-sw-h{height:6px;opacity:1}
.c8-ot{min-width:0}
.c8-ot th,.c8-ot td{white-space:nowrap}
.c8-tl{margin:6px 0;max-width:none}
.c8-tl .m{white-space:nowrap}
.c8-y,.c8-n{display:inline-block;min-width:1.2em;font-weight:700}
.c8-y{color:var(--green)}
.c8-n{color:var(--red)}
.c8-all{font-weight:600}
.mx-q .opt .m{white-space:nowrap}

do?","`2^{-x} → 0`.","Damped: swings shrink."]},{"id":"d5","topic":"48","goal":3,"prompt":"`f(x) = 2x + 1` and `g(x) = x^2`. Find `f(g(3))`.","options":[{"t":"16","why":"That’s `f(3) + g(3)`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"g791","_k":"59aced99"},{"t":"19","why":"`g(3) = 9`; `f(9) = 19`.","_n":"h761","_k":"4250b70a"},{"t":"49","why":"That’s `g(f(3)) = 7^2`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"i771","_k":"b2dbac75"},{"t":"63","why":"That’s `f(3) × g(3)`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"jf81","_k":"c2698df2"}],"hints":["Inside first.","`g(3) = 9`.","`f(9) = 19`."]},{"id":"d6","topic":"48","goal":4,"prompt":"`f(x) = √x` and `g(x) = x - 4`. What is the domain of `f(g(x))`?","options":[{"t":"`{x ∈ ℝ | x >= -4}`","why":"Sign slip.","_n":"kf71","_k":"a8635ad4"},{"t":"`{x ∈ ℝ | x >= 4}`","why":"`√{x - 4}` needs `x - 4 >= 0`.","_n":"lf61","_k":"ac867d5d"},{"t":"`{x ∈ ℝ}`","why":"That’s `g`’s domain.","_n":"mf51","_k":"0c78afd8"},{"t":"`{x ∈ ℝ | x >= 0}`","why":"That’s `f`’s domain, not the composition’s. `x` must be in `g`’s domain, and `g(x)` must be in `f`’s domain.","_n":"nfc1","_k":"a13ebe5d"}],"hints":["`g(x)` must be in `f`’s domain.","`x - 4 >= 0`.","`x >= 4`."]},{"id":"d7","topic":"48","goal":4,"prompt":"`f(x) = 3x - 6`. What is `f(f^{-1}(10))`?","options":[{"t":"16/3","why":"That’s `f^{-1}(10)`.","_n":"ofb1","_k":"01458f29"},{"t":"10","why":"A function undoes its inverse.","_n":"pfa1","_k":"a0c353b6"},{"t":"24","why":"That’s `f(10)`.","_n":"qf91","_k":"c89f0a30"},{"t":"30","why":"`f(f^{-1}(x)) = x`.","_n":"rf01","_k":"3ff9a812"}],"hints":["What does `f^{-1}` do?","`f` undoes it.","10."]},{"id":"d8","topic":"49","goal":5,"prompt":"A town’s population grows by 3% each year. Which kind of function models it best?","options":[{"t":"Exponential","why":"Growth by a constant percentage is a constant ratio.","_n":"sef1","_k":"009109f7"},{"t":"Linear","why":"Linear growth adds the same amount each year. Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"tf21","_k":"ac963ade"},{"t":"Sinusoidal","why":"Nothing repeats. Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"uf31","_k":"1c4abbda"},{"t":"Quadratic","why":"Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"vf41","_k":"048bdbc2"}],"hints":["Constant percentage growth means…","Multiply by 1.03 each year.","Exponential."]}]}},"connect":{"heading":"Combination detective","intro":"Every module in Chapter 8 built a combination forward. The detective works backward: given a combined function, which operation made it? Look for each operation’s fingerprint in an equation, a table or a graph.","summary":"Combination detective","suspects":"\u003cstrong>The suspects:\u003c/strong> `f(x) = x^2` and `g(x) = x + 1`. For each case, choose the operation that built `h`.","how":"Tap the operation that built `h`.","ui":{"suspects":"The suspects","ask":"Which operation built `h`?","askPair":"Which pair and which order? Tap one.","prev":"Previous case","next":"Next case","caseOf":"Case §1 of §2","faces":{"eq":"Equation","graph":"Graph","table":"Table"},"stretch":"Stretch","eqFb":"That’s §1, not `h`.","tblFb":"§1 gives §2 at `x` = 0, 1, 2, not 1, 2, 5.","tblHead":["`x`","0","1","2"],"tblRow":["`h(x)`","1","2","5"],"graphAria":"Graph of h: a vertical asymptote at x = −1. To the right of it, the graph comes down from very high values, touches the x-axis at the origin and rises again. To the left of it, the graph stays below the x-axis, with a highest point at (−2, −4), and falls toward the asymptote.","waitOne":"§1 of §2 cases solved. “The chapter on one page” appears when all §2 are solved."},"ops":[{"id":"sum","t":"`f + g`","is":"`f + g = x^2 + x + 1`","tbl":"1, 3, 7","gr":"`f + g = x^2 + x + 1` is a parabola: it has no asymptote."},{"id":"dif","t":"`f - g`","is":"`f - g = x^2 - x - 1`","tbl":"−1, −1, 1","gr":"`f - g = x^2 - x - 1` is a parabola: it has no asymptote."},{"id":"prod","t":"`f · g`","is":"`f · g = x^2(x + 1) = x^3 + x^2`","tbl":"0, 2, 12","gr":"`f · g = x^3 + x^2` is a cubic: it has no asymptote."},{"id":"quot","t":"`f/g`","is":"`f/g = {x^2}/{x + 1}`","tbl":"0, 1/2, 4/3","gr":"`f/g` has an asymptote where `g = 0`."},{"id":"fg","t":"`f(g(x))`","is":"`f(g(x)) = (x + 1)^2`","tbl":"1, 4, 9","gr":"`f(g(x)) = (x + 1)^2` is a parabola that touches the `x`-axis at −1: no asymptote."},{"id":"gf","t":"`g(f(x))`","is":"`g(f(x)) = x^2 + 1`","tbl":"1, 2, 5","gr":"`g(f(x)) = x^2 + 1` is a parabola with no zeros and no asymptote."}],"cases":[{"id":"CD1","topic":"46","goal":[6,1],"face":"eq","h":"`h(x) = x^2 + x + 1`","_a":"RBFGWBU=","why":"`f + g = x^2 + (x + 1) = x^2 + x + 1`: the heights add.","fb":{"gf":"That’s `x^2 + 1`, with no `x` term."}},{"id":"CD2","topic":"48","goal":[6,3],"face":"eq","h":"`h(x) = (x + 1)^2`","_a":"RARUFw==","why":"`f(g(x)) = f(x + 1) = (x + 1)^2`: add 1 first, then square.","fb":{"gf":"That adds 1 \u003cstrong>after\u003c/strong> squaring. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters."}},{"id":"CD3","topic":"48","goal":[6,3],"face":"eq","h":"`h(x) = x^2 + 1`","_a":"RAVVFw==","why":"`g(f(x)) = g(x^2) = x^2 + 1`: square first, then add 1.","fb":{"fg":"That squares `x + 1`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters."}},{"id":"CD4","topic":"47","goal":[6,2],"face":"eq","h":"`h(x) = x^3 + x^2`","_a":"RBJBWlMW","why":"`f · g = x^2(x + 1) = x^3 + x^2`: its zeros, 0 and −1, come from the two factors.","tip":"Expand `x^2(x + 1)`.","fb":{}},{"id":"CD5","topic":"46","goal":[6,1],"face":"eq","h":"`h(x) = x^2 - x - 1`","_a":"RAZaUxU=","why":"`f - g = x^2 - (x + 1) = x^2 - x - 1`: subtract every term of `g`.","tip":"`x^2 - (x + 1)`.","fb":{}},{"id":"CD6","topic":"47","goal":[6,2],"face":"graph","h":"A graph with a vertical asymptote at `x = -1` and a zero that touches at 0","_a":"RBNGWkMW","why":"`f/g = {x^2}/{x + 1}`: the zero of `g` at −1 becomes the asymptote, and the double zero of `f` at 0 makes the graph touch.","fb":{"prod":"A product has no asymptotes; the asymptote is where `g = 0`."}},{"id":"CD7","topic":"48","goal":[6,3],"face":"table","stretch":true,"h":"A table: `x` = 0, 1, 2 → `h` = 1, 2, 5","_a":"RAVVFw==","why":"`g(f(x)) = x^2 + 1` gives 1, 2, 5 at `x` = 0, 1, 2.","fb":{"sum":"At `x = 1` that gives 3, not 2."}},{"id":"CD8","topic":"48","goal":[6,4],"face":"eq","stretch":true,"h":"`h(x) = 2^{sin x}`","ask":"Which pair of functions and which order build it?","options":[{"t":"Outside `u = sin x`, inside `v = 2^x`: `u(v(x))`","why":"`sin(2^x)` puts `2^x` inside.","_n":"wf51","_k":"76d6c886"},{"t":"Outside `u = 2^x`, inside `v = sin x`: `u(v(x))`","why":"`sin x` is computed first and becomes the exponent: `u(v(x)) = 2^{sin x}`.","_n":"xf61","_k":"0b5fd319"},{"t":"`u = 2^x` and `v = sin x`, multiplied: `u · v`","why":"That’s `2^x sin x`: the sine multiplies instead of sitting in the exponent.","_n":"yf71","_k":"77aacf6a"},{"t":"`u = 2^x` and `v = sin x`, added: `u + v`","why":"That’s `2^x + sin x`: the heights add instead of the sine sitting in the exponent.","_n":"zf81","_k":"f8ba5262"}]}],"onePage":{"title":"The chapter on one page","intro":"Each operation leaves its own fingerprint and has its own domain rule. The last column shows what each one builds from the suspects `f(x) = x^2` and `g(x) = x + 1`.","head":["Operation","Fingerprint","Domain","From `f = x^2`, `g = x + 1`"],"rows":[{"op":"`(f + g)(x) = f(x) + g(x)`","fp":"Heights add point by point.","dom":"The overlap of the two domains.","ex":"`x^2 + x + 1`","mods":"46"},{"op":"`(f - g)(x) = f(x) - g(x)`","fp":"Heights subtract point by point.","dom":"The overlap of the two domains.","ex":"`x^2 - x - 1`","mods":"46"},{"op":"`(f · g)(x) = f(x) · g(x)`","fp":"Zeros multiply: a zero of either factor is a zero of the product. An envelope damps a wave.","dom":"The overlap of the two domains.","ex":"`x^3 + x^2`","mods":"47"},{"op":"`(f/g)(x) = f(x) ÷ g(x)`","fp":"Asymptotes from `g`’s zeros (or holes, if a factor cancels).","dom":"The overlap, minus the zeros of `g`.","ex":"`{x^2}/{x + 1}`","mods":"47"},{"op":"`f(g(x))`","fp":"`g`’s output goes into `f`: order matters.","dom":"Inputs of `g` whose outputs `f` accepts.","ex":"`(x + 1)^2`, but `g(f(x)) = x^2 + 1`","mods":"48"}]}},"mixed":{"heading":"Mixed practice","intro":"Twelve questions from every module in Chapter 8, mixed up on purpose, so you practise choosing the right idea. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Twelve questions from all four modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"48","goal":4,"kind":"mc","star":true,"prompt":"`f(x) = x^2 - 1` and `g(x) = 1/x`. What are the domain and range of `f(g(x))`?","options":[{"t":"Domain `{x ∈ ℝ | x != 0}`; range `{y ∈ ℝ | y > 0}`","why":"Values between −1 and 0 are reached too: at `x = 2`, `1/4 - 1 = -3/4`.","_n":"10f91","_k":"1f641ec8"},{"t":"Domain `{x ∈ ℝ | x != 0}`; range `{y ∈ ℝ | y >= -1}`","why":"`1/x^2` is never 0, so −1 is never reached.","_n":"11ea1","_k":"e800b5b0"},{"t":"Domain `{x ∈ ℝ | x != 0}`; range `{y ∈ ℝ | y > -1}`","why":"`f(g(x)) = 1/x^2 - 1`. `g` needs `x != 0`, and `1/x^2` takes every positive value but never 0, so `y > -1`.","_n":"12eb1","_k":"365179bb"},{"t":"Domain `{x ∈ ℝ}`; range `{y ∈ ℝ | y > -1}`","why":"`g(0) = 1/0` is undefined. `x` must be in `g`’s domain, and `g(x)` must be in `f`’s domain.","_n":"13fc2","_k":"9eaef600"}],"hints":["Write `f(g(x))` first. Which `x` can go into `g`?","`f(g(x)) = (1/x)^2 - 1 = 1/x^2 - 1`, and `g` needs `x != 0`.","Domain `x != 0`. `1/x^2` takes every positive value but never 0, so `1/x^2 - 1 > -1`: the range is `{y ∈ ℝ | y > -1}`."]},{"id":"mp2","topic":"46","goal":1,"kind":"mc","fixedOrder":true,"prompt":"`f(x) = x` and `g(x) = x^3`. Is `f + g` even, odd or neither?","options":[{"t":"Even","why":"`h(-x) = -x - x^3 = -h(x)`.","_n":"14fb2","_k":"2f14e902"},{"t":"Odd","why":"`h(-x) = -x - x^3 = -h(x)`: odd + odd is odd.","_n":"15fe2","_k":"b7747983"},{"t":"Neither","why":"Check: `h(-x) = -x - x^3`, which is exactly `-h(x)`.","_n":"16fd2","_k":"5b3e828e"}],"hints":["Find `h(-x)` for `h(x) = x + x^3`.","`h(-x) = -x + (-x)^3 = -x - x^3`.","`-x - x^3 = -(x + x^3) = -h(x)`, so `f + g` is odd."]},{"id":"mp3","topic":"49","goal":5,"kind":"mc","prompt":"Data: `x` = 0, 1, 2, 3 → `y` = 2, 6, 18, 54. Which model fits best?","options":[{"t":"`y = 2 sin x + 2`","why":"Nothing repeats: the values keep tripling.","_n":"17f82","_k":"d1bfa97b"},{"t":"`y = 2 · 3^x`","why":"Each `y` is 3 times the one before: a constant ratio, so exponential. `2 · 3^3 = 54`.","_n":"18f72","_k":"39a8692c"},{"t":"`y = 4x + 2`","why":"The differences aren’t constant: 4, 12, 36. Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"19fa2","_k":"d7ecbc08"},{"t":"`y = 2x^2 + 2`","why":"`y(3) = 20`.","_n":"1af92","_k":"69aeb278"}],"hints":["Look at the differences, then the ratios.","Differences: 4, 12, 36. Ratios: 6 ÷ 2 = 3, 18 ÷ 6 = 3, 54 ÷ 18 = 3.","A constant ratio of 3, starting at 2: `y = 2 · 3^x`."]},{"id":"mp4","topic":"47","goal":2,"kind":"mc","fixedOrder":true,"prompt":"Is `y = x sin x` even, odd or neither?","options":[{"t":"Even","why":"`(-x) sin(-x) = (-x)(-sin x) = x sin x`: odd × odd = even.","_n":"1bf42","_k":"a8bdb8ad"},{"t":"Odd","why":"`x` and `sin x` are both odd: odd × odd = even.","_n":"1cf32","_k":"d1a52d80"},{"t":"Neither","why":"Test it: `h(-x) = (-x) sin(-x) = x sin x = h(x)`.","_n":"1df62","_k":"a0c2a8de"}],"hints":["Is each factor even or odd?","`x` is odd and `sin x` is odd.","odd × odd = even: `h(-x) = (-x)(-sin x) = x sin x = h(x)`."]},{"id":"mp5","topic":"48","goal":4,"kind":"mc","prompt":"Write `h(x) = (3x - 1)^5` as `f(g(x))`.","options":[{"t":"`f(x) = x^5 - 1`, `g(x) = 3x`","why":"That gives `(3x)^5 - 1`.","_n":"1ef72","_k":"4b0975ca"},{"t":"`f(x) = x^5`, `g(x) = 3x - 1`","why":"The inside, `3x - 1`, goes into the outside, `x^5`.","_n":"1ff42","_k":"8f34bba1"},{"t":"`f(x) = 3x - 1`, `g(x) = x^5`","why":"That gives `3x^5 - 1`.","_n":"1gf52","_k":"66db02aa"},{"t":"`f(x) = x^5`, `g(x) = 3x`","why":"That gives `(3x)^5`: the −1 is missing.","_n":"1hfa2","_k":"7a4ba0a9"}],"hints":["What’s done to `x` first? That’s the inside, `g`.","Inside: `3x - 1`. Then the result is raised to the 5th power.","`g(x) = 3x - 1` and `f(x) = x^5`."]},{"id":"mp6","topic":"46","goal":1,"kind":"mc","prompt":"What is `y = sin x + sin(x + π)`?","options":[{"t":"0 for every `x`","why":"`sin(x + π) = -sin x`, so the two waves cancel at every `x`.","_n":"1ifb2","_k":"90bf986c"},{"t":"`2 sin(x + π/2)`","why":"The waves are half a period apart, so they cancel: no wave is left.","_n":"1jf82","_k":"42c29906"},{"t":"`2 sin x`","why":"That needs the waves in step, but `sin(x + π) = -sin x`.","_n":"1kf92","_k":"51fe956a"},{"t":"`sin(2x + π)`","why":"Adding waves adds heights, not arguments.","_n":"1lee2","_k":"4bf1f6d8"}],"hints":["How does `sin(x + π)` compare with `sin x`?","`sin(x + π) = -sin x`: the same wave, flipped.","`sin x + (-sin x) = 0` for every `x`."]},{"id":"mp7","topic":"49","goal":5,"kind":"num","star":true,"prompt":"Revenue is `R(p) = p(400 - 20p)` dollars at price `p`. Which price maximizes revenue?","label":"Price `p` =","unit":"dollars","_a":"V1I=","display":"$10","keypad":"decimal","why":"The zeros are 0 and 20, and the parabola opens down, so the maximum is halfway between them: `p = 10`, where `R(10) = 10 × 200 = 2000` dollars.","wrong":[{"match":20,"fb":"That’s where revenue is 0; the maximum is halfway between the zeros 0 and 20."}],"hints":["Find the zeros of `R(p)`.","`p = 0`, and `400 - 20p = 0` gives `p = 20`.","The maximum is halfway between 0 and 20: `p = 10`."]},{"id":"mp8","topic":"47","goal":2,"kind":"mc","star":true,"prompt":"`f(x) = x^2 - 4` and `g(x) = x - 2`. Describe `f/g`.","options":[{"t":"`y = x + 2`, with a hole at (2, 4)","why":"`{x^2 - 4}/{x - 2} = {(x - 2)(x + 2)}/{x - 2} = x + 2` for `x != 2`, so there’s a hole at (2, 4).","_n":"1mef2","_k":"446472b9"},{"t":"`y = x - 2`","why":"Factor: `x^2 - 4 = (x - 2)(x + 2)`, so the quotient is `x + 2`.","_n":"1nf01","_k":"c599eb17"},{"t":"A vertical asymptote `x = 2`","why":"The factor cancels, so it’s a hole, not an asymptote.","_n":"1oef1","_k":"a6d21211"},{"t":"`y = x + 2` for all `x`","why":"`x = 2` is still excluded. Dividing by `g(x)` is impossible where `g(x) = 0`.","_n":"1pee1","_k":"a0ac783d"}],"hints":["Factor `x^2 - 4`.","`{(x - 2)(x + 2)}/{x - 2}`: the factor `x - 2` cancels, but `x = 2` is still excluded.","`y = x + 2` for `x != 2`: a hole at (2, 4)."]},{"id":"mp9","topic":"48","goal":4,"kind":"mc","star":true,"prompt":"`f(x) = 2x + 3` and `f(g(x)) = 6x - 1`. What is `g(x)`?","options":[{"t":"`3x - 2`","why":"`2g(x) + 3 = 6x - 1`, so `g(x) = 3x - 2`.","_n":"1qed1","_k":"21d373ae"},{"t":"`3x - 1/2`","why":"Check: `2(3x - 1/2) + 3 = 6x + 2`. Subtract 3 before you divide by 2.","_n":"1rec1","_k":"44c0e255"},{"t":"`3x + 2`","why":"Check: `2(3x + 2) + 3 = 6x + 7`. Sign slip: `-1 - 3 = -4`.","_n":"1seb1","_k":"337d2fa9"},{"t":"`6x - 4`","why":"Check: `2(6x - 4) + 3 = 12x - 5`. Divide by 2 as well.","_n":"1tea1","_k":"12baae0d"}],"hints":["`f(g(x)) = 2g(x) + 3`.","`2g(x) + 3 = 6x - 1`, so `2g(x) = 6x - 4`.","`g(x) = 3x - 2`."]},{"id":"mp10","topic":"46","goal":1,"kind":"num","prompt":"From the graphs, `f(2) = 3` and `g(2) = -5`. Find `(f - g)(2)`.","fig":"\u003ccanvas class=\"plot mx-fig\" data-fig=\"mp10\" role=\"img\" aria-label=\"Graphs of f in blue and g in teal. At x = 2, the graph of f is at (2, 3) and the graph of g is at (2, −5).\">\u003c/canvas>","label":"`(f - g)(2) =`","_a":"Xg==","display":"`(f - g)(2) = 8`","keypad":"text","why":"`(f - g)(2) = f(2) - g(2) = 3 - (-5) = 8`.","wrong":[{"match":-2,"fb":"That adds −5 instead of subtracting it: `3 - (-5) = 3 + 5`."}],"hints":["`(f - g)(2) = f(2) - g(2)`.","`3 - (-5)`.","`3 + 5 = 8`."]},{"id":"mp11","topic":"49","goal":5,"kind":"num","star":true,"prompt":"How many real solutions does `2^x = x^2` have?","label":"Number of solutions:","_a":"VQ==","display":"3 (`x = 2`, `x = 4` and one between −1 and 0)","keypad":"decimal","why":"`x = 2` and `x = 4` both work, and there’s one more between −1 and 0, where `2^x` falls toward 0 while `x^2` grows.","wrong":[{"match":2,"fb":"Look left of 0: `2^x` is small and `x^2` grows, so they cross once more. `2^x = x^2` mixes an exponential and a polynomial: use graphs and count intersections."}],"hints":["Graph `y = 2^x` and `y = x^2` and count the crossings. Look at negative `x` too.","Check `x = 2` and `x = 4`. Then compare the two sides at `x = -1` and `x = 0`.","At `x = -1`: `2^{-1} = 1/2 \u003c 1 = (-1)^2`. At `x = 0`: `2^0 = 1 > 0`. So they also cross between −1 and 0: 3 solutions."]},{"id":"mp12","topic":"47","goal":2,"kind":"iv","prompt":"`f(x) = x + 1`, `g(x) = x - 1`. Where is `f · g` negative?","_a":"RErRvaUFHhFXSxE=","display":"`(-1, 1)`","why":"`(x + 1)(x - 1)` has zeros −1 and 1. Between them the factors have opposite signs, so the product is negative on `(-1, 1)`.","wrong":{"[−1, 1]":"At −1 and 1 the product is 0, not negative: leave the zeros out.","(−∞, −1) ∪ (1, ∞)":"That’s where `f · g` is positive."},"hints":["Find the zero of each factor.","Zeros −1 and 1. Test a value between them, such as `x = 0`: `(1)(-1) = -1`.","Negative between the zeros: `(-1, 1)`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which detective case was hardest, and which fingerprint finally gave it away?"},{"id":"j2","q":"In your own words, why does the order matter in `f(g(x))` but not in `f + g`?"},{"id":"j3","q":"Explain to a friend how to find the domain of a composition."},{"id":"j4","q":"Which module will you revisit, and what exactly will you practise there?"}]},"final":{"intro":"This shows what you’ve learned across the chapter, so there are no hints here. Answer all 15 questions and say how sure you are. Then submit to see your results by category and by module. Each question is labelled with its achievement chart category and its module.","questions":[{"id":"f1","cat":"K","topic":"46","goal":1,"a":{"prompt":"`f(x) = 3x - 2` and `g(x) = x^2 + 1`. What is `(f + g)(x)`?","options":[{"t":"`3x^2 + 1`","why":"That’s `f(g(x))`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"1ue91","_k":"4d731cb4"},{"t":"`x^2 + 3x - 3`","why":"−2 + 1 = −1.","_n":"1vf81","_k":"d732b9e7"},{"t":"`3x^3 - 2x^2 + 3x - 2`","why":"That’s the product.","_n":"1wf71","_k":"f84f68b1"},{"t":"`x^2 + 3x - 1`","why":"`3x - 2 + x^2 + 1`: collect like terms.","_n":"1x6a1","_k":"f13a034b"}]},"b":{"prompt":"`f(x) = 2x + 5` and `g(x) = x^2 - 3`. What is `(f - g)(x)`?","options":[{"t":"`-x^2 + 2x + 8`","why":"`2x + 5 - (x^2 - 3) = -x^2 + 2x + 8`.","_n":"1y6b1","_k":"dae94d55"},{"t":"`-x^2 + 2x + 2`","why":"5 − (−3) = 8.","_n":"1z6c1","_k":"78c48738"},{"t":"`2x^2 - 1`","why":"That’s `f(g(x))`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"206d1","_k":"eeecb1f8"},{"t":"`x^2 - 2x - 8`","why":"That’s `g - f`.","_n":"21661","_k":"10bbd53f"}]}},{"id":"f2","cat":"K","topic":"47","goal":2,"a":{"prompt":"`f(x) = x + 2` and `g(x) = x - 5`. What is the domain of `(f/g)(x)`?","options":[{"t":"`{x ∈ ℝ}`","why":"Dividing by `g(x)` is impossible where `g(x) = 0`.","_n":"22671","_k":"1403b635"},{"t":"`{x ∈ ℝ | x != -2, 5}`","why":"`f(-2) = 0` is allowed: `0 ÷ (-7) = 0`. Only the zero of `g` is excluded.","_n":"23681","_k":"46bc9d43"},{"t":"`{x ∈ ℝ | x != 5}`","why":"`g(5) = 0`, so 5 is excluded.","_n":"24691","_k":"8ba0479a"},{"t":"`{x ∈ ℝ | x != -2}`","why":"That’s `f`’s zero.","_n":"25721","_k":"bffc15c0"}]},"b":{"prompt":"`f(x) = x^2 - 1` and `g(x) = x + 4`. What is the domain of `(f/g)(x)`?","options":[{"t":"`{x ∈ ℝ | x != -4, ±1}`","why":"The zeros of `f` are allowed: `0 ÷ 5 = 0`. Only the zero of `g` is excluded.","_n":"26731","_k":"5ea5fe52"},{"t":"`{x ∈ ℝ | x != -4}`","why":"`g(-4) = 0`, so −4 is excluded.","_n":"27740","_k":"dbe38a08"},{"t":"`{x ∈ ℝ | x != ±1}`","why":"Those are the zeros of `f`, and they’re allowed. Only the zero of `g` is excluded.","_n":"28730","_k":"7cff059f"},{"t":"`{x ∈ ℝ}`","why":"Dividing by `g(x)` is impossible where `g(x) = 0`.","_n":"29760","_k":"a8d720f3"}]}},{"id":"f3","cat":"K","topic":"48","goal":3,"a":{"prompt":"`f(x) = x^2 + 1` and `g(x) = 2x - 3`. Find `g(f(2))`.","options":[{"t":"2","why":"That’s `f(g(2)) = f(1)`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"2a750","_k":"d43483e8"},{"t":"5","why":"That’s `f(2) × g(2)`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"2b780","_k":"1f7402b2"},{"t":"6","why":"That’s `f(2) + g(2)`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"2c770","_k":"9e085ed4"},{"t":"7","why":"`f(2) = 5`; `g(5) = 7`.","_n":"2d7a0","_k":"090a013e"}]},"b":{"prompt":"`f(x) = x^2 - 2` and `g(x) = 3x + 1`. Find `f(g(1))`.","options":[{"t":"−4","why":"That’s `f(1) × g(1)`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"2e790","_k":"14fa3e70"},{"t":"−2","why":"That’s `g(f(1)) = g(-1)`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"2f6c0","_k":"bfabd7c2"},{"t":"3","why":"That’s `f(1) + g(1)`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"2g6b0","_k":"ddbf0aee"},{"t":"14","why":"`g(1) = 4`; `f(4) = 14`.","_n":"2hee0","_k":"06d80c1c"}]}},{"id":"f4","cat":"K","topic":"49","goal":5,"a":{"prompt":"Which kind of function best models a quantity that repeats every 24 hours?","options":[{"t":"Rational","why":"Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"2ief0","_k":"2abb34a9"},{"t":"Exponential","why":"Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"2jec0","_k":"8ebf9957"},{"t":"Sinusoidal","why":"Repeating behaviour is periodic, so it’s sinusoidal.","_n":"2ked0","_k":"cc9cc6b2"},{"t":"Polynomial","why":"Polynomials can’t repeat forever. Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"2lea0","_k":"21ccbfb7"}]},"b":{"prompt":"Which kind of function best models a quantity that halves every 5 years?","options":[{"t":"Sinusoidal","why":"Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"2meb0","_k":"dbd710f9"},{"t":"Exponential","why":"Halving every 5 years is a constant ratio.","_n":"2ne80","_k":"e78c612b"},{"t":"Linear","why":"Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"2oe90","_k":"cbf32504"},{"t":"Rational","why":"Constant ratios: exponential. Constant differences: linear. Repeating: sinusoidal.","_n":"2pf60","_k":"33526aa1"}]}},{"id":"f5","cat":"T","topic":"46","goal":1,"a":{"prompt":"`f(x) = x^3` (odd) and `g(x) = x^2` (even). Which describes `f + g`?","options":[{"t":"Even","why":"Test `h(-x)`: odd × odd = even, odd + even is usually neither.","_n":"2qf70","_k":"308708c5"},{"t":"Odd","why":"Test `h(-x)`: odd × odd = even, odd + even is usually neither.","_n":"2r694","_k":"b51b6330"},{"t":"Both even and odd","why":"Only the zero function is both.","_n":"2s6a4","_k":"d6bc2c6d"},{"t":"Neither even nor odd","why":"`h(-x) = -x^3 + x^2`, which is neither `h(x)` nor `-h(x)`.","_n":"2t674","_k":"099c078b"}]},"b":{"prompt":"`f(x) = cos x` (even) and `g(x) = x^2` (even). Which describes `f + g`?","options":[{"t":"Odd","why":"Test `h(-x)`: odd × odd = even, odd + even is usually neither.","_n":"2u684","_k":"489498e2"},{"t":"Neither","why":"Test `h(-x)`: odd × odd = even, odd + even is usually neither.","_n":"2v6d4","_k":"e138fdc9"},{"t":"Both even and odd","why":"Only the zero function is both.","_n":"2w6e4","_k":"cb1571c5"},{"t":"Even","why":"`h(-x) = cos x + x^2 = h(x)`.","_n":"2x6b4","_k":"0c77c2fe"}]}},{"id":"f6","cat":"T","topic":"47","goal":2,"a":{"prompt":"Where is `{x - 1}/{x^2 - 4}` positive?","options":[{"t":"`(-2, 1) ∪ (2, ∞)`","why":"Critical values −2, 1, 2; test each interval.","_n":"2y6c4","_k":"f106b512"},{"t":"`[-2, 1] ∪ [2, ∞)`","why":"±2 are excluded; at 1 it’s 0. Dividing by `g(x)` is impossible where `g(x) = 0`.","_n":"2z614","_k":"e73c2a20"},{"t":"`(1, ∞)`","why":"Between 1 and 2 the denominator is negative.","_n":"30624","_k":"a6c29aca"},{"t":"`(-∞, -2) ∪ (1, 2)`","why":"That’s where it’s negative.","_n":"316f4","_k":"401aa29b"}]},"b":{"prompt":"Where is `{x + 3}/{x^2 - 1}` positive?","options":[{"t":"`(-∞, -3) ∪ (-1, 1)`","why":"That’s where it’s negative.","_n":"326e4","_k":"81a8f487"},{"t":"`[-3, -1] ∪ [1, ∞)`","why":"±1 are excluded; at −3 it’s 0. Dividing by `g(x)` is impossible where `g(x) = 0`.","_n":"33714","_k":"ff3d650d"},{"t":"`(-3, ∞)`","why":"Between −1 and 1 the denominator is negative.","_n":"34704","_k":"0671a0bf"},{"t":"`(-3, -1) ∪ (1, ∞)`","why":"Critical values −3, −1, 1; test each interval.","_n":"356b4","_k":"c1371ad8"}]}},{"id":"f7","cat":"T","topic":"48","goal":4,"a":{"prompt":"`f(x) = √{x - 1}` and `g(x) = x^2`. What is the domain of `f(g(x))`?","options":[{"t":"`{x ∈ ℝ | x \u003c= -1 or x >= 1}`","why":"`x^2 - 1 >= 0`.","_n":"366a4","_k":"1fb5f06c"},{"t":"`{x ∈ ℝ}`","why":"At `x = 0`, `0^2 - 1 \u003c 0`. `x` must be in `g`’s domain, and `g(x)` must be in `f`’s domain.","_n":"376d4","_k":"32ece3bf"},{"t":"`{x ∈ ℝ | x >= 0}`","why":"At `x = 1/2`, `(1/2)^2 - 1 \u003c 0`, and negative `x` such as −2 work.","_n":"386c4","_k":"677a489b"},{"t":"`{x ∈ ℝ | x >= 1}`","why":"Negative `x` work too: `(-2)^2 - 1 = 3`. `x` must be in `g`’s domain, and `g(x)` must be in `f`’s domain.","_n":"39674","_k":"155bb0ba"}]},"b":{"prompt":"`f(x) = √{4 - x}` and `g(x) = x^2`. What is the domain of `f(g(x))`?","options":[{"t":"`{x ∈ ℝ | x \u003c= 2}`","why":"−3 fails: 4 − 9 \u003c 0.","_n":"3a664","_k":"fdb4ce1b"},{"t":"`{x ∈ ℝ | -2 \u003c= x \u003c= 2}`","why":"`4 - x^2 >= 0`.","_n":"3bdd4","_k":"0d089f2b"},{"t":"`{x ∈ ℝ | x \u003c= 4}`","why":"That’s `f`’s domain. `x` must be in `g`’s domain, and `g(x)` must be in `f`’s domain.","_n":"3cde4","_k":"a27d1010"},{"t":"`{x ∈ ℝ}`","why":"3 fails: 4 − 9 \u003c 0.","_n":"3ddf4","_k":"6c04e074"}]}},{"id":"f8","cat":"T","topic":"48","goal":4,"a":{"prompt":"`h(x) = 1/(x^2 + 4)` is written as `f(g(x))` with `g(x) = x^2 + 4`. What is `f(x)`?","options":[{"t":"`1/x`","why":"`f(g(x)) = 1/(x^2 + 4)`.","_n":"3ee04","_k":"3fb806e3"},{"t":"`x/4`","why":"That gives `(x^2 + 4)/4`.","_n":"3fd94","_k":"47b6bea1"},{"t":"`1/x^2`","why":"That gives `1/(x^2 + 4)^2`.","_n":"3gda4","_k":"3014af00"},{"t":"`x^2 + 4`","why":"That’s `g` again: it gives `(x^2 + 4)^2 + 4`.","_n":"3hdb4","_k":"c140570c"}]},"b":{"prompt":"`h(x) = √{2x - 5}` is written as `f(g(x))` with `g(x) = 2x - 5`. What is `f(x)`?","options":[{"t":"`√x`","why":"`f(g(x)) = √{2x - 5}`.","_n":"3idc4","_k":"112f1bdf"},{"t":"`2x - 5`","why":"That’s `g` again: it gives `2(2x - 5) - 5 = 4x - 15`.","_n":"3je54","_k":"81684eaa"},{"t":"`x^2`","why":"That gives `(2x - 5)^2`.","_n":"3ke64","_k":"afdd42bc"},{"t":"`√{2x}`","why":"That gives `√{4x - 10}`.","_n":"3l634","_k":"9dadb957"}]}},{"id":"f9","cat":"C","topic":"46","goal":1,"a":{"prompt":"Which is the best explanation of why the domain of `f + g` is the overlap of the two domains?","options":[{"t":"“`(f + g)(x) = f(x) + g(x)` needs both values to exist, so `x` must be in both domains.”","why":"A sum needs both of its parts.","_n":"3m624","_k":"1f747330"},{"t":"“Because adding functions adds their domains.”","why":"Domains don’t add.","_n":"3n614","_k":"bd590e77"},{"t":"“Because `f + g` takes the larger domain.”","why":"It takes the overlap.","_n":"3o604","_k":"114a0be3"},{"t":"“Because the sum is always defined everywhere.”","why":"`√x + 1/x` isn’t defined at 0 or for `x \u003c 0`.","_n":"3p5f4","_k":"d8735f9f"}]},"b":{"prompt":"Which is the best explanation of why the domain of `f/g` excludes the zeros of `g`?","options":[{"t":"“Because `f/g` has the same domain as `g`.”","why":"It also needs `f`’s domain, minus `g`’s zeros.","_n":"3q5e4","_k":"7e25de11"},{"t":"“Because zeros of `g` are always asymptotes.”","why":"Sometimes they’re holes.","_n":"3r5d4","_k":"10e6bf4b"},{"t":"“Because zeros of `f` are excluded too.”","why":"Zeros of `f` are fine: 0 ÷ 5 = 0.","_n":"3s5c4","_k":"8fc88061"},{"t":"“`(f/g)(x) = f(x) ÷ g(x)`, and division by 0 is undefined.”","why":"Dividing by `g(x)` is impossible where `g(x) = 0`.","_n":"3t6b4","_k":"983142d9"}]}},{"id":"f10","cat":"C","topic":"47","goal":2,"a":{"prompt":"Which best describes `y = 2^{-x} sin(4x)` for large `x`?","options":[{"t":"“It oscillates between the curves `y = 2^{-x}` and `y = -2^{-x}`, so its swings shrink toward 0.”","why":"The envelope `2^{-x} → 0` multiplies every swing.","_n":"3u6a4","_k":"91e9625b"},{"t":"“It oscillates between −1 and 1 forever.”","why":"The envelope multiplies every swing, so the swings shrink with it.","_n":"3vf13","_k":"c2ded5d6"},{"t":"“It grows without bound.”","why":"The envelope multiplies every swing, so the swings shrink with it.","_n":"3wf23","_k":"805e1fa4"},{"t":"“It has horizontal asymptote `y = 1`.”","why":"It approaches 0.","_n":"3xef3","_k":"7778c7de"}]},"b":{"prompt":"Which best describes `y = (0.5)^x cos(3x)` for large `x`?","options":[{"t":"“It oscillates between `y = (0.5)^x` and `y = -(0.5)^x`, so its swings shrink toward 0.”","why":"The envelope `(0.5)^x → 0` multiplies every swing.","_n":"3yf03","_k":"459b731b"},{"t":"“It has horizontal asymptote `y = 0.5`.”","why":"It approaches 0.","_n":"3zed3","_k":"b471c062"},{"t":"“It oscillates between −1 and 1 forever.”","why":"The envelope multiplies every swing, so the swings shrink with it.","_n":"40ee3","_k":"d92bacfc"},{"t":"“It grows without bound.”","why":"The envelope multiplies every swing, so the swings shrink with it.","_n":"41eb3","_k":"1feb17ca"}]}},{"id":"f11","cat":"C","topic":"48","goal":[3,6],"a":{"prompt":"`f(x) = x + 3` and `g(x) = x^2`. Which statement is correct?","options":[{"t":"“`f(g(x)) = x^2 + 3` squares first; `g(f(x)) = (x + 3)^2` adds first. They differ: at `x = 1`, 4 vs 16.”","why":"The inside function acts first, so the order changes the result.","_n":"42ec3","_k":"6e84449f"},{"t":"“`f(g(x)) = x^2(x + 3)`.”","why":"That’s the product `f · g`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"43e93","_k":"39123ef7"},{"t":"“They’re equal, because composition is like multiplication.”","why":"`f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"44ea3","_k":"4801e8ec"},{"t":"“`f(g(x)) = (x + 3)^2`, because `f` is written first.”","why":"`(x + 3)^2` is `g(f(x))`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"45d74","_k":"ded69eb5"}]},"b":{"prompt":"`f(x) = 2x` and `g(x) = x - 5`. Which statement is correct?","options":[{"t":"“`f(g(x)) = 2x(x - 5)`.”","why":"That’s the product `f · g`. `f(g(2))` = `f`(evaluate `g(2)` first), not `f(2) + g(2)`.","_n":"46d64","_k":"5168f537"},{"t":"“`f(g(x)) = 2x - 5`.”","why":"`2x - 5` is `g(f(x))`. `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"47d94","_k":"3f08cd31"},{"t":"“They’re equal.”","why":"`f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"48d84","_k":"0e3b9037"},{"t":"“`f(g(x)) = 2x - 10` subtracts first; `g(f(x)) = 2x - 5` doubles first. They differ by 5.”","why":"The inside function acts first, so the order changes the result.","_n":"49db4","_k":"ee47d00f"}]}},{"id":"f12","cat":"A","topic":"49","goal":5,"a":{"fixedOrder":true,"prompt":"A store’s monthly revenue is `R(x) = x(120 - 4x)` dollars at a price of `x` dollars. Which price maximizes revenue?","options":[{"t":"$15","why":"Zeros 0 and 30; maximum halfway.","_n":"4ada4","_k":"ec74aee4"},{"t":"$30","why":"Revenue is 0 there.","_n":"4bdd4","_k":"ac1af531"},{"t":"$60","why":"That’s 120 ÷ 2, ignoring the 4.","_n":"4cdc4","_k":"e166086f"},{"t":"$120","why":"That’s a coefficient.","_n":"4ddf4","_k":"77abe9a5"}]},"b":{"fixedOrder":true,"prompt":"`R(x) = x(80 - 4x)`. Which price maximizes revenue?","options":[{"t":"$10","why":"Zeros 0 and 20; maximum halfway.","_n":"4ede4","_k":"5641f6e4"},{"t":"$20","why":"Revenue is 0 there.","_n":"4f653","_k":"8fa35d6f"},{"t":"$40","why":"That’s 80 ÷ 2, ignoring the 4.","_n":"4g663","_k":"7dca0b85"},{"t":"$80","why":"That’s a coefficient.","_n":"4h673","_k":"44fd1ddb"}]}},{"id":"f13","cat":"A","topic":"47","goal":2,"a":{"fixedOrder":true,"prompt":"A pendulum’s displacement is `d(t) = 10(0.8)^t cos(πt)` cm after `t` seconds. Find `d(2)`.","options":[{"t":"−6.4 cm","why":"`cos 2π = 1`.","_n":"4i683","_k":"b1929c1d"},{"t":"0.64 cm","why":"Multiply by 10.","_n":"4j693","_k":"b3fea64f"},{"t":"6.4 cm","why":"10 × 0.64 × `cos 2π` = 6.4.","_n":"4k6a3","_k":"a2da6e7d"},{"t":"10 cm","why":"The envelope shrinks the swing. The envelope multiplies every swing, so the swings shrink with it.","_n":"4l6b3","_k":"a59740e2"}]},"b":{"fixedOrder":true,"prompt":"`d(t) = 8(0.5)^t cos(πt)` cm. Find `d(3)`.","options":[{"t":"−1 cm","why":"8 × 0.125 × `cos 3π` = −1.","_n":"4m6c3","_k":"32dee331"},{"t":"0.125 cm","why":"Multiply by 8, and `cos 3π = -1`.","_n":"4n5d3","_k":"921ac14b"},{"t":"1 cm","why":"`cos 3π = -1`.","_n":"4o5e3","_k":"2b834467"},{"t":"8 cm","why":"The envelope multiplies every swing, so the swings shrink with it.","_n":"4p6b3","_k":"baa94526"}]}},{"id":"f14","cat":"A","topic":"48","goal":3,"a":{"prompt":"A traveller converts dollars to euros with `E(d) = 0.68d`, then pays a 5 € fee: `F(E) = E - 5`. What is `F(E(100))`, and what does it mean?","options":[{"t":"63 €: the euros received for $100 after the fee","why":"`E(100) = 68`; 68 − 5.","_n":"4q6a3","_k":"e6c48faf"},{"t":"64.6 €: the fee is taken off before converting","why":"That subtracts the fee before converting: 0.68(100 − 5). `f(g(x))` puts `g`’s output into `f`: do `g` first. Order matters.","_n":"4r693","_k":"62a9f0f7"},{"t":"$63: the dollars left after the fee","why" c8-props\">\u003cli>`h` is odd.\u003c/li>\u003cli>`h` is undefined at `x = 0`.\u003c/li>\u003cli>`h(x) → 0` as `x → ∞`.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Choose `u` and `v` from `x^2`, `x^3`, `sin x`, `1/x` and `2^x` (two different ones), and an operation: `u + v`, `u - v`, `u · v`, `u/v` or `u(v(x))`.\u003c/p>","checks":["`h(-x) = -h(x)` at several points and symbolically: `h` is odd","`h(0)` is undefined","`h(x) → 0` as `x → ∞`"],"tips":["Odd results come from odd ± odd, odd × even, odd ÷ even, or an odd function of an odd function.","Divide by a function that is 0 at `x = 0`, or use `1/x`.","Something has to shrink: divide by a function that grows faster, or feed in `1/x`, which → 0."],"tipNow":["Right now `h` is §1: §2.","Right now §1.","Right now, as `x → ∞`, `h(x)` §1."],"ui":{"u":"`u(x) =`","v":"`v(x) =`","op":"Operation","uAria":"Choose u","vAria":"Choose v","opAria":"Choose the operation","same":"`u` and `v` must be different.","cap":"Your function","graph":"Graph of `h`","odd":"Odd test","h0":"At `x = 0`","far":"Far right","x":"`x`","hx":"`h(x)`","hmx":"`h(-x)`","undef":"undefined","yes":"✓","no":"✗","par":{"odd":"odd","even":"even","neither":"neither even nor odd"},"rule":{"pair":"§1 §2 §3 is §4","none":"§1 has no symmetry, so `h` has none","compEven":"any function of an even function is even","compOdd":"§1 function of an odd function is §2","compNone":"a function of a function with no symmetry has none"},"why0":{"rx":"`1/x` is undefined at `x = 0`","div":"`v(0) = 0`, so it divides by 0","comp":"`v(0) = 0`, and `1/0` is undefined","def":"`h(0)` = §1"},"lim":{"0":"→ 0","inf":"grows without bound","c":"levels off at 1, not 0","osc":"keeps oscillating, so it doesn’t approach 0","wild":"keeps swinging to ±∞, so it doesn’t approach 0"},"describe":"Graph of h(x) = §1 for x from −6 to 6. §2"},"explainPrompt":"Explain why your function is odd and why it approaches 0, using the fingerprints of the operation you chose.","success":"Your function has all three properties.","more":"There’s more than one answer. Can you find another?","all6":"That’s all six designs. They build only four different functions: `1/x`, `1/x^3` (three ways), `{sin x}/{x^2}` and `sin(1/x)`."},"cards":[["`(f ± g)(x)`","`f(x) ± g(x)`; domain: the overlap."],["`(f · g)(x)`","`f(x) · g(x)`; zeros of either factor are zeros of the product."],["`(f/g)(x)`","`f(x) ÷ g(x)`; exclude zeros of `g` (asymptotes or holes)."],["`f(g(x))`","Do `g` first, then `f`. Usually `!= g(f(x))`."],["Domain of `f(g(x))`","`x` in `g`’s domain with `g(x)` in `f`’s domain."],["Decomposing","`h(x) = (3x - 1)^5`: inside `g = 3x - 1`, outside `f = x^5`."],["`f(f^{-1}(x))`","`x`. A function undoes its inverse."],["Symmetry of combinations","odd ± odd = odd; even ± even = even; odd × odd = even; odd × even = odd."],["Damped motion","envelope × wave: swings shrink between ±envelope."],["Superposition","Waves add point by point: in step they reinforce, half a period apart they cancel."],["Choosing a model","Constant differences: linear; constant ratios: exponential; repeating: sinusoidal; levelling off near a value: rational or exponential decay."],["Solving when algebra can’t","Graph both sides and count or estimate the intersections."]]}};</script>
