.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 46: hero colours, radio groups (from MHF4U 37), function picker, stacking-bars explorer (sd-ex), superposition (sd-p3), practice and task */
.sd-f{color:var(--pen)}
.sd-g{color:var(--f3)}
.hero .hero-eq.md{font-size:clamp(1.9rem,5.4vw,3.5rem)}
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.24em .8em;font-size:.95rem;min-height:36px;min-width:40px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.rg .m{font-size:1em}

/* function picker */
.sd-pk{--sc:var(--pen);margin:0 0 10px}
.sd-pk-g{--sc:var(--f3)}
.sd-pk-lab{display:block;font:400 1.15rem var(--font-math);margin:0 0 4px}
.sd-pk-row{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.sd-pk-row button{border:2px solid var(--sc);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.15em .55em;min-height:40px;min-width:44px;font:400 1.08rem var(--font-math)}
.sd-pk-row button[aria-checked="true"]{background:var(--sc);color:var(--sheet);font-weight:700;box-shadow:0 0 0 2px var(--sheet) inset}
.sd-pk-row button:disabled{opacity:.5}
.sd-pk-row button[aria-checked="true"]:disabled{opacity:.85}
.sd-pk-row .m{font-size:1em;white-space:nowrap}
.sd-pk-row .frac{font-size:.82em}
.sd-pk-why{margin:4px 0 0;font-size:.85rem;color:var(--ink-2);font-style:italic}

/* explorer */
.sd-ex{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.sd-l,.sd-r{min-width:0}
.sd-vsw{display:none;margin:0 0 8px}
.sd-cap{font-size:clamp(1.25rem,2.6vw,1.7rem)}
.sd-cap .frac{font-size:.85em}
.sd-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 0;font-size:1rem}
.sd-leg > span{display:inline-flex;align-items:center;gap:8px}
.sd-sw{display:inline-block;width:26px;height:4px;border-radius:2px}
.sd-sw-r{height:6px}
.sd-tv{margin-top:14px}
.sd-th{font-weight:700;font-size:.92rem;color:var(--ink-2);margin:0 0 6px}
.sd-und{font-style:italic;color:var(--ink-2);font-family:var(--font-ui);font-size:.88rem}
.sd-md{margin:2px 0 4px}
.sd-ctl{margin-top:10px}
.sd-sl{--sc:var(--ink);margin:0 0 6px}
.sd-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px}
.sd-sl-top label{font-weight:700;font-size:.92rem}
.sd-sl-top output{font:600 1.15rem var(--font-math)}
.sd-sl input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--sc)}
.sd-sl input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.sd-btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.sd-bl{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.sd-tg{min-height:36px}
.sd-tg[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.sd-rd{margin-top:12px}
.sd-rd .read > div{padding:8px 0}
.sd-rd .read .frac{font-size:.85em}
.sd-morebtn{display:none;margin-top:6px}
.sd-swipe dd{background-image:linear-gradient(var(--hi-soft),var(--hi-soft));background-repeat:no-repeat;animation:sd-sw .4s ease-out forwards}
@keyframes sd-sw{from{background-size:0% 100%}to{background-size:100% 100%}}
.sd-ex .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.sd-ex canvas.plot{touch-action:pan-y}

/* superposition */
.sd-p3{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.sd-p3l,.sd-p3r{min-width:0}
.sd-p3m{margin:0 0 10px}
.sd-method{display:none;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 10px;background:var(--paper)}
.sd-p3[data-mode="dec"] .sd-method{display:block}
.sd-p3[data-mode="dec"] .sd-mix,.sd-p3[data-mode="mix"] .sd-dec{display:none}
.sd-strips{border-radius:8px}
.sd-strips:focus-visible{outline:3px solid var(--pen);outline-offset:3px}
.sd-st-t{margin:8px 0 3px;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.sd-st-t:first-child{margin-top:0}
canvas.plot.sd-strip{aspect-ratio:4.4/1;min-height:96px}
canvas.plot.sd-strip3{aspect-ratio:3.4/1;min-height:125px}
.sd-mix > div,.sd-dec > div{margin:0 0 8px}
.sd-p3rd{margin-top:10px}
.sd-p3rd > div{padding:7px 0}
.sd-p3rd .frac{font-size:.85em}
.sd-keys{display:grid;grid-template-columns:repeat(3,48px);gap:6px;margin:10px 0 4px}
.sd-key{width:48px;height:48px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1.15rem var(--font-ui)}
.sd-key[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.sd-knote{margin:4px 0 10px;max-width:34em}
.sd-guess{margin:6px 0}
.sd-xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sd-xc{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.sd-xc h4{margin:0 0 4px}
.sd-xc .q-actions{margin:6px 0}
.sd-xq{margin:8px 0 6px;font-weight:700}
.sd-xc .chips{margin:0}
.sd-tally{font-weight:700}

/* practice and task */
.sd-ci .numin{width:7rem}
.sd-n3w,.sd-miniw{max-width:420px;margin-top:8px}
canvas.plot.sd-mini{aspect-ratio:16/9}
.sd-mcap{margin:4px 0 0}
.sd-tcap{font-size:clamp(1.15rem,2.4vw,1.5rem);margin-top:10px}
.sd-tcap .frac{font-size:.85em}
.sd-tc{margin:2px 0 6px}

@media (max-width:820px){
  .sd-ex{display:flex;flex-direction:column;align-items:stretch;gap:8px}
  .sd-l,.sd-r{display:contents}
  .sd-pick{order:1}.sd-vsw{order:2;display:block}.sd-gv,.sd-tv{order:3}.sd-ctl{order:4}.sd-rd{order:5}
  .sd-ex[data-view="graph"] .sd-tv,.sd-ex[data-view="table"] .sd-gv{display:none}
  .sd-tv{margin-top:0}
  .sd-pk-row{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
  .sd-pk-row button{flex:0 0 auto}
  .sd-p3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .sd-rd:not(.sd-open) .sd-more{display:none}
  .sd-morebtn{display:inline-flex}
  canvas.plot.sd-strip{aspect-ratio:2.9/1}
  canvas.plot.sd-strip3{aspect-ratio:2.2/1}
  .sd-xgrid{grid-template-columns:minmax(0,1fr)}
  .sd-keys{grid-template-columns:repeat(3,44px)}
  .sd-key{width:44px;height:44px}
}

Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"120b6a70","content":{"id":"46-sums-and-differences-of-functions","kind":"topic","title":"Sums and differences of functions","topic":"Sums and Differences of Functions","readyTopic":"sums and differences of functions","hero":{"eq":"\u003cspan class=\"m\">(\u003ci class=\"sd-f\">f\u003c/i> + \u003ci class=\"sd-g\">g\u003c/i>)(\u003ci>x\u003c/i>) = \u003ci class=\"sd-f\">f\u003c/i>(\u003ci>x\u003c/i>) + \u003ci class=\"sd-g\">g\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>","eqLabel":"f plus g of x equals f of x plus g of x","eqSize":"md","headline":"Add the heights, point by point","text":"To add two functions, add their outputs at the same input. On a graph that means stacking heights: at each `x`, put `g`’s bar on top of `f`’s bar, and the top of the stack is a point on the graph of the \u003cstrong>sum\u003c/strong>. A \u003cstrong>difference\u003c/strong> works the same way with `g`’s bar flipped. The new function exists only where both pieces do, so its \u003cstrong>domain\u003c/strong> is where `f` and `g` are both defined. Adding waves like this, called \u003cstrong>superposition\u003c/strong>, is how sounds combine, from phone keypad tones to noise-cancelling headphones.","fig":{"aria":"The line y = x and the wave y = sin x, with bars stacked at nine x-values from negative 2 pi to 2 pi, and the sum y = x + sin x drawn through the tops of the stacks","shape":"square"}},"goals":["I can find `(f + g)(x)` and `(f - g)(x)` at a point from equations, tables or graphs, by adding or subtracting the signed outputs at the same `x`, and work backwards to a missing value.","I can sketch or describe the graph of `f + g` or `f - g` from the graphs of `f` and `g`, using key points (where `f` or `g` is zero, where the two values cancel, where the graphs cross) and which piece takes over far left and far right.","I can state the domain of `f + g` and `f - g`: the `x`-values where both `f` and `g` are defined.","I can decide whether a sum or difference is even, odd or neither, and reason about whether it increases, by testing the result rather than assuming it copies the pieces.","I can explain superposition: when two waves reinforce or cancel, how long their sum takes to repeat, and how real sounds such as keypad tones are built from sums of waves."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Function values","goal":1,"prompt":"`f(x) = x^2 - 3x`. What is `f(-2)`?","options":[{"t":"−10","why":"−10 = −4 − 6: both the square and the product got the wrong sign. `(-2)^2 = 4` and `-3(-2) = 6`.","_n":"098e","_k":"a257abfa"},{"t":"−2","why":"−3 × (−2) = +6, not −6. So `f(-2) = 4 + 6 = 10`.","_n":"195e","_k":"c062180a"},{"t":"2","why":"The brackets mean the whole −2 is squared: `(-2)^2 = 4`. −4 + 6 = 2 comes from squaring only the 2.","_n":"296e","_k":"e56df352"},{"t":"10","why":"Replace every `x` with (−2): `(-2)^2 - 3(-2) = 4 + 6 = 10`.","_n":"39be","_k":"57bd2a3c"}],"hints":["Put (−2), with its brackets, in place of each `x`.","`(-2)^2 = 4` and −3 × (−2) = 6.","`f(-2) = 4 + 6 = 10`."]},{"id":"w2","skill":"Function values","goal":1,"prompt":"The graph of `y = g(x)` is the straight line through (0, 4) and (2, 0). What is `g(3)`?","options":[{"t":"−2","why":"The line falls 2 for each step of 1 to the right, so `g(x) = 4 - 2x` and `g(3) = 4 - 6 = -2`. The graph is below the `x`-axis there.","_n":"49ce","_k":"ed3d5c02"},{"t":"1/2","why":"1/2 is the `x` where `g(x) = 3`. `g(3)` means the output when the input is 3.","_n":"599e","_k":"90e62222"},{"t":"2","why":"At `x = 3` the line is 2 units \u003cstrong>below\u003c/strong> the `x`-axis, so `g(3) = -2`.","_n":"69ae","_k":"4b2df5e1"},{"t":"10","why":"The line goes \u003cstrong>down\u003c/strong> from (0, 4) to (2, 0), so its slope is −2: `g(3) = 4 - 2(3) = -2`.","_n":"79fe","_k":"61b63477"}],"hints":["Find the slope from the two points.","Slope = (0 − 4)/(2 − 0) = −2, so `g(x) = 4 - 2x`.","`g(3) = 4 - 6 = -2`."]},{"id":"w3","skill":"Domain","goal":3,"prompt":"What is the domain of `y = log_{2} x`?","options":[{"t":"`{x ∈ ℝ | x ≥ 0}`","why":"No power of 2 equals 0, so `log_{2} 0` is undefined. The graph approaches the `y`-axis but never reaches it.","_n":"8a0e","_k":"1bdb2a42"},{"t":"`{x ∈ ℝ | x ≠ 0}`","why":"Negative `x` are excluded too: no power of 2 is negative.","_n":"92be","_k":"0cde93e8"},{"t":"`{x ∈ ℝ}`","why":"`{x ∈ ℝ}` is the domain of `y = 2^x`. Its inverse, `log_{2} x`, takes the range of `2^x` as its domain: `x > 0`.","_n":"a2ae","_k":"69774b43"},{"t":"`{x ∈ ℝ | x > 0}`","why":"`log_{2} x` is the exponent you put on 2 to get `x`. Powers of 2 are always positive, so only positive `x` have a logarithm.","_n":"b2de","_k":"9e1f5802"}],"hints":["`log_{2} x` is the exponent you put on 2 to get `x`.","Can a power of 2 be 0 or negative?","No, so `x` must be positive: `{x ∈ ℝ | x > 0}`."]},{"id":"w4","skill":"Domain","goal":3,"prompt":"What is the domain of `y = 1/(x + 3)`?","options":[{"t":"`{x ∈ ℝ | x > -3}`","why":"A fraction only fails where its denominator is 0. At `x = -5` the value is `1/(-2) = -1/2`, which is fine.","_n":"c2ce","_k":"e0ecc5c3"},{"t":"`{x ∈ ℝ | x ≠ 0}`","why":"At `x = 0` the value is 1/3. The excluded value is where `x + 3 = 0`.","_n":"d2fe","_k":"8d6069a9"},{"t":"`{x ∈ ℝ | x ≠ 3}`","why":"`x + 3 = 0` when `x = -3`. At `x = 3` the denominator is 6, which is fine.","_n":"e2ee","_k":"14c36263"},{"t":"`{x ∈ ℝ | x ≠ -3}`","why":"The denominator `x + 3` is 0 only at `x = -3`, and you can’t divide by 0.","_n":"f31e","_k":"233502dc"}],"hints":["Which `x` makes the denominator 0?","Solve `x + 3 = 0`.","`x = -3` is excluded: `{x ∈ ℝ | x ≠ -3}`."]},{"id":"w5","skill":"Even and odd","goal":4,"prompt":"Which function is odd?","options":[{"t":"`f(x) = x^3 + x`","why":"`f(-x) = -x^3 - x = -(x^3 + x) = -f(x)`.","_n":"g30e","_k":"82633b04"},{"t":"`f(x) = x^2 + x`","why":"`f(1) = 2` but `f(-1) = 0`, which is neither 2 nor −2. This one is neither.","_n":"h23e","_k":"bf4d7554"},{"t":"`f(x) = x^4 - x^2`","why":"Every power here is even, so `f(-x) = f(x)`: this one is even.","_n":"i22e","_k":"9f7cc2e8"},{"t":"`f(x) = x^3 + 1`","why":"`f(-x) = -x^3 + 1`, which is neither `f(x)` nor `-f(x) = -x^3 - 1`. The constant 1 behaves like an even term, so this one is neither.","_n":"j99e","_k":"2868ba6d"}],"hints":["Odd means `f(-x) = -f(x)` for every `x`.","Replace `x` with `-x`: odd powers change sign; even powers and constants don’t.","Only `x^3 + x` has every term odd: `f(-x) = -x^3 - x = -f(x)`."]},{"id":"w6","skill":"Sinusoids","goal":5,"prompt":"What is the period of `y = sin 3x`?","options":[{"t":"3","why":"3 is how many waves fit into 2π. The period is 2π/3.","_n":"k9ae","_k":"a5ffc824"},{"t":"2π/3","why":"`sin 3x` fits 3 full waves into 2π, so one wave takes 2π/3.","_n":"l9be","_k":"49e648eb"},{"t":"6π","why":"Multiplying `x` by 3 squeezes the graph: it repeats 3 times as often, so the period is shorter: 2π ÷ 3.","_n":"m9ce","_k":"c551cfcc"},{"t":"π/3","why":"Sine’s basic period is 2π, not π: 2π/3.","_n":"n9de","_k":"c9094780"}],"hints":["The period of `sin kx` is 2π/`k`.","Here `k = 3`.","2π/3."]}],"refreshers":{"Function values":"To evaluate `f(-2)`, put (−2), brackets and all, in place of every `x`: `f(-2) = (-2)^2 - 3(-2) = 4 + 6 = 10`. On a graph, `g(3)` is the \u003cstrong>height\u003c/strong> of the graph at `x = 3`. It’s negative when the graph is below the `x`-axis: the line through (0, 4) and (2, 0) has height −2 at `x = 3`.","Domain":"The domain is every `x` the function accepts. A logarithm needs a positive input, so `log_{2} x` has domain `{x ∈ ℝ | x > 0}`. A fraction can’t have a zero denominator, so `1/(x + 3)` has domain `{x ∈ ℝ | x ≠ -3}`. Polynomials, `2^x`, `sin x` and `cos x` accept every real `x`.","Even and odd":"`f` is \u003cstrong>even\u003c/strong> if `f(-x) = f(x)` for every `x` (mirror symmetry in the `y`-axis), and \u003cstrong>odd\u003c/strong> if `f(-x) = -f(x)` (half-turn symmetry about the origin). For polynomials: only even powers (constants count as even) gives even; only odd powers gives odd; a mix gives neither. `x^3 + x` is odd; `x^3 + 1` is neither. `cos x` is even and `sin x` is odd.","Sinusoids":"`y = sin kx` and `y = cos kx` have amplitude 1 and period 2π/`k`. `sin 3x` completes 3 waves between 0 and 2π, so one wave takes 2π/3. Shifting a sine wave by half a cycle flips it: `sin(x + π) = -sin x`."}}},"explore":{"heading":"Stacking bars","intro":"Pick two functions. At the probe, `f`’s bar and `g`’s bar stack into the value of `f + g` (or `f - g`). Sweep the probe across to build the new graph one point at a time.","predictions":[{"id":"p1","prompt":"`f(1) = 2` and `g(1) = -1`. Where will the point of `f + g` at `x = 1` be?","options":[{"t":"(1, −2)","_n":"o9ee","_k":"0ef967ec"},{"t":"(1, 3)","_n":"p9fe","_k":"f4d036d8"},{"t":"(1, 1)","_n":"qa0e","_k":"8fc230d8"},{"t":"(2, 1)","_n":"ra1e","_k":"0866a835"}],"explain":"`g(1) = -1`, so `g`’s bar points down. Stacked on `f`’s bar of 2, it brings the total down to 1, and the `x` stays at 1: the point is (1, 1). The other options are other operations: (1, 3) adds the sizes and ignores the sign, (1, −2) multiplies, and (2, 1) adds the two points as pairs, which moves the `x` as well."},{"id":"p2","prompt":"The sweep will draw `f + g = 2^x + sin x`. Where will its graph meet the graph of `f`?","options":[{"t":"Wherever `sin x = 0`: at `x = -π`, 0 and π","_n":"sa2e","_k":"f7ff6184"},{"t":"Wherever `sin x = 1`: at `x = π/2`","_n":"t9fe","_k":"08b84664"},{"t":"Only where the graphs of `f` and `g` cross each other","_n":"u9ee","_k":"f250db56"},{"t":"Nowhere: adding the wave moves every point off `f`’s graph","_n":"v9de","_k":"11dcb338"}],"explain":"`2^x + sin x` equals `2^x` exactly when `sin x = 0`: at −π, 0 and π in this window. Between those, the wave pushes the sum above `f`’s graph (where `sin x > 0`) or below it (where `sin x \u003c 0`). Far left, `2^x` fades to 0 and the sum looks like `sin x`; far right, `2^x` takes over. (The graphs of `f` and `g` do cross once in this window, near `x = -3.25`, but there the sum is `2f(x)`, not `f(x)`.)"},{"id":"p3","prompt":"The sweep will try to draw `f + g = log_{2} x + 1/x` at every probe position from `x = -4` to `x = 4`. For which `x`-values will it draw a point?","options":[{"t":"For every `x` except 0","_n":"w9ce","_k":"ab6372f6"},{"t":"Only for `x > 0`","_n":"xa3e","_k":"971646be"},{"t":"For every real `x`","_n":"ya2e","_k":"111674e5"},{"t":"For `x > 0`, except `x = 1`","_n":"za1e","_k":"d938021d"}],"explain":"`(f + g)(x)` needs both values. `log_{2} x` is undefined for `x ≤ 0`, so the sum is too, even though `1/x` is defined at, say, `x = -1`. The domain is `{x ∈ ℝ | x > 0}`. At `x = 1`, `log_{2} 1 = 0` is a perfectly good value, so `x = 1` is included. Near 0, `1/x` grows faster than `log_{2} x` falls, so as `x → 0^{+}` the sum → ∞."},{"id":"p4","prompt":"Neither `2^x` nor `2^{-x}` is even or odd. What symmetry will their sum have?","options":[{"t":"Even: symmetric in the `y`-axis","_n":"10a0e","_k":"c3bcffae"},{"t":"Neither: it rises to the right, like `2^x`","_n":"11a7e","_k":"0b4fc7bf"},{"t":"Neither, because neither piece has any symmetry","_n":"12a6e","_k":"5f0cff49"},{"t":"Odd: symmetric about the origin","_n":"139df","_k":"229cac93"}],"explain":"`2^{-x}` is the reflection of `2^x` in the `y`-axis. At `x` and `-x` the two bars swap places, so the total is the same: `(f + g)(-x) = 2^{-x} + 2^x = (f + g)(x)`. The sum is even, with lowest point (0, 2), and it rises on \u003cstrong>both\u003c/strong> sides. Symmetry of a sum has to be tested, not assumed."}],"chalIntro":"Set the explorer, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Choose `f`, `g` and the mode so that the result is defined for exactly the `x`-values with `x > 0` and `x ≠ 2`. Sweep to see the domain, then press Check challenge.","why":"Where both are defined: `log_{2} x` needs `x > 0` and `1/(x - 2)` needs `x ≠ 2`, so the result is defined for `{x ∈ ℝ | x > 0, x ≠ 2}`.","fb":{"recips":"Your result is defined for `x ≠ 0` and `x ≠ 2`, which still includes negative numbers such as `x = -1`. Which function refuses every `x ≤ 0`?","logRecip":"`1/x` only removes `x = 0`, which `log_{2} x` had already removed. Your domain is `x > 0`, still including `x = 2`.","logOther":"Your result is defined for every `x > 0`, including `x = 2`. You also need a piece that’s undefined at `x = 2`.","shiftAll":"Your result is defined everywhere except `x = 2`, including the negative numbers."},"general":"Look at the Domain row: the result is defined only where both pieces are.","hints":["The result is defined only where both pieces are. Which library function cuts off every `x ≤ 0`? Which one removes only `x = 2`?","`log_{2} x` has domain `x > 0`, and `1/(x - 2)` has domain `x ≠ 2`.","Choose `log_{2} x` and `1/(x - 2)`, in either order and either mode. Where both are defined: `x > 0` and `x ≠ 2`."]},{"id":"tc2","goal":1,"prompt":"`f` is locked to `f(x) = x`. Choose `g` and the mode so that the result passes through both ringed points, (0, 1) and (2, 6).","why":"`x + 2^x` gives 0 + 1 = 1 at `x = 0` and 2 + 4 = 6 at `x = 2`.","fb":{"sq":"Your result passes through (2, 6), since 2 + 4 = 6. But at `x = 0` it’s 0 + 0 = 0, not 1.","neg":"Your result passes through (0, 1). But at `x = 2` it’s 2 + 1/4 = 9/4, not 6.","cos":"Your result passes through (0, 1), since `cos 0 = 1`. But at `x = 2` it’s `2 + cos 2 ≈ 1.58`.","diff":"At `x = 0` your result is 0 − 1 = −1: right size, wrong sign. Subtracting flips `g`’s bar.","lock":"This challenge needs `f(x) = x`. Press \u003cstrong>Open this challenge\u003c/strong> to lock `f` to `x`."},"general":"Work backwards from the rings: at each one, `g(x)` must be the ring’s height minus `f(x)`.","hints":["Work backwards at each ring: `g(x)` must be the ring’s height minus `f(x)`.","At `x = 0`: `g(0) = 1 - 0 = 1`. At `x = 2`: `g(2) = 6 - 2 = 4`. Which library function gives 1 at `x = 0` and 4 at `x = 2`?","`g(x) = 2^x`, because `2^0 = 1` and `2^2 = 4`. In Sum mode, `x + 2^x` passes through (0, 1) and (2, 6)."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Commit first. Using two functions that are \u003cstrong>not\u003c/strong> odd, build an \u003cstrong>odd\u003c/strong> function whose graph passes through the ringed point (1, 3/2). While this challenge is open, the result is hidden; set `f`, `g` and the mode, press \u003cstrong>Check challenge\u003c/strong>, and only then is it drawn.","why":"`h(x) = 2^x - 2^{-x}` has `h(-x) = 2^{-x} - 2^x = -h(x)`, so it’s odd, and `h(1) = 2 - 1/2 = 3/2`.","fb":{"p4":"That’s P4’s function: it’s even, not odd. At `x = 1` it’s 5/2.","swap":"It’s odd, but at `x = 1` it’s 1/2 − 2 = −3/2: right size, wrong sign. Swap `f` and `g`.","oddPiece":"One of your pieces is already odd. The challenge asks for two pieces that aren’t.","lop":"Your result’s domain isn’t symmetric about 0, so it can’t be odd."},"general":"For an odd result, the value at `-x` must be the opposite of the value at `x`. In P4, which two functions swapped places when `x` became `-x`?","hints":["In P4, `2^x` and `2^{-x}` swapped places when `x` became `-x`, and their sum came out even. What happens to their difference?","Let `h(x) = 2^x - 2^{-x}`. Then `h(-x) = 2^{-x} - 2^x = -h(x)`. Now check the ring: which order gives +3/2 at `x = 1`?","`f = 2^x`, `g = 2^{-x}`, Difference: `h(1) = 2 - 1/2 = 3/2`. It’s odd, and it passes through (1, 3/2)."]}],"blocks":[{"title":"What the bars show","html":"\u003cp>\u003cstrong>Adding and subtracting functions\u003c/strong>\u003c/p>\u003cul>\u003cli>`(f + g)(x) = f(x) + g(x)`: at each `x`, stack `g`’s bar on `f`’s bar. `(f - g)(x) = f(x) - g(x)`: flip `g`’s bar first, or measure the signed gap from `g`’s graph up to `f`’s.\u003c/li>\u003cli>\u003cstrong>Domain:\u003c/strong> where both `f` and `g` are defined.\u003c/li>\u003cli>\u003cstrong>Sketching:\u003c/strong> where `g(x) = 0` the sum meets `f`’s graph; where `f(x) = 0` it meets `g`’s graph; where `f(x) = -g(x)` it’s on the `x`-axis. Far left and far right, the piece that grows faster takes over.\u003c/li>\u003cli>\u003cstrong>Symmetry:\u003c/strong> even ± even is even; odd ± odd is odd; even + odd (neither one always 0) is neither. Pieces with no symmetry can still combine into an even or odd function, so test the result.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"superposition","name":"Superposition","heading":"Superposition: adding sound waves","intro":"A sound is a wave of air pressure. When two sounds reach your ear together, the pressures add, point by point in time. Mix two waves and watch what the sum does. Then use subtraction to decode a phone key.","shifts":["In step (+0)","Quarter cycle (+π/2)","Flipped (+π)"],"silence":"Silence: the waves cancel completely.","experiments":[{"id":"x1","title":"X1. In step.","setup":"`y = sin 2x` and `y = sin 2x`","q":"What’s the amplitude of the sum?","chips":[{"t":"1","_n":"149ef","_k":"d96ae94d"},{"t":"2","_n":"159bf","_k":"38502694"},{"t":"4","_n":"169cf","_k":"0d49b1ad"}],"conclusion":"In step, the peaks line up, so the amplitudes add: `sin 2x + sin 2x = 2 sin 2x`, and `2 sin 2x + sin 2x = 3 sin 2x`."},{"id":"x2","title":"X2. Flipped.","setup":"`y = 2 sin 2x` and `y = sin(2x + π) = -sin 2x`","q":"What’s the amplitude of the sum?","chips":[{"t":"0","_n":"17a1f","_k":"2678c7d6"},{"t":"1","_n":"18a2f","_k":"6642b9cd"},{"t":"3","_n":"199ff","_k":"2752277f"}],"conclusion":"A flipped wave subtracts: `2 sin 2x - sin 2x = sin 2x`. With equal amplitudes the sum is 0 everywhere. Noise-cancelling headphones do this: they add a flipped copy of the noise."},{"id":"x3","title":"X3. A quarter cycle apart.","setup":"`y = sin x` and `y = cos x`","q":"What’s the highest value of the sum?","chips":[{"t":"1","_n":"1aa0f","_k":"772f8e99"},{"t":"`√2`","_n":"1ba5f","_k":"948c2374"},{"t":"2","_n":"1ca6f","_k":"73d25289"}],"conclusion":"The peaks don’t line up, so the sum never reaches 1 + 1 = 2. It’s a single wave with amplitude √2, highest at `x = π/4`, where each wave is at √2/2."},{"id":"x4","title":"X4. Different pitches.","setup":"`y = sin 2x` and `y = sin 3x`","q":"How long until the sum first repeats?","chips":[{"t":"2π/3","_n":"1da3f","_k":"acdc8743"},{"t":"π","_n":"1ea2f","_k":"5b06433f"},{"t":"2π","_n":"1fa5f","_k":"ed954260"}],"conclusion":"`sin 2x` repeats every π and `sin 3x` every 2π/3. The sum repeats only when both do: first at 2π. It isn’t a single sine wave, and its highest point is about 1.91, not 2."}],"method":"Pick a row tone and leave the column at ‘none’. If the leftover is one clean wave, your row is right, and counting the leftover’s waves from 0 to 2π tells you the column. When the guess is complete, the leftover is flat: 0 everywhere.","keypadNote":"Real keypads use rows of 697, 770, 852 and 941 waves per second and columns of 1209, 1336 and 1477. The idea is the same: two waves, added.","mysteries":[{"id":"d1","name":"Mystery 1","_a":"ShBCDUFDDQQdEFMNWkMNB0w="},{"id":"d2","name":"Mystery 2","_a":"ShBCDUFDDQIdEFMNWkMNCEw="}],"decodeFb":{"rowOnly":"The leftover is one clean wave. Count its waves between 0 and 2π: that’s the column tone.","colOnly":"The leftover is one clean wave, so your column is right. Count its waves to find the row.","wrong":"The leftover is still a mix of waves: its peaks have different heights. Only right tones leave one clean wave (or nothing at all). Try another tone.","done":"✓ Decoded: key {key} (row {row}, column {col}). The leftover is 0 for every `x`: mystery − guess = 0."},"blocks":[{"html":"\u003cdetails class=\"alg\">\u003csummary>Check it with algebra\u003c/summary>\u003cp style=\"margin:10px 0 6px\">\u003cstrong>Why the mixer behaves the way it does\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>In step:\u003c/strong> `A sin nx + B sin nx = (A + B) sin nx`.\u003c/li>\u003cli>\u003cstrong>Flipped:\u003c/strong> `sin(nx + π) = -sin nx` (module 27), so `A sin nx + B sin(nx + π) = (A - B) sin nx`. If `A = B`, the sum is 0 for every `x`: silence.\u003c/li>\u003cli>\u003cstrong>A quarter cycle apart:\u003c/strong> `sin(x + π/2) = cos x`. With the compound angle formula (module 28): `√2 sin(x + π/4) = √2(sin x cos(π/4) + cos x sin(π/4)) = √2(√2/2 · sin x + √2/2 · cos x) = sin x + cos x`. So `sin x + cos x` is a single wave with amplitude √2, highest where `x + π/4 = π/2`, at `x = π/4`. (In general, `A sin nx + B cos nx` has amplitude `√{A^2 + B^2}`.)\u003c/li>\u003cli>\u003cstrong>Different pitches:\u003c/strong> `sin 2x` has period π and `sin 3x` has period 2π/3. The sum repeats only when both pieces do, at the first common multiple of π and 2π/3, which is 2π. In general, `sin mx + sin nx` repeats every 2π ÷ (greatest common factor of `m` and `n`).\u003c/li>\u003cli>\u003cstrong>Why a peak can be lower than `A + B`:\u003c/strong> the sum reaches `A + B` only at an `x` where both waves are at their peaks together.\u003c/li>\u003c/ul>\u003c/details>"}],"quickCheck":{"title":"Superposition quick check","summary":"Superposition quick check","items":[{"id":"q1","goal":5,"prompt":"How long does `y = sin 4x + sin 6x` take to repeat?","choices":[{"t":"π","fb":"Right. `sin 4x` repeats every π/2 and `sin 6x` every π/3. The first time both repeat together is π: the greatest common factor of 4 and 6 is 2, and 2π ÷ 2 = π.","_n":"1ga4f","_k":"098f8154"},{"t":"π/3","fb":"That’s only `sin 6x`’s period. At `x = π/3`, `sin 4x` is partway through a wave.","_n":"1h9ff","_k":"30e9a64e"},{"t":"π/2","fb":"That’s only `sin 4x`’s period. By `x = π/2`, `sin 6x` has done one and a half waves, so it’s flipped: `sin 6(x + π/2) = -sin 6x`.","_n":"1i9ef","_k":"d1736290"},{"t":"π/5","fb":"That’s the period of `sin 10x`, as if the frequencies added. Adding waves adds heights, not frequencies.","_n":"1ja1f","_k":"762314eb"}]},{"id":"q2","goal":4,"prompt":"What is the highest value of `y = sin x + cos x`?","choices":[{"t":"1","fb":"At `x = π/2` the sum is 1 + 0 = 1, but at `x = π/4` it’s √2/2 + √2/2 = √2, which is higher.","_n":"1ka0f","_k":"78574107"},{"t":"2","fb":"That adds the two maximums, but `sin x` peaks at π/2 and `cos x` at 0, never together.","_n":"1labf","_k":"6f3ceb7e"},{"t":"`√2`","fb":"Right. `sin x + cos x = √2 sin(x + π/4)`, highest at `x = π/4`.","_n":"1maaf","_k":"28937edb"},{"t":"`√2/2`","fb":"√2/2 is each wave’s value at `x = π/4`. The sum adds them: √2.","_n":"1n31e","_k":"9ef13510"}]},{"id":"q3","goal":5,"prompt":"A machine’s hum is modelled by `y = 3 sin 2x`. Which wave, added to it, cancels it completely?","choices":[{"t":"`y = -3 sin x`","fb":"Right size, flipped, but the wrong pitch. `sin x` and `sin 2x` can’t cancel everywhere.","_n":"1o32e","_k":"ec216786"},{"t":"`y = 3 sin 2x`","fb":"That’s another copy in step. The sum is `6 sin 2x`, twice as loud.","_n":"1p33e","_k":"4d367828"},{"t":"`y = 3 cos 2x`","fb":"That’s a quarter cycle apart. The sum has amplitude `√{3^2 + 3^2} = 3√2`, louder, not silent.","_n":"1q34e","_k":"f8ad579a"},{"t":"`y = -3 sin 2x`","fb":"Right. Same pitch, same amplitude, flipped: the sum is 0 for every `x`.","_n":"1r2de","_k":"80b69575"}]},{"id":"q4","goal":5,"prompt":"What is the amplitude of `y = 2 sin 3x + sin(3x + π)`?","choices":[{"t":"0","fb":"A flipped wave cancels completely only when the amplitudes match. Here 2 − 1 = 1 is left.","_n":"1s2ee","_k":"82fc0486"},{"t":"3","fb":"That adds the amplitudes, but the second wave is flipped, so it subtracts.","_n":"1t2fe","_k":"c230abce"},{"t":"`√5`","fb":"That’s the rule for waves a quarter cycle apart: `√{2^2 + 1^2}`. These are half a cycle apart.","_n":"1u30e","_k":"23f8a53a"},{"t":"1","fb":"Right. `sin(3x + π) = -sin 3x`, so the sum is `2 sin 3x - sin 3x = sin 3x`.","_n":"1v29e","_k":"ce129cc4"}]}]}},"practice":{"activities":[{"id":"combine","type":"custom","title":"Combine and work backwards","summary":"Combine and work backwards","star":true,"goal":[1,2,3],"instruction":"Find each value. Type a whole number, such as −3, then press Check.","how":"After each check, the mini-graph shows the bars your answer makes.","fallback":"Not this one. Write the sum or difference at that `x` as an equation, put in what you know, and solve for what you don’t.","tableCap":"Table for questions 1 and 2","items":[{"id":"n1","goal":1,"prompt":"Use the table. Find `(f + g)(-2)`.","_a":"AA==","wrong":[{"match":9,"fb":"That adds the sizes 5 and 4. `g(-2) = -4` is below the axis, so it pulls the total down: 5 + (−4) = 1."},{"match":-20,"fb":"That’s `f(-2) × g(-2)`. A sum adds."}],"hints":["`(f + g)(-2) = f(-2) + g(-2)`. Read both values from the table, signs included.","`f(-2) = 5` and `g(-2) = -4`.","`(f + g)(-2) = 5 + (-4) = 1`."]},{"id":"n2","goal":1,"prompt":"Use the table. Find `(f - g)(1)`.","_a":"Ag==","wrong":[{"match":1,"fb":"2 + (−1) adds `g(1)`. For `f - g`, subtract it: 2 − (−1) = 3."},{"match":-3,"fb":"That’s `(g - f)(1)`. Order matters."}],"hints":["`(f - g)(1) = f(1) - g(1)`. Read both values from the table.","`f(1) = 2` and `g(1) = -1`. Subtracting a negative adds.","`(f - g)(1) = 2 - (-1) = 3`."]},{"id":"n3","goal":2,"prompt":"Use the graphs. Find the \u003cstrong>positive\u003c/strong> `x` where `(f + g)(x) = 0`.","_a":"AA==","fig":true,"wrong":[{"match":2,"fb":"At `x = 2`, `g(2) = 0`, so `(f + g)(2) = f(2) = 5`. That’s where the sum’s graph meets `f`’s graph, not the axis."},{"match":-3,"fb":"`(f + g)(-3) = -5 + 5 = 0` too, but −3 isn’t positive."}],"hints":["`(f + g)(x) = 0` where the two bars are equal and opposite: `f(x) = -g(x)`.","Look for an `x` where `f` is some height above the axis and `g` is the same height below it.","At `x = 1`, `f(1) = 3` and `g(1) = -3`, so `(f + g)(1) = 0`. The answer is 1."]},{"id":"n4","goal":1,"prompt":"`(f + g)(3) = 4` and `f(3) = 7`. Find `g(3)`.","_a":"HAE=","wrong":[{"match":11,"fb":"That adds 4 and 7. Work backwards: `g(3) = (f + g)(3) - f(3) = 4 - 7`."},{"match":3,"fb":"Sign slip: 4 − 7 = −3, not 7 − 4."}],"hints":["`(f + g)(3) = f(3) + g(3)`. Put in the two values you know.","4 = 7 + `g(3)`.","`g(3) = 4 - 7 = -3`."]},{"id":"n5","goal":1,"prompt":"`h = f - g`. `h(5) = -2` and `g(5) = -6`. Find `f(5)`.","_a":"HAo=","wrong":[{"match":4,"fb":"That’s `h(5) - g(5)`. From `f - g = h`, `f = h + g`: −2 + (−6)."},{"match":8,"fb":"Right size, wrong sign: −2 + (−6) = −8."}],"hints":["`h(5) = f(5) - g(5)`. Put in the two values you know.","−2 = `f(5)` − (−6), so `f(5)` + 6 = −2.","`f(5) = h(5) + g(5) = -2 + (-6) = -8`."]},{"id":"n6","goal":3,"prompt":"`f(x) = log_{2}(x + 1)` and `g(x) = 1/(x^2 - 4)`. How many integers from −5 to 5 are in the domain of `f + g`?","_a":"BA==","wrong":[{"match":6,"fb":"`g` is also undefined at `x = 2`, where `x^2 - 4 = 0`."},{"match":9,"fb":"That counts `g`’s domain only. `f` also needs `x > -1`."},{"match":10,"fb":"That counts every integer where at least one piece is defined. `f + g` needs both."}],"hints":["`f + g` is defined only where both `f` and `g` are.","`log_{2}(x + 1)` needs `x + 1 > 0`, so `x > -1`. `1/(x^2 - 4)` needs `x ≠ -2` and `x ≠ 2`.","The integers from −5 to 5 with `x > -1` and `x ≠ 2` are 0, 1, 3, 4 and 5: 5 integers."]},{"id":"n7","goal":4,"prompt":"`f` is even and `g` is odd. `(f + g)(2) = 7` and `(f + g)(-2) = 3`. Find `g(2)`.","_a":"Aw==","wrong":[{"match":5,"fb":"That’s `f(2)`. The question asks for `g(2)`."},{"match":4,"fb":"7 − 3 = 4 is `2g(2)`. Halve it."},{"match":10,"fb":"Adding the two equations gives `2f(2) = 10`, which finds `f`. To find `g`, subtract them."}],"why":"`f` is even, so `f(-2) = f(2)`; `g` is odd, so `g(-2) = -g(2)`. The two facts say `f(2) + g(2) = 7` and `f(2) - g(2) = 3`. Subtracting gives `2g(2) = 4`, so `g(2) = 2` (and `f(2) = 5`).","hints":["Use the symmetry: `f(-2) = f(2)` and `g(-2) = -g(2)`.","So `f(2) + g(2) = 7` and `f(2) - g(2) = 3`.","Subtract: `2g(2) = 4`, so `g(2) = 2`."]},{"id":"n8","goal":[1,2],"prompt":"`f(x) = 2^x`, and `g` is a linear function. The graph of `f + g` crosses the `x`-axis at `x = 1` and `x = 2`. Find `(f + g)(3)`.","_a":"Aw==","wrong":[{"match":-6,"fb":"That’s `g(3)`. Add `f(3) = 8`."},{"match":8,"fb":"That’s `f(3)`. Add `g(3) = -6`."},{"match":14,"fb":"`g(3) = -6` is negative: 8 + (−6) = 2."}],"why":"At the zeros, `g` cancels `f`: `g(1) = -2^1 = -2` and `g(2) = -2^2 = -4`. A line through (1, −2) and (2, −4) has slope −2 and passes through the origin: `g(x) = -2x`. So `(f + g)(3) = 8 - 6 = 2`.","hints":["At a zero of `f + g`, `g(x) = -f(x)`. Find `g(1)` and `g(2)`.","`g(1) = -2` and `g(2) = -4`. Find the line through those two points.","`g(x) = -2x`, so `(f + g)(3) = 2^3 + (-6) = 2`."]}]},{"id":"symm","type":"sorter","title":"Even, odd or neither?","summary":"Even, odd or neither?","goal":4,"noun":"function","instruction":"Sort each sum or difference by its symmetry.","how":"Tap a function, then tap the box it belongs in. Test it: compare its value at `x` and at `-x`.","boxes":[{"id":"even","label":"Even","icon":"\u003csvg width=\"44\" height=\"30\" viewBox=\"0 0 44 30\" aria-hidden=\"true\" style=\"vertical-align:middle;flex:none\">\u003cpath d=\"M22 2V28\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"2 3\"/>\u003cpath d=\"M4 5Q22 45 40 5\" fill=\"none\" stroke=\"var(--pen)\" stroke-width=\"2.4\"/>\u003c/svg>"},{"id":"odd","label":"Odd","icon":"\u003csvg width=\"44\" height=\"30\" viewBox=\"0 0 44 30\" aria-hidden=\"true\" style=\"vertical-align:middle;flex:none\">\u003cpath d=\"M2 15H42\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M22 2V28\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003cpath d=\"M4 27C13 27 15 15 22 15C29 15 31 3 40 3\" fill=\"none\" stroke=\"var(--pen)\" stroke-width=\"2.4\"/>\u003ccircle cx=\"22\" cy=\"15\" r=\"2.6\" fill=\"currentColor\"/>\u003c/svg>"},{"id":"neither","label":"Neither","icon":"\u003csvg width=\"44\" height=\"30\" viewBox=\"0 0 44 30\" aria-hidden=\"true\" style=\"vertical-align:middle;flex:none\">\u003cpath d=\"M22 2V28\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"2 3\"/>\u003cpath d=\"M3 25C11 25 15 4 24 7C31 9 34 21 41 18\" fill=\"none\" stroke=\"var(--pen)\" stroke-width=\"2.4\"/>\u003c/svg>"}],"items":[{"id":"s1","t":"`x^2 + cos x`","_a":"E1dGB1hD","why":"Both pieces are even, so `(-x)^2 + cos(-x) = x^2 + cos x`.","wrong":{"odd":"At `-x` the value is the \u003cstrong>same\u003c/strong> as at `x`, not the opposite. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","Both pieces are even, so `(-x)^2 + cos(-x) = x^2 + cos x`, so it’s Even."]},{"id":"s2","t":"`x^3 - sin x`","_a":"E11UBhQ=","why":"Both pieces are odd: `(-x)^3 - sin(-x) = -x^3 + sin x = -(x^3 - sin x)`.","wrong":{"even":"Check the sign: at `-x` the value is the \u003cstrong>opposite\u003c/strong> of the value at `x`. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","Both pieces are odd: `(-x)^3 - sin(-x) = -x^3 + sin x = -(x^3 - sin x)`, so it’s Odd."]},{"id":"s3","t":"`x^2 + x`","_a":"E1xVC0IJUkIT","why":"Even plus odd: the value is 2 at `x = 1` but 0 at `x = -1`.","wrong":{"even":"Compare the values at `x = 1` and `x = -1` (or at π/4 and −π/4 for trig items): they’re neither equal nor opposite.","odd":"`x^2 + x` has an odd piece, but at `x = 1` the value is 2 and at `x = -1` it’s 0, which isn’t −2. Try another box."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","Even plus odd: the value is 2 at `x = 1` but 0 at `x = -1`, so it’s Neither."]},{"id":"s4","t":"`2^x + 2^{-x}`","_a":"E1dGB1hD","why":"The two pieces swap places at `-x`, so the total doesn’t change (P4).","wrong":{"odd":"At `-x` the value is the \u003cstrong>same\u003c/strong> as at `x`, not the opposite. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","`2^x` becomes `2^{-x}`, and `2^{-x}` becomes `2^x`.","The value at `-x` is `2^{-x} + 2^x`, the same as at `x`, so it’s Even."]},{"id":"s5","t":"`2^x - 2^{-x}`","_a":"E11UBhQ=","why":"At `-x` the pieces swap places, which flips the sign of the difference (TC3).","wrong":{"even":"Check the sign: at `-x` the value is the \u003cstrong>opposite\u003c/strong> of the value at `x`. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","At `-x` the pieces swap places, which flips the sign of the difference (TC3), so it’s Odd."]},{"id":"s6","t":"`sin x + cos x`","_a":"E1xVC0IJUkIT","why":"Odd plus even: the value is √2 at `x = π/4` but 0 at `x = -π/4`.","wrong":{"even":"Compare the values at `x = 1` and `x = -1` (or at π/4 and −π/4 for trig items): they’re neither equal nor opposite.","odd":"Compare the values at `x = 1` and `x = -1` (or at π/4 and −π/4 for trig items): they’re neither equal nor opposite."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","Odd plus even: the value is √2 at `x = π/4` but 0 at `x = -π/4`, so it’s Neither."]},{"id":"s7","t":"`x^2 - 1/x^2`","_a":"E1dGB1hD","why":"Both pieces are even, and the domain `x ≠ 0` is symmetric.","wrong":{"odd":"At `-x` the value is the \u003cstrong>same\u003c/strong> as at `x`, not the opposite. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","Both pieces are even, and the domain `x ≠ 0` is symmetric, so it’s Even."]},{"id":"s8","t":"`sin x + 1`","_a":"E1xVC0IJUkIT","why":"The constant 1 is even and `sin x` is odd: the value is 2 at π/2 but 0 at −π/2.","wrong":{"even":"Compare the values at `x = 1` and `x = -1` (or at π/4 and −π/4 for trig items): they’re neither equal nor opposite.","odd":"Compare the values at `x = 1` and `x = -1` (or at π/4 and −π/4 for trig items): they’re neither equal nor opposite."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","The constant 1 is even and `sin x` is odd: the value is 2 at π/2 but 0 at −π/2, so it’s Neither."]},{"id":"s9","t":"`f + g`, where `f` and `g` are both even","_a":"E1dGB1hD","why":"`f(-x) + g(-x) = f(x) + g(x)`.","wrong":{"odd":"At `-x` the value is the \u003cstrong>same\u003c/strong> as at `x`, not the opposite. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","`f(-x) + g(-x) = f(x) + g(x)`, so it’s Even."]},{"id":"s10","t":"`f - g`, where `f` and `g` are both odd","_a":"E11UBhQ=","why":"`f(-x) - g(-x) = -f(x) + g(x) = -(f - g)(x)`.","wrong":{"even":"Check the sign: at `-x` the value is the \u003cstrong>opposite\u003c/strong> of the value at `x`. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","`f(-x) - g(-x) = -f(x) + g(x) = -(f - g)(x)`, so it’s Odd."]},{"id":"s11","t":"`f + g`, where `f` is even, `g` is odd, and neither is 0 everywhere","_a":"E1xVC0IJUkIT","why":"If `f + g` were even, `g` would have to be 0 everywhere; if it were odd, `f` would. So it’s neither.","wrong":{"even":"Compare the values at `x = 1` and `x = -1` (or at π/4 and −π/4 for trig items): they’re neither equal nor opposite.","odd":"Even + odd is odd only if the even piece is 0 everywhere, and here it isn’t. Try another box."},"hints":["Replace `x` with `-x` in each piece.","Which pieces stay the same, and which change sign?","If `f + g` were even, `g` would have to be 0 everywhere; if it were odd, `f` would. So it’s neither, so it’s Neither."]},{"id":"s12","t":"`1/(x - 2) + 1/(x + 2)`","_a":"E11UBhQ=","why":"Neither piece is odd, but at `-x` they swap places and change sign: `1/(-x - 2) + 1/(-x + 2) = -1/(x + 2) - 1/(x - 2)`.","wrong":{"even":"Check the sign: at `-x` the value is the \u003cstrong>opposite\u003c/strong> of the value at `x`. Try `x = 1` and `x = -1`.","neither":"This one does have a symmetry, even if its pieces don’t look alike. Compare its values at `x = 1` and `x = -1`."},"hints":["Replace `x` with `-x` in each piece.","`1/(-x - 2) = -1/(x + 2)`, and `1/(-x + 2) = -1/(x - 2)`.","The value at `-x` is `-1/(x + 2) - 1/(x - 2)`, the opposite of the value at `x`, so it’s Odd."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Olivia","how":"","instruction":"Olivia made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"State the domain of `h(x) = log_{2}(x - 1) + 1/(x - 3)`.","steps":["The domain of `log_{2}(x - 1)` is `{x ∈ ℝ | x > 1}`.","The domain of `1/(x - 3)` is `{x ∈ ℝ | x ≠ 3}`.","`h` is defined wherever at least one of its two pieces is defined.","Every real number is in at least one of the two domains, so the domain of `h` is `{x ∈ ℝ}`."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: the denominator is 0 only at `x = 3`.","","Step 4 follows from step 3’s rule. The mistake is earlier."],"fixes":[{"t":"`h` needs both pieces, so take the `x`-values in both domains: `{x ∈ ℝ | x > 1, x ≠ 3}`.","why":"At `x = 0` the log is undefined, and at `x = 3` the fraction is, so `h` is undefined at both.","_n":"1w2ae","_k":"9256d011"},{"t":"`h` needs both pieces: `{x ∈ ℝ | x > 1}`.","why":"That’s the right rule, but `x = 3` is still in this set, and `1/(3 - 3)` is undefined.","_n":"1x37f","_k":"c80893a5"},{"t":"`h` needs both pieces: `{x ∈ ℝ | x > 3}`.","why":"`x ≠ 3` removes only the single value 3. Numbers between 1 and 3, such as 2, are fine: `h(2) = 0 + (-1) = -1`.","_n":"1y36f","_k":"74a1ca1d"},{"t":"Step 3 is correct as written.","why":"At `x = 0`, `log_{2}(-1)` is undefined, so there’s nothing to add to `1/(0 - 3)`. `h(0)` doesn’t exist.","_n":"1z35f","_k":"a31f5759"}],"hints":["To find `h(x)`, you need both `log_{2}(x - 1)` and `1/(x - 3)`.","Is `h(0)` defined? Is `h(3)`?","Step 3 is wrong. The domain is where both pieces are defined: `{x ∈ ℝ | x > 1, x ≠ 3}`."]},{"id":"e2","goal":2,"task":"`f(x) = x^2 - 4` and `g(x) = x - 2`. Find the `x`-intercepts of `h = f + g`.","steps":["The zeros of `f` are `x = -2` and `x = 2`.","The zero of `g` is `x = 2`.","So the zeros of `f + g` are the zeros of `f` and `g` together: `x = -2` and `x = 2`.","Check: `h(2) = f(2) + g(2) = 0 + 0 = 0`."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","","This arithmetic is right, and `x = 2` really is a zero. But it doesn’t check `x = -2`. The mistake is earlier."],"fixes":[{"t":"Add first: `h(x) = x^2 + x - 6 = (x + 3)(x - 2)`, so the zeros are `x = -3` and `x = 2`.","why":"At `x = -2`, `h(-2) = 0 + (-4) = -4`, not 0. A zero of the sum is where `f(x) = -g(x)`.","_n":"2034f","_k":"d718289c"},{"t":"Only a zero shared by `f` and `g` counts, so the only zero is `x = 2`.","why":"`x = 2` is a zero, but not the only one: `h(-3) = 5 + (-5) = 0`.","_n":"2133f","_k":"d4460bd1"},{"t":"The zeros of `f + g` are where `f(x) = g(x)`: `x^2 - 4 = x - 2`, so `x = -1` and `x = 2`.","why":"`f(x) = g(x)` finds where the graphs cross: the zeros of `f - g`. At `x = -1`, `h(-1) = -3 + (-3) = -6`.","_n":"2232f","_k":"9d6800ef"},{"t":"Step 3 is correct as written.","why":"`h(-2) = f(-2) + g(-2) = 0 + (-4) = -4`, so `x = -2` isn’t a zero of `h`.","_n":"2331f","_k":"5b29870d"}],"hints":["Test step 3’s claim: is `h(-2)` really 0?","`h(-2) = 0 + (-4) = -4`. Where `f` is 0, the sum equals `g`, not 0.","Step 3 is wrong. `h(x) = x^2 + x - 6 = (x + 3)(x - 2)`, so the zeros are −3 and 2."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: a sum that was even when neither piece was, a sum that met `f`’s graph exactly where `g` was zero, or something else?"},{"id":"j2","q":"In your own words, explain why the domain of `f + g` is the set of `x`-values where \u003cstrong>both\u003c/strong> `f` and `g` are defined."},{"id":"j3","q":"Explain to a friend how to sketch `y = 2^x + sin x` from the graphs of `y = 2^x` and `y = sin x`. Which points would you plot first, and why?"},{"id":"j4","q":"Which still trips you up: zeros of a sum, the symmetry of a sum, or adding waves? What will you do about it before module 47?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`f(x) = x^2 + 1` and `g(x) = 2^x`. What is `(f - g)(3)`?","options":[{"t":"−2","why":"That’s `(g - f)(3) = 8 - 10`. Order matters: `f - g` starts with `f`.","_n":"2430f","_k":"25f2866f"},{"t":"2","why":"`f(3) = 10` and `g(3) = 2^3 = 8`, so `(f - g)(3) = 10 - 8 = 2`.","_n":"252ff","_k":"dec493d0"},{"t":"4","why":"That treats `2^x` as `2x`: 10 − 6. But `2^3 = 8`.","_n":"262ef","_k":"ae827be7"},{"t":"18","why":"That’s `(f + g)(3) = 10 + 8`. The question asks for the difference.","_n":"2735f","_k":"f4b5d145"}]},"b":{"prompt":"`f(x) = x^2 - 3` and `g(x) = 3^x`. What is `(f - g)(2)`?","options":[{"t":"−8","why":"`f(2) = 1` and `g(2) = 3^2 = 9`, so `(f - g)(2) = 1 - 9 = -8`.","_n":"2836f","_k":"7bb85a12"},{"t":"−5","why":"That treats `3^x` as `3x`: 1 − 6. But `3^2 = 9`.","_n":"2933f","_k":"9af88c79"},{"t":"8","why":"That’s `(g - f)(2) = 9 - 1`. Order matters.","_n":"2a34f","_k":"6bcd187a"},{"t":"10","why":"That’s `(f + g)(2) = 1 + 9`.","_n":"2b31f","_k":"d2827620"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"`f(x) = log_{2} x` and `g(x) = 1/(x - 5)`. What is the domain of `f + g`?","options":[{"t":"`{x ∈ ℝ | x > 0, x ≠ 5}`","why":"`f + g` needs both values: `log_{2} x` needs `x > 0`, and `1/(x - 5)` needs `x ≠ 5`.","_n":"2c32f","_k":"cdca8515"},{"t":"`{x ∈ ℝ | x ≠ 5}`","why":"At `x = -1`, `log_{2}(-1)` is undefined, so there’s nothing to add.","_n":"2d2ff","_k":"f5ff2b32"},{"t":"`{x ∈ ℝ | x > 0}`","why":"At `x = 5`, `g(5) = 1/0` is undefined, so `(f + g)(5)` is too.","_n":"2e30f","_k":"d56e92ba"},{"t":"`{x ∈ ℝ}`","why":"That’s every `x` where at least one piece is defined. `f + g` needs both.","_n":"2f2df","_k":"660a126a"}]},"b":{"prompt":"`f(x) = 1/(x + 1)` and `g(x) = log_{3}(x + 3)`. What is the domain of `f + g`?","options":[{"t":"`{x ∈ ℝ | x > -3, x ≠ -1}`","why":"`f` needs `x ≠ -1`, and `g` needs `x + 3 > 0`, so `x > -3`.","_n":"2g2ef","_k":"b8456f19"},{"t":"`{x ∈ ℝ}`","why":"That’s every `x` where at least one piece is defined. `f + g` needs both.","_n":"2h1c0","_k":"ae96fe2c"},{"t":"`{x ∈ ℝ | x ≠ -1}`","why":"At `x = -4`, `log_{3}(-1)` is undefined.","_n":"2i1b0","_k":"2dd4df68"},{"t":"`{x ∈ ℝ | x > -3}`","why":"At `x = -1`, `f(-1) = 1/0` is undefined.","_n":"2j1e0","_k":"640fb9dc"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"`f` and `g` are both even functions. Which must be true of `f - g`?","options":[{"t":"It must be neither, because a difference of two functions has no symmetry.","why":"`x^2 - cos x` is a difference of two even functions, and it’s even.","_n":"2k1d0","_k":"0a904730"},{"t":"It is even only when `f` and `g` have the same graph.","why":"It’s even for every pair of even functions: `x^2 - cos x` is even, and `x^2` and `cos x` have different graphs.","_n":"2l200","_k":"21eca846"},{"t":"It must be even.","why":"`(f - g)(-x) = f(-x) - g(-x) = f(x) - g(x) = (f - g)(x)`.","_n":"2m1f0","_k":"5781eeb3"},{"t":"It must be odd, because subtracting changes the signs.","why":"Subtracting changes the sign of `g`’s values, not the symmetry: `f(-x) - g(-x)` is still `f(x) - g(x)`.","_n":"2n220","_k":"0ad06b3e"}]},"b":{"prompt":"`f` and `g` are both odd functions. Which must be true of `f + g`?","options":[{"t":"It must be even, because odd + odd = even, as with numbers.","why":"That’s a rule for odd \u003cstrong>numbers\u003c/strong>. For functions, `x + x^3` is a sum of two odd functions, and it’s odd.","_n":"2o210","_k":"ba4ed5c8"},{"t":"It is odd only when `f` and `g` have the same graph.","why":"It’s odd for every pair of odd functions: `x + sin x` is odd, and `x` and `sin x` have different graphs.","_n":"2p240","_k":"f5956696"},{"t":"It must be neither, because adding mixes the two functions.","why":"`x + sin x` is a sum of two odd functions, and it’s odd.","_n":"2q230","_k":"57f6cc14"},{"t":"It must be odd.","why":"`(f + g)(-x) = -f(x) - g(x) = -(f + g)(x)`.","_n":"2r71f","_k":"75ee65a7"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"`f(x) = x^2` and `g(x) = x + 6`. At which `x`-values does the graph of `f - g` cross the `x`-axis?","options":[{"t":"There are none, because `x^2 + x + 6` is never 0.","why":"That’s `f + g`. For `f - g`, subtract all of `g`: `x^2 - (x + 6) = x^2 - x - 6`.","_n":"2s70f","_k":"397ef4ac"},{"t":"`x = -6` and `x = 0`","why":"Those are the zeros of `g` and of `f`. At `x = 0`, `(f - g)(0) = 0 - 6 = -6`, not 0.","_n":"2t6ff","_k":"6fcc579e"},{"t":"`x = -3` and `x = 2`","why":"Sign slip in factoring: `(x + 3)(x - 2) = x^2 + x - 6`. Expand to check.","_n":"2u6ef","_k":"a5b84140"},{"t":"`x = -2` and `x = 3`","why":"`(f - g)(x) = x^2 - x - 6 = (x - 3)(x + 2)`. These are also the `x`-values where the graphs of `f` and `g` cross.","_n":"2v75f","_k":"5306d00f"}]},"b":{"prompt":"`f(x) = x^2` and `g(x) = 2x + 8`. At which `x`-values does the graph of `f - g` cross the `x`-axis?","options":[{"t":"`x = -4` and `x = 2`","why":"Sign slip in factoring: `(x + 4)(x - 2) = x^2 + 2x - 8`.","_n":"2w74f","_k":"1600c364"},{"t":"There are none, because `x^2 + 2x + 8` is never 0.","why":"That’s `f + g`. Subtract all of `g`: `x^2 - 2x - 8`.","_n":"2x73f","_k":"90112930"},{"t":"`x = -4` and `x = 0`","why":"Those are the zeros of `g` and of `f`. At `x = 0`, `(f - g)(0) = -8`.","_n":"2y72f","_k":"6d57d318"},{"t":"`x = -2` and `x = 4`","why":"`(f - g)(x) = x^2 - 2x - 8 = (x - 4)(x + 2)`.","_n":"2z69f","_k":"8f044820"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Which describes the graph of `h(x) = 3^x + 3^{-x}`?","options":[{"t":"Neither even nor odd, with lowest point (0, 2)","why":"Neither piece is even, but the sum is: `h(-x) = h(x)`.","_n":"3068f","_k":"929381a7"},{"t":"Odd, passing through (0, 0)","why":"That describes `3^x - 3^{-x}`. Here `h(0) = 2`.","_n":"316bf","_k":"dcdae404"},{"t":"Even, with lowest point (0, 1)","why":"`3^0 = 1` for each piece, so `h(0) = 1 + 1 = 2`.","_n":"326cf","_k":"c5a63f52"},{"t":"Even, with lowest point (0, 2)","why":"`h(-x) = 3^{-x} + 3^x = h(x)`, so it’s even. `h(0) = 1 + 1 = 2`, and moving away from 0 either way, one piece grows faster than the other shrinks (`h(1) = h(-1) = 3 + 1/3 = 10/3`), so (0, 2) is the lowest point.","_n":"336df","_k":"afc0b8eb"}]},"b":{"prompt":"Which describes the graph of `h(x) = 3^x - 3^{-x}`?","options":[{"t":"Even, with lowest point (0, 2)","why":"That describes `3^x + 3^{-x}`. Here `h(0) = 0`.","_n":"346ef","_k":"5e62eaa2"},{"t":"Odd and increasing, passing through (0, 0)","why":"`h(-x) = 3^{-x} - 3^x = -h(x)`, so it’s odd, and `h(0) = 1 - 1 = 0`. `3^x` rises, and `-3^{-x}` rises too (`3^{-x}` falls, and the minus flips it), so the sum rises.","_n":"356ff","_k":"9318b23f"},{"t":"Odd and decreasing, passing through (0, 0)","why":"`3^{-x}` falls, but it’s subtracted, so `-3^{-x}` rises. Rising plus rising is rising.","_n":"3670f","_k":"8eba480e"},{"t":"Neither even nor odd, increasing, passing through (0, 0)","why":"`h(-x) = -h(x)`: it’s odd, even though neither piece is.","_n":"3771f","_k":"193f71c6"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Which describes the end behaviour of `h(x) = x^4 - 3^x`?","options":[{"t":"As `x → -∞`, `h(x) → -∞`; as `x → ∞`, `h(x) → -∞`","why":"That lets `3^x` win at both ends. Far left, `3^x → 0`, so `x^4` takes over.","_n":"3872f","_k":"2f5b9426"},{"t":"As `x → -∞`, `h(x) → 0`; as `x → ∞`, `h(x) → -∞`","why":"`3^x → 0` far left, but `x^4` doesn’t: `h(x)` is about `x^4` there.","_n":"3963f","_k":"7e72c4d9"},{"t":"As `x → -∞`, `h(x) → ∞`; as `x → ∞`, `h(x) → -∞`","why":"Far left, `3^x → 0`, so `x^4` takes over and `h → ∞`. Far right, `3^x` eventually outgrows any power (`3^{10} = 59 049`, while `10^4 = 10 000`), and it’s subtracted, so `h → -∞`.","_n":"3a64f","_k":"bf02b18d"},{"t":"As `x → -∞`, `h(x) → ∞`; as `x → ∞`, `h(x) → ∞`","why":"That lets `x^4` win at both ends. An exponential eventually beats every power of `x`.","_n":"3bddf","_k":"5ad3e983"}]},"b":{"prompt":"Which describes the end behaviour of `h(x) = 3^{-x} - x^4`?","options":[{"t":"As `x → -∞`, `h(x) → ∞`; as `x → ∞`, `h(x) → 0`","why":"`3^{-x} → 0` far right, but `-x^4` doesn’t: `h(x)` is about `-x^4` there.","_n":"3cdcf","_k":"fe45570d"},{"t":"As `x → -∞`, `h(x) → -∞`; as `x → ∞`, `h(x) → -∞`","why":"That lets `-x^4` win at both ends. Far left, the exponential wins.","_n":"3ddff","_k":"014f1797"},{"t":"As `x → -∞`, `h(x) → ∞`; as `x → ∞`, `h(x) → ∞`","why":"Far right, `-x^4 → -∞`: the minus sign stays.","_n":"3edef","_k":"e2768315"},{"t":"As `x → -∞`, `h(x) → ∞`; as `x → ∞`, `h(x) → -∞`","why":"Far left, `3^{-x}` outgrows any power (at `x = -10` it’s `3^{10} = 59 049`, while `x^4 = 10 000`), so `h → ∞`. Far right, `3^{-x} → 0`, so `-x^4` takes over and `h → -∞`.","_n":"3fe1f","_k":"f2b1c68a"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of how to find the point on the graph of `f + g` at `x = 3`, using the graphs of `f` and `g`?","options":[{"t":"“Add the two points: (3, `f(3)`) + (3, `g(3)`) = (6, `f(3) + g(3)`).”","why":"The input stays 3. Only the outputs add.","_n":"3ge0f","_k":"aee8eee9"},{"t":"“Measure the two heights as lengths and add them, since lengths are never negative.”","why":"If `g(3)` is below the axis, it pulls the sum down. Lengths lose that sign.","_n":"3he3f","_k":"418cb61d"},{"t":"“Find where the graphs of `f` and `g` cross; that point is on the graph of `f + g`.”","why":"Where the graphs cross, `f(x) = g(x)`, so the sum there is `2f(x)`, not `f(x)`.","_n":"3ie2f","_k":"f31056c1"},{"t":"“Read `f(3)` and `g(3)` at the same `x`, keep their signs, and add them. The point is (3, `f(3) + g(3)`).”","why":"Same input, signed outputs added: that’s the definition of `f + g`.","_n":"3je5f","_k":"d78cfe5a"}]},"b":{"prompt":"Which is the best explanation of how to find the point on the graph of `f - g` at `x = 3`, using the graphs of `f` and `g`?","options":[{"t":"“Either order works: `f(3) - g(3)` and `g(3) - f(3)` give the same point.”","why":"They’re opposites. `f - g` starts with `f`.","_n":"3ke4f","_k":"511f5841"},{"t":"“Measure the gap between the two graphs as a length, so the height is never negative.”","why":"If `f`’s graph is below `g`’s, the difference is negative.","_n":"3lf7f","_k":"81be2f88"},{"t":"“Read `f(3)` and `g(3)` at the same `x`, keep their signs, and subtract. The point is (3, `f(3) - g(3)`): its height is the signed gap from `g`’s graph up to `f`’s.”","why":"Same input, signed outputs subtracted in order.","_n":"3mf8f","_k":"79f105f5"},{"t":"“Subtract the two points: (3, `f(3)`) − (3, `g(3)`) = (0, `f(3) - g(3)`).”","why":"The input stays 3.","_n":"3nf5f","_k":"bdee65e8"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"`f(x) = x^2 + 1` and `g(x) = log_{2} x`. Which statement is written correctly?","options":[{"t":"`f + g(2) = 5 + 1 = 6`","why":"Without brackets, ‘`f + g(2)`’ means the function `f` plus the number `g(2)`. Write `(f + g)(2)`.","_n":"3of6f","_k":"2657ad06"},{"t":"`(f + g)(2) = f(2) · g(2) = 5`","why":"That’s the product `f · g` at 2 (module 47). The sum adds: 5 + 1 = 6.","_n":"3pf3f","_k":"3b92cf80"},{"t":"`(f + g)(2) = f(2) + g(2) = 5 + 1 = 6`","why":"The brackets around `f + g` name the new function, and its value at 2 is the sum of the two values at 2.","_n":"3qf4f","_k":"4504bc8d"},{"t":"`(f + g)(2) = f(2 + 2) = f(4) = 17`","why":"That adds the inputs. `f + g` adds the outputs at the same input.","_n":"3rf1f","_k":"641de660"}]},"b":{"prompt":"`f(x) = 2^x` and `g(x) = x^2`. Which statement is written correctly?","options":[{"t":"`(f - g)(3) = f(3 - 3) = f(0) = 1`","why":"That subtracts the inputs. `f - g` subtracts the outputs at the same input.","_n":"3sf2f","_k":"8a3499f6"},{"t":"`(f - g)(3) = f(3) - g(3) = 8 - 9 = -1`","why":"The brackets name the new function, and its value at 3 is `f(3) - g(3)`.","_n":"3teff","_k":"dc7df5cb"},{"t":"`f - g(3) = 8 - 9 = -1`","why":"Without brackets, ‘`f - g(3)`’ means the function `f` minus the number `g(3)`. Write `(f - g)(3)`.","_n":"3uf0f","_k":"65422b42"},{"t":"`(f - g)(3) = g(3) - f(3) = 9 - 8 = 1`","why":"That’s `(g - f)(3)`. Order matters.","_n":"3v6a0","_k":"8ce2f33e"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Two speakers play the same note. At one seat, their waves are `y = 2 sin 4x` and `y = sin(4x + π)`. What does a listener at that seat hear?","options":[{"t":"The wave `y = sin 8x`, because the pitches add.","why":"Adding waves adds heights at each `x`; it doesn’t add frequencies. Both waves have frequency 4, and so does the sum.","_n":"3w690","_k":"7152d543"},{"t":"The wave `y = sin 4x`: the same pitch, with amplitude 1","why":"`sin(4x + π) = -sin 4x`, so the sum is `2 sin 4x - sin 4x = sin 4x`. The flipped wave takes away part of the first one.","_n":"3x680","_k":"504f0276"},{"t":"The wave `y = 3 sin 4x`, because the amplitudes add.","why":"The second wave is flipped, so it subtracts.","_n":"3y670","_k":"482522eb"},{"t":"Silence, because a flipped wave cancels.","why":"It cancels completely only if the amplitudes match. Here 2 − 1 = 1 is left.","_n":"3z660","_k":"d9a39f25"}]},"b":{"prompt":"At another seat, the waves are `y = 3 sin 2x` and `y = 2 sin(2x + π)`. What does a listener at that seat hear?","options":[{"t":"The wave `y = 5 sin 2x`, because the amplitudes add.","why":"The second wave is flipped, so it subtracts.","_n":"40650","_k":"7f036721"},{"t":"The wave `y = sin 4x`, because the pitches add.","why":"Adding waves doesn’t add frequencies. Both waves have frequency 2, and so does the sum.","_n":"41640","_k":"357982bd"},{"t":"The wave `y = sin 2x`: the same pitch, with amplitude 1","why":"`sin(2x + π) = -sin 2x`, so the sum is `3 sin 2x - 2 sin 2x = sin 2x`.","_n":"42630","_k":"c8338862"},{"t":"Silence, because a flipped wave cancels.","why":"It cancels completely only if the amplitudes match. Here 3 − 2 = 1 is left.","_n":"43720","_k":"75056f4a"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A school club sells `x` hoodies. Its revenue is `R(x) = 50x - x^2` dollars (the price drops as it sells more), and its cost is `C(x) = 10x + 300` dollars. Profit is `P = R - C`. For which numbers of hoodies is the profit positive?","options":[{"t":"`10 \u003c x \u003c 30`","why":"`P(x) = 50x - x^2 - (10x + 300) = -x^2 + 40x - 300 = -(x - 10)(x - 30)`. It’s positive between its zeros, where the revenue graph is above the cost graph.","_n":"44710","_k":"8fdfc74d"},{"t":"`x > 10`","why":"Profit turns positive at 10, but revenue falls again as the price drops, so the profit is negative again past 30. Check `x = 40`: `P(40) = -300`.","_n":"45e40","_k":"4c6fdd10"},{"t":"`x \u003c 10` or `x > 30`","why":"Sign slip: `-(x - 10)(x - 30)` is positive \u003cstrong>between\u003c/strong> 10 and 30, because its leading coefficient is negative.","_n":"46e50","_k":"afbf4c2a"},{"t":"`0 \u003c x \u003c 50`","why":"That’s where revenue is positive. Profit is revenue \u003cstrong>minus\u003c/strong> cost.","_n":"47e60","_k":"75b5aa0c"}]},"b":{"prompt":"A club’s revenue is `R(x) = 60x - x^2` dollars and its cost is `C(x) = 20x + 375` dollars for `x` items. Profit is `P = R - C`. For which numbers of items is the profit positive?","options":[{"t":"`x > 15`","why":"Profit is negative again past 25. Check `x = 30`: `P(30) = -75`.","_n":"48e70","_k":"c799be02"},{"t":"`15 \u003c x \u003c 25`","why":"`P(x) = -x^2 + 40x - 375 = -(x - 15)(x - 25)`, positive between its zeros.","_n":"49dff","_k":"50105658"},{"t":"`x \u003c 15` or `x > 25`","why":"Sign slip: with a negative leading coefficient, the profit is positive between the zeros.","_n":"4ae0f","_k":"348d8a9a"},{"t":"`0 \u003c x \u003c 60`","why":"That’s where revenue is positive. Profit is revenue minus cost.","_n":"4be1f","_k":"5b825a00"}]}}]},"task":{"title":"Build to spec","summary":"Build to spec","statement":"\u003cp>Build `h(x) = f(x) + c · g(x)` so that \u003cstrong>(1)\u003c/strong> its domain is `{x ∈ ℝ | x > 0}`, \u003cstrong>(2)\u003c/strong> its graph passes through (1, 1), and \u003cstrong>(3)\u003c/strong> it increases over its whole domain. There’s more than one design. Can you find three that are different functions?\u003c/p>","checks":["The domain of `h` is `{x ∈ ℝ | x > 0}`","`h` passes through (1, 1)","`h` increases over its whole domain"],"tips":["Right now the domain of `h` is {set}. Only one library function stops at `x = 0` and refuses every `x ≤ 0`. Use it, and pair it with a function that’s defined for every `x > 0`.","Right now `h(1)` = {value}. `log_{2} 1 = 0`, so if one piece is `log_{2} x`, the other piece, times its `c`, must equal 1 at `x = 1`.","`h` goes down somewhere, for example between `x` = {a} and `x` = {b}. A falling piece (such as `1/x`, or a rising function with a negative `c`) can pull the total down. Rising pieces with `c > 0` are safe, but test anything else."],"sameFn":"{new} is the same function as {old}. Designs that make the same function count once.","explainPrompt":"Explain why your design meets all three conditions.","vocab":"Use the words domain, both, log₂ 1 = 0 and increasing.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"Notice: `log_{2} 1 = 0`, so the log adds nothing at `x = 1`, and the other piece has to supply the 1. And `log_{2} x + 2 · 2^{-x}` works even though `2^{-x}` falls: the log always rises faster than `2 · 2^{-x}` falls. Rising plus falling can still rise."},"cards":[["`(f + g)(x)`","`f(x) + g(x)`: add the signed outputs at the same `x`. If `f(1) = 2` and `g(1) = -1`, then `(f + g)(1) = 1`, at the point (1, 1)."],["`(f - g)(x)`","`f(x) - g(x)`: the signed gap from `g`’s graph up to `f`’s. Order matters: `g - f` is its opposite."],["The domain of `f + g` or `f - g`","Where \u003cstrong>both\u003c/strong> are defined. `log_{2} x + 1/(x - 2)` has domain `{x ∈ ℝ | x > 0, x ≠ 2}`."],["Zeros of `f + g`","Where `f(x) = -g(x)`, not the zeros of `f` and `g`. `x^2 - 4` and `x - 2` add to `(x + 3)(x - 2)`: zeros −3 and 2."],["Where the graph of `f + g` meets the graph of `f`","Where `g(x) = 0`. `2^x + sin x` meets `2^x` at `x = -π`, 0, π, …"],["Zeros of `f - g`","Where `f(x) = g(x)`: where the graphs of `f` and `g` cross."],["Symmetry rules","Even ± even is even; odd ± odd is odd; even + odd (neither one 0 everywhere) is neither."],["Two functions with no symmetry","Can still combine into one: `2^x + 2^{-x}` is even, and `2^x - 2^{-x}` is odd. Test the result."],["Far left and far right","The faster-growing piece takes over. `x^2 - 2^x → -∞` as `x → ∞` (`2^x` wins) and → ∞ as `x → -∞` (`2^x → 0`, so `x^2` wins)."],["Superposition","Adding waves point by point. In step, the amplitudes add; flipped, they subtract; equal and flipped, they cancel (noise-cancelling headphones)."],["How long a sum of waves takes to repeat","Until both pieces repeat together. `sin 2x` (period π) + `sin 3x` (period 2π/3) repeats every 2π. A phone key’s tone is a sum of two waves."],["The highest point of `f + g`","At most max `f` + max `g`, and only that high if both peak at the same `x`. `sin x + cos x` tops out at √2, not 2."]]}};</script>
