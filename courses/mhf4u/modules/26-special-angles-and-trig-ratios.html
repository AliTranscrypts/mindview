.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 26: unit circle dots (N12), explorer controls and readout, family sign grid, find-the-angles, task inputs */
.uc-dots{position:static}
.uc-dot{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2;cursor:pointer}
.uc-dot:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.ux-step{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn.ux-pm{font-size:1.5rem;line-height:1;min-width:52px;min-height:44px;padding:.15em .6em}
.ux-now{font:400 1.25rem var(--font-math);min-width:6em;text-align:center}
.ux-tg{margin:12px 0 0}
.ux-pin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px}
.ux-tip{margin:10px 0 0}
.ux-pin .linkbtn{padding:2px 4px;color:var(--pen);font-weight:700;min-height:24px}
.read > div.uc-hl{background:var(--hi-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
.read > div.uc-flash{animation:ucflash .9s ease-out}
@keyframes ucflash{0%{background:var(--hi)}100%{background:var(--hi-soft)}}
.uc-red{color:var(--red);font-weight:700}
.read dd .m{font-size:1.1em}
.pg-read .read dd{line-height:1.5}
.hero .hero-eq.md{font-size:clamp(2.2rem,5.6vw,3.5rem)}
/* Part 3 */
.fam-h{font-size:1rem;margin:0 0 8px}
.fam-h + .chips{margin-bottom:16px}
.fam-mv{display:flex;flex-wrap:wrap;gap:8px}
.fam-cap{margin:10px 0 0;min-height:2.6em}
.fam-cap .m{white-space:normal}
table.sg td{padding:6px 10px}
table.sg th[scope=row]{font-family:var(--font-math);font-size:1.1rem;color:var(--ink);background:var(--paper)}
.sg-pair{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;vertical-align:middle}
.sg-pair button{min-width:40px;min-height:40px;border:0;background:var(--sheet);font:700 1.2rem var(--font-math);padding:0 .4em}
.sg-pair button + button{border-left:1.5px solid var(--ink)}
.sg-pair button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.sg-pair button:disabled{color:inherit}
.sg-pair button[aria-pressed="true"]:disabled{color:var(--sheet)}
table.sg td.bad .sg-pair{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
table.sg td.bad{background:var(--bad-bg)}
table.sg td.good{background:var(--good-bg)}
.sg-x{color:var(--red);font-weight:700;margin-left:6px}
.sg-ok{color:var(--green);font-weight:700;margin-left:6px}
ul.sg-fb{margin:6px 0 0;padding-left:1.2em}
ul.sg-fb li{margin:4px 0}
table.fam-num td{text-align:left}
.sgn{display:inline-block;min-width:.75em;text-align:right}
/* Practice 2 */
.fa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:6px}
.fa-plot{max-width:460px;width:100%}
.fa-q{font:400 1.7rem var(--font-math);margin:0 0 8px}
.fa-q .m{white-space:normal}
/* task */
.tk-in{display:flex;flex-wrap:wrap;gap:8px 28px;margin:8px 0 14px}
.tk-row{display:flex;align-items:center;gap:10px}
.tk-name{font:400 1.6rem var(--font-math)}
.tk-frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.tk-frac input,.tk-frac select{width:4.4rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.3em .4em;font:400 1.2rem var(--font-math);text-align:center;min-height:38px}
.tk-frac input:focus,.tk-frac select:focus{border-color:var(--ink)}
.tk-line{display:block;width:100%;height:2px;background:var(--ink)}
.tk-pi{font:400 1.7rem var(--font-math)}
.tk-cap{font-size:clamp(1.3rem,3.4vw,1.8rem)}
.tk-bars{margin-top:12px;display:grid;gap:8px}
.tk-bar-row{display:grid;grid-template-columns:4.2em minmax(0,1fr) 4.6em;align-items:center;gap:10px}
.tk-bl{font-size:1.05rem}
.tk-track{position:relative;display:block;height:16px;border:1.5px solid var(--rule);border-radius:4px;background:var(--paper)}
.tk-track b{position:absolute;top:2px;bottom:2px;border-radius:2px}
.tk-zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-2)}
.tk-bv{font-size:1.05rem}
.tk-verdict{margin:2px 0 0}
@media (max-width:820px){
  .fa{grid-template-columns:minmax(0,1fr)}
  .fa-plot{max-width:none}
}
@media (max-width:560px){
  table.sg th,table.sg td{padding:5px 4px}
  table.sg td{position:relative;padding-right:12px}
  .sg-pair button{min-width:33px;padding:0 .2em}
  .sg-x,.sg-ok{position:absolute;top:1px;right:1px;margin:0;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){
  .read > div.uc-flash{animation:none}
}

","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"7a1a73a3","content":{"id":"26-special-angles-and-trig-ratios","kind":"topic","title":"Special angles and trig ratios","topic":"Special Angles and Trig Ratios","readyTopic":"special angles and trig ratios","hero":{"eq":"`P(@t{θ}) = (cos @t{θ}, sin @t{θ})`","eqLabel":"P of theta equals cos theta, sin theta","eqSize":"md","headline":"Every angle is a point on a circle","text":"Put the centre of a circle of radius 1 at the origin. This is the \u003cstrong>unit circle\u003c/strong>. Any angle `@t{θ}` in standard position ends at a point on it, and that point’s coordinates are `(cos @t{θ}, sin @t{θ})`. For the \u003cstrong>special angles\u003c/strong> (multiples of `π/6`, `π/4` and `π/3`), those coordinates are exact values you can find without a calculator, using just two triangles.","fig":{"aria":"Unit circle. The terminal arm sweeps through the 16 special angles and leaves a dot at each one.","shape":"square"}},"goals":["I can use the two special triangles to find the exact sine, cosine and tangent of `π/6`, `π/4` and `π/3`.","I can place any multiple of `π/6`, `π/4` or `π/3` (from 0 to `2π`) on the unit circle and name its quadrant and reference angle.","I can use the CAST rule to decide whether sin, cos and tan are positive or negative in each quadrant.","I can find the exact sine, cosine and tangent of any special angle from 0 to `2π`, including 0, `π/2`, `π`, `3π/2` and `2π`.","I can find the exact values of csc, sec and cot, and say when each one is undefined.","I can use exact values to solve problems, such as finding `@t{θ}` from a ratio and a quadrant, or finding coordinates on a circle."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Special triangles","goal":1,"prompt":"In a 30°–60°–90° triangle with hypotenuse 2, how long is the side opposite the 30° angle?","options":[{"t":"`√2`","why":"`√2` belongs to the 45°–45°–90° triangle with legs 1 and 1. This triangle’s sides are 1, `√3` and 2.","_n":"09e3","_k":"ae6bd49c"},{"t":"`√3`","why":"`√3` is opposite the 60° angle. The side opposite the smaller angle (30°) is the shorter one.","_n":"1a13","_k":"735685b5"},{"t":"`{1}/{2}`","why":"`{1}/{2}` is the \u003cstrong>ratio\u003c/strong> sin 30° = opposite/hypotenuse. The question asks for the side itself: `{1}/{2} × 2 = 1`.","_n":"2a03","_k":"81022113"},{"t":"1","why":"The shortest side is opposite the smallest angle. In a 30°–60°–90° triangle it’s exactly half the hypotenuse: 2 ÷ 2 = 1.","_n":"3a33","_k":"c09f6b16"}],"hints":["The side opposite the smallest angle is the shortest side.","In a 30°–60°–90° triangle, the shortest side is exactly half the hypotenuse.","Half of 2 is 1, so the side opposite 30° is 1. (The other leg is `√3`, because `1^2 + (√3)^2 = 2^2`.)"]},{"id":"w2","skill":"Special triangles","goal":1,"prompt":"What is the exact value of cos 45°?","options":[{"t":"`{√2}/{2}`","why":"In the 45°–45°–90° triangle with legs 1 and 1, the hypotenuse is `√2`, so cos 45° = `{1}/{√2} = {√2}/{2}`.","_n":"4a23","_k":"942e6970"},{"t":"`{1}/{2}`","why":"`{1}/{2}` is cos 60°. For 45°, use the triangle with legs 1, 1 and hypotenuse `√2`.","_n":"5a53","_k":"03525a1d"},{"t":"`{√3}/{2}`","why":"`{√3}/{2}` is cos 30°, from the 30°–60°–90° triangle.","_n":"6a43","_k":"7adf367b"},{"t":"1","why":"1 is tan 45° (opposite ÷ adjacent = 1 ÷ 1). Cosine is adjacent ÷ hypotenuse = `{1}/{√2}`.","_n":"7a73","_k":"d15e0f09"}],"hints":["Use the 45°–45°–90° triangle with legs 1 and 1.","Its hypotenuse is `√{1^2 + 1^2} = √2`. Cosine is adjacent over hypotenuse.","cos 45° = `{1}/{√2}`. Multiply the top and bottom by `√2` to get `{√2}/{2}`."]},{"id":"w3","skill":"Radian measure","goal":2,"prompt":"Which angle in radians equals 120°?","options":[{"t":"`π/3`","why":"120° is one-third of a full turn, but a full turn is `2π`, not `π`. One-third of `2π` is `2π/3`.","_n":"8a63","_k":"e92878bb"},{"t":"`120π`","why":"The conversion factor is `π/180`, not `π`: `120 × π/180 = 2π/3`.","_n":"9bc9","_k":"43f60424"},{"t":"`2π/3`","why":"Multiply by `π/180`: `120 × π/180 = 2π/3`.","_n":"abd9","_k":"1f2aaee8"},{"t":"`3π/2`","why":"That’s `{180}/{120} × π`. The factor is upside down: `3π/2` is 270°.","_n":"bbe9","_k":"d87b04b9"}],"hints":["To change degrees to radians, multiply by `π/180`.","`120 × π/180 = 120π/180`. Simplify the fraction `{120}/{180}`.","`{120}/{180} = {2}/{3}`, so 120° = `2π/3`."]},{"id":"w4","skill":"Radian measure","goal":2,"prompt":"In which quadrant is the terminal arm of `5π/4`?","options":[{"t":"Quadrant 1","why":"`π/4` is in quadrant 1, but `5π/4 = π/4 + π` is a further half turn, which lands in quadrant 3.","_n":"cbf9","_k":"df515693"},{"t":"Quadrant 3","why":"With quarters of `π` as the unit: `π = 4π/4` and `3π/2 = 6π/4`. `5π/4` is between them, so it’s in quadrant 3.","_n":"dc09","_k":"a32b7fba"},{"t":"Quadrant 4","why":"Quadrant 4 starts at `3π/2 = 6π/4`. `5π/4` hasn’t reached it.","_n":"ec19","_k":"c2439c7d"},{"t":"Quadrant 2","why":"`π` is `4π/4`, so `5π/4` is already past the negative `x`-axis.","_n":"fc29","_k":"a1280659"}],"hints":["Write the quadrant boundaries in quarters of `π`: `π/2 = 2π/4`, `π = 4π/4`, `3π/2 = 6π/4`.","Which two boundaries does `5π/4` fall between?","`4π/4 \u003c 5π/4 \u003c 6π/4`, so it’s between `π` and `3π/2`: quadrant 3."]},{"id":"w5","skill":"Radicals","goal":1,"prompt":"Simplify `{2}/{√2}`.","options":[{"t":"1","why":"`√2` isn’t 2, it’s about 1.41. So `{2}/{√2} ≈ 1.41`, not 1.","_n":"gc39","_k":"740181c1"},{"t":"`√2`","why":"Multiply the top and bottom by `√2`: `{2√2}/{2} = √2`. Check: `√2 ≈ 1.41`, and 2 ÷ 1.41 ≈ 1.41.","_n":"hc49","_k":"afccfd6a"},{"t":"`2√2`","why":"You multiplied the top by `√2` but not the bottom. `√2 × √2 = 2`, so `{2√2}/{2} = √2`.","_n":"ic59","_k":"9af6fcad"},{"t":"`{√2}/{2}`","why":"`{√2}/{2} ≈ 0.71`, which is `{1}/{√2}`, the reciprocal of `√2`. But `{2}/{√2}` is bigger than 1.","_n":"jce9","_k":"74ddb74a"}],"hints":["Clear the square root from the bottom by multiplying the top and bottom by `√2`.","`(2 × √2)/(√2 × √2) = {2√2}/{2}`.","`{2√2}/{2} = √2`."]},{"id":"w6","skill":"Terminal arm ratios","goal":4,"prompt":"The terminal arm of angle `@t{θ}` passes through (−3, 4). What is `sin @t{θ}`?","options":[{"t":"`-{3}/{5}`","why":"`-{3}/{5}` is `x/r`, which is `cos @t{θ}`. Sine uses `y`.","_n":"kcd9","_k":"651f1552"},{"t":"`-{4}/{3}`","why":"`-{4}/{3}` is `y/x`, which is `tan @t{θ}`. Sine is `y/r`.","_n":"ld09","_k":"85a8b7c0"},{"t":"`{4}/{5}`","why":"`r = √{(-3)^2 + 4^2} = 5`, and `sin @t{θ} = y/r = {4}/{5}`.","_n":"mcf9","_k":"4a4d8a05"},{"t":"`-{4}/{5}`","why":"`y = 4` is positive and `r` is always positive, so `sin @t{θ} = {4}/{5}` is positive. The point is in quadrant 2, where sine is positive.","_n":"nd29","_k":"4269bdf0"}],"hints":["First find `r`, the distance from the origin: `r = √{x^2 + y^2}`.","`r = √{9 + 16} = 5`. Sine is `y` over `r`.","`sin @t{θ} = y/r = {4}/{5}`."]}],"refreshers":{"Special triangles":"Two triangles give every exact value in this module.\u003cul style=\"margin:6px 0\">\u003cli>The 45°–45°–90° triangle has legs 1 and 1 and hypotenuse `√2`.\u003c/li>\u003cli>The 30°–60°–90° triangle has sides 1, `√3` and 2: the short side 1 is opposite 30°, `√3` is opposite 60°, and 2 is the hypotenuse.\u003c/li>\u003c/ul>Example: sin 60° = `{√3}/{2}`, and cos 60° = `{1}/{2}`.","Radian measure":"A full turn is `2π` radians, which is 360°, so `π` = 180°. To change degrees to radians, multiply by `π/180`: 120° = `120π/180 = 2π/3`. To place an angle, write the boundaries `π/2`, `π` and `3π/2` with the same denominator. For example, `5π/4` is between `4π/4 = π` and `6π/4 = 3π/2`, so it’s in quadrant 3.","Radicals":"To clear a square root from the bottom of a fraction, multiply the top and bottom by that root: `{2}/{√2} = {2√2}/{2} = √2`, and `{1}/{√3} = {√3}/{3}`. Both forms are correct. This module writes the second form and accepts either.","Terminal arm ratios":"For a point `(x, y)` on the terminal arm, `r = √{x^2 + y^2}` is its distance from the origin, and `r` is always positive. Then `sin @t{θ} = y/r`, `cos @t{θ} = x/r` and `tan @t{θ} = y/x`. For (−3, 4): `r = 5`, so `sin @t{θ} = {4}/{5}`, `cos @t{θ} = -{3}/{5}` and `tan @t{θ} = -{4}/{3}`."}}},"explore":{"heading":"Unit circle explorer","intro":"Step the angle around the circle and watch the point. The panel lists every exact value. Turn on the reference triangle to see where the numbers come from.","predIntro":"Make a prediction first. Then the explorer will show you what really happens.","predictions":[{"id":"p1","start":{"k":2},"prompt":"The arm is at `π/6`. If it rotates to `5π/6`, what will the point be?","options":[{"t":"`(-{1}/{2}, {√3}/{2})`","_n":"od19","_k":"f73672be"},{"t":"`(-{√3}/{2}, -{1}/{2})`","_n":"pd49","_k":"858272b8"},{"t":"`(-{√3}/{2}, {1}/{2})`","_n":"qd39","_k":"7d6bf985"},{"t":"`({√3}/{2}, -{1}/{2})`","_n":"rc69","_k":"c9c19f69"}],"explain":"`5π/6 = π - π/6`, so its reference angle is `π/6`. It’s the same triangle, mirrored across the `y`-axis. The `x`-coordinate changes sign; the `y`-coordinate stays `{1}/{2}`. (The other options are `11π/6`, `2π/3` and `7π/6`.)"},{"id":"p2","start":{"k":4},"prompt":"As `@t{θ}` increases from `π/3` to `π/2`, what happens to `cos @t{θ}`?","options":[{"t":"It increases to 1","_n":"sc59","_k":"e28b9257"},{"t":"It stays the same","_n":"tc89","_k":"e2f74295"},{"t":"It decreases to 0","_n":"uc99","_k":"4ad37bf2"},{"t":"It decreases to −1","_n":"vc69","_k":"1d5b6445"}],"explain":"`cos @t{θ}` is the `x`-coordinate. As the arm swings up toward the `y`-axis, the point moves left toward `x = 0`, so `cos @t{θ}` shrinks from `{1}/{2}` to 0. A bigger angle doesn’t mean a bigger ratio."},{"id":"p3","start":{"k":3},"prompt":"The arm will visit `3π/4`, `5π/4` and `7π/4` in turn. At how many of those three angles is `tan @t{θ}` positive?","options":[{"t":"None","_n":"wc79","_k":"6ee8afed"},{"t":"Two","_n":"xc49","_k":"5a7768ed"},{"t":"All three","_n":"yc59","_k":"c353a3dd"},{"t":"One","_n":"zc29","_k":"3da5da7a"}],"explain":"`tan @t{θ} = y/x`, which is positive when `x` and `y` have the same sign, in quadrants 1 and 3. Of the three angles, only `5π/4` is in quadrant 3, so `tan(5π/4) = 1`. The other two give −1."},{"id":"p4","start":{"k":0},"prompt":"The arm will step from 0 up to `π/2`. What will `tan @t{θ}` be at `π/2`?","options":[{"t":"Undefined","_n":"10c39","_k":"de11c830"},{"t":"∞ (infinity)","_n":"11d09","_k":"d17cf6e8"},{"t":"0","_n":"12d19","_k":"64292526"},{"t":"1","_n":"135aa","_k":"5a4a4ef4"}],"explain":"At `π/2` the point is (0, 1), so `tan @t{θ} = y/x = {1}/{0}`. Dividing by 0 has no answer, so `tan(π/2)` is \u003cstrong>undefined\u003c/strong>. As `@t{θ}` gets close to `π/2`, `tan @t{θ}` gets as large as you like, but at `π/2` itself there’s no value, not even ∞."}],"chalIntro":"Set the explorer, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"Move the arm so that the point is `(-{√2}/{2}, -{√2}/{2})`.","why":"`π + π/4 = 5π/4`.","hints":["Which quadrant has both coordinates negative?","Quadrant 3. Both coordinates have size `{√2}/{2}`, so the reference angle is `π/4`.","`π + π/4 = 5π/4`."]},{"id":"tc2","goal":[4,6],"prompt":"Find the angle in quadrant 4 whose tangent is `-{√3}/{3}`.","why":"`2π - π/6 = 11π/6`.","hints":["Which reference angle has tangent `{√3}/{3}`?","`tan(π/6) = {√3}/{3}`. Now go to quadrant 4.","`2π - π/6 = 11π/6`."]},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"Find \u003cstrong>two different\u003c/strong> special angles, neither on an axis, with the \u003cstrong>same cosine\u003c/strong> but \u003cstrong>opposite sines\u003c/strong>. Set the first angle and press \u003cstrong>Pin\u003c/strong>, then set the second and press \u003cstrong>Check challenge\u003c/strong>.","why":"A reflection in the `x`-axis sends `@t{θ}` to `2π - @t{θ}`: same `x`, opposite `y`. There are six pairs: (`π/6`, `11π/6`), (`π/4`, `7π/4`), (`π/3`, `5π/3`), (`2π/3`, `4π/3`), (`3π/4`, `5π/4`) and (`5π/6`, `7π/6`).","hints":["Same `x`, opposite `y`: what kind of reflection does that?","A reflection in the `x`-axis sends `@t{θ}` to `2π - @t{θ}`.","For example, `π/6` and `2π - π/6 = 11π/6`: both have cosine `{√3}/{2}`, with sines `{1}/{2}` and `-{1}/{2}`."]}]},"part3":{"slug":"cast","name":"CAST","heading":"Angle families: one triangle, four quadrants","intro":"Pick a reference angle, then move its triangle into each quadrant. Predict the signs before you check.","blocks":[{"title":"What the rule means","html":"\u003cp>\u003cstrong>Exact value of a special angle, in four steps\u003c/strong>\u003c/p>\u003col>\u003cli>Find the quadrant.\u003c/li>\u003cli>Find the reference angle (the angle to the `x`-axis): quadrant 2: `π - @t{θ}`; quadrant 3: `@t{θ} - π`; quadrant 4: `2π - @t{θ}`.\u003c/li>\u003cli>Use the special triangle for the size.\u003c/li>\u003cli>Use CAST for the sign.\u003c/li>\u003c/ol>\u003cp>Angles on an axis (0, `π/2`, `π`, `3π/2`, `2π`) have no reference triangle. Read sin and cos straight from the point: (1, 0), (0, 1), (−1, 0), (0, −1).\u003c/p>"}],"quickCheck":{"title":"Positive or negative?","summary":"Positive or negative?","items":[{"id":"q1","goal":3,"prompt":"`cos(4π/3)`","choices":[{"t":"Positive","fb":"`4π/3` is between `π` and `3π/2`, in quadrant 3. The point is left of the `y`-axis, so cosine is negative.","_n":"1459a","_k":"65d36f3b"},{"t":"Negative","fb":"Right. `4π/3` is in quadrant 3, where only tangent is positive. `cos(4π/3) = -{1}/{2}`.","_n":"1558a","_k":"0b1da4fc"}]},{"id":"q2","goal":3,"prompt":"`tan(11π/6)`","choices":[{"t":"Positive","fb":"`11π/6` is in quadrant 4: `x` positive, `y` negative. `tan = y/x` is negative.","_n":"1657a","_k":"e37a558b"},{"t":"Negative","fb":"Right. `11π/6` is in quadrant 4, where only cosine is positive. `tan(11π/6) = -{√3}/{3}`.","_n":"1756a","_k":"66866fbc"}]},{"id":"q3","goal":3,"prompt":"`sin(3π/4)`","choices":[{"t":"Positive","fb":"Right. `3π/4` is in quadrant 2, where sine is positive. `sin(3π/4) = {√2}/{2}`.","_n":"1855a","_k":"4d4b6360"},{"t":"Negative","fb":"`3π/4` is in quadrant 2, above the `x`-axis, so its `y`-coordinate (sine) is positive.","_n":"1954a","_k":"bccea1ff"}]},{"id":"q4","goal":3,"prompt":"`sec(5π/3)`","choices":[{"t":"Positive","fb":"Right. `sec = 1/cos`, and cosine is positive in quadrant 4, so `sec(5π/3) = 1/({1}/{2}) = 2`.","_n":"1a53a","_k":"f8a0a133"},{"t":"Negative","fb":"sec has the same sign as cos, because `sec = 1/cos`. `5π/3` is in quadrant 4, where cosine is positive.","_n":"1b52a","_k":"72d22b9e"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Sort by exact value","summary":"Sort by exact value","goal":[4,1,3],"instruction":"Sort each expression into the box with its exact value.","how":"Tap an expression, then tap the box it belongs in.","noun":"expression","boxes":[{"id":"b1","label":"`{1}/{2}`"},{"id":"b2","label":"`-{1}/{2}`"},{"id":"b3","label":"`{√3}/{2}`"},{"id":"b4","label":"`-{√3}/{2}`"}],"items":[{"id":"i1","t":"`sin(π/6)`","_a":"FQMAQw==","why":"`π/6` is the small angle, so its sine is the short side: `{1}/{2}`.","wrong":{"b2":"Right size, wrong sign. `π/6` is in quadrant 1, where sine is positive.","b3":"Check the size. `π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round.","b4":"Check the size. `π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round. Right size, wrong sign. `π/6` is in quadrant 1, where sine is positive."},"hints":["Find the quadrant and the reference angle of `π/6`.","`π/6` is in quadrant 1 with reference angle `π/6`. In quadrant 1, sine is positive.","`sin(π/6) = {1}/{2}`, and the sign is positive, so `sin(π/6) = {1}/{2}`."]},{"id":"i2","t":"`cos(π/3)`","_a":"FQMAQw==","why":"Next to the `π/3` angle is the short side: `cos(π/3) = {1}/{2}`.","wrong":{"b2":"Right size, wrong sign. `π/3` is in quadrant 1, where cosine is positive.","b3":"Check the size. `π/3` has reference angle `π/3`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round.","b4":"Check the size. `π/3` has reference angle `π/3`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round. Right size, wrong sign. `π/3` is in quadrant 1, where cosine is positive."},"hints":["Find the quadrant and the reference angle of `π/3`.","`π/3` is in quadrant 1 with reference angle `π/3`. In quadrant 1, cosine is positive.","`cos(π/3) = {1}/{2}`, and the sign is positive, so `cos(π/3) = {1}/{2}`."]},{"id":"i3","t":"`sin(5π/6)`","_a":"FQMAQw==","why":"Reference angle `π/6`, quadrant 2, where sine is positive: `{1}/{2}`.","wrong":{"b2":"Right size, wrong sign. `5π/6` is in quadrant 2, where sine is positive.","b3":"Check the size. `5π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round.","b4":"Check the size. `5π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round. Right size, wrong sign. `5π/6` is in quadrant 2, where sine is positive."},"hints":["Find the quadrant and the reference angle of `5π/6`.","`5π/6` is in quadrant 2 with reference angle `π - 5π/6 = π/6`. In quadrant 2, sine is positive.","`sin(π/6) = {1}/{2}`, and the sign is positive, so `sin(5π/6) = {1}/{2}`."]},{"id":"i4","t":"`cos(2π/3)`","_a":"FQMDQw==","why":"Reference angle `π/3`, quadrant 2, where cosine is negative: `-{1}/{2}`.","wrong":{"b1":"Right size, wrong sign. `2π/3` is in quadrant 2, where cosine is negative.","b3":"Check the size. `2π/3` has reference angle `π/3`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round. Right size, wrong sign. `2π/3` is in quadrant 2, where cosine is negative.","b4":"Check the size. `2π/3` has reference angle `π/3`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round."},"hints":["Find the quadrant and the reference angle of `2π/3`.","`2π/3` is in quadrant 2 with reference angle `π - 2π/3 = π/3`. In quadrant 2, cosine is negative.","`cos(π/3) = {1}/{2}`, and the sign is negative, so `cos(2π/3) = -{1}/{2}`."]},{"id":"i5","t":"`sin(7π/6)`","_a":"FQMDQw==","why":"Reference angle `π/6`, quadrant 3, where sine is negative: `-{1}/{2}`.","wrong":{"b1":"Right size, wrong sign. `7π/6` is in quadrant 3, where sine is negative.","b3":"Check the size. `7π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round. Right size, wrong sign. `7π/6` is in quadrant 3, where sine is negative.","b4":"Check the size. `7π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3}/{2}`. For `π/3` it’s the other way round."},"hints":["Find the quadrant and the reference angle of `7π/6`.","`7π/6` is in quadrant 3 with reference angle `7π/6 - π = π/6`. In quadrant 3, sine is negative.","`sin(π/6) = {1}/{2}`, and the sign is negative, so `sin(7π/6) = -{1}/{2}`."]},{"id":"i6","t":"`sin(11π/6)`","_a":"FQMDQw==","why":"Reference angle `π/6`, quadrant 4, where sine is negative: `-{1}/{2}`.","wrong":{"b1":"Right size, wrong sign. `11π/6` is in quadrant 4, where sine is negative.","b3":"Check the size. `11π/6` has reference angle `π/6`. For `π/6`, sine is the small value `{1}/{2}` and cosine is the large value `{√3 ue,"goal":[6,4,5],"instruction":"Tap \u003cstrong>every\u003c/strong> special angle from 0 to `2π` that fits. Then press Check.","how":"Tap the dots on the circle (or use the arrow keys and Enter). Tapped dots turn yellow.","fallback":"Some of your angles don’t fit. Check each one: does {r} equal {v}?","items":[{"id":"f1","goal":[6,4],"prompt":"`sin @t{θ} = {√2}/{2}`","ratio":"sin","value":"`{√2}/{2}`","_a":"bFIdWGo=","rules":[{"only":[3],"fb":"There’s a second angle. Sine is positive in quadrants 1 \u003cstrong>and\u003c/strong> 2."},{"any":[21,15],"fb":"At § sine is `-{√2}/{2}`: right size, wrong sign."}],"hints":["First ignore the sign: which reference angle has sine `{√2}/{2}`?","`sin(π/4) = {√2}/{2}`, so the reference angle is `π/4`. Sine is positive in quadrants 1 and 2.","In quadrant 1: `π/4`. In quadrant 2: `π - π/4 = 3π/4`. The answers are `π/4` and `3π/4`."]},{"id":"f2","goal":[6,4],"prompt":"`cos @t{θ} = -{1}/{2}`","ratio":"cos","value":"`-{1}/{2}`","_a":"bFkdUAFu","rules":[{"any":[4,20],"fb":"At § cosine is `+{1}/{2}`. Cosine is negative in quadrants 2 and 3."},{"any":[10,14],"fb":"That’s the wrong size. `cos = -{1}/{2}` needs reference angle `π/3`, not `π/6`."}],"hints":["First ignore the sign: which reference angle has cosine `{1}/{2}`?","`cos(π/3) = {1}/{2}`, so the reference angle is `π/3`. Cosine is negative in quadrants 2 and 3.","In quadrant 2: `π - π/3 = 2π/3`. In quadrant 3: `π + π/3 = 4π/3`. The answers are `2π/3` and `4π/3`."]},{"id":"f3","goal":[6,4],"prompt":"`tan @t{θ} = -√3`","ratio":"tan","value":"`-√3`","_a":"bFkdUwdu","rules":[{"any":[4,16],"fb":"`tan(§) = +√3`. Tangent is negative in quadrants 2 and 4."},{"any":[10,22],"fb":"tan of a `π/6`-family angle is `±{√3}/{3}`. `√3` needs reference angle `π/3`."}],"hints":["First ignore the sign: which reference angle has tangent `√3`?","`tan(π/3) = √3`, so the reference angle is `π/3`. Tangent is negative in quadrants 2 and 4.","In quadrant 2: `π - π/3 = 2π/3`. In quadrant 4: `2π - π/3 = 5π/3`. The answers are `2π/3` and `5π/3`."]},{"id":"f4","goal":[6,4],"prompt":"`sin @t{θ} = -1`","ratio":"sin","value":"−1","_a":"bFAJPA==","rules":[{"any":[6],"fb":"`sin(π/2) = +1`. The point (0, −1) is at `3π/2`."},{"any":[12],"fb":"At `π` the point is (−1, 0), so `sin π = 0`. It’s `cos π` that equals −1."}],"hints":["Sine is the `y`-coordinate. Where on the unit circle is `y = -1`?","`y = -1` only at the bottom of the circle, the point (0, −1).","The point (0, −1) is on the negative `y`-axis, at `@t{θ} = 3π/2`. That’s the only answer."]},{"id":"f5","goal":[6,5],"prompt":"`sec @t{θ} = 2`","ratio":"sec","value":"2","_a":"bFUdUwdu","rules":[{"only":[2,10],"fb":"sec pairs with cos, not sin. `sec @t{θ} = 2` means `cos @t{θ} = {1}/{2}`."},{"any":[8,16],"fb":"There, `cos = -{1}/{2}`, so `sec = -2`."}],"hints":["Turn it into a cosine question: `sec @t{θ} = 1/cos @t{θ}`.","`sec @t{θ} = 2` means `cos @t{θ} = {1}/{2}`. Which reference angle has cosine `{1}/{2}`, and where is cosine positive?","Reference angle `π/3`. Cosine is positive in quadrants 1 and 4: `@t{θ} = π/3` and `@t{θ} = 2π - π/3 = 5π/3`."]},{"id":"f6","goal":[6,5],"prompt":"`cot @t{θ} = 1`","ratio":"cot","value":"1","_a":"bFIdUAJu","rules":[{"only":[3],"fb":"`cot = 1/tan`, and `tan = 1` in quadrants 1 \u003cstrong>and\u003c/strong> 3."},{"any":[9,21],"fb":"There `tan = -1`, so `cot = -1`."}],"hints":["Turn it into a tangent question: `cot @t{θ} = 1/tan @t{θ}`.","`cot @t{θ} = 1` means `tan @t{θ} = 1`. Which reference angle has tangent 1, and where is tangent positive?","Reference angle `π/4`. Tangent is positive in quadrants 1 and 3: `@t{θ} = π/4` and `@t{θ} = π + π/4 = 5π/4`."]},{"id":"f7","goal":[6,5],"prompt":"`csc @t{θ} = -√2`","ratio":"csc","value":"`-√2`","_a":"bFAETQUCPA==","rules":[{"only":[9,15],"fb":"`csc @t{θ} = -√2` means `sin @t{θ} = -{1}/{√2} = -{√2}/{2}`. Check the sign of sine at `3π/4`."},{"any":[3,9],"fb":"csc has the same sign as sin. sin is negative in quadrants 3 and 4."}],"hints":["Turn it into a sine question: `csc @t{θ} = 1/sin @t{θ}`.","`csc @t{θ} = -√2` means `sin @t{θ} = -{1}/{√2} = -{√2}/{2}`. Which reference angle has sine `{√2}/{2}`, and where is sine negative?","Reference angle `π/4`. Sine is negative in quadrants 3 and 4: `@t{θ} = π + π/4 = 5π/4` and `@t{θ} = 2π - π/4 = 7π/4`."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Priya","how":"","instruction":"Priya made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the exact value of `cos(7π/6)`.","steps":["`7π/6` is between `π` (`6π/6`) and `3π/2` (`9π/6`), so it’s in quadrant 3.","The reference angle is `7π/6 - π = π/6`.","In quadrant 3, cosine is positive.","`cos(π/6) = {√3}/{2}`, so `cos(7π/6) = {√3}/{2}`."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: in quadrant 3, the reference angle is `@t{θ} - π`.","","Step 4 uses step 3’s sign correctly. The mistake is earlier."],"fixes":[{"t":"In quadrant 3, only tangent is positive, so cosine is negative: `cos(7π/6) = -{√3}/{2}`.","why":"Both coordinates are negative in quadrant 3, so `cos(7π/6) = -{√3}/{2}`.","_n":"1c51a","_k":"d7c8f707"},{"t":"Step 3 is correct as written.","why":"Picture the point for `7π/6`: it’s left of the `y`-axis, so its `x`-coordinate (cosine) is negative.","_n":"1d54a","_k":"d554920a"},{"t":"In quadrant 3, sine and cosine are positive, so `cos(7π/6) = {√3}/{2}`.","why":"In quadrant 3 the point is below and to the left of the origin. Both coordinates are negative.","_n":"1e55a","_k":"61700976"},{"t":"In quadrant 3, cosine is negative, so `cos(7π/6) = -{1}/{2}`.","why":"The sign is right now, but the size isn’t. Reference angle `π/6` gives cosine `{√3}/{2}`, not `{1}/{2}`.","_n":"1f56a","_k":"1c24ba4e"}],"hints":["Check each step against CAST.","Which ratio is positive in quadrant 3? Is the point’s `x`-coordinate positive or negative there?","Step 3 is wrong. In quadrant 3 only tangent is positive, so `cos(7π/6) = -{√3}/{2}`."]},{"id":"e2","goal":5,"task":"Find the exact value of `csc(5π/3)`.","steps":["`5π/3` is in quadrant 4, with reference angle `2π - 5π/3 = π/3`.","`csc @t{θ} = 1/cos @t{θ}`.","`cos(5π/3) = {1}/{2}`, since cosine is positive in quadrant 4.","So `csc(5π/3) = 1/({1}/{2}) = 2`."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","This statement is true. The mistake is in deciding which ratio to use.","Step 4 follows from step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct as written.","why":"`1/cos @t{θ}` is `sec @t{θ}`. `csc @t{θ}` is `1/sin @t{θ}`.","_n":"1g57a","_k":"f3d4b792"},{"t":"`csc @t{θ} = 1/tan @t{θ}`.","why":"1/tan is cot. Remember: each reciprocal pair has exactly one ‘co’. \u003cstrong>Co\u003c/strong>secant pairs with sine.","_n":"1h50a","_k":"9741123a"},{"t":"`csc @t{θ} = 1/sin @t{θ}`. `sin(5π/3) = -{√3}/{2}`, so `csc(5π/3) = -{2}/{√3} = -{2√3}/{3}`.","why":"Cosecant is the reciprocal of sine, and sine is negative in quadrant 4.","_n":"1i51a","_k":"2d74ebb1"},{"t":"`csc @t{θ} = sin^{-1} @t{θ}`, the inverse of sine.","why":"`sin^{-1}` is the inverse function: the angle with a given sine. csc is the \u003cstrong>reciprocal\u003c/strong>, 1/sin.","_n":"1j52a","_k":"dff06fb6"}],"hints":["Check step 2: which ratio is csc the reciprocal of?","Each reciprocal pair has exactly one ‘co’: \u003cstrong>co\u003c/strong>secant–sine, secant–\u003cstrong>co\u003c/strong>sine, \u003cstrong>co\u003c/strong>tangent–tangent.","Step 2 is wrong: `csc @t{θ} = 1/sin @t{θ}`. `sin(5π/3) = -{√3}/{2}`, so `csc(5π/3) = -{2}/{√3} = -{2√3}/{3}`."]},{"id":"e3","goal":2,"task":"Find the exact value of `sin(2π/3)`.","steps":["`2π/3` is between `π/2` and `π`, so it’s in quadrant 2.","The reference angle is `2π/3 - π/2 = π/6`.","In quadrant 2, sine is positive.","`sin(π/6) = {1}/{2}`, so `sin(2π/3) = {1}/{2}`."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","","Step 3 is true. The mistake is earlier.","Step 4 follows from step 2. The mistake is earlier."],"fixes":[{"t":"The reference angle is `π/6`, but sine is negative in quadrant 2, so `sin(2π/3) = -{1}/{2}`.","why":"This keeps the wrong reference angle and adds a sign error. Sine is positive in quadrant 2.","_n":"1k53a","_k":"756a1d72"},{"t":"The reference angle is `π - 2π/3 = π/3`, measured to the `x`-axis, so `sin(2π/3) = {√3}/{2}`.","why":"Reference angles are measured to the `x`-axis, never the `y`-axis.","_n":"1l4ca","_k":"b53763d5"},{"t":"Step 2 is correct as written.","why":"`2π/3 - π/2` measures the angle to the `y`-axis. The reference angle is measured to the `x`-axis: `π - 2π/3 = π/3`.","_n":"1m4da","_k":"48f54e48"},{"t":"The reference angle is `2π/3` itself, so `sin(2π/3) = sin(2π/3)`.","why":"A reference angle is always between 0 and `π/2`. That’s what lets you use the special triangles.","_n":"1nc6a","_k":"e4c082e4"}],"hints":["Check how step 2 measures the reference angle.","Reference angles are measured to the nearest part of the `x`-axis. In quadrant 2, that’s `π - @t{θ}`.","Step 2 is wrong: the reference angle is `π - 2π/3 = π/3`, so `sin(2π/3) = {√3}/{2}`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you about the coordinates of the points on the unit circle?"},{"id":"j2","q":"In your own words, why are the coordinates of the point exactly `(cos @t{θ}, sin @t{θ})`?"},{"id":"j3","q":"Explain to a friend, step by step, how to find `cos(5π/4)` exactly without a calculator."},{"id":"j4","q":"Which special-angle values do you still have to work out rather than just know? What will you do to make them stick?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the exact value of `sin(π/3)`?","options":[{"t":"`{1}/{2}`","why":"`{1}/{2}` is `sin(π/6)`. The larger angle `π/3` has the larger sine.","_n":"1oc5a","_k":"0e4de2d2"},{"t":"`{√3}/{2}`","why":"`π/3` is the larger angle in the 30°–60°–90° triangle, so its opposite side is the long leg: `{√3}/{2}`.","_n":"1pc8a","_k":"752def73"},{"t":"`{√2}/{2}`","why":"`{√2}/{2}` is the value for `π/4`.","_n":"1qc7a","_k":"627bbe72"},{"t":"`√3`","why":"`√3` is `tan(π/3) = ({√3}/{2}) ÷ ({1}/{2})`.","_n":"1rc2a","_k":"923618fc"}]},"b":{"prompt":"What is the exact value of `cos(π/6)`?","options":[{"t":"`{√3}/{3}`","why":"`{√3}/{3}` is `tan(π/6)`.","_n":"1sc1a","_k":"7a58c22a"},{"t":"`{√2}/{2}`","why":"`{√2}/{2}` is the value for `π/4`.","_n":"1tc4a","_k":"b2da1670"},{"t":"`{√3}/{2}`","why":"Next to the `π/6` angle is the long leg: `{√3}/{2}`.","_n":"1uc3a","_k":"6b0a5a7d"},{"t":"`{1}/{2}`","why":"`{1}/{2}` is `cos(π/3)`.","_n":"1vcea","_k":"239972ff"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"In which quadrant are sine and tangent both negative?","options":[{"t":"Quadrant 1","why":"In quadrant 1 all three ratios are positive.","_n":"1wcda","_k":"c2044267"},{"t":"Quadrant 3","why":"In quadrant 3, tangent is positive (the T in CAST).","_n":"1x40a","_k":"9f14aa45"},{"t":"Quadrant 2","why":"In quadrant 2, sine is positive (the S in CAST).","_n":"1y41a","_k":"b82e2105"},{"t":"Quadrant 4","why":"In quadrant 4 only cosine is positive (the C in CAST).","_n":"1z3ea","_k":"72b55090"}]},"b":{"prompt":"In which quadrant is cosine negative but tangent positive?","options":[{"t":"Quadrant 3","why":"Only tangent is positive in quadrant 3.","_n":"203fa","_k":"3c506d18"},{"t":"Quadrant 2","why":"In quadrant 2, tangent is negative.","_n":"2144a","_k":"0189c4c5"},{"t":"Quadrant 1","why":"In quadrant 1, cosine is positive.","_n":"2245a","_k":"5d6e216b"},{"t":"Quadrant 4","why":"In quadrant 4, cosine is positive.","_n":"2342a","_k":"b9a5e0b1"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What is the exact value of `csc(π/6)`?","options":[{"t":"2","why":"`csc(π/6) = 1/sin(π/6) = 1/({1}/{2}) = 2`.","_n":"2443a","_k":"0e2102d8"},{"t":"`{1}/{2}`","why":"That’s `sin(π/6)`. csc is its reciprocal.","_n":"2548a","_k":"fae1164d"},{"t":"`{2√3}/{3}`","why":"That’s `1/cos(π/6)`, which is `sec(π/6)`. csc pairs with sine.","_n":"2649a","_k":"e785ca23"},{"t":"`√3`","why":"That’s `cot(π/6) = 1/tan(π/6)`.","_n":"27d2a","_k":"c39e574d"}]},"b":{"prompt":"What is the exact value of `sec(π/3)`?","options":[{"t":"`{√3}/{3}`","why":"That’s `cot(π/3) = {1}/{√3}`.","_n":"28d1a","_k":"fc67f571"},{"t":"`{2√3}/{3}`","why":"That’s `1/sin(π/3)`, which is `csc(π/3)`. sec pairs with cosine.","_n":"29d0a","_k":"9c132fc1"},{"t":"`{1}/{2}`","why":"That’s `cos(π/3)`. sec is its reciprocal.","_n":"2acfa","_k":"ba75858e"},{"t":"2","why":"`sec(π/3) = 1/cos(π/3) = 1/({1}/{2}) = 2`.","_n":"2bd6a","_k":"2e8346eb"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Which angle from 0 to `2π` has the same sine as `π/5`?","options":[{"t":"`3π/10`","why":"`π/2 - π/5` is the complementary angle. Its \u003cstrong>cosine\u003c/strong> equals `sin(π/5)`, not its sine.","_n":"2cd5a","_k":"2ff86b06"},{"t":"`6π/5`","why":"`π + π/5` has the same reference angle, but it’s in quadrant 3, where sine is negative.","_n":"2dd4a","_k":"a83a44fc"},{"t":"`9π/5`","why":"`2π - π/5` has the same reference angle, but it’s in quadrant 4, where sine is negative.","_n":"2ed3a","_k":"2b9ba95e"},{"t":"`4π/5`","why":"`π - π/5 = 4π/5` is the quadrant 2 angle with reference angle `π/5`. Sine is positive in both quadrants 1 and 2.","_n":"2fcaa","_k":"9e608a55"}]},"b":{"prompt":"Which angle from 0 to `2π` has the same cosine as `π/7`?","options":[{"t":"`8π/7`","why":"`π + π/7` is in quadrant 3, where cosine is negative.","_n":"2gc9a","_k":"cf22d24f"},{"t":"`5π/14`","why":"`π/2 - π/7` is complementary. Its \u003cstrong>sine\u003c/strong> equals `cos(π/7)`.","_n":"2hcca","_k":"37e90eea"},{"t":"`13π/7`","why":"`2π - π/7 = 13π/7` is in quadrant 4, where cosine is positive, with reference angle `π/7`.","_n":"2icda","_k":"8a6b7a23"},{"t":"`6π/7`","why":"`π - π/7` is in quadrant 2, where cosine is negative.","_n":"2jcea","_k":"e829648a"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"`cos @t{θ} = -{√2}/{2}` and `sin @t{θ} > 0`, with `0 ≤ @t{θ} ≤ 2π`. What is `@t{θ}`?","options":[{"t":"`7π/4`","why":"At `7π/4`, cosine is positive and sine is negative: the signs are the wrong way round.","_n":"2kcfa","_k":"b48fd81c"},{"t":"`3π/4`","why":"Cosine negative and sine positive means quadrant 2. The reference angle is `π/4`, so `@t{θ} = π - π/4 = 3π/4`.","_n":"2ld0a","_k":"f519b933"},{"t":"`π/4`","why":"`cos(π/4) = +{√2}/{2}`. The negative sign puts `@t{θ}` left of the `y`-axis.","_n":"2md1a","_k":"47f0d760"},{"t":"`5π/4`","why":"`cos(5π/4) = -{√2}/{2}`, but `sin(5π/4)` is negative too.","_n":"2nd2a","_k":"afe691f0"}]},"b":{"prompt":"`sin @t{θ} = -{1}/{2}` and `tan @t{θ} > 0`, with `0 ≤ @t{θ} ≤ 2π`. What is `@t{θ}`?","options":[{"t":"`11π/6`","why":"`sin(11π/6) = -{1}/{2}`, but `tan(11π/6)` is negative.","_n":"2od3a","_k":"2fbebd98"},{"t":"`4π/3`","why":"`sin(4π/3) = -{√3}/{2}`. The size `{1}/{2}` needs reference angle `π/6`.","_n":"2pc4a","_k":"00257a45"},{"t":"`π/6`","why":"`sin(π/6) = +{1}/{2}`.","_n":"2qc5a","_k":"131e4195"},{"t":"`7π/6`","why":"Sine negative and tangent positive means quadrant 3. The reference angle is `π/6`, so `@t{θ} = π + π/6 = 7π/6`.","_n":"2r03e","_k":"10ccd9be"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"`P` is the point on the unit circle at `@t{θ} = 2π/3`. `Q` is the point at `@t{θ} = 2π/3 + π`. What are `Q`’s coordinates?","options":[{"t":"`(-{√3}/{2}, {1}/{2})`","why":"A half turn doesn’t swap the coordinates. It changes both of their signs.","_n":"2s04e","_k":"cc500e63"},{"t":"`({1}/{2}, -{√3}/{2})`","why":"Adding `π` is a half turn: both coordinates change sign. `P = (-{1}/{2}, {√3}/{2})`, so `Q = ({1}/{2}, -{√3}/{2})`.","_n":"2t05e","_k":"fb71050e"},{"t":"`(-{1}/{2}, -{√3}/{2})`","why":"That flips only `y`: a reflection in the `x`-axis, not a half turn.","_n":"2u06e","_k":"ccc7ca07"},{"t":"`({1}/{2}, {√3}/{2})`","why":"That flips only `x`: a reflection in the `y`-axis.","_n":"2v07e","_k":"c3f27f11"}]},"b":{"prompt":"`P` is the point on the unit circle at `@t{θ} = π/6`. `Q` is the point at `@t{θ} = π/6 + π`. What are `Q`’s coordinates?","options":[{"t":"`({√3}/{2}, -{1}/{2})`","why":"That flips only `y`.","_n":"2w08e","_k":"cf0d62cb"},{"t":"`(-{1}/{2}, -{√3}/{2})`","why":"The coordinates don’t swap places.","_n":"2x09e","_k":"41ea5871"},{"t":"`(-{√3}/{2}, {1}/{2})`","why":"That flips only `x`.","_n":"2y0ae","_k":"71a383cc"},{"t":"`(-{√3}/{2}, -{1}/{2})`","why":"`P = ({√3}/{2}, {1}/{2})`. A half turn changes both signs.","_n":"2z0be","_k":"3250a2e7"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which statement is written correctly?","options":[{"t":"`csc(π/6) = 1/sin = 2`","why":"‘sin’ needs its angle: `sin(π/6)`. On its own, ‘sin’ isn’t a number.","_n":"300ce","_k":"91b2f304"},{"t":"`csc(π/6) = 1/sin(π/6) = 2`","why":"Correct reciprocal, correct notation, correct value.","_n":"3109f","_k":"908f3ced"},{"t":"`csc(π/6) = 1/cos(π/6) = 2`","why":"csc pairs with sine. Also, `1/cos(π/6) = {2√3}/{3}`, not 2.","_n":"3208f","_k":"a0c53230"},{"t":"`csc(π/6) = sin^{-1}(π/6) = 2`","why":"`sin^{-1}` means the inverse function, not the reciprocal.","_n":"3307f","_k":"9156ddfe"}]},"b":{"prompt":"Which statement is written correctly?","options":[{"t":"`cot(π/4) = 1/tan(π/4) = 1`","why":"Correct reciprocal, correct notation, correct value.","_n":"3406f","_k":"4a54ff4b"},{"t":"`cot(π/4) = tan^{-1}(π/4) = 1`","why":"`tan^{-1}` is the inverse function, not the reciprocal.","_n":"350df","_k":"76d0c5df"},{"t":"`cot(π/4) = 1/cos(π/4) = 1`","why":"1/cos is sec, and `1/cos(π/4) = √2`, not 1.","_n":"360cf","_k":"7631ff63"},{"t":"`cot(π/4) = 1/tan = 1`","why":"‘tan’ needs its angle: `tan(π/4)`.","_n":"370bf","_k":"82e132bb"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why `sin(7π/6)` is negative?","options":[{"t":"“Because 7 is odd.”","why":"The numerator has nothing to do with it. `5π/6` also has an odd numerator, and its sine is positive.","_n":"380af","_k":"0ddd4d0f"},{"t":"“`7π/6` is in quadrant 3, so its point on the unit circle is below the `x`-axis. The point’s `y`-coordinate, which is `sin(7π/6)`, is negative.”","why":"This connects the quadrant, the point and the meaning of sine.","_n":"3911f","_k":"9416df0e"},{"t":"“Every trig ratio of an angle greater than `π` is negative.”","why":"Not true: `tan(7π/6)` is positive, and `cos(5π/3)` is positive.","_n":"3a10f","_k":"fd0331ec"},{"t":"“Because the reference angle `π/6` is negative.”","why":"Reference angles are always positive. The sign comes from the quadrant.","_n":"3b0ff","_k":"6c705886"}]},"b":{"prompt":"Which is the best explanation of why `cos(5π/3)` is positive?","options":[{"t":"“Every trig ratio of an angle between `3π/2` and `2π` is positive.”","why":"Not true: sine and tangent are negative in quadrant 4.","_n":"3c10f","_k":"8370f592"},{"t":"“Because 5 and 3 are both odd.”","why":"The digits don’t decide the sign. The quadrant does.","_n":"3d0df","_k":"4222746a"},{"t":"“`5π/3` is in quadrant 4, so its point is to the right of the `y`-axis. The point’s `x`-coordinate, which is `cos(5π/3)`, is positive.”","why":"This connects the quadrant, the point and the meaning of cosine.","_n":"3e0ef","_k":"ddb9e6d5"},{"t":"“Because cosine is never negative.”","why":"Cosine is negative in quadrants 2 and 3.","_n":"3f0bf","_k":"ecaf55c6"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A robot arm 4 m long starts along the positive `x`-axis and rotates counterclockwise through `5π/6`. What are the coordinates of its tip, in metres?","options":[{"t":"`(-2√3, 2)`","why":"`(4 cos(5π/6), 4 sin(5π/6)) = (4 × (-{√3}/{2}), 4 × {1}/{2}) = (-2√3, 2)`.","_n":"3g0cf","_k":"bf90eef1"},{"t":"`(2√3, 2)`","why":"`5π/6` is in quadrant 2, so the `x`-coordinate is negative.","_n":"3h09f","_k":"0df08e07"},{"t":"`(-2, 2√3)`","why":"The sizes are swapped. For reference angle `π/6`, cosine is the large value `{√3}/{2}`.","_n":"3i0af","_k":"46f9b3aa"},{"t":"`(-{√3}/{2}, {1}/{2})`","why":"That’s the point on the \u003cstrong>unit\u003c/strong> circle. Multiply by the radius, 4.","_n":"3j17f","_k":"624a5ba8"}]},"b":{"prompt":"A sprinkler throws water 6 m. Its nozzle points at an angle of `4π/3` from the positive `x`-axis. Where does the water land, in metres?","options":[{"t":"`(-3, -3√3)`","why":"`(6 cos(4π/3), 6 sin(4π/3)) = (6 × (-{1}/{2}), 6 × (-{√3}/{2})) = (-3, -3√3)`.","_n":"3k18f","_k":"8af9dbd5"},{"t":"`(-{1}/{2}, -{√3}/{2})`","why":"That’s the unit circle point. Multiply by 6.","_n":"3l95f","_k":"c3a87968"},{"t":"`(3, -3√3)`","why":"`4π/3` is in quadrant 3, where cosine is negative.","_n":"3m94f","_k":"5ad66604"},{"t":"`(-3√3, -3)`","why":"The sizes are swapped. For reference angle `π/3`, cosine is `{1}/{2}`.","_n":"3n97f","_k":"d9d7acd4"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A regular hexagon is drawn inside the unit circle with one vertex at (1, 0). What are the coordinates of the vertex at the top left?","options":[{"t":"`(-{√2}/{2}, {√2}/{2})`","why":"That’s `3π/4`. Steps of `π/4` would make an octagon.","_n":"3o96f","_k":"8143ea60"},{"t":"`(-{1}/{2}, {√3}/{2})`","why":"Six equal turns of `2π/6 = π/3` put the vertices at 0, `π/3`, `2π/3`, `π`, `4π/3` and `5π/3`. The top-left one is at `2π/3`.","_n":"3p99f","_k":"2da9bc1b"},{"t":"`(-{√3}/{2}, {1}/{2})`","why":"That’s `5π/6`, which assumes vertices every `π/6` (12 of them). A hexagon has 6.","_n":"3q98f","_k":"4b23ef6c"},{"t":"`({1}/{2}, {√3}/{2})`","why":"That’s the top-\u003cstrong>right\u003c/strong> vertex, at `π/3`.","_n":"3r9bf","_k":"0d69f0d1"}]},"b":{"prompt":"A regular octagon is drawn inside the unit circle with one vertex at (1, 0). Going counterclockwise, what are the coordinates of the vertex just after (−1, 0)?","options":[{"t":"`(-{1}/{2}, -{√3}/{2})`","why":"That’s `4π/3`, which assumes steps of `π/3`.","_n":"3s9af","_k":"b320f3b7"},{"t":"`({√2}/{2}, -{√2}/{2})`","why":"That’s `7π/4`. Counterclockwise from `π`, the next vertex is in quadrant 3.","_n":"3t8df","_k":"066058d2"},{"t":"`(-{√2}/{2}, -{√2}/{2})`","why":"The vertices are every `2π/8 = π/4`. After `π` comes `5π/4`.","_n":"3u8cf","_k":"11d38927"},{"t":"`(-{√3}/{2}, -{1}/{2})`","why":"That’s `7π/6`, which assumes steps of `π/6`.","_n":"3v9bf","_k":"8e7c4ccd"}]}}]},"task":{"title":"Make sine meet cosine","summary":"Make sine meet cosine","statement":"\u003cp>Choose two special angles, `A` in quadrant 2 and `B` in quadrant 4, so that \u003cstrong>`sin A = cos B`\u003c/strong>. There’s more than one pair. Can you find them all?\u003c/p>\u003cp class=\"tiny muted\">Enter each angle as a multiple of `π`: a whole number from 0 to 24 on top, and the denominator from the menu.\u003c/p>","checks":["Both are special angles from 0 to `2π`","`A` is in quadrant 2","`B` is in quadrant 4","`sin A = cos B`"],"tips":["Enter each angle as a multiple of `π`, like 3/4 for `3π/4`, with denominator 1, 2, 3, 4 or 6.","`A` must be between `π/2` and `π`. In sixths that’s `4π/6` or `5π/6`; in quarters it’s `3π/4`.","`B` must be between `3π/2` and `2π`. In sixths that’s `10π/6` or `11π/6`; in quarters it’s `7π/4`.","Right now `sin A` = {sa} and `cos B` = {cb}. Try matching the \u003cstrong>sizes\u003c/strong>: which quadrant 4 angle has a cosine as big as `sin A`?"],"explainPrompt":"Explain how you know `sin A = cos B` for your pair.","vocab":"Use the words reference angle, quadrant and CAST.","success":"Your design works!","more":"There’s more than one answer. Can you find another?","after3":"You found all three. Notice that the reference angles of `A` and `B` always add to `π/2`. That’s a preview of the cofunction identities in module 27."},"cards":[["The point on the unit circle at angle `@t{θ}`","`(cos @t{θ}, sin @t{θ})`. The circle has radius 1 and its centre at the origin."],["The 45°–45°–90° triangle (`π/4`)","Sides 1, 1, `√2`. Scaled to hypotenuse 1, its legs are `{√2}/{2}`."],["The 30°–60°–90° triangle (`π/6` and `π/3`)","Sides 1, `√3`, 2. Scaled to
