.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 30: hero caption, per-topic tables, Connect (toolbox map, link bar, one page), mixed practice, task */
#hero-cap{font:400 .95rem/1.5 var(--font-ui);color:var(--ink-2);display:grid;gap:2px}
#hero-cap .hc-l{display:block}
#hero-cap .hc-l.cur{color:var(--ink);font-weight:600}
#hero-cap .m{white-space:normal}
/* toolkit workaround: the visually hidden "(done)" text in a step button escaped the scrolling step bar on phones */
.steps .step{position:relative}
/* per-topic tables */
.tt-wrap{overflow-x:auto;margin:10px 0}
.tt td:nth-child(2){white-space:nowrap}
.tt td:last-child{white-space:nowrap}
.tt tr.tt-rev td{border-bottom:0}
.tt tr.tt-more td{padding-top:0;white-space:normal}
.tt-key{padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.tt-key p{margin:0 0 .3em;max-width:none}
.tt-key p:last-child{margin:0}

/* unit-circle dot buttons (N12, from MHF4U 26) */
.uc-dots{position:static}
.uc-dot{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2;cursor:pointer}
.uc-dot:focus-visible{outline:3px solid var(--pen);outline-offset:0}

/* Connect: N18 connection builder, toolbox map */
.cv-chal{border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--paper)}
.cv-chal .q-prompt{font-weight:700}
.cv-chal .how{margin:8px 0 0}
.cv-top{flex-wrap:wrap}
.cv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.cv-top .dots{flex:0 0 auto}
.cv-nav{border-top:1px solid var(--rule);padding-top:10px}
.tm-seq{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tm-sq{margin:12px 0 6px;font-weight:600}
.tm-split{display:flex;flex-wrap:wrap;gap:8px}
.tm-sp{font:400 1.05rem var(--font-math);text-align:left;white-space:normal}
.tm-sp .m{white-space:normal}
.tm-board{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 44px;align-items:start;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tm-col{min-width:0;position:relative;z-index:2}
.tm-h{margin:0 0 6px;font:700 .85rem var(--font-ui);color:var(--ink-2);text-transform:none}
.tm-cards{display:grid;gap:8px}
.tm-card{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:.98rem;line-height:1.4;min-height:40px;cursor:pointer}
.tm-card .m{white-space:normal}
.tm-n{display:block;font:700 .8rem var(--font-ui);color:var(--ink-2)}
.tm-card:not(:disabled):hover{border-color:var(--pen)}
.tm-card:disabled{cursor:default;opacity:1;color:var(--ink)}
.tm-card.linked{border-color:var(--hi);box-shadow:inset 5px 0 0 var(--hi)}
.tm-card.stem{outline:2px dashed var(--ink-2);outline-offset:2px}
.tm-card.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);box-shadow:none}
.tm-card.on .tm-n{color:var(--hi-ink)}
.tm-card:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tm-links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.tm-ln{fill:none;stroke:var(--hi);stroke-width:2.5;stroke-opacity:.8}
.tm-ln.cur{stroke-width:5;stroke-opacity:1}
.tm-ln.pend{stroke:var(--ink-2);stroke-dasharray:6 5;stroke-width:2}
.tm-end{fill:var(--ink)}
.tm-bar{position:sticky;bottom:0;z-index:5;margin-top:16px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;display:grid;gap:6px}
.tm-bar[hidden]{display:none}
.tm-sent{margin:0;max-width:none;font-size:.98rem}
.tm-sent .m{white-space:normal}
.tm-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tm-wl{font:700 .85rem var(--font-ui);color:var(--ink-2)}
.tm-words{display:inline-flex;gap:6px;flex-wrap:wrap}
.tm-row .q-actions{margin:0 0 0 auto}
.tm-one{margin-top:18px}
.tm-one h3{margin:0 0 6px}
.tm-onegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch;margin-top:8px}
.tm-oc{border:1.5px solid var(--rule);border-left:5px solid var(--hi);border-radius:8px;background:var(--sheet);padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.tm-oc .m{white-space:normal}
.tm-oc .tag{align-self:flex-start}
.tm-from{font-size:.88rem;color:var(--ink-2)}
.tm-from .m{color:var(--ink)}
.tm-oc0{grid-area:1/1}.tm-oc1{grid-area:1/2}.tm-oc2{grid-area:1/3}.tm-oc3{grid-area:2/1}.tm-oc4{grid-area:2/3}.tm-oc5{grid-area:3/1}.tm-oc6{grid-area:3/2}.tm-oc7{grid-area:3/3}
.tm-ocirc{grid-area:2/2;display:flex;align-items:center;justify-content:center}
.tm-ocirc canvas.plot{max-width:260px}
.tm-jh{margin:14px 0 4px}
.tm-jobs{margin:0;padding-left:1.3em;display:grid;gap:4px}
@media (max-width:760px){
  .tm-board{grid-template-columns:minmax(0,1fr);padding-left:30px;gap:14px}
  .tm-onegrid{grid-template-columns:minmax(0,1fr)}
  .tm-onegrid > div{grid-area:auto}
  .tm-ocirc{order:-1}
  .tm-row .q-actions{margin-left:0}
}

/* Mixed practice */
@media (max-width:560px){
  .mx-q .q-head{flex-wrap:wrap}
  .mx-q .q-head .tags{order:-1;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
}
.mx-q .q-prompt{font-weight:700}
.mx-q .numrow{flex-wrap:wrap;align-items:center;gap:8px 10px}
.mx-cell{display:inline-flex;align-items:center;gap:8px}
.mx-lab .m{font-size:1.05rem}
.mx-unit{font-size:.95rem;color:var(--ink-2)}
.mx-pi{font-size:1.25rem}
.mx-ucw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 24px;align-items:start;margin-top:6px}
.mx-ucp{max-width:380px;width:100%}
.mx-yours{margin:0 0 6px}
.mx-yours .m{white-space:normal}
.mx-sum{margin-top:6px}
@media (max-width:640px){ .mx-ucw{grid-template-columns:minmax(0,1fr)} .mx-ucp{max-width:none} }

/* Task: build an exact value */
.pt-how{margin:4px 0 8px}
.tk-in{display:flex;flex-wrap:wrap;gap:10px 28px;margin:8px 0 14px}
.tk-row{display:flex;align-items:center;gap:8px}
.tk-name{font:400 1.4rem var(--font-math);min-width:2.4em}
.btn.tk-pm{font-size:1.3rem;line-height:1;min-width:44px;min-height:40px;padding:.1em .5em}
.tk-box{width:5.2rem;text-align:center;font:400 1.15rem var(--font-math)}
.tk-pi{font-size:1.4rem}
.tk-h{margin:0 0 6px}
.tk-pw{max-width:420px}
#tk-read{margin-top:10px}
#tk-read dd .m{font-size:1.08em;white-space:normal}

ing-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"8abe2777","content":{"id":"30-chapter-4-review","kind":"review","title":"Chapter 4 summary and review","topic":"Chapter 4 Summary & Review","hero":{"headline":"One circle, the whole toolbox","text":"Every Chapter 4 idea starts on the unit circle: radians measure the arc, the point gives `cos @t{θ}` and `sin @t{θ}`, CAST gives the signs, and each identity is a fact about that point or about adding two angles.","muted":"Work through the five parts in order. Your answers save on this device as you go.","fig":{"shape":"square","aria":"Unit circle. The terminal arm is at 5π/6, with the arc from 0 to 5π/6 marked and the point (−√3/2, 1/2). A mirror line flips the point to π/6; a second arm adds π/4 to reach 13π/12; a right triangle under the arm shows (√3/2)² + (1/2)² = 1. Five identities sit around the circle, each joined to it by a thin line: a = rθ, (cos θ, sin θ), sin(π − θ) = sin θ, sin(a + b) and (√3/2)² + (1/2)² = 1.","steps":[{"cap":"The arm sweeps to `5π/6`: arc length = `5π/6` for `r = 1` · module 25"},{"cap":"The point is `(-{√3}/{2}, 1/2)`: `(cos @t{θ}, sin @t{θ})` · module 26"},{"cap":"A mirror line flips it to `π/6`: `sin(π - @t{θ}) = sin @t{θ}` · module 27"},{"cap":"A second arm adds `π/4` to make `13π/12`: `sin(a + b)` · module 28"},{"cap":"Beside the right triangle: `({√3}/{2})^2 + (1/2)^2 = 1` · module 29"}]}},"goals":["I can convert between radians and degrees and use arc length `a = rθ` and angular velocity.","I can find exact primary and reciprocal trig ratios of special angles in any quadrant.","I can use cofunction and related-angle identities, such as `sin(π/2 - x) = cos x`.","I can use compound- and double-angle formulas to find exact values and simplify.","I can prove trig identities and disprove non-identities with a counterexample.","I can explain where each identity comes from and choose the identity that unlocks a step."],"keyIdeas":{"25":{"idea":"A radian is the angle that cuts off one radius of arc; π = 180°; `a = rθ`; angular velocity = angle ÷ time.","look":"Radius wrapper (Explore); Spin lab: how fast is it turning? (Spin lab)"},"26":{"idea":"The point is `(cos θ, sin θ)`; reference angle for size, CAST for sign; reciprocals undefined where their partner is 0.","look":"Unit circle explorer (Explore); Angle families: one triangle, four quadrants (CAST)"},"27":{"idea":"`sin(π/2 - x) = cos x`; related angles `π ± x`, `2π - x` keep the size and follow CAST.","look":"Slide, flip, match (Explore); Cofunction pairs from a right triangle (Cofunctions)"},"28":{"idea":"`sin(a ± b)` and `cos(a ± b)`; with `a = b`, the double-angle formulas; exact values like `sin(π/12)`.","look":"Compound angle visualiser (Explore); Exact values: split an angle, double an angle (Exact values)"},"29":{"idea":"Prove by transforming one side; disprove with one counterexample.","look":"Proof workbench (Explore); Identity or equation? Hunt for a counterexample (Counterexamples)"}},"start":{"diagnostic":{"title":"Diagnostic: which modules should I revisit?","intro":"Nine questions, one or two from each Chapter 4 module. Pick an answer, say how sure you are, then check it. At the end you’ll see which modules to revisit.","questions":[{"id":"d1","topic":"25","goal":1,"fixedOrder":true,"prompt":"What is 225° in radians?","options":[{"t":"`5π/8`","why":"That treats a full turn as π.","_n":"0e29","_k":"e9b23b00"},{"t":"`4π/5`","why":"The factor is upside down.","_n":"1df9","_k":"f953b3e6"},{"t":"`5π/4`","why":"`225 × π/180 = 5π/4`.","_n":"2e09","_k":"a2ce587f"},{"t":"`225π`","why":"Multiply by `π/180`, not π.","_n":"3dd9","_k":"10277c76"}],"hints":["Multiply by `π/180`.","`225/180 = 5/4`.","`5π/4`."]},{"id":"d2","topic":"25","goal":1,"fixedOrder":true,"prompt":"A circle has radius 6 cm. How long is the arc cut off by a central angle of `2π/3`?","options":[{"t":"`π/9` cm","why":"That’s `θ ÷ r`.","_n":"4de9","_k":"f8eb5c74"},{"t":"`4π` cm","why":"`a = rθ = 6 × 2π/3`.","_n":"5db9","_k":"167e4289"},{"t":"`12π` cm","why":"That’s the whole circumference.","_n":"6dc9","_k":"f5ce2ee8"},{"t":"720 cm","why":"That uses 120° instead of `2π/3`.","_n":"7e99","_k":"914f191c"}],"hints":["`a = rθ`, `θ` in radians.","`6 × 2π/3`.","`4π` cm."]},{"id":"d3","topic":"26","goal":2,"fixedOrder":true,"prompt":"Find `cos(4π/3)` exactly.","options":[{"t":"`-{√3}/{2}`","why":"That’s the size for reference angle `π/6`.","_n":"8ea9","_k":"7db155cb"},{"t":"`-1/2`","why":"Reference angle `π/3`, quadrant 3: cosine negative.","_n":"9e84","_k":"16c7460b"},{"t":"`1/2`","why":"Quadrant 3: cosine is negative.","_n":"ae74","_k":"8f7274bf"},{"t":"`{√3}/{2}`","why":"Wrong size and wrong sign.","_n":"bea4","_k":"84a34eea"}],"hints":["Quadrant and reference angle?","Q3, `π/3`.","`-1/2`."]},{"id":"d4","topic":"26","goal":2,"fixedOrder":true,"prompt":"What is the exact value of `csc(7π/4)`?","options":[{"t":"`-√2`","why":"`sin(7π/4) = -√2/2`, so `csc = -2/√2 = -√2`.","_n":"ce94","_k":"a29ebd1c"},{"t":"−1","why":"That’s `tan(7π/4)`.","_n":"de44","_k":"8734fde5"},{"t":"`-{√2}/{2}`","why":"That’s `sin(7π/4)`; csc is its reciprocal.","_n":"ee34","_k":"a8f5832f"},{"t":"`√2`","why":"Sine is negative in quadrant 4.","_n":"fe64","_k":"934b7591"}],"hints":["`csc = 1/sin`.","`sin(7π/4) = -√2/2`.","`-√2`."]},{"id":"d5","topic":"27","goal":3,"prompt":"Which expression equals `cos(π/2 - x)`?","options":[{"t":"`sin x`","why":"Cofunction identity.","_n":"ge54","_k":"ca1455cc"},{"t":"`-cos x`","why":"That’s `cos(π - x)`.","_n":"hf04","_k":"8eae000c"},{"t":"`cos x`","why":"Subtracting from `π/2` swaps sine and cosine.","_n":"ief4","_k":"b941a07e"},{"t":"`-sin x`","why":"`cos(π/2 - x) = 0 · cos x + 1 · sin x`: positive.","_n":"j764","_k":"875b3467"}],"hints":["Think of a right triangle with acute angles `x` and `π/2 - x`.","Or use `cos(a - b)`.","`sin x`."]},{"id":"d6","topic":"28","goal":4,"fixedOrder":true,"prompt":"Use `π/12 = π/3 - π/4` to find `sin(π/12)` exactly.","options":[{"t":"`{√3 - √2}/{2}`","why":"That’s `sin(π/3) - sin(π/4)`.","_n":"k774","_k":"fc7f38ef"},{"t":"`1/4`","why":"`sin(π/12) ≈ 0.26` isn’t `1/4` exactly.","_n":"l784","_k":"94d20bab"},{"t":"`{√6 - √2}/{4}`","why":"`sin(π/3 - π/4) = (√3/2)(√2/2) - (1/2)(√2/2)`.","_n":"m794","_k":"b2e89260"},{"t":"`{√6 + √2}/{4}`","why":"That’s `cos(π/12)`.","_n":"n724","_k":"4abff857"}],"hints":["`π/12 = π/3 - π/4`.","`sin(a - b) = sin a cos b - cos a sin b`.","`{√6 - √2}/{4}`."]},{"id":"d7","topic":"28","goal":4,"prompt":"Simplify `2 sin x cos x`.","options":[{"t":"`2 sin 2x`","why":"The 2 is already used up.","_n":"o734","_k":"cf03f6df"},{"t":"`sin(x^2)`","why":"The double angle is `2x`, not `x^2`.","_n":"p744","_k":"9a0e3d83"},{"t":"`sin 2x`","why":"The double-angle formula.","_n":"q754","_k":"cc39ec78"},{"t":"`cos 2x`","why":"`cos 2x = cos^2 x - sin^2 x`.","_n":"r6e4","_k":"f0013cc3"}],"hints":["Which formula has `2 sin x cos x`?","`sin(x + x)`.","`sin 2x`."]},{"id":"d8","topic":"29","goal":5,"prompt":"Which equation is an identity (true for every `x` where both sides are defined)?","options":[{"t":"`tan x cos x = sin x`","why":"`(sin x/cos x) · cos x = sin x` wherever `cos x ≠ 0`.","_n":"s6f4","_k":"34836502"},{"t":"`cos x = √{1 - sin^2 x}`","why":"Fails where `cos x \u003c 0`, e.g. `x = π`.","_n":"t7c4","_k":"66904f88"},{"t":"`sin 2x = 2 sin x`","why":"At `x = π/2`: `0 ≠ 2`.","_n":"u7b4","_k":"28796180"},{"t":"`sin(x + π) = sin x`","why":"A half turn flips the sign: `-sin x`.","_n":"v7a4","_k":"c8c93fac"}],"hints":["Test each with a value.","Rewrite `tan x` as `sin x/cos x`.","Only `tan x cos x = sin x` always holds."]},{"id":"d9","topic":"29","goal":5,"prompt":"Which values show that `sin(x + y) = sin x + sin y` is \u003cstrong>not\u003c/strong> an identity?","options":[{"t":"`x = 0`, `y = π`","why":"Both sides are 0.","_n":"w794","_k":"9d87e09d"},{"t":"`x = y = 0`","why":"Both sides are 0: they agree.","_n":"x784","_k":"72d950e7"},{"t":"`x = y = π`","why":"`sin 2π = 0 = 0 + 0`.","_n":"y774","_k":"6d901071"},{"t":"`x = y = π/2`","why":"`sin π = 0`, but `sin(π/2) + sin(π/2) = 2`.","_n":"z764","_k":"7d08d164"}],"hints":["A counterexample makes the sides \u003cstrong>different\u003c/strong>.","Try angles with sine 1.","`π/2` and `π/2`."]}]}},"connect":{"heading":"Identity toolbox map","intro":"You met the Chapter 4 identities one module at a time, but they’re a family: each one comes from the circle or from another identity, and each job needs a particular one. Link the cards to build the map.","summary":"Toolbox map","how":"Tap two cards, choose the link word, then press Link.","ui":{"src":"Where it comes from","id":"Identities","job":"Jobs","from":"comes from","use":"is used to","word":"Link word:","link":"Link","clear":"Clear","card1":"Card 1","card2":"Card 2","none":"none yet","needAll":"Choose two cards and a link word first.","notStem":"This link is about §1. Make it one of your two cards.","labelFrom":"This link says where an identity comes from: choose “comes from”.","labelUse":"A job doesn’t come from an identity; the identity is used to do the job. Choose “is used to”.","chainHead":"Tools in order:","chainCheck":"Check the order","chainReset":"Start over","chainFull":"Two tools are in. Check the order, or start over.","chainNeed":"Link at least one tool to this job first.","chainAdded":"Added as tool §1. Link the next tool, or check the order.","splitQ":"Which way of writing `cos(π/12)` would you use? Tap one.","done":"All eight links made."},"cards":{"src":[{"id":"s_circle","t":"the point `(cos x, sin x)` on a circle of radius 1"},{"id":"s_tri","t":"the right triangle with angles `x` and `π/2 - x`"},{"id":"s_divc","t":"dividing `sin^2 x + cos^2 x = 1` by `cos^2 x`"},{"id":"s_divs","t":"dividing `sin^2 x + cos^2 x = 1` by `sin^2 x`"},{"id":"s_sinab","t":"`sin(a + b)` with `a = b = x`"},{"id":"s_cosab","t":"`cos(a + b)` with `a = b = x`"},{"id":"s_cosamb","t":"`cos(a - b)` with `a = π/2`"}],"id":[{"id":"i_pyth","name":"Pythagorean","t":"`sin^2 x + cos^2 x = 1`"},{"id":"i_tan","name":"Pythagorean (tan and sec)","t":"`1 + tan^2 x = sec^2 x`"},{"id":"i_quot","name":"Quotient","t":"`tan x = {sin x}/{cos x}`"},{"id":"i_rec","name":"Reciprocal","t":"`csc x = 1/sin x`, `sec x = 1/cos x`, `cot x = 1/tan x`"},{"id":"i_cof","name":"Cofunction","t":"`cos(π/2 - x) = sin x`"},{"id":"i_rel","name":"Related angle","t":"`cos(π - x) = -cos x`: reference angle and CAST"},{"id":"i_comp","name":"Compound angle","t":"`sin(a ± b)`, `cos(a ± b)`"},{"id":"i_dbl","name":"Double angle","t":"`sin 2x = 2 sin x cos x`, `cos 2x = cos^2 x - sin^2 x`"}],"job":[{"id":"j_76","t":"find `cos(7π/6)` exactly"},{"id":"j_12","t":"find `cos(π/12)` exactly"},{"id":"j_pr","t":"prove `{1 - cos^2 x}/{sin x} = sin x`"},{"id":"j_c2","t":"write `cos 2x` using only `sin x`"}]},"challenges":[{"id":"TM1","topics":["26","29"],"goal":6,"type":"link","stem":"i_pyth","label":"from","prompt":"`sin^2 x + cos^2 x = 1` \u003cstrong>comes from\u003c/strong> …","_a":"GhI9BltFVFtdHRE6RkVeFQ==","why":{"s_circle":"The point `(cos x, sin x)` is 1 unit from the origin, so the Pythagorean theorem on its reference triangle (legs `cos x` and `sin x`, hypotenuse 1) gives `cos^2 x + sin^2 x = 1`.","s_tri":"That works too: in any right triangle, `(opposite/hypotenuse)^2 + (adjacent/hypotenuse)^2 = 1`. On the unit circle the hypotenuse is 1 and the legs are `cos x` and `sin x`."},"fb":{"i_comp":"It’s the Pythagorean theorem on the reference triangle with hypotenuse 1.","def":"That card doesn’t lead to `sin^2 x + cos^2 x = 1`. Which picture has legs `cos x` and `sin x` and hypotenuse 1?"}},{"id":"TM2","topics":["29"],"goal":6,"type":"link","stem":"i_tan","label":"from","prompt":"`1 + tan^2 x = sec^2 x` \u003cstrong>comes from\u003c/strong> …","_a":"GhI9AVtBVBU=","why":{"s_divc":"`{sin^2 x}/{cos^2 x} + {cos^2 x}/{cos^2 x} = {1}/{cos^2 x}` is `tan^2 x + 1 = sec^2 x`."},"fb":{"s_divs":"Dividing by `sin^2 x` gives `1 + cot^2 x = csc^2 x`.","i_pyth":"Close: it does come from the Pythagorean identity. Which card says what you do to it?","def":"Which card turns `sin x` and `cos x` into `tan x` and `sec x`?"}},{"id":"TM3","topics":["28"],"goal":[4,6],"type":"link","stem":"i_dbl","label":"from","prompt":"`sin 2x = 2 sin x cos x` \u003cstrong>comes from\u003c/strong> …","_a":"GhI9FltZVlUa","why":{"s_sinab":"`sin(x + x) = sin x cos x + cos x sin x = 2 sin x cos x`."},"fb":{"s_cosab":"That gives `cos 2x`.","i_comp":"Close: it comes from one compound-angle formula with both angles the same. Which card says that?","def":"`2x = x + x`. Which card adds an angle to itself?"}},{"id":"TM4","topics":["27"],"goal":[3,6],"type":"link","stem":"i_cof","label":"from","prompt":"`cos(π/2 - x) = sin x` \u003cstrong>comes from\u003c/strong> …","_a":"GhI9Bl1EVlpaHRE6RkVeFQ==","why":{"s_cosamb":"`cos(π/2 - x) = cos(π/2) cos x + sin(π/2) sin x = 0 + sin x = sin x`.","s_tri":"In the right triangle, the side opposite `x` is adjacent to `π/2 - x`, so `cos(π/2 - x) = sin x`."},"fb":{"i_rel":"That gives `-cos x` for cosine.","i_comp":"Close: which compound-angle formula, with which value of `a`?","def":"That card doesn’t swap cosine for sine. Which one subtracts `x` from `π/2`?"}},{"id":"TM5","topics":["26"],"goal":[2,6],"type":"link","stem":"j_76","label":"use","prompt":"The job “find `cos(7π/6)` exactly” \u003cstrong>uses\u003c/strong> …","_a":"Ggg9F1dbS15nAg0IQhU=","why":{"i_rel":"`7π/6 = π + π/6`: reference angle `π/6` for the size, and cosine is negative in quadrant 3 (CAST), so `cos(7π/6) = -√3/2`.","i_comp":"That works too: `cos(π + π/6) = cos π cos(π/6) - sin π sin(π/6) = -√3/2`. The reference angle `π/6` and CAST get there faster."},"fb":{"i_dbl":"`7π/6` isn’t double a special angle in a helpful way; it’s `π + π/6`.","def":"`7π/6 = π + π/6`. Which card handles an angle past π?"}},{"id":"TM6","topics":["28"],"goal":[4,6],"type":"link","stem":"j_12","label":"use","prompt":"The job “find `cos(π/12)` exactly” \u003cstrong>uses\u003c/strong> …","_a":"Ggg9Bl1aRxU=","why":{"i_comp":"`π/12` isn’t a special angle, but it’s a difference of two special angles, so the compound-angle formula `cos(a - b)` gives its cosine exactly."},"fb":{"def":"`π/12` isn’t a special angle. Can you write it as a difference of two special angles?"},"split":[{"t":"`cos(π/12) = cos(π/3 - π/4)`","why":"`cos(π/3 - π/4) = (1/2)(√2/2) + (√3/2)(√2/2) = {√2 + √6}/{4}`.","_n":"10754","_k":"67c7a9e2"},{"t":"`cos(π/12) = cos(π/4 - π/6)`","why":"`cos(π/4 - π/6) = (√2/2)(√3/2) + (√2/2)(1/2) = {√6 + √2}/{4}`: the same value as `π/3 - π/4` gives.","_n":"11744","_k":"c3a0d1ba"},{"t":"`cos(π/12) = cos(π/3) - cos(π/4)`","why":"Functions don’t distribute over a difference.","_n":"12734","_k":"53763b3d"}]},{"id":"TM7","topics":["29"],"goal":[5,6],"type":"link","stem":"j_pr","label":"use","prompt":"The job “prove `{1 - cos^2 x}/{sin x} = sin x`” \u003cstrong>uses\u003c/strong> …","_a":"Ggg9FUtDXxU=","why":{"i_pyth":"LS: `1 - cos^2 x = sin^2 x`, so `{sin^2 x}/{sin x} = sin x` = RS."},"fb":{"i_dbl":"There’s no `2x` here; `1 - cos^2 x` is `sin^2 x`.","def":"Look at the top: `1 - cos^2 x`. Which identity rewrites it?"}},{"id":"TM8","topics":["28","29"],"goal":[4,6],"type":"chain","stem":"j_c2","label":"use","stretch":true,"prompt":"The job “write `cos 2x` using only `sin x`” \u003cstrong>uses, in order\u003c/strong> …","_a":"Ggg9AVBbCV5nERsRWhU=","why":{"chain":"Double angle first: `cos 2x = cos^2 x - sin^2 x`. Then the Pythagorean identity replaces `cos^2 x` with `1 - sin^2 x`: `cos 2x = 1 - 2 sin^2 x`."},"fb":{"one":"`cos 2x = cos^2 x - sin^2 x` still has a cosine; replace it with `1 - sin^2 x`.","order":"Start with `cos 2x` itself: the double angle turns it into `cos^2 x - sin^2 x` first. Then the Pythagorean identity replaces `cos^2 x`.","def":"You need two tools: one that writes `cos 2x` with `cos x` and `sin x`, then one that swaps `cos^2 x` for something in `sin x`."}}],"onePage":{"title":"The chapter on one page","intro":"The finished map: the unit circle in the centre, and each identity card with where it comes from and the module that taught it.","aria":"Unit circle with the point (cos x, sin x) and its reference triangle: legs cos x and sin x, hypotenuse 1. The eight identity cards sit around it.","ids":[{"id":"i_pyth","from":"comes from the point `(cos x, sin x)` on a circle of radius 1","mods":"26 and 29"},{"id":"i_tan","from":"comes from dividing `sin^2 x + cos^2 x = 1` by `cos^2 x`","mods":"29"},{"id":"i_quot","from":"comes from the point: `tan x = y/x`","mods":"26 and 29"},{"id":"i_rec","from":"flips sin, cos and tan: each pair has exactly one “co”","mods":"26"},{"id":"i_cof","from":"comes from `cos(a - b)` with `a = π/2`, or the right triangle","mods":"27"},{"id":"i_rel","from":"comes from reflecting the point: same size, CAST for the sign","mods":"26 and 27"},{"id":"i_comp","from":"comes from turning on from angle `a` by angle `b`","mods":"28"},{"id":"i_dbl","from":"comes from `sin(a + b)` and `cos(a + b)` with `a = b = x`","mods":"28"}],"jobsTitle":"Jobs and their tools","jobs":["Find `cos(7π/6)` exactly: reference angle `π/6` and CAST.","Find `cos(π/12)` exactly: `cos(a - b)` with `π/3` and `π/4` (or `π/4` and `π/6`).","Prove `{1 - cos^2 x}/{sin x} = sin x`: the Pythagorean identity.","Write `cos 2x` using only `sin x`: double angle, then Pythagorean, giving `1 - 2 sin^2 x`."]}},"mixed":{"heading":"Mixed practice","intro":"Twelve questions from every Chapter 4 module, mixed up on purpose, so you practise choosing the right idea. Each has three levels of help. You can try again after a wrong answer.","activities":[{"id":"mx","type":"custom","title":"Twelve questions from all five modules","summary":"Mixed practice","items":[{"id":"mp1","topic":"28","goal":4,"kind":"num","star":true,"prompt":"`sin a = 3/5` and `cos b = 5/13`, with `a` and `b` in quadrant 1. Find `sin(a + b)`.","label" θ` and `cos θ` have the same size and opposite signs.","Same size: reference angle `π/4`. Opposite signs: quadrants 2 and 4.","`3π/4` and `7π/4`."]},{"id":"mp5","topic":"27","goal":3,"kind":"mc","prompt":"`sin(π - x)` equals…","options":[{"t":"`-sin x`","why":"`π - x` mirrors `x` in the `y`-axis: same height.","_n":"17e63","_k":"c2e1090e"},{"t":"`cos x`","why":"That’s `sin(π/2 - x)`.","_n":"18e73","_k":"88d925b4"},{"t":"`sin x`","why":"`π - x` mirrors `x` in the `y`-axis: same height.","_n":"19e43","_k":"256f94d9"},{"t":"`-cos x`","why":"That’s `cos(π - x)`.","_n":"1ae53","_k":"b3ef7ec7"}],"hints":["Where is the point for `π - x`, compared with the point for `x`?","It’s the reflection in the `y`-axis: the same `y`-coordinate.","`sin x`."]},{"id":"mp6","topic":"25","goal":1,"kind":"num","keypad":"decimal","prompt":"Convert `3π/5` to degrees.","label":"`3π/5` =","unit":"°","_a":"CVFa","display":"108°","why":"π = 180°, so `3π/5` = 3 × 36° = 108°.","wrong":[{"match":216,"fb":"π = 180°, so `3π/5` = 3 × 36°."}],"hints":["Replace π with 180°.","180° ÷ 5 = 36°.","3 × 36° = 108°."]},{"id":"mp7","topic":"28","goal":4,"kind":"num","prompt":"If `sin x = 1/3`, find `cos 2x`.","label":"`cos 2x =`","_a":"CE9VUgUAAAAPVlVSBQAAAA9Z","display":"`cos 2x = 7/9`","why":"`cos 2x = 1 - 2 sin^2 x = 1 - 2/9 = 7/9`.","wrong":[{"match":0.6666666666666666,"fb":"`cos 2x = 1 - 2 sin^2 x = 1 - 2/9`."}],"hints":["Choose the `cos 2x` form with sin only.","`1 - 2 sin^2 x`.","`7/9`."]},{"id":"mp8","topic":"26","goal":2,"kind":"mc","star":true,"prompt":"A point on a circle of radius 10 centred at the origin is at angle `4π/3`. What are its coordinates?","options":[{"t":"`(-1/2, -√3/2)`","why":"Multiply by 10.","_n":"1bf23","_k":"bfd073c2"},{"t":"`(-5√3, -5)`","why":"Sizes swapped.","_n":"1cf33","_k":"da67045e"},{"t":"`(-5, -5√3)`","why":"`(10 cos(4π/3), 10 sin(4π/3)) = (10(-1/2), 10(-√3/2))`.","_n":"1df04","_k":"8458bc24"},{"t":"`(5, -5√3)`","why":"Quadrant 3: `x` negative.","_n":"1eef4","_k":"431dc4a1"}],"hints":["The point is `(10 cos(4π/3), 10 sin(4π/3))`.","Reference angle `π/3`, quadrant 3: both coordinates negative.","`(-5, -5√3)`."]},{"id":"mp9","topic":"29","goal":5,"kind":"mc","star":true,"prompt":"Is `(sin x + cos x)^2 = 1 + sin 2x` an identity?","options":[{"t":"Yes: the left side expands to `sin^2 x + 2 sin x cos x + cos^2 x = 1 + sin 2x`","why":"`sin^2 x + cos^2 x = 1` and `2 sin x cos x = sin 2x`, so the left side becomes the right side.","_n":"1ff24","_k":"6874c944"},{"t":"No: `(a + b)^2 = a^2 + b^2`","why":"That drops the middle term.","_n":"1gf14","_k":"12a421a9"},{"t":"Yes, because both sides equal 1 for every `x`","why":"At `x = π/4` both sides are 2.","_n":"1hf44","_k":"61914cef"},{"t":"No: at `x = 0` the sides are 1 and 1","why":"Agreeing at a value doesn’t disprove it; that’s backwards.","_n":"1if34","_k":"a607a4cd"}],"hints":["Expand the left side.","`(sin x + cos x)^2 = sin^2 x + 2 sin x cos x + cos^2 x`.","`= 1 + sin 2x`: it’s an identity."]},{"id":"mp10","topic":"27","goal":3,"kind":"mc","star":true,"prompt":"Which expression equals `cos(x + π/2)`?","options":[{"t":"`-sin x`","why":"`cos(x + π/2) = cos x · 0 - sin x · 1 = -sin x`.","_n":"1jf64","_k":"a3a9d1bc"},{"t":"`-cos x`","why":"That’s `cos(x + π)`.","_n":"1kf54","_k":"29acc719"},{"t":"`cos x`","why":"Adding `π/2` turns the point a quarter turn, so the value changes. Use `cos(a + b)`.","_n":"1le84","_k":"758daee2"},{"t":"`sin x`","why":"`cos(x + π/2) = cos x · 0 - sin x · 1`.","_n":"1me74","_k":"112916b8"}],"hints":["Use `cos(a + b) = cos a cos b - sin a sin b`.","`cos(π/2) = 0` and `sin(π/2) = 1`.","`-sin x`."]},{"id":"mp11","topic":"25","goal":1,"kind":"num","star":true,"keypad":"decimal","prompt":"An arc of length `5π` cm subtends an angle of `5π/6` at the centre. What is the radius?","label":"`r =`","unit":"cm","_a":"Dg==","display":"6 cm","why":"`r = a/θ = 5π ÷ 5π/6 = 6` cm.","wrong":[{"match":41.12335167120566,"fb":"That multiplies; `r = a/θ`."}],"hints":["`a = rθ`, so `r = a/θ`.","`5π ÷ 5π/6 = 5π × 6/(5π)`.","6 cm."]},{"id":"mp12","topic":"28","goal":4,"kind":"mc","star":true,"fixedOrder":true,"prompt":"`tan(π/12)` exactly?","options":[{"t":"`{√6 - √2}/{4}`","why":"That’s `sin(π/12)`.","_n":"1nde3","_k":"57a9650b"},{"t":"`2 - √3`","why":"`tan(π/3 - π/4) = {√3 - 1}/{1 + √3}`; rationalized, that’s `2 - √3`.","_n":"1odf3","_k":"3a39760a"},{"t":"`√3 - 1`","why":"That’s `tan(π/3) - tan(π/4)`. `sin(a + b) = sin a cos b + cos a sin b`. Try `a = b = π/2`: `sin π = 0`, not 2.","_n":"1pe03","_k":"d0186eb7"},{"t":"`2 + √3`","why":"That’s `tan(5π/12)`.","_n":"1qe13","_k":"7dcf9afb"}],"hints":["`tan(π/3 - π/4)`.","`{√3 - 1}/{1 + √3}`.","Rationalize: `2 - √3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which link in the toolbox map surprised you most?"},{"id":"j2","q":"In your own words, why is one counterexample enough to show an equation isn’t an identity, but one agreeing value proves nothing?"},{"id":"j3","q":"Explain to a friend how to find `sin(7π/12)` exactly."},{"id":"j4","q":"Which module will you revisit, and what exactly will you practise there?"}]},"final":{"intro":"This shows what you’ve learned across the whole chapter, so there are no hints here. Answer all 15 questions and say how sure you are. Then submit to see your results by category and by module. Each question is labelled with its achievement chart category and its module.","questions":[{"id":"f1","cat":"K","topic":"25","goal":1,"a":{"fixedOrder":true,"prompt":"What is `3π/4` in degrees?","options":[{"t":"45°","why":"That’s `π/4`.","_n":"1re23","_k":"17deaf43"},{"t":"135°","why":"`3π/4` = 3 × 180° ÷ 4 = 135°.","_n":"1se33","_k":"dd4d6efc"},{"t":"270°","why":"π = 180°, not 360°.","_n":"1te43","_k":"8e9dcd9f"},{"t":"540°","why":"That’s 3 × 180 ÷ 1.","_n":"1ue53","_k":"189ed92b"}]},"b":{"fixedOrder":true,"prompt":"What is `7π/6` in degrees?","options":[{"t":"30°","why":"That’s `π/6`.","_n":"1ve63","_k":"a56e26b3"},{"t":"210°","why":"`7π/6` = 7 × 180° ÷ 6 = 210°.","_n":"1we73","_k":"0e93fc94"},{"t":"420°","why":"π = 180°, not 360°.","_n":"1xe43","_k":"a88565a3"},{"t":"1260°","why":"That’s 7 × 180 ÷ 1.","_n":"1ye33","_k":"2f054ab5"}]}},{"id":"f2","cat":"K","topic":"26","goal":2,"a":{"fixedOrder":true,"prompt":"What is the exact value of `sec(2π/3)`?","options":[{"t":"−2","why":"`cos(2π/3) = -1/2`.","_n":"1ze23","_k":"9bf7bbf8"},{"t":"`-{2√3}/{3}`","why":"That’s csc’s partner: `1/sin`.","_n":"20e13","_k":"e70daed3"},{"t":"`-1/2`","why":"That’s cos; sec is its reciprocal.","_n":"21e83","_k":"108d9957"},{"t":"2","why":"Reference angle for the size, CAST for the sign.","_n":"22e73","_k":"f3f30dcb"}]},"b":{"fixedOrder":true,"prompt":"What is the exact value of `cot(5π/4)`?","options":[{"t":"`-√2`","why":"That’s `csc(5π/4)`.","_n":"23e63","_k":"3ef1de77"},{"t":"−1","why":"Tangent is positive in quadrant 3.","_n":"24e53","_k":"0090bd43"},{"t":"0","why":"cot is 0 only where cos is 0, at `π/2` and `3π/2`.","_n":"25ec3","_k":"b04f2e7c"},{"t":"1","why":"`tan(5π/4) = 1`.","_n":"26eb3","_k":"a53e144d"}]}},{"id":"f3","cat":"K","topic":"28","goal":4,"a":{"prompt":"Which expression is identical to `cos(a - b)`?","options":[{"t":"`cos a cos b - sin a sin b`","why":"Cosine flips the sign: `cos(a ∓ b) = cos a cos b ± sin a sin b`.","_n":"27f25","_k":"90858494"},{"t":"`sin a cos b - cos a sin b`","why":"That’s `sin(a - b)`.","_n":"28f35","_k":"0708e7c2"},{"t":"`cos a cos b + sin a sin b`","why":"Cosine flips the sign: `cos(a ∓ b) = cos a cos b ± sin a sin b`.","_n":"29f05","_k":"72d7fe1b"},{"t":"`cos a - cos b`","why":"Functions don’t distribute over a difference: try `a = b`, where `cos 0 = 1`, not 0.","_n":"2af15","_k":"8a8c5ae5"}]},"b":{"prompt":"Which expression is identical to `sin(a + b)`?","options":[{"t":"`sin a cos b + cos a sin b`","why":"The sine of a sum keeps the plus: `sin a cos b + cos a sin b`.","_n":"2bf65","_k":"bfe12b12"},{"t":"`cos a cos b - sin a sin b`","why":"That’s `cos(a + b)`.","_n":"2cf75","_k":"1a6a6ba9"},{"t":"`sin a cos b - cos a sin b`","why":"That’s `sin(a - b)`.","_n":"2df45","_k":"f4411671"},{"t":"`sin a + sin b`","why":"`sin(a + b) = sin a cos b + cos a sin b`. Try `a = b = π/2`: `sin π = 0`, not 2.","_n":"2ef55","_k":"fcc7a655"}]}},{"id":"f4","cat":"K","topic":"29","goal":5,"a":{"prompt":"Which Pythagorean identity relates tan and sec?","options":[{"t":"`1 + tan^2 x = sec^2 x`","why":"Divide `sin^2 x + cos^2 x = 1` by `cos^2 x`: `tan^2 x + 1 = sec^2 x`.","_n":"2fea5","_k":"76d249b0"},{"t":"`1 + sec^2 x = tan^2 x`","why":"Divide `sin^2 x + cos^2 x = 1` by `cos^2 x`.","_n":"2geb5","_k":"961c5661"},{"t":"`tan^2 x + sec^2 x = 1`","why":"Divide `sin^2 x + cos^2 x = 1` by `cos^2 x`.","_n":"2hf85","_k":"de83f1f9"},{"t":"`tan^2 x - 1 = sec^2 x`","why":"Divide `sin^2 x + cos^2 x = 1` by `cos^2 x`.","_n":"2if75","_k":"8cf1933f"}]},"b":{"prompt":"Which Pythagorean identity relates cot and csc?","options":[{"t":"`1 + csc^2 x = cot^2 x`","why":"Divide `sin^2 x + cos^2 x = 1` by `sin^2 x`.","_n":"2jfa5","_k":"3f9d3162"},{"t":"`cot^2 x - 1 = csc^2 x`","why":"Divide `sin^2 x + cos^2 x = 1` by `sin^2 x`.","_n":"2kf95","_k":"b1bf40c3"},{"t":"`1 + cot^2 x = csc^2 x`","why":"Divide `sin^2 x + cos^2 x = 1` by `sin^2 x`: `1 + cot^2 x = csc^2 x`.","_n":"2lf45","_k":"face6116"},{"t":"`cot^2 x + csc^2 x = 1`","why":"Divide `sin^2 x + cos^2 x = 1` by `sin^2 x`.","_n":"2mf35","_k":"e90d562f"}]}},{"id":"f5","cat":"T","topic":"26","goal":2,"a":{"fixedOrder":true,"prompt":"`cos θ = -√3/2` and `tan θ > 0`, with `0 ≤ θ ≤ 2π`. Find `θ`.","options":[{"t":"`5π/6`","why":"In quadrant 2, tangent is negative.","_n":"2nf65","_k":"5c9a1959"},{"t":"`7π/6`","why":"Cosine negative, tangent positive: quadrant 3; reference `π/6`.","_n":"2of55","_k":"b1e657a8"},{"t":"`4π/3`","why":"`cos(4π/3) = -1/2`.","_n":"2pf05","_k":"410eedb9"},{"t":"`7π/4`","why":"`cos(7π/4)` is positive.","_n":"2qef5","_k":"cd616023"}]},"b":{"fixedOrder":true,"prompt":"`sin θ = -√2/2` and `cos θ > 0`, with `0 ≤ θ ≤ 2π`. Find `θ`.","options":[{"t":"`3π/4`","why":"`sin(3π/4)` is positive.","_n":"2r0e6","_k":"1f9e0c49"},{"t":"`5π/4`","why":"In quadrant 3, cosine is negative.","_n":"2s0d6","_k":"9d09eec1"},{"t":"`5π/3`","why":"`sin(5π/3) = -√3/2`.","_n":"2t0c6","_k":"6d381899"},{"t":"`7π/4`","why":"Quadrant 4; reference `π/4`.","_n":"2u0b6","_k":"3fc243fe"}]}},{"id":"f6","cat":"T","topic":"28","goal":4,"a":{"fixedOrder":true,"prompt":"What is the exact value of `cos(5π/12)`?","options":[{"t":"`{√2 - √6}/{4}`","why":"That subtracts in the wrong order: it’s negative, but `5π/12` is in quadrant 1.","_n":"2v0a6","_k":"2c836409"},{"t":"`{√6 - √2}/{4}`","why":"`cos(π/4 + π/6) = (√2/2)(√3/2) - (√2/2)(1/2)`.","_n":"2w096","_k":"993c212f"},{"t":"`{√6 + √2}/{4}`","why":"Cosine of a sum has a minus.","_n":"2x086","_k":"ac497962"},{"t":"`{√2 + √3}/{2}`","why":"That’s `cos(π/4) + cos(π/6)`.","_n":"2y076","_k":"cf45b3bc"}]},"b":{"fixedOrder":true,"prompt":"What is the exact value of `sin(7π/12)`?","options":[{"t":"`{√2 - √6}/{4}`","why":"Negative, but `7π/12` is in quadrant 2, where sine is positive.","_n":"2z066","_k":"3739a216"},{"t":"`{√6 - √2}/{4}`","why":"Cosine flips the sign, but sine keeps it: `sin(a + b) = sin a cos b + cos a sin b`.","_n":"30056","_k":"94202384"},{"t":"`{√6 + √2}/{4}`","why":"`sin(π/3 + π/4) = (√3/2)(√2/2) + (1/2)(√2/2)`.","_n":"31086","_k":"176048bb"},{"t":"`{√3 + √2}/{2}`","why":"That’s `sin(π/3) + sin(π/4)`.","_n":"32096","_k":"c6c2f932"}]}},{"id":"f7","cat":"T","topic":"29","goal":5,"a":{"fixedOrder":true,"prompt":"Which value of `x` shows that `sin 2x = 2 sin x` is \u003cstrong>not\u003c/strong> an identity?","options":[{"t":"`x = 0`","why":"Both sides are 0.","_n":"330a6","_k":"2132a6ef"},{"t":"`x = π/2`","why":"`sin π = 0`, but `2 sin(π/2) = 2`.","_n":"340b6","_k":"e288ef10"},{"t":"`x = π`","why":"Both sides are 0.","_n":"35046","_k":"7462a490"},{"t":"`x = 2π`","why":"Both sides are 0.","_n":"36056","_k":"c08a5d0a"}]},"b":{"fixedOrder":true,"prompt":"Which value of `x` shows that `cos(x + π) = cos x` is \
