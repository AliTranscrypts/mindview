.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 05: hero, C1 esterStage, esterification station, bars, Part 3 stations, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.ce-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ce-hx-name{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:10px 18px;margin:6px 0 2px;min-height:4.2em}
.ce-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ce-hx-cap{font:400 1.05rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:2.8em}

/* name halves + scent card */
.ce-name{display:inline-flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px;font:400 1.35rem var(--font-ui)}
.ce-half{display:inline-flex;flex-direction:column;align-items:center}
.ce-half strong{padding:0 2px 2px;border-bottom:4px solid var(--pen)}
.ce-half.oate strong{border-bottom-color:var(--f3)}
.ce-half small{font-size:.78rem;color:var(--ink-2);margin-top:3px}
.ce-scent{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:10px;padding:6px 12px;background:var(--sheet);font-size:.98rem}
.ce-sico{width:24px;height:24px;color:var(--ink-2);flex:none}
.ce-u{padding-bottom:1px;border-bottom:3px solid var(--pen);font-weight:700}
.ce-u.oate{border-bottom-color:var(--f3)}

/* station */
.ce-how{margin-top:0}
.ce-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"view read" "ctrl read";gap:16px 28px;align-items:start}
.ce-left{grid-area:view;min-width:0}.ce-ctrl{grid-area:ctrl;min-width:0}.ce-right{grid-area:read;min-width:0}
.ce-cap{font:400 clamp(1.05rem,2.3vw,1.35rem)/1.35 var(--font-ui);white-space:normal;min-height:1.4em}
.ce-cap .chem{white-space:normal;overflow-wrap:anywhere}
.ce-capn{font-size:.8em;color:var(--ink-2)}
.ce-stagebox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.ce-svg,.ce-psvg,.ce-soapsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ce-stepcap{min-height:2.8em;margin:8px 0 4px;font-size:1rem}
.ce-out{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;margin-top:10px;min-height:1em}
.ce-ctrl > div + div{margin-top:12px}
.ce-pick > div + div,.ce-revc > div + div{margin-top:10px}
.ce-heavy{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:.95rem;min-height:32px}
.ce-heavy input{width:20px;height:20px;flex:none}
.ce-find{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.ce-find label{display:block;font-size:.88rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.ce-fr{display:flex;flex-wrap:wrap;gap:6px}
.ce-fin{font:inherit;padding:.35em .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 9rem;max-width:18rem;min-height:36px}
.ce-sub{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:4px 0 6px}
.ce-trio{display:flex;flex-wrap:wrap;gap:6px}
.ce-trio .btn{min-height:36px}
.ce-act{margin-top:14px}
.ce-msg{min-height:1.4em;margin:8px 0 0;font-size:.95rem;color:var(--ink-2)}
.ce-right .chem-tab{margin-top:14px}
.ce-pick[hidden],.ce-revc[hidden],.ce-propc[hidden],.ce-heavy[hidden],.ce-stage[hidden],.ce-bars[hidden],.ce-act[hidden],.ce-zoom[hidden],.ce-leg[hidden]{display:none}
.ce-nodata{margin:6px 0}
/* bars */
.ce-bsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ce-blabs{display:grid;gap:4px;margin-top:2px}
.ce-blab{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:.9rem;line-height:1.25;overflow-wrap:anywhere;padding:4px 2px;border-radius:6px}
.ce-blab.cur{background:var(--hi-soft)}
.ce-bnote{margin:8px 0 0}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.ce-beakers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin-top:12px}
.ce-bk{margin:0;min-width:0;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.ce-bk figcaption{font-weight:700;text-align:center;margin-bottom:4px}
.ce-bksvg,.ce-zsvg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.ce-zoom{margin:8px 0}
.ce-bkread{margin-top:6px}
.ce-leg{margin:10px 0 0}
.ce-key{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:var(--sheet);font-weight:700;font-size:.75rem;vertical-align:middle}
.ce-key.h3o{background:var(--ab-h3o)}.ce-key.an{background:var(--f3)}
.ce-key.mol{width:20px;height:11px;border-radius:6px;border:1.6px solid var(--ink-2);background:var(--sheet)}
.ce-s2pick{margin:8px 0 12px}
.ce-pairbox{max-width:560px}
.ce-s2cap,.ce-soapcap{min-height:2.8em;margin:8px 0 6px}
.ce-s2read,.ce-soapread{margin-top:6px}
.ce-soapbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);margin-top:10px;overflow:hidden}
.ce-soapstep{margin-top:4px}

/* practice + task */
.ce-pchips{margin-top:10px}
.ce-pchips .chip{min-height:36px}
.ce-conds{margin:6px 0 10px;padding-left:1.3em}
.ce-h4{margin:12px 0 6px}
.ce-tk > div + div{margin-top:10px}
.ce-tkname{margin:10px 0 4px;font-size:1.05rem}
#ce-tkview[hidden]{display:none}

@media (max-width:760px){
  .ce-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "ctrl" "read"}
  .rg.seg button{padding:.4em .6em}
  .ce-beakers{grid-template-columns:minmax(0,1fr)}
  .ce-blab{font-size:.74rem}
  .ce-blab strong{font-size:.8rem}
  .ce-name{font-size:1.15rem}
}

</style>

c acid is more dilute","why":"Same concentration.","_n":"3ra1f","_k":"49b0725a"}]},"b":{"prompt":"Vinegar reacts more slowly with a piece of limestone than hydrochloric acid of the same concentration. Best explanation?","options":[{"t":"Ethanoic acid is weak, so there are far fewer H₃O⁺ ions to react at any moment","why":"Same concentration, but only a small fraction of the ethanoic acid is ionized at any moment.","_n":"3sa0f","_k":"756b4111"},{"t":"Limestone dissolves only in strong acids","why":"It dissolves in both, at different rates.","_n":"3t9bf","_k":"04cef5df"},{"t":"Ethanoic acid is a strong acid","why":"Only a small fraction of the molecules ionize in water: they’re weak acids.","_n":"3u9af","_k":"8c117d31"},{"t":"Vinegar contains no acid","why":"It’s about 5% ethanoic acid.","_n":"3v99e","_k":"aa323b6b"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which best explains why the ester of ethanoic acid and propan-1-ol is called propyl ethanoate?","options":[{"t":"“The longer part always goes first.”","why":"Order follows the alcohol/acid roles, not length.","_n":"3w9ae","_k":"baa289da"},{"t":"“Esters are named alphabetically.”","why":"No: alcohol part, then acid part.","_n":"3x9be","_k":"7c8197b6"},{"t":"“The alcohol part is named first as an alkyl group (propyl); the acid part keeps its chain and ends in -oate (ethanoate).”","why":"The name follows the roles of the parts: alcohol part first, acid part second.","_n":"3y9ce","_k":"a6000a5d"},{"t":"“The acid part is named first as an alkyl group.”","why":"The alcohol part comes first, as an alkyl group; the acid part keeps its chain and ends in -oate.","_n":"3z9de","_k":"e5e7dc86"}]},"b":{"prompt":"Which is the clearest description of esterification?","options":[{"t":"“A combustion that forms CO₂.”","why":"No O₂ involved.","_n":"409ee","_k":"c9bf1474"},{"t":"“A substitution where the alcohol replaces a C–H.”","why":"The OH of the acid is lost.","_n":"419fe","_k":"505a988e"},{"t":"“A condensation: the acid’s OH and the alcohol’s H leave as water, joining the two parts through an O.”","why":"It names the reaction type, what leaves and how the two parts join.","_n":"42a0e","_k":"1033305c"},{"t":"“An addition across a C=C.”","why":"No multiple bond is involved.","_n":"4391e","_k":"c9f01a03"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which equation correctly represents saponification of ethyl ethanoate?","options":[{"t":"CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃CH₂OH","why":"In base, the acid part ends up as its salt (sodium ethanoate) and the alcohol part as ethanol.","_n":"4492e","_k":"8ffa18dc"},{"t":"CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃OH + CH₄","why":"Atoms aren’t conserved.","_n":"459fe","_k":"de5b9df2"},{"t":"CH₃COOCH₂CH₃ + H₂O → CH₃COOCH₃ + CH₃OH","why":"That isn’t hydrolysis.","_n":"469ee","_k":"51ea7daa"},{"t":"CH₃COOCH₂CH₃ + NaOH → CH₃COOH + CH₃CH₂ONa","why":"In base, the acid is neutralized: you get the carboxylate salt (soap) and the alcohol.","_n":"479de","_k":"334e1c2e"}]},"b":{"prompt":"Which statement about soap-making is correct?","options":[{"t":"“Soap is an ester.”","why":"It’s a carboxylate salt.","_n":"489ce","_k":"4d3502be"},{"t":"“A fat reacts with an acid to give soap.”","why":"Saponification uses a base.","_n":"49a3e","_k":"350164cf"},{"t":"“A fat (an ester of glycerol) reacts with a strong base to give glycerol and carboxylate salts, which are soap.”","why":"That’s saponification: base hydrolysis of the fat’s three ester links.","_n":"4aa2e","_k":"deb94edd"},{"t":"“Soap is a free carboxylic acid.”","why":"In base, the acid is neutralized: you get the carboxylate salt (soap) and the alcohol.","_n":"4ba1e","_k":"d52f9432"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A flavour chemist wants pentyl ethanoate (pear/banana). Which acid and alcohol?","options":[{"t":"pentanoic acid + ethanol","why":"The alcohol part comes first, as an alkyl group; the acid part keeps its chain and ends in -oate.","_n":"4ca0e","_k":"dc30311e"},{"t":"ethanoic acid + pentane","why":"Pentane has no OH.","_n":"4d97e","_k":"24384dfe"},{"t":"ethanoic acid + pentan-1-ol","why":"Pentyl comes from pentan-1-ol; ethanoate comes from ethanoic acid.","_n":"4e96e","_k":"62dcf905"},{"t":"ethanol + pentanal","why":"An aldehyde doesn’t form esters.","_n":"4fa5e","_k":"145a7412"}]},"b":{"prompt":"Methyl butanoate gives an apple flavour. Which acid and alcohol?","options":[{"t":"methanoic acid + butane","why":"Butane has no OH.","_n":"4ga6e","_k":"689a70a0"},{"t":"methanoic acid + butan-1-ol","why":"The alcohol part comes first, as an alkyl group; the acid part keeps its chain and ends in -oate.","_n":"4ha3e","_k":"0a4337d6"},{"t":"butanoic acid + methanol","why":"Methyl comes from methanol; butanoate comes from butanoic acid.","_n":"4ia4e","_k":"b012a64b"},{"t":"butanal + methanol","why":"An aldehyde doesn’t form esters.","_n":"4ja1e","_k":"3ca6edfa"}]}},{"id":"a2","cat":"A","goal":[4,5],"a":{"prompt":"ASA (acetylsalicylic acid), the active ingredient in some pain relievers, contains an ester group. Old, damp tablets smell of vinegar. Why?","options":[{"t":"The tablet ferments into ethanol","why":"No fermentation happens.","_n":"4ka2e","_k":"f8584980"},{"t":"Vinegar was added as a preservative","why":"The smell comes from the breakdown.","_n":"4l9fe","_k":"693240f3"},{"t":"Moisture hydrolyzes the ester, releasing ethanoic acid","why":"Water splits the ester link (hydrolysis). One product is ethanoic acid, the acid in vinegar.","_n":"4ma0e","_k":"b44fda2b"},{"t":"The ester oxidizes to a ketone","why":"Esters don’t oxidize to ketones.","_n":"4n9de","_k":"c71a80df"}]},"b":{"prompt":"Polyester fabric is held together by ester links. Repeated washing in very hot, strongly basic detergent weakens it. Why?","options":[{"t":"Base hydrolyzes the ester links, breaking the polymer chains","why":"Base hydrolysis splits ester links, as in saponification, so the long chains fall apart.","_n":"4o9ee","_k":"624be110"},{"t":"The base adds across C=C bonds","why":"Ester links aren’t C=C.","_n":"4p0be","_k":"4f43113c"},{"t":"Heat turns the esters into alkanes","why":"Heat speeds hydrolysis; it doesn’t make alkanes.","_n":"4q0ae","_k":"d4db266a"},{"t":"Polyesters dissolve in water","why":"They’re broken by hydrolysis, not dissolved.","_n":"4r0de","_k":"5f5beaf8"}]}}]},"task":{"title":"Balanced flavour","summary":"Balanced flavour","statement":"\u003cp>Choose an acid and an alcohol to make an ester that meets every condition, then name it. Can you find every answer?\u003c/p>\u003col class=\"ce-conds\">\u003cli>The ester has 6 carbons in total.\u003c/li>\u003cli>The acid part has at least as many carbons as the alcohol part.\u003c/li>\u003cli>You named the ester correctly.\u003c/li>\u003c/ol>","checks":["6 carbons","Acid part ≥ alcohol part","Named correctly"],"tips":["Add the carbons from both chips.","Count the acid’s carbons, including the C=O carbon, and compare.","Alcohol part first, ending -yl; acid part second, ending -oate."],"explainPrompt":"Explain how you used the name to decide which acid and which alcohol to choose.","vocab":"Use the words ester, condensation, alkyl and -oate.","more":"There’s more than one answer. Can you find every one?","after3":"Butyl ethanoate and pentyl methanoate also have 6 carbons, but their alcohol parts are bigger. All five 6-carbon esters are isomers: C₆H₁₂O₂."},"cards":[["Carboxylic acid","–COOH at the chain end; suffix -oic acid (propanoic acid)."],["Counting carbons","The COOH carbon is C1: CH₃COOH is ethanoic acid."],["Common names","Methanoic = formic acid; ethanoic = acetic acid (vinegar)."],["Ester","R–COO–R′; named alkyl alkanoate (ethyl ethanoate)."],["Esterification","Acid + alcohol ⇌ ester + water (acid catalyst); a condensation."],["Which part is which","The C=O side came from the acid; the O–alkyl side from the alcohol."],["Hydrolysis","Ester + water → acid + alcohol (acid catalyst)."],["Saponification","Ester + strong base → carboxylate salt + alcohol; makes soap from fats."],["Weak acid","Carboxylic acids ionize only slightly in water."],["Acid boiling points","High: strong H-bonding, molecules pair up."],["Ester boiling points","Low for their mass: no O–H."],["Ester scents","Ethyl butanoate (pineapple), 3-methylbutyl ethanoate (banana)."]]}};</script>
