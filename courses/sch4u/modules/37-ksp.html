.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }

*{transition:none!important;animation:none!important}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}

.chem sub,.chem sup{font-size:.72em;line-height:0}

.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.ks-conc button{padding:.22em .6em;font-size:.86rem;min-height:32px}
.rg button:disabled{opacity:.5}

/* hero */
.ks-eq{display:inline-block;line-height:1.35}
.ks-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ks-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ks-hx-cap{font:400 1.02rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:2.8em}

/* simulator */
.ks-how{margin-top:0}
.ks-modes{margin:0 0 12px}
.ks-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px 28px;align-items:start}
.ks-left,.ks-right{min-width:0}
.ks-bks{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ks-bks.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ks-bk{margin:0;min-width:0}
.ks-bk[hidden]{display:none}
.ks-svg,.ks-qsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ks-bk .ks-svg{max-width:360px;margin:0 auto}
.ks-fc{text-align:center;font-size:.92rem;color:var(--ink-2);margin-top:2px}
.ks-legend{font-size:.86rem;color:var(--ink-2);margin:8px 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.ks-key{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;color:var(--sheet);font:700 .8rem/1 var(--font-ui)}
.ks-key.cat{background:var(--ec-cat)}
.ks-key.an{background:var(--ec-an)}
.ks-key.sol{border-radius:3px;border:1.5px solid var(--ink-2);background:repeating-linear-gradient(45deg,var(--ink-2) 0 2px,var(--sheet) 2px 5px)}
.ks-qb{max-width:420px;margin:8px 0 0}
.ks-qb[hidden]{display:none}
.ks-cap{min-height:1.5em;margin:8px 0 4px;font-size:1rem}
.ks-ctrl > div + div{margin-top:12px}
.ks-ctrl [hidden]{display:none}
.ks-dis > * + *,.ks-ci > * + *{margin-top:12px}
.ks-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.ks-solbox{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px 4px}
.ks-solbox + .ks-solbox{margin-top:10px}
.ks-solbox > * + *{margin-top:8px}
.ks-add{margin:4px 0 0}
.ks-msg{min-height:1.2em;margin:6px 0 0;font-size:.95rem}
.ks-msg:empty{min-height:0}
.ks-read{margin-top:14px}
.ks-gone{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px;margin-left:6px;font-size:.92em}
.ks-ice{margin-top:12px}
.ks-hl{background:var(--hi);color:var(--hi-ink);padding:0 4px;border-radius:4px}
.ks-entry{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

/* scientific-notation entry */
.ks-sci{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap}
.ks-sci .numin.ks-man{width:5.2rem}
.ks-sci .numin.ks-exp{width:4.4rem;transform:translateY(-.45em);font-size:.9rem}
.ks-x{font-weight:700;white-space:nowrap}
.ks-part{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}
.ks-plab{font-weight:700;min-width:5.5em}
.ks-unit{font-weight:700;color:var(--ink-2)}
.ks-inv{margin-top:12px;padding:10px 12px;border-left:4px solid var(--pen);background:var(--paper);border-radius:6px}
.ks-inv p{margin:0 0 8px}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.ks-st .read{margin-top:10px}
.ks-steps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.ks-stepb{border:2px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 .95rem var(--font-ui);padding:.3em .8em;min-height:40px}
.ks-stepb[aria-pressed="true"]{background:var(--hi);border-color:var(--hi-ink);color:var(--hi-ink)}
.ks-fb2{margin-top:8px}
.ks-ph{margin:10px 0}
.ks-work{margin:8px 0;padding-left:1.4em}
.ks-work li{margin:4px 0}
.ks-work .ks-none{list-style:none;margin-left:-1.4em}

/* task */
.ks-conds{margin:6px 0 10px;padding-left:1.3em}
.ks-tki,.ks-tkj{margin-bottom:12px}
.ks-h4{margin:12px 0 6px}
.ks-tkgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;align-items:start}
.ks-tkgrid .ks-svg{max-width:260px}

@media (max-width:760px){
  .ks-grid{grid-template-columns:minmax(0,1fr)}
  .rg.seg button{padding:.4em .6em}
  .ks-tkgrid{grid-template-columns:minmax(0,1fr)}
  .ks-tkgrid .ks-svg{margin:0 auto}
}

","_k":"7ff8830b"}],"explain":"After mixing each ion is 1.0 × 10⁻³ mol/L. \u003ci>Q\u003c/i> is far above \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 1.8 × 10⁻¹⁰."},{"id":"p3","prompt":"Common-ion mode, saturated AgCl, NaCl slider moved from 0 to 0.010 mol/L. What happens to the amount of AgCl dissolved?","options":[{"t":"it decreases","_n":"w839","_k":"537d3bae"},{"t":"it stays the same","_n":"x829","_k":"edb52063"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> decreases","_n":"y819","_k":"720cf3b5"},{"t":"it increases","_n":"z809","_k":"adc5b383"}],"explain":"Extra Cl⁻ pushes the equilibrium left (Le Chatelier). \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> doesn’t change."},{"id":"p4","prompt":"Dissolve mode, AgCl and CaF₂ side by side. AgCl has \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 1.8 × 10⁻¹⁰ and CaF₂ has \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 3.5 × 10⁻¹¹. Which dissolves more (higher molar solubility)?","options":[{"t":"they’re equal","_n":"107f9","_k":"3ce83ce5"},{"t":"you can’t compare without masses","_n":"117e9","_k":"dd734203"},{"t":"CaF₂","_n":"127d9","_k":"b77d002e"},{"t":"AgCl","_n":"13f48","_k":"4c9ee954"}],"explain":"Different formula types: \u003ci>s\u003c/i> = √\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> for AgCl but \u003ci>s\u003c/i> = ∛(\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ 4) for CaF₂. Compare \u003ci>s\u003c/i>, not \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Dissolve mode, model salt MX₂ with \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 3.2 × 10⁻¹¹ (model). Enter its molar solubility.","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(2\u003ci>s\u003c/i>)² = 4\u003ci>s\u003c/i>³, so \u003ci>s\u003c/i>³ = 8.0 × 10⁻¹² and \u003ci>s\u003c/i> = 2.0 × 10⁻⁴ mol/L.","hints":["\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(2\u003ci>s\u003c/i>)² = 4\u003ci>s\u003c/i>³.","\u003ci>s\u003c/i>³ = 3.2 × 10⁻¹¹ ÷ 4 = 8.0 × 10⁻¹².","\u003ci>s\u003c/i> = 2.0 × 10⁻⁴ mol/L."]},{"id":"tc2","goal":3,"prompt":"Mix mode: equal volumes (50.0 mL each) of AgNO₃ and NaCl at the \u003cstrong>same\u003c/strong> concentration. Choose the \u003cstrong>largest\u003c/strong> concentration chip that gives \u003cstrong>no\u003c/strong> precipitate. (Chips to try: 1.0 × 10⁻⁶, 1.0 × 10⁻⁵, 2.0 × 10⁻⁵, 4.0 × 10⁻⁵, 1.0 × 10⁻⁴ mol/L.)","why":"After mixing, \u003ci>Q\u003c/i> = (1.0 × 10⁻⁵)² = 1.0 × 10⁻¹⁰ \u003c 1.8 × 10⁻¹⁰. The next chip, 4.0 × 10⁻⁵, gives \u003ci>Q\u003c/i> = 4.0 × 10⁻¹⁰: a precipitate.","hints":["After mixing, each concentration is half the chip value.","\u003ci>Q\u003c/i> = (\u003ci>c\u003c/i>/2)²; you need \u003ci>Q\u003c/i> \u003c 1.8 × 10⁻¹⁰.","2.0 × 10⁻⁵ gives 1.0 × 10⁻¹⁰; 4.0 × 10⁻⁵ gives 4.0 × 10⁻¹⁰."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Common-ion mode, AgCl. Set the NaCl so that AgCl’s molar solubility drops to exactly 1.0 × 10⁻⁸ mol/L.","why":"[Cl⁻] = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ \u003ci>s\u003c/i> = 1.8 × 10⁻¹⁰ ÷ 1.0 × 10⁻⁸ = 0.018 mol/L. \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> stayed 1.8 × 10⁻¹⁰; only \u003ci>s\u003c/i> changed.","hints":["With added Cl⁻, \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i> × [Cl⁻] (the Cl⁻ from AgCl is tiny).","[Cl⁻] = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ \u003ci>s\u003c/i>.","1.8 × 10⁻¹⁰ ÷ 1.0 × 10⁻⁸ = 1.8 × 10⁻² = 0.018 mol/L."]}]},"part3":{"slug":"real-world","name":"Real world","heading":"Solubility in the real world","intro":"Four short case stations apply \u003ci>Q\u003c/i> vs \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> where it matters: in the body, in the kitchen, in wastewater and in hospitals. All numbers are model values.","s1":{"title":"Station 1: Kidney stones","intro":"Calcium oxalate, CaC₂O₄, is the most common kind of kidney stone. A model urine sample has [Ca²⁺] = 2.5 × 10⁻³ and [C₂O₄²⁻] = 1.0 × 10⁻⁶ mol/L. Is \u003ci>Q\u003c/i> above \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>? Then press \u003cstrong>Drink more water\u003c/strong>.","note":"Model numbers, not medical advice."},"s2":{"title":"Station 2: Kettle scale and hard water","intro":"Hard water carries Ca²⁺. Heating drives off CO₂, which raises [CO₃²⁻]. Tap the heating step where \u003ci>Q\u003c/i> first exceeds \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> for CaCO₃: that’s when scale starts to form on the element.","note":"Model numbers. This station uses the 25 °C \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> at every step."},"s3":{"title":"Station 3: Cleaning up dissolved metals","intro":"Adding lime (calcium hydroxide) raises [OH⁻], so metal hydroxides precipitate and can be filtered out. Mg(OH)₂ stands in for the metal here. Choose a pH and step through the calculation of the most Mg²⁺ that can stay dissolved.","note":"Lead and cadmium hydroxides behave the same way (their values aren’t in our table)."},"s4":{"title":"Station 4: Barium ‘meals’ for X-rays","intro":"A patient drinks a suspension of BaSO₄ so the gut shows up on an X-ray. Ba²⁺ ions are toxic, but BaSO₄ is so insoluble that very little Ba²⁺ dissolves. Press \u003cstrong>Add a little sulfate\u003c/strong> to see the common-ion effect at work.","use":"√1.1 ≈ 1.05","note":"Model numbers, not medical advice."},"quickCheck":{"title":"Quick check","summary":"Real world quick check","items":[{"id":"q1","goal":5,"prompt":"Why does drinking more water lower kidney-stone risk (Station 1)?","choices":[{"t":"Both ion concentrations fall, so \u003ci>Q\u003c/i> drops below \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","fb":"Right. Dilution lowers \u003ci>Q\u003c/i>; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is unchanged.","_n":"14f58","_k":"20c0ff59"},{"t":"Water changes \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","fb":"Dilution lowers \u003ci>Q\u003c/i>; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is unchanged.","_n":"15f28","_k":"a322fe6c"},{"t": >\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(3\u003ci>s\u003c/i>)³ = 27\u003ci>s\u003c/i>⁴.","l8|r7":"MX₃: \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(3\u003ci>s\u003c/i>)³ = 27\u003ci>s\u003c/i>⁴.","l8|r9":"MX₃: \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(3\u003ci>s\u003c/i>)³ = 27\u003ci>s\u003c/i>⁴."},"wrongDefault":"Write the ions, put \u003ci>s\u003c/i> or 2\u003ci>s\u003c/i> in, and multiply."},{"id":"precip","type":"custom","title":"Precipitate or not?","summary":"Precipitate or not?","star":true,"goal":[3,4,5],"instruction":"Six problems: enter numbers in scientific notation and choose where asked. Problems 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type the number part, then the power of ten (e.g. 1.0 and −6 for 1.0 × 10⁻⁶), choose where asked, then press Check.","uses":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub>: AgCl 1.8 × 10⁻¹⁰ · AgBr 5.0 × 10⁻¹³ · BaSO₄ 1.1 × 10⁻¹⁰ · CaF₂ 3.5 × 10⁻¹¹ · Mg(OH)₂ 5.6 × 10⁻¹² (course table)","items":[{"id":"x1","goal":3,"prompt":"50.0 mL of 2.0 × 10⁻³ mol/L AgNO₃ + 50.0 mL of 2.0 × 10⁻³ mol/L NaCl. \u003ci>Q\u003c/i>? Precipitate?","display":"\u003ci>Q\u003c/i> = 1.0 × 10⁻⁶; yes, AgCl precipitates","fb":"Find the after-mixing concentrations first, then multiply them.","parts":[{"k":"num","label":"\u003ci>Q\u003c/i> =","_a":"B0sEUgJVB1A=","unit":"","wrong":[{"match":0.000004,"fb":"Halve each concentration first."}]},{"k":"pick","label":"Precipitate?","options":[{"t":"yes","_n":"1kff8","_k":"87086de1"},{"t":"no","why":"\u003ci>Q\u003c/i> is far above \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 1.8 × 10⁻¹⁰.","_n":"1lf28","_k":"fafdcad9"}]}]},{"id":"x2","goal":3,"prompt":"10.0 mL of 1.0 × 10⁻⁴ mol/L BaCl₂ + 90.0 mL of 1.0 × 10⁻⁵ mol/L Na₂SO₄. \u003ci>Q\u003c/i>? Precipitate of BaSO₄?","display":"\u003ci>Q\u003c/i> = 9.0 × 10⁻¹¹; no (just below 1.1 × 10⁻¹⁰)","fb":"Divide each ion’s moles by the total volume, 100.0 mL, then multiply.","parts":[{"k":"num","label":"\u003ci>Q\u003c/i> =","_a":"DgAZUwM=","unit":"","wrong":[{"match":1e-9,"fb":"[Ba²⁺] = 1.0 × 10⁻⁵ and [SO₄²⁻] = 9.0 × 10⁻⁶ after mixing."}]},{"k":"pick","label":"Precipitate?","options":[{"t":"no","_n":"1mf18","_k":"1719ae74"},{"t":"yes","why":"[Ba²⁺] = 1.0 × 10⁻⁵ and [SO₄²⁻] = 9.0 × 10⁻⁶ after mixing.","_n":"1ne88","_k":"3d4e8968"}]}],"invest":{"prompt":"\u003cstrong>Investigation:\u003c/strong> In a real test, which variable must you control so that \u003ci>Q\u003c/i> can be compared with the table’s \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>?","options":[{"t":"beaker size","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> values are for 25 °C; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes with temperature.","_n":"1oe98","_k":"365728d4"},{"t":"temperature","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> values are for 25 °C; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes with temperature.","_n":"1pea8","_k":"0a048460"},{"t":"lighting","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> values are for 25 °C; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes with temperature.","_n":"1qeb8","_k":"fc3f01f5"},{"t":"stirring speed","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> values are for 25 °C; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes with temperature.","_n":"1rec8","_k":"3f62541f"}]}},{"id":"x3","goal":3,"star":true,"prompt":"50.0 mL of 2.0 × 10⁻³ mol/L Ca(NO₃)₂ + 50.0 mL of 8.0 × 10⁻⁴ mol/L NaF. \u003ci>Q\u003c/i>? Precipitate of CaF₂?","display":"\u003ci>Q\u003c/i> = 1.6 × 10⁻¹⁰; yes","fb":"Halve both, then \u003ci>Q\u003c/i> = [Ca²⁺][F⁻]².","parts":[{"k":"num","label":"\u003ci>Q\u003c/i> =","_a":"BksCBx9UBw==","unit":"","wrong":[{"match":4e-7,"fb":"Square [F⁻]."},{"match":1.28e-9,"fb":"Halve each concentration first."}]},{"k":"pick","label":"Precipitate?","options":[{"t":"yes","_n":"1sed8","_k":"7987a5aa"},{"t":"no","why":"1.6 × 10⁻¹⁰ is above \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 3.5 × 10⁻¹¹.","_n":"1tee8","_k":"0d18202b"}]}]},{"id":"x4","goal":5,"star":true,"prompt":"Most Mg²⁺ that can stay dissolved at pH 11.00?","display":"5.6 × 10⁻⁶ mol/L","fb":"Find [OH⁻] from the pH, then [Mg²⁺] = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ [OH⁻]².","parts":[{"k":"num","label":"[Mg²⁺] =","_a":"B0sEUgJVB1QB","unit":"mol/L","wrong":[{"match":5.6e-9,"fb":"Square [OH⁻]."}]}]},{"id":"x5","goal":4,"star":true,"prompt":"Molar solubility of CaF₂ in 0.10 mol/L NaF?","display":"3.5 × 10⁻⁹ mol/L","fb":"The F⁻ comes almost all from the NaF; put it into \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> and solve for \u003ci>s\u003c/i>.","parts":[{"k":"num","label":"\u003ci>s\u003c/i> =","_a":"BEsBBx9c","unit":"mol/L","wrong":[{"match":0.00021,"fb":"That’s in pure water; the common ion lowers it."},{"match":0.000206,"fb":"That’s in pure water; the common ion lowers it."},{"match":3.5e-10,"fb":"[F⁻] = 0.10 must be squared."}]}],"hints":["[F⁻] ≈ 0.10 from the NaF.","\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(0.10)².","\u003ci>s\u003c/i> = 3.5 × 10⁻¹¹ ÷ 0.010 = 3.5 × 10⁻⁹."]},{"id":"x6","goal":3,"star":true,"prompt":"Ag⁺ is added slowly to a solution with 0.010 mol/L Cl⁻ and 0.010 mol/L Br⁻. Which salt precipitates first, and what is [Br⁻] when AgCl just starts to form?","use":"5.0 ÷ 1.8 ≈ 2.8","display":"AgBr first; [Br⁻] ≈ 2.8 × 10⁻⁵ mol/L","fb":"When AgCl starts, [Ag⁺] = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>(AgCl) ÷ 0.010; use that [Ag⁺] in AgBr’s \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.","parts":[{"k":"pick","label":"Precipitates first:","options":[{"t":"AgBr","_n":"1uef8","_k":"ac5adcb2"},{"t":"AgCl","why":"AgBr needs only [Ag⁺] = 5.0 × 10⁻¹¹; AgCl needs 1.8 × 10⁻⁸.","_n":"1vf08","_k":"f1ae5e71"}]},{"k":"num","label":"[Br⁻] =","_a":"B0sEUgJVBVk=","unit":"mol/L","wrong":[{"match":5e-11,"fb":"That’s the [Ag⁺] AgBr needs to start. Now find [Br⁻] when [Ag⁺] = 1.8 × 10⁻⁸."}]}],"hints":["Find the [Ag⁺] each salt needs to start precipitating: \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ 0.010.","AgBr: 5.0 × 10⁻¹¹; AgCl: 1.8 × 10⁻⁸. The smaller one goes first.","When [Ag⁺] reaches 1.8 × 10⁻⁸, [Br⁻] = 5.0 × 10⁻¹³ ÷ 1.8 × 10⁻⁸ ≈ 2.8 × 10⁻⁵ mol/L."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Tenzin","how":"","goal":[2,3,4],"instruction":"Tenzin made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"The molar solubility of CaF₂ is 2.0 × 10⁻⁴ mol/L in a model. Find \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.","steps":["CaF₂(s) ⇌ Ca²⁺(aq) + 2F⁻(aq).","[Ca²⁺] = \u003ci>s\u003c/i> and [F⁻] = \u003ci>s\u003c/i>.","\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>² = 4.0 × 10⁻⁸."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>³ = 8.0 × 10⁻¹².","why":"You need (2\u003ci>s\u003c/i>)², not \u003ci>s\u003c/i>².","_n":"1wf18","_k":"f67f64dd"},{"t":"[F⁻] = 2\u003ci>s\u003c/i>, so \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(2\u003ci>s\u003c/i>)² = 4\u003ci>s\u003c/i>³ = 3.2 × 10⁻¹¹.","why":"Each CaF₂ that dissolves gives 2 F⁻: [F⁻] = 2\u003ci>s\u003c/i>, and it’s squared: (2\u003ci>s\u003c/i>)² = 4\u003ci>s\u003c/i>².","_n":"1xee8","_k":"5afc9fec"},{"t":"Step 2 is correct.","why":"Each CaF₂ that dissolves gives 2 F⁻: [F⁻] = 2\u003ci>s\u003c/i>, and it’s squared: (2\u003ci>s\u003c/i>)² = 4\u003ci>s\u003c/i>².","_n":"1yed8","_k":"689e15eb"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 2\u003ci>s\u003c/i>² = 8.0 × 10⁻⁸.","why":"[F⁻] is squared, so the 2 is squared too.","_n":"1zec8","_k":"1dec7917"}],"hints":["How many F⁻ per CaF₂?","Two, so [F⁻] = 2\u003ci>s\u003c/i>.","4\u003ci>s\u003c/i>³ = 3.2 × 10⁻¹¹."]},{"id":"e2","goal":3,"task":"50.0 mL of 3.0 × 10⁻³ mol/L Pb(NO₃)₂ is mixed with 50.0 mL of 3.0 × 10⁻³ mol/L KI. Does PbI₂ (\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> 9.8 × 10⁻⁹) precipitate?","steps":["PbI₂(s) ⇌ Pb²⁺ + 2I⁻, so \u003ci>Q\u003c/i> = [Pb²⁺][I⁻]².","\u003ci>Q\u003c/i> = (3.0 × 10⁻³)(3.0 × 10⁻³)² = 2.7 × 10⁻⁸.","2.7 × 10⁻⁸ > 9.8 × 10⁻⁹, so a precipitate forms."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Step 3 compares correctly; the mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"Mixing equal volumes doubles the volume: halve each concentration before finding \u003ci>Q\u003c/i>.","_n":"20eb8","_k":"c22c837d"},{"t":"\u003ci>Q\u003c/i> = (3.0 × 10⁻³)(6.0 × 10⁻³)².","why":"[I⁻] isn’t doubled here; KI gives one I⁻ each.","_n":"21f28","_k":"f498f73d"},{"t":"Use \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 4\u003ci>s\u003c/i>³ instead.","why":"That’s for dissolving a pure salt, not for mixing.","_n":"22f18","_k":"a3434b49"},{"t":"After mixing, each is 1.5 × 10⁻³ mol/L: \u003ci>Q\u003c/i> = 3.4 × 10⁻⁹ \u003c \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>, so no precipitate.","why":"Mixing equal volumes doubles the volume: halve each concentration before finding \u003ci>Q\u003c/i>.","_n":"23f08","_k":"eca3d60a"}],"hints":["What happened to the volume?","It doubled: halve each concentration.","\u003ci>Q\u003c/i> = 1.5 × 10⁻³ × (1.5 × 10⁻³)² = 3.4 × 10⁻⁹."]},{"id":"e3","goal":4,"task":"Find the molar solubility of AgCl in 0.010 mol/L NaCl.","steps":["AgCl(s) ⇌ Ag⁺ + Cl⁻; \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 1.8 × 10⁻¹⁰.","[Cl⁻] = 0.010 + \u003ci>s\u003c/i> ≈ 0.010.","So \u003ci>s\u003c/i>² = 1.8 × 10⁻¹⁰ and \u003ci>s\u003c/i> = 1.3 × 10⁻⁵ mol/L."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct: \u003ci>s\u003c/i> is tiny.",""],"fixes":[{"t":"\u003ci>s\u003c/i> × 0.010 = 1.8 × 10⁻¹⁰, so \u003ci>s\u003c/i> = 1.8 × 10⁻⁸ mol/L.","why":"Step 2 set [Cl⁻] ≈ 0.010, so that’s what goes into the expression.","_n":"24ef8","_k":"ce3581fa"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is now 1.8 × 10⁻¹².","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> doesn’t change.","_n":"25f68","_k":"50b4ba2d"},{"t":"\u003ci>s\u003c/i> = 0.010 mol/L.","why":"That’s the Cl⁻ from NaCl.","_n":"26f58","_k":"09df8f91"},{"t":"Step 3 is correct.","why":"Step 3 ignores the 0.010 mol/L of Cl⁻ that step 2 found.","_n":"27fca","_k":"6c1d6635"}],"hints":["Which [Cl⁻] did step 2 decide on?","0.010, not \u003ci>s\u003c/i>.","\u003ci>s\u003c/i> = 1.8 × 10⁻⁸."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which reveal surprised you: P4 (the smaller \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> dissolved more) or P3 (a little salt made AgCl even less soluble)? Why?"},{"id":"j2","q":"In your own words, explain the difference between \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> and molar solubility."},{"id":"j3","q":"Explain to a friend how to decide whether a precipitate forms when two solutions are mixed."},{"id":"j4","q":"Which step do you still skip by accident (dilution, the 2\u003ci>s\u003c/i>, the square)? What will you do to catch it?"}]},"final":{"intro":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> values come from the course table unless marked “model”. “Use these values” boxes give any roots you need.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is the \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> expression for PbI₂(s)?","options":[{"t":"[Pb²⁺][I⁻]","why":"Two iodide ions: square [I⁻].","_n":"28fda","_k":"32cb3d21"},{"t":"[Pb²⁺][I⁻]² ÷ [PbI₂]","why":"The solid doesn’t appear.","_n":"29faa","_k":"5e174601"},{"t":"[Pb²⁺][I⁻]²","why":"Coefficients become exponents; the solid is left out.","_n":"2afba","_k":"a467c905"},{"t":"[Pb²⁺] × 2[I⁻]","why":"The 2 is an exponent, not a multiplier.","_n":"2b00a","_k":"9e5dcdbd"}]},"b":{"prompt":"Which is the \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> expression for Ag₂CO₃(s)?","options":[{"t":"[Ag⁺]²[CO₃²⁻]","why":"Coefficients become exponents; the solid is left out.","_n":"2c01a","_k":"89582e82"},{"t":"2[Ag⁺][CO₃²⁻]","why":"The 2 is an exponent, not a multiplier.","_n":"2dfea","_k":"c27aa830"},{"t":"[Ag⁺][CO₃²⁻]","why":"Two silver ions: square [Ag⁺].","_n":"2effa","_k":"ebb465a2"},{"t":"[Ag⁺]²[CO₃²⁻] ÷ [Ag₂CO₃]","why":"The solid doesn’t appear.","_n":"2ff4a","_k":"aa0f7543"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"NaCl is added to a saturated solution of AgCl. What happens?","options":[{"t":"Nothing happens, because NaCl is a different salt","why":"The shared Cl⁻ matters.","_n":"2gf5a","_k":"9a4f201f"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> decreases, so less AgCl dissolves","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes only with temperature.","_n":"2h02a","_k":"5fd2d585"},{"t":"More AgCl dissolves to balance the Cl⁻","why":"Adding a product ion shifts the equilibrium left.","_n":"2i01a","_k":"d82d04c3"},{"t":"Some AgCl precipitates; its solubility decreases and \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is unchanged","why":"The shared Cl⁻ shifts the equilibrium left.","_n":"2j04a","_k":"df669706"}]},"b":{"prompt":"Ca(NO₃)₂ is added to a saturated solution of CaF₂. What happens?","options":[{"t":"Some CaF₂ precipitates; its solubility decreases and \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is unchanged","why":"The shared Ca²⁺ shifts the equilibrium left.","_n":"2k03a","_k":"6c89a160"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> increases because there’s more calcium","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes only with temperature.","_n":"2lfea","_k":"6cdf01e8"},{"t":"More CaF₂ dissolves","why":"Extra Ca²⁺ shifts the equilibrium left.","_n":"2mfda","_k":"0380af54"},{"t":"Nothing happens, because nitrate isn’t in CaF₂","why":"The shared ion is Ca²⁺.","_n":"2n00a","_k":"259ba5d9"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"For a mixture, the ion product \u003ci>Q\u003c/i> is greater than \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>. What happens?","options":[{"t":"Solid precipitates until \u003ci>Q\u003c/i> = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","why":"Too many ions: some leave the solution as solid.","_n":"2offa","_k":"38793d47"},{"t":"More solid dissolves until \u003ci>Q\u003c/i> = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","why":"Too many ions means solid forms.","_n":"2pfaa","_k":"431ae6f8"},{"t":"Nothing; the solution is unsaturated","why":"\u003ci>Q\u003c/i> > \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is supersaturated.","_n":"2qf9a","_k":"73855081"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> rises to match \u003ci>Q\u003c/i>","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes only with temperature.","_n":"2rc30","_k":"28bad8bc"}]},"b":{"prompt":"For a solution, \u003ci>Q\u003c/i> is less than \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>. What does this mean?","options":[{"t":"The solution is unsaturated: more solid could dissolve","why":"\u003ci>Q\u003c/i> \u003c \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>: room for more ions.","_n":"2sc20","_k":"43583edf"},{"t":"A precipitate forms","why":"That needs \u003ci>Q\u003c/i> > \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.","_n":"2tc10","_k":"ef363f64"},{"t":"The solution is saturated","why":"Saturated means \u003ci>Q\u003c/i> = \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.","_n":"2uc00","_k":"db859ecc"},{"t":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> falls to match \u003ci>Q\u003c/i>","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes only with temperature.","_n":"2vbf0","_k":"4792a506"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A model salt MX₂ has a molar solubility of 3.0 × 10⁻⁴ mol/L. What is its \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>?","options":[{"t":"2.7 × 10⁻¹¹","why":"\u003ci>s\u003c/i>³ forgets that [X⁻] = 2\u003ci>s\u003c/i>.","_n":"2wbe0","_k":"37e056c8"},{"t":"5.4 × 10⁻¹¹","why":"2\u003ci>s\u003c/i>³ forgets to square the 2.","_n":"2xbd0","_k":"fe7df61a"},{"t":"1.1 × 10⁻¹⁰ (1.08 × 10⁻¹⁰)","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = \u003ci>s\u003c/i>(2\u003ci>s\u003c/i>)² = 4\u003ci>s\u003c/i>³ = 4 × 2.7 × 10⁻¹¹.","_n":"2ybc0","_k":"b63af233"},{"t":"9.0 × 10⁻⁸","why":"\u003ci>s\u003c/i>² is the AB rule.","_n":"2zbb0","_k":"8a52c8d6"}]},"b":{"prompt":"A model salt MX₂ has a molar solubility of 1.0 × 10⁻³ mol/L. What is its \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>?","options":[{"t":"2.0 × 10⁻⁹","why":"2\u003ci>s\u003c/i>³ forgets to square the 2.","_n":"30ba0","_k":"e24892f8"},{"t":"1.0 × 10⁻⁶","why":"\u003ci>s\u003c/i>² is the AB rule.","_n":"31bcf","_k":"7a0433f9"},{"t":"1.0 × 10⁻⁹","why":"\u003ci>s\u003c/i>³ forgets that [X⁻] = 2\u003ci>s\u003c/i>.","_n":"32bdf","_k":"e89be349"},{"t":"4.0 × 10⁻⁹","why":"4\u003ci>s\u003c/i>³ = 4 × 1.0 × 10⁻⁹.","_n":"33bef","_k":"82a113e2"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"50.0 mL of 2.0 × 10⁻⁴ mol/L Ca(NO₃)₂ is mixed with 50.0 mL of 6.0 × 10⁻⁴ mol/L NaF. Does CaF₂ (\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> 3.5 × 10⁻¹¹) precipitate?","options":[{"t":"No: after mixing, \u003ci>Q\u003c/i> = 9.0 × 10⁻¹², less than \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","why":"[Ca²⁺] = 1.0 × 10⁻⁴, [F⁻] = 3.0 × 10⁻⁴; \u003ci>Q\u003c/i> = 1.0 × 10⁻⁴ × 9.0 × 10⁻⁸.","_n":"34bff","_k":"5ddbd66a"},{"t":"Yes: \u003ci>Q\u003c/i> = 7.2 × 10⁻¹¹, using the stock concentrations","why":"Mixing halves both.","_n":"35b8f","_k":"7c9a50f2"},{"t":"Yes: whenever both ions are present, the solid forms","why":"Only if \u003ci>Q\u003c/i> > \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.","_n":"36b9f","_k":"1f74f594"},{"t":"Yes: \u003ci>Q\u003c/i> = 3.0 × 10⁻⁸, because [Ca²⁺][F⁻] is above \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","why":"[F⁻] must be squared.","_n":"37baf","_k":"82cea57d"}]},"b":{"prompt":"50.0 mL of 2.0 × 10⁻⁵ mol/L AgNO₃ is mixed with 50.0 mL of 2.0 × 10⁻⁵ mol/L NaCl. Does AgCl (\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> 1.8 × 10⁻¹⁰) precipitate?","options":[{"t":"No: \u003ci>Q\u003c/i> \u003c \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> means the solution is supersaturated","why":"\u003ci>Q\u003c/i> \u003c \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> means unsaturated.","_n":"38bbf","_k":"be71e175"},{"t":"Yes: \u003ci>Q\u003c/i> = 4.0 × 10⁻¹⁰, using the stock concentrations","why":"Mixing halves both.","_n":"39b4f","_k":"f308d03a"},{"t":"Yes: \u003ci>Q\u003c/i> = 2.0 × 10⁻⁵, the sum of the concentrations","why":"\u003ci>Q\u003c/i> is a product, not a sum.","_n":"3ab5f","_k":"02d5ce9f"},{"t":"No: after mixing, \u003ci>Q\u003c/i> = 1.0 × 10⁻¹⁰, less than \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>","why":"Each ion is 1.0 × 10⁻⁵ after mixing; \u003ci>Q\u003c/i> = (1.0 × 10⁻⁵)².","_n":"3b2f0","_k":"06fb7caa"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Which is more soluble in water (higher molar solubility): AgCl (\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> 1.8 × 10⁻¹⁰) or CaF₂ (\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> 3.5 × 10⁻¹¹)?","use":"√1.8 ≈ 1.34; ∛8.75 ≈ 2.06","options":[{"t":"AgCl, because its \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is larger","why":"Different formula types: compare \u003ci>s\u003c/i>.","_n":"3c2e0","_k":"5fa1cdb3"},{"t":"CaF₂: \u003ci>s\u003c/i> ≈ 2.1 × 10⁻⁴ mol/L, compared with 1.3 × 10⁻⁵ mol/L for AgCl","why":"\u003ci>s\u003c/i> = √\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> for AgCl; \u003ci>s\u003c/i> = ∛(\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ 4) for CaF₂.","_n":"3d310","_k":"552f16b0"},{"t":"You can’t compare without molar masses","why":"Molar solubility compares moles per litre directly.","_n":"3e300","_k":"8d5c4a93"},{"t":"They’re equally soluble, since both \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> values are tiny","why":"\u003ci>s\u003c/i> differs by more than tenfold.","_n":"3f2b0","_k":"5caf671d"}]},"b":{"prompt":"Model salts: MA has \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 1.0 × 10⁻¹⁰ and MB₂ has \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> = 4.0 × 10⁻¹². Which has the higher molar solubility?","options":[{"t":"They’re equal","why":"\u003ci>s\u003c/i> differs tenfold.","_n":"3g2a0","_k":"e314551b"},{"t":"MA, because its \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> is larger","why":"Different formula types: compare \u003ci>s\u003c/i>.","_n":"3h2d0","_k":"4748b915"},{"t":"MB₂: \u003ci>s\u003c/i> = 1.0 × 10⁻⁴ mol/L, compared with 1.0 × 10⁻⁵ mol/L for MA","why":"\u003ci>s\u003c/i> = √\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> for MA; \u003ci>s\u003c/i> = ∛(\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> ÷ 4) for MB₂.","_n":"3i2c0","_k":"97fd7c54"},{"t":"You can’t compare without molar masses","why":"Molar solubility compares moles per litre directly.","_n":"3j370","_k":"a35cfd97"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why AgCl is less soluble in salt water than in pure water?","options":[{"t":"“NaCl reacts with AgCl to make a new solid.”","why":"No new compound forms; the shared Cl⁻ shifts the equilibrium.","_n":"3k360","_k":"fcd7a78f"},{"t":"“Salt water is denser, so less can dissolve.”","why":"Density isn’t the cause; the common ion is.","_n":"3l290","_k":"040f2bac"},{"t":"“The extra Cl⁻ makes \u003ci>Q\u003c/i> bigger than \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>, so the equilibrium shifts left until [Ag⁺] is smaller. \u003ci>K\u003c/i>\u003csub>sp\u003c/sub> stays the same.”","why":"It names the common ion, the shift and the unchanged \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.","_n":"3m2a0","_k":"5fdcf0d6"},{"t":"“Salt water lowers \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.”","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes only with temperature.","_n":"3n270","_k":"758b1d20"}]},"b":{"prompt":"Which is the best explanation of why adding sulfate to a BaSO₄ suspension lowers [Ba²⁺]?","options":[{"t":"“Sulfate makes BaSO₄ more soluble.”","why":"The common ion lowers solubility.","_n":"3o280","_k":"0bac670a"},{"t":"“Sulfate lowers \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>.”","why":"\u003ci>K\u003c/i>\u003csub>sp\u003c/sub> changes only with temperature.","_n":"3p2d0","_k":"b36374ad"},{"t":"“Sulfate reacts with barium to form a gas.”","why":"No gas forms.","_n":"3q2e0","_k":"58c7adf9"},{"t":"“Added SO₄²⁻ raises \u003ci>Q\u003c/i> above \u003ci>K\u003c/i>\u003csub>sp\u003c/sub>, so BaSO₄ precipitates until [Ba²⁺] × [SO₄²⁻] equals \u00
