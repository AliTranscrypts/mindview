.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 03: hero, C1 molecule view (atom + bond buttons), switchboard, bars, particle box, Part 3 stations, task builder */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.ao-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ao-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ao-hx-cap{font:400 1.05rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:2.8em}

/* C1 molecule view */
.c1-wrap{position:relative;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.c1-svg{display:block;width:100%;height:auto;touch-action:pan-y;font-family:var(--font-ui)}
.c1-ov{position:absolute;inset:0;pointer-events:none}
.c1-b{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;padding:0;pointer-events:auto;cursor:pointer}
.c1-b.bd{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:6px}
.c1-b:hover{background:var(--hi-soft)}
.c1-b:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.c1-rot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.c1-rot .btn{min-width:40px;min-height:40px}
.c1-rot[hidden]{display:none}

/* switchboard */
.ao-how{margin-top:0}
.ao-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"view read" "ctrl read";gap:16px 28px;align-items:start}
.ao-left{grid-area:view;min-width:0}.ao-ctrl{grid-area:ctrl;min-width:0}.ao-right{grid-area:read;min-width:0}
.ao-cap{font:400 clamp(1.15rem,2.6vw,1.55rem)/1.3 var(--font-ui);white-space:normal;min-height:1.4em}
.ao-cap .chem{white-space:normal;overflow-wrap:anywhere}
.ao-views{margin-top:10px}
.ao-note{min-height:1.4em;margin:8px 0 0;font-size:1rem}
.ao-modes{margin-bottom:12px}
.ao-sl{display:block;margin:4px 0 6px}
.ao-msg{min-height:1.4em;margin:8px 0 6px;font-size:.92rem;color:var(--ink-2)}
.ao-sub{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:10px 0 6px}
.ao-menu{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ao-menu .ao-sub,.ao-menu p{flex-basis:100%;margin:4px 0 0}
.ao-menu .btn{min-height:36px}
.ao-menu .btn:disabled{opacity:.5}
.ao-why{flex-basis:100%;margin:-2px 0 2px}
.ao-tkr{flex-basis:100%;margin-top:6px}
.ao-oxrow{margin-top:12px}
.ao-water{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:.95rem;min-height:32px}
.ao-water input{width:20px;height:20px}
.ao-nf{margin-top:14px;padding-top:10px;border-top:1px solid var(--rule)}
.ao-nf label{display:block;font-size:.88rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.ao-nfr{display:flex;flex-wrap:wrap;gap:6px}
.ao-nin{font:inherit;padding:.35em .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 9rem;max-width:16rem;min-height:36px}
.ao-nmsg{min-height:1.2em;margin:6px 0 0}
.ao-right .chem-tab{margin-top:14px}
.ao-molbox[hidden],.ao-pbox[hidden],.ao-bars[hidden],.ao-views[hidden],.ao-oxrow[hidden],.ao-water[hidden],.ao-oxrow [hidden]{display:none}
/* bars */
.ao-bars{margin-top:12px}
.ao-bsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ao-blabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:2px}
.ao-blab{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:.9rem;line-height:1.25;overflow-wrap:anywhere;padding:4px 2px;border-radius:6px}
.ao-blab.cur{background:var(--hi-soft)}
/* particle box */
.ao-psvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ao-pcap{margin:8px 0 2px;font-size:.98rem}
.ao-pleg{margin:4px 0 0}
.ao-hbkey{display:inline-block;width:26px;height:0;border-top:3px dotted var(--e-pair);vertical-align:middle;margin:0 2px}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.ao-pick1,.ao-pick2,.ao-pick3{margin:8px 0 12px}

.ao-rung{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.ao-rung.cur{border-color:var(--pen);box-shadow:inset 4px 0 0 var(--pen)}
.ao-rung.next,.ao-rung.stop{border-style:dashed;color:var(--ink-2)}
.ao-rn{flex:none;min-width:3.6em;font-weight:700;font-size:.85rem;color:var(--ink-2)}
.ao-cf{font-size:.92rem}
.ao-cf .chem,.ao-eqn .chem,.ao-case .chem{white-space:normal;overflow-wrap:anywhere}
.ao-eqn{margin:8px 0 0;font-size:1.05rem}
.ao-l1msg{min-height:1.4em;margin:8px 0;font-weight:700}
.ao-zc{margin:6px 0 0}
.ao-l2step{margin-top:10px}
.ao-l2cap{min-height:2.8em;margin:8px 0 6px}
.ao-l2read{margin-top:6px}
.ao-strip{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ao-strip li{display:flex;align-items:center;gap:8px}
.ao-strip li > span:last-child{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--sheet)}
.ao-arr{font-weight:700;color:var(--ink-2)}

/* practice + task */
.ao-tf{display:block;font-size:.85em;color:var(--ink-2);font-weight:400}
.ao-pchips{margin-top:10px}
.ao-pchips .chip{min-height:36px}
.ao-conds{margin:6px 0 10px;padding-left:1.3em}
.ao-h4{margin:12px 0 6px}
#ao-tkview{margin-bottom:6px}

@media (max-width:760px){
  .ao-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "ctrl" "read"}
  .rg.seg button{padding:.4em .6em}
  .ao-lad{grid-template-columns:minmax(0,1fr)}
  .ao-blab{font-size:.74rem}
  .ao-blab strong{font-size:.8rem}
}

qSize":"sm","eqLabel":"C H 3 C H 2 O H and C H 3 O C H 3: same formula, C 2 H 6 O","headline":"Same atoms, a different place for the oxygen","text":"Put an –OH on a carbon chain and you have an \u003cstrong>alcohol\u003c/strong>; put the O between two carbons and you have an \u003cstrong>ether\u003c/strong>. Ethanol boils at 78 °C, methoxymethane at −24 °C. The difference is the \u003cstrong>hydrogen bond\u003c/strong>, which only the alcohol can form with its neighbours.","fig":{"html":"\u003cdiv class=\"ao-hx\">\u003csvg class=\"ao-hx-svg\" id=\"ao-hx-svg\" viewBox=\"0 0 640 462\" role=\"img\" aria-label=\"Two flasks: ethanol on the left, methoxymethane on the right, each holding a swarm of molecules. Violet dotted hydrogen bonds flicker between ethanol molecules, from O–H to O; none appear between the ether molecules. A thermometer rises: the ether escapes as a gas at −24 °C, while ethanol stays liquid until 78 °C.\">\u003c/svg>\u003cdiv class=\"ao-hx-row\">\u003cp class=\"ao-hx-cap\" id=\"ao-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ao-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can name and draw alcohols and ethers.","I can classify an alcohol as primary, secondary or tertiary.","I can explain boiling points and solubility of alcohols, ethers and alkanes using hydrogen bonding and polarity.","I can predict the products of oxidizing primary, secondary and tertiary alcohols.","I can predict the alkene(s) formed when an alcohol is dehydrated.","I can recognize alcohols and ethers as functional-group isomers with different properties."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Hydrogen bonding","goal":3,"prompt":"Which molecule can hydrogen-bond to another molecule of itself?","options":[{"t":"CH₃OCH₃","why":"No H on the O.","_n":"081c","_k":"417a3f45"},{"t":"CH₃Cl","why":"H on C doesn’t H-bond.","_n":"180c","_k":"fd5b442d"},{"t":"CH₃OH","why":"H on O.","_n":"27fc","_k":"388289f6"},{"t":"CH₄","why":"No O, N or F.","_n":"37ec","_k":"38e94cff"}],"hints":["H-bonds need H on N, O or F.","Which has an O–H?","CH₃OH."]},{"id":"w2","skill":"Hydrogen bonding","goal":3,"prompt":"Water (18 g/mol) boils at 100 °C; methane (16 g/mol) at −162 °C. Main reason?","options":[{"t":"Water molecules hydrogen-bond to each other","why":"The masses are similar, so the forces between the molecules make the difference: water’s O–H forms hydrogen bonds.","_n":"47dc","_k":"686004e6"},{"t":"Water is heavier","why":"Only 2 g/mol heavier: not enough to explain 262 °C.","_n":"57cc","_k":"968b6ee3"},{"t":"Methane has stronger covalent bonds","why":"Boiling doesn’t break covalent bonds.","_n":"67bc","_k":"5b1a5301"},{"t":"Methane is polar","why":"It’s nonpolar.","_n":"77ac","_k":"1a3acbc7"}],"hints":["Similar masses, huge difference.","Which forces differ?","Hydrogen bonding."]},{"id":"w3","skill":"Naming chains","goal":1,"prompt":"How many carbons does the root ‘prop-’ mean?","options":[{"t":"2","why":"2 is eth-.","_n":"879c","_k":"873aca88"},{"t":"3","why":"meth 1, eth 2, prop 3.","_n":"93db","_k":"44c8b608"},{"t":"4","why":"4 is but-.","_n":"a3eb","_k":"d3c89256"},{"t":"5","why":"5 is pent-.","_n":"b3bb","_k":"11df91a6"}],"hints":["meth 1, eth 2, …","prop comes next.","3."]},{"id":"w4","skill":"Naming chains","goal":1,"prompt":"Name CH₃CH₂CH₂CH₃ with an OH replacing an H on C1.","options":[{"t":"butan-4-ol","why":"Number from the OH end.","_n":"c3cb","_k":"b1b25a96"},{"t":"butanal","why":"-al is an aldehyde.","_n":"d41b","_k":"c7ad4f42"},{"t":"butane","why":"The OH changes the suffix.","_n":"e42b","_k":"53eca670"},{"t":"butan-1-ol","why":"Butane with -ol, OH on C1.","_n":"f3fb","_k":"f8ab20d1"}],"hints":["Parent chain?","Butane; replace -e with -ol.","butan-1-ol."]},{"id":"w5","skill":"Addition to alkenes","goal":5,"prompt":"Propene + H₂O (acid catalyst) gives mainly…","options":[{"t":"propan-2-ol","why":"Markovnikov: OH on C2.","_n":"g40b","_k":"d8c5f91b"},{"t":"propane","why":"That’s H₂ addition.","_n":"h35b","_k":"275d6f23"},{"t":"propanal","why":"Addition of water gives an alcohol.","_n":"i36b","_k":"7c583fc9"},{"t":"propan-1-ol","why":"That’s anti-Markovnikov.","_n":"jb7b","_k":"4ecccbdc"}],"hints":["Which carbon gets the H?","C1 (more H).","OH on C2: propan-2-ol."]},{"id":"w6","skill":"Polarity and solubility","goal":3,"prompt":"‘Like dissolves like’ means…","options":[{"t":"Substances only dissolve in themselves","why":"Different substances can mix.","_n":"kb6b","_k":"531cf1b8"},{"t":"Heavier substances dissolve heavier ones","why":"Mass isn’t the rule.","_n":"lb5b","_k":"b0c3d740"},{"t":"Polar substances dissolve in polar solvents; nonpolar in nonpolar","why":"Substances with similar intermolecular forces mix.","_n":"mb4b","_k":"0ee34cc7"},{"t":"Everything dissolves in water","why":"Oils don’t.","_n":"nb3b","_k":"267437fc"}],"hints":["Think oil and water.","Similar forces mix.","Polar with polar."]}],"refreshers":{"Hydrogen bonding":"An H on O, N or F attracted to a lone pair on another O, N or F. Much stronger than London forces between small molecules.","Naming chains":"Root gives length; the suffix tells the family; the locant tells the position.","Addition to alkenes":"Water adds across C=C with an acid catalyst; Markovnikov places the OH on the more substituted carbon.","Polarity and solubility":"Similar intermolecular forces mix: water dissolves polar, H-bonding molecules."}}},"explore":{"heading":"Functional group switchboard","intro":"Place one oxygen on a carbon chain: as an –OH (alcohol) or between two carbons (ether). Watch boiling point, solubility and class change.","how":"Set the number of carbons. Tap a carbon (or Tab to it) to put the –OH there or to add the methyl branch; tap a C–C bond to put the O between its two carbons; tap the O to remove it. Choose a mode to compare properties, see the class or look at the molecules in a box.","modes":[{"id":"prop","t":"Properties"},{"id":"cls","t":"Classify"},{"id":"part","t":"Particle view"}],"predictions":[{"id":"p1","prompt":"Ethanol boils at 78 °C. Move the O between the two carbons to make methoxymethane. Its boiling point will be…","options":[{"t":"far lower (about −24 °C)","_n":"ob2b","_k":"94639863"},{"t":"about the same","_n":"pb1b","_k":"73519768"},{"t":"higher","_n":"qb0b","_k":"c17c4f64"},{"t":"it won’t change state","_n":"rbfb","_k":"1949ffa9"}],"explain":"The H-bond lines vanish and the bar drops to −24 °C. No O–H, so no H-bonds between molecules."},{"id":"p2","prompt":"Ethanol mixes with water in the water box. Swap to butan-1-ol. What happens to mixing with water?","options":[{"t":"it only partly dissolves","_n":"sbeb","_k":"734a64e4"},{"t":"it doesn’t dissolve at all","_n":"tb1b","_k":"ee32b9e4"},{"t":"it reacts with water","_n":"ub2b","_k":"2a203e5a"},{"t":"it mixes even better","_n":"vb3b","_k":"673e63c4"}],"explain":"About 8 g dissolves in 100 mL of water; the rest forms a separate layer on top. The longer nonpolar chain can’t H-bond with water."},{"id":"p3","prompt":"Propan-2-ol meets [O] (a preview of the Oxidation part). Oxidizing propan-2-ol gives…","options":[{"t":"propanoic acid","_n":"wb4b","_k":"761ce68e"},{"t":"propanone (a ketone)","_n":"xadb","_k":"e84d1643"},{"t":"no reaction","_n":"yaeb","_k":"08fc6a8c"},{"t":"propanal","_n":"zafb","_k":"4fdf2154"}],"explain":"The C–OH carbon loses its H and the O–H loses its H; a C=O forms in the middle of the chain. Secondary alcohols oxidize to ketones."},{"id":"p4","prompt":"2-methylpropan-2-ol meets [O]. What happens?","options":[{"t":"an aldehyde forms","_n":"10b0b","_k":"036cf484"},{"t":"a ketone forms","_n":"11b9b","_k":"cb1ba410"},{"t":"no reaction","_n":"12bab","_k":"1fda9c80"},{"t":"a carboxylic acid forms","_n":"13abb","_k":"b3eb2f70"}],"explain":"The C–OH carbon has no H. Tertiary: no H on the C–OH carbon to remove."}],"chalIntro":"Use the switchboard to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Build a \u003cstrong>secondary\u003c/strong> alcohol with 4 carbons.","why":"Butan-2-ol, CH₃CH(OH)CH₂CH₃: the C–OH carbon (C2) is bonded to exactly two carbons.","hints":["The C–OH carbon needs exactly two carbon neighbours.","Put the OH on an inner carbon of a straight chain.","CH₃CH(OH)CH₂CH₃."]},{"id":"tc2","goal":[3,6],"prompt":"Properties mode. Build the C₄H₁₀O isomer with the \u003cstrong>lowest\u003c/strong> boiling point.","why":"2-methoxypropane, CH₃OCH(CH₃)₂, boils at 32 °C: an ether (no H-bonds), and branched, so it’s compact.","hints":["No H-bonds means an ether.","Branching lowers boiling point further.","CH₃OCH(CH₃)₂."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Build the 5-carbon alcohol that oxidizes to a \u003cstrong>ketone with a branched chain\u003c/strong>.","why":"3-methylbutan-2-ol, CH₃CH(OH)CH(CH₃)CH₃: secondary, so [O] gives a ketone (3-methylbutan-2-one), and the chain is branched.","hints":["A ketone needs a secondary alcohol.","You need a branch and a secondary C–OH in 5 carbons.","CH₃CH(OH)CH(CH₃)CH₃."]}],"blocks":[{"title":"What the switchboard shows","html":"\u003cp>The O–H is what makes alcohols stick to each other and to water. The class of an alcohol is a carbon count, and it decides what oxidation does.\u003c/p>"}]},"part3":{"slug":"oxidation","name":"Oxidation","heading":"Oxidizing alcohols","intro":"Three stations: the oxidation ladder, dehydration, and alcohols in everyday life. Oxidizing agents are shown only as [O]: no reagents, amounts or procedures.","s1":{"title":"Station 1: The oxidation ladder","intro":"Pick an alcohol, then press [O] once or twice. Primary alcohols climb two rungs, secondary alcohols one, tertiary alcohols none.","alcohols":["methanol","ethanol","propan-1-ol","propan-2-ol","butan-1-ol","butan-2-ol","2-methylpropan-1-ol","2-methylpropan-2-ol","pentan-3-ol","2-methylbutan-2-ol"],"zoom":"Count the H atoms on the C–OH carbon (ringed). The first [O] removes the O–H hydrogen and one C–H hydrogen; they leave as H₂O. The second [O] turns the aldehyde’s last C–H into C–OH. No H on that carbon, no oxidation."},"s2":{"title":"Station 2: Dehydration","intro":"Pick an alcohol, then apply an acid catalyst and heat. Water leaves: the OH from one carbon and an H from a neighbouring carbon. A C=C forms between them. This is an elimination.","alcohols":["ethanol","propan-1-ol","propan-2-ol","butan-1-ol","butan-2-ol","2-methylpropan-2-ol","pentan-2-ol","pentan-3-ol","2-methylbutan-2-ol"],"reverse":"\u003cstrong>Hydration runs the other way.\u003c/strong> In \u003ca href=\"02-alkenes-alkynes-aromatics.html#explore\">module 02\u003c/a>, water adds across a C=C (acid catalyst) to make an alcohol. Dehydration takes the water back out."},"s3":{"title":"Station 3: Alcohols and you","intro":"Oxidation of alcohols happens outside the lab too. Pick a case.","cases":[{"id":"breath","t":"Breath testers","alc":"ethanol","steps":1,"html":"A breath tester detects ethanol by \u003cstrong>oxidizing\u003c/strong> it. Ethanol is a primary alcohol, so the first product is the aldehyde ethanal. The device measures how much oxidation happens."},{"id":"wine","t":"Wine left open","alc":"ethanol","steps":2,"html":"Wine left open slowly turns to vinegar: air \u003cstrong>oxidizes\u003c/strong> the ethanol, through ethanal, to ethanoic acid (acetic acid), the sour acid in vinegar."},{"id":"meoh","t":"Methanol is toxic","alc":"methanol","steps":2,"html":"Methanol is toxic because the body \u003cstrong>oxidizes\u003c/strong> it to methanal and then methanoic acid, which damage the body. In Canada, many windshield washer fluids contain methanol, which is why they’re labelled poisonous."}]},"quickCheck":{"title":"Quick check","summary":"Oxidation quick check","items":[{"id":"q1","goal":4,"prompt":"Butan-1-ol + [O], twice","choices":[{"t":"butanoic acid","fb":"Right. Primary → aldehyde → acid.","_n":"14aab","_k":"110f1317"},{"t":"butanone","fb":"Primary → aldehyde → acid.","_n":"15adb","_k":"07e27d9c"},{"t":"butanal","fb":"Primary → aldehyde → acid.","_n":"16acb","_k":"17c71c50"},{"t":"no reaction","fb":"Primary → aldehyde → acid.","_n":"17afb","_k":"37d27610"}]},{"id":"q2","goal":[2,4],"prompt":"Which alcohol resists mild oxidation?","choices":[{"t":"pentan-1-ol","fb":"Tertiary.","_n":"18aeb","_k":"772c20ac"},{"t":"3-methylbutan-2-ol","fb":"Tertiary.","_n":"19b1b","_k":"6c580a90"},{"t":"pentan-2-ol","fb":"Tertiary.","_n":"1ab0b","_k":"608792ad"},{"t":"2-methylbutan-2-ol","fb":"Right. Tertiary: no H on the C–OH carbon.","_n":"1bb3b","_k":"6cc9934e"}]},{"id":"q3","goal":5,"prompt":"Dehydration of propan-1-ol gives…","choices":[{"t":"propanal","fb":"Elimination of water makes a C=C.","_n":"1cb2b","_k":"cb9f1f4d"},{"t":"propan-2-ol","fb":"Elimination of water makes a C=C.","_n":"1d45a","_k":"632531f6"},{"t":"propane","fb":"Elimination of water makes a C=C.","_n":"1e46a","_k":"513130a8"},{"t":"propene","fb":"Right. Elimination of water makes a C=C.","_n":"1f43a","_k":"781f4785"}]},{"id":"q4","goal":3,"prompt":"Is ethanol a base like NaOH?","choices":[{"t":"Yes: it has OH","fb":"Alcohols don’t release OH⁻.","_n":"1g44a","_k":"e71fe018"},{"t":"Only when hot","fb":"Alcohols don’t release OH⁻.","_n":"1h41a","_k":"40658b4e"},{"t":"No: its O–H is covalent","fb":"Right. The O–H in an alcohol is covalent. Alcohols don’t release OH⁻ ions like NaOH does.","_n":"1i42a","_k":"3e742cd3"},{"t":"Only in water","fb":"Alcohols don’t release OH⁻.","_n":"1j3fa","_k":"2034a292"}]}]}},"practice":{"activities":[{"id":"classify","type":"sorter","title":"Classify it","summary":"Classify it","goal":[2,6],"noun":"compound","txt":true,"instruction":"Ten compounds. Sort each one: primary, secondary or tertiary alcohol, or ether.","boxes":[{"id":"p","label":"Primary alcohol"},{"id":"s","label":"Secondary alcohol"},{"id":"t","label":"Tertiary alcohol"},{"id":"e","label":"Ether"}],"wrongDefault":"Count the carbons bonded to the carbon that holds the OH: 1 = primary, 2 = secondary, 3 = tertiary.","items":[{"id":"i1","goal":2,"t":"ethanol \u003cspan class=\"ao-tf\">CH₃CH₂OH\u003c/span>","_a":"GxFG","why":"C1 holds the OH and is bonded to one carbon: primary.","wrong":{"e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","C1 holds the OH; it’s bonded to one carbon (C2): primary."]},{"id":"i2","goal":2,"t":"propan-2-ol \u003cspan class=\"ao-tf\">CH₃CH(OH)CH₃\u003c/span>","_a":"GxJG","why":"C2 holds the OH and is bonded to C1 and C3: secondary.","wrong":{"p":"The OH is on C2, which has two carbon neighbours.","e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","C2 holds the OH; it’s bonded to C1 and C3: secondary."]},{"id":"i3","goal":2,"t":"2-methylpropan-2-ol \u003cspan class=\"ao-tf\">(CH₃)₃COH\u003c/span>","_a":"GxVG","why":"C2 holds the OH and is bonded to three carbons: tertiary.","wrong":{"e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","C2 holds the OH; it’s bonded to C1, C3 and the methyl carbon: tertiary."]},{"id":"i4","goal":6,"t":"methoxyethane \u003cspan class=\"ao-tf\">CH₃OCH₂CH₃\u003c/span>","_a":"GwRG","why":"The O sits between two carbons and has no H: an ether, so it has no class.","wrong":{"p":"No O–H: it’s an ether.","s":"No O–H: it’s an ether.","t":"No O–H: it’s an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","There’s no OH: the O sits between two carbons, so it’s an ether."]},{"id":"i5","goal":2,"t":"2-methylpropan-1-ol \u003cspan class=\"ao-tf\">(CH₃)₂CHCH₂OH\u003c/span>","_a":"GxFG","why":"C1 holds the OH and is bonded only to C2: primary, even though the chain is branched.","wrong":{"s":"The branch is on C2, but the OH’s carbon (C1) has only one carbon neighbour.","e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","C1 holds the OH; it’s bonded only to C2: primary. The branch doesn’t decide the class."]},{"id":"i6","goal":2,"t":"cyclohexanol \u003cspan class=\"ao-tf\">C₆H₁₁OH (a ring)\u003c/span>","_a":"GxJG","why":"The ring carbon holding the OH is bonded to two ring carbons: secondary.","wrong":{"p":"The ring carbon with the OH is bonded to two ring carbons.","e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","The ring carbon with the OH is bonded to two ring carbons: secondary."]},{"id":"i7","goal":2,"t":"2-methylbutan-2-ol \u003cspan class=\"ao-tf\">CH₃CH₂C(OH)(CH₃)CH₃\u003c/span>","_a":"GxVG","why":"C2 holds the OH and is bonded to C1, C3 and the methyl carbon: tertiary.","wrong":{"e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","C2 holds the OH; it’s bonded to C1, C3 and the methyl carbon: tertiary."]},{"id":"i8","goal":6,"t":"ethoxyethane \u003cspan class=\"ao-tf\">CH₃CH₂OCH₂CH₃\u003c/span>","_a":"GwRG","why":"The O sits between two carbons and has no H: an ether.","wrong":{"p":"No O–H: it’s an ether.","s":"No O–H: it’s an ether.","t":"No O–H: it’s an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","There’s no OH: the O sits between two ethyl groups, so it’s an ether."]},{"id":"i9","goal":2,"t":"pentan-3-ol \u003cspan class=\"ao-tf\">CH₃CH₂CH(OH)CH₂CH₃\u003c/span>","_a":"GxJG","why":"C3 holds the OH and is bonded to C2 and C4: secondary.","wrong":{"e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","C3 holds the OH; it’s bonded to C2 and C4: secondary."]},{"id":"i10","goal":2,"t":"methanol \u003cspan class=\"ao-tf\">CH₃OH\u003c/span>","_a":"GxFG","why":"Treated as primary: the C–OH carbon has no carbon neighbours but three H, and it oxidizes like a primary alcohol.","wrong":{"e":"It has an O–H, so it’s an alcohol, not an ether."},"hints":["Find the carbon holding the OH.","Count its carbon neighbours.","No carbon neighbours, but three H on the C–OH carbon: methanol is treated as primary."]}]},{"id":"predict","type":"custom","title":"Predict and name","summary":"Predict and name","star":true,"goal":[3,4,5,6],"instruction":"Six items. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Tap your answer (in item 2, tap every answer that fits), then press Check.","items":[{"id":"r1","kind":"chips","goal":4,"prompt":"Name the product: pentan-3-ol + [O]","options":[{"t":"pentanoic acid","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"1k40a","_k":"a3da5930"},{"t":"pentanal","why":"Secondary → ketone.","_n":"1l3da","_k":"56c3dbf2"},{"t":"pentan-3-one","why":"Secondary → ketone: the C=O forms where the OH was, on C3.","_n":"1m3ea","_k":"8fba5acd"},{"t":"no reaction","why":"Only tertiary alcohols resist mild oxidation, and pentan-3-ol is secondary.","_n":"1n3fa","_k":"9bc73f06"}]},{"id":"r2","kind":"all","goal":5,"prompt":"Name the alkene(s) from dehydrating 2-methylbutan-2-ol. Select \u003cstrong>all\u003c/strong> that form.","options":[{"t":"2-methylbut-1-ene","_n":"1o3ea","_k":"11e59f83"},{"t":"2-methylbut-2-ene","_n":"1p3da","_k":"3e00d609"},{"t":"3-methylbut-1-ene","why":"The C=C forms between C2 (which held the OH) and a neighbouring carbon, so C2 must be in the double bond.","_n":"1q3ca","_k":"0e6f2fdc"},{"t":"pent-2-ene","why":"Dehydration doesn’t change the carbon skeleton: the chain stays branched.","_n":"1r43a","_k":"d44b0e9e"}],"missing":"H can leave from either neighbouring carbon type.","why":"H can leave from either neighbouring carbon type: from a CH₃ (2-methylbut-1-ene) or from the CH₂ (2-methylbut-2-ene)."},{"id":"r3","kind":"chips","star":true,"goal":3,"prompt":"Order by solubility in water, least first: hexan-1-ol, ethanol, butan-1-ol","options":[{"t":"hexan-1-ol \u003c butan-1-ol \u003c ethanol","why":"Longer nonpolar chains dissolve less: ethanol mixes completely, butan-1-ol only partly, hexan-1-ol hardly at all.","_n":"1s42a","_k":"9ac0a571"},{"t":"all about the same","why":"Solubility falls quickly as the chain grows. One OH can’t carry a long nonpolar chain into water: solubility falls as the chain grows.","_n":"1t41a","_k":"24cedc6a"},{"t":"ethanol \u003c butan-1-ol \u003c hexan-1-ol","why":"One OH can’t carry a long nonpolar chain into water: solubility falls as the chain grows.","_n":"1u40a","_k":"e8eea102"},{"t":"butan-1-ol \u003c hexan-1-ol \u003c ethanol","why":"Hexanol’s longer chain makes it least soluble.","_n":"1v37a","_k":"d1abec2b"}]},{"id":"r4","kind":"chips","star":true,"goal":[3,6],"prompt":"Which isomer of C₃H₈O boils lowest?","options":[{"t":"propan-1-ol","why":"Any alcohol H-bonds; the ether can’t.","_n":"1w36a","_k":"5140d73b"},{"t":"propan-2-ol","why":"Any alcohol H-bonds; the ether can’t.","_n":"1x39a","_k":"bc763e27"},{"t":"methoxyethane","why":"The ether has no O–H, so its molecules can’t H-bond to each other: it boils lowest.","_n":"1y3aa","_k":"9874243d"}]},{"id":"r5","kind":"chips","star":true,"goal":[4,6],"prompt":"\u003cstrong>Investigation:\u003c/strong> Unknown X is C₄H₁₀O. It doesn’t react with [O], and it boils at 82 °C. Ether or alcohol, and which one?","useBp":["butan-1-ol","butan-2-ol","2-methylpropan-1-ol","2-methylpropan-2-ol","ethoxyethane","1-methoxypropane","2-methoxypropane"],"options":[{"t":"an ether: 2-methoxypropane","why":"Ethers don’t oxidize either, but no C₄ ether boils as high as 82 °C; the tertiary alcohol fits both clues.","_n":"1z3ba","_k":"d2c5febe"},{"t":"an ether: ethoxyethane","why":"Ethers don’t oxidize either, but no C₄ ether boils as high as 82 °C; the tertiary alcohol fits both clues.","_n":"203ca","_k":"bb982964"},{"t":"an alcohol: butan-2-ol","why":"Butan-2-ol is secondary: it would oxidize to butanone.","_n":"213da","_k":"118e9e7e"},{"t":"an alcohol: 2-methylpropan-2-ol","why":"Ethers don’t oxidize either, but no C₄ ether boils as high as 82 °C; the tertiary alcohol fits both clues.","_n":"223ea","_k":"a9a395df"}],"hints":["What doesn’t oxidize?","Tertiary alcohols and ethers.","The high boiling point needs H-bonding: 2-methylpropan-2-ol."]},{"id":"r6","kind":"chips","star":true,"goal":[4,5],"prompt":"An alcohol C₅H₁₂O gives a ketone on oxidation and only \u003cstrong>one\u003c/strong> alkene on dehydration. Which is it?","options":[{"t":"2-methylbutan-2-ol","why":"Tertiary: it doesn’t oxidize, so no ketone.","_n":"233fa","_k":"5d49dd62"},{"t":"3-methylbutan-2-ol","why":"Two alkenes.","_n":"2440a","_k":"dd69ccea"},{"t":"pentan-2-ol","why":"Two alkenes (pent-1-ene and pent-2-ene).","_n":"2531a","_k":"591ddabb"},{"t":"pentan-3-ol","why":"Secondary, so it gives a ketone (pentan-3-one). Both neighbouring carbons are CH₂ in identical ethyl groups, so only pent-2-ene forms.","_n":"2632a","_k":"2829e8d4"}],"hints":["Ketone → secondary alcohol.","For one alkene, both neighbouring carbons must be equivalent.","pentan-3-ol: both neighbours are CH₂ in identical ethyl groups."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Arash","how":"","instruction":"Arash made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Name CH₃CH₂CH₂CH(OH)CH₃.","steps":["The longest chain has 5 carbons: pentane.","An OH makes it an alcohol: suffix -ol.","Number from the left: the OH is on C4.","Name: pentan-4-ol."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Follows from step 3."],"fixes":[{"t":"pentan-4-ol is correct.","why":"Number from the end nearer the OH.","_n":"2733a","_k":"42e27dd7"},{"t":"Name it 2-hydroxypentane.","why":"OH is the main group here, so it’s the suffix -ol.","_n":"2832a","_k":"7ff37a79"},{"t":"Number from the right, nearer the OH: pentan-2-ol.","why":"Number from the end nearer the OH. From the right, the OH is on C2.","_n":"2935a","_k":"adb23320"},{"t":"Name it pentanal.","why":"-al is an aldehyde.","_n":"2a34a","_k":"2400815e"}],"hints":["Which end is nearer the OH?","The right.","pentan-2-ol."]},{"id":"e2","goal":2,"task":"Classify 2-methylpropan-1-ol.","steps":["Structure: (CH₃)₂CHCH₂OH.","The molecule has a branch at C2.","Branched alcohols are secondary.","So it’s a secondary alcohol."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Follows from step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Branching elsewhere doesn’t decide the class.","_n":"2b2fa","_k":"f9861040"},{"t":"It’s tertiary because of the branch.","why":"Count the carbons bonded to the carbon that holds the OH: 1 = primary, 2 = secondary, 3 = tertiary.","_n":"2c2ea","_k":"19a66982"},{"t":"It’s secondary because of the number 2 in the name.","why":"Count the carbons bonded to the carbon that holds the OH: 1 = primary, 2 = secondary, 3 = tertiary.","_n":"2d31a","_k":"09922fa6"},{"t":"Class depends on the C–OH carbon: C1 is bonded to one carbon, so it’s primary.","why":"Count the carbons bonded to the carbon that holds the OH: 1 = primary, 2 = secondary, 3 = tertiary.","_n":"2e30a","_k":"504bd091"}],"hints":["Which carbon holds the OH?","C1.","C1 has one carbon neighbour: primary."]},{"id":"e3","goal":4,"task":"Predict the product when 2-methylbutan-2-ol is treated with [O].","steps":["The OH is on C2, which is bonded to three carbons.","So it’s a tertiary alcohol.","Tertiary alcohols oxidize to ketones.","Product: 2-methylbutan-2-one."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Follows from step 3. (That name can’t exist anyway: C2 would need five bonds.)"],"fixes":[{"t":"The C–OH carbon has no H to lose, so there’s no reaction with mild oxidation.","why":"A tertiary C–OH carbon has no H to lose, so mild oxidation doesn’t touch it.","_n":"2f3ba","_k":"2201da34"},{"t":"It gives a carboxylic acid.","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"2g3aa","_k":"8e433c11"},{"t":"Step 3 is correct.","why":"A tertiary C–OH carbon has no H to lose, so mild oxidation doesn’t touch it.","_n":"2hada","_k":"e6e741e9"},{"t":"It gives an aldehyde.","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"2iaea","_k":"ef49e2c5"}],"hints":["What does oxidation remove from the C–OH carbon?","An H.","None there: no reaction."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: the ether’s boiling point, or how quickly solubility drops with chain length?"},{"id":"j2","q":"In your own words, explain why an alcohol’s class decides what oxidation does."},{"id":"j3","q":"Explain to a friend how to tell whether an alcohol is primary, secondary or tertiary."},{"id":"j4","q":"Which reaction (oxidation or dehydration) is still harder to predict? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Name CH₃CH(OH)CH₂CH₃.","options":[{"t":"butan-2-ol","why":"OH on C2, numbering from the nearer end.","_n":"2jaba","_k":"303e9ede"},{"t":"butan-3-ol","why":"Number from the end nearer the OH.","_n":"2kaca","_k":"850d0f95"},{"t":"butan-1-ol","why":"The OH isn’t on an end carbon.","_n":"2lb1a","_k":"08523a05"},{"t":"2-methylpropan-1-ol","why":"That’s a branched isomer, not this structure.","_n":"2mb2a","_k":"f91a1e67"}]},"b":{"prompt":"Name CH₃OCH₂CH₂CH₃.","options":[{"t":"2-methoxypropane","why":"The O is on C1 of propane.","_n":"2nafa","_k":"b2a83891"},{"t":"butan-1-ol","why":"Same formula, but this is an ether.","_n":"2ob0a","_k":"ed3f69bf"},{"t":"propoxymethane","why":"Name the longer chain as the parent.","_n":"2pb5a","_k":"e334dedd"},{"t":"1-methoxypropane","why":"Longer chain is propane; the smaller group becomes methoxy.","_n":"2qb6a","_k":"1e020154"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Classify 2-methylbutan-2-ol.","options":[{"t":"tertiary","why":"C2 is bonded to three carbons.","_n":"2rea6","_k":"646c7fdc"},{"t":"primary","why":"C2 isn’t an end carbon.","_n":"2seb6","_k":"2f7e5901"},{"t":"secondary","why":"The 2 is a locant, not the class.","_n":"2te86","_k":"b2a72c10"},{"t":"it’s an ether","why":"It has an O–H.","_n":"2ue96","_k":"099ee82c"}]},"b":{"prompt":"Classify 2-methylpropan-1-ol.","options":[{"t":"secondary","why":"The branch is elsewhere.","_n":"2ve66","_k":"bf7579f0"},{"t":"primary","why":"The C–OH carbon (C1) is bonded to one carbon.","_n":"2we76","_k":"33a7a0ef"},{"t":"it’s an ether","why":"It has an O–H.","_n":"2xe46","_k":"88beb9e8"},{"t":"tertiary","why":"Count the carbons bonded to the carbon that holds the OH: 1 = primary, 2 = secondary, 3 = tertiary.","_n":"2ye56","_k":"1e7b556c"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Oxidizing butan-2-ol gives…","options":[{"t":"no reaction","why":"Only tertiary alcohols resist.","_n":"2ze26","_k":"e7ec1578"},{"t":"butanone","why":"Secondary → ketone.","_n":"30e36","_k":"c02f4b8b"},{"t":"butanal","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"31d06","_k":"ce8b2df1"},{"t":"butanoic acid","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"32cf6","_k":"23f7a659"}]},"b":{"prompt":"Complete oxidation of propan-1-ol gives…","options":[{"t":"no reaction","why":"Primary alcohols oxidize.","_n":"33d26","_k":"3b6fb4e1"},{"t":"propanoic acid","why":"Primary → aldehyde → acid.","_n":"34d16","_k":"82b12962"},{"t":"propanone","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"35d46","_k":"40c67961"},{"t":"propanal","why":"That’s the first step; complete oxidation goes on to the acid.","_n":"36d36","_k":"241bc50d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Order by boiling point, lowest first: propane (44 g/mol), methoxyethane (60 g/mol), propan-1-ol (60 g/mol).","options":[{"t":"All about the same","why":"Forces differ a lot.","_n":"37d66","_k":"61985451"},{"t":"methoxyethane \u003c propane \u003c propan-1-ol","why":"The polar ether boils above propane.","_n":"38d56","_k":"1da6a67d"},{"t":"propane \u003c propan-1-ol \u003c methoxyethane","why":"An H-bond needs an H on O, N or F. Ethers have no O–H, so they can’t H-bond to each other.","_n":"39d86","_k":"6e7a9b31"},{"t":"propane \u003c methoxyethane \u003c propan-1-ol","why":"London only; plus dipole–dipole; plus H-bonds.","_n":"3ad76","_k":"3b8727cd"}]},"b":{"prompt":"Order by solubility in water, least first: ethanol, hexan-1-ol, butan-1-ol.","options":[{"t":"ethanol \u003c butan-1-ol \u003c hexan-1-ol","why":"One OH can’t carry a long nonpolar chain into water: solubility falls as the chain grows.","_n":"3b5e5","_k":"e9137501"},{"t":"butan-1-ol \u003c hexan-1-ol \u003c ethanol","why":"Hexanol’s longer chain makes it least soluble.","_n":"3c5f5","_k":"1962022b"},{"t":"All mix completely","why":"Only small alcohols do.","_n":"3d605","_k":"5a179b23"},{"t":"hexan-1-ol \u003c butan-1-ol \u003c ethanol","why":"Longer nonpolar chains dissolve less.","_n":"3e615","_k":"53a56d7c"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"An unknown alcohol, C₄H₁₀O, does \u003cstrong>not\u003c/strong> react with [O]. Which is it?","options":[{"t":"butan-1-ol","why":"Primary: it would oxidize.","_n":"3f625","_k":"f94be473"},{"t":"butan-2-ol","why":"Secondary: it would give butanone.","_n":"3g635","_k":"cc1ae98f"},{"t":"2-methylpropan-2-ol","why":"The only tertiary C₄ alcohol.","_n":"3h645","_k":"88d67480"},{"t":"2-methylpropan-1-ol","why":"Primary despite the branch.","_n":"3i655","_k":"04335f27"}]},"b":{"prompt":"An alcohol C₅H₁₂O oxidizes to a ketone. Which could it be?","options":[{"t":"2-methylbutan-2-ol","why":"Tertiary: no reaction.","_n":"3j565","_k":"2fb57dea"},{"t":"pentan-3-ol","why":"Secondary.","_n":"3k575","_k":"c429ed89"},{"t":"pentan-1-ol","why":"Primary: aldehyde.","_n":"3l646","_k":"8d929762"},{"t":"3-methylbutan-1-ol","why":"Primary.","_n":"3m636","_k":"75bf2908"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Dehydrating butan-2-ol (acid catalyst, heat) can give which alkene(s)?","options":[{"t":"but-1-ene and but-2-ene","why":"H can leave from C1 or C3.","_n":"3n626","_k":"d43d22f1"},{"t":"only butane","why":"Dehydration makes a C=C, not an alkane.","_n":"3o616","_k":"6694c028"},{"t":"butanone","why":"That’s oxidation.","_n":"3p686","_k":"bf23e4aa"},{"t":"but-1-yne","why":"Only one water leaves: a double bond, not a triple.","_n":"3q676","_k":"591ddde0"}]},"b":{"prompt":"Which alcohol gives only \u003cstrong>one\u003c/strong> alkene on dehydration?","options":[{"t":"propan-2-ol","why":"Losing H from C1 or C3 gives the same propene.","_n":"3r666","_k":"d2a6f391"},{"t":"pentan-2-ol","why":"Two alkenes.","_n":"3s656","_k":"ffc7f800"},{"t":"2-methylbutan-2-ol","why":"Two alkenes.","_n":"3t5c6","_k":"ac2ec58c"},{"t":"butan-2-ol","why":"Two alkenes.","_n":"3u5b6","_k":"9d538cb8"}]}},{"id":"c1","cat":"C","goal":[3,6],"a":{"prompt":"Which is the best explanation of why ethanol boils at 78 °C but methoxymethane at −24 °C, though both are C₂H₆O?","options":[{"t":"“Methoxymethane hydrogen-bonds more because its O is in the middle.”","why":"An H-bond needs an H on O, N or F. Ethers have no O–H, so they can’t H-bond to each other.","_n":"3v626","_k":"7e330c46"},{"t":"“Ethanol molecules hydrogen-bond to each other through O–H; methoxymethane has no O–H, so only dipole–dipole and London forces act between its molecules.”","why":"Same formula and mass: the O–H, and the hydrogen bonds it allows, make the difference.","_n":"3w636","_k":"dea86d75"},{"t":"“Ethanol has stronger covalent bonds.”","why":"Boiling doesn’t break covalent bonds.","_n":"3x606","_k":"2fc900ba"},{"t":"“Ethanol is heavier.”","why":"Same formula, same mass.","_n":"3y616","_k":"03b934a6"}]},"b":{"prompt":"Which is the best explanation of why hexan-1-ol is much less soluble in water than ethanol?","options":[{"t":"“Larger molecules always dissolve more.”","why":"One OH can’t carry a long nonpolar chain into water: solubility falls as the chain grows.","_n":"3z666","_k":"7c9cdce6"},{"t":"“Its long nonpolar chain can’t hydrogen-bond with water; one OH can’t make up for it.”","why":"One OH can’t carry a long nonpolar chain into water: solubility falls as the chain grows.","_n":"40676","_k":"c49ee5db"},{"t":"“Hexan-1-ol has no O–H.”","why":"It does have one.","_n":"41646","_k":"1f5f6166"},{"t":"“Hexan-1-ol reacts with water.”","why":"No reaction occurs.","_n":"42656","_k":"3b145ec8"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which statement correctly links an alcohol’s class to oxidation?","options":[{"t":"“A tertiary alcohol oxidizes to a ketone.”","why":"A tertiary C–OH carbon has no H to lose, so mild oxidation doesn’t touch it.","_n":"435a6","_k":"c008a484"},{"t":"“All alcohols oxidize to carboxylic acids.”","why":"Only primary ones can.","_n":"445b6","_k":"c7b38ce0"},{"t":"“A tertiary alcohol has no H on the C–OH carbon, so mild oxidation doesn’t change it.”","why":"A tertiary C–OH carbon has no H to lose, so mild oxidation doesn’t touch it.","_n":"45687","_k":"ab186b46"},{"t":"“Primary alcohols oxidize to ketones.”","why":"Primary → aldehyde (then acid); secondary → ketone.","_n":"46677","_k":"074df959"}]},"b":{"prompt":"Which equation correctly shows oxidation of propan-2-ol?","options":[{"t":"CH₃CH(OH)CH₃ → CH₃CH=CH₂ + H₂O","why":"That’s dehydration, not oxidation.","_n":"476a7","_k":"cffc5556"},{"t":"CH₃CH(OH)CH₃ + [O] → CH₃COCH₃ + H₂O","why":"Secondary → ketone: the C=O forms on the middle carbon, and the two H atoms leave as water.","_n":"48697","_k":"1acfdb46"},{"t":"CH₃CH(OH)CH₃ + [O] → CH₃CH₂CHO + H₂O","why":"The C=O stays on the middle carbon.","_n":"49647","_k":"7ab62321"},{"t":"CH₃CH(OH)CH₃ + NaOH → CH₃CH(ONa)CH₃ + H₂O","why":"Alcohols aren’t acids or bases like this in water. The O–H in an alcohol is covalent. Alcohols don’t release OH⁻ ions like NaOH does.","_n":"4a637","_k":"1c0d6802"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Breath testers detect ethanol by oxidizing it. Which product forms first?","options":[{"t":"propanone","why":"That would need a 3-carbon secondary alcohol.","_n":"4b667","_k":"7f65738c"},{"t":"ethanal","why":"Primary alcohol → aldehyde first.","_n":"4c657","_k":"9b429741"},{"t":"ethene","why":"That’s dehydration.","_n":"4d607","_k":"d46fd2dc"},{"t":"ethane","why":"That’s not oxidation.","_n":"4e5f7","_k":"d47cdf12"}]},"b":{"prompt":"An open bottle of wine slowly turns sour. Which change explains this?","options":[{"t":"Ethanol is oxidized to ethanoic acid (the acid in vinegar)","why":"Ethanol is a primary alcohol: aldehyde, then acid. Ethanoic acid is sour.","_n":"4fd66","_k":"9e791556"},{"t":"Ethanol is oxidized to propanone","why":"Ethanol has only 2 carbons.","_n":"4gd76","_k":"75364931"},{"t":"Ethanol becomes methanol","why":"Carbon chains don’t shrink like that.","_n":"4hd86","_k":"da074f89"},{"t":"Ethanol is dehydrated to ethene","why":"Ethene is a gas, not sour.","_n":"4id96","_k":"c61d98f9"}]}},{"id":"a2","cat":"A","goal":[1,6],"a":{"prompt":"Ethane-1,2-diol (car antifreeze) boils at 197 °C, far above ethanol (78 °C). Best reason?","options":[{"t":"It has more carbons","why":"Both have 2 carbons.","_n":"4jd26","_k":"ffa12b71"},{"t":"Its molar mass is three times larger","why":"62 vs 46 g/mol: not enough to explain the difference.","_n":"4kd36","_k":"e91f6859"},{"t":"Two O–H groups per molecule: many more hydrogen bonds","why":"Each O–H can hydrogen-bond, so the molecules hold each other much more tightly.","_n":"4ld46","_k":"03f7ee5e"},{"t":"It’s an ether","why":"It’s a diol: two OH groups.","_n":"4md56","_k":"275b5b31"}]},"b":{"prompt":"Propane-1,2,3-triol (glycerol) is thick, sweet and mixes with water. Which feature explains the mixing?","options":[{"t":"It’s an ether","why":"It has three OH groups.","_n":"4nde6","_k":"2778c396"},{"t":"Its long nonpolar chain","why":"Only 3 carbons.","_n":"4odf6","_k":"5b151edc"},{"t":"It reacts with water","why":"It dissolves without reacting.","_n":"4p5c6","_k":"7b06f2c9"},{"t":"Three O–H groups that hydrogen-bond with water","why":"Three O–H groups on only three carbons: plenty of hydrogen bonding with water.","_n":"4q5b6","_k":"da647c5a"}]}}]},"task":{"title":"Branched and oxidizable","summary":"Branched and oxidizable","statement":"\u003cp>Build an isomer of C₅H₁₂O that meets every condition. Can you find them all?\u003c/p>\u003col class=\"ao-conds\">\u003cli>Its formula is C₅H₁₂O.\u003c/li>\u003cli>Its molecules can hydrogen-bond to each other.\u003c/li>\u003cli>It can be oxidized by [O].\u003c/li>\u003cli>Its carbon skeleton is branched.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Tap an atom or a bond in the builder, then use the buttons under it: add a C or an O, remove an atom, put an O into a C–C bond, or change a bond to double. Hydrogen atoms fill in automatically, and the builder checks valence (C makes 4 bonds, O makes 2).\u003c/p>","checks":["C₅H₁₂O","H-bonds to itself","Oxidizable","Branched"],"tips":["Count atoms: C₅H₁₂O is saturated with one O.","An ether can’t H-bond to itself; put the O on the end of a bond as –OH.","Tertiary alcohols resist [O]: keep an H on the C–OH carbon.","Add a methyl branch somewhere on a 4-carbon chain."],"explainPrompt":"Explain how you made sure your molecule hydrogen-bonds and can still be oxidized.","vocab":"Use the words hydroxyl, primary, secondary, tertiary and branched.","more":"There’s more than one answer. Can you find them all?","allFound":"2-methylbutan-2-ol is branched and H-bonds, but it’s tertiary. The six ethers fail line 2."},"cards":[["Alcohol","–OH on a saturated carbon; suffix -ol (propan-2-ol)."],["Ether","R–O–R′; named as alkoxy + longer chain (methoxyethane)."],["Primary, secondary, tertiary","The C–OH carbon is bonded to 1, 2 or 3 other carbons."],["Functional-group isomers","Same formula, different functional group: ethanol and methoxymethane."],["Why alcohols boil high","O–H allows hydrogen bonding between molecules."],["Why ethers boil low","No O–H, so no H-bonds between ether molecules."],["Solubility trend","Small alcohols mix with water; longer chains dissolve less."],["Oxidizing a primary alcohol","→ aldehyde → carboxylic acid."],["Oxidizing a secondary alcohol","→ ketone."],["Tertiary alcohols","Resist mild oxidation: no H on the C–OH carbon."],["Dehydration","Alcohol → alkene + H₂O (acid catalyst, heat); an elimination."],["Diol","Two OH groups: ethane-1,2-diol (antifreeze)."]]}};</script>
