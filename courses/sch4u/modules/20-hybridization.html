.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}

.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}

.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}

.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}

.bins.three{grid-template-columns:minmax(0,1fr)}
}

.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}

.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}

}

*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 20: hero, Orbital mixer (Mix / Bond / Count / Build), 2D labeller, Part 3 stations, practice entry, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:2.2em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:36px;min-width:40px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.45}

/* hero */
.hy-hx{min-width:0}
.hy-hxc{display:block;width:100%;aspect-ratio:16/10;border-radius:8px;background:var(--sheet)}
.hy-hxrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.hy-hxctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Orbital mixer */
.hy-modes,.hy-molp{margin:0 0 12px}
.hy-c[hidden],.hy-molp[hidden],.hy-tw[hidden],.hy-legend[hidden]{display:none}
.hy-stage{max-width:640px}
.hy-stage.sm{max-width:520px}
canvas.hy-cv,canvas.hy-s3cv,canvas.hy-s2c{display:block;width:100%;aspect-ratio:4/3;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:grab;touch-action:none}
canvas.hy-cv:focus-visible,canvas.hy-s3cv:focus-visible,canvas.hy-s2c:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.hy-pre{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.hy-turn{flex:1 1 12rem}
.hy-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;font-size:.86rem;color:var(--ink-2)}
.hy-sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.hy-sw.ring{background:transparent;border:2.5px solid var(--hi)}
.hy-cap{min-height:1.5em;margin:10px 0 2px;font-size:1rem}
.hy-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:16px}
.hy-ctrl,.hy-right{min-width:0}
.hy-c > * + *{margin-top:12px}
.hy-ed{max-width:360px}
.hy-esvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.hy-eax{stroke:var(--ink-2);stroke-width:1.6}
.hy-eah{fill:var(--ink-2)}
.hy-elv{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 4}
.hy-elab{fill:var(--ink);font-size:15px;font-weight:700}
.hy-ebox{fill:var(--sheet);stroke:var(--ink);stroke-width:1.8}
.hy-ebox.hyb{stroke:var(--p-t);stroke-width:2.4}
.hy-eel{fill:var(--e-pair);font-size:20px;font-weight:700;text-anchor:middle}
.hy-edcap{margin:4px 0 0;font-size:.95rem}
.hy-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.hy-chips .chip[aria-pressed="true"],.hy-labb .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.hy-meters{display:grid;gap:8px}
.hy-meter{display:grid;grid-template-columns:8.5em minmax(60px,1fr) 7.5em;align-items:center;gap:8px;font-size:.92rem}
.hy-ml{font-weight:700;color:var(--ink-2)}
.hy-bar{display:block;height:14px;border:1.5px solid var(--ink-2);border-radius:999px;overflow:hidden;background:var(--paper)}

.hy-bar.en i{background:var(--en-dh)}
.hy-mv{font-variant-numeric:tabular-nums}
.hy-csel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:36px;font-size:.95rem}
.hy-labb{display:inline-flex;flex-wrap:wrap;gap:6px}
.hy-labb .chip{min-height:36px;min-width:44px}
.hy-labb kbd{font:400 .72rem var(--font-ui);color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:0 3px;margin-left:2px}
.hy-tally{margin:6px 0 0;font-size:.95rem}
.hy-bsel{font-size:.95rem}
.hy-warn{color:var(--ink);font-weight:700;background:var(--hi-soft);border-radius:4px;padding:0 4px}
.hy-badd{flex-wrap:wrap}
.hy-bcount{font-size:.98rem}

/* 2D structural drawings with tap targets */
.hy2-scroll{overflow-x:auto;max-width:100%;padding:2px 0}
.hy2-box{position:relative;margin:0 auto}
.hy2-svg{display:block;font-family:var(--font-ui)}
.hy2-svg line{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.hy2-svg line.hy2-selb{stroke:var(--hi);stroke-width:16;opacity:.85}
.hy2-svg .hy2-sela{fill:var(--hi);opacity:.85}
.hy2-svg .hy2-lp{fill:var(--e-pair)}
.hy2-at{font-size:19px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.hy2-bt{font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--sheet);stroke-width:4px}
.hy2-tag rect{fill:var(--sheet);stroke:var(--p-t);stroke-width:1.5}
.hy2-tag text{font-size:13px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.hy2-tag.ok rect{fill:var(--good-bg);stroke:var(--green)}
.hy2-tag.no rect{fill:var(--bad-bg);stroke:var(--red)}
.hy2-pk{position:absolute;transform:translate(-50%,-50%);width:36px;height:32px;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
.hy2-pk.bd{width:26px;height:26px}
.hy2-pk:hover{box-shadow:0 0 0 2px var(--pen) inset}
.hy2-pk:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.hy2-pk[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset}

/* Part 3 */
.hy-st h3{margin-top:0}
.hy-st:first-child{margin-top:0;padding-top:0;border-top:0}
.hy-s1{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.hy-s1m{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.hy-s1m h4{margin:0 0 4px;font-size:1rem}
.hy-done{color:var(--green)}
.hy-s1bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.hy-s1bar .btn{margin-left:auto}
.hy-s2p,.hy-s3c{margin:4px 0 10px}
.hy-s2sl{max-width:420px}
.hy-s2g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.hy-s2f{margin:0;min-width:0}
.hy-s2t{margin-top:6px;font-size:.95rem;min-height:3em}

/* practice and task */
.hy-sprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:8px 0}
.hy-sprow label{font-weight:700;font-size:.92rem}
.hy-sprow .numin{width:4.5em}
.hy-chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.hy-chiplist .chip{text-align:left}
.hy-conds{margin:8px 0 12px;padding-left:1.4em}
.hy-tin{display:grid;gap:10px;margin:0 0 12px}
.hy-h4{margin:0 0 6px;font-size:1rem}
.hy-tkcap{font-size:.95rem;min-height:1.5em}
.hy-tkempty{border:1.5px dashed var(--rule);border-radius:8px;padding:24px 12px;text-align:center}

@media (max-width:760px){
  .hy-grid{grid-template-columns:minmax(0,1fr)}
  .hy-s2g{grid-template-columns:minmax(0,1fr)}
  .hy-meter{grid-template-columns:7.2em minmax(40px,1fr) 6.8em;font-size:.88rem}

2p orbitals give four sp3 hybrid orbitals at 109.5 degrees. A double bond is one sigma plus one pi bond; a triple bond is one sigma plus two pi bonds.","headline":"Orbitals mix to match the shape","text":"To make four identical bonds, carbon \u003cstrong>hybridizes\u003c/strong>: its 2s and 2p orbitals blend into equivalent \u003cstrong>hybrid orbitals\u003c/strong> that point where VSEPR says the bonds go. Head-on overlap makes \u003cstrong>σ bonds\u003c/strong>; sideways overlap of leftover p orbitals makes \u003cstrong>π bonds\u003c/strong>, and π bonds lock double bonds in place.","fig":{"html":"\u003cdiv class=\"hy-hx\">\u003ccanvas class=\"hy-hxc\" id=\"hy-hxc\" role=\"img\" aria-label=\"A 2s sphere and three 2p dumbbells sit at different heights on a small energy diagram. They swirl together and level out into four equal teardrop lobes pointing to the corners of a tetrahedron. Four H atoms approach and overlap head-on, and each overlap glows as sigma. Then ethene: two side-by-side p lobes merge above and below the C–C axis, glowing as pi.\">\u003c/canvas>\u003cdiv class=\"hy-hxrow\">\u003cp class=\"hy-hxctr\" id=\"hy-hxctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"hy-hxreplay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can explain why carbon forms four equivalent bonds even though its ground state has two unpaired electrons.","I can assign sp, sp² or sp³ hybridization from the number of electron groups.","I can relate each hybridization to its geometry and bond angle.","I can tell σ bonds from π bonds and count both in a molecule.","I can explain why double bonds can’t rotate and how that leads to cis–trans isomers.","I can assign the hybridization of each C, N and O atom in an organic molecule."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Carbon’s configuration","goal":1,"prompt":"What is the ground-state configuration of carbon?","options":[{"t":"1s² 2p⁴","why":"2s fills before 2p.","_n":"085b","_k":"58fb4797"},{"t":"1s² 2s² 2p⁴","why":"That’s oxygen.","_n":"186b","_k":"8cf01e5d"},{"t":"1s² 2s¹ 2p³","why":"That’s the “promoted” state, not the ground state.","_n":"287b","_k":"0f53af77"},{"t":"1s² 2s² 2p²","why":"6 electrons.","_n":"388b","_k":"2a70540e"}],"hints":["Z = 6.","Fill 1s, 2s, then 2p.","1s² 2s² 2p²."]},{"id":"w2","skill":"Carbon’s configuration","goal":1,"prompt":"How many unpaired electrons does a ground-state carbon atom have?","options":[{"t":"0","why":"Hund’s rule spreads the two 2p electrons out.","_n":"489b","_k":"81c3c01f"},{"t":"2","why":"2p² puts one electron in each of two p orbitals (Hund’s rule).","_n":"58ab","_k":"25ae2855"},{"t":"4","why":"Four bonds, but only 2 unpaired in the ground state.","_n":"68bb","_k":"8909a87a"},{"t":"6","why":"That’s the total number of electrons.","_n":"77cb","_k":"73329c07"}],"hints":["Look at 2p².","Hund’s rule.","2."]},{"id":"w3","skill":"Orbital shapes","goal":4,"prompt":"What is the shape of a p orbital?","options":[{"t":"A sphere","why":"That’s an s orbital.","_n":"87db","_k":"79b10793"},{"t":"A ring","why":"Orbitals are 3D regions, not rings.","_n":"9d61","_k":"57e3a450"},{"t":"Four lobes","why":"That’s most d orbitals.","_n":"ad51","_k":"cb3f4b0b"},{"t":"Two lobes on opposite sides of the nucleus (a dumbbell)","why":"A p orbital is a dumbbell: one lobe on each side of the nucleus.","_n":"bd41","_k":"2cb04ff2"}],"hints":["Recall module 15.","Two lobes.","A dumbbell."]},{"id":"w4","skill":"Orbital shapes","goal":3,"prompt":"How are the three 2p orbitals arranged?","options":[{"t":"At 90° to each other, along the x, y and z axes","why":"One p orbital lies along each axis, so they meet at 90°.","_n":"cd31","_k":"6389420c"},{"t":"At 120°, in a plane","why":"That’s sp² hybrids.","_n":"dda1","_k":"a0a82126"},{"t":"All along one axis","why":"There’s one along each axis.","_n":"ed91","_k":"2714ed03"},{"t":"At 109.5°","why":"That’s sp³ hybrids.","_n":"fd81","_k":"1ee0b90d"}],"hints":["p\u003 O in water?","options":[{"t":"sp²","_n":"w431","_k":"56981a8b"},{"t":"sp³","_n":"x461","_k":"1652d322"},{"t":"sp","_n":"y451","_k":"f2379b93"},{"t":"Unhybridized","_n":"z481","_k":"7ad70a89"}],"explain":"Four electron groups, lone pairs included."},{"id":"p4","prompt":"Ethene in Bond mode, with the twist slider. What happens if one CH₂ end is twisted by 90°?","options":[{"t":"The σ bond breaks","_n":"10471","_k":"f2fe7a03"},{"t":"Nothing changes","_n":"114a1","_k":"77ea83b4"},{"t":"The π overlap is lost","_n":"12491","_k":"6bfabdbc"},{"t":"The molecule becomes linear","_n":"13481","_k":"1be3f847"}],"explain":"The p orbitals end up at right angles and can’t overlap sideways."}],"chalIntro":"Use the Orbital mixer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenges 1 and 2 use \u003cstrong>Count\u003c/strong> mode; Challenge 3 uses \u003cstrong>Build\u003c/strong> mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,6],"prompt":"Label the hybridization of every atom except H in HCN.","why":"C has two groups (C–H and C≡N) and N has two (C≡N and a lone pair), so both are sp.","wrongN":"N has one triple bond and one lone pair: 2 groups.","wrongC":"C has two groups: C–H and C≡N.","hints":["Draw H–C≡N with a lone pair on N.","Count groups on each atom.","Both have 2 groups: sp."]},{"id":"tc2","goal":4,"prompt":"Count the σ and π bonds in propyne (CH≡C–CH₃).","why":"4 C–H, the C–C single bond and the σ of C≡C make 6 σ; the triple bond adds 2 π.","wrong8":"Each multiple bond has only one σ.","wrong3":"A triple bond has 2 π, and C–C single bonds have none.","hints":["Count the C–H bonds: 1 + 3.","The C–C single bond and the σ in C≡C: 2 more.","6 σ; the triple bond adds 2 π."]},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"Build mode (parts bin of C, H, O and N with single, double and triple bonds): make a molecule with the \u003cstrong>fewest possible carbon atoms\u003c/strong> that contains at least one sp carbon, one sp² carbon and one sp³ carbon.","why":"Three carbons is the fewest: one needs only single bonds (sp³), one a double bond (sp²), and one a triple bond or two double bonds (sp), as in CH₃–CH=C=O or CH₃–C(=O)–C≡N.","wrongPropyne":"Two sp carbons and one sp³, but no sp². A carbon in a triple bond’s partner is sp too.","wrongAcrylo":"sp², sp² and sp, but no sp³.","wrongTwo":"Two carbons can’t be all three types.","hints":["An sp carbon needs a triple bond or two double bonds.","If the sp carbon has a triple bond to another carbon, that carbon is sp too, so give it a double bond to O instead, or a triple bond to N.","CH₃–CH=C=O: sp³, then sp², then sp (two double bonds)."]}],"blocks":[{"title":"The big idea","html":"\u003cp>The hybridization is just VSEPR in orbital language: count the electron groups (2 → sp, 3 → sp², 4 → sp³) and the hybrids point where the groups go. The leftover p orbitals are where the π bonds come from.\u003c/p>"}]},"part3":{"slug":"organic","name":"Organic molecules","heading":"Hybridization in organic molecules","intro":"Unit 1’s structures look different through σ and π bonds. Label atoms on line structures, test which bonds can rotate, and see why benzene is flat.","s1":{"title":"Station 1: Label every atom","intro":"Tap each C, N and O, then choose sp, sp² or sp³. Press \u003cstrong>Check\u003c/strong> when every atom in a molecule has a label.","mols":[{"id":"ethanol","name":"Ethanol","smi":"CCO","_a":"bRYQRwtASRBFRFAVFEAWQgUWPg=="},{"id":"acid","name":"Ethanoic acid","smi":"CC(=O)O","_a":"bRYQRwtASRBFRFEVFEAWQgQWTxVLElYQaw=="},{"id":"propanone","name":"Propanone","smi":"CC(=O)C","_a":"bRYQRwtASRBFRFEVFEAWQgQWTxVLElYQaw=="},{"id":"nitrile","name":"Ethanenitrile (CH₃CN)","smi":"CC#N","_a":"bRYQRwtASRBFREEbGhEVEGs="}],"data":"Real bond angles match the hybridization:"},"s2":{"title":"Station 2: Rigid or free?","intro":"Pick a pair, then twist the middle bond of both models with one slider.","pairs":[{"id":"but","t":"Butane vs but-2-ene"},{"id":"eth","t":"Ethane vs ethene"}],"text":"Rotation is free about C–C but locked about C=C, so but-2-ene has cis and trans forms (module 11)."},"s3":{"title":"Station 3: Flat benzene","text":"All six carbons are sp², so every atom lies in one plane. The six leftover p orbitals overlap all around the ring, making a continuous π cloud above and below it (delocalized). That explains benzene’s equal C–C bonds and why it resists addition (module 02)."},"quickCheck":{"title":"Quick check","summary":"Organic molecules quick check","items":[{"id":"q1","goal":6,"prompt":"Hybridization of the carbonyl C in propanone?","choices":[{"t":"sp³d","fb":"Three groups: two C–C and one C=O.","_n":"14491","_k":"f0f77605"},{"t":"sp²","fb":"Right. Three groups: two C–C and one C=O.","_n":"154a1","_k":"b5ee8583"},{"t":"sp","fb":"Three groups: two C–C and one C=O.","_n":"164b1","_k":"5cb444e0"},{"t":"sp³","fb":"Three groups: two C–C and one C=O.","_n":"17441","_k":"86c575af"}]},{"id":"q2","goal":2,"prompt":"Hybridization of the O in the O–H of ethanoic acid?","choices":[{"t":"Unhybridized","fb":"Two bonds and two lone pairs.","_n":"18451","_k":"6294e915"},{"t":"sp³","fb":"Right. Two bonds and two lone pairs: 4 groups.","_n":"19461","_k":"c697aa58"},{"t":"sp²","fb":"Two bonds and two lone pairs.","_n":"1a471","_k":"f946a7f6"},{"t":"sp","fb":"Two bonds and two lone pairs.","_n":"1b501","_k":"8e44cdb5"}]},{"id":"q3","goal":5,"prompt":"Why does but-2-ene have cis and trans forms but butane doesn’t?","choices":[{"t":"The π bond stops rotation about C=C","fb":"Right. Twisting a C=C breaks the π overlap. That costs a lot of energy, so the bond stays rigid.","_n":"1c511","_k":"a1e617c6"},{"t":"But-2-ene is sp³","fb":"Twisting a C=C breaks the π overlap. That costs a lot of energy, so the bond stays rigid.","_n":"1d4e2","_k":"ea5f06e0"},{"t":"σ bonds can’t rotate","fb":"Twisting a C=C breaks the π overlap. That costs a lot of energy, so the bond stays rigid.","_n":"1e4d2","_k":"e33ed4c0"},{"t": eans one π.","_n":"2y7b2","_k":"a6a4f6c2"},{"t":"9 σ and 1 π","why":"6 C–H, 2 C–C, and the σ of C=O; 1 π.","_n":"2z7e2","_k":"20af0c4d"},{"t":"8 σ and 1 π","why":"There are six C–H bonds.","_n":"307d2","_k":"3dd558b6"},{"t":"10 σ and 0 π","why":"A double bond is one σ bond plus one π bond. They overlap differently.","_n":"31101","_k":"0186ca08"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Why does but-2-ene have cis and trans isomers while butane does not?","options":[{"t":"σ bonds can’t rotate","why":"σ bonds rotate freely; π bonds lock.","_n":"32111","_k":"dc5fb7d6"},{"t":"The π bond in C=C stops rotation, so groups keep their sides; butane’s single bonds rotate freely","why":"Twisting a C=C breaks the π overlap. That costs a lot of energy, so the bond stays rigid.","_n":"330e1","_k":"9e8446ef"},{"t":"Butane has no hydrogen atoms","why":"Butane has 10.","_n":"340f1","_k":"bae68320"},{"t":"But-2-ene’s carbons are sp³","why":"The C=C carbons are sp².","_n":"350c1","_k":"6b01442c"}]},"b":{"prompt":"Why can’t the two CH₂ groups of ethene twist relative to each other?","options":[{"t":"Twisting would destroy the sideways p–p overlap of the π bond","why":"Twisting a C=C breaks the π overlap. That costs a lot of energy, so the bond stays rigid.","_n":"360d1","_k":"87f9ee83"},{"t":"The σ bond is too short","why":"The σ bond alone would allow rotation.","_n":"370a1","_k":"d6a8ae1c"},{"t":"Ethene’s carbons are sp³","why":"They’re sp².","_n":"380b1","_k":"403e2948"},{"t":"The hydrogen atoms collide","why":"They are far apart.","_n":"39081","_k":"70c21e2b"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of methane’s four identical C–H bonds?","options":[{"t":"“Carbon’s three 2p orbitals form three bonds, and the 2s forms a weaker fourth.”","why":"The evidence shows four identical bonds.","_n":"3a091","_k":"2930e516"},{"t":"“Carbon’s 2s and three 2p orbitals mix into four equivalent sp³ orbitals; each overlaps with an H 1s orbital to form a σ
