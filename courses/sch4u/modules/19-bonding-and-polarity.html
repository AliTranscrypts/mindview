24\u003c/span> \u003cspan class=\"nw\">(O–H: polar)\u003c/span> → \u003cspan class=\"nw\">bent H\u003csub>2\u003c/sub>O\u003c/span> → \u003cspan class=\"nw\">net dipole\u003c/span> → \u003cspan class=\"nw\">polar molecule\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"Delta E N equals 3.44 minus 2.20 equals 1.24, so the O–H bond is polar; water is bent, so it has a net dipole and is a polar molecule","headline":"Polar bonds, but is the molecule polar?","text":"When two atoms share electrons unequally, the bond is \u003cstrong>polar\u003c/strong>: the more \u003cstrong>electronegative\u003c/strong> atom carries δ−. Whether a whole molecule is polar depends on its \u003cstrong>shape\u003c/strong>. Symmetric molecules cancel their \u003cstrong>bond dipoles\u003c/strong>; lopsided ones keep a \u003cstrong>net dipole\u003c/strong>.","fig":{"html":"\u003cdiv class=\"bp-hx\">\u003csvg class=\"bp-hx-svg\" id=\"bp-hx-svg\" viewBox=\"0 0 440 340\" role=\"img\" aria-label=\"A CO₂ molecule appears with two dipole arrows pointing outward toward the O atoms. The arrows slide tip to tail and cancel to a dot labelled net dipole 0. An H₂O molecule appears with its two O–H dipoles pointing up toward O; added tip to tail, they make one longer arrow labelled net dipole. A charged rod comes near two streams: water bends toward it, oil falls straight.\">\u003c/svg>\u003cdiv class=\"bp-hx-row\">\u003cp class=\"bp-hx-cap\" id=\"bp-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"bp-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can calculate ΔEN from the course table and classify a bond as nonpolar covalent, polar covalent or mostly ionic.","I can label partial charges and draw the bond dipole for a polar bond.","I can decide whether a molecule is polar by combining its shape with its bond dipoles.","I can use polarity to predict solubility (“like dissolves like”) and the behaviour of liquid streams.","I can explain the limits of the ΔEN model using evidence."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Electronegativity","goal":1,"prompt":"Using the course table, what is the electronegativity of chlorine?","use":"Course table (Pauling): H 2.20 · B 2.04 · C 2.55 · N 3.04 · O 3.44 · F 3.98 · P 2.19 · S 2.58 · Cl 3.16 · Br 2.96 · I 2.66","options":[{"t":"2.96","why":"That’s bromine.","_n":"0c39","_k":"1428be34"},{"t":"3.16","why":"Chlorine is 3.16 in the course table.","_n":"1c29","_k":"fb6a786f"},{"t":"3.44","why":"That’s oxygen.","_n":"2c19","_k":"5d6fc418"},{"t":"17","why":"17 is chlorine’s atomic number.","_n":"3c09","_k":"eee184c8"}],"hints":["Find Cl in the course table.","It’s just below F.","3.16."]},{"id":"w2","skill":"Electronegativity","goal":2,"prompt":"Which atom attracts shared electrons more strongly in an N–H bond?","use":"Course table (Pauling): N 3.04 · H 2.20","options":[{"t":"Neither","why":"One always pulls harder unless the atoms are identical.","_n":"4bf9","_k":"a2bf16aa"},{"t":"Both equally","why":"The values differ by 0.84.","_n":"5be9","_k":"a98d7088"},{"t":"N","why":"3.04 > 2.20.","_n":"6bd9","_k":"b06f181d"},{"t":"H","why":"Hydrogen’s value is lower.","_n":"7bc9","_k":"3a683fc4"}],"hints":["Compare the values.","N 3.04, H 2.20.","N."]},{"id":"w3","skill":"VSEPR shapes","goal":3,"prompt":"What is the shape of CCl\u003csub>4\u003c/sub>?","options":[{"t":"Trigonal pyramidal","why":"That needs a lone pair.","_n":"8bb9","_k":"81749ee2"},{"t":"Tetrahedral","why":"AX\u003csub>4\u003c/sub>.","_n":"9cc5","_k":"2c787682"},{"t":"Square planar","why":"Carbon has no lone pairs; four groups make a tetrahedron.","_n":"acd5","_k":"23161612"},{"t":"Bent","why":"Four atoms surround C.","_n":"bca5","_k":"65c8d79c"}],"hints":["Lone pairs on C?","None: AX\u003csub>4\u003c/sub>.","Tetrahedral."]},{"id":"w4","skill":"VSEPR shapes","goal":3,"prompt":"What is the shape of BF\u003csub>3\u003c/sub>?","options":[{"t":"Trigonal pyramidal","why":"Boron has no lone pair.","_n":"ccb5","_k":"616727d2"},{"t":"Tetrahedral","why":"Only three groups.","_n":"dd05","_k":"1ec3c446"},{"t":"Trigonal planar","why":"AX\u003csub>3\u003c/sub>.","_n":"ed15","_k":"ce658141"},{"t":"T-shaped","why":"That’s AX\u003csub>3\u003c/sub>E\u003csub>2\u003c/sub>.","_n":"fce5","_k":"a9ba8994"}],"hints":["B has 6 electrons around it.","Three groups, no lone pairs.","Trigonal planar."]},{"id":"w5","skill":"Adding arrows","goal":3,"prompt":"Two equal arrows point in exactly opposite directions. What is their sum?","options":[{"t":"It depends on their length only","why":"Direction matters.","_n":"gcf5","_k":"fb3de06a"},{"t":"Zero","why":"They cancel.","_n":"hc45","_k":"98183cec"},{"t":"Twice one arrow","why":"That’s when they point the same way.","_n":"ic55","_k":"43419437"},{"t":"One arrow","why":"They cancel completely.","_n":"jc65","_k":"07fbb773"}],"hints":["Place them tip to tail.","You end up back at the start.","Zero."]},{"id":"w6","skill":"Adding arrows","goal":3,"prompt":"Two equal arrows point up and to the left and up and to the right, at the same angle. Which way does their sum point?","options":[{"t":"Straight up","why":"The sideways parts cancel; the upward parts add.","_n":"kc55","_k":"eb509ba2"},{"t":"To the left","why":"The left and right parts cancel.","_n":"lc45","_k":"f780274b"},{"t":"Straight down","why":"Both arrows have upward parts.","_n":"mc35","_k":"9dc4a539"},{"t":"Zero","why":"Only the sideways parts cancel.","_n":"nc25","_k":"ab77ea2b"}],"hints":["Split each arrow into sideways and up parts.","The sideways parts are opposite.","Straight up."]}],"refreshers":{"Electronegativity":"How strongly an atom pulls bonding electrons (course table). F is highest. Values rise across a period and fall down a group.","VSEPR shapes":"Count electron groups and lone pairs; name the shape from the atoms (module 18).","Adding arrows":"Arrows add tip to tail. Equal and opposite arrows cancel; symmetric arrangements cancel."}}},"explore":{"heading":"Polarity m&#101;ter","intro":"Measure bonds, then build whole molecules and add their dipoles. Swap atoms and watch the polarity change.","how":"Choose a mode. \u003cstrong>Bond m&#101;ter:\u003c/strong> tap two atoms in the electronegativity table. \u003cstrong>Molecule dipoles:\u003c/strong> pick a molecule. \u003cstrong>Swap an atom:\u003c/strong> tap any outer atom on the model to cycle it H → F → Cl. Drag the model or use the arrow keys to turn it. \u003cstrong>Add the dipoles\u003c/strong> slides the bond dipoles tip to tail.","modes":[{"id":"bond","t":"Bond m&#101;ter"},{"id":"mol","t":"Molecule dipoles"},{"id":"swap","t":"Swap an atom"}],"mols":["co2","h2o","nh3","ch4","ccl4","chcl3","ch2cl2","ch3cl","bf3","so3","pcl5","sf4","xef4","clf3","sf6","ch2o","ch3oh","hcn"],"frames":[{"id":"tet","t":"Tetrahedral CX\u003csub>4\u003c/sub>"},{"id":"sq","t":"Square planar XeX\u003csub>4\u003c/sub>"}],"rows":["ΔEN (each bond)","Bond type (course model)","δ− on","Shape","Bond dipoles","Net dipole","Molecule"],"xeNote":"Xe 2.60 \u003cspan class=\"tiny muted\">(course table addition)\u003c/span>","predIntro":"Each prediction sets up the polarity m&#101;ter. Choose an answer, then watch what happens.","predictions":[{"id":"p1","prompt":"Each C=O bond is polar (ΔEN 0.89). Is CO\u003csub>2\u003c/sub> polar?","options":[{"t":"No: its dipoles cancel","_n":"oc15","_k":"dcbfad9a"},{"t":"No: its bonds are nonpolar","_n":"pc05","_k":"34ae5413"},{"t":"Yes: it has polar bonds","_n":"qbf5","_k":"b2d1a313"},{"t":"Yes: oxygen is more electronegative","_n":"rce5","_k":"e4eefbf8"}],"explain":"Linear and symmetric, so the dipoles are equal and opposite. Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions."},{"id":"p2","prompt":"Swap one Cl for H, making CHCl\u003csub>3\u003c/sub>. Polar or nonpolar?","options":[{"t":"Polar","_n":"scd5","_k":"e3e7eadb"},{"t":"It’s ionic now","_n":"tc05","_k":"94153787"},{"t":"It depends which Cl is swapped","_n":"uc15","_k":"934b531f"},{"t":"Nonpolar","_n":"vc25","_k":"9b80f293"}],"explain":"C–H (0.35) and C–Cl (0.61) dipoles differ, so the tetrahedron is no longer balanced. In a tetrahedron, every position is equivalent. Draw the 3D shape first; symmetry decides whether the dipoles cancel."},{"id":"p3","prompt":"ΔEN = 3.16 − 0.93 = 2.23. Which bond type does the course model give?","options":[{"t":"Mostly ionic","_n":"wc35","_k":"835df570"},{"t":"Polar covalent","_n":"xbc5","_k":"90c111fb"},{"t":"Metallic","_n":"ybd5","_k":"2368916d"},{"t":"Nonpolar covalent","_n":"zbe5","_k":"40738aaf"}],"explain":"Sodium chloride is an ionic lattice of Na\u003csup>+\u003c/sup> and Cl\u003csup>−\u003c/sup>."},{"id":"p4","prompt":"Both have three polar bonds. Which is polar?","options":[{"t":"Both","_n":"10bf5","_k":"34bcb033"},{"t":"Neither","_n":"11c85","_k":"56aa2e3b"},{"t":"BF\u003csub>3\u003c/sub>","_n":"12c95","_k":"8efb0379"},{"t":"NH\u003csub>3\u003c/sub>","_n":"133a4","_k":"e1dfeb54"}],"explain":"NH\u003csub>3\u003c/sub>’s lone pair makes it a pyramid. The lone pair makes NH\u003csub>3\u003c/sub> a pyramid, so the bond dipoles don’t cancel."}],"predSetup":{"p1":"CO\u003csub>2\u003c/sub> in Molecule dipoles mode.","p2":"Swap an atom mode, starting from CCl\u003csub>4\u003c/sub>.","p3":"Bond m&#101;ter: Na with Cl.","p4":"BF\u003csub>3\u003c/sub> and NH\u003csub>3\u003c/sub> side by side."},"chalIntro":"Use the polarity m&#101;ter to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Bond m&#101;ter: make a bond with ΔEN between 0.5 and 1.0.","why":"Between 0.5 and 1.0 the course model calls the bond polar covalent, at the low end of the range.","hints":["Pick atoms with nearby values.","Try carbon with a halogen.","C–Cl: 3.16 − 2.55 = 0.61."]},{"id":"tc2","goal":3,"prompt":"Swap mode (tetrahedral CX\u003csub>4\u003c/sub>, with H or Cl at each position): mark every combination as polar or nonpolar.","why":"Only CH\u003csub>4\u003c/sub> and CCl\u003csub>4\u003c/sub> have four identical outer atoms, so only their dipoles cancel. CH\u003csub>3\u003c/sub>Cl, CH\u003csub>2\u003c/sub>Cl\u003csub>2\u003c/sub> and CHCl\u003csub>3\u003c/sub> are polar.","hints":["When are all four positions identical?","Only CH\u003csub>4\u003c/sub> and CCl\u003csub>4\u003c/sub>.","Any mixture in a tetrahedron is polar."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Square planar frame AX\u003csub>2\u003c/sub>Y\u003csub>2\u003c/sub> (two F and two Cl): arrange them to make one polar version and one nonpolar version.","why":"Opposite (trans) dipoles cancel; side by side (cis), they don’t. Module 11 calls these cis and trans isomers.","hints":["Which positions in a square point in opposite directions?","Put the two F atoms opposite each other.","Opposite (trans) cancels; side by side (cis) doesn’t. Module 11 calls these cis and trans isomers."]}],"msgs":{"tc1":{"low":"Nonpolar by the course model.","high":"Too far apart for this range.","none":"Pick two atoms in the Bond m&#101;ter first."},"tc2":{"ch2cl2":"In a tetrahedron, two Cl and two H can’t cancel. It’s polar however you arrange them.","ccl4":"Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","unmarked":"Mark all five combinations in the table beside the model.","other":"Not every mark is right yet. Build each combination and read its net dipole."},"tc3":{"none":"In a square plane, opposite positions cancel.","needPolar":"That’s the nonpolar version. Now make a polar one.","start":"Use the square planar frame with two F and two Cl."},"marks":"Mark each combination","markHow":"Build each one with the model, then mark it.","found":"Versions you’ve made (two F, two Cl)","cis":"Polar version (F atoms side by side)","trans":"Nonpolar version (F atoms opposite)"},"blocks":[{"title":"The big idea","html":"\u003cp>The same polar bonds can make a polar or a nonpolar molecule. Shape decides.\u003c/p>"}]},"part3":{"slug":"polarity-tests","name":"Polarity tests","heading":"Does it bend? Does it dissolve?","intro":"A virtual inquiry bench. Test three liquids with a charged rod, then test which solids dissolve in water and in hexane. Record what you see, then zoom in to the particles to explain it.","s1":{"title":"Station 1: The charged rod","intro":"Three burettes release thin streams of water, ethanol and hexane. Hold the charged plastic rod next to each stream, at the same distance each time, and watch.","rodLabel":"Hold the rod next to","away":"No stream (rod away)","liquids":[{"id":"water","t":"Water","pol":"polar","obs":"Bends strongly toward the rod"},{"id":"ethanol","t":"Ethanol","pol":"polar","obs":"Bends, but less than water"},{"id":"hexane","t":"Hexane","pol":"nonpolar","obs":"Doesn’t bend: falls straight"}],"table":{"head":["Liquid","Molecules","What the stream does"],"wait":"Not tested yet"},"zoom":"Zoom to the particles","zoomText":{"polar":"The rod is negatively charged. Each polar molecule turns so its δ+ end (the H atoms) faces the rod, and the whole stream is pulled toward it.","hexane":"Hexane molecules are nonpolar: they have no δ+ or δ− ends, so nothing turns and nothing pulls. The stream falls straight.","away":"With the rod away, the molecules point every which way and the stream falls straight."},"inv":{"prompt":"\u003cstrong>Investigation:\u003c/strong> Which variables must stay the same for a fair comparison? Choose all that apply.","chips":[{"id":"charge","t":"Rod charge","need":true},{"id":"dist","t":"Distance from the rod","need":true},{"id":"width","t":"Stream width","need":true},{"id":"colour","t":"Liquid colour"}],"right":"Right. The rod’s charge, its distance from the stream and the stream’s width all change how far a stream bends, so they stay the same. Only the liquid changes. Its colour doesn’t affect bending, so it doesn’t need controlling.","colour":"A liquid’s colour doesn’t affect how far it bends, so it doesn’t need to be controlled.","missing":"Something else could also change how far a stream bends. Think about the rod and the stream itself."}},"s2":{"title":"Station 2: Like dissolves like","intro":"Tap a test tube to add the solid and shake it. Test each solid in water (polar) and in hexane (nonpolar).","solvents":[{"id":"water","t":"Water (polar)"},{"id":"hexane","t":"Hexane (nonpolar)"}],"solutes":[{"id":"i2","t":"Iodine (I\u003csub>2\u003c/sub>)"},{"id":"nacl","t":"Sodium chloride (NaCl)"},{"id":"sugar","t":"Sugar"}],"res":{"i2|water":{"d":"barely","t":"Barely dissolves: a pale brown tint, and most of the solid stays."},"i2|hexane":{"d":"yes","t":"Dissolves: a violet solution."},"nacl|water":{"d":"yes","t":"Dissolves: a clear, colourless solution."},"nacl|hexane":{"d":"no","t":"Doesn’t dissolve: the crystals stay at the bottom."},"sugar|water":{"d":"yes","t":"Dissolves: a clear, colourless solution."},"sugar|hexane":{"d":"no","t":"Doesn’t dissolve: the crystals stay at the bottom."}},"table":{"title":"Check it with data","head":["Substance","Water","Hexane"],"cells":{"i2|water":"Barely dissolves","i2|hexane":"Dissolves (violet solution)","nacl|water":"Dissolves","nacl|hexane":"Doesn’t","sugar|water":"Dissolves","sugar|hexane":"Doesn’t"},"wait":"?"},"zoom":"Zoom to the particles","zoomText":"Water molecules surround each ion: the δ− O ends face Na\u003csup>+\u003c/sup>, and the δ+ H ends face Cl\u003csup>−\u003c/sup>. Hexane molecules have no charged ends, so the ions stay locked in the crystal. Iodine is the opposite case: nonpolar I\u003csub>2\u003c/sub> mixes with nonpolar hexane. (A first look at module 21.)"},"s3":{"title":"Station 3: In the world","html":"\u003cp>\u003cstrong>Oil on a lake.\u003c/strong> Oil is a mixture of hydrocarbons, which are nonpolar. It doesn’t mix with polar water, and it’s less dense, so it spreads into a thin sheen on the surface.\u003c/p>\u003cp>\u003cstrong>Oil-and-vinegar dressing.\u003c/strong> Vinegar is mostly water. Shake the bottle and the oil breaks into droplets, but the layers separate again, with the less dense oil on top.\u003c/p>\u003cp>\u003cstrong>Why grease needs soap.\u003c/strong> A soap particle has a long nonpolar tail and a charged head. The tails dissolve in the grease and the heads face the water, so the grease lifts off in tiny droplets that rinse away.\u003c/p>\u003cp>\u003cstrong>Oil spills in Canadian waters.\u003c/strong> Canada has the longest coastline in the world, and the Great Lakes and major rivers carry ships too. Clean-up methods depend on polarity: floating booms hold the oil on the surface, skimmers scoop up the top layer, sorbent pads made of nonpolar materials soak up oil but not water, and dispersants act like soap, breaking the oil into tiny droplets that spread through the water. Each method has trade-offs, so responders choose them case by case.\u003c/p>","aria":"A lake with a thin layer of oil floating on the water, and a bottle of salad dressing with a layer of oil on top of vinegar."},"quickCheck":{"title":"Quick check","summary":"Polarity tests quick check","items":[{"id":"q1","goal":4,"prompt":"Which stream bends toward a charged rod?","choices":[{"t":"Neither","fb":"Only polar molecules turn to face the rod.","_n":"14394","_k":"34f31dfc"},{"t":"Water","fb":"Right. Water molecules are polar, and only polar molecules turn to face the rod.","_n":"153c4","_k":"eef7f58c"},{"t":"Both","fb":"Only polar molecules turn to face the rod.","_n":"163b4","_k":"5bace519"},{"t":"Hexane","fb":"Only polar molecules turn to face the rod.","_n":"173e4","_k":"a687f9ff"}]},{"id":"q2","goal":4,"prompt":"Iodine dissolves best in…","choices":[{"t":"Water","fb":"Nonpolar dissolves in nonpolar. ‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"183d4","_k":"f90c991d"},{"t":"Vinegar","fb":"Nonpolar dissolves in nonpolar. ‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"19404","_k":"c71ffef5"},{"t":"Hexane","fb":"Right. Nonpolar dissolves in nonpolar: I\u003csub>2\u003c/sub> and hexane are both nonpolar.","_n":"1a3f4","_k":"2b79c389"},{"t":"Salt water","fb":"Nonpolar dissolves in nonpolar. ‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"1b424","_k":"19b148ec"}]},{"id":"q3","goal":4,"prompt":"Why does oil float on water instead of dissolving?","choices":[{"t":"Water is nonpolar","fb":"Two separate facts: polarity stops it mixing; density makes it float.","_n":"1c414","_k":"c33f9c76"},{"t":"Oil is ionic","fb":"Two separate facts: polarity stops it mixing; density makes it float.","_n":"1d544","_k":"0645ad07"},{"t":"Oil is nonpolar and less dense","fb":"Right. Two separate facts: polarity stops it mixing; density makes it float.","_n":"1e554","_k":"c29b0580"},{"t":"Oil is denser","fb":"Two separate facts: polarity stops it mixing; density makes it float.","_n":"1f524","_k":"9e65b69f"}]},{"id":"q4","goal":4,"prompt":"In the rod test, which change would spoil the comparison?","choices":[{"t":"Keeping the room still","fb":"Change only the liquid. A still room keeps the test fair.","_n":"1g534","_k":"1dfa281b"},{"t":"Using the same rod","fb":"Change only the liquid. The same rod keeps the test fair.","_n":"1h504","_k":"301c745f"},{"t":"Moving the rod closer for hexane","fb":"Right. Change only the liquid.","_n":"1i514","_k":"d0fe5bf0"},{"t":"Using equal stream widths","fb":"Change only the liquid. Equal widths keep the test fair.","_n":"1j4e4","_k":"168a8953"}]}]}},"practice":{"activities":[{"id":"sorter","type":"sorter","title":"Bond-type sorter","summary":"Bond-type sorter","noun":"bond","goal":[1,2],"txt":true,"instruction":"Find ΔEN for each bond from the course table, then sort the bond into its box (course model).","how":"Tap a bond, then tap the box it belongs in. \u003cspan class=\"uses bp-uses\">\u003cstrong>Use these values\u003c/strong>H 2.20 · C 2.55 · N 3.04 · O 3.44 · S 2.58 · Cl 3.16 · Br 2.96 · Na 0.93 · K 0.82 · Mg 1.31 · Al 1.61\u003c/span>","boxes":[{"id":"np","label":"Nonpolar covalent","sub":"ΔEN below 0.5"},{"id":"pc","label":"Polar covalent","sub":"ΔEN 0.5 to 1.7"},{"id":"io","label":"Mostly ionic","sub":"ΔEN above 1.7"}],"wrongDefault":"Subtract the course-table values, then compare with 0.5 and 1.7.","items":[{"id":"s1","t":"C–H","_a":"QF5AGg==","goal":[1,2],"why":"2.55 − 2.20 = 0.35. 0.35 is below 0.5: nonpolar covalent.","wrong":{"io":"ΔEN is a difference: subtract the smaller value from the larger.","pc":"0.35 is below 0.5."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","C–H: 2.55 − 2.20 = 0.35, so the bond is nonpolar covalent."]},{"id":"s2","t":"Cl–Cl","_a":"QF5AGg==","goal":[1,2],"why":"3.16 − 3.16 = 0. Identical atoms share equally: ΔEN = 0.","wrong":{"io":"ΔEN is a difference: subtract the smaller value from the larger."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","Cl–Cl: 3.16 − 3.16 = 0, so the bond is nonpolar covalent."]},{"id":"s3","t":"C–S","_a":"QF5AGg==","goal":[1,2],"why":"2.58 − 2.55 = 0.03. 0.03 is far below 0.5: nonpolar covalent.","wrong":{"io":"ΔEN is a difference: subtract the smaller value from the larger."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","C–S: 2.58 − 2.55 = 0.03, so the bond is nonpolar covalent."]},{"id":"s4","t":"O–H","_a":"QEBTGg==","goal":[1,2],"why":"3.44 − 2.20 = 1.24. 1.24 is between 0.5 and 1.7: polar covalent.","wrong":{"io":"ΔEN is a difference: subtract the smaller value from the larger."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","O–H: 3.44 − 2.20 = 1.24, so the bond is polar covalent."]},{"id":"s5","t":"N–H","_a":"QEBTGg==","goal":[1,2],"why":"3.04 − 2.20 = 0.84. 0.84 is between 0.5 and 1.7: polar covalent.","wrong":{"io":"ΔEN is a difference: subtract the smaller value from the larger."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","N–H: 3.04 − 2.20 = 0.84, so the bond is polar covalent."]},{"id":"s6","t":"C–Cl","_a":"QEBTGg==","goal":[1,2],"why":"3.16 − 2.55 = 0.61. 0.61 is between 0.5 and 1.7: polar covalent.","wrong":{"io":"ΔEN is a difference: subtract the smaller value from the larger."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","C–Cl: 3.16 − 2.55 = 0.61, so the bond is polar covalent."]},{"id":"s7","t":"Al–Cl","_a":"QEBTGg==","goal":[1,2],"why":"3.16 − 1.61 = 1.55. 1.55 is below 1.7: polar covalent, even though Al is a metal.","wrong":{"io":"Metal plus nonmetal isn’t automatically ionic: ΔEN is only 1.55."},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","Al–Cl: 3.16 − 1.61 = 1.55, so the bond is polar covalent."]},{"id":"s8","t":"Na–Cl","_a":"QFlfGg==","goal":1,"why":"3.16 − 0.93 = 2.23. 2.23 is above 1.7: mostly ionic.","wrong":{},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","Na–Cl: 3.16 − 0.93 = 2.23, so the bond is mostly ionic."]},{"id":"s9","t":"Mg–O","_a":"QFlfGg==","goal":1,"why":"3.44 − 1.31 = 2.13. 2.13 is above 1.7: mostly ionic.","wrong":{},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","Mg–O: 3.44 − 1.31 = 2.13, so the bond is mostly ionic."]},{"id":"s10","t":"K–Br","_a":"QFlfGg==","goal":1,"why":"2.96 − 0.82 = 2.14. 2.14 is above 1.7: mostly ionic.","wrong":{},"hints":["Subtract the course-table values.","Compare with 0.5 and 1.7.","K–Br: 2.96 − 0.82 = 2.14, so the bond is mostly ionic."]}]},{"id":"polar","type":"custom","title":"Polar or not?","summary":"Polar or not?","star":true,"goal":[3,5],"instruction":"Six molecules. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Tap a choice, then press \u003cstrong>Check\u003c/strong>.","items":[{"id":"r1","goal":3,"star":false,"prompt":"SO\u003csub>3\u003c/sub> (trigonal planar)","options":[{"t":"Polar","why":"Three equal S–O dipoles at 120° cancel.","_n":"1k4f4","_ Nonpolar","why":"The T isn’t symmetric: the stem dipole is left over.","_n":"1t504","_k":"43a3dbc3"}],"hints":["Draw the 3D shape first; symmetry decides whether the dipoles cancel.","The two arms of the T are opposite each other. What about the stem?","The T isn’t symmetric: the stem dipole is left over. Polar."]},{"id":"r6","goal":5,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> HF has ΔEN = 3.98 − 2.20 = 1.78, past the 1.7 cut-off, yet HF is a molecular substance (a gas just above room temperature, bp ≈ 20 °C \u003cspan class=\"tiny muted\">(course table addition)\u003c/span>). What should a careful chemist conclude?","options":[{"t":"The cut-offs are a guide: HF is a very polar covalent molecule","why":"Observed properties outrank a cut-off. The cut-offs are a guide. Bonding is a continuum, so check the model against properties.","_n":"1u4f4","_k":"d9782b1c"},{"t":"HF is ionic","why":"Observed properties outrank a cut-off. The cut-offs are a guide. Bonding is a continuum, so check the model against properties.","_n":"1v464","_k":"28149f5c"}],"hints":["Ionic solids have high melting points.","HF boils near room temperature.","The model is a guide; the evidence says covalent."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Jiwoo","how":"","goal":[1,3],"instruction":"Jiwoo made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Is CO\u003csub>2\u003c/sub> polar?","steps":["ΔEN for C–O is 3.44 − 2.55 = 0.89.","So each C=O bond is polar, with δ− on O.","A molecule with polar bonds is polar, so CO\u003csub>2\u003c/sub> is polar.","So CO\u003csub>2\u003c/sub> will bend toward a charged rod."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"1w454","_k":"29e35a96"},{"t":"CO\u003csub>2\u003c/sub> is polar because O is more electronegative.","why":"Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"1xc84","_k":"6e68f0d1"},{"t":"The bonds are actually nonpolar.","why":"0.89 is polar.","_n":"1yc94","_k":"2cbe3149"},{"t":"CO\u003csub>2\u003c/sub> is linear, so its two equal dipoles point in opposite directions and cancel: it’s nonpolar.","why":"Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"1zca4","_k":"f58a5069"}],"hints":["What is CO\u003csub>2\u003c/sub>’s shape?","Linear.","The dipoles cancel."]},{"id":"e2","goal":1,"task":"Classify the C–F bond.","steps":["C is 2.55 and F is 3.98 (course table).","ΔEN = 2.55 + 3.98 = 6.53.","6.53 > 1.7, so the bond is ionic."],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"ΔEN is a difference: subtract the smaller value from the larger.","_n":"20cb4","_k":"0869447a"},{"t":"Divide: 3.98 ÷ 2.55.","why":"ΔEN is a difference: subtract the smaller value from the larger.","_n":"21cc4","_k":"faccb972"},{"t":"Use atomic numbers: 9 − 6 = 3.","why":"ΔEN is a difference: subtract the smaller value from the larger.","_n":"22cd4","_k":"506ddc62"},{"t":"ΔEN is a difference: 3.98 − 2.55 = 1.43, so the bond is polar covalent.","why":"1.43 lies between 0.5 and 1.7. ΔEN is a difference: subtract the smaller value from the larger.","_n":"23ce4","_k":"3a1dccc5"}],"hints":["What does Δ mean?","Difference.","1.43: polar covalent."]},{"id":"e3","goal":3,"task":"Is NH\u003csub>3\u003c/sub> polar?","steps":["Each N–H bond has ΔEN 0.84: polar.","The three N–H bonds are identical.","Three identical dipoles always cancel, so NH\u003csub>3\u003c/sub> is nonpolar."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"The lone pair makes NH\u003csub>3\u003c/sub> trigonal pyramidal, so the three dipoles all lean toward the N side and add up: it’s polar.","why":"The lone pair makes NH\u003csub>3\u003c/sub> a pyramid, so the bond dipoles don’t cancel.","_n":"24cf4","_k":"7e2d4d2d"},{"t":"N–H bonds are nonpolar.","why":"0.84 is polar.","_n":"25c04","_k":"6f5bd6bd"},{"t":"They cancel because N is in the middle.","why":"The lone pair makes NH\u003csub>3\u003c/sub> a pyramid, so the bond dipoles don’t cancel.","_n":"26c14","_k":"0178fb53"},{"t":"Step 3 is correct.","why":"The lone pair makes NH\u003csub>3\u003c/sub> a pyramid, so the bond dipoles don’t cancel.","_n":"27c24","_k":"f934b841"}],"hints":["Does NH\u003csub>3\u003c/sub> have a lone pair?","Yes, so its shape is a pyramid.","Polar."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result in the polarity m&#101;ter surprised you most: CO\u003csub>2\u003c/sub> being nonpolar, CHCl\u003csub>3\u003c/sub> being polar, or the square-planar trick?"},{"id":"j2","q":"In your own words, explain why you need both ΔEN and shape to decide polarity."},{"id":"j3","q":"Explain to a friend what ‘like dissolves like’ really means, with one example."},{"id":"j4","q":"Where do you still hesitate: calculating ΔEN, picturing shapes, or adding dipoles? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Using the course table, what are ΔEN and the bond type (course model) for an O–H bond?","use":"O 3.44 · H 2.20","options":[{"t":"1.24; polar covalent","why":"3.44 − 2.20.","_n":"28c14","_k":"5115e6b6"},{"t":"5.64; mostly ionic","why":"That adds the two values. ΔEN is a difference: subtract the smaller value from the larger.","_n":"29c44","_k":"eb7fe575"},{"t":"0.24; nonpolar covalent","why":"Subtract carefully: 3.44 − 2.20 = 1.24.","_n":"2ac34","_k":"4816c052"},{"t":"1.24; mostly ionic","why":"1.24 is below 1.7. The cut-offs are a guide. Bonding is a continuum, so check the model against properties.","_n":"2bbe4","_k":"acfd2df4"}]},"b":{"prompt":"What are ΔEN and the bond type for a C–Cl bond?","use":"C 2.55 · Cl 3.16","options":[{"t":"0.61; nonpolar covalent","why":"0.61 is above 0.5.","_n":"2cbd4","_k":"79b75598"},{"t":"5.71; mostly ionic","why":"ΔEN is a difference: subtract the smaller value from the larger.","_n":"2dc04","_k":"5f298174"},{"t":"0.61; polar covalent","why":"3.16 − 2.55.","_n":"2ebf4","_k":"65ad6dff"},{"t":"1.61; polar covalent","why":"Subtract carefully: 3.16 − 2.55 = 0.61.","_n":"2fca4","_k":"4c489933"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In an N–H bond, which atom carries δ−, and which way does the dipole arrow point?","use":"N 3.04 · H 2.20","options":[{"t":"Neither; the bond is nonpolar","why":"0.84 is polar.","_n":"2gc94","_k":"b9f78202"},{"t":"N; toward N","why":"N is more electronegative (3.04).","_n":"2hbc4","_k":"341e8b0b"},{"t":"H; toward H","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"2ibd4","_k":"b5d97772"},{"t":"N; toward H","why":"The arrow points to δ−. δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"2jba4","_k":"b782cb18"}]},"b":{"prompt":"In a C–O bond, which atom carries δ−, and which way does the dipole arrow point?","use":"C 2.55 · O 3.44","options":[{"t":"O; toward O","why":"O is more electronegative (3.44).","_n":"2kbb4","_k":"bc2e4321"},{"t":"Neither","why":"0.89 is polar.","_n":"2lc04","_k":"1e32400c"},{"t":"C; toward C","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"2mc14","_k":"dbd22244"},{"t":"O; toward C","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"2nbe4","_k":"8284a638"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which molecule is nonpolar?","options":[{"t":"CO\u003csub>2\u003c/sub>","why":"Linear: the dipoles cancel.","_n":"2obf4","_k":"7fb87939"},{"t":"CH\u003csub>3\u003c/sub>Cl","why":"Mixed outer atoms.","_n":"2pc44","_k":"27b287c4"},{"t":"NH\u003csub>3\u003c/sub>","why":"Pyramidal. The lone pair makes NH\u003csub>3\u003c/sub> a pyramid, so the bond dipoles don’t cancel.","_n":"2qc54","_k":"fca15ddc"},{"t":"H\u003csub>2\u003c/sub>O","why":"Bent.","_n":"2rcb4","_k":"b21da97c"}]},"b":{"prompt":"Which molecule is polar?","options":[{"t":"BF\u003csub>3\u003c/sub>","why":"Flat and symmetric. Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"2scc4","_k":"2773f2cc"},{"t":"CH\u003csub>4\u003c/sub>","why":"Symmetric, with nearly nonpolar bonds.","_n":"2tc94","_k":"2d6fac7d"},{"t":"CHCl\u003csub>3\u003c/sub>","why":"The C–H and C–Cl dipoles don’t balance.","_n":"2uca4","_k":"88e5acbf"},{"t":"CCl\u003csub>4\u003c/sub>","why":"Symmetric: the dipoles cancel. Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"2vc74","_k":"9debf325"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"What are SF\u003csub>4\u003c/sub>’s shape and polarity?","options":[{"t":"Seesaw; nonpolar","why":"A seesaw isn’t symmetric. Draw the 3D shape first; symmetry decides whether the dipoles cancel.","_n":"2wc84","_k":"d293f4bb"},{"t":"Tetrahedral; nonpolar","why":"S has a lone pair. The lone pair makes NH\u003csub>3\u003c/sub> a pyramid, so the bond dipoles don’t cancel.","_n":"2xc54","_k":"8d434d5d"},{"t":"Square planar; nonpolar","why":"That’s AX\u003csub>4\u003c/sub>E\u003csub>2\u003c/sub>.","_n":"2yc64","_k":"d3ca2577"},{"t":"Seesaw; polar","why":"AX\u003csub>4\u003c/sub>E\u003csub>1\u003c/sub>: the lone pair makes it lopsided.","_n":"2zc34","_k":"e7ed0332"}]},"b":{"prompt":"What are XeF\u003csub>4\u003c/sub>’s shape and polarity?","options":[{"t":"Seesaw; polar","why":"That’s AX\u003csub>4\u003c/sub>E\u003csub>1\u003c/sub>.","_n":"30c44","_k":"950d01af"},{"t":"Tetrahedral; nonpolar","why":"Right polarity, wrong shape: Xe has two lone pairs.","_n":"31314","_k":"721bca7b"},{"t":"Square planar; polar","why":"Opposite dipoles cancel. Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"32304","_k":"0f4f30a5"},{"t":"Square planar; nonpolar","why":"AX\u003csub>4\u003c/sub>E\u003csub>2\u003c/sub>: opposite Xe–F dipoles cancel.","_n":"33334","_k":"4e8a88dc"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Which solvent dissolves solid iodine (I\u003csub>2\u003c/sub>) best?","options":[{"t":"Water","why":"Water is polar. ‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"34324","_k":"86c4ab25"},{"t":"Vinegar","why":"Mostly water: polar.","_n":"35354","_k":"15c96ae3"},{"t":"Hexane","why":"Both are nonpolar.","_n":"36344","_k":"e02a96d2"},{"t":"Salt water","why":"Ions in water don’t help a nonpolar solute.","_n":"37374","_k":"7509d3af"}]},"b":{"prompt":"Which solvent dissolves potassium chloride best?","options":[{"t":"Octane","why":"‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"38364","_k":"c5590b85"},{"t":"Hexane","why":"‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"39394","_k":"d3b50b1b"},{"t":"Liquid iodine","why":"Nonpolar.","_n":"3a384","_k":"9d62f2ea"},{"t":"Water","why":"Polar water surrounds the K\u003csup>+\u003c/sup> and Cl\u003csup>−\u003c/sup> ions.","_n":"3bbf3","_k":"7c123d36"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Two isomers of C\u003csub>2\u003c/sub>H\u003csub>2\u003c/sub>Cl\u003csub>2\u003c/sub> have a C=C with one Cl on each carbon: the Cl atoms on the same side (cis) or on opposite sides (trans). Which is polar?","options":[{"t":"Cis","why":"On the same side, the C–Cl dipoles add.","_n":"3cc03","_k":"cf465a1e"},{"t":"Neither","why":"In cis they don’t cancel.","_n":"3dc13","_k":"3d374957"},{"t":"Both","why":"In trans they cancel. Bond dipoles can cancel. In linear CO\u003csub>2\u003c/sub> the two C=O dipoles point in opposite directions.","_n":"3ec23","_k":"b9a674f9"},{"t":"Trans","why":"The opposite C–Cl dipoles cancel.","_n":"3fc33","_k":"963cf19b"}]},"b":{"prompt":"Which dichlorobenzene isomer is nonpolar: 1,2- or 1,4-?","options":[{"t":"1,2-dichlorobenzene","why":"Neighbouring Cl dipoles add.","_n":"3gc43","_k":"069179d1"},{"t":"Neither","why":"1,4- cancels.","_n":"3hc53","_k":"5c15e5b7"},{"t":"Both","why":"Bond dipoles cancel only when they point in opposite directions. Neighbouring Cl dipoles in 1,2- add.","_n":"3ic63","_k":"8a93c519"},{"t":"1,4-dichlorobenzene","why":"The Cl atoms are opposite, so the dipoles cancel.","_n":"3jb73","_k":"db205693"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why CCl\u003csub>4\u003c/sub> is nonpolar even though each C–Cl bond is polar?","options":[{"t":"“Chlorine isn’t very electronegative.”","why":"Chlorine is 3.16.","_n":"3kb83","_k":"e4c0bb96"},{"t":"“C–Cl bonds are nonpolar.”","why":"0.61 is polar.","_n":"3lc53","_k":"981ddfc3"},{"t":"“The four equal C–Cl dipoles point to the corners of a tetrahedron, so they cancel.”","why":"Symmetric shape, equal dipoles: they cancel.","_n":"3mc43","_k":"0331b480"},{"t":"“Carbon has no lone pairs, so nothing is polar.”","why":"Bonds can still be polar.","_n":"3nc33","_k":"43ad4583"}]},"b":{"prompt":"Which is the best explanation of why BF\u003csub>3\u003c/sub> is nonpolar?","options":[{"t":"“Fluorine shares equally.”","why":"Fluorine is the most electronegative element.","_n":"3oc23","_k":"a8b5144b"},{"t":"“Boron has an incomplete octet.”","why":"True, but not why it is nonpolar.","_n":"3pc93","_k":"6837ffab"},{"t":"“Its three equal B–F dipoles lie flat at 120° to each other and cancel.”","why":"Flat, symmetric and equal: they cancel.","_n":"3qc83","_k":"00d62c28"},{"t":"“B–F bonds are nonpolar.”","why":"ΔEN is large.","_n":"3rc73","_k":"1641ce6b"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which description correctly labels the HCl molecule?","use":"H 2.20 · Cl 3.16","options":[{"t":"“δ+ on Cl, with the arrow pointing to H.”","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"3sc63","_k":"a12679d3"},{"t":"“δ+ on H and δ− on Cl, with the dipole arrow pointing to Cl”","why":"Cl is more electronegative (3.16 vs 2.20).","_n":"3tbd3","_k":"77d9e9aa"},{"t":"“No charges: a covalent bond.”","why":"ΔEN 0.96 is polar.","_n":"3ubc3","_k":"ac8e8773"},{"t":"“δ− on H and δ+ on Cl.”","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"3v434","_k":"7c9f5bf7"}]},"b":{"prompt":"Which description correctly labels a water molecule?","options":[{"t":"“The net dipole points toward the H atoms.”","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"3w444","_k":"a6834159"},{"t":"“δ− on O and δ+ on each H; the net dipole points toward the O side”","why":"O is more electronegative, and the bent shape leaves a net dipole toward O.","_n":"3x414","_k":"11862480"},{"t":"“No net dipole because the two O–H bonds are equal.”","why":"Water is bent, so its two equal dipoles don’t cancel.","_n":"3y424","_k":"dd846fc1"},{"t":"“δ+ on O and δ− on H.”","why":"δ− sits on the atom with the higher electronegativity; the dipole arrow points to it.","_n":"3z474","_k":"1365ec0f"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"After an oil spill on a lake, why does the oil spread on the surface instead of dissolving?","options":[{"t":"Oil molecules are polar but too large to dissolve","why":"They’re nonpolar.","_n":"40484","_k":"b7a0347b"},{"t":"Oil molecules are nonpolar and don’t mix with polar water, and oil is less dense, so it floats","why":"Polarity stops it mixing; density makes it float.","_n":"41454","_k":"28a38154"},{"t":"Oil is ionic","why":"Hydrocarbons are nonpolar.","_n":"42464","_k":"9d3066a7"},{"t":"Water molecules are nonpolar","why":"Water is polar.","_n":"433b4","_k":"3dbcb15f"}]},"b":{"prompt":"Why does an oil-and-vinegar salad dressing separate into layers?","options":[{"t":"Oil is nonpolar, and vinegar is mostly polar water, so they don’t mix; the less dense oil rises","why":"Polarity stops them mixing; density decides which layer is on top.","_n":"443c4","_k":"e5fb293a"},{"t":"Oil dissolves in vinegar, then falls out","why":"‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"45c94","_k":"9606ebce"},{"t":"Vinegar is nonpolar","why":"Vinegar is mostly water.","_n":"46c84","_k":"ec634448"},{"t":"The two liquids are the same polarity","why":"‘Like’ means similar polarity. Salt dissolves in water (polar), not in hexane (nonpolar).","_n":"47cb4","_k":"c21092db"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"AlCl\u003csub>3\u003c/sub> has ΔEN = 1.55. Solid AlCl\u003csub>3\u003c/sub> turns to vapour at a low temperature (about 180 °C), while NaCl (ΔEN 2.23) melts at 801 °C. \u003cspan class=\"tiny muted\">(course table addition)\u003c/span> What is the best conclusion?","options":[{"t":"Melting points have nothing to do with bonding","why":"They do: lattices hold strongly.","_n":"48ca4","_k":"ad9f4bdb"},{"t":"AlCl\u003csub>3\u003c/sub> must be ionic because it contains a metal","why":"A metal doesn’t guarantee an ionic bond. The cut-offs are a guide. Bonding is a continuum, so check the model against properties.","_n":"49c54","_k":"16370576"},{"t":"AlCl\u003csub>3\u003c/sub> behaves more like a covalent substance, as its ΔEN predicts","why":"1.55 is in the polar covalent range, and the low temperature fits separate molecules.","_n":"4ac44","_k":"7f748934"},{"t":"NaCl must be covalent","why":"Its high melting point fits an ionic lattice.","_n":"4bc74","_k":"22c18f23"}]},"b":{"prompt":"MgO (ΔEN 2.13) melts at about 2850 °C, while CO\u003csub>2\u003c/sub> (C–O ΔEN 0.89) is a gas at room temperature. \u003cspan class=\"tiny muted\">(course table addition)\u003c/span> What is the best conclusion?","options":[{"t":"CO\u003csub>2\u003c/sub> is a gas because its bonds are weak","why":"Its C=O bonds are strong; the forces between molecules are weak.","_n":"4cc64","_k":"42bef35b"},{"t":"MgO is covalent","why":"The cut-offs are a guide. Bonding is a continuum, so check the model against properties.","_n":"4dc14","_k":"3181d59f"},{"t":"Both are ionic","why":"The cut-offs are a guide. Bonding is a continuum, so check the model against properties.","_n":"4ec04","_k":"1babd34f"},{"t":"MgO is an ionic lattice with strong forces throughout; CO\u003csub>2\u003c/sub> is made of separate molecules","why":"The properties match the bond types the ΔEN model predicts.","_n":"4f374","_k":"5f715b34"}]}}]},"task":{"title":"Polar bonds, nonpolar molecule","summary":"Polar bonds, nonpolar molecule","statement":"\u003cp>Choose a central atom and its outer atoms to build a molecule that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"bp-conds\">\u003cli>It has at least one polar bond (ΔEN ≥ 0.5).\u003c/li>\u003cli>Its bond dipoles cancel (net dipole 0).\u003c/li>\u003cli>Every bond has ΔEN below 1.5.\u003c/li>\u003c/ol>","inputs":{"centre":"Central atom","pos":"Position","centres":[{"id":"B","t":"B","sub":"3 outer positions"},{"id":"C","t":"C","sub":"4 outer positions"},{"id":"N","t":"N","sub":"3 positions, 1 lone pair"},{"id":"O","t":"O","sub":"2 positions, 2 lone pairs"}],"outers":["H","F","Cl"]},"checks":["At least one polar bond","Dipoles cancel","No bond near the ionic end"],"tips":["C–H (0.35) and B–H (0.16) are nonpolar. Try F or Cl.","A lone pair on the centre, or a mix of outer atoms, leaves a net dipole.","B–F has ΔEN 1.94: too close to the ionic end for this design."],"explainPrompt":"Explain how your molecule can have polar bonds but no net dipole.","vocab":"Use the words electronegativity difference, bond dipole, symmetric and lone pair.","more":"There’s more than one answer. Can you find them all?","after3":"Each pairs polar bonds with a symmetric shape
