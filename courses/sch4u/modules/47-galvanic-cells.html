u003c/i>°\u003csub>cell\u003c/sub> = 0.34 − (−0.76) = +1.10 V","eqSize":"sm","eqLabel":"Zinc plus copper two plus ions gives zinc two plus ions plus copper. E zero cell equals 0.34 minus negative 0.76, which is plus 1.10 volts.","headline":"Make the electrons take the long way round","text":"Zinc gives electrons to copper ions whether or not you’re watching. In a \u003cstrong>galvanic cell\u003c/strong> the two halves sit in separate beakers, so the electrons have to travel through a wire, and a voltmeter reads the push. The \u003cstrong>anode\u003c/strong> gives electrons, the \u003cstrong>cathode\u003c/strong> takes them, and a \u003cstrong>salt bridge\u003c/strong> lets ions move to complete the circuit.","fig":{"html":"\u003cdiv class=\"gc-hx\">\u003csvg class=\"gc-hx-svg\" id=\"gc-hx-svg\" viewBox=\"0 0 520 344\" role=\"img\" aria-label=\"A zinc strip in pale blue copper(II) solution grows a copper coating while a thermometer rises: the energy is lost as heat. The scene splits into two beakers, zinc in Zn²⁺ and copper in Cu²⁺, joined by a wire and a KNO₃ salt bridge. Violet electrons stream through the wire from zinc to copper; teal NO₃⁻ ions drift into the zinc beaker and orange K⁺ ions into the copper beaker. The voltmeter reads +1.10 V and a small bulb glows.\">\u003c/svg>\u003cdiv class=\"gc-hx-row\">\u003cp class=\"gc-hx-ctr\" id=\"gc-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"gc-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can name the parts of a galvanic cell and explain what each one does.","I can use the reduction-potential table to rank oxidizing and reducing agents.","I can identify the anode and cathode and calculate \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>.","I can predict whether a redox reaction is spontaneous from \u003ci>E\u003c/i>° values.","I can describe and label electron flow, ion flow and electrode polarity in a cell.","I can explain how the standard hydrogen electrode is used to find an unknown half-cell’s \u003ci>E\u003c/i>°."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Half-reactions","goal":3,"prompt":"Which half-reaction shows zinc being oxidized?","options":[{"t":"Zn(s) + 2e\u003csup>−\u003c/sup> → Zn\u003csup>2+\u003c/sup>(aq)","why":"The charge doesn’t balance: −2 vs +2.","_n":"0305","_k":"53b81766"},{"t":"Zn(s) → Zn\u003csup>2+\u003c/sup>(aq) − 2e\u003csup>−\u003c/sup>","why":"Electrons are written as products, not subtracted.","_n":"1315","_k":"66a8560e"},{"t":"Zn\u003csup>2+\u003c/sup>(aq) + 2e\u003csup>−\u003c/sup> → Zn(s)","why":"That’s the reduction.","_n":"2325","_k":"7797a9fa"},{"t":"Zn(s) → Zn\u003csup>2+\u003c/sup>(aq) + 2e\u003csup>−\u003c/sup>","why":"Oxidation loses electrons, so the electrons are products.","_n":"32b5","_k":"004d341b"}],"hints":["Oxidation loses electrons.","Electrons appear as products.","Zn → Zn\u003csup>2+\u003c/sup> + 2e\u003csup>−\u003c/sup>."]},{"id":"w2","skill":"Half-reactions","goal":3,"prompt":"Balance Cu + Ag\u003csup>+\u003c/sup> → Cu\u003csup>2+\u003c/sup> + Ag.","options":[{"t":"Cu + Ag\u003csup>+\u003c/sup> → Cu\u003csup>2+\u003c/sup> + Ag","why":"Charge +1 vs +2.","_n":"42c5","_k":"416bbbc6"},{"t":"Cu + 2Ag\u003csup>+\u003c/sup> → Cu\u003csup>2+\u003c/sup> + 2Ag","why":"2 e\u003csup>−\u003c/sup> lost, 2 gained.","_n":"52d5","_k":"8fc7be5b"},{"t":"Cu + 2Ag\u003csup>+\u003c/sup> → Cu\u003csup>2+\u003c/sup> + Ag","why":"Ag atoms: 2 vs 1.","_n":"62e5","_k":"0d432d72"},{"t":"2Cu + Ag\u003csup>+\u003c/sup> → 2Cu\u003csup>2+\u003c/sup> + Ag","why":"4 e\u003csup>−\u003c/sup> lost, 1 gained.","_n":"7275","_k":"fd3f483d"}],"hints":["Electrons lost per Cu?","2; each Ag\u003csup>+\u003c/sup> takes 1.","2Ag\u003csup>+\u003c/sup>."]},{"id":"w3","skill":"Oxidizing and reducing agents","goal":2,"prompt":"In Zn + Cu\u003csup>2+\u003c/sup> → Zn\u003csup>2+\u003c/sup> + Cu, which is the oxidizing agent?","options":[{"t":"Zn","why":"Zn is oxidized, so it is the reducing agent, not the oxidizing agent.","_n":"8285","_k":"45de6461"},{"t":"Zn\u003csup>2+\u003c/sup>","why":"A product.","_n":"9bf6","_k":"b297e3a7"},{"t":"Cu","why":"A product.","_n":"abe6","_k":"f0980320"},{"t":"Cu\u003csup>2+\u003c/sup>","why":"It takes electrons (is reduced).","_n":"bbd6","_k":"7fc47209"}],"hints":["What gets reduced?","Cu\u003csup>2+\u003c/sup> → Cu.","Cu\u003csup>2+\u003c/sup>."]},{"id":"w4","skill":"Oxidizing and reducing agents","goal":2,"prompt":"A strong oxidizing agent is a species that…","options":[{"t":"is always a metal atom","why":"Metal atoms are reducing agents.","_n":"cbc6","_k":"5400685c"},{"t":"contains oxygen","why":"Oxygen isn’t required.","_n":"dbb6","_k":"5f355f56"},{"t":"readily loses electrons","why":"That’s a reducing agent.","_n":"eba6","_k":"67d825c0"},{"t":"readily gains electrons","why":"It takes electrons from something else, so it is reduced.","_n":"fb96","_k":"a584fcd0"}],"hints":["An oxidizing agent causes oxidation.","It takes electrons from something else.","It gains electrons."]},{"id":"w5","skill":"Activity series","goal":4,"prompt":"Using Mg > Zn > Fe > Cu > Ag, which pair reacts?","options":[{"t":"Ag metal in Cu\u003csup>2+\u003c/sup> solution","why":"Ag is the least active.","_n":"gb86","_k":"e888c4a7"},{"t":"Cu metal in Zn\u003csup>2+\u003c/sup> solution","why":"Cu is less active.","_n":"hc76","_k":"a10de510"},{"t":"Fe metal in Mg\u003csup>2+\u003c/sup> solution","why":"Mg is more active than Fe.","_n":"ic66","_k":"235d3d18"},{"t":"Zn metal in Cu\u003csup>2+\u003c/sup> solution","why":"Zn is more active than Cu.","_n":"jc56","_k":"cabbb3bf"}],"hints":["A metal displaces ions of a \u003cstrong>less\u003c/strong> active metal.","Which metal is higher?","Zn into Cu\u003csup>2+\u003c/sup>."]},{"id":"w6","skill":"Activity series","goal":4,"prompt":"Which metal is the strongest reducing agent: Mg, Zn, Cu or Ag?","options"  the anode; Cu\u003csup>2+\u003c/sup> ions plate out as Cu at the cathode. In a galvanic cell the anode releases electrons, so it is the \u003cstrong>negative\u003c/strong> terminal."},{"id":"p2","prompt":"The Zn–Cu cell is running. Now remove the salt bridge. What does the voltmeter read?","options":[{"t":"1.10 V","_n":"sbe6","_k":"f3603a02"},{"t":"2.20 V","_n":"tcb6","_k":"9dfce3e5"},{"t":"−1.10 V","_n":"uca6","_k":"5880eedf"},{"t":"0.00 V","_n":"vcd6","_k":"888cda4a"}],"explain":"Without ions moving, each beaker would build up charge, and that stops the electrons almost at once. Electrons never go through the bridge."},{"id":"p3","prompt":"Cu–Ag cell. The silver half-reaction is written 2Ag\u003csup>+\u003c/sup> + 2e\u003csup>−\u003c/sup> → 2Ag to match copper’s electrons. What is \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub>?","options":[{"t":"1.26 V","_n":"wcc6","_k":"c22cc36b"},{"t":"0.92 V","_n":"xc76","_k":"52962120"},{"t":"0.23 V","_n":"yc66","_k":"fb0095e8"},{"t":"0.46 V","_n":"zc96","_k":"dde87c4b"}],"explain":"\u003ci>E\u003c/i>° is energy per unit of charge. Writing more electrons doesn’t change it: 0.80 − 0.34 = 0.46 V."},{"id":"p4","prompt":"Hydrogen reference mode with Cu in the right beaker. Which way do electrons flow?","options":[{"t":"Neither way","_n":"10c86","_k":"896ebc00"},{"t":"Both ways","_n":"11c36","_k":"0c1eb03a"},{"t":"From the hydrogen electrode to the copper","_n":"12c26","_k":"a8319f1f"},{"t":"From the copper to the hydrogen electrode","_n":"13c15","_k":"4d600363"}],"explain":"Cu\u003csup>2+\u003c/sup>/Cu (+0.34 V) is above the hydrogen electrode (0.00 V), so copper is the cathode: H\u003csub>2\u003c/sub> → 2H\u003csup>+\u003c/sup> + 2e\u003csup>−\u003c/sup> at the Pt, Cu\u003csup>2+\u003c/sup> + 2e\u003csup>−\u003c/sup> → Cu, and the voltmeter reads 0.34 V."}],"chalIntro":"Use the cell builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 uses \u003cstrong>Hydrogen reference\u003c/strong> mode. sup> ions at the anode.","_n":"40a4d","_k":"f7cc3cbb"},{"t":"“Electrons flow through the wire from Cu to Zn.”","why":"Electrons leave the anode, zinc. Higher \u003ci>E\u003c/i>° = stronger pull on electrons = \u003cstrong>reduction\u003c/strong> = cathode.","_n":"41a7d","_k":"b6622145"},{"t":"“Electrons flow through the salt bridge from Zn to Cu.”","why":"Electrons stay in the wire. \u003cstrong>Ions\u003c/strong> move through the salt bridge.","_n":"42a6d","_k":"f5201557"}]},"b":{"prompt":"Which description of a Mg–Ni cell is correct?","options":[{"t":"“Mg is the negative anode; electrons travel through the wire to the Ni cathode; cations in the bridge move toward the nickel beaker.”","why":"Mg (−2.37 V) is oxidized at the negative anode; cations move to the cathode.","_n":"4399d","_k":"4048c032"},{"t":"“Ni is the anode because Ni\u003csup>2+\u003c/sup> has the higher \u003ci>E\u003c/i>°.”","why":"Higher \u003ci>E\u003c/i>° = stronger pull on electrons = \u003cstrong>reduction\u003c/strong> = cathode.","_n":"4498d","_k":"ddd42ddb"},{"t":"“Mg is the positive anode.”","why":"In a galvanic cell the anode releases electrons, so it is the \u003cstrong>negative\u003c/strong> terminal.","_n":"459bd","_k":"fe807964"},{"t":"“Electrons travel through the bridge to Ni.”","why":"Electrons stay in the wire. \u003cstrong>Ions\u003c/strong> move through the salt bridge.","_n":"469cd","_k":"43f8ff1e"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why writing 2Ag\u003csup>+\u003c/sup> + 2e\u003csup>−\u003c/sup> → 2Ag doesn’t double silver’s \u003ci>E\u003c/i>°?","options":[{"t":"“\u003ci>E\u003c/i>° measures the energy per unit of charge, which doesn’t depend on how many electrons are written.”","why":"\u003ci>E\u003c/i>° is per unit of charge. Doubling the half-reaction doesn’t change it.","_n":"4799d","_k":"5b9e72ce"},{"t":"“Because the coefficients cancel in the overall equation.”","why":"That’s not why. \u003ci>E\u003c/i>° is per unit of charge. Doubling the half-reaction doesn’t change it.","_n":"489ad","_k":"b927bd56"},{"t":"“It does double, but you divide again at the end.”","why":"\u003ci>E\u003c/i>° is per unit of charge. Doubling the half-reaction doesn’t change it.","_n":"4997d","_k":"74711695"},{"t":"“Because silver is a precious metal.”","why":"Irrelevant.","_n":"4a98d","_k":"e7c41aba"}]},"b":{"prompt":"Which is the best explanation of why \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, rather than a sum?","options":[{"t":"“The rule is arbitrary.”","why":"It follows from the anode running in reverse.","_n":"4b95d","_k":"a6c08f8c"},{"t":"“Subtracting always gives a positive number.”","why":"Not always: negative means non-spontaneous.","_n":"4c96d","_k":"c4cd1d72"},{"t":"“Both table values are reduction potentials. The anode’s reaction runs in reverse, so its value is subtracted.”","why":"The table lists reductions; the anode runs backwards.","_n":"4da3d","_k":"13c7a77b"},{"t":"“The anode is negative, so its value is ignored.”","why":"It isn’t ignored.","_n":"4ea4d","_k":"557ee2c2"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Copper on a circuit board is etched away with Fe\u003csup>3+\u003c/sup> solution. Is the etching spontaneous, and what is \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub>?","options":[{"t":"Yes, +0.43 V","why":"0.77 − 0.34.","_n":"4f15d","_k":"82ebb3fb"},{"t":"No, −0.43 V","why":"Fe\u003csup>3+\u003c/sup>/Fe\u003csup>2+\u003c/sup> is the cathode. Higher \u003ci>E\u003c/i>° = stronger pull on electrons = \u003cstrong>reduction\u003c/strong> = cathode.","_n":"4g14d","_k":"c10e1054"},{"t":"No: copper doesn’t react with ions","why":"It reacts with ions higher in the table.","_n":"4h13d","_k":"996ab3f4"},{"t":"Yes, +1.11 V","why":"That adds the values. Use reduction potentials for both and subtract: \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>.","_n":"4i12d","_k":"6f667258"}]},"b":{"prompt":"Should copper(II) sulfate solution be stored in an iron container?","options":[{"t":"Yes: iron is stronger than copper, so it’s protected","why":"Iron is the stronger \u003cstrong>reducing agent\u003c/strong>, so it reacts.","_n":"4j19d","_k":"98f2f850"},{"t":"No: Fe + Cu\u003csup>2+\u003c/sup> is spontaneous (+0.79 V), so the iron would dissolve","why":"0.34 − (−0.45) = +0.79 V.","_n":"4k18d","_k":"6ecd8977"},{"t":"Yes: \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is negative","why":"Cu\u003csup>2+\u003c/sup>/Cu is higher, so it is the cathode. Higher \u003ci>E\u003c/i>° = stronger pull on electrons = \u003cstrong>reduction\u003c/strong> = cathode.","_n":"4l17d","_k":"076b51d4"},{"t":"No, because \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = −0.79 V","why":"The value is +0.79 V. Use reduction potentials for both and subtract: \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>.","_n":"4m16d","_k":"cb83b100"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"From Zn, Cu, Ag and Ni, which pair gives the largest cell voltage?","options":[{"t":"Zn–Cu (1.10 V)","why":"Ag is higher than Cu.","_n":"4n1dd","_k":"98c375e1"},{"t":"Cu–Ag (0.46 V)","why":"Pick the two farthest apart.","_n":"4o1cd","_k":"15a2377b"},{"t":"Ni–Ag (1.06 V)","why":"Zn is lower than Ni.","_n":"4p0fc","_k":"2b611eb3"},{"t":"Zn–Ag (1.56 V)","why":"Zn (−0.76) and Ag (+0.80) are the farthest apart.","_n":"4q10c","_k":"d44219f8"}]},"b":{"prompt":"From Mg, Pb, Cu and Ag, which pair gives the smallest positive voltage?","options":[{"t":"Cu–Ag (0.46 V)","why":"0.80 − 0.34 = 0.46 V: the two closest together.","_n":"4r11c","_k":"91f38d5a"},{"t":"Mg–Pb (2.24 V)","why":"Much farther apart.","_n":"4s12c","_k":"6690ad17"},{"t":"Pb–Cu (0.47 V)","why":"0.47 is just above 0.46.","_n":"4t13c","_k":"ca9df425"},{"t":"Pb–Ag (0.93 V)","why":"Farther apart.","_n":"4u14c","_k":"5d332633"}]}}]},"task":{"title":"A practical cell","summary":"A practical cell","statement":"\u003cp>Design a cell for a classroom kit. Choose the anode half-cell and the cathode half-cell. Can you find every design that works?\u003c/p>\u003col class=\"gc-conds\">\u003cli>It runs on its own: \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is positive as connected.\u003c/li>\u003cli>1.50 V ≤ \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> ≤ 2.00 V, close to a standard 1.5 V battery.\u003c/li>\u003cli>It uses no silver (too costly) and no lead (toxic).\u003c/li>\u003cli>No inert electrodes: both electrodes are metals in solutions of their own ions.\u003c/li>\u003c/ol>","checks":["Runs on its own","Near 1.5 V","No Ag, no Pb","Metal electrodes only"],"tips":["The cathode must be higher in the table than the anode.","Look for two \u003ci>E\u003c/i>° values 1.5–2.0 V apart.","Zn–Ag (1.56 V) and Al–Pb (1.53 V) are in range, but the kit rules them out.","Half-cells with Pt (H\u003csup>+\u003c/sup>, I\u003csub>2\u003c/sub>, Fe\u003csup>3+\u003c/sup>) don’t count."],"explainPrompt":"Explain how you chose the anode and cathode, and show the \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> calculation for one design.","vocab":"Use anode, cathode, reduction potential, \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> and spontaneous.","more":"There’s more than one design. Can you find them all?","afterAt":4,"after3":"Every answer uses a very reactive metal (Mg or Al) as the anode. To reach 1.5 V without silver, one half-cell must sit far down the table."},"cards":[["Galvanic cell","Two half-cells that turn a spontaneous redox reaction into an electric current."],["Anode","Where oxidation happens; the negative electrode in a galvanic cell."],["Cathode","Where reduction happens; the positive electrode in a galvanic cell."],["Salt bridge","Lets ions move (anions → anode, cations → cathode) so the beakers stay neutral."],["Electron path","Through the wire, anode → cathode; never through the bridge."],["\u003ci>E\u003c/i>°","Standard reduction potential: how strongly a half-reaction pulls electrons, vs the hydrogen electrode."],["\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub>","\u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub> (both reduction potentials, unchanged)."],["Which is the cathode?","The half-cell with the higher \u003ci>E\u003c/i>°."],["Spontaneous?","\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> > 0. Example: Ni + Pb\u003csup>2+\u003c/sup>: +0.13 V, even though both values are negative."],["Coefficients and \u003ci>E\u003c/i>°","Doubling a half-reaction never changes its \u003ci>E\u003c/i>°."],["Hydrogen electrode","Pt, H\u003csub>2\u003c/sub> at 100 kPa, 1.0 mol/L H\u003csup>+\u003c/sup>; defined as 0.00 V."],["Strongest agents","Strongest oxidizing agent: top left of the table (F\u003csub>2\u003c/sub>). Strongest reducing agent: bottom right (Li)."]]}};</script>
