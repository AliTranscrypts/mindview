 3(6) + 2 = 24\u003c/span> valence electrons → \u003cspan class=\"nw\">one C=O\u003c/span> and \u003cspan class=\"nw\">two C–O\u003csup>−\u003c/sup>\u003c/span>, with three resonance structures\u003c/span>","eqSize":"sm","eqLabel":"Carbonate, C O 3 2 minus: 4 plus 3 times 6 plus 2 equals 24 valence electrons, giving one C double bond O and two C single bond O minus, with three resonance structures","headline":"Count, connect, complete","text":"A \u003cstrong>Lewis diagram\u003c/strong> shows where every \u003cstrong>valence electron\u003c/strong> sits: in \u003cstrong>bonds\u003c/strong> or in \u003cstrong>lone pairs\u003c/strong>. Count the electrons, connect the atoms, complete the octets. When there’s a choice, \u003cstrong>formal charge\u003c/strong> picks the best structure, and \u003cstrong>resonance\u003c/strong> describes molecules that no single diagram fits.","fig":{"html":"\u003cdiv class=\"lw-hx\">\u003csvg class=\"lw-hx-svg\" id=\"lw-hx-svg\" viewBox=\"0 0 440 240\" role=\"img\" aria-label=\"An electron budget bar fills to 24. Carbonate’s skeleton appears: C in the centre with three O atoms. Single bonds draw in and lone pairs drop onto the O atoms until the bar is empty. Carbon flashes 6 electrons. A lone pair from the top O swings in to make C=O, and carbon shows 8. Formal charges appear: C 0, the double-bonded O 0, and −1 on each single-bonded O. The double bond slides to each O in turn, and the three structures merge into one blend with three identical dashed partial bonds.\">\u003c/svg>\u003cdiv class=\"lw-hx-row\">\u003cp class=\"lw-hx-cap\" id=\"lw-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"lw-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can count the total valence electrons in a molecule or polyatomic ion.","I can draw Lewis structures that follow the octet rule, including double and triple bonds.","I can draw expanded-octet structures for central atoms from period 3 on, and recognize boron’s incomplete octet.","I can calculate formal charges and use them to choose the best structure.","I can draw resonance structures and describe what the real structure is like."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Valence electrons","goal":1,"prompt":"How many valence electrons does a nitrogen atom have?","options":[{"t":"2","why":"Nitrogen is in period 2; it has 5 valence electrons.","_n":"0fd3","_k":"1c4ea19b"},{"t":"3","why":"Nitrogen usually forms 3 bonds, but it has 5 valence electrons.","_n":"1fe3","_k":"be34c837"},{"t":"5","why":"Group 15: 2s² 2p³.","_n":"2ff3","_k":"37202ce8"},{"t":"7","why":"7 is nitrogen’s atomic number.","_n":"3003","_k":"cd1b739e"}],"hints":["Valence electrons = outer shell.","2s² 2p³.","5."]},{"id":"w2","skill":"Valence electrons","goal":1,"prompt":"How many valence electrons are there in total in CO\u003csub>2\u003c/sub>?","options":[{"t":"10","why":"That counts only one oxygen.","_n":"4013","_k":"26d970e4"},{"t":"12","why":"Each O brings 6, not 4.","_n":"5023","_k":"3e693ad2"},{"t":"16","why":"4 + 2 × 6.","_n":"6033","_k":"e751d387"},{"t":"22","why":"22 adds atomic numbers (6 + 8 + 8).","_n":"7f43","_k":"aa9100ac"}],"hints":["C brings 4; each O brings 6.","4 + 6 + 6.","16."]},{"id":"w3","skill":"Ions and charge","goal":1,"prompt":"How does the number of electrons in Cl\u003csup>−\u003c/sup> compare with a neutral Cl atom?","options":[{"t":"One fewer","why":"A negative ion has gained an electron.","_n":"8f53","_k":"4b4f005a"},{"t":"One more","why":"The 1− charge means one extra electron.","_n":"9ed9","_k":"0a913d7e"},{"t":"The same","why":"The charge comes from the extra electron.","_n":"aec9","_k":"6748bbce"},{"t":"Seven more","why":"Only one electron is gained.","_n":"beb9","_k":"9699bdc0"}],"hints":["What does a negative charge mean?","More electrons than protons.","One more."]},{"id":"w4","skill":"Ions and charge","goal":1,"prompt":"How many valence electrons does the hydroxide ion, OH\u003csup>−\u003c/sup>, have?","options":[{"t":"6","why":"H contributes 1, and the charge adds 1.","_n":"cea9","_k":"a7f382ba"},{"t":"7","why":"Add 1 for the 1− charge.","_n":"df19","_k":"132ce884"},{"t":"8","why":"6 + 1 + 1 for the charge.","_n":"ef09","_k":"8e85f63b"},{"t":"9","why":"Only one extra electron for a 1− charge.","_n":"fef9","_k":"681ae2a8"}],"hints":["O 6, H 1.","Add one for the negative charge.","8."]},{"id":"w5","skill":"Electronegativity","goal":2,"prompt":"Using the course table, which of C, N, O and F has the lowest electronegativity?","use":"Course table (Pauling): C 2.55 · N 3.04 · O 3.44 · F 3.98","options":[{"t":"O (3.44)","why":"Oxygen is second highest.","_n":"gee9","_k":"0db4bfca"},{"t":"F (3.98)","why":"Fluorine has the highest.","_n":"he59","_k":"b4f13c0d"},{"t":"C (2.55)","why":"Electronegativity rises across period 2.","_n":"ie49","_k":"c2be91fe"},{"t":"N (3.04)","why":"N is higher than C.","_n":"j739","_k":"f0e402d3"}],"hints":["Look up the four values.","C 2.55, N 3.04, O 3.44, F 3.98.","C."]},{"id":"w6","skill":"Electronegativity","goal":4,"prompt":"In a C–O bond, which atom pulls the shared electrons more strongly?","options":[{"t":"O","why":"3.44 > 2.55.","_n":"k749","_k":"10745e26"},{"t":"Both equally","why":"Their values differ by 0.89.","_n":"l719","_k":"23705a0b"},{"t":"Neither; covalent bonds share equally","why":"Only identical atoms share exactly equally.","_n":"m729","_k":"f611e4cd"},{"t":"C","why":"Carbon’s value is lower.","_n":"n6f9","_k":"994ebc05"}],"hints":["Compare electronegativities.","O 3.44, C 2.55.","O."]}],"refreshers":{"Valence electrons":"Main-group atoms: the group’s last digit (C 4, N 5, O 6, halogens 7, noble gases 8). Add them up for the molecule.","Ions and charge":"Negative ion: add 1 electron per unit of charge. Positive ion: subtract.","Electronegativity":"How strongly an atom pulls bonding electrons. It rises across a period and falls down a group. Use the course table."}}},"explore":{"heading":"Lewis builder","intro":"Build each species from its electron budget. The builder checks every octet and every formal charge as you go.","how":"Pick a species and a mode. Choose \u003cstrong>Make central\u003c/strong> and tap an atom, then use \u003cstrong>Bond\u003c/strong> (tap two atoms; tap them again to raise the bond to double, then triple) and \u003cstrong>Lone pair\u003c/strong> (tap an atom). \u003cstrong>Remove\u003c/strong> takes away one lone pair or one bond pair. Keyboard: Tab moves between atoms; B starts a bond to the next atom you choose; L adds a lone pair; Delete removes.","species":["h2o","nh3","ch4","co2","hcn","ch2o","n2","nh4","h3o","oh","co3","no3","no2","o3","bf3","pcl5","sf4","sf6","clf3","xef2","ocn"],"modes":[{"id":"build","t":"Build"},{"id":"guided","t":"Guided"},{"id":"res","t":"Resonance"}],"tools":[{"id":"central","t":"Make central"},{"id":"bond","t":"Bond"},{"id":"lp","t":"Lone pair"},{"id":"remove","t":"Remove"}],"steps":["Count the total valence electrons, adding one for each negative charge and subtracting one for each positive charge.","Choose the central atom: usually the least electronegative, and never H.","Join the atoms with single bonds.","Complete the octets of the outer atoms.","Put any leftover electrons on the central atom.","If the central atom is still short of an octet, turn outer lone pairs into double or triple bonds."],"resHow":"Tap a double bond, then another bonded atom, to move it. \u003cstrong>Show each structure\u003c/strong> steps through the equivalent structures; \u003cstrong>Blend\u003c/strong> shows the real species.","predictions":[{"id":"p1","prompt":"All 16 electrons are placed, but carbon has only 4. What fixes it?","options":[{"t":"Move a lone pair from each O into a double bond","_n":"o709","_k":"0f832b1e"},{"t":"Give carbon two lone pairs","_n":"p6d9","_k":"b57e1bd9"},{"t":"Add 4 more electrons to carbon","_n":"q6e9","_k":"1cb93415"},{"t":"Nothing: carbon is fine with 4","_n":"r6b9","_k":"17324235"}],"explain":"The budget is fixed at 16. Sharing more pairs gives carbon its octet without adding electrons."},{"id":"p2","prompt":"How many valence electrons does NH\u003csub>4\u003c/sub>\u003csup>+\u003c/sup> have?","options":[{"t":"8","_n":"s6c9","_k":"6285cf66"},{"t":"9","_n":"t599","_k":"ec605a8d"},{"t":"10","_n":"u589","_k":"b1911ec9"},{"t":"11","_n":"v5b9","_k":"bf97317c"}],"explain":"Subtract one electron for the 1+ charge. 9 forgets the charge; 10 adds instead of subtracting; 11 uses nitrogen’s atomic number."},{"id":"p3","prompt":"How many equivalent resonance structures does nitrate have?","options":[{"t":"1","_n":"w5a9","_k":"8a342896"},{"t":"2","_n":"x5d9","_k":"447ad990"},{"t":"3","_n":"y5c9","_k":"184a44f9"},{"t":"4","_n":"z5f9","_k":"05a2aa8c"}],"explain":"Nitrate isn’t switching between the three. It is one structure with identical bonds."},{"id":"p4","prompt":"How many electrons surround sulfur in SF\u003csub>6\u003c/sub>?","options":[{"t":"6","_n":"105e9","_k":"7248355e"},{"t":"8","_n":"11619","_k":"58fc1fe6"},{"t":"12","_n":"12609","_k":"a9a70ff7"},{"t":"48","_n":"135f9","_k":"f3142506"}],"explain":"Sulfur is in period 3, and atoms from period 3 on can hold more than 8. A carbon atom could never do this."}],"predIntro":"Each prediction sets up the builder. Choose an answer, then watch the builder show what happens.","chalIntro":"Build each species in the Lewis builder, then press \u003cstrong>Check challenge\u003c/strong>. The builder remembers every species, so you can switch back and forth. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"sp":"ch2o","prompt":"Build methanal (CH\u003csub>2\u003c/sub>O) with every atom satisfied and all 12 electrons used.","why":"Carbon in the centre with two C–H bonds and C=O; O keeps two lone pairs. Every octet is full and every formal charge is 0.","hints":["Count: 4 + 2 + 6 = 12.","Skeleton: H–C(–H)–O; complete O’s octet.","Carbon is short by 2, so make C=O; O keeps two lone pairs."]},{"id":"tc2","goal":1,"sp":"co3","prompt":"Build the carbonate ion with formal charges that add up to the ion’s charge.","why":"One C=O and two C–O with three lone pairs each: 24 electrons, and the formal charges 0 + 0 − 1 − 1 add up to −2, the ion’s charge.","hints":["24 electrons.","Three single bonds and full O octets use 24, but C has only 6.","One O lends a pair: C=O. The two single-bonded O atoms carry −1 each."]},{"id":"tc3","goal":4,"sp":"ocn","stretch":true,"prompt":"The cyanate ion, OCN\u003csup>−\u003c/sup> (C in the centre), can be drawn three ways. Build the one with the best formal charges.","why":"[O–C≡N]\u003csup>−\u003c/sup>: O −1, C 0, N 0. Only one atom is charged, and the −1 sits on oxygen, the most electronegative atom.","hints":["Count: 6 + 4 + 5 + 1 = 16.","Build all three bond patterns and turn on formal charges.","Two of them have one −1; choose the one that puts it on oxygen."]}],"msgs":{"tc1":{"single":"Carbon has only 6. Make a double bond.","ocentre":"Carbon is less electronegative. Put it in the centre."},"tc2":{"e22":"Add 2 for the 2− charge.","twoDouble":"Carbon would have 10. Period-2 atoms stop at 8."},"tc3":{"oddN":"Valid, but the −1 sits on N; O is more electronegative (3.44 vs 3.04), so the −1 belongs on O.","tripleO":"Large charges, and a positive charge on the most electronegative atom: the worst choice.","centre":"Carbon is the least electronegative, so it goes in the centre."},"m1":"A negative charge means extra electrons: add 2 for CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>. A positive charge means fewer: subtract 1 for NH\u003csub>4\u003c/sub>\u003csup>+\u003c/sup>.","m2":"Lewis diagrams show only valence electrons: carbon brings 4, not 6.","m3":"H forms only one bond, so it’s never central. The central atom is usually the least electronegative atom.","m4":"Carbon, nitrogen and oxygen never exceed 8 valence electrons. Only atoms from period 3 on can expand.","m7":"If the central atom has fewer than 8, move an outer lone pair into a double bond."},"blocks":[{"title":"The big idea","html":"\u003cp>The electron count fixes everything. Formal charge chooses among valid options. Resonance is a blend, not a flip.\u003c/p>"}]},"part3":{"slug":"formal-charge","name":"Best structure","heading":"Choose the best structure","intro":"Several structures can obey the octet rule. Here you calculate formal charges, compare candidate structures and check the choice against measured bond lengths.","s1":{"title":"Station 1: The formal-charge calculator","intro":"Pick a finished structure, then tap any atom to see its formal charge worked out. Each term lights up on the diagram as it’s counted.","list":["no3","co3","no2","o3","nh4","ocn"]},"s2":{"title":"Station 2: The three rules","intro":"Each pair obeys the octet rule. Tap the better structure, choose the rule that decides, then press \u003cstrong>Check\u003c/strong>.","rules":[{"id":"r1","t":"Formal charges closest to 0"},{"id":"r2","t":"Negative charge on the more electronegative atom"},{"id":"r3","t":"Formal charges add up to the species’ charge"}],"r3note":"Both structures add up to the species’ charge, so this rule can’t choose between them. It’s checked automatically below each pair.","pairs":[{"id":"co2","sp":"co2","title":"CO\u003csub>2\u003c/sub>: O=C=O or O≡C–O?","show":["a","b"],"_a":"TxoAUBZEEVwWWUAZR0JGClEaWBcXAREb","labels":{"a":"O=C=O","b":"O≡C–O"},"wrongPick":"O≡C–O carries +1 and −1; O=C=O has every formal charge 0.","wrongRule":"Both structures have their negative charge, if any, on O. What decides is that O=C=O has no formal charges at all.","right":"O=C=O: every formal charge is 0, as close to 0 as possible."},{"id":"n2o","sp":"n2o","title":"N\u003csub>2\u003c/sub>O (N in the centre): N≡N–O or N=N=O?","show":["b","a"],"_a":"TxoAUBZEEVwWWUAZR0JGClEaWBcXAhEb","labels":{"a":"N≡N–O","b":"N=N=O"},"wrongPick":"N=N=O puts the −1 on N. O is more electronegative (3.44 vs 3.04), so the −1 belongs on O.","wrongRule":"Both have one +1 and one −1, so they’re equally close to 0. Look at where the −1 sits.","right":"N≡N–O: the −1 sits on O, the most electronegative atom."},{"id":"ocn","sp":"ocn","title":"OCN\u003csup>−\u003c/sup> (from challenge 3): O–C≡N or O=C=N?","show":["b","a"],"_a":"TxoAUBZEEVwWWUAZR0JGClEaWBcXAhEb","labels":{"a":"[O–C≡N]\u003csup>−\u003c/sup>","b":"[O=C=N]\u003csup>−\u003c/sup>"},"wrongPick":"Both have one −1. O=C=N puts it on N; O is more electronegative, so the −1 belongs on O.","wrongRule":"Both have a single −1, so they’re equally close to 0. Look at which atom carries it.","right":"O–C≡N: the −1 sits on O, the more electronegative atom."}]},"s3":{"title":"Station 3: Check it with data","intro":"Measured bond lengths are evidence for resonance. A double bond is shorter than a single bond between the same atoms.","table":{"head":["Bond","Length (pm)"],"rows":[["C–O (typical single)","≈ 143"],["C=O (typical double)","≈ 120"],["All three C–O in CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>","≈ 129"],["O–O (single)","≈ 148"],["O=O","≈ 121"],["Both O–O in O\u003csub>3\u003c/sub>","≈ 128"]]},"tableNote":"Approximate values (course table additions).","ask":"Drag the marker (or use the arrow keys) to the measured length from the table, then press \u003cstrong>Check\u003c/strong>.","scales":[{"id":"co3","bond":"C–O","what":"each C–O bond in CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>","single":143,"dbl":120,"measured":129,"order":"1⅓","done":"129 pm sits between a single C–O (143 pm) and a double C=O (120 pm). All three C–O bonds are the same blend, bond order about 1⅓. A flip between structures would give two different lengths."},{"id":"o3","bond":"O–O","what":"each O–O bond in O\u003csub>3\u003c/sub>","single":148,"dbl":121,"measured":128,"order":"1½","done":"128 pm sits between O–O (148 pm) and O=O (121 pm). Both bonds are the same blend, bond order about 1½."}],"wrong":"Read the measured length from the table: it’s the third value for this species."},"quickCheck":{"title":"Q ,{"t":"−4","fb":"They always add up to the species’ charge.","_n":"1ie0a","_k":"f066f70e"},{"t":"+2","fb":"They always add up to the species’ charge.","_n":"1jdfa","_k":"88392ae8"}]}]}},"practice":{"activities":[{"id":"count","type":"custom","title":"Count and build","summary":"Count and build","goal":[1,2,3],"instruction":"Enter the total valence electrons and the number of lone pairs on the central atom, then build the species to confirm.","how":"Type both numbers and press \u003cstrong>Check\u003c/strong>. Then press \u003cstrong>Build it\u003c/strong> to confirm in the builder below the list.","labels":{"ve":"Valence electrons","lp":"Lone pairs on the central atom"},"general":{"ve":"Add each atom’s valence electrons, then adjust for any charge.","lp":"Subtract the bonding electrons and the outer atoms’ lone-pair electrons from the total. Pairs left over go on the centre."},"items":[{"id":"c1","sp":"h2o","goal":1,"_a":"bwBOBzg=","wrong":[{"ve":10,"fb":"Use valence electrons, not atomic numbers."}],"hints":["O 6 + 2 × H 1.","Two O–H bonds use 4; H atoms need no lone pairs.","8 − 4 = 4 left: two lone pairs on O."]},{"id":"c2","sp":"nh3","goal":1,"_a":"bwBOBDg=","hints":["N 5 + 3 × H 1.","Three N–H bonds use 6.","8 − 6 = 2 left: one lone pair on N."]},{"id":"c3","sp":"hcn","goal":2,"_a":"bwlSGVVt","note":"(on C)","wrong":[{"ve":16,"fb":"Lewis diagrams show only valence electrons: carbon brings 4, not 6."}],"hints":["H 1 + C 4 + N 5.","H–C and C–N use 4; N takes 6 as lone pairs, so C has only 4.","Two N pairs move in to make C≡N: no lone pairs on C, one on N."]},{"id":"c4","sp":"co3","goal":1,"_a":"bwpWGVVt","wrong":[{"ve":22,"fb":"A negative charge means extra electrons: add 2 for CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>. A positive charge means fewer: subtract 1 for NH\u003csub>4\u003c/sub>\u003csup>+\u003c/sup>."}],"hints":["C 4 + 3 × O 6, plus 2 for the 2− charge.","Three bonds use 6; each O needs 6 more (18).","24 − 6 − 18 = 0: none left for C. C has only 6, so one O lends a pair (C=O). No lone pairs on C."]},{"id":"c5","sp":"nh4","goal":1,"_a":"bwBOBTg=","wrong":[{"ve":10,"fb":"A negative charge means extra electrons: add 2 for CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>. A positive charge means fewer: subtract 1 for NH\u003csub>4\u003c/sub>\u003csup>+\u003c/sup>."}],"hints":["N 5 + 4 × H 1, minus 1 for the 1+ charge.","Four N–H bonds use 8.","8 − 8 = 0: no lone pairs on N."]},{"id":"c6","sp":"bf3","goal":3,"_a":"bwpWGVVt","note":"(B has 6)","wrong":[{"lp":1,"fb":"Boron is stable with 6 here; don’t force a double bond."}],"lpfb":"Boron is stable with 6 here; don’t force a double bond.","hints":["B 3 + 3 × F 7.","Three bonds use 6; each F needs 6 more (18).","24 − 6 − 18 = 0: no lone pairs on B. Boron is stable with 6 here."]},{"id":"c7","sp":"sf4","goal":3,"_a":"bwtWGVRt","wrong":[{"lp":0,"fb":"34 − 8 (bonds) − 24 (F lone pairs) = 2 left: one pair on S."}],"hints":["S 6 + 4 × 7.","Four bonds use 8; each F needs 6 more.","34 − 8 − 24 = 2: one lone pair on S."]},{"id":"c8","sp":"xef2","goal":3,"_a":"bwpQGVZt","wrong":[{"lp":1,"fb":"22 − 4 − 12 = 6: three pairs on Xe."}],"hints":["Xe 8 + 2 × F 7.","Two bonds use 4; each F needs 6 more (12).","22 − 4 − 12 = 6: three lone pairs on Xe."]}]},{"id":"best","type":"custom","title":"Which structure is best?","summary":"Which structure is best?","star":true,"goal":[3,4,5],"instruction":"Six items. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Tap a choice, then press \u003cstrong>Check\u003c/strong>.","items":[{"id":"r1","goal":3,"prompt":"Lone pairs on Cl in ClF\u003csub>3\u003c/sub>?","options":[{"t":"0","why":"28 − 6 − 18 = 4: two pairs.","_n":"1kdea","_k":"82890c96"},{"t":"1","why":"28 − 6 − 18 = 4: two pairs.","_n":"1leda","_k":"48d7010f"},{"t":"2","why":"28 − 6 − 18 = 4: two pairs.","_n":"1meca","_k":"737c9d8e"},{"t":"3","why":"28 − 6 − 18 = 4: two pairs.","_n":"1neba","_k":"2a8f073f"}],"hints":["Cl 7 + 3 × F 7 = 28.","Three bonds use 6; the F atoms’ lone pairs use 18.","28 − 6 − 18 = 4: two lone pairs on Cl."]},{"id":"r2","goal":5,"prompt":"Resonance structures for O\u003csub>3\u003c/sub>?","options":[{"t":"1","why":"The double bond can sit on either side.","_n":"1oeca","_k":"f8e7fee3"},{"t":"2","why":"The double bond can sit on either side.","_n":"1pe9a","_k":"a5119725"},{"t":"3","why":"Only the two end atoms can carry the double bond.","_n":"1qeaa","_k":"de05ac43"},{"t":"4","why":"Only the two end atoms can carry the double bond.","_n":"1refa","_k":"c6df2fef"}],"hints":["Ozone has 18 electrons: O=O–O.","Which O atoms could carry the double bond?","Either end: 2 structures."]},{"id":"r3","goal":4,"star":true,"prompt":"Formal charge on N in NO\u003csub>3\u003c/sub>\u003csup>−\u003c/sup>?","options":[{"t":"+2","why":"FC = valence − lone-pair electrons − (bonding electrons ÷ 2). 5 − 0 − 8 ÷ 2.","_n":"1sf0a","_k":"87fb6c45"},{"t":"0","why":"FC = valence − lone-pair electrons − (bonding electrons ÷ 2). 5 − 0 − 8 ÷ 2.","_n":"1teda","_k":"f63d77e7"},{"t":"−1","why":"FC = valence − lone-pair electrons − (bonding electrons ÷ 2). 5 − 0 − 8 ÷ 2.","_n":"1ueea","_k":"52e88dfb"},{"t":"+1","why":"5 − 0 − 8 ÷ 2 = +1.","_n":"1ve3a","_k":"f14ab5ed"}],"hints":["N has 5 valence electrons.","In nitrate N has no lone pairs and four bonding pairs (8 electrons).","5 − 0 − 8 ÷ 2 = +1."]},{"id":"r4","goal":5,"star":true,"prompt":"Nitrite (NO\u003csub>2\u003c/sub>\u003csup>−\u003c/sup>): how many lone pairs on N, and how many resonance structures?","options":[{"t":"1 lone pair; 1 structure","why":"18 electrons: O=N–O\u003csup>−\u003c/sup> with one pair on N; the double bond can sit on either O.","_n":"1we4a","_k":"8bbf253c"},{"t":"2 lone pairs; 2 structures","why":"18 electrons: O=N–O\u003csup>−\u003c/sup> with one pair on N; the double bond can sit on either O.","_n":"1xf1a","_k":"21efd007"},{"t":"1 lone pair; 2 structures","why":"18 electrons: O=N–O\u003csup>−\u003c/sup> with one pair on N; the double bond can sit on either O.","_n":"1yf0a","_k":"9a92ca50"},{"t":"0 lone pairs; 2 structures","why":"18 electrons: O=N–O\u003csup>−\u003c/sup> with one pair on N; the double bond can sit on either O.","_n":"1zf3a","_k":"92c49da7"}],"hints":["Count: 5 + 2 × 6 + 1 = 18.","Two bonds and full O octets use 16; 2 left go on N, which then has 6.","One O lends a pair: O=N–O\u003csup>−\u003c/sup>, one lone pair on N, and the double bond can sit on either O."]},{"id":"r5","goal":5,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> Both N–O bonds in nitrite measure ≈ 124 pm, between N–O (≈ 140 pm) and N=O (≈ 120 pm). \u003cspan class=\"tiny muted\">(course table addition)\u003c/span> Which conclusion does the evidence support?","options":[{"t":"The bonds are identical, a resonance blend","why":"One length between single and double: each bond is the same blend.","_n":"20f2a","_k":"30f53ff6"},{"t":"One single and one double","why":"That predicts two different lengths, but the data show one.","_n":"21eda","_k":"230205ef"},{"t":"The ion flips between two structures","why":"The real ion is a single blend: all three N–O bonds in nitrate are identical.","_n":"22eca","_k":"81cbb443"}],"hints":["How many different lengths were measured?","One length, partway between single and double.","Both bonds are the same blend: a resonance hybrid."]},{"id":"r6","goal":4,"star":true,"prompt":"HCN or HNC: which arrangement has every formal charge 0?","options":[{"t":"HCN","why":"In H–C≡N, C is 4 − 0 − 4 = 0 and N is 5 − 2 − 3 = 0.","_n":"23efa","_k":"2f183b68"},{"t":"HNC","why":"In H–N≡C, N is +1 and C is −1.","_n":"24eea","_k":"54b2318f"}],"hints":["Both have 10 electrons with a triple bond.","Compute the formal charges for H–C≡N.","C: 4 − 2 − 3 = −1 in HNC; in HCN, C is 4 − 0 − 4 = 0 and N is 5 − 2 − 3 = 0."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ingrid","how":"","goal":[1,2,4],"instruction":"Ingrid made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Draw the Lewis structure of the hydronium ion, H\u003csub>3\u003c/sub>O\u003csup>+\u003c/sup>.","steps":["Valence electrons: 6 + 3 + 1 = 10, adding 1 for the positive charge.","Three O–H bonds use 6 electrons.","The remaining 4 go on O as two lone pairs.","O has 10 electrons, which is fine."],"_a":"BA==","stepFb":["","Step 2 is fine on its own; the count before it is wrong.","Step 3 follows the wrong count.","Step 4 follows the earlier mistake."],"fixes":[{"t":"Subtract 1 for the 1+ charge: 6 + 3 − 1 = 8, so O has three bonds and one lone pair.","why":"8 electrons: three O–H bonds use 6, and the last 2 make one lone pair on O.","_n":"25e9a","_k":"846c425d"},{"t":"Step 1 is correct.","why":"A negative charge means extra electrons: add 2 for CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>. A positive charge means fewer: subtract 1 for NH\u003csub>4\u003c/sub>\u003csup>+\u003c/sup>.","_n":"26e8a","_k":"56a2aeac"},{"t":"Use oxygen’s atomic number, 8.","why":"Lewis diagrams show only valence electrons: carbon brings 4, not 6.","_n":"27d78","_k":"2bd86a0a"},{"t":"Add 3 more for the three H atoms.","why":"They’re already counted.","_n":"28d88","_k":"9c16c34a"}],"hints":["Does a positive ion have more or fewer electrons?","Fewer.","8 electrons: one lone pair on O."]},{"id":"e2","goal":2,"task":"Draw HCN.","steps":["Valence electrons: 1 + 4 + 5 = 10.","Skeleton H–C–N with single bonds uses 4.","Put 6 electrons on N as lone pairs: N has 8.","All 10 electrons are used, so the structure is done, even though C has 4."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Put a lone pair on H.","why":"H holds only 2 electrons.","_n":"29d98","_k":"d26b950a"},{"t":"Add 4 electrons to C.","why":"The budget is fixed at 10.","_n":"2ada8","_k":"8f21628a"},{"t":"Step 4 is correct.","why":"If the central atom has fewer than 8, move an outer lone pair into a double bond.","_n":"2bdb8","_k":"f5c73b12"},{"t":"Move two N lone pairs into the C–N bond: H–C≡N with one lone pair on N, so both C and N have 8.","why":"Two more shared pairs give C its octet, and the budget stays at 10.","_n":"2cdc8","_k":"097ff96d"}],"hints":["Does carbon have an octet?","No: 4.","Make a triple bond."]},{"id":"e3","goal":4,"task":"Choose the better structure for CO\u003csub>2\u003c/sub>: O=C=O or O≡C–O.","steps":["Both use 16 electrons, and every atom has an octet.","In O=C=O, every formal charge is 0.","In O≡C–O, the formal charges are +1, 0 and −1.","Both add up to 0, so they’re equally good."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Neither is valid.","why":"Both obey the octet rule.","_n":"2ddd8","_k":"ac7a504a"},{"t":"Adding up to the charge is required, but the best structure has formal charges closest to 0 on every atom: O=C=O.","why":"Every formal charge in O=C=O is 0, so it’s the better structure.","_n":"2ede8","_k":"8318640d"},{"t":"Step 4 is correct.","why":"FC = valence − lone-pair electrons − (bonding electrons ÷ 2).","_n":"2fdf8","_k":"649d7702"},{"t":"O≡C–O is better because triple bonds are stronger.","why":"Bond strength isn’t the rule.","_n":"2ge08","_k":"418e8002"}],"hints":["What’s the first formal-charge rule?","Keep each charge as close to 0 as possible.","O=C=O."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result surprised you most: the 1+ charge removing an electron, the triple bond in HCN, or sulfur holding 12?"},{"id":"j2","q":"In your own words, why can sulfur expand its octet when oxygen can’t?"},{"id":"j3","q":"Explain to a friend how formal charge helps you choose between two Lewis structures."},{"id":"j4","q":"What part of drawing Lewis structures still slows you down? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"How many valence electrons does the nitrate ion, NO\u003csub>3\u003c/sub>\u003csup>−\u003c/sup>, have in total?","options":[{"t":"22","why":"A negative charge adds electrons; it doesn’t subtract them.","_n":"2hdd8","_k":"91916be6"},{"t":"23","why":"Add 1 for the 1− charge.","_n":"2idc8","_k":"4f1a7870"},{"t":"24","why":"5 + 3 × 6 + 1.","_n":"2jdb8","_k":"5550981d"},{"t":"32","why":"That uses atomic numbers (7 + 24) plus 1.","_n":"2kda8","_k":"efc00740"}]},"b":{"prompt":"How many valence electrons does the phosphate ion, PO\u003csub>4\u003c/sub>\u003csup>3−\u003c/sup>, have in total?","options":[{"t":"26","why":"Adding, not subtracting.","_n":"2le18","_k":"70ec5270"},{"t":"29","why":"Add 3 for the 3− charge.","_n":"2me08","_k":"de977914"},{"t":"32","why":"5 + 4 × 6 + 3.","_n":"2ndf8","_k":"ef8f5b0d"},{"t":"50","why":"Atomic numbers (15 + 32) plus 3.","_n":"2ode8","_k":"f10b76f0"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which molecule has an expanded octet on its central atom?","options":[{"t":"CF\u003csub>4\u003c/sub>","why":"Carbon has 8.","_n":"2pe58","_k":"43df2c10"},{"t":"PCl\u003csub>5\u003c/sub>","why":"Phosphorus (period 3) holds 10.","_n":"2qe48","_k":"d3182eaf"},{"t":"NF\u003csub>3\u003c/sub>","why":"Nitrogen (period 2) has exactly 8.","_n":"2r258","_k":"9a87c44f"},{"t":"OF\u003csub>2\u003c/sub>","why":"Oxygen has 8.","_n":"2s248","_k":"bb9b3cbb"}]},"b":{"prompt":"Which molecule has a central atom with fewer than 8 electrons?","options":[{"t":"NH\u003csub>3\u003c/sub>","why":"Nitrogen has 8 (three bonds and a lone pair).","_n":"2t278","_k":"2c10e18b"},{"t":"CH\u003csub>4\u003c/sub>","why":"Carbon has 8.","_n":"2u268","_k":"4049d8af"},{"t":"BF\u003csub>3\u003c/sub>","why":"Boron has 6.","_n":"2v298","_k":"b699088c"},{"t":"H\u003csub>2\u003c/sub>O","why":"Oxygen has 8.","_n":"2w288","_k":"21108fd3"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"How many equivalent resonance structures does the carbonate ion have?","options":[{"t":"1","why":"Three equivalent placements exist.","_n":"2x2b8","_k":"a9cdcc0a"},{"t":"2","why":"There are three O atoms.","_n":"2y2a8","_k":"8bfbcc84"},{"t":"3","why":"The double bond can sit on any of the three O atoms.","_n":"2z2d8","_k":"31abcc39"},{"t":"4","why":"Only three oxygens can carry it.","_n":"302c8","_k":"692e6068"}]},"b":{"prompt":"How many equivalent resonance structures does ozone have?","options":[{"t":"1","why":"Two placements exist.","_n":"31bf7","_k":"5349d665"},{"t":"2","why":"The double bond can sit on either end.","_n":"32c07","_k":"8e19d82c"},{"t":"3","why":"Only the two end atoms can carry it.","_n":"33bd7","_k":"fd8e131d"},{"t":"4","why":"There are only two O–O bonds.","_n":"34be7","_k":"e9d440c3"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"In the best structure of ozone (O=O–O), what are the formal charges on the central O, the double-bonded O and the single-bonded O?","options":[{"t":"−1, 0, +1","why":"Swapped: the central O has only one lone pair.","_n":"35bb7","_k":"1553950d"},{"t":"0, 0, 0","why":"Count each lone-pair electron, and half of each bond’s electrons.","_n":"36bc7","_k":"d9e3007f"},{"t":"+1, 0, −1","why":"Central: 6 − 2 − 3 = +1; double-bonded: 6 − 4 − 2 = 0; single-bonded: 6 − 6 − 1 = −1.","_n":"37b97","_k":"57ee18bf"},{"t":"+2, 0, −2","why":"Use half the bonding electrons, not all of them.","_n":"38ba7","_k":"913c96eb"}]},"b":{"prompt":"In the best structure of nitrite (O=N–O\u003csup>−\u003c/sup>), what are the formal charges on N, the double-bonded O and the single-bonded O?","options":[{"t":"0, 0, −1","why":"N: 5 − 2 − 3 = 0; O(=): 6 − 4 − 2 = 0; O(–): 6 − 6 − 1 = −1.","_n":"39b77","_k":"3afe31cf"},{"t":"0, 0, 0","why":"They must add up to −1.","_n":"3ab87","_k":"aacb64ef"},{"t":"+1, 0, −2","why":"The single-bonded O is 6 − 6 − 1.","_n":"3bb97","_k":"6d37e875"},{"t":"−1, 0, 0","why":"N has one lone pair and three bonds, so its formal charge is 0.","_n":"3cb87","_k":"c3de74b1"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Which is the best Lewis structure of N\u003csub>2\u003c/sub>O (N in the centre)?","options":[{"t":"N=N=O, with −1, +1, 0","why":"Valid, but the −1 sits on N instead of O.","_n":"3db77","_k":"af40272d"},{"t":"N–N≡O, with −2, +1, +1","why":"Large charges, and + on O.","_n":"3eb67","_k":"f338a139"},{"t":"N=O=N, with O in the centre","why":"The most electronegative atom shouldn’t be central.","_n":"3fbd7","_k":"d9091e1c"},{"t":"N≡N–O, with formal charges 0, +1, −1","why":"The negative charge sits on O, the most electronegative atom.","_n":"3gbc7","_k":"fc93be9d"}]},"b":{"prompt":"Which is the best Lewis structure of the cyanate ion, OCN\u003csup>−\u003c/sup>?","options":[{"t":"[O≡C–N]\u003csup>−\u003c/sup>, with +1, 0, −2","why":"Large charges.","_n":"3hbb7","_k":"64f70244"},{"t":"[O=C=N]\u003csup>−\u003c/sup>, with 0, 0, −1","why":"Valid, but the −1 is on the less electronegative N.","_n":"3iba7","_k":"1f29f3de"},{"t":"[O–C≡N]\u003csup>−\u003c/sup>, with formal charges −1, 0, 0","why":"The −1 sits on O.","_n":"3jb17","_k":"0d744d62"},{"t":"[O–N≡C]\u003csup>−\u003c/sup>, with N in the centre","why":"Carbon, the least electronegative, belongs in the centre.","_n":"3kb07","_k":"615378f1"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"How many lone pairs are on the central atom of XeF\u003csub>4\u003c/sub>?","options":[{"t":"0","why":"Xenon can hold more than 8.","_n":"3lb37","_k":"2e622d21"},{"t":"1","why":"36 − 8 − 24 = 4 electrons, which is two pairs.","_n":"3mb47","_k":"85cdf147"},{"t":"2","why":"8 + 28 = 36; 4 bonds (8) and 24 for the F atoms leave 4, or two pairs.","_n":"3nb57","_k":"c2733bc2"},{"t":"4","why":"4 is the number of electrons left, not pairs.","_n":"3ob67","_k":"26889eff"}]},"b":{"prompt":"How many lone pairs are on the central atom of ICl\u003csub>4\u003c/sub>\u003csup>−\u003c/sup>?","options":[{"t":"0","why":"Iodine expands.","_n":"3pb77","_k":"c99975a9"},{"t":"1","why":"Add 1 for the charge: 36, not 35.","_n":"3qb87","_k":"49aede1f"},{"t":"2","why":"7 + 28 + 1 = 36; 36 − 8 − 24 = 4, or two pairs.","_n":"3rb97","_k":"a288ab52"},{"t":"3","why":"Four electrons remain: two pairs.","_n":"3sba7","_k":"4831d808"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which statement best describes the real structure of the nitrate ion?","options":[{"t":"“It switches rapidly among three structures.”","why":"The real ion is a single blend: all three N–O bonds in nitrate are identical.","_n":"3tab7","_k":"8d86349d"},{"t":"“It has one N=O and two N–O bonds that never change.”","why":"The measured bonds are identical.","_n":"3uac7","_k":"bd0b2cc9"},{"t":"“It is one structure in which all three N–O bonds are identical, partway between single and double.”","why":"The real ion is a single blend: all three N–O bonds in nitrate are identical.","_n":"3vbd8","_k":"08215006"},{"t":"“It has three N=O double bonds.”","why":"Nitrogen would have 12.","_n":"3wbc8","_k":"468f39d3"}]},"b":{"prompt":"Which statement best describes the real structure of ozone?","options":[{"t":"“It flips between two structures.”","why":"The real molecule is a single blend: both O–O bonds in ozone are identical.","_n":"3xbf8","_k":"2510d965"},{"t":"“It has two O=O double bonds.”","why":"The central O would have 10.","_n":"3ybe8","_k":"39786b2b"},{"t":"“It is one structure with two identical O–O bonds, partway between single and double.”","why":"The real molecule is a single blend: both O–O bonds in ozone are identical.","_n":"3zb98","_k":"24a1479b"},{"t":"“It has one O=O and one O–O that differ in length.”","why":"The measured lengths are equal.","_n":"40b88","_k":"915edc72"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which description of HCN’s Lewis structure is correct?","options":[{"t":"“H–C=N, with two lone pairs on N.”","why":"Carbon would have only 6.","_n":"41bb8","_k":"f8c98e2d"},{"t":"“H=C≡N.”","why":"H forms only one bond.","_n":"42ba8","_k":"20782901"},{"t":"“H–N≡C, with one lone pair on C.”","why":"This puts the wrong atom in the centre.","_n":"43b58","_k":"4da9ffe8"},{"t":"“H–C≡N, with one lone pair on N.”","why":"C and N each have 8, H has 2, and every formal charge is 0.","_n":"44b48","_k":"81887d75"}]},"b":{"prompt":"Which description of methanal’s (CH\u003csub>2\u003c/sub>O’s) Lewis structure is correct?","options":[{"t":"“C≡O, with one lone pair on O.”","why":"Carbon would have 10.","_n":"45b78","_k":"7f98f3fc"},{"t":"“C–O single bond, with three lone pairs on O.”","why":"Carbon would have 6.","_n":"46b88","_k":"00e05464"},{"t":"“C in the centre with two C–H bonds and a C=O, and two lone pairs on O.”","why":"Every atom has its octet (H 2), and every formal charge is 0.","_n":"47b58","_k":"a0ec626f"},{"t":"“O in the centre, bonded to C and to an H.”","why":"H forms only one bond, so it’s never central. The central atom is usually the least electronegative atom.","_n":"48b68","_k":"c294e8f4"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Sulfur hexafluoride (SF\u003csub>6\u003c/sub>) insulates high-voltage equipment. It’s also a very strong greenhouse gas, so utilities track leaks. How many electrons surround S, and why is that possible?","options":[{"t":"12; any atom can expand its octet","why":"Period-2 atoms can’t.","_n":"49bb8","_k":"cc425405"},{"t":"6; sulfur has 6 valence electrons","why":"It shares six bonds: 12 electrons.","_n":"4abc8","_k":"0770841c"},{"t":"8; the octet rule always applies","why":"Period-3 atoms can exceed 8.","_n":"4bb98","_k":"4ead05e9"},{"t":"12; sulfur is in period 3 and can expand its octet","why":"Six S–F bonds hold 12 electrons, and period-3 atoms can exceed 8.","_n":"4cba8","_k":"0f51ac4f"}]},"b":{"prompt":"Phosphorus pentachloride (PCl\u003csub>5\u003c/sub>) is used to make other phosphorus compounds. How many electrons surround P, and why is that possible?","options":[{"t":"8; the octet rule always applies","why":"Period-3 atoms can exceed 8.","_n":"4daf8","_k":"b21bde2d"},{"t":"5; phosphorus has 5 valence electrons","why":"Five bonds hold 10 electrons.","_n":"4eb08","_k":"b873fe0b"},{"t":"10; phosphorus is in period 3 and can expand its octet","why":"Five P–Cl bonds hold 10 electrons, and period-3 atoms can exceed 8.","_n":"4f318","_k":"5419f891"},{"t":"10; any atom can expand its octet","why":"Carbon, nitrogen and oxygen never exceed 8 valence electrons. Only atoms from period 3 on can expand.","_n":"4g308","_k":"6d163d2e"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A chemist finds both N–O bonds in the nitrite ion measure ≈ 124 pm, between a typical N–O (≈ 140 pm) and N=O (≈ 120 pm). \u003cspan class=\"tiny muted\">(course table addition)\u003c/span> Which conclusion fits?","options":[{"t":"One bond is double and one is single","why":"That predicts two different lengths.","_n":"4h2f8","_k":"039baee4"},{"t":"Nitrite has two N=O double bonds","why":"N would have 10.","_n":"4i2e8","_k":"e4d706e2"},{"t":"Nitrite is a resonance blend, so its two bonds are identical","why":"One length between single and double: the same blend in both bonds.","_n":"4j2d8","_k":"17dae5ff"},{"t":"It’s an error; the two bonds must differ","why":"The data agree with the resonance model.","_n":"4k2c8","_k":"1efe12c6"}]},"b":{"prompt":"Both O–O bonds in ozone measure ≈ 128 pm, between O–O (≈ 148 pm) and O=O (≈ 121 pm). \u003cspan class=\"tiny muted\">(course table addition)\u003c/span> Which conclusion fits?","options":[{"t":"One bond is double and one is single","why":"That predicts two lengths.","_n":"4l2b8","_k":"b2aba7cc"},{"t":"It’s an error","why":"The real molecule is a single blend: both O–O bonds in ozone are identical.","_n":"4m2a8","_k":"037cc382"},{"t":"Ozone has two double bonds","why":"The central O would have 10.","_n":"4n398","_k":"4ad3899e"},{"t":"Ozone is a resonance blend, so its two bonds are identical","why":"The real molecule is a single blend: both O–O bonds in ozone are identical.","_n":"4o388","_k":"88b2c1e1"}]}}]},"task":{"title":"One lone pair, room to spare","summary":"One lone pair, room to spare","statement":"\u003cp>Design a fluoride molecule or ion AF\u003csub>\u003ci>n\u003c/i>\u003c/sub> (with charge −1, 0 or +1) that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"lw-conds\">\u003cli>The total number of valence electrons is even.\u003c/li>\u003cli>The central atom has exactly one lone pair.\u003c/li>\u003cli>The central atom has more than 8 electrons around it.\u003c/li>\u003cli>It follows the expansion rule: only atoms from period 3 on expand, and never beyond 12 electrons.\u003c/li>\u003c/ol>","inputs":{"centre":"Central atom","n":"Number of F atoms","q":"Charge","centres":["B","C","N","O","P","S","Cl","Xe"]},"checks":["Even electron count","Exactly one lone pair on the centre","More than 8 around the centre","Expansion rule"],"tips":["An odd count would leave an unpaired electron.","Lone-pair electrons on the centre = V − \u003ci>n\u003c/i> − charge; you need 2.","With one lone pair, more than 8 means at least 4 F atoms.","B, C, N and O are period-2 atoms; they can’t exceed 8. Nothing goes past 12 here."],"explainPrompt":"Explain how you used the electron count to get exactly one lone pair, and why your central atom can hold more than 8.","vocab":"Use the words valence electrons, lone pair, expanded octet and period 3.","more":"There’s more than one answer. Can you find them all?","afterAt":6,"after3":"Every answer satisfies \u003ci>n\u003c/i> = V − 2 − charge. Some (PF\u003csub>4\u003c/sub>\u003csup>−\u003c/sup>, ClF\u003csub>4\u003c/sub>\u003csup>+\u003c/sup>) are rare in the lab, but they all follow the rules. In module 18 you’ll see they make seesaw or square pyramidal shapes."},"cards":[["Valence electron count","Add the group electrons; add 1 per negative charge, subtract 1 per positive charge."],["Central atom","Usually the least electronegative atom; never H."],["Order of steps","Count → skeleton → outer octets → leftovers on the centre → multiple bonds if needed."],["Short octet on the centre","Move an outer lone pair into a double (or triple) bond."],["Expanded octet","Central atoms from period 3 on can hold 10 or 12 (PCl\u003csub>5\u003c/sub>, SF\u003csub>6\u003c/sub>)."],["Period-2 limit","C, N, O and F never exceed 8."],["Boron","Often has only 6 (BF\u003csub>3\u003c/sub>)."],["Formal charge","FC = valence − lone-pair electrons − ½ × bonding electrons."],["Best structure","FCs closest to 0; any negative FC on the most electronegative atom; FCs add up to the charge."],["Resonance","Equivalent structures for one species; the real species is one blend."],["Evidence for resonance","Identical bond lengths between single and double (CO\u003csub>3\u003c/sub>\u003csup>2−\u003c/sup>: ≈ 129 pm)."],["NH\u003csub>4\u003c/sub>\u003csup>+\u003c/sup>","8 electrons, four N–H bonds, formal charge +1 on N."]]}};</script>
