itle":"Quantitative Equilibrium (Keq)","kind":"topic","group":"4"},{"nn":"37","slug":"ksp","title":"Solubility Equilibrium (Ksp)","kind":"topic","group":"4"},{"nn":"38","slug":"acids-and-bases","title":"Acids and Bases","kind":"topic","group":"4"},{"nn":"39","slug":"ph-strong-acids-bases","title":"pH of Strong Acids and Bases","kind":"topic","group":"4"},{"nn":"40","slug":"ka-and-kb","title":"Ka and Kb Calculations","kind":"topic","group":"4"},{"nn":"41","slug":"hydrolysis-of-salts","title":"Hydrolysis of Salts","kind":"topic","group":"4"},{"nn":"42","slug":"strong-titration","title":"Strong Acid/Base Titration","kind":"topic","group":"4"},{"nn":"43","slug":"weak-titration","title":"Weak Acid/Base Titration","kind":"topic","group":"4"},{"nn":"44","slug":"buffer-solutions","title":"Buffer Solutions","kind":"topic","group":"4"},{"nn":"45","slug":"oxidation-numbers","title":"Assigning Oxidation Numbers","kind":"topic","group":"5"},{"nn":"46","slug":"balancing-redox","title":"Balancing Redox Reactions (Half-Reaction Method)","kind":"topic","group":"5"},{"nn":"47","slug":"galvanic-cells","title":"Galvanic Cells and Standard Reduction Potentials","kind":"topic","group":"5"},{"nn":"48","slug":"cell-notation","title":"Cell Notation (Voltaic Cells)","kind":"topic","group":"5"},{"nn":"49","slug":"corrosion","title":"Corrosion","kind":"topic","group":"5"},{"nn":"50","slug":"faraday-first-law","title":"Faraday's First Law of Electrolysis","kind":"topic","group":"5"},{"nn":"51","slug":"faraday-second-law","title":"Faraday's Second Law of Electrolysis","kind":"topic","group":"5"},{"nn":"52","slug":"hall-heroult","title":"The Hall–Héroult Process","kind":"topic","group":"5"}]},"salt":"4b7f77ab","content":{"id":"45-oxidation-numbers","kind":"topic","title":"Assigning oxidation numbers","topic":"Assigning Oxidation Numbers","readyTopic":"assigning oxidation numbers","hero":{"headline":"Follow the numbers, find the electrons","text":"An \u003cstrong>oxidation number\u003c/strong> tracks where electrons go. When an atom’s number goes \u003cstrong>up\u003c/strong>, it has lost electrons: it is \u003cstrong>oxidized\u003c/strong>. When it goes \u003cstrong>down\u003c/strong>, it has gained electrons: it is \u003cstrong>reduced\u003c/strong>. The two always happen together.","fig":{"html":"\u003cdiv class=\"ox-hx\">\u003cdiv class=\"ox-hx-eq\" id=\"ox-hx-eq\">\u003c/div>\u003csvg class=\"ox-hx-svg\" id=\"ox-hx-svg\" viewBox=\"0 0 480 270\" role=\"img\" aria-label=\"A zinc strip stands in a blue copper(II) solution. Two violet electrons hop from a zinc atom on the strip to a Cu²⁺ ion. The zinc atom’s tag ticks from 0 to +2 and it drifts into the solution as Zn²⁺; the Cu²⁺ ion’s tag ticks from +2 to 0 and copper settles on the strip as a brown deposit. Labels read: Zn oxidized, number up; Cu²⁺ reduced, number down.\">\u003c/svg>\u003cdiv class=\"ox-hx-row\">\u003cp class=\"ox-hx-ctr\" id=\"ox-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ox-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can apply the oxidation-number rules in order, including the exceptions for peroxides and metal hydrides.","I can find the oxidation number of an atom in a compound or polyatomic ion from the sum rule.","I can identify what is oxidized and what is reduced from changes in oxidation numbers.","I can name the oxidizing agent and the reducing agent, and count the electrons transferred.","I can decide whether a reaction is redox and explain my decision with oxidation numbers."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Ion charges","goal":1,"prompt":"What is the charge on a magnesium ion?","options":[{"t":"1+","why":"That’s Group 1.","_n":"01ec","_k":"152d0b92"},{"t":"2−","why":"Metals lose electrons and become positive.","_n":"11dc","_k":"9120efce"},{"t":"2+","why":"Group 2 metals lose two electrons: Mg²⁺.","_n":"21cc","_k":"5564e2ad"},{"t":"0","why":"The neutral atom is 0; the ion is 2+.","_n":"31bc","_k":"e13a7f9e"}],"hints":["Which group is Mg in?","Group 2 atoms lose 2 electrons.","Mg²⁺."]},{"id":"w2","skill":"Ion charges","goal":2,"prompt":"Which formula is correct for aluminium oxide?","options":[{"t":"AlO₃","why":"+3 + 3(−2) = −3.","_n":"41ac","_k":"d133f12a"},{"t":"Al₃O₂","why":"3(+3) + 2(−2) = +5.","_n":"519c","_k":"d86aa64f"},{"t":"AlO","why":"Al³⁺ and O²⁻ don’t cancel 1 : 1.","_n":"618c","_k":"212aa959"},{"t":"Al₂O₃","why":"2(+3) + 3(−2) = 0.","_n":"727c","_k":"d1ec7b11"}],"hints":["Charges: Al³⁺, O²⁻.","Find the lowest total that cancels: 6.","Al₂O₃."]},{"id":"w3","skill":"Polyatomic ions","goal":2,"prompt":"What is the charge on the sulfate ion, SO₄?","options":[{"t":"2−","why":"Sulfate is SO₄²⁻.","_n":"826c","_k":"8ca6e663"},{"t":"3−","why":"That’s phosphate, PO₄³⁻.","_n":"96d7","_k":"cda9c2e3"},{"t":"2+","why":"Polyatomic oxyanions are negative.","_n":"a6e7","_k":"62c6fb9a"},{"t":"1−","why":"That’s hydrogen sulfate, HSO₄⁻.","_n":"b6b7","_k":"10a666c2"}],"hints":["Think of sulfuric acid, H₂SO₄.","Two H⁺ balance one sulfate.","SO₄²⁻."]},{"id":"w4","skill":"Polyatomic ions","goal":2,"prompt":"Which is the nitrate ion?","options":[{"t":"NO₃⁻","why":"One N, three O and one negative charge.","_n":"c6c7","_k":"df1371a9"},{"t":"NO₃²⁻","why":"Nitrate carries one negative charge.","_n":"d717","_k":"72421ae8"},{"t":"NO₂⁻","why":"That’s nitrite.","_n":"e727","_k":"7e7af6b6"},{"t":"NH₄⁺","why":"That’s ammonium.","_n":"f6f7","_k":"9c957052"}],"hints":["Nitric acid is HNO₃.","One H⁺, so the ion is 1−.","NO₃⁻."]},{"id":"w5","skill":"Electron transfer","goal":3,"prompt":"When a sodium atom becomes Na⁺, it…","options":[{"t":"loses one electron","why":"11 protons, 10 electrons: +1.","_n":"g707","_k":"dc159b05"},{"t":"loses a proton","why":"That would change the element.","_n":"h757","_k":"2ed4fdf0"},{"t":"gains a proton","why":"The nucleus doesn’t change in chemical reactions.","_n":"i767","_k":"fda6d97e"},{"t":"gains one electron","why":"Gaining a negative electron would make it negative.","_n":"j877","_k":"a508a94d"}],"hints":["Charge = protons − electrons.","+1 means one more proton than electrons.","It lost one electron."]},{"id":"w6","skill":"Electron transfer","goal":3,"prompt":"A chlorine atom becomes Cl⁻. What happened?","options":[{"t":"It gained a proton","why":"Protons don’t move in chemistry.","_n":"k867","_k":"60276a85"},{"t":"It lost one electron","why":"That would give Cl⁺.","_n":"l857","_k":"e63b8a89"},{"t":"It gained one electron","why":"17 protons, 18 electrons: 1−.","_n":"m847","_k":"a5d688fe"},{"t":"It lost a neutron","why":"Neutrons don’t affect charge.","_n":"n837","_k":"3814cd3d"}],"hints":["Negative ions have extra electrons.","One extra.","Gained one."]}],"refreshers":{"Ion charges":"Group 1 → 1+, Group 2 → 2+, Al → 3+; nonmetals gain electrons (O²⁻, Cl⁻). Formula charges must add to zero.","Polyatomic ions":"Learn the common ones with their charges: NO₃⁻, SO₄²⁻, PO₄³⁻, CO₃²⁻, OH⁻, NH₄⁺, MnO₄⁻, Cr₂O₇²⁻.","Electron transfer":"Losing electrons makes a species more positive; gaining them makes it more negative."}}},"explore":{"heading":"Oxidation number calculator","intro":"Pick a species and apply the rules one at a time. Then switch to a reaction and watch which numbers change.","how":"\u003cstrong>Assign:\u003c/strong> pick a species, type your own numbers in the boxes if you like, then press \u003cstrong>Apply next rule\u003c/strong> or \u003cstrong>Solve for the unknown\u003c/strong>. \u003cstrong>Reaction:\u003c/strong> pick a reaction, press \u003cstrong>Show the changes\u003c/strong>, and tag species: tap a species, then a tag.","modes":[{"id":"as","t":"Assign"},{"id":"rx","t":"Reaction"}],"rules":["An uncombined element: 0.","A monatomic ion: its charge.","F in a compound: −1.","Group 1: +1; Group 2: +2; Al: +3 (in compounds).","H: +1 with nonmetals, −1 with metals (hydrides).","O: −2, except in peroxides (−1) and with F (+2).","Cl, Br, I: −1, unless combined with O or a lighter halogen.","The sum is 0 for a compound and equals the charge for an ion."],"tagNames":{"ox":"Mark as oxidized","red":"Mark as reduced","oa":"Oxidizing agent","ra":"Reducing agent"},"tc3Why":{"label":"Why is Fe₃O₄’s number a fraction?","options":[{"t":"Oxidation numbers can be any fraction because electrons split","why":"Electrons don’t split. The fraction is an average over atoms in different states.","_n":"o827","_k":"3aa82145"},{"t":"The rule list doesn’t work for iron ores","why":"The rules work: they give the average over the three Fe atoms.","_n":"p817","_k":"ba7d8281"},{"t":"The ore contains one Fe²⁺ and two Fe³⁺ per formula unit: (2 + 3 + 3) ÷ 3 = 8/3.","_n":"q807","_k":"c88ae356"},{"t":"One Fe atom is +8 and the other two are 0","why":"No Fe in magnetite is +8. Two Fe³⁺ and one Fe²⁺ give 3 + 3 + 2 = 8 over 3 atoms.","_n":"r7f7","_k":"40722a6d"}]},"notation":"Oxidation numbers are written sign first (+2, −1), one per atom. Ion charges are written sign last (2+).","predictions":[{"id":"p1","prompt":"What is the oxidation number of S in SO₄²⁻?","options":[{"t":"+2","_n":"s7e7","_k":"4a8a9b8b"},{"t":"+8","_n":"t817","_k":"3c9d3845"},{"t":"−2","_n":"u827","_k":"fe68cc83"},{"t":"+6","_n":"v837","_k":"cf308512"}],"explain":"The −2 belongs to the whole ion, not to S. The S must be +6 for the numbers to add to −2."},{"id":"p2","prompt":"What is the oxidation number of O in hydrogen peroxide?","options":[{"t":"+1","_n":"w847","_k":"7c58d63f"},{"t":"−2","_n":"x7d7","_k":"6ec96091"},{"t":"0","_n":"y7e7","_k":"f1f973e9"},{"t":"−1","_n":"z7f7","_k":"9bf04fd2"}],"explain":"In a peroxide the two O atoms share a bond, and each is −1: 2(+1) + 2(−1) = 0."},{"id":"p3","prompt":"Reaction mode, HCl + NaOH. Which atoms change oxidation number?","options":[{"t":"All of them","_n":"10807","_k":"01fae6f9"},{"t":"None: it isn’t redox","_n":"11797","_k":"3ef685e7"},{"t":"H and O","_n":"127a7","_k":"d70b8457"},{"t":"Na and Cl","_n":"13fb7","_k":"c13eb2d2"}],"explain":"H stays +1, O −2, Na +1, Cl −1. Neutralization swaps partners without moving electrons."},{"id":"p4","prompt":"Zn is oxidized. Which species is the oxidizing agent?","options":[{"t":"Cu","_n":"14fa7","_k":"d424c9c2"},{"t":"Zn","_n":"15fd7","_k":"335ef022"},{"t":"Cu²⁺","_n":"16fc7","_k":"834db4f5"},{"t":"Zn²⁺","_n":"17ff7","_k":"c28a2282"}],"explain":"Cu²⁺ takes Zn’s electrons, so it causes the oxidation. It is reduced in the process."}],"chalIntro":"Use the calculator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Assign every oxidation number in K₂Cr₂O₇.","why":"K is +1 and O is −2 from the rules; 2(+1) + 2\u003ci>x\u003c/i> + 7(−2) = 0 gives Cr = +6.","general":"In Assign mode, pick K₂Cr₂O₇ and type a number in each box: K, Cr and O.","hints":["Assign K and O first, from the rule list.","2(+1) + 2\u003ci>x\u003c/i> + 7(−2) = 0.","2\u003ci>x\u003c/i> = 12, so Cr = +6."]},{"id":"tc2","goal":4,"prompt":"In R7, tag the oxidizing agent and the reducing agent, and enter the number of electrons transferred as the equation is written.","why":"Fe goes +3 → 0 (reduced), so Fe₂O₃ is the oxidizing agent; C goes +2 → +4 (oxidized), so CO is the reducing agent. 2 × 3 = 3 × 2 = 6 electrons.","general":"In Reaction mode, pick R7, tag both agents and enter the number of electrons.","hints":["Find the number for Fe and for C on both sides.","Fe: +3 → 0. C: +2 → +4.","Fe₂O₃ is reduced, so it is the oxidizing agent; CO is the reducing agent. 2 × 3 = 3 × 2 = 6 electrons."]},{"id":"tc3","goal":2,"stretch":true,"prompt":"Magnetite, Fe₃O₄, is a magnetic iron ore. Find the oxidation number of Fe, then choose the explanation for your answer.","why":"3\u003ci>x\u003c/i> + 4(−2) = 0 gives \u003ci>x\u003c/i> = +8/3. Magnetite holds one Fe²⁺ and two Fe³⁺ per formula unit, so +8/3 is their average.","general":"In Assign mode, pick Fe₃O₄, type the Fe number in its box and choose an explanation.","hints":["3\u003ci>x\u003c/i> + 4(−2) = 0.","\u003ci>x\u003c/i> = 8/3: not a whole number. What could that mean?","Two Fe³⁺ and one Fe²⁺ give 3 + 3 + 2 = 8 over 3 atoms."]}]},"part3":{"slug":"redox-or-not","name":"Redox or not?","heading":"Redox or not?","intro":"Some reactions move electrons and some only swap partners. Sort ten reactions, look for the patterns by reaction type, and see how an antioxidant protects food.","s1":{"title":"Station 1: The sorter","intro":"Tap a reaction card, then a bin. Open \u003cstrong>Zoom to the particles\u003c/strong> on any card to see the oxidation number above each atom."},"bins":[{"id":"redox","t":"Redox"},{"id":"not","t":"Not redox"}],"cards":[{"id":"c1","eq":"2Na(s) + Cl₂(g) → 2NaCl(s)","type":"synthesis from elements","_a":"FhBSAlhPQw=="},{"id":"c2","eq":"AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)","type":"precipitation","_a":"FgxYEhU="},{"id":"c3","eq":"Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)","type":"single displacement","_a":"FhBSAlhPQw=="},{"id":"c4","eq":"CaCO₃(s) → CaO(s) + CO₂(g)","type":"decomposition with no change","_a":"FgxYEhU="},{"id":"c5","eq":"2H₂O(l) → 2H₂(g) + O₂(g)","type":"decomposition with change","_a":"FhBSAlhPQw=="},{"id":"c6","eq":"H₂SO₄(aq) + 2KOH(aq) → K₂SO₄(aq) + 2H₂O(l)","type":"neutralization","_a":"FgxYEhU="},{"id":"c7","eq":"C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(l)","type":"combustion","_a":"FhBSAlhPQw=="},{"id":"c8","eq":"Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)","type":"single displacement","_a":"FhBSAlhPQw=="},{"id":"c9","eq":"Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)","type":"precipitation","_a":"FgxYEhU="},{"id":"c10","eq":"2H₂O₂(aq) → 2H₂O(l) + O₂(g)","type":"disproportionation","_a":"FhBSAlhPQw=="}],"s2":{"title":"Station 2: Patterns","locked":"Sort all ten cards correctly to open the patterns table.","table":{"head":["Reaction type","Redox?"],"rows":[["Single displacement","Always"],["Combustion","Always"],["Element + element","Always"],["Neutralization","Never"],["Precipitation","Never"],["Decomposition","Sometimes: check"]]},"why":"Why sometimes?","whyCap":"Check it with data: both are decompositions. In CaCO₃ every atom keeps its number; in water, H falls +1 → 0 and O rises −2 → 0."},"blocks":[{"title":"Station 3: Antioxidants","html":"\u003cp>Vitamin C in juice reacts with dissolved oxygen before other compounds can. It is oxidized, so it acts as a \u003cstrong>reducing agent\u003c/strong>, and that protects the flavour and colour.\u003c/p>\u003cp class=\"tiny muted\">Question 4 below asks you to choose the correct statement about vitamin C.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Redox or not? quick check","items":[{"id":"q1","goal":5,"prompt":"Is BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq) redox?","choices":[{"t":"Redox: S changes","fb":"Every atom keeps its number; forming a precipitate isn’t electron transfer.","_n":"18fe7","_k":"e539d4c2"},{"t":"Redox: a solid forms","fb":"Every atom keeps its number; forming a precipitate isn’t electron transfer.","_n":"19017","_k":"5107c7e1"},{"t":"Not redox","fb":"Right. Ba stays +2, Cl −1, Na +1, S +6 and O −2: every atom keeps its number.","_n":"1a007","_k":"01e8bfcb"},{"t":"Redox: Ba changes","fb":"Every atom keeps its number; forming a precipitate isn’t electron transfer.","_n":"1bf37","_k":"ad18a146"}]},{"id":"q2","goal":3,"prompt":"In Zn(s) + 2H⁺(aq) → Zn²⁺(aq) + H₂(g), what is reduced?","choices":[{"t":"Zn²⁺","fb":"H goes +1 → 0: its number falls.","_n":"1cf27","_k":"09115e52"},{"t":"Zn","fb":"H goes +1 → 0: its number falls.","_n":"1df57","_k":"41895d0e"},{"t":"H₂","fb":"H goes +1 → 0: its number falls.","_n":"1ef67","_k":"972c95cc"},{"t":"H⁺","fb":"Right. H goes +1 → 0: its number falls.","_n":"1ff37","_k":"34d48bd5"}]},{"id":"q3","goal":5,"prompt":"Which reaction type is always redox?","choices":[{"t":"Precipitation","fb":"An element replaces an ion, so one species gains electrons and another loses them.","_n":"1gf47","_k":"7b48a2ec"},{"t":"Neutralization","fb":"An element replaces an ion, so one species gains electrons and another loses them.","_n":"1hf17","_k":"53eb614e"},{"t":"Decomposition","fb":"An element replaces an ion, so one species gains electrons and another loses them.","_n":"1if27","_k":"f6f28cb4"},{"t":"Single displacement","fb":"Right. An element replaces an ion, so one species gains electrons and another loses them.","_n":"1jef7","_k":"dcc0307d"}]},{"id":"q4","goal":4,"prompt":"Vitamin C protects food from oxygen. Vitamin C is…","choices":[{"t":"oxidized; a reducing agent","fb":"Right. It gives electrons to oxygen, so it is oxidized and acts as the reducing agent.","_n":"1kf07","_k":"3b0b14a7"},{"t":"unchanged","fb":"It gives electrons to oxygen, so it is oxidized and acts as the reducing agent.","_n":"1lfd7","_k":"7e630c27"},{"t":"reduced; an oxidizing agent","fb":"It gives electrons to oxygen, so it is oxidized and acts as the reducing agent.","_n":"1mfe7","_k":"96a08feb"},{"t":"oxidized; an oxidizing agent","fb":"It gives electrons to oxygen, so it is oxidized and acts as the reducing agent.","_n":"1nef7","_k":"ac15ba5e"}]}]}},"practice":{"activities":[{"id":"number","type":"numeric","title":"Number the atom","summary":"Number the atom","goal":[1,2],"instruction":"Enter the oxidation number of the \u003cstrong>bold\u003c/strong> atom.","how":"Type the number with its sign first, such as +4 or −1, then press Check. Fractions like 8/3 are fine.","items":[{"id":"n1","goal":2,"prompt":"\u003cstrong>N\u003c/strong>O₂","_a":"AA==","display":"+4","keypad":"text","label":"Oxidation number of N:","why":"\u003ci>x\u003c/i> + 2(−2) = 0, so N is +4.","wrong":[{"match":-2,"fb":"That’s O’s number."}],"hints":["Assign O first: −2 each.","\u003ci>x\u003c/i> + 2(−2) = 0.","\u003ci>x\u003c/i> = +4."]},{"id":"n2","goal":2,"prompt":"\u003cstrong>N\u003c/strong>₂O","_a":"BQ==","display":"+1","keypad":"text","label":"Oxidation number of N:","why":"2\u003ci>x\u003c/i> + (−2) = 0, so each N is +1.","wrong":[{"match":2,"fb":"Two N atoms share +2: each is +1."}],"hints":["Two N atoms, one O.","2\u003ci>x\u003c/i> + (−2) = 0.","\u003ci>x\u003c/i> = +1."]},{"id":"n3","goal":2,"prompt":"\u003cstrong>Mn\u003c/strong>O₂","_a":"AA==","display":"+4","keypad":"text","label":"Oxidation number of Mn:","why":"\u003ci>x\u003c/i> + 2(−2) = 0, so Mn is +4.","wrong":[{"match":2,"fb":"Two O atoms: 2(−2) = −4."}],"hints":["Assign O first.","\u003ci>x\u003c/i> + 2(−2) = 0.","\u003ci>x\u003c/i> = +4."]},{"id":"n4","goal":2,"prompt":"\u003cstrong>Cl\u003c/strong>O₃⁻","_a":"AQ==","display":"+5","keypad":"text","label":"Oxidation number of Cl:","why":"\u003ci>x\u003c/i> + 3(−2) = −1, so Cl is +5.","wrong":[{"match":-1,"fb":"Cl is −1 only when it isn’t combined with O. The ion’s charge is the \u003cstrong>sum\u003c/strong> of all its atoms’ numbers. Solve for the one unknown atom."},{"match":6,"fb":"The ion’s charge is −1, not 0."}],"hints":["Cl is combined with O, so rule 7 doesn’t give −1. Assign O first.","\u003ci>x\u003c/i> + 3(−2) = −1.","\u003ci>x\u003c/i> = +5."]},{"id":"n5","goal":1,"prompt":"H\u003cstrong>Cl\u003c/strong>O","_a":"BQ==","display":"+1","keypad":"text","label":"Oxidation number of Cl:","why":"(+1) + \u003ci>x\u003c/i> + (−2) = 0, so Cl is +1.","wrong":[{"match":-1,"fb":"Here Cl is bonded to O, so rule 7 doesn’t give −1."}],"hints":["Assign H (+1) and O (−2) first.","(+1) + \u003ci>x\u003c/i> + (−2) = 0.","\u003ci>x\u003c/i> = +1."]},{"id":"n6","goal":2,"prompt":"\u003cstrong>C\u003c/strong>₂O₄²⁻","_a":"Bw==","display":"+3","keypad":"text","label":"Oxidation number of C:","why":"2\u003ci>x\u003c/i> + 4(−2) = −2, so each C is +3.","wrong":[{"match":6,"fb":"That’s both C atoms together."}],"hints":["Two C atoms.","2\u003ci>x\u003c/i> + 4(−2) = −2.","\u003ci>x\u003c/i> = +3."]},{"id":"n7","goal":2,"prompt":"H₂\u003cstrong>P\u003c/strong>O₄⁻","_a":"AQ==","display":"+5","keypad":"text","label":"Oxidation number of P:","why":"2(+1) + \u003ci>x\u003c/i> + 4(−2) = −1, so P is +5.","wrong":[{"match":6,"fb":"The ion’s charge is −1: 2(+1) + \u003ci>x\u003c/i> − 8 = −1."}],"hints":["Assign H and O first.","2(+1) + \u003ci>x\u003c/i> + 4(−2) = −1.","\u003ci>x\u003c/i> = +5."]},{"id":"n8","goal":1,"prompt":"Li\u003cstrong>H\u003c/strong>","_a":"GVM=","display":"−1","keypad":"text","label":"Oxidation number of H:","why":"Li is +1 (rule 4); with a metal, H is −1.","wrong":[{"match":1,"fb":"With a metal, H is −1 (a hydride)."}],"hints":["Li is a Group 1 metal.","Rule 5: H with a metal.","H is −1."]}]},{"id":"agents","type":"custom","title":"Agents and electrons","summary":"Agents and electrons","star":true,"goal":[3,5],"instruction":"Six items: choose an answer or enter a number. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Tap your choice or type your answer, then press Check.","items":[{"id":"r1","kind":"chips","goal":4,"prompt":"Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂. Reducing agent?","options":[{"t":"Cl₂","why":"Cl₂ is reduced (0 → −1), so it’s the oxidizing agent.","_n":"1oee7","_k":"63e41e4c"},{"t":"Br₂","why":"Agents are reactants. Br₂ is what Br⁻ becomes.","_n":"1ped7","_k":"c455970e"},{"t":"Br⁻","why":"Br goes −1 → 0: Br⁻ is oxidized, so it is the reducing agent.","_n":"1qec7","_k":"7357b2e3"},{"t":"Cl⁻","why":"Agents are reactants. Cl⁻ is what Cl₂ becomes.","_n":"1rf37","_k":"ae7d5c96"}],"hints":["Find the number for Cl and Br on both sides.","Cl: 0 → −1. Br: −1 → 0.","Br⁻ is oxidized, so it is the reducing agent."]},{"id":"r2","kind":"chips","goal":3,"prompt":"CH₄ + 2O₂ → CO₂ + 2H₂O. Change in C’s number?","options":[{"t":"+4 only","why":"C starts at −4 in CH₄.","_n":"1sf27","_k":"5f66f462"},{"t":"0 → +4 (+4)","why":"C in CH₄ is combined, not elemental: \u003ci>x\u003c/i> + 4(+1) = 0 gives −4.","_n":"1tf17","_k":"883f7e32"},{"t":"+4 → −4 (−8)","why":"C is −4 in CH₄ and +4 in CO₂: the number rises.","_n":"1uf07","_k":"c6f25e3e"},{"t":"−4 → +4 (+8)","why":"In CH₄, \u003ci>x\u003c/i> + 4(+1) = 0 gives −4; in CO₂, \u003ci>x\u003c/i> + 2(−2) = 0 gives +4.","_n":"1vf77","_k":"00c19a91"}],"hints":["Find C in CH₄ first.","CH₄: \u003ci>x\u003c/i> + 4(+1) = 0. CO₂: \u003ci>x\u003c/i> + 2(−2) = 0.","−4 → +4: a change of +8."]},{"id":"r3","kind":"num","star":true,"goal":4,"prompt":"2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu. Electrons transferred as written?","_a":"Ag==","tol":0,"unit":"electrons","display":"6 electrons","keypad":"numeric","label":"Electrons:","wrong":[{"match":3,"fb":"Each Al loses 3, and there are 2 Al."},{"match":2,"fb":"Each Cu²⁺ gains 2, and there are 3."}],"fb":"Total rise = total fall: count every atom that changes.","why":"2 Al × 3 = 3 Cu × 2 = 6 electrons.","hints":["Al: 0 → +3. Cu: +2 → 0.","Multiply by the coefficients: 2 Al, 3 Cu.","2 × 3 = 3 × 2 = 6."]},{"id":"r4","kind":"chips","star":true,"goal":5,"prompt":"In 2H₂O₂ → 2H₂O + O₂, which element is both oxidized and reduced?","options":[{"t":"O (−1 → −2 and −1 → 0)","why":"Some O atoms fall to −2 in H₂O and others rise to 0 in O₂.","_n":"1wf67","_k":"ba3d8d05"},{"t":"H and O","why":"H stays +1.","_n":"1xe97","_k":"f69571a3"},{"t":"H","why":"H stays +1.","_n":"1yea7","_k":"ca282f3e"},{"t":"Not redox","why":"O’s numbers change, in two directions.","_n":"1zeb7","_k":"361e6206"}],"hints":["O in H₂O₂ is −1 (a peroxide).","Find O in H₂O and in O₂.","O: −1 → −2 and −1 → 0."]},{"id":"r5","kind":"chips","star":true,"goal":3,"prompt":"\u003cstrong>Investigation:\u003c/strong> A copper wire is placed in colourless silver nitrate solution. After an hour, grey crystals coat the wire and the solution is pale blue. Which observation is the best evidence that copper was \u003cstrong>oxidized\u003c/strong>?","options":[{"t":"Grey crystals","why":"Those show that Ag⁺ was reduced to Ag.","_n":"20ec7","_k":"94354c98"},{"t":"The solution was colourless at the start","why":"That’s the starting state; look for a change that shows Cu²⁺ formed.","_n":"21ed7","_k":"ed7b8c76"},{"t":"The wire got thinner","why":"That’s possible, but harder to measure; the colour is direct evidence of Cu²⁺.","_n":"22ee7","_k":"ffdcb688"},{"t":"The blue colour (Cu²⁺(aq) has formed)","why":"Cu²⁺(aq) is blue, so the colour shows Cu atoms became Cu²⁺: 0 → +2.","_n":"23ef7","_k":"5848bc5d"}],"hints":["Oxidized copper becomes Cu²⁺.","What colour is Cu²⁺(aq)?","The blue colour."]},{"id":"r6","kind":"chips","star":true,"goal":3,"prompt":"Nitrogen compounds in soil: NH₄⁺ → NO₃⁻. By how much does N’s number change, and is N oxidized or reduced?","options":[{"t":"−3 → +5: +8, oxidized","why":"The number rises by 8, so N is oxidized.","_n":"24f07","_k":"0737ddb9"},{"t":"−8, reduced","why":"The number rises, so N is oxidized.","_n":"25f17","_k":"3520f2da"},{"t":"+5, oxidized","why":"Start from N = −3 in NH₄⁺.","_n":"26f27","_k":"95630e86"},{"t":"+3 → +5: +2, oxidized","why":"In NH₄⁺, H is +1: \u003ci>x\u003c/i> + 4 = +1, so N is −3.","_n":"27039","_k":"edae1066"}],"hints":["Find N in each ion.","NH₄⁺: \u003ci>x\u003c/i> + 4 = +1, so −3. NO₃⁻: \u003ci>x\u003c/i> − 6 = −1, so +5.","The number rises by 8: oxidized."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Mairead","how":"","goal":[2,4],"instruction":"Mairead made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"In 2Mg + O₂ → 2MgO, what is reduced?","steps":["Mg: 0 → +2. O: 0 → −2.","Mg’s number goes up, so Mg is reduced.","So O is oxidized."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Mg gains oxygen, so Mg is reduced.","why":"Gaining oxygen goes with oxidation.","_n":"28029","_k":"71789074"},{"t":"Both are oxidized because O₂ is involved.","why":"One rises and one falls.","_n":"29059","_k":"eceaf56e"},{"t":"Mg’s number goes up, so Mg is \u003cstrong>oxidized\u003c/strong>; O’s goes down, so O is \u003cstrong>reduced\u003c/strong>.","why":"Up means electrons lost: oxidation. Down means electrons gained: reduction.","_n":"2a049","_k":"5f83f520"},{"t":"Step 2 is correct.","why":"Up means electrons lost: oxidation.","_n":"2bff9","_k":"4f82056c"}],"hints":["Up or down: which means losing electrons?","Losing electrons raises the number.","Mg is oxidized; O is reduced."]},{"id":"e2","goal":4,"task":"Name the agents in Fe₂O₃ + 3CO → 2Fe + 3CO₂.","steps":["Fe: +3 → 0. C: +2 → +4.","Fe is reduced and C is oxidized.","So Fe₂O₃ is the reducing agent and CO is the oxidizing agent."],"_a":"Bg==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Step 3 is correct.","why":"The species that is reduced is the oxidizing agent.","_n":"2cfe9","_k":"6e4a80a6"},{"t":"Fe₂O₃ is reduced, so it’s the \u003cstrong>oxidizing\u003c/strong> agent; CO is oxidized, so it’s the \u003cstrong>reducing\u003c/strong> agent.","why":"The species that is oxidized gives away electrons, so it is the \u003cstrong>reducing\u003c/strong> agent.","_n":"2d019","_k":"510d7ca8"},{"t":"Fe is the reducing agent.","why":"Fe is a product.","_n":"2e009","_k":"3d7f1673"},{"t":"CO₂ is the oxidizing agent.","why":"Agents are reactants.","_n":"2ffb9","_k":"5d1a6ddc"}],"hints":["What does an oxidizing agent do to the other species?","It takes electrons, so it is itself reduced.","Fe₂O₃ is the oxidizing agent."]},{"id":"e3","goal":2,"task":"Find the oxidation number of Mn in KMnO₄.","steps":["K is +1 and O is −2.","+1 + \u003ci>x\u003c/i> + (−2) = 0.","So Mn is +1."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"Multiply by the subscript: 4 O atoms.","_n":"2gfa9","_k":"6909689e"},{"t":"+1 + \u003ci>x\u003c/i> + (−2) = −1.","why":"KMnO₄ is neutral; the sum is 0.","_n":"2hfd9","_k":"3da32484"},{"t":"Mn is −1, the charge of MnO₄⁻.","why":"That’s the ion’s charge.","_n":"2ife9","_k":"f0ef0cd8"},{"t":"There are four O atoms: +1 + \u003ci>x\u003c/i> + 4(−2) = 0, so Mn is +7.","why":"Multiply by the subscript: 4 O atoms.","_n":"2jfb9","_k":"240ff1c3"}],"hints":["How many O atoms?","Four: 4(−2) = −8.","Mn = +7."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result in Explore surprised you most: the peroxide, the neutralization with no changes, or magnetite’s fraction? Why?"},{"id":"j2","q":"In your own words, explain why the species that is oxidized is called the reducing agent."},{"id":"j3","q":"Explain to a friend how to find the oxidation number of one atom in a polyatomic ion."},{"id":"j4","q":"Which rule or term do you still mix up? Write a memory trick you’ll use."}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"What is the oxidation number of Cr in CrO₄²⁻?","options":[{"t":"+6","why":"\u003ci>x\u003c/i> + 4(−2) = −2.","_n":"2kfc9","_k":"2693a4cf"},{"t":"+4","why":"Each O is −2, not −1.","_n":"2l019","_k":"dbe207f3"},{"t":"−2","why":"That’s the ion’s charge. The ion’s charge is the \u003cstrong>sum\u003c/strong> of all its atoms’ numbers. Solve for the one unknown atom.","_n":"2m029","_k":"0aa2bb35"},{"t":"+8","why":"The sum must be −2, not 0.","_n":"2nff9","_k":"dd40cb60"}]},"b":{"prompt":"What is the oxidation number of N in NO₂⁻?","options":[{"t":"+4","why":"The sum must be −1, not 0.","_n":"2o009","_k":"7250f6e5"},{"t":"+5","why":"That’s N in NO₃⁻.","_n":"2pf59","_k":"4eca93c9"},{"t":"−1","why":"That’s the ion’s charge. The ion’s charge is the \u003cstrong>sum\u003c/strong> of all its atoms’ numbers. Solve for the one unknown atom.","_n":"2qf69","_k":"3aff7d23"},{"t":"+3","why":"\u003ci>x\u003c/i> + 2(−2) = −1.","_n":"2r753","_k":"6d65c431"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"In a redox reaction, the species that is oxidized…","options":[{"t":"gains electrons, and its oxidation number decreases","why":"That describes reduction.","_n":"2s763","_k":"0b461070"},{"t":"must gain oxygen atoms","why":"Oxygen isn’t required.","_n":"2t733","_k":"5af1f7d2"},{"t":"loses electrons, and its oxidation number decreases","why":"Losing negative charge raises the number.","_n":"2u743","_k":"93d095f0"},{"t":"loses electrons, and its oxidation number increases","why":"Losing negative charge raises the number.","_n":"2v713","_k":"0c72c1a9"}]},"b":{"prompt":"In a redox reaction, the species that is reduced…","options":[{"t":"gains electrons, and its oxidation number decreases","why":"Gaining negative charge lowers the number.","_n":"2w723","_k":"12f4ea4b"},{"t":"loses electrons, and its oxidation number increases","why":"That describes oxidation. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"2x6f3","_k":"917bd014"},{"t":"must lose oxygen atoms","why":"Oxygen isn’t required.","_n":"2y703","_k":"3d892b48"},{"t":"gains electrons, and its oxidation number increases","why":"Gaining negative charge lowers the number.","_n":"2z7d3","_k":"dd6a53af"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"What is the oxidation number of O in sodium peroxide, Na₂O₂?","options":[{"t":"+1","why":"The sum would be +4.","_n":"307e3","_k":"3911e273"},{"t":"−2","why":"Peroxides are the exception.","_n":"317b3","_k":"36023ce9"},{"t":"0","why":"O is combined, not elemental.","_n":"327a3","_k":"5bda9cbd"},{"t":"−1","why":"2(+1) + 2\u003ci>x\u003c/i> = 0.","_n":"337d3","_k":"c75f3f4e"}]},"b":{"prompt":"What is the oxidation number of H in calcium hydride, CaH₂?","options":[{"t":"+1","why":"With a metal, H is −1.","_n":"347c3","_k":"eedf975d"},{"t":"−2","why":"Two H atoms share −2: each is −1.","_n":"357f3","_k":"0a2c5791"},{"t":"−1","why":"+2 + 2\u003ci>x\u003c/i> = 0.","_n":"367e3","_k":"16ba22ba"},{"t":"0","why":"H is combined.","_n":"37813","_k":"0ae03b9d"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"What is the average oxidation number of S in the thiosulfate ion, S₂O₃²⁻?","options":[{"t":"+2","why":"2\u003ci>x\u003c/i> + 3(−2) = −2, so 2\u003ci>x\u003c/i> = 4.","_n":"38803","_k":"75f319b4"},{"t":"+4","why":"That treats the two S atoms as one.","_n":"39733","_k":"1c637e10"},{"t":"+3","why":"That uses 0 for the sum; the ion is 2−.","_n":"3a723","_k":"8e8799e9"},{"t":"−2","why":"That’s the ion’s charge. The ion’s charge is the \u003cstrong>sum\u003c/strong> of all its atoms’ numbers. Solve for the one unknown atom.","_n":"3b693","_k":"7faf380e"}]},"b":{"prompt":"What is the average oxidation number of C in propane, C₃H₈?","options":[{"t":"−8/3","why":"3\u003ci>x\u003c/i> + 8(+1) = 0.","_n":"3c6a3","_k":"a6f2f860"},{"t":"−4","why":"That’s C in CH₄, not propane.","_n":"3d6b3","_k":"4db7704b"},{"t":"−8","why":"That’s the total for three C atoms.","_n":"3e6c3","_k":"8364629f"},{"t":"+8/3","why":"H is +1, so C must be negative.","_n":"3f6d3","_k":"c937feb7"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu. Which is the oxidizing agent?","options":[{"t":"Al³⁺","why":"Agents are reactants.","_n":"3g6e3","_k":"6da51143"},{"t":"Cu","why":"Cu is a product.","_n":"3h6f3","_k":"5519a40b"},{"t":"Cu²⁺","why":"Cu: +2 → 0, reduced, so it’s the oxidizing agent.","_n":"3i703","_k":"1dcf6fdc"},{"t":"Al","why":"Al is oxidized: it’s the reducing agent.","_n":"3j713","_k":"da832655"}]},"b":{"prompt":"Cl₂ + 2I⁻ → 2Cl⁻ + I₂. Which is the reducing agent?","options":[{"t":"I₂","why":"A product.","_n":"3k723","_k":"ee4ddfab"},{"t":"Cl⁻","why":"A product.","_n":"3l6f3","_k":"aac4089f"},{"t":"Cl₂","why":"Cl₂ is reduced (0 → −1): it’s the oxidizing agent. The species that is oxidized gives away electrons, so it is the \u003cstrong>reducing\u003c/strong> agent.","_n":"3m6e3","_k":"339c9d2d"},{"t":"I⁻","why":"I: −1 → 0, oxidized, so it’s the reducing agent.","_n":"3n6d3","_k":"7efab27c"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"How many electrons are transferred in Fe₂O₃ + 3CO → 2Fe + 3CO₂ as written?","options":[{"t":"2","why":"That’s one C atom’s loss.","_n":"3o6c3","_k":"512e8c29"},{"t":"3","why":"That’s one Fe atom’s gain.","_n":"3p733","_k":"31377c31"},{"t":"6","why":"2 Fe × 3 = 3 C × 2 = 6.","_n":"3q723","_k":"ea7ddb46"},{"t":"12","why":"Count the transfer once, not on both sides.","_n":"3r713","_k":"f1370ecd"}]},"b":{"prompt":"How many electrons are transferred in 3Mg + 2Fe³⁺ → 3Mg²⁺ + 2Fe as written?","options":[{"t":"2","why":"One Mg.","_n":"3s703","_k":"b7f77dd5"},{"t":"3","why":"One Fe.","_n":"3t773","_k":"f48676e9"},{"t":"6","why":"3 Mg × 2 = 2 Fe × 3 = 6.","_n":"3u763","_k":"1c0f288e"},{"t":"12","why":"Counted twice.","_n":"3ved4","_k":"aa6e9f6b"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why HCl + NaOH → NaCl + H₂O is \u003cstrong>not\u003c/strong> a redox reaction?","options":[{"t":"“Ions are present, so it must be redox.”","why":"Check every atom. If no oxidation number changes, it isn’t redox.","_n":"3wee4","_k":"9fecc137"},{"t":"“No atom’s oxidation number changes: H stays +1, O −2, Na +1 and Cl −1, so no electrons are transferred.”","why":"Redox needs some oxidation number to change.","_n":"3xeb4","_k":"fad8a46c"},{"t":"“It forms water, and reactions that form water can’t be redox.”","why":"2H₂ + O₂ → 2H₂O forms water and is redox.","_n":"3yec4","_k":"f01e3e7b"},{"t":"“No oxygen gas takes part.”","why":"Redox doesn’t need O₂.","_n":"3zf14","_k":"3c671c27"}]},"b":{"prompt":"Which is the best explanation of why 2Mg + O₂ → 2MgO \u003cstrong>is\u003c/strong> a redox reaction?","options":[{"t":"“A solid forms.”","why":"Precipitates form in non-redox reactions too.","_n":"40f24","_k":"e0db77e3"},{"t":"“Mg gains oxygen, so Mg is reduced.”","why":"Mg’s number rises, 0 → +2, so Mg is oxidized. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"41ef4","_k":"9cdb579b"},{"t":"“Oxygen is present, so it’s always redox.”","why":"Some reactions with O-containing species aren’t redox.","_n":"42f04","_k":"db297383"},{"t":"“Mg goes 0 → +2 (loses electrons) and O goes 0 → −2 (gains them): electrons move from Mg to O.”","why":"Numbers change in both directions: electrons move.","_n":"43f54","_k":"03ce43d0"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"For Zn + Cu²⁺ → Zn²⁺ + Cu, which sentence uses the terms correctly?","options":[{"t":"“Zn is oxidized, so Zn is the oxidizing agent.”","why":"The species that is oxidized gives away electrons, so it is the \u003cstrong>reducing\u003c/strong> agent.","_n":"44f64","_k":"7a5dbcd3"},{"t":"“Zn is reduced because it loses electrons.”","why":"Losing electrons is oxidation. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"45734","_k":"fc062ff8"},{"t":"“Zn is oxidized, so Zn is the reducing agent; Cu²⁺ is reduced, so Cu²⁺ is the oxidizing agent.”","why":"Zn: 0 → +2; Cu: +2 → 0.","_n":"46724","_k":"c7c5cfc1"},{"t":"“Cu²⁺ is oxidized because its number changes.”","why":"Cu’s number falls, +2 → 0: that’s reduction. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"47754","_k":"9b3a7948"}]},"b":{"prompt":"For Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂, which sentence uses the terms correctly?","options":[{"t":"“Br⁻ is reduced because it loses electrons.”","why":"Losing electrons is oxidation. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"48744","_k":"8e53012a"},{"t":"“Br⁻ is oxidized, so Br⁻ is the reducing agent; Cl₂ is reduced, so Cl₂ is the oxidizing agent.”","why":"Br: −1 → 0; Cl: 0 → −1.","_n":"496f4","_k":"b551ecd5"},{"t":"“Cl₂ is oxidized because it becomes an ion.”","why":"Cl’s number falls, 0 → −1: that’s reduction. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"4a6e4","_k":"6177b5f1"},{"t":"“Cl₂ is reduced, so Cl₂ is the reducing agent.”","why":"The species that is oxidized gives away electrons, so it is the \u003cstrong>reducing\u003c/strong> agent.","_n":"4b714","_k":"0725fff1"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Vitamin C is added to juice as an antioxidant: it reacts with dissolved O₂ before the flavour compounds can. In that reaction, vitamin C is…","options":[{"t":"oxidized, so it acts as the oxidizing agent","why":"The species that is oxidized gives away electrons, so it is the \u003cstrong>reducing\u003c/strong> agent.","_n":"4c704","_k":"e0745dc9"},{"t":"reduced, so it acts as the oxidizing agent","why":"O₂ is what gets reduced.","_n":"4d7b4","_k":"5334ef90"},{"t":"not involved in redox","why":"It reacts with O₂ by electron transfer.","_n":"4e7a4","_k":"de1500f2"},{"t":"oxidized, so it acts as the reducing agent","why":"It gives electrons to O₂.","_n":"4f014","_k":"582ca443"}]},"b":{"prompt":"A hand warmer works when iron powder reacts with O₂ to make Fe₂O₃. What happens to iron?","options":[{"t":"0 → +3; iron is the reducing agent","why":"Fe gives electrons to O₂: its number rises 0 → +3.","_n":"4g024","_k":"d45d87a5"},{"t":"0 → −3; iron is reduced","why":"Metals lose electrons here.","_n":"4h034","_k":"f86c4c5c"},{"t":"0 → +3; iron is the oxidizing agent","why":"The species that is oxidized gives away electrons, so it is the \u003cstrong>reducing\u003c/strong> agent.","_n":"4i044","_k":"6ee2d48a"},{"t":"0 → +2; iron is the reducing agent","why":"In Fe₂O₃, Fe is +3.","_n":"4jfd4","_k":"269ef65f"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Zinc is extracted from its ore by heating with carbon: ZnO + C → Zn + CO. Which statement is correct?","options":[{"t":"Zn goes +2 → 0 (reduced); C goes 0 → +2 (oxidized)","why":"In ZnO, Zn is +2; C starts as the element at 0 and is +2 in CO.","_n":"4kfe4","_k":"caaa1898"},{"t":"Only Zn changes","why":"C changes too.","_n":"4lff4","_k":"3b3f35bb"},{"t":"O is reduced from −2 to 0","why":"O stays −2.","_n":"4m004","_k":"94621dca"},{"t":"Zn is oxidized and C is reduced","why":"Zn’s number falls, +2 → 0: that’s reduction. Reduction means \u003cstrong>gaining\u003c/strong> electrons, so the number \u003cstrong>decreases\u003c/strong>: think “reduce the number”.","_n":"4nf94","_k":"fa260d8e"}]},"b":{"prompt":"Aluminium is produced as 2Al₂O₃ + 3C → 4Al + 3CO₂ (module 52). Which statement is correct?","options":[{"t":"C goes +4 → 0","why":"C starts as the element at 0.","_n":"4ofa4","_k":"8a5c8eb3"},{"t":"Al goes +3 → 0 (reduced); C goes 0 → +4 (oxidized)","why":"Al: +3 → 0; C: 0 → +4. 4 × 3 = 3 × 4 = 12 electrons.","_n":"4p074","_k":"ab4f01a3"},{"t":"Al goes 0 → +3","why":"Al starts in Al₂O₃ at +3.","_n":"4q064","_k":"595bcb58"},{"t":"O goes −2 → 0","why":"O stays −2.","_n":"4r054","_k":"ead69f00"}]}}]},"task":{"title":"One-to-one swap","summary":"One-to-one swap","statement":"\u003cp>Design a reaction \u003cstrong>metal(s) + ion(aq) → ion(aq) + metal(s)\u003c/strong> that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"ox-conds\">\u003cli>The metal’s oxidation number rises by exactly 2.\u003c/li>\u003cli>The metal and the ion are different elements.\u003c/li>\u003cli>Electrons balance with one metal atom for every ion (a 1 : 1 ratio).\u003c/li>\u003cli>It actually happens: the metal is above the ion’s element in the activity series Mg > Al > Zn > Fe > H > Cu > Ag.\u003c/li>\u003c/ol>","checks":["Metal’s number rises by 2","Different elements","1 : 1 electron balance","It really happens"],"tips":["Al becomes Al³⁺ (+3) and Ag becomes Ag⁺ (+1).","Cu with Cu²⁺ is the same element: nothing changes overall.","Ag⁺ and H⁺ each take one electron, so you’d need 2 per metal atom.","A metal only gives electrons to ions of a less active metal."],"explainPrompt":"Explain, using oxidation numbers, which species is oxidized, which is the reducing agent, and why your pair balances 1 : 1.","vocab":"Use oxidation number, oxidized, reduced, reducing agent and oxidizing agent.","more":"There’s more than one answer. Can you find them all?","afterAt":6,"after3":"Each pair moves 2 electrons. The farther apart the two metals are in the series, the more strongly the reaction goes, which module 47 measures in volts."},"cards":[["Oxidation number","A bookkeeping charge per atom, assigned as if all bonds were ionic."],["Sum rule","Numbers add to 0 in a compound, or to the charge in an ion."],["O exceptions","−1 in peroxides (H₂O₂, Na₂O₂); +2 in OF₂."],["H exception","−1 in metal hydrides (NaH, CaH₂)."],["Oxidation","Loss of electrons; the oxidation number \u003cstrong>rises\u003c/strong>."],["Reduction","Gain of electrons; the oxidation number \u003cstrong>falls\u003c/strong>."],["Reducing agent","The reactant that is \u003cstrong>oxidized\u003c/strong>: it gives electrons away."],["Oxidizing agent","The reactant that is \u003cstrong>reduced\u003c/strong>: it takes electrons."],["Electrons transferred","Total rise = total fall. Fe₂O₃ + 3CO: 6 electrons."],["Not redox","Neutralization and precipitation: no number changes."],["Average numbers","Fe₃O₄: +8/3, because the ore holds Fe²⁺ and Fe³⁺ together."]]}};</script>
