.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}

.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}

.face.back > span{background:var(--sheet);background:transparent}

.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

*{transition:none!important;animation:none!important}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}

.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}

/* SCH4U 23: hero, Table builder (C11 full table, layers, deck, Mendeleev table, family cards and clips), Part 3, formula predictor, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:0}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* block tints (plan §5: s --pen, p teal, d orange, f brown) */
.b-s{--bt:var(--pen)} .b-p{--bt:var(--p-d)} .b-d{--bt:var(--p-k)} .b-f{--bt:var(--p-b)}

/* hero */
.pt-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.pt-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.pt-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:1.6em;flex:1 1 14rem}

/* Table builder: controls */
.pt-top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:0 0 12px}
.pt-top [hidden],.pt-box[hidden],[data-for][hidden]{display:none}
.pt-deckbox,.pt-mtool{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;margin-bottom:12px}
.pt-deck{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pt-card{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);
  padding:.45em .75em;font:700 .98rem var(--font-ui);min-height:44px}
.pt-card.on{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.pt-card.done{opacity:.7;border-style:dashed}
.pt-cardok{font-size:.8rem;color:var(--green)}
.pt-steps{margin:0 0 8px}
.pt-prop{margin-bottom:8px}
.pt-mbtns{display:flex;flex-wrap:wrap;gap:8px}
.pt-mout{min-height:1.4em;margin-top:6px}
.pt-mout p{margin:0}
.pt-avg{font-size:1.05rem}

/* table boxes */
.pt-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px 6px;margin-top:6px}
.pt-viewrow{margin-bottom:8px}
.pt-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:4px}
.pt-swipe{display:none;margin:2px 0 0}
@media (max-width:600px){.pt-swipe{display:block}}
.pt-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.84rem;color:var(--ink-2);margin:6px 0 2px}
.pt-legend span{display:inline-flex;align-items:center;gap:6px}
.pt-sw{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid var(--ink-2);background:color-mix(in srgb,var(--bt,var(--sheet)) 30%,var(--sheet))}

/* C11 full periodic table */
.pt-tab{display:flex;flex-direction:column;gap:2px;min-width:560px}
.pt-tab.one{min-width:0;max-width:520px}
.pt-r{display:grid;gap:2px}
.pt-fsp{height:8px}
.pt-pl{font-size:.7rem;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.pt-hd .pt-g{font:400 .68rem var(--font-ui);text-align:center;color:var(--ink-2);line-height:1.5;padding:0;border:0;background:none;min-height:0}
.pt-hd button.pt-g{border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);font-weight:700;min-height:24px;cursor:pointer}
.pt-hd button.pt-g:hover{border-color:var(--ink)}
.pt-hd button.pt-g.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pt-bk{font:700 .7rem var(--font-ui);text-align:center;border-radius:3px;padding:1px 0;color:var(--ink);background:color-mix(in srgb,var(--bt) 30%,var(--sheet));white-space:nowrap;overflow:hidden}
.pt-el{position:relative;height:32px;min-width:0;padding:0;border:1px solid var(--rule);border-radius:3px;font:700 .78rem var(--font-ui);color:var(--ink);
  background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pt-el:hover{border-color:var(--ink)}
.pt-el:focus-visible{outline:3px solid var(--pen);outline-offset:1px;z-index:1}
.lay-blocks .pt-el{background:color-mix(in srgb,var(--bt) 30%,var(--sheet))}
.lay-metal .pt-el.t-metal{background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink-2) 45%,transparent) 0 1.5px,transparent 1.5px 6px)}
.lay-metal .pt-el.t-metalloid{background-image:radial-gradient(color-mix(in srgb,var(--ink-2) 70%,transparent) 1.1px,transparent 1.6px);background-size:5px 5px;border:2px solid var(--ink)}
.lay-metal .pt-el.t-synthetic{opacity:.6;border-style:dashed}
.pt-legend .pt-sw.t-metal{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink-2) 45%,transparent) 0 1.5px,var(--sheet) 1.5px 6px)}
.pt-legend .pt-sw.t-metalloid{background:radial-gradient(color-mix(in srgb,var(--ink-2) 70%,transparent) 1.1px,transparent 1.6px) 0 0/5px 5px,var(--sheet)}
.pt-legend .pt-sw.t-nonmetal{background:var(--sheet)}
.pt-legend .pt-sw.t-synthetic{background:var(--sheet);border-style:dashed}
.pt-sy{font-size:.8rem}
.pt-vn{font-size:.64rem;font-weight:400;color:var(--ink-2)}
.pt-el.sel{outline:3px solid var(--ink);outline-offset:-1px;z-index:1}
.pt-el.placed{border:2px solid var(--green)}
.pt-ck{font-size:.55rem;font-weight:700;color:var(--green);white-space:nowrap}
.pt-el.fam{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.pt-el.flash{animation:pt-flash 1.2s ease-out 2;box-shadow:0 0 0 3px var(--hi)}
@keyframes pt-flash{0%{box-shadow:0 0 0 0 var(--hi)}50%{box-shadow:0 0 0 6px var(--hi)}100%{box-shadow:0 0 0 3px var(--hi)}}

/* Mendeleev table */
.pt-mt{display:flex;flex-direction:column;gap:3px;min-width:470px;max-width:680px}
.pt-mr{display:grid;grid-template-columns:3.6em repeat(7,minmax(54px,1fr));gap:3px}
.pt-mhd span{font:700 .78rem var(--font-ui);text-align:center;color:var(--ink-2)}
.pt-ml{font-size:.78rem;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.pt-mdots{height:14px}
.pt-mgap{border:1px dashed var(--rule);border-radius:4px}
.pt-mc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:44px;padding:2px;border:1.5px solid var(--rule);border-radius:5px;background:var(--sheet);color:var(--ink);line-height:1.1}
.pt-mc b{font-size:.95rem}
.pt-mc small{font-size:.72rem;color:var(--ink-2)}
.pt-mc:hover{border-color:var(--ink)}
.pt-mc.gap{border:2px dashed var(--ink);background:var(--hi-soft)}
.pt-mc.gap.on{background:var(--hi);color:var(--hi-ink);border-style:solid}
.pt-mc.gap.on small{color:var(--hi-ink)}
.pt-mc.pick{background:var(--info-bg);border:2.5px solid var(--pen)}
.pt-mc.sel{outline:3px solid var(--ink);outline-offset:-1px}
.pt-mc.hl{border:2.5px solid var(--ink);background:var(--hi-soft)}
.pt-mc.lit{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.pt-mc.lit small{color:var(--hi-ink)}
.pt-mnote{margin:6px 0 2px}

/* below the table */
.pt-cap{min-height:1.4em;margin:10px 0 4px}
.pt-cap > p{margin:0}
.pt-below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px 24px;align-items:start;margin-top:8px}
@media (max-width:760px){.pt-below{grid-template-columns:minmax(0,1fr)}}
.pt-side > p{margin:0}
.pt-famcard{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px}
.pt-famcard h4{margin:0 0 6px}
.pt-tw{overflow-x:auto}
.pt-getab{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}
.pt-getab caption{text-align:left;font-weight:700;margin-bottom:4px}
.pt-getab th,.pt-getab td{border:1px solid var(--rule);padding:.3em .5em;text-align:left;vertical-align:top}
.pt-getab thead th{background:var(--paper)}

/* family clips */
.pt-clip{margin:10px 0 0}
.pt-clip figcaption{font-weight:700;font-size:.9rem;margin-bottom:6px}
.pt-frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt-fr{border:1px solid var(--rule);border-radius:8px;padding:4px 4px 6px;text-align:center}
.pt-fr svg{display:block;width:100%;max-width:150px;height:auto;margin:0 auto}
.pt-fr p{margin:2px 0 0;font-size:.82rem}
.pt-clipnote{margin:6px 0 0}
.pt-glass{fill:none;stroke:var(--ink-2);stroke-width:2}
.pt-water{fill:color-mix(in srgb,var(--pen) 18%,var(--sheet))}
.pt-metal{fill:var(--ink-2)}
.pt-bub{fill:none;stroke:var(--pen);stroke-width:1;animation:pt-rise 1.6s linear infinite}
.pt-ak-na .pt-bub{animation-duration:1.1s}
.pt-ak-k .pt-bub{animation-duration:.8s}
.pt-ak-na .pt-piece{animation:pt-skim 1.8s ease-in-out infinite alternate}
.pt-ak-k .pt-piece{animation:pt-skim 1.1s ease-in-out infinite alternate}
.pt-flame{fill:color-mix(in srgb,var(--acol) 65%,var(--p-c));transform-origin:60px 34px;animation:pt-flick .35s ease-in-out infinite alternate}
.pt-cl2{fill:color-mix(in srgb,var(--hi) 60%,var(--green));opacity:.45}
.pt-brv{fill:color-mix(in srgb,var(--red) 55%,var(--hi-ink));opacity:.2}
.pt-br2{fill:color-mix(in srgb,var(--red) 55%,var(--hi-ink))}
.pt-i2{fill:color-mix(in srgb,var(--acol) 50%,var(--hi-ink))}
@keyframes pt-rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
@keyframes pt-skim{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes pt-flick{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
@media (prefers-reduced-motion:reduce){
  .pt-bub,.pt-piece,.pt-flame,.pt-el.flash{animation:none}
}

/* Part 3 */
.pt-p3tabs{margin:6px 0 10px}
.pt-myst{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px}
.pt-pos{margin:0 0 8px;font-size:1.2rem}
.pt-qrow{margin-top:8px}
.pt-ql{margin:0 0 4px;font-weight:700;font-size:.92rem}
.pt-data{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px}
.pt-dh{margin:0 0 6px}
.pt-marks{margin:0 0 8px;padding-left:1.2em}
.pt-marks li{margin:4px 0}
.pt-ok strong{color:var(--green)}
.pt-no strong{color:var(--red)}
.pt-use{margin:8px 0}
.pt-s3{margin-top:10px}

/* formula predictor */
.pt-form{margin:10px 0 4px;padding:6px 10px;background:var(--paper);border-radius:6px;font:700 1.3rem var(--font-ui);display:inline-block;min-width:6em}
.pt-qm{color:var(--ink-2)}
.pt-subrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.pt-subl{flex:0 0 9em;font-size:.86rem;font-weight:700;color:var(--ink-2)}
.pt-fchips{margin:10px 0 4px}

/* task */
.pt-conds{margin:8px 0 12px;padding-left:1.4em}
.pt-tgw{overflow-x:auto}
.pt-thd{display:grid;grid-template-columns:1.6em repeat(8,minmax(38px,48px));gap:4px;font-size:.74rem;color:var(--ink-2);text-align:center;margin-bottom:3px}
.pt-tbody{display:flex;gap:4px}
.pt-tpl{display:grid;grid-template-rows:repeat(4,40px);gap:4px;width:1.6em;font-size:.74rem;color:var(--ink-2)}
.pt-tpl span{display:flex;align-items:center;justify-content:center}
.pt-tg .rg-wrap{display:block}
.rg.chips.pt-tgrid{display:grid;grid-template-columns:repeat(8,minmax(38px,48px));grid-auto-rows:40px;gap:4px}
.rg.chips.pt-tgrid button{border-radius:5px;padding:0;min-height:0;font-weight:700;background:color-mix(in srgb,var(--bt) 22%,var(--sheet))}
.rg.chips.pt-tgrid button[aria-checked="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.pt-h4{margin:4px 0 8px}
.pt-tkpv{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px}
.pt-tkh{margin:0 0 8px;font-size:1.05rem}

</style>

,"eqLabel":"Period equals the highest shell. Block equals the subshell being filled. Group equals a shared valence configuration.","headline":"A table that predicted elements before anyone found them","text":"Mendeleev grouped elements by their properties and left \u003cstrong>gaps\u003c/strong> for elements nobody had discovered. Today we know why his pattern works: the table is a map of \u003cstrong>electron configurations\u003c/strong>. The \u003cstrong>period\u003c/strong> tells you the outer shell, the \u003cstrong>block\u003c/strong> tells you the subshell being filled, and a \u003cstrong>group\u003c/strong> shares one valence configuration, so it shares its chemistry too.","fig":{"html":"\u003cdiv class=\"pt-hx\">\u003csvg class=\"pt-hx-svg\" id=\"pt-hx-svg\" viewBox=\"0 0 440 300\" role=\"img\" aria-label=\"Mendeleev-style cards slide into rows by atomic mass, leaving a gap below silicon marked with a question mark. The question-mark card flips to show his prediction, mass about 72, grey, forms EO2, then flips again to germanium, found in 1886. The cards then re-flow into the modern long-form periodic table, and its four blocks light up in turn: s, p, d and f, each labelled with the subshell it fills. Germanium’s cell glows under the tag 1871: predicted.\">\u003c/svg>\u003cdiv class=\"pt-hx-row\">\u003cp class=\"pt-hx-ctr\" id=\"pt-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"pt-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can explain how Mendeleev built his table and how his predictions supported it.","I can read an element’s period, group and block from its electron configuration, and the reverse.","I can describe the properties of the main families and of metals, nonmetals and metalloids.","I can predict an unfamiliar element’s ion charge, compound formulas and properties from its position.","I can explain why elements in a group behave similarly, using valence configuratio  argon, so 18 electrons; there are 15 more.","The highest shell is \u003cem>n\u003c/em> = 4, so period 4.","The last subshell filled is 4p, so the p block.","It has 4 shells, so it’s in group 4.","So it’s titanium."],"_a":"UA==","stepFb":["Step 1 is correct (Z = 33).","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"Group 13.","why":"4p\u003csup>3\u003c/sup> is the third p column, so group 15.","_n":"355c6","_k":"465220b5"},{"t":"Group 3.","why":"Count 4s and 4p.","_n":"365b6","_k":"b704b0ff"},{"t":"Step 4 is correct.","why":"Shells give the period, not the group. Shells give the period. The group comes from the valence configuration.","_n":"375e6","_k":"6df1be25"},{"t":"Valence electrons 4s\u003csup>2\u003c/sup> 4p\u003csup>3\u003c/sup> = 5, so group 15: arsenic.","why":"Shells give the period. The group comes from the valence configuration.","_n":"385d6","_k":"daf051e8"}],"hints":["What does the shell number tell you?","The period.","Valence electrons 4s\u003csup>2\u003c/sup> 4p\u003csup>3\u003c/sup> = 5, so group 15: arsenic."]},{"id":"e2","goal":4,"task":"Predict the formula of the compound of aluminium and oxygen.","steps":["Al is in group 13, so it forms Al\u003csup>3+\u003c/sup>.","O is in group 16, so it forms O\u003csup>+\u003c/sup>.","So the formula is Al\u003csub>2\u003c/sub>O\u003csub>3\u003c/sub>?"],"_a":"Ug==","stepFb":["Step 1 is correct.","","Step 3 doesn’t follow from step 2; the mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"O\u003csup>+\u003c/sup> would be a cation; oxygen gains electrons. Metals lose electrons to reach a noble-gas configuration (Na\u003csup>+\u003c/sup>); halogens gain one (Cl\u003csup>−\u003c/sup>).","_n":"39606","_k":"22b8ecc3"},{"t":"O forms O\u003csup>2+\u003c/sup>.","why":"Metals lose electrons to reach a noble-gas configuration (Na\u003csup>+\u003c/sup>); halogens gain one (Cl\u003csup>−\u003c/sup>).","_n":"3a5f6","_k":"e9c62988"},{"t":"O gains 2 electrons: O\u003csup>2−\u003c/sup>. Then 2 Al\u003csup>3+\u003c/sup> (6+) balance 3 O\u003csup>2−\u003c/sup> (6−): Al\u003csub>2\u003c/sub>O\u003csub>3\u003c/sub>.","why":"Metals lose electrons to reach a noble-gas configuration (Na\u003csup>+\u003c/sup>); halogens gain one (Cl\u003csup>−\u003c/sup>).","_n":"3be66","_k":"dd1047ac"},{"t":"O forms O\u003csup>6+\u003c/sup>.","why":"Nonmetals gain electrons.","_n":"3ce76","_k":"6215732b"}],"hints":["Does a nonmetal gain or lose electrons?","It gains 2.","O gains 2 electrons: O\u003csup>2−\u003c/sup>. Then 2 Al\u003csup>3+\u003c/sup> (6+) balance 3 O\u003csup>2−\u003c/sup> (6−): Al\u003csub>2\u003c/sub>O\u003csub>3\u003c/sub>."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: how close Mendeleev’s germanium predictions were, or that the table’s shape comes from subshells?"},{"id":"j2","q":"In your own words, explain why elements in the same group behave similarly."},{"id":"j3","q":"Explain to a friend how to predict a formula from two elements’ positions."},{"id":"j4","q":"Which part of reading the table is still shaky for you? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"An element’s configuration ends in 4p\u003csup>3\u003c/sup>. Which block and period is it in?","options":[{"t":"p block, period 3","why":"\u003cem>n\u003c/em> = 4.","_n":"3de86","_k":"9f4b9013"},{"t":"p block, period 4","why":"4p is a p subshell, and its shell is \u003cem>n\u003c/em> = 4.","_n":"3ee96","_k":"badf28ec"},{"t":"d block, period 4","why":"4p is a p subshell. The block is the subshell being filled: 4p\u003csup>3\u003c/sup> is in the p block.","_n":"3fea6","_k":"8e024f20"},{"t":"p block, period 5","why":"5 is the number of valence electrons. Shells give the period. The group comes from the valence configuration.","_n":"3geb6","_k":"468af9d6"}]},"b":{"prompt":"An element’s configuration ends in 3d\u003csup>5\u003c/sup> (after 4s\u003csup>2\u003c/sup>). Which block and period is it in?","options":[{"t":"p block, period 4","why":"The block is the subshell being filled: 3d\u003csup>5\u003c/sup> is in the d block.","_n":"3hec6","_k":"9f871a70"},{"t":"s block, period 4","why":"3d is filling, so the d block.","_n":"3ied6","_k":"ca705692"},{"t":"d block, period 3","why":"The period comes from 4s.","_n":"3jde6","_k":"9d0b4e47"},{"t":"d block, period 4","why":"4s\u003csup>2\u003c/sup> is the highest shell; 3d is filling.","_n":"3kdf6","_k":"ca53d79a"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Elements with valence configuration \u003cem>n\u003c/em>s\u003csup>1\u003c/sup> are the…","options":[{"t":"noble gases","why":"Those have full shells.","_n":"3l6c6","_k":"81461389"},{"t":"alkali metals","why":"One s electron to lose: group 1.","_n":"3m6b6","_k":"0b736ea2"},{"t":"halogens","why":"Those are \u003cem>n\u003c/em>s\u003csup>2\u003c/sup> \u003cem>n\u003c/em>p\u003csup>5\u003c/sup>.","_n":"3n6a6","_k":"63224ff9"},{"t":"alkaline earth metals","why":"Those are \u003cem>n\u003c/em>s\u003csup>2\u003c/sup>.","_n":"3o696","_k":"4a73b5c0"}]},"b":{"prompt":"Elements with valence configuration \u003cem>n\u003c/em>s\u003csup>2\u003c/sup> \u003cem>n\u003c/em>p\u003csup>6\u003c/sup> are the…","options":[{"t":"noble gases","why":"A full outer shell: group 18.","_n":"3p706","_k":"58db6f5a"},{"t":"alkaline earth metals","why":"Those are \u003cem>n\u003c/em>s\u003csup>2\u003c/sup> only.","_n":"3q6f6","_k":"f8c1b0ed"},{"t":"halogens","why":"Halogens are one electron short.","_n":"3r6e6","_k":"b1b53c79"},{"t":"transition metals","why":"Those are in the d block.","_n":"3s6d6","_k":"dcf0240d"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"The modern periodic table is ordered by…","options":[{"t":"date of discovery","why":"No: discovery dates play no part in the order.","_n":"3t646","_k":"8a3cf49a"},{"t":"number of neutrons","why":"Isotopes differ in neutrons.","_n":"3u636","_k":"f851db20"},{"t":"atomic mass","why":"That was Mendeleev’s main order, with exceptions. It’s ordered by atomic number. That’s why Te (127.6) comes before I (126.9).","_n":"3vea7","_k":"3b7b3c3b"},{"t":"atomic number","why":"That’s why Te (127.6) comes before I (126.9).","_n":"3web7","_k":"a41ef236"}]},"b":{"prompt":"Mendeleev mainly ordered the elements by…","options":[{"t":"atomic mass, adjusted where properties demanded it","why":"Mass first, with properties overruling it (Te before I).","_n":"3xe87","_k":"661023cf"},{"t":"electron configuration","why":"Electrons weren’t discovered yet.","_n":"3ye97","_k":"956039f8"},{"t":"alphabetical order","why":"No: he used atomic mass and properties.","_n":"3zee7","_k":"7435dbb3"},{"t":"atomic number","why":"Atomic number wasn’t understood until later.","_n":"40ef7","_k":"dfbd21db"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Indium is in group 13, period 5. Predict the formula of indium chloride.","options":[{"t":"InCl\u003csub>3\u003c/sub>","why":"In\u003csup>3+\u003c/sup> with three Cl\u003csup>−\u003c/sup>.","_n":"41ec7","_k":"3cafb138"},{"t":"In\u003csub>3\u003c/sub>Cl","why":"The charges are uncrossed incorrectly.","_n":"42ed7","_k":"8d7a128f"},{"t":"InCl","why":"Group 13 gives 3+.","_n":"43e27","_k":"f9278c58"},{"t":"InCl\u003csub>5\u003c/sub>","why":"5 is the period.","_n":"44e37","_k":"48fad99a"}]},"b":{"prompt":"Barium is in group 2. Predict the formula of barium nitride.","options":[{"t":"Ba\u003csub>3\u003c/sub>N\u003csub>2\u003c/sub>","why":"Ba\u003csup>2+\u003c/sup> × 3 = 6+; N\u003csup>3−\u003c/sup> × 2 = 6−.","_n":"45f07","_k":"62bb418e"},{"t":"BaN\u003csub>2\u003c/sub>","why":"That gives 2+ and 6−.","_n":"46ef7","_k":"fdae4665"},{"t":"Ba\u003csub>2\u003c/sub>N\u003csub>3\u003c/sub>","why":"That gives 4+ and 9−.","_n":"47f27","_k":"1694abf1"},{"t":"BaN","why":"Ba\u003csup>2+\u003c/sup> and N\u003csup>3−\u003c/sup>: you need 3 Ba\u003csup>2+\u003c/sup> (6+) for 2 N\u003csup>3−\u003c/sup> (6−): Ba\u003csub>3\u003c/sub>N\u003csub>2\u003c/sub>.","_n":"48f17","_k":"8f4dad41"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"Use the neighbour average of S (32.1) and Te (127.6) to predict selenium’s atomic mass.","options":[{"t":"About 80 (the actual value is 79.0)","why":"(32.1 + 127.6) ÷ 2 ≈ 79.9.","_n":"49ec7","_k":"cb3bc270"},{"t":"About 127","why":"That’s tellurium’s mass.","_n":"4aeb7","_k":"53ac515a"},{"t":"About 160","why":"That’s the sum, not the average.","_n":"4bee7","_k":"c9ac38ae"},{"t":"About 48","why":"That’s half of the difference.","_n":"4ced7","_k":"2f878642"}]},"b":{"prompt":"Use the neighbour average of Cl (−34 °C) and I (184 °C) to predict bromine’s boiling point.","options":[{"t":"150 °C","why":"That’s the sum.","_n":"4de87","_k":"dea7806d"},{"t":"109 °C","why":"That’s half of the difference, 218 ÷ 2.","_n":"4ee77","_k":"809f8163"},{"t":"184 °C","why":"That’s iodine’s boiling point.","_n":"4fde6","_k":"a6125e8e"},{"t":"75 °C (the actual value is 59 °C)","why":"(−34 + 184) ÷ 2 = 75: close.","_n":"4gdf6","_k":"f5a8f147"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Francium is in group 1, period 7. Predict its oxide formula and its reactivity compared with cesium.","options":[{"t":"FrO\u003csub>2\u003c/sub>; more reactive","why":"Fr\u003csup>+\u003c/sup> needs half an O\u003csup>2−\u003c/sup> each: Fr\u003csub>2\u003c/sub>O.","_n":"4he06","_k":"a5f68be6"},{"t":"Fr\u003csub>2\u003c/sub>O; less reactive","why":"Lower IE\u003csub>1\u003c/sub> means more reactive.","_n":"4ie16","_k":"09004c0a"},{"t":"Fr\u003csub>2\u003c/sub>O; more reactive than Cs","why":"Group 1 forms 1+ ions; reactivity rises down the group.","_n":"4jda6","_k":"04dbf6c9"},{"t":"FrO; less reactive","why":"1+, and further down means more reactive.","_n":"4kdb6","_k":"b77786fc"}]},"b":{"prompt":"Astatine is in group 17, period 6. Predict the formula of sodium astatide and how its reactivity compares with iodine’s.","options":[{"t":"Na\u003csub>2\u003c/sub>At","why":"At gains one electron. Metals lose electrons to reach a noble-gas configuration (Na\u003csup>+\u003c/sup>); halogens gain one (Cl\u003csup>−\u003c/sup>).","_n":"4ldc6","_k":"7856ac8a"},{"t":"NaAt\u003csub>7\u003c/sub>","why":"7 is the number of valence electrons.","_n":"4mdd6","_k":"0f447274"},{"t":"NaAt; less reactive than iodine","why":"At\u003csup>−\u003c/sup>; halogen reactivity falls down the group.","_n":"4ne66","_k":"3ccbdd2d"},{"t":"NaAt; more reactive","why":"For halogens, reactivity decreases down the group.","_n":"4oe76","_k":"2931e84e"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why sodium and potassium react with water in similar ways?","options":[{"t":"“Both are in period 3.”","why":"K is in period 4.","_n":"4pe47","_k":"0a0c7615"},{"t":"“Both have one valence electron (\u003cem>n\u003c/em>s\u003csup>1\u003c/sup>) that they lose easily, forming 1+ ions.”","why":"Same valence configuration, same chemistry.","_n":"4qe37","_k":"45cf32a8"},{"t":"“They have the same number of shells.”","why":"Shells give the period. The group comes from the valence configuration.","_n":"4re27","_k":"484868ed"},{"t":"“They have similar masses.”","why":"23 vs 39.","_n":"4se17","_k":"9acd629f"}]},"b":{"prompt":"Which is the best explanation of why chlorine and bromine form similar compounds?","options":[{"t":"“Both are gases.”","why":"Bromine is a liquid.","_n":"4te07","_k":"fc46f805"},{"t":"“They have the same number of protons.”","why":"17 vs 35.","_n":"4udf7","_k":"a9e3cc31"},{"t":"“Both have the valence configuration \u003cem>n\u003c/em>s\u003csup>2\u003c/sup> \u003cem>n\u003c/em>p\u003csup>5\u003c/sup> and gain one electron to form 1− ions.”","why":"Same valence configuration, same chemistry.","_n":"4vde7","_k":"5d71a9ee"},{"t":"“They’re in the same period.”","why":"Different periods, same group.","_n":"4wdd7","_k":"543ce129"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which statement uses Mendeleev’s work as evidence correctly?","options":[{"t":"“He discovered germanium himself.”","why":"Winkler discovered it in 1886.","_n":"4xec7","_k":"833b353e"},{"t":"“He left a gap below silicon and predicted its properties; germanium, discovered later, matched them closely, supporting the periodic pattern.”","why":"A prediction that came true is strong evidence for the pattern.","_n":"4yeb7","_k":"0ff667d5"},{"t":"“His gaps showed that the table was wrong.”","why":"The gaps were predictions, and germanium filled one almost exactly as forecast.","_n":"4z625","_k":"1cc19a9e"},{"t":"“His table was ordered exactly by atomic number.”","why":"It’s ordered by atomic number. That’s why Te (127.6) comes before I (126.9).","_n":"50635","_k":"42880bca"}]},"b":{"prompt":"Which statement correctly describes the transition metals?","options":[{"t":"“Very unreactive gases.”","why":"Those are the noble gases.","_n":"51605","_k":"dba8af10"},{"t":"“d-block metals that often form ions of more than one charge and coloured compounds, and that are used as catalysts.”","why":"All three properties come from the filling d subshell.","_n":"52615","_k":"786eb15d"},{"t":"“Nonmetals in the p block.”","why":"They’re metals in the d block.","_n":"535e5","_k":"32276e12"},{"t":"“Metals that always form 1+ ions.”","why":"That describes group 1.","_n":"545f5","_k":"a37761a6"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Why are silicon and germanium used to make computer chips?","options":[{"t":"“They’re the best metallic conductors.”","why":"Copper conducts far better.","_n":"555c5","_k":"f9f9c4fe"},{"t":"“They’re noble gases.”","why":"They’re group 14 metalloids.","_n":"565d5","_k":"19ebb3fa"},{"t":"“They’re metalloids (semiconductors): their conductivity sits between a metal’s and a nonmetal’s and can be tuned.”","why":"Metalloids on the staircase have in-between properties.","_n":"576a5","_k":"9bf9d264"},{"t":"“They’re very reactive.”","why":"Their usefulness is electrical, not reactivity.","_n":"586b5","_k":"2556e4ff"}]},"b":{"prompt":"Why is argon used to fill the space around a hot filament or a weld?","options":[{"t":"“It’s a good conductor.”","why":"It’s an insulating gas.","_n":"59685","_k":"d5b514a0"},{"t":"“It’s a metalloid.”","why":"It’s a noble gas.","_n":"5a675","_k":"e2c486a7"},{"t":"“It’s very reactive and removes oxygen.”","why":"It’s unreactive.","_n":"5b6a5","_k":"2b63612a"},{"t":"“As a noble gas with a full outer shell, it doesn’t react with hot metal.”","why":"Full shells make noble gases very unreactive.","_n":"5c695","_k":"f5ddc1c8"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Lithium is used in rechargeable batteries. Which property follows from its position?","options":[{"t":"“As a group 1 metal it loses its single 2s electron easily, and it’s the lightest metal.”","why":"Group 1, period 2: one 2s electron to lose.","_n":"5d6c5","_k":"8900c8f1"},{"t":"“It forms Li\u003csup>2+\u003c/sup>.”","why":"Group 1 forms 1+.","_n":"5e6b5","_k":"228016fa"},{"t":"“It’s a noble gas.”","why":"It’s an alkali metal.","_n":"5f6e5","_k":"9fbd7002"},{"t":"“It gains electrons easily.”","why":"Metals lose electrons to reach a noble-gas configuration (Na\u003csup>+\u003c/sup>); halogens gain one (Cl\u003csup>−\u003c/sup>).","_n":"5g6d5","_k":"35e03286"}]},"b":{"prompt":"The magnets in many wind turbines contain neodymium (Z = 60). Which block is it in?","options":[{"t":"d block","why":"Lanthanides fill 4f.","_n":"5h605","_k":"cfbd8de1"},{"t":"p block","why":"No: it’s a lanthanide, filling 4f.","_n":"5i5f5","_k":"2cd9cdab"},{"t":"The f block (lanthanides), because it fills 4f","why":"Neodymium is a lanthanide: 4f is filling.","_n":"5jf3d","_k":"1d4359e4"},{"t":"s block","why":"No: it’s a lanthanide, filling 4f.","_n":"5kf2d","_k":"09091463"}]}}]},"task":{"title":"Find the element","summary":"Find the element","statement":"\u003cp>Tap a cell of the main-group table (periods 2–5) that meets every clue. Can you find all the answers?\u003c/p>\u003col class=\"pt-conds\">\u003cli>It’s in the p block.\u003c/li>\u003cli>It usually forms an ion with charge 2−.\u003c/li>\u003cli>It’s in period 3 or a later period.\u003c/li>\u003cli>It isn’t a metal.\u003c/li>\u003c/ol>","checks":["p block","Forms 2−","Period ≥ 3","Not a metal"],"tips":["The p block is groups 13–18.","2− ions come from 6 valence electrons.","Period 2 is too high up the table.","Check the staircase: metalloids count as ‘not a metal’."],"explainPrompt":"Explain how the group gives the ion charge, and how the period and the staircase narrowed your choice.","vocab":"Use the words valence electrons, block, period and metalloid.","more":"There’s more than one answer. Can you find them all?","after3":"Each gains 2 electrons to reach a noble-gas configuration. Going down, metallic character grows: Te is already a metalloid, and the next one, polonium, is more metallic still."},"cards":[["Mendeleev’s table","Ordered mainly by atomic mass, grouped by properties, with gaps for undiscovered elements."],["Eka-silicon","Mendeleev’s predicted element below Si; discovered as germanium (1886)."],["Modern order","By atomic number, which fixes the Te/I order."],["Period","The highest occupied shell (\u003cem>n\u003c/em>)."],["Block","The subshell being filled: s, p, d or f."],["Group","Shared valence configuration, so shared chemistry."],["Alkali metals","\u003cem>n\u003c/em>s\u003csup>1\u003c/sup>: soft, very reactive, 1+ ions, reactivity increases down the group."],["Halogens","\u003cem>n\u003c/em>s\u003csup>2\u003c/sup> \u003cem>n\u003c/em>p\u003csup>5\u003c/sup>: reactive nonmetals, diatomic, 1− ions, reactivity decreases down the group."],["Noble gases","Full outer shells: very unreactive."],["Transition metals","d block: several ion charges, coloured compounds, catalysts."],["Metalloids","Along the staircase (B, Si, Ge, As, Sb, Te): in-between properties, semiconductors."]]}};</script>
