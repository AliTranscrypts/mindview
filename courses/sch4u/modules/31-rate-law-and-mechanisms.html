.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}

.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}

.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

w step’s reactants become the rate law: you need A and B, once each.","S1 is A + B → AB. What uses up AB and another A?","S1 (slow) + S2 (fast): AB cancels and the sum is 2A + B → A₂B."]}],"msgs":{"tc1":{"none":"Choose R1 and run some trials first.","orders":"Choose an order for both A and B.","swap":"Check which concentration changed in each pair.","four":"× 4 means 2², so order 2.","tooMany":"Plan so that every comparison changes only one concentration from the same reference trial.","pairs":"Your trials need one pair that changes only [A] and one pair that changes only [B].","wrong":"Your rate law doesn’t fit every trial. Compare two trials where only one concentration changes."},"tc2":{"empty":"Enter \u003ci>k\u003c/i> for R2 and choose its units.","tenth":"rate = \u003ci>k\u003c/i>[X]², so divide by [X]² = 0.010, not by [X].","first":"Those are first-order units. The units of \u003ci>k\u003c/i> make the rate come out in mol/(L·s), so they change with the overall order.","rate":"That’s the rate itself.","unit":"Choose the units of \u003ci>k\u003c/i>.","units":"The units of \u003ci>k\u003c/i> make the rate come out in mol/(L·s), so they change with the overall order.","wrong":"Substitute one trial into rate = \u003ci>k\u003c/i>[X]² and solve for \u003ci>k\u003c/i>."},"tc3":{"need2":"Build a two-step mechanism: add two cards.","slow":"Mark the slow step.","s34":"The steps add up, but the slow step predicts rate = \u003ci>k\u003c/i>[A]².","s12":"The slow step’s rate law would contain AB, an intermediate you can’t add to the flask. Here the slow step must be the first one.","s14":"AB and A₂ don’t cancel; the steps must add up to 2A + B → A₂B.","order":"An intermediate has to be made before a step can use it. Put the step that makes it first.","sum":"The steps must add up to 2A + B → A₂B.","inter":"The slowest step sets the rate, and a rate law contains only species you can add to the flask.","nomatch":"The steps add up, but the slow step doesn’t give rate = \u003ci> ,"options":[{"t":"“A catalyst appears in the overall equation; an intermediate doesn’t.”","why":"Neither appears.","_n":"3ka95","_k":"6aa62d50"},{"t":"“Both cancel from the overall equation, but a catalyst is present at the start and is remade, while an intermediate is formed and then used up.”","why":"An intermediate is made, then used up. A catalyst is used, then made again.","_n":"3la65","_k":"d4eb4643"},{"t":"“An intermediate speeds the reaction; a catalyst is made in a step.”","why":"An intermediate is made, then used up. A catalyst is used, then made again.","_n":"3ma55","_k":"30c2f4c2"},{"t":"“They’re the same thing.”","why":"An intermediate is made, then used up. A catalyst is used, then made again.","_n":"3na45","_k":"66b5dbd4"}]}},{"id":"c2","cat":"C","goal":[2,6],"a":{"prompt":"A student says, ‘The order in B is 2 because B’s coefficient is 2.’ Which is the best response?","options":[{"t":"“The order equals the rate ratio from one trial.”","why":"The order is an exponent, not a ratio.","_n":"3oa35","_k":"2c66331a"},{"t":"“Correct: orders always match coefficients.”","why":"Orders come from experiments. Only for a single elementary step do the coefficients give the orders.","_n":"3paa5","_k":"99548463"},{"t":"“The order in B is 1, because there is one B in the formula.”","why":"Formulas don’t set orders.","_n":"3qa95","_k":"7d4d82e2"},{"t":"“Orders must be found from experiments; coefficients equal orders only for a single elementary step.”","why":"Orders come from experiments. Only for a single elementary step do the coefficients give the orders.","_n":"3ra85","_k":"e7b10097"}]},"b":{"prompt":"A student doubled [A] and [B] together, saw the rate × 8, and concluded the order in A is 3. Which is the best response?","options":[{"t":"“Correct: 2³ = 8.”","why":"Change only one concentration between two trials, or you can’t tell which one caused the change.","_n":"3sa75","_k":"8518c9ca"},{"t":"“The order is 8.”","why":"The order is an exponent, not a ratio.","_
