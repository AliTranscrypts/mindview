.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}

.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

/* SCH4U 49: hero drop, Rusting simulator (C10 surface cell), Protect the bridge, practice, Protect the steel */
/* Module tokens: --cr-rust (rust fill; outlined with --at-s, #D8D08F in dark mode), --cr-oil (oil layer on boiled water). */
:root{--cr-rust:#8A4A1E;--cr-oil:#EEDC98}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--cr-rust:#6B3A17;--cr-oil:#4A4220} }
:root[data-theme="dark"]{--cr-rust:#6B3A17;--cr-oil:#4A4220}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* animated electrons and ions (static arrows stay; dots are skipped with reduced motion) */
@keyframes crE{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes crI{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(0,-34px);opacity:0}}
.cr-ea{animation:crE 1.8s linear infinite}
.cr-ia{animation:crI 2.2s linear infinite}
@media (prefers-reduced-motion:reduce){ .cr-ea,.cr-ia{animation:none;display:none} }

/* hero */
.cr-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.cr-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.cr-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Explore: Rusting simulator */
.cr-modes{margin:0 0 12px}
.cr-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.cr-grid.cr-wide{grid-template-columns:minmax(0,1fr)}
.cr-view,.cr-side{min-width:0}
.cr-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.cr-svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.cr-cap{min-height:1.5em;margin:10px 0 2px;font-size:1rem}
.cr-ctl > div + div{margin-top:12px}
.cr-ctl [hidden],.cr-ctl[hidden]{display:none}
.cr-time{display:flex;flex-direction:column;gap:4px}
.cr-time input{width:100%;max-width:360px;min-height:32px}
.cr-h4{margin:14px 0 6px;font-size:1rem;text-align:left}
.cr-read{margin-top:6px}
.cr-pp-svg{display:block;width:100%;max-width:300px;height:auto;font-family:var(--font-ui)}
.cr-note{margin:12px 0 0}
.cr-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cr-pn{min-width:0;border-radius:12px;padding:4px}
.cr-pn.on{box-shadow:0 0 0 3px var(--hi)}
.cr-pt{margin:0 0 6px;font-size:.92rem}
.cr-bars{display:block;width:100%;max-width:560px;height:auto;margin-top:10px;font-family:var(--font-ui)}
.cr-ni{margin:0 0 8px}
.cr-nt{border-collapse:collapse;width:100%;margin-top:10px}
.cr-nt th,.cr-nt td{border-top:1px solid var(--rule);padding:6px 4px;text-align:left;vertical-align:middle}
.cr-nt tbody th{width:2.5em}
@media (max-width:700px){
  .cr-grid{grid-template-columns:minmax(0,1fr)}
  .cr-two{grid-template-columns:minmax(0,1fr)}
}

/* Part 3: Protect the bridge */
.cr-st h3{margin-bottom:6px}
#p3-app > .cr-st:first-child{margin-top:0;padding-top:0;border-top:0}
.cr-br .cr-bm{cursor:pointer}
.cr-parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.cr-pb.ok{border-color:var(--green)}

.cr-prog{margin:10px 0 0}
.cr-data{margin-top:14px}

.cr-lad tr.cr-fe td{background:var(--hi-soft);font-weight:700}
.cr-st-svg{display:block;width:100%;max-width:480px;height:auto;margin:8px 0;font-family:var(--font-ui)}

/* Practice: Which metal corrodes? */
.cr-mets{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.cr-met{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;min-height:64px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet);color:var(--ink);padding:6px 12px}
.cr-met .cr-sym{font-size:1.25rem;font-weight:700}
.cr-met .cr-mn{font-size:.82rem;color:var(--ink-2)}
.cr-met.right{border-color:var(--green);background:var(--good-bg)}
.cr-met.wrong{border-color:var(--red);background:var(--bad-bg)}
.cr-met:disabled{opacity:1}
.cr-chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cr-unit{margin-left:6px;color:var(--ink-2)}

/* Task: Protect the steel */
.cr-tc,.cr-tb{margin-bottom:12px}
.cr-tl{margin:4px 0 0}
.cr-conds{margin:8px 0 0 1.2em}

03ci>E\u003c/i>°\u003csub>cell\u003c/sub> = +0.85 V\u003c/span>","eqLabel":"2 F e solid plus O 2 gas plus 2 H 2 O liquid gives 2 F e 2 plus aqueous plus 4 O H minus aqueous; E zero cell equals plus 0.85 volts","eqSize":"sm","headline":"Rust is a battery you didn’t ask for","text":"Wherever iron, \u003cstrong>water\u003c/strong> and \u003cstrong>oxygen\u003c/strong> meet, a tiny \u003cstrong>galvanic cell\u003c/strong> forms. Part of the iron becomes an \u003cstrong>anode\u003c/strong> and dissolves; another part becomes a \u003cstrong>cathode\u003c/strong> where oxygen is reduced. Stop the cell, or give it a different anode, and the iron is safe.","fig":{"html":"\u003cdiv class=\"cr-hx\">\u003csvg class=\"cr-hx-svg\" id=\"cr-hx-svg\" viewBox=\"0 0 460 250\" role=\"img\" aria-label=\"A water drop sits on a grey iron plate. Small blue O₂ dots crowd the drop’s edge. At the centre, Fe²⁺ ions leave the plate. Violet electron dots run through the plate from the centre to the edge, where O₂ becomes OH⁻. A brown rust ring grows between the two. Anode at the centre, cathode at the edge.\">\u003c/svg>\u003cdiv class=\"cr-hx-row\">\u003cp class=\"cr-hx-ctr\" id=\"cr-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"cr-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can write the anode and cathode half-reactions for iron rusting and explain where each happens in a water drop.","I can explain why rusting needs oxygen and water, and why salt speeds it up.","I can use the reduction table to predict which of two metals in contact corrodes.","I can calculate \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for a corrosion cell and judge whether corrosion is spontaneous.","I can explain how painting, galvanizing, sacrificial anodes and impressed current protect steel, and choose a method for a situation.","I can analyse health, safety and cost issues of corrosion, such as lead in drinking water and salt-damaged br  the most negative value.","Zn, −0.76 V."]},{"id":"w4","skill":"Reading the reduction table","goal":3,"prompt":"Which species is the strongest oxidizing agent: O₂ (in water, +0.40 V), Cu²⁺ (+0.34 V), Fe²⁺ (−0.45 V) or Zn²⁺ (−0.76 V)?","options":[{"t":"O₂","why":"The highest reduction potential: most easily reduced.","_n":"cad4","_k":"980be372"},{"t":"Zn²⁺","why":"−0.76 V: hardest to reduce.","_n":"daa4","_k":"a34240bf"},{"t":"Cu²⁺","why":"+0.34 V is close, but +0.40 V is higher.","_n":"eab4","_k":"f7e1bde9"},{"t":"Fe²⁺","why":"−0.45 V is below +0.40 V.","_n":"fa84","_k":"c7a48098"}],"hints":["Oxidizing agents are reduced.","Highest \u003ci>E\u003c/i>° wins.","O₂."]},{"id":"w5","skill":"E°cell","goal":4,"prompt":"A cell has cathode \u003ci>E\u003c/i>° = +0.34 V and anode \u003ci>E\u003c/i>° = −0.76 V. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub>?","options":[{"t":"+1.10 V","why":"0.34 − (−0.76).","_n":"ga94","_k":"71fb4bf7"},{"t":"+0.42 V","why":"−(−0.76) = +0.76.","_n":"hb64","_k":"807dd0b1"},{"t":"−1.10 V","why":"Cathode minus anode.","_n":"ib74","_k":"7cfd2a9d"},{"t":"−0.42 V","why":"Subtract the anode’s reduction potential.","_n":"ja84","_k":"a33faf84"}],"hints":["\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>.","0.34 − (−0.76).","+1.10 V."]},{"id":"w6","skill":"E°cell","goal":4,"prompt":"What does a positive \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> tell you?","options":[{"t":"Electrons flow from the cathode to the anode","why":"They flow anode → cathode.","_n":"ka74","_k":"bdfbfda6"},{"t":"The reaction is fast","why":"Potential says nothing about rate.","_n":"la64","_k":"95c31d20"},{"t":"The reaction is spontaneous as written","why":"A galvanic cell runs on its own.","_n":"ma54","_k":"4e518e51"},{"t":"The reaction needs a power supply","why":"That’s a negative \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> (electrolysis).","_n":"nac4","_k":"9cfed99b"}],"hints":["Positive means ‘goes’.","It says nothing about speed.","Spontaneous."]}],"refreshers":{"Half-reactions":"Oxidation loses electrons (they appear as products); reduction gains them. The oxidizing agent is the species reduced.","Reading the reduction table":"Higher \u003ci>E\u003c/i>°: more easily reduced (a strong oxidizing agent). Lower \u003ci>E\u003c/i>°: the metal is more easily oxidized (a strong reducing agent).","E°cell":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, using reduction potentials as listed. Positive means spontaneous."}}},"explore":{"heading":"Rusting simulator","intro":"Change the conditions and the protection. Watch where electrons go, which metal dissolves, and how fast.","how":"Choose a view, then set the environment, the oxygen and the protection. Drag the time slider (arrow keys; Shift for 10 weeks). The drop, the protection panel and the readout update as you go.","modelNote":"Model rates for comparison, not real-world speeds.","modes":[{"id":"drop","t":"Drop view"},{"id":"side","t":"Side-by-side"},{"id":"nail","t":"Nail inquiry"}],"envs":[{"id":"dry","t":"Dry air"},{"id":"humid","t":"Humid air"},{"id":"fresh","t":"Fresh water"},{"id":"salt","t":"Salt water (road-salt slush)"}],"o2s":[{"id":"on","t":"Present"},{"id":"off","t":"Removed (boiled water under an oil layer)"}],"prots":[{"id":"none","t":"None"},{"id":"paintI","t":"Paint (intact)"},{"id":"paintS","t":"Paint (scratched)"},{"id":"galvI","t":"Galvanized (intact)"},{"id":"galvS","t":"Galvanized (scratched)"},{"id":"tinI","t":"Tin-plated (intact)"},{"id":"tinS","t":"Tin-plated (scratched)"},{"id":"block","t":"Block connected"},{"id":"imp","t":"Impressed current"}],"blocks":[{"id":"Mg","t":"Mg"},{"id":"Al","t":"Al"},{"id":"Zn","t":"Zn"},{"id":"Sn","t":"Sn"},{"id":"Cu","t":"Cu"}],"tubes":[{"id":"A","t":"Dry air with a drying agent","env":"dry","o2":"on"},{"id":"B","t":"Boiled water under oil","env":"fresh","o2":"off"},{"id":"C","t":"Tap water","env":"fresh","o2":"on"},{"id":"D","t":"Salt water","env":"salt","o2":"on"}],"obs":[{"id":"0","t":"No rust"},{"id":"1","t":"A little rust"},{"id":"2","t":"Lots of rust"}],"nailIntro":"Four nails sit in four test tubes for 1 week. Run the inquiry, then record what you see in the results table.","nailDone":"A and C differ only in water: water is needed. B and C differ only in oxygen: oxygen is needed. C and D differ only in salt: dissolved ions speed rusting up.","predictions":[{"id":"p1","prompt":"Drop view, fresh water, no protection. Where does the iron dissolve?","options":[{"t":"At the edge of the drop","_n":"oab4","_k":"2bac1577"},{"t":"Evenly everywhere under the drop","_n":"paa4","_k":"58af64d3"},{"t":"Nowhere, because rust just forms on top","_n":"qa94","_k":"04d3098e"},{"t":"At the centre of the drop","_n":"rb04","_k":"b7e3a2ba"}],"explain":"The centre gets the least oxygen, so it becomes the anode. Electrons travel through the iron to the oxygen-rich edge. Iron dissolves at the anode (the centre). Rust appears where Fe²⁺ meets OH⁻ from the cathode, between the centre and the edge."},{"id":"p2","prompt":"Side-by-side: fresh water vs salt water. Which nail rusts faster, and why?","options":[{"t":"Fresh water, because salt blocks oxygen","_n":"saf4","_k":"aa427d57"},{"t":"Same rate, because \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is the same","_n":"ta24","_k":"32582d5c"},{"t":"Salt water, because salt oxidizes iron","_n":"ua34","_k":"e4c0bce8"},{"t":"Salt water, because the ions carry charge between the anode and the cathode","_n":"va44","_k":"d7b45977"}],"explain":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> doesn’t change, but the circuit through the water conducts better. O₂ is the oxidizing agent. Salt only carries charge between the anode and the cathode, so the cell runs faster."},{"id":"p3","prompt":"Salt water, galvanized (scratched). What happens at the scratch?","options":[{"t":"The iron rusts twice as fast","_n":"wa54","_k":"eb35db78"},{"t":"The iron stays bright; the zinc around it corrodes","_n":"xa64","_k":"5383c48f"},{"t":"Both metals corrode equally","_n":"ya74","_k":"b1f67bf0"},{"t":"The iron rusts like bare iron","_n":"za84","_k":"a1daf434"}],"explain":"Zn (−0.76 V) is oxidized before Fe (−0.45 V), so it’s the anode."},{"id":"p4","prompt":"Salt water, tin-plated (scratched). Compared with bare iron, the scratch…","options":[{"t":"rusts slower","_n":"10a94","_k":"a7b3aad6"},{"t":"doesn’t rust","_n":"11aa4","_k":"8bf7894b"},{"t":"rusts at the same rate","_n":"12ab4","_k":"09074dfb"},{"t":"rusts faster","_n":"13ac5","_k":"ba8f0757"}],"explain":"Sn (−0.14 V) is higher than Fe (−0.45 V), so the iron becomes the anode and the tin a large cathode. A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. In Side-by-side, the challenge checks the panel you are editing. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,5],"prompt":"Stop the iron rusting in salt water \u003cstrong>without\u003c/strong> coating it.","why":"A Mg, Al or Zn block is oxidized instead of the iron, and impressed current makes the steel the cathode. Either way, something else is the anode.","general":"The iron still rusts. Set salt water, then find a way to make something else the anode.","hints":["Make something else the anode.","Choose a block with \u003ci>E\u003c/i>° below −0.45 V, or use a power supply.","Mg, Al or Zn block, or impressed current."]},{"id":"tc2","goal":[3,5],"prompt":"The iron is in salt water and its coating is scratched. Find the coating that still keeps the iron from rusting.","why":"Zinc (−0.76 V) is oxidized before iron (−0.45 V), so the zinc around the scratch keeps protecting the bare iron.","general":"Choose salt water and a scratched coating that keeps the iron rate at 0.","hints":["Which coating metal is oxidized before iron?","Compare Zn −0.76 V and Sn −0.14 V with Fe −0.45 V.","Galvanized."]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Block mode, salt water. Choose the 100 g block that protects the iron \u003cstrong>and\u003c/strong> lasts longest.","why":"Al: each 27 g gives 3 mol e⁻, the most per gram, so the block lasts 111 weeks. Real sacrificial anodes are often aluminium or zinc alloys. Pure aluminium seals itself with an oxide layer, so it’s alloyed to keep it active.","general":"Choose Block connected in salt water, then compare the blocks’ lifetimes.","hints":["First rule out blocks that don’t protect.","A block lasts as long as its electrons last: compare moles of electrons per gram, \u003ci>n\u003c/i> ÷ \u003ci>M\u003c/i>.","Al: each 27 g gives 3 mol e⁻, the most per gram."]}]},"part3":{"slug":"protect","name":"Protect","heading":"Protect the bridge","intro":"Choose protection for a real structure. Each choice either blocks the cell or makes something else the anode. Open \u003cstrong>Check it with data\u003c/strong> to see each choice on the reduction table.","s1":{"title":"Station 1: The bridge","intro":"A Canadian highway bridge in winter. Tap a part of the bridge, then choose how to protect it.","parts":[{"id":"g","name":"Steel girders in road-salt spray","short":"Girders","choices":[{"t":"Paint plus galvanizing","fb":"Right. The paint blocks salt spray, and the zinc (−0.76 V) is oxidized instead of the iron (−0.45 V) at any scratch.","_n":"14ab5","_k":"021e3d41"},{"t":"Paint with sacrificial anodes","fb":"Right. The paint blocks salt spray, and the anodes (Mg, Al or Zn, all below −0.45 V) are oxidized instead of the steel.","_n":"15ae5","_k":"0d17e77b"},{"t":"Tin plating","fb":"Tin (−0.14 V) is above iron (−0.45 V): at a scratch, the steel becomes the anode and rusts faster.","_n":"16ad5","_k":"6cc5a59e"},{"t":"Paint only","fb":"Paint only blocks. Salt spray and scratches will reach bare steel, and nothing else is the anode.","_n":"17a85","_k":"47c648db"}]},{"id":"r","name":"Steel reinforcing bars (rebar) inside concrete","short":"Rebar","choices":[{"t":"Epoxy-coated rebar","fb":"Right. The epoxy blocks the salty water that seeps into the concrete.","_n":"18a75","_k":"5087bbd0"},{"t":"Galvanized rebar","fb":"Right. Zinc (−0.76 V) is oxidized before iron (−0.45 V), even where the coat is damaged.","_n":"19aa5","_k":"a3057d8b"},{"t":"Impressed current","fb":"Right. The power supply’s negative terminal makes the rebar the cathode, so it isn’t oxidized.","_n":"1aa95","_k":"c2853b7b"},{"t":"Copper-coated rebar","fb":"Copper (+0.34 V) is above iron (−0.45 V): where the coat is damaged, the steel becomes the anode.","_n":"1bb45","_k":"a686b58f"}]},{"id":"p","name":"A steel pier in a river","short":"Pier","choices":[{"t":"Sacrificial anodes","fb":"Right. Mg, Al or Zn blocks (below −0.45 V) are oxidized instead of the steel, even where it is scratched underwater.","_n":"1cb35","_k":"47646fce"},{"t":"Impressed current","fb":"Right. The steel is wired to the negative terminal, so it is the cathode.","_n":"1d265","_k":"92a7a028"},{"t":"Paint only","fb":"Underwater paint gets scratched and can’t be renewed; bare steel then rusts.","_n":"1e275","_k":"08fe8e4f"},{"t":"Tin plating","fb":"Tin (−0.14 V) is above iron (−0.45 V): a scratch makes the steel the anode.","_n":"1f245","_k":"de4404f3"}]},{"id":"c","name":"A copper drain fitting bolted to a steel beam","short":"Copper fitting","choices":[{"t":"Insulate the joint","fb":"Right. Cu (+0.34 V) would make the steel (−0.45 V) the anode. An insulating washer breaks the electrical contact, so there is no cell.","_n":"1g255","_k":"d4ae181c"},{"t":"Use a copper bolt as well","fb":"More copper touching the steel means a bigger cathode: the steel (−0.45 V) corrodes faster.","_n":"1h2a5","_k":"cfbae588"},{"t":"Nothing: copper doesn’t rust","fb":"The copper is safe, but it is the cathode: the steel (−0.45 V) becomes the anode and corrodes faster.","_n":"1i2b5","_k":"6c9b262a"},{"t":"Bolt it on tighter","fb":"Better contact makes the cell work better: Cu (+0.34 V) makes the steel (−0.45 V) the anode.","_n":"1j285","_k":"e5982cab"}]}],"done":"All four parts are protected. Every good choice either blocks the cell or puts a metal below iron’s −0.45 V (or a power supply’s negative terminal) in charge of the electrons."},"s2":{"title":"Station 2: Lead in drinking water","html":"\u003cp>Many older homes have \u003cstrong>lead service pipes\u003c/strong>. Lead (Pb²⁺/Pb, −0.13 V) is oxidized more easily than copper (+0.34 V), so a lead pipe joined to copper corrodes faster at the joint, releasing Pb²⁺ into the water.\u003c/p>\u003cp>Water utilities adjust pH and add corrosion inhibitors to slow this; replacing lead pipes is the lasting fix. Health Canada sets a guideline for the most lead allowed in drinking water.\u003c/p>"},"s3":{"title":"Station 3: Why aluminium siding doesn’t rust away","html":"\u003cp>Al (−1.66 V) is very easily oxidized, but its oxide layer is thin, tight and sealing, so the metal underneath is protected (\u003cstrong>passivation\u003c/strong>). Aluminium forms a thin, tight oxide layer that seals the metal underneath.\u003c/p>\u003cp>Iron’s rust, in contrast, flakes off and exposes fresh metal.\u003c/p>"},"s4":{"title":"Station 4: Cost","html":"\u003cp>Corrosion is one of the largest maintenance costs for roads, bridges and pipelines. Every coat of paint, every zinc bath and every sacrificial anode is spent to keep a galvanic cell from eating the steel.\u003c/p>"},"quickCheck":{"title":"Quick check","summary":"Protect the bridge quick check","items":[{"id":"q1","goal":3,"prompt":"A copper fitting touches a steel beam in salty spray. Which corrodes?","choices":[{"t":"Neither","fb":"Fe (−0.45 V) is below Cu (+0.34 V): iron is the anode.","_n":"1k295","_k":"ce94c64f"},{"t":"The copper","fb":"Fe (−0.45 V) is below Cu (+0.34 V): iron is the anode.","_n":"1l2e5","_k":"d046d1b0"},{"t":"Both equally","fb":"Fe (−0.45 V) is below Cu (+0.34 V): iron is the anode.","_n":"1m2f5","_k":"79807dea"},{"t":"The steel","fb":"Right. Fe (−0.45 V) is below Cu (+0.34 V): iron is the anode.","_n":"1n404","_k":"ce48b8b9"}]},{"id":"q2","goal":6,"prompt":"Why do lead pipes joined to copper pipes raise lead levels?","choices":[{"t":"Water oxidizes copper only","fb":"Pb (−0.13 V) is below Cu (+0.34 V).","_n":"1o3f4","_k":"b5a6aaf0"},{"t":"Lead is reduced","fb":"Pb (−0.13 V) is below Cu (+0.34 V).","_n":"1p3e4","_k":"1cbf9538"},{"t":"Copper dissolves and turns into lead","fb":"Pb (−0.13 V) is below Cu (+0.34 V).","_n":"1q3d4","_k":"4fb01600"},{"t":"Lead becomes the anode and dissolves","fb":"Right. Pb (−0.13 V) is below Cu (+0.34 V).","_n":"1r3c4","_k":"70496b03"}]},{"id":"q3","goal":6,"prompt":"Why does aluminium resist corrosion outdoors?","choices":[{"t":"Its \u003ci>E\u003c/i>° is high","fb":"Its \u003ci>E\u003c/i>° is actually very low; the oxide layer protects it.","_n":"1s3b4","_k":"d83a9b80"},{"t":"It is always painted","fb":"Its \u003ci>E\u003c/i>° is actually very low; the oxide layer protects it.","_n":"1t3a4","_k":"fe19d898"},{"t":"It doesn’t react with oxygen","fb":"Its \u003ci>E\u003c/i>° is actually very low; the oxide layer protects it.","_n":"1u394","_k":"1cb98829"},{"t":"A sealing oxide layer forms","fb":"Right. Aluminium forms a thin, tight oxide layer that seals the metal underneath.","_n":"1v384","_k":"219a8954"}]},{"id":"q4","goal":5,"prompt":"Which protection keeps working if a bridge pier is scratched underwater?","choices":[{"t":"Paint","fb":"Barriers fail at a scratch; a sacrificial anode doesn’t.","_n":"1w374","_k":"c99d9df9"},{"t":"Oil","fb":"Barriers fail at a scratch; a sacrificial anode doesn’t.","_n":"1x3a4","_k":"17755444"},{"t":"Tin plating","fb":"Barriers fail at a scratch; a sacrificial anode doesn’t.","_n":"1y3b4","_k":"0e8c7b16"},{"t":"Sacrificial anodes","fb":"Right. A sacrificial anode keeps being oxidized instead of the steel.","_n":"1z3c4","_k":"d3b2ad3b"}]}]}},"practice":{"activities":[{"id":"pairs","type":"custom","title":"Which metal corrodes?","summary":"Which metal corrodes?","goal":3,"instruction":"Two metals touch in salt water. Tap the metal that corrodes.","how":"Tap a metal. Each pair has three levels of help.","items":[{"id":"m1","a":"Fe","b":"Zn","_a":"RGwMQA==","fb":"Zn −0.76 V is below Fe −0.45 V. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode."},{"id":"m2","a":"Fe","b":"Cu","_a":"RHAHQA==","fb":"Fe −0.45 V is below Cu +0.34 V."},{"id":"m3","a":"Fe","b":"Sn","_a":"RHAHQA==","fb":"Sn −0.14 V is higher, so iron is the anode. A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster."},{"id":"m4","a":"Fe","b":"Mg","_a":"RHsFQA==","fb":"Mg −2.37 V is far below iron."},{"id":"m5","a":"Cu","b":"Ag","_a":"RHUXQA==","fb":"Cu +0.34 V is below Ag +0.80 V."},{"id":"m6","a":"Al","b":"Cu","_a":"RHcOQA==","fb":"Al −1.66 V is below Cu (ignoring the oxide layer)."},{"id":"m7","a":"Pb","b":"Cu","_a":"RGYAQA==","fb":"Pb −0.13 V is below Cu +0.34 V: the lead-pipe problem."},{"id":"m8","a":"Fe","b":"Ni","_a":"RHAHQA==","fb":"Ni −0.26 V is higher than Fe −0.45 V."}]},{"id":"reason","type":"custom","title":"Corrosion reasoning","summary":"Corrosion reasoning","star":true,"goal":[2,4,5],"instruction":"Six items: number entry and choices. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type your answer or tap your choice, then press Check. Signs count for cell potentials.","items":[{"id":"r1","kind":"num","goal":4,"prompt":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for iron rusting in neutral water (cathode O₂ + 2H₂O + 4e⁻ → 4OH⁻).","_a":"VhhaVw==","tol":0.005,"unit":"V","display":"+0.85 V","wrong":[{"match":-0.05,"fb":"Don’t add; subtract the anode. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, with both taken from the reduction table: 0.40 − (−0.45) = +0.85 V."},{"match":-0.85,"fb":"Cathode minus anode, not anode minus cathode."}],"fb":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>.","why":"0.40 − (−0.45) = +0.85 V: spontaneous.","hints":["The cathode is the O₂ half-reaction; the anode is iron.","0.40 − (−0.45).","+0.85 V."]},{"id":"r2","kind":"num","goal":4,"prompt":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for iron rusting in acidic water (cathode O₂ + 4H⁺ + 4e⁻ → 2H₂O).","_a":"VxhUWg==","tol":0.005,"unit":"V","display":"+1.68 V","wrong":[{"match":0.78,"fb":"1.23 − (−0.45) = 1.68. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, with both taken from the reduction table: 0.40 − (−0.45) = +0.85 V."},{"match":-1.68,"fb":"Cathode minus anode."}],"fb":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, keeping the table’s signs.","why":"1.23 − (−0.45) = +1.68 V.","hints":["The acidic cathode is +1.23 V.","1.23 − (−0.45).","+1.68 V."]},{"id":"r3","kind":"num","star":true,"goal":4,"prompt":"How many moles of O₂ are used up when 0.20 mol of Fe is oxidized to Fe²⁺?","_a":"VhhT","tol":0.005,"unit":"mol","display":"0.10 mol","wrong":[{"match":0.2,"fb":"0.20 mol Fe gives 0.40 mol e⁻; each O₂ takes 4e⁻."},{"match":0.4,"fb":"That’s the moles of electrons. Each O₂ takes 4e⁻."}],"fb":"Count electrons: Fe gives 2e⁻ each; O₂ takes 4e⁻ each.","why":"0.20 mol Fe × 2 = 0.40 mol e⁻; 0.40 ÷ 4 = 0.10 mol O₂.","hints":["Fe → Fe²⁺ + 2e⁻.","0.40 mol e⁻.","O₂ takes 4 e⁻: 0.10 mol."]},{"id":"r4","kind":"chips","star":true,"goal":2,"prompt":"\u003cstrong>Investigation:\u003c/strong> Nail inquiry: tubes A (dry air with a drying agent), B (boiled water under oil), C (tap water), D (salt water). Which pair shows that oxygen is needed?","options":[{"t":"C and D","why":"C and D differ in salt, not oxygen.","_n":"203d4","_k":"6c31abe8"},{"t":"A and B","why":"Neither A nor B rusts, and they differ in more than one thing.","_n":"21364","_k":"95131473"},{"t":"B and C","why":"B and C both have water; only C has oxygen, and only C rusts.","_n":"22374","_k":"fcf0fc5a"},{"t":"A and C","why":"A and C differ in water, not oxygen.","_n":"23384","_k":"3aad2733"}],"hints":["A fair test changes one variable.","Find two tubes that both have water but differ in oxygen.","B (no oxygen) and C (oxygen)."]},{"id":"r5","kind":"num","star":true,"goal":5,"prompt":"A 65.4 g zinc block protects a steel pipe. The corrosion current uses 0.050 mol e⁻ per week. How many weeks does the block last?","_a":"UgY=","tol":0.5,"unit":"weeks","display":"40 weeks","wrong":[{"match":20,"fb":"1.00 mol Zn gives \u003cstrong>2\u003c/strong>.00 mol e⁻."},{"match":80,"fb":"65.4 g of zinc is 1.00 mol, which gives 2.00 mol e⁻."}],"fb":"Find the moles of electrons the block can give, then divide by the electrons used per week.","why":"65.4 g ÷ 65.4 g/mol = 1.00 mol Zn → 2.00 mol e⁻; 2.00 ÷ 0.050 = 40 weeks.","hints":["Moles of Zn first.","Each Zn gives 2 e⁻: 2.00 mol e⁻.","2.00 ÷ 0.050 = 40 weeks."]},{"id":"r6","kind":"two","star":true,"goal":5,"prompt":"Which zinc-coated part is protected longer: a 1 mm coating or a 2 mm coating on the same area, under the same conditions? By what factor?","options":[{"t":"The 2 mm coating","_n":"24394","_k":"3278e9ee"},{"t":"The 1 mm coating","why":"A thinner coat holds less zinc, so it runs out of electrons sooner.","_n":"25324","_k":"b817f4b3"},{"t":"They last the same time","why":"Same area: twice the zinc gives twice the electrons, so twice the time.","_n":"26334","_k":"b7be26d5"}],"_a":"VA==","tol":0.01,"unit":"times as long","display":"2 mm, by a factor of 2","label":"By what factor?","wrong":[{"match":4,"fb":"Same area: twice the thickness is twice the zinc, not four times."},{"match":1,"fb":"Same area: twice the zinc gives twice the electrons, so twice the time."}],"fb":"Same area: twice the zinc gives twice the electrons, so twice the time.","hints":["A coating lasts as long as its zinc can give electrons.","Same area, twice the thickness: twice the zinc.","2 mm, by a factor of 2."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Kwabena","how":"","goal":[3,4],"instruction":"Kwabena made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Explain why scratched galvanized steel doesn’t rust.","steps":["The steel is coated with zinc.","From the table, Zn²⁺/Zn is −0.76 V and Fe²⁺/Fe is −0.45 V.","Iron has the higher reduction potential, so iron is oxidized first.","So the zinc only works as a paint."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 reads the table correctly.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Both metals are oxidized equally.","why":"One metal is the anode: the one with the lower \u003ci>E\u003c/i>°.","_n":"27245","_k":"2ac6d04b"},{"t":"Step 3 is correct.","why":"Check: which metal is the better reducing agent? A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"28235","_k":"311645cf"},{"t":"Higher \u003ci>E\u003c/i>° means more easily \u003cstrong>reduced\u003c/strong>, so zinc, with the lower \u003ci>E\u003c/i>°, is oxidized and protects the iron.","why":"A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"29265","_k":"4ee66474"},{"t":"Iron is oxidized, but more slowly.","why":"While zinc touches it, iron isn’t oxidized at all: zinc is the anode.","_n":"2a255","_k":"f00848bc"}],"hints":["What does a high \u003ci>E\u003c/i>° mean?","Easily reduced.","So zinc is oxidized."]},{"id":"e2","goal":4,"task":"Is rusting in acidic water spontaneous?","steps":["Anode: Fe → Fe²⁺ + 2e⁻ (\u003ci>E\u003c/i>° = −0.45 V).","Cathode: O₂ + 4H⁺ + 4e⁻ → 2H₂O (\u003ci>E\u003c/i>° = +1.23 V).","\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = 1.23 − 0.45 = +0.78 V.","Positive, so it’s spontaneous."],"_a":"VA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","The conclusion happens to hold, but the value is wrong."],"fixes":[{"t":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = −0.45 − 1.23 = −1.68 V.","why":"Cathode minus anode.","_n":"2b285","_k":"ec8b20f2"},{"t":"Step 3 is correct.","why":"Subtracting −0.45 adds 0.45. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, with both taken from the reduction table: 0.40 − (−0.45) = +0.85 V.","_n":"2c275","_k":"097b65d4"},{"t":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = 1.23 + 0.45 + 0.40 V.","why":"Only two half-reactions.","_n":"2d2a5","_k":"47d71a45"},{"t":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = 1.23 − (−0.45) = +1.68 V.","why":"Keep the table’s sign: subtracting −0.45 adds 0.45.","_n":"2e295","_k":"d6716d7f"}],"hints":["Keep the table’s sign.","1.23 − (−0.45).","+1.68 V."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: the tin scratch rusting faster, or the rust ring forming away from where the iron dissolves? Why?"},{"id":"j2","q":"In your own words, explain why rusting is a galvanic cell."},{"id":"j3","q":"Explain to a friend how to choose a metal for a sacrificial anode, using the reduction table."},{"id":"j4","q":"Which part of corrosion are you least sure about? What will you check first?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In a rusting water drop, which half-reaction happens at the anode?","options":[{"t":"2H₂O(l) → O₂(g) + 4H⁺(aq) + 4e⁻","why":"Water isn’t oxidized in rusting.","_n":"2f2c5","_k":"d0619fc5"},{"t":"Fe²⁺(aq) + 2e⁻ → Fe(s)","why":"That’s iron being reduced, the reverse.","_n":"2g2b5","_k":"e46038e1"},{"t":"Fe(s) → Fe²⁺(aq) + 2e⁻","why":"Iron is oxidized at the oxygen-poor centre.","_n":"2hbe5","_k":"e6ba5f6a"},{"t":"O₂(g) + 2H₂O(l) + 4e⁻ → 4OH⁻(aq)","why":"That’s the cathode. Iron dissolves at the anode (the centre). Rust appears where Fe²⁺ meets OH⁻ from the cathode, between the centre and the edge.","_n":"2ibf5","_k":"ee90b2d7"}]},"b":{"prompt":"In neutral water, which half-reaction happens at the cathode of a rusting drop?","options":[{"t":"O₂(g) + 2H₂O(l) + 4e⁻ → 4OH⁻(aq)","why":"Oxygen is reduced at the edge.","_n":"2jbc5","_k":"1f2d2c6e"},{"t":"2H⁺(aq) + 2e⁻ → H₂(g)","why":"Neutral water has very little H⁺; O₂ is reduced.","_n":"2kbd5","_k":"5f60f98f"},{"t":"Na⁺(aq) + e⁻ → Na(s)","why":"Salt ions only carry charge. O₂ is the oxidizing agent. Salt only carries charge between the anode and the cathode, so the cell runs faster.","_n":"2lba5","_k":"90122b5d"},{"t":"Fe(s) → Fe²⁺(aq) + 2e⁻","why":"That’s the anode.","_n":"2mbb5","_k":"54b9fa3f"}]}},{"id":"k2","cat":"K","goal":5,"a":{"prompt":"Which method protects a steel hull with a sacrificial anode?","options":[{"t":"Bolting copper plates to the hull","why":"Copper would make the steel the anode. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"2nb85","_k":"5e929206"},{"t":"Plating the hull with tin","why":"Tin is higher than iron. A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster.","_n":"2ob95","_k":"e06e4362"},{"t":"Painting the hull","why":"Paint is a barrier, not an anode.","_n":"2pb65","_k":"459d2136"},{"t":"Bolting magnesium blocks to the hull","why":"Mg (−2.37 V) is oxidized instead of the steel.","_n":"2qb75","_k":"f7eef315"}]},"b":{"prompt":"What is galvanizing?","options":[{"t":"Coating steel with zinc","why":"Zinc (−0.76 V) is oxidized instead of the iron, even at a scratch.","_n":"2reb5","_k":"45cc76d2"},{"t":"Connecting steel to a power supply","why":"That’s impressed current.","_n":"2sec5","_k":"cdad4239"},{"t":"Coating steel with copper","why":"Copper (+0.34 V) would make the steel the anode. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"2te95","_k":"789fb1b8"},{"t":"Coating steel with tin","why":"That’s tin plating.","_n":"2uea5","_k":"fcc89d71"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which two substances must both be present for iron to rust?","options":[{"t":"Oxygen and salt","why":"Without water there’s no cell.","_n":"2vef5","_k":"5da80835"},{"t":"Oxygen and water","why":"O₂ is reduced at the cathode, and water completes the cell.","_n":"2wf05","_k":"cc7cba90"},{"t":"Salt and water","why":"Salt speeds it up, but O₂ is the oxidizing agent.","_n":"2xed5","_k":"e0eb9345"},{"t":"Carbon dioxide and nitrogen","why":"These aren’t the reactants.","_n":"2yee5","_k":"79496129"}]},"b":{"prompt":"Why does road salt make cars rust faster?","options":[{"t":"Salt removes oxygen from the water","why":"Rusting would then slow down.","_n":"2zf35","_k":"de303385"},{"t":"Salt lowers iron’s reduction potential","why":"\u003ci>E\u003c/i>° values don’t change.","_n":"30f45","_k":"311e6dc7"},{"t":"Salt is the oxidizing agent","why":"O₂ is the oxidizing agent. Salt only carries charge between the anode and the cathode, so the cell runs faster.","_n":"31f16","_k":"fc34c322"},{"t":"Dissolved ions let charge flow more easily between anode and cathode areas","why":"The cell is the same; the circuit through the water conducts better.","_n":"32f06","_k":"76f8c397"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A tin-plated can and a galvanized can are both scratched and left in salty water. Which rusts faster at the scratch, and why?","options":[{"t":"Neither: any metal coating protects iron","why":"A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster.","_n":"33f36","_k":"7a4aea82"},{"t":"The tin can: iron (−0.45 V) is oxidized in preference to tin (−0.14 V)","why":"At the scratch, iron is the anode and the tin a large cathode.","_n":"34f26","_k":"7aa82b53"},{"t":"Both equally: the scratch exposes bare iron in both","why":"Zinc keeps protecting; tin doesn’t.","_n":"35ed6","_k":"afc22c1a"},{"t":"The galvanized can: zinc is a weaker coating","why":"A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"36ec6","_k":"4e9ca05e"}]},"b":{"prompt":"A copper bolt holds a steel plate on a boat. Where does corrosion speed up?","options":[{"t":"In the copper bolt, because copper is more reactive","why":"A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"37ef6","_k":"234d5ade"},{"t":"In the steel around the bolt, because iron becomes the anode","why":"Fe (−0.45 V) is below Cu (+0.34 V).","_n":"38ee6","_k":"6341611d"},{"t":"In both equally","why":"One metal is the anode.","_n":"39f96","_k":"5d5b0392"},{"t":"Nowhere: metals in contact protect each other","why":"Only a metal below iron protects it; copper is above. A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster.","_n":"3af86","_k":"91b70d57"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for iron corroding in neutral water (O₂ + 2H₂O + 4e⁻ → 4OH⁻, +0.40 V; Fe²⁺/Fe, −0.45 V)?","options":[{"t":"−0.85 V","why":"Anode minus cathode.","_n":"3b7f5","_k":"94b25430"},{"t":"+0.85 V","why":"0.40 − (−0.45).","_n":"3c805","_k":"c44ce8a9"},{"t":"+1.68 V","why":"That uses the acidic cathode (+1.23 V).","_n":"3d815","_k":"ea4bff9c"},{"t":"−0.05 V","why":"Added instead of subtracting. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>, with both taken from the reduction table: 0.40 − (−0.45) = +0.85 V.","_n":"3e825","_k":"5b8ab53a"}]},"b":{"prompt":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for zinc corroding in neutral water (+0.40 V cathode; Zn²⁺/Zn, −0.76 V)?","options":[{"t":"+1.16 V","why":"0.40 − (−0.76).","_n":"3f7b5","_k":"e9155593"},{"t":"−1.16 V","why":"Anode minus cathode.","_n":"3g7c5","_k":"daf5d888"},{"t":"+1.99 V","why":"That uses +1.23 V.","_n":"3h7d5","_k":"d0c1dffc"},{"t":"−0.36 V","why":"Added instead of subtracting: 0.40 − (−0.76) = +1.16 V.","_n":"3i7e5","_k":"3727b994"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Which metal block would \u003cstrong>not\u003c/strong> protect a steel ship hull?","options":[{"t":"Copper","why":"Cu (+0.34 V) is above iron, so the steel becomes the anode.","_n":"3j775","_k":"a9f647ba"},{"t":"Aluminium","why":"−1.66 V: protects.","_n":"3k785","_k":"5cf0741f"},{"t":"Magnesium","why":"−2.37 V: protects.","_n":"3l055","_k":"3066d7d8"},{"t":"Zinc","why":"−0.76 V: protects.","_n":"3m045","_k":"d4d0d870"}]},"b":{"prompt":"Which metal, connected to steel in seawater, would make the steel corrode \u003cstrong>faster\u003c/strong>?","options":[{"t":"Nickel","why":"Ni (−0.26 V) is above Fe (−0.45 V).","_n":"3n035","_k":"e5830daf"},{"t":"Magnesium","why":"Mg (−2.37 V) is below iron, so it protects the steel. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"3o025","_k":"ff6456f4"},{"t":"Zinc","why":"Zn (−0.76 V) is below iron, so it protects the steel. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"3p015","_k":"b38fbf80"},{"t":"Aluminium","why":"Al (−1.66 V) is below iron, so it protects the steel. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"3q005","_k":"53f10a18"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why rust appears in a ring away from the centre of a water drop on iron?","options":[{"t":"“Salt collects in a ring.”","why":"O₂ is the oxidizing agent. Salt only carries charge between the anode and the cathode, so the cell runs faster.","_n":"3rff5","_k":"849a8127"},{"t":"“Iron dissolves at the oxygen-poor centre (the anode); Fe²⁺ ions drift out and meet OH⁻ made at the oxygen-rich edge (the cathode), forming rust between them.”","why":"Anode at the centre, cathode at the edge, rust where the ions meet.","_n":"3sfe5","_k":"829306fa"},{"t":"“Rust forms exactly where the iron dissolves.”","why":"Iron dissolves at the anode (the centre). Rust appears where Fe²⁺ meets OH⁻ from the cathode, between the centre and the edge.","_n":"3tfd5","_k":"637419ab"},{"t":"“The edge dries first, so rust forms there.”","why":"It’s about oxygen, not drying.","_n":"3ufc5","_k":"6bcd869d"}]},"b":{"prompt":"Which is the best explanation of why aluminium window frames don’t corrode away, even though Al has a very low \u003ci>E\u003c/i>°?","options":[{"t":"“A thin, tight layer of aluminium oxide forms and seals the metal from oxygen and water.”","why":"That’s passivation.","_n":"3v735","_k":"9b111bb2"},{"t":"“Aluminium doesn’t react with oxygen.”","why":"It does; that’s what makes the layer.","_n":"3w745","_k":"def3f5af"},{"t":"“Rain washes away the corrosion.”","why":"The oxide layer stays and protects.","_n":"3x715","_k":"df3f14ed"},{"t":"“Aluminium’s \u003ci>E\u003c/i>° is high, so it isn’t oxidized.”","why":"Its \u003ci>E\u003c/i>° is very low (−1.66 V). Aluminium forms a thin, tight oxide layer that seals the metal underneath.","_n":"3y725","_k":"dc39fb93"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which description of cathodic protection with a magnesium block is correct?","options":[{"t":"“The magnesium paints a layer on the steel.”","why":"It’s an anode, not a coating.","_n":"3z6f5","_k":"0772bb9f"},{"t":"“Electrons flow from the steel into the magnesium.”","why":"Then the steel would be the anode.","_n":"40705","_k":"3b7fe51d"},{"t":"“The magnesium works without any connection.”","why":"The block must be wired or touching the steel so electrons can flow from it into the steel.","_n":"416d5","_k":"8c6954a7"},{"t":"“Electrons flow from the magnesium through the wire into the steel, where O₂ is reduced. The magnesium is used up.”","why":"Magnesium is the anode; the steel is the cathode.","_n":"426e5","_k":"11a0f04a"}]},"b":{"prompt":"Which description of impressed-current protection is correct?","options":[{"t":"“No connection to the steel is needed.”","why":"The block must be wired or touching the steel so electrons can flow from it into the steel.","_n":"437b5","_k":"7143cfd4"},{"t":"“The positive terminal connects to the steel.”","why":"That would make the steel the anode.","_n":"447c5","_k":"0944ceba"},{"t":"“The negative terminal of a power supply connects to the steel, so the steel is the cathode.”","why":"The supply pushes electrons into the steel.","_n":"45795","_k":"79b1e196"},{"t":"“The supply heats the steel to drive off water.”","why":"It supplies electrons.","_n":"46785","_k":"420ea8b3"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A steel gas pipeline will be buried in moist soil for 50 years and can’t be repainted. Which protection fits best?","options":[{"t":"One coat of paint only","why":"It will be scratched and can’t be renewed.","_n":"477b5","_k":"ab0db830"},{"t":"Tin plating","why":"A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster.","_n":"487a5","_k":"b209e090"},{"t":"Wrapping it in copper foil","why":"Copper (+0.34 V) would make the steel the anode. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"497d5","_k":"6500ca2c"},{"t":"Cathodic protection (sacrificial anodes or impressed current), added to a coating","why":"The coating blocks; the cathodic protection covers every scratch for decades.","_n":"4a7c5","_k":"c581d820"}]},"b":{"prompt":"A steel boat trailer is dipped in salt water every weekend and often scraped on rocks. Which protection fits best?","options":[{"t":"Tin plating","why":"A tin coat only blocks. Once scratched, iron (−0.45 V) is oxidized instead of tin (−0.14 V), so it rusts faster.","_n":"4b7f5","_k":"48ff159d"},{"t":"Paint only","why":"Scrapes expose bare steel.","_n":"4c7e5","_k":"7bc66ce3"},{"t":"Copper plating","why":"Copper (+0.34 V) would make the steel the anode. A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"4d715","_k":"f54d3874"},{"t":"Galvanizing","why":"The zinc keeps protecting even where it’s scraped.","_n":"4e705","_k":"b2527b9f"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"An older home’s lead service pipe was joined to new copper pipe. Why can this raise lead levels in the tap water?","options":[{"t":"Lead (−0.13 V) is oxidized in preference to copper (+0.34 V), so the lead dissolves as Pb²⁺","why":"Lead is the anode at the joint.","_n":"4fe75","_k":"907bfe41"},{"t":"Copper dissolves and becomes lead","why":"Elements don’t change.","_n":"4ge85","_k":"c3660340"},{"t":"Lead is reduced at the joint","why":"Reduced lead would stay as metal.","_n":"4he95","_k":"fe2451fa"},{"t":"Water oxidizes only the copper","why":"A higher \u003ci>E\u003c/i>° means \u003cem>more easily reduced\u003c/em>. The metal with the lower \u003ci>E\u003c/i>° gives up electrons: it’s the anode.","_n":"4iea5","_k":"ce032963"}]},"b":{"prompt":"A city makes its water slightly less acidic and adds a corrosion inhibitor. What is the main purpose?","options":[{"t":"To raise the pipes’ reduction potential","why":"\u003ci>E\u003c/i>° values are fixed.","_n":"4jeb5","_k":"508b5a5b"},{"t":"To add oxygen to the water","why":"Oxygen drives corrosion.","_n":"4kec5","_k":"27dc7837"},{"t":"To slow pipe corrosion, so less dissolved metal (such as lead) reaches taps","why":"Less corrosion means less Pb²⁺ in the water.","_n":"4led5","_k":"2feedc7c"},{"t":"To make the water taste salty","why":"Not the purpose.","_n":"4mee5","_k":"d1819c2b"}]}}]},"task":{"title":"Protect the steel","summary":"Protect the steel","statement":"\u003cp>Design protection for a steel bridge beam in road-salt spray. It \u003cstrong>will\u003c/strong> get scratched. Can you find all the designs that meet every condition?\u003c/p>\u003col class=\"cr-conds\">\u003cli>The iron doesn’t rust, even at a scratch.\u003c/li>\u003cli>Nothing joined to the steel makes corrosion worse.\u003c/li>\u003cli>The beam has a coating (a barrier against salt spray).\u003c/li>\u003cli>The design costs at most 3 points.\u003c/li>\u003c/ol>","coatings":[{"id":"none","t":"None","cost":0},{"id":"paint","t":"Paint","cost":1},{"id":"zinc","t":"Zinc","cost":2},{"id":"tin","t":"Tin","cost":2}],"blockOpts":[{"id":"none","t":"None","cost":0},{"id":"Mg","t":"Mg","cost":2},{"id":"Al","t":"Al","cost":2},{"id":"Zn","t":"Zn","cost":1},{"id":"Sn","t":"Sn","cost":1},{"id":"Cu","t":"Cu","cost":1}],"checks":["No rust at a scratch","No harmful contact","Coating present","Cost ≤ 3"],"tips":["Paint and tin only block. At a scratch, you need a metal below −0.45 V.","Sn (−0.14 V) and Cu (+0.34 V) are above iron: they make the steel the anode.","Bridges need a barrier against salt spray too.","Mg and Al blocks cost 2. Pair them with the cheapest coating."],"explainPrompt":"Explain how your des
