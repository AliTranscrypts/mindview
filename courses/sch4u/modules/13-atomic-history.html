.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 13: hero storyboard, Model timeline (cards, evidence board, cathode ray tube, gold-foil lab), Part 3 stations, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.ah-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ah-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.ah-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}
.ah-foil{fill:var(--ink-2);opacity:.22}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ah-foil{opacity:.4} }
:root[data-theme="dark"] .ah-foil{opacity:.4}

/* Model timeline */
.ah-how{margin-top:0}
.ah-modes{margin:0 0 12px}
.ah-pane[hidden],.ah-c[hidden]{display:none}
.ah-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.ah-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ah-cap{min-height:1.5em;margin:10px 0 2px;font-size:1rem}
.ah-bar .player{margin-top:4px}
.ah-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:16px}
.ah-ctrl,.ah-right{min-width:0}
.ah-c > * + *{margin-top:12px}
.ah-c > p.tiny{margin-top:14px}

/* timeline cards: a row that scrolls sideways when it doesn't fit */
.ah-cards{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(176px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;overscroll-behavior-x:contain}
.ah-card{scroll-snap-align:start;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;min-width:0}
.ah-card.on{border:2.5px solid var(--pen);box-shadow:0 0 0 3px var(--hi-soft);padding:9px 11px}
.ah-pic{display:block;width:100%;max-width:124px;height:auto;margin:0 auto 4px}
.ah-card h4{margin:0;font-size:1.02rem}
.ah-yr{font-weight:400;color:var(--ink-2)}
.ah-sub{margin:2px 0 6px;font-size:.88rem;font-style:italic}
.ah-dl{margin:0;font-size:.86rem;line-height:1.4}
.ah-dl dt{font-weight:700;color:var(--ink-2);font-size:.78rem;margin-top:6px;text-transform:uppercase;letter-spacing:.02em}
.ah-dl dd{margin:1px 0 0}

/* evidence board (TC3) */
.ah-board{margin-top:14px;border-top:1.5px solid var(--rule);padding-top:10px}
.ah-h4{margin:6px 0 4px}
.ah-board .how{margin:0 0 8px}
.ah-tray{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.ah-ev{border:2px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .7em;text-align:left;font-size:.92rem;line-height:1.3;max-width:100%;touch-action:none;cursor:grab}
.ah-ev[aria-pressed="true"]{background:var(--hi);border-color:var(--hi-ink);color:var(--hi-ink);font-weight:700}
.ah-ev.placed{border-color:var(--pen);border-width:1.5px;font-size:.86rem;cursor:pointer}
.ah-ev:disabled{opacity:.55}
.ah-done{margin:6px 0;font-weight:700}
.ah-bmsg{min-height:1.3em;margin:6px 0;font-size:.92rem;color:var(--ink-2)}
.ah-tgts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ah-tgt{display:flex;flex-direction:column;gap:6px;border:2px dashed var(--ink-2);border-radius:10px;background:var(--paper);padding:8px;min-height:96px}
.ah-tgt.over{border-style:solid;border-color:var(--pen);background:var(--hi-soft)}
.ah-tgtb{border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-weight:700;padding:.35em .6em;min-height:40px;text-align:left}
.ah-tgtb small{font-weight:400;color:var(--ink-2)}
.ah-empty{font-size:.84rem;color:var(--ink-2)}
.ah-ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);max-width:240px;border:2px solid var(--hi-ink);border-radius:8px;background:var(--hi);color:var(--hi-ink);padding:.35em .7em;font:700 .9rem var(--font-ui)}

/* gold-foil lab */
.ah-gfgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:12px;align-items:start}
.ah-gfv,.ah-hist{min-width:0}
.ah-hl{margin:0 0 4px;font-size:.9rem;font-weight:700}
.ah-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 0;font-size:.86rem;color:var(--ink-2)}
.ah-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.ah-logc{margin-top:12px;max-width:640px}
.ah-ask{margin:14px 0 8px}
.ah-inf{display:flex;flex-wrap:wrap;gap:8px}
.ah-inf .chip{min-height:38px}
.ah-rinkbox{max-width:640px}
.ah-zsl{max-width:640px;margin-top:12px}
.ah-zread{margin-top:10px;max-width:640px}

/* practice + task */
.ah-numrow .numin{width:9rem}
.ah-numrow .ah-rin{width:5rem}
.ah-colon{font:700 1.3rem var(--font-math)}
.ah-unit{font-weight:700;color:var(--ink-2)}
.ah-chiplist{margin:10px 0 0}
.ah-chiplist .chip{text-align:left;line-height:1.3;min-height:38px}
.ah-conds{margin:6px 0 10px;padding-left:1.3em}
.ah-tq + .ah-tq{margin-top:12px}
.ah-lab{font-size:.95rem;font-weight:700;margin:0 0 6px}
.rg.chips.ah-tlist{display:grid;gap:6px}
.rg.chips.ah-tlist button{border-radius:10px;text-align:left;line-height:1.3;padding:.45em .8em}
.ah-tcap{margin:8px 0 0;font-size:.95rem}

@media (max-width:820px){
  .ah-gfgrid{grid-template-columns:minmax(0,1fr)}
  .ah-hist{max-width:460px}
}
@media (max-width:760px){
  .ah-grid{grid-template-columns:minmax(0,1fr)}
  .rg.seg button{padding:.4em .6em}
  .ah-tgts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .ah-cards{grid-auto-columns:80%}
}

ng>models\u003c/strong> to explain what they could measure, such as mass ratios, glowing beams and bouncing \u003cstrong>alpha particles\u003c/strong>. When an observation didn’t fit, the model changed. The biggest change came from a sheet of gold foil.","fig":{"html":"\u003cdiv class=\"ah-hx\">\u003csvg class=\"ah-hx-svg\" id=\"ah-hx-svg\" viewBox=\"0 0 480 330\" role=\"img\" aria-label=\"A timeline of five atom pictures: a solid ball (1808), a plum pudding (1904), a nucleus with orbiting electrons (1911), rings of energy levels (1913) and a fuzzy orbital cloud (1926). Below it, a stream of alpha particles flies at a column of gold atoms drawn as plum puddings, and all pass straight through. The puddings then shrink into tiny nuclei; most particles pass straight, a few swerve, and one bounces straight back. Counter: 1 in 8000.\">\u003c/svg>\u003cdiv class=\"ah-hx-row\">\u003cp class=\"ah-hx-ctr\" id=\"ah-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ah-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can describe the Dalton, Thomson, Rutherford, Bohr and quantum mechanical models and the key evidence for each.","I can explain how the gold-foil results led to the nuclear model.","I can use data, such as mass ratios and deflection counts, as evidence for or against a model.","I can explain each model’s limits and why it was replaced.","I can describe Rutherford’s work at McGill and apply these ideas to new situations."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Subatomic particles","goal":1,"prompt":"Which particle has a negative charge and very little mass?","options":[{"t":"The neutron","why":"Neutral.","_n":"0ea6","_k":"5a0f9f96"},{"t":"The proton","why":"Positive, about 1800 times heavier than an electron.","_n":"1e76","_k":"44064149"},{"t":"The alpha particle","why":"Positive: 2 protons and 2 neutrons.","_n":"2e86","_k":"b5bcc9fd"},{"t":"The electron","why":"Electrons carry the negative charge, with about 1/1800 of a proton’s mass.","_n":"3ed6","_k":"0eaea0e3"}],"hints":["Which particle orbits the nucleus?","It’s about 1/1800 of a proton’s mass.","The electron."]},{"id":"w2","skill":"Subatomic particles","goal":2,"prompt":"An alpha particle is made of…","options":[{"t":"1 proton","why":"That’s a hydrogen nucleus.","_n":"4ee6","_k":"c6225a1e"},{"t":"2 electrons","why":"That would be negative.","_n":"5eb6","_k":"5dfea5cc"},{"t":"2 protons and 2 neutrons (a helium nucleus)","why":"A helium nucleus: 2p + 2n, charge 2+.","_n":"6ec6","_k":"c6b70b19"},{"t":"A photon","why":"Alpha particles have mass and charge.","_n":"7e16","_k":"89466c05"}],"hints":["It has a charge of 2+.","It’s the nucleus of a light element.","Helium: 2p, 2n."]},{"id":"w3","skill":"Charges and forces","goal":2,"prompt":"Two positive charges are brought close together. They…","options":[{"t":"Repel, more strongly the closer they get","why":"Like charges repel, and the force grows as the distance shrinks.","_n":"8e26","_k":"2b2ce9a6"},{"t":"Attract","why":"Like charges repel.","_n":"9111","_k":"50b1f1da"},{"t":"Repel, more weakly when closer","why":"The force grows as the distance shrinks.","_n":"a101","_k":"71d3ff7f"},{"t":"Don’t affect each other","why":"Charges exert forces.","_n":"b131","_k":"74845717"}],"hints":["Like charges…","…repel.","Closer means stronger."]},{"id":"w4","skill":"Charges and forces","goal":3,"prompt":"A beam of negative particles passes between a positive plate and a negative plate. It bends…","options":[{"t":"Straight on","why":"Charged particles feel the plates.","_n":"c121","_k":"69fe9bf3"},{"t":"Toward the positive plate","why":"Opposites attract.","_n":"d151","_k":"fadcc048"},{"t":"Back the way it came","why":"The plates bend it sideways.","_n":"e141","_k":"4c54b63f"},{"t":"Toward the negative plate","why":"Like charges repel.","_n":"f171","_k":"9fcfa4b7"}],"hints":["Negative is attracted to…","…positive.","Toward the + plate."]},{"id":"w5","skill":"Evidence and inference","goal":3,"prompt":"Which is an \u003cstrong>observation\u003c/strong> rather than an inference?","options":[{"t":"The nucleus is positive","why":"An inference.","_n":"g161","_k":"c650fb8b"},{"t":"Most alpha particles passed straight through the foil","why":"That’s what was seen and counted: an observation.","_n":"h191","_k":"fe9af370"},{"t":"Electrons orbit the nucleus","why":"A model, not an observation.","_n":"i181","_k":"7f85848f"},{"t":"The atom is mostly empty space","why":"That’s what the observation suggests: an inference.","_n":"j9f1","_k":"eb6e13a6"}],"hints":["An observation is what was measured or seen.","An inference explains it.","Particles passing through is what was seen."]},{"id":"w6","skill":"Evidence and inference","goal":4,"prompt":"A new, reliable observation contradicts a model. What should scientists do?","options":[{"t":"Revise or replace the model so it explains all the evidence","why":"A model has to explain all the reliable evidence.","_n":"ka01","_k":"c89e5882"},{"t":"Stop using models","why":"Models are how we explain what we can’t see.","_n":"la11","_k":"5f7d42e7"},{"t":"Keep the model, because it’s older","why":"Age isn’t evidence.","_n":"ma21","_k":"5b68abdd"},{"t":"Ignore the observation","why":"Reliable evidence can’t be ignored.","_n":"na31","_k":"14ffec3b"}],"hints":["What’s a model for?","To explain evidence.","Revise it."]}],"refreshers":{"Subatomic particles":"Protons (+, mass 1), neutrons (0, mass 1), electrons (−, mass ≈ 1/1800). An alpha particle is a helium nucleus: 2p + 2n, charge 2+.","Charges and forces":"Like charges repel; opposites attract; the force grows quickly as charges get closer.","Evidence and inference":"Observations are measured; inferences explain them; models tie the inferences together."}}},"explore":{"heading":"Model timeline","intro":"Step through the models. In each lab, run the experiment that changed everyone’s mind.","how":"Choose a mode. \u003cstrong>Play\u003c/strong>, \u003cstrong>Step\u003c/strong> and \u003cstrong>Reset\u003c/strong> run each one; the readouts update as you change the controls.","modes":[{"id":"tl","t":"Timeline"},{"id":"crt","t":"Cathode ray tube"},{"id":"gf","t":"Gold foil"}],"cards":[{"id":"dalton","name":"Dalton","year":"1808","sub":"Solid, indivisible atoms","explained":"Fixed mass ratios in compounds, and why mass is conserved in a reaction: atoms join and separate but don’t change.","couldnt":"Cathode rays: tiny negative particles come out of atoms, so atoms aren’t indivisible.","evidence":"Elements combine in fixed whole-number mass ratios."},{"id":"thomson","name":"Thomson","year":"1904","sub":"Electrons embedded in a positive sphere (plum pudding)","explained":"Electrons in every atom, and why atoms are neutral: the positive sphere balances the electrons.","couldnt":"A few alpha particles bouncing straight back from gold foil.","evidence":"Cathode rays bend toward the + plate and come from every metal."},{"id":"rutherford","name":"Rutherford","year":"1911","sub":"A tiny, dense, positive nucleus in mostly empty space","explained":"Most alpha particles pass straight through (empty space); a very few bounce back (a tiny nucleus).","couldnt":"Why electrons don’t spiral into the nucleus, or why atoms give off light only at certain colours.","evidence":"Gold foil: about 1 in 8000 alpha particles bounced back."},{"id":"bohr","name":"Bohr","year":"1913","sub":"Electrons in fixed energy levels","explained":"Hydrogen’s line spectrum: each colour is one jump between fixed levels (module 14).","couldnt":"Atoms with more than one electron, and the fact that an electron can’t be pinned to an exact path.","evidence":"Line spectra: hydrogen glows only at certain colours."},{"id":"qm","name":"Quantum mechanical","year":"1926","sub":"Orbitals: clouds of probability","explained":"Electrons behave like waves; orbitals give where an electron is likely to be, in every atom (module 15).","couldnt":"It’s today’s model. It keeps being refined, not thrown out.","evidence":"Electrons behave like waves; exact paths can’t be known."}],"evidence":[{"id":"e1","t":"Cathode rays come from every metal.","_a":"EFUEXkILWEE="},{"id":"e2","t":"A few alpha particles bounce back.","_a":"EEUNXVsXWQ0Q"},{"id":"e3","t":"Hydrogen glows only at four visible colours.","_a":"EEMQRl4BRAVdQwEQ"},{"id":"e4","t":"An electron can’t be pinned to an exact path.","_a":"EFMKWkRG"}],"targets":["dalton","thomson","rutherford","bohr"],"crtNote":"Model values: the plates move the beam 1 unit toward the + plate per kV; the magnet moves it 1 unit per step of strength.","gfNote":"Counts are model values per 8000 alpha particles. 40 of the paths are drawn, and any rare large turn is always among them. Nuclei are drawn far larger than scale.","predictions":[{"id":"p1","prompt":"Gold foil, plum pudding. If atoms were plum puddings, what would the alpha particles do?","options":[{"t":"Almost all pass through, barely deflected","_n":"oa41","_k":"6e94f43a"},{"t":"Half pass, half bounce","_n":"pa51","_k":"2a7f1e07"},{"t":"Many bounce back","_n":"qa61","_k":"c7a57535"},{"t":"All stop in the foil","_n":"r971","_k":"ba31228b"}],"explain":"The positive charge is spread thin, so nothing pushes hard enough to turn an alpha particle around."},{"id":"p2","prompt":"Nuclear model, nucleus 1/100 000 of the atom’s width. Out of 8000 alpha particles, about how many bounce back past 90°?","options":[{"t":"All 8000","_n":"s981","_k":"e44cb8ad"},{"t":"About 4000","_n":"ta51","_k":"81deccdb"},{"t":"About 1","_n":"ua41","_k":"3840df0c"},{"t":"None","_n":"va31","_k":"23b84993"}],"explain":"A direct hit on the tiny nucleus is rare, but when it happens the repulsion is huge."},{"id":"p3","prompt":"Nucleus width 1/10 000 (10 times wider). What happens to the bounce-backs?","options":[{"t":"No change","_n":"wa21","_k":"4d6d2a8f"},{"t":"10 times more","_n":"xa91","_k":"d940e183"},{"t":"About 100 times more","_n":"ya81","_k":"582b6f7c"},{"t":"They stop","_n":"za71","_k":"6db282eb"}],"explain":"A 10-times-wider target is 100 times bigger in area."},{"id":"p4","prompt":"Cathode ray tube, plates at 3 kV. Which way does the beam bend?","options":[{"t":"Toward the + plate","_n":"10a61","_k":"c1d7731c"},{"t":"No bending","_n":"119d1","_k":"ff270810"},{"t":"Toward the − plate","_n":"129c1","_k":"0092aa4c"},{"t":"It splits in two","_n":"13a32","_k":"193a41e4"}],"explain":"Negative particles are attracted to the positive plate."}],"chalIntro":"Use the labs to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 uses the \u003cstrong>Evidence board\u003c/strong> in Timeline mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Set the gold-foil lab to reproduce Geiger and Marsden’s result.","why":"A nuclear atom with a nucleus 1/100 000 of its width: about 1 bounce-back in 8000, just as Geiger and Marsden counted.","hints":["About 1 in 8000 bounced back.","That needs a nuclear model.","The smallest nucleus: 1/100 000."]},{"id":"tc2","goal":[1,3],"prompt":"In the cathode ray tube, make the beam go \u003cstrong>straight\u003c/strong> while the plates are on.","why":"The magnet pushes the beam back exactly as hard as the plates pull it, so the beam goes straight.","hints":["The magnet can push the opposite way.","Point it up.","Match its strength to the plate setting. Thomson balanced the two to measure the electron’s charge-to-mass ratio."]},{"id":"tc3","goal":[1,4],"stretch":true,"prompt":"Drag each piece of evidence onto the model it \u003cstrong>ruled out\u003c/strong> or \u003cstrong>couldn’t explain\u003c/strong>.","why":"Each model explained the evidence of its time. New evidence refined it. Cathode rays ended Dalton’s indivisible atom, the bounce-backs ended the plum pudding, line spectra needed Bohr’s levels, and electron waves replaced Bohr’s fixed orbits.","hints":["Each piece of evidence led to the \u003cstrong>next\u003c/strong> model.","Who proposed the model just before that evidence arrived?","Cathode rays from every metal → Dalton. A few bounce-backs → Thomson. Hydrogen’s four colours → Rutherford. No exact path → Bohr."]}]},"part3":{"slug":"gold-foil","name":"Rutherford’s data","heading":"Read Rutherford’s data","intro":"Here you work from data, not the simulation: read a table of deflection counts, see just how small the nucleus is, and meet the Canadian chapter of Rutherford’s story.","s1":{"title":"Station 1: Check it with data","intro":"Geiger and Marsden counted the flashes on their screen at each angle. These model counts per hour are shaped like the real results.","angles":[5,15,30,60,120,150],"counts":[550000,7000,450,32,4,2],"ask":"Which inferences do the data support? Tap every one that fits, then press \u003cstrong>Check\u003c/strong>.","chips":[{"id":"i1","t":"Most particles barely turn","why":"550 000 per hour at 5°, far more than at any other angle.","_n":"14a42","_k":"ebf2a93f"},{"id":"i2","t":"Large turns are rare but real","why":"Only 6 per hour past 90°, but they never drop to zero.","_n":"15a12","_k":"9c2e4b87"},{"id":"i3","t":"Atoms are solid","why":"Almost every particle passed through, so atoms are mostly empty space.","_n":"16a22","_k":"d6c65dbc"},{"id":"i4","t":"The deflecting object is negative","why":"A negative centre would pull the positive alpha particles around it, not push them straight back.","_n":"17a72","_k":"0215a33c"}]},"s2":{"title":"Station 2: How small?","intro":"Zoom from the atom to the nucleus. If an atom were a 60 m hockey rink, how big would its nucleus be?","result":"60 m ÷ 100 000 = 0.6 mm: a grain of sand at centre ice."},"blocks":[{"title":"Station 3: Rutherford in Montreal","html":"\u003cp>From 1898 to 1907, at McGill University in Montreal, Ernest Rutherford and Frederick Soddy studied radioactivity. They showed that radioactive elements change into other elements, and they identified alpha and beta radiation. This work earned the 1908 Nobel Prize in Chemistry.\u003c/p>\u003cp>Alpha particles from radioactive sources later became his probe for the gold foil, run by Hans Geiger and Ernest Marsden in his lab in Manchester, England.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Read Rutherford’s data quick check","items":[{"id":"q1","goal":3,"prompt":"In the table, what fraction of particles turn more than 90° (roughly)?","choices":[{"t":"A tiny fraction","fb":"Right. 6 per hour against hundreds of thousands.","_n":"18a82","_k":"30fa08e7"},{"t":"About half","fb":"6 per hour against hundreds of thousands.","_n":"19a52","_k":"9646c9fc"},{"t":"Most","fb":"6 per hour against hundreds of thousands.","_n":"1aa62","_k":"d63d7b6b"},{"t":"None","fb":"6 per hour against hundreds of thousands.","_n":"1b9b2","_k":"3c1d7bf8"}]},{"id":"q2","goal":3,"prompt":"Why did the team use very thin foil?","choices":[{"t":"To make it magnetic","fb":"Thick foil would mix many deflections together.","_n":"1c9c2","_k":"3596160c"},{"t":"So each particle meets at most one nucleus","fb":"Right. Thick foil would mix many deflections together.","_n":"1da92","_k":"855469da"},{"t":"To make it cheaper","fb":"Thick foil would mix many deflections together.","_n":"1ea82","_k":"5dd51fa1"},{"t":"To stop the alpha particles","fb":"Thick foil would mix many deflections together.","_n":"1fab2","_k":"8990491c"}]},{"id":"q3","goal":5,"prompt":"If the atom were a hockey rink, the nucleus would be about the size of…","choices":[{"t":"the whole rink","fb":"1/100 000 of 60 m is 0.6 mm.","_n":"1gaa2","_k":"c421ad1a"},{"t":"a grain of sand","fb":"Right. 1/100 000 of 60 m is 0.6 mm.","_n":"1ha52","_k":"5b50f9b2"},{"t":"a hockey puck","fb":"1/100 000 of 60 m is 0.6 mm.","_n":"1ia42","_k":"31954201"},{"t":"the net","fb":"1/100 000 of 60 m is 0.6 mm.","_n":"1ja72","_k":"dccd5a49"}]},{"id":"q4","goal":5,"prompt":"What did Rutherford study at McGill?","choices":[{"t":"Cathode rays","fb":"The gold foil came later, in England.","_n":"1ka62","_k":"f227c715"},{"t":"Line spectra","fb":"The gold foil came later, in England.","_n":"1la12","_k":"f8a21cdd"},{"t":"Oil drops","fb":"The gold foil came later, in England.","_n":"1ma02","_k":"a6594921"},{"t":"Radioactivity","fb":"Right. The gold foil came later, in England.","_n":"1n172","_k":"0f5ae40a"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Model ↔ evidence","summary":"Model ↔ evidence","goal":[1,4],"instruction":"Match each model or discovery to the evidence it was built to explain.","leftTitle":"Model or discovery","rightTitle":"Evidence","left":[{"id":"l1","t":"Dalton’s atoms","why":"Solid, indivisible atoms combine in fixed numbers, so their masses come in fixed ratios.","hints":["Put the models in time order.","Each was built to explain one new observation.","Dalton’s atoms: elements combine in fixed whole-number mass ratios."]},{"id":"l2","t":"Thomson’s electron","why":"A negative particle that every metal gives off: the electron.","hints":["Put the models in time order.","Each was built to explain one new observation.","Thomson’s electron: cathode rays bend toward a + plate, from any metal."]},{"id":"l3","t":"Millikan’s charge","why":"Balancing a drop’s weight with the electric push gave the charge on one electron.","hints":["Put the models in time order.","Each was built to explain one new observation.","Millikan’s charge: charged oil drops held still between plates."]},{"id":"l4","t":"Rutherford’s nucleus","why":"Only a tiny, dense, positive centre can turn an alpha particle straight back.","hints":["Put the models in time order.","Each was built to explain one new observation.","Rutherford’s nucleus: a few alpha particles bounce back from gold foil."]},{"id":"l5","t":"Chadwick’s neutron","why":"No charge, about a proton’s mass: the neutron.","hints":["Put the models in time order.","Each was built to explain one new observation.","Chadwick’s neutron: a neutral particle with about a proton’s mass, knocked out of nuclei."]},{"id":"l6","t":"Bohr’s energy levels","why":"Fixed energy levels mean only certain energy jumps, so only certain colours.","hints":["Put the models in time order.","Each was built to explain one new observation.","Bohr’s energy levels: hydrogen’s light shows only certain colours."]},{"id":"l7","t":"Quantum mechanical orbitals","why":"Waves have no exact path, so orbitals give where an electron is likely to be.","hints":["Put the models in time order.","Each was built to explain one new observation.","Quantum mechanical orbitals: electrons behave like waves; exact paths can’t be known."]}],"right":[{"id":"r1","t":"Elements combine in fixed whole-number mass ratios"},{"id":"r2","t":"Cathode rays bend toward a + plate, from any metal"},{"id":"r3","t":"Charged oil drops held still between plates"},{"id":"r4","t":"A few alpha particles bounce back from gold foil"},{"id":"r5","t":"A neutral particle with about a proton’s mass, knocked out of nuclei"},{"id":"r6","t":"Hydrogen’s light shows only certain colours"},{"id":"r7","t":"Electrons behave like waves; exact paths can’t be known"}],"_a":"SRMJAxReFBEDE0kQWlYUWRBDVxAaRlpQEAtHQAVGGkFeBUcIFBYCQR4TCQcUXhQRBxNJEFpSFFkQQ1MQGkZaVBALR0ABRks=","wrong":{"l4|r2":"Cathode rays revealed electrons, not the nucleus.","l6|r4":"The gold foil said nothing about electron energies."},"wrongDefault":"Which observation was this model invented to explain?"},{"id":"reason","type":"custom","title":"Reasoning from evidence","summary":"Reasoning from evidence","star":true,"goal":[2,3],"instruction":"Six items: choices and number entry. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type your answer or tap a choice, then press Check.","items":[{"id":"r1","kind":"ratio","goal":3,"prompt":"12.0 g of carbon combines with 16.0 g of oxygen in one compound and 32.0 g in another. What is the whole-number ratio of oxygen masses?","_a":"aQBJAGs=","display":"1 : 2","wrong":[{"match":[16,32],"fb":"16 : 32 is right but simplify: 1 : 2."},{"match":[2,1],"fb":"Reversed: list the oxygen masses in the order the question gives them."}],"simplify":"Right ratio, but simplify it to the smallest whole numbers.","fb":"Compare the two oxygen masses: divide each by the smaller one.","hints":["Compare the two oxygen masses for the same 12.0 g of carbon.","16.0 : 32.0. Divide both by 16.0.","1 : 2."]},{"id":"r2","kind":"chips","goal":2,"prompt":"Thomson’s beam gave the same charge-to-mass ratio from every metal. What did this suggest?","options":[{"t":"Atoms can’t be divided","why":"A particle came out of every atom, so atoms can be divided.","_n":"1o182","_k":"fc33bb77"},{"t":"The beam is a kind of light","why":"Light isn’t bent by charged plates. Different metals, same particle.","_n":"1p192","_k":"869beaa1"},{"t":"Electrons are in all atoms","why":"Different metals, same particle.","_n":"1q1a2","_k":"35114dcb"},{"t":"Each metal gives off its own kind of particle","why":"Different metals, same particle.","_n":"1r132","_k":"ef7bae65"}],"hints":["The ratio didn’t depend on the metal.","So the particle is the same in every metal.","Electrons are in all atoms."]},{"id":"r3","kind":"ratio","star":true,"goal":3,"prompt":"32.0 g of sulfur combines with 32.0 g of oxygen in one oxide and 48.0 g in another. Oxygen ratio?","_a":"aQNJAWs=","display":"2 : 3","wrong":[{"match":[1,2],"fb":"The ratio is any small whole-number ratio: 1 : 2, 2 : 3, and so on. 32 : 48 = 2 : 3."},{"match":[3,2],"fb":"Reversed: list the oxygen masses in the order the question gives them."}],"simplify":"Right ratio, but simplify it to the smallest whole numbers.","fb":"Compare the two oxygen masses for the same 32.0 g of sulfur.","hints":["Compare 32.0 g and 48.0 g.","Divide both by 16.0.","32 : 48 = 2 : 3."]},{"id":"r4","kind":"chips","star":true,"goal":3,"prompt":"\u003cstrong>Investigation:\u003c/strong> Why did Geiger and Marsden count flashes on a screen at many angles, not just straight ahead?","options":[{"t":"To count the particles that passed straight through","why":"Straight ahead only shows the particles that didn’t turn.","_n":"1s142","_k":"1cd20b7f"},{"t":"To measure how often each size of deflection happens","why":"Counting at every angle shows how many particles turn by each amount, including the rare large turns.","_n":"1t152","_k":"09f62fde"},{"t":"To make the experiment faster","why":"Straight ahead only shows the particles that didn’t turn.","_n":"1u162","_k":"b7db2aaf"},{"t":"Because the screen only glows at large angles","why":"The screen glows wherever a particle hits it. Straight ahead only shows the particles that didn’t turn.","_n":"1v1f2","_k":"9d52d2a0"}],"hints":["What would a screen straight ahead miss?","The particles that turned.","Counting at many angles measures how often each size of turn happens."]},{"id":"r5","kind":"num","star":true,"goal":2,"prompt":"The foil is made twice as thick (still thin). Predict the number of bounce-backs per 8000.","_a":"AA==","unit":"per 8000","display":"about 2 per 8000","wrong":[{"match":1,"fb":"Twice as many nuclei lie in the path."},{"match":4,"fb":"Thickness adds nuclei in a line, not in area."}],"fb":"How many more nuclei lie in each particle’s path when the foil is twice as thick?","hints":["The thin foil gave about 1 bounce-back per 8000.","Twice the thickness puts twice as many nuclei in each particle’s path.","1 × 2 = about 2 per 8000."]},{"id":"r6","kind":"chips","star":true,"goal":2,"prompt":"Imagine the nucleus were \u003cstrong>negative\u003c/strong>. How would the large deflections change?","options":[{"t":"The alpha particles would all pass straight through","why":"A negative nucleus still pulls hard on a nearby positive particle. Attraction swings a particle around; only repulsion turns a head-on particle straight back.","_n":"1w202","_k":"ca6ee082"},{"t":"Even more alpha particles would bounce straight back","why":"Attraction swings a particle around; only repulsion turns a head-on particle straight back.","_n":"1x9d2","_k":"429dc068"},{"t":"Alpha particles would be pulled around the nucleus, not pushed straight back","why":"Attraction swings a particle around; only repulsion turns a head-on particle straight back.","_n":"1y9c2","_k":"b73b86f5"},{"t":"Nothing would change","why":"Attraction swings a particle around; only repulsion turns a head-on particle straight back.","_n":"1z9b2","_k":"673724e0"}],"hints":["Alpha particles are positive.","A negative nucleus would attract them.","Attraction curves the path around the nucleus, so head-on bounce-backs wouldn’t happen."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Gideon","how":"","goal":[1,2],"instruction":"Gideon made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain the gold-foil results.","steps":["Most alpha particles passed straight through.","So the atom is mostly empty space.","A few bounced back because they hit electrons.","So electrons are concentrated in the centre."],"_a":"AA==","stepFb":["Correct. Keep checking.","Correct.","","This follows from step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Electrons are about 7000 times lighter than an alpha particle. Only a massive, positive nucleus can turn one around.","_n":"209a2","_k":"6842be78"},{"t":"They bounced off neutrons.","why":"Neutrons are neutral; the bounce needs strong repulsion.","_n":"21992","_k":"a4add461"},{"t":"They bounced off the gold surface.","why":"Almost every alpha particle went straight through: the atom is mostly empty space.","_n":"22982","_k":"e85a37c3"},{"t":"They bounced off a tiny, dense, positive nucleus; electrons are far too light to turn an alpha particle around.","why":"Electrons are about 7000 times lighter than an alpha particle. Only a massive, positive nucleus can turn one around.","_n":"23972","_k":"0d76063e"}],"hints":["Compare an electron’s mass with an alpha particle’s.","About 7000 times lighter.","Only a massive, positive centre could do it."]},{"id":"e2","goal":1,"task":"Explain Thomson’s cathode ray evidence.","steps":["A beam came from the cathode in every metal tested.","The beam bent toward the negative plate.","So the particles are positive.","So every atom contains positive particles that can be pulled out."],"_a":"Aw==","stepFb":["Correct.","","This follows from step 2.","This builds on step 3."],"fixes":[{"t":"The beam bent toward the \u003cstrong>positive\u003c/strong> plate, so the particles are negative: electrons, found in every atom.","why":"The beam bends toward the \u003cstrong>positive\u003c/strong> plate, so the particles are negative. They come from every metal, so every atom has them.","_n":"24962","_k":"0ff21f8c"},{"t":"The beam didn’t bend at all.","why":"It did.","_n":"25a52","_k":"5ac52fd9"},{"t":"The beam bent toward the magnet.","why":"The plates show the charge.","_n":"26a42","_k":"7c8de4db"},{"t":"Step 2 is correct.","why":"The beam bends toward the \u003cstrong>positive\u003c/strong> plate, so the particles are negative.","_n":"279b0","_k":"dabd61ca"}],"hints":["Opposite charges attract.","A negative beam is pulled toward…","…the positive plate."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: how empty the atom is, or how rare the bounce-backs were?"},{"id":"j2","q":"In your own words, why did one bounce in 8000 change the model of the atom?"},{"id":"j3","q":"Explain to a friend why scientists replace models instead of throwing out science."},{"id":"j4","q":"Which model’s evidence is still fuzzy for you? What will you review?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What did Thomson’s cathode ray experiments show?","options":[{"t":"Atoms have a tiny dense nucleus","why":"That was Rutherford.","_n":"289c0","_k":"e67720ac"},{"t":"Atoms contain small negative particles (electrons)","why":"The beam bent toward the + plate and came from every metal: small negative particles in all atoms.","_n":"29990","_k":"e2c38980"},{"t":"Electrons occupy energy levels","why":"That was Bohr.","_n":"2a9a0","_k":"2a42c5d3"},{"t":"Atoms are indivisible","why":"Thomson showed the opposite.","_n":"2b970","_k":"cb267996"}]},"b":{"prompt":"What did Rutherford conclude from the gold foil?","options":[{"t":"Electrons have fixed energies","why":"That was Bohr.","_n":"2c980","_k":"c5c04a94"},{"t":"Atoms contain electrons","why":"That was Thomson.","_n":"2d950","_k":"5eb9c7f6"},{"t":"Atoms are solid spheres","why":"Almost every alpha particle went straight through: the atom is mostly empty space.","_n":"2e960","_k":"df0b0ca8"},{"t":"The atom has a tiny, dense, positive nucleus","why":"Most particles went straight through, but a few bounced back: a tiny, dense, positive centre.","_n":"2fa30","_k":"322c60e9"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In the gold-foil experiment, what did \u003cstrong>most\u003c/strong> alpha particles do?","options":[{"t":"Turned into electrons","why":"They stayed alpha particles.","_n":"2ga40","_k":"17363b54"},{"t":"Stuck in the foil","why":"Most passed through.","_n":"2h210","_k":"62f50803"},{"t":"Bounced back","why":"Only about 1 in 8000.","_n":"2i200","_k":"0f0e4747"},{"t":"Passed straight through","why":"Almost every alpha particle went straight through: the atom is mostly empty space.","_n":"2j230","_k":"a51d57c8"}]},"b":{"prompt":"About what fraction of the alpha particles bounced back past 90°?","options":[{"t":"About 1 in 8000","why":"Rare, but real: that was the surprise.","_n":"2k220","_k":"9698cb34"},{"t":"None","why":"A few did; that was the surprise.","_n":"2l250","_k":"db03fd5b"},{"t":"About half","why":"Almost every alpha particle went straight through: the atom is mostly empty space.","_n":"2m240","_k":"3fad4887"},{"t":"Most","why":"Almost every alpha particle went straight through: the atom is mostly empty space.","_n":"2n270","_k":"25a06093"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which was a problem with Rutherford’s model?","options":[{"t":"It explained line spectra too well","why":"Rutherford’s model said nothing about electron energies. Spectra needed Bohr.","_n":"2o260","_k":"db7e0be7"},{"t":"It had no nucleus","why":"It introduced the nucleus.","_n":"2p190","_k":"91320606"},{"t":"It couldn’t explain why electrons don’t spiral into the nucleus, or why atoms give off only certain colours","why":"Rutherford’s model said nothing about electron energies. Spectra needed Bohr.","_n":"2q180","_k":"0a371675"},{"t":"It had no electrons","why":"It had electrons around the nucleus.","_n":"2re67","_k":"89f10f22"}]},"b":{"prompt":"What did the discovery of the neutron explain?","options":[{"t":"Why hydrogen emits colours","why":"That’s Bohr’s levels.","_n":"2se57","_k":"a72b7480"},{"t":"Why alpha particles bounce back","why":"That’s the positive nucleus.","_n":"2te47","_k":"eb98d3b2"},{"t":"Why most atoms have more mass than their protons alone provide","why":"Neutrons add about a proton’s mass each, with no charge.","_n":"2ue37","_k":"838bf2cf"},{"t":"Why cathode rays bend","why":"That’s the electron.","_n":"2vea7","_k":"725b02c5"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"If the nucleus were 10 times wider than it really is, how would the number of bounce-backs change?","options":[{"t":"Fewer","why":"A bigger target is hit more often.","_n":"2we97","_k":"e77e41a8"},{"t":"About 100 times more","why":"The target’s area grows by 10².","_n":"2xe87","_k":"a6429c85"},{"t":"About 10 times more","why":"Area, not width, sets the chance of a hit.","_n":"2ye77","_k":"93a0fc3c"},{"t":"No change","why":"The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink. A bigger target is hit more often.","_n":"2zee7","_k":"ced91875"}]},"b":{"prompt":"If the foil were made 3 times thicker (still thin), how would the number of bounce-backs change?","options":[{"t":"Fewer","why":"More nuclei can’t mean fewer hits.","_n":"30ed7","_k":"1beb45a1"},{"t":"About 3 times more","why":"Three times as many nuclei in the path.","_n":"31607","_k":"a43356fe"},{"t":"No change","why":"More nuclei, more hits.","_n":"32617","_k":"650ed3b3"},{"t":"About 9 times more","why":"Thickness adds nuclei in a line, not in area.","_n":"33627","_k":"e1a3c661"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"32.0 g of sulfur combines with 32.0 g of oxygen in one oxide and with 48.0 g of oxygen in another. What is the ratio of oxygen masses?","options":[{"t":"2 : 3","why":"32 : 48 = 2 : 3.","_n":"34637","_k":"a9cde50c"},{"t":"3 : 2","why":"Reversed.","_n":"35647","_k":"093b4959"},{"t":"1 : 1","why":"The oxygen masses differ.","_n":"36657","_k":"1503b543"},{"t":"1 : 2","why":"The ratio is any small whole-number ratio: 1 : 2, 2 : 3, and so on.","_n":"37667","_k":"80b0c3d9"}]},"b":{"prompt":"55.8 g of iron combines with 71.0 g of chlorine in one compound and with 106.5 g in another. What is the ratio of chlorine masses?","options":[{"t":"2 : 3","why":"71.0 : 106.5 = 2 : 3 (divide both by 35.5).","_n":"38677","_k":"70252df4"},{"t":"3 : 2","why":"Reversed.","_n":"39687","_k":"b4795471"},{"t":"1 : 1","why":"The chlorine masses differ.","_n":"3a697","_k":"8e50e858"},{"t":"1 : 2","why":"The ratio is any small whole-number ratio: 1 : 2, 2 : 3, and so on.","_n":"3bf28","_k":"2a15d329"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A beam bends toward the positive plate, and its charge-to-mass ratio is the same for every cathode metal. What can you conclude?","options":[{"t":"The particles are different for each metal","why":"Same ratio, same particle.","_n":"3cf18","_k":"9c229317"},{"t":"The beam is light, not particles","why":"Light isn’t bent by charged plates.","_n":"3df48","_k":"9bf694d9"},{"t":"The beam is made of negative particles found in all atoms","why":"Toward + means negative; the same ratio from every metal means the same particle in all atoms.","_n":"3ef38","_k":"d9680e58"},{"t":"The particles are positive","why":"The beam bends toward the \u003cstrong>positive\u003c/strong> plate, so the particles are negative.","_n":"3ff68","_k":"b7da87b9"}]},"b":{"prompt":"If cathode rays were neutral, what would the charged plates do to the beam?","options":[{"t":"Bend it toward −","why":"Only charged particles bend.","_n":"3gf58","_k":"bedb895f"},{"t":"Stop it","why":"Plates don’t stop neutral particles.","_n":"3hf88","_k":"55a05c19"},{"t":"Nothing: the beam would go straight","why":"Charged plates push only on charged particles.","_n":"3if78","_k":"560551e8"},{"t":"Bend it toward +","why":"Only charged particles bend.","_n":"3jea8","_k":"5edca75f"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why the plum pudding model was rejected?","options":[{"t":"“It was too old.”","why":"Each model explained the evidence of its time. New evidence refined it.","_n":"3ke98","_k":"4f96ae1a"},{"t":"“It had no electrons.”","why":"It did.","_n":"3lec8","_k":"ce49e9ff"},{"t":"“It predicts that no alpha particles turn sharply, but some bounced back. That needs a tiny, dense, positive centre.”","why":"It names the prediction, the observation that broke it and what that observation needs.","_n":"3med8","_k":"5c2f610a"},{"t":"“Alpha particles bounced off its electrons.”","why":"Electrons are about 7000 times lighter than an alpha particle. Only a massive, positive nucleus can turn one around.","_n":"3nea8","_k":"19eb5253"}]},"b":{"prompt":"Which is the best explanation of why Dalton’s model had to change?","options":[{"t":"“The gold foil disproved it directly.”","why":"Electrons came first.","_n":"3oeb8","_k":"17ccf255"},{"t":"“Atoms turned out to be bigger.”","why":"Size wasn’t the issue.","_n":"3pe88","_k":"3615cd48"},{"t":"“Dalton’s mass ratios were wrong.”","why":"His ratios still hold.","_n":"3qe98","_k":"c2c455b4"},{"t":"“Thomson found electrons inside every atom, so atoms aren’t indivisible.”","why":"Electrons come out of atoms, so atoms have parts.","_n":"3re68","_k":"e0637023"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which order of models is correct?","options":[{"t":"Dalton → Thomson → Rutherford → Bohr → quantum mechanical","why":"1808, 1904, 1911, 1913, 1926: each model followed the evidence that broke the one before.","_n":"3se78","_k":"f958298f"},{"t":"Dalton → Rutherford → Thomson → quantum → Bohr","why":"The electron came before the nucleus; Bohr before the quantum model.","_n":"3tf48","_k":"f6138d29"},{"t":"Rutherford → Thomson → Dalton → Bohr → quantum","why":"Electrons were found before the nucleus.","_n":"3uf58","_k":"30dc0abd"},{"t":"Thomson → Dalton → Bohr → Rutherford → quantum","why":"Dalton came first; the nucleus came before energy levels.","_n":"3v7e8","_k":"de310079"}]},"b":{"prompt":"Which description matches Thomson’s model?","options":[{"t":"Electrons in fixed energy levels","why":"That’s Bohr.","_n":"3w7d8","_k":"b3e3c681"},{"t":"A tiny positive nucleus with electrons around it","why":"That’s Rutherford.","_n":"3x7c8","_k":"138b8a65"},{"t":"Electrons embedded in a sphere of spread-out positive charge","why":"The plum pudding: negative electrons in a positive sphere.","_n":"3y7b8","_k":"8a7d1dea"},{"t":"A solid indivisible ball","why":"That’s Dalton.","_n":"3z7a8","_k":"2d81e191"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"What did Rutherford’s work at McGill University show?","options":[{"t":"Light comes in fixed colours","why":"That’s spectroscopy.","_n":"40798","_k":"28f4e7ae"},{"t":"Electrons exist","why":"That was Thomson.","_n":"41788","_k":"3f110e46"},{"t":"Atoms have a nucleus","why":"That came later, in England.","_n":"42778","_k":"d0a42dd6"},{"t":"Radioactive elements change into other elements as they give off radiation","why":"With Frederick Soddy in Montreal, he showed that radioactive elements turn into other elements: the 1908 Nobel Prize in Chemistry.","_n":"43768","_k":"d4c7c8a1"}]},"b":{"prompt":"A modern lab fires alpha particles at a thin foil of aluminium, whose nuclei carry much less positive charge than gold’s. Predict the large-angle deflections compared with gold.","options":[{"t":"More: aluminium is lighter","why":"Charge, not lightness, sets the repulsion.","_n":"44758","_k":"4abe637e"},{"t":"The same","why":"Nuclear charge matters.","_n":"45f88","_k":"0ec2d655"},{"t":"Fewer: the weaker repulsion turns fewer particles sharply","why":"Less positive charge means a weaker push, so fewer sharp turns.","_n":"46f98","_k":"a1bbfc40"},{"t":"None at all","why":"Aluminium nuclei still repel.","_n":"47fa8","_k":"2046380e"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"If an atom were the size of a 60 m hockey rink, about how wide would its nucleus be?","options":[{"t":"About 0.6 mm (a grain of sand)","why":"60 m ÷ 100 000.","_n":"48fb8","_k":"cf1321d1"},{"t":"About 6 m","why":"That’s 1/10. The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink.","_n":"49f48","_k":"78901e55"},{"t":"About 6 cm","why":"Still 100 times too big. The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink.","_n":"4af58","_k":"3e49e71c"},{"t":"About 60 cm","why":"The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink.","_n":"4bf68","_k":"4fc91d30"}]},"b":{"prompt":"If a nucleus were 1 cm wide (a marble), about how wide would its atom be?","options":[{"t":"About 10 m","why":"The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink.","_n":"4cf78","_k":"c53e3d3c"},{"t":"About 10 cm","why":"The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink.","_n":"4df08","_k":"21ad7838"},{"t":"About 1 km","why":"1 cm × 100 000 = 1000 m.","_n":"4ef18","_k":"2479e0ff"},{"t":"About 1 m","why":"The nucleus is about 1/100 000 of the atom’s width: a grain of sand in a hockey rink.","_n":"4f6a8","_k":"0b7e562b"}]}}]},"task":{"title":"A model that fits","summary":"A model that fits","statement":"\u003cp>Build an atom model that agrees with the gold-foil evidence. Can you find all the answers?\u003c/p>\u003col class=\"ah-conds\">\u003cli>Most alpha particles pass straight through.\u003c/li>\u003cli>A very few bounce straight back.\u003c/li>\u003cli>The electrons are placed consistently with where the positive charge is.\u003c/li>\u003c/ol>","qA":"A. Where are the positive charge and most of the mass?","optsA":[{"id":"spread","t":"Spread through the whole atom"},{"id":"tenth","t":"In a centre about 1/10 of the atom’s width"},{"id":"tiny","t":"In a centre about 1/100 000 of the atom’s width"}],"qB":"B. Where are the electrons?","optsB":[{"id":"inside","t":"Scattered inside the positive material"},{"id":"moving","t":"Moving through the space around the centre"},{"id":"orbits","t":"In fixed circular orbits"},{"id":"cloud","t":"In a cloud of probability around the centre"}],"checks":["Most pass straight","A few bounce back","Electrons placed consistently"],"tips":["A centre 1/10 the atom’s width would turn far too many particles.","Spread-out charge can’t turn any particle back.","If the positive charge is a tiny centre, the electrons can’t be scattered inside it."],"tipSpread":"With the positive charge spread through the atom, the electrons sit scattered inside it.","explainPrompt":"Explain how each part of the evidence fixes one feature of your model, and why the evidence can’t decide where the electrons are.","vocab":"Use the words nucleus, alpha particle, deflection and empty space.","more":"There’s more than one answer. Can you find them all?","after3":"The gold foil can’t tell these three apart. It only shows where the positive charge is. Hydrogen’s light (module 14) and electron waves (module 15) decided between them."},"cards":[["Dalton (1808)","Solid, indivisible atoms; compounds in fixed whole-number ratios."],["Law of multiple proportions","Masses of one element combining with a fixed mass of another are in small whole-number ratios."],["Thomson (1897–1904)","Cathode rays are electrons; plum pudding model."],["Cathode ray evidence","The beam bends toward the + plate; same from every metal."],["Gold-foil observations","Most alpha particles go straight; about 1 in 8000 bounces back."],["Rutherford (1911)","Tiny, dense, positive nucleus; atom mostly empty space."],["Nucleus size","About 1/100 000 of the atom’s width."],["Rutherford’s gap","Couldn’t explain stable electrons or line spectra."],["Chadwick (1932)","The neutron: neutral, about a proton’s mass."],["Bohr (1913)","Electrons in fixed energy levels; explains hydrogen’s colours."],["Rutherford at McGill","Showed radioactive elements change into others (Nobel Prize 1908)."]]}};</script>
