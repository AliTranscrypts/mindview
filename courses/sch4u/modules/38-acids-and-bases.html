.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}

.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}

.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}

.top-row{gap:8px}
.brand b{font-size:1.12rem}

.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}

.ab-pane[hidden]{display:none}

c-an\">A⁻\u003c/span>\u003c/span> \u003cspan class=\"ab-heq-sub\">(acid + base ⇌ conjugate acid + conjugate base)\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"H A plus H 2 O, equilibrium arrow, H 3 O plus plus A minus: acid plus base gives conjugate acid plus conjugate base","headline":"An acid–base reaction is a proton handoff","text":"In the \u003cstrong>Brønsted–Lowry\u003c/strong> picture, an \u003cstrong>acid\u003c/strong> gives away H⁺ and a \u003cstrong>base\u003c/strong> takes it. What’s left of the acid is its \u003cstrong>conjugate base\u003c/strong>; what the base becomes is its \u003cstrong>conjugate acid\u003c/strong>. \u003cstrong>Strong\u003c/strong> acids hand off every proton; \u003cstrong>weak\u003c/strong> acids reach an equilibrium where only a few do.","fig":{"html":"\u003cdiv class=\"ab-hx\">\u003csvg class=\"ab-hx-svg\" id=\"ab-hx-svg\" viewBox=\"0 0 480 280\" role=\"img\" aria-label=\"An HF molecule and a water molecule approach. An H⁺ token hops from HF to water, making F⁻ and H₃O⁺. Brackets labelled conjugate pair link HF with F⁻ and H₂O with H₃O⁺. Then the token hops back and forth, leaving HF mostly intact: a weak acid is a two-way handoff.\">\u003c/svg>\u003cdiv class=\"ab-hx-row\">\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ab-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can identify Brønsted–Lowry acids, bases and conjugate pairs in a reaction.","I can recognize amphiprotic species and write their reactions as an acid and as a base.","I can explain the difference between strong and weak acids and bases using dynamic equilibrium and percent ionization.","I can distinguish an acid’s strength from its concentration.","I can predict which side of an acid–base equilibrium is favoured using relative acid strengths.","I can compare the Arrhenius and Brønsted–Lowry definitions and apply them to everyday substances."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Ions and formulas","goal":1,"prompt":"What is left when a water molecule loses one H⁺?","options":[{"t":"H₃O⁺","why":"That’s water \u003cstrong>gaining\u003c/strong> H⁺.","_n":"0d3a","_k":"dc0ec3ea"},{"t":"H₂","why":"H⁺ is a proton, not an H atom pair.","_n":"1d0a","_k":"11147a94"},{"t":"OH⁻","why":"H₂O − H⁺ = OH⁻.","_n":"2d1a","_k":"d0296685"},{"t":"O²⁻","why":"Only one proton leaves.","_n":"3cea","_k":"ac63670a"}],"hints":["Remove one H and one + charge.","H₂O → OH and the charge drops by one.","OH⁻."]},{"id":"w2","skill":"Ions and formulas","goal":1,"prompt":"What forms when NH₃ gains one H⁺?","options":[{"t":"NH₃⁺","why":"The H must be added to the formula.","_n":"4cfa","_k":"33568202"},{"t":"NH₂⁻","why":"That’s NH₃ \u003cstrong>losing\u003c/strong> H⁺.","_n":"5cca","_k":"97074c2e"},{"t":"NH₄","why":"Don’t forget the charge from the proton.","_n":"6cda","_k":"677e359e"},{"t":"NH₄⁺","why":"Add H and add a + charge.","_n":"7caa","_k":"ef08b17d"}],"hints":["H⁺ adds an H and a + charge.","NH₃ + H⁺.","NH₄⁺."]},{"id":"w3","skill":"Neutralization","goal":6,"prompt":"Which equation shows neutralization?","options":[{"t":"2H₂(g) + O₂(g) → 2H₂O(l)","why":"That’s a synthesis (combustion) reaction.","_n":"8cba","_k":"d3c65af2"},{"t":"CaCO₃(s) → CaO(s) + CO₂(g)","why":"That’s a decomposition.","_n":"9b64","_k":"daa068cb"},{"t":"HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)","why":"Acid + base → salt + water.","_n":"ab54","_k":"16323a93"},{"t":"NaCl(s) → Na⁺(aq) + Cl⁻(aq)","why":"That’s dissolving.","_n":"bb84","_k":"ac8a52ba"}],"hints":["Look for an acid and a base.","HCl and NaOH.","HCl + NaOH → NaCl + H₂O."]},{"id":"w4","skill":"Neutralization","goal":6,"prompt":"In Arrhenius theory, a base is a substance that…","options":[{"t":"tastes sour","why":"Acids taste sour; never taste lab chemicals.","_n":"cb74","_k":"09cf3260"},{"t":"accepts H⁺","why":"That’s the Brønsted–Lowry definition, coming next.","_n":"db24","_k":"e17eacf6"},{"t":"contains hydrogen","why":"Many acids contain hydrogen; that isn’t a base definition.","_n":"eb14","_k":"b7d90120"},{"t":"produces OH⁻ in water","why":"That’s the Arrhenius definition.","_n":"fb44","_k":"bfc35fad"}],"hints":["Arrhenius focuses on ions in water.","Acids give H⁺; bases give…","OH⁻."]},{"id":"w5","skill":"Equilibrium position","goal":5,"prompt":"A reaction has \u003ci>K\u003c/i> = 4.0 × 10⁵. At equilibrium, which side dominates?","options":[{"t":"It depends only on speed","why":"\u003ci>K\u003c/i> tells position, not speed.","_n":"gb34","_k":"b226fcc0"},{"t":"Neither: always half and half","why":"The size of \u003ci>K\u003c/i> decides.","_n":"hae4","_k":"172207b4"},{"t":"Reactants","why":"That’s \u003ci>K\u003c/i> ≪ 1.","_n":"iad4","_k":"6781dfc0"},{"t":"Products","why":"\u003ci>K\u003c/i> ≫ 1 (module 36).","_n":"ja44","_k":"e58d3858"}],"hints":["Is \u003ci>K\u003c/i> bigger or smaller than 1?","Much bigger.","Products."]},{"id":"w6","skill":"Equilibrium position","goal":3,"prompt":"In a sealed flask at equilibrium, the forward and reverse rates are…","options":[{"t":"reverse faster","why":"Same problem.","_n":"ka54","_k":"10c0c497"},{"t":"forward faster","why":"Then the amounts would keep changing.","_n":"la64","_k":"fc067d1b"},{"t":"equal, so the amounts stay constant","why":"Dynamic equilibrium.","_n":"ma74","_k":"6685c174"},{"t":"both zero","why":"The reactions continue.","_n":"na04","_k":"9cd9218b"}],"hints":["Recall module 34.","Nothing changes overall, but both reactions continue.","Equal."]}],"refreshers":{"Ions and formulas":"Losing H⁺: remove one H and subtract one from the charge. Gaining H⁺: add one H and add one to the charge.","Neutralization":"Acid + base → salt + water. Arrhenius: acids make H⁺ (H₃O⁺) in water; bases make OH⁻.","Equilibrium position":"\u003ci>K\u003c/i> ≫ 1 favours products; \u003ci>K\u003c/i> ≪ 1 favours reactants. At equilibrium, the rates are equal."}}},"explore":{"heading":"Proton transfer animator","intro":"Pick an acid and a base, watch the proton move, and switch to the particle view to see how much ionizes.","how":"Choose a mode. \u003cstrong>Pair up:\u003c/strong> pick an acid and a base and watch the H⁺ move. \u003cstrong>Particle view:\u003c/strong> pick an acid and a concentration to see 100 of its molecules in water. \u003cstrong>Which side wins?:\u003c/strong> compare the two acids’ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values on the balance. Arrow keys move through each row of choices.","modes":[{"id":"pair","t":"Pair up"},{"id":"particle","t":"Particle view"},{"id":"wins","t":"Which side wins?"}],"reasonQ":"Why is this side favoured? (challenge 3)","reasons":[{"id":"weaker","t":"The acid on the left is the weaker acid"},{"id":"stronger","t":"The acid on the left is the stronger acid"},{"id":"base","t":"The base on the left is the stronger base"},{"id":"even","t":"Both acids are weak, so it’s even"}],"note":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> values: course data table (25 °C). The particle view shows 100 molecules; percent ionization is computed from \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","predictions":[{"id":"p1","prompt":"Pair up: HCl + H₂O. Which species is the conjugate base of HCl?","options":[{"t":"H₃O⁺","_n":"oa14","_k":"eac95f5f"},{"t":"OH⁻","_n":"pa24","_k":"60133e8b"},{"t":"Cl⁻","_n":"qa34","_k":"5812a00c"},{"t":"H₂O","_n":"rac4","_k":"f7e61104"}],"explain":"Remove one H⁺ from HCl: Cl⁻. H₃O⁺ is the conjugate acid of water."},{"id":"p2","prompt":"Pair up: NH₃ + H₂O. What role does water play here?","options":[{"t":"acid","_n":"sad4","_k":"659891f9"},{"t":"neither","_n":"taa4","_k":"f143dcd4"},{"t":"base","_n":"ua94","_k":"ae4dd8f1"},{"t":"catalyst","_n":"va84","_k":"07c4c39b"}],"explain":"Water donates H⁺, so it’s the acid. NH₃ is a base even though it has no OH⁻."},{"id":"p3","prompt":"Particle view: 0.10 mol/L CH₃COOH. About how many of every 100 ethanoic acid molecules are ionized?","options":[{"t":"about 1","_n":"wa74","_k":"1a325e4e"},{"t":"none","_n":"xa64","_k":"d6f19337"},{"t":"all 100","_n":"ya54","_k":"897ba221"},{"t":"about 50","_n":"za44","_k":"d6ca843b"}],"explain":"1 of the 100 tokens splits (1.3%). A weak acid reaches equilibrium with most molecules intact; it does ionize a little."},{"id":"p4","prompt":"Which side wins: HF + CH₃COO⁻ ⇌ F⁻ + CH₃COOH. Which side is favoured?","options":[{"t":"neither","_n":"10a34","_k":"75c532a9"},{"t":"products","_n":"11b24","_k":"8d6b6d6b"},{"t":"reactants","_n":"12b14","_k":"1421de74"},{"t":"you need concentrations to tell","_n":"13384","_k":"53e0012b"}],"explain":"The balance tips right. HF (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 6.6 × 10⁻⁴) is the stronger acid, so it gives its proton away. The side with the weaker acid, CH₃COOH, is favoured."}],"chalIntro":"Use the animator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build a reaction in which HCO₃⁻ acts as a \u003cstrong>base\u003c/strong>.","why":"HCO₃⁻ accepts H⁺ and becomes its conjugate acid, H₂CO₃. With another acid it would give H⁺ away instead: it’s amphiprotic.","hints":["A base accepts H⁺.","Choose an acid to give HCO₃⁻ a proton.","e.g. HCl + HCO₃⁻ → Cl⁻ + H₂CO₃."]},{"id":"tc2","goal":3,"prompt":"Particle view, CH₃COOH: make \u003cstrong>more than 10%\u003c/strong> of the molecules ionize.","why":"At 0.0010 mol/L, 12.5% of the ethanoic acid is ionized. Diluting a weak acid shifts its equilibrium toward the side with more dissolved particles, so a larger fraction ionizes.","hints":["Try each concentration and watch the percentage.","Diluting favours the side with more particles.","0.0010 mol/L gives 12.5%."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"In \u003cstrong>Which side wins?\u003c/strong>, build a reaction from table acids (CH₃COOH, HCOOH, HF, NH₄⁺) and their conjugate bases in which the \u003cstrong>reactants\u003c/strong> are favoured, and pick the reason.","why":"The acid on the left is weaker than the acid it would make, so it keeps its proton: the reactants are favoured. Six pairs work: CH₃COOH + F⁻, CH₃COOH + HCOO⁻, HCOOH + F⁻, NH₄⁺ + CH₃COO⁻, NH₄⁺ + HCOO⁻ and NH₄⁺ + F⁻.","hints":["Reactants are favoured when the acid on the left is weaker than the acid it would make.","Compare the \u003ci>K\u003c/i>\u003csub>a\u003c/sub> of your acid with the \u003ci>K\u003c/i>\u003csub>a\u003c/sub> of the base’s conjugate acid.","e.g. NH₄⁺ (5.6 × 10⁻¹⁰) + F⁻ would make HF (6.6 × 10⁻⁴): reactants win."]}]},"part3":{"slug":"strength","name":"Strength","heading":"Strong vs weak, concentrated vs dilute","intro":"Two ideas students often mix up: how much of an acid \u003cstrong>ionizes\u003c/strong> (strength) and how much is \u003cstrong>dissolved\u003c/strong> (concentration). Here you work from particle pictures, pH and conductivity: data, not the animator.","grid":{"title":"Station 1: The strength grid","intro":"Each card shows 100 acid molecules: an ionized one splits into H₃O⁺ (magenta) and its anion (teal). Tap a card to see how its pH was found.","cols":["Concentrated (1.0 mol/L)","Dilute (0.0010 mol/L)"],"rows":["Strong (HCl)","Weak (CH₃COOH)"],"cond":{"sc":"very high","sd":"low","wc":"low","wd":"very low"},"dataTitle":"Check it with data","note":"pH values are computed from the course \u003ci>K\u003c/i>\u003csub>a\u003c/sub>; conductivities are described in words. You’ll calculate values like these yourself in modules 39 and 40."},"mg":{"title":"Station 2: The magnesium test","intro":"Equal volumes (50 mL) of 0.10 mol/L HCl and 0.10 mol/L CH₃COOH each react with excess magnesium ribbon. The hydrogen gas is collected and its volume graphed over time. Equal concentrations and volumes are the controlled variables.","ask":"Why do both curves level off at the same volume? Tap the best explanation.","chips":[{"t":"Same moles of acid; as H₃O⁺ is used up, more CH₃COOH ionizes (Le Chatelier).","why":"Both flasks hold 0.0050 mol of acid. Mg removes H₃O⁺, so the ethanoic acid equilibrium keeps shifting right until all of it has reacted.","_n":"14394","_k":"55c75466"},{"t":"CH₃COOH makes more gas per mole, so it catches up.","why":"Each mole of either acid gives the same amount of H₂. What differs is how fast.","_n":"15364","_k":"8a74f56f"},{"t":"The magnesium ran out in both flasks.","why":"The magnesium is in excess: the acid runs out first.","_n":"16374","_k":"e360bb49"},{"t":"The HCl gas escaped early.","why":"The gas collected is hydrogen from the reaction, not HCl.","_n":"17344","_k":"3949245b"}],"note":"Model data: rounded, shaped like real results."},"blocks":[{"title":"Safety","html":"\u003cp>\u003cstrong>Strong acids and bases are corrosive. Weak doesn’t mean safe.\u003c/strong>\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Strength quick check","items":[{"id":"q1","goal":4,"prompt":"Which has the lower pH: 1.0 mol/L CH₃COOH or 0.0010 mol/L HCl?","choices":[{"t":"can’t tell","fb":"pH 2.37 vs 3.00: concentration can beat strength.","_n":"18354","_k":"808cca99"},{"t":"1.0 mol/L CH₃COOH","fb":"Right. pH 2.37 vs 3.00: concentration can beat strength.","_n":"19324","_k":"738dc094"},{"t":"0.0010 mol/L HCl","fb":"pH 2.37 vs 3.00: concentration can beat strength.","_n":"1a334","_k":"ed023046"},{"t":"equal","fb":"pH 2.37 vs 3.00: concentration can beat strength.","_n":"1b304","_k":"89157c4a"}]},{"id":"q2","goal":4,"prompt":"Which word describes 0.0010 mol/L HCl?","choices":[{"t":"weak and concentrated","fb":"It ionizes completely, but there’s little of it.","_n":"1c314","_k":"42bde11a"},{"t":"weak and dilute","fb":"It ionizes completely, but there’s little of it.","_n":"1d1e4","_k":"b24cd0c3"},{"t":"strong and dilute","fb":"Right. It ionizes completely, but there’s little of it.","_n":"1e1d4","_k":"fe229d24"},{"t":"strong and concentrated","fb":"It ionizes completely, but there’s little of it.","_n":"1f204","_k":"859ac621"}]},{"id":"q3","goal":3,"prompt":"Why do both acids in the magnesium test give the same final gas volume?","choices":[{"t":"Same moles of acid react eventually","fb":"Right. Removing H₃O⁺ makes more CH₃COOH ionize.","_n":"1g1f4","_k":"e1b1f780"},{"t":"Weak acids make more gas","fb":"Removing H₃O⁺ makes more CH₃COOH ionize.","_n":"1h224","_k":"037e16ad"},{"t":"Mg runs out first","fb":"Removing H₃O⁺ makes more CH₃COOH ionize.","_n":"1i214","_k":"f967e8f3"},{"t":"The gas escapes","fb":"Removing H₃O⁺ makes more CH₃COOH ionize.","_n":"1j244","_k":"2383c339"}]},{"id":"q4","goal":3,"prompt":"Which variable must be the same for a fair strength comparison?","choices":[{"t":"colour","fb":"Compare strength at equal concentration and volume.","_n":"1k234","_k":"39e8bbab"},{"t":"beaker shape","fb":"Compare strength at equal concentration and volume.","_n":"1l264","_k":"d5597e6d"},{"t":"concentration","fb":"Right. Compare strength at equal concentration and volume.","_n":"1m254","_k":"763d6188"},{"t":"room lighting","fb":"Compare strength at equal concentration and volume.","_n":"1nac3","_k":"1deed4c2"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Conjugate pairs","summary":"Conjugate pairs","goal":[1,2],"instruction":"Match each acid to its conjugate base. One base on the right has no partner.","leftTitle":"Acid","rightTitle":"Conjugate base","left":[{"id":"l1","t":"HCl","why":"HCl minus one H⁺ is Cl⁻.","hints":["Remove one H⁺ from HCl.","Take away one H and lower the charge by one.","Cl⁻."]},{"id":"l2","t":"H₂O","why":"Water minus one H⁺ is OH⁻.","hints":["Remove one H⁺ from H₂O.","Take away one H and lower the charge by one.","OH⁻."]},{"id":"l3","t":"H₃O⁺","why":"H₃O⁺ loses one H⁺ to give H₂O.","hints":["Remove one H⁺ from H₃O⁺.","Take away one H and lower the charge by one.","H₂O."]},{"id":"l4","t":"NH₄⁺","why":"NH₄⁺ loses one H⁺ to give NH₃.","hints":["Remove one H⁺ from NH₄⁺.","Take away one H and lower the charge by one.","NH₃."]},{"id":"l5","t":"CH₃COOH","why":"The H on the O leaves: CH₃COO⁻.","hints":["Remove one H⁺ from CH₃COOH.","Take away one H and lower the charge by one.","CH₃COO⁻."]},{"id":"l6","t":"H₂CO₃","why":"H₂CO₃ minus one H⁺ is HCO₃⁻.","hints":["Remove one H⁺ from H₂CO₃.","Take away one H and lower the charge by one.","HCO₃⁻."]},{"id":"l7","t":"HCO₃⁻","why":"As an acid, HCO₃⁻ loses one H⁺ to give CO₃²⁻.","hints":["HCO₃⁻ appears twice in the list.","As an acid, it loses H⁺.","CO₃²⁻."]},{"id":"l8","t":"HSO₄⁻","why":"HSO₄⁻ minus one H⁺ is SO₄²⁻.","hints":["Remove one H⁺ from HSO₄⁻.","Take away one H and lower the charge by one.","SO₄²⁻."]}],"right":[{"id":"r1","t":"Cl⁻"},{"id":"r2","t":"OH⁻"},{"id":"r3","t":"H₂O"},{"id":"r4","t":"NH₃"},{"id":"r5","t":"CH₃COO⁻"},{"id":"r6","t":"HCO₃⁻"},{"id":"r7","t":"CO₃²⁻"},{"id":"r8","t":"SO₄²⁻"},{"id":"r9","t":"NH₂⁻"}],"_a":"SxJaUEMOQUoBEhpDDQZBAhJCBENNFg8LEgoUE1IWTxpcBBRbQ0ZXGhwSWlRDDkFKBRIaQw0CQQISQgBDTRYPDxIKFBNWFk8aXAgUW0NGWxpN","wrong":{"l4|r9":"That removes a second H⁺ from NH₃; NH₄⁺’s conjugate base is NH₃.","l6|r7":"Two H⁺ apart: H₂CO₃ → HCO₃⁻ → CO₃²⁻.","l3|r2":"H₃O⁺ loses one H⁺ to give H₂O."},"wrongDefault":"Conjugates differ by exactly one H⁺."},{"id":"wins","type":"mc","title":"Which side wins?","summary":"Which side wins?","star":true,"goal":[2,3,4,5],"instruction":"Six items. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check. \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values are from the course table.","items":[{"id":"r1","goal":5,"prompt":"CH₃COOH + NH₃ ⇌ CH₃COO⁻ + NH₄⁺: favoured side?","options":[{"t":"Neither","why":"The two \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values differ by about 32 000 times.","_n":"1oad3","_k":"e5309f34"},{"t":"Reactants","why":"CH₃COOH (1.8 × 10⁻⁵) is far stronger than NH₄⁺ (5.6 × 10⁻¹⁰). The stronger acid gives its proton away: equilibrium favours the \u003cstrong>weaker\u003c/strong> acid and base.","_n":"1pae3","_k":"b339f086"},{"t":"Products","why":"CH₃COOH (1.8 × 10⁻⁵) is far stronger than NH₄⁺ (5.6 × 10⁻¹⁰), so it gives its proton to NH₃.","_n":"1qaf3","_k":"407c22af"},{"t":"You need concentrations to tell","why":"Relative acid strength predicts the favoured side.","_n":"1rb03","_k":"80321d98"}]},{"id":"r2","goal":5,"prompt":"NH₄⁺ + F⁻ ⇌ NH₃ + HF: favoured side?","options":[{"t":"Products","why":"HF is the stronger acid; it would give the proton back.","_n":"1sb13","_k":"71420b4c"},{"t":"Reactants","why":"NH₄⁺ (5.6 × 10⁻¹⁰) is far weaker than HF (6.6 × 10⁻⁴), so the weaker acid keeps its proton.","_n":"1tb23","_k":"abae1d8f"},{"t":"You need concentrations to tell","why":"Relative acid strength predicts the favoured side.","_n":"1ub33","_k":"b7aaefb8"},{"t":"Neither","why":"The two \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values differ by about a million times.","_n":"1va43","_k":"1b662df1"}]},{"id":"r3","goal":2,"star":true,"prompt":"Choose the two equations showing HCO₃⁻ as an acid and as a base.","options":[{"t":"HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O and HCO₃⁻ + NH₃ → CO₃²⁻ + NH₄⁺","why":"Both show HCO₃⁻ donating H⁺. One must donate, the other accept.","_n":"1wa53","_k":"30c09abd"},{"t":"HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O and HCO₃⁻ + H₃O⁺ → H₂CO₃ + H₂O","why":"In the first, HCO₃⁻ donates H⁺ (acid); in the second, it accepts H⁺ (base).","_n":"1x324","_k":"007a5489"},{"t":"HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O and CO₃²⁻ + H₂O → HCO₃⁻ + OH⁻","why":"In the second, HCO₃⁻ is a product, not the reactant. One must donate, the other accept.","_n":"1y314","_k":"595f8f04"},{"t":"HCO₃⁻ + H₃O⁺ → H₂CO₃ + H₂O and HCO₃⁻ + HF → H₂CO₃ + F⁻","why":"Both show HCO₃⁻ accepting H⁺. One must donate, the other accept.","_n":"1z304","_k":"e2e1eeb2"}]},{"id":"r4","goal":2,"star":true,"prompt":"How many acidic hydrogens does ethanoic acid, CH₃COOH, have?","options":[{"t":"1","why":"In CH₃COOH only the H on the O is donated; the CH₃ hydrogens aren’t acidic.","_n":"202f4","_k":"7a7612d7"},{"t":"2","why":"Only the H on the oxygen is donated.","_n":"21364","_k":"3adfa8d2"},{"t":"3","why":"The three CH₃ hydrogens aren’t acidic; only the H on the O is.","_n":"22354","_k":"acfa1126"},{"t":"4","why":"Only the H on the oxygen is donated.","_n":"23344","_k":"735275d6"}]},{"id":"r5","goal":5,"star":true,"prompt":"Rank the conjugate bases F⁻, CH₃COO⁻, NH₃ from weakest to strongest.","options":[{"t":"NH₃ \u003c CH₃COO⁻ \u003c F⁻","why":"The stronger the acid, the weaker its conjugate base.","_n":"24334","_k":"599fc10a"},{"t":"F⁻ \u003c CH₃COO⁻ \u003c NH₃","why":"HF is the strongest of the three acids and NH₄⁺ the weakest, so F⁻ is the weakest base and NH₃ the strongest.","_n":"252a3","_k":"e20f4f90"},{"t":"CH₃COO⁻ \u003c F⁻ \u003c NH₃","why":"HF is a stronger acid than CH₃COOH, so F⁻ is the weaker base.","_n":"26293","_k":"a120eef0"},{"t":"F⁻ \u003c NH₃ \u003c CH₃COO⁻","why":"NH₄⁺ is the weakest acid, so NH₃ is the strongest base.","_n":"27a03","_k":"82943f8d"}],"hints":["Find each conjugate acid’s \u003ci>K\u003c/i>\u003csub>a\u003c/sub>: HF, CH₃COOH, NH₄⁺.","HF is strongest, NH₄⁺ weakest.","So F⁻ is the weakest base and NH₃ the strongest."]},{"id":"r6","goal":[3,4],"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> equal volumes of 0.10 mol/L HCl and 0.10 mol/L CH₃COOH react with excess magnesium. Predict the initial rate and the final gas volume.","options":[{"t":"CH₃COOH faster; more gas from CH₃COOH","why":"CH₃COOH starts with much less H₃O⁺, and the same moles of acid give the same total gas.","_n":"28a13","_k":"c8541a77"},{"t":"Same rate; same final volume","why":"HCl starts with far more H₃O⁺, so it reacts faster.","_n":"299e3","_k":"8d8b4c8e"},{"t":"HCl faster; same final volume","why":"HCl starts with far more H₃O⁺, so it reacts faster; the same moles of acid give the same total gas.","_n":"2a9f3","_k":"517ddbfe"},{"t":"HCl faster; more gas from HCl","why":"Same moles of acid give the same total gas.","_n":"2ba43","_k":"8e32d378"}]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Usman","how":"","goal":[1,4,5],"instruction":"Usman made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Identify the conjugate pairs in NH₄⁺ + OH⁻ ⇌ NH₃ + H₂O.","steps":["NH₄⁺ gives H⁺ to OH⁻, so NH₄⁺ is the acid.","OH⁻ accepts H⁺, so OH⁻ is the base.","The conjugate base of NH₄⁺ is NH₂⁻.","The conjugate acid of OH⁻ is H₂O."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"The conjugate base of NH₄⁺ is H₂O.","why":"H₂O comes from OH⁻.","_n":"2ca53","_k":"f2e5319c"},{"t":"NH₄⁺ loses one H⁺ to give NH₃, its conjugate base.","why":"A conjugate pair differs by exactly one H⁺: NH₄⁺ and NH₃, not NH₄⁺ and NH₂⁻.","_n":"2da23","_k":"2d698fc7"},{"t":"Step 3 is correct.","why":"A conjugate pair differs by exactly one H⁺: NH₄⁺ and NH₃, not NH₄⁺ and NH₂⁻.","_n":"2ea33","_k":"deb2f910"},{"t":"The conjugate base of NH₄⁺ is NH₄.","why":"Losing H⁺ removes an H.","_n":"2fa83","_k":"c5b386c8"}],"hints":["How many H⁺ does NH₄⁺ lose here?","One.","NH₃."]},{"id":"e2","goal":4,"task":"Compare 0.0010 mol/L HCl with 1.0 mol/L CH₃COOH.","steps":["HCl ionizes completely in water.","But this HCl is only 0.0010 mol/L, so it’s a weak acid.","CH₃COOH at 1.0 mol/L is concentrated, so it’s a strong acid."],"_a":"AQ==","stepFb":["Step 1 is correct.","","Step 3 repeats the same mix-up; the first one is earlier."],"fixes":[{"t":"Both are weak.","why":"HCl ionizes completely at any concentration.","_n":"2ga93","_k":"459e1654"},{"t":"Both are strong.","why":"CH₃COOH ionizes only about 0.4%.","_n":"2ha63","_k":"a02c927c"},{"t":"Step 2 is correct.","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"2ia53","_k":"52bbb426"},{"t":"0.0010 mol/L HCl is a \u003cstrong>dilute strong\u003c/strong> acid; 1.0 mol/L CH₃COOH is a \u003cstrong>concentrated weak\u003c/strong> acid.","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"2ja83","_k":"8bb350df"}],"hints":["What does ‘weak’ describe?","How much ionizes, not how much is dissolved.","Dilute strong vs concentrated weak."]},{"id":"e3","goal":5,"task":"Which side is favoured: HCOOH + F⁻ ⇌ HCOO⁻ + HF?","steps":["The acids are HCOOH (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 1.8 × 10⁻⁴) and HF (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 6.6 × 10⁻⁴).","HF is the stronger acid.","So the side with HF, the products, is favoured."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Neither is favoured, because both are weak.","why":"Relative strength still decides.","_n":"2ka73","_k":"95d9033a"},{"t":"Products, because F⁻ is a strong base.","why":"F⁻ is a weak base.","_n":"2la23","_k":"b2659ddc"},{"t":"Step 3 is correct.","why":"The stronger acid gives its proton away: equilibrium favours the \u003cstrong>weaker\u003c/strong> acid and base.","_n":"2ma13","_k":"4c98c98e"},{"t":"The stronger acid gives its proton away, so the side with the weaker acid (HCOOH, the reactants) is favoured.","why":"The stronger acid gives its proton away: equilibrium favours the \u003cstrong>weaker\u003c/strong> acid and base.","_n":"2na43","_k":"9f39557f"}],"hints":["Which acid holds its proton more loosely?","HF: it gives H⁺ away.","Equilibrium sits on the HCOOH side."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: water acting as an acid (P2) or 1.0 mol/L ethanoic acid beating 0.0010 mol/L HCl (Part 3)?"},{"id":"j2","q":"In your own words, explain the difference between a strong acid and a concentrated acid."},{"id":"j3","q":"Explain to a friend how to find the conjugate pairs in any acid–base reaction."},{"id":"j4","q":"Which idea still trips you up (conjugates, amphiprotic species, or which side wins)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In HNO₃ + H₂O → NO₃⁻ + H₃O⁺, what is the conjugate base of HNO₃?","options":[{"t":"H₃O⁺","why":"That’s the conjugate acid of water.","_n":"2oa33","_k":"00ca4b9a"},{"t":"H₂O","why":"Water is the base here.","_n":"2pae3","_k":"58ee65e3"},{"t":"NO₃⁻","why":"HNO₃ minus one H⁺.","_n":"2qad3","_k":"cef15144"},{"t":"NO₂⁻","why":"Only one H⁺ is removed; the oxygens stay.","_n":"2rc44","_k":"ef149def"}]},"b":{"prompt":"In NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, what is the conjugate acid of NH₃?","options":[{"t":"OH⁻","why":"That’s the conjugate base of water.","_n":"2sc34","_k":"f0b67ee9"},{"t":"H₂O","why":"Water is the acid here.","_n":"2tc24","_k":"b29c2383"},{"t":"NH₂⁻","why":"That’s NH₃ losing H⁺, not gaining it.","_n":"2uc14","_k":"89e3e069"},{"t":"NH₄⁺","why":"NH₃ plus one H⁺.","_n":"2vc04","_k":"291f9604"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which species is amphiprotic?","options":[{"t":"NH₄⁺","why":"It can only donate H⁺.","_n":"2wbf4","_k":"0e680bbf"},{"t":"CO₃²⁻","why":"It has no H⁺ to donate.","_n":"2xbe4","_k":"52866edf"},{"t":"Cl⁻","why":"It neither donates nor (effectively) accepts H⁺ in water.","_n":"2ybd4","_k":"fe9bd133"},{"t":"HCO₃⁻","why":"It can donate H⁺ (to CO₃²⁻) or accept H⁺ (to H₂CO₃).","_n":"2zcc4","_k":"974a1b43"}]},"b":{"prompt":"Which species can act as both an acid and a base?","options":[{"t":"H₂O","why":"It donates H⁺ to NH₃ and accepts H⁺ from HCl.","_n":"30cb4","_k":"b521819b"},{"t":"F⁻","why":"It can only accept.","_n":"31be4","_k":"03afb21d"},{"t":"Na⁺","why":"It has no H⁺ and doesn’t accept one.","_n":"32bf4","_k":"a4252d39"},{"t":"H₃O⁺","why":"It can only donate.","_n":"33c04","_k":"7403ea25"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which statement describes a strong acid in water?","options":[{"t":"It ionizes essentially 100%","why":"A strong acid donates essentially every proton to water.","_n":"34c14","_k":"7821bac4"},{"t":"It must be concentrated.","why":"Strength isn’t concentration.","_n":"35ba4","_k":"1120bc85"},{"t":"It always has a pH of 0.","why":"pH depends on concentration too.","_n":"36bb4","_k":"5ef2f4d9"},{"t":"It stays mostly un-ionized.","why":"That’s a weak acid.","_n":"37bc4","_k":"0ddb420d"}]},"b":{"prompt":"Which statement describes a weak base such as NH₃ in water?","options":[{"t":"It reacts completely, like NaOH.","why":"That’s a strong base.","_n":"38bd4","_k":"d6d238a1"},{"t":"It doesn’t react with water at all.","why":"A weak base does react a little: some NH₃ accepts H⁺ and an equilibrium forms.","_n":"39c64","_k":"65e988a5"},{"t":"Only a small fraction accepts H⁺, and an equilibrium forms with most NH₃ unchanged","why":"A weak base reacts a little and reaches equilibrium.","_n":"3ac74","_k":"a3195e5f"},{"t":"It must be dilute.","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"3b504","_k":"c40219be"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Which side is favoured: HF + NH₃ ⇌ F⁻ + NH₄⁺?","options":[{"t":"Products, because HF (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 6.6 × 10⁻⁴) is a much stronger acid than NH₄⁺ (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 5.6 × 10⁻¹⁰)","why":"The stronger acid, HF, gives its proton away, so the side with the weaker acid, NH₄⁺, is favoured.","_n":"3c4f4","_k":"b8af5d11"},{"t":"Neither: both sides are equally favoured.","why":"The \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values differ by about a million times.","_n":"3d524","_k":"ee5bf836"},{"t":"It can’t be predicted without concentrations.","why":"Relative strength predicts the favoured side.","_n":"3e514","_k":"21203490"},{"t":"Reactants, because HF is the stronger acid.","why":"The stronger acid gives its proton away: equilibrium favours the \u003cstrong>weaker\u003c/strong> acid and base.","_n":"3f4c4","_k":"50661266"}]},"b":{"prompt":"Which side is favoured: CH₃COOH + F⁻ ⇌ CH₃COO⁻ + HF?","options":[{"t":"It can’t be predicted without concentrations.","why":"Relative strength predicts the favoured side.","_n":"3g4b4","_k":"57ff62ee"},{"t":"Neither.","why":"The \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values differ by about 37 times.","_n":"3h4e4","_k":"5b0bebce"},{"t":"Reactants, because CH₃COOH (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 1.8 × 10⁻⁵) is a weaker acid than HF (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 6.6 × 10⁻⁴)","why":"The weaker acid keeps its proton, so the reactants are favoured.","_n":"3i4d4","_k":"a386a8d1"},{"t":"Products, because HF forms.","why":"The stronger acid gives its proton away: equilibrium favours the \u003cstrong>weaker\u003c/strong> acid and base.","_n":"3j484","_k":"5f463029"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Which has the higher [H₃O⁺]: 1.0 mol/L CH₃COOH (about 0.42% ionized) or 0.0010 mol/L HCl?","options":[{"t":"1.0 mol/L CH₃COOH: 0.42% of 1.0 mol/L is 4.2 × 10⁻³ mol/L, more than 1.0 × 10⁻³","why":"Concentration can beat strength.","_n":"3k474","_k":"ddd25b1c"},{"t":"You can’t compare a strong acid with a weak one.","why":"You can: compare [H₃O⁺].","_n":"3l4a4","_k":"07c52ffe"},{"t":"0.0010 mol/L HCl, because strong acids always give more H₃O⁺.","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"3m4b4","_k":"8b2be9f4"},{"t":"They’re equal, because both are acids.","why":"Work out each [H₃O⁺].","_n":"3n484","_k":"a0f073ed"}]},"b":{"prompt":"Which has the higher [OH⁻]: 1.0 mol/L NH₃ (about 0.42% ionized) or 0.0010 mol/L NaOH?","options":[{"t":"They’re equal.","why":"Work out each [OH⁻].","_n":"3o494","_k":"f013fc65"},{"t":"NH₃ gives no OH⁻, because it has no OH group.","why":"In Brønsted–Lowry theory a base accepts H⁺. NH₃ does, making OH⁻ from water.","_n":"3p4e4","_k":"ceff17f6"},{"t":"1.0 mol/L NH₃: about 4.2 × 10⁻³ mol/L of OH⁻, more than 1.0 × 10⁻³","why":"Concentration can beat strength.","_n":"3q4f4","_k":"9a517f6f"},{"t":"0.0010 mol/L NaOH, because strong bases always give more OH⁻.","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"3r4c4","_k":"e3f0ff62"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"0.10 mol/L CH₃COOH is 1.3% ionized. If it’s diluted to 0.010 mol/L, its percent ionization will…","options":[{"t":"decrease, because there’s less acid.","why":"Less acid in total, but a larger fraction ionizes.","_n":"3s4d4","_k":"12b1b2a4"},{"t":"stay at 1.3%, because the acid’s strength doesn’t change.","why":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> stays the same; the percentage changes.","_n":"3t424","_k":"f4da24ed"},{"t":"increase (to about 4%), because dilution favours the side with more dissolved particles","why":"Less acid in total, but a larger fraction ionizes: 4.2%.","_n":"3u434","_k":"6767071a"},{"t":"drop to zero.","why":"A weak acid ionizes a little and reaches equilibrium; a strong acid ionizes essentially 100%.","_n":"3v4c3","_k":"9eb5b1df"}]},"b":{"prompt":"1.0 × 10⁻³ mol/L CH₃COOH is about 12.5% ionized. If it’s made 100 times more concentrated, its percent ionization will…","options":[{"t":"increase, because there’s more acid.","why":"More acid, but a smaller fraction ionizes.","_n":"3w4b3","_k":"a64f0267"},{"t":"stay at 12.5%.","why":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> stays the same; the percentage changes.","_n":"3x4a3","_k":"032dec4b"},{"t":"decrease (to about 1.3%)","why":"Crowding the solution favours the un-ionized side.","_n":"3y493","_k":"d43355dd"},{"t":"reach 100%.","why":"Weak acids never ionize completely.","_n":"3z503","_k":"3348c83f"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why NH₃ is a base even though it has no OH⁻ in its formula?","options":[{"t":"“NH₃ secretly contains an OH group.”","why":"Its formula has no O.","_n":"404f3","_k":"a9e633b9"},{"t":"“In Brønsted–Lowry theory a base accepts H⁺. NH₃ accepts H⁺ from water, which leaves OH⁻ in solution.”","why":"It uses the Brønsted–Lowry definition and shows where the OH⁻ comes from.","_n":"414e3","_k":"d389c0e4"},{"t":"“Every compound with nitrogen is a base.”","why":"Nitric acid, HNO₃, contains nitrogen and is an acid.","_n":"424d3","_k":"60165801"},{"t":"“NH₃ is an Arrhenius base, so it contains OH⁻.”","why":"In Brønsted–Lowry theory a base accepts H⁺. NH₃ does, making OH⁻ from water.","_n":"43443","_k":"342b47c8"}]},"b":{"prompt":"Which statement best describes water’s role in HCl(aq) and in NH₃(aq)?","options":[{"t":"“Water is a base in both.”","why":"It donates H⁺ to NH₃.","_n":"44433","_k":"eb651ca8"},{"t":"“Water is a base toward HCl (it accepts H⁺) and an acid toward NH₃ (it donates H⁺): it’s amphiprotic.”","why":"Water donates H⁺ to NH₃ and accepts H⁺ from HCl: it’s amphiprotic.","_n":"45463","_k":"76dfcfff"},{"t":"“Water is an acid in both.”","why":"It accepts H⁺ from HCl.","_n":"46473","_k":"8c228f7a"},{"t":"“Water is neutral in both, so it does nothing.”","why":"Water donates H⁺ to NH₃ and accepts H⁺ from HCl: it’s amphiprotic.","_n":"47483","_k":"81982650"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the clearest explanation of the difference between a weak acid and a dilute acid?","options":[{"t":"“‘Weak’ describes how much of the acid ionizes; ‘dilute’ describes how much acid is dissolved per litre.”","why":"It separates the two ideas: how much ionizes vs how much is dissolved.","_n":"48493","_k":"d3deb8d5"},{"t":"“They mean the same thing.”","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"494a3","_k":"36485153"},{"t":"“Weak acids are always dilute.”","why":"1.0 mol/L ethanoic acid is weak and concentrated.","_n":"4a4b3","_k":"9329f27c"},{"t":"“Dilute acids ionize less than concentrated ones.”","why":"Dilution actually raises a weak acid’s percent ionization.","_n":"4b4c3","_k":"b00d606a"}]},"b":{"prompt":"A student says, ‘1.0 mol/L ethanoic acid is a strong acid because it’s concentrated.’ Which is the best correction?","options":[{"t":"“It’s a strong base.”","why":"It’s an acid.","_n":"4c4d3","_k":"f1c57348"},{"t":"“Its strength depends on the temperature only.”","why":"Strength comes from how much ionizes.","_n":"4d3e3","_k":"8bd82ee3"},{"t":"“It’s strong only above 1.0 mol/L.”","why":"Strength is how much ionizes; concentration is how much is dissolved.","_n":"4e3f3","_k":"c27d1c05"},{"t":"“Strength is about ionization: ethanoic acid ionizes only about 0.4% even at 1.0 mol/L, so it’s a concentrated weak acid.”","why":"It says what strength measures and gives the evidence.","_n":"4fb83","_k":"db6bd2bc"}]}},{"id":"a1","cat":"A","goal":[2,6],"a":{"prompt":"Baking soda (NaHCO₃) is sprinkled on a vinegar spill. Which equation shows HCO₃⁻ acting as a base?","options":[{"t":"Na⁺ + CH₃COOH → NaCH₃COO + H⁺","why":"Na⁺ isn’t the base.","_n":"4gb73","_k":"8439e609"},{"t":"CH₃COOH + HCO₃⁻ → CH₃COO⁻ + H₂CO₃","why":"HCO₃⁻ accepts H⁺ from ethanoic acid.","_n":"4hba3","_k":"b2cddaf7"},{"t":"HCO₃⁻ → H⁺ + CO₃²⁻","why":"Also acting as an acid.","_n":"4ib93","_k":"49d01e09"},{"t":"HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O","why":"Here HCO₃⁻ donates H⁺: acting as an acid.","_n":"4jbc3","_k":"3d9b084c"}]},"b":{"prompt":"An antacid tablet contains carbonate ions. Which equation shows it neutralizing stomach acid?","options":[{"t":"CO₃²⁻ + OH⁻ → HCO₃⁻ + O²⁻","why":"CO₃²⁻ can’t donate H⁺; it has none.","_n":"4kbb3","_k":"73f19bf0"},{"t":"CO₃²⁻ + H₂O → CO₂ + 2OH⁻","why":"Unbalanced, and not a neutralization of H₃O⁺.","_n":"4lbe3","_k":"a1ca44ec"},{"t":"HCO₃⁻ + H₂O → CO₃²⁻ + H₃O⁺","why":"That makes more acid.","_n":"4mbd3","_k":"381af330"},{"t":"CO₃²⁻ + H₃O⁺ → HCO₃⁻ + H₂O","why":"CO₃²⁻ accepts H⁺.","_n":"4nc03","_k":"97e5b5ff"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Methylamine (\u003ci>K\u003c/i>\u003csub>b\u003c/sub> 4.4 × 10⁻⁴) is a stronger base than ammonia (\u003ci>K\u003c/i>\u003csub>b\u003c/sub> 1.8 × 10⁻⁵). Which side is favoured: CH₃NH₂ + NH₄⁺ ⇌ CH₃NH₃⁺ + NH₃?","options":[{"t":"Reactants, because NH₄⁺ is a weak acid.","why":"NH₄⁺ is weak, but the comparison is between the two bases.","_n":"4obf3","_k":"bb65be10"},{"t":"Neither.","why":"Their \u003ci>K\u003c/i>\u003csub>b\u003c/sub> values differ by about 24 times.","_n":"4p523","_k":"f3ad4eae"},{"t":"Reactants, because CH₃NH₂ is the stronger base.","why":"The stronger base wins the proton.","_n":"4q533","_k":"a69eaa02"},{"t":"Products, because the stronger base (CH₃NH₂) takes the proton","why":"Equilibrium favours the weaker base, NH₃.","_n":"4r503","_k":"64cdc56d"}]},"b":{"prompt":"Which side is favoured: HCOOH + CH₃COO⁻ ⇌ HCOO⁻ + CH₃COOH?","options":[{"t":"Products, because HCOOH (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 1.8 × 10⁻⁴) is the stronger acid","why":"The stronger acid gives its proton away, so the side with the weaker acid, CH₃COOH, is favoured.","_n":"4s513","_k":"706792c9"},{"t":"It can’t be predicted without concentrations.","why":"Relative strength predicts the favoured side.","_n":"4t4e3","_k":"bfb58372"},{"t":"Reactants, because HCOOH is the stronger acid.","why":"The stronger acid gives its proton away: equilibrium favours the \u003cstrong>weaker\u003c/strong> acid and base.","_n":"4u4f3","_k":"56576adc"},{"t":"Neither, because both are carboxylic acids.","why":"Their \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values differ tenfold.","_n":"4v4c3","_k":"bc9855e6"}]}}]},"task":{"title":"Pick the proton transfer","summary":"Pick the proton transfer","statement":"\u003cp>Choose an acid and a base from the menus to build a reaction that strongly favours products. Can you find all the answers?\u003c/p>\u003col class=\"ab-conds\">\u003cli>The acid and base are not a conjugate pair of each other (a real proton transfer happens).\u003c/li>\u003cli>Products are favoured.\u003c/li>\u003cli>Strongly favoured: the reaction’s \u003ci>K\u003c/i> = \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(acid) ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(acid formed) is at least 100.\u003c/li>\u003c/ol>","qA":"Acid","qB":"Base","acids":["CH3COOH","HCOOH","HF","NH4+"],"bases":["CH3COO-","HCOO-","F-","NH3"],"checks":["A real transfer","Products favoured","Strongly favoured"],"tips":["HF with F⁻ just swaps the same proton back and forth. Pick a different base.","The acid on the left must be stronger than the acid it makes.","Your acids are too close in strength (e.g. HF vs CH₃COOH is only about 37 times). Pick a base whose conjugate acid is much weaker."],"explainPrompt":"Explain why your reaction strongly favours products, using the strengths of the two acids and the two bases.","vocab":"Use the words conjugate acid, conjugate base, Ka and favoured.","more":"There’s more than one answer. Can you find them all?","after3":"Every answer uses NH₃. Its conjugate acid, NH₄⁺, is by far the weakest acid on the menu, so NH₃ is by far the strongest base."},"cards":[["Brønsted–Lowry acid","A proton (H⁺) donor."],["Brønsted–Lowry base","A proton acceptor; it needn’t contain OH⁻ (NH₃)."],["Conjugate pair","Two species that differ by exactly one H⁺: HF/F⁻, NH₄⁺/NH₃."],["Amphiprotic","Can act as an acid or a base: H₂O, HCO₃⁻."],["Strong acid","Ionizes essentially 100% in water: HCl, HBr, HI, HNO₃, HClO₄, H₂SO₄ (first H⁺)."],["Weak acid","Ionizes partly; reaches a dynamic equilibrium: CH₃COOH, HF."],["Strong vs concentrated","Strength = fraction ionized; concentration = amount dissolved per litre."],["Percent ionization","(amount ionized ÷ initial amount) × 100%; rises when a weak acid is diluted."],["Which side wins?","Equilibrium favours the weaker acid and weaker base."],["Conjugate strength","The stronger the acid, the weaker its conjugate base."],["Arrhenius vs Brønsted–Lowry","Arrhenius: acids give H⁺, bases give OH⁻ in water. Brønsted–Lowry: proton donors and acceptors."],["H₃O⁺","Hydronium: a water molecule that has accepted H⁺; the acid present in all acidic solutions."]]}};</script>
