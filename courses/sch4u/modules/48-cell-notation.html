.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 48: hero, Notation translator (C10 notation mode), Batteries and fuel cells, numbers, One platinum task.
   Colours (plan build notes): anode side --pen, cathode side --f3 (teal), salt bridge ink, electrons --ec-e (violet),
   Pt grey (--ink-2) with its label, metal electrodes --at-m (cerulean). */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.6;cursor:default}
.rg.cn-rlist{display:flex;flex-direction:column;align-items:stretch;width:100%}
.rg.cn-rlist button{border-radius:8px;text-align:left;padding:.4em .8em}

/* notation typesetting: each half stays on one line; a long notation wraps only at || */
.cn-n{font-family:var(--font-math)}
.cn-h{white-space:nowrap}
.cn-dl{white-space:nowrap;letter-spacing:.06em;font-weight:700}
.cn-tk{display:inline-block;padding:0 1px 1px}
.cn-tk.cn-cm{margin-left:-2px}
.cn-tk.cn-l{border-bottom:3px solid var(--pen)}
.cn-tk.cn-r{border-bottom:3px solid var(--f3)}
.cn-tk.cn-b{border-bottom:3px solid var(--ink)}
.cn-tk.cn-glow{background:var(--hi-soft);outline:2px solid var(--hi);border-radius:3px}
.cn-tap{font:inherit;color:inherit;background:var(--sheet);border:1.5px dashed var(--rule);border-radius:5px;min-height:34px;min-width:24px;padding:0 4px;margin:2px 0;cursor:pointer}
.cn-tap:hover,.cn-tap:focus-visible{border-color:var(--ink);background:var(--hi-soft)}
.cn-yes{color:var(--green);font-weight:700}
.cn-no{color:var(--red);font-weight:700}

/* hero */
.cn-hx{max-width:560px;margin:0 auto}
.cn-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.cn-hx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.cn-hx-ctr{margin:0;font-size:.92rem;color:var(--ink-2)}

/* explore */
.cn-modes{margin:4px 0 12px}
.cn-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.cn-view,.cn-side{min-width:0}
.cn-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.cn-svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.cn-notbox{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.cn-nlab{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.cn-not{font-size:1.15rem;line-height:2.1;min-height:2.1em}
.cn-cap{margin:8px 0 0;font-size:.95rem}
.cn-c + .cn-c{margin-top:0}
.cn-c > * + *{margin-top:10px}
.cn-tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cn-tile{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:7px;min-height:38px;min-width:40px;padding:.2em .55em;font:400 1rem var(--font-math)}
.cn-tile.cn-sep{min-width:46px;font-weight:700;border-color:var(--ink-2)}
.cn-tile:hover:not(:disabled){border-color:var(--ink)}
.cn-tile:disabled{opacity:.55}
.cn-ev{margin-top:12px}
.cn-btns{margin-top:12px}
.cn-read{margin-top:12px}
.cn-read dd{font-family:var(--font-math)}
.cn-fq{margin:10px 0 6px}
.cn-fch .chip{font:400 1rem var(--font-math);min-width:46px}
.cn-tabs{margin-top:8px}
.cn-pulse{animation:cn-pulse 1.1s ease-in-out infinite;border-color:var(--hi)!important}
@keyframes cn-pulse{0%,100%{box-shadow:0 0 0 0 var(--hi-soft)}50%{box-shadow:0 0 0 7px var(--hi-soft);background:var(--hi-soft)}}
@media (prefers-reduced-motion:reduce){.cn-pulse{animation:none;background:var(--hi-soft)}}
.cn-h4{margin:12px 0 6px;font-size:1rem}

/* part 3 */
.cn-devs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cn-dev{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);min-width:0}
.cn-dev .cn-h4{margin-top:2px}
.cn-dsvg{display:block;width:100%;max-width:280px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.cn-zsvg{display:block;width:100%;max-width:320px;height:auto;font-family:var(--font-ui)}
.cn-dread{margin:6px 0}
.cn-zoom{margin-top:6px}
.cn-s2box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.cn-s2t{display:block;text-align:left;border:1.5px dashed var(--ink-2);border-radius:10px;background:var(--sheet);color:var(--ink);padding:10px;min-height:84px;font:inherit}
.cn-s2t:hover:not(:disabled){border-color:var(--ink);background:var(--hi-soft)}
.cn-s2t ul{margin:6px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--green)}
.cn-scen{margin-bottom:4px}
.cn-s3row{margin:8px 0}
.cn-sent{margin:12px 0 4px;padding:10px 12px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:4px}
.cn-blank{color:var(--ink-2);letter-spacing:.05em}
.cn-note{margin-top:10px}

/* practice + task */
.cn-chiplist .chip{text-align:left}
.cn-unit{margin-left:6px}
.cn-conds{margin:6px 0 10px;padding-left:1.3em}
.cn-tsel{margin:8px 0}
.cn-tl{margin:10px 0 4px;line-height:2}
.cn-tbuilt{padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.cn-tfmt{min-height:1.4em;margin:6px 0 0;font-size:.92rem}

@media (max-width:860px){
  .cn-devs,.cn-s2box{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .cn-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cn-view .cn-box{margin:0 -12px}
  .cn-not{font-size:1.05rem}
  .cn-h + .cn-dl + .cn-h,.cn-n > .cn-h:last-child{padding-left:0}
  .cn-tray{max-height:176px;overflow-y:auto;padding:2px}
  .cn-svg text[font-size="12"],.cn-hx-svg text[font-size="12"]{font-size:14px}
  .cn-svg text[font-size="13"]{font-size:15px}
}

</style>
</head>

03c/strong> goes on the left and the \u003cstrong>cathode\u003c/strong> on the right. A single line marks a change of phase, and the double line is the \u003cstrong>salt bridge\u003c/strong>. When a half-cell has no metal of its own, an \u003cstrong>inert electrode\u003c/strong> such as platinum is written at the end.","fig":{"html":"\u003cdiv class=\"cn-hx\">\u003csvg class=\"cn-hx-svg\" id=\"cn-hx-svg\" viewBox=\"0 0 520 330\" role=\"img\" aria-label=\"A zinc–copper galvanic cell: a zinc strip in zinc ion solution, a copper strip in copper(II) ion solution, a salt bridge and a voltmeter reading 1.10 volts. Its parts fly into one line: Zn(s), a single line, Zn²⁺(aq), a double line, Cu²⁺(aq), a single line, Cu(s). Labels mark the anode on the left, a phase boundary, the salt bridge and the cathode on the right. A violet electron arrow runs left to right above the notation. E°cell = +1.10 V.\">\u003c/svg>\u003cdiv class=\"cn-hx-row\">\u003cp class=\"cn-hx-ctr\" id=\"cn-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"cn-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can read the symbols in cell notation: |, ||, commas and the order of the species.","I can write the notation for a cell from a diagram or a description, with the anode on the left.","I can decide when an inert electrode is needed and where it goes.","I can find \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> and decide whether a cell is spontaneous as written.","I can write the balanced overall reaction from a cell’s notation.","I can explain how batteries and fuel cells work, and judge where a fuel cell is a good choice."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Anode and cathode","goal":2,"prompt":"In a Zn–Cu galvanic cell, which electrode is the anode?","options":[{"t":"Cu","why":"Cu²⁺ is reduced at the cathode.","_n":"0ef3","_k":"6201f504"},{"t":"The salt bridge","why":"The bridge carries ions only.","_n":"1f03","_k":"14f70176"},{"t":"Zn","why":"Lower \u003ci>E\u003c/i>° (−0.76 V): it is oxidized.","_n":"2f13","_k":"9e8ce2bf"},{"t":"Both","why":"One is oxidized, the other reduced.","_n":"3ea3","_k":"639a6ba8"}],"hints":["Oxidation happens at the anode.","Which half-cell has the lower \u003ci>E\u003c/i>°?","Zn."]},{"id":"w2","skill":"Anode and cathode","goal":2,"prompt":"In a galvanic cell, electrons flow…","options":[{"t":"through the salt bridge","why":"Electrons never enter the salt bridge; it carries ions.","_n":"4eb3","_k":"6f9a5d74"},{"t":"through the wire, from the anode to the cathode","why":"Oxidation releases electrons at the anode; they travel through the wire to the cathode.","_n":"5ec3","_k":"77d4a4a3"},{"t":"through the wire, from the cathode to the anode","why":"Check the direction: electrons are released at the anode, so they leave from there.","_n":"6ed3","_k":"a8bdb8ac"},{"t":"both ways equally","why":"The flow has a direction.","_n":"7e63","_k":"d65c3f17"}],"hints":["Where are electrons released?","At the anode.","Anode → cathode, through the wire."]},{"id":"w3","skill":"E°cell","goal":4,"prompt":"What is \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for a Cu–Ag cell?","options":[{"t":"1.14 V","why":"That adds the values. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is a difference: 0.80 − 0.34.","_n":"8e73","_k":"675160cd"},{"t":"−0.46 V","why":"Cathode and anode are swapped. Ag is the cathode: 0.80 − 0.34.","_n":"95ac","_k":"bd6844aa"},{"t":"1.26 V","why":"Coefficients don’t change \u003ci>E\u003c/i>°.","_n":"a59c","_k":"042d3cca"},{"t":"0.46 V","why":"0.80 − 0.34.","_n":"b58c","_k":"51b401df"}],"hints":["\u003ci>E\u003c/i>°\u003csub>cathode\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>anode\u003c/sub>.","Ag is the cathode.","0.80 − 0.34."]},{"id":"w4","skill":"E°cell","goal":4,"prompt":"A cell has \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = −0.30 V as written. What does that mean?","options":[{"t":"It won’t run spontaneously as written; the reverse would"," k":"f0e72f0e"},{"t":"Platinum is oxidized","_n":"xe2c","_k":"22bd2df8"},{"t":"The hydrogen half-cell has no solid metal, so Pt carries the electrons","_n":"ye1c","_k":"b23d631d"},{"t":"Platinum is the salt bridge","_n":"ze4c","_k":"1d666978"}],"explain":"Pt is inert: it provides a surface for H₂ → 2H⁺ + 2e⁻ without reacting."},{"id":"p4","prompt":"What is \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> for \u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Cu(s) | Cu²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Zn²⁺(aq) | Zn(s)\u003c/span>\u003c/span> \u003cstrong>as written\u003c/strong>?","options":[{"t":"+1.10 V","_n":"10e3c","_k":"669d443e"},{"t":"−1.10 V: it wouldn’t run this way","_n":"11dec","_k":"950212f5"},{"t":"0.00 V","_n":"12ddc","_k":"a1c61f5c"},{"t":"−0.42 V","_n":"13dcb","_k":"cb7a8b99"}],"explain":"Notation fixes which side is the anode. If the numbers say otherwise, the cell as written isn’t spontaneous."}],"chalIntro":"Use \u003cstrong>Write it\u003c/strong> mode for every challenge, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 needs both notation slots. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Write it: build the notation for a nickel–silver cell.","why":"Ni (−0.26 V) is lower, so it’s the anode on the left; Ag⁺/Ag (+0.80 V) is the cathode on the right: \u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Ni(s) | Ni²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Ag⁺(aq) | Ag(s)\u003c/span>\u003c/span>.","general":"Build the notation with tiles in \u003cstrong>Write it\u003c/strong> mode: anode half-cell, ||, then the cathode half-cell.","hints":["Which is the anode: Ni (−0.26 V) or Ag (+0.80 V)?","Ni on the left.","\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Ni(s) | Ni²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Ag⁺(aq) | Ag(s)\u003c/span>\u003c/span>."]},{"id":"tc2","goal":[3,4],"prompt":"Write it: a cell of copper with the Fe³⁺/Fe²⁺ couple. Then enter \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub>.","why":"Copper (+0.34 V) is the anode; the iron ions share one solution and Pt is the electrode: \u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Cu(s) | Cu²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Fe³⁺(aq), Fe²⁺(aq) | Pt(s)\u003c/span>\u003c/span>. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = 0.77 − 0.34 = 0.43 V.","general":"Build the copper–iron cell with tiles, then type \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> in the box under the tiles.","hints":["Cu has the lower \u003ci>E\u003c/i>°: anode.","The iron ions share one solution; Pt is the electrode.","… || Fe³⁺(aq), Fe²⁺(aq) | Pt(s); 0.43 V."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Write \u003cstrong>two\u003c/strong> different spontaneous cells that include the hydrogen electrode and have \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> between 0.70 V and 1.00 V: one with hydrogen as the \u003cstrong>anode\u003c/strong> and one with hydrogen as the \u003cstrong>cathode\u003c/strong>. Use slots 1 and 2.","why":"Hydrogen is 0.00 V, so \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is the other half-cell’s \u003ci>E\u003c/i>° (or its negative). As the anode, hydrogen pairs with Ag⁺/Ag (0.80 V) or Fe³⁺/Fe²⁺ (0.77 V); as the cathode, with zinc (0.76 V).","general":"Write one cell in slot 1 and the other in slot 2, both with the hydrogen electrode.","hints":["Hydrogen is 0.00 V, so \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is just the other half-cell’s \u003ci>E\u003c/i>° (or its negative).","As the anode, pair it with \u003ci>E\u003c/i>° from +0.70 to +1.00 V; as the cathode, with \u003ci>E\u003c/i>° from −0.70 to −1.00 V.","Ag⁺/Ag (+0.80) or Fe³⁺/Fe²⁺ (+0.77) on the right; Zn (−0.76) on the left."]}]},"part3":{"slug":"batteries","name":"Batteries","heading":"Batteries and fuel cells","intro":"Batteries and fuel cells are galvanic cells built for use. Compare three devices, sort how each one keeps going, then judge whether a fuel cell suits a remote Arctic station.","s1":{"title":"Station 1: Three devices, one idea","intro":"Each device has an anode, where something is oxidized, and a cathode, where something is reduced. Open \u003cstrong>Zoom to the particles\u003c/strong> on any card."},"cards":[{"id":"alk","name":"Alkaline cell","an":"Zinc is oxidized.","ca":"Manganese dioxide is reduced.","sum":"It runs until its reactants are used up.","zoom":"Zinc atoms at the anode give up electrons and become zinc ions. The electrons travel through the device to the cathode, where manganese dioxide takes them. When the zinc is used up, the cell is flat."},{"id":"li","name":"Lithium-ion cell (concept)","an":"Lithium is oxidized to Li⁺ in the anode material.","ca":"Li⁺ ions are taken up by the cathode material.","sum":"Lithium ions move between the two electrodes through the electrolyte while electrons go through the device. Charging pushes them back with outside energy.","zoom":"While it runs, Li⁺ ions drift through the electrolyte from the anode to the cathode, and electrons take the outside path through your phone. A charger pushes both back, so the cell can be used again."},{"id":"fc","name":"Hydrogen fuel cell","an":"H₂ → 2H⁺ + 2e⁻","ca":"O₂ + 4H⁺ + 4e⁻ → 2H₂O","sum":"Simplified notation: \u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Pt(s) | H₂(g) | H⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">H⁺(aq) | O₂(g) | Pt(s)\u003c/span>\u003c/span>. \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = 1.23 − 0.00 = 1.23 V. The only product is water.","zoom":"Hydrogen molecules split on the platinum anode into H⁺ ions and electrons. The H⁺ ions cross the electrolyte; the electrons go through the circuit. At the cathode, oxygen, H⁺ and electrons make water. Fuel keeps flowing in, so the cell keeps working."}],"s2":{"title":"Station 2: Refuel or recharge?","intro":"Tap a statement, then tap the device it describes.","items":[{"id":"s2a","t":"Keeps running while fuel is supplied","card":"fc"},{"id":"s2b","t":"Recharged by an outside power source","card":"li"},{"id":"s2c","t":"Used once, then recycled","card":"alk"}],"fb":{"fc":"A fuel cell is supplied with its reactants as it runs.","li":"Charging uses outside energy to drive the reaction in reverse.","alk":"An alkaline cell stops when its stored reactants are used up."},"done":"All three sorted. A battery stores its reactants; a fuel cell is supplied with them."},"s3":{"title":"Station 3: Is it viable?","scenario":"A remote research station in Nunavut needs reliable power through the winter.","intro":"Choose evidence for and against a hydrogen fuel cell, then build a one-sentence judgement.","pros":[{"id":"p1","t":"steady output while fuel lasts"},{"id":"p2","t":"no combustion at the site"},{"id":"p3","t":"water as the only local product"}],"cons":[{"id":"c1","t":"hydrogen must be made and shipped"},{"id":"c2","t":"storage at low temperatures"},{"id":"c3","t":"cost of platinum catalysts"}],"verdicts":[{"id":"good","t":"is a good choice"},{"id":"maybe","t":"could be a good choice"},{"id":"poor","t":"is a poor choice"}],"good":"That’s a balanced judgement: one point for, one against, and a decision.","need":"Choose a verdict, one point for and one point against.","note":"Canadian companies, such as Ballard Power Systems in British Columbia, design fuel cells for buses and backup power.","data":"\u003cp>For the hydrogen–oxygen fuel cell, \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> = \u003ci>E\u003c/i>°\u003csub>right\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>left\u003c/sub> = 1.23 − 0.00 = 1.23 V. Writing 2H₂ + O₂ → 2H₂O doesn’t change it: coefficients never change \u003ci>E\u003c/i>°.\u003c/p>\u003cp>One cell gives only about 1.2 V, so real fuel cells are \u003cstrong>stacked in series\u003c/strong>: their voltages add. Ten cells give about 12 V.\u003c/p>"},"quickCheck":{"title":"Quick check","summary":"Batteries quick check","items":[{"id":"q1","goal":6,"prompt":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> of the hydrogen–oxygen fuel cell?","choices":[{"t":"1.23 V","fb":"Right. 1.23 − 0.00 = 1.23 V.","_n":"14ddb","_k":"7f7ba1fe"},{"t":"−1.23 V","fb":"1.23 − 0.00; writing 2H₂ doesn’t double it.","_n":"15deb","_k":"4fab2081"},{"t":"2.46 V","fb":"1.23 − 0.00; writing 2H₂ doesn’t double it.","_n":"16dfb","_k":"bc1c31c1"},{"t":"0.00 V","fb":"1.23 − 0.00; writing 2H₂ doesn’t double it.","_n":"17e0b","_k":"10078aed"}]},{"id":"q2","goal":6,"prompt":"Which gas is oxidized in a hydrogen fuel cell?","choices":[{"t":"H₂","fb":"Right. H₂ → 2H⁺ + 2e⁻ at the anode.","_n":"18e1b","_k":"b2bfe638"},{"t":"O₂","fb":"H₂ → 2H⁺ + 2e⁻ at the anode.","_n":"19e2b","_k":"7437ed75"},{"t":"Both","fb":"H₂ → 2H⁺ + 2e⁻ at the anode.","_n":"1ae3b","_k":"a308ae98"},{"t":"H₂O vapour","fb":"H₂ → 2H⁺ + 2e⁻ at the anode.","_n":"1bd4b","_k":"3d071ee7"}]},{"id":"q3","goal":6,"prompt":"Why can a fuel cell run for weeks while a battery can’t?","choices":[{"t":"Its \u003ci>E\u003c/i>° grows over time","fb":"A battery stops when its stored reactants are used up.","_n":"1cd5b","_k":"e2aff8ef"},{"t":"It has no anode","fb":"A battery stops when its stored reactants are used up.","_n":"1de2b","_k":"7b3632f0"},{"t":"It needs no electrolyte","fb":"A battery stops when its stored reactants are used up.","_n":"1ee1b","_k":"b945ea56"},{"t":"Its reactants are supplied continuously","fb":"Right. A battery stops when its stored reactants are used up.","_n":"1fe0b","_k":"eb9f3177"}]},{"id":"q4","goal":6,"prompt":"A fuel-cell stack gives 12 V. Why stack cells?","choices":[{"t":"Single cells are unsafe","fb":"Voltages of cells in series add.","_n":"1gdfb","_k":"77625244"},{"t":"Stacking makes hydrogen","fb":"Voltages of cells in series add.","_n":"1he6b","_k":"128493f8"},{"t":"Each cell gives only about 1.2 V, so cells in series add up","fb":"Right. Voltages of cells in series add.","_n":"1ie5b","_k":"6ef936d9"},{"t":"Stacking raises \u003ci>E\u003c/i>° of each cell","fb":"Voltages of cells in series add.","_n":"1je4b","_k":"fbb43ae4"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Notation ↔ cell","summary":"Notation ↔ cell","goal":[1,2,3],"instruction":"Match each notation to the cell it describes.","leftTitle":"Notation","rightTitle":"Cell","left":[{"id":"l1","t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Zn(s) | Zn²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Cu²⁺(aq) | Cu(s)\u003c/span>\u003c/span>","why":"Read left to right: zinc on the left is the anode; copper on the right is the cathode."},{"id":"l2","t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Cu(s) | Cu²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Ag⁺(aq) | Ag(s)\u003c/span>\u003c/span>","why":"Read left to right: copper on the left is the anode; silver on the right is the cathode."},{"id":"l3","t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Pt(s) | H₂(g) | H⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Cu²⁺(aq) | Cu(s)\u003c/span>\u003c/span>","why":"Read left to right: the hydrogen half-cell, with its Pt, is on the left: the anode."},{"id":"l4","t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Fe(s) | Fe²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">H⁺(aq) | H₂(g) | Pt(s)\u003c/span>\u003c/span>","why":"Read left to right: iron is on the left; the hydrogen half-cell, with Pt at the right end, is the cathode.","hints":["Which side has Pt?","The right side: the hydrogen half-cell is the cathode.","Iron anode, hydrogen cathode."]},{"id":"l5","t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Zn(s) | Zn²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Fe³⁺(aq), Fe²⁺(aq) | Pt(s)\u003c/span>\u003c/span>","why":"Read e outer ends.","_n":"3pe64","_k":"aad9bebc"}]},"b":{"prompt":"Which notation describes a cell with a zinc anode and a hydrogen cathode?","options":[{"t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Zn(s) | Zn²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">H⁺(aq), H₂(g) | Pt(s)\u003c/span>\u003c/span>","why":"A gas and a dissolved ion are different phases.","_n":"3qe74","_k":"0cc6e0b0"},{"t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Pt(s) | H₂(g) | H⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">Zn²⁺(aq) | Zn(s)\u003c/span>\u003c/span>","why":"Anode on the \u003cstrong>left\u003c/strong>, cathode on the right: read it like the electron path, left to right.","_n":"3re84","_k":"a3f31bf4"},{"t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Zn(s) | Zn²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">H⁺(aq) | H₂(g) | Pt(s)\u003c/span>\u003c/span>","why":"Zinc on the left; the hydrogen half-cell on the right, with Pt at the outer end.","_n":"3se94","_k":"74ba639b"},{"t":"\u003cspan class=\"cn-n\">\u003cspan class=\"cn-h\">Zn(s) | Zn²⁺(aq)\u003c/span> \u003cspan class=\"cn-dl\">||\u003c/span> \u003cspan class=\"cn-h\">H⁺(aq) | H₂(g)\u003c/span>\u003c/span>","why":"The cathode needs an electrode. No metal in the half-reaction? Add Pt at the outer end.","_n":"3te24","_k":"9e9c5774"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Why are H₂ and H⁺ separated by | in one cell, while Fe³⁺ and Fe²⁺ are separated by a comma in another?","options":[{"t":"“Hydrogen is lighter than iron.”","why":"Mass isn’t the rule.","_n":"3ue34","_k":"b0ab1dc0"},{"t":"“H₂ is a gas and H⁺ is dissolved, so they’re in different phases; Fe³⁺ and Fe²⁺ are both in the same solution.”","why":"Same phase → comma. Different phases → |.","_n":"3v644","_k":"79fb3842"},{"t":"“It’s a matter of style.”","why":"The symbols have fixed meanings.","_n":"3w634","_k":"98aa3557"}, tation correct"],"tips":["The cathode must be higher in the table than the anode.","Pair one metal half-cell with one Pt half-cell.","The hydrogen electrode is 0.00 V, so \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is the metal’s \u003ci>E\u003c/i>° or its negative.","Pt goes at the outer end of the side it belongs to."],"explainPrompt":"Explain how you placed each half-cell and why your cell needs exactly one platinum electrode.","vocab":"Use anode, cathode, inert electrode, phase boundary and E°cell.","more":"There’s more than one answer. Can you find them all?","after3":"The hydrogen electrode can sit on either side. What matters is which half-cell is higher in the table.","afterAt":4},"cards":[["Cell notation order","anode | anode solution || cathode solution | cathode"],["|","A boundary between phases (solid | solution, gas | solution)."],["||","The salt bridge; exactly one per cell."],["Comma","Separates species in the \u003cstrong>same\u003c/strong> solution: Fe³⁺(aq), Fe²⁺(aq)."],["Inert electrode","Pt (or graphite) at the outer end when a half-cell has no metal of its own."],["\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> from notation","\u003ci>E\u003c/i>°\u003csub>right\u003c/sub> − \u003ci>E\u003c/i>°\u003csub>left\u003c/sub>."],["Negative \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub>","The cell as written isn’t spontaneous; swap the sides."],["Hydrogen electrode","Pt(s) | H₂(g) | H⁺(aq) as an anode; H⁺(aq) | H₂(g) | Pt(s) as a cathode."],["Overall reaction","Equalize electrons: Al | Al³⁺ || Cu²⁺ | Cu gives 2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu."],["Fuel cell","Galvanic cell fed continuously with fuel; H₂/O₂ gives 1.23 V and water."],["Battery vs fuel cell","A battery stores its reactants; a fuel cell is supplied with them."]]}};</script>
