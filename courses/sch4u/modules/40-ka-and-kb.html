.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}

.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}

he [H₃O⁺] formed.","1.0 × 10\u003csup>−3\u003c/sup>."]},{"id":"w3","skill":"pH and pOH","goal":2,"prompt":"Use log 6 = 0.78. What is the pH if [H₃O⁺] = 6.0 × 10\u003csup>−3\u003c/sup> mol/L?","options":[{"t":"0.78","why":"Don’t forget the power of 10.","_n":"844b","_k":"8e1ad891"},{"t":"2.22","why":"3 − 0.78.","_n":"9e85","_k":"d0708a9d"},{"t":"3.78","why":"Subtract the log of the mantissa: −log(6 × 10\u003csup>−3\u003c/sup>) = 3 − 0.78.","_n":"ae95","_k":"a3dc5f2f"},{"t":"11.78","why":"That’s 14 − 2.22; this is an acid.","_n":"bea5","_k":"6f406bec"}],"hints":["−log(6.0 × 10\u003csup>−3\u003c/sup>) = 3 − log 6.","log 6 = 0.78.","2.22."]},{"id":"w4","skill":"pH and pOH","goal":2,"prompt":"A base solution has [OH⁻] = 1.8 × 10\u003csup>−3\u003c/sup> mol/L, so pOH = 2.74. What is its pH?","options":[{"t":"2.74","why":"That’s the pOH. −log[OH⁻] is pOH. pH = 14.00 − pOH.","_n":"ceb5","_k":"d3f389fe"},{"t":"7.00","why":"Bases have pH above 7, but not exactly 7.","_n":"dec5","_k":"3999b344"},{"t":"11.26","why":"14.00 − 2.74.","_n":"eed5","_k":"79f8f035"},{"t":"16.74","why":"Subtract from 14.00, don’t add.","_n":"fee5","_k":"26aa8654"}],"hints":["pH + pOH = ?","14.00.","11.26."]},{"id":"w5","skill":"Square roots by hand","goal":2,"prompt":"What is √(3.24 × 10\u003csup>−6\u003c/sup>)?","options":[{"t":"5.7 × 10\u003csup>−4\u003c/sup>","why":"That would be √(3.24 × 10\u003csup>−7\u003c/sup>).","_n":"gef5","_k":"05102fce"},{"t":"1.8 × 10\u003csup>−3\u003c/sup>","why":"1.8² = 3.24 and √10\u003csup>−6\u003c/sup> = 10\u003csup>−3\u003c/sup>.","_n":"he05","_k":"624cd4b8"},{"t":"3.24 × 10\u003csup>−3\u003c/sup>","why":"Take the root of the mantissa.","_n":"ie15","_k":"ec6088af"},{"t":"1.8 × 10\u003csup>−6\u003c/sup>","why":"Halve the exponent too.","_n":"j5a5","_k":"65bcba44"}],"hints":["Root the mantissa and the power separately.","√3.24 = 1.8; √10\u003csup>−6\u003c/sup> = 10\u003csup>−3\u003c/sup>.","1.8 × 10\u003csup>−3\u003c/sup>."]},{"id":"w6","skill":"Square roots by hand","go /L","_n":"p605","_k":"5cd8f65e"},{"t":"3.2 × 10\u003csup>−6\u003c/sup> mol/L","_n":"q5f5","_k":"c2689ad0"},{"t":"1.8 × 10\u003csup>−5\u003c/sup> mol/L","_n":"r625","_k":"90296afe"}],"explain":"\u003ci>x\u003c/i>² = 1.8 × 10\u003csup>−5\u003c/sup> × 0.18 = 3.24 × 10\u003csup>−6\u003c/sup>, so \u003ci>x\u003c/i> = 1.8 × 10\u003csup>−3\u003c/sup>. 0.18 treats it as strong (M1); 3.2 × 10\u003csup>−6\u003c/sup> forgets the root (M2); 1.8 × 10\u003csup>−5\u003c/sup> is \u003ci>K\u003c/i>\u003csub>a\u003c/sub> itself."},{"id":"p2","prompt":"Percent ionization mode: ethanoic acid is diluted from 0.18 to 0.0018 mol/L (the ÷100 button). Percent ionization will…","options":[{"t":"Stay at 1.0%","_n":"s615","_k":"997f7b6c"},{"t":"Reach 100%","_n":"t745","_k":"52021161"},{"t":"Fall to 0.01%","_n":"u755","_k":"fa17a8e9"},{"t":"Rise to about 10%","_n":"v725","_k":"c8778a4e"}],"explain":"Dilution favours the side with more dissolved particles, so a larger fraction ionizes, even though [H₃O⁺] falls. (M7)"},{"id":"p3","prompt":"pH from \u003ci>K\u003c/i>: hydrofluoric acid, 0.10 mol/L, shortcut on. Does the 5% check pass?","options":[{"t":"Yes","_n":"w735","_k":"994bf239"},{"t":"Only for bases","_n":"x705","_k":"e6a87801"},{"t":"No","_n":"y715","_k":"bef6d446"},{"t":"The check doesn’t apply to HF","_n":"z6e5","_k":"a0502e39"}],"explain":"HF’s \u003ci>K\u003c/i>\u003csub>a\u003c/sub> is large compared with 0.10 × 0.05, so \u003ci>x\u003c/i> isn’t tiny. Solve the quadratic. (M3)"},{"id":"p4","prompt":"Conjugate pairs: ethanoic acid. What is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> for the ethanoate ion, CH₃COO⁻?","options":[{"t":"5.6 × 10\u003csup>4\u003c/sup>","_n":"106f5","_k":"0b5a4f59"},{"t":"1.8 × 10\u003csup>−5\u003c/sup>","_n":"116c5","_k":"0cd4ec11"},{"t":"5.6 × 10\u003csup>−10\u003c/sup>","_n":"126d5","_k":"06f5c9b6"},{"t":"1.8 × 10\u003csup>−19\u003c/sup>","_n":"13e66","_k":"e4aa823a"}],"explain":"\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.0 × 10\u003csup>−14\u003c/sup> ÷ 1.8 × 10\u003csup>−5\u003c/sup>. 5.6 × 10\u003csup>4\u003c/sup> is 1 ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> (M5)."}],"chalIntro":"Use the ionizer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"pH from \u003ci>K\u003c/i>, methanoic acid, shortcut on: choose the concentration that gives pH 2.22.","why":"At 0.20 mol/L, \u003ci>x\u003c/i> = √(1.8 × 10\u003csup>−4\u003c/sup> × 0.20) = 6.0 × 10\u003csup>−3\u003c/sup>, pH 2.22, and the 5% check passes at 3.0%.","general":"Not pH 2.22 yet. Use \u003cstrong>pH from \u003ci>K\u003c/i>\u003c/strong> mode with methanoic acid and the shortcut on, then try another concentration.","hints":["pH 2.22 means [H₃O⁺] = 6.0 × 10\u003csup>−3\u003c/sup> (log 6 = 0.78).","\u003ci>c\u003c/i> ≈ \u003ci>x\u003c/i>² ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 3.6 × 10\u003csup>−5\u003c/sup> ÷ 1.8 × 10\u003csup>−4\u003c/sup>.","\u003ci>c\u003c/i> = 0.20 mol/L."]},{"id":"tc2","goal":3,"prompt":"\u003ci>K\u003c/i> from pH mode: a 0.10 mol/L solution of model acid HX has pH 3.00. Enter \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","why":"\u003ci>x\u003c/i> = 1.0 × 10\u003csup>−3\u003c/sup>, so \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = (1.0 × 10\u003csup>−3\u003c/sup>)² ÷ 0.099 ≈ 1.0 × 10\u003csup>−5\u003c/sup>.","general":"In \u003cstrong>\u003ci>K\u003c/i> from pH\u003c/strong> mode, choose model acid HX at 0.10 mol/L, enter the measured pH 3.00, then enter your \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","hints":["pH 3.00 gives \u003ci>x\u003c/i> = 1.0 × 10\u003csup>−3\u003c/sup>.","\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = \u003ci>x\u003c/i>² ÷ (0.10 − \u003ci>x\u003c/i>).","1.0 × 10\u003csup>−6\u003c/sup> ÷ 0.099 ≈ 1.0 × 10\u003csup>−5\u003c/sup>."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Conjugate pairs mode: find the acid whose conjugate base has \u003ci>K\u003c/i>\u003csub>b\u003c/sub> closest to 5.6 × 10\u003csup>−10\u003c/sup>, without opening each acid first. Choose your prediction, then check.","why":"Ethanoic acid: \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(CH₃COO⁻) = 1.0 × 10\u003csup>−14\u003c/sup> ÷ 1.8 × 10\u003csup>−5\u003c/sup> = 5.6 × 10\u003csup>−10\u003c/sup>. The readout confirms it when you show ethanoic acid’s conjugate.","general":"In \u003cstrong>Conjugate pairs\u003c/strong> mode, choose your prediction before you show any conjugate’s \u003ci>K\u003c/i>.","hints":["\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>, so you need \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","1.0 × 10\u003csup>−14\u003c/sup> ÷ 5.6 × 10\u003csup>−10\u003c/sup> = 1.8 × 10\u003csup>−5\u003c/sup>.","Ethanoic acid has \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.8 × 10\u003csup>−5\u003c/sup>."]}]},"part3":{"slug":"ranking","name":"Ranking","heading":"Ranking acids","intro":"Use the course \u003ci>K\u003c/i>\u003csub>a\u003c/sub> table as data: rank six acids, find how strong their conjugate bases are, and predict the pH order of their solutions.","s1":{"title":"Station 1: Sort the acids","intro":"Put the six acids in order of strength, strongest first, using their \u003ci>K\u003c/i>\u003csub>a\u003c/sub> values. Tap an acid, then use Move up and Move down.","ok":"Strongest to weakest: HF > methanoic > benzoic > ethanoic > hypochlorous > NH₄⁺. Compare the powers of 10 first, then the numbers in front.","bad":"Larger \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = stronger acid. Compare the powers of 10 first, then the numbers in front."},"s2":{"title":"Station 2: The conjugate ladder","intro":"For each acid, the panel computes \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> for its conjugate base. Tap an acid to see the calculation.","cap":"The ladder flips: strongest acid, weakest base."},"s3":{"title":"Station 3: Predict the pH order","intro":"Rank 0.10 mol/L solutions of the six acids by pH, lowest pH first.","ok":"Lowest to highest pH: HF, methanoic, benzoic, ethanoic, hypochlorous, NH₄⁺. The larger the \u003ci>K\u003c/i>\u003csub>a\u003c/sub>, the more H₃O⁺ and the lower the pH.","bad":"Larger \u003ci>K\u003c/i>\u003csub>a\u003c/sub> means more H₃O⁺, so a lower pH. Open \u003cstrong>Check it with data\u003c/strong> to compare."},"blocks":[{"title":"Station 4: Weak doesn’t mean safe","html":"\u003cp>Hydrofluoric acid is weak, yet it’s one of the most hazardous acids in a lab, because the un-ionized HF passes through skin. Strength (\u003ci>K\u003c/i>\u003csub>a\u003c/sub>) and hazard are different questions; always read the safety data.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Ranking quick check","items":[{"id":"q1","goal":5,"prompt":"Which 0.10 mol/L acid has the highest pH?","choices":[{"t":"HF","fb":"Smallest \u003ci>K\u003c/i>\u003csub>a\u003c/sub>: the least H₃O⁺. (M6)","_n":"14e56","_k":"473cdfd6"},{"t":"methanoic","fb":"Smallest \u003ci>K\u003c/i>\u003csub>a\u003c/sub>: the least H₃O⁺. (M6)","_n":"15e46","_k":"519d5bda"},{"t":"ethanoic","fb":"Smallest \u003ci>K\u003c/i>\u003csub>a\u003c/sub>: the least H₃O⁺. (M6)","_n":"16e36","_k":"2a9a2cbe"},{"t":"HOCl","fb":"Right. Smallest \u003ci>K\u003c/i>\u003csub>a\u003c/sub>: the least H₃O⁺.","_n":"17e26","_k":"a49a5ae5"}]},{"id":"q2","goal":5,"prompt":"Which conjugate base is strongest?","choices":[{"t":"CH₃COO⁻","fb":"The weakest acid has the strongest conjugate base.","_n":"18e16","_k":"d6174216"},{"t":"OCl⁻","fb":"Right. The weakest acid has the strongest conjugate base.","_n":"19e06","_k":"f27548e5"},{"t":"F⁻","fb":"The weakest acid has the strongest conjugate base.","_n":"1adf6","_k":"253ce393"},{"t":"HCOO⁻","fb":"The weakest acid has the strongest conjugate base.","_n":"1bee6","_k":"6542db8c"}]},{"id":"q3","goal":5,"prompt":"\u003ci>K\u003c/i>\u003csub>b\u003c/sub> of F⁻?","choices":[{"t":"6.6 × 10\u003csup>−4\u003c/sup>","fb":"\u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>. (M5)","_n":"1ced6","_k":"3087bf48"},{"t":"1.5 × 10\u003csup>3\u003c/sup>","fb":"\u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>. (M5)","_n":"1d606","_k":"852bb8a2"},{"t":"1.5 × 10\u003csup>−11\u003c/sup>","fb":"Right. \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.0 × 10\u003csup>−14\u003c/sup> ÷ 6.6 × 10\u003csup>−4\u003c/sup>.","_n":"1e616","_k":"5f21eaa1"},{"t":"6.6 × 10\u003csup>−18\u003c/sup>","fb":"\u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>. (M5)","_n":"1f626","_k":"01f4e6c2"}]},{"id":"q4","goal":5,"prompt":"HF is a weak acid. Is it therefore safe to handle?","choices":[{"t":"No: it’s a strong acid","fb":"Weak ≠ harmless. HF is a weak acid, and it’s still hazardous.","_n":"1g636","_k":"04cc032e"},{"t":"Yes, if it’s dilute","fb":"Weak ≠ harmless.","_n":"1h5c6","_k":"c9c20ae4"},{"t":"Yes: weak acids are safe","fb":"Weak ≠ harmless.","_n":"1i5d6","_k":"5eaea1ee"},{"t":"No: strength and hazard are different","fb":"Right. Weak ≠ harmless.","_n":"1j5e6","_k":"7c74ef77"}]}]}},"practice":{"activities":[{"id":"expr","type":"match","title":"Write the expression","summary":"Write the expression","goal":1,"instruction":"Match each species in water to its \u003ci>K\u003c/i>\u003csub>a\u003c/sub> or \u003ci>K\u003c/i>\u003csub>b\u003c/sub> expression. (Water is the solvent: it’s left out.)","leftTitle":"Species in water","rightTitle":"Expression","left":[{"id":"l1","t":"HF","why":"HF gives H₃O⁺ and F⁻."},{"id":"l2","t":"HOCl","why":"HOCl gives H₃O⁺ and OCl⁻."},{"id":"l3","t":"HCOOH","why":"Methanoic acid gives H₃O⁺ and methanoate, HCOO⁻."},{"id":"l4","t":"NH₄⁺","why":"NH₄⁺ is an acid: it gives H₃O⁺ and it csub>a\u003c/sub> = (1.0 × 10\u003csup>−3\u003c/sup>)² ÷ (0.050 − 0.001) ≈ 2.0 × 10\u003csup>−5\u003c/sup>.","hints":["\u003ci>x\u003c/i> = 1.0 × 10\u003csup>−3\u003c/sup>.","\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = (1.0 × 10\u003csup>−3\u003c/sup>)² ÷ (0.050 − 0.001).","≈ 2.0 × 10\u003csup>−5\u003c/sup>."],"inv":{"prompt":"\u003cstrong>Investigation:\u003c/strong> In a real version, which measurement limits the accuracy of \u003ci>K\u003c/i>\u003csub>a\u003c/sub> most?","options":[{"t":"The colour of the solution","why":"An error of 0.05 in pH changes \u003ci>x\u003c/i> by about 12%, and \u003ci>K\u003c/i>\u003csub>a\u003c/sub> by about 25%, because \u003ci>x\u003c/i> is squared.","_n":"1k5f6","_k":"ec4784d2"},{"t":"The pH reading","why":"An error of 0.05 in pH changes \u003ci>x\u003c/i> by about 12%, and \u003ci>K\u003c/i>\u003csub>a\u003c/sub> by about 25%, because \u003ci>x\u003c/i> is squared.","_n":"1l686","_k":"aa293dc5"},{"t":"The time of day","why":"An error of 0.05 in pH changes \u003ci>x\u003c/i> by about 12%, and \u003ci>K\u003c/i>\u003csub>a\u003c/sub> by about 25%, because \u003ci>x\u003c/i> is squared.","_n":"1m696","_k":"2c01221e"},{"t":"The beaker’s size","why":"An error of 0.05 in pH changes \u003ci>x\u003c/i> by about 12%, and \u003ci>K\u003c/i>\u003csub>a\u003c/sub> by about 25%, because \u003ci>x\u003c/i> is squared.","_n":"1nf26","_k":"9f20d29a"}]}},{"id":"a5","kind":"num","star":true,"goal":4,"prompt":"Percent ionization of 0.20 mol/L methanoic acid (use the shortcut and check it)","_a":"VQ==","tol":[0.05,0],"unit":"%","label":"Percent ionization:","display":"3.0% (check passes)","exactNote":"2.96% is the exact (quadratic) value; the shortcut gives 3.0%. Both are accepted.","wrong":[{"match":0.03,"fb":"Multiply by 100."}],"fb":"Percent ionization = \u003ci>x\u003c/i> ÷ \u003ci>c\u003c/i> × 100%.","why":"\u003ci>x\u003c/i> = √(1.8 × 10\u003csup>−4\u003c/sup> × 0.20) = 6.0 × 10\u003csup>−3\u003c/sup>; 6.0 × 10\u003csup>−3\u003c/sup> ÷ 0.20 × 1
