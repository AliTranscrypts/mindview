.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}

n>\u003cspan class=\"bf-eqsub\">\u003cspan class=\"bf-a\">A⁻\u003c/span> mops up \u003cspan class=\"bf-h\">H₃O⁺\u003c/span> · \u003cspan class=\"bf-ha\">HA\u003c/span> mops up \u003cspan class=\"bf-oh\">OH⁻\u003c/span>\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"p H equals p K a plus log of the concentration of A minus divided by the concentration of H A. A minus mops up H 3 O plus; H A mops up O H minus.","headline":"A buffer takes the hit so the pH doesn’t.","text":"A \u003cstrong>buffer\u003c/strong> holds a \u003cstrong>weak acid\u003c/strong> and its \u003cstrong>conjugate base\u003c/strong> side by side. Add strong acid and the base uses it up; add strong base and the acid uses it up. The pH barely moves, until the buffer runs out. That limit is its \u003cstrong>capacity\u003c/strong>.","fig":{"html":"\u003cdiv class=\"bf-hx\">\u003cdiv id=\"bf-hx-svg\">\u003c/div>\u003cdiv class=\"bf-hx-row\">\u003cp class=\"bf-hx-cap\" id=\"bf-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"bf-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can identify a buffer as a weak acid with its conjugate base, or a weak base with its conjugate acid.","I can explain, with equations, how a buffer uses up added acid or base.","I can calculate a buffer’s pH from the amounts of its two components.","I can calculate the pH after a strong acid or base is added, and choose an acid–base pair for a target pH.","I can explain buffer capacity, and what happens when a buffer is diluted or overwhelmed.","I can explain how buffers work in blood, medicines and the ocean."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Conjugate pairs","goal":1,"prompt":"Which is a weak acid with its conjugate base?","options":[{"t":"NH₄⁺ and NH₂⁻","why":"These differ by two H⁺; NH₄⁺’s conjugate base is NH₃.","_n":"093d","_k":"5c952b87"},{"t":"CH₃COOH and CH₃COO⁻","why":"Ethanoic acid is weak; ethanoate is its conjugate base.","_n":"196d","_k":"2c9fe114"},{"t":"H₂O and H₃O⁺","why":"H₃O⁺ is water’s conjugate \u003cstrong>acid\u003c/strong>.","_n":"295d","_k":"3f88af27"},{"t":"HCl and Cl⁻","why":"HCl is strong; Cl⁻ is too weak a base to matter.","_n":"398d","_k":"266246d7"}],"hints":["Conjugates differ by one H⁺.","The acid must be weak.","CH₃COOH / CH₃COO⁻."]},{"id":"w2","skill":"Logs","goal":3,"prompt":"Using log 2 = 0.30, find log(1/2).","options":[{"t":"−0.70","why":"log 5 = 0.70; here it’s 1/2.","_n":"497d","_k":"29993637"},{"t":"−0.30","why":"log(1/\u003ci>a\u003c/i>) = −log \u003ci>a\u003c/i>.","_n":"59ad","_k":"d31eb74f"},{"t":"0.15","why":"That halves the log. log(1/\u003ci>a\u003c/i>) = −log \u003ci>a\u003c/i>.","_n":"699d","_k":"f69256a7"},{"t":"0.50","why":"That’s the fraction itself, not its log. log(1/\u003ci>a\u003c/i>) = −log \u003ci>a\u003c/i>.","_n":"79cd","_k":"0aac6758"}],"hints":["log(1/\u003ci>a\u003c/i>) = −log \u003ci>a\u003c/i>.","−log 2.","−0.30."]},{"id":"w3","skill":"Logs","goal":6,"prompt":"Using log 2 = 0.30, find log 20.","options":[{"t":"0.20","why":"That reads the digits. log 20 = log 2 + log 10.","_n":"89bd","_k":"c6056be6"},{"t":"0.60","why":"That’s log 4.","_n":"99a9","_k":"9fb92de7"},{"t":"1.30","why":"log 20 = log 2 + log 10.","_n":"a9b9","_k":"9f56158f"},{"t":"2.00","why":"log 100 = 2.","_n":"b9c9","_k":"47737072"}],"hints":["20 = 2 × 10.","log 2 + log 10.","0.30 + 1 = 1.30."]},{"id":"w4","skill":"Reacting a strong acid or base with a weak species","goal":2,"prompt":"0.020 mol of HCl is added to a solution containing 0.10 mol of CH₃COO⁻. What remains after the reaction?","options":[{"t":"0.12 mol CH₃COO⁻","why":"Acid removes the base.","_n":"c9d9","_k":"ac3f2fd4"},{"t":"0.080 mol CH₃COO⁻ and 0.020 mol of newly formed CH₃COOH","why":"H₃O⁺ + CH₃COO⁻ → CH₃COOH + H₂O goes to completion.","_n":"d9e9","_k":"ff4dae41"},{"t":"0.020 mol CH₃COO⁻","why":"That subtracts the wrong way: 0.10 − 0.020 = 0.080 mol of base is left.","_n":"e9f9","_k":"d63103f4"},{"t":"0.10 mol CH₃COO⁻ and 0.020 mol H₃O⁺","why":"Strong acid reacts completely with a base.","_n":"fa09","_k":"dd491945"}],"hints":["Strong acid + conjugate base → weak acid.","Subtract 0.020 from the base; add 0.020 to the acid.","0.080 mol A⁻, 0.020 mol HA."]},{"id":"w5","skill":"Reacting a strong acid or base with a weak species","goal":2,"prompt":"0.050 mol of NaOH is added to 0.10 mol of CH₃COOH. What is present after the reaction?","options":[{"t":"0.050 mol CH₃COO⁻ only","why":"Half the acid is left.","_n":"ga19","_k":"8b004589"},{"t":"0.050 mol CH₃COOH and 0.050 mol CH₃COO⁻","why":"OH⁻ + CH₃COOH → CH₃COO⁻ + H₂O.","_n":"ha29","_k":"4a9259f2"},{"t":"0.15 mol CH₃COOH","why":"That adds the amounts. OH⁻ uses up the acid.","_n":"ia39","_k":"f94987c9"},{"t":"0.10 mol CH₃COOH and 0.050 mol OH⁻","why":"OH⁻ reacts completely with a weak acid.","_n":"j2c9","_k":"643c2453"}],"hints":["OH⁻ converts HA into A⁻.","0.10 − 0.050 HA; 0 + 0.050 A⁻.","Equal amounts: half-neutralized."]},{"id":"w6","skill":"Half-equivalence","goal":3,"prompt":"In module 43, what was the pH at the half-equivalence point of the ethanoic acid titration?","options":[{"t":"7.00","why":"Half-equivalence isn’t neutral.","_n":"k2b9","_k":"c481084f"},{"t":"8.85","why":"That’s equivalence.","_n":"l2e9","_k":"a6082013"},{"t":"2.74","why":"That’s the starting pH.","_n":"m2d9","_k":"3bf682cf"},{"t":"4.74, equal to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","why":"At half-equivalence, \u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻), so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"n309","_k":"a68f2f74"}],"hints":["At half-equivalence, \u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻).","log 1 = 0.","pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74."]}],"refreshers":{"Conjugate pairs":"A weak acid and its conjugate base differ by one H⁺. A strong acid’s conjugate base (Cl⁻, NO₃⁻) can’t act as a buffer base.","Logs":"log 2 = 0.30, log 3 = 0.48, log 5 = 0.70, log 10 = 1; log(1/\u003ci>a\u003c/i>) = −log \u003ci>a\u003c/i>; log(\u003ci>ab\u003c/i>) = log \u003ci>a\u003c/i> + log \u003ci>b\u003c/i>.","Reacting a strong acid or base with a weak species":"Strong acids and bases react completely. Do the moles first: subtract from what’s used, add to what’s made.","Half-equivalence":"Equal amounts of HA and A⁻ give pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>. That’s a buffer at its best."}}},"explore":{"heading":"Buffer challenge","intro":"Build a buffer, then attack it with strong acid or base. Compare it with pure water, and find out when it gives up.","how":"Choose a \u003cstrong>buffer pair\u003c/strong> and the amounts of its two forms (each in 1.00 L). Then add HCl or NaOH and watch both beakers. Changing the pair or the amounts starts again with nothing added. Switch views to see the \u003cstrong>particles\u003c/strong> or the \u003cstrong>calculation\u003c/strong>. Undo also works with Ctrl+Z.","predictions":[{"id":"p1","prompt":"Add 0.020 mol HCl to 1.00 L of pure water (pH 7.00). The new pH is:","options":[{"t":"1.70","_n":"o2f9","_k":"b4050df4"},{"t":"5.00","_n":"p329","_k":"740bef0f"},{"t":"6.98","_n":"q319","_k":"54dbb699"},{"t":"7.00","_n":"r249","_k":"9eb40bbc"}],"explain":"[H₃O⁺] = 0.020 mol/L, so pH = 2 − 0.30."},{"id":"p2","prompt":"Add the same 0.020 mol HCl to the buffer. The new pH is:","options":[{"t":"1.70","_n":"s239","_k":"b156ff1a"},{"t":"3.00","_n":"ta69","_k":"0a51d78d"},{"t":"4.82","_n":"ua79","_k":"cff0f256"},{"t":"5.00","_n":"va49","_k":"b9cdf859"}],"explain":"X⁻ drops to 0.080 and HX rises to 0.12: log(2/3) = −0.18. A buffer changes pH a little, not zero. The ratio shifts slightly."},{"id":"p3","prompt":"Dilute the buffer ten times. The pH becomes:","options":[{"t":"4.00","_n":"wa59","_k":"3a216455"},{"t":"7.00","_n":"xa29","_k":"7aa0f815"},{"t":"5.00 (unchanged)","_n":"ya39","_k":"4fec1586"},{"t":"6.00","_n":"za09","_k":"39c91b89"}],"explain":"Both amounts fall tenfold, so the ratio is unchanged. Diluting keeps the ratio, so the pH stays the same, but there’s less of each component to use up."},{"id":"p4","prompt":"Add 0.12 mol HCl in one go. The pH becomes about:","options":[{"t":"4.00","_n":"10a19","_k":"2766c71b"},{"t":"1.70 (capacity exceeded)","_n":"11ae9","_k":"ce4c6b39"},{"t":"4.82","_n":"12af9","_k":"b7e9dd6e"},{"t":"5.00","_n":"13389","_k":"b5ba68d7"}],"explain":"The first 0.10 mol is absorbed; the last 0.020 mol isn’t. Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply."}],"predIntro":"Each prediction uses the model acid HX (0.10 mol HX + 0.10 mol X⁻ in 1.00 L, p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 5.00) or pure water. Make a prediction first. Then the centrepiece will show you what really happens.","chalIntro":"Use the buffer builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Build a buffer at pH 4.74 using ethanoic acid and ethanoate.","why":"Equal amounts make log(ratio) = log 1 = 0, so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74. Any equal pair of amounts works.","general":"Check the pair and the ratio of the two amounts.","hints":["When does pH equal p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>?","When log(ratio) = 0.","Equal amounts of acid and base."]},{"id":"tc2","goal":4,"prompt":"Start with the HX buffer (0.10 mol each). Add HCl until the pH reads exactly 4.52.","why":"0.050 mol HCl turns 0.050 mol X⁻ into HX: X⁻ 0.050, HX 0.15, so pH = 5.00 + log(1/3) = 4.52.","hints":["4.52 − 5.00 = −0.48 = log(1/3).","So X⁻ : HX = 1 : 3, with 0.20 mol in total.","X⁻ = 0.050, HX = 0.15, so add 0.050 mol HCl."]},{"id":"tc3","goal":[4,5],"stretch":true,"prompt":"Design a buffer at pH 9.56 that can take a test dose of 0.15 mol HCl and still stay at pH 9.00 or above.","why":"0.20 mol NH₄⁺ + 0.40 mol NH₃ gives 9.26 + log 2 = 9.56. After the dose, (0.40 − 0.15) ÷ (0.20 + 0.15) = 0.71 and pH = 9.11: the right ratio \u003cstrong>and\u003c/strong> enough capacity.","hints":["9.56 − 9.26 = 0.30, so NH₃ : NH₄⁺ = 2 : 1.","After 0.15 mol HCl: NH₃ falls by 0.15 and NH₄⁺ rises by 0.15. For pH ≥ 9.00 you need log(ratio) ≥ −0.26, so a ratio ≥ 0.55.","Only 0.40 / 0.20 works: (0.40 − 0.15) ÷ (0.20 + 0.15) = 0.71, and pH = 9.26 − 0.15 = 9.11."]}],"blocks":[{"title":"What the builder shows","html":"\u003cp>The buffer’s pH follows the \u003cstrong>ratio\u003c/strong> of base form to acid form, so it shifts slowly. Water has nothing to use up added acid or base. And once one component of the buffer runs out, its pH falls off a cliff too.\u003c/p>"}]},"part3":{"slug":"blood","name":"In your body","heading":"Buffers in your body","intro":"The buffer equation and Le Chatelier’s principle (module 35) at work in blood, medicine and the ocean. Health contexts here are explanations with model values, not medical advice.","s1":{"title":"Station 1: Blood","intro":"Blood is buffered by carbonic acid and hydrogen carbonate:","eq":"CO2(aq) + H2O(l) \u003c=> H2CO3(aq) \u003c=> H+(aq) + HCO3-(aq)","text":"At body temperature the effective p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> is about 6.1 (course table addition, model value). Normal blood pH is 7.35–7.45. Move the slider to change the ratio [HCO₃⁻] : [H₂CO₃].","dataTitle":"Check it with data","data":"At pH 7.40, log([HCO₃⁻] ÷ [H₂CO₃]) = 7.40 − 6.1 = 1.30, so the ratio is 20 : 1 (log 20 = 1.30). Blood carries about twenty times as much hydrogen carbonate as carbonic acid."},"s2":{"title":"Station 2: Breathing and Le Chatelier","intro":"Choose how the person is breathing and watch the equilibrium respond.","states":{"normal":"Normal breathing: CO₂ is breathed out as fast as cells make it, so the equilibrium holds and the blood pH stays near 7.40.","fast":"Fast, deep breathing removes CO₂, which shifts the equilibrium \u003cstrong>left\u003c/strong>: H⁺ is used up, so H⁺ falls and the pH \u003cstrong>rises\u003c/strong>.","hold":"Holding your breath does the opposite: CO₂ builds up, the equilibrium shifts \u003cstrong>right\u003c/strong>, H⁺ rises and the pH \u003cstrong>falls\u003c/strong>."},"kidney":"The kidneys adjust HCO₃⁻ over hours to days (SBI4U 36: the kidneys and acid–base balance)."},"s3":{"title":"Station 3: Buffered medicine","intro":"Some pain-relief tablets add a weak base to buffer the acid near the tablet in the stomach, which can reduce irritation for some people. This station explains the chemistry only; it gives no dosing advice.","q":"Stomach acid (H₃O⁺) reaches the tablet. Which component of the buffer handles it?","choices":[{"t":"the weak base","fb":"Right. Bases use up H₃O⁺: A⁻ + H₃O⁺ → HA + H₂O.","_n":"14379","_k":"e5ce6a38"},{"t":"the weak acid","fb":"An acid doesn’t use up an acid. Bases use up H₃O⁺.","_n":"15369","_k":"ad26d07b"}]},"s4":{"title":"Station 4: The ocean as a buffer","intro":"Seawater’s carbonate system buffers against pH change. As more CO₂ dissolves, the equilibria shift and the pH falls slowly: surface ocean pH has dropped from about 8.2 to about 8.1 since pre-industrial times. Carbonate ions are used up, which makes shell-building harder.","eq":"CO2 + H2O + CO3^2- -> 2HCO3-","prompt":"Explain why a buffer slows, but can’t stop, the change.","model":"The carbonate ions use up the acid that dissolved CO₂ makes, so the pH falls only slowly. But each dose of CO₂ uses some carbonate up. A buffer’s capacity is finite: as its base component runs low, it absorbs less and less, and the pH keeps falling."},"quickCheck":{"title":"Quick check","summary":"In your body quick check","items":[{"id":"q1","goal":6,"prompt":"Blood at pH 7.40 has [HCO₃⁻] : [H₂CO₃] about…","choices":[{"t":"1 : 20","fb":"7.40 − 6.1 = 1.30 = log 20.","_n":"16359","_k":"1551c3d7"},{"t":"1 : 1","fb":"7.40 − 6.1 = 1.30 = log 20.","_n":"17349","_k":"021aa4cf"},{"t":"7.4 : 1","fb":"7.40 − 6.1 = 1.30 = log 20.","_n":"18339","_k":"9b92e76b"},{"t":"20 : 1","fb":"Right. 7.40 − 6.1 = 1.30 = log 20.","_n":"19329","_k":"8921eea8"}]},{"id":"q2","goal":6,"prompt":"Hyperventilating makes blood pH…","choices":[{"t":"stay exactly 7.40","fb":"Removing CO₂ shifts the equilibrium left, using up H⁺.","_n":"1a319","_k":"411d2de0"},{"t":"fall","fb":"Removing CO₂ shifts the equilibrium left, using up H⁺.","_n":"1b309","_k":"e9de9c1a"},{"t":"reach 6.1","fb":"Removing CO₂ shifts the equilibrium left, using up H⁺.","_n":"1c2f9","_k":"d65982fe"},{"t":"rise","fb":"Right. Removing CO₂ shifts the equilibrium left, using up H⁺.","_n":"1d329","_k":"b604f315"}]},{"id":"q3","goal":[2,6],"prompt":"In a buffered tablet, which part handles stomach acid?","choices":[{"t":"the coating","fb":"Bases use up H₃O⁺.","_n":"1e339","_k":"fdd6f5b2"},{"t":"water","fb":"Bases use up H₃O⁺.","_n":"1f349","_k":"2b49723a"},{"t":"the weak base","fb":"Right. Bases use up H₃O⁺.","_n":"1g359","_k":"764c71c5"},{"t":"the active drug","fb":"Bases use up H₃O⁺.","_n":"1h2e9","_k":"af5e26e2"}]},{"id":"q4","goal":[5,6],"prompt":"Why can’t the ocean’s buffer stop acidification forever?","choices":[{"t":"Buffers only work in labs","fb":"Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply. Capacity is finite.","_n":"1i2f9","_k":"f594d9b0"},{"t":"Its base component is gradually used up","fb":"Right. Capacity is finite.","_n":"1j309","_k":"51d5b675"},{"t":"Seawater has no buffer","fb":"Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply. Capacity is finite.","_n":"1k319","_k":"1af6d51a"},{"t":"CO₂ isn’t an acid","fb":"Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply. Capacity is finite.","_n":"1l2a9","_k":"de9dfdca"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Buffer or not?","summary":"Buffer or not?","goal":[1,2],"noun":"mixture","txt":true,"instruction":"Ten mixtures, each in 1.00 L. Sort each one: is it a buffer? Items marked ★ need a reaction first.","boxes":[{"id":"buf","label":"Buffer"},{"id":"not","label":"Not a buffer"}],"wrongDefault":"Is there a \u003cstrong>weak\u003c/strong> acid–base pair? For mixtures with a strong acid or base, react first, then look at what’s left.","items":[{"id":"i1","t":"CH₃COOH + CH₃COONa","_a":"QARHBxs=","why":"Weak acid + conjugate base.","hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Buffer: weak acid + conjugate base."]},{"id":"i2","t":"HCl + NaCl","_a":"QAhdFRs=","why":"Strong acid; Cl⁻ can’t take H⁺ back.","wrong":{"buf":"Cl⁻ is too weak a base to take H⁺ back. A buffer needs a \u003cstrong>weak\u003c/strong> acid and its conjugate base."},"hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Not a buffer: strong acid; Cl⁻ can’t take H⁺ back."]},{"id":"i3","t":"NH₃ + NH₄Cl","_a":"QARHBxs=","why":"Weak base + conjugate acid.","hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Buffer: weak base + conjugate acid."]},{"id":"i4","t":"HF + NaF","_a":"QARHBxs=","why":"Weak acid + conjugate base.","hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Buffer: weak acid + conjugate base."]},{"id":"i5","t":"NaOH + NaCl","_a":"QAhdFRs=","why":"Strong base; Na⁺ and Cl⁻ are spectators.","hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Not a buffer: strong base; Na⁺ and Cl⁻ are spectators."]},{"id":"i6","t":"HNO₃ + KNO₃","_a":"QAhdFRs=","why":"Strong acid.","wrong":{"buf":"HNO₃ is a strong acid. NO₃⁻ is too weak a base to take H⁺ back. A buffer needs a \u003cstrong>weak\u003c/strong> acid and its conjugate base."},"hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Not a buffer: strong acid."]},{"id":"i7","t":"H₂CO₃ + NaHCO₃","_a":"QARHBxs=","why":"The blood buffer pair.","hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Buffer: the blood buffer pair."]},{"id":"i8","t":"0.10 mol CH₃COOH + 0.10 mol NaOH ★","_a":"QAhdFRs=","why":"All the HA becomes A⁻: just a salt solution.","wrong":{"buf":"Count the moles after the reaction: is any HA left?"},"hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Not a buffer: all the HA becomes A⁻, just a salt solution."]},{"id":"i9","t":"0.20 mol CH₃COOH + 0.10 mol NaOH ★","_a":"QARHBxs=","why":"Half is converted: 0.10 mol HA + 0.10 mol A⁻.","wrong":{"not":"React first: 0.10 mol of the acid is left and 0.10 mol of A⁻ is made."},"hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Buffer: half is converted, 0.10 mol HA + 0.10 mol A⁻."]},{"id":"i10","t":"0.20 mol NH₃ + 0.10 mol HCl ★","_a":"QARHBxs=","why":"0.10 mol NH₃ + 0.10 mol NH₄⁺.","wrong":{"not":"React first: HCl turns 0.10 mol of NH₃ into NH₄⁺, and 0.10 mol of NH₃ is left."},"hints":["Is there a \u003cstrong>weak\u003c/strong> acid–base pair?","For mixtures with a strong acid or base, react first, then look at what’s left.","Buffer: 0.10 mol NH₃ + 0.10 mol NH₄⁺."]}]},{"id":"calc","type":"numeric","title":"Buffer calculations","summary":"Buffer calculations","goal":[3,4,5],"instruction":"Six calculations, each in 1.00 L. Items 4 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type a number (pH to 2 decimal places, amounts in mol), then press Check.","items":[{"id":"b1","goal":3,"prompt":"pH of 0.20 mol ethanoic acid + 0.10 mol ethanoate in 1.00 L","_a":"VkgGVQ==","tol":0.0009,"display":"pH 4.44","use":"Use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(ethanoic acid) = 4.74; log 2 = 0.30, log 3 = 0.48, log 5 = 0.70.","why":"pH = 4.74 + log(0.10 ÷ 0.20) = 4.74 − 0.30 = 4.44.","wrong":[{"match":5.04,"fb":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003cstrong>base\u003c/strong> ÷ \u003cstrong>acid\u003c/strong>). More A⁻ means a higher pH."}],"general":"Use pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base ÷ acid).","hints":["pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base ÷ acid).","Find the ratio, then its log.","pH = 4.74 + log(0.10 ÷ 0.20) = 4.74 − 0.30 = 4.44."]},{"id":"b2","goal":3,"prompt":"pH of 0.10 mol NH₄Cl + 0.20 mol NH₃ in 1.00 L","_a":"W0gHVw==","tol":0.0004,"display":"pH 9.56","use":"Use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 9.26, p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>(NH₃) = 4.74; log 2 = 0.30, log 3 = 0.48, log 5 = 0.70.","why":"pH = 9.26 + log(0.20 ÷ 0.10) = 9.26 + 0.30 = 9.56.","wrong":[{"match":8.96,"fb":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003cstrong>base\u003c/strong> ÷ \u003cstrong>acid\u003c/strong>). More A⁻ means a higher pH."},{"match":5.04,"fb":"Use p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 9.26, not p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>."}],"general":"Use pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base ÷ acid).","hints":["pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base ÷ acid).","Find the ratio, then its log.","pH = 9.26 + log(0.20 ÷ 0.10) = 9.26 + 0.30 = 9.56."]},{"id":"b3","goal":4,"prompt":"HX buffer (0.10 mol each) + 0.020 mol NaOH","_a":"V0gDWQ==","tol":0.0009,"display":"pH 5.18","use":"Use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(HX) = 5.00 (model acid); log 2 = 0.30, log 3 = 0.48.","why":"OH⁻ turns HX into X⁻: X⁻ 0.12, HX 0.080. pH = 5.00 + log(0.12 ÷ 0.080) = 5.00 + 0.18 = 5.18.","wrong":[{"match":4.82,"fb":"Base turns HX into X⁻: X⁻ goes \u003cstrong>up\u003c/strong>, HX goes \u003cstrong>down\u003c/strong>, and the pH rises."}],"general":"React first, then use the buffer equation.","hints":["pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base ÷ acid).","Find the ratio, then its log.","X⁻ 0.12, HX 0.080: pH = 5.00 + log(3/2) = 5.00 + 0.48 − 0.30 = 5.18."]},{"id":"b4","goal":4,"star":true,"prompt":"Which ratio [A⁻] : [HA] gives pH 5.74 with ethanoic acid? (Enter the number before : 1.)","_a":"U1Y=","display":"10 : 1","use":"Use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(ethanoic acid) = 4.74.","label":"[A⁻] : [HA] =","unit":": 1","why":"5.74 − 4.74 = 1 = log 10, so [A⁻] : [HA] = 10 : 1.","wrong":[{"match":0.1,"fb":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003cstrong>base\u003c/strong> ÷ \u003cstrong>acid\u003c/strong>). More A⁻ means a higher pH."},{"match":1,"fb":"That gives 4.74."}],"general":"Find log(ratio) first.","hints":["pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base ÷ acid).","Find the ratio, then its log.","log(ratio) = 5.74 − 4.74 = 1, so the ratio is 10 : 1."]},{"id":"b5","goal":4,"star":true,"prompt":"How many moles of NaOH must be added to 0.30 mol of ethanoic acid (1.00 L) to make a buffer at pH 4.74?","_a":"UkgDVA==","tol":0.001,"display":"0.15 mol","unit":"mol","use":"Use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(ethanoic acid) = 4.74.","why":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> needs equal amounts: convert half of the 0.30 mol, so 0.15 mol NaOH gives 0.15 mol HA + 0.15 mol A⁻.","wrong":[{"match":0.3,"fb":"That converts all the acid: no buffer left."}],"general":"What ratio does pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> need?","hints":["pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> means equal amounts.","Convert half the acid into A⁻.","0.15 mol NaOH."]},{"id":"b6","goal":5,"star":true,"prompt":"The HX buffer (0.10 mol each): what is the most HCl it can absorb while keeping pH ≥ 4.52?","_a":"UkgCVA==","tol":0.001,"display":"0.050 mol","unit":"mol","use":"Use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(HX) = 5.00 (model acid); log 3 = 0.48.","why":"(0.10 − \u003ci>a\u003c/i>) ÷ (0.10 + \u003ci>a\u003c/i>) ≥ 1/3 gives \u003ci>a\u003c/i> ≤ 0.050 mol.","wrong":[{"match":0.1,"fb":"At 0.10 mol the base is gone and the pH is 2.85. Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply."}],"general":"Set up the ratio after adding \u003ci>a\u003c/i> mol of HCl.","hints":["4.52 − 5.00 = −0.48 = log(1/3).","(0.10 − \u003ci>a\u003c/i>) ÷ (0.10 + \u003ci>a\u003c/i>) ≥ 1/3.","0.30 − 3\u003ci>a\u003c/i> ≥ 0.10 + \u003ci>a\u003c/i>, so \u003ci>a\u003c/i> ≤ 0.050 mol."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Esther","how":"","instruction":"Esther made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Find the pH after 0.020 mol HCl is added to 1.00 L of buffer containing 0.10 mol HX and 0.10 mol X⁻ (p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 5.00).","steps":["H₃O⁺ reacts with X⁻: X⁻ + H₃O⁺ → HX + H₂O.","\u003ci>n\u003c/i>(X⁻) = 0.10 + 0.020 = 0.12; \u003ci>n\u003c/i>(HX) = 0.10 − 0.020 = 0.080.","pH = 5.00 + log(0.12 ÷ 0.080) = 5.18."],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. An acid can’t raise the pH."],"fixes":[{"t":"\u003ci>n\u003c/i>(X⁻) = 0.080, \u003ci>n\u003c/i>(HX) = 0.10.","why":"HX gains what X⁻ loses.","_n":"1m2b9","_k":"cd2001d0"},{"t":"X⁻ is used up and HX is made: \u003ci>n\u003c/i>(X⁻) = 0.080, \u003ci>n\u003c/i>(HX) = 0.12, so pH = 5.00 + log(2/3) = 4.82.","why":"Added H₃O⁺ turns A⁻ into HA: A⁻ goes \u003cstrong>down\u003c/strong>, HA goes \u003cstrong>up\u003c/strong>, and the pH falls.","_n":"1na4a","_k":"e263282f"},{"t":"Both stay at 0.10, so pH = 5.00.","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"1oa3a","_k":"f55a29ba"},{"t":"Step 2 is correct.","why":"Adding acid can’t raise the pH. Added H₃O⁺ turns A⁻ into HA: A⁻ goes \u003cstrong>down\u003c/strong>, HA goes \u003cstrong>up\u003c/strong>, and the pH falls.","_n":"1pa6a","_k":"f6017844"}],"hints":["Which species does step 1 use up?","X⁻ goes down; HX goes up.","0.080 and 0.12: pH 4.82."]},{"id":"e2","goal":5,"task":"Prepare a long-lasting pH 7.5 buffer.","steps":["Target pH 7.5.","Choose HOCl/OCl⁻ (p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 7.52).","Mix 0.10 mol HOCl and 0.10 mol NaOCl in 1.00 L: pH 7.52.","Dilute it to 10.0 L to make the buffer last longer.","The pH stays at 7.52 and the capacity increases."],"_a":"UQ==","stepFb":["Step 1 is correct.","Step 2 is correct: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> is close to the target.","Step 3 is correct.","","Step 5 follows from step 4."],"fixes":[{"t":"Step 4 is correct.","why":"Less of each component per litre means less acid or base can be absorbed. Diluting keeps the ratio, so the pH stays the same, but there’s less of each component to use up.","_n":"1qa5a","_k":"bfe36e7e"},{"t":"Diluting keeps the pH but lowers the capacity per litre. For more capacity, use more of both components (for example, 0.40 mol each in 1.00 L).","why":"Diluting keeps the ratio, so the pH stays the same, but there’s less of each component to use up.","_n":"1ra0a","_k":"fa5eb5e7"},{"t":"Diluting changes the pH to 7.00.","why":"Diluting keeps the ratio, so the pH stays the same, but there’s less of each component to use up.","_n":"1s9fa","_k":"263333af"},{"t":"Add more HOCl only.","why":"That changes the ratio and the pH.","_n":"1ta2a","_k":"dae861bc"}],"hints":["What sets capacity?","The amount of each component present.","More of both, not more water."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most when you attacked water and the buffer with the same acid?"},{"id":"j2","q":"In your own words, explain why a buffer’s pH changes only a little, but does change."},{"id":"j3","q":"Explain to a friend how to choose a buffer pair for a target pH, and how to make it stronger."},{"id":"j4","q":"Which part of buffer calculations is still shaky for you: the reaction step, the ratio, or the log? What will you practise?"}]},"final":{"intro":"This shows what you’ve learned, so there are no hints here. Answer all 10 questions and say how sure you are. Then submit to see your results. Each question is labelled with its achievement chart category. You may use these values: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of methanoic acid 3.74, benzoic acid 4.20, ethanoic acid 4.74, hypochlorous acid 7.52, ammonium 9.26; log 2 = 0.30, log 3 = 0.48, log 5 = 0.70.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which mixture is a buffer?","options":[{"t":"HNO₃ and KNO₃","why":"NO₃⁻ is too weak a base to take H⁺ back. A buffer needs a \u003cstrong>weak\u003c/strong> acid and its conjugate base.","_n":"1ua1a","_k":"145e779e"},{"t":"CH₃COOH and CH₃COONa","why":"A weak acid and its conjugate base.","_n":"1vaca","_k":"0aae3d60"},{"t":"HCl and NaCl","why":"Cl⁻ is too weak a base to take H⁺ back. A buffer needs a \u003cstrong>weak\u003c/strong> acid and its conjugate base.","_n":"1waba","_k":"dd03b04f"},{"t":"NaOH and NaCl","why":"Strong base with spectators.","_n":"1x9ea","_k":"4d97e687"}]},"b":{"prompt":"Which mixture is a buffer?","options":[{"t":"NH₃ and NH₄Cl","why":"A weak base and its conjugate acid.","_n":"1y9fa","_k":"bd6e1992"},{"t":"HNO₃ and NaNO₃","why":"NO₃⁻ is too weak a base to take H⁺ back. A buffer needs a \u003cstrong>weak\u003c/strong> acid and its conjugate base.","_n":"1z9ca","_k":"6430d837"},{"t":"HCl and KCl","why":"Cl⁻ is too weak a base to take H⁺ back. A buffer needs a \u003cstrong>weak\u003c/strong> acid and its conjugate base.","_n":"209da","_k":"b09c54df"},{"t":"KOH and KCl","why":"Strong base with spectators.","_n":"21a2a","_k":"0fcb0d34"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A little strong acid is added to an ethanoic acid / ethanoate buffer. What happens?","options":[{"t":"Na⁺ removes the acid.","why":"Na⁺ is a spectator.","_n":"22a3a","_k":"565a92ca"},{"t":"CH₃COO⁻ reacts with H₃O⁺ to form CH₃COOH and water.","why":"The base form uses up the added acid.","_n":"23a0a","_k":"bc20fd1b"},{"t":"Nothing reacts, so the pH stays exactly the same.","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"24a1a","_k":"c06be35a"},{"t":"CH₃COOH reacts with the H₃O⁺.","why":"An acid doesn’t use up an acid.","_n":"25a6a","_k":"9395d3fc"}]},"b":{"prompt":"A little strong base is added to the same buffer. What happens?","options":[{"t":"Nothing reacts.","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"26a7a","_k":"8c340d52"},{"t":"CH₃COO⁻ reacts with the OH⁻.","why":"A base doesn’t use up a base: added OH⁻ turns HA into A⁻.","_n":"27b0a","_k":"bd817365"},{"t":"CH₃COOH reacts with OH⁻ to form CH₃COO⁻ and water.","why":"The acid form uses up the added base.","_n":"28afa","_k":"f77636a6"},{"t":"Water removes the base.","why":"Water alone isn’t a buffer.","_n":"29aea","_k":"488c171b"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"A buffer contains equal moles of HX and X⁻. Its pH is…","options":[{"t":"7.00","why":"Only if p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> happens to be 7.","_n":"2aada","_k":"aebe2896"},{"t":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> ÷ 2","why":"log 1 = 0; no halving.","_n":"2bb4a","_k":"0c3d9e4c"},{"t":"equal to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","why":"log 1 = 0, so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"2cb3a","_k":"541cf5dd"},{"t":"14.00 − p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","why":"That’s p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"2db2a","_k":"2b26a98c"}]},"b":{"prompt":"In a buffer, [A⁻] ÷ [HA] = 10. Its pH is…","options":[{"t":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + 10","why":"log 10 = 1.","_n":"2eb1a","_k":"551f6326"},{"t":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + 1","why":"log 10 = 1.","_n":"2fa8a","_k":"d349a5da"},{"t":"10 × p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","why":"Add log 10, don’t multiply.","_n":"2ga7a","_k":"50ddaecb"},{"t":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> − 1","why":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003cstrong>base\u003c/strong> ÷ \u003cstrong>acid\u003c/strong>). More A⁻ means a higher pH.","_n":"2haaa","_k":"5db20ffe"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Find the pH of 1.00 L containing 0.10 mol ethanoic acid and 0.20 mol sodium ethanoate (p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 4.74).","options":[{"t":"4.44","why":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003cstrong>base\u003c/strong> ÷ \u003cstrong>acid\u003c/strong>). More A⁻ means a higher pH.","_n":"2iaba","_k":"1b5dcb5c"},{"t":"4.74","why":"The amounts aren’t equal.","_n":"2jaca","_k":"40c0c392"},{"t":"5.04","why":"4.74 + log 2.","_n":"2kada","_k":"1586a247"},{"t":"9.26","why":"That’s p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of ammonium.","_n":"2laea","_k":"10d0cb1e"}]},"b":{"prompt":"Find the pH of 1.00 L containing 0.20 mol NH₄Cl and 0.10 mol NH₃ (p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of NH₄⁺ 9.26).","options":[{"t":"4.44","why":"That uses p\u003ci>K\u003c/i>\u003csub>b\u003c/sub> (4.74) with the ratio.","_n":"2mafa","_k":"39ad7b24"},{"t":"8.96","why":"9.26 + log(1/2).","_n":"2nb0a","_k":"ddf2ba27"},{"t":"9.26","why":"The amounts aren’t equal.","_n":"2ob1a","_k":"6cb53cf0"},{"t":"9.56","why":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003cstrong>base\u003c/strong> ÷ \u003cstrong>acid\u003c/strong>). More A⁻ means a higher pH.","_n":"2pa2a","_k":"b2cf065d"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"1.00 L of buffer holds 0.10 mol HX and 0.10 mol X⁻ (p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 5.00). 0.050 mol HCl is added. Find the pH.","options":[{"t":"1.30","why":"That would be water. The buffer absorbs this amount.","_n":"2qa3a","_k":"b335e841"},{"t":"4.52","why":"X⁻ 0.050, HX 0.15: log(1/3) = −0.48.","_n":"2re67","_k":"360914be"},{"t":"5.00","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"2se77","_k":"5b98a8a5"},{"t":"5.48","why":"Acid lowers pH. Added H₃O⁺ turns A⁻ into HA: A⁻ goes \u003cstrong>down\u003c/strong>, HA goes \u003cstrong>up\u003c/strong>, and the pH falls.","_n":"2te87","_k":"35a027a5"}]},"b":{"prompt":"The same buffer gets 0.050 mol NaOH. Find the pH.","options":[{"t":"4.52","why":"Base raises the pH: added OH⁻ turns HX into X⁻.","_n":"2ue97","_k":"743f3339"},{"t":"5.00","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"2vea7","_k":"256644fe"},{"t":"5.48","why":"X⁻ 0.15, HX 0.050: log 3 = 0.48.","_n":"2web7","_k":"1e618957"},{"t":"12.70","why":"That would be water.","_n":"2xec7","_k":"fec710e6"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Buffer P has 0.10 mol each of ethanoic acid and ethanoate in 1.00 L; buffer Q has 0.010 mol each in 1.00 L. Both are at pH 4.74. 0.020 mol HCl is added to each. Which is true?","options":[{"t":"Both stay at 4.74.","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"2yed7","_k":"187a6820"},{"t":"P falls to about 4.56; Q’s capacity is exceeded and its pH drops below 3.","why":"Q has only 0.010 mol of ethanoate to use up 0.020 mol of acid.","_n":"2zee7","_k":"fb6a50d1"},{"t":"Both fall to about 4.56, because only the ratio matters.","why":"The ratio rule needs both components left. Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply.","_n":"30ef7","_k":"d19df324"},{"t":"Q changes less, because it’s more dilute.","why":"Diluting keeps the ratio, so the pH stays the same, but there’s less of each component to use up.","_n":"31ec8","_k":"4cbb4ea1"}]},"b":{"prompt":"The same buffers each get 0.015 mol NaOH. Which is true?","options":[{"t":"Both stay at 4.74.","why":"A buffer changes pH a little, not zero. The ratio shifts slightly.","_n":"32eb8","_k":"03d778bb"},{"t":"Q changes less.","why":"Diluting keeps the ratio, so the pH stays the same, but there’s less of each component to use up.","_n":"33ea8","_k":"ad582dcd"},{"t":"P rises to about 4.87; Q’s capacity is exceeded and its pH rises above 11.","why":"Q has only 0.010 mol of ethanoic acid.","_n":"34e98","_k":"6fe9e08d"},{"t":"Both rise to about 4.87.","why":"The ratio rule needs both components left. Once HA is used up, the extra OH⁻ stays in solution and the pH rises sharply.","_n":"35f08","_k":"ce496ee3"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why a buffer resists pH change?","options":[{"t":"“It has a weak acid to use up added OH⁻ and a conjugate base to use up added H₃O⁺, so the added ions are removed and the ratio changes only a little.”","why":"Both jobs and the small ratio change are named.","_n":"36ef8","_k":"3053e9b0"},{"t":"“It neutralizes any amount of acid or base completely.”","why":"Once A⁻ is used up, the extra H₃O⁺ stays in solution and the pH drops sharply.","_n":"37ee8","_k":"7d53441d"},{"t":"“The water in the buffer absorbs the H⁺.”","why":"Water alone shows a large pH change.","_n":"38ed8","_k":"85b0a22b"},{"t":"“Buffers are at pH 7, so they’re neutral.”","why":"Buffers can have any pH near their p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"39f48","_k":"b23efe0b"}]},"b":{"prompt":"Which is the best explanation of why diluting a buffer barely changes its pH?","options":[{"t":"“[HA] and [A⁻] fall by the same factor, so their ratio, and pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(ratio), stays the same.”","why":"The ratio sets the pH.","_n":"3af38","_k":"bcf05bf7"},{"t":"“Dilution has no effect on any solution’s pH.”","why":"It does for strong acids.","_n":"3b728","_k":"a5a436d1"},{"t":"“Water is neutral, so it pulls the pH toward 7 only slightly.”","why":"The ratio, not the water, sets the pH.","_n":"3c738","_k":"fc214329"},{"t":"“Diluting raises the capacity.”","why":"Diluting keeps the ratio, s
