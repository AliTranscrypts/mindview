>","eqSize":"sm","eqLabel":"butan-2-ol, C H 3, C star H, O H, C H 2 C H 3, with the chiral centre starred","headline":"Some molecules come in left and right hands","text":"A carbon with \u003cstrong>four different groups\u003c/strong> is a \u003cstrong>chiral centre\u003c/strong>. Its molecule and its mirror image are \u003cstrong>enantiomers\u003c/strong>: alike in almost every way, but no more superimposable than your two hands. They rotate polarized light in opposite directions, and they can smell, taste or act differently in your body.","fig":{"html":"\u003cdiv class=\"ml-hx\">\u003cdiv id=\"ml-hx-svg\">\u003c/div>\u003cdiv class=\"ml-hx-row\">\u003cp class=\"ml-hx-cap\" id=\"ml-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ml-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can find the chiral centres in a structure by checking for four different groups.","I can explain what makes a molecule chiral, using mirror images and superimposition.","I can tell enantiomers from diastereomers and count the possible stereoisomers.","I can describe how enantiomers differ (optical activity) and how they are the same (most physical properties).","I can explain why handedness matters in taste, smell and medicine."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Tetrahedral carbon","goal":2,"prompt":"A carbon with four single bonds arranges them in which shape?","options":[{"t":"Trigonal planar, 120°","why":"That’s three groups.","_n":"0b7f","_k":"79fc18c1"},{"t":"Square planar, 90° apart","why":"The drawing is flat; the molecule isn’t.","_n":"1b4f","_k":"d477a54f"},{"t":"Tetrahedral, about 109.5° apart","why":"Four groups spread out in 3D.","_n":"2b5f","_k":"705807f6"},{"t":"Linear, 180°","why":"That’s two groups.","_n":"3baf","_k":"21d9c6dc"}],"hints":["Four groups, as far apart as possible in 3D.","Think of a tripod with one leg pointing up.","Tetrahedral, 109.5°."]},{"id":"w2","skill":"Tetrahedral carbon","goal":2,"prompt":"In a wedge-and-dash drawing, what does a solid wedge mean?","options":[{"t":"A double bond","why":"Double bonds are two lines.","_n":"4bbf","_k":"47f836ec"},{"t":"The bond points toward you","why":"Solid wedges come toward you; dashed wedges go away.","_n":"5b8f","_k":"e3226ad4"},{"t":"The bond points away from you","why":"That’s a dashed wedge.","_n":"6b9f","_k":"4b79dea9"},{"t":"A stronger bond","why":"Wedges show direction, not strength.","_n":"7aef","_k":"9eb3b9b5"}],"hints":["Wedges show 3D direction.","Solid vs dashed.","Solid = toward you."]},{"id":"w3","skill":"Identical groups","goal":1,"prompt":"In CH₃CH₂CH(CH₃)CH₂CH₃, what four groups are on the third carbon?","options":[{"t":"H, CH₃, C₂H₅, C₃H₇","why":"Count each side: 2 carbons left, 2 right.","_n":"8aff","_k":"d7815b51"},{"t":"H, CH₃, CH₂, CH₂","why":"Compare whole groups, not just the first atom.","_n":"912e","_k":"caabcd1d"},{"t":"CH₃, CH₃, C₂H₅, H","why":"Only one CH₃ branch.","_n":"a11e","_k":"cef2d756"},{"t":"H, CH₃, C₂H₅, C₂H₅","why":"The chain continues as an ethyl group on each side.","_n":"b14e","_k":"c22a658f"}],"hints":["Walk outward along each bond from C3.","Left: CH₂CH₃. Right: CH₂CH₃.","H, CH₃, C₂H₅, C₂H₅."]},{"id":"w4","skill":"Identical groups","goal":1,"prompt":"Which carbon in CH₃CH(OH)CH₂CH₃ has four different groups?","options":[{"t":"C1","why":"C1 has three H atoms.","_n":"c13e","_k":"b75c5422"},{"t":"C2","why":"H, OH, CH₃ and C₂H₅.","_n":"d16e","_k":"3434a037"},{"t":"None","why":"C2 qualifies.","_n":"e15e","_k":"72eb7e16"},{"t":"C3","why":"C3 has two H atoms.","_n":"f18e","_k":"90d66914"}],"hints":["List the groups on each carbon.","C2: H, OH, CH₃, CH₂CH₃.","C2."]},{"id":"w5","skill":"Stereoisomer types","goal":3,"prompt":"Cis- and trans-but-2-ene are…","options":[{"t":"Not isomers","why":"Both are C₄H₈.","_n":"g17e","_k":"8cafeeba"},{"t":"Structural isomers","why":"The atoms are joined in the same order.","_n":"h1ae","_k":"47a817a7"},{"t":"The same compound","why":"The C=C can’t rotate.","_n":"i19e","_k":"2af7c346"},{"t":"Stereoisomers","why":"Same connections, different arrangement.","_n":"ja0e","_k":"ea633303"}],"hints":["Same order of atoms?","Yes, but a different shape.","Stereoisomers."]},{"id":"w6","skill":"Stereoisomer types","goal":3,"prompt":"Which is true of every pair of stereoisomers?","options":[{"t":"Same molecular formula and same connections","why":"Only the 3D arrangement differs.","_n":"ka1e","_k":"cbad48b7"},{"t":"Same boiling point","why":"Cis and trans boil differently.","_n":"la2e","_k":"6d93c658"},{"t":"Different formulas","why":"Isomers share a formula.","_n":"ma3e","_k":"2ba9ebac"},{"t":"Mirror images","why":"Cis and trans aren’t mirror images.","_n":"na4e","_k":"c9379bd0"}],"hints":["What makes isomers ‘stereo’?","Only the 3D arrangement differs.","Same formula, same connections."]}],"refreshers":{"Tetrahedral carbon":"Four single bonds point to the corners of a tetrahedron (109.5°). Wedges come toward you; dashes go away.","Identical groups":"To compare groups on a carbon, walk out along each branch to its end. Two branches match only if they’re the same all the way.","Stereoisomer types":"Stereoisomers have the same connections in different arrangements. Cis–trans isomers are one kind; mirror-image isomers are another."}}},"explore":{"heading":"Mirror lab","intro":"Build a carbon with four groups, reflect it, and try to make the reflection sit exactly on the original.","how":"Tap a slot on the model (or Tab to it and press Enter), then choose a group from the palette. Turn the model with the arrow keys, the turn buttons or by dragging it.","modes":[{"id":"one","t":"One centre"},{"id":"two","t":"Two centres"},{"id":"pol","t":"Polarimeter"}],"start":{"w":"OH","d":"H","l":"CH3","r":"C2H5"},"polNote":"\u003cstrong>Polarimeter model:\u003c/strong> a pure sample rotates the plane of polarized light by 40° in this tube (a model value, not data for a real compound). The rotation is proportional to the excess of one enantiomer: net rotation = 40° × (% (+) − % (−)) ÷ 100.","twoNote":"Each chiral centre has two forms, A and B. Tap two cards, then say how they’re related.","rules":{"m1":"Compare the whole groups. Two C₂H₅ groups are identical however they’re drawn.","m2":"Every molecule has a mirror image. It’s a different molecule only if it can’t be rotated onto the original.","m3":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","m4":"Equal amounts rotate equally in opposite directions, so the rotations cancel: 0°.","m5":"Enantiomers are mirror images. If only some chiral centres differ, they’re diastereomers.","m6":"Each centre doubles the count: 2, 4, 8, …","m7":"A chiral centre has four groups on four single bonds. A double-bonded carbon has only three groups."},"predictions":[{"id":"p1","g":{"w":"OH","d":"H","l":"CH3","r":"CH3"},"prompt":"One centre with H, OH, CH₃, CH₃ (propan-2-ol). Reflect it and try to superimpose. Will the mirror image match?","options":[{"t":"Yes, it matches","_n":"oa5e","_k":"eaf1308f"},{"t":"No: it’s an enantiomer","_n":"pa6e","_k":"82a34778"},{"t":"It has no mirror image","_n":"qa7e","_k":"edf577c4"},{"t":"Only if you break a bond","_n":"r98e","_k":"b5c16228"}],"explain":"Two identical CH₃ groups: the molecule isn’t chiral. Every molecule has a mirror image. It’s a different molecule only if it can’t be rotated onto the original."},{"id":"p2","g":{"w":"OH","d":"H","l":"CH3","r":"C2H5"},"prompt":"One centre with H, OH, CH₃, C₂H₅ (butan-2-ol). Will this mirror image match?","options":[{"t":"Yes","_n":"s99e","_k":"3e406a5c"},{"t":"Only at low temperature","_n":"ta6e","_k":"b936a9a4"},{"t":"Yes, after two rotations","_n":"ua5e","_k":"02bb6276"},{"t":"No: it’s a different molecule","_n":"va4e","_k":"c7d66ebb"}],"explain":"Four different groups: chiral. The two forms are enantiomers."},{"id":"p3","g":{"w":"OH","d":"H","l":"CH3","r":"C2H5"},"prompt":"Swap the OH and CH₃ on butan-2-ol. What do you get?","options":[{"t":"A diastereomer","_n":"wa3e","_k":"a53b87c6"},{"t":"The same molecule","_n":"xaae","_k":"214e0427"},{"t":"A structural isomer","_n":"ya9e","_k":"b0f9ce46"},{"t":"Its enantiomer","_n":"za8e","_k":"27aa0f9b"}],"explain":"Swapping any two groups on a chiral centre inverts it."},{"id":"p4","pct":50,"prompt":"Polarimeter, 50% (+). What rotation will a 50 : 50 mixture show?","options":[{"t":"+20°","_n":"10a7e","_k":"1d0b59e6"},{"t":"+40°","_n":"119ee","_k":"85ebb281"},{"t":"−40°","_n":"129de","_k":"b9806d77"},{"t":"0°","_n":"1324e","_k":"ce2decf8"}],"explain":"A racemic mixture: the rotations cancel. Equal amounts rotate equally in opposite directions, so the rotations cancel: 0°."}],"chalIntro":"Use the mirror lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build a \u003cstrong>chiral\u003c/strong> molecule with formula C₄H₉Cl.","why":"2-chlorobutane: H, Cl, CH₃ and C₂H₅ are four different groups, and 1 + 1 + 2 = 4 carbons gives C₄H₉Cl. Either enantiomer counts.","twoH":"Two H atoms: not chiral.","threeMe":"Three identical CH₃ groups.","c5":"That’s C₅H₁₁Cl.","hints":["Cl and H take two slots; the other two must hold three carbons and differ.","1 + 2 = 3 carbons.","H, Cl, CH₃ and C₂H₅: 2-chlorobutane."]},{"id":"tc2","goal":4,"prompt":"Polarimeter mode: make the reading \u003cstrong>−20°\u003c/strong>.","why":"25% (+) and 75% (−): a 50% excess of (−), so 40° × (25 − 75) ÷ 100 = −20°.","p75":"That gives +20°: wrong direction.","p50":"Racemic: 0°.","p20":"That gives 40 × (20 − 80) ÷ 100 = −24°.","hints":["Pure (−) gives −40°. You want half of that.","The excess of (−) over (+) must be 50%.","75% (−) and 25% (+)."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Two-centre mode, 3-chlorobutan-2-ol: tap a pair of \u003cstrong>enantiomers\u003c/strong>, then a pair of \u003cstrong>diastereomers\u003c/strong>. Then switch to 2,3-dichlorobutane and find the arrangement that is identical to its own mirror image.","why":"Enantiomers differ at every centre (AA/BB, AB/BA); diastereomers differ at only some (AA/AB). In 2,3-dichlorobutane, AB has an internal mirror plane, so it is identical to BA: meso. That’s 3 stereoisomers, not 4.","calledEn":"Only one centre differs: diastereomers.","mesoAA":"AA’s mirror image is BB, a different molecule.","mesoBB":"BB’s mirror image is AA, a different molecule.","hints":["Mirror images differ at \u003cstrong>every\u003c/strong> centre.","In 2,3-dichlorobutane both ends are the same (CH₃ and Cl at each centre).","AB has an internal mirror plane, so it’s identical to BA: meso. That’s 3 stereoisomers, not 4."]}],"blocks":[{"title":"What the mirror lab shows","html":"\u003cp>Four different groups give handedness; any repeat removes it. Enantiomers are invisible to most measurements, but they show up in a polarimeter and in a chiral receptor.\u003c/p>"}]},"part3":{"slug":"handedness","name":"Handedness","heading":"Handedness in taste and medicine","intro":"Why does handedness matter outside the textbook? Visit three stations: a receptor site that works like a glove, two smells with one formula, and medicines.","s1":{"title":"Station 1: The glove test","intro":"This receptor site has three shaped pockets (for OH, CH₃ and C₂H₅) and a flat wall where H sits. Move each enantiomer of butan-2-ol in, then turn it and tip it to find its best fit.","caption":"A chiral site tells enantiomers apart, just as a glove tells hands apart.","zoom":"Zoom to the molecules","zoomHTML":"\u003cp>Look at the fit from the flat wall, with H pointing at you. In one enantiomer, OH → CH₃ → C₂H₅ run clockwise, matching the pockets. In its mirror image they run anticlockwise, so no turn can put all three in place: at best two groups sit in their pockets and the other two trade places.\u003c/p>\u003cp>That’s \u003cstrong>three-point contact\u003c/strong>. With only one or two contact points, both enantiomers could fit; it takes three to tell a left hand from a right hand.\u003c/p>"},"s2":{"title":"Station 2: Two smells, one formula","intro":"Carvone comes in two mirror-image forms. One smells of spearmint; the other smells of caraway (the seed in rye bread). Read the data, then mark each property “the same” or “differ”.","cols":["Property","Carvone from spearmint oil","Carvone from caraway seed"],"rows":[{"id":"f","p":"Molecular formula","a":"C₁₀H₁₄O","b":"C₁₀H₁₄O","_a":"G0dQC1JE","fb":"Isomers share a formula."},{"id":"bp","p":"Boiling point","a":"the same value","b":"the same value","_a":"G0dQC1JE","fb":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things."},{"id":"d","p":"Density","a":"the same value","b":"the same value","_a":"G0dQC1JE","fb":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things."},{"id":"pol","p":"Polarimeter reading","a":"(−): turns the plane anticlockwise","b":"(+): turns the plane clockwise by the same angle","_a":"G1BYAFEDQBQ=","fb":"Enantiomers rotate light in opposite directions."},{"id":"sm","p":"Smell","a":"spearmint","b":"caraway","_a":"G1BYAFEDQBQ=","fb":"Their physical properties match; only a chiral partner tells them apart."}],"done":"Everything matches except the polarimeter reading and the smell: the two places where a chiral partner (polarized light or a smell receptor) is involved."},"s3":{"title":"Station 3: Medicines","cards":[{"t":"Pain relievers","html":"Many common pain relievers are sold as racemic mixtures, but only one enantiomer binds the target enzyme well. For some, the body converts part of the other form."},{"t":"History card","html":"In the late 1950s and early 1960s a sedative given in pregnancy caused serious birth defects, including in Canada. One enantiomer was linked to the harm, but in the body the two forms interconvert, so a “pure” dose would not have stayed pure. Drug testing rules changed worldwide as a result."}],"stse":"Why do regulators now ask for each enantiomer to be tested?","stseNote":"Your answer saves on this device. It isn’t marked here; bring it to class."},"quickCheck":{"title":"Handedness quick check","summary":"Handedness quick check","items":[{"id":"q1","goal":5,"prompt":"Why do the two carvones smell different?","choices":[{"t":"Smell receptors are chiral","fb":"Right. Their physical properties match; only a chiral partner tells them apart.","_n":"1425e","_k":"7df8d0b2"},{"t":"One is ionic","fb":"Their physical properties match; only a chiral partner tells them apart.","_n":"1522e","_k":"57b8740b"},{"t":"Different formulas","fb":"Their physical properties match; only a chiral partner tells them apart.","_n":"1623e","_k":"21862429"},{"t":"They boil differently","fb":"Their physical properties match; only a chiral partner tells them apart.","_n":"1728e","_k":"1f82b3cb"}]},{"id":"q2","goal":4,"prompt":"Which measurement tells the two carvones apart?","choices":[{"t":"Polarimeter reading","fb":"Right. Enantiomers rotate light in opposite directions.","_n":"1829e","_k":"9e5ed912"},{"t":"Density","fb":"Enantiomers rotate light in opposite directions.","_n":"1926e","_k":"7532b93b"},{"t":"Mass","fb":"Enantiomers rotate light in opposite directions.","_n":"1a27e","_k":"9b38f316"},{"t":"Boiling point","fb":"Enantiomers rotate light in opposite directions.","_n":"1b1ce","_k":"e3c76318"}]},{"id":"q3","goal":5,"prompt":"In the glove test, how many pockets must match for a site to ‘tell hands apart’?","choices":[{"t":"1","fb":"With three contact points, only one enantiomer can match all three.","_n":"1c1de","_k":"f415a726"},{"t":"2","fb":"With three contact points, only one enantiomer can match all three.","_n":"1daaf","_k":"8e8a2de9"},{"t":"3","fb":"Right. With three contact points, only one enantiomer can match all three.","_n":"1ea9f","_k":"6e5df1c3"},{"t":"4","fb":"With three contact points, only one enantiomer can match all three.","_n":"1facf","_k":"1d4471ad"}]},{"id":"q4","goal":5,"prompt":"Why might a drug sold as one pure enantiomer still become a mixture in the body?","choices":[{"t":"Mixtures form in the bottle","fb":"Some chiral centres flip under body conditions.","_n":"1gabf","_k":"709ef339"},{"t":"The forms can interconvert","fb":"Right. Some chiral centres flip under body conditions.","_n":"1ha6f","_k":"0387f2c1"},{"t":"The body adds a chiral centre","fb":"Some chiral centres flip under body conditions.","_n":"1ia5f","_k":"deed7110"},{"t":"Enantiomers are unstable solids","fb":"Some chiral centres flip under body conditions.","_n":"1ja8f","_k":"154a3d9e"}]}]}},"practice":{"activities":[{"id":"centres","type":"custom","title":"Find the chiral centres","summary":"Find the chiral centres","goal":1,"instruction":"Tap every chiral centre, then press Done. If there are none, press None.","how":"Tap a carbon to star it (tap again to remove the star). Grey numbers are the carbon numbers. Use Next and Previous to move between structures.","hintsAll":["List the four groups on each carbon.","Ignore carbons with 2 or 3 H atoms and any double-bonded carbon."],"items":[{"id":"c1","name":"butan-2-ol","cf":"CH₃CH(OH)CH₂CH₃","smi":"CC(O)CC","locs":[1,2,null,3,4],"_a":"YgVs","reason":"C2: H, OH, CH₃ and C₂H₅ are all different."},{"id":"c2","name":"propan-2-ol","cf":"CH₃CH(OH)CH₃","smi":"CC(O)C","locs":[1,2,null,3],"_a":"Ymk=","tap":{"1":"Two CH₃ groups."},"reason":"None. C2 has two CH₃ groups, and C1 and C3 have three H atoms."},{"id":"c3","name":"3-methylpentane","cf":"CH₃CH₂CH(CH₃)CH₂CH₃","smi":"CCC(C)CC","locs":[1,2,3,null,4,5],"_a":"Ymk=","tap":{"2":"Two C₂H₅ groups. Compare the whole groups. Two C₂H₅ groups are identical however they’re drawn."},"reason":"None. C3 has two C₂H₅ groups, and every other carbon has two or three H atoms."},{"id":"c4","name":"3-methylhexane","cf":"CH₃CH₂CH(CH₃)CH₂CH₂CH₃","smi":"CCC(C)CCC","locs":[1,2,3,null,4,5,6],"_a":"YgZs","miss":{"2":"C3 has H, CH₃, C₂H₅ and C₃H₇: all different."},"reason":"C3: H, CH₃, C₂H₅ and C₃H₇ are all different."},{"id":"c5","name":"2-aminopropanoic acid (alanine)","cf":"CH₃CH(NH₂)COOH","smi":"CC(N)C(=O)O","locs":[3,2,null,1,null,null],"_a":"YgVs","reason":"C2: H, NH₂, CH₃ and COOH are all different. C1, the COOH carbon, has a C=O."},{"id":"c6","name":"aminoethanoic acid (glycine)","cf":"H₂NCH₂COOH","smi":"NCC(=O)O","locs":[null,2,1,null,null],"_a":"Ymk=","tap":{"1":"Two H atoms on the carbon."},"reason":"None. The CH₂ carbon has two H atoms, and the COOH carbon has a C=O."},{"id":"c7","name":"butanone","cf":"CH₃COCH₂CH₃","smi":"CC(=O)CC","locs":[1,2,null,3,4],"_a":"Ymk=","tap":{"1":"C2 has a C=O: only three groups. A chiral centre has four groups on four single bonds. A double-bonded carbon has only three groups."},"reason":"None. C2 has a C=O (only three groups), and C1, C3 and C4 have two or three H atoms."},{"id":"c8","name":"3-chlorobutan-2-ol","cf":"CH₃CH(OH)CH(Cl)CH₃","smi":"CC(O)C(Cl)C","locs":[1,2,null,3,null,4],"_a":"YgUdVWo=","miss":{"1":"Check C2 too: H, OH, CH₃ and CH(Cl)CH₃.","3":"Check C3 too: H, Cl, CH₃ and CH(OH)CH₃."},"reason":"C2 and C3. C2 has H, OH, CH₃ and CH(Cl)CH₃; C3 has H, Cl, CH₃ and CH(OH)CH₃."}]},{"id":"stereo","type":"custom","title":"Stereo reasoning","summary":"Stereo reasoning","star":true,"goal":[3,4],"instruction":"Six questions. Type a number or choose an answer, then press Check.","how":"Type numbers only (the units are already there). Each question has three levels of help.","items":[{"id":"r1","kind":"num","goal":3,"prompt":"Maximum number of stereoisomers for a molecule with 2 chiral centres (no symmetry)?","_a":"DQ==","display":"4","why":"2² = 4.","wrong":[{"match":2,"fb":"Each centre doubles the count: 2, 4, 8, … Each centre doubles: 2²."},{"match":3,"fb":"Each centre doubles the count: 2, 4, 8, … Each centre doubles: 2²."}],"hints":["Each chiral centre has two forms.","2 × 2.","2² = 4."]},{"id":"r2","kind":"num","goal":4,"prompt":"Two enantiomers of a compound: one boils at 92 °C. The other?","_a":"AAY=","unit":"°C","display":"92 °C","why":"Enantiomers have identical boiling points.","general":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","hints":["Enantiomers have identical physical properties.","Boiling point is a physical property.","92 °C."]},{"id":"r3","kind":"num","goal":3,"star":true,"prompt":"How many stereoisomers does pent-3-en-2-ol, CH₃CH(OH)CH=CHCH₃, have?","_a":"DQ==","display":"4","why":"C2 is a chiral centre (2 forms) and the C=C has cis and trans forms (2): 2 × 2 = 4.","wrong":[{"match":2,"fb":"The C=C also has cis–trans forms: 2 (centre) × 2 (C=C)."}],"hints":["Count the chiral centres, and check the C=C for cis–trans forms.","C2 is a chiral centre; the C=C can be cis or trans.","2 × 2 = 4."]},{"id":"r4","kind":"mc","goal":4,"star":true,"prompt":"Investigation: two unlabelled bottles each contain one carvone enantiomer. Without smelling them, which instrument identifies them?","options":[{"t":"A balance","why":"Same formula, same mass.","_n":"1ka7f","_k":"b7984b7c"},{"t":"A hydrometer (density)","why":"Same density. Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"1la2f","_k":"32c69ea6"},{"t":"A thermometer","why":"Same boiling points. Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"1ma1f","_k":"b5e219b0"},{"t":"A polarimeter","why":"The two forms rotate polarized light in opposite directions.","_n":"1n18e","_k":"e7e27f0c"}],"hints":["Which property differs between enantiomers?","They rotate polarized light in opposite directions.","A polarimeter."]},{"id":"r5","kind":"num","goal":4,"star":true,"prompt":"A pure (+) sample rotates +50°. A mixture is 60% (+) and 40% (−). Predict the rotation.","_a":"CAQ=","unit":"°","display":"+10°","why":"The 40% (−) cancels 40% (+), leaving a 20% excess of (+): 20% of +50° = +10°.","wrong":[{"match":30,"fb":"Subtract the (−) part: 50 × (60 − 40) ÷ 100."},{"match":-10,"fb":"Check the direction: there’s more (+) than (−), so the reading is positive."}],"hints":["The (−) part cancels an equal part of the (+).","The 40% (−) cancels 40% (+), leaving a 20% excess of (+).","20% of +50° = +10°."]},{"id":"r6","kind":"num","goal":3,"star":true,"prompt":"How many stereoisomers does 2,3-dichlorobutane have?","_a":"Cg==","display":"3","why":"Two chiral centres allow at most 4, but the arrangement with an internal mirror plane is meso, so there are 3.","wrong":[{"match":4,"fb":"One arrangement is meso: its mirror image is itself."}],"hints":["There are two chiral centres, so at most 4.","Both centres carry the same groups (H, Cl, CH₃, CHClCH₃).","The ‘opposite’ arrangement has an internal mirror plane: meso. 3 in all."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Fiona","how":"","instruction":"Fiona made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Is 3-methylpentane chiral?","steps":["The structure is CH₃CH₂CH(CH₃)CH₂CH₃.","C3 is the only carbon with one H.","C3’s groups: H, CH₃, CH₂ on the left, and CH₂CH₃ on the right.","These four are different, so C3 is a chiral centre.","So 3-methylpentane is chiral."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Correct.","","This follows from step 3.","This follows from step 4."],"fixes":[{"t":"It’s chiral because it has a branch.","why":"Branching alone doesn’t make a chiral centre.","_n":"1o19e","_k":"6063786b"},{"t":"C2 is the chiral centre instead.","why":"C2 has two H atoms.","_n":"1p1ae","_k":"6fe5e614"},{"t":"Step 3 is correct.","why":"Follow each branch to its end.","_n":"1q1be","_k":"38f92306"},{"t":"The left branch is CH₂CH₃ too. C3 has H, CH₃, C₂H₅ and C₂H₅, so it’s not a chiral centre and the molecule isn’t chiral.","why":"Compare the whole groups. Two C₂H₅ groups are identical however they’re drawn.","_n":"1r14e","_k":"d2c9444c"}],"hints":["Walk to the end of the left branch.","CH₂ then CH₃: an ethyl group.","Two ethyl groups: not chiral."]},{"id":"e2","goal":4,"task":"Compare the two enantiomers of butan-2-ol.","steps":["Both are C₄H₁₀O with the same connections.","They are non-superimposable mirror images.","Their boiling points differ by a few degrees because their shapes differ.","So they can be separated by distillation."],"_a":"Cw==","stepFb":["Correct.","Correct.","","This builds on step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Mirror-image molecules have identical forces between them.","_n":"1s15e","_k":"972150f3"},{"t":"Only the (+) form boils.","why":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"1t16e","_k":"e9b8becf"},{"t":"They differ by a lot, not a few degrees.","why":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"1u17e","_k":"8d236803"},{"t":"Enantiomers have identical boiling points; they differ only in rotating polarized light and toward chiral partners. Distillation can’t separate them.","why":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"1v20e","_k":"b4084e4d"}],"hints":["Are the forces between the molecules any different in a mirror world?","No.","Same boiling point."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the mirror lab: propan-2-ol matching its mirror image, or swapping two groups?"},{"id":"j2","q":"In your own words, what makes a molecule chiral?"},{"id":"j3","q":"Explain to a friend the difference between enantiomers and diastereomers."},{"id":"j4","q":"Which part of chirality still feels slippery? How will you practise it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"pr dentical physical properties. They differ only toward polarized light and other chiral things.","_n":"2c99d","_k":"88074cf9"},{"t":"The direction they rotate plane-polarized light","why":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"2d96d","_k":"99efe486"},{"t":"Density","why":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"2e97d","_k":"3456d265"},{"t":"Molecular formula","why":"Isomers share a formula.","_n":"2fa4d","_k":"ffa437ad"}]},"b":{"prompt":"A racemic mixture of a chiral compound is placed in a polarimeter. What is the reading?","options":[{"t":"The pure (+) value","why":"Equal amounts rotate equally in opposite directions, so the rotations cancel: 0°.","_n":"2ga5d","_k":"66239839"},{"t":"Half the pure value","why":"Both halves cancel completely.","_n":"2ha2d","_k":"2d142269"},{"t":"0°","why":"Equal opposite rotations cancel.","_n":"2ia1d","_k":"9739584c"},{"t":"Twice the pure value","why":"Equal amounts rotate equally in opposite directions, so the rotations cancel: 0°.","_n":"2ja4d","_k":"6eccdf19"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A molecule has 3 chiral centres and no internal symmetry. What is the maximum number of stereoisomers?","options":[{"t":"3","why":"Each centre has two forms.","_n":"2ka3d","_k":"7ac1dbf3"},{"t":"6","why":"2 × 3 counts each centre once.","_n":"2la6d","_k":"6b6fa309"},{"t":"8","why":"2³.","_n":"2ma5d","_k":"e160a744"},{"t":"9","why":"3² isn’t the rule; it’s 2ⁿ.","_n":"2na8d","_k":"aff370a9"}]},"b":{"prompt":"A molecule has 4 chiral centres and no internal symmetry. What is the maximum number of stereoisomers?","options":[{"t":"4","why":"Each centre doubles the count.","_n":"2oa7d","_k":"0fd09393"},{"t":"8","why":"Each centre doubles the count: 2, 4, 8, …","_n":"2p9ad","_k":"7b4424e2"},{"t":"12","why":"2⁴ = 16.","_n":"2q99d","_k":"aaab04b7"},{"t":"16","why":"2⁴.","_n":"2r973","_k":"fffa6b70"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"How many chiral centres are in 2,3-dihydroxypropanal, HOCH₂–CH(OH)–CHO?","options":[{"t":"0","why":"C2 has four different groups.","_n":"2s963","_k":"f1a83647"},{"t":"1","why":"C2 has H, OH, CHO and CH₂OH. C1 is double-bonded; C3 has two H.","_n":"2t953","_k":"938db9d0"},{"t":"2","why":"The CHO carbon has a C=O.","_n":"2u943","_k":"311fcdd7"},{"t":"3","why":"A chiral centre has four groups on four single bonds. A double-bonded carbon has only three groups.","_n":"2v9b3","_k":"9f559cb2"}]},"b":{"prompt":"How many chiral centres are in CH₃–CH(OH)–CH(NH₂)–COOH?","options":[{"t":"0","why":"Both CH carbons qualify.","_n":"2w9a3","_k":"ab9aca38"},{"t":"1","why":"Check both CH carbons.","_n":"2x993","_k":"af249833"},{"t":"2","why":"C2 (H, NH₂, COOH, the rest of the chain) and C3 (H, OH, CH₃, the rest).","_n":"2y983","_k":"b21d3c7c"},{"t":"3","why":"The COOH carbon has a C=O.","_n":"2z9f3","_k":"a862e4c2"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Pure (+) rotates light +30°. A mixture of the (+) and (−) forms rotates it +15°. What percent of the mixture is (+)?","options":[{"t":"25%","why":"That’s the (−) part.","_n":"309e3","_k":"ec930598"},{"t":"75%","why":"A 50% excess of (+): 75% (+), 25% (−).","_n":"31913","_k":"0c7d9c8e"},{"t":"15%","why":"Rotation isn’t a percentage.","_n":"32923","_k":"44aad071"},{"t":"50%","why":"50% would give 0°.","_n":"33933","_k":"594c1c15"}]},"b":{"prompt":"Pure (−) rotates light −20°. A mixture rotates it −16°. What percent is (−)?","options":[{"t":"90%","why":"16 ÷ 20 = an 80% excess: 90% (−), 10% (+).","_n":"34943","_k":"bec726ca"},{"t":"16%","why":"Rotation isn’t a percentage.","_n":"35953","_k":"60d0d2f9"},{"t":"10%","why":"That’s the (+) part.","_n":"36963","_k":"72b99f79"},{"t":"80%","why":"That’s the excess; add half of the rest.","_n":"37973","_k":"cc0bfc85"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why butan-2-ol is chiral?","options":[{"t":"“Its boiling point is unusual.”","why":"Chirality is about shape.","_n":"38983","_k":"9a47df1d"},{"t":"“It contains an OH group.”","why":"Many alcohols with OH aren’t chiral.","_n":"39993","_k":"84988ee1"},{"t":"“C2 has four different groups (H, OH, CH₃, C₂H₅), so its mirror image can’t be rotated to sit on the original.”","why":"It names the four different groups and the mirror-image test.","_n":"3a9a3","_k":"38d3272e"},{"t":"“It has a mirror image.”","why":"Every molecule does.","_n":"3b234","_k":"2ff80010"}]},"b":{"prompt":"Which is the best explanation of why propan-2-ol is \u003cstrong>not\u003c/strong> chiral?","options":[{"t":"“Its OH is on the middle carbon.”","why":"The position alone doesn’t decide it.","_n":"3c224","_k":"cd204c84"},{"t":"“C2 carries two identical CH₃ groups, so its mirror image can be rotated onto the original.”","why":"A repeated group removes the handedness.","_n":"3d254","_k":"5aa1e343"},{"t":"“It has no mirror image.”","why":"Every molecule has a mirror image. It’s a different molecule only if it can’t be rotated onto the original.","_n":"3e244","_k":"8fcba514"},{"t":"“It has too few carbons.”","why":"Size isn’t the test.","_n":"3f274","_k":"d1175c30"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Stereoisomers P and Q of a molecule with two chiral centres differ at only one centre. They are…","options":[{"t":"The same compound","why":"One centre is different.","_n":"3g264","_k":"f352f13c"},{"t":"Structural isomers","why":"Same connections.","_n":"3h294","_k":"34229870"},{"t":"Diastereomers","why":"Only some centres differ, so they aren’t mirror images.","_n":"3i284","_k":"cf983cdf"},{"t":"Enantiomers","why":"Enantiomers are mirror images. If only some chiral centres differ, they’re diastereomers.","_n":"3j1b4","_k":"f33ba91c"}]},"b":{"prompt":"Stereoisomers R and S of a molecule with two chiral centres (no symmetry) differ at both centres. They are…","options":[{"t":"Structural isomers","why":"Same connections.","_n":"3k1a4","_k":"647551e2"},{"t":"The same compound","why":"Both centres differ.","_n":"3l9d3","_k":"a0dcd4a5"},{"t":"Enantiomers","why":"Mirror images differ at every centre.","_n":"3m9e3","_k":"3945562e"},{"t":"Diastereomers","why":"Enantiomers are mirror images. If only some chiral centres differ, they’re diastereomers.","_n":"3n9b3","_k":"4acddf45"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Two oils have the same formula, boiling point and density, but one smells of spearmint and the other of caraway. What best explains this?","options":[{"t":"One contains an impurity","why":"The difference is in the molecules themselves.","_n":"3o9c3","_k":"494fa269"},{"t":"They have different masses","why":"Same formula, same mass.","_n":"3p993","_k":"d1fecc24"},{"t":"They are structural isomers","why":"Same connections, same boiling point.","_n":"3q9a3","_k":"cf9ecf11"},{"t":"They are enantiomers, and smell receptors are chiral, so each fits a different receptor","why":"Only a chiral partner tells enantiomers apart.","_n":"3r973","_k":"f5dcf4c7"}]},"b":{"prompt":"Only one enantiomer of a pain reliever binds its target enzyme well. Why can handedness matter?","options":[{"t":"Enzymes only bind racemic mixtures","why":"They bind single molecules.","_n":"3s983","_k":"ffd17232"},{"t":"The other enantiomer has a different formula","why":"Same formula.","_n":"3ta53","_k":"77189e64"},{"t":"The other enantiomer doesn’t dissolve","why":"Same solubility in water.","_n":"3ua63","_k":"1f562ff6"},{"t":"The enzyme’s binding site is chiral, so only one hand fits all its contact points","why":"Like a glove, a chiral site fits only one hand.","_n":"3v2f4","_k":"94052c5e"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A drug’s inactive enantiomer is harmless. Which is a reasonable advantage of selling only the active enantiomer?","options":[{"t":"The same effect comes from about half the mass of drug","why":"In a racemic mixture, half the mass is the inactive form.","_n":"3w2e4","_k":"6890b6ac"},{"t":"It changes the drug’s formula","why":"Same formula.","_n":"3x2d4","_k":"3177c2fd"},{"t":"It makes the drug achiral","why":"One enantiomer is still chiral.","_n":"3y2c4","_k":"13b30537"},{"t":"It makes the drug boil at a different temperature","why":"Enantiomers have identical physical properties. They differ only toward polarized light and other chiral things.","_n":"3z2b4","_k":"2d2226a9"}]},"b":{"prompt":"A chemist makes lactic acid (2-hydroxypropanoic acid) from non-chiral starting materials, with no chiral catalyst. Predict the polarimeter reading of the product.","options":[{"t":"It can’t be measured, because lactic acid isn’t chiral","why":"C2 has four different groups.","_n":"402a4","_k":"06dd333d"},{"t":"The pure (−) value","why":"Nothing favours one hand.","_n":"41294","_k":"87925258"},{"t":"0°: a racemic mixture forms","why":"With no chiral influence, both hands form equally.","_n":"42284","_k":"1866ca89"},{"t":"The pure (+) value","why":"Nothing favours one hand.","_n":"43274","_k":"4f1f8554"}]}}]},"task":{"title":"Build a chiral alcohol","summary":"Build a chiral alcohol","statement":"\u003cp>Fill the four slots on the central carbon to build a molecule that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"ml-conds\">\u003cli>The molecular formula is C₅H₁₂O.\u003c/li>\u003cli>The central carbon is a chiral centre.\u003c/li>\u003cli>The molecule is an alcohol.\u003c/li>\u003c/ol>","groups":["H","CH3","C2H5","C3H7","OH","CH2OH","OCH3","Cl"],"start":{"w":"H","d":"OH","l":"CH3","r":"C2H5"},"checks":["Formula C₅H₁₂O","Chiral centre","An alcohol"],"tips":["Count carbons: the central C plus the groups must make 5.","Any repeated group kills the chiral centre.","OCH₃ makes an ether, not an alcohol."],"explainPrompt":"Explain why your molecule is chiral and how you would make its enantiomer.","vocab":"Use the words chiral centre, four different groups, mirror image and enantiomer.","success":"Your molecule works!","more":"Swap any two groups to get the other enantiomer: a different molecule that also counts."},"cards":[["Chiral centre","A carbon with four different groups on four single bonds."],["Chiral molecule","Its mirror image can’t be superimposed on it."],["Enantiomers","Non-superimposable mirror-image stereoisomers."],["Diastereomers","Stereoisomers that aren’t mirror images (including cis–trans pairs)."],["Swapping two groups","Turns a chiral centre into its enantiomer."],["Same for enantiomers","Boiling point, melting point, density, solubility in water."],["Different for enantiomers","Direction of rotating polarized light; fit with chiral receptors and enzymes."],["Racemic mixture","50 : 50 enantiomers; polarimeter reads 0°."],["Maximum stereoisomers","2ⁿ for \u003cem>n\u003c/em> chiral centres."],["Meso form","Has chiral centres but is identical to its mirror image (internal mirror plane)."],["Polarimeter","Measures how far a sample turns plane-polarized light."],["Why chirality matters","Smell, taste and drugs depend on fitting chiral sites in the body."]]}};</script>
