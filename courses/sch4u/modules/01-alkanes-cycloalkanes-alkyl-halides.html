.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;

}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 01: hero, C1 molecule view + atom buttons, C2 name chips, chain builder layout, reactions stations, task */
/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero */
.hx-stage{position:relative}
.hx-svg{display:block;width:100%;height:auto}
.hx-th{position:absolute;right:2%;top:4%;width:12%;max-width:64px;height:auto;opacity:0;transition:opacity .3s}
.hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.hx-name{font:400 1.15rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:1.6em}

/* C1 molecule view */
.c1-wrap{position:relative;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.c1-svg{display:block;width:100%;height:auto;touch-action:pan-y;font-family:var(--font-ui)}
.c1-ov{position:absolute;inset:0;pointer-events:none}
.c1-b{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:0;background:transparent;padding:0;pointer-events:auto;cursor:pointer}
.c1-b.h{width:26px;height:26px;margin:-13px 0 0 -13px}
.c1-b:hover{background:var(--hi-soft)}
.c1-b:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.c1-rot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.c1-rot .btn{min-width:40px;min-height:40px}
.c1-rot[hidden]{display:none}
.c1-static{display:block;width:100%;height:auto;font-family:var(--font-ui)}
canvas.ab-figc{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ab-fig{display:block;max-width:420px;margin:10px 0 0}
.ab-fig.sm{width:180px;max-width:100%;margin:0}
.mitem .ab-fig.sm{display:block;width:150px;max-width:none}

/* C2 name chips */
.c2-tape{font:400 1.35rem/1.3 var(--font-ui);margin:4px 0 10px;min-height:1.4em;overflow-wrap:anywhere}
.c2-name{font-weight:700;color:var(--ink)}
.c2-lab{display:block;font-size:.78rem;font-weight:700;color:var(--ink-2);margin:6px 0 2px}
.c2-tape .c2-lab{display:inline;font-size:.85rem}
.c2-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c2-row .c2-lab{flex-basis:100%;margin-bottom:0}
.c2-c{min-height:36px;min-width:36px}
.c2-act{margin-top:10px}

/* chain builder */
.ab-how{margin-top:0}
.ab-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"view read" "ctrl read";gap:16px 28px;align-items:start}
.ab-left{grid-area:view;min-width:0}.ab-ctrl{grid-area:ctrl;min-width:0}.ab-right{grid-area:read;min-width:0}
.ab-cap{font:400 clamp(1.15rem,2.6vw,1.6rem)/1.3 var(--font-ui);white-space:normal}
.ab-cap .chem{white-space:normal;overflow-wrap:anywhere}
.ab-views{margin-top:10px}
.ab-modes{margin-bottom:10px}
.ab-tgt{margin:6px 0 8px}
.ab-sl{display:block;margin:12px 0 6px}
.ab-shape{margin:6px 0}
.ab-msg{min-height:1.4em;margin:10px 0 6px;font-size:.92rem;color:var(--ink-2)}
.ab-subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ab-subs .chip{min-height:36px}
.ab-subs .chip:disabled,.c2-c:disabled{opacity:.45}
.ab-bp{display:inline-flex;align-items:center;gap:6px}
.ab-th{width:14px;height:40px;flex:none}
.ab-lab{margin-top:14px}
.ab-bpd > summary{font-weight:700;cursor:pointer;min-height:32px}
@media (min-width:700px){.ab-bpd > summary{display:none}}
.ab-prod{margin-top:8px}
.ab-prodh{margin:6px 0 4px;font-weight:700}
.ab-prods{display:flex;flex-wrap:wrap;gap:10px}
.ab-pr{margin:0;flex:1 1 180px;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet)}
.ab-pr figcaption{font-size:.95rem;text-align:center}
.ab-fb{margin-top:6px}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.ab-burner{display:block;width:100%;max-width:340px;height:auto;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.ab-outc{margin:12px 0 6px}
.ab-eq{font-size:1.15rem;margin:6px 0 10px;overflow-wrap:anywhere}
.ab-eq .chem{white-space:normal}
.ab-alks{margin:8px 0 12px}
.ab-plist{list-style:none;padding:0;margin:8px 0}
.ab-plist li{padding:4px 6px;border-radius:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.ab-plist li.on{background:var(--hi-soft)}
.ab-sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}

/* practice + task */
.ab-ord{margin:8px 0}
.ab-h4{margin:16px 0 4px}
.ab-conds{margin:6px 0 10px;padding-left:1.3em}
#tk-view{margin-bottom:10px}

@media (max-width:760px){
  .ab-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "read" "ctrl"}
  .rg.seg button{padding:.4em .6em}
}

es","hero":{"eq":"CH₄ → C₂H₆ → C₃H₈ → … → CₙH₂ₙ₊₂","eqSize":"sm","eqLabel":"C H 4, then C 2 H 6, then C 3 H 8, and so on, up to C n H 2n plus 2","headline":"One set of rules names millions of molecules","text":"Carbon forms four bonds and links to itself in chains and rings. \u003cstrong>Alkanes\u003c/strong> are chains joined only by single bonds: they’re \u003cstrong>saturated\u003c/strong>, with the formula CₙH₂ₙ₊₂. Close the chain into a ring and you have a \u003cstrong>cycloalkane\u003c/strong>; swap an H for a halogen and you have an \u003cstrong>alkyl halide\u003c/strong>. IUPAC names say exactly which structure you mean.","fig":{"html":"\u003cdiv class=\"hx\">\u003cdiv class=\"hx-stage\">\u003csvg class=\"hx-svg\" id=\"hx-svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"Ball-and-stick models: methane grows into ethane, propane and butane; butane becomes 2-methylpropane, then cyclobutane, then 1-chlorobutane\">\u003c/svg>\u003csvg class=\"hx-th\" id=\"hx-th\" viewBox=\"0 0 70 170\" aria-hidden=\"true\">\u003c/svg>\u003c/div>\u003cdiv class=\"hx-row\">\u003cp class=\"hx-name\" id=\"hx-name\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can name and draw straight-chain and branched alkanes using IUPAC rules.","I can name and draw cycloalkanes and alkyl halides.","I can write molecular formulas (CₙH₂ₙ₊₂, CₙH₂ₙ for rings) and recognize structural isomers.","I can explain boiling-point trends using chain length, branching and London dispersion forces.","I can write balanced equations for complete and incomplete combustion.","I can predict substitution products with halogens and count the different monosubstituted products."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Bonding and valence","goal":1,"prompt":"How many covalent bonds does a carbon atom form in a neutral molecule?","options":[{"t":"2","why":"That’s oxygen’s usual count.","_n":"0f8a","_k":"9101a018"},{"t":"3","why":"That’s nitrogen.","_n":"1f7a","_k":"85aa7b7e"},{"t":"4","why":"Carbon has 4 valence electrons and shares all four.","_n":"2f6a","_k":"9dad2f17"},{"t":"6","why":"Carbon has no lone pairs in alkanes.","_n":"3f5a","_k":"7049564e"}],"hints":["How many valence electrons does C have?","Four, and each bond shares one of them.","4 bonds."]},{"id":"w2","skill":"Bonding and valence","goal":3,"prompt":"How many H atoms are in CH₃–CH₂–CH₂–CH₃?","options":[{"t":"4","why":"That’s the number of C.","_n":"4f4a","_k":"a5d67dd0"},{"t":"8","why":"Add every subscript.","_n":"5f3a","_k":"3bf842f6"},{"t":"10","why":"3 + 2 + 2 + 3 = 10.","_n":"6f2a","_k":"f02eafc7"},{"t":"12","why":"Middle carbons bond to two carbons, so they keep only 2 H.","_n":"7f1a","_k":"3288ba56"}],"hints":["Add the H subscripts.","3 + 2 + 2 + 3.","10."]},{"id":"w3","skill":"Formulas","goal":3,"prompt":"What is the molecular formula of CH₃CH₂CH₂CH₂CH₃?","options":[{"t":"C₅H₁₁","why":"Count again: 12 H.","_n":"8f0a","_k":"480ce728"},{"t":"C₅H₁₂","why":"5 C; H = 3 + 2 + 2 + 2 + 3 = 12.","_n":"9136","_k":"a2da9241"},{"t":"CH₃","why":"That’s one group, not the molecule.","_n":"a146","_k":"fb709f65"},{"t":"C₅H₁₀","why":"No ring here.","_n":"b116","_k":"cbfc9d6b"}],"hints":["Count C, then count H.","CₙH₂ₙ₊₂ with \u003ci>n\u003c/i> = 5.","C₅H₁₂."]},{"id":"w4","skill":"Intermolecular forces","goal":4,"prompt":"Which force is the only one acting between methane molecules?","options":[{"t":"Dipole–dipole forces","why":"Methane has no net dipole.","_n":"c126","_k":"ae41dc75"},{"t":"Ionic attraction","why":"No ions in methane.","_n":"d176","_k":"1ad40a4f"},{"t":"London dispersion forces","why":"Methane is nonpolar.","_n":"e186","_k":"2fef041a"},{"t":"Hydrogen bonding","why":"H-bonds need H on N, O or F.","_n":"f156","_k":"8d683d0b"}],"hints":["Is methane polar?","No: C–H bonds are nearly nonpolar and the shape is symmetric.","London forces only."]},{"id":"w5","skill":"Intermolecular forces","goal":4,"prompt":"Two nonpolar molecules: one has 10 electrons, the other 42. Which boils higher?","options":[{"t":"Neither boils; nonpolar molecules sublime","why":"They boil, at different temperatures.","_n":"g166","_k":"2650d1cd"},{"t":"The one with 10 electrons","why":"Fewer electrons means weaker forces.","_n":"h0b6","_k":"f01d1af1"},{"t":"They boil at the same temperature","why":"London forces grow with size.","_n":"i0c6","_k":"7f56c979"},{"t":"The one with 42 electrons","why":"More electrons → larger, more easily distorted clouds → stronger London forces.","_n":"j0d5","_k":"ee092cf7"}],"hints":["What makes London forces stronger?","More electrons, more contact.","The 42-electron molecule."]},{"id":"w6","skill":"Balancing equations","goal":5,"prompt":"CH₄ + __O₂ → CO₂ + 2H₂O. What coefficient balances O₂?","options":[{"t":"1","why":"Only 2 O atoms on the left.","_n":"k0c5","_k":"f9174ede"},{"t":"2","why":"Right side O: 2 + 2 = 4, so 2 O₂.","_n":"l0b5","_k":"da09f8a7"},{"t":"3","why":"6 O atoms is too many.","_n":"m0a5","_k":"b1fb7f62"},{"t":"4","why":"4 O atoms = 2 O₂.","_n":"n095","_k":"78975c11"}],"hints":["Count O on the right.","CO₂ has 2, 2H₂O has 2.","4 O atoms = 2 O₂."]}],"refreshers":{"Bonding and valence":"C makes 4 bonds, H makes 1, halogens make 1. Count bonds on every atom to check a structure.","Formulas":"Count each element. Alkanes: CₙH₂ₙ₊₂ (C₄H₁₀); a ring removes 2 H.","Intermolecular forces":"Nonpolar molecules attract by London forces, which grow with the number of electrons and the contact area.","Balancing equations":"Balance C first, then H, then O last, because O₂ appears alone."}}},"explore":{"heading":"Chain builder","intro":"Build carbon skeletons and watch the name, formula and boiling point respond. Every structure you build is named the IUPAC way.","how":"Set the main chain length and the shape. Tap a carbon in the drawing (or Tab to it and press Enter), then tap a group to add it. Tap a group you added, then Remove, to take it off. Arrow keys move along the chain.","predictions":[{"id":"p1","prompt":"Butane boils at −1 °C. Move the end carbon onto C2 to make 2-methylpropane. Its boiling point will be…","options":[{"t":"the same","_n":"o085","_k":"b89aea89"},{"t":"lower","_n":"p075","_k":"a3a8ccae"},{"t":"it won’t boil","_n":"q065","_k":"60124f29"},{"t":"higher","_n":"r155","_k":"ece9f512"}],"explain":"Same formula, same number of electrons, but the compact shape touches its neighbours less, so London forces are weaker. 2-methylpropane boils at −12 °C."},{"id":"p2","prompt":"What is this molecule’s name?\u003ccanvas class=\"ab-figc\" data-fig=\"p2\" aria-hidden=\"true\">\u003c/canvas>\u003cspan class=\"vh\">A 5-carbon chain drawn with an L-shaped bend at the last carbon: CH₃–CH₂–CH₂–CH₂ with a CH₃ drawn below the last CH₂.\u003c/span>","options":[{"t":"pentane","_n":"s145","_k":"6ec59139"},{"t":"2-methylbutane","_n":"t075","_k":"55e120dd"},{"t":"butane","_n":"u085","_k":"e648910f"},{"t":"1-methylbutane","_n":"v095","_k":"0359fa89"}],"explain":"A bend isn’t a branch. The longest continuous chain has 5 carbons."},{"id":"p3","prompt":"Start: hexane, C₆H₁₄. Join the two ends into a ring. How many H atoms does cyclohexane have?","options":[{"t":"6","_n":"w0a5","_k":"1082c934"},{"t":"10","_n":"x035","_k":"f86eaea5"},{"t":"12","_n":"y045","_k":"9643985c"},{"t":"14","_n":"z055","_k":"ed224159"}],"explain":"Each end carbon gives up one H to make the new C–C bond: C₆H₁₂."},{"id":"p4","prompt":"Start: propane. Replace \u003cstrong>one\u003c/strong> H with Cl. How many different products are possible?","options":[{"t":"1","_n":"10065","_k":"4f5a4b49"},{"t":"2","_n":"110f5","_k":"da89fd4f"},{"t":"3","_n":"12105","_k":"9dceb29a"},{"t":"8","_n":"13815","_k":"b1fdd8f5"}],"explain":"There are 8 H but only 2 kinds of position: end or middle."}],"chalIntro":"Use the chain builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Build \u003cstrong>2,3-dimethylpentane\u003c/strong>.","why":"CH₃CH(CH₃)CH(CH₃)CH₂CH₃: a 5-carbon chain with methyl groups on C2 and C3. A drawing numbered 3,4 from the other end is the same molecule.","hints":["Start with 5 carbons in a row: pentane.","Number it 1 to 5. Put methyls on C2 and C3.","CH₃CH(CH₃)CH(CH₃)CH₂CH₃."]},{"id":"tc2","goal":[1,2],"prompt":"In \u003cstrong>Name it\u003c/strong> mode, structure 1 is CH₃CH(Cl)CH(CH₃)CH₂CH₃. Assemble its name with the chips.","why":"2-chloro-3-methylpentane: the longest chain has 5 carbons, numbering from the Cl end gives {2, 3}, and chloro comes before methyl.","hints":["Longest chain first.","Number from the end nearer a substituent: Cl lands on C2.","2-chloro-3-methylpentane."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"In the \u003cstrong>Boiling-point lab\u003c/strong>: among the five isomers of C₆H₁₄, build the one that boils lowest \u003cstrong>while having only one carbon that carries branches\u003c/strong>.","why":"2,2-dimethylbutane, 50 °C: the most ball-shaped C₆H₁₄ with one branch point.","hints":["More compact means lower boiling point.","Put both methyl groups on the same carbon.","2,2-dimethylbutane, 50 °C: the most ball-shaped C₆H₁₄ with one branch point."]}],"blocks":[{"title":"Why the shape matters","html":"\u003cp>A name is a set of instructions for a structure; formula patterns tell families apart; the same formula can hide different shapes with different boiling points.\u003c/p>"}]},"part3":{"slug":"reactions","name":"Reactions","heading":"Reactions of alkanes","intro":"Alkanes react in two main ways. At Station 1, burn propane with more or less oxygen. At Station 2, swap one H for a halogen and count the different products. Each station has a “Check it with data” panel.","s1":{"title":"Station 1: Combustion","intro":"A burner with propane and an \u003cstrong>O₂ supply\u003c/strong> slider, from limited to plenty. Watch the products change, and check tha u003cstrong>two\u003c/strong> different monochloro products?","options":[{"t":"2,3-dimethylbutane","why":"In 2,3-dimethylbutane all four CH₃ groups are equivalent, and so are the two CH. Two environments → two products.","_n":"1o945","_k":"344022b8"},{"t":"2,2-dimethylbutane","why":"That gives 3: the three methyls on C2, C3, C4.","_n":"1p935","_k":"39baba5b"},{"t":"hexane","why":"That gives 3.","_n":"1q925","_k":"6e95e10f"},{"t":"2-methylpentane","why":"That gives 5.","_n":"1r995","_k":"5c7b6037"},{"t":"3-methylpentane","why":"That gives 4.","_n":"1s985","_k":"79c81f1b"}],"hints":["Look for the most symmetric isomer.","In 2,3-dimethylbutane all four CH₃ groups are equivalent, and so are the two CH.","Two environments → two products."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Adrian","how":"","instruction":"Adrian made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Name CH₃CH₂CH(CH₃)CH₂CH₂CH₃.","steps":["The longest chain has 6 carbons, so the parent is hexane.","The branch is a CH₃ group: methyl.","Number from the right end: the methyl is on C4.","Write the locant before the prefix: 4-methyl.","Name: 4-methylhexane."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier.","Follows from step 3."],"fixes":[{"t":"Name it 3-methylpentane.","why":"Wrong parent.","_n":"1t975","_k":"cf41474b"},{"t":"Number from the right; the name 4-methylhexane is correct.","why":"4 > 3: lowest locant wins.","_n":"1u965","_k":"9f032df7"},{"t":"The parent is pentane.","why":"The chain has 6 carbons.","_n":"1v8d5","_k":"6bfe9b5d"},{"t":"Number from the left so the methyl gets the lower locant: 3-methylhexane.","why":"Number from the end that gives the substituents the lowest set of locants.","_n":"1w8c5","_k":"02214984"}],"hints":["Which end is closer to the branch?","From the left, the methyl is on C3.","3-methylhexane."]},{"id":"e2","goal":5,"task":"Balance the complete combustion of butane.","steps":["C₄H₁₀ + O₂ → CO₂ + H₂O","Balance C: C₄H₁₀ + O₂ → 4CO₂ + H₂O","Balance H: C₄H₁₀ + O₂ → 4CO₂ + 10H₂O","Balance O: 8 + 10 = 18 O atoms, so 9O₂.","C₄H₁₀ + 9O₂ → 4CO₂ + 10H₂O"],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Follows from step 3.","Follows from step 3."],"fixes":[{"t":"Use 10H₂ instead of 10H₂O.","why":"In combustion, every H ends up in H₂O. Count H atoms, then halve to get H₂O.","_n":"1x0f5","_k":"6432be61"},{"t":"10 H atoms make 5 H₂O. Then O = 8 + 5 = 13 atoms: 2C₄H₁₀ + 13O₂ → 8CO₂ + 10H₂O.","why":"In combustion, every H ends up in H₂O. Count H atoms, then halve to get H₂O.","_n":"1y105","_k":"5be05b8e"},{"t":"Step 3 is correct.","why":"10H₂O has 20 H atoms.","_n":"1z115","_k":"07b2ca6f"},{"t":"Balance O first.","why":"O₂ is balanced last.","_n":"20125","_k":"f051cb3f"}],"hints":["Each H₂O has 2 H.","10 ÷ 2 = 5 H₂O.","Then 13/2 O₂; double to whole numbers."]},{"id":"e3","goal":6,"task":"How many different monochloro products can 2-methylbutane give?","steps":["2-methylbutane is CH₃CH(CH₃)CH₂CH₃.","Cl replaces one H at a time.","There are 12 H atoms, so 12 different products.","So 12 monochloro isomers form."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Follows from step 3."],"fixes":[{"t":"3 products: one per carbon type.","why":"The two CH₃ groups on C2 are one environment, but the end CH₃ is another.","_n":"21135","_k":"481cff0b"},{"t":"Group equivalent H: the two CH₃ on C2, the CH, the CH₂ and the end CH₃. That’s 4 environments, so 4 products.","why":"Equivalent positions give the same product. Propane has 8 H but only 2 different environments, so 2 products.","_n":"22145","_k":"f60d0934"},{"t":"12 products is correct.","why":"Equivalent positions give the same product. Propane has 8 H but only 2 different environments, so 2 products.","_n":"23155","_k":"a74a5a9b"},{"t":"1 product: all H are the same.","why":"That’s 2,2-dimethylpropane.","_n":"24165","_k":"3684a257"}],"hints":["Would swapping either methyl on C2 give the same molecule?","Yes: they’re equivalent.","4."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the chain builder: that bends aren’t branches, or that branching lowers the boiling point?"},{"id":"j2","q":"In your own words, explain why a straight chain boils higher than a branched isomer."},{"id":"j3","q":"Explain to a friend the order you follow to name a branched alkyl halide."},{"id":"j4","q":"Which naming rule still trips you up? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Name CH₃CH(CH₃)CH(CH₃)CH₃.","options":[{"t":"1,2,3-trimethylpropane","why":"A methyl on C1 extends the chain.","_n":"25075","_k":"cfa95868"},{"t":"2,3-methylbutane","why":"Two methyls need the prefix di-.","_n":"26085","_k":"f279a50c"},{"t":"2-methyl-3-methylbutane","why":"Repeated prefixes combine with di-.","_n":"27095","_k":"815323e4"},{"t":"2,3-dimethylbutane","why":"4-carbon chain, methyls on C2 and C3.","_n":"28085","_k":"48731a89"}]},"b":{"prompt":"Name CH₃C(CH₃)₂CH₂CH₃.","options":[{"t":"3,3-dimethylbutane","why":"Number from the end nearer the branches.","_n":"290b5","_k":"e871cd15"},{"t":"2,2-dimethylbutane","why":"Both methyls on C2 of a butane chain.","_n":"2a0a5","_k":"4f9238a1"},{"t":"2-dimethylbutane","why":"Each methyl needs its own locant: 2,2-.","_n":"2b055","_k":"8b3a0ce9"},{"t":"2-ethyl-2-methylpropane","why":"The ethyl is part of the longest chain.","_n":"2c045","_k":"9058f471"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"What is the molecular formula of cyclopentane?","options":[{"t":"C₅H₁₂","why":"That’s pentane.","_n":"2d075","_k":"216a09d5"},{"t":"C₆H₁₂","why":"Cyclopentane has 5 carbons.","_n":"2e065","_k":"52e4465d"},{"t":"C₅H₈","why":"That’s two H too few.","_n":"2f115","_k":"0b51a3ca"},{"t":"C₅H₁₀","why":"CₙH₂ₙ for a ring.","_n":"2g105","_k":"e1920f29"}]},"b":{"prompt":"What is the molecular formula of an open-chain alkane with 8 carbons?","options":[{"t":"C₈H₁₆","why":"That’s the ring formula.","_n":"2h034","_k":"287ad0ea"},{"t":"C₈H₁₄","why":"Too few H for a saturated chain.","_n":"2i044","_k":"43b5602c"},{"t":"C₈H₂₀","why":"2(8) + 2 = 18.","_n":"2j014","_k":"19a23a9a"},{"t":"C₈H₁₈","why":"CₙH₂ₙ₊₂.","_n":"2k024","_k":"d4be335b"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Name CH₃CHClCH₂Br.","options":[{"t":"3-bromo-2-chloropropane","why":"{1, 2} is lower than {2, 3}.","_n":"2l074","_k":"0575f0aa"},{"t":"1-chloro-2-bromopropane","why":"Cl is on the middle carbon.","_n":"2m084","_k":"25c928d4"},{"t":"2-chloro-1-bromopropane","why":"Alphabetical: bromo before chloro.","_n":"2n054","_k":"5b0d10ba"},{"t":"1-bromo-2-chloropropane","why":"From the CH₂Br end the locants are {1, 2}; bromo comes first alphabetically.","_n":"2o064","_k":"b1b9531b"}]},"b":{"prompt":"Name a 5-carbon ring with Br on one carbon and CH₃ two carbons away.","options":[{"t":"1-bromo-3-methylpentane","why":"It’s a ring: cyclopentane.","_n":"2p0b4","_k":"4ab934fb"},{"t":"1-bromo-3-methylcyclopentane","why":"Locants {1, 3} either way; the alphabetically first prefix gets 1.","_n":"2q0c4","_k":"4c4c8770"},{"t":"3-bromo-1-methylcyclopentane","why":"Tie in locants: bromo comes first, so it gets C1.","_n":"2re14","_k":"c22b21a5"},{"t":"1-methyl-3-bromocyclopentane","why":"Prefixes go alphabetically.","_n":"2se24","_k":"c30dea2b"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Order by boiling point, lowest first: hexane, 2-methylpentane, 2,2-dimethylbutane.","options":[{"t":"hexane \u003c 2-methylpentane \u003c 2,2-dimethylbutane","why":"That reverses the branching effect.","_n":"2tdf4","_k":"538f3b47"},{"t":"2,2-dimethylbutane \u003c 2-methylpentane \u003c hexane","why":"Same formula; more compact means weaker London forces.","_n":"2ue04","_k":"edc41ca8"},{"t":"2-methylpentane \u003c 2,2-dimethylbutane \u003c hexane","why":"More branching lowers it further.","_n":"2vdd4","_k":"0d27f177"},{"t":"All three boil at the same temperature.","why":"Same formula, different shapes.","_n":"2wde4","_k":"763eed87"}]},"b":{"prompt":"Order by boiling point, lowest first: pentane, 2-methylbutane, 2,2-dimethylpropane.","options":[{"t":"2,2-dimethylpropane \u003c 2-methylbutane \u003c pentane","why":"10 °C, 28 °C, 36 °C.","_n":"2xdb4","_k":"adc1f0fc"},{"t":"All the same.","why":"Shapes differ.","_n":"2ydc4","_k":"ee8be877"},{"t":"2-methylbutane \u003c 2,2-dimethylpropane \u003c pentane","why":"The most branched is lowest.","_n":"2zd94","_k":"96af28fe"},{"t":"pentane \u003c 2-methylbutane \u003c 2,2-dimethylpropane","why":"Branching makes the molecule compact: less surface contact, weaker London forces, lower boiling point.","_n":"30da4","_k":"51dc26cb"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"How many different monochloro products can 3-methylpentane give?","options":[{"t":"3","why":"The branch CH₃ is a separate environment.","_n":"31474","_k":"d75d22ec"},{"t":"4","why":"C1/C5, C2/C4, C3 and the methyl branch.","_n":"32464","_k":"8ec2c3c1"},{"t":"6","why":"C1 and C5 are equivalent; so are C2 and C4.","_n":"33494","_k":"54e7f710"},{"t":"14","why":"That counts H atoms, not environments.","_n":"34484","_k":"5eff9b6e"}]},"b":{"prompt":"How many different monochloro products can 2,2-dimethylbutane give?","options":[{"t":"2","why":"The C4 methyl isn’t equivalent to the C2 methyls.","_n":"354b4","_k":"0406c90d"},{"t":"3","why":"The three CH₃ on C2, the CH₂ at C3, the CH₃ at C4.","_n":"364a4","_k":"2d39b8f2"},{"t":"4","why":"The three methyls on C2 are equivalent.","_n":"374d4","_k":"037f3129"},{"t":"14","why":"Equivalent positions give the same product. Propane has 8 H but only 2 different environments, so 2 products.","_n":"384c4","_k":"53255d01"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Balance the complete combustion of pentane, C₅H₁₂, with the smallest whole numbers. What is the coefficient of O₂?","options":[{"t":"5","why":"That counts only the O in CO₂.","_n":"394f4","_k":"33c0ac65"},{"t":"8","why":"C₅H₁₂ + 8O₂ → 5CO₂ + 6H₂O: O = 10 + 6 = 16 atoms.","_n":"3a4e4","_k":"b2e571a9"},{"t":"11","why":"That uses 12H₂O; 12 H atoms make 6 H₂O.","_n":"3bd53","_k":"7adc5348"},{"t":"16","why":"16 O \u003cstrong>atoms\u003c/strong> = 8 O₂ molecules.","_n":"3cd63","_k":"7a76e9b6"}]},"b":{"prompt":"Balance the complete combustion of hexane, C₆H₁₄, with the smallest whole numbers. What is the coefficient of O₂?","options":[{"t":"19/2","why":"Correct ratio, but the question asks for whole numbers.","_n":"3dd73","_k":"217b6b24"},{"t":"12","why":"That counts only the O in CO₂.","_n":"3ed83","_k":"5aca943e"},{"t":"13","why":"That uses 14H₂O for one hexane; 14 H atoms make 7 H₂O.","_n":"3fd93","_k":"74a55050"},{"t":"19","why":"2C₆H₁₄ + 19O₂ → 12CO₂ + 14H₂O.","_n":"3gda3","_k":"5e1af1ce"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why pentane (36 °C) boils higher than 2,2-dimethylpropane (10 °C)?","options":[{"t":"Both are C₅H₁₂ with the same number of electrons, but the straight chain has more surface contact with its neighbours, so its London forces are stronger.","why":"Branching makes the molecule compact: less surface contact, weaker London forces, lower boiling point.","_n":"3hdb3","_k":"57111c4a"},{"t":"Pentane has more atoms.","why":"Same formula, same atoms.","_n":"3idc3","_k":"973645cd"},{"t":"Pentane forms hydrogen bonds.","why":"No H on N, O or F.","_n":"3jcd3","_k":"69cd6584"},{"t":"Branching makes the covalent bonds stronger.","why":"Boiling separates molecules; it doesn’t break covalent bonds.","_n":"3kce3","_k":"384e2fec"}]},"b":{"prompt":"Which is the best explanation of why octane boils higher than butane?","options":[{"t":"Octane is polar.","why":"Both are nonpolar.","_n":"3ldb3","_k":"16fb0659"},{"t":"Octane forms hydrogen bonds.","why":"No O–H, N–H or F–H.","_n":"3mda3","_k":"fcd63747"},{"t":"Octane’s C–C bonds are stronger.","why":"Boiling doesn’t break covalent bonds.","_n":"3nd93","_k":"822bfca8"},{"t":"Octane has more electrons and a longer chain, so its London forces are stronger.","why":"More electrons → larger, more easily distorted clouds → stronger London forces.","_n":"3od83","_k":"433ce303"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which equation correctly shows incomplete combustion of methane producing carbon monoxide?","options":[{"t":"CH₄ + O₂ → CO + 2H₂","why":"Hydrogen ends up in water.","_n":"3pdf3","_k":"cb91ea61"},{"t":"2CH₄ + 3O₂ → 2CO + 4H₂O","why":"C 2 = 2; H 8 = 8; O 6 = 2 + 4.","_n":"3qde3","_k":"8fc37b2c"},{"t":"CH₄ + 2O₂ → CO₂ + 2H₂O","why":"That’s complete combustion.","_n":"3rdd3","_k":"d3ac3049"},{"t":"2CH₄ + 3O₂ → 2CO + 2H₂O","why":"H isn’t balanced: 8 vs 4.","_n":"3sdc3","_k":"d2925553"}]},"b":{"prompt":"Which equation correctly shows incomplete combustion of propane producing soot (C)?","options":[{"t":"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O","why":"That’s complete combustion.","_n":"3td33","_k":"0029c930"},{"t":"C₃H₈ + 2O₂ → 3C + 4H₂O","why":"O 4 = 4.","_n":"3ud23","_k":"377e9c83"},{"t":"C₃H₈ + O₂ → 3C + 4H₂","why":"In combustion, every H ends up in H₂O. Count H atoms, then halve to get H₂O.","_n":"3v594","_k":"90daed46"},{"t":"C₃H₈ + 2O₂ → 3C + 2H₂O","why":"H isn’t balanced: 8 vs 4.","_n":"3w5a4","_k":"96e68efb"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A furnace burning natural gas (methane) has a partly blocked air intake. Which product becomes more likely, and why does it matter?","options":[{"t":"CO, because less O₂ means incomplete combustion; CO is toxic, which is why homes need CO alarms","why":"Carbon monoxide is colourless, odourless and toxic. This is why homes with fuel-burning appliances need CO alarms.","_n":"3x574","_k":"6462dead"},{"t":"H₂, because H can’t find O","why":"In combustion, every H ends up in H₂O. Count H atoms, then halve to get H₂O.","_n":"3y584","_k":"ea9de3c8"},{"t":"More CO₂, because the flame gets hotter","why":"Less O₂ can’t make more fully oxidized carbon.","_n":"3z5d4","_k":"97eb190f"},{"t":"Nothing changes; combustion always gives CO₂ and H₂O","why":"Only with enough O₂.","_n":"405e4","_k":"0c1bf8f5"}]},"b":{"prompt":"A camp stove burning propane leaves black soot on the bottom of a pot. What does this show?","options":[{"t":"Hydrogen burned to soot.","why":"H forms water; soot is carbon.","_n":"415b4","_k":"e093e607"},{"t":"Incomplete combustion: there wasn’t enough O₂, so some carbon formed as solid C","why":"Too little O₂: CO and/or C (soot) form, plus H₂O.","_n":"425c4","_k":"6b4cc31a"},{"t":"Complete combustion makes soot.","why":"Complete combustion gives only CO₂ and H₂O.","_n":"43514","_k":"53d903c2"},{"t":"The propane contained soot.","why":"The carbon came from the propane molecules.","_n":"44524","_k":"cefaea5e"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"CFC-12, a refrigerant phased out under the 1987 Montreal Protocol (signed in Montreal), is dichlorodifluoromethane. What is its formula?","options":[{"t":"CCl₂F","why":"Carbon needs four bonds.","_n":"45df4","_k":"bf8b2c10"},{"t":"CH₂Cl₂F₂","why":"Carbon can’t make six bonds.","_n":"46de4","_k":"1555a0e0"},{"t":"C₂Cl₂F₂","why":"Methane has one carbon.","_n":"47e14","_k":"3faf74e6"},{"t":"CCl₂F₂","why":"One carbon with two Cl and two F: all four bonds used.","_n":"48e04","_k":"4ed3f3ab"}]},"b":{"prompt":"Its replacement, 1,1,1,2-tetrafluoroethane, has which structure?","options":[{"t":"CF₃CH₂F","why":"Three F on C1 and one F on C2.","_n":"49db4","_k":"e30e2ebb"},{"t":"CF₂HCF₂H","why":"That’s 1,1,2,2-tetrafluoroethane.","_n":"4ada4","_k":"36d796c3"},{"t":"C₂F₄","why":"That’s tetrafluoroethene, with a C=C.","_n":"4bdd4","_k":"a02b5995"},{"t":"CH₃CF₃","why":"That’s only three F.","_n":"4cdc4","_k":"acaa176b"}]}}]},"task":{"title":"Three-product heptane","summary":"Three-product heptane","statement":"\u003cp>Build an isomer of C₇H₁₆ that meets every condition, then name it. Can you find all the answers?\u003c/p>\u003col class=\"ab-conds\">\u003cli>Its formula is C₇H₁₆.\u003c/li>\u003cli>It gives exactly 3 different monochloro products.\u003c/li>\u003cli>Its IUPAC parent chain has 5 carbons.\u003c/li>\u003cli>You named it correctly.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Build with carbon and hydrogen only: set the main chain, then tap a carbon and add methyl or ethyl branches. Name it with the chips. The IUPAC name of your structure appears after you check a name.\u003c/p>","checks":["Formula C₇H₁₆","Exactly 3 monochloro products","Parent chain of 5 carbons","Named correctly"],"tips":["Count all carbons, including branches.","Fewer environments means more symmetry: aim for a molecule that looks the same from several directions.","Find the longest path through the skeleton; it must be 5.","Number for the lowest locants; list prefixes alphabetically."],"explainPrompt":"Explain how symmetry in your molecule reduces the number of monochloro products.","vocab":"Use the words equivalent, environment, parent chain and substitution.","more":"There’s more than one answer. Can you find all of them?","after3":"2,2,3-trimethylbutane also gives 3 products, but its parent chain is butane. Symmetry is what keeps the count low."},"cards":[["Alkane","Saturated hydrocarbon, single bonds only: CₙH₂ₙ₊₂ (e.g. C₄H₁₀)."],["Cycloalkane","A ring of carbons with single bonds: CₙH₂ₙ (cyclohexane C₆H₁₂)."],["Alkyl halide","An alkane with H replaced by F, Cl, Br or I (prefixes fluoro, chloro, bromo, iodo)."],["Longest chain","The parent name comes from the longest continuous chain; bends aren’t branches."],["Lowest locants","Number from the end that gives substituents the lowest set of numbers."],["Alphabetical order","Prefixes listed alphabetically, ignoring di-, tri-: 2-chloro-3-methylpentane."],["Structural isomers","Same molecular formula, different structure (butane and 2-methylpropane)."],["Branching and boiling point","More branching → more compact → weaker London forces → lower boiling point."],["Complete combustion","Alkane + O₂ → CO₂ + H₂O (C₃H₈ + 5O₂ → 3CO₂ + 4H₂O)."],["Incomplete combustion","Too little O₂: CO and/or C (soot) form, plus H₂O."],["Substitution","One H replaced by another atom: CH₄ + Cl₂ → CH₃Cl + HCl (light)."],["Counting products","Monosubstituted products = number of different H environments."]]}};</script>
