sub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"n C H 2 double bond C H 2 gives a chain: C H 2, C H 2 in brackets, repeated n times","headline":"Open the double bond, join the chain","text":"A \u003cstrong>monomer\u003c/strong> with a C=C can open its double bond and link to the next monomer, and the next, thousands of times. The result is an \u003cstrong>addition polymer\u003c/strong>: shopping bags, pipes, foam cups, non-stick coatings. Nothing is lost along the way, which is also why these chains are so hard to break down.","fig":{"html":"\u003cdiv class=\"ap-hx\">\u003csvg class=\"ap-hx-svg\" id=\"ap-hx-svg\" role=\"img\" aria-label=\"Five ethene molecules float in a row. An initiator touches the first one: its C=C opens, and the freed electron pair reaches toward the next ethene. The zip runs down the row, each C=C opening and a new C–C bond forming. The finished chain has brackets around one –CH₂–CH₂– unit and the subscript n. Monomers in: 5. Atoms lost: 0.\">\u003c/svg>\u003cdiv class=\"ap-hx-row\">\u003cp class=\"ap-hx-cap\" id=\"ap-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ap-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003cp class=\"ap-hx-ctr\" id=\"ap-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003c/div>"}},"goals":["I can identify monomers that can undergo addition polymerization (they have a C=C).","I can draw the repeating unit of an addition polymer from its monomer, and find the monomer from a polymer section.","I can explain that addition polymerization loses no atoms, and use this to relate monomer and polymer masses.","I can explain how branching and side groups affect a polymer’s density, stiffness and melting point.","I can evaluate the environmental impact of addition polymers and propose a personal course of action."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Alkene structure","goal":1,"prompt":"Which molecule contains a carbon–carbon double bond?","options":[{"t":"CH₂=CHCH₃","why":"Propene: the = shows the double bond.","_n":"0b83","_k":"58dc0d36"},{"t":"CH₃CH₂OH","why":"Ethanol: C–O single bond, no C=C.","_n":"1b53","_k":"e02badc9"},{"t":"CH₃CH₂CH₃","why":"Propane has only single bonds.","_n":"2b63","_k":"356c810d"},{"t":"CH₃CH₂Cl","why":"Chloroethane: all single bonds.","_n":"3bb3","_k":"b30c97bc"}],"hints":["Look for ‘=’.","Between two carbons.","Propene."]},{"id":"w2","skill":"Alkene structure","goal":2,"prompt":"What is the name of CH₂=CHCl?","options":[{"t":"Chloropropene","why":"Two carbons.","_n":"4bc3","_k":"4a006d62"},{"t":"Chloroethane","why":"-ane means single bonds.","_n":"5b93","_k":"e8da2be1"},{"t":"Chloroethene","why":"Two-carbon alkene with Cl.","_n":"6ba3","_k":"08e9a23d"},{"t":"Dichloroethene","why":"Only one Cl.","_n":"7af3","_k":"2ce146e1"}],"hints":["How many carbons?","Two, with a double bond: ethene.","Chloroethene."]},{"id":"w3","skill":"Addition reactions","goal":3,"prompt":"Ethene adds hydrogen: CH₂=CH₂ + H₂ → ?","options":[{"t":"CH₂=CH₂ (no reaction)","why":"Alkenes react readily by addition.","_n":"8b03","_k":"0ed556d9"},{"t":"CH₃CH₃","why":"Both atoms add across the double bond.","_n":"956f","_k":"8809f517"},{"t":"CH₃CH₃ + H₂O","why":"Addition makes only one product: nothing is released.","_n":"a55f","_k":"65a38f8b"},{"t":"CH₄ + CH₄","why":"The C–C bond stays.","_n":"b58f","_k":"269ef70d"}],"hints":["What happens to the double bond in an addition?","It opens; each carbon gains an atom.","Ethane."]},{"id":"w4","skill":"Addition reactions","goal":3,"prompt":"In an addition reaction, what happens to the number of atoms?","options":[{"t":"Atoms are destroyed","why":"Atoms are conserved.","_n":"c57f","_k":"26c15b2f"},{"t":"A water molecule is lost","why":"That’s condensation. Addition makes only one product: nothing is released.","_n":"d5af","_k":"d6f47182"},{"t":"All atoms of both reactants end up in one product","why":"In an addition, the C=C opens and atoms add to each carbon; nothing is released.","_n":"e59f","_k":"dcdc9220"},{"t":"Some carbon is lost as CO₂","why":"That’s combustion.","_n":"f5cf","_k":"56a8f0b6"}],"hints":["Compare with condensation.","Addition makes only one product.","All atoms end up in the product."]},{"id":"w5","skill":"Molar mass","goal":3,"prompt":"Use C = 12 and H = 1. What is the molar mass of ethene, C₂H₄?","options":[{"t":"30 g/mol","why":"That’s C₂H₆.","_n":"g5bf","_k":"2b83804a"},{"t":"16 g/mol","why":"That’s CH₄.","_n":"h5ef","_k":"3b03f1d2"},{"t":"28 g/mol","why":"2(12) + 4(1).","_n":"i5df","_k":"adce41b9"},{"t":"26 g/mol","why":"That’s C₂H₂.","_n":"je4e","_k":"9af3cd68"}],"hints":["Multiply each atom by its count.","24 + 4.","28 g/mol."]},{"id":"w6","skill":"Molar mass","goal":3,"prompt":"A chain has molar mass 2800 g/mol and is made of units of 28 g/mol. How many units?","options":[{"t":"10","why":"28 × 10 = 280.","_n":"ke5e","_k":"ab1357b4"},{"t":"100","why":"2800 ÷ 28.","_n":"le6e","_k":"7ff7e563"},{"t":"1000","why":"Decimal slip: 28 × 1000 = 28 000.","_n":"me7e","_k":"95fdf0d4"},{"t":"2828","why":"Divide total by unit mass.","_n":"ne8e","_k":"0bd96130"}],"hints":["Total ÷ one unit.","2800 ÷ 28.","100."]}],"refreshers":{"Alkene structure":"Alkenes contain C=C; their names end in -ene. Halo prefixes don’t count as carbons.","Addition reactions":"In an addition, the C=C opens and atoms add to each carbon; nothing is released.","Molar mass":"Add atomic masses; to count units in a chain, divide the chain’s mass by one unit’s mass."}}},"explore":{"heading":"Polymer zipper","intro":"Pick a monomer and zip it into a chain. Bracket the repeating unit and watch what changes, and what doesn’t.","how":"Choose a mode and a monomer, set the chain length, then press \u003cstrong>Zip it\u003c/strong> (or use Play, Step and Back). Drag the two bracket marks \u003cstrong>[ ]\u003c/strong> along the finished chain, or tap one and use the arrow keys, to enclose one repeating unit.","uses":"C₂H₄ 28, C₃H₆ 42, C₂H₃Cl 62.5, C₈H₈ 104 g/mol","modes":[{"id":"build","t":"Build"},{"id":"co","t":"Copolymer"},{"id":"pack","t":"Pack"}],"predictions":[{"id":"p1","prompt":"Ethene, 6 units. When 6 ethene molecules zip together, what else is produced?","options":[{"t":"5 water molecules","_n":"oe9e","_k":"225e8da4"},{"t":"6 hydrogen molecules","_n":"peae","_k":"06df5443"},{"t":"6 water molecules","_n":"qebe","_k":"66751aa1"},{"t":"nothing","_n":"rdce","_k":"d4461967"}],"explain":"Addition polymerization has no by-product."},{"id":"p2","prompt":"Propene. Which is the repeating unit of poly(propene)?","options":[{"t":"–CH₂–CH(CH₃)–","_n":"sdde","_k":"5682a011"},{"t":"–CH₂–CH₂–","_n":"teae","_k":"421698bf"},{"t":"–CH₂–CH₂–CH₂–","_n":"ue9e","_k":"004a0a56"},{"t":"–CH=CH(CH₃)–","_n":"ve8e","_k":"71029cd8"}],"explain":"Only the two C=C carbons join the backbone."},{"id":"p3","prompt":"Pack mode: polyethene chains, linear vs branched. Which packs more tightly?","options":[{"t":"both the same","_n":"we7e","_k":"16f8e2b6"},{"t":"it depends on the chain length only","_n":"xeee","_k":"5282378f"},{"t":"linear","_n":"yede","_k":"434d4dd0"},{"t":"branched","_n":"zece","_k":"57d8fc0f"}],"explain":"Branches act like elbows, keeping chains apart."},{"id":"p4","prompt":"Chloroethene, 100 units. What is the chain’s molar mass? (Use C₂H₃Cl = 62.5 g/mol.)","options":[{"t":"6232 g/mol","_n":"10ebe","_k":"7bd37413"},{"t":"62.5 g/mol","_n":"11e2e","_k":"003c8472"},{"t":"6250 g/mol","_n":"12e1e","_k":"d7cdd2ad"},{"t":"625 g/mol","_n":"13e8f","_k":"0e09ce73"}],"explain":"No atoms are lost, so just multiply."}],"chalIntro":"Use the zipper to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Make a polymer whose repeating unit contains chlorine, and bracket one repeating unit.","why":"Chloroethene, CH₂=CHCl, makes poly(chloroethene) (PVC). One repeating unit is two backbone carbons: –CH₂–CHCl–.","hints":["Which monomer has Cl?","Chloroethene, CH₂=CHCl.","Bracket –CH₂–CHCl–."]},{"id":"tc2","goal":[2,3],"prompt":"Build a 6-unit chain whose molar mass is 252 g/mol, and bracket one repeating unit.","why":"6 × 42 = 252 g/mol: six propene units. The bracket holds –CH₂–CH(CH₃)–, with the CH₃ as a side group.","hints":["252 ÷ 6 = ?","42 g/mol: propene.","Six propene units; bracket CH₂–CH(CH₃)."]},{"id":"tc3","goal":[1,2],"stretch":true,"prompt":"Copolymer mode: a section reads –CH₂–CHCl–CH₂–CH₂–CH₂–CHCl–CH₂–CH₂–. Rebuild it and choose its monomer(s).","why":"Cut the backbone every two carbons: CH₂–CHCl, CH₂–CH₂, CH₂–CHCl, CH₂–CH₂. Put the double bond back in each piece: chloroethene and ethene.","hints":["Cut the backbone every two carbons.","Pieces: CH₂–CHCl, CH₂–CH₂, CH₂–CHCl, CH₂–CH₂.","Put the double bond back in each: chloroethene and ethene."]}]},"part3":{"slug":"plastics","name":"Plastics","heading":"Plastics and the planet","intro":"Three stations tie the chain’s structure to what happens to plastics after you use them: the recycling codes, why an all-C–C backbone lasts, and a plan of your own built from evidence.","s1":{"title":"Station 1: Read the code","intro":"Each plastic item carries a resin code, 1 to 7, inside a triangle of arrows. Sort the seven codes by the kind of polymer they name.","items":[{"id":"c1","code":1,"ab":"PET","thing":"water bottle","_a":"RFBZW1wV","poly":"a polyester","why":"PET forms with water released at each ester link (module 08)."},{"id":"c2","code":2,"ab":"HDPE","thing":"milk jug","_a":"RFJSURo=","poly":"high-density polyethene","why":"Polyethene, from ethene (C=C): nothing is released as the chain forms."},{"id":"c3","code":3,"ab":"PVC","thing":"drain pipe","_a":"RFJSURo=","poly":"poly(chloroethene)","why":"Poly(chloroethene), from chloroethene (C=C): nothing is released as the chain forms."},{"id":"c4","code":4,"ab":"LDPE","thing":"shopping bag","_a":"RFJSURo=","poly":"low-density polyethene","why":"Branched polyethene, from ethene (C=C): nothing is released as the chain forms."},{"id":"c5","code":5,"ab":"PP","thing":"yogurt tub","_a":"RFJSURo=","poly":"poly(propene)","why":"Poly(propene), from propene (C=C): nothing is released as the chain forms."},{"id":"c6","code":6,"ab":"PS","thing":"foam cup","_a":"RFJSURo=","poly":"poly(phenylethene)","why":"Poly(phenylethene), from phenylethene (C=C): nothing is released as the chain forms."},{"id":"c7","code":7,"ab":"other","thing":"layered snack pouch","_a":"RFxCXV1FEg==","poly":"other or mixed plastics","why":"Code 7 means other or mixed plastics: it doesn’t name one polymer."}],"bins":[{"id":"add","label":"Addition polymer","sub":"monomer with a C=C; nothing released"},{"id":"cond","label":"Condensation polymer","sub":"a small molecule released at each link"},{"id":"other","label":"Mixed / other","sub":"no single polymer"}],"wrongAdd":"Its monomer has a C=C, and nothing is released as the chain forms: an addition polymer.","data":"Recyclers shred plastics and drop the flakes into water. Flakes less dense than the liquid float; denser flakes sink. Densities are approximate data; real products vary."},"s2":{"title":"Station 2: Why they last","intro":"Zoom to the particles: a polyethene chain and a polyester chain side by side, surrounded by water. Press \u003cstrong>Add water\u003c/strong> and watch where the water molecules can attack.","banner":"No weak link for water to attack."},"s3":{"title":"Station 3: My plastics plan","intro":"Build a claim in three parts: an action, the evidence for it, and the reason it helps. Any action and evidence that logically match are accepted.","canada":"Canada has federal rules restricting some single-use plastics, such as checkout bags and straws.","actions":[{"id":"bag","t":"carry a reusable bag"},{"id":"refill","t":"choose refillable containers"},{"id":"sort","t":"sort recycling by code"},{"id":"foam","t":"avoid single-use foam"}],"evidence":[{"id":"persist","t":"Persistence: polyethene’s all-C–C backbone has no link ":"It is radioactive","fb":"A chain of C–C single bonds isn’t broken by water or most microbes; buried bags last for decades or longer.","_n":"1eedf","_k":"b7a4dcad"},{"t":"It contains C=C bonds","fb":"The C=C bonds were used up making the chain.","_n":"1ff0f","_k":"7765250b"}]},{"id":"q4","goal":5,"prompt":"Which action most directly reduces plastic made?","choices":[{"t":"Reusing a durable bag many times","fb":"Right. Every reuse is one less bag made.","_n":"1geff","_k":"97c47efe"},{"t":"Rinsing bags before trashing them","fb":"Rinsing doesn’t change persistence, and the bag is still made and thrown out.","_n":"1heaf","_k":"53bf83a9"},{"t":"Burning bags at home","fb":"Burning at home releases harmful products; burying doesn’t break them down.","_n":"1ie9f","_k":"5f851a70"},{"t":"Burying bags","fb":"Burning at home releases harmful products; burying doesn’t break them down.","_n":"1jecf","_k":"3b32046d"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Monomer ↔ polymer","summary":"Monomer ↔ polymer","goal":[1,2],"instruction":"Match each monomer to the repeating unit of its polymer. Two repeating units have no partner.","leftTitle":"Monomer","rightTitle":"Repeating unit","left":[{"id":"l1","t":"ethene, CH₂=CH₂","why":"Open the C=C: each backbone carbon keeps its two H."},{"id":"l2","t":"propene, CH₂=CHCH₃","why":"The CH₃ hangs off the second backbone carbon."},{"id":"l3","t":"chloroethene, CH₂=CHCl","why":"The Cl hangs off the second backbone carbon."},{"id":"l4","t":"phenylethene, CH₂=CHC₆H₅","why":"The benzene ring hangs off the second backbone carbon."},{"id":"l5","t":"tetrafluoroethene, CF₂=CF₂","why":"Each backbone carbon keeps its two F."},{"id":"l6","t":"but-2-ene, CH₃CH=CHCH₃","why":"The double bond is in the middle, so each backbone carbon carries a CH₃."},{"id":"l7","t":"1,1-dichloroethene, CH₂=CCl₂","why":"Both Cl stay on the same backbone carbon."},{"id":"l8","t":"methyl 2-methylpropenoate, CH₂=C(CH₃)COOCH₃","why":"Both groups hang the fix.","problems":[{"id":"e1","goal":2,"task":"Draw three repeating units of poly(propene).","steps":["The monomer is CH₂=CHCH₃.","The C=C opens to link monomers.","All three carbons join the backbone: –CH₂–CH₂–CH₂–.","Three units: –CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Follows step 3. The mistake is earlier."],"fixes":[{"t":"Only the two C=C carbons join; the CH₃ is a side group: –CH₂–CH(CH₃)–CH₂–CH(CH₃)–CH₂–CH(CH₃)–.","why":"Only the two C=C carbons join the backbone. The CH₃ hangs off as a side group.","_n":"1q5ff","_k":"58a79648"},{"t":"Keep the double bond: –CH=CH(CH₃)–.","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"1r58f","_k":"2cc5f582"},{"t":"Step 3 is correct.","why":"Only the two C=C carbons join the backbone. The CH₃ hangs off as a side group.","_n":"1s59f","_k":"12acc416"},{"t":"–CH(CH₃)–CH(CH₃)–.","why":"That’s from but-2-ene.","_n":"1t5af","_k":"1aa0e46d"}],"hints":["Which carbons had the double bond?","Only those two.","CH₃ hangs off."]},{"id":"e2","goal":3,"task":"Find the molar mass of a chain of 500 ethene units (C₂H₄ = 28 g/mol).","steps":["500 monomers join into one chain.","Each link releases one water molecule.","Mass = 500 × 28 − 499 × 18 = 5018 g/mol."],"_a":"Vw==","stepFb":["Correct.","","Follows step 2."],"fixes":[{"t":"Mass = 28 g/mol.","why":"That’s one unit.","_n":"1u5bf","_k":"54c85d0b"},{"t":"500 × 18 = 9000.","why":"Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"1v64f","_k":"ea0058df"},{"t":"Addition releases nothing: mass = 500 × 28 = 14 000 g/mol.","why":"Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"1w65f","_k":"73a96ab8"},{"t":"Step 2 is correct.","why":"Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"1xe2f","_k":"f2445d2e"}],"hints":["Is anything lost in addition?","No.","14 000 g/mol."]},{"id":"e3","goal":1,"task":"Name the monomer of PVC, –CH₂–CHCl–.","steps":["The repeating unit is –CH₂–CHCl–.","The unit has 2 carbons and 1 Cl.","So the monomer is CH₃CH₂Cl, chloroethane.","It joins by opening a bond."],"_a":"VA==","stepFb":["Correct.","Correct.","","Follows step 3. The mistake is earlier."],"fixes":[{"t":"Put the double bond back between the two backbone carbons: CH₂=CHCl, chloroethene.","why":"Every addition monomer has a C=C to open.","_n":"1ye1f","_k":"7fa4972b"},{"t":"CHCl=CHCl.","why":"Only one Cl per unit.","_n":"1ze0f","_k":"b2344a72"},{"t":"CH₂Cl–CH₂Cl.","why":"No C=C, no addition polymer. Only one Cl per unit.","_n":"20dff","_k":"18db5264"},{"t":"Step 3 is correct.","why":"No C=C, no addition polymer. Chloroethane has nothing to open.","_n":"21def","_k":"0ee4ecbe"}],"hints":["What must every addition monomer have?","A C=C.","Chloroethene."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: that nothing is lost when a polymer forms, or that branching makes plastic less dense?"},{"id":"j2","q":"In your own words, explain how to find the monomer of an addition polymer."},{"id":"j3","q":"Explain to a friend why a plastic bag buried in a backyard is still there years later."},{"id":"j4","q":"Write one change you’ll make in how you use plastics, and the evidence behind it."}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which molecule can form an addition polymer?","options":[{"t":"ethanol, CH₃CH₂OH","why":"No C=C.","_n":"22ddf","_k":"310d6c2c"},{"t":"ethanoic acid, CH₃COOH","why":"No C=C (the C=O doesn’t polymerize this way).","_n":"23dcf","_k":"856a16e2"},{"t":"chloroethane, CH₃CH₂Cl","why":"No C=C, no addition polymer. Chloroethane has nothing to open.","_n":"24dbf","_k":"d510fe74"},{"t":"chloroethene, CH₂=CHCl","why":"It has a C=C.","_n":"25eaf","_k":"f4757d62"}]},"b":{"prompt":"What must a monomer have to form an addition polymer?","options":[{"t":"a carbon–carbon double bond","why":"The C=C opens to make the new links.","_n":"26e9f","_k":"367d216d"},{"t":"an –OH group","why":"Not required.","_n":"27e0d","_k":"3f61b7f0"},{"t":"a ring of carbons","why":"Not required.","_n":"28e1d","_k":"38f4ebce"},{"t":"two different functional groups","why":"That’s needed for condensation.","_n":"29ded","_k":"80d37bc8"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which is the repeating unit of poly(propene)?","options":[{"t":"–CH₂–CH(CH₃)–","why":"Only the two C=C carbons join the backbone; the CH₃ hangs off the second one.","_n":"2adfd","_k":"65c55370"},{"t":"–CH₂–CH₂–","why":"That’s polyethene.","_n":"2bdcd","_k":"744c5665"},{"t":"–CH₂–CH₂–CH₂–","why":"Only the two C=C carbons join the backbone. The CH₃ hangs off as a side group.","_n":"2cddd","_k":"c19db113"},{"t":"–CH=CH(CH₃)–","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"2ddad","_k":"0c0f25b9"}]},"b":{"prompt":"Which is the repeating unit of poly(phenylethene)?","options":[{"t":"–CH=CH(C₆H₅)–","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"2edbd","_k":"bc46ec93"},{"t":"–CH₂–CH(C₆H₅)–","why":"The ring hangs off the second backbone carbon as a side group.","_n":"2fe8d","_k":"6686d62a"},{"t":"–CH₂–CH₂–C₆H₄–","why":"The ring hangs off; it isn’t in the backbone.","_n":"2ge9d","_k":"047d1799"},{"t":"–C₆H₅–CH₂–","why":"Only C=C carbons form the backbone.","_n":"2h66e","_k":"44a96bf7"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which statement about addition polymerization is true?","options":[{"t":"All atoms of the monomers end up in the polymer","why":"Nothing is released, so the polymer has the same empirical formula as the monomer.","_n":"2i65e","_k":"7e7db56a"},{"t":"The double bonds become triple bonds","why":"They become single bonds.","_n":"2j68e","_k":"02675fbb"},{"t":"A water molecule is released at each link","why":"Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"2k67e","_k":"08083c7d"},{"t":"The backbone keeps its double bonds","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"2l6ae","_k":"02502c6c"}]},"b":{"prompt":"1000 propene molecules (42 g/mol) form one chain. What is its molar mass?","options":[{"t":"24 018 g/mol","why":"That subtracts 999 waters. Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"2m69e","_k":"617a2525"},{"t":"84 000 g/mol","why":"Each monomer counts once.","_n":"2n6ce","_k":"7e6b2bcc"},{"t":"42 g/mol","why":"That’s one unit.","_n":"2o6be","_k":"cfd23878"},{"t":"42 000 g/mol","why":"1000 × 42 = 42 000 g/mol: no atoms are lost.","_n":"2p5ee","_k":"b3387862"}]}},{"id":"t1","cat":"T","goal":[1,2],"a":{"prompt":"Which monomer makes –CH₂–C(CH₃)₂–CH₂–C(CH₃)₂–?","options":[{"t":"but-2-ene","why":"That puts one CH₃ on each backbone carbon.","_n":"2q5de","_k":"25ae9c91"},{"t":"2-methylpropene, CH₂=C(CH₃)₂","why":"Both methyls sit on one backbone carbon.","_n":"2r96a","_k":"0369c27f"},{"t":"2-methylpropane","why":"No C=C, no addition polymer. 2-methylpropane has nothing to open.","_n":"2s95a","_k":"6e8abb56"},{"t":"propene","why":"Only one CH₃ per unit there.","_n":"2t94a","_k":"651e474c"}]},"b":{"prompt":"Which monomer makes –CHCl–CHCl–CHCl–CHCl–?","options":[{"t":"chloroethene","why":"That gives one Cl per two carbons.","_n":"2u93a","_k":"27d4e64a"},{"t":"1,1-dichloroethene","why":"That puts both Cl on one carbon.","_n":"2v9aa","_k":"85f02de7"},{"t":"1,2-dichloroethene, CHCl=CHCl","why":"One Cl on each backbone carbon: put the C=C back between them.","_n":"2w99a","_k":"b0c717b1"},{"t":"1,2-dichloroethane","why":"No C=C, no addition polymer. 1,2-dichloroethane has nothing to open.","_n":"2x98a","_k":"1d2a8c7c"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Two polyethene samples: X has density 0.92 g/cm³ and melts at 110 °C; Y has density 0.96 g/cm³ and melts at 135 °C. Which is high-density polyethene, and why?","options":[{"t":"X: lower density means stronger forces","why":"Lower density means looser packing.","_n":"2y97a","_k":"c953240a"},{"t":"Y: linear chains pack closely, raising density and melting point","why":"Unbranched chains line up closely, so Y is denser and melts higher.","_n":"2z9ea","_k":"63e1b184"},{"t":"Neither: they’re different polymers","why":"Both are polyethene; chain shape differs.","_n":"309da","_k":"c3623ca3"},{"t":"Y: it has more branches","why":"Branches keep chains apart, so branched polyethene is less dense and softer.","_n":"3110a","_k":"6df2c9d6"}]},"b":{"prompt":"Two samples of the same polymer: P has density 0.95 g/cm³, Q has density 0.91 g/cm³. Which has more branching, and why?","options":[{"t":"P: more branches add mass","why":"Branches keep chains apart, so branched polyethene is less dense and softer.","_n":"3211a","_k":"27213780"},{"t":"Can’t tell without molar mass","why":"Packing explains density here.","_n":"3312a","_k":"fbf1a72a"},{"t":"Q: branches add double bonds","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"3413a","_k":"4b12e228"},{"t":"Q: branches keep chains apart, so it packs less tightly","why":"Lower density means looser packing: Q is the more branched sample.","_n":"3514a","_k":"66d574a1"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A copolymer chain has 500 ethene units and 500 propene units. Use C₂H₄ = 28 and C₃H₆ = 42 g/mol. What is its molar mass?","options":[{"t":"35 g/mol","why":"Multiply by the number of units.","_n":"3615a","_k":"cb03f8d8"},{"t":"35 000 g/mol","why":"500 × 28 + 500 × 42.","_n":"3716a","_k":"283cf65d"},{"t":"17 018 g/mol","why":"No water is lost. Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"3817a","_k":"f6c586a0"},{"t":"70 000 g/mol","why":"That counts 1000 of each.","_n":"3918a","_k":"7fb32eb6"}]},"b":{"prompt":"A copolymer chain has 400 ethene units and 400 chloroethene units. Use 28 and 62.5 g/mol. What is its molar mass?","options":[{"t":"36 200 g/mol","why":"400 × 28 + 400 × 62.5 = 11 200 + 25 000.","_n":"3a19a","_k":"5d366978"},{"t":"72 400 g/mol","why":"That counts 800 of each.","_n":"3ba2a","_k":"3a9dffd3"},{"t":"21 818 g/mol","why":"No water is lost. Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"3ca1a","_k":"21281c51"},{"t":"25 000 g/mol","why":"That’s only the chloroethene part.","_n":"3da4a","_k":"58cfddbf"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the clearest explanation of why addition polymers persist in the environment?","options":[{"t":"“They break down quickly if buried.”","why":"A chain of C–C single bonds isn’t broken by water or most microbes; buried bags last for decades or longer.","_n":"3ea3a","_k":"931f8679"},{"t":"“They’re too dense to break down.”","why":"Density isn’t the reason.","_n":"3fa6a","_k":"cff2d86b"},{"t":"“Their backbones are all C–C single bonds, with no ester or amide links for water or microbes to break.”","why":"It names the structure and why water and microbes can’t break it.","_n":"3ga5a","_k":"8defd8de"},{"t":"“They still contain double bonds that resist reaction.”","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"3ha8a","_k":"b0c8bb4f"}]},"b":{"prompt":"Which correctly describes how polyethene forms?","options":[{"t":"“Monomers stack, held only by London forces.”","why":"They’re joined by covalent bonds.","_n":"3ia7a","_k":"a82f0799"},{"t":"“C–H bonds break so carbons can join.”","why":"The C=C, not C–H, opens.","_n":"3j9aa","_k":"3437efb0"},{"t":"“Each C=C opens; its electrons form new C–C bonds to neighbouring monomers, and no atoms are lost.”","why":"It says what opens, what forms and that nothing is lost.","_n":"3k99a","_k":"87380e56"},{"t":"“Water is removed between –OH groups.”","why":"Addition polymers lose nothing: every atom of every monomer ends up in the chain.","_n":"3l9ca","_k":"297f5ef8"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which shows a correct three-unit section of poly(chloroethene)?","options":[{"t":"–CH₂–CH₂Cl–CH₂–CH₂Cl–","why":"That gives a carbon five bonds.","_n":"3m9da","_k":"46bc58de"},{"t":"–CH=CCl–CH=CCl–CH=CCl–","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"3n9aa","_k":"0fce2bbc"},{"t":"–CH₂–CHCl–CH₂–CHCl–CH₂–CHCl–","why":"Three –CH₂–CHCl– units: one Cl per unit, all single bonds.","_n":"3o9ba","_k":"0322c399"},{"t":"–CHCl–CHCl–CHCl–CHCl–CHCl–CHCl–","why":"Two Cl per unit.","_n":"3p98a","_k":"37eec6af"}]},"b":{"prompt":"Which shows a correct three-unit section of poly(propene)?","options":[{"t":"–CH₂–CH(CH₃)–CH₂–CH(CH₃)–CH₂–CH(CH₃)–","why":"A CH₃ on every second backbone carbon, all single bonds.","_n":"3q99a","_k":"03c94300"},{"t":"–CH(CH₃)–CH(CH₃)–CH(CH₃)–","why":"That’s from but-2-ene.","_n":"3r96a","_k":"1a73cb5f"},{"t":"–CH=C(CH₃)–CH=C(CH₃)–","why":"The C=C opens to make the new links, so the backbone is all single bonds.","_n":"3s97a","_k":"fdadd55b"},{"t":"–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–","why":"Only the two C=C carbons join the backbone. The CH₃ hangs off as a side group.","_n":"3ta4a","_k":"4de7d56f"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A recycling plant floats shredded plastics in water (1.00 g/mL). Densities: PP 0.90, HDPE 0.96, PS 1.05, PET 1.38, PVC 1.38 g/cm³. Which pair floats together?","options":[{"t":"PS and PVC","why":"Both sink.","_n":"3ua5a","_k":"88311ccb"},{"t":"PP and HDPE","why":"Both below 1.00.","_n":"3v2eb","_k":"442aadd3"},{"t":"PET and PVC","why":"Both sink.","_n":"3w2db","_k":"f4dc1954"},{"t":"PET and HDPE","why":"PET sinks.","_n":"3x2cb","_k":"65e7f0b8"}]},"b":{"prompt":"The same plastics are placed in a salt solution of density 1.20 g/mL. Which sinks?","options":[{"t":"PS only","why":"1.05 \u003c 1.20: PS floats here.","_n":"3y2bb","_k":"e5b2486c"},{"t":"PVC and PET only","why":"Only 1.38 is above 1.20.","_n":"3z2ab","_k":"de5d6ccb"},{"t":"HDPE and PP","why":"They float in both liquids.","_n":"4029b","_k":"78b50633"},{"t":"All of them","why":"Only the denser ones sink.","_n":"4128b","_k":"d2ddcb6f"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A town wants fewer plastic bags in its landfill. Which plan is best supported by the chemistry?","options":[{"t":"Bury bags deeper so they biodegrade","why":"A chain of C–C single bonds isn’t broken by water or most microbes; buried bags last for decades or longer.","_n":"4227b","_k":"56bfe177"},{"t":"Encourage reusable bags used many times, because polyethene’s C–C backbone won’t break down in a landfill","why":"Fewer bags made means fewer bags buried, and buried bags don’t break down.","_n":"4326b","_k":"21d63ca0"},{"t":"Burn bags in backyards","why":"That releases harmful products.","_n":"4425b","_k":"86df95e3"},{"t":"Rinse bags before throwing them out","why":"Rinsing doesn’t change persistence.","_n":"45a8b","_k":"ef7cc8f6"}]},"b":{"prompt":"Which statement best explains why sorting plastics by resin code matters?","options":[{"t":"All plastics are the same polymer","why":"Codes identify different polymers.","_n":"46a9b","_k":"70ffba64"},{"t":"Different polymers melt and behave differently, so mixing them ruins recycled plastic","why":"Each code is a different polymer, so recyclers keep them apart.","_n":"47aab","_k":"5ba037da"},{"t":"Codes show how old the plastic is","why":"They identify the polymer.","_n":"48abb","_k":"85f414d9"},{"t":"Sorting makes them biodegrade","why":"A chain of C–C single bonds isn’t broken by water or most microbes; buried bags last for decades or longer.","_n":"49a4b","_k":"9dbb34c6"}]}}]},"task":{"title":"Design a copolymer segment","summary":"Design a copolymer segment","statement":"\u003cp>Build a 6-unit segment of a copolymer from ethene (E, 28 g/mol) and propene (P, 42 g/mol) that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"ap-conds\">\u003cli>The segment has exactly 6 units.\u003c/li>\u003cli>Its molar mass is 210 g/mol.\u003c/li>\u003c
