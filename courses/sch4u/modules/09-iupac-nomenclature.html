*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}

body{

img,svg{max-width:100%}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 09: hero, C1 view + builder, C2 name chips, Name machine, Part 3 stations, practice items, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.nm-eq{display:block;line-height:1.4}
.nm-o{color:var(--at-o);font-weight:700}
.nm-hx .c1-wrap{border:0;background:transparent}
.nm-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.nm-hx-cap{font:400 1.02rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:4.2em}

/* C1 view */
.c1-wrap{position:relative;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.c1-svg{display:block;width:100%;height:auto;touch-action:pan-y;font-family:var(--font-ui)}
.c1-ov{position:absolute;inset:0;pointer-events:none}
.c1-b{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;padding:0;pointer-events:auto;cursor:pointer}
.c1-b.bd{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:6px}
.c1-b:hover{background:var(--hi-soft)}
.c1-b:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.nm-mini{display:block;width:100%;max-width:360px;height:auto;font-family:var(--font-ui);margin:4px 0}

/* C2 name chips */
.c2-tape{font:400 1.25rem/1.3 var(--font-ui);margin:4px 0 10px;min-height:1.4em;overflow-wrap:anywhere}
.c2-tl{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.c2-name{font-weight:700;color:var(--ink);white-space:pre-wrap}
.c2-grid{display:flex;flex-direction:column;gap:6px}
.c2-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.c2-lab{flex-basis:100%;font-size:.78rem;font-weight:700;color:var(--ink-2);margin:2px 0 0}
.c2-c{min-height:34px;min-width:34px;padding:.2em .6em;font-size:.9rem}
.c2-c:disabled{opacity:.45}
.c2-act{margin-top:8px}

/* Name machine */
.nm-how{margin-top:0}
.nm-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"view read" "ctrl read";gap:16px 28px;align-items:start}
.nm-left{grid-area:view;min-width:0}.nm-ctrl{grid-area:ctrl;min-width:0}.nm-right{grid-area:read;min-width:0}
.nm-cap{font:400 clamp(1.1rem,2.4vw,1.4rem)/1.35 var(--font-ui);white-space:normal;min-height:1.4em}
.nm-cap .chem{white-space:normal;overflow-wrap:anywhere}
.nm-capn{display:block;font-size:.8em;color:var(--ink-2);margin-top:2px}
.nm-leg{margin:8px 0 0}
.nm-modes{margin-bottom:12px}
.nm-grp,.nm-mols,.nm-tgts,.nm-duels{margin:0 0 8px}
.nm-chips,.nm-bmenu{margin-top:10px;padding-top:8px;border-top:1px solid var(--rule)}
.nm-sub{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:10px 0 6px}
.nm-bmsg{min-height:1.3em;margin:4px 0;font-size:.92rem;color:var(--ink-2)}
.nm-menu{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.nm-menu .nm-sub,.nm-menu p{flex-basis:100%;margin:4px 0 0}
.nm-menu .btn{min-height:36px}
.nm-menu .btn:disabled{opacity:.5}
.nm-bk-r{flex-basis:100%;margin-top:4px}
.nm-open{margin-top:12px;padding-top:6px;border-top:1px solid var(--rule)}
.nm-dpick{display:flex;flex-wrap:wrap;gap:8px}
.nm-dpick .chip{min-height:40px}
.nm-read dd{overflow-wrap:anywhere}
.nm-bad{color:var(--ink)}
.nm-p[hidden],.nm-open[hidden],.nm-mol[hidden],.nm-bview[hidden]{display:none}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.nm-prods,.nm-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin:8px 0}
.nm-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer;min-height:44px}
.nm-card[aria-pressed="true"]{border-color:var(--pen);box-shadow:inset 0 0 0 2px var(--pen)}
.nm-card.done{border-style:dashed;cursor:default}
.nm-card:disabled{opacity:1}
.nm-pn{font-weight:700}
.nm-pc{font-size:.9rem;color:var(--ink-2)}
.nm-pm{font-size:.88rem;font-weight:700;color:var(--ink)}
.nm-card .nm-mini{max-width:200px}
.nm-lab{border-top:1px solid var(--rule);padding:10px 0 6px}
.nm-lab:first-child{border-top:0}
.nm-ln{margin:0 0 6px;font-size:1.02rem}
.nm-lab .chips{display:flex;flex-wrap:wrap;gap:6px}
.nm-lab .chip{min-height:36px}
.nm-zoom{margin:10px 0 4px}
.nm-zoom .nm-mini{max-width:380px}

/* practice */
.nm-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.nm-dot{min-width:40px;min-height:36px}
.nm-item .nm-mini{max-width:380px}
.nm-fbld,.nm-fform,.nm-fchips{margin-top:10px}
.nm-fbld{max-width:600px}
.nm-fbld[hidden],.nm-fform[hidden],.nm-fchips[hidden]{display:none}
.nm-flab{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.nm-fin{font:inherit;font-weight:400;padding:.35em .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 9rem;max-width:14rem;min-height:36px}
.nm-found{margin:8px 0 4px}

/* task */
.nm-h4{margin:12px 0 6px;font-size:.95rem}
.nm-conds{margin:6px 0 10px 1.2em;padding:0}

@media (max-width:860px){
  .nm-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "ctrl" "read"}
}

ect?","options":[{"t":"2-methyl-3-bromobutane","_n":"10ec3","_k":"6ec18116"},{"t":"3-methyl-2-bromobutane","_n":"11f73","_k":"e53b2b76"},{"t":"2-bromo-3-methylbutane","_n":"12f63","_k":"7b71d44f"},{"t":"3-bromo-2-methylbutane","_n":"13e52","_k":"85acb570"}],"explain":"B before m: bromo gets the lower number, and prefixes are listed alphabetically. Prefixes go in alphabetical order of the group name; ignore di-, tri-."}],"chalIntro":"Use the name machine to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2,3],"mol":"g7","prompt":"\u003cstrong>Structure → name:\u003c/strong> name (CH₃)₂CHCH₂COCH₃ with the chips.","why":"4-methylpentan-2-one (the older form 4-methyl-2-pentanone is accepted): the ketone is the principal group, the chain of 5 carbons includes the C=O, and numbering from the C=O end puts it at 2 and the methyl at 4.","wrong":[{"name":"2-methylpentan-4-one","fb":"Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first."},{"name":"4-methylhexan-2-one","fb":"Count again: 5 carbons in the chain."}],"hints":["Principal group?","Ketone: the chain of 5 carbons that includes the C=O.","C=O at 2, methyl at 4."]},{"id":"tc2","goal":4,"target":"tc2","prompt":"\u003cstrong>Name → structure:\u003c/strong> draw 3-aminopropan-1-ol.","why":"H₂N–CH₂–CH₂–CH₂–OH: a 3-carbon chain with the –OH on C1 (suffix -ol) and the –NH₂ on C3.","sameC":"3 and 1 are different carbons.","onC2":"Amino on C3, at the far end from the OH.","hints":["Draw a 3-carbon chain.","–OH on C1 (suffix -ol).","–NH₂ on C3."]},{"id":"tc3","goal":[1,2,3,4],"target":"open","stretch":true,"prompt":"\u003cstrong>Name → structure, open:\u003c/strong> build any molecule with formula C₄H₈O₂ whose IUPAC name contains both ‘hydroxy’ and ‘-one’. Then name it.","why":"Three molecules work: 1-hydroxybutan-2-one (HOCH₂COCH₂CH₃), 3-hydroxybutan-2-one (CH₃CH(OH)COCH₃) and 4-hydroxybutan-2-one (HOCH₂CH₂COCH₃).","aldehyde":"That ends in -al: C=O at the chain end is an aldehyde.","acid":"C₄H₈O₂, but the two O’s are one group (-oic acid).","wrongNum":"Number so the principal group (C=O) is lowest: 4-hydroxybutan-2-one.","hints":["A ketone needs its C=O inside the chain: butan-2-one is the only C₄ ketone.","Put the –OH on any carbon except the C=O carbon.","Positions 1, 3 or 4; then renumber so the C=O is 2."]}],"blocks":[{"title":"The decision tree","html":"\u003cp>Naming is a decision tree: \u003cstrong>principal group → parent → numbering → prefixes\u003c/strong>. Each decision has one rule.\u003c/p>\u003col>\u003cli>\u003cstrong>Principal group:\u003c/strong> carboxylic acid &gt; ester &gt; amide &gt; aldehyde &gt; ketone &gt; alcohol &gt; amine &gt; alkene/alkyne. Only the winner is a suffix.\u003c/li>\u003cli>\u003cstrong>Parent:\u003c/strong> the longest chain that contains the principal group; -en- or -yn- for multiple bonds.\u003c/li>\u003cli>\u003cstrong>Numbering:\u003c/strong> lowest locant to the principal group, then to multiple bonds, then to prefixes; a tie goes to the prefix first in the alphabet.\u003c/li>\u003cli>\u003cstrong>Prefixes:\u003c/strong> alphabetical (hydroxy-, amino-, oxo-, halo-, alkoxy-, alkyl-), ignoring di- and tri-.\u003c/li>\u003c/ol>"}]},"part3":{"slug":"labels","name":"Labels","heading":"Common names and real labels","intro":"Real bottles, ingredient lists and safety data use common names. Translate them into IUPAC names, and check each name against a structure.","s1":{"title":"Station 1: Kitchen and bathroom","intro":"Each product card names one ingredient by its common name. Tap a card, then tap the matching IUPAC name and structure.","products":[{"id":"vin","product":"Vinegar","common":"acetic acid","_a":"FlASUUgDUFBQFw=="},{"id":"rub","product":"Rubbing alcohol","common":"isopropyl alcohol","_a":"FkVUVglA"},{"id":"nail","product":"Nail polish remover","common":"acetone","_a":"FkUUVgsHEQ=="},{"id":"anti","product": th formula C₄H₈O₂.","_a":"bxcLXBEKSlUURRRWFQNdVlVBAxtJQFZNXEwKGQAWW1haWgdNAEAfG0RHCUkcDhNUUUEOWAsNUk1RF0obVE9eXEBdH1UAFltAWBULXBEKUldbVBJcRz8=","alias":{"isopropyl methanoate":"1-methylethyl methanoate"},"fb":"Split 4 carbons between the alkyl part and the acid part: 1 + 3, 2 + 2, 3 + 1 (two ways).","hints":["Alkyl + alkanoate; the alkanoate includes the C=O carbon.","Alcohol carbons + acid carbons = 4.","Methyl + propanoate; ethyl + ethanoate; propyl or 1-methylethyl + methanoate."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Dante","how":"","instruction":"Dante made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Name HOCH₂CH₂CH₂CHO.","steps":["The groups are –OH and –CHO.","The alcohol is the principal group, so the suffix is -ol.","The chain has 4 carbons, numbered from the OH.","Name: 4-oxobutan-1-ol."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","","Follows step 2.","Follows step 2. The mistake is earlier."],"fixes":[{"t":"1-hydroxybutan-4-al.","why":"An aldehyde carbon is always C1.","_n":"1kec2","_k":"041c3c2e"},{"t":"Step 2 is correct.","why":"Only the highest-priority group is a suffix. An aldehyde outranks an alcohol, so –OH becomes hydroxy-.","_n":"1lf32","_k":"e5cd8288"},{"t":"Both are suffixes: butan-1-ol-al.","why":"Only one suffix: the highest-priority group.","_n":"1mf22","_k":"56a1e724"},{"t":"The aldehyde outranks the alcohol: suffix -al, C1 = CHO; name 4-hydroxybutanal.","why":"Aldehyde (4) beats alcohol (6), so –OH becomes hydroxy-.","_n":"1n713","_k":"40790a17"}],"hints":["Check the priority list.","Aldehyde (4) beats alcohol (6).","4-hydroxybutanal."]},{"id":"e2","goal":3,"task":"Name CH₂=CHCH₂CH(OH)CH₃.","steps":["The principal group is –OH (suffix -ol).","The chain has 5 carbons with one C=C.","Number from the left so the C=C gets locant 1.","Name: pent-1-en-4-ol."],"_a":"Bg==","stepFb":["Correct.","Correct.","","Follows step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first.","_n":"1o723","_k":"61d16cd2"},{"t":"Use 4-hydroxypent-1-ene.","why":"The –OH is the principal group, so it’s the suffix -ol, not a prefix. –OH: -ol as suffix, hydroxy- as prefix. Ketone C=O: -one as suffix, oxo- as prefix.","_n":"1p6f3","_k":"c7d61972"},{"t":"Pent-4-en-1-ol.","why":"The OH is on C2.","_n":"1q703","_k":"15461b3a"},{"t":"Number from the right so the –OH gets the lowest locant: pent-4-en-2-ol.","why":"Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first.","_n":"1r6d3","_k":"404b9585"}],"hints":["Which group gets the lowest number first?","The principal group, –OH.","Pent-4-en-2-ol."]},{"id":"e3","goal":5,"task":"Name CH₃CH(Cl)CH(CH₃)CH₂CH₃.","steps":["No suffix group: the parent is an alkane.","Longest chain: 5 carbons (pentane).","From the left: Cl at 2, CH₃ at 3. From the right: CH₃ at 3, Cl at 4. Use the left.","List prefixes in number order: 2-chloro first, then 3-methyl.","Name: 2-chloro-3-methylpentane."],"_a":"Bw==","stepFb":["Correct.","Correct.","Correct: lowest locants {2, 3}.","","The name is right, but the reason in step 4 is wrong."],"fixes":[{"t":"Write 3-methyl-2-chloropentane.","why":"Alphabetical order puts chloro first.","_n":"1s6e3","_k":"24a0b026"},{"t":"Write 2-chloro-3-methylbutane.","why":"The longest chain has 5 carbons: pentane.","_n":"1t6b3","_k":"02240222"},{"t":"Step 4 is correct.","why":"Prefixes go in alphabetical order of the group name; ignore di-, tri-.","_n":"1u6c3","_k":"64a6fade"},{"t":"Prefixes go alphabetically; ‘chloro’ comes before ‘methyl’, so 2-chloro-3-methylpentane is right for that reason.","why":"Here alphabetical and numerical order happen to agree. Prefixes go in alphabetical order of the group name; ignore di-, tri-.","_n":"1v793","_k":"95014997"}],"hints":["What decides the order of prefixes?","The alphabet, not the numbers.","The name is right, but step 4’s rule is wrong: here alphabetical and numerical order happen to agree."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which rule surprised you most: the priority list, or that the principal group outranks the double bond for numbering?"},{"id":"j2","q":"In your own words, describe the decision steps the name machine follows."},{"id":"j3","q":"Explain to a friend how to name an ester from its structure."},{"id":"j4","q":"Which family’s names still trip you up? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In HOCH₂CH₂COOH, which group gives the suffix?","options":[{"t":"the carboxylic acid","why":"Name: 3-hydroxypropanoic acid.","_n":"1w7a3","_k":"04390502"},{"t":"the alcohol","why":"The acid outranks the alcohol. Only the highest-priority group is a suffix, so –OH becomes hydroxy-.","_n":"1x773","_k":"1a893e60"},{"t":"neither; it’s named as an alkane","why":"Groups with suffixes win over the parent.","_n":"1y763","_k":"db78ad88"},{"t":"both","why":"Only one suffix.","_n":"1z793","_k":"99f0ac68"}]},"b":{"prompt":"In H₂NCH₂CH₂OH, which group gives the suffix?","options":[{"t":"both","why":"Only one suffix: the alcohol, which outranks the amine.","_n":"20783","_k":"01dc5ae6"},{"t":"the amine","why":"Alcohol (6) outranks amine (7). Only the highest-priority group is a suffix.","_n":"217b3","_k":"63c837d1"},{"t":"the alcohol","why":"Name: 2-aminoethan-1-ol.","_n":"227a3","_k":"15585372"},{"t":"neither","why":"Groups with suffixes win over the parent: the alcohol gives -ol.","_n":"237d3","_k":"3bc264a9"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is the prefix form of –OH when it isn’t the principal group?","options":[{"t":"oxo-","why":"That’s for a ketone C=O.","_n":"247c3","_k":"8dcdcf85"},{"t":"-ol","why":"–OH: -ol as suffix, hydroxy- as prefix. Ketone C=O: -one as suffix, oxo- as prefix.","_n":"256f3","_k":"e59c8be2"},{"t":"hydroxy-","why":"–OH as a prefix is hydroxy-.","_n":"266e3","_k":"e2ffdaa9"},{"t":"hydro-","why":"Hydro- means added hydrogen.","_n":"27ed4","_k":"dba24aa6"}]},"b":{"prompt":"What is the prefix form of a ketone C=O when it isn’t the principal group?","options":[{"t":"oxo-","why":"A ketone C=O as a prefix is oxo-.","_n":"28ee4","_k":"489c2bf3"},{"t":"hydroxy-","why":"That’s –OH.","_n":"29ef4","_k":"ba09130e"},{"t":"-one","why":"–OH: -ol as suffix, hydroxy- as prefix. Ketone C=O: -one as suffix, oxo- as prefix.","_n":"2af04","_k":"707d69f1"},{"t":"carbonyl-","why":"Not an IUPAC prefix.","_n":"2be94","_k":"8b020d12"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Name CH₃CH(Cl)CH₂CH₂OH.","options":[{"t":"3-chlorobutanal","why":"There’s no C=O.","_n":"2cea4","_k":"cc800887"},{"t":"1-hydroxy-3-chlorobutane","why":"The –OH is the principal group, so it’s the suffix -ol. Only the highest-priority group is a suffix. A ketone outranks an alcohol, so –OH becomes hydroxy-.","_n":"2deb4","_k":"72e79a03"},{"t":"2-chlorobutan-4-ol","why":"Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first.","_n":"2eec4","_k":"76d91d7f"},{"t":"3-chlorobutan-1-ol","why":"The –OH is principal: C1; the Cl is on C3.","_n":"2ff54","_k":"6b3e119c"}]},"b":{"prompt":"Name CH₂=CHCH₂CH(OH)CH₃.","options":[{"t":"pent-1-en-4-ol","why":"Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first.","_n":"2gf64","_k":"14bc30c1"},{"t":"4-hydroxypent-1-ene","why":"The –OH outranks the C=C, so it’s the suffix -ol. Only the highest-priority group is a suffix. A ketone outranks an alcohol, so –OH becomes hydroxy-.","_n":"2hf34","_k":"f332694f"},{"t":"pent-4-en-2-ol","why":"The –OH is principal: number from its end, C2; the C=C starts at C4.","_n":"2if24","_k":"392e8a08"},{"t":"pent-4-en-2-one","why":"–OH is -ol.","_n":"2jf14","_k":"5b29082f"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"What is the molecular formula of 4-hydroxy-3-methylbutan-2-one?","options":[{"t":"C₅H₁₀O₂","why":"CH₃–CO–CH(CH₃)–CH₂OH.","_n":"2kf04","_k":"429e12a8"},{"t":"C₅H₁₂O₂","why":"The C=O carbon has no H. Each C=O replaces two C–H bonds: count H on each carbon from its bonds.","_n":"2lef4","_k":"1c4f50df"},{"t":"C₅H₁₀O","why":"Count the OH oxygen.","_n":"2mee4","_k":"5b17aff1"},{"t":"C₄H₈O₂","why":"Include the methyl.","_n":"2ned4","_k":"a866920b"}]},"b":{"prompt":"What is the molecular formula of 3-amino-2-methylpropanoic acid?","options":[{"t":"C₄H₁₁NO₂","why":"The –COOH carbon has no C–H. Each C=O replaces two C–H bonds: count H on each carbon from its bonds.","_n":"2oec4","_k":"fbbd3ec1"},{"t":"C₃H₇NO₂","why":"Include the methyl.","_n":"2pfb4","_k":"a6a7d8ae"},{"t":"C₄H₉NO₂","why":"H₂N–CH₂–CH(CH₃)–COOH.","_n":"2qfa4","_k":"dba455c3"},{"t":"C₄H₉NO","why":"–COOH has two O.","_n":"2rfd4","_k":"c6ed48aa"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A student names a compound 2-ethylpropan-1-ol. What is the correct name?","options":[{"t":"2-ethylpropan-1-ol is correct","why":"Trace every path through the carbons: ‘2-ethylpropane’ is really 2-methylbutane.","_n":"2sfc4","_k":"24322850"},{"t":"2-methylbutan-1-ol","why":"HOCH₂–CH(CH₂CH₃)–CH₃: the longest chain with the C–OH has 4 carbons.","_n":"2tff4","_k":"3b951fb9"},{"t":"3-methylbutan-1-ol","why":"The branch is on C2.","_n":"2ufe4","_k":"d6de7b80"},{"t":"2-methylbutan-2-ol","why":"The OH stays on the end carbon.","_n":"2vf94","_k":"a90869d3"}]},"b":{"prompt":"A student names a compound 4-methylbutanal. What is the correct name?","options":[{"t":"2-methylbutanal","why":"The methyl is at the far end.","_n":"2wf84","_k":"617d83ff"},{"t":"pentanal","why":"A methyl on the last carbon just extends the chain.","_n":"2xfb4","_k":"8e0b6889"},{"t":"4-methylbutanal is correct","why":"Trace every path through the carbons: ‘2-ethylpropane’ is really 2-methylbutane.","_n":"2yfa4","_k":"735f7198"},{"t":"pentan-1-one","why":"An end C=O is an aldehyde.","_n":"2zf54","_k":"94721d8b"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Which pair are functional-group isomers with formula C₃H₆O?","options":[{"t":"propanal and propan-1-ol","why":"Propan-1-ol is C₃H₈O.","_n":"30f44","_k":"b26be0fb"},{"t":"propanone and propan-2-ol","why":"Propan-2-ol is C₃H₈O.","_n":"31f74","_k":"c77c1a05"},{"t":"propanal and propanone","why":"Both are C₃H₆O: an aldehyde and a ketone.","_n":"32f84","_k":"09bae7e2"},{"t":"propanoic acid and methyl ethanoate","why":"Those are C₃H₆O₂.","_n":"33f54","_k":"cf8f93b5"}]},"b":{"prompt":"Which pair are functional-group isomers with formula C₃H₆O₂?","options":[{"t":"ethyl methanoate and propanone","why":"Propanone is C₃H₆O.","_n":"34f64","_k":"9313ba9d"},{"t":"methyl ethanoate and propan-1-ol","why":"Propan-1-ol is C₃H₈O.","_n":"35fb4","_k":"3d270c2c"},{"t":"propanoic acid and methyl ethanoate","why":"Both are C₃H₆O₂: an acid and an ester.","_n":"36fc4","_k":"791776a5"},{"t":"propanoic acid and propanal","why":"Propanal is C₃H₆O.","_n":"37f94","_k":"30fc3565"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Why is CH₂=CHCH(OH)CH₃ named but-3-en-2-ol, not but-1-en-3-ol?","options":[{"t":"The principal group (–OH) gets the lowest locant before the double bond is considered.","why":"Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first.","_n":"38fa4","_k":"b64a1f31"},{"t":"Numbers are chosen alphabetically.","why":"The alphabet only breaks ties between prefixes. Number so the \u003cstrong>principal group\u003c/strong> gets the lowest number first.","_n":"39ef4","_k":"673b88b1"},{"t":"So the locants add to the smallest total.","why":"The first point of difference, starting with the principal group, decides.","_n":"3af04","_k":"62cd4b3a"},{"t":"The double bond must always be at C3.","why":"Its locant follows from the numbering.","_n":"3b714","_k":"e632f40b"}]},"b":{"prompt":"Why is CH₃CH₂COOCH₂CH₃ named ethyl propanoate, not propyl ethanoate?","options":[{"t":"Esters are named alphabetically.","why":"Order is alkyl, then alkanoate.","_n":"3c704","_k":"337e4f53"},{"t":"They’re two names for the same molecule.","why":"Propyl ethanoate is CH₃COOCH₂CH₂CH₃, a different molecule.","_n":"3d6f4","_k":"e36dd98d"},{"t":"The ethyl group comes from the alcohol and is named first; the acid part, with the C=O, has 3 carbons (propanoate).","why":"Alkyl (from the alcohol) + alkanoate (from the acid).","_n":"3e6e4","_k":"a992d228"},{"t":"The longer chain is always named first.","why":"The alkyl group comes from the alcohol and is named first: CH₃CH₂COOCH₃ is methyl propanoate.","_n":"3f6d4","_k":"6bf85f0d"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which condensed formula matches 2-methylpropan-2-ol?","options":[{"t":"(CH₃)₂CHOCH₃","why":"That’s an ether.","_n":"3g6c4","_k":"ac5cdc8f"},{"t":"CH₃CH(CH₃)CH₂OH","why":"That’s 2-methylpropan-1-ol.","_n":"3h6b4","_k":"e03c07f5"},{"t":"(CH₃)₃COH","why":"A 3-carbon chain with the –OH and a methyl both on C2.","_n":"3i6a4","_k":"128e4688"},{"t":"CH₃CH₂CH(OH)CH₃","why":"That’s butan-2-ol.","_n":"3j794","_k":"511e961b"}]},"b":{"prompt":"Which condensed formula matches N-ethyl-N-methylpropanamide?","options":[{"t":"CH₃CH₂CON(CH₃)CH₂CH₃","why":"Propanamide (3 carbons with the C=O) with an ethyl and a methyl on N.","_n":"3k784","_k":"0beefd20"},{"t":"CH₃CH₂COOCH₂CH₃","why":"That’s an ester.","_n":"3l6b4","_k":"0e0365f1"},{"t":"CH₃CH₂CH₂N(CH₃)CH₂CH₃","why":"No C=O: that’s an amine.","_n":"3m6c4","_k":"4da72705"},{"t":"CH₃CON(CH₃)CH₂CH₂CH₃","why":"That’s N-methyl-N-propylethanamide.","_n":"3n6d4","_k":"a3147625"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A banana flavouring is 3-methylbutyl ethanoate. Which alcohol and acid would make it by esterification?","options":[{"t":"3-methylbutan-1-ol and ethanoic acid","why":"Alkyl (3-methylbutyl) from the alcohol; ethanoate from the acid.","_n":"3o6e4","_k":"c2dc46fe"},{"t":"ethanol and 3-methylbutanoic acid","why":"The alkyl group comes from the alcohol and is named first: CH₃CH₂COOCH₃ is methyl propanoate.","_n":"3p674","_k":"13ed5768"},{"t":"3-methylbutanal and ethanol","why":"An ester needs an alcohol and an acid.","_n":"3q684","_k":"1ae37152"},{"t":"3-methylbutane and ethanoic acid","why":"An alkane can’t form an ester.","_n":"3r694","_k":"34d94c24"}]},"b":{"prompt":"An apple flavouring is ethyl 2-methylbutanoate. Which alcohol and acid would make it?","options":[{"t":"ethanal and 2-methylbutanoic acid","why":"An ester needs an alcohol, not an aldehyde.","_n":"3s6a4","_k":"b09e0bc1"},{"t":"2-methylbutan-1-ol and ethanoic acid","why":"The alkyl group comes from the alcohol and is named first: CH₃CH₂COOCH₃ is methyl propanoate.","_n":"3t734","_k":"ec82d0cb"},{"t":"ethane and 2-methylbutanoic acid","why":"An alkane can’t form an ester.","_n":"3u744","_k":"18e16955"},{"t":"ethanol and 2-methylbutanoic acid","why":"Ethyl from the alcohol; 2-methylbutanoate from the acid.","_n":"3v653","_k":"2f72b51e"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Sour milk contains 2-hydroxypropanoic acid. Which structure is it?","options":[{"t":"CH₃COCOOH","why":"That’s 2-oxopropanoic acid.","_n":"3w643","_k":"df5726f5"},{"t":"HOCH₂CH₂COOH","why":"That’s 3-hydroxypropanoic acid.","_n":"3x673","_k":"25e0e49d"},{"t":"CH₃CH(OH)CHO","why":"That’s an aldehyde.","_n":"3y663","_k":"cdb1a7d1"},{"t":"CH₃CH(OH)COOH","why":"–COOH is C1, and the –OH is on C2.","_n":"3z693","_k":"53cdfdfe"}]},"b":{"prompt":"Citric acid is 2-hydroxypropane-1,2,3-tricarboxylic acid. How many –COOH and –OH groups does it have?","options":[{"t":"3 –COOH and 2 –OH","why":"One hydroxy prefix.","_n":"40683","_k":"894ad1f7"},{"t":"3 –COOH and 1 –OH","why":"Tricarboxylic acid: three –COOH; 2-hydroxy: one –OH.","_n":"416b3","_k":"93785347"},{"t":"2 –COOH and 1 –OH","why":"Count 1, 2, 3.","_n":"426a3","_k":"e7b18f10"},{"t":"1 –COOH and 3 –OH","why":"Tricarboxylic = three acid groups.","_n":"436d3","_k":"fc62e9d0"}]}}]},"task":{"title":"Name designer","summary":"Name designer","statement":"\u003cp>Build a molecule that meets every con
