tals","hero":{"eq":"\u003cspan class=\"nw\">H₂O(l) → H₂O(g)\u003c/span>","eqSize":"sm","eqLabel":"H 2 O liquid becomes H 2 O gas","headline":"Boiling pulls molecules apart, not atoms","text":"The forces \u003cem>between\u003c/em> particles decide whether a substance is a gas, a liquid or a solid at room temperature. \u003cstrong>London dispersion forces\u003c/strong>, \u003cstrong>dipole–dipole forces\u003c/strong> and \u003cstrong>hydrogen bonds\u003c/strong> hold molecules together; \u003cstrong>ions\u003c/strong>, \u003cstrong>networks of covalent bonds\u003c/strong> and \u003cstrong>metallic bonding\u003c/strong> hold other solids together. Match the particle to the force, and you can predict melting, boiling, hardness and conductivity.","fig":{"html":"\u003cdiv class=\"imf-hx\">\u003csvg class=\"imf-hx-svg\" id=\"imf-hx-svg\" viewBox=\"0 0 440 330\" role=\"img\" aria-label=\"A beaker of liquid water, zoomed to a cluster of water molecules joined by dotted violet hydrogen bonds. Inside each molecule the O–H bonds are solid lines. A flame appears under the beaker. The dotted lines stretch and snap one by one while every molecule stays whole, and single molecules drift upward as steam. Two molecules left in the liquid are still joined by a hydrogen bond, labelled hydrogen bond (between molecules).\">\u003c/svg>\u003cdiv class=\"imf-hx-row\">\u003cp class=\"imf-hx-cap\" id=\"imf-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"imf-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can tell intermolecular forces apart from the bonds inside molecules, and say which ones break when a substance melts or boils.","I can identify the IMFs present in a substance (dispersion, dipole–dipole, hydrogen bonding, ion–dipole).","I can rank boiling points by first comparing electron counts and then the strongest IMF.","I can explain trends and anomalies in boiling-point data (the H₂O, HF and NH₃ anomaly; large nonpolar molecules).","I can classify a solid as ionic, molecular, covalent network or metallic and describe its properties.","I can use test data and IMF reasoning to choose or evaluate materials for a purpose."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Polarity","goal":2,"prompt":"Which molecule is polar?","options":[{"t":"Cl₂","why":"Two identical atoms: ΔEN = 0.","_n":"0822","_k":"eae50556"},{"t":"CO₂","why":"Linear CO₂: the two C=O dipoles cancel.","_n":"17f2","_k":"005d5d02"},{"t":"CH₄","why":"ΔEN for C–H is 0.35, and the shape is symmetric.","_n":"2802","_k":"5053bb76"},{"t":"H₂O","why":"Bent shape: the bond dipoles don’t cancel.","_n":"37d2","_k":"df9248a9"}],"hints":["Polar bonds \u003cem>and\u003c/em> an unsymmetrical shape.","Which molecule is bent?","H₂O."]},{"id":"w2","skill":"Polarity","goal":2,"prompt":"Using the course electronegativity values, which bond is most polar?","options":[{"t":"C–H (0.35)","why":"Smallest difference here.","_n":"47e2","_k":"3b8cec94"},{"t":"O–H (ΔEN 1.24)","why":"3.44 − 2.20 = 1.24.","_n":"57b2","_k":"e24f979d"},{"t":"N–H (0.84)","why":"3.04 − 2.20 = 0.84: less than O–H.","_n":"67c2","_k":"10c39804"},{"t":"C–Cl (0.61)","why":"Cl has a high EN, but C is fairly high too: 3.16 − 2.55 = 0.61.","_n":"7892","_k":"3e329a0a"}],"hints":["Subtract the two EN values.","Compute each ΔEN.","O–H, 1.24."]},{"id":"w3","skill":"Types of attraction","goal":2,"prompt":"Which attraction exists between molecules of \u003cem>every\u003c/em> substance?","options":[{"t":"Dipole–dipole forces","why":"Only between polar molecules.","_n":"88a2","_k":"f82ef3b9"},{"t":"London dispersion forces","why":"Moving electrons create temporary dipoles in any particle.","_n":"948f","_k":"9145140e"},{"t":"None: nonpolar molecules don’t attract","why":"Then nitrogen could never be liquefied.","_n":"a47f","_k":"ecc2c3ca"},{"t":"Hydrogen bonds","why":"Only with H on N, O or F.","_n":"b4af","_k":"8976cc4b"}],"hints":["Even helium can be liquefied. What holds it together?","Temporary dipoles.","Dispersion forces."]},{"id":"w4","skill":"Types of attraction","goal":2,"prompt":"Which substance can hydrogen bond between its own molecules?","options":[{"t":"CH₃OCH₃","why":"It has O, but every H is on a C.","_n":"c49f","_k":"c2ad078e"},{"t":"NH₃","why":"H is bonded to N, and N has a lone pair.","_n":"d44f","_k":"254ea2b7"},{"t":"CH₄","why":"H is bonded to C.","_n":"e43f","_k":"0886f75a"},{"t":"HCl","why":"Cl isn’t N, O or F; HCl has dipole–dipole forces.","_n":"f46f","_k":"6036b45c"}],"hints":["Look for H bonded \u003cem>directly\u003c/em> to N, O or F.","Check each H.","NH₃."]},{"id":"w5","skill":"Bonding in solids","goal":5,"prompt":"Sodium chloride is made of…","options":[{"t":"Metal atoms in a sea of electrons","why":"That’s metallic bonding.","_n":"g45f","_k":"7bdeb2d6"},{"t":"Na and Cl atoms sharing electrons","why":"ΔEN = 3.16 − 0.93 = 2.23: ionic, not shared.","_n":"h50f","_k":"aaa0603f"},{"t":"NaCl molecules","why":"There are no separate molecules in an ionic lattice.","_n":"i4ff","_k":"fc89f7cf"},{"t":"Na⁺ and Cl⁻ ions in a lattice","why":"Electrons are transferred: an ionic compound.","_n":"jd6f","_k":"96542c3b"}],"hints":["Metal + nonmetal.","ΔEN > 1.7.","Ions in a lattice."]},{"id":"w6","skill":"Bonding in solids","goal":5,"prompt":"Why does a copper wire conduct electricity?","options":[{"t":"Its delocalized electrons can move through the metal","why":"The electron sea carries charge.","_n":"kd7f","_k":"ce30b6d3"},{"t":"Copper atoms are polar","why":"Polarity applies to molecules.","_n":"ld8f","_k":"512104f8"},{"t":"It contains Cu²⁺ ions that move along the wire","why":"The cations stay in place; electrons move.","_n":"md9f","_k":"3284fbf8"},{"t":"Copper is hot","why":"Conduction doesn’t need heat.","_n":"nd2f","_k":"af300678"}],"hints":["What can move in a metal?","Not the cations.","Delocalized electrons."]}],"refreshers":{"Polarity":"A molecule is polar when it has polar bonds (ΔEN ≥ 0.5) and a shape that doesn’t cancel them (module 19).","Types of attraction":"Dispersion forces are always present. Dipole–dipole forces need polar molecules. Hydrogen bonds need H on N, O or F, plus a lone pair on N, O or F nearby.","Bonding in solids":"Ionic means ions in a lattice; metallic means cations plus delocalized electrons; covalent means shared electrons, in separate molecules or in a continuous network."}}},"explore":{"heading":"Force strength lab","intro":"Pick substances, see the forces between their particles, and test your predictions against real boiling points.","how":"Choose a mode. \u003cstrong>Between particles:\u003c/strong> tap one substance, or two to compare (a third tap replaces the older one). \u003cstrong>Trend graphs:\u003c/strong> pick a data set; in group 16, drag the prediction dot (or focus it and use ↑ ↓, Shift for 20 °C steps). \u003cstrong>Solid lattice:\u003c/strong> pick a solid, then run the tests.","modes":[{"id":"between","t":"Between particles"},{"id":"trend","t":"Trend graphs"},{"id":"solid","t":"Solid lattice"}],"rows":[{"lab":"10 electrons","ids":["Ne","CH4","NH3","HF","H2O"]},{"lab":"18 electrons","ids":["Ar","F2","SiH4","C2H6","PH3","HCl","H2S","CH3OH"]},{"lab":"26 electrons","ids":["C3H8","CH3OCH3","C2H5OH"]},{"lab":"42 electrons (C₅H₁₂)","ids":["pentane","2-methylbutane","2,2-dimethylpropane"]},{"lab":"Halogens","ids":["Cl2","Br2","I2"]}],"sets":[{"id":"g14","t":"Group 14 hydrides"},{"id":"g15","t":"Group 15 hydrides"},{"id":"g16","t":"Group 16 hydrides"},{"id":"g17","t":"Group 17 hydrides"},{"id":"noble","t":"Noble gases"},{"id":"hal","t":"Halogens"},{"id":"alk","t":"Straight-chain alkanes"}],"trendLabel":"Show trend line","solids":["NaCl","MgO","ice","I2","diamond","SiO2","graphite","copper","sodium"],"mystery":[{"id":"M1","_a":"GwtSQRNWQw4b","like":"SiO2","desc":"melts at 1713 °C, very hard, never conducts, insoluble"},{"id":"M2","_a":"GwxYWw1aEw==","like":"NaCl","desc":"melts at 801 °C, brittle, conducts only when molten or dissolved, soluble in water"},{"id":"M3","_a":"GwhYWQFaRAlYFxU=","like":"I2","desc":"melts at 114 °C, soft, never conducts, dissolves in hexane"}],"classes":[{"id":"ionic","t":"ionic"},{"id":"molecular","t":"molecular"},{"id":"network","t":"covalent network"},{"id":"metallic","t":"metallic"}],"gapChips":[{"id":"disp","t":"dispersion"},{"id":"dip","t":"dipole–dipole"},{"id":"hb","t":"hydrogen bonding"}],"whyChips":[{"id":"hb","t":"hydrogen bonds between water molecules"},{"id":"oh","t":"O–H bonds are strong"},{"id":"few","t":"water has fewer electrons"}],"predIntro":"Each prediction sets up the lab. Choose an answer, then watch what really happens.","predictions":[{"id":"p1","prompt":"Which boils higher, CH₄ or SnH₄?","options":[{"t":"SnH₄","_n":"od3f","_k":"51edd3a3"},{"t":"CH₄","_n":"pd4f","_k":"74c30aa8"},{"t":"They boil at the same temperature","_n":"qd5f","_k":"294dc318"},{"t":"You can’t tell without knowing their polarity","_n":"rcef","_k":"c1841dfe"}],"explain":"Both are nonpolar. SnH₄ has 54 electrons to CH₄’s 10, so stronger dispersion forces."},{"id":"p2","prompt":"H₂S has more electrons (18 vs 10). Which boils higher?","options":[{"t":"H₂S, by about 40 °C","_n":"scff","_k":"ceca04c4"},{"t":"About the same","_n":"tdcf","_k":"15283757"},{"t":"H₂O, by about 160 °C","_n":"udbf","_k":"aa318d84"},{"t":"H₂O, because boiling breaks its strong O–H bonds","_n":"vdaf","_k":"c403616f"}],"explain":"Hydrogen bonds between H₂O molecules outweigh H₂S’s slightly stronger dispersion. The O–H bonds aren’t broken by boiling."},{"id":"p3","prompt":"Same formula, same electrons. Which boils higher?","options":[{"t":"You can’t tell","_n":"wd9f","_k":"da7d7872"},{"t":"pentane","_n":"xd8f","_k":"04e9e237"},{"t":"Same","_n":"yd7f","_k":"e75fbf52"},{"t":"2,2-dimethylpropane","_n":"zd6f","_k":"0a6b58d8"}],"explain":"More surface contact gives stronger dispersion forces."},{"id":"p4","prompt":"Which sample of NaCl lights the bulb?","options":[{"t":"Neither","_n":"10d5f","_k":"3a8dae3a"},{"t":"Only solid NaCl","_n":"11d4f","_k":"94eb27a2"},{"t":"Both","_n":"12d3f","_k":"e7fe6276"},{"t":"Only molten (or dissolved) NaCl","_n":"134ae","_k":"dc4b6463"}],"explain":"Moving charged particles carry current; locked ions can’t."}],"chalIntro":"Use the lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Using only the 10-electron substances, choose two whose boiling points differ by \u003cstrong>at least 100 °C\u003c/strong>. Then choose the force that explains the gap.","why":"Equal electrons means similar dispersion forces, so a gap of 100 °C or more comes from hydrogen bonds.","hints":["Equal electrons means similar dispersion forces.","Pair a substance that hydrogen bonds with one that doesn’t.","For example, CH₄ (−162 °C) and H₂O (100 °C)."]},{"id":"tc2","goal":5,"prompt":"Classify three mystery solids. Run tests in Solid lattice mode, then place each in a bin.","why":"M1 never conducts and melts very high: a covalent network. M2 conducts only when molten or dissolved: ionic. M3 melts low and never conducts: molecular.","hints":["Melting point first, conductivity second.","Conducting only when molten is the ionic signature.","M1 network, M2 ionic, M3 molecular."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Trend graphs, group 16. Drag the prediction dot to where H₂O’s boiling point \u003cem>would\u003c/em> be if water had no hydrogen bonds and simply followed the trend of H₂S, H₂Se and H₂Te. Then choose the reason for the real gap.","why":"The trend puts water near −80 °C. Its real boiling point is about 180 °C higher, because hydrogen bonds hold its molecules together.","hints":["From H₂Te to H₂S, the boiling point falls as electrons decrease.","Continue the fall one more step to period 2.","About −80 °C. Water’s real value is 180 °C higher, because of hydrogen bonds."]}],"msgs":{"tc1":{"two":"Choose two substances in Between particles mode.","ten":"Use only the 10-electron substances: Ne, CH₄, NH₃, HF and H₂O.","neCh4":"Both have only dispersion forces, and with equal electrons their boiling points are close.","bothHb":"Both hydrogen bond, so the gap is smaller.","small":"That gap is under 100 °C. Pair a substance that hydrogen bonds with one that doesn’t.","chip":"Now choose the force that explains the gap.","disp":"Equal electrons means similar dispersion. The difference comes from hydrogen bonds.","dip":"None of the 10-electron substances relies on dipole–dipole forces. The difference comes from hydrogen bonds."},"tc2":{"place":"Place all three mystery solids in a bin first.","m1ionic":"Ionic solids conduct when molten. M1 never conducts.","m3net":"A network solid doesn’t melt at 114 °C.","m2met":"A metal conducts as a solid too.","other":"Not every solid is in the right bin yet. Melting point first, conductivity second."},"tc3":{"group":"Switch to Trend graphs and choose Group 16 hydrides.","real":"That’s water’s real boiling point. The question asks where the trend would put it.","high":"Fewer electrons means weaker dispersion, so the trend falls toward period 2.","notLow":"Not low enough yet: continue the fall from H₂Te through H₂Se and H₂S one more step.","tooLow":"Too low: from H₂Se to H₂S the boiling point falls by only 19 °C, so one more step falls about that much again.","chip":"Now choose the reason for the real gap.","oh":"Boiling doesn’t break O–H bonds.","few":"Fewer electrons would make water boil lower, not higher.","banner":"Without hydrogen bonds, water would be a gas at room temperature, and there’d be no liquid oceans."}},"blocks":[{"title":"The big idea","html":"\u003cp>Compare like with like. With equal electrons, the stronger IMF wins by tens to hundreds of degrees. Across different electron counts, dispersion can dominate: I₂ boils at 184 °C, water at 100 °C.\u003c/p>"}]},"part3":{"slug":"solids","name":"Solids","heading":"Identify the solid","intro":"A virtual test bench: choose tests, read the results table, and decide what kind of particles each unknown solid is made of. The “Check it with data” panel links every result to the particle picture that causes it.","s1":{"title":"Station 1: The test bench","intro":"Six unknown solids, U1 to U6. Each test costs one test token, and you have 12. Choose a solid, run the tests you need, then place it in a bin and press \u003cstrong>Check\u003c/strong>.","tokens":12,"reset":"Reset the bench","tests":[{"id":"mp","t":"Melting point","head":"Melting point"},{"id":"scratch","t":"Scratch test","head":"Scratch"},{"id":"cs","t":"Conducts as a solid?","head":"Conducts (solid)"},{"id":"cm","t":"Conducts when molten?","head":"Conducts (molten)"},{"id":"cw","t":"Conducts in water?","head":"Conducts (in water)"},{"id":"sw","t":"Dissolves in water?","head":"Dissolves in water"},{"id":"sh","t":"Dissolves in hexane?","head":"Dissolves in hexane"}],"noTokens":"You’re out of test tokens. Classify with the results you have, or reset the bench to start again.","classes":[{"id":"ionic","t":"ionic"},{"id":"molecular","t":"molecular"},{"id":"network","t":"covalent network"},{"id":"metallic","t":"metallic"}],"unknowns":[{"id":"U1","_a":"GwhYWQFaRAlYFxU=","name":"sucrose (table sugar)","pic":"sugar","type":"Molecular (polar)","r":{"mp":"under 200 °C","scratch":"brittle crystals","cs":"no","cm":"no","cw":"dissolves; the solution doesn’t conduct","sw":"yes","sh":"no"},"why":{"mp":"Only IMFs hold the molecules together, and they give way at a low temperature (sucrose melts and decomposes at about 186 °C).","scratch":"Weak IMFs between molecules: the crystals crumble easily.","cs":"Whole, neutral molecules carry no charge: no current.","cm":"Melting frees whole molecules, not ions: still no current.","cw":"Dissolved sucrose molecules are neutral: no current.","sw":"Its polar O–H groups hydrogen bond with water.","sh":"Its polar molecules don’t mix with nonpolar hexane."}},{"id":"U2","_a":"GwxYWw1aEw==","name":"magnesium oxide (MgO)","pic":"MgO","type":"Ionic","r":{"mp":"over 1500 °C","scratch":"hard but brittle: it cracks","cs":"no","cm":"yes","cw":"doesn’t dissolve: nothing to test","sw":"no","sh":"no"},"why":{"mp":"Mg²⁺ and O²⁻ attract strongly throughout the lattice: it melts at 2852 °C.","scratch":"Shifting a layer lines up like charges, which repel: the crystal cracks.","cs":"The ions are locked in place, so no current.","cm":"When molten, the ions are free to move and carry current.","cw":"MgO doesn’t dissolve, so there are no free ions in the water.","sw":"The attractions in the lattice are too strong for water to pull the ions apart.","sh":"Nonpolar hexane can’t attract ions."}},{"id":"U3","_a":"GwhSQQVVXQxaRw==","name":"sodium","pic":"sodium","type":"Metallic","r":{"mp":"under 200 °C","scratch":"soft: a knife cuts it, and it bends","cs":"yes","cm":"yes","cw":"not tested: reacts","sw":"not tested: reacts","sh":"not tested"},"why":{"mp":"Sodium’s metallic bonding is weak for a metal: it melts at 98 °C.","scratch":"Layers of cations slide through the electron sea without breaking: soft and malleable.","cs":"Delocalized electrons move through the metal and carry current.","cm":"The electron sea is still there in the liquid metal, so it still conducts.","cw":"Sodium reacts with water, so this test isn’t done.","sw":"Sodium reacts with water, so this test isn’t done.","sh":"Sodium is stored under oil; this test isn’t done."}},{"id":"U4","_a":"GwtSQRNWQw4b","name":"quartz (SiO₂)","pic":"SiO2","type":"Covalent network","r":{"mp":"over 1500 °C","scratch":"very hard: it scratches glass","cs":"no","cm":"no","cw":"doesn’t dissolve: nothing to test","sw":"no","sh":"no"},"why":{"mp":"Every Si and O atom is covalently bonded to its neighbours: melting means breaking covalent bonds (1713 °C).","scratch":"Strong covalent bonds in every direction: very hard.","cs":"No ions and no free electrons: no current.","cm":"Even molten, there are no ions or free electrons: no current.","cw":"Quartz doesn’t dissolve, so there’s nothing to carry charge.","sw":"Covalent bonds hold the whole network together: it doesn’t dissolve.","sh":"Covalent bonds hold the whole network together: it doesn’t dissolve."}},{"id":"U5","_a":"GwhYWQFaRAlYFxU=","name":"paraffin wax","pic":"wax","type":"Molecular (nonpolar)","r":{"mp":"under 200 °C","scratch":"soft and waxy","cs":"no","cm":"no","cw":"doesn’t dissolve: nothing to test","sw":"no","sh":"yes"},"why":{"mp":"Only dispersion forces hold its long molecules together: they give way at a low temperature.","scratch":"Weak IMFs let the molecules shift: soft.","cs":"Whole, neutral molecules carry no charge: no current.","cm":"Melting frees whole molecules, not ions: still no current.","cw":"Wax doesn’t dissolve in water, so there’s nothing to carry charge.","sw":"Nonpolar molecules don’t mix with polar water.","sh":"Dispersion forces let nonpolar wax mix with nonpolar hexane."}},{"id":"U6","_a":"GwtSQRNWQw4b","name":"graphite","pic":"graphite","type":"Covalent network (conducts)","r":{"mp":"over 1500 °C","scratch":"soft and slippery: it leaves a grey mark","cs":"yes (along its layers)","cm":"doesn’t melt below 3500 °C","cw":"doesn’t dissolve: nothing to test","sw":"no","sh":"no"},"why":{"mp":"Covalent bonds hold each layer together: it doesn’t melt below 3500 °C.","scratch":"The layers are held to each other only by weak forces, so they slide: soft and slippery.","cs":"Each C bonds to only 3 others, leaving one electron free to move along the layers. This is the exception among network solids.","cm":"It doesn’t melt below 3500 °C, so there’s no liquid to test.","cw":"Graphite doesn’t dissolve.","sw":"Covalent bonds hold each layer together: it doesn’t dissolve.","sh":"Covalent bonds hold each layer together: it doesn’t dissolve."}}],"wrong":{"ionic":"An ionic solid melts above 200 °C, is brittle and conducts only when molten or dissolved. Do the results fit?","molecular":"A molecular solid melts low (under 200 °C) and never conducts. Do the results fit?","network":"A covalent network solid melts very high and is hard; it doesn’t conduct (graphite is the exception). Do the results fit?","metallic":"A metal conducts as a solid and when molten, and is malleable. Do the results fit?","U6|metallic":"Graphite conducts, but it isn’t a metal: it doesn’t melt below 3500 °C, and it’s made of covalently bonded carbon atoms."},"typeWhy":{"ionic":"Ionic: when molten, the ions are free to move and carry current.","molecular":"Molecular: only weak IMFs hold the molecules, so it melts low; the molecules carry no charge, so it never conducts.","network":"Covalent network: every atom is bonded to its neighbours, so it melts very high; with no ions or free electrons it doesn’t conduct.","graphite":"Covalent network (the exception): each carbon bonds to three others, so one electron per atom is free to move along the layers.","metallic":"Metallic: delocalized electrons move through the cations, so it conducts as a solid and as a liquid, and the layers can slide."},"done":"All six classified with {n} test tokens.","efficient":"An efficient test plan: about two well-chosen tests per solid is enough.","wasteful":"It worked. Next time, try melting point plus one conductivity test first: that pair separates most solids.","invest":{"title":"Investigation: plan the fewest tests","q":"Which two tests distinguish a covalent network solid from an ionic one with the fewest tokens? Choose two, then press \u003cstrong>Check\u003c/strong>.","_a":"Yj4VVgkbHUdUFRVoSGITBlRHGxcXThM4ZA==","right":"Efficient: an ionic solid conducts when molten and a network solid never does. The melting point or solubility in water backs it up.","noCm":"Both can melt above 1500 °C, and neither conducts as a solid. Which test sets them apart?","withCm":"Molten conductivity is the key test. Pair it with the melting point or solubility in water.","two":"Choose exactly two tests."}},"s2":{"title":"Station 2: Check it with data","summary":"Check it with data","intro":"Choose a solid you’ve classified. Each test result is linked to the particle picture that causes it.","none":"Classify a solid at the test bench first. Its particle picture and the reasons for each result appear here."},"s3":{"title":"Station 3: Specialized materials","intro":"Match each material’s key property to its structure and particles. Then tap one benefit and one environmental consideration for each.","structures":[{"id":"sheet","t":"a single sheet of covalently bonded carbon atoms, with delocalized electrons"},{"id":"chains","t":"long molecular chains held side by side by hydrogen bonds"},{"id":"net","t":"a covalent network of Si and C atoms"}],"envs":[{"id":"energy","t":"energy-intensive production"},{"id":"recycle","t":"recycling difficulty"}],"cards":[{"id":"graphene","name":"Graphene","prop":"A single layer of graphite: strong and conductive.","_a":"GxZfUAFNEw==","right":"Every carbon is covalently bonded in the sheet (strong), and the delocalized electrons carry current (conductive).","benefits":["flexible, conductive electronics","light, strong composite materials"],"env":{"energy":"Making large, clean sheets takes high temperatures and a lot of energy.","recycle":"Graphene mixed into other materials is hard to recover."}},{"id":"aramid","name":"Aramid fibre","prop":"Molecular chains joined by hydrogen bonds: used in protective fabric.","_a":"GwZfVA1XQkc=","right":"Hydrogen bonds hold the long chains side by side, so the fibre is very strong for its mass.","benefits":["cut- and impact-resistant vests and gloves","light, strong ropes"],"env":{"energy":"It’s made from petroleum-based chemicals in an energy-intensive process.","recycle":"Woven into fabrics and composites, the fibres are hard to recycle."}},{"id":"sic","name":"Silicon carbide ceramic","prop":"A network: heat-resistant.","_a":"GwtSQUY=","right":"Covalent bonds run through the whole solid, so it stays hard and solid at very high temperatures.","benefits":["brake discs and furnace parts that resist heat","hard cutting and grinding tools"],"env":{"energy":"It’s made in electric furnaces at very high temperatures, which uses a lot of energy.","recycle":"A hard network ceramic can’t be melted down and reshaped like a metal."}}],"wrong":"Not quite. Think about which particles and forces give that property."},"quickCheck":{"title":"Quick check","summary":"Identify the solid quick check","items":[{"id":"q1","goal":5,"prompt":"“Conducts as a solid and when molten; malleable.”","choices":[{"t":"network","fb":"Only metals conduct as solids (graphite aside).","_n":"144be","_k":"5a802834"},{"t":"ionic","fb":"Only metals conduct as solids (graphite aside).","_n":"1548e","_k":"d4a85937"},{"t":"molecular","fb":"Only metals conduct as solids (graphite aside).","_n":"1649e","_k":"03b30751"},{"t":"metallic","fb":"Right. Only metals conduct as solids (graphite aside).","_n":"1746e","_k":"12705640"}]},{"id":"q2","goal":5,"prompt":"“Melts at 2852 °C, brittle, conducts only when molten.”","choices":[{"t":"network","fb":"Conducting when molten means mobile ions.","_n":"1847e","_k":"46e06c51"},{"t":"ionic","fb":"Right. Conducting when molten means mobile ions.","_n":"1944e","_k":"fe6f1044"},{"t":"metallic","fb":"Conducting when molten means mobile ions.","_n":"1a45e","_k":"88c24332"},{"t":"molecular","fb":"Conducting when molten means mobile ions.","_n":"1b52e","_k":"5c841dd5"}]},{"id":"q3","goal":5,"prompt":"Why does graphite conduct when diamond doesn’t?","choices":[{"t":"graphite is a metal","fb":"Each C in graphite bonds to only 3 others, leaving one electron free to move.","_n":"1c53e","_k":"474ef029"},{"t":"delocalized electrons in layers","fb":"Right. Each C in graphite bonds to only 3 others, leaving one electron free to move.","_n":"1dd0e","_k":"a187231d"},{"t":"diamond is molecular","fb":"Each C in graphite bonds to only 3 others, leaving one electron free to move.","_n":"1ecfe","_k":"a8331dac"},{"t":"graphite is ionic","fb":"Each C in graphite bonds to only 3 others, leaving one electron free to move.","_n":"1fd2e","_k":"fe06fc3a"}]},{"id":"q4","goal":5,"prompt":"Which test best separates molecular from covalent network solids?","choices":[{"t":"melting point","fb":"Right. IMFs give way at low temperatures; covalent networks don’t.","_n":"1gd1e","_k":"6fda5847"},{"t":"colour","fb":"IMFs give way at low temperatures; covalent networks don’t.","_n":"1hd4e","_k":"19a746c2"},{"t":"shape","fb":"IMFs give way at low temperatures; covalent networks don’t.","_n":"1id3e","_k":"f22c08b0"},{"t":"mass","fb":"IMFs give way at low temperatures; covalent networks don’t.","_n":"1jd6e","_k":"1f283972"}]}]}},"practice":{"activities":[{"id":"rank","type":"order","title":"Rank the boiling points","summary":"Rank the boiling points","goal":[3,4],"instruction":"Put each set in order of boiling point, lowest first.","sequences":[{"id":"s1","goal":3,"prompt":"Noble gases.","steps":["He","Ne","Ar","Kr"],"start":[2,0,3,1],"general":"More electrons, stronger dispersion.","why":"More electrons, stronger dispersion.","hints":["Group by electron count.","Within a group, rank by strongest IMF; for isomers, by shape.","He, Ne, Ar, Kr."]},{"id":"s2","goal":4,"prompt":"Alkanes.","steps":["2,2-dimethylpropane (C₅H₁₂)","2-methylbutane (C₅H₁₂)","pentane (C₅H₁₂)","hexane (C₆H₁₄)"],"start":[3,1,0,2],"general":"Branching lowers bp; a longer chain raises it.","why":"Branching lowers bp; a longer chain raises it. 2,2-dimethylpropane 10 °C, 2-methylbutane 28 °C, pentane 36 °C, hexane 69 °C.","hints":["Group by electron count.","Within a group, rank by strongest IMF; for isomers, by shape.","2,2-dimethylpropane, 2-methylbutane, pentane, hexane."]},{"id":"s3","goal":3,"prompt":"Propane, an ether and two alcohols.","steps":["propane (C₃H₈)","methoxymethane (CH₃OCH₃)","ethanol (C₂H₅OH)","propan-1-ol (C₃H₇OH)"],"start":[2,3,1,0],"wrong":[{"order":[0,2,1,3],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[0,2,3,1],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[0,3,2,1],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[2,0,1,3],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[2,0,3,1],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[2,1,0,3],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[2,1,3,0],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[2,3,0,1],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[2,3,1,0],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[3,0,2,1],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[3,2,0,1],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."},{"order":[3,2,1,0],"fb":"Methoxymethane has no O–H, so no hydrogen bonds between its molecules."}],"general":"Propane, methoxymethane and ethanol each have 26 electrons, so the strongest IMF decides. Propan-1-ol has more electrons and hydrogen bonds.","why":"Propane, methoxymethane and ethanol each have 26 electrons, so the strongest IMF decides. Propan-1-ol has more electrons and hydrogen bonds. Propane −42 °C, methoxymethane −24 °C, ethanol 78 °C, propan-1-ol 97 °C.","hints":["Group by electron count.","Within a group, rank by strongest IMF; for isomers, by shape.","Propane, methoxymethane, ethanol, propan-1-ol."]}]},{"id":"higher","type":"custom","title":"Which boils higher, and why?","summary":"Which boils higher?","star":true,"goal":[2,3,4],"instruction":"Six items. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Tap a choice, then press \u003cstrong>Check\u003c/strong>.","items":[{"id":"b1","goal":3,"prompt":"HCl vs F₂ (both 18 electrons). Which boils higher, and why?","options":[{"t":"HCl: dipole–dipole forces","why":"HCl is polar and F₂ isn’t. With equal electrons, polarity decides.","_n":"1kd5e","_k":"7a9de5cf"},{"t":"Neither: equal electrons give equal boiling points","why":"Equal electrons means the strongest IMF decides.","_n":"1lc8e","_k":"d61e6723"},{"t":"HCl: hydrogen bonds","why":"Cl isn’t N, O or F, so HCl has dipole–dipole forces, not hydrogen bonds.","_n":"1mc7e","_k":"91566ff9"},{"t":"F₂: fluorine is the most electronegative element","why":"F₂ is nonpolar; equal electrons, so polarity decides.","_n":"1n3ee","_k":"c5c71140"}],"hints":["Both have 18 electrons, so dispersion is similar.","Which one is polar?","HCl: its dipole–dipole forces add to dispersion."]},{"id":"b2","goal":2,"prompt":"CH₃OH vs C₂H₆ (both 18 electrons). Which boils higher, and why?","options":[{"t":"CH₃OH: its covalent bonds are stronger","why":"Boiling separates whole molecules; covalent bonds don’t break.","_n":"1o3fe","_k":"7a6d5a56"},{"t":"Neither: equal electrons give equal boiling points","why":"Equal electrons means the strongest IMF decides.","_n":"1p40e","_k":"64dfb246"},{"t":"CH₃OH: hydrogen bonds","why":"Its O–H lets its molecules hydrogen bond. C₂H₆ has only dispersion forces.","_n":"1q41e","_k":"d0039c01"},{"t":"C₂H₆: it has more H atoms","why":"C₂H₆ has only dispersion forces.","_n":"1r42e","_k":"16036e76"}],"hints":["Both have 18 electrons.","Which one has H on N, O or F?","CH₃OH: its O–H gives hydrogen bonds."]},{"id":"b3","goal":3,"star":true,"prompt":"Br₂ (70 electrons) vs HF (10 electrons, hydrogen bonded). Which boils higher, and why?","options":[{"t":"HF: it’s polar and Br₂ isn’t","why":"Polarity decides only when the electron counts match: here it’s 70 vs 10.","_n":"1s43e","_k":"021ea366"},{"t":"About the same: each has one strong force","why":"Br₂ boils at 59 °C and HF at 20 °C.","_n":"1t44e","_k":"5e14d736"},{"t":"HF: hydrogen bonds always win","why":"Hydrogen bonds don’t always win. Seven times as many electrons gives very strong dispersion.","_n":"1u45e","_k":"80a85d9e"},{"t":"Br₂: its many electrons give strong dispersion forces","why":"Br₂ boils at 59 °C and HF at 20 °C. Seven times as many electrons gives very strong dispersion.","_n":"1v46e","_k":"6b367859"}],"hints":["Count electrons.","70 vs 10.","Br₂ boils higher (59 °C)."]},{"id":"b4","goal":4,"star":true,"prompt":"NH₃ vs PH₃. Which boils higher, and why?","options":[{"t":"PH₃: it hydrogen bonds","why":"P isn’t N, O or F.","_n":"1w47e","_k":"6ce41e06"},{"t":"NH₃: hydrogen bonds, despite fewer electrons","why":"−33 °C vs −88 °C. N–H allows hydrogen bonding; P–H doesn’t.","_n":"1x44e","_k":"f44d34d5"},{"t":"NH₃: its N–H bonds are stronger","why":"Boiling separates whole molecules; N–H bonds don’t break.","_n":"1y43e","_k":"e944ee10"},{"t":"PH₃: it has more electrons","why":"PH₃ has more electrons, but N–H allows hydrogen bonding; P–H doesn’t.","_n":"1z42e","_k":"3f30fefe"}],"hints":["Count electrons: 10 vs 18.","Which one has H on N, O or F?","NH₃ (−33 °C vs −88 °C): hydrogen bonds outweigh PH₃’s extra electrons."]},{"id":"b5","goal":3,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> A student claims “polar molecules always boil higher than nonpolar ones” and cites HCl (−85 °C) and F₂ (−188 °C). Which pair would best \u003cem>test\u003c/em> the claim fairly?","options":[{"t":"HCl vs HF","why":"Both are polar, so the pair can’t test the claim.","_n":"2041e","_k":"4c9cca46"},{"t":"Two molecules with equal electron counts, one polar and one not, e.g. H₂S vs SiH₄","why":"Both have 18 electrons, so only polarity changes: a fair test.","_n":"2148e","_k":"553dde89"},{"t":"H₂O vs CH₄","why":"Equal electrons, but H₂O also hydrogen bonds, so the pair tests hydrogen bonding, not just polarity.","_n":"2247e","_k":"7c448072"},{"t":"HCl vs I₂","why":"Comparing HCl with I₂ changes two variables at once: polarity and electron count.","_n":"2346e","_k":"8a81b602"}],"hints":["A fair test changes one variable.","Keep the electron count the same.","H₂S (polar) vs SiH₄ (nonpolar): both have 18 electrons."]},{"id":"b6","goal":4,"star":true,"prompt":"Octane (C₈H₁₈, 66 electrons, bp 126 °C) vs water. Which statement is true?","options":[{"t":"Octane has no attractions between its molecules, so its bp must be wrong.","why":"Every molecule has London dispersion forces.","_n":"2445e","_k":"01ace956"},{"t":"Octane boils higher because it hydrogen bonds.","why":"Its H atoms are on C.","_n":"254ce","_k":"8b919c41"},{"t":"Water boils higher because hydrogen bonds always beat dispersion.","why":"Nonpolar doesn’t mean low bp when a molecule has many electrons.","_n":"264be","_k":"6ab32eaf"},{"t":"Octane boils higher because its dispersion forces exceed water’s hydrogen bonding.","why":"126 °C vs 100 °C: 66 electrons along a long chain give strong dispersion forces.","_n":"27530","_k":"1227c938"}],"hints":["Compare the boiling points: 126 °C vs 100 °C.","Octane is nonpolar, with 66 electrons.","Octane’s dispersion forces exceed water’s hydrogen bonding."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Lars","how":"","goal":[1,5],"instruction":"Lars made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain why water boils at a much higher temperature than hydrogen sulfide.","steps":["H₂O has 10 electrons and H₂S has 18.","So H₂S has slightly stronger dispersion forces.","Water’s O–H bonds are stronger than H₂S’s S–H bonds, and boiling must break them.","So water needs more energy to boil."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Water’s dispersion forces are stronger.","why":"Water has fewer electrons.","_n":"28540","_k":"7374a36b"},{"t":"H₂S molecules are ionic.","why":"H₂S is molecular.","_n":"29510","_k":"18f0be4b"},{"t":"Boiling separates whole molecules. Water molecules are held by hydrogen bonds (H on O, with a lone pair on O), which H₂S doesn’t have.","why":"Steam is still H₂O: only the attractions between molecules are overcome.","_n":"2a520","_k":"6bb3bb33"},{"t":"Step 3 is correct.","why":"Boiling doesn’t break O–H bonds: steam is still H₂O.","_n":"2b570","_k":"ca3258be"}],"hints":["What is steam made of?","Intact H₂O molecules.","Boiling separates whole molecules. Water molecules are held by hydrogen bonds (H on O, with a lone pair on O), which H₂S doesn’t have."]},{"id":"e2","goal":5,"task":"Classify a solid that melts at 2852 °C, is brittle, doesn’t conduct as a solid, but conducts when molten.","steps":["Its melting point is very high.","It doesn’t conduct as a solid, so it isn’t metallic.","A very high melting point with no conduction as a solid means a covalent network solid.","So it’s like quartz."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Conducting when molten shows mobile ions, so it’s ionic (like MgO).","why":"Ions locked in the solid are freed by melting and carry charge.","_n":"2c580","_k":"14497557"},{"t":"It’s metallic after all.","why":"Metals conduct as solids.","_n":"2d550","_k":"12abcbd6"},{"t":"Step 3 is correct.","why":"Network solids never conduct when molten.","_n":"2e560","_k":"e91b5b08"},{"t":"It’s molecular.","why":"Molecular solids melt low.","_n":"2f4b0","_k":"2b2d1dd8"}],"hints":["Which test hasn’t been used yet?","Molten conductivity.","Conducting when molten shows mobile ions, so it’s ionic (like MgO)."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: iodine out-boiling water, or branched isomers boiling lower?"},{"id":"j2","q":"In your own words, explain the difference between a bond and an intermolecular force."},{"id":"j3","q":"Explain to a friend the two-step method for ranking boiling points."},{"id":"j4","q":"Which solid type is hardest for you to identify from test results? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"When liquid water boils, what is overcome?","options":[{"t":"Ionic bonds","why":"Water is molecular.","_n":"2g4c0","_k":"a5a6f578"},{"t":"The O–H covalent bonds inside each molecule","why":"Then steam would be H and O.","_n":"2h590","_k":"1a7daf76"},{"t":"The bonds inside the oxygen atom","why":"Atoms aren’t broken by boiling.","_n":"2i580","_k":"1bfbec52"},{"t":"Hydrogen bonds and other attractions between H₂O molecules","why":"Steam is still H₂O.","_n":"2j5b0","_k":"9bc44350"}]},"b":{"prompt":"When solid iodine (I₂) turns to vapour, what is overcome?","options":[{"t":"Ionic attractions","why":"I₂ is molecular.","_n":"2k5a0","_k":"bfa51695"},{"t":"The I–I covalent bond","why":"Iodine vapour is still I₂.","_n":"2l550","_k":"9fca424e"},{"t":"Dispersion forces between I₂ molecules","why":"I₂ is nonpolar, so only dispersion forces hold the molecules together.","_n":"2m540","_k":"312b48b5"},{"t":"Hydrogen bonds","why":"There is no H.","_n":"2n570","_k":"e2d0804a"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which substance can hydrogen bond between its own molecules?","options":[{"t":"CH₃OCH₃","why":"No H on O.","_n":"2o560","_k":"cc4e8a56"},{"t":"CH₃OH","why":"An O–H group.","_n":"2p510","_k":"c6f57189"},{"t":"CH₄","why":"Every H in CH₄ is bonded to C.","_n":"2q500","_k":"c773acd2"},{"t":"HCl","why":"Cl isn’t N, O or F.","_n":"2rafe","_k":"811df464"}]},"b":{"prompt":"Which substance can hydrogen bond between its own molecules?","options":[{"t":"HF","why":"H on F, with lone pairs on F.","_n":"2saee","_k":"93ed2f09"},{"t":"H₂S","why":"S isn’t N, O or F.","_n":"2tade","_k":"af18573c"},{"t":"PH₃","why":"P isn’t N, O or F.","_n":"2uace","_k":"1b55f3c2"},{"t":"CH₃F","why":"The H atoms are on C.","_n":"2vabe","_k":"9fb6da0c"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"A solid conducts electricity as a solid and as a liquid, and can be hammered into sheets. It is…","options":[{"t":"metallic","why":"Delocalized electrons carry charge in the solid and the liquid, and the layers of cations can slide.","_n":"2waae","_k":"9acc0fa9"},{"t":"ionic","why":"Ionic solids don’t conduct as solids.","_n":"2xa9e","_k":"7b2cd9a1"},{"t":"covalent network","why":"Brittle and non-conducting (graphite aside).","_n":"2ya8e","_k":"0a276965"},{"t":"molecular","why":"Soft, low melting, non-conducting.","_n":"2za7e","_k":"a716b5c1"}]},"b":{"prompt":"A solid is extremely hard, melts above 1500 °C and never conducts, even when molten. It is…","options":[{"t":"covalent network","why":"Atoms covalently bonded throughout: very hard, very high melting, and no ions or free electrons.","_n":"30a6e","_k":"87f80022"},{"t":"metallic","why":"Metals conduct.","_n":"31a9e","_k":"7657ad0b"},{"t":"molecular","why":"Molecular solids melt low.","_n":"32aae","_k":"461ec550"},{"t":"ionic","why":"Ionic solids conduct when molten.","_n":"33abe","_k":"397e10d2"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Rank by boiling point, lowest first: C₃H₈, C₂H₅OH, CH₃OCH₃ (all 26 electrons).","options":[{"t":"C₃H₈ \u003c C₂H₅OH \u003c CH₃OCH₃","why":"CH₃OCH₃ has no O–H.","_n":"34ace","_k":"494eebc0"},{"t":"All equal, because the electron counts are equal","why":"Equal electrons means the strongest IMF decides.","_n":"35a5e","_k":"7d368dab"},{"t":"C₃H₈ \u003c CH₃OCH₃ \u003c C₂H₅OH","why":"Dispersion only \u003c dipole–dipole \u003c hydrogen bonding.","_n":"36a6e","_k":"8f2f5368"},{"t":"CH₃OCH₃ \u003c C₃H₈ \u003c C₂H₅OH","why":"CH₃OCH₃ is polar, so it adds dipole–dipole forces.","_n":"37a7e","_k":"c164784f"}]},"b":{"prompt":"Rank by boiling point, lowest first: F₂, HCl, HF.","options":[{"t":"F₂ \u003c HF \u003c HCl","why":"HF’s hydrogen bonds outweigh HCl’s dipoles.","_n":"38a8e","_k":"1f45fe87"},{"t":"HCl \u003c F₂ \u003c HF","why":"F₂ is nonpolar.","_n":"39a1e","_k":"b66e373b"},{"t":"F₂ \u003c HCl \u003c HF","why":"F₂ and HCl both have 18 electrons, and HCl is polar. HF has only 10 electrons, but it hydrogen bonds.","_n":"3aa2e","_k":"cb018933"},{"t":"HF \u003c F₂ \u003c HCl","why":"Fewer electrons, but hydrogen bonds.","_n":"3b1bf","_k":"081fc766"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"I₂ (106 electrons, nonpolar) boils at 184 °C; water boils at 100 °C. Which explains this?","options":[{"t":"Nonpolar molecules have no attractions, so the data must be wrong","why":"Every molecule has London dispersion forces.","_n":"3c1af","_k":"e8acfd50"},{"t":"I₂ molecules hydrogen bond","why":"There is no H in I₂, so there are no hydrogen bonds.","_n":"3d1df","_k":"6bab018a"},{"t":"I₂’s many electrons give dispersion forces stronger than water’s hydrogen bonds","why":"106 electrons vs 10: very strong dispersion forces.","_n":"3e1cf","_k":"ecdd2553"},{"t":"I₂ is secretly polar","why":"Two identical atoms: ΔEN = 0.","_n":"3f17f","_k":"a0e5c52b"}]},"b":{"prompt":"Octane (C₈H₁₈, 66 electrons) boils at 126 °C; water boils at 100 °C. Which explains this?","options":[{"t":"Boiling breaks octane’s C–C bonds","why":"Boiling separates whole molecules; the C–C bonds stay.","_n":"3g16f","_k":"1071151f"},{"t":"Octane is ionic","why":"It’s a hydrocarbon.","_n":"3h19f","_k":"2ffc6eb7"},{"t":"Octane hydrogen bonds","why":"Its H atoms are on C.","_n":"3i18f","_k":"457823e3"},{"t":"Octane’s large electron count and long chain give dispersion forces stronger than water’s hydrogen bonds","why":"66 electrons along a long chain: strong dispersion forces.","_n":"3j23f","_k":"ff18318d"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Solid Z melts at 770 °C, is brittle and dissolves in water. What will a water solution of Z do in a conductivity test?","options":[{"t":"Conduct, because Z is metallic","why":"Metals are malleable and don’t dissolve.","_n":"3k22f","_k":"6184d0de"},{"t":"Not conduct, because Z is a covalent network","why":"A network solid wouldn’t dissolve or melt at 770 °C.","_n":"3l15e","_k":"e4f3b762"},{"t":"Conduct, because Z is ionic and its dissolved ions move","why":"High melting, brittle and soluble: ionic. Dissolved ions move and carry charge.","_n":"3m16e","_k":"83cb8e43"},{"t":"Not conduct, because Z doesn’t conduct as a solid","why":"In the solid, the ions are locked in place. Melted or dissolved, they can move and carry charge.","_n":"3n13e","_k":"24bbfb9a"}]},"b":{"prompt":"Solid W melts at 80 °C, never conducts and dissolves in hexane but not water. Which forces hold W’s particles together?","options":[{"t":"Dispersion forces between nonpolar molecules","why":"Low melting, non-conducting and soluble only in hexane: nonpolar molecules.","_n":"3o14e","_k":"c01f0d87"},{"t":"Hydrogen bonds","why":"It would dissolve in water.","_n":"3p19e","_k":"8212d182"},{"t":"Ionic bonds","why":"It would melt high and conduct when molten.","_n":"3q1ae","_k":"af4c0163"},{"t":"A covalent network","why":"Networks don’t melt at 80 °C.","_n":"3r17e","_k":"586853aa"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why ethanol (78 °C) boils higher than methoxymethane (−24 °C), though both are C₂H₆O?","options":[{"t":"“Both have 26 electrons, so similar dispersion forces. Ethanol’s O–H lets its molecules hydrogen bond; methoxymethane’s H atoms are all on C, so it has only dipole–dipole forces.”","why":"Equal electrons, so the strongest IMF decides.","_n":"3s18e","_k":"76db8497"},{"t":"“Methoxymethane is nonpolar.”","why":"Its bent C–O–C makes it polar.","_n":"3t1de","_k":"4bf5eff7"},{"t":"“Ethanol’s covalent bonds are stronger.”","why":"Boiling separates whole molecules. The covalent bonds stay.","_n":"3u1ee","_k":"c828de4b"},{"t":"“Ethanol is heavier.”","why":"They have the same formula.","_n":"3v17e","_k":"167ac6be"}]},"b":{"prompt":"Which is the best explanation of why NH₃ (−33 °C) boils higher than PH₃ (−88 °C)?","options":[{"t":"“PH₃ is ionic.”","why":"It’s molecular.","_n":"3w16e","_k":"5699d932"},{"t":"“PH₃ has more electrons, but NH₃ forms hydrogen bonds (H on N, with a lone pair on N), and they outweigh the small dispersion difference.”","why":"N–H allows hydrogen bonding; P–H doesn’t.","_n":"3x15e","_k":"126a6511"},{"t":"“N–H bonds are harder to break.”","why":"Boiling doesn’t break N–H bonds.","_n":"3y14e","_k":"4f0f0cf2"},{"t":"“NH₃ has more electrons.”","why":"It has 10; PH₃ has 18.","_n":"3z1be","_k":"81cb9ccb"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which sentence correctly explains why solid NaCl doesn’t conduct but molten NaCl does?","options":[{"t":"“In the solid, Na⁺ and Cl⁻ are fixed in the lattice. When molten, the ions are free to move and carry charge.”","why":"Moving charged particles carry current; locked ions can’t.","_n":"401ae","_k":"79bd9ea8"},{"t":"“Solid NaCl is molecular.”","why":"It’s an ionic lattice.","_n":"4119e","_k":"37b58fca"},{"t":"“Molten NaCl contains free electrons.”","why":"Charge is carried by ions here.","_n":"4218e","_k":"5f7df6cc"},{"t":"“Heat turns NaCl into a metal.”","why":"No new substance forms.","_n":"431fe","_k":"19d59a1f"}]},"b":{"prompt":"Which sentence correctly explains why graphite conducts but diamond doesn’t?","options":[{"t":"“In graphite each carbon bonds to three others, leaving one delocalized electron free to move along the layers; in diamond all four electrons are in bonds.”","why":"Only graphite has electrons free to move.","_n":"441ee","_k":"526eb7f0"},{"t":"“Graphite is ionic.”","why":"It’s all carbon.","_n":"4511d","_k":"d0a77221"},{"t":"“Diamond’s electrons are too heavy.”","why":"Electron mass doesn’t change.","_n":"4612d","_k":"817b7919"},{"t":"“Graphite is a metal.”","why":"It’s a covalent network with delocalized electrons.","_n":"4713d","_k":"c03749ad"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A tile must survive 1500 °C without melting, must not conduct electricity and must resist scratching. Which solid type fits?","options":[{"t":"Metallic","why":"Metals conduct.","_n":"4814d","_k":"93ec795d"},{"t":"Molecular","why":"It would melt far below 1500 °C.","_n":"4915d","_k":"58987cc9"},{"t":"Ionic","why":"Brittle, and it conducts if it melts. A network solid is the safer match.","_n":"4a16d","_k":"ec7fa28a"},{"t":"Covalent network (such as a silicon-based ceramic)","why":"Very high melting point, hard, non-conducting.","_n":"4b17d","_k":"cd0ae21b"}]},"b":{"prompt":"A material must conduct electricity, bend without breaking and melt above 1000 °C. Which solid type fits?","options":[{"t":"Covalent network","why":"Brittle and non-conducting (graphite can’t be bent into wires).","_n":"4c18d","_k":"32549772"},{"t":"Metallic (such as copper)","why":"Metals conduct and bend without breaking; copper melts at 1085 °C.","_n":"4d19d","_k":"bcc7cf47"},{"t":"Ionic","why":"No conduction as a solid; brittle.","_n":"4e1ad","_k":"d45517c1"},{"t":"Molecular","why":"Low melting point.","_n":"4fa3e","_k":"87b96863"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Ice floats on water. Which explanation uses intermolecular forces correctly?","options":[{"t":"“Ice is ionic.”","why":"It’s molecular.","_n":"4ga2e","_k":"ae1976d7"},{"t":"“Freezing breaks O–H bonds.”","why":"Freezing doesn’t break O–H bonds: ice is still H₂O.","_n":"4ha5e","_k":"97afffa7"},{"t":"“In ice, hydrogen bonds hold molecules in an open hexagonal arrangement that takes up more space than the liquid, so ice is less dense.”","why":"The hydrogen bonds fix the molecules in an open pattern.","_n":"4ia4e","_k":"457aa860"},{"t":"“Ice contains air bubbles.”","why":"Pure ice floats too.","_n":"4ja7e","_k":"30322e6b"}]},"b":{"prompt":"Rubbing alcohol (propan-2-ol, bp 82 °C) evaporates faster than water at room temperature. Which explanation is correct?","options":[{"t":"“Each water molecule can form more hydrogen bonds (two H atoms on O, plus two lone pairs) than a propan-2-ol molecule (one O–H), so water’s molecules are held more strongly overall.”","why":"More hydrogen bonds per molecule: water’s molecules escape less easily.","_n":"4ka6e","_k":"cfbf73e4"},{"t":"“Propan-2-ol is ionic.”","why":"It’s molecular.","_n":"4la9e","_k":"02a14807"},{"t":"“Propan-2-ol has fewer electrons.”","why":"It has more (34 vs 10).","_n":"4ma8e","_k":"5f19577b"},{"t":"“Water’s O–H bonds are stronger.”","why":"Evaporation doesn’t break O–H bonds.","_n":"4n9be","_k":"86b230e6"}]}}]},"task":{"title":"Boiling-point staircase","summary":"Boiling-point staircase","statement":"\u003cp>Build a three-step staircase for a poster on molecular compounds: three substances that show dispersion, then dipole–dipole, then hydrogen bonding, in a fair comparison. Can you find all the answers?\u003c/p>\u003col class=\"imf-conds\">\u003cli>All three have the same number of electrons (a fair test: dispersion controlled).\u003c/li>\u003cli>The strongest IMFs are, in order: dispersion only, dipole–dipole, hydrogen bonding.\u003c/li>\u003cli>They’re placed in order of increasing boiling point.\u003c/li>\u003cli>All three are compounds (no elements).\u003c/li>\u003c/ol>","cards":["Ne","CH4","NH3","HF","H2O","F2","Ar","SiH4","C2H6","PH3","HCl","H2S","CH3OH","C3H8","CH3OCH3","C2H5OH"],"how":"Tap a card, then tap a step to place it. Tap a filled step to clear it.","checks":["Same electron count","Dispersion → dipole → hydrogen bond","Boiling point rises at each step","Compounds only"],"tips":["Count electrons: C has 6, H 1, O 8, Si 14, P 15, S 16, Cl 17.","The 10-electron group has no substance with only dipole–dipole forces.","Check the order of your steps.","Ne, Ar and F₂ are elements."],"explainPrompt":"Explain why equal electron counts make this a fair comparison, and what each step adds.","vocab":"Use the words dispersion, dipole–dipole, hydrogen bond, electrons and controlled variable.","more":"There’s more than one answer. Can you find another?","afterAt":7,"after3":"Notice that every dipole–dipole substance boils above every dispersion-only one with the same electrons, and the hydrogen-bonded one tops each staircase."},"cards":[["Intermolecular force","An attraction \u003cem>between\u003c/em> particles. It is broken in melting and boiling; covalent bond
