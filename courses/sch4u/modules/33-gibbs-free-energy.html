.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 33: hero, Spontaneity map (Explore), Free energy and equilibrium (Part 3), Calculate with ΔG, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* colour roles: ΔH orange, ΔS teal, T ink */
.gf-dh{color:var(--en-dh)}
.gf-ds{color:var(--en-cat)}
.gf-t{color:var(--ink)}
.gf-heq{white-space:nowrap}

/* hero */
.gf-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.gf-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.gf-hx-cap{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Spontaneity map */
.gf-how{margin-top:0}
.gf-modes{margin:0 0 10px}
.gf-pre{margin:0 0 6px}
.gf-pre[hidden],.gf-prenote[hidden],.gf-quadw[hidden],.gf-jarw[hidden]{display:none}
.gf-prenote{margin:0 0 6px}
.gf-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 26px;align-items:start;margin-top:10px}
.gf-left,.gf-right{min-width:0}
.gf-graph,.gf-tk-svg,.gf-prog,.gf-dia,.gf-jar,.gf-beaker{display:block;width:100%;height:auto}
.gf-gnote{margin:2px 0 10px}
.gf-h4{margin:4px 0 8px;font-size:1rem}
.gf-sliders{display:grid;gap:10px}
.gf-sl{display:grid;gap:2px}
.gf-sl-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-family:var(--font-ui)}
.gf-sl-lab{font-weight:700}
.gf-sl-out{font-weight:700;font-variant-numeric:tabular-nums}
.gf-sl input[type=range]{width:100%;min-height:32px}
.gf-sl input[type=range]:disabled{opacity:.45}
.gf-cap{min-height:1.6em;margin:10px 0 0;color:var(--ink-2)}
.gf-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.gf-jcap{min-height:2.6em;margin:4px 0 0;color:var(--ink-2)}

/* quadrant chart */
.gf-q{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:4px;font-family:var(--font-ui);font-size:.86rem}
.gf-qh{text-align:center;font-weight:700;color:var(--ink-2)}
.gf-qv{align-self:center;font-weight:700;color:var(--ink-2);white-space:nowrap;padding-right:4px}
.gf-qc{position:relative;border:1.5px solid var(--rule);border-radius:6px;padding:10px 8px;min-height:3.6em;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--sheet)}
.gf-qc.on{border:2.5px solid var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
.gf-qm{display:block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}

/* Part 3 */
.gf-st1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.gf-kread{margin-top:10px}
.gf-rule{margin:8px 0}
.gf-tscroll{overflow-x:auto}
.gf-tab{border-collapse:collapse;font-family:var(--font-ui);font-size:.9rem;min-width:100%}
.gf-tab th,.gf-tab td{border:1px solid var(--rule);padding:6px 8px;text-align:center;white-space:nowrap}
.gf-tab th{text-align:left;color:var(--ink-2)}
.gf-tab td.on{background:var(--hi);color:var(--hi-ink);font-weight:700}
.gf-st2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 24px;align-items:start;margin-top:10px}
.gf-rl{margin:0 0 2px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.gf-bar{height:14px;border:1.5px solid var(--rule);border-radius:4px;margin-bottom:8px;overflow:hidden}
.gf-bar span{display:block;height:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Calculate with ΔG */
.gf-chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gf-side{margin:8px 0 0;font-size:.92rem}

/* task */
.gf-conds{margin:6px 0 0}
.gf-tkl{margin:6px 0 0;padding-left:1.2em}
.gf-tk-h,.gf-tk-s{margin-bottom:10px}

@media (max-width:760px){
  .gf-grid,.gf-st1,.gf-st2{grid-template-columns:minmax(0,1fr)}
}

air at room temperature.","p4":"Cold pack preset."},"predictions":[{"id":"p1","prompt":"Map: Δ\u003ci>H\u003c/i> = −80 kJ, Δ\u003ci>S\u003c/i> = −0.200 kJ/K. At 600 K, is the reaction spontaneous?","options":[{"t":"Yes, it’s exothermic","_n":"oc0f","_k":"84311e04"},{"t":"Can’t tell","_n":"pbdf","_k":"d75e2a1c"},{"t":"It’s at equilibrium","_n":"qbef","_k":"20185b40"},{"t":"No","_n":"rb3f","_k":"b5ee82a2"}],"explain":"The dot sits above zero: Δ\u003ci>G\u003c/i> = −80 + 120 = +40 kJ. At high \u003ci>T\u003c/i>, the −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> term (+120 kJ) outweighs Δ\u003ci>H\u003c/i>. Both terms matter. A big entropy gain can drive an endothermic change; an entropy loss can stop an exothermic one at high \u003ci>T\u003c/i>."},{"id":"p2","prompt":"Ice preset. At −10 °C (263 K), does ice melt on its own?","options":[{"t":"Only if stirred","_n":"sb4f","_k":"b2cbf5ef"},{"t":"It’s at equilibrium","_n":"tc1f","_k":"c40574ca"},{"t":"No","_n":"uc0f","_k":"a5081225"},{"t":"Yes","_n":"vc3f","_k":"6f3b09ae"}],"explain":"Δ\u003ci>G\u003c/i> = 6.01 − 263 × 0.0220 = +0.22 kJ. Below 273 K, Δ\u003ci>G\u003c/i> > 0 for melting. At 273 K it is 0, the melting point."},{"id":"p3","prompt":"Δ\u003ci>G\u003c/i> for methane burning is about −800 kJ at room temperature. When you open the gas valve, does the methane burn immediately?","options":[{"t":"No, Δ\u003ci>G\u003c/i> is really positive","_n":"wc2f","_k":"ad4c9b9e"},{"t":"Yes","_n":"xbdf","_k":"b6671b14"},{"t":"Only in sunlight","_n":"ybcf","_k":"d05c8836"},{"t":"No, it needs a spark","_n":"zbff","_k":"447fbb3f"}],"explain":"Nothing happens until the spark. Spontaneous means it \u003cem>can\u003c/em> happen; the activation energy is too high at room temperature. Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed."},{"id":"p4","prompt":"Cold pack preset at 300 K. The process is endothermic. Is it spontaneous?","options":[{"t":"Only above 1000 K","_n":"10bef","_k":"25b537f2"},{"t":"No","_n":"11b9f","_k":"79a286cf"},{"t":"Yes","_n":"12b8f","_k":"b3bf92ce"},{"t":"Only below 100 K","_n":"13b7e","_k":"9cefcdfe"}],"explain":"Δ\u003ci>G\u003c/i> = 15 − 300 × 0.075 = −7.5 kJ. The entropy gain wins: \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> = 22.5 kJ > Δ\u003ci>H\u003c/i> = 15 kJ. Both terms matter. A big entropy gain can drive an endothermic change; an entropy loss can stop an exothermic one at high \u003ci>T\u003c/i>."}],"chalIntro":"Use the spontaneity map to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Map mode: set Δ\u003ci>H\u003c/i> and Δ\u003ci>S\u003c/i> so the reaction is spontaneous at \u003cstrong>every\u003c/strong> temperature on the slider.","why":"Δ\u003ci>H\u003c/i> \u003c 0 and Δ\u003ci>S\u003c/i> > 0: both terms make Δ\u003ci>G\u003c/i> negative, so the line never crosses zero.","hints":["Which quadrant never crosses zero?","You want Δ\u003ci>H\u003c/i> negative and −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> negative.","Δ\u003ci>H\u003c/i> \u003c 0 and Δ\u003ci>S\u003c/i> > 0."]},{"id":"tc2","goal":3,"prompt":"Limestone preset: set \u003ci>T\u003c/i> to the lowest slider value at which the decomposition is spontaneous.","why":"At 1150 K, Δ\u003ci>G\u003c/i> = −3.7 kJ; at 1125 K it is still +0.3 kJ. The crossover is 179.2 ÷ 0.159 ≈ 1127 K.","hints":["Crossover = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>.","179.2 ÷ 0.159 ≈ 1127 K.","The next slider value above it: 1150 K."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Map mode: design a reaction with Δ\u003ci>H\u003c/i> = +90 kJ that is spontaneous \u003cstrong>above 600 K and not below\u003c/strong>.","why":"Δ\u003ci>S\u003c/i> = Δ\u003ci>H\u003c/i> ÷ \u003ci>T\u003c/i> = 90 ÷ 600 = +0.150 kJ/K (150 J/K): the crossover sits at exactly 600 K.","hints":["At the crossover, Δ\u003ci>G\u003c/i> = 0, so Δ\u003ci>H\u003c/i> = \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>.","Δ\u003ci>S\u003c/i> = Δ\u003ci>H\u003c/i> ÷ \u003ci>T\u003c/i> = 90 ÷ 600.","+0.150 kJ/K (150 J/K)."]}],"msgs":{"needMap":"Switch to Map mode first.","needLime":"Choose the Limestone → lime preset in Real processes mode first.","tc1":{"bothNeg":"Spontaneous only below the crossover; slide \u003ci>T\u003c/i> up to see it fail.","zeroS":"Then Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i>, which works, but this challenge asks for help from entropy too: make Δ\u003ci>S\u003c/i> > 0.","bothPos":"Spontaneous only above the crossover; slide \u003ci>T\u003c/i> down to see it fail.","never":"This quadrant is never spontaneous: both terms make Δ\u003ci>G\u003c/i> positive.","other":"Not yet. Which quadrant keeps Δ\u003ci>G\u003c/i> below zero at every temperature?"},"tc2":{"t1125":"Δ\u003ci>G\u003c/i> = +0.3 kJ, just short.","low":"Lower \u003ci>T\u003c/i> makes Δ\u003ci>G\u003c/i> more positive here.","t1100":"Δ\u003ci>G\u003c/i> = +4.3 kJ at 1100 K: not spontaneous yet.","high":"Spontaneous, but not the lowest slider value. Slide \u003ci>T\u003c/i> down."},"tc3":{"needH":"Set Δ\u003ci>H\u003c/i> to +90 kJ first.","neg":"Then Δ\u003ci>G\u003c/i> is always positive.","s200":"The crossover is 450 K.","s015":"That’s 15 J/K: the crossover would be 6000 K. Check the units.","zero":"With Δ\u003ci>S\u003c/i> = 0, Δ\u003ci>G\u003c/i> = +90 kJ at every temperature.","other":"The crossover must be exactly 600 K: Δ\u003ci>S\u003c/i> = Δ\u003ci>H\u003c/i> ÷ \u003ci>T\u003c/i>."}},"blocks":[{"title":"The big idea","html":"\u003cp>Δ\u003ci>G\u003c/i> is a straight line in \u003ci>T\u003c/i>. The signs of Δ\u003ci>H\u003c/i> and Δ\u003ci>S\u003c/i> decide whether it ever crosses zero, and spontaneity is about direction, not speed.\u003c/p>"}]},"part3":{"slug":"equilibrium","name":"Equilibrium","heading":"Free energy and equilibrium","intro":"Three stations link Δ\u003ci>G\u003c/i>° to equilibrium. Check it with data: slide Δ\u003ci>G\u003c/i>° and read \u003ci>K\u003c/i>, follow a reaction to equilibrium, then meet changes that are spontaneous but slow.","s1":{"title":"Station 1: Δ\u003ci>G\u003c/i>° and \u003ci>K\u003c/i>","intro":"Slide Δ\u003ci>G\u003c/i>°. The equilibrium constant \u003ci>K\u003c/i> at 298 K and the beaker’s share of products update.","label":"Δ\u003ci>G\u003c/i>°","kLabel":"\u003ci>K\u003c/i> at 298 K","share":"Products at equilibrium","rule":"Δ\u003ci>G\u003c/i>° \u003c 0 → \u003ci>K\u003c/i> > 1 (products favoured); Δ\u003ci>G\u003c/i>° > 0 → \u003ci>K\u003c/i> \u003c 1 (reactants favoured, but some product still forms).","tableTitle":"Check it with data","note":"\u003ci>K\u003c/i> is calculated from Δ\u003ci>G\u003c/i>° at 298 K. Only the link between the sign of Δ\u003ci>G\u003c/i>° and the size of \u003ci>K\u003c/i> is assessed here.","scaleNote":"When products or reactants are below 2%, the beaker still shows one particle, so you can see that some always forms."},"s2":{"title":"Station 2: Δ\u003ci>G\u003c/i>° vs Δ\u003ci>G\u003c/i>","intro":"As a reaction proceeds, Δ\u003ci>G\u003c/i> moves toward 0. When Δ\u003ci>G\u003c/i> = 0, the mixture is at \u003cstrong>equilibrium\u003c/strong> and both directions continue at equal rates (more in module 34). Drag the reaction-progress marker and watch Δ\u003ci>G\u003c/i> fall to 0 at the equilibrium mixture.","model":"Model reaction A ⇌ B with Δ\u003ci>G\u003c/i>° = −5 kJ at 298 K (model data).","progress":"Reaction progress (share of B)","eq":"Equilibrium: Δ\u003ci>G\u003c/i> = 0. Forward and reverse rates are equal, so the mixture stops changing, but both reactions keep going.","fwd":"Δ\u003ci>G\u003c/i> \u003c 0: the forward reaction is spontaneous, so more B forms.","rev":"Δ\u003ci>G\u003c/i> > 0: past equilibrium, the reverse reaction is spontaneous, so B turns back into A.","std":"At 50% (A and B equal, so Q = 1), Δ\u003ci>G\u003c/i> = Δ\u003ci>G\u003c/i>°."},"s3":{"title":"Station 3: Spontaneous but slow","html":"\u003cp>\u003cstrong>Diamond → graphite\u003c/strong> has Δ\u003ci>G\u003c/i>° = −2.9 kJ/mol \u003cspan class=\"tiny muted\">(course table addition)\u003c/span>, so the change is spontaneous. Yet diamonds last for billions of years, because the activation energy is enormous: almost no atoms ever have enough energy to rearrange.\u003c/p>\u003cp>The same holds for \u003cstrong>sugar in air\u003c/strong> and \u003cstrong>paper in air\u003c/strong>. Both have hugely negative Δ\u003ci>G\u003c/i> for burning, but they sit unchanged until a flame supplies \u003ci>E\u003c/i>\u003csub>a\u003c/sub>.\u003c/p>\u003cp>Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.\u003c/p>","aria":"Energy diagram for diamond turning into graphite: graphite sits slightly lower than diamond, but a very tall activation-energy hump separates them."},"quickCheck":{"title":"Quick check","summary":"Free energy and equilibrium quick check","items":[{"id":"q1","goal":5,"prompt":"Δ\u003ci>G\u003c/i>° = −20 kJ at 298 K. \u003ci>K\u003c/i> is…","choices":[{"t":"negative","fb":"Negative Δ\u003ci>G\u003c/i>° favours products.","_n":"14b8e","_k":"d6d8ef2a"},{"t":"greater than 1","fb":"Right. Negative Δ\u003ci>G\u003c/i>° favours products.","_n":"15b9e","_k":"b4d2e1b9"},{"t":"exactly 1","fb":"Negative Δ\u003ci>G\u003c/i>° favours products.","_n":"16bae","_k":"ae80bf71"},{"t":"less than 1","fb":"Negative Δ\u003ci>G\u003c/i>° favours products.","_n":"17bbe","_k":"68fbd353"}]},{"id":"q2","goal":5,"prompt":"At equilibrium, Δ\u003ci>G\u003c/i> equals…","choices":[{"t":"Δ\u003ci>H\u003c/i>","fb":"No net drive in either direction. Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"18bce","_k":"77265f85"},{"t":"Δ\u003ci>G\u003c/i>°","fb":"No net drive in either direction. Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"19bde","_k":"9fe7082b"},{"t":"−1","fb":"No net drive in either direction. Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"1abee","_k":"fc64eb16"},{"t":"0","fb":"Right. No net drive in either direction.","_n":"1bafe","_k":"eb654b28"}]},{"id":"q3","goal":4,"prompt":"Why do diamonds last although diamond → graphite has Δ\u003ci>G\u003c/i>° \u003c 0?","choices":[{"t":"Very high activation energy","fb":"Right. Spontaneous isn’t fast.","_n":"1cb0e","_k":"9361e81e"},{"t":"Δ\u003ci>G\u003c/i>° is really positive","fb":"Spontaneous isn’t fast. Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"1dbde","_k":"52cf0e1e"},{"t":"Diamond is a gas","fb":"Spontaneous isn’t fast. Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"1ebce","_k":"592aede8"},{"t":"Graphite is unstable","fb":"Spontaneous isn’t fast. Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"1fbbe","_k":"7e12d652"}]},{"id":"q4","goal":5,"prompt":"Δ\u003ci>G\u003c/i>° = +40 kJ. \u003ci>K\u003c/i> is about…","choices":[{"t":"−40","fb":"Positive Δ\u003ci>G\u003c/i>°: small, but not zero. Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"1gbae","_k":"e92006b0"},{"t":"1 × 10\u003csup>−7\u003c/sup>","fb":"Right. Positive Δ\u003ci>G\u003c/i>°: small, but not zero.","_n":"1hc1e","_k":"001ebdbf"},{"t":"1 × 10\u003csup>7\u003c/sup>","fb":"Positive Δ\u003ci>G\u003c/i>°: small, but not zero. Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"1ic0e","_k":"06bd58bc"},{"t":"0","fb":"Positive Δ\u003ci>G\u003c/i>°: small, but not zero. Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"1jbfe","_k":"de2c982a"}]}]}},"practice":{"activities":[{"id":"quad","type":"sorter","title":"Which quadrant?","summary":"Which quadrant?","noun":"process","goal":2,"txt":true,"instruction":"Decide the signs of Δ\u003ci>H\u003c/i> and Δ\u003ci>S\u003c/i> for each process, then sort it into its box.","how":"Tap a process, then tap the box it belongs in.","boxes":[{"id":"always","label":"Always spontaneous","sub":"Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> > 0"},{"id":"never","label":"Never spontaneous","sub":"Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> \u003c 0"},{"id":"high","label":"Spontaneous at high \u003ci>T\u003c/i>","sub":"both +"},{"id":"low","label":"Spontaneous at low \u003ci>T\u003c/i>","sub":"both −"}],"wrongDefault":"Find the signs of Δ\u003ci>H\u003c/i> and Δ\u003ci>S\u003c/i>, then match the pair to a box.","items":[{"id":"x1","t":"Water boiling.","_a":"RwlQVQsU","why":"Δ\u003ci>H\u003c/i> > 0 (heat absorbed) and Δ\u003ci>S\u003c/i> > 0 (liquid → gas): spontaneous above 100 °C.","wrong":{"never":"Endothermic, but liquid → gas: spontaneous above 100 °C."},"hints":["Find the sign of Δ\u003ci>H\u003c/i>.","Find the sign of Δ\u003ci>S\u003c/i>.","Match the pair to a box."]},{"id":"x2","t":"Water freezing.","_a":"Rw1WRUE=","why":"Δ\u003ci>H\u003c/i> \u003c 0 (heat released) and Δ\u003ci>S\u003c/i> \u003c 0 (liquid → solid): spontaneous below 0 °C.","wrong":{},"hints":["Find the sign of Δ\u003ci>H\u003c/i>.","Find the sign of Δ\u003ci>S\u003c/i>.","Match the pair to a box."]},{"id":"x3","t":"Ammonia forming from N\u003csub>2\u003c/sub> and H\u003csub>2\u003c/sub>.","_a":"Rw1WRUE=","why":"Δ\u003ci>H\u003c/i> \u003c 0 and Δ\u003ci>S\u003c/i> \u003c 0 (4 mol of gas → 2 mol): spontaneous below the crossover.","wrong":{"always":"Exothermic, but 4 mol of gas → 2 mol: sp atch the pair to a box."]}]},{"id":"calc","type":"custom","title":"Calculate with Δ\u003ci>G\u003c/i>","summary":"Calculate with ΔG","star":true,"goal":[1,3,6],"instruction":"Six calculations. Items 3 to 6 are non-routine (★); items 5 and 6 go beyond the Final Check.","how":"Type a number (or tap a choice), then press \u003cstrong>Check\u003c/strong>.","items":[{"id":"x1","goal":1,"prompt":"Δ\u003ci>H\u003c/i> = +40 kJ, Δ\u003ci>S\u003c/i> = +100 J/K, \u003ci>T\u003c/i> = 300 K. Δ\u003ci>G\u003c/i>?","unit":"kJ","_a":"PlAJbw==","display":"+10 kJ","why":"40 − 300 × 0.100 = 40 − 30 = +10 kJ.","wrong":[{"match":70,"fb":"Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i> \u003cstrong>minus\u003c/strong> \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>."},{"match":-29960,"fb":"Convert Δ\u003ci>S\u003c/i> to kJ/K first: 150 J/K = 0.150 kJ/K."}],"hints":["Convert Δ\u003ci>S\u003c/i> to kJ/K: 100 J/K = 0.100 kJ/K.","Δ\u003ci>G\u003c/i> = 40 − 300 × 0.100.","+10 kJ."]},{"id":"x2","goal":3,"prompt":"Same reaction: crossover temperature?","unit":"K","_a":"PlUJAj4=","display":"400 K","why":"40 ÷ 0.100 = 400 K.","wrong":[{"match":0.4,"fb":"Convert Δ\u003ci>S\u003c/i> to kJ/K first: 150 J/K = 0.150 kJ/K. Use 0.100 kJ/K."}],"hints":["Crossover = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>.","Use Δ\u003ci>S\u003c/i> = 0.100 kJ/K.","40 ÷ 0.100 = 400 K."]},{"id":"x3","goal":3,"star":true,"prompt":"A liquid has Δ\u003ci>H\u003c/i>\u003csub>vap\u003c/sub> = +30.0 kJ/mol and Δ\u003ci>S\u003c/i>\u003csub>vap\u003c/sub> = +100 J/(mol·K). Find its boiling point.","unit":"K","_a":"PlIJAj4=","display":"300 K (27 °C)","why":"At the boiling point Δ\u003ci>G\u003c/i> = 0, so \u003ci>T\u003c/i> = 30.0 ÷ 0.100 = 300 K (27 °C).","wrong":[{"match":3000,"fb":"Δ\u003ci>S\u003c/i> = 0.100 kJ/(mol·K)."},{"match":0.3,"fb":"Convert Δ\u003ci>S\u003c/i> to kJ/K first: 150 J/K = 0.150 kJ/K."},{"match":27,"fb":"Give the answer in kelvin: 300 K is 27 °C."}],"hints":["At the boiling point, Δ\u003ci>G\u003c/i> = 0.","\u003ci>T\u003c/i> = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>, with Δ\u003ci>S\u003c/i> = 0.100 kJ/(mol·K).","30.0 ÷ 0.100 = 300 K."]},{"id":"x4","goal":3,"star":true,"prompt":"A reaction becomes spontaneous above 500 K, and Δ\u003ci>H\u003c/i> = +75 kJ. Find Δ\u003ci>S\u003c/i> in J/K.","unit":"J/K","_a":"PlAMAk8GGgJQPA==","display":"+150 J/K (0.150 kJ/K)","why":"Δ\u003ci>S\u003c/i> = Δ\u003ci>H\u003c/i> ÷ \u003ci>T\u003c/i> = 75 ÷ 500 = +0.150 kJ/K = +150 J/K.","wrong":[{"match":-150,"fb":"Spontaneous above the crossover means Δ\u003ci>S\u003c/i> > 0."},{"match":-0.15,"fb":"Spontaneous above the crossover means Δ\u003ci>S\u003c/i> > 0."}],"hints":["At the crossover, Δ\u003ci>H\u003c/i> = \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>.","Δ\u003ci>S\u003c/i> = 75 ÷ 500 kJ/K.","+0.150 kJ/K = +150 J/K."]},{"id":"x5","goal":6,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> A salt dissolves on its own at 25 °C and the solution gets colder. Which must be true?","options":[{"t":"Δ\u003ci>S\u003c/i> \u003c 0","why":"Getting colder means endothermic: only a large entropy gain can make Δ\u003ci>G\u003c/i> \u003c 0.","_n":"1kbee","_k":"40c83c50"},{"t":"Δ\u003ci>H\u003c/i> \u003c 0","why":"Getting colder means endothermic: only a large entropy gain can make Δ\u003ci>G\u003c/i> \u003c 0.","_n":"1lb5e","_k":"cd368013"},{"t":"Δ\u003ci>G\u003c/i> > 0","why":"It dissolves on its own, so Δ\u003ci>G\u003c/i> \u003c 0. Getting colder means endothermic: only a large entropy gain can make Δ\u003ci>G\u003c/i> \u003c 0.","_n":"1mb4e","_k":"74d4ca37"},{"t":"Δ\u003ci>S\u003c/i> > 0 and \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> > Δ\u003ci>H\u003c/i>","why":"Getting colder means endothermic: only a large entropy gain can make Δ\u003ci>G\u003c/i> \u003c 0.","_n":"1nc3e","_k":"a7e5b637"}],"hints":["The solution gets colder: is Δ\u003ci>H\u003c/i> positive or negative?","Positive. So what must make Δ\u003ci>G\u003c/i> negative?","A large entropy gain: Δ\u003ci>S\u003c/i> > 0 and \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> > Δ\u003ci>H\u003c/i>."]},{"id":"x6","goal":3,"star":true,"prompt":"Using rounded values Δ\u003ci>H\u003c/i> = −92 kJ and Δ\u003ci>S\u003c/i> = −0.200 kJ/K for ammonia synthesis, find the highest temperature at which it is spontaneous at standard conditions.","unit":"K","_a":"PlUPAj4=","display":"460 K","side":{"label":"Below or above that temperature, the reaction is spontaneous…","options":[{"t":"below it","_n":"1oc4e","_k":"fce56c61"},{"t":"above it","_n":"1pc1e","_k":"9911b464"}]},"sideWrong":"Not above. If Δ\u003ci>S\u003c/i> > 0, raising \u003ci>T\u003c/i> makes −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> more negative: spontaneous \u003cstrong>above\u003c/strong> the crossover. Here Δ\u003ci>S\u003c/i> \u003c 0, so raising \u003ci>T\u003c/i> makes Δ\u003ci>G\u003c/i> more positive: spontaneous below the crossover.","why":"−92 ÷ −0.200 = 460 K. Both signs are negative, so it is spontaneous below 460 K.","wrong":[{"match":-460,"fb":"Temperatures in kelvin are positive: −92 ÷ −0.200 = +460."},{"match":0.46,"fb":"Convert Δ\u003ci>S\u003c/i> to kJ/K first: 150 J/K = 0.150 kJ/K."}],"hints":["Both signs are negative: spontaneous at low \u003ci>T\u003c/i>.","Crossover = −92 ÷ −0.200.","460 K; below it, Δ\u003ci>G\u003c/i> \u003c 0."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Tobias","how":"","goal":[1,4],"instruction":"Tobias made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Δ\u003ci>H\u003c/i> = +60 kJ, Δ\u003ci>S\u003c/i> = +0.150 kJ/K. Is the reaction spontaneous at 227 °C?","steps":["Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i> − \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>.","\u003ci>T\u003c/i> = 227.","Δ\u003ci>G\u003c/i> = 60 − 227 × 0.150 = +26 kJ.","Not spontaneous."],"_a":"VA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2.","Step 4 follows."],"fixes":[{"t":"Use \u003ci>T\u003c/i> Δ\u003ci>G\u003c/i>° = −890 kJ means for methane burning.","steps":["Δ\u003ci>G\u003c/i>° is negative.","So the reaction is spontaneous at 298 K.","So methane burns as soon as it touches air.","That’s why gas stoves don’t need igniters."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Spontaneous means it can happen on its own, but the activation energy is high; a spark is needed to start it.","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"1y28e","_k":"03c69cc4"},{"t":"Δ\u003ci>G\u003c/i>° negative means it never happens.","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"1z2be","_k":"83028556"},{"t":"Methane burns only if Δ\u003ci>H\u003c/i> > 0.","why":"Burning is exothermic. Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"202ae","_k":"e5622efe"},{"t":"Step 3 is correct.","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"212de","_k":"9ec691ce"}],"hints":["Does Δ\u003ci>G\u003c/i> tell you anything about speed?","No: that’s kinetics.","It needs \u003ci>E\u003c/i>\u003csub>a\u003c/sub>: a spark."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: an endothermic change that happens on its own, or an exothermic one that doesn’t?"},{"id":"j2","q":"In your own words, explain why temperature matters in Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i> − \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>."},{"id":"j3","q":"Explain to a friend the difference between ‘spontaneous’ and ‘fast’, with an example."},{"id":"j4","q":"Which step trips you up most (units, kelvin, or crossover direction)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which equation gives the Gibbs free energy change?","options":[{" "_n":"2o3ed","_k":"276470bd"},{"t":"exactly 1","why":"That’s for Δ\u003ci>G\u003c/i>° = 0.","_n":"2p3dd","_k":"a98a3d87"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"Δ\u003ci>H\u003c/i> = +60 kJ, Δ\u003ci>S\u003c/i> = +150 J/K, \u003ci>T\u003c/i> = 500 K. Δ\u003ci>G\u003c/i>?","options":[{"t":"−74 940 kJ","why":"Convert Δ\u003ci>S\u003c/i> to kJ/K first: 150 J/K = 0.150 kJ/K.","_n":"2q3cd","_k":"18122cc1"},{"t":"+15 kJ","why":"That’s \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> − Δ\u003ci>H\u003c/i>.","_n":"2r1f5","_k":"a384804e"},{"t":"−15 kJ","why":"60 − 500 × 0.150.","_n":"2s1e5","_k":"f1a9ecc7"},{"t":"+135 kJ","why":"Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i> \u003cstrong>minus\u003c/strong> \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>.","_n":"2t215","_k":"9e6882fa"}]},"b":{"prompt":"Δ\u003ci>H\u003c/i> = −80 kJ, Δ\u003ci>S\u003c/i> = −200 J/K, \u003ci>T\u003c/i> = 300 K. Δ\u003ci>G\u003c/i>?","options":[{"t":"−20 kJ","why":"−80 − 300 × (−0.200).","_n":"2u205","_k":"448de221"},{"t":"−140 kJ","why":"Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i> \u003cstrong>minus\u003c/strong> \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i>.","_n":"2v1b5","_k":"cbf9582e"},{"t":"+20 kJ","why":"Sign slip.","_n":"2w1a5","_k":"0d01abbc"},{"t":"+59 920 kJ","why":"Convert Δ\u003ci>S\u003c/i> to kJ/K first: 150 J/K = 0.150 kJ/K.","_n":"2x1d5","_k":"49a26fc2"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Δ\u003ci>H\u003c/i> = +90 kJ, Δ\u003ci>S\u003c/i> = +0.200 kJ/K. Above what temperature is the change spontaneous?","options":[{"t":"0.0022 K","why":"That divides the wrong way.","_n":"2y1c5","_k":"916a767c"},{"t":"It’s spontaneous \u003cstrong>below\u003c/strong> 450 K","why":"If Δ\u003ci>S\u003c/i> > 0, raising \u003ci>T\u003c/i> makes −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> more negative: spontaneous \u003cstrong>above\u003c/strong> the crossover.","_n":"2z275","_k":"d13baf72"},{"t":"450 K","why":"90 ÷ 0.200.","_n":"30265","_k":"8f0306bd"},{"t":"18 K","why":"That multiplies.","_n":"31995","_k":"287d2b75"}]},"b":{"prompt":"Δ\u003ci>H\u003c/i> = −120 kJ, Δ\u003ci>S\u003c/i> = −0.300 kJ/K. When is the change spontaneous?","options":[{"t":"Below 36 K","why":"That multiplies.","_n":"329a5","_k":"0557dd06"},{"t":"Above 400 K","why":"Both signs are negative: spontaneous below the crossover, not above.","_n":"33975","_k":"c2f2728d"},{"t":"At all temperatures","why":"Both terms matter. A big entropy gain can drive an endothermic change; an entropy loss can stop an exothermic one at high \u003ci>T\u003c/i>.","_n":"34985","_k":"057a404d"},{"t":"Below 400 K","why":"−120 ÷ −0.300 = 400 K; both signs are negative, so it is spontaneous below it.","_n":"359d5","_k":"544fd56b"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"A reaction is spontaneous at 200 K but not at 600 K. Which signs must Δ\u003ci>H\u003c/i> and Δ\u003ci>S\u003c/i> have?","options":[{"t":"Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> > 0","why":"That pair is spontaneous above the crossover, at high \u003ci>T\u003c/i>. If Δ\u003ci>S\u003c/i> > 0, raising \u003ci>T\u003c/i> makes −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> more negative: spontaneous \u003cstrong>above\u003c/strong> the crossover.","_n":"369e5","_k":"9836eb56"},{"t":"Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> \u003c 0","why":"Spontaneous at low \u003ci>T\u003c/i> only: both negative.","_n":"379b5","_k":"f8ea0363"},{"t":"Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> \u003c 0","why":"That’s never spontaneous.","_n":"389c5","_k":"56bef0ba"},{"t":"Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> > 0","why":"That’s spontaneous at every \u003ci>T\u003c/i>.","_n":"39a15","_k":"e635471d"}]},"b":{"prompt":"A reaction is spontaneous at 900 K but not at 300 K. Which signs?","options":[{"t":"Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> \u003c 0","why":"That’s never spontaneous.","_n":"3aa25","_k":"8fd03d46"},{"t":"Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> > 0","why":"Spontaneous at high \u003ci>T\u003c/i> only: both positive.","_n":"3bb35","_k":"167c4782"},{"t":"Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> \u003c 0","why":"That pair is spontaneous below the crossover, at low \u003ci>T\u003c/i>. If Δ\u003ci>S\u003c/i> > 0, raising \u003ci>T\u003c/i> makes −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> more negative: spontaneous \u003cstrong>above\u003c/strong> the crossover.","_n":"3cb24","_k":"90c74a8e"},{"t":"Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> > 0","why":"That’s spontaneous at every \u003ci>T\u003c/i>.","_n":"3db14","_k":"26b18236"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Δ\u003ci>G\u003c/i>° for burning sugar in air is hugely negative, yet sugar sits in a bowl for years. Which is the best explanation?","options":[{"t":"“Entropy stops the reaction.”","why":"Entropy favours the gases formed.","_n":"3eb04","_k":"c91fc10a"},{"t":"“Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast; at room temperature the activation energy is too high.”","why":"Spontaneous isn’t fast.","_n":"3faf4","_k":"f8a15d0d"},{"t":"“Sugar has no enthalpy.”","why":"Every substance has enthalpy.","_n":"3gae4","_k":"0ddef174"},{"t":"“Δ\u003ci>G\u003c/i> is actually positive at room temperature.”","why":"It’s very negative.","_n":"3had4","_k":"75b2f9ba"}]},"b":{"prompt":"Diamond → graphite has Δ\u003ci>G\u003c/i>° = −2.9 kJ/mol. Which best explains why diamonds don’t turn into graphite?","options":[{"t":"“Δ\u003ci>G\u003c/i>° > 0 for this change.”","why":"It’s negative.","_n":"3iac4","_k":"9c74b880"},{"t":"“The change is spontaneous but extremely slow, because the activation energy is enormous.”","why":"Spontaneous isn’t fast.","_n":"3jab4","_k":"22577ff5"},{"t":"“Diamond is more stable than graphite.”","why":"Δ\u003ci>G\u003c/i>° says graphite is more stable.","_n":"3kaa4","_k":"3ed10b64"},{"t":"“Spontaneous changes always happen within a year.”","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"3lad4","_k":"b8c1b576"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which best explains why a cold pack (endothermic) works on its own?","options":[{"t":"“The pack’s temperature drop makes Δ\u003ci>H\u003c/i> negative.”","why":"Δ\u003ci>H\u003c/i> stays positive.","_n":"3mae4","_k":"80d6a99a"},{"t":"“Its entropy increase is large enough that \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> is bigger than Δ\u003ci>H\u003c/i>, so Δ\u003ci>G\u003c/i> \u003c 0.”","why":"The entropy gain wins.","_n":"3naf4","_k":"5ae42755"},{"t":"“Cold packs break the second law.”","why":"They don’t.","_n":"3ob04","_k":"031dbed0"},{"t":"“Endothermic changes are always spontaneous.”","why":"Both terms matter. A big entropy gain can drive an endothermic change; an entropy loss can stop an exothermic one at high \u003ci>T\u003c/i>.","_n":"3pa94","_k":"54083c77"}]},"b":{"prompt":"Which best explains why ammonia synthesis is spontaneous at 300 K but not at 700 K?","options":[{"t":"“Δ\u003ci>S\u003c/i> is negative, so −\u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> is positive and grows with \u003ci>T\u003c/i>; above about 460 K it outweighs the negative Δ\u003ci>H\u003c/i>.”","why":"The entropy loss wins at high \u003ci>T\u003c/i>.","_n":"3qaa4","_k":"c85cb8f5"},{"t":"“Δ\u003ci>H\u003c/i> becomes positive at high temperature.”","why":"Δ\u003ci>H\u003c/i> barely changes.","_n":"3rab4","_k":"c28db40a"},{"t":"“The reaction runs faster at 700 K, so it’s less spontaneous.”","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"3sac4","_k":"5ec6ee76"},{"t":"“Exothermic reactions are never spontaneous at high \u003ci>T\u003c/i>.”","why":"Both terms matter. A big entropy gain can drive an endothermic change; an entropy loss can stop an exothermic one at high \u003ci>T\u003c/i>.","_n":"3ta54","_k":"73f2cce7"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Lime kilns turn limestone into lime: CaCO\u003csub>3\u003c/sub>(s) → CaO(s) + CO\u003csub>2\u003c/sub>(g), with Δ\u003ci>H\u003c/i>° = +179.2 kJ and Δ\u003ci>S\u003c/i>° = +159.0 J/K (crossover ≈ 1127 K). Why do kilns run hotter than about 1130 K?","options":[{"t":"“Δ\u003ci>S\u003c/i> turns negative below 1127 K.”","why":"Δ\u003ci>S\u003c/i> stays positive.","_n":"3ua64","_k":"44eaf639"},{"t":"“At lower temperatures it goes too fast.”","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"3v274","_k":"e3bf0a72"},{"t":"“Δ\u003ci>H\u003c/i> becomes negative above 1127 K.”","why":"Δ\u003ci>H\u003c/i> stays positive.","_n":"3w264","_k":"09a60246"},{"t":"“Below about 1127 K, Δ\u003ci>G\u003c/i> > 0, so the decomposition isn’t spontaneous.”","why":"Both signs are positive: spontaneous only above the crossover.","_n":"3x294","_k":"1f28d405"}]},"b":{"prompt":"Ammonia synthesis has Δ\u003ci>H\u003c/i>° = −91.8 kJ and Δ\u003ci>S\u003c/i>° = −198.1 J/K (crossover ≈ 463 K). Industrial plants still run near 700 K. Why?","options":[{"t":"“Δ\u003ci>G\u003c/i>° is more negative at 700 K.”","why":"It’s positive above 463 K.","_n":"3y284","_k":"4b59cd56"},{"t":"“At low temperature the reaction is far too slow; a higher temperature with a catalyst gives a usable rate, and high pressure helps the yield.”","why":"Rate, not spontaneity, sets the operating temperature.","_n":"3z2b4","_k":"07cc5ae0"},{"t":"“\u003ci>K\u003c/i> increases with temperature for this reaction.”","why":"For an exothermic reaction, \u003ci>K\u003c/i> falls as \u003ci>T\u003c/i> rises.","_n":"402a4","_k":"671315d3"},{"t":"“The reaction is endothermic.”","why":"It’s exothermic.","_n":"412d4","_k":"b4559edb"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"From the table: Δ\u003ci>G\u003c/i>° = +20 kJ corresponds to \u003ci>K\u003c/i> ≈ 3 × 10\u003csup>−4\u003c/sup> at 298 K. Which is true for a reaction with Δ\u003ci>G\u003c/i>° = +20 kJ?","options":[{"t":"“No product ever forms.”","why":"Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"422c4","_k":"4a77a28b"},{"t":"“At equilibrium the mixture is mostly reactants, but some product forms.”","why":"\u003ci>K\u003c/i> \u003c 1 but not zero.","_n":"431f4","_k":"6367617d"},{"t":"“It goes to completion.”","why":"That would need Δ\u003ci>G\u003c/i>° very negative.","_n":"441e4","_k":"31278546"},{"t":"“\u003ci>K\u003c/i> = −20.”","why":"\u003ci>K\u003c/i> is never negative.","_n":"45214","_k":"2b526722"}]},"b":{"prompt":"Δ\u003ci>G\u003c/i>° = −40 kJ corresponds to \u003ci>K\u003c/i> ≈ 1 × 10\u003csup>7\u003c/sup>. Which is true?","options":[{"t":"“At equilibrium the mixture is almost all products, but a tiny amount of reactant remains.”","why":"A huge \u003ci>K\u003c/i>, but not infinite.","_n":"46224","_k":"d4fb6a71"},{"t":"“Exactly 100% of the reactants become products.”","why":"Δ\u003ci>G\u003c/i>° \u003c 0 means \u003ci>K\u003c/i> > 1: mostly products, not all. At equilibrium Δ\u003ci>G\u003c/i> = 0, but both directions keep going.","_n":"471f4","_k":"e2de15ee"},{"t":"“\u003ci>K\u003c/i> = −40.”","why":"\u003ci>K\u003c/i> is positive.","_n":"48204","_k":"fe9bfca2"},{"t":"“The reaction must be fast.”","why":"Δ\u003ci>G\u003c/i> tells whether a change can happen, not how fast. Activation energy sets the speed.","_n":"491d4","_k":"79a7b6e6"}]}}]},"task":{"title":"Tune the crossover","summary":"Tune the crossover","statement":"\u003cp>Pick Δ\u003ci>H\u003c/i> and Δ\u003ci>S\u003c/i> for a reaction that meets every condition. Can you find them all?\u003c/p>\u003col class=\"gf-conds\">\u003cli>It is spontaneous at 300 K.\u003c/li>\u003cli>It is \u003cstrong>not\u003c/strong> spontaneous at 700 K.\u003c/li>\u003cli>It releases no more than 100 kJ (Δ\u003ci>H\u003c/i> ≥ −100 kJ).\u003c/li>\u003c/ol>","inputs":{"dH":{"label":"Δ\u003ci>H\u003c/i> (kJ)","vals":[-120,-90,-60,60,90,120]},"dS":{"label":"Δ\u003ci>S\u003c/i> (kJ/K)","vals":[-0.3,-0.2,-0.15,0.15,0.2,0.3]}},"checks":["Spontaneous at 300 K","Not spontaneous at 700 K","Releases no more than 100 kJ"],"tips":["Spontaneous at low \u003ci>T\u003c/i> but not at high \u003ci>T\u003c/i>: both signs must be negative.","The crossover must lie between 300 K and 700 K.","Crossover = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>; check that 300 K is strictly below it."],"tipHeat":"Line 3: this design releases more than 100 kJ. Δ\u003ci>H\u003c/i> must be −100 kJ or higher.","explainPrompt":"Explain why both signs must be negative and how you placed the crossover between 300 K and 700 K.","vocab":"Use the words enthalpy, entropy, crossover temperature and spontaneous.","more":"There’s more than one answer. Can you find them all?","after3":"Each crossover lies between 300 K and 700 K, and none releases more than 100 kJ."},"cards":[["Gibbs equation","Δ\u003ci>G\u003c/i> = Δ\u003ci>H\u003c/i> − \u003ci>T\u003c/i>Δ\u003ci>S\u003c/i> (\u003ci>T\u003c/i> in K; Δ\u003ci>S\u003c/i> in kJ/K)."],["Δ\u003ci>G\u003c/i> \u003c 0","Spontaneous at that temperature."],["Δ\u003ci>G\u003c/i> = 0","At equilibrium."],["Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> > 0","Spontaneous at all temperatures."],["Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> \u003c 0","Never spontaneous."],["Δ\u003ci>H\u003c/i> > 0, Δ\u003ci>S\u003c/i> > 0","Spontaneous above \u003ci>T\u003c/i> = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>."],["Δ\u003ci>H\u003c/i> \u003c 0, Δ\u003ci>S\u003c/i> \u003c 0","Spontaneous below \u003ci>T\u003c/i> = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>."],["Crossover temperature","\u003ci>T\u003c/i> = Δ\u003ci>H\u003c/i> ÷ Δ\u003ci>S\u003c/i>, where Δ\u003ci>G\u003c/i> = 0."],["Spontaneous vs fast","Δ\u003ci>G\u003c/i>: can it happen? \u003ci>E\u003c/i>\u003csub>a\u003c/sub>: how fast?"],["Δ\u003ci>G\u003c/i>° and \u003ci>K\u003c/i>","Δ\u003ci>G\u003c/i>° \u003c 0 → \u003ci>K\u003c/i> > 1; Δ\u003ci>G\u003c/i>° > 0 → \u003ci>K\u003c/i> \u003c 1."],["Unit trap","150 J/K = 0.150 kJ/K."],["Kelvin trap","\u003ci>T\u003c/i>(K) = \u003ci>T\u003c/i>(°C
