.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}

.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}

.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 22: hero, Trend heat map (C11 table, legend, panels, shell diagrams, IE graph, ion sizes), Successive IE, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:0}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .8em;font-size:.9rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.tr-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.tr-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.tr-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:1.6em;flex:1 1 14rem}

/* heat scale: one sequential --pen scale in 5 steps; value text switches to --sheet on the two darkest steps */
.lv0{background:color-mix(in srgb,var(--pen) 15%,var(--sheet));color:var(--ink)}
.lv1{background:color-mix(in srgb,var(--pen) 32%,var(--sheet));color:var(--ink)}
.lv2{background:color-mix(in srgb,var(--pen) 50%,var(--sheet));color:var(--ink)}
.lv3{background:color-mix(in srgb,var(--pen) 80%,var(--sheet));color:var(--sheet)}
.lv4{background:var(--pen);color:var(--sheet)}

/* Trend heat map: controls and table box */
.tr-top{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
.tr-tbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px 6px;margin-top:8px}
.tr-thead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 12px;margin-bottom:8px}
.tr-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:.82rem;color:var(--ink-2);flex:1 1 20rem}
.tr-lg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.tr-lgk,.tr-lgi{display:inline-flex;align-items:center;gap:4px}
.tr-sw{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;border:1px solid var(--rule);font-size:.7rem}
.tr-sw.nod{background:var(--sheet);border-style:dashed;color:var(--ink-2)}
.tr-tscroll{overflow-x:auto;overscroll-behavior-x:contain;padding:3px 2px 4px}
.tr-pt{display:flex;flex-direction:column;gap:2px;min-width:600px}
.tr-row{display:grid;grid-template-columns:1.3em repeat(18,minmax(30px,1fr));gap:2px;border-radius:5px}
.tr-row.prow{outline:2px dashed var(--ink-2);outline-offset:1px}
.tr-hd span{font-size:.66rem;text-align:center;color:var(--ink-2);line-height:1.4}
.tr-hd span.on{color:var(--ink);font-weight:700;text-decoration:underline}
.tr-pl{font-size:.7rem;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.tr-c,.tr-gap{display:block;min-width:0}
.tr-c.gcol,.tr-gap.gcol{box-shadow:inset 2px 0 0 var(--ink-2),inset -2px 0 0 var(--ink-2);border-radius:3px}
.tr-el{width:100%;height:38px;min-width:0;padding:1px 0;border:1px solid var(--rule);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-ui);line-height:1.1;position:relative}
.tr-sy{font-size:.8rem;font-weight:700}
.tr-v{font-size:.62rem;min-height:.7rem}
button.tr-el:hover{border-color:var(--ink)}
.tr-el.nod{background:var(--sheet);color:var(--ink-2);border-style:dashed}
.tr-el.mask{background:var(--paper);color:var(--ink);border-style:dashed;border-color:var(--ink-2)}
.tr-el.dblk{background:var(--sheet);color:var(--ink-2);opacity:.55}
.tr-el.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.tr-el.selb{outline:3px dashed var(--ink);outline-offset:1px;z-index:1}
.tr-el.hasion::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:currentColor}
.tr-el:disabled{cursor:default}
.tr-strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.tr-sc{display:flex;flex-direction:column;gap:2px;text-align:center}
.tr-sg{font-size:.66rem;color:var(--ink-2)}
.tr-strip .tr-el{height:48px}

.tr-swipe{display:none;margin:2px 0 0}

.tr-note{margin-top:8px}

.tr-panel{margin-top:12px}
.tr-h4{margin:14px 0 6px;font-size:.95rem}

/* Explain mode */

.tr-chip{border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.25em .85em;min-height:38px;font:700 .95rem var(--font-ui)}
.tr-chip.cat{border-color:var(--ec-cat)}
.tr-chip.an{border-color:var(--ec-an)}

.tr-chip:disabled{opacity:.45}

/* IE₁ graph */
.tr-gwrap{margin-top:12px}
.tr-bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:520px;border-bottom:1.5px solid var(--ink-2)}
.tr-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:190px;padding:0;border:0;background:transparent;color:var(--ink);font-family:var(--font-ui);border-radius:4px 4px 0 0}
.tr-bar:hover .tr-bcol{opacity:.85}

.tr-bar.dip .tr-bcol{background:var(--p-k)}
.tr-bv{font-size:.66rem;min-height:.9rem}

.tr-bs{font-size:.8rem;font-weight:700;padding:2px 0}
.tr-gnote{margin:8px 0 0;max-width:560px}

/* Part 3: Successive IE */
.tr-s1g{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;align-items:end}
@media (max-width:520px){.tr-s1g{grid-template-columns:minmax(0,1fr)}}
.tr-mgsvg{max-width:200px;margin:0 auto}
.tr-s1cap{min-height:1.6em}

.tr-iebar{display:block;width:70%;background:var(--e-pair);border-radius:3px 3px 0 0;transition:height .35s ease-out}
.tr-iec.core .tr-iebar{background:var(--ink-2)}
.tr-iev{font-size:.66rem;white-space:nowrap;min-height:.9rem}
.tr-iel{font-size:.72rem;color:var(--ink-2);padding-top:2px}
.tr-gapb{flex:0 0 24px;align-self:stretch;border:1.5px dashed var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:6px;padding:0;font-size:.9rem}
.tr-gapb:hover{border-color:var(--ink)}
.tr-gapb.on{border-style:solid;border-color:var(--ink);background:var(--hi-soft);color:var(--ink)}
.tr-myst{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tr-mcard{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.tr-mcard h4{margin:0}
.tr-mcard p.tiny{margin:2px 0 8px}
.tr-mgrp{margin-top:10px}
.tr-mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tr-s3row{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px;align-items:end}
@media (max-width:520px){.tr-s3row{grid-template-columns:minmax(0,1fr)}}
.tr-s3 .tr-ieb{height:120px}

/* task */
.tr-conds{margin:.4em 0 .8em 1.2em;padding:0}
.tr-tq{margin:0 0 10px}
.tr-tq .rg-lab{margin:0 0 4px}
.tr-tkcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tr-tkc h4{margin:0 0 4px}
.tr-tkd{margin:8px 0 0}

@media (prefers-reduced-motion:reduce){
  .tr-bcol,.tr-iebar{transition:none}
}

ffective nuclear charge\u003c/strong> grows while the shell stays the same, so atoms shrink and hold their electrons tighter. Down a group, new \u003cstrong>shells\u003c/strong> put the outer electrons farther out behind more \u003cstrong>shielding\u003c/strong>. Radius, \u003cstrong>ionization energy\u003c/strong> and \u003cstrong>electronegativity\u003c/strong> all follow.","fig":{"html":"\u003cdiv class=\"tr-hx\">\u003csvg class=\"tr-hx-svg\" id=\"tr-hx-svg\" viewBox=\"0 0 440 380\" role=\"img\" aria-label=\"A periodic-table outline. An arrow across a period reads: Z eff up, so radius down, ionization energy up, electronegativity up. An arrow down a group reads: shells up, so radius up, ionization energy down, electronegativity down. Below, a sodium atom (nucleus +11, 10 core electrons in a grey band, 1 outer electron) steps across period 3 to chlorine: the nucleus climbs to +17, the outer shell fills to 7 electrons and its ring tightens, so Z eff goes from 1 to 7. Then lithium, sodium and potassium step down group 1, each adding a ring.\">\u003c/svg>\u003cdiv class=\"tr-hx-row\">\u003cp class=\"tr-hx-ctr\" id=\"tr-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"tr-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can describe the trends in atomic radius, ionization energy, electronegativity and electron affinity across periods and down groups.","I can explain trends with effective nuclear charge and shielding, using the simple model \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> ≈ \u003cem>Z\u003c/em> − core electrons.","I can explain the exceptions in first ionization energy (B vs Be, O vs N) from electron configurations.","I can compare the sizes of atoms and ions, including isoelectronic series.","I can use successive ionization energies to find an element’s group.","I can use trends to predict reactivity and bond type for unfamiliar elements."],"start":{"warmup":{"questions":[{"id":"w1" ds 6; Hund’s rule puts electrons singly into equal orbitals before pairing.","Core and valence electrons":"Valence electrons are those in the highest \u003cem>n\u003c/em>. Core electrons are everything in the noble-gas shorthand.","Reading the table":"Rows are periods (the highest shell number); columns are groups (similar valence configurations)."}}},"explore":{"heading":"Trend heat map","intro":"Colour the table by a property, then open any element to see \u003cem>why\u003c/em> it sits where it does.","how":"Choose a \u003cstrong>property\u003c/strong> to colour the table (darker or brighter = larger value; the legend gives the numbers) and a \u003cstrong>mode\u003c/strong>. Tap an element, or use the arrow keys and Enter. \u003cstrong>Explain an element\u003c/strong> draws its shells; \u003cstrong>Compare two\u003c/strong> sets element 1, then element 2; \u003cstrong>Ion sizes\u003c/strong> puts an atom beside its common ion.","modes":[{"id":"heat","t":"Heat map"},{"id":"explain","t":"Explain an element"},{"id":"compare","t":"Compare two"},{"id":"ion","t":"Ion sizes"}],"props":[{"id":"rad","t":"Atomic radius"},{"id":"ie","t":"First ionization energy"},{"id":"en","t":"Electronegativity"},{"id":"ea","t":"Electron affinity"}],"predictions":[{"id":"p1","prompt":"Radius heat map, period 3 hidden. Which period 3 atom is largest?","options":[{"t":"Cl","_n":"o29a","_k":"2121782e"},{"t":"Na","_n":"p28a","_k":"ce80799b"},{"t":"They’re all the same size.","_n":"q27a","_k":"a54cda0e"},{"t":"Ar","_n":"r1ea","_k":"aa05bf62"}],"explain":"Same shell, rising \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> (1 → 7): the electrons are pulled closer."},{"id":"p2","prompt":"IE₁ map, group 1 hidden. Which has the lower first ionization energy: Na or K?","options":[{"t":"Na","_n":"s1da","_k":"e0e3aade"},{"t":"Equal","_n":"t20a","_k":"34d50df4"},{"t":"K","_n":"u21a","_k":"89bbd043"},{"t":"You can’t tell.","_n":"v22a","_k":"9ad084d4"}],"explain":"K’s outer electron is in shell 4, farther away and better shielded."},{"id":"p3","prompt":"IE₁ graph against \u003cem>Z\u003c/em> for Li → Ne. IE₁ generally rises across period 2. Which element breaks the pattern by being \u003cem>lower\u003c/em> than the element before it?","options":[{"t":"None: the rise is perfectly smooth","_n":"w23a","_k":"0ee63e68"},{"t":"C (lower than B)","_n":"x24a","_k":"f2cdc52c"},{"t":"B (lower than Be) and O (lower than N)","_n":"y25a","_k":"027e2113"},{"t":"Only Ne","_n":"z26a","_k":"01f82e0c"}],"explain":"B’s electron is in 2p (higher energy than 2s). O’s fourth 2p electron is paired, and repulsion makes it easier to remove."},{"id":"p4","prompt":"Ion sizes mode, Na. Is Na\u003csup>+\u003c/sup> larger or smaller than Na?","options":[{"t":"The same","_n":"1027a","_k":"dd520ab6"},{"t":"Much smaller","_n":"1118a","_k":"41e65676"},{"t":"Larger","_n":"1219a","_k":"5147829f"},{"t":"Slightly larger","_n":"132ab","_k":"cf3475fe"}],"explain":"Losing the only 3s electron removes the whole third shell."}],"chalIntro":"Use the Trend heat map to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Compare two mode: find two elements \u003cstrong>in the same group\u003c/strong> whose electronegativities differ by \u003cstrong>more than 1.0\u003c/strong>.","why":"F–I: 3.98 − 2.66 = 1.32. F–Br (3.98 − 2.96 = 1.02) also works: electronegativity falls fastest down group 17.","hints":["EN falls down a group. Which group has the biggest spread?","Start with the highest EN of all: F.","F with Br or I."]},{"id":"tc2","goal":4,"prompt":"Ion sizes mode: arrange N\u003csup>3−\u003c/sup>, O\u003csup>2−\u003c/sup>, F\u003csup>−\u003c/sup>, Na\u003csup>+\u003c/sup> and Mg\u003csup>2+\u003c/sup> from largest to smallest.","why":"N\u003csup>3−\u003c/sup> > O\u003csup>2−\u003c/sup> > F\u003csup>−\u003c/sup> > Na\u003csup>+\u003c/sup> > Mg\u003csup>2+\u003c/sup> (146 > 140 > 133 > 102 > 72 pm): the same 10 electrons, pulled closer by 7, 8, 9, 11 and 12 protons.","hints":["Count electrons: all 10.","Count protons: 7, 8, 9, 11, 12.","Fewest protons is largest: N\u003csup>3−\u003c/sup> first."]},{"id":"tc3","goal":6,"stretch":true,"prompt":"Find the element whose valence electrons feel \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> = 6 (simple model) and which has 3 occupied shells. Then predict: is its IE₁ higher or lower than that of the element directly above it?","why":"Sulfur: 16 − 10 = 6, with 3 occupied shells. S has IE₁ 1000 kJ/mol; O, above it, has 1314, so sulfur’s is lower.","hints":["\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> = valence electrons in this model.","6 valence electrons and 3 shells: period 3, group 16.","S. Oxygen sits above it with a higher IE₁, so S is lower."]}],"blocks":[{"title":"About this model","html":"\u003cp>The simple model \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> ≈ \u003cem>Z\u003c/em> − (core electrons) treats the core as a perfect shield and ignores the partial shielding by electrons in the same shell. Real effective nuclear charges are a little different, but the model explains every trend in this module. The data values are listed in the \u003cstrong>Atomic data\u003c/strong> table under the heat map.\u003c/p>"}]},"part3":{"slug":"successive","name":"Successive IE","heading":"Successive ionization energies","intro":"Pull electrons off an atom one at a time and measure the energy each one needs. A huge jump means you have reached the core, and that tells you the group.","s1":{"title":"Station 1: Watch the jump","intro":"Magnesium is [Ne] 3s\u003csup>2\u003c/sup>. Remove its electrons one at a time and watch the bars.","data":"After two electrons, the next one comes from the \u003cem>n\u003c/em> = 2 core: much closer, much less shielded."},"s2":{"title":"Station 2: Mystery elements","intro":"Tap the gap where the big jump happens, then pick the group.","items":[{"id":"X","ies":[496,4562],"_a":"Ag==","el":"Na"},{"id":"Y","ies":[578,1817,2745,11577],"_a":"AA==","el":"Al"},{"id":"Z","ies":[787,1577,3232,4356,16091],"_a":"Bw==","el":"Si"},{"id":"W","ies":[590,1145,4912],"_a":"AQ==","el":"Ca"}],"groups":[1,2,13,14]},"s3":{"title":"Station 3: Why each IE is larger than the last","text":"Even without a jump, IE₂ > IE₁: removing an electron from a positive ion is harder, because the same protons pull on fewer electrons."},"quickCheck":{"title":"Quick check","summary":"Successive IE quick check","items":[{"id":"q1","goal":5,"prompt":"IEs: 801, 2427, 3660, 25&#160;026 kJ/mol. Group?","choices":[{"t":"1","fb":"The jump comes after the 3rd electron: 3 valence electrons.","_n":"1429b","_k":"cd697271"},{"t":"3","fb":"The jump comes after the 3rd electron: 3 valence electrons.","_n":"152cb","_k":"6fe36482"},{"t":"13","fb":"Right. The jump comes after the 3rd electron: 3 valence electrons, so group 13 (this is boron).","_n":"162bb","_k":"40a2186f"},{"t":"14","fb":"The jump comes after the 3rd electron: 3 valence electrons.","_n":"1726b","_k":"07dcbf89"}]},{"id":"q2","goal":5,"prompt":"Why is IE₂ of Na (4562) so much larger than IE₁ (496)?","choices":[{"t":"Na\u003csup>+\u003c/sup> has more protons","fb":"It comes from the \u003cem>n\u003c/em> = 2 shell, close and unshielded.","_n":"1825b","_k":"a63fb109"},{"t":"Na\u003csup>+\u003c/sup> is bigger","fb":"It comes from the \u003cem>n\u003c/em> = 2 shell, close and unshielded.","_n":"1928b","_k":"3177ddc9"},{"t":"the 2nd electron is in 3p","fb":"It comes from the \u003cem>n\u003c/em> = 2 shell, close and unshielded.","_n":"1a27b","_k":"80ff81c2"},{"t":"the 2nd electron is a core electron","fb":"Right. It comes from the \u003cem>n\u003c/em> = 2 shell, close and unshielded.","_n":"1b22b","_k":"326eb8eb"}]},{"id":"q3","goal":5,"prompt":"Which IE of aluminium shows the big jump?","choices":[{"t":"IE₂","fb":"Al has 3 valence electrons, so the 4th comes from the core.","_n":"1c21b","_k":"8ccea17e"},{"t":"IE₃","fb":"Al has 3 valence electrons, so the 4th comes from the core.","_n":"1d24b","_k":"ddf51a68"},{"t":"IE₄","fb":"Right. Al has 3 valence electrons, so the 4th comes from the core.","_n":"1e25b","_k":"4d854a97"},{"t":"IE₁","fb":"Al has 3 valence electrons, so the 4th comes from the core.","_n":"1f22b","_k":"e4753b3c"}]},{"id":"q4","goal":5,"prompt":"A student says the group is the position of the \u003cem>largest\u003c/em> IE. Correct?","choices":[{"t":"Yes","fb":"The last IE is always largest. Look for the biggest \u003cem>jump\u003c/em>.","_n":"1g23b","_k":"d86b17a8"},{"t":"Only in period 2","fb":"The last IE is always largest. Look for the biggest \u003cem>jump\u003c/em>.","_n":"1h28b","_k":"cf402530"},{"t":"No: it’s where the jump is","fb":"Right. The last IE is always largest. Look for the biggest \u003cem>jump\u003c/em>.","_n":"1i29b","_k":"e65e3957"},{"t":"Only for metals","fb":"The last IE is always largest. Look for the biggest \u003cem>jump\u003c/em>.","_n":"1j26b","_k":"b929ed9c"}]}]}},"practice":{"activities":[{"id":"order","type":"order","title":"Order by trend","summary":"Order by trend","goal":[1,4],"instruction":"Put each set in order. Watch whether the trend runs across a period or down a group.","sequences":[{"id":"o1","goal":1,"prompt":"By atomic radius, largest first.","steps":["K","Na","Mg","Cl"],"start":[2,1,3,0],"wrong":[{"order":[1,0,2,3],"fb":"K has an extra shell."}],"general":"Down a group adds a shell; across a period the same shell is pulled in.","why":"Down then across: K (227) > Na (186) > Mg (160) > Cl (100).","hints":["Is the trend across or down?","Use the arrows on the hero.","K, Na, Mg, Cl."]},{"id":"o2","goal":1,"prompt":"By first ionization energy, lowest first.","steps":["Rb","K","Na","Li"],"start":[2,0,3,1],"wrong":[{"order":[3,2,1,0],"fb":"That’s highest first. Down a group the outer electron is in a new, farther shell behind more core electrons, so it is easier to remove."}],"general":"Up group 1, the outer electron is closer and less shielded, so IE₁ rises.","why":"Up group 1, IE₁ rises: 403, 419, 496, 520.","hints":["Is the trend across or down?","Use the arrows on the hero.","Rb, K, Na, Li."]},{"id":"o3","goal":1,"prompt":"By electronegativity, lowest first.","steps":["Na","Al","P","Cl"],"start":[3,1,0,2],"wrong":[{"order":[3,2,1,0],"fb":"That’s highest first. Across a period \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> rises, so electronegativity rises."}],"general":"Across period 3, \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> rises, so the pull on shared electrons grows.","why":"Across period 3: 0.93, 1.61, 2.19, 3.16.","hints":["Is the trend across or down?","Use the arrows on the hero.","Na, Al, P, Cl."]}]},{"id":"except","type":"mc","title":"Explain the exception","summary":"Explain the exception","star":true,"goal":[2,3,4,5],"instruction":"Six items. Choose the best explanation. Items 3 to 6 (★) are non-routine; items 5 and 6 go beyond the Final Check.","items":[{"id":"x1","goal":2,"prompt":"Why is K’s IE₁ lower than Na’s?","options":[{"t":"K’s outer electron is in \u003cem>n\u003c/em> = 4, farther out and better shielded","why":"The extra shell outweighs the extra protons.","_n":"1k27b","_k":"e1887003"},{"t":"K has more protons in its nucleus","why":"More protons doesn’t win: the extra shell does.","_n":"1l1cb","_k":"7de9056a"},{"t":"K has a higher \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub>","why":"In the simple model both feel \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> = 1; the difference is the shell.","_n":"1m1db","_k":"168a1f10"},{"t":"K is a nonmetal","why":"K is an alkali metal, like Na.","_n":"1n9eb","_k":"c92832a2"}],"hints":["Which shell holds each outer electron?","Na: \u003cem>n\u003c/em> = 3; K: \u003cem>n\u003c/em> = 4.","K’s outer electron is farther out and better shielded."]},{"id":"x2","goal":4,"prompt":"Why is Cl\u003csup>−\u003c/sup> larger than Cl?","options":[{"t":"The extra electron starts a new shell","why":"It goes into 3p, the same shell.","_n":"1o9db","_k":"be833ac6"},{"t":"Negative ions have more mass","why":"Size depends on electrons and protons, not mass.","_n":"1p9cb","_k":"533d00f6"},{"t":"An added electron increases repulsion; the protons are unchanged","why":"Same 17 protons, one more electron to hold.","_n":"1q9bb","_k":"ba4a72c5"},{"t":"Cl\u003csup>−\u003c/sup> has fewer protons","why":"The nucleus doesn’t change.","_n":"1r9ab","_k":"53bdc332"}],"hints":["Does the nucleus change when Cl gains an electron?","Same 17 protons, one more electron.","More repulsion spreads the electrons out."]},{"id":"x3","goal":3,"star":true,"prompt":"Why is IE₁ of O (1314) lower than that of N (1402)?","options":[{"t":"O has fewer protons than N","why":"O has 8 protons; N has 7.","_n":"1s99b","_k":"cfa8b673"},{"t":"O’s fourth 2p electron is paired; repulsion makes it easier to remove","why":"N’s three 2p electrons are all unpaired; O’s fourth must pair.","_n":"1t98b","_k":"ce83c5da"},{"t":"O’s outer electron is in a new shell","why":"Both have their valence electrons in shell 2.","_n":"1u97b","_k":"4ad72787"},{"t":"O has a lower \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> than N","why":"\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> is higher for O; the pairing explains the dip.","_n":"1va6b","_k":"595a6d1d"}],"hints":["Draw the 2p boxes for N and O.","N: ↑ ↑ ↑. O: ↑↓ ↑ ↑.","The paired electron is repelled by its partner, so it is easier to remove."]},{"id":"x4","goal":3,"star":true,"prompt":"Why is IE₁ of Al (578) lower than that of Mg (738)?","options":[{"t":"Al’s 3p electron is paired, so repulsion pushes it out","why":"The same reason as B vs Be, one period down.","_n":"1wa5b","_k":"ece9d0c3"},{"t":"Al has a lower \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> than Mg","why":"\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> is 3 for Al and 2 for Mg; the sublevel explains the dip.","_n":"1x98b","_k":"ec8f1ea1"},{"t":"Al is in a later period than Mg","why":"Both are in period 3.","_n":"1y99b","_k":"1803f90d"},{"t":"Al’s electron is in 3p, higher in energy and partly shielded by 3s","why":"Mg’s outermost electron is in 3s; Al’s is in 3p.","_n":"1z9ab","_k":"7920137d"}],"hints":["Write the outer configurations: Mg 3s\u003csup>2\u003c/sup>, Al 3s\u003csup>2\u003c/sup> 3p\u003csup>1\u003c/sup>.","Which sublevel does Al’s outermost electron come from?","3p is higher in energy than 3s and partly shielded by it."]},{"id":"x5","goal":2,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> A graph of IE₁ vs atomic number from H to K peaks at He, Ne and Ar. Which conclusion is best supported?","options":[{"t":"IE₁ always rises with atomic number","why":"The graph drops sharply after each peak (Li, Na, K).","_n":"209bb","_k":"f7e4beea"},{"t":"Noble gases have the most protons","why":"The peaks are evidence; ‘noble gases have the most protons’ is false.","_n":"2194b","_k":"82d8f9bd"},{"t":"Group 1 elements have the highest IE₁","why":"They sit at the lowest points, right after each peak.","_n":"2295b","_k":"b1c61427"},{"t":"Full outer shells are especially stable; the next element starts a new shell","why":"Each peak is followed by a sharp drop at Li, Na and K, the first element of a new shell.","_n":"2396b","_k":"7652549e"}],"hints":["Where does each new period start?","Li, Na and K start new shells, right after the peaks.","Full outer shells are especially stable; the next electron goes into a new shell."]},{"id":"x6","goal":4,"star":true,"prompt":"Rank S\u003csup>2−\u003c/sup>, Cl\u003csup>−\u003c/sup>, K\u003csup>+\u003c/sup>, Ca\u003csup>2+\u003c/sup> from largest to smallest.","options":[{"t":"Cl\u003csup>−\u003c/sup> > S\u003csup>2−\u003c/sup> > K\u003csup>+\u003c/sup> > Ca\u003csup>2+\u003c/sup>","why":"S\u003csup>2−\u003c/sup> has fewer protons (16) than Cl\u003csup>−\u003c/sup> (17), so it is larger.","_n":"2497b","_k":"ba043bdf"},{"t":"K\u003csup>+\u003c/sup> > Ca\u003csup>2+\u003c/sup> > S\u003csup>2−\u003c/sup> > Cl\u003csup>−\u003c/sup>","why":"Metal ions aren’t larger here: all have 18 electrons, and more protons pull them closer.","_n":"25a0b","_k":"880bd535"},{"t":"S\u003csup>2−\u003c/sup> > Cl\u003csup>−\u003c/sup> > K\u003csup>+\u003c/sup> > Ca\u003csup>2+\u003c/sup>","why":"184, 181, 138, 100 pm: 18 electrons each, pulled by 16, 17, 19 and 20 protons.","_n":"26a1b","_k":"b4bd709c"},{"t":"Ca\u003csup>2+\u003c/sup> > K\u003csup>+\u003c/sup> > Cl\u003csup>−\u003c/sup> > S\u003csup>2−\u003c/sup>","why":"All have 18 electrons; protons 16, 17, 19, 20.","_n":"27229","_k":"50f3c1ed"}],"hints":["Count electrons.","All 18. Count protons.","Fewest protons is largest."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Manon","how":"","goal":[2,5],"instruction":"Manon made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain why Cl is smaller than Na.","steps":["Both have their valence electrons in shell 3.","Cl has 17 protons and Na has 11.","Both have 10 core electrons, so \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> is 7 for Cl and 1 for Na.","Cl’s extra electrons repel each other more, so Cl should be larger; it’s only smaller because it’s a nonmetal.","So nonmetals are always smaller."],"_a":"AA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"Step 4 is correct.","why":"Being a nonmetal isn’t a cause. \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> is.","_n":"28219","_k":"5135c38d"},{"t":"The greater \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> pulls the shell-3 electrons closer, so Cl is smaller.","why":"Across a period the electrons go into the same shell while the pull grows (\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> up), so the atom shrinks.","_n":"29249","_k":"b2cf0422"},{"t":"Cl has more shells.","why":"Same shell.","_n":"2a239","_k":"57a6f65a"},{"t":"Na’s protons repel its electrons.","why":"Protons attract electrons.","_n":"2b26a","_k":"b1b9e914"}],"hints":["What did step 3 just show?","Bigger \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> means a stronger pull.","The greater \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> pulls the shell-3 electrons closer, so Cl is smaller."]},{"id":"e2","goal":5,"task":"Find the group of an element with IEs 590, 1145 and 4912 kJ/mol.","steps":["Each IE is larger than the one before.","The largest value is the third, 4912.","So the element has 3 valence electrons: group 13.","It’s probably aluminium."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is true.","","Step 4 follows step 3."],"fixes":[{"t":"Group 3.","why":"Group 3 is in the d block; count the electrons before the jump.","_n":"2c25a","_k":"05ce9966"},{"t":"Step 3 is correct.","why":"The largest value isn’t the clue; the jump is.","_n":"2d28a","_k":"0570fe0c"},{"t":"The jump comes between IE₂ and IE₃, so there are 2 valence electrons: group 2 (calcium).","why":"Look for the biggest \u003cem>jump\u003c/em> between consecutive values. The electrons before the jump are the valence electrons.","_n":"2e27a","_k":"56afb00d"},{"t":"Group 1, because IE₁ is smallest.","why":"IE₁ is always smallest.","_n":"2f1a9","_k":"31a2ff6a"}],"hints":["Find the biggest gap.","1145 → 4912.","2 valence electrons."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result surprised you more: the IE dips at B and O, or how much smaller Na\u003csup>+\u003c/sup> is than Na?"},{"id":"j2","q":"In your own words, explain effective nuclear charge and shielding."},{"id":"j3","q":"Explain to a friend how to find an element’s group from successive ionization energies."},{"id":"j4","q":"Which trend do you still mix up? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Moving across period 3 from Na to Cl, atomic radius…","options":[{"t":"increases","why":"More electrons, but the same shell and a stronger pull.","_n":"2g199","_k":"4dce6df3"},{"t":"stays the same","why":"It falls from 186 to 100 pm.","_n":"2h1c9","_k":"9fe10a62"},{"t":"increases, then decreases","why":"It falls steadily.","_n":"2i1d9","_k":"2e351d84"},{"t":"decreases","why":"\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> rises in the same shell.","_n":"2j1a9","_k":"af095291"}]},"b":{"prompt":"Moving down group 1 from Li to Rb, first ionization energy…","options":[{"t":"increases","why":"Down a group the outer electron is in a new, farther shell behind more core electrons, so it is easier to remove.","_n":"2k1b9","_k":"b8b840fc"},{"t":"stays the same","why":"520 → 403 kJ/mol.","_n":"2l189","_k":"945cbb65"},{"t":"increases, then decreases","why":"It falls steadily.","_n":"2m199","_k":"19dd4389"},{"t":"decreases","why":"The outer electron is farther out and better shielded.","_n":"2n169","_k":"c21fe092"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Using the simple model, what effective nuclear charge do chlorine’s valence electrons feel?","options":[{"t":"1","why":"That’s sodium’s.","_n":"2o179","_k":"50d9de41"},{"t":"7","why":"17 − 10 core electrons.","_n":"2p249","_k":"eb882a9f"},{"t":"10","why":"That’s the number of core electrons.","_n":"2q259","_k":"59567340"},{"t":"17","why":"Core electrons shield the nucleus.","_n":"2r152","_k":"e39f274f"}]},"b":{"prompt":"Using the simple model, what effective nuclear charge do magnesium’s valence electrons feel?","options":[{"t":"2","why":"12 − 10.","_n":"2s162","_k":"f50c4426"},{"t":"8","why":"Subtract the core: 12 − 10 = 2.","_n":"2t132","_k":"74a2b283"},{"t":"10","why":"That’s the core.","_n":"2u142","_k":"34973df1"},{"t":"12","why":"Core electrons shield the nucleus: subtract the 10 core electrons.","_n":"2v192","_k":"641c2017"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which particle is largest: F\u003csup>−\u003c/sup>, Ne, Na\u003csup>+\u003c/sup> or Mg\u003csup>2+\u003c/sup>?","options":[{"t":"Ne","why":"10 protons, more than F\u003csup>−\u003c/sup>’s 9.","_n":"2w1a2","_k":"fe6fb0d6"},{"t":"Mg\u003csup>2+\u003c/sup>","why":"Most protons, so smallest.","_n":"2x172","_k":"81443033"},{"t":"Na\u003csup>+\u003c/sup>","why":"Na\u003csup>+\u003c/sup> has lost its only 3s electron, and with it a whole shell; its 11 protons pull its 10 electrons in more than F\u003csup>−\u003c/sup>’s 9 do.","_n":"2y182","_k":"6d7cac91"},{"t":"F\u003csup>−\u003c/sup>","why":"All have 10 electrons; F\u003csup>−\u003c/sup> has the fewest protons (9).","_n":"2z0d2","_k":"52040542"}]},"b":{"prompt":"Which particle is smallest: S\u003csup>2−\u003c/sup>, Cl\u003csup>−\u003c/sup>, K\u003csup>+\u003c/sup> or Ca\u003csup>2+\u003c/sup>?","options":[{"t":"Cl\u003csup>−\u003c/sup>","why":"17 protons.","_n":"300e2","_k":"46f626d1"},{"t":"K\u003csup>+\u003c/sup>","why":"19 protons; Ca\u003csup>2+\u003c/sup> has 20.","_n":"311b2","_k":"6fdf6728"},{"t":"S\u003csup>2−\u003c/sup>","why":"Fewest protons, so largest.","_n":"321a2","_k":"3c42ee40"},{"t":"Ca\u003csup>2+\u003c/sup>","why":"18 electrons, 20 protons.","_n":"331d2","_k":"f8de9333"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"An element’s successive ionization energies are 578, 1817, 2745 and 11&#160;577 kJ/mol. Which group is it in?","options":[{"t":"Group 4","why":"The largest is the 4th, but the jump is after the 3rd.","_n":"341c2","_k":"a75e6c08"},{"t":"Group 2","why":"1817 → 2745 is a smaller step than 2745 → 11&#160;577.","_n":"35172","_k":"362629cd"},{"t":"Group 1","why":"The first gap is small.","_n":"36162","_k":"30d795f7"},{"t":"Group 13","why":"The jump comes after 3 electrons.","_n":"37192","_k":"a917fe92"}]},"b":{"prompt":"An element’s successive ionization energies are 738, 1451 and 7733 kJ/mol. Which group is it in?","options":[{"t":"Group 3","why":"Look for the biggest jump, not the largest value: the jump comes after 2 electrons.","_n":"38182","_k":"90a2e643"},{"t":"Group 2","why":"The jump comes after 2 electrons.","_n":"39132","_k":"b4d64512"},{"t":"Group 1","why":"738 → 1451 is a modest step.","_n":"3a122","_k":"b2453ba8"},{"t":"Group 13","why":"Only 2 valence electrons.","_n":"3b892","_k":"ef908da7"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Which has the higher first ionization energy, N or O, and why?","options":[{"t":"O: it has a higher \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub>, so the trend holds","why":"That’s the general trend, but here pairing wins.","_n":"3c8a2","_k":"e8b0a2da"},{"t":"They’re equal: both are in period 2","why":"1402 vs 1314.","_n":"3d8b2","_k":"509af18e"},{"t":"N: N has more protons","why":"O has more (8 vs 7).","_n":"3e8c2","_k":"b288b6c6"},{"t":"N: O’s fourth 2p electron is paired, so repulsion makes it easier to remove","why":"1402 vs 1314 kJ/mol: the paired electron is easier to remove.","_n":"3f852","_k":"8653867c"}]},"b":{"prompt":"Which has the higher first ionization energy, Be or B, and why?","options":[{"t":"Be: Be has more protons","why":"B has more (5 vs 4).","_n":"3g862","_k":"64a46675"},{"t":"They’re equal","why":"900 vs 801.","_n":"3h872","_k":"24f890f3"},{"t":"B: higher \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub>","why":"IE₁ dips at B and O, for reasons in their configurations; the general trend still holds.","_n":"3i882","_k":"d2b86b95"},{"t":"Be: B’s outer electron is in 2p, higher in energy and partly shielded by 2s","why":"900 vs 801 kJ/mol: the 2p electron is easier to remove.","_n":"3j912","_k":"206afac3"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Rubidium is directly below potassium. Predict its radius and first ionization energy compared with potassium’s.","options":[{"t":"Larger radius, lower IE₁","why":"A fifth shell: 248 vs 227 pm, and 403 vs 419 kJ/mol.","_n":"3k922","_k":"fd62e759"},{"t":"Larger radius, higher IE₁","why":"A bigger atom holds its outer electron less tightly.","_n":"3l8f2","_k":"92a57b5a"},{"t":"Smaller radius, higher IE₁","why":"Down a group the outer electron is in a new, farther shell behind more core electrons, so it is easier to remove.","_n":"3m8e2","_k":"8a8c3c78"},{"t":"The same as potassium’s, because it’s in the same group","why":"Same group gives similar chemistry, not equal values.","_n":"3n8d2","_k":"c93ce07a"}]},"b":{"prompt":"Iodine is directly below bromine. Predict its electronegativity and radius compared with bromine’s.","options":[{"t":"The same EN, because it’s in the same group","why":"2.66 ≠ 2.96.","_n":"3o8c2","_k":"1627c814"},{"t":"Higher EN, smaller radius","why":"Down a group the outer electrons are in a new, farther shell behind more core electrons.","_n":"3p8b2","_k":"c0b44a62"},{"t":"Higher EN, larger radius","why":"Larger atoms attract shared electrons less.","_n":"3q8a2","_k":"204c6e10"},{"t":"Lower electronegativity (2.66 vs 2.96), larger radius","why":"A fifth shell puts the bonding electrons farther from the nucleus.","_n":"3r892","_k":"35674684"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why atomic radius decreases across a period?","options":[{"t":"“Atoms gain electrons, which makes them smaller.”","why":"Across a period the electrons go into the same shell while the pull grows (\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> up), so the atom shrinks.","_n":"3s882","_k":"877e0f1f"},{"t":"“Protons are added while the electrons go into the same shell, so the effective nuclear charge increases and pulls the valence electrons closer.”","why":"It names the cause: the same shell, with a rising \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub>.","_n":"3t972","_k":"0682604f"},{"t":"“The number of shells decreases across a period.”","why":"The shell number stays the same.","_n":"3u962","_k":"6e9444a0"},{"t":"“Nonmetals are naturally smaller than metals.”","why":"That’s a description, not a cause.","_n":"3v1d1","_k":"7e78c6e4"}]},"b":{"prompt":"Which is the best explanation of why atomic radius increases down a group?","options":[{"t":"“Atoms gain mass, so they get bigger.”","why":"Size depends on electron shells, not mass.","_n":"3w1e1","_k":"78bb0cb8"},{"t":"“Each element down a group has an additional occupied shell, and the inner shells shield the valence electrons from the extra protons.”","why":"It names both ideas: a new shell, and shielding by the inner shells.","_n":"3x1b1","_k":"f0dec05b"},{"t":"“\u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> increases down a group.”","why":"In the simple model it stays the same down a group.","_n":"3y1c1","_k":"19939fc4"},{"t":"“More protons push the electrons outward.”","why":"Protons attract electrons.","_n":"3z191","_k":"c92aa761"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which statement correctly explains why Na\u003csup>+\u003c/sup> is smaller than Na?","options":[{"t":"“Na\u003csup>+\u003c/sup> has more protons.”","why":"Same 11 protons.","_n":"401a1","_k":"e7f5c372"},{"t":"“Positive ions are always heavier.”","why":"Losing an electron makes it lighter, not smaller for that reason.","_n":"41171","_k":"d06ab671"},{"t":"“Na\u003csup>+\u003c/sup> has gained an electron.”","why":"Na\u003csup>+\u003c/sup> has lost one.","_n":"42181","_k":"74f80535"},{"t":"“Na\u003csup>+\u003c/sup> has lost its only 3s electron, so its outermost electrons are now in shell 2.”","why":"A whole shell is gone.","_n":"43151","_k":"64f67a4a"}]},"b":{"prompt":"Which statement correctly explains why Cl\u003csup>−\u003c/sup> is larger than Cl?","options":[{"t":"“Cl\u003csup>−\u003c/sup> has an extra shell.”","why":"The extra electron goes into 3p.","_n":"44161","_k":"7ee30689"},{"t":"“Cl\u003csup>−\u003c/sup> has fewer protons.”","why":"Same 17.","_n":"45832","_k":"23eee9bb"},{"t":"“Negative ions lose electrons.”","why":"Cl\u003csup>−\u003c/sup> gains one.","_n":"46822","_k":"37d72d41"},{"t":"“Cl\u003csup>−\u003c/sup> has one more electron in shell 3 but the same 17 protons, so repulsion spreads the electrons out.”","why":"Same protons, more electrons: more repulsion.","_n":"47852","_k":"c6fdcdcc"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Potassium reacts more vigorously with water than sodium does. Which explanation uses periodic trends correctly?","options":[{"t":"“Potassium has more protons, so it holds its electron more tightly.”","why":"Down a group the outer electron is in a new, farther shell behind more core electrons, so it is easier to remove.","_n":"48842","_k":"be472859"},{"t":"“Potassium’s lower first ionization energy (419 vs 496 kJ/mol) means it gives up its outer electron more easily.”","why":"Its outer electron is farther out and better shielded, so it leaves more easily.","_n":"49872","_k":"c4575cb0"},{"t":"“Potassium is a nonmetal.”","why":"It’s an alkali metal.","_n":"4a862","_k":"ecb0483e"},{"t":"“Potassium is smaller.”","why":"It’s larger.","_n":"4b892","_k":"c4488c42"}]},"b":{"prompt":"Fluorine is the most reactive nonmetal. Which explanation uses periodic trends correctly?","options":[{"t":"“Fluorine has the highest electronegativity (3.98) and a small radius, so it attracts electrons very strongly.”","why":"A high \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> acting over a short distance.","_n":"4c882","_k":"96f6e04d"},{"t":"“Fluorine has the most electrons.”","why":"It has only 9.","_n":"4d8b2","_k":"d4cbd073"},{"t":"“Fluorine is the largest halogen.”","why":"It’s the smallest.","_n":"4e8a2","_k":"3a190d89"},{"t":"“Fluorine has the lowest ionization energy.”","why":"It has one of the highest.","_n":"4f111","_k":"0e9b175c"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Using the course electronegativity values, which pair forms the most ionic bond?","options":[{"t":"Mg and O (2.13)","why":"Ionic, but less so.","_n":"4g121","_k":"949403a6"},{"t":"Na and Cl (2.23)","why":"Ionic, but less so.","_n":"4h131","_k":"1f7206c4"},{"t":"K and F (ΔEN 3.16)","why":"Lowest EN with highest EN.","_n":"4i141","_k":"24463e05"},{"t":"C and F (1.43)","why":"Polar covalent.","_n":"4j151","_k":"e91bce1c"}]},"b":{"prompt":"Using the course electronegativity values, which bond is least polar?","options":[{"t":"O–H (1.24)","why":"3.44 − 2.20 = 1.24: the most polar of these.","_n":"4k161","_k":"8c76acde"},{"t":"H–Cl (0.96)","why":"3.16 − 2.20 = 0.96: more polar than C–H.","_n":"4l171","_k":"d4368264"},{"t":"C–H (ΔEN 0.35)","why":"The smallest difference: 2.55 − 2.20 = 0.35.","_n":"4m181","_k":"14fc2ed5"},{"t":"C–O (0.89)","why":"3.44 − 2.55 = 0.89: more polar than C–H.","_n":"4n091","_k":"b00ab68b"}]}}]},"task":{"title":"Ionic pair poster","summary":"Ionic pair poster","statement":"\u003cp>Choose two elements X and Y for a poster showing a period trend and an ionic bond. Can you find all the pairs that work?\u003c/p>\u003col class=\"tr-conds\">\u003cli>X and Y are in the same period.\u003c/li>\u003cli>X has the larger atomic radius.\u003c/li>\u003cli>Y has the higher first ionization energy.\u003c/li>\u003cli>The X–Y bond is mostly ionic: ΔEN > 1.7.\u003c/li>\u003c/ol>","qX":"Element X","qY":"Element Y","checks":["Same period","X is larger","Y holds its electrons tighter","Mostly ionic"],"tips":["Use two cards from the same row.","Radius falls across a period: X goes on the left.","Watch the IE₁ dips: Al is below Mg.","You need a big EN gap: a metal on the left with a nonmetal far to the right."],"explainPrompt":"Explain why X is larger and holds its electrons less tightly than Y, using \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub>.","vocab":"Use the words effective nuclear charge, shell, ionization energy and electronegativity.","more":"There’s more than one answer. Can you find them all?","afterAt":6,"after3":"Notice that Na with S misses by a little (1.65), and Al with Cl (1.55) too. The ionic cut-off is a model line, and real bonding is a continuum."},"cards":[["Effective nuclear charge","The net pull on valence electrons. Simple model: \u003cem>Z\u003c/em>\u003csub>eff\u003c/sub> ≈ \u003cem>Z\u003c/em> − core electrons (Cl: 17 − 10 = 7)."],["Shielding","Inner electrons reduce the pull of the nucleus on outer electrons."],["Atomic radius trend","Decreases across a period; increases down a group."],["Ionization energy","The energy to remove an electron from a gaseous atom. IE₁ increases across and decreases down."],["Electronegativity","The pull of an atom on shared electrons. Highest at F (3.98); increases across, decreases down."],["Electron affinity","The energy change when an atom gains an electron; generally more negative across a period."],["IE₁ dips","B \u003c Be (2p is higher in energy than 2s); O \u003c N (the paired 2p electron repels)."],["Cation size","Smaller than the atom (Na\u003csup>+\u003c/sup> 102 pm vs Na 186 pm)."],["Anion size","Larger than the atom (Cl\u003csup>−\u003c/sup> 181 pm vs Cl 100 pm)."],["Isoelectronic series","Same electrons; more protons means smaller (N\u003csup>3−\u003c/sup> > O\u003csup>2−\u003c/sup> > F\u003csup>−\u003c/sup> > Na\u003csup>+\u003c/sup> > Mg\u003csup>2+\u003c/sup>)."],["Successive IEs","A big jump marks the first core electron; the electrons before the jump are the valence electrons."],["Reactivity link","Metals with low IE₁ react more readily; nonmetals with high EN gain electrons more readily."]]}};</script>
