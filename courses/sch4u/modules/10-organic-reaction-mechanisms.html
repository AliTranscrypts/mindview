.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 10: hero, C3 mechanism stepper, sorter, Markovnikov lab, roadmap, station 3, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.rm-heq{position:relative;display:inline-block;padding-top:1.05em}
.rm-heq-arr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.rm-heq-maj{font-size:.62em;color:var(--ink-2)}
.rm-hx-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:6px}
.rm-hx-svg,.rm-svg,.rm-isosvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.rm-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.rm-hx-cap{font:400 1.02rem var(--font-ui);color:var(--ink);margin:6px 0;min-height:2.8em;text-align:left}
.rm-hx-tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rm-hx-fr{margin:0;min-width:0}
.rm-hx-fr figcaption{font:400 .82rem/1.3 var(--font-ui);text-align:left;margin-top:4px}

/* explore layout */
.rm-how{margin-top:0}
.rm-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.rm-left,.rm-side{min-width:0}
.rm-modes{margin-bottom:10px}
.rm-cap{font:400 clamp(1.05rem,2.3vw,1.4rem)/1.35 var(--font-ui);min-height:1.4em;white-space:normal}
.rm-capn{font-size:.78em;color:var(--ink-2)}
.rm-ctrl > div + div{margin-top:12px}
.rm-ctrl > div > div + div{margin-top:10px}
.rm-side .read{margin-top:16px}
.rm-sortv[hidden],.rm-mechv[hidden],.rm-labv[hidden],.rm-mechc[hidden],.rm-labc[hidden],.rm-alks[hidden],.rm-multi[hidden],.rm-player[hidden],.rm-drawc[hidden],.rm-chips[hidden],.rm-r2[hidden]{display:none}
.rm-plus{display:inline-flex;align-items:center;justify-content:center;width:1.05em;height:1.05em;border-radius:50%;background:var(--hi-soft);border:1.2px solid var(--ink);color:var(--ink);font-size:.72em;font-weight:700;line-height:1;vertical-align:.55em;margin:0 1px}
.rm-x{color:var(--at-x);font-weight:700}
.rm-o{color:var(--at-o);font-weight:700}
.rm-cf{white-space:nowrap}

/* sort mode */
.rm-dealn{margin:6px 0 10px;color:var(--ink-2)}
.rm-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rm-bin{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2px dashed var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.5em .7em;min-height:48px;font-size:.95rem;font-weight:700;text-align:left;min-width:0}
.rm-bin:hover:not(:disabled){border-style:solid;border-color:var(--pen)}
.rm-bin:disabled{opacity:.6}
.rm-bint{overflow-wrap:anywhere}
.rm-cnt{flex:none;min-width:1.6em;padding:0 .35em;border-radius:999px;background:var(--hi-soft);color:var(--ink);font-size:.85rem;text-align:center}
.rm-sortfb{margin-top:10px;min-height:1em}

/* mechanism mode */
.rm-stagebox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.rm-legend{margin:6px 0 0}
.rm-stepcap{min-height:2.8em;margin:8px 0 4px;font-size:1rem}
.rm-dh{margin:10px 0 6px}
.rm-arw{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;margin:8px 0}
.rm-arwh{margin:0 0 6px;font-weight:700;color:var(--e-pair)}
.rm-arw .rm-hd{margin-top:8px}
.rm-dfb{margin-top:8px;min-height:1em}

/* Markovnikov lab */
.rm-labh{margin:4px 0 10px}
.rm-paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rm-path{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);transform-origin:50% 50%;min-width:0}
.rm-path.major,.rm-path.same{border:2.5px solid var(--pen)}
.rm-path.minor{opacity:.72}
.rm-ph{margin:0 0 6px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rm-cat{margin:0 0 8px;font-size:1.15rem}
.rm-cat small{font-size:.8rem;color:var(--ink-2)}
.rm-bar{margin:4px 0 8px}
.rm-bartr{height:12px;border:1.2px solid var(--ink-2);border-radius:6px;background:var(--sheet);overflow:hidden}
.rm-barfill{display:block;height:100%;background:var(--pen);border-radius:6px}
.rm-bartk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));font-size:.75rem;color:var(--ink-2);margin-top:3px}
.rm-bartk span{text-align:right}
.rm-bartk span.on{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.rm-prod{margin:0;font-size:.98rem}
.rm-role{display:inline-block;font-size:.78rem;font-weight:700;padding:.05em .5em;border-radius:999px;border:1.2px solid var(--ink-2)}
.rm-path.major .rm-role,.rm-path.same .rm-role{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.rm-labnote{margin:10px 0 0;font-size:.95rem}
.rm-mchips{display:inline-flex;flex-wrap:wrap;gap:6px}

/* classify sorter: nine bins in a 3 × 3 grid */
[data-act-id="classify"] .bins{grid-template-columns:repeat(3,minmax(0,1fr))}
[data-act-id="classify"] .bin{min-height:96px}
[data-act-id="classify"] .bin-items .chip-in{font-size:.78rem;overflow-wrap:anywhere}

/* Part 3: roadmap */
.rm-mapcard{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.rm-mmtext h3{margin:12px 0 4px}
.rm-chips,.rm-r2{margin:10px 0}
.rm-mapbox{overflow-x:auto;margin-top:10px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper)}
.rm-map{position:relative;margin:0 auto}
.rm-mapsvg{position:absolute;left:0;top:0;max-width:none}
.rm-edge line{stroke:var(--ink-2)}
.rm-edge path{fill:var(--ink-2)}
.rm-edge.used line{stroke:var(--pen);stroke-width:4}
.rm-edge.used path{fill:var(--pen)}
.rm-trap line{stroke:var(--ink-2);opacity:.7}
.rm-node,.rm-grpl,.rm-slot{position:absolute;transform:translate(-50%,-50%)}
.rm-node{white-space:nowrap;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:.95rem;font-weight:700;line-height:1.2}
.rm-node.cur{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 4px var(--hi-soft)}
.rm-grpl{font-size:.82rem;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.rm-slot{max-width:118px;min-width:44px;min-height:30px;padding:3px 7px;border:1.5px dashed var(--ink-2);border-radius:7px;background:var(--sheet);color:var(--ink-2);font-size:.74rem;line-height:1.2;font-weight:700}
.rm-slot.filled{border:1.5px solid var(--pen);color:var(--ink);font-weight:400}
.rm-slot.from{border:2px solid var(--pen);box-shadow:0 0 0 3px var(--hi-soft)}
.rm-slot.used{background:var(--hi-soft)}
.rm-slot.fixed{border:1.5px dashed var(--ink-2);color:var(--ink-2);font-weight:400}
.rm-mapn{margin:8px 0 0}
.rm-scrollnote{display:none;margin:6px 0 0}
.rm-mapfb{margin-top:8px}
.rm-rlog{margin:10px 0 0;padding-left:1.4em;display:grid;gap:6px}
.rm-rlog li{padding-left:2px}
.rm-rlog li.rm-fail{color:var(--ink)}
.rm-rlog li.rm-fail .rm-rstep{background:var(--bad-bg);border-radius:4px;padding:0 4px}
.rm-rstep{font-size:.92rem;color:var(--ink-2)}
.rm-sp{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.rm-spn{font-weight:700}
.rm-spf{font-size:.85rem;color:var(--ink-2)}

/* station 3 */
.rm-st3{margin-top:22px}
.rm-isobox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden;max-width:620px}
.rm-isodata{margin-top:10px}
.rm-aeintro{margin-top:22px}
.rm-ae{display:grid;gap:12px;max-width:620px}
.rm-aet{margin:0 0 4px;font-weight:700;font-size:.95rem}
.rm-aebar{display:flex;height:22px;border:1.2px solid var(--ink-2);border-radius:6px;overflow:hidden;background:var(--sheet)}
.rm-aep{display:block;height:100%;background:var(--pen)}
.rm-aew{display:block;height:100%;background:var(--ink-2);opacity:.55;margin-left:auto}
.rm-aev{margin:4px 0 0;font-size:.95rem}
.rm-aeleg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0}
.rm-sw{display:inline-block;width:14px;height:14px;border-radius:3px}
.rm-sw.p{background:var(--pen)}
.rm-sw.w{background:var(--ink-2);opacity:.55;margin-left:8px}
.rm-aeafter{margin-top:8px}

/* task */
.rm-conds{margin:6px 0 10px}
.rm-tkrow{margin:0 0 12px}
.rm-h4{margin:0 0 6px}
.rm-after4{font-weight:700}

@media (max-width:820px){
  .rm-grid{grid-template-columns:minmax(0,1fr)}
  .rm-scrollnote{display:block}
}
@media (max-width:560px){
  .rm-paths{grid-template-columns:minmax(0,1fr)}
  .rm-bins,[data-act-id="classify"] .bins{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

  [data-act-id="classify"] .bin{min-height:64px;padding:6px 7px}
  [data-act-id="classify"] .bin-head strong{font-size:.8rem;overflow-wrap:anywhere}
  [data-act-id="classify"] .bin-items .chip-in{font-size:.66rem}
  .rm-hx-tri{grid-template-columns:minmax(0,1fr)}
}

arr\" aria-hidden=\"true\">\u003c/svg>\u003cspan class=\"nw\">CH₃CH\u003cspan class=\"rm-heq-db\">=\u003c/span>CH₂ + \u003cspan class=\"rm-heq-h\">H\u003c/span>\u003cspan class=\"rm-heq-br\">Br\u003c/span> →\u003c/span> \u003cspan class=\"nw\">CH₃CHBrCH₃ \u003cspan class=\"rm-heq-maj\">(major)\u003c/span>\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"C H 3 C H double bond C H 2, plus H B r, gives C H 3 C H B r C H 3, the major product. Two curved violet arrows sit above the first step: one from the C=C to the H of H B r, one from the H–Br bond to Br.","headline":"Follow the electrons","text":"Every organic reaction is electrons moving from where they are plentiful to where they’re wanted. A \u003cstrong>curved arrow\u003c/strong> shows one electron pair on the move. Learn a few \u003cstrong>reaction types\u003c/strong> and a few \u003cstrong>mechanisms\u003c/strong>, and you can predict products you’ve never seen, and plan how to make them.","fig":{"html":"\u003cdiv class=\"rm-hx\">\u003cdiv class=\"rm-hx-box\" id=\"rm-hx-box\">\u003csvg class=\"rm-hx-svg\" id=\"rm-hx-svg\" viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Propene and HBr approach. A violet curved arrow leaves the C=C and lands on the H of HBr; a second arrow moves the H–Br bond’s electrons onto Br, which leaves as Br⁻. The middle carbon turns positive: a secondary carbocation, and a stability bar fills to more stable. A third arrow from a Br⁻ lone pair lands on the positive carbon, and 2-bromopropane appears, labelled major. Beside it, faded: the primary carbocation and 1-bromopropane, labelled minor.\">\u003c/svg>\u003c/div>\u003cdiv class=\"rm-hx-row\">\u003cp class=\"rm-hx-cap\" id=\"rm-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"rm-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can classify organic reactions as addition, substitution, elimination, oxidation, reduction, esterification, hydrolysis, condensation },{"id":"w4","skill":"Alcohol classes","goal":4,"prompt":"Which is a secondary alcohol?","options":[{"t":"methanol","why":"No carbons on the C–OH carbon.","_n":"ce32","_k":"6d528620"},{"t":"2-methylpropan-2-ol","why":"Three carbons: tertiary.","_n":"de82","_k":"b8bcdc84"},{"t":"propan-1-ol","why":"Its C–OH carbon has one carbon: primary.","_n":"ee92","_k":"e6733f48"},{"t":"propan-2-ol, CH₃CH(OH)CH₃","why":"The C–OH carbon has two carbons on it.","_n":"fe62","_k":"4cd85727"}],"hints":["Count carbons attached to the C–OH carbon.","Two means secondary.","Propan-2-ol."]},{"id":"w5","skill":"Polarity and ions","goal":2,"prompt":"In the H–Br bond, which atom carries the partial negative charge?","options":[{"t":"H","why":"That reverses electronegativity: Br (2.96) pulls the shared pair harder than H (2.20).","_n":"ge72","_k":"eab9fc68"},{"t":"Both equally","why":"One end pulls harder.","_n":"hdc2","_k":"9f4d9b5c"},{"t":"Neither: the bond is nonpolar","why":"ΔEN = 0.76: polar.","_n":"idd2","_k":"95938dc2"},{"t":"Br","why":"Br (2.96) is more electronegative than H (2.20).","_n":"jde2","_k":"374a4223"}],"hints":["Compare electronegativities.","Br 2.96 vs H 2.20.","Br is δ−."]},{"id":"w6","skill":"Polarity and ions","goal":2,"prompt":"Which species is electron-rich, able to donate an electron pair?","options":[{"t":"A carbocation, CH₃⁺","why":"Positive and electron-poor.","_n":"kdd2","_k":"54e64990"},{"t":"H⁺","why":"H⁺ has no electrons; it accepts a pair.","_n":"ldc2","_k":"30f37c10"},{"t":"Na⁺","why":"A positive ion doesn’t donate pairs.","_n":"mdb2","_k":"058f6cd8"},{"t":"OH⁻","why":"Lone pairs and a negative charge.","_n":"nda2","_k":"326cad53"}],"hints":["Look for lone pairs or negative charge.","Positive species accept pairs.","OH⁻."]}],"refreshers":{"Functional groups":"–OH alcohol, –CHO aldehyde, C=O inside the chain ketone, –COOH acid, –COO– ester.","Addition to alkenes":"H₂, X₂, HX and H₂O add across C=C.","Alcohol classes":"Count carbons on the C–OH carbon: 1 primary, 2 secondary, 3 tertiary.","Polarity and ions":"Electron-rich species (lone pairs, negative charge) donate pairs; electron-poor ones (H⁺, C⁺) accept them."}}},"explore":{"heading":"Reaction sorter and mechanism stepper","intro":"Sort reactions by type, then step inside three of them to watch the electrons move.","how":"Choose a mode. \u003cstrong>Sort:\u003c/strong> read the card, then tap the type it belongs to. \u003cstrong>Mechanism:\u003c/strong> choose a mechanism and use Play, Step and Back; choose \u003cstrong>Draw it\u003c/strong> to place each arrow yourself (a tail, then a head). \u003cstrong>Markovnikov lab:\u003c/strong> choose an alkene and a reagent and compare the two possible carbocations.","modes":[{"id":"sort","t":"Sort"},{"id":"mech","t":"Mechanism"},{"id":"lab","t":"Markovnikov lab"}],"bins":[{"id":"add","t":"addition"},{"id":"sub","t":"substitution"},{"id":"elim","t":"elimination"},{"id":"ox","t":"oxidation"},{"id":"red","t":"reduction"},{"id":"ester","t":"esterification"},{"id":"hyd","t":"hydrolysis"},{"id":"cond","t":"condensation"},{"id":"comb","t":"combustion"}],"cards":[{"id":"c1","t":"CH₃CH=CH₂ + HBr → CH₃CHBrCH₃","type":"add","look":"Two molecules become one, across the C=C."},{"id":"c2","t":"CH₃CH₂CH₂Br + OH⁻ → CH₃CH₂CH₂OH + Br⁻","type":"sub","look":"OH swaps in for Br; Br⁻ is the second product."},{"id":"c3","t":"CH₃CH₂OH → CH₂=CH₂ + H₂O (acid, heat)","type":"elim","look":"Water leaves and a C=C forms."},{"id":"c4","t":"CH₃CH(OH)CH₃ + [O] → CH₃COCH₃ + H₂O","type":"ox","look":"The alcohol loses two H atoms: a ketone forms."},{"id":"c5","t":"CH₃CHO + H₂ → CH₃CH₂OH (catalyst)","type":"red","look":"The C=O gains H: an aldehyde becomes an alcohol."},{"id":"c6","t":"HCOOH + CH₃CH₂OH → HCOOCH₂CH₃ + H₂O","type":"ester","look":"Acid + alcohol → ester + water."},{"id":"c7","t":"CH₃COOCH₃ + H₂O → CH₃COOH + CH₃OH","type":"hyd","look":"Water splits an ester into its acid and alcohol."},{"id":"c8","t":"CH₄ + 2O₂ → CO₂ + 2H₂O","type":"comb","look":"A fuel burns in O₂: CO₂ and H₂O."},{"id":"c9","t":"CH₃COOH + NH₃ → CH₃CONH₂ + H₂O","type":"cond","look":"An acid and N join, losing water: an amide."},{"id":"c10","t":"CH₂=CH₂ + H₂O → CH₃CH₂OH (acid catalyst)","type":"add","look":"Water adds across the C=C: one product."},{"id":"c11","t":"CH₃CH₂CHO + [O] → CH₃CH₂COOH","type":"ox","look":"The aldehyde gains an O: an acid forms."},{"id":"c12","t":"C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O","type":"comb","look":"Burned completely in O₂: only CO₂ and H₂O."}],"sig":{"add":"Addition needs a C=C and makes one product; substitution swaps atoms and makes two products.","sub":"Substitution: one atom or group swaps for another, so there are two products.","elim":"Elimination: a small molecule leaves and a C=C forms.","ox":"Oxidation: the carbon gains O or loses H.","red":"Reduction: the carbon gains H or loses O.","ester":"Esterification: an acid and an alcohol join, and water is lost.","hyd":"Hydrolysis: water is used up to split a molecule.","cond":"Condensation: two molecules join and water is lost (an amide when N joins).","comb":"Combustion: burning in O₂ to CO₂ and H₂O."},"predIntro":"Make a prediction first. Then the lab or the stepper shows you what really happens.","predictions":[{"id":"p1","prompt":"\u003cstrong>Markovnikov lab: propene + HBr.\u003c/strong> Which product is major?","options":[{"t":"propane","_n":"od92","_k":"2e30650d"},{"t":"1,2-dibromopropane","_n":"pd82","_k":"7529c7c3"},{"t":"1-bromopropane","_n":"qd72","_k":"5eec1f35"},{"t":"2-bromopropane","_n":"re62","_k":"c2df7b2b"}],"explain":"The secondary carbocation’s bar beats the primary one, and the 2-bromo product grows. The more stable secondary carbocation forms; Br⁻ bonds there."},{"id":"p2","prompt":"\u003cstrong>Mechanism 2.\u003c/strong> In bromoethane + OH⁻ → ethanol + Br⁻, which bond breaks?","options":[{"t":"C–H","_n":"se52","_k":"00384966"},{"t":"C–Br","_n":"td82","_k":"06e12b84"},{"t":"C–C","_n":"ud92","_k":"aecedaef"},{"t":"O–H","_n":"vda2","_k":"91ae4108"}],"explain":"The C–Br electrons slide onto Br as OH⁻’s lone pair forms C–O. Substitution: OH swaps in for Br."},{"id":"p3","prompt":"\u003cstrong>Markovnikov lab: but-2-ene + HBr.\u003c/strong> How many different products (structural isomers) can form?","options":[{"t":"0","_n":"wdb2","_k":"5b5249b2"},{"t":"1","_n":"xd42","_k":"c1a0a074"},{"t":"2","_n":"yd52","_k":"1ffe324f"},{"t":"3","_n":"zd62","_k":"ae745817"}],"explain":"Either carbon gives the same secondary carbocation and 2-bromobutane. Symmetric alkene: both ends are alike."},{"id":"p4","prompt":"\u003cstrong>Mechanism 3.\u003c/strong> What does dehydrating propan-2-ol make?","options":[{"t":"propanone and hydrogen","_n":"10d72","_k":"d9954095"},{"t":"propan-1-ol","_n":"11e02","_k":"5201de28"},{"t":"propene and water","_n":"12e12","_k":"1f3c1e5d"},{"t":"propane and oxygen","_n":"13d22","_k":"e19dc26b"}],"explain":"H₂O leaves, then H⁺ leaves to form the C=C. Elimination: a small molecule (water) leaves and a C=C forms."}],"chalIntro":"Use the stepper or the lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"\u003cstrong>Draw it\u003c/strong> sub-mode, mechanism 1, step 1: place the two arrows.","why":"Arrow 1 runs from the C=C bond to H; arrow 2 from the H–Br bond to Br. Arrows start at electrons (a bond or lone pair) and point to where they go.","hints":["Where are the electrons that will form the C–H bond?","In the C=C π bond.","C=C → H; H–Br bond → Br."]},{"id":"tc2","goal":3,"prompt":"\u003cstrong>Markovnikov lab:\u003c/strong> choose an alkene and reagent that give \u003cstrong>2-chloro-2-methylpropane\u003c/strong> as the major product.","why":"2-methylpropene + HCl: H⁺ adds to C1, the tertiary carbocation forms on C2, and Cl⁻ bonds there.","hints":["The product has 4 carbons with Cl on a carbon bonded to three others.","The tertiary carbocation must form.","2-methylpropene + HCl."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Select \u003cstrong>every\u003c/strong> alkene from the chips whose addition of HBr gives 2-bromobutane as the major product. (In the lab, set \u003cstrong>Pick\u003c/strong> to \u003cstrong>Several alkenes\u003c/strong>.)","why":"But-1-ene (Markovnikov) and but-2-ene (either carbon) both make the secondary carbocation on C2 of an unbranched 4-carbon chain.","hints":["2-bromobutane: a 4-carbon chain, Br on C2.","Which unbranched C₄ alkenes can put Br on C2 via a secondary carbocation?","But-1-ene (Markovnikov) and but-2-ene (either carbon)."]}],"blocks":[{"title":"What the stepper shows","html":"\u003cp>The type tells you what changes; the mechanism tells you why, and where the atoms end up.\u003c/p>"}]},"part3":{"slug":"roadmap","name":"Roadmap","heading":"Reaction roadmap","intro":"Three stations: fill the map, plan routes on it, then weigh the evidence and the efficiency. Reagents are named generically (“oxidizing agent [O]”, “acid catalyst, heat”): no quantities or procedures.","s1":{"title":"Station 1: Fill the map","intro":"Each arrow on the map is a reaction type. Tap a label chip, then tap the blank on the arrow it belongs to. Chips can be used more than once.","nodes":{"alkane":"alkane","halide":"alkyl halide","alkene":"alkene","p":"primary alcohol","s":"secondary alcohol","t":"tertiary alcohol","ald":"aldehyde","ket":"ketone","acid":"carboxylic acid","ester":"ester","amide":"amide"},"chips":[{"id":"h2o","t":"add H₂O (acid catalyst)"},{"id":"hx","t":"add HX"},{"id":"h2","t":"add H₂ (catalyst)"},{"id":"oh","t":"substitute with OH⁻"},{"id":"elim","t":"eliminate H₂O (acid, heat)"},{"id":"ox","t":"oxidize [O]"},{"id":"red","t":"reduce (add H₂)"},{"id":"est","t":"esterify (+ alcohol, acid catalyst)"},{"id":"cond","t":"condense (+ amine)"},{"id":"hyd","t":"hydrolyse"}],"m3":"Tertiary alcohol → ketone: tertiary alcohols don’t oxidize. Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","done":"Map complete. Every arrow is a reaction type you know: addition, substitution, elimination, oxidation, reduction, esterification, condensation and hydrolysis."},"s2":{"title":"Station 2: Plan a route","intro":"Choose a target. Then tap the arrows on the map, in order, to follow your molecule from the start to the target. Each tap is one step.","targets":[{"id":"r1","t":"ethene → ethanoic acid","start":"ethene","goal":"ethanoic acid","plan":"Hydrate, then oxidize twice: ethene → ethanol → ethanal → ethanoic acid."},{"id":"r2","t":"propene → propanone","start":"propene","goal":"propanone","plan":"Hydrate (Markovnikov) to propan-2-ol, then oxidize: propene → propan-2-ol → propanone."},{"id":"r3","t":"ethene → ethyl ethanoate","start":"ethene","goal":"ethyl ethanoate","plan":"Hydrate part of the ethene; oxidize part of the ethanol to ethanoic acid (through ethanal); esterify the acid with the rest of the ethanol."}]},"s3":{"title":"Station 3: Evidence and efficiency","isoIntro":"\u003cstrong>Isotope labels.\u003c/strong> Ethanol is made with heavy oxygen, ¹⁸O, then esterified with ethanoic acid. Where does the label go?","isoAfter":"When the alcohol’s O is labelled, the label appears in the ester, not the water. This is evidence that the acid supplies the –OH that leaves. Esterification: the acid loses –OH, the alcohol loses H. Labelled O from the alcohol ends up in the ester.","aeIntro":"\u003cstrong>Atom economy.\u003c/strong> Two routes to ethanol: by addition (ethene + water) or by substitution (bromoethane + OH⁻). Each bar shows the percentage of reactant atoms (by mass) that end up in ethanol.","aeAfter":"Addition puts every reactant atom into the product: 100%. Substitution makes Br⁻ as waste, so its atom economy is well under 100%."},"quickCheck":{"title":"Quick check","summary":"Reaction roadmap quick check","items":[{"id":"q1","goal":4,"prompt":"Oxidizing a primary alcohol fully gives…","choices":[{"t":"nothing","fb":"Primary → aldehyde → acid.","_n":"14d12","_k":"5d2d1f57"},{"t":"a ketone","fb":"Primary → aldehyde → acid.","_n":"15d42","_k":"838ec0eb"},{"t":"an alkene","fb":"Primary → aldehyde → acid.","_n":"16d32","_k":"8fef5aef"},{"t":"a carboxylic acid","fb":"Right. Primary → aldehyde → acid.","_n":"17d62","_k":"ee633ee8"}]},{"id":"q2","goal":4,"prompt":"Which alcohol resists oxidation?","choices":[{"t":"propan-1-ol","fb":"Tertiary: no H on the C–OH carbon.","_n":"18d52","_k":"242081af"},{"t":"ethanol","fb":"Tertiary: no H on the C–OH carbon.","_n":"19d82","_k":"3e4e35db"},{"t":"2-methylpropan-2-ol","fb":"Right. Tertiary: no H on the C–OH carbon.","_n":"1ad72","_k":"4f70f83b"},{"t":"propan-2-ol","fb":"Tertiary: no H on the C–OH carbon.","_n":"1bda2","_k":"538645f9"}]},{"id":"q3","goal":6,"prompt":"Labelled O from the alcohol ends up in…","choices":[{"t":"neither","fb":"The acid’s –OH leaves in the water.","_n":"1cd92","_k":"53bf7e5c"},{"t":"both","fb":"The acid’s –OH leaves in the water.","_n":"1d6c2","_k":"33de0d83"},{"t":"the ester","fb":"Right. The acid’s –OH leaves in the water.","_n":"1e6d2","_k":"00c0327e"},{"t":"the water","fb":"The acid’s –OH leaves in the water.","_n":"1f6a2","_k":"4faf9a63"}]},{"id":"q4","goal":6,"prompt":"Which reaction type has 100% atom economy?","choices":[{"t":"elimination","fb":"Only addition makes no by-product.","_n":"1g6b2","_k":"3be73ff5"},{"t":"condensation","fb":"Only addition makes no by-product.","_n":"1h682","_k":"1a84cd58"},{"t":"addition","fb":"Right. Only addition makes no by-product.","_n":"1i692","_k":"6787b5bf"},{"t":"substitution","fb":"Only addition makes no by-product.","_n":"1j662","_k":"5ef6092c"}]}]}},"practice":{"activities":[{"id":"classify","type":"sorter","title":"Classify the reaction","summary":"Classify the reaction","goal":1,"noun":"reaction","txt":true,"instruction":"Ten reactions, nine types. Sort each reaction into the type that fits it best.","boxes":[{"id":"add","label":"Addition"},{"id":"sub","label":"Substitution"},{"id":"elim","label":"Elimination"},{"id":"ox","label":"Oxidation"},{"id":"red","label":"Reduction"},{"id":"ester","label":"Esterification"},{"id":"hyd","label":"Hydrolysis"},{"id":"cond","label":"Condensation"},{"id":"comb","label":"Combustion"}],"wrongDefault":"Look at what changes: count reactants and products, and check whether a C=C or water appears or disappears.","items":[{"id":"i1","t":"CH₂=CH₂ + Br₂ → CH₂BrCH₂Br","_a":"F1FcXBU=","why":"Br₂ adds across the C=C, and two molecules become one.","hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Addition: Br₂ adds across the C=C, and two molecules become one."]},{"id":"i2","t":"CH₄ + Cl₂ → CH₃Cl + HCl (light)","_a":"F0NNWhU=","why":"A Cl swaps in for an H, and HCl is the second product.","wrong":{"add":"Addition needs a C=C and makes one product; substitution swaps atoms and makes two products."},"hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Substitution: a Cl swaps in for an H, and HCl is the second product."]},{"id":"i3","t":"CH₃CH(OH)CH₃ → CH₃CH=CH₂ + H₂O (acid, heat)","_a":"F1VUUVpB","why":"Water leaves and a C=C forms.","wrong":{"hyd":"Water is lost, not added: elimination."},"hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Elimination: water leaves and a C=C forms."]},{"id":"i4","t":"CH₃CH₂OH + [O] → CH₃CHO + H₂O","_a":"F19AGg==","why":"Ethanol loses two H atoms and becomes ethanal.","hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Oxidation: ethanol loses two H atoms and becomes ethanal."]},{"id":"i5","t":"CH₃COCH₃ + H₂ → CH₃CH(OH)CH₃","_a":"F0JdXBU=","why":"The ketone gains H₂ and becomes an alcohol.","wrong":{"add":"Adding H₂ to a C=O is a reduction: the carbon gains H."},"hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Reduction: the ketone gains H₂ and becomes an alcohol."]},{"id":"i6","t":"CH₃COOH + CH₃OH → CH₃COOCH₃ + H₂O","_a":"F1VLTFIREA==","why":"Acid + alcohol → ester + water.","hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Esterification: acid + alcohol → ester + water."]},{"id":"i7","t":"CH₃COOCH₂CH₃ + H₂O → CH₃COOH + CH₃CH₂OH","_a":"F1hBXBU=","why":"Water splits the ester into its acid and alcohol.","hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Hydrolysis: water splits the ester into its acid and alcohol."]},{"id":"i8","t":"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O","_a":"F1NXVVVB","why":"A hydrocarbon burns in O₂ to CO₂ and H₂O.","hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Combustion: a hydrocarbon burns in O₂ to CO₂ and H₂O."]},{"id":"i9","t":"CH₃COOH + CH₃NH₂ → CH₃CONHCH₃ + H₂O","_a":"F1NXVlNB","why":"The acid and the amine join with water lost, making an amide.","wrong":{"ester":"N, not O, joins: an amide by condensation."},"hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Condensation: the acid and the amine join with water lost, making an amide."]},{"id":"i10","t":"CH₃CH₂Br + OH⁻ → CH₃CH₂OH + Br⁻","_a":"F0NNWhU=","why":"OH swaps in for Br, and Br⁻ is the second product.","hints":["Count reactants and products.","Did a C=C appear or disappear? Did water appear or get used?","Substitution: OH swaps in for Br, and Br⁻ is the second product."]}]},{"id":"routes","type":"mc","title":"Predict products and routes","summary":"Predict products and routes","star":true,"goal":[3,4,5,6],"instruction":"Six items. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","items":[{"id":"r1","goal":3,"prompt":"Major product of propene + H₂O (acid)?","options":[{"t":"propan-1-ol","why":"H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"1k672","_k":"2fdbf668"},{"t":"propan-2-ol","why":"H⁺ adds to C1, the secondary carbocation forms on C2, and water bonds there.","_n":"1l642","_k":"158f7beb"},{"t":"propanal","why":"No oxidation happens: water adds across the C=C.","_n":"1m652","_k":"65ab0a14"},{"t":"propane","why":"That needs H₂, not water.","_n":"1n662","_k":"9d19ffd8"}]},{"id":"r2","goal":4,"prompt":"Product of oxidizing butan-2-ol?","options":[{"t":"butanal","why":"An aldehyde comes from a primary alcohol (butan-1-ol).","_n":"1o652","_k":"64898c6e"},{"t":"no reaction","why":"Only tertiary alcohols resist oxidation; butan-2-ol is secondary.","_n":"1p642","_k":"45a4e0a4"},{"t":"butanone","why":"Secondary → ketone.","_n":"1q632","_k":"1e298859"},{"t":"butanoic acid","why":"Secondary → ketone, and it stops there.","_n":"1r6a2","_k":"dd7a3d8f"}]},{"id":"r3","goal":3,"star":true,"prompt":"Major product of 2-methylbut-2-ene + HCl?","options":[{"t":"1-chloro-2-methylbutane","why":"Cl bonds to a carbon of the C=C (C2 or C3), never to C1.","_n":"1s692","_k":"cd4126be"},{"t":"2-chloropentane","why":"The carbon skeleton doesn’t change: it stays branched.","_n":"1t682","_k":"be1be054"},{"t":"2-chloro-3-methylbutane","why":"The tertiary carbocation forms at C2.","_n":"1u672","_k":"e94467f6"},{"t":"2-chloro-2-methylbutane","why":"H⁺ adds to C3, and the tertiary carbocation forms at C2; Cl⁻ bonds there.","_n":"1v5e2","_k":"47557485"}]},{"id":"r4","goal":5,"star":true,"prompt":"Which reagent sequence turns propan-1-ol into propan-2-ol?","options":[{"t":"add H₂O (acid), then eliminate H₂O","why":"Propan-1-ol has no C=C to add water to.","_n":"1w5d2","_k":"5950b3de"},{"t":"oxidize [O], then reduce (add H₂)","why":"Oxidizing gives propanal; reducing it gives propan-1-ol back. The O never leaves C1.","_n":"1x601","_k":"1091e721"},{"t":"eliminate H₂O (acid, heat), then add H₂O (acid)","why":"Dehydrate to propene, then Markovnikov hydration puts OH on C2.","_n":"1y611","_k":"431e6d32"},{"t":"substitute with OH⁻","why":"There’s no halogen to swap, and an OH can’t move directly.","_n":"1z621","_k":"7e032ed1"}],"hints":["Can you move an OH directly? No.","Go through an alkene.","Eliminate, then add water with Markovnikov’s rule."]},{"id":"r5","goal":6,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> Methanol with labelled ¹⁸O reacts with ethanoic acid. Where is the label?","options":[{"t":"in methyl ethanoate","why":"Esterification: the acid loses –OH, the alcohol loses H. Labelled O from the alcohol ends up in the ester.","_n":"20631","_k":"875881f8"},{"t":"in leftover ethanoic acid","why":"The label starts on the alcohol, and esterification doesn’t move it to the acid.","_n":"21641","_k":"50f6bb9d"},{"t":"in water","why":"Esterification: the acid loses –OH, the alcohol loses H. Labelled O from the alcohol ends up in the ester.","_n":"22651","_k":"0003e86f"},{"t":"split between the ester and the water","why":"The alcohol keeps its O; only its O–H hydrogen leaves.","_n":"23661","_k":"b43cdb4d"}]},{"id":"r6","goal":5,"star":true,"prompt":"Fewest steps from ethene to ethyl ethanoate, using only ethene and water as starting materials (plus catalysts and an oxidizing agent)?","options":[{"t":"2: hydrate, then esterify","why":"You need both the alcohol and the acid.","_n":"24671","_k":"35d2fc1b"},{"t":"3: hydrate; oxidize; reduce","why":"Reducing undoes the oxidation, and no ester forms.","_n":"25581","_k":"a89bb8a4"},{"t":"1: add ethanoic acid to ethene","why":"Only ethene and water are allowed, and an ester needs an alcohol’s –OH.","_n":"26591","_k":"6b952482"},{"t":"3: hydrate → ethanol; oxidize part → ethanoic acid; esterify","why":"Both the alcohol and the acid come from ethanol.","_n":"27da1","_k":"1537ae37"}],"hints":["An ester needs an acid and an alcohol.","Both come from ethanol.","Hydrate, oxidize some, esterify."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Colm","how":"","goal":[2,3,4],"instruction":"Colm made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Predict the major product of but-1-ene + HBr.","steps":["H⁺ adds to one carbon of the C=C.","Adding H⁺ to C2 gives a primary carbocation on C1.","Br⁻ bonds to C1.","Major product: 1-bromobutane."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking.","","Follows step 2.","Follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"28d91","_k":"dcdb0013"},{"t":"H⁺ adds to C1 (the end CH₂), giving the more stable secondary carbocation on C2; major product 2-bromobutane.","why":"H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"29dc1","_k":"a9961383"},{"t":"H⁺ adds to C3.","why":"C3 isn’t part of the double bond.","_n":"2adb1","_k":"fa981915"},{"t":"Both bromines add: 1,2-dibromobutane.","why":"HBr has one Br: H adds to one carbon and Br to the other.","_n":"2bd61","_k":"ec8e0b2a"}],"hints":["Which carbocation is more stable?","Secondary beats primary.","2-bromobutane."]},{"id":"e2","goal":2,"task":"Describe the arrows for OH⁻ + bromoethane → ethanol + Br⁻.","steps":["OH⁻ has lone pairs on O.","Arrow 1 goes from the carbon to the O of OH⁻.","Arrow 2 goes from the C–Br bond to Br.","The C–O bond forms and Br⁻ leaves."],"_a":"BA==","stepFb":["Correct. Keep checking.","","Step 3 is a correct description, but the first mistake is earlier.","Follows step 2."],"fixes":[{"t":"Arrow 1 starts at an O lone pair and points to the carbon.","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2cd51","_k":"35cbe177"},{"t":"Arrow 1 goes from Br to O.","why":"Br’s electrons leave with Br; the electrons for the new C–O bond come from O.","_n":"2dd81","_k":"89bf2e22"},{"t":"Arrows show the OH⁻ ion moving; direction doesn’t matter.","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2ed71","_k":"982c6d68"},{"t":"Step 2 is correct.","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2fe21","_k":"07367111"}],"hints":["Where are the electrons that form the new C–O bond?","On the oxygen.","From an O lone pair to C."]},{"id":"e3","goal":4,"task":"Predict the product of oxidizing 2-methylpropan-2-ol.","steps":["The C–OH carbon is bonded to three carbons: tertiary.","Oxidation turns the C–OH into C=O.","So the product is 2-methylpropanone."],"_a":"BA==","stepFb":["Correct. Keep checking.","","Follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"2ge11","_k":"3d66fe63"},{"t":"The product is 2-methylpropanal.","why":"Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"2hd41","_k":"449e8a92"},{"t":"The product is 2-methylpropanoic acid.","why":"Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"2id51","_k":"095fce7a"},{"t":"Making C=O requires removing an H from the C–OH carbon; a tertiary C–OH carbon has none, so there’s no reaction.","why":"Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"2jd21","_k":"0fef96b1"}],"hints":["What two atoms are removed when an alcohol is oxidized?","The O–H hydrogen and an H on the C–OH carbon.","None on a tertiary carbon: no reaction."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which surprised you more: that the arrows show electrons, not atoms, or that the more stable carbocation decides the product?"},{"id":"j2","q":"In your own words, explain Markovnikov’s rule using carbocations."},{"id":"j3","q":"Explain to a friend how to plan a route from an alkene to an ester."},{"id":"j4","q":"Which reaction type do you still mix up with another? What will you do to tell them apart?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"CH₂=CH₂ + Br₂ → CH₂BrCH₂Br is which type of reaction?","options":[{"t":"elimination","why":"A C=C disappeared, not formed.","_n":"2kd31","_k":"d89ac35e"},{"t":"condensation","why":"Nothing small was released.","_n":"2ld81","_k":"9eb31d2a"},{"t":"addition","why":"Br₂ adds across the C=C: two molecules become one.","_n":"2md91","_k":"87ec87d5"},{"t":"substitution","why":"No atom was swapped out; there’s one product.","_n":"2nd61","_k":"f56c86ae"}]},"b":{"prompt":"CH₃CH₃ + Cl₂ → CH₃CH₂Cl + HCl (in light) is which type of reaction?","options":[{"t":"addition","why":"Ethane has no C=C.","_n":"2od71","_k":"42680b5e"},{"t":"elimination","why":"No C=C forms.","_n":"2pdc1","_k":"1c24119d"},{"t":"combustion","why":"No O₂ is involved.","_n":"2qdd1","_k":"9349550f"},{"t":"substitution","why":"A Cl swaps in for an H, and HCl is the second product.","_n":"2r02a","_k":"e02dd3f5"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In a mechanism, what does a curved arrow show?","options":[{"t":"an atom moving","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2s03a","_k":"ae1d774a"},{"t":"the direction heat flows","why":"Arrows show electrons.","_n":"2t00a","_k":"1cd8826e"},{"t":"an electron pair moving","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2u01a","_k":"b9b95689"},{"t":"a proton moving","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2vfea","_k":"b5ebc42b"}]},"b":{"prompt":"Where should a curved arrow start?","options":[{"t":"at the atom that will gain electrons","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2wffa","_k":"caa4dea9"},{"t":"at a source of electrons: a lone pair or a bond","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2xfca","_k":"8996b500"},{"t":"at the product","why":"Arrows show how reactants change.","_n":"2yfda","_k":"9b8ac0a5"},{"t":"at a positive charge","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"2zfaa","_k":"1178a6b3"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What does oxidizing propan-2-ol give?","options":[{"t":"propanoic acid","why":"Secondary → ketone, and it stops there.","_n":"30fba","_k":"52c46b9d"},{"t":"no reaction","why":"Secondary alcohols do oxidize, to ketones.","_n":"3168b","_k":"33509e2f"},{"t":"propanone","why":"Secondary → ketone.","_n":"3267b","_k":"9a6b94a4"},{"t":"propanal","why":"That’s from a primary alcohol.","_n":"336ab","_k":"443ac980"}]},"b":{"prompt":"What does oxidizing 2-methylpropan-2-ol give?","options":[{"t":"2-methylpropanal","why":"Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"3469b","_k":"12e110b7"},{"t":"2-methylpropanone","why":"That can’t exist: the central carbon would need five bonds. Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"356cb","_k":"5892672c"},{"t":"2-methylpropanoic acid","why":"Oxidation removes an H from the C–OH carbon. A tertiary C–OH carbon has none.","_n":"366bb","_k":"a1a8e022"},{"t":"no reaction","why":"Tertiary.","_n":"376eb","_k":"a61f7fa3"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"What is the major product of 2-methylpropene + HCl?","options":[{"t":"1-chloro-2-methylpropane","why":"H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"386db","_k":"4154fec2"},{"t":"2-methylpropane","why":"HCl adds; H₂ wasn’t used.","_n":"3970b","_k":"03614a0c"},{"t":"2-chloro-2-methylpropane","why":"Tertiary carbocation.","_n":"3a6fb","_k":"a377c96e"},{"t":"2-chlorobutane","why":"The skeleton doesn’t change.","_n":"3bf6a","_k":"246c81a7"}]},"b":{"prompt":"What is the major product of propene + H₂O (acid catalyst)?","options":[{"t":"propanal","why":"No oxidation happens.","_n":"3cf7a","_k":"cd410c43"},{"t":"propan-1-ol","why":"H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"3df8a","_k":"a282a907"},{"t":"propan-2-ol","why":"The secondary carbocation forms on C2, and water bonds there.","_n":"3ef9a","_k":"59c6b198"},{"t":"propane-1,2-diol","why":"One water adds.","_n":"3ffaa","_k":"d89a4c8c"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Which alkene gives only one structural product when it reacts with HCl?","options":[{"t":"2-methylpropene","why":"Two possible products (one major).","_n":"3gfba","_k":"f8f12396"},{"t":"propene","why":"Two possible products (one major).","_n":"3hfca","_k":"af424e88"},{"t":"but-1-ene","why":"Two possible products.","_n":"3ifda","_k":"3d92e62e"},{"t":"but-2-ene","why":"Symmetric: both carbons of the C=C are alike.","_n":"3jeea","_k":"d2629512"}]},"b":{"prompt":"Which alkene + H₂O (acid) gives 2-methylbutan-2-ol as the major product?","options":[{"t":"2-methylbutane","why":"No C=C: no reaction.","_n":"3kefa","_k":"7b6a510f"},{"t":"pent-2-ene","why":"Gives pentan-2-ol and pentan-3-ol.","_n":"3lfca","_k":"fc0fcde4"},{"t":"2-methylbut-2-ene","why":"H⁺ adds to C3 to give the tertiary carbocation at C2.","_n":"3mfba","_k":"19a7aaab"},{"t":"pent-1-ene","why":"Gives pentan-2-ol.","_n":"3nfaa","_k":"e5093ab4"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Which sequence turns propene into propanone?","options":[{"t":"add H₂O to get propan-1-ol, then oxidize","why":"That would give propanal. H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"3of9a","_k":"4d2923fd"},{"t":"oxidize propene directly","why":"Alkenes don’t oxidize to ketones this way.","_n":"3p00a","_k":"90fd9985"},{"t":"add H₂ to get propane, then oxidize","why":"Alkanes don’t oxidize to ketones.","_n":"3qffa","_k":"a27f9050"},{"t":"add H₂O (acid) to get propan-2-ol, then oxidize","why":"Markovnikov hydration puts the OH on C2, and a secondary alcohol oxidizes to a ketone.","_n":"3rfea","_k":"0edfeda7"}]},"b":{"prompt":"Which sequence turns ethene into ethyl ethanoate?","options":[{"t":"hydrate ethene to ethanol; esterify ethanol with more ethanol","why":"An ester needs an acid.","_n":"3sfda","_k":"984babf0"},{"t":"add H₂ to make ethane; esterify the ethane with ethanoic acid","why":"Alkanes have no –OH, so they can’t form esters.","_n":"3tf4a","_k":"39a22fab"},{"t":"oxidize ethene to ethanoic acid; add ethene","why":"Esters form from an acid and an alcohol.","_n":"3uf3a","_k":"2a3be8fd"},{"t":"hydrate ethene to ethanol; oxidize part of it to ethanoic acid; esterify the acid with the rest of the ethanol","why":"An ester needs an acid and an alcohol, and both come from ethanol.","_n":"3vfab","_k":"1d0494ba"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why propene + HBr gives mainly 2-bromopropane?","options":[{"t":"“The product that’s most stable at the end always forms.”","why":"The intermediate decides. The deciding step is forming the carbocation: the more stable intermediate forms faster.","_n":"3wfbb","_k":"3d19b723"},{"t":"“H⁺ adds to the end carbon so the positive charge sits on the middle carbon, a more stable secondary carbocation; Br⁻ then bonds there.”","why":"The deciding step is forming the carbocation: the more stable intermediate forms faster.","_n":"3xf8b","_k":"9def20d9"},{"t":"“Br is attracted to the carbon with more hydrogens.”","why":"H⁺ adds first to make the more stable carbocation; X⁻ or water then bonds to that more substituted carbon.","_n":"3yf9b","_k":"26794fea"},{"t":"“2-bromopropane is lighter, so it forms more.”","why":"The masses are equal.","_n":"3zfeb","_k":"0cef8b4d"}]},"b":{"prompt":"Which is the best explanation of why a tertiary carbocation is more stable than a primary one?","options":[{"t":"“It’s heavier.”","why":"Mass isn’t the reason.","_n":"40ffb","_k":"65a8e409"},{"t":"“It has a full octet.”","why":"Carbocations have only six valence electrons.","_n":"41fcb","_k":"b212cf69"},{"t":"“Three alkyl groups push electron density toward the positive carbon, spreading out the charge.”","why":"More alkyl groups spread the charge more: tertiary > secondary > primary.","_n":"42fdb","_k":"04372a16"},{"t":"“It has more hydrogens on the positive carbon.”","why":"It has none.","_n":"43f2b","_k":"41967c1e"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which description of step 2 of HBr adding to propene is correct?","options":[{"t":"“A hydride ion leaves.”","why":"No H⁻ moves.","_n":"44f3b","_k":"7ac89b94"},{"t":"“A lone pair on Br⁻ forms a bond to the positive carbon: the arrow goes from Br⁻ to C⁺.”","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"4500b","_k":"54134a53"},{"t":"“Br⁺ attacks the alkene.”","why":"Bromide is negative.","_n":"46ffb","_k":"d3b258af"},{"t":"“The arrow goes from C⁺ to Br⁻.”","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"4702b","_k":"3b3d0b10"}]},"b":{"prompt":"Which description of OH⁻ substituting for Br in bromoethane is correct?","options":[{"t":"“An O lone pair attacks the carbon as the C–Br bond’s electrons leave with Br, in one step.”","why":"One step: OH⁻ attacks as Br⁻ leaves. Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"4801b","_k":"f24b017f"},{"t":"“The carbon’s electrons move to OH⁻.”","why":"Arrows start at electrons (a bond or lone pair) and point to where they go.","_n":"49fcb","_k":"45a4dd21"},{"t":"“OH⁻ adds and nothing leaves.”","why":"That would be addition.","_n":"4afbb","_k":"450960c4"},{"t":"“Br⁺ leaves and OH⁺ arrives.”","why":"Br leaves as Br⁻.","_n":"4bfeb","_k":"af000904"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Ethanol can be made by route 1, ethene + water (addition), or route 2, bromoethane + OH⁻ (substitution). Which wastes fewer atoms, and why?","options":[{"t":"Route 1: every atom of ethene and water ends up in ethanol; route 2 also makes Br⁻ as waste","why":"Addition puts every reactant atom into the product; substitution and elimination always make a by-product.","_n":"4cfdb","_k":"e6788a1b"},{"t":"Route 1, because water is free","why":"Atom economy counts atoms, not cost.","_n":"4df8b","_k":"30008e33"},{"t":"Route 2: substitution always gives more product","why":"Addition puts every reactant atom into the product; substitution and elimination always make a by-product.","_n":"4ef7b","_k":"ed8e8c21"},{"t":"Both waste the same: every reaction loses atoms","why":"Addition puts every reactant atom into the product; substitution and elimination always make a by-product.","_n":"4f6eb","_k":"f4ea28a8"}]},"b":{"prompt":"Propan-2-ol can be made by route 1, propene + water, or route 2, 2-bromopropane + OH⁻. Which has the better atom economy, and why?","options":[{"t":"Route 1: addition puts all reactant atoms into the product","why":"Addition puts every reactant atom into the product; substitution and elimination always make a by-product.","_n":"4g6fb","_k":"fe2bb609"},{"t":"Route 2: it starts from a halide","why":"Addition puts every reactant atom into the product; substitution and elimination always make a by-product.","_n":"4h70b","_k":"cb540b54"},{"t":"They’re equal","why":"Addition puts every reactant atom into the product; substitution and elimination always make a by-product.","_n":"4i71b","_k":"ee0d616c"},{"t":"Route 2, because OH⁻ is cheap","why":"Atom economy is about atoms.","_n":"4j6ab","_k":"ff0fddd0"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A flavour chemist wants methyl butanoate (fruity). Which reactants and reaction type are needed?","options":[{"t":"butanoic acid + methane, addition","why":"Methane has no OH.","_n":"4k6bb","_k":"fcefed46"},{"t":"butan-1-ol + methanoic acid, esterification","why":"That gives butyl methanoate. Esterification: the acid loses –OH, the alcohol loses H. Labelled O from the alcohol ends up in the ester.","_n":"4l6cb","_k":"fa735ebc"},{"t":"butanoic acid + methanol, esterification (acid catalyst)","why":"The methyl part comes from the alcohol and the butanoate part from the acid.","_n":"4m6db","_k":"9cf283d1"},{"t":"methyl butane + O₂, oxidation","why":"That’s not how esters form.","_n":"4n76b","_k":"a211d500"}]},"b":{"prompt":"Soap is made by heating fats (esters) with a base. What type of reaction breaks the fat?","options":[{"t":"esterification","why":"That makes esters; soap-making breaks them.","_n":"4o77b","_k":"bc023098"},{"t":"addition","why":"No C=C is involved.","_n":"4p74b","_k":"4654c6f0"},{"t":"hydrolysis (saponification): the ester links split into carboxylate salts and glycerol","why":"The base splits each ester link.","_n":"4q73b","_k":"1626a411"},{"t":"oxidation","why":"No oxygen is added to the carbon skeleton.","_n":"4r72b","_k":"b8fc06e8"}]}}]},"task":{"title":"Plan a synthesis","summary":"Plan a synthesis","statement":"\u003cp>Starting from one alkene, plan a route that makes a 4-carbon ketone. Can you find all the routes?\u003c/p>\u003col class=\"rm-conds\">\u003cli>The final product is a ketone.\u003c/li>\u003cli>It has 4 carbons.\u003c/li>\u003cli>The route has at most 3 steps.\u003c/li>\u003cli>Every step uses a reaction from the roadmap and gives its major product.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">\u003cstrong>Model rules.\u003c/strong> Alkenes add H₂O or HBr with Markovnikov’s rule, and H₂ to give the alkane. An alkyl bromide + OH⁻ gives the alcohol on the same carbon. Oxidizing a primary alcohol gives an aldehyde (a second oxidation gives the acid); a secondary alcohol gives a ketone; a tertiary alcohol gives no reaction. As on the roadmap, H₂ also reduces an aldehyde or a ketone to the alcohol.\u003c/p>","checks":["Ends as a ketone","4 carbons","≤ 3 steps","Every step works"],"tips":["Ketones come from oxidizing a secondary alcohol.","Which alkenes give a secondary C₄ alcohol by Markovnikov addition?","2-methylpropene gives a tertiary alcohol, which won’t oxidize.","HBr then OH⁻ reaches the same alcohol in two steps."],"explainPrompt":"Explain why your route gives a ketone, naming the intermediate and the rule that decided each step.","vocab":"Use the words Markovnikov, carbocation, secondary alcohol and oxidation.","success":"Your route works!","more":"There’s more than one route. Can you find them all?","after4":"Every route goes through butan-2-ol. 2-methylpropene would make a tertiary alcohol, which can’t be oxidized."},"cards":[["Addition","Two molecules → one, across a C=C."],["Substitution","One atom or group swaps for another; two products."],["Elimination","A small molecule leaves and a C=C forms."],["Oxidation (organic)","Gain of O or loss of H: 1° alcohol → aldehyde → acid; 2° → ketone."],["Reduction (organic)","Gain of H or loss of O: ketone + H₂ → 2° alcohol."],["Esterification","Acid + alcohol ⇌ ester + water (acid catalyst)."],["Hydrolysis","Water splits an ester or amide into its parts."],["Curved arrow","One electron pair moving: from a bond or lone pair to an atom."],["Carbocation","A carbon with a + charge and only six valence electrons."],["Carbocation stability","tertiary > secondary > primary."],["Markovnikov’s rule","H adds to the C=C carbon that already has more H’s (via the more stable carbocation)."],["Atom economy","The share of reactant atoms that end up in the wanted product; addition = 100%."]]}};</script>
