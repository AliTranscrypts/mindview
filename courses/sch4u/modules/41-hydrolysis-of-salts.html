.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}

.hs-hx-cap{margin:6px 0 0;min-height:3em;flex:1 1 16rem}
.hs-fade{animation:hs-fade .6s ease-out}

.hs-left,.hs-ctrl{min-width:0}

.hs-lines{margin:8px 0 0;padding-left:1.2em}
.hs-lines li{margin:4px 0}

.hs-sub{margin:10px 0 2px;font-size:.92rem}
.hs-msvg{display:block;width:100%;max-width:460px;height:auto}

.hs-sp-b{background:var(--ab-oh)}
.hs-eqc{font-size:1rem}
.hs-dtab{display:flex;flex-direction:column;gap:6px}

.hs-sci{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

uilibrium with ethanoic acid plus hydroxide ion","headline":"Some salts quietly change the pH.","text":"When a salt dissolves, its ions spread through the water. Some ions just float there. Others react with water: this is \u003cstrong>hydrolysis\u003c/strong>. The \u003cstrong>conjugate base\u003c/strong> of a weak acid pulls H⁺ off water and leaves OH⁻, making the solution \u003cstrong>basic\u003c/strong>. The \u003cstrong>conjugate acid\u003c/strong> of a weak base hands H⁺ to water, making it \u003cstrong>acidic\u003c/strong>.","fig":{"html":"\u003cdiv class=\"hs-hx\">\u003cdiv id=\"hs-hx-svg\">\u003c/div>\u003cdiv class=\"hs-hx-row\">\u003cp class=\"hs-hx-cap\" id=\"hs-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"hs-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can predict whether a salt solution is acidic, basic or neutral from the acids and bases its ions came from.","I can write the hydrolysis equation for an ion that reacts with water.","I can find \u003ci>K\u003c/i>\u003csub>b\u003c/sub> from \u003ci>K\u003c/i>\u003csub>a\u003c/sub> (or \u003ci>K\u003c/i>\u003csub>a\u003c/sub> from \u003ci>K\u003c/i>\u003csub>b\u003c/sub>) using \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub>.","I can calculate the pH of a salt solution with an ICE table and the 5% check.","I can predict the pH of a salt whose ions both hydrolyze by comparing \u003ci>K\u003c/i>\u003csub>a\u003c/sub> and \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","I can explain everyday effects of salt hydrolysis in food, cleaning, soil and water."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Conjugate pairs","goal":1,"prompt":"What is the conjugate base of HF?","options":[{"t":"HF⁻","why":"A conjugate base differs by one H⁺, not one electron.","_n":"040d","_k":"e4394ed1"},{"t":"H₂F⁺","why":"That’s HF acting as a base: its conjugate acid.","_n":"13fd","_k":"0aba92ab"},{"t":"F⁻","why":"Remove one H⁺ from the acid.","_n":"23ed","_k":"0b0c4274"},{"t":"OH⁻","why":"OH⁻ is water’s conjugate base.","_n":"345d","_k":"b0494887"}],"hints":["Acid → conjugate base: take away what?","One H⁺.","HF − H⁺ = F⁻."]},{"id":"w2","skill":"Conjugate pairs","goal":2,"prompt":"What is the conjugate acid of NH₃?","options":[{"t":"H₃O⁺","why":"That’s water’s conjugate acid.","_n":"444d","_k":"be14b621"},{"t":"NH₄⁺","why":"Add one H⁺.","_n":"543d","_k":"b7876eac"},{"t":"NH₃⁺","why":"Adding H⁺ adds a hydrogen atom too.","_n":"642d","_k":"6f76baa5"},{"t":"NH₂⁻","why":"That’s the conjugate base.","_n":"739d","_k":"ced2c5de"}],"hints":["Base → conjugate acid: add what?","One H⁺.","NH₃ + H⁺ = NH₄⁺."]},{"id":"w3","skill":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub>","goal":3,"use":"1 ÷ 1.8 ≈ 0.56","prompt":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of ethanoic acid is 1.8 × 10⁻⁵. What is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> of the ethanoate ion?","options":[{"t":"1.8 × 10⁻⁵","why":"That’s the acid’s constant, not its conjugate base’s.","_n":"838d","_k":"68dfe414"},{"t":"1.8 × 10⁻¹⁹","why":"Divide \u003ci>K\u003c/i>\u003csub>w\u003c/sub> by \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"9267","_k":"b0b5c435"},{"t":"5.6 × 10⁻¹⁰","why":"\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.0 × 10⁻¹⁴ ÷ 1.8 × 10⁻⁵.","_n":"a277","_k":"69f0b79f"},{"t":"5.6 × 10⁻⁹","why":"10⁻¹⁴ ÷ 10⁻⁵ = 10⁻⁹, and 1 ÷ 1.8 = 0.56 moves it to 5.6 × 10⁻¹⁰.","_n":"b247","_k":"ccc53d80"}],"hints":["For a conjugate pair, \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = ?","\u003ci>K\u003c/i>\u003csub>w\u003c/sub> = 1.0 × 10⁻¹⁴.","1.0 × 10⁻¹⁴ ÷ 1.8 × 10⁻⁵ = 0.56 × 10⁻⁹ = 5.6 × 10⁻¹⁰."]},{"id":"w4","skill":"Weak acid and base calculations","goal":4,"prompt":"For a weak base, \u003ci>x\u003c/i>² = 1.0 × 10⁻¹⁰, where \u003ci>x\u003c/i> = [OH⁻]. What is the pH?","options":[{"t":"4.00","why":"Square-root first.","_n":"c257","_k":"78c30f64"},{"t":"5.00","why":"That’s the pOH.","_n":"d227","_k":"a595c4e0"},{"t":"9.00","why":"\u003ci>x\u003c/i> = 1.0 × 10⁻⁵, so pOH = 5.00 and pH = 9.00.","_n":"e237","_k":"43be12e7"},{"t":"10.00","why":"Take √(10⁻¹⁰) = 10⁻⁵ first.","_n":"f207","_k":"f24486c0"}],"hints":["Find \u003ci>x\u003c/i> first.","\u003ci>x\u003c/i> = 1.0 × 10⁻⁵ mol/L is [OH⁻].","pOH 5.00; pH = 14.00 − 5.00."]},{"id":"w5","skill":"Weak acid and base calculations","goal":4,"prompt":"A weak acid has \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.0 × 10⁻⁶ and \u003ci>c\u003c/i> = 0.010 mol/L. Does the 5% check pass for \u003ci>x\u003c/i> = √(\u003ci>K\u003c/i>\u003csub>a\u003c/sub>\u003ci>c\u003c/i>)?","options":[{"t":"Yes: \u003ci>x\u003c/i> = 1.0 × 10⁻⁴, which is 1% of 0.010","why":"Under 5%, so the approximation is fine.","_n":"g217","_k":"e43f7cbf"},{"t":"No: \u003ci>x\u003c/i> is 10% of \u003ci>c\u003c/i>","why":"1.0 × 10⁻⁴ ÷ 0.010 = 0.010 = 1%.","_n":"h1e7","_k":"e759ea5a"},{"t":"The check isn’t needed for weak acids","why":"The check is what makes the shortcut valid.","_n":"i1f7","_k":"ceb97fd8"},{"t":"Yes, because \u003ci>K\u003c/i>\u003csub>a\u003c/sub> is small","why":"Small \u003ci>K\u003c/i>\u003csub>a\u003c/sub> usually helps, but the check compares \u003ci>x\u003c/i> with \u003ci>c\u003c/i>.","_n":"j207","_k":"ff5309ac"}],"hints":["\u003ci>x\u003c/i> = √(\u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>c\u003c/i>).","√(10⁻⁸) = 10⁻⁴.","10⁻⁴ ÷ 10⁻² = 1%."]},{"id":"w6","skill":"Strong vs weak","goal":1,"prompt":"Which acid is strong?","options":[{"t":"HNO₃","why":"It ionizes completely in water.","_n":"k1f7","_k":"1b397d3d"},{"t":"HOCl","why":"Hypochlorous acid is very weak (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 3.0 × 10⁻⁸).","_n":"l1e7","_k":"6018354e"},{"t":"HF","why":"HF is weak (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 6.6 × 10⁻⁴).","_n":"m1d7","_k":"4c936642"},{"t":"CH₃COOH","why":"Ethanoic acid is weak.","_n":"n247","_k":"ca8dc48c"}],"hints":["Strong acids ionize 100%.","The common strong acids are HCl, HBr, HI, HNO₃, H₂SO₄ and HClO₄.","HNO₃."]}],"refreshers":{"Conjugate pairs":"An acid and its conjugate base differ by one H⁺: HF/F⁻, NH₄⁺/NH₃, CH₃COOH/CH₃COO⁻.","\u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub>":"For any conjugate pair at 25 °C, \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 1.0 × 10⁻¹⁴. Knowing one gives the other.","Weak acid and base calculations":"\u003ci>x\u003c/i>² = \u003ci>K\u003c/i> × \u003ci>c\u003c/i>, then check \u003ci>x\u003c/i> ÷ \u003ci>c\u003c/i> &lt; 5%. For a base, \u003ci>x\u003c/i> is [OH⁻]: find pOH, then pH = 14.00 − pOH.","Strong vs weak":"Strong acids (HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄) and strong bases (group 1 hydroxides) ionize completely. Everything in the course \u003ci>K\u003c/i>\u003csub>a\u003c/sub> and \u003ci>K\u003c/i>\u003csub>b\u003c/sub> tables is weak."}}},"explore":{"heading":"Salt sorter","intro":"Dissolve a salt, predict acidic, basic or neutral, then test it. Zoom in to see which ion reacts with water, and work out the pH.","how":"Choose a salt from the shelf and a concentration (arrow keys move through the chips). Predict \u003cstrong>Acidic\u003c/strong>, \u003cstrong>Basic\u003c/strong> or \u003cstrong>Neutral\u003c/strong>, then press \u003cstrong>Test\u003c/strong>. Switch the view to \u003cstrong>Zoom to the particles\u003c/strong> (Space steps the animation) or \u003cstrong>Calculate\u003c/strong> for the ICE workbench.","modes":[{"id":"sort","t":"Sort"},{"id":"zoom","t":"Zoom to the particles"},{"id":"calc","t":"Calculate"}],"modelNote":"For NH₄CH₃COO and NH₄F (both ions react), the m&#101;ter uses the model pH = 7.00 − ½ log(\u003ci>K\u003c/i>\u003csub>a\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub>). This formula is beyond the course and is never assessed: compare \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(cation) with \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(anion) instead.","predictions":[{"id":"p1","prompt":"Three beakers, 0.18 mol/L each. Which one turns universal indicator blue (basic)?","options":[{"t":"KNO₃","_n":"o237","_k":"030c695a"},{"t":"NH₄Cl","_n":"p227","_k":"3a70b0a4"},{"t":"NaCl","_n":"q217","_k":"32f9cede"},{"t":"CH₃COONa","_n":"r187","_k":"b13ce952"}],"explain":"Ethanoate is the conjugate base of a weak acid. NH₄Cl is acidic; NaCl and KNO₃ are neutral."},{"id":"p2","prompt":"NaCl, 0.30 mol/L. What is the pH?","options":[{"t":"above 7","_n":"s177","_k":"7aa0dad3"},{"t":"below 7","_n":"t1a7","_k":"ae35819a"},{"t":"it depends on the concentration","_n":"u1b7","_k":"907c6e30"},{"t":"7.00","_n":"v1c7","_k":"0df5d981"}],"explain":"NaOH and HCl are both strong, so neither ion pulls on H⁺. Neutralization makes a salt, but the salt’s ions may still react with water. Check each ion’s parent."},{"id":"p3","prompt":"CH₃COONa at 0.18 mol/L has pH 9.00. Now the concentration chip moves to 0.018. Ten times more dilute. The pH becomes:","options":[{"t":"8.00","_n":"w1d7","_k":"a8bc4ae0"},{"t":"8.50","_n":"x1e7","_k":"c57c7afd"},{"t":"9.00","_n":"y1f7","_k":"e485efa8"},{"t":"9.50","_n":"z207","_k":"5c494c9c"}],"explain":"[OH⁻] = √(\u003ci>K\u003c/i>\u003csub>b\u003c/sub> × \u003ci>c\u003c/i>). Dividing \u003ci>c\u003c/i> by 10 divides [OH⁻] by √10, so pOH rises by 0.50. A strong base would change by a full unit."},{"id":"p4","prompt":"NH₄CH₃COO. \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 5.6 × 10⁻¹⁰ and \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(CH₃COO⁻) = 5.6 × 10⁻¹⁰. The solution is:","options":[{"t":"Impossible to tell","_n":"10217","_k":"704d4286"},{"t":"Basic","_n":"11127","_k":"20103181"},{"t":"Neutral","_n":"12137","_k":"8ae3c8a4"},{"t":"Acidic","_n":"13248","_k":"bec723cd"}],"explain":"They pull equally. This salt is neutral because the two constants match, not because every weak–weak salt is neutral. Try NH₄F next."}],"chalIntro":"Use the sorter to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help. For challenge 3, press \u003cstrong>Stretch mode\u003c/strong> under the pH readout toggle: the pH stays hidden until you check.","challenges":[{"id":"tc1","goal":[3,4],"prompt":"Make a solution with pH 5.00 using one salt from the shelf.","why":"NH₄Cl at 0.18 mol/L: \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) × \u003ci>c\u003c/i> = 5.6 × 10⁻¹⁰ × 0.18 = 1.0 × 10⁻¹⁰, so [H₃O⁺] = 1.0 × 10⁻⁵ and pH = 5.00.","hints":["pH 5.00 means [H₃O⁺] = 1.0 × 10⁻⁵, so \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>c\u003c/i> = 1.0 × 10⁻¹⁰.","Which acidic cation has \u003ci>K\u003c/i>\u003csub>a\u003c/sub> near 10⁻¹⁰ to 10⁻⁹?","NH₄⁺: \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 5.6 × 10⁻¹⁰, so \u003ci>c\u003c/i> = 1.0 × 10⁻¹⁰ ÷ 5.6 × 10⁻¹⁰ = 0.18 mol/L."]},{"id":"tc2","goal":[3,4],"prompt":"Make a solution with pH 10.00.","why":"NaOCl at 0.030 mol/L: \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(OCl⁻) × \u003ci>c\u003c/i> = 3.3 × 10⁻⁷ × 0.030 = 1.0 × 10⁻⁸, so [OH⁻] = 1.0 × 10⁻⁴, pOH 4.00 and pH 10.00.","hints":["pOH 4.00, so [OH⁻] = 1.0 × 10⁻⁴ and \u003ci>K\u003c/i>\u003csub>b\u003c/sub> × \u003ci>c\u003c/i> = 1.0 × 10⁻⁸.","Which anion has the largest \u003ci>K\u003c/i>\u003csub>b\u003c/sub>? Its parent has the smallest \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","HOCl (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 3.0 × 10⁻⁸) gives \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(OCl⁻) = 3.3 × 10⁻⁷, so \u003ci>c\u003c/i> = 10⁻⁸ ÷ 3.3 × 10⁻⁷ = 0.030 mol/L."]},{"id":"tc3","goal":[4,6],"stretch":true,"prompt":"The pH readout is hidden. Choose a salt and concentration that give pH 8.50. There are three ways; find one, and justify it.","why":"All three ways have \u003ci>K\u003c/i>\u003csub>b\u003c/sub> × \u003ci>c\u003c/i> = 1.0 × 10⁻¹¹: CH₃COONa at 0.018, C₆H₅COONa at 0.063 and HCOONa at 0.18 mol/L. Methanoate needs the \u003cem>highest\u003c/em> concentration because methanoic acid is the \u003cem>strongest\u003c/em> of the three acids, so its conjugate base is the weakest.","hints":["pOH 5.50, so [OH⁻] = 10\u003csup>−5.5\u003c/sup> and \u003ci>x\u003c/i>² = 1.0 × 10⁻¹¹.","So \u003ci>K\u003c/i>\u003csub>b\u003c/sub> × \u003ci>c\u003c/i> must equal 1.0 × 10⁻¹¹. Find \u003ci>c\u003c/i> = 10⁻¹¹ ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub> for each basic anion.","Ethanoate: 10⁻¹¹ ÷ 5.6 × 10⁻¹⁰ = 0.018. Benzoate: 10⁻¹¹ ÷ 1.6 × 10⁻¹⁰ = 0.063. Methanoate: 10⁻¹¹ ÷ 5.6 × 10⁻¹¹ = 0.18."]}],"blocks":[{"title":"What the sorter shows","html":"\u003cp>Only the ion with a \u003cem>weak\u003c/em> parent matters, and its strength is set by how weak the parent is. Diluting tenfold moves the pH by only 0.50, because [OH⁻] (or [H₃O⁺]) is proportional to √\u003ci>c\u003c/i>.\u003c/p>"}]},"part3":{"slug":"salts","name":"Salts at work","heading":"Salts at work","intro":"From the sorter to real products and places: salts in food, cleaning, soil and water treatment. Link each effect back to one ion’s reaction with water.","s1":{"title":"Station 1: Baking soda","intro":"NaHCO₃ dissolves to give HCO₃⁻, which is \u003cstrong>amphiprotic\u003c/strong>: it could give H⁺ or take it. Zoom to the particles and compare the two arrows.","acid":"As an acid: HCO₃⁻ + H₂O ⇌ CO₃²⁻ + H₃O⁺, with \u003ci>K\u003c/i>\u003csub>a\u003c/sub>2 = 4.7 × 10⁻¹¹.","base":"As a base: HCO₃⁻ + H₂O ⇌ H₂CO₃ + OH⁻, with \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>1 = 1.0 × 10⁻¹⁴ ÷ 4.3 × 10⁻⁷ = 2.3 × 10⁻⁸.","verdict":"Since \u003ci>K\u003c/i>\u003csub>b\u003c/sub> &gt; \u003ci>K\u003c/i>\u003csub>a\u003c/sub>2, baking soda solution is mildly basic (pH ≈ 8.3, measured)."},"s2":{"title":"Station 2: Ammonium fertilizer in the soil","intro":"Years of ammonium sulfate fertilizer, (NH₄)₂SO₄, slowly acidify farm soil. Tap each ion to see whether it reacts with water.","nh4":"NH₄⁺ reacts: NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺. The H₃O⁺ acidifies the soil.","so4":"SO₄²⁻ doesn’t matter here: its parent, H₂SO₄, is strong in its first ionization.","lime":"A prairie farmer spreads agricultural lime (CaCO₃) to raise the pH again."},"s3":{"title":"Station 3: A preservative that works best in acid","intro":"Sodium benzoate is added to a soft drink. Its solution is basic, but the drink is acidic (pH ≈ 3). In the drink most benzoate is converted to benzoic acid, which is the form that slows the growth of moulds.","check":"At pH 3.00 the ratio [benzoate] ÷ [benzoic acid] = \u003ci>K\u003c/i>\u003csub>a\u003c/sub> ÷ [H₃O⁺] = 6.3 × 10⁻⁵ ÷ 1.0 × 10⁻³ = 0.063, so about 94% is in the acid form."},"s4":{"title":"Station 4: Clearing water with aluminium sulfate","intro":"Treatment plants add Al₂(SO₄)₃ to clump fine particles.","why":"Hydrated Al³⁺ ions are acidic: the small, highly charged ion pulls electron density from bound water, which releases H⁺. So the water’s pH drops and must be adjusted.","eq":"[Al(H₂O)₆]³⁺ + H₂O ⇌ [Al(H₂O)₅OH]²⁺ + H₃O⁺"},"data":{"title":"Check it with data","intro":"Model data: 0.10 mol/L solutions. Sort each solution first (its pH shows when it’s in the right box), then rank them.","rows":[["NaCl",7,"n"],["NH₄Cl",5.1,"a"],["CH₃COONa",8.9,"b"],["NaHCO₃",8.3,"b"],["Na₂CO₃",11.7,"b"],["Al₂(SO₄)₃",3.5,"a"]],"why":{"NaCl":"Both parents are strong: neutral.","NH₄Cl":"NH₄⁺ gives H⁺ to water.","CH₃COONa":"Ethanoate takes H⁺ from water.","NaHCO₃":"HCO₃⁻ is amphiprotic; its base reaction wins.","Na₂CO₃":"CO₃²⁻ takes H⁺ from water.","Al₂(SO₄)₃":"Hydrated Al³⁺ releases H⁺."},"prompt":"Why is Na₂CO₃ far more basic than NaHCO₃?","choices":[{"t":"CO₃²⁻ is the conjugate base of HCO₃⁻, a much weaker acid (\u003ci>K\u003c/i>\u003csub>a\u003c/sub>2 = 4.7 × 10⁻¹¹), so CO₃²⁻ is a much stronger base.","fb":"Right. It’s the reverse. The weaker the acid, the stronger its conjugate base: \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"14238","_k":"0466f926"},{"t":"Na₂CO₃ has two Na⁺ ions, and each Na⁺ makes OH⁻.","fb":"Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"15268","_k":"55224579"},{"t":"HCO₃⁻ is a weaker acid than H₂CO₃, so HCO₃⁻ is the stronger base.","fb":"Compare the parents of the two ions: CO₃²⁻ comes from HCO₃⁻, the weakest acid here. It’s the reverse. The weaker the acid, the stronger its conjugate base: \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"16258","_k":"89ab7795"}]},"quickCheck":{"title":"Quick check","summary":"Salts at work quick check","items":[{"id":"q1","goal":6,"prompt":"Which ion makes ammonium sulfate fertilizer acidify soil?","choices":[{"t":"SO₄²⁻","fb":"NH₄⁺ gives H⁺ to water; sulfate is a spectator here.","_n":"17208","_k":"07883f2d"},{"t":"NH₄⁺","fb":"Right. NH₄⁺ gives H⁺ to water; sulfate is a spectator here.","_n":"181f8","_k":"e653c1b2"},{"t":"H₂O","fb":"NH₄⁺ gives H⁺ to water; sulfate is a spectator here.","_n":"19228","_k":"4f78dc71"},{"t":"Ca²⁺","fb":"NH₄⁺ gives H⁺ to water; sulfate is a spectator here.","_n":"1a218","_k":"090553ba"}]},{"id":"q2","goal":6,"prompt":"Baking soda solution is mildly basic because…","choices":[{"t":"\u003ci>K\u003c/i>\u003csub>b\u003c/sub>(HCO₃⁻) &gt; \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(HCO₃⁻)","fb":"Right. HCO₃⁻ is amphiprotic; its base reaction wins.","_n":"1b1c8","_k":"0ff12929"},{"t":"CO₂ is a base","fb":"HCO₃⁻ is amphiprotic; its base reaction wins.","_n":"1c1b8","_k":"106f6472"},{"t":"HCO₃⁻ contains OH⁻","fb":"HCO₃⁻ is amphiprotic; its base reaction wins.","_n":"1d1e8","_k":"1296935a"},{"t":"Na⁺ makes OH⁻","fb":"HCO₃⁻ is amphiprotic; its base reaction wins. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"1e1f8","_k":"06926e9c"}]},{"id":"q3","goal":6,"prompt":"In an acidic drink, most sodium benzoate ends up as…","choices":[{"t":"benzoic acid","fb":"Right. Excess H₃O⁺ converts the conjugate base to the acid.","_n":"1f1c8","_k":"46941e1d"},{"t":"benzoate","fb":"Excess H₃O⁺ converts the conjugate base to the acid.","_n":"1g1d8","_k":"8591bae0"},{"t":"Na⁺","fb":"Excess H₃O⁺ converts the conjugate base to the acid.","_n":"1h228","_k":"e66e44dc"},{"t":"CO₂","fb":"Excess H₃O⁺ converts the conjugate base to the acid.","_n":"1i238","_k":"1ca24b20"}]},{"id":"q4","goal":6,"prompt":"Adding Al₂(SO₄)₃ to water makes the pH…","choices":[{"t":"reach 14","fb":"Hydrated Al³⁺ releases H⁺.","_n":"1j208","_k":"b2ef1004"},{"t":"fall","fb":"Right. Hydrated Al³⁺ releases H⁺.","_n":"1k218","_k":"a62cd233"},{"t":"stay at 7","fb":"Hydrated Al³⁺ releases H⁺.","_n":"1l168","_k":"fc5e7b31"},{"t":"rise","fb":"Hydrated Al³⁺ releases H⁺.","_n":"1m178","_k":"95787865"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Acidic, basic or neutral?","summary":"Acidic, basic or neutral?","goal":[1,5],"noun":"salt","txt":true,"instruction":"Ten 0.10 mol/L salt solutions. Put each one in the box for its solution. Items marked ★ are non-routine.","boxes":[{"id":"a","label":"Acidic"},{"id":"b","label":"Basic"},{"id":"n","label":"Neutral"}],"wrongDefault":"Check each ion’s parent: strong or weak?","items":[{"id":"i1","t":"KCl","_a":"RFhH","why":"K⁺ from KOH (strong), Cl⁻ from HCl (strong).","wrong":{"a":"Which ion would react? Both parents ionize completely. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","b":"Which ion would react? Both parents ionize completely. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺."},"hints":["Name each ion’s parent acid or base.","Only ions with a \u003cem>weak\u003c/em> parent react with water.","Neutral: K⁺ from KOH (strong), Cl⁻ from HCl (strong)."]},{"id":"i2","t":"NH₄Br","_a":"RFdH","why":"NH₄⁺ (weak-base parent) gives H⁺; Br⁻ is a spectator.","wrong":{},"hints":["Name each ion’s parent acid or base.","Only ions with a \u003cem>weak\u003c/em> parent react with water.","Acidic: NH₄⁺ (weak-base parent) gives H⁺; Br⁻ is a spectator."]},{"id":"i3","t":"Na₂CO₃","_a":"RFRH","why":"CO₃²⁻ is the conjugate base of the very weak acid HCO₃⁻.","wrong":{},"hints":["Name each ion’s parent acid or base.","Only ions with a \u003cem>weak\u003c/em> parent react with water.","Basic: CO₃²⁻ is the conjugate base of the very weak acid HCO₃⁻."]},{"id":"i4","t":"KF","_a":"RFRH","why":"F⁻ is the conjugate base of HF, a weak acid.","wrong":{"n":"F⁻ comes from a weak acid. Neutralization makes a salt, but the salt’s ions may still react with water. Check each ion’s parent."},"hints":["Name each ion’s parent acid or base.","Only ions with a \u003cem>weak\u003c/em> parent react with water.","Basic: F⁻ is the conjugate base of HF, a weak acid."]},{"id":"i5","t":"NaNO₃","_a":"RFhH","why":"Both parents are strong.","wrong":{"a":"Which ion would react? Both parents ionize completely. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","b":"Which ion would react? Both parents ionize completely. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺."},"hints":["Name each ion’s parent acid or base.","Only ions with a \u003cem>weak\u003c/em> parent react with water.","Neutral: Both parents are strong."]},{"id":"i6","t":"CH₃NH₃Br","_a":"RFdH","why":"CH₃NH₃⁺ is the conjugate acid of methylamine, a weak base.","wrong":{},"hints":["Name each ion’s parent acid or base.","Only ions with a \u003cem>weak\u003c/em> parent react with water.","Acidic: CH₃NH₃⁺ is the conjugate acid of methylamine, a weak base."]},{" student":"Zeynep","how":"","instruction":"Zeynep made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the pH of 0.18 mol/L sodium ethanoate.","steps":["Ethanoate is the conjugate base of a weak acid, so it reacts with water; Na⁺ is a spectator.","CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻","Use \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.8 × 10⁻⁵: \u003ci>x\u003c/i>²/0.18 = 1.8 × 10⁻⁵.","\u003ci>x\u003c/i> = 1.8 × 10⁻³","pH = 2.74"],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier.","An acidic answer for a basic salt is a warning sign."],"fixes":[{"t":"Step 3 is correct.","why":"Ethanoate is a base; it needs \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1n988","_k":"ef7c3451"},{"t":"Use \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 5.6 × 10⁻¹⁰: \u003ci>x\u003c/i>² = 1.0 × 10⁻¹⁰, \u003ci>x\u003c/i> = [OH⁻] = 1.0 × 10⁻⁵, pOH 5.00, pH 9.00.","why":"Ethanoate is a base. Its constant is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 5.6 × 10⁻¹⁰, not 1.8 × 10⁻⁵.","_n":"1o978","_k":"cf055510"},{"t":"Use \u003ci>K\u003c/i>\u003csub>a\u003c/sub> but subtract from 14 at the end.","why":"The constant is still wrong.","_n":"1p968","_k":"86a6ead5"},{"t":"Use \u003ci>K\u003c/i>\u003csub>w\u003c/sub> instead: \u003ci>x\u003c/i>² = 1.8 × 10⁻¹⁵.","why":"\u003ci>K\u003c/i>\u003csub>w\u003c/sub> alone isn’t the base’s constant.","_n":"1q958","_k":"00c63d1b"}],"hints":["Is ethanoate acting as an acid or a base here?","A base needs \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 5.6 × 10⁻¹⁰, giving pH 9.00."]},{"id":"e2","goal":4,"task":"Find the pH of 0.030 mol/L sodium hypochlorite.","steps":["OCl⁻ is basic; \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 1.0 × 10⁻¹⁴ ÷ 3.0 × 10⁻⁸ = 3.3 × 10⁻⁷.","\u003ci>x\u003c/i>² = 3.3 × 10⁻⁷ × 0.030 = 1.0 × 10⁻⁸","\u003ci>x\u003c/i> = 1.0 × 10⁻⁴; 5% check: 0.33%, passes.","pH = −log(1.0 × 10⁻⁴) = 4.00","So the solution is acidic."],"_a":"VQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows from step 4."],"fixes":[{"t":"\u003ci>x\u003c/i> is [OH⁻], so −log \u003ci>x\u003c/i> = pOH = 4.00; pH = 14.00 − 4.00 = 10.00.","why":"\u003ci>x\u003c/i> from a base is [OH⁻]. That gives pOH; then pH = 14.00 − pOH.","_n":"1r948","_k":"b07b4016"},{"t":"pH = log(1.0 × 10⁻⁴) = −4.00.","why":"pH is −log [H₃O⁺].","_n":"1s938","_k":"56d5327b"},{"t":"pH = 4.00 ÷ 2 = 2.00.","why":"No halving step.","_n":"1t928","_k":"2a22d6e5"},{"t":"Step 4 is correct.","why":"Step 3 found [OH⁻], not [H₃O⁺].","_n":"1u918","_k":"02db7083"}],"hints":["What does \u003ci>x\u003c/i> stand for in a base problem?","[OH⁻].","pOH 4.00, so pH 10.00."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which salt surprised you most in the sorter, and why?"},{"id":"j2","q":"In your own words, explain why the conjugate base of a \u003cem>weaker\u003c/em> acid is a \u003cem>stronger\u003c/em> base."},{"id":"j3","q":"Explain to a friend how to find the pH of a 0.18 mol/L sodium ethanoate solution, step by step."},{"id":"j4","q":"Which step still trips you up: choosing the ion, converting \u003ci>K\u003c/i>, or pOH vs pH? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which 0.10 mol/L solution is basic?","options":[{"t":"NH₄Cl","why":"NH₄⁺ makes the solution acidic.","_n":"1va08","_k":"48faf2e9"},{"t":"KCl","why":"Both parents are strong: neutral. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"1w9f8","_k":"f0de1b1a"},{"t":"KF","why":"F⁻ is the conjugate base of a weak acid.","_n":"1x928","_k":"76f742f6"},{"t":"NaNO₃","why":"Neutral. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"1y938","_k":"e5fcae05"}]},"b":{"prompt":"Which 0.10 mol/L solution is acidic?","options":[{"t":"CH₃COOK","why":"Basic: ethanoate is a base.","_n":"1z948","_k":"f69587b1"},{"t":"NaF","why":"Basic.","_n":"20958","_k":"4292b8c3"},{"t":"NaBr","why":"Neutral. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"218e8","_k":"1299ccdd"},{"t":"NH₄Br","why":"NH₄⁺ gives H⁺ to water.","_n":"228f8","_k":"4d427eb2"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which equation shows why sodium fluoride solution is basic?","options":[{"t":"F⁻(aq) + H₂O(l) ⇌ HF(aq) + OH⁻(aq)","why":"F⁻ takes H⁺ from water and leaves OH⁻.","_n":"23908","_k":"40efc072"},{"t":"Na⁺(aq) + H₂O(l) ⇌ NaOH(aq) + H⁺(aq)","why":"Na⁺ is a spectator. Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"24918","_k":"eea6fa6b"},{"t":"F⁻(aq) + H₂O(l) ⇌ HF(aq) + H₃O⁺(aq)","why":"F⁻ takes H⁺, leaving OH⁻; this equation isn’t balanced either.","_n":"259a8","_k":"a3b6f81e"},{"t":"HF(aq) + H₂O(l) ⇌ F⁻(aq) + H₃O⁺(aq)","why":"That’s HF ionizing; the salt contains F⁻, not HF.","_n":"269b8","_k":"c51bbd66"}]},"b":{"prompt":"Which equation shows why ammonium chloride solution is acidic?","options":[{"t":"NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)","why":"That’s ammonia acting as a base; the salt contains NH₄⁺.","_n":"271c6","_k":"b5cb2070"},{"t":"Cl⁻(aq) + H₂O(l) ⇌ HCl(aq) + OH⁻(aq)","why":"Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"281b6","_k":"e9c060ae"},{"t":"NH₄⁺(aq) + OH⁻(aq) → NH₃(aq) + H₂O(l)","why":"That’s a reaction with a base, not with water.","_n":"291e6","_k":"48a5c2d4"},{"t":"NH₄⁺(aq) + H₂O(l) ⇌ NH₃(aq) + H₃O⁺(aq)","why":"NH₄⁺ gives H⁺ to water, forming H₃O⁺.","_n":"2a1d6","_k":"8a3afe36"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of benzoic acid is 6.3 × 10⁻⁵. What is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> of benzoate? (Use 1 ÷ 6.3 ≈ 0.16.)","options":[{"t":"1.6 × 10⁻¹⁰","why":"1.0 × 10⁻¹⁴ ÷ 6.3 × 10⁻⁵.","_n":"2b206","_k":"6ef07cdc"},{"t":"6.3 × 10⁻¹⁹","why":"Divide, don’t multiply.","_n":"2c1f6","_k":"073c9465"},{"t":"6.3 × 10⁻⁵","why":"That’s the acid’s constant, not its conjugate base’s: \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"2d226","_k":"4f80b8fb"},{"t":"1.6 × 10⁻⁹","why":"Exponent slip: 0.16 × 10⁻⁹ = 1.6 × 10⁻¹⁰.","_n":"2e216","_k":"2572555d"}]},"b":{"prompt":"\u003ci>K\u003c/i>\u003csub>b\u003c/sub> of methylamine is 4.4 × 10⁻⁴. What is \u003ci>K\u003c/i>\u003csub>a\u003c/sub> of CH₃NH₃⁺? (Use 1 ÷ 4.4 ≈ 0.23.)","options":[{"t":"4.4 × 10⁻¹⁸","why":"Divide \u003ci>K\u003c/i>\u003csub>w\u003c/sub> by \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"2f146","_k":"5002da5a"},{"t":"4.4 × 10⁻⁴","why":"That’s the base’s constant, not its conjugate acid’s: \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"2g136","_k":"f4c56df0"},{"t":"2.3 × 10⁻¹⁰","why":"0.23 × 10⁻¹⁰ = 2.3 × 10⁻¹¹.","_n":"2h166","_k":"759edc82"},{"t":"2.3 × 10⁻¹¹","why":"1.0 × 10⁻¹⁴ ÷ 4.4 × 10⁻⁴.","_n":"2i176","_k":"dfb25ac9"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Find the pH of 0.18 mol/L sodium ethanoate (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of ethanoic acid = 1.8 × 10⁻⁵).","options":[{"t":"2.74","why":"That treats ethanoate as ethanoic acid. Ethanoate is a base. Its constant is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 5.6 × 10⁻¹⁰, not 1.8 × 10⁻⁵.","_n":"2j146","_k":"683245be"},{"t":"5.00","why":"That’s the pOH. \u003ci>x\u003c/i> from a base is [OH⁻]. That gives pOH; then pH = 14.00 − pOH.","_n":"2k156","_k":"a8515832"},{"t":"7.00","why":"Ethanoate reacts with water. Neutralization makes a salt, but the salt’s ions may still react with water. Check each ion’s parent.","_n":"2l126","_k":"18d1b02a"},{"t":"9.00","why":"\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 5.6 × 10⁻¹⁰; \u003ci>x\u003c/i>² = 1.0 × 10⁻¹⁰; [OH⁻] = 1.0 × 10⁻⁵; pOH 5.00.","_n":"2m136","_k":"0531a409"}]},"b":{"prompt":"Find the pH of 0.18 mol/L ammonium chloride (\u003ci>K\u003c/i>\u003csub>b\u003c/sub> of NH₃ = 1.8 × 10⁻⁵).","options":[{"t":"5.00","why":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 5.6 × 10⁻¹⁰; \u003ci>x\u003c/i>² = 1.0 × 10⁻¹⁰; [H₃O⁺] = 1.0 × 10⁻⁵.","_n":"2n106","_k":"27c77131"},{"t":"7.00","why":"NH₄⁺ reacts with water. Neutralization makes a salt, but the salt’s ions may still react with water. Check each ion’s parent.","_n":"2o116","_k":"32cdf65a"},{"t":"9.00","why":"\u003ci>x\u003c/i> is already [H₃O⁺] here.","_n":"2p1e6","_k":"fe33b925"},{"t":"11.26","why":"That’s the pH of 0.18 mol/L ammonia, not ammonium.","_n":"2q1f6","_k":"4b8bf62b"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Ammonium fluoride, NH₄F. \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(NH₃) = 1.8 × 10⁻⁵ and \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(HF) = 6.6 × 10⁻⁴. Is its solution acidic, basic or neutral?","options":[{"t":"Acidic, because \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 5.6 × 10⁻¹⁰ is larger than \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(F⁻) = 1.5 × 10⁻¹¹","why":"Both ions react; the larger constant wins.","_n":"2rcee","_k":"6f6699cf"},{"t":"Neutral, because both ions react with water","why":"Both ions react, so compare them. NH₄F is acidic because \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 5.6 × 10⁻¹⁰ is larger than \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(F⁻) = 1.5 × 10⁻¹¹.","_n":"2scfe","_k":"ffcb0f32"},{"t":"Basic, because F⁻ is a base","why":"NH₄⁺ also reacts, and more strongly.","_n":"2tcce","_k":"a83b6128"},{"t":"Acidic, because HF is a weak acid","why":"The right answer for the wrong reason: compare the \u003cem>ions’\u003c/em> constants.","_n":"2ucde","_k":"f96db23a"}]},"b":{"prompt":"Ammonium hypochlorite, NH₄OCl. \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(NH₃) = 1.8 × 10⁻⁵ and \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(HOCl) = 3.0 × 10⁻⁸. Is its solution acidic, basic or neutral?","options":[{"t":"Acidic, because NH₄⁺ is acidic","why":"OCl⁻ reacts more strongly.","_n":"2vd2e","_k":"a5eca822"},{"t":"Basic, because \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(OCl⁻) = 3.3 × 10⁻⁷ is larger than \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 5.6 × 10⁻¹⁰","why":"Both ions react; the larger constant wins.","_n":"2wd3e","_k":"c588b2b5"},{"t":"Basic, because HOCl is a strong acid","why":"HOCl is very weak; that’s why OCl⁻ is a strong base.","_n":"2xd0e","_k":"2def80a6"},{"t":"Neutral, because both ions react","why":"Both ions react, so compare them: the larger constant wins.","_n":"2yd1e","_k":"a482eeee"}]}},{"id":"t3","cat":"T","goal":[3,4],"a":{"prompt":"A 0.066 mol/L NaF solution has pH 8.00. What \u003ci>K\u003c/i>\u003csub>a\u003c/sub> for HF does this give?","options":[{"t":"1.5 × 10⁻¹¹","why":"That’s \u003ci>K\u003c/i>\u003csub>b\u003c/sub>; convert it.","_n":"2zc6e","_k":"d52ccb77"},{"t":"1.5 × 10⁻¹⁵","why":"You used [H₃O⁺] = 10⁻⁸ as \u003ci>x\u003c/i>.","_n":"30c7e","_k":"1150d273"},{"t":"1.0 × 10⁻¹²","why":"That’s \u003ci>x\u003c/i>². Divide by \u003ci>c\u003c/i>.","_n":"31d4e","_k":"933d4ab8"},{"t":"6.6 × 10⁻⁴","why":"[OH⁻] = 10⁻⁶; \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 10⁻¹² ÷ 0.066 = 1.5 × 10⁻¹¹; \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"32d3e","_k":"dcc4e357"}]},"b":{"prompt":"A 0.044 mol/L CH₃NH₃Cl solution has pH 6.00. What is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> of methylamine?","options":[{"t":"2.3 × 10⁻¹¹","why":"That’s \u003ci>K\u003c/i>\u003csub>a\u003c/sub> of CH₃NH₃⁺; convert it.","_n":"33d6e","_k":"ef52c3c8"},{"t":"1.0 × 10⁻¹²","why":"That’s \u003ci>x\u003c/i>². Divide by \u003ci>c\u003c/i>.","_n":"34d5e","_k":"850b3d0c"},{"t":"2.3 × 10⁻¹⁵","why":"You used [OH⁻] = 10⁻⁸.","_n":"35d0e","_k":"e8ebf7e8"},{"t":"4.4 × 10⁻⁴","why":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 10⁻¹² ÷ 0.044 = 2.3 × 10⁻¹¹; \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"36cfe","_k":"62c8ca83"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why sodium ethanoate solution is basic?","options":[{"t":"“Sodium is a metal, and metals make bases.”","why":"Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"37d2e","_k":"8de68638"},{"t":"“Ethanoate releases the OH⁻ groups it contains.”","why":"Ethanoate has no OH⁻ to release; it takes H⁺ from water.","_n":"38d1e","_k":"3531b6c4"},{"t":"“Salts of weak acids are basic because the acid has been neutralized.”","why":"That doesn’t say which ion reacts, or how.","_n":"39cce","_k":"0a47cff2"},{"t":"“Ethanoate, the conjugate base of a weak acid, takes H⁺ from water and leaves OH⁻. Na⁺ comes from a strong base and doesn’t react.”","why":"It names the reacting ion, what it does, and why Na⁺ doesn’t matter.","_n":"3acbe","_k":"4841c704"}]},"b":{"prompt":"Which is the best explanation of why ammonium chloride solution is acidic?","options":[{"t":"“Chlorine is acidic.”","why":"Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"3b42e","_k":"cdcdf5d9"},{"t":"“NH₄⁺ takes OH⁻ out of the water.”","why":"The H⁺ transfer is the key idea; the equation is NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺.","_n":"3c43e","_k":"61867671"},{"t":"“NH₄⁺, the conjugate acid of a weak base, gives H⁺ to water, forming H₃O⁺. Cl⁻ comes from a strong acid and doesn’t react.”","why":"It names the reacting ion, what it does, and why Cl⁻ doesn’t matter.","_n":"3d44e","_k":"c48fcc8e"},{"t":"“Ammonium salts contain HCl.”","why":"The solid contains ions, not HCl molecules.","_n":"3e45e","_k":"002858b1"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the correct hydrolysis equation for the methylammonium ion?","options":[{"t":"CH₃NH₃⁺(aq) + OH⁻(aq) → CH₃NH₂(aq) + H₂O(l)","why":"That’s a reaction with a strong base, not hydrolysis.","_n":"3f3ee","_k":"5d7d7363"},{"t":"CH₃NH₃⁺(aq) + H₂O(l) ⇌ CH₃NH₂(aq) + OH⁻(aq)","why":"The charges don’t balance, and the cation gives H⁺.","_n":"3g3fe","_k":"2cf7413d"},{"t":"CH₃NH₃⁺(aq) + H₂O(l) ⇌ CH₃NH₂(aq) + H₃O⁺(aq)","why":"The cation gives H⁺ to water.","_n":"3h40e","_k":"c62761a6"},{"t":"CH₃NH₂(aq) + H₂O(l) ⇌ CH₃NH₃⁺(aq) + OH⁻(aq)","why":"That’s the base, methylamine, not the ion.","_n":"3i41e","_k":"70d5da79"}]},"b":{"prompt":"Which is the correct hydrolysis equation for the hypochlorite ion?","options":[{"t":"OCl⁻(aq) + H₂O(l) ⇌ HOCl(aq) + H₃O⁺(aq)","why":"An anion like OCl⁻ \u003cem>accepts\u003c/em> H⁺ from water. That leaves OH⁻, not H₃O⁺.","_n":"3j4ae","_k":"2526b532"},{"t":"OCl⁻(aq) + H₂O(l) ⇌ HOCl(aq) + OH⁻(aq)","why":"The anion takes H⁺ from water and leaves OH⁻.","_n":"3k4be","_k":"2d7f6a77"},{"t":"HOCl(aq) + H₂O(l) ⇌ OCl⁻(aq) + H₃O⁺(aq)","why":"That’s the acid ionizing.","_n":"3l48e","_k":"849ecf7d"},{"t":"Na⁺(aq) + H₂O(l) ⇌ NaOH(aq) + H⁺(aq)","why":"Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"3m47e","_k":"480ba387"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"After years of ammonium sulfate fertilizer, a field’s soil became more acidic. What is the best explanation?","options":[{"t":"Plant roots release OH⁻ into the soil.","why":"That would raise the pH.","_n":"3n46e","_k":"61b74761"},{"t":"NH₄⁺ reacts with water to form H₃O⁺: NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺.","why":"The ammonium ion is the conjugate acid of a weak base.","_n":"3o45e","_k":"311c2904"},{"t":"Sulfate ions react with water to form sulfuric acid.","why":"Sulfate is a spectator here.","_n":"3p44e","_k":"8b69aa8d"},{"t":"The fertilizer contains sulfuric acid.","why":"The solid is a salt of ions.","_n":"3q43e","_k":"095cefef"}]},"b":{"prompt":"A pool’s pH rose after sodium hypochlorite was added. What is the best explanation?","options":[{"t":"Chlorine in the pool releases H₃O⁺.","why":"That would lower the pH.","_n":"3r42e","_k":"d4df3229"},{"t":"Na⁺ reacts with water to form NaOH.","why":"Ions from strong acids and strong bases don’t react with water. Their parents ionize completely, so they have no pull on H⁺.","_n":"3s41e","_k":"a5712aff"},{"t":"Hypochlorite is the conjugate base of a strong acid.","why":"HOCl is very weak.","_n":"3t50e","_k":"6a013d52"},{"t":"OCl⁻ reacts with water to form OH⁻: OCl⁻ + H₂O ⇌ HOCl + OH⁻.","why":"Hypochlorite is the conjugate base of a very weak acid.","_n":"3u4fe","_k":"3c48bd15"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A food lab has four 0.18 mol/L solutions: sodium ethanoate, sodium methanoate, sodium benzoate and sodium fluoride. Which has the highest pH?","options":[{"t":"Sodium benzoate","why":"Benzoic acid (6.3 × 10⁻⁵) is stronger than ethanoic acid, so benzoate is weaker as a base.","_n":"3vd6e","_k":"92505ba9"},{"t":"Sodium methanoate","why":"Methanoic acid (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.8 × 10⁻⁴) is stronger than ethanoic acid, so methanoate is the weaker base. It’s the reverse. The weaker the acid, the stronger its conjugate base: \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"3wd7e","_k":"32786261"},{"t":"Sodium ethanoate","why":"Ethanoic acid has the smallest \u003ci>K\u003c/i>\u003csub>a\u003c/sub> of the four (1.8 × 10⁻⁵), so ethanoate is the strongest base.","_n":"3xd4e","_k":"3135ad62"},{"t":"Sodium fluoride","why":"HF is the \u003cem>strongest\u003c/em> of these acids, so F⁻ is the weakest base.","_n":"3yd5e","_k":"f530db35"}]},"b":{"prompt":"A cleaning-products lab has four 0.10 mol/L solutions: NH₄Cl, CH₃NH₃Cl, NaCl and NaF. Which has the lowest pH?","options":[{"t":"CH₃NH₃Cl","why":"Methylamine is the \u003cem>stronger\u003c/em> base, so its conjugate acid is weaker.","_n":"3zd2e","_k":"60edadd1"},{"t":"NaF","why":"Basic.","_n":"40d3e","_k":"3b21487f"},{"t":"NH₄Cl","why":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = 5.6 × 10⁻¹⁰ is larger than \u003ci>K\u003c/i>\u003csub>a\u003c/sub>(CH₃NH₃⁺) = 2.3 × 10⁻¹¹.","_n":"41d0e","_k":"21b2b0ee"},{"t":"NaCl","why":"Neutral.","_n":"42d1e","_k":"f6ee22cf"}]}}]},"task":{"title":"Exactly pH 9","summary":"Exactly pH 9","statement":"\u003cp>Use one salt and one concentration from the shelf to make a solution with pH 9.00. There’s more than one answer. Can you find them all?\u003c/p>\u003col>\u003cli>The solution is basic.\u003c/li>\u003cli>Its pH is 9.00 (within 0.02).\u003c/li>\u003cli>Its concentration is at most 1.0 mol/L.\u003c/li>\u003cli>The 5% check passes.\u003c/li>\u003c/ol>","checks":["Basic","pH 9.00","At most 1.0 mol/L","5% check passes"],"tips":["pH 9 is basic: which anions react with water to make OH⁻?","pOH 5.00 means [OH⁻] = 1.0 × 10⁻⁵, so \u003ci>K\u003c/i>\u003csub>b\u003c/sub> × \u003ci>c\u003c/i> = 1.0 × 10⁻¹⁰. Find \u003ci>c\u003c/i> = 10⁻¹⁰ ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","Sodium methanoate would need 1.8 mol/L. Pick an anion with a larger \u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","A very small \u003ci>c\u003c/i> risks failing the 5% check; compute \u003ci>x\u003c/i> ÷ \u003ci>c\u003c/i>."],"explainPrompt":"Explain how you used \u003ci>K\u003c/i>\u003csub>b\u003c/sub> and the target pH to choose the concentration.","vocab":"Use the words conjugate base, \u003ci>K\u003c/i>\u003csub>b\u003c/sub>, hydrolysis and pOH.","more":"There are three answers. Can you find them all?","after3":"Every answer has
