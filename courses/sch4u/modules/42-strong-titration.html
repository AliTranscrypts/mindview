.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

*{transition:none!important;animation:none!important}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;

}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;

.chem sub,.chem sup{font-size:.72em;line-height:0}

.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}

.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

/* true indicator colours (course plan §4 exception; always named in words). Dark mode: lighter tints, --ink-2 outline. */
:root{--st-clear:#EEF3F8;--st-red:#D2312F;--st-orange:#EB8A1E;--st-yellow:#F1CF2A;--st-green:#3AA458;--st-blue:#2F62D0;--st-pink:#DD3F98;--st-palepink:#F4BCDC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--st-clear:#36424D;--st-red:#FF7F76;--st-orange:#FFB462;--st-yellow:#FFE479;--st-green:#86DC9E;--st-blue:#93B4FF;--st-pink:#FF8DCB;--st-palepink:#FFCAE6}}
:root[data-theme="dark"]{--st-clear:#36424D;--st-red:#FF7F76;--st-orange:#FFB462;--st-yellow:#FFE479;--st-green:#86DC9E;--st-blue:#93B4FF;--st-pink:#FF8DCB;--st-palepink:#FFCAE6}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.st-eq{display:block;line-height:1.3}
.st-eq2{display:block;font-size:.62em;margin-top:.35em;color:var(--ink-2)}
.st-hx-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;align-items:end}
.st-hx-lab,.st-hx-cv{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.st-hx-lab{max-height:300px}
.st-hx-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.st-hx-cap{font:400 1rem var(--font-ui);color:var(--ink);margin:6px 0;min-height:2.6em}

/* Titration lab */
.st-how{margin-top:0}
.st-modes{margin:0 0 10px}
.st-setup{display:grid;gap:8px;margin:0 0 12px}
.st-stage{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:14px;align-items:start}
.st-labbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:6px}
.st-lsvg{display:block;width:100%;height:auto;max-height:340px;font-family:var(--font-ui)}
.st-col{margin:4px 0 2px;text-align:center;font:400 .95rem var(--font-ui)}
.st-cvbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);cursor:crosshair}
.st-cvbox:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.st-cv{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.st-zoom{margin:8px 0 2px}
.st-h3{margin:0 0 6px}
.st-h4{margin:12px 0 6px;font-size:1rem}
.st-labnotes .st-h4{margin-top:10px}
.st-m-lab .st-labnotes .st-h4{margin-top:0}
.st-btns{display:grid;grid-template-columns:repeat(6,minmax(0,auto));gap:8px;margin:14px 0 8px;justify-content:start}
.st-addto{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.st-addto .numin{width:7.5em}
.st-msg{min-height:1.4em;margin:4px 0 8px;color:var(--ink)}
.st-readbox .tbl-wrap{max-height:340px;overflow:auto}
.st-readbox td:first-child{white-space:nowrap}
.st-readbox table.vt td{text-align:left}
.st-result{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:12px 0 4px;font-weight:700}
.st-entryrow{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.st-entryrow .numin{width:8em}

/* Part 3 */
.st-stn{margin:0 0 28px}
.st-s1{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.st-s1cv,.st-s1fl{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:6px}
.st-hit{cursor:pointer}
.st-hit:hover{fill:var(--hi-soft);fill-opacity:.5}
.st-pv{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.st-pvcap{margin:6px 2px 2px}
.st-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:6px 2px}
.st-sw{display:inline-block;width:22px;height:12px;border-radius:6px;vertical-align:middle}
.st-sw-h{background:var(--ab-h3o)}
.st-sw-oh{background:var(--ab-oh)}
.st-sw-sp{background:var(--sheet);border:1.5px solid var(--ink-2)}
.st-ln{display:inline-block;width:28px;height:0;border-top:3px solid var(--pen);vertical-align:middle}
.st-ln-b{border-top:3px dashed var(--f3)}
.st-regs,.st-zp{margin:10px 0 0}
.st-s2t select{font:inherit;padding:.25em .3em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-height:36px}
.st-s2t .st-cell{width:5.5em}
.st-s2t th[scope="row"]{white-space:nowrap}
.st-ok{color:var(--green);font-weight:700}
#st-s2cv,#st-s4cv,#st-s3cv{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);margin-top:10px}
.st-s3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;align-items:start}
.st-s3q{margin-top:10px}
.st-s3ask{margin:14px 0 6px}
.st-s4ind{margin:6px 0}

/* task */
.st-conds{margin:.4em 0 0 1.2em}
.st-tkrow{margin:0 0 10px}

@media (max-width:640px){
  .st-stage,.st-s1,.st-s3{grid-template-columns:minmax(0,1fr)}
  .st-labbox{max-width:300px;margin:0 auto;width:100%}
  .st-btns{grid-template-columns:repeat(3,minmax(0,1fr))}
  .st-btns .btn{padding-left:.4em;padding-right:.4em}
  .st-hx-row{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
}

ften easier: 20.0 mL × 0.100 mol/L = 2.00 mmol.","pH of strong acids and bases":"Strong acid: pH = −log \u003ci>c\u003c/i>. Strong base: pOH = −log [OH⁻], then pH = 14.00 − pOH.","Neutralization equations":"Balance first; the coefficients give the mole ratio. Spectator ions stay in solution."}}},"explore":{"heading":"Titration lab","intro":"Fill the burette, choose an indicator, and titrate. Watch the pH curve build, and find the equivalence point.","how":"Set up the flask and the burette, then add titrant with the burette buttons or type a total in \u003cstrong>Add to\u003c/strong>. \u003cstrong>Lab\u003c/strong> mode records trials, \u003cstrong>Curve\u003c/strong> mode plots the pH as you go, and \u003cstrong>Calculate\u003c/strong> mode fills the moles table. On the curve, use the arrow keys to move a probe in 0.10 mL steps.","modes":[{"id":"lab","t":"Lab"},{"id":"curve","t":"Curve"},{"id":"calc","t":"Calculate"}],"predictions":[{"id":"p1","prompt":"At the equivalence point, what will the pH be?","options":[{"t":"it depends on the volumes","_n":"o221","_k":"1220e87b"},{"t":"7.00","_n":"p251","_k":"2d51e4e4"},{"t":"above 7","_n":"q241","_k":"0e948d23"},{"t":"below 7","_n":"r171","_k":"6a35d38e"}],"explain":"Na⁺ and Cl⁻ are spectators (module 41), so the solution is neutral."},{"id":"p2","prompt":"After 10.0 mL, half the base needed, the pH will be about:","options":[{"t":"1.30","_n":"s161","_k":"59d4053a"},{"t":"1.48","_n":"t991","_k":"b932b485"},{"t":"4.00","_n":"u9a1","_k":"73170a4b"},{"t":"7.00","_n":"v971","_k":"db10da02"}],"explain":"1.00 mmol of H₃O⁺ remains in \u003cstrong>30.0 mL\u003c/strong>: 0.0333 mol/L, pH 1.48. 1.30 would ignore the added volume (M1); 4.00 assumes the pH climbs evenly (M4)."},{"id":"p3","prompt":"From 19.80 to 20.20 mL (about 8 drops), the pH changes by about:","options":[{"t":"1 unit","_n":"w981","_k":"4954fde4"},{"t":"0.4 units","_n":"x951","_k":"1afaa092"},{"t":"7 units","_n":"y961","_k":"01cb9d7b"},{"t":"3 units","_n":"z931","_k":"dd859cb2"}],"explain":"Excess acid of 0.020 mmol turns into excess base of 0.020 mmol. On a log scale, that’s a jump from 10\u003csup>−3.3\u003c/sup> to 10\u003csup>−10.7\u003c/sup> mol/L of H₃O⁺."},{"id":"p4","prompt":"The titrant is switched to 0.200 mol/L. Where is the equivalence point now?","options":[{"t":"10.0 mL","_n":"10941","_k":"e7678005"},{"t":"40.0 mL","_n":"11a11","_k":"1768c852"},{"t":"5.0 mL","_n":"12a21","_k":"31e13dca"},{"t":"20.0 mL","_n":"132b2","_k":"485951b7"}],"explain":"Twice the concentration means half the volume for the same 2.00 mmol. Equivalence is about moles, not volumes."}],"chalIntro":"Use the titration lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,4],"prompt":"The flask holds 20.0 mL of HCl of unknown concentration. With the pH m&#101;ter off, titrate with 0.100 mol/L NaOH and an indicator, stop within 0.10 mL of equivalence, and enter the acid’s concentration.","why":"Equivalence is at 16.00 mL: \u003ci>n\u003c/i>(OH⁻) = 0.100 × 16.00 = 1.60 mmol = \u003ci>n\u003c/i>(H₃O⁺), so \u003ci>c\u003c/i> = 1.60 mmol ÷ 20.0 mL = 0.0800 mol/L.","hints":["Add 1 mL at a time until the colour starts to flicker, then single drops.","\u003ci>n\u003c/i>(OH⁻) = 0.100 × 16.00 = 1.60 mmol = \u003ci>n\u003c/i>(H₃O⁺).","\u003ci>c\u003c/i> = 1.60 mmol ÷ 20.0 mL = 0.0800 mol/L."]},{"id":"tc2","goal":3,"prompt":"Set up a titration of 25.0 mL of 0.100 mol/L HCl so that equivalence comes at exactly 12.5 mL.","why":"The flask holds 2.50 mmol of H₃O⁺, so the titrant must be 2.50 mmol ÷ 12.5 mL = 0.200 mol/L NaOH.","hints":["How many mmol of H₃O⁺? 2.50.","\u003ci>c\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>V\u003c/i> = 2.50 ÷ 12.5.","0.200 mol/L."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"The flask now holds 20.0 mL of H₂SO₄ that needed 24.0 mL of 0.100 mol/L NaOH to reach equivalence. (a) Enter the sulfuric acid concentration. (b) Without the m&#101;ter, add exactly the total volume of NaOH that makes the pH 12.30.","why":"(a) \u003ci>n\u003c/i>(H₂SO₄) = ½ × 2.40 mmol = 1.20 mmol, so \u003ci>c\u003c/i> = 0.0600 mol/L. (b) 0.100\u003ci>V\u003c/i> − 2.40 = 0.020 × (20.0 + \u003ci>V\u003c/i>), so \u003ci>V\u003c/i> = 35.0 mL. The m&#101;ter now reads pH 12.30.","hints":["(a) \u003ci>n\u003c/i>(OH⁻) = 2.40 mmol, so \u003ci>n\u003c/i>(H₂SO₄) = 1.20 mmol and \u003ci>c\u003c/i> = 1.20 ÷ 20.0.","(b) Excess OH⁻ = 0.100\u003ci>V\u003c/i> − 2.40 mmol must equal 0.020 × (20.0 + \u003ci>V\u003c/i>).","0.100\u003ci>V\u003c/i> − 2.40 = 0.40 + 0.020\u003ci>V\u003c/i>, so 0.080\u003ci>V\u003c/i> = 2.80 and \u003ci>V\u003c/i> = 35.0 mL."]}]},"part3":{"slug":"curve","name":"Read the curve","heading":"Read the curve","intro":"Here you read and calculate from finished curves and data tables instead of running the burette, and connect each region of the curve to the particles in the flask.","s1":{"title":"Station 1: Four regions","intro":"The reference curve: 20.0 mL of 0.100 mol/L HCl titrated with 0.100 mol/L NaOH. Tap a region of the curve (or choose it below) to see the particles in the flask.","regions":[{"id":"start","t":"Start","v":0,"cap":"only acid"},{"id":"before","t":"Before","v":10,"cap":"acid in excess, decreasing"},{"id":"eq","t":"Equivalence","v":20,"cap":"only water and spectators"},{"id":"after","t":"After","v":30,"cap":"OH⁻ in excess, increasing"}]},"s2":{"title":"Station 2: The calculation table","intro":"Complete the moles table for the reference titration at 0, 10.0, 30.0 and 40.0 mL. Each correct row lights up its point on the curve.","rows":[{"v":"0.0","ion":"h","_a":"aAYYUVMeBG8="},{"v":"10.0","ion":"h","_a":"aAUYUFMeBBwHDGk="},{"v":"30.0","ion":"oh","_a":"aAUYVlMeBAAdB2k="},{"v":"40.0","ion":"oh","_a":"aAYYVVMeBAAdAQY+"}]},"s3":{"title":"Station 3: Check it with data","intro":"A student’s titration data (model data): 12.5 mL of 0.100 mol/L NaOH was titrated with 0.100 mol/L HCl. This curve falls, because base is in the flask. Judging data is part of the job: one row was recorded wrongly on purpose.","rows":[["0.0","13.00"],["10.0","12.05"],["12.0","11.31"],["12.4","10.60"],["12.6","3.40"],["13.0","2.71"],["15.0","1.85"]],"_a":"EQUBTVMQ","odd":"Excess H₃O⁺ is 0.25 mmol in 27.5 mL, which is 0.00909 mol/L, so the pH should be 2.04, not 1.85. Every other row matches the excess ÷ total-volume method."},"s4":{"title":"Station 4: Same moles, different curves","intro":"Overlay the curves for 0.100 and 0.0100 mol/L HCl, each titrated with base of the same concentration. Choose an indicator to see where each endpoint lands.","note":"The dilute curve starts higher (pH 2.00) and its jump is shorter (about pH 4.3 to 9.7), so an indicator choice matters more."},"quickCheck":{"title":"Quick check","summary":"Read the curve quick check","items":[{"id":"q1","goal":1,"prompt":"Which ion is in excess after equivalence?","choices":[{"t":"H₃O⁺","fb":"Extra base keeps arriving from the burette.","_n":"142a2","_k":"a4e07d67"},{"t":"Na⁺","fb":"Extra base keeps arriving from the burette.","_n":"15292","_k":"ccba686e"},{"t":"Cl⁻","fb":"Extra base keeps arriving from the burette.","_n":"16282","_k":"b7bdd380"},{"t":"OH⁻","fb":"Right. Extra base keeps arriving from the burette.","_n":"17272","_k":"d7cfc80d"}]},{"id":"q2","goal":2,"prompt":"In the ‘before’ region, pH is set by…","choices":[{"t":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","fb":"The flask now holds acid \u003cstrong>and\u003c/strong> the base you added. Divide by the total volume.","_n":"18262","_k":"fa69f590"},{"t":"the indicator","fb":"The flask now holds acid \u003cstrong>and\u003c/strong> the base you added. Divide by the total volume.","_n":"19252","_k":"a73b1f2e"},{"t":"moles of base added","fb":"The flask now holds acid \u003cstrong>and\u003c/strong> the base you added. Divide by the total volume.","_n":"1a242","_k":"e8886093"},{"t":"excess H₃O⁺ ÷ total volume","fb":"Right. Find the excess H₃O⁺, divide by the total volume, then take −log.","_n":"1b232","_k":"9ec233e0"}]},{"id":"q3","goal":2,"prompt":"Which row doesn’t fit in Station 3?","choices":[{"t":"15.0 mL","fb":"Right. 0.25 mmol ÷ 27.5 mL gives pH 2.04.","_n":"1c222","_k":"cadaa9a4"},{"t":"10.0 mL","fb":"0.25 mmol ÷ 27.5 mL gives pH 2.04.","_n":"1d251","_k":"444af8c6"},{"t":"12.0 mL","fb":"0.25 mmol ÷ 27.5 mL gives pH 2.04.","_n":"1e261","_k":"9a5141d4"},{"t":"0.0 mL","fb":"0.25 mmol ÷ 27.5 mL gives pH 2.04.","_n":"1f271","_k":"5478d1ce"}]},{"id":"q4","goal":1,"prompt":"Why does the 0.0100 mol/L curve have a shorter jump?","choices":[{"t":"Less water is formed","fb":"Diluting doesn’t make HCl weak.","_n":"1g281","_k":"7cac6fc8"},{"t":"The indicator is different","fb":"Diluting doesn’t make HCl weak.","_n":"1h211","_k":"85b5cee6"},{"t":"The acid is weaker","fb":"Diluting doesn’t make HCl weak.","_n":"1i221","_k":"6fb94fac"},{"t":"Smaller excesses on each side mean concentrations closer to 10⁻⁷","fb":"Right. Both sides of the jump sit closer to pH 7.","_n":"1j231","_k":"3273f321"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Point ↔ pH","summary":"Point ↔ pH","goal":[1,2],"instruction":"20.0 mL of 0.100 mol/L HCl is titrated with 0.100 mol/L NaOH. Match each volume of NaOH added to the pH. Two pH values have no partner.","leftTitle":"NaOH added","rightTitle":"pH","left":[{"id":"l1","t":"0.0 mL","why":"Only acid: [H₃O⁺] = 0.100 mol/L.","hints":["Which is in excess at this volume?","Divide the excess mmol by the total mL.","pH 1.00."]},{"id":"l2","t":"10.0 mL","why":"1.00 mmol H₃O⁺ left in 30.0 mL: 0.0333 mol/L.","hints":["Which is in excess at this volume?","Divide the excess mmol by the total mL.","pH 1.48."]},{"id":"l3","t":"15.0 mL","why":"0.50 mmol H₃O⁺ left in 35.0 mL: 1/70 mol/L.","hints":["Which is in excess at this volume?","Divide the excess mmol by the total mL.","pH 1.85."]},{"id":"l4","t":"20.0 mL","why":"Equivalence: only water and spectator ions.","hints":["Which is in excess at this volume?","Divide the excess mmol by the total mL.","pH 7.00."]},{"id":"l5","t":"30.0 mL","why":"1.00 mmol OH⁻ in 50.0 mL: pOH 1.70.","hints":["Which is in excess at this volume?","Divide the excess mmol by the total mL.","pH 12.30."]},{"id":"l6","t":"40.0 mL","why":"2.00 mmol OH⁻ in 60.0 mL: pOH 1.48.","hints":["Which is in excess at this volume?","Divide the excess mmol by the total mL.","pH 12.52."]}],"right":[{"id":"r1","t":"1.00"},{"id":"r2","t":"1.48"},{"id":"r3","t":"1.85"},{"id":"r4","t":"7.00"},{"id":"r5","t":"12.30"},{"id":"r6","t":"12.52"},{"id":"r7","t":"4.00"},{"id":"r8","t":"1.70"}],"_a":"SBZYUkEIF0ACFhhBDwAXCBFGBkFPEFkBEQ4WEVAQGRBfABZZQUABEB8WWFZBCBdABhYYQQ8EFwgRRgJBHg==","wrong":{"l2|r4":"Halfway is still very acidic.","l2|r7":"Halfway is still very acidic.","l5|r8":"Past equivalence, OH⁻ is in excess; 1.70 is the pOH."},"wrongDefault":"Find the excess and the total volume."},{"id":"calc","type":"numeric","title":"Titration calculations","summary":"Titration calculations","star":true,"goal":[2,3,5],"instruction":"Six calculations. Items 4 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type a number (leave off the unit), then press Check.","items":[{"id":"c1","goal":3,"prompt":"25.0 mL of HCl needs 20.0 mL of 0.100 mol/L NaOH. \u003ci>c\u003c/i>(HCl)?","_a":"AxoEWw==","tol":0.0005,"unit":"mol/L","display":"0.0800 mol/L","why":"\u003ci>n\u003c/i>(OH⁻) = 2.00 mmol = \u003ci>n\u003c/i>(HCl); 2.00 ÷ 25.0 = 0.0800 mol/L.","wrong":[{"match":0.125,"fb":"\u003ci>c\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>V\u003c/i> of the acid."}],"hints":["\u003ci>n\u003c/i> of titrant first.","Use the mole ratio.","Divide by the sample volume."]},{"id":"c2","goal":3,"prompt":"10.0 mL of NaOH needs 12.5 mL of 0.0800 mol/L HCl. \u003ci>c\u003c/i>(NaOH)?","_a":"AxoF","tol":0.0005,"unit":"mol/L","display":"0.100 mol/L","why":"\u003ci>n\u003c/i>(HCl) = 1.00 mmol = \u003ci>n\u003c/i>(NaOH); 1.00 ÷ 10.0 = 0.100 mol/L.","wrong":[{"match":0.064,"fb":"Volumes swapped."}],"hints":["\u003ci>n\u003c/i> of titrant first.","Use the mole ratio.","Divide by the sample volume."]},{"id":"c3","goal":3,"prompt":"20.0 mL of H₂SO₄ needs 30.0 mL of 0.100 mol/L NaOH. \u003ci>c\u003c/i>(H₂SO₄)?","_a":"AxoEVFY=","tol":0.0005,"unit":"mol/L","display":"0.0750 mol/L","why":"\u003ci>n\u003c/i>(OH⁻) = 3.00 mmol, so \u003ci>n\u003c/i>(H₂SO₄) = 1.50 mmol; 1.50 ÷ 20.0 = 0.0750 mol/L.","wrong":[{"match":0.15,"fb":"Each H₂SO₄ gives 2 H⁺, so it needs 2 OH⁻. Use the balanced equation."}],"hints":["\u003ci>n\u003c/i> of titrant first.","Use the mole ratio.","Divide by the sample volume."]},{"id":"c4","star":true,"goal":2,"prompt":"pH after 35.0 mL of 0.100 mol/L NaOH is added to 25.0 mL of 0.100 mol/L HCl? (Use log 6 = 0.78.)","_a":"AgYaUVE=","tol":0.0004,"display":"pH 12.22","why":"Excess OH⁻ 1.00 mmol in 60.0 mL: pOH = log 60 = 1.78, so pH = 14.00 − 1.78 = 12.22.","wrong":[{"match":1.78,"fb":"That’s the pOH."},{"match":12.4,"fb":"Divide 1.00 mmol by 60.0 mL, not 25.0 mL."}],"hints":["Excess OH⁻ = 3.50 − 2.50 = 1.00 mmol.","Total volume 60.0 mL: [OH⁻] = 1/60 mol/L.","pOH = log 60 = 1.78; pH = 12.22."]},{"id":"c5","star":true,"goal":[3,6],"prompt":"An antacid solution: 10.0 mL of NaOH needs 15.0 mL of 0.0400 mol/L HCl. How many mmol of NaOH are in 250.0 mL of the solution?","_a":"AgE=","tol":0.001,"unit":"mmol","display":"15.0 mmol","why":"0.600 mmol in each 10.0 mL sample; 250.0 mL is 25 times as much.","wrong":[{"match":0.6,"fb":"That’s the 10.0 mL sample; scale up by 25."}],"hints":["\u003ci>n\u003c/i>(HCl) = 0.600 mmol = \u003ci>n\u003c/i>(NaOH) in 10.0 mL.","250.0 mL is 25 times as much.","15.0 mmol."]},{"id":"c6","star":true,"goal":5,"prompt":"\u003cstrong>Investigation:\u003c/strong> Three trials: 16.05, 15.95 and 16.40 mL. Discard any trial that differs from the others by more than 0.10 mL, then give the mean.","_a":"AgI=","tol":0.0003,"unit":"mL","display":"16.00 mL","why":"16.40 mL is an outlier; the mean of 16.05 and 15.95 is 16.00 mL.","wrong":[{"match":16.13,"fb":"16.40 is an outlier; it shouldn’t be averaged in."},{"match":16.133,"fb":"16.40 is an outlier; it shouldn’t be averaged in."}],"hints":["Which trial disagrees?","16.40 is 0.40 mL away from the others.","Mean of 16.05 and 15.95 = 16.00 mL."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ilse","how":"","goal":[2,3],"instruction":"Ilse made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"20.0 mL of H₂SO₄ needs 24.0 mL of 0.100 mol/L NaOH. Find \u003ci>c\u003c/i>(H₂SO₄).","steps":["H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O","\u003ci>n\u003c/i>(NaOH) = 0.100 × 0.0240 = 2.40 × 10⁻³ mol","\u003ci>n\u003c/i>(H₂SO₄) = 2.40 × 10⁻³ mol","\u003ci>c\u003c/i> = 2.40 × 10⁻³ ÷ 0.0200 = 0.120 mol/L"],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Step 3 is correct.","why":"The equation in step 1 says 1 : 2.","_n":"1k241","_k":"ad4b7108"},{"t":"\u003ci>n\u003c/i>(H₂SO₄) = 2 × 2.40 × 10⁻³.","why":"That inverts the ratio.","_n":"1l1d1","_k":"33033336"},{"t":"Use 24.0 mL as the acid volume.","why":"The acid volume is 20.0 mL.","_n":"1m1e1","_k":"65ba779a"},{"t":"\u003ci>n\u003c/i>(H₂SO₄) = ½ × 2.40 × 10⁻³ = 1.20 × 10⁻³ mol, so \u003ci>c\u003c/i> = 0.0600 mol/L.","why":"Each H₂SO₄ gives 2 H⁺, so it needs 2 OH⁻. Use the balanced equation.","_n":"1n972","_k":"47e2df2d"}],"hints":["Read the coefficients again.","1 H₂SO₄ for 2 NaOH.","Halve the moles of NaOH."]},{"id":"e2","goal":2,"task":"Find the pH after 10.0 mL of 0.100 mol/L NaOH is added to 20.0 mL of 0.100 mol/L HCl.","steps":["\u003ci>n\u003c/i>(H₃O⁺) = 2.00 mmol","\u003ci>n\u003c/i>(OH⁻) = 1.00 mmol","Excess H₃O⁺ = 1.00 mmol","[H₃O⁺] = 1.00 mmol ÷ 20.0 mL = 0.0500 mol/L","pH = 1.30"],"_a":"AA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"Step 4 is correct.","why":"The flask now holds 30.0 mL.","_n":"1o962","_k":"d743e26e"},{"t":"pH = 7.00 because base was added.","why":"Acid is still in excess.","_n":"1p992","_k":"5d357466"},{"t":"Divide by 10.0 mL.","why":"That’s only the base’s volume.","_n":"1q982","_k":"46896fa2"},{"t":"Divide by the total volume, 30.0 mL: [H₃O⁺] = 0.0333 mol/L, so pH = 1.48.","why":"The flask now holds acid \u003cstrong>and\u003c/strong> the base you added. Divide by the total volume.","_n":"1r932","_k":"c765e665"}],"hints":["What’s in the flask now?","20.0 + 10.0 mL.","1.00 ÷ 30.0 = 0.0333; pH 1.48."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most about the shape of the titration curve?"},{"id":"j2","q":"In your own words, explain the difference between the equivalence point and the endpoint."},{"id":"j3","q":"Explain to a friend how to find the pH 10.0 mL before and 10.0 mL after equivalence."},{"id":"j4","q":"Which technique mistake would you be most likely to make in a real lab, and how will you avoid it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"At the equivalence point of a titration…","options":[{"t":"the pH is always 7.00","why":"True for strong–strong titrations only (see module 43).","_n":"1s922","_k":"b1c4992e"},{"t":"the volumes of acid and base are equal","why":"Equivalence means equal \u003cstrong>moles\u003c/strong> of H₃O⁺ and OH⁻. Volumes are equal only if the concentrations are.","_n":"1t952","_k":"4deb6536"},{"t":"the moles of OH⁻ added equal the moles of H₃O⁺ originally present","why":"Equivalence is about moles, in the ratio set by the balanced equation.","_n":"1u942","_k":"ade1bc2d"},{"t":"the indicator has just changed colour","why":"That’s the endpoint.","_n":"1v9f2","_k":"ebeea3ff"}]},"b":{"prompt":"The endpoint of a titration is…","options":[{"t":"the point where moles of acid and base are equal","why":"That’s the equivalence point.","_n":"1w9e2","_k":"5eec8461"},{"t":"the point where the pH is 7.00","why":"Only a well-chosen indicator puts the endpoint near pH 7 here.","_n":"1x912","_k":"d6cace26"},{"t":"the point where the indicator changes colour","why":"A good indicator puts the endpoint at the equivalence point.","_n":"1y922","_k":"2a6a6c0b"},{"t":"the point where equal volumes have been mixed","why":"Equivalence means equal \u003cstrong>moles\u003c/strong> of H₃O⁺ and OH⁻. Volumes are equal only if the concentrations are.","_n":"1z8f2","_k":"900cd37c"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"HCl is titrated with NaOH (equivalence pH 7.00). Which indicator’s range contains the equivalence pH?","options":[{"t":"Methyl orange (3.1–4.4)","why":"It changes well before equivalence.","_n":"20902","_k":"f26a29de"},{"t":"Methyl red (4.4–6.2)","why":"Its range stops below 7.","_n":"21952","_k":"6fd0ff7e"},{"t":"None is needed; the solution changes colour by itself","why":"HCl, NaOH and NaCl solutions are all colourless.","_n":"22962","_k":"d55dad7e"},{"t":"Bromothymol blue (6.0–7.6)","why":"6.0–7.6 contains 7.00.","_n":"23932","_k":"95fad439"}]},"b":{"prompt":"KOH is titrated with HNO₃ (equivalence pH 7.00). Which indicator’s range contains the equivalence pH?","options":[{"t":"Methyl red (4.4–6.2)","why":"The endpoint is when the indicator changes. Choose one whose range contains the equivalence pH.","_n":"24942","_k":"e989f76e"},{"t":"Bromothymol blue (6.0–7.6)","why":"6.0–7.6 contains 7.00.","_n":"25992","_k":"93d5e151"},{"t":"Phenolphthalein (8.2–10.0)","why":"Its range starts above 7.","_n":"269a2","_k":"46ce9641"},{"t":"Methyl orange (3.1–4.4)","why":"The endpoint is when the indicator changes. Choose one whose range contains the equivalence pH.","_n":"27a32","_k":"5872e252"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"What is the pH at the equivalence point when KOH is titrated with HNO₃?","options":[{"t":"Below 7, because acid was added last","why":"No excess acid either.","_n":"28a22","_k":"fe865d24"},{"t":"It can’t be known without the volumes","why":"Equivalence pH depends on the salt, not the volumes.","_n":"29a12","_k":"af37e0c2"},{"t":"Above 7, because base was in the flask","why":"At equivalence, no excess base remains.","_n":"2aa02","_k":"f8ae1417"},{"t":"7.00","why":"K⁺ and NO₃⁻ are spectators.","_n":"2ba72","_k":"3450a330"}]},"b":{"prompt":"At the equivalence point of NaOH + HCl, the flask contains mainly…","options":[{"t":"NaOH and HCl molecules","why":"Both are fully ionized.","_n":"2ca62","_k":"c8045c6f"},{"t":"Solid NaCl crystals","why":"NaCl is soluble; its ions stay dissolved.","_n":"2da52","_k":"d3a8e033"},{"t":"Na⁺, Cl⁻ and water","why":"H₃O⁺ and OH⁻ have become water; the spectators remain.","_n":"2ea42","_k":"92e55b0c"},{"t":"Large amounts of H₃O⁺ and OH⁻","why":"They’ve reacted to make water.","_n":"2f9b2","_k":"fd75bd96"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"25.0 mL of H₂SO₄ needs 20.0 mL of 0.150 mol/L NaOH. What is \u003ci>c\u003c/i>(H₂SO₄)?","options":[{"t":"0.120 mol/L","why":"1 : 1 was assumed. Each H₂SO₄ gives 2 H⁺, so it needs 2 OH⁻. Use the balanced equation.","_n":"2g9a2","_k":"5b87c100"},{"t":"0.0300 mol/L","why":"Halved twice.","_n":"2h9d2","_k":"e40ef8ba"},{"t":"0.0600 mol/L","why":"\u003ci>n\u003c/i>(OH⁻) = 3.00 mmol; \u003ci>n\u003c/i>(H₂SO₄) = 1.50 mmol; ÷ 25.0 mL.","_n":"2i9e2","_k":"d20d79e9"},{"t":"0.188 mol/L","why":"Volumes swapped: 0.150 × 25.0 ÷ 20.0.","_n":"2j9f2","_k":"369a2656"}]},"b":{"prompt":"20.0 mL of H₂SO₄ needs 25.0 mL of 0.0800 mol/L NaOH. What is \u003ci>c\u003c/i>(H₂SO₄)?","options":[{"t":"0.0640 mol/L","why":"Volumes swapped.","_n":"2ka02","_k":"a36ea541"},{"t":"0.0250 mol/L","why":"Halved twice.","_n":"2la12","_k":"b11a409f"},{"t":"0.0500 mol/L","why":"\u003ci>n\u003c/i>(OH⁻) = 2.00 mmol; \u003ci>n\u003c/i>(H₂SO₄) = 1.00 mmol; ÷ 20.0 mL.","_n":"2ma22","_k":"b69aed9e"},{"t":"0.100 mol/L","why":"Each H₂SO₄ gives 2 H⁺, so it needs 2 OH⁻. Use the balanced equation.","_n":"2na32","_k":"5a22db93"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"15.0 mL of 0.100 mol/L NaOH is added to 20.0 mL of 0.100 mol/L HCl. What is the pH?","use":"log 2 = 0.30, log 3 = 0.48, log 5 = 0.70, log 7 = 0.85","options":[{"t":"1.60","why":"That divides by 20.0 mL. The flask now holds acid \u003cstrong>and\u003c/strong> the base you added. Divide by the total volume.","_n":"2oa42","_k":"b5a7b0a1"},{"t":"1.85","why":"Excess H₃O⁺ 0.50 mmol in 35.0 mL = 1/70 mol/L; pH = log 70 = 1.85.","_n":"2p952","_k":"6eb7441c"},{"t":"7.00","why":"Acid is still in excess.","_n":"2q962","_k":"15e69119"},{"t":"12.15","why":"Acid is in excess, not base.","_n":"2r27f","_k":"c91e59b6"}]},"b":{"prompt":"30.0 mL of 0.100 mol/L NaOH is added to 20.0 mL of 0.100 mol/L HCl. What is the pH?","use":"log 2 = 0.30, log 3 = 0.48, log 5 = 0.70, log 7 = 0.85","options":[{"t":"1.70","why":"That’s the pOH.","_n":"2s28f","_k":"dd7f11e4"},{"t":"7.00","why":"Past equivalence.","_n":"2t29f","_k":"7c40d15e"},{"t":"12.30","why":"Excess OH⁻ 1.00 mmol in 50.0 mL = 0.020 mol/L; pOH 1.70.","_n":"2u2af","_k":"011ea98c"},{"t":"12.52","why":"That divides by 30.0 mL. The flask now holds acid \u003cstrong>and\u003c/strong> the base you added. Divide by the total volume.","_n":"2v2bf","_k":"fecc2153"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A 25.0 mL sample of HNO₃ reaches pH 12.00 after 37.5 mL of 0.100 mol/L KOH. What was \u003ci>c\u003c/i>(HNO₃)?","use":"log 2 = 0.30, log 3 = 0.48, log 5 = 0.70, log 7 = 0.85","options":[{"t":"0.0250 mol/L","why":"That’s only the excess ÷ 25.0.","_n":"2w2cf","_k":"2f9a56c7"},{"t":"0.175 mol/L","why":"The excess was added instead of subtracted.","_n":"2x2df","_k":"f1f0a07b"},{"t":"0.125 mol/L","why":"[OH⁻] = 0.0100 in 62.5 mL, so the excess is 0.625 mmol. Acid = 3.75 − 0.625 = 3.125 mmol, ÷ 25.0 mL.","_n":"2y2ef","_k":"d5d35bec"},{"t":"0.150 mol/L","why":"That treats 37.5 mL as the equivalence point.","_n":"2z2ff","_k":"bd09fc7b"}]},"b":{"prompt":"A 20.0 mL sample of HCl reaches pH 12.30 after 35.0 mL of 0.100 mol/L KOH. What was \u003ci>c\u003c/i>(HCl)?","use":"log 2 = 0.30, log 3 = 0.48, log 5 = 0.70, log 7 = 0.85","options":[{"t":"0.0550 mol/L","why":"Only the excess.","_n":"3030f","_k":"7293340f"},{"t":"0.175 mol/L","why":"That treats 35.0 mL as equivalence.","_n":"312df","_k":"c279da71"},{"t":"0.230 mol/L","why":"The excess was added.","_n":"322cf","_k":"e96a2281"},{"t":"0.120 mol/L","why":"[OH⁻] = 0.020 in 55.0 mL = 1.10 mmol excess; acid = 3.50 − 1.10 = 2.40 mmol.","_n":"332bf","_k":"568ae912"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of the steep jump near the equivalence point?","options":[{"t":"“The reaction speeds up near the end.”","why":"Neutralization is fast throughout; this is about amounts.","_n":"342af","_k":"825c98c5"},{"t":"“The indicator makes the pH jump.”","why":"Indicators show pH; they don’t change it.","_n":"3531f","_k":"c0525383"},{"t":"“Near equivalence almost no excess acid or base is left, so a few drops change [H₃O⁺] by factors of 10 or more, and pH is a log scale.”","why":"It names the tiny excess and the log scale.","_n":"3630f","_k":"b103eaea"},{"t":"“Equal volumes have been mixed.”","why":"Equivalence means equal \u003cstrong>moles\u003c/strong> of H₃O⁺ and OH⁻. Volumes are equal only if the concentrations are.","_n":"372ff","_k":"7fffc285"}]},"b":{"prompt":"Which is the best explanation of why the equivalence pH here is 7.00?","options":[{"t":"“The indicator turned green.”","why":"The endpoint is when the indicator changes. Choose one whose range contains the equivalence pH.","_n":"382ef","_k":"1e62b405"},{"t":"“Equal volumes of acid and base were mixed.”","why":"Equivalence means equal \u003cstrong>moles\u003c/strong> of H₃O⁺ and OH⁻. Volumes are equal only if the concentrations are.","_n":"3935f","_k":"dc5c5ceb"},{"t":"“The products are water and a salt whose ions, from a strong acid and a strong base, don’t react with water.”","why":"It names the spectator ions.","_n":"3a34f","_k":"88226a79"},{"t":"“All the H₃O⁺ and OH⁻ ions are gone.”","why":"Water still has 1.0 × 10⁻⁷ mol/L of each.","_n":"3bb3f","_k":"abe1a6f1"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"During a titration of HCl with NaOH, an air bubble in the burette tip disappears. How does this affect the calculated \u003ci>c\u003c/i>(HCl)?","options":[{"t":"Too low: less NaOH was delivered.","why":"The recorded volume is larger than what was delivered, so the moles calculated are too large.","_n":"3cb4f","_k":"72091113"},{"t":"It makes the endpoint impossible to see.","why":"The indicator still works.","_n":"3db1f","_k":"a5a6abb5"},{"t":"No effect: the bubble is only air.","why":"The volume reading changes.","_n":"3eb2f","_k":"82577a53"},{"t":"Too high: the recorded volume includes the bubble, so more NaOH seems to have been used.","why":"The recorded volume is larger than what was delivered.","_n":"3faff","_k":"0fc1a49e"}]},"b":{"prompt":"A student overshoots the endpoint by several drops. How does this affect the calculated \u003ci>c\u003c/i>(HCl)?","options":[{"t":"It doubles.","why":"A few drops change it slightly, not by a factor of 2.","_n":"3gb0f","_k":"dcfa5973"},{"t":"No effect, because the indicator changed.","why":"The endpoint is when the indicator changes. Choose one whose range contains the equivalence pH.","_n":"3hadf","_k":"f4138b49"},{"t":"Too low.","why":"Overshooting means more titrant was recorded than needed, so the calculated concentration of the unknown comes out too high.","_n":"3iaef","_k":"5ceb5295"},{"t":"Too high: the volume recorded is larger than needed.","why":"Overshooting means more titrant was recorded than needed, so the calculated concentration of the unknown comes out too high.","_n":"3jbbf","_k":"47c37fdf"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Before release, factory wastewater must be neutralized. A 50.0 mL sample needs 12.5 mL of 0.200 mol/L NaOH. What is the HCl concentration?","options":[{"t":"0.0250 mol/L","why":"That used 0.100 mol/L.","_n":"3kbcf","_k":"149f5c00"},{"t":"0.0500 mol/L","why":"2.50 mmol ÷ 50.0 mL.","_n":"3lb9f","_k":"ed2ad3a2"},{"t":"0.200 mol/L","why":"The sample isn’t the same concentration as the titrant.","_n":"3mb8f","_k":"2f581e41"},{"t":"0.800 mol/L","why":"0.200 × 50.0 ÷ 12.5 inverts the volumes.","_n":"3nbbf","_k":"b26c2798"}]},"b":{"prompt":"A diluted drain-cleaner sample (NaOH): 10.0 mL needs 25.0 mL of 0.100 mol/L HCl. What is \u003ci>c\u003c/i>(NaOH)?","options":[{"t":"2.50 mol/L","why":"mmol ÷ mL gives mol/L directly: 2.50 ÷ 10.0 = 0.250.","_n":"3obaf","_k":"9a67e3fe"},{"t":"0.250 mol/L","why":"2.50 mmol ÷ 10.0 mL.","_n":"3pbdf","_k":"dace9193"},{"t":"0.0400 mol/L","why":"Volumes inverted.","_n":"3qbcf","_k":"d805b33a"},{"t":"0.100 mol/L","why":"Not the titrant’s concentration.","_n":"3rbff","_k":"31028f78"}]}},{"id":"a2","cat":"A","goal":[3,6],"a":{"prompt":"A lab must titrate 25.0 mL of about 0.080 mol/L HCl and wants the endpoint between 15 and 25 mL. Which NaOH concentration should it use?","options":[{"t":"0.050 mol/L","why":"About 40 mL: too much.","_n":"3sbef","_k":"93065f26"},{"t":"0.040 mol/L","why":"About 50 mL: a whole burette.","_n":"3tb1f","_k":"253552c5"},{"t":"0.200 mol/L","why":"About 10 mL: too little for good precision.","_n":"3ub0f","_k":"0daa5ed1"},{"t":"0.100 mol/L (about 20.0 mL)","why":"2.0 mmol ÷ 0.100 = 20 mL.","_n":"3vbff","_k":"fe8571af"}]},"b":{"prompt":"A lab must titrate 25.0 mL of about 0.160 mol/L HCl, with the endpoint between 15 and 25 mL. Which NaOH concentration?","options":[{"t":"0.100 mol/L","why":"About 40 mL.","_n":"3wc0f","_k":"7533f1f0"},{"t":"0.400 mol/L","why":"About 10 mL.","_n":"3xc1f","_k":"a432ab5a"},{"t":"0.050 mol/L","why":"About 80 mL.","_n":"3yc2f","_k":"85825b30"},{"t":"0.200 mol/L (about 20.0 mL)","why":"4.0 mmol ÷ 0.200.","_n":"3zbbf","_k":"18e22e0f"}]}}]},"task":{"title":"Plan the titration","summary":"Plan the titration","statement":"\u003cp>A quality-control lab has HCl of about 0.0800 mol/L. Plan a titration that meets every condition. There’s more than one good plan.\u003c/p>\u003col class=\"st-conds\">\u003cli>The endpoint volume is between 15.0 and 35.0 mL.\u003c/li>\u003cli>The indicator’s range contains the equivalence pH.\u003c/li>\u003cli>The sample is at least 20.0 mL (a larger sample reduces the pipette’s relative error).\u003c/li>\u003c/ol>","checks":["Endpoint 15.0–35.0 mL","Indicator fits","Sample ≥ 20.0 mL"],"tips":["Endpoint volume = (0.0800 × sample volume) ÷ NaOH concentration.","A strong acid–strong base equivalence point is at pH 7.00. Which range includes 7?","A 10.0 mL sample has a larger relative uncertainty."],"explainPrompt":"Explain how you chose the NaOH concentration and the indicator.","vocab":"Use the words equivalence point, endpoint, indicator range and mole ratio.","after3":"All three keep the endpoint mid-burette and use the one indicator whose range brackets pH 7."},"cards":[["Titrant","The solution of known concentration in the burette."],["Equivalence point","Moles of OH⁻ added = moles of H₃O⁺ present (by the balanced equation)."],["Endpoint","Where the indicator changes colour. A good indicator puts it at equivalence."],["Strong–strong equivalence pH","7.00 at 25 °C: the salt’s ions are spectators."],["pH before equivalence","Excess H₃O⁺ ÷ \u003cstrong>total\u003c/strong> volume, then −log."],["pH after equivalence","Excess OH⁻ ÷ total volume → pOH → pH = 14.00 − pOH."],["The jump","About 7 pH units within a few drops of equivalence (for 0.100 mol/L solutions)."],["Choosing an indicator","Its colour-change range should contain the equivalence pH: bromothymol blue (6.0–7.6) here."],["H₂SO₄ + 2NaOH","1 : 2 ratio. Halve the moles of NaOH to get the moles of H₂SO₄."],["\u003ci>n\u003c/i> = \u003ci>c\u003c/i>\u003ci>V\u003c/i> in mmol","mL × mol/L = mmol: 20.0 mL × 0.100 mol/L = 2.00 mmol."],["Overshooting the endpoint","The recorded volume is too large, so the calculated concentration of the unknown is too high."],["Good technique","Rinse the burette with titrant, remove bubbles, read the meniscus at eye level, add single drops near the end, and repeat until trials agree within 0.10 mL."]]}};</script>
