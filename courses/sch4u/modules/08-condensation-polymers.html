.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

*{transition:none!important;animation:none!important}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}

.chem sub,.chem sup{font-size:.72em;line-height:0}

.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* chain stage */
.cp-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.cp-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}

/* hero */
.hero .hero-eq .cp-eq{font-size:.8em}
.hero .hero-eq .cp-eq sub{font-size:.6em}
.cp-hx-box{border:0;background:none}
.cp-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.cp-hx-cap{font:400 1.02rem var(--font-ui);color:var(--ink);margin:6px 0;min-height:2.8em}
.cp-hx-lab{font:700 .9rem var(--font-ui);color:var(--ink-2);margin:8px 0 2px}

.cp-how{margin-top:0}
.cp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"view view" "ctrl read";gap:18px 28px;align-items:start}
.cp-view{grid-area:view;min-width:0}.cp-ctrl{grid-area:ctrl;min-width:0}.cp-right{grid-area:read;min-width:0}
.cp-cap{font:400 clamp(1rem,2.1vw,1.25rem)/1.4 var(--font-ui);margin:0 0 6px;min-height:1.4em}
.cp-cap .chem{white-space:normal;overflow-wrap:anywhere}
.cp-capn{font-size:.85em;color:var(--ink-2)}
.cp-sub{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:10px 0 6px}
.cp-stepcap{min-height:1.5em;margin:8px 0 4px;font-size:1rem}
.cp-cmp{margin-top:6px}
.cp-ledger{margin-top:10px}
.cp-ledger td,.cp-ledger th{text-align:left}
.cp-ctrl > div + div,.cp-ctrl > form,.cp-ctrl > label{margin-top:12px}
.cp-act{margin-top:14px}
.cp-capb{display:flex;flex-wrap:wrap;gap:6px}
.cp-capb .btn{min-height:36px;text-align:left}
.cp-entry{padding-top:10px;border-top:1px solid var(--rule)}
.cp-entry label{display:block;font-size:.88rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.cp-er{display:flex;align-items:center;gap:8px}
.cp-ent{font:inherit;padding:.35em .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);width:8rem;min-height:36px}
.cp-cover{display:flex;align-items:center;gap:8px;font-size:.95rem;min-height:32px}
.cp-cover input{width:20px;height:20px;flex:none}
.cp-msg{min-height:1.4em;margin:8px 0 0;font-size:.95rem;color:var(--ink-2)}
.cp-right .uses{margin-top:14px}
.cp-cmp[hidden],.cp-lab1[hidden],.cp-capc[hidden],.cp-bs[hidden],.cp-zoom[hidden]{display:none}

.cp-hybox{position:relative}

.cp-hyb:hover,.cp-hyb:focus-visible{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}

.cp-hycap{min-height:2.8em;margin:10px 0 4px}
.cp-zgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:10px;max-width:680px}
.cp-zf{margin:0;min-width:0}
.cp-zf figcaption{font-size:.92rem;font-weight:700;margin-bottom:6px}
.cp-envsl{max-width:520px;margin:6px 0 10px}
.cp-brow{margin:10px 0}
.cp-bl{margin:0 0 4px}
.cp-btrack{position:relative;height:26px;border-radius:6px;background:var(--paper);border:1.5px solid var(--rule)}
.cp-bfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:var(--pen)}
.cp-bval{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:700;font-size:.92rem;color:var(--ink);background:var(--sheet);padding:0 4px;border-radius:4px}
.cp-bnote{margin:3px 0 0}
.cp-routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin-top:10px}
.cp-route{min-width:0;border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--sheet)}
.cp-route > p:first-child{margin-top:0}
.cp-rsvg{display:block;width:100%;max-width:340px;height:auto;margin:4px 0}
.cp-rcap{min-height:3em;margin:4px 0}
.cp-ask{margin:16px 0 6px}
.cp-rchips{display:flex;flex-wrap:wrap;gap:6px}
.cp-canada{margin-top:14px}

/* practice set */
.cp-pchips{margin:8px 0}
.cp-ivrow{margin:8px 0}
.cp-ivl{font-size:.92rem;font-weight:700;margin:0 0 4px}
.cp-ivrow .chips{margin:0}

/* task */
.cp-tk > div + div{margin-top:12px}
.cp-h4{font:700 1rem var(--font-ui);margin:0 0 8px}
#cp-tkbox{margin-bottom:10px}
#cp-tkbox[hidden]{display:none}
.cp-conds{margin:8px 0 12px;padding-left:1.4em}

  .cp-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "ctrl" "read"}

}

","slug":"keq","title":"Quantitative Equilibrium (Keq)","kind":"topic","group":"4"},{"nn":"37","slug":"ksp","title":"Solubility Equilibrium (Ksp)","kind":"topic","group":"4"},{"nn":"38","slug":"acids-and-bases","title":"Acids and Bases","kind":"topic","group":"4"},{"nn":"39","slug":"ph-strong-acids-bases","title":"pH of Strong Acids and Bases","kind":"topic","group":"4"},{"nn":"40","slug":"ka-and-kb","title":"Ka and Kb Calculations","kind":"topic","group":"4"},{"nn":"41","slug":"hydrolysis-of-salts","title":"Hydrolysis of Salts","kind":"topic","group":"4"},{"nn":"42","slug":"strong-titration","title":"Strong Acid/Base Titration","kind":"topic","group":"4"},{"nn":"43","slug":"weak-titration","title":"Weak Acid/Base Titration","kind":"topic","group":"4"},{"nn":"44","slug":"buffer-solutions","title":"Buffer Solutions","kind":"topic","group":"4"},{"nn":"45","slug":"oxidation-numbers","title":"Assigning Oxidation Numbers","kind":"topic","group":"5"},{"nn":"46","slug":"balancing-redox","title":"Balancing Redox Reactions (Half-Reaction Method)","kind":"topic","group":"5"},{"nn":"47","slug":"galvanic-cells","title":"Galvanic Cells and Standard Reduction Potentials","kind":"topic","group":"5"},{"nn":"48","slug":"cell-notation","title":"Cell Notation (Voltaic Cells)","kind":"topic","group":"5"},{"nn":"49","slug":"corrosion","title":"Corrosion","kind":"topic","group":"5"},{"nn":"50","slug":"faraday-first-law","title":"Faraday's First Law of Electrolysis","kind":"topic","group":"5"},{"nn":"51","slug":"faraday-second-law","title":"Faraday's Second Law of Electrolysis","kind":"topic","group":"5"},{"nn":"52","slug":"hall-heroult","title":"The Hall–Héroult Process","kind":"topic","group":"5"}]},"salt":"9d0bdc37","content":{"id":"08-condensation-polymers","kind":"topic","title":"Condensation polymers","topic":"Condensation Polymers","readyTopic":"condensation polymers","hero":{"eq":"\u003cspan class=\"cp-eq\">\u003cspan class=\"nw\">\u003cem>n\u003c/em> HOOC–R–COOH\u003c/span> \u003cspan class=\"nw\">+ \u003cem>n\u003c/em> H\u003csub>2\u003c/sub>N–R′–NH\u003csub>2\u003c/sub>\u003c/span> \u003cspan class=\"nw\">→ –[CO–R–CO–NH–R′–NH]–\u003csub>\u003cem>n\u003c/em>\u003c/sub>\u003c/span> \u003cspan class=\"nw\">+ (2\u003cem>n\u003c/em> − 1) H\u003csub>2\u003c/sub>O\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"n H O O C, R, C O O H plus n H 2 N, R prime, N H 2 gives the chain, bracket C O, R, C O, N H, R prime, N H, close bracket, n times, plus 2 n minus 1 H 2 O","headline":"Two hands each, and a water at every handshake","text":"Give each monomer \u003cstrong>two\u003c/strong> reactive ends and it can link on both sides. Every link (an \u003cstrong>ester\u003c/strong> or an \u003cstrong>amide\u003c/strong>) releases a \u003cstrong>water molecule\u003c/strong>. That’s how polyester fleece, nylon rope, Kevlar vests, proteins and even cellulose are built.","fig":{"html":"\u003cdiv class=\"cp-hx\">\u003cdiv class=\"cp-hx-box\" id=\"cp-hx-box\">\u003csvg class=\"cp-svg\" id=\"cp-hx-svg\" role=\"img\" aria-label=\"A diacid with two –COOH ends and a diamine with two –NH₂ ends drift together. At the touching ends, –OH and –H glow and leave together as a water molecule, and a new C–N bond forms. More monomers dock, one water leaving at each new link. After four links: four waters released, and a bracket marks one repeating unit.\">\u003c/svg>\u003c/div>\u003cdiv class=\"cp-hx-row\">\u003cp class=\"cp-hx-cap\" id=\"cp-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"cp-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can identify bifunctional monomers that form condensation polymers and the link each pair makes (ester, amide, glycosidic).","I can draw the repeating unit of a polyester or polyamide from its monomers, and work back from a repeating unit to its monomers.","I can count the water released and calculate the molar mass of a condensation chain or repeating unit.","I can explain the difference between addition and condensation polymerization.","I can predict the effect of monofunctional and trifunctional monomers on chain growth.","I can explain hydrolysis of condensation polymers and evaluate biodegradability and recycling."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Esterification","goal":1,"prompt":"Ethanoic acid + ethanol → ethyl ethanoate + ?","options":[{"t":"Ethene","why":"No carbon compound is released.","_n":"0b36","_k":"dfc607d8"},{"t":"Nothing","why":"A small molecule always leaves in condensation.","_n":"1b66","_k":"c0d51b68"},{"t":"Water","why":"Condensation releases H₂O.","_n":"2b56","_k":"a8533c67"},{"t":"Hydrogen","why":"No H₂ forms.","_n":"3b86","_k":"431c1d04"}],"hints":["What does condensation release?","–OH from the acid, H from the alcohol.","Water."]},{"id":"w2","skill":"Esterification","goal":2,"prompt":"Which link forms between an acid and an alcohol?","options":[{"t":"C=C","why":"No double bond forms.","_n":"4b76","_k":"f1ff1338"},{"t":"–COO– (ester)","why":"The acid keeps its C=O, and the alcohol’s O bonds to the C=O carbon: an ester link, –COO–.","_n":"5ba6","_k":"1d5572cc"},{"t":"–CO–NH– (amide)","why":"That needs an amine.","_n":"6b96","_k":"0bf6451c"},{"t":"–O– (ether)","why":"The C=O stays: ester.","_n":"7ac6","_k":"7e236a16"}],"hints":["The acid keeps its C=O.","The alcohol’s O bonds to the C=O carbon.","Ester."]},{"id":"w3","skill":"Amide formation","goal":1,"prompt":"Which pair condenses to form an amide?","options":[{"t":"Propanoic acid + methanol","why":"That gives an ester.","_n":"8ab6","_k":"d7f8b648"},{"t":"Propan-1-ol + methanamine","why":"No acid.","_n":"95c3","_k":"587dbc87"},{"t":"Propene + ammonia","why":"No C=O to form the amide.","_n":"a5d3","_k":"fc8d8224"},{"t":"Propanoic acid + methanamine","why":"An acid and an amine condense: the C=O carbon bonds to the N, and water leaves.","_n":"b5e3","_k":"5de21655"}],"hints":["Amides need C=O and N.","An acid and an amine.","Propanoic acid + methanamine."]},{"id":"w4","skill":"Repeating units","goal":2,"prompt":"In an addition polymer, how many backbone carbons does one repeating unit from propene have?","options":[{"t":"1","why":"Both C=C carbons join.","_n":"c5f3","_k":"2d6cdd88"},{"t":"2","why":"The C=C carbons.","_n":"d603","_k":"e96561eb"},{"t":"3","why":"The CH₃ is a side group.","_n":"e613","_k":"5717a7c4"},{"t":"6","why":"That’s three units.","_n":"f623","_k":"b37ebc58"}],"hints":["Which carbons had the double bond?","Two of them.","2."]},{"id":"w5","skill":"Molar mass","goal":3,"prompt":"Use C = 12, H = 1, O = 16. What is the molar mass of ethane-1,2-diol, HOCH₂CH₂OH?","options":[{"t":"78 g/mol","why":"Only two O.","_n":"g633","_k":"b64d2f14"},{"t":"60 g/mol","why":"Count all six H.","_n":"h543","_k":"66bb97c9"},{"t":"46 g/mol","why":"That’s ethanol.","_n":"i553","_k":"ef1227fd"},{"t":"62 g/mol","why":"C₂H₆O₂: 24 + 6 + 32.","_n":"jce3","_k":"6a20a68f"}],"hints":["Write the formula.","C₂H₆O₂.","62."]},{"id":"w6","skill":"Molar mass","goal":3,"prompt":"Two molecules of masses 146 and 116 g/mol join, releasing one water (18). Mass of the product?","options":[{"t":"244 g/mol","why":"146 + 116 − 18.","_n":"kcd3","_k":"092aa867"},{"t":"226 g/mol","why":"Only one link here.","_n":"ld03","_k":"6041df6e"},{"t":"280 g/mol","why":"Water leaves.","_n":"mcf3","_k":"6c59e374"},{"t":"262 g/mol","why":"At each link the acid loses –OH and the partner loses –H: they leave as H₂O. Subtract its 18 g/mol.","_n":"nd23","_k":"b706ddde"}],"hints":["Add the two masses.","262 total.","Minus 18: 244."]}],"refreshers":{"Esterification":"Acid + alcohol → ester + water; the link is –COO–.","Amide formation":"Acid + amine → amide + water; the link is –CO–NH–.","Repeating units":"The smallest piece that repeats along the chain.","Molar mass":"Add atomic masses; subtract 18 for each water released."}}},"explore":{"heading":"Condensation chain builder","intro":"Choose two monomers, link them, and track every water molecule that leaves.","how":"Tap a \u003cstrong>Monomer A\u003c/strong> and a \u003cstrong>Monomer B\u003c/strong>, then press \u003cstrong>Link\u003c/strong> to add one molecule to the chain end, or set the length with the slider. \u003cstrong>Compare\u003c/strong> puts an addition chain of the same length beside yours; \u003cstrong>Cap and cross-link\u003c/strong> adds a one-ended cap or a three-ended branch point.","use":"hexanedioic acid 146 · benzene-1,4-dicarboxylic acid 166 · butanedioic acid 118 · ethane-1,2-diol 62 · butane-1,4-diol 90 · hexane-1,6-diamine 116 · benzene-1,4-diamine 108 · glycine 75 · glucose 180 · water 18 g/mol","modes":[{"id":"build","t":"Build"},{"id":"compare","t":"Compare"},{"id":"cap","t":"Cap and cross-link"}],"predictions":[{"id":"p1","prompt":"Build mode: hexanedioic acid + hexane-1,6-diamine, length 2. What forms besides the dimer?","options":[{"t":"nothing","_n":"od13","_k":"0ef686b0"},{"t":"one water molecule","_n":"pd43","_k":"edecfe99"},{"t":"two water molecules","_n":"qd33","_k":"47262724"},{"t":"ammonia","_n":"rd63","_k":"8dbfa176"}],"explain":"One link, one water."},{"id":"p2","prompt":"Length 10. How many water molecules have been released?","options":[{"t":"5","_n":"sd53","_k":"e6dd4808"},{"t":"9","_n":"t683","_k":"b7c9cdf3"},{"t":"10","_n":"u693","_k":"ef0b67dc"},{"t":"20","_n":"v663","_k":"36b338ec"}],"explain":"Ten molecules in a row have nine links between them."},{"id":"p3","prompt":"Cap and cross-link mode: add ethanoic acid to the amine end. What happens to that end?","options":[{"t":"it can’t grow any further","_n":"w673","_k":"3327df33"},{"t":"it grows faster","_n":"x643","_k":"288d4280"},{"t":"nothing changes","_n":"y653","_k":"f771e524"},{"t":"it makes a branch","_n":"z623","_k":"6d7931e4"}],"explain":"Ethanoic acid has one –COOH; after it links, there’s no free group left on that end."},{"id":"p4","prompt":"Compare mode, 8 monomers each. Which chain’s mass equals the total mass of its monomers?","options":[{"t":"the addition chain","_n":"10633","_k":"37bd2c6d"},{"t":"the condensation chain","_n":"11603","_k":"01a79218"},{"t":"both","_n":"12613","_k":"986d1b2a"},{"t":"neither","_n":"13da3","_k":"51c45671"}],"explain":"Only condensation loses water."}],"chalIntro":"Use the chain builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Make a polyamide.","why":"Amide links (–CO–NH–) form when a diacid meets a diamine, or when amino acids join.","hints":["Amide = C=O bonded to N.","You need an N–H on the partner.","A diacid with a diamine (or amino acids)."]},{"id":"tc2","goal":3,"prompt":"Build a PET chain of exactly 6 molecules (benzene-1,4-dicarboxylic acid + ethane-1,2-diol) and enter its molar mass.","why":"3 × 166 + 3 × 62 − 5 × 18 = 594 g/mol: six molecules make five links.","hints":["Three of each monomer.","498 + 186 = 684 before water.","Five links: 684 − 90 = 594."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"Choose monomers so the repeating unit has molar mass 226 g/mol and contains amide links.","why":"Hexanedioic acid + hexane-1,6-diamine: 146 + 116 − 36 = 226 g/mol. That’s nylon-6,6.","hints":["Repeating unit = acid + partner − 2 × 18.","So acid + partner = 262.","146 + 116 = 262: hexanedioic acid and hexane-1,6-diamine (nylon-6,6)."]}],"blocks":[{"title":"Counting the water in a long chain","html":"\u003cp>A chain of `m` monomer molecules in a row, with both ends still free, has `m - 1` links, so `m - 1` waters leave. Some books write 2\u003cem>n\u003c/em> waters for a chain made from \u003cem>n\u003c/em> diacid and \u003cem>n\u003c/em> partner molecules: they ignore the ends. For a chain of thousands of molecules, the difference of one water is negligible.\u003c/p>"}]},"part3":{"slug":"hydrolysis","name":"Hydrolysis","heading":"Breaking them down","intro":"Hydrolysis is condensation run backwards: water is added across each ester or amide link. That’s why polyesters and polyamides can be broken back into their monomers, while addition polymers can’t.","s1":{"title":"Station 1: Run it backwards","intro":"A nylon-6,6 chain of 4 monomer units (hexanedioic acid and hexane-1,6-diamine, joined by three amide links). Tap \u003cstrong>Add water\u003c/strong> on a link: the H₂O splits, its –OH goes to the C=O carbon and its –H to the N, and the chain breaks there.","conds":[{"id":"water","t":"Water only","rate":"very slow","note":"In plain water at room temperature, amide links hydrolyse extremely slowly."},{"id":"acid","t":"With acid (H₃O⁺)","rate":"much faster","note":"Acid speeds up hydrolysis (it catalyses the reaction)."},{"id":"base","t":"With base (OH⁻)","rate":"much faster","note":"Base also speeds up hydrolysis; the acid part then ends up as its salt, as in soap-making (module 05)."}],"zoom":"The C=O carbon carries a partial positive charge (δ+), so the O of a water molecule is attracted to it and bonds to it. The C–N bond breaks: the carbon keeps the new –OH, and the water’s other H ends up on the N."},"s2":{"title":"Station 2: Who breaks down?","intro":"Four strips: polyethene, PET, PLA (poly(lactic acid), a polyester made from lactic acid) and cellulose. Move the slider to change the conditions.","conds":["cold lake water","warm moist compost","an industrial composter at about 60 °C"],"note":"Model values, chosen to show the pattern; they are not real test results."},"s3":{"title":"Station 3: Recycling a bottle","intro":"Two routes for a used PET bottle. Run each one, then choose the route that suits food bottles.","mech":"\u003cstrong>Mechanical:\u003c/strong> melt and remould; chains shorten a little each time, and contaminants stay.","chem":"\u003cstrong>Chemical:\u003c/strong> hydrolyse the PET back to benzene-1,4-dicarboxylic acid and ethane-1,2-diol; purify; repolymerize into PET as good as new.","ask":"Which route suits food bottles, and why?","choices":[{"t":"Chemical: purified monomers rebuild clean PET","fb":"Right. Hydrolysis gives back the monomers, which can be purified and repolymerized into PET as good as new, so it’s safe for food.","_n":"14d93","_k":"619db185"},{"t":"Chemical: it turns PET into an addition polymer","fb":"Repolymerizing makes PET again: a condensation polymer.","_n":"15d83","_k":"961d5dc2"},{"t":"Mechanical: melting keeps the chains intact","fb":"Each melt shortens the chains a little, and contaminants stay.","_n":"16d73","_k":"4cb00ece"},{"t":"Mechanical: melting removes contaminants","fb":"Melting keeps contaminants in the plastic.","_n":"17d63","_k":"21d4ec26"}],"canada":"In Canada, companies and university research groups are developing this kind of chemical recycling (depolymerization), which turns used PET back into its monomers."},"quickCheck":{"title":"Quick check","summary":"Breaking them down quick check","items":[{"id":"q1","goal":6,"prompt":"Hydrolysis of a polyester gives…","choices":[{"t":"a diacid and a diol","fb":"Right. Water splits each ester link back into acid + alcohol: the diacid and the diol.","_n":"18d53","_k":"f07813c5"},{"t":"CO₂ and water","fb":"Water splits each ester link back into acid + alcohol.","_n":"19d43","_k":"d0dc0932"},{"t":"alkenes","fb":"Water splits each ester link back into acid + alcohol.","_n":"1ad33","_k":"81e60da1"},{"t":"a diacid and a diamine","fb":"Water splits each ester link back into acid + alcohol.","_n":"1be23","_k":"965c1508"}]},{"id":"q2","goal":6,"prompt":"Hydrolysis ___ water.","choices":[{"t":"releases","fb":"It’s the reverse of condensation. Hydrolysis \u003cstrong>adds\u003c/strong> water across each ester or amide link, giving back the original monomers.","_n":"1ce13","_k":"31836c9a"},{"t":"destroys","fb":"It’s the reverse of condensation. Hydrolysis \u003cstrong>adds\u003c/strong> water across each ester or amide link, giving back the original monomers.","_n":"1dd43","_k":"7efa74cf"},{"t":"adds","fb":"Right. Hydrolysis \u003cstrong>adds\u003c/strong> water across each
