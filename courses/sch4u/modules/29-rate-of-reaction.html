.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"],.rg.chips button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}
.rg.chips button[aria-checked="true"]:disabled{opacity:1}

/* hero */
.rr-eq{display:inline-block;line-height:1.3}
.rr-hx-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;justify-content:center}
.rr-hx-fl{flex:1 1 220px;max-width:300px;height:auto;font-family:var(--font-ui)}
.rr-hx-gr{flex:1.5 1 300px;max-width:460px;height:auto;font-family:var(--font-ui)}
.rr-hx-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.rr-hx-cap{font:400 1.02rem var(--font-ui);color:var(--ink);margin:6px 0;min-height:2.8em;flex:1 1 240px}

/* lab */
.rr-how{margin-top:0}
.rr-modes{margin:0 0 12px}
.rr-v[hidden]{display:none}
.rr-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.rr-gcol,.rr-ccol{min-width:0}
.rr-ccol > * + *{margin-top:12px}
.rr-gcap{margin:6px 0 0}
.rr-entry{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.rr-entry[hidden]{display:none}
.rr-entry .numin{width:8em}
.rr-note{min-height:0;margin:0;font-size:.97rem}
.rr-note:empty{display:none}
.rr-ok{color:var(--green)}
.rr-bad{color:var(--red)}
.rr-svgbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:6px}
.rr-bench{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.rr-rxn{margin:0;font-size:1rem}
.rr-runs{margin-top:16px}
.rr-runs .q-actions{margin-top:6px}
.rr-benchq{margin-top:14px;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px}
.rr-benchq > * + *{margin-top:10px}
.rr-lab{font-size:.95rem;font-weight:700;margin:0}
.rr-tg{cursor:pointer}
.rr-tbl td,.rr-tbl th{vertical-align:top}

/* Part 3 */
.rr-st + .rr-st{margin-top:26px;padding-top:18px;border-top:1.5px solid var(--rule)}
.rr-h3{margin:0 0 6px;font-size:1.12rem}
.rr-eqbig{font-size:1.2rem;margin:10px 0 6px}
.rr-s1sl{max-width:460px}
.rr-gauges{margin-top:10px;display:grid;gap:8px}
.rr-g{display:grid;grid-template-columns:7.5em minmax(60px,1fr) auto;gap:6px 10px;align-items:center}
.rr-gl{font-weight:700;font-size:.95rem}
.rr-gbar{display:block;height:16px;border:1.5px solid var(--ink-2);border-radius:5px;overflow:hidden;background:var(--sheet)}
.rr-gfill{display:block;height:100%;background:var(--pen)}
.rr-gfill.used{background:var(--ink-2)}
.rr-gv{font-size:.95rem;white-space:nowrap}
.rr-gnote{margin:4px 0 0}
.rr-urow{padding:10px 0;border-bottom:1px solid var(--rule)}
.rr-urow:last-child{border-bottom:0}
.rr-ut{margin:0 0 6px;font-weight:700}
.rr-urow .fb{margin-top:8px}
.rr-mi + .rr-mi{margin-top:14px}
.rr-mi .numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.rr-mi .numin{width:8em}
.rr-mgrid{margin-top:8px}

/* task */
.rr-tkc,.rr-tks,.rr-tkt{margin-bottom:12px}

@media (max-width:700px){
  .rr-grid{grid-template-columns:minmax(0,1fr)}

  .rr-gbar{grid-column:1 / -1;grid-row:2}
  .rr-gv{white-space:normal}
}

03cspan class=\"nw\">= Δ[product] ÷ Δ\u003ci>t\u003c/i>\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"rate equals minus the change in reactant concentration divided by the change in time, which equals the change in product concentration divided by the change in time","headline":"How fast, and what changes it?","text":"Some reactions finish in a flash; others take years. The \u003cstrong>rate of reaction\u003c/strong> measures how quickly reactants turn into products. It’s the slope of a graph over time. \u003cstrong>Temperature\u003c/strong>, \u003cstrong>concentration\u003c/strong>, \u003cstrong>surface area\u003c/strong>, a \u003cstrong>catalyst\u003c/strong> and the \u003cstrong>nature of the reactants\u003c/strong> all change it.","fig":{"html":"\u003cdiv class=\"rr-hx\">\u003cdiv class=\"rr-hx-row\">\u003csvg class=\"rr-hx-fl\" id=\"rr-hx-fl\" viewBox=\"0 0 260 230\" role=\"img\" aria-label=\"Two flasks of the same acid. A marble chip drops into the left flask and the same mass of marble powder into the right one. Bubbles of carbon dioxide rise; the powder flask fizzes far faster.\">\u003c/svg>\u003csvg class=\"rr-hx-gr\" id=\"rr-hx-gr\" viewBox=\"0 0 380 250\" role=\"img\" aria-label=\"Volume of carbon dioxide against time for both flasks (model data). The powder curve is steeper and levels off sooner, at the same final volume of 60 mL. Tangents at 10 s have slopes of about 2.2 mL/s for the powder and 1.0 mL/s for the chip.\">\u003c/svg>\u003c/div>\u003cdiv class=\"rr-hx-foot\">\u003cp class=\"rr-hx-cap\" id=\"rr-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"rr-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can calculate average rates of reaction from tables and graphs, with correct units.","I can describe how temperature, concentration, surface area, catalysts and the nature of the reactants affect rate.","I can tell average from instantaneous rate and find an instantaneous rate from a tangent.","I can relate the rates of different species using the balanced equation.","I can design a fair test of one factor and interpret its results.","I can apply rate ideas to real situations."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Slope","goal":1,"prompt":"What is the slope of the line through (0, 10) and (5, 0)?","options":[{"t":"−2","why":"(0 − 10) ÷ (5 − 0).","_n":"0208","_k":"f8f3bbae"},{"t":"−0.5","why":"Rise ÷ run.","_n":"1238","_k":"4a7552b7"},{"t":"2","why":"The line falls.","_n":"2228","_k":"c50d1941"},{"t":"10","why":"That’s the intercept.","_n":"3258","_k":"b695b63b"}],"hints":["Slope = Δ\u003ci>y\u003c/i> ÷ Δ\u003ci>x\u003c/i>.","−10 ÷ 5.","−2."]},{"id":"w2","skill":"Slope","goal":3,"prompt":"On a distance–time graph, the slope of the tangent at one moment gives…","options":[{"t":"the average speed since the start","why":"That’s a secant from the origin.","_n":"4248","_k":"1cf89d81"},{"t":"the instantaneous speed","why":"A tangent touches at one point, so its slope is the rate right then.","_n":"5278","_k":"f7434b1c"},{"t":"the total distance","why":"That’s a height on the graph, not a slope.","_n":"6268","_k":"83a24321"},{"t":"the time taken","why":"Slope is change per time.","_n":"7298","_k":"f2afad9b"}],"hints":["A tangent touches at one point.","It shows the rate right then.","Instantaneous speed."]},{"id":"w3","skill":"Concentration","goal":1,"prompt":"0.50 mol of solute is dissolved to make 2.0 L of solution. What is the concentration?","options":[{"t":"0.50 mol/L","why":"Divide by the volume.","_n":"8288","_k":"49387b21"},{"t":"4.0 mol/L","why":"That’s 2.0 ÷ 0.50.","_n":"9b11","_k":"5092d322"},{"t":"0.25 mol/L","why":"0.50 ÷ 2.0.","_n":"ab21","_k":"8da2d7ae"},{"t":"1.0 mol/L","why":"That multiplies.","_n":"bb31","_k":"f94e0e53"}],"hints":["\u003ci>c\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>V\u003c/i>.","0.50 ÷ 2.0.","0.25 mol/L."]},{"id":"w4","skill":"Concentration","goal":2,"prompt":"Water is added to a solution until its volume doubles. The concentration…","options":[{"t":"stays the same","why":"The particles spread out.","_n":"cb41","_k":"f4228fe5"},{"t":"becomes zero","why":"The solute is still there.","_n":"db51","_k":"a4dd7413"},{"t":"halves","why":"Same moles, twice the volume.","_n":"eb61","_k":"186d2cf6"},{"t":"doubles","why":"More volume dilutes it.","_n":"fb71","_k":"95b30b33"}],"hints":["Moles don’t change.","\u003ci>c\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>V\u003c/i>, with \u003ci>V\u003c/i> doubled.","Half."]},{"id":"w5","skill":"Variables","goal":5,"prompt":"A student tests how temperature affects the rate of a reaction. The independent variable is…","options":[{"t":"reaction rate","why":"That’s the dependent variable.","_n":"gb81","_k":"99fff145"},{"t":"temperature","why":"It’s the one the student changes.","_n":"hb91","_k":"5a4941a0"},{"t":"the time of day","why":"Not part of the test.","_n":"iba1","_k":"ebf03cc2"},{"t":"the mass of reactant","why":"That’s kept the same.","_n":"j432","_k":"3da475a8"}],"hints":["Which variable does the student choose to change?","The one in the question.","Temperature."]},{"id":"w6","skill":"Variables","goal":5,"prompt":"Testing how acid concentration affects the rate with marble chips, which must be \u003cstrong>controlled\u003c/strong>?","options":[{"t":"The rate","why":"That’s what’s measured.","_n":"k422","_k":"22c32ad0"},{"t":"Nothing; any chips will do","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"l452","_k":"42fb3a28"},{"t":"The acid concentration","why":"That’s the independent variable.","_n":"m442","_k":"b6881de8"},{"t":"The mass and size of the chips, and the temperature","why":"Each of these could also change the rate, so keep them the same.","_n":"n472","_k":"dc4d000b"}],"hints":["What else could change the rate?","Chip size and temperature.","Keep them the same."]}],"refreshers":{"Slope":"Slope = rise ÷ run = Δ\u003ci>y\u003c/i> ÷ Δ\u003ci>x\u003c/i>; a falling line has a negative slope.","Concentration":"\u003ci>c\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>V\u003c/i> in mol/L. Diluting increases \u003ci>V\u003c/i>, so \u003ci>c\u003c/i> falls.","Variables":"The independent variable is the one you change; the dependent variable is the one you measure; controlled variables are kept the same."}}},"explore":{"heading":"Reaction rate lab","intro":"Read rates from graphs, then run your own experiments.","how":"Choose a mode. \u003cstrong>Data:\u003c/strong> pick a graph and a tool, then drag the points (or tap one and use the arrow keys; Shift + arrows turn the tangent). \u003cstrong>Experiment\u003c/strong> and \u003cstrong>Catalyst and nature:\u003c/strong> choose the settings, then press \u003cstrong>Run\u003c/strong>.","modes":[{"id":"data","t":"Data"},{"id":"exp","t":"Experiment"},{"id":"cat","t":"Catalyst and nature"}],"predictions":[{"id":"p1","prompt":"Data mode, concentration graph. [A] goes down over time. How is the rate of reaction reported?","options":[{"t":"as zero, since [A] ends at 0","_n":"o462","_k":"4f8c7720"},{"t":"as a positive number, −Δ[A] ÷ Δ\u003ci>t\u003c/i>","_n":"p492","_k":"ff27395b"},{"t":"as Δ\u003ci>t\u003c/i> ÷ Δ[A]","_n":"q482","_k":"9972ea58"},{"t":"as a negative number","_n":"r3b2","_k":"3a315cfc"}],"explain":"The minus sign turns a falling concentration into a positive rate. Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>."},{"id":"p2","prompt":"Data mode. Compare the average rates over 0–20 s, 20–40 s and 40–60 s.","options":[{"t":"they decrease, then increase","_n":"s3a2","_k":"e05bfa0e"},{"t":"they’re equal","_n":"t3d1","_k":"966a1379"},{"t":"they increase","_n":"u3e1","_k":"39c5da29"},{"t":"they decrease","_n":"v3b1","_k":"23a0d1fe"}],"explain":"As A is used up, the reaction slows. As reactants are used up, collisions get rarer and the rate falls."},{"id":"p3","prompt":"Experiment mode, standard run done. Same mass of CaCO₃, but as powder. The rate will be…","options":[{"t":"much faster","_n":"w3c1","_k":"a6d0e556"},{"t":"slower","_n":"x391","_k":"6d8d6674"},{"t":"the same","_n":"y3a1","_k":"fc68f079"},{"t":"faster, but less gas overall","_n":"z371","_k":"85a5a9ac"}],"explain":"Powder exposes far more surface for acid particles to hit. The same mass cut into smaller pieces exposes far more surface."},{"id":"p4","prompt":"Experiment mode. Raise the temperature from 20 °C to 30 °C, changing nothing else. The time to collect 60 mL becomes about…","options":[{"t":"20 s","_n":"10381","_k":"024042f0"},{"t":"30 s","_n":"11451","_k":"e30b0631"},{"t":"60 s","_n":"12461","_k":"b0266809"},{"t":"15 s","_n":"13cf2","_k":"5a7f2bdf"}],"explain":"In this model (and as a rough rule for many reactions), +10 °C about doubles the rate. Module 30 explains why."}],"chalIntro":"Use the lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Data mode: set a tangent at \u003ci>t\u003c/i> = 20 s and enter the instantaneous rate.","why":"The tangent at 20 s passes through (10 s, 0.600) and (30 s, 0.200): slope −0.400 ÷ 20 = −0.020 mol/(L·s), so the rate is 0.020 mol/(L·s).","hints":["The tangent touches the curve only at 20 s.","The true tangent passes through (10 s, 0.600) and (30 s, 0.200).","0.400 ÷ 20 = 0.020 mol/(L·s)."]},{"id":"tc2","goal":5,"prompt":"Experiment mode: design a fair test of temperature with at least three runs.","why":"Only the temperature changed between runs, so any change in time comes from temperature. Acid concentration and chip size were controlled.","hints":["Pick a concentration and chip size and keep them.","Change only the temperature: 10, 20, 30 °C, for example.","Name the controls: acid concentration and chip size."]},{"id":"tc3","goal":2,"stretch":true,"prompt":"From the standard run (1.00 mol/L, large chips, 20 °C), make the reaction exactly \u003cstrong>8 times\u003c/strong> as fast by changing \u003cstrong>exactly two\u003c/strong> settings.","why":"×2 from the concentration (or the chip size) and ×4 from 40 °C: 2.0 mL/s × 8 = 16.0 mL/s.","hints":["List each setting’s factor: concentration ×2; small chips ×2; each +10 °C ×2.","You need ×8 = ×2 × ×4. Which single change gives ×4?","40 °C gives ×4; pair it with ×2 from concentration or chip size."]}],"blocks":[{"title":"About this model","html":"\u003cp>The lab runs on fixed rules (model data), so every run with the same settings gives the same result.\u003c/p>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"rr-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Setting\u003c/th>\u003cth scope=\"col\">Model\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Model concentration\u003c/td>\u003ctd>[A] = 0.900 − 0.030\u003ci>t\u003c/i> + 0.00025\u003ci>t\u003c/i>² mol/L for 0 ≤ \u003ci>t\u003c/i> ≤ 60 s. Instantaneous rate 0.030 − 0.0005\u003ci>t\u003c/i> mol/(L·s).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model gas volume\u003c/td>\u003ctd>\u003ci>V\u003c/i> = 4\u003ci>t\u003c/i> − \u003ci>t\u003c/i>² ÷ 30 mL (0–60 s), reaching 120 mL. Instantaneous rate 4 − \u003ci>t\u003c/i> ÷ 15 mL/s.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Experiment mode\u003c/td>\u003ctd>CO₂ rate = 2.0 mL/s × (\u003ci>c\u003c/i> ÷ 1.00) × size factor (large 1, small 2, powder 8) × 2\u003csup>(\u003ci>T\u003c/i> − 20) ÷ 10\u003c/sup>. Time to collect 60 mL = 60 ÷ rate. Standard run: 1.00 mol/L, large chips, 20 °C gives 2.0 mL/s and 30 s.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Catalyst mode\u003c/td>\u003ctd>O₂ from 3% H₂O₂: no catalyst 0.1 mL/s; potato slice (catalase) 2.0 mL/s; MnO₂ 4.0 mL/s.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nature mode\u003c/td>\u003ctd>H₂ from 1.00 mol/L HCl at 20 °C: Mg 3.0 mL/s; Zn 0.5 mL/s; Cu 0 (no reaction).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Two simplifications.\u003c/strong> “+10 °C doubles the rate” is a rule of this model; module 30 shows the real reason, and that the factor varies from reaction to reaction. The model also treats the starting rate as steady for the first 60 mL, which keeps the numbers clean; in a real flask the rate falls as the acid is used up.\u003c/p>"}]},"part3":{"slug":"graphs","name":"Read the rate","heading":"Read the rate","intro":"Explore measured rates; here you interpret them. Three stations: one reaction with many rates, the units each measurement gives, and a mass-loss graph. Each has a “Check it with data” panel.","s1":{"title":"Station 1: One reaction, many rates","intro":"Choose an equation card, then set how fast the last product forms. The gauges show every species’ rate.","data":"At 0.10 mol/(L·s) of NH₃, N₂ is used at 0.050 and H₂ at 0.15 mol/(L·s). Divide each rate by its coefficient and you get the same number for every species: 0.050."},"s2":{"title":"Station 2: Units","intro":"Choose the unit each measurement gives.","rows":[{"id":"u1","t":"Gas syringe (volume of gas)","_a":"Ew5eR0sS","why":"Volume per time."},{"id":"u2","t":"Balance (mass loss)","_a":"EwRCRBo=","why":"Mass per time."},{"id":"u3","t":"Spectrometer (concentration)","_a":"Ew5dW0sS","why":"Concentration per time."},{"id":"u4","t":"Stopwatch to a colour change","_a":"EwpcQRo=","why":"1 ÷ time gives a relative rate: a shorter time means a faster reaction."}],"units":[{"id":"mlps","t":"mL/s"},{"id":"gps","t":"g/s"},{"id":"mols","t":"mol/(L·s)"},{"id":"inv","t":"1 ÷ time (s⁻¹)"}],"data":"Every rate is “how much changed” ÷ “how long it took”. The unit is the measurement’s unit divided by seconds."},"s3":{"title":"Station 3: Mass-loss graph","intro":"An open flask of acid and marble chips sits on a balance. The mass falls as CO₂ escapes: 150.00 g at 0 s, 149.56 g at 20 s, 149.12 g at 40 s.","uses":"CO₂ = 44.0 g/mol","items":[{"id":"m1","prompt":"Average rate of mass loss over 0–40 s:","unit":"g/s","_a":"AU0CBQo=","display":"0.022 g/s","wrong":[{"match":-0.022,"fb":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>. The flask lost 0.88 g."},{"match":0.88,"fb":"Divide by Δ\u003ci>t\u003c/i> = 40 s."},{"match":0.044,"fb":"Over 0–40 s, Δ\u003ci>t\u003c/i> is 40 s."}],"fb":"Mass lost ÷ time: (150.00 − 149.12) ÷ 40."},{"id":"m2","prompt":"The same rate in moles of CO₂ per second:","unit":"mol/s","_a":"AU0CBwgF","display":"5.0 × 10⁻⁴ mol/s","wrong":[{"match":0.022,"fb":"That’s g/s; divide by 44.0."},{"match":0.02,"fb":"0.88 ÷ 44.0 = 0.020 mol in \u003cstrong>40 s\u003c/strong>."},{"match":0.968,"fb":"Divide by the molar mass; don’t multiply."}],"fb":"Change g/s to mol/s: divide by 44.0 g/mol."}],"data":"0.88 g ÷ 40 s = 0.022 g/s, and 0.022 g/s ÷ 44.0 g/mol = 5.0 × 10⁻⁴ mol/s. The mass that leaves is the CO₂ that forms."},"quickCheck":{"title":"Quick check","summary":"Read the rate quick check","items":[{"id":"q1","goal":4,"prompt":"2H₂O₂ → 2H₂O + O₂. H₂O₂ is used at 0.040 mol/(L·s). O₂ forms at…","choices":[{"t":"0.010","fb":"One O₂ per two H₂O₂.","_n":"14ce2","_k":"2688181c"},{"t":"0.020","fb":"Right. One O₂ per two H₂O₂: 0.040 ÷ 2 = 0.020 mol/(L·s).","_n":"15cd2","_k":"c151ca5f"},{"t":"0.040","fb":"One O₂ per two H₂O₂.","_n":"16cc2","_k":"823f4c04"},{"t":"0.080","fb":"One O₂ per two H₂O₂.","_n":"17cb2","_k":"2481056c"}]},{"id":"q2","goal":1,"prompt":"Which unit fits a gas syringe experiment?","choices":[{"t":"s/mL","fb":"Volume per time.","_n":"18ca2","_k":"a577473c"},{"t":"g/s","fb":"Volume per time.","_n":"19c92","_k":"56158069"},{"t":"mL/s","fb":"Right. Volume per time.","_n":"1ac82","_k":"3a4a3a8f"},{"t":"mol/L","fb":"Volume per time.","_n":"1bc72","_k":"92b92604"}]},{"id":"q3","goal":1,"prompt":"On a mass-loss graph, a steeper slope means…","choices":[{"t":"a colder flask","fb":"Rate is the slope.","_n":"1cc62","_k":"f3af242c"},{"t":"more total gas","fb":"Rate is the slope.","_n":"1d492","_k":"130e9c9d"},{"t":"a slower reaction","fb":"Rate is the slope.","_n":"1e4a2","_k":"1d18a5d0"},{"t":"a faster reaction","fb":"Right. Rate is the slope.","_n":"1f4b2","_k":"45df49fb"}]},{"id":"q4","goal":5,"prompt":"\u003cstrong>Investigation:\u003c/strong> The flask’s mass stops falling at 148.68 g. Best inference?","choices":[{"t":"the balance broke","fb":"No more CO₂ escaping means no more reaction.","_n":"1g4c2","_k":"15a49e00"},{"t":"the acid evaporated","fb":"No more CO₂ escaping means no more reaction.","_n":"1h452","_k":"0d19499d"},{"t":"CO₂ stopped being a gas","fb":"No more CO₂ escaping means no more reaction.","_n":"1i462","_k":"40c2e38f"},{"t":"the reaction has finished (a reactant is used up)","fb":"Right. No more CO₂ escaping means no more reaction.","_n":"1j472","_k":"4018a0a2"}]}]}},"practice":{"activities":[{"id":"factor","type":"sorter","title":"Which factor?","summary":"Which factor?","goal":[2,6],"noun":"situation","txt":true,"instruction":"Tap a situation, then tap the factor that explains it.","boxes":[{"id":"temp","label":"Temperature"},{"id":"conc","label":"Concentration"},{"id":"surf","label":"Surface area"},{"id":"cat","label":"Catalyst"},{"id":"nat","label":"Nature of reactants"}],"items":[{"id":"f1","t":"Milk keeps longer in the fridge","_a":"ExdXWkgS","why":"Cold slows spoiling reactions.","wrong":{"conc":"Cold slows spoiling reactions.","surf":"Cold slows spoiling reactions.","cat":"Cold slows spoiling reactions.","nat":"Cold slows spoiling reactions."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s temperature."]},{"id":"f2","t":"Sawdust catches fire more easily than a log","_a":"ExBHRV4S","why":"Same wood, more exposed surface. The same mass cut into smaller pieces exposes far more surface.","wrong":{"temp":"Same wood, more exposed surface. The same mass cut into smaller pieces exposes far more surface.","conc":"Same wood, more exposed surface. The same mass cut into smaller pieces exposes far more surface.","cat":"Same wood, more exposed surface. The same mass cut into smaller pieces exposes far more surface.","nat":"Same wood, more exposed surface. The same mass cut into smaller pieces exposes far more surface."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s surface area."]},{"id":"f3","t":"A catalytic converter cleans exhaust gases","_a":"EwBTQxo=","why":"Speeds reactions without being used up. A catalyst speeds the reaction and is still there at the end; the products are the same.","wrong":{"temp":"Speeds reactions without being used up. A catalyst speeds the reaction and is still there at the end; the products are the same.","conc":"Speeds reactions without being used up. A catalyst speeds the reaction and is still there at the end; the products are the same.","surf":"Speeds reactions without being used up. A catalyst speeds the reaction and is still there at the end; the products are the same.","nat":"Speeds reactions without being used up. A catalyst speeds the reaction and is still there at the end; the products are the same."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s catalyst."]},{"id":"f4","t":"Steel wool glows brighter in pure oxygen than in air","_a":"EwBdWVsS","why":"More O₂ particles per volume.","wrong":{"temp":"More O₂ particles per volume.","surf":"More O₂ particles per volume.","cat":"More O₂ particles per volume.","nat":"More O₂ particles per volume."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s concentration."]},{"id":"f5","t":"Sodium reacts with water far faster than magnesium does","_a":"Ew1TQxo=","why":"Different substances react at different rates.","wrong":{"temp":"Different substances react at different rates.","conc":"Different substances react at different rates.","surf":"Different substances react at different rates.","cat":"Different substances react at different rates."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s nature of reactants."]},{"id":"f6","t":"Chewing food well speeds digestion","_a":"ExBHRV4S","why":"Smaller pieces of food expose more surface to digestive juices.","wrong":{"temp":"Smaller pieces of food expose more surface to digestive juices.","conc":"Smaller pieces of food expose more surface to digestive juices.","cat":"Smaller pieces of food expose more surface to digestive juices.","nat":"Smaller pieces of food expose more surface to digestive juices."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s surface area."]},{"id":"f7","t":"Laundry enzymes clean stains in cold water","_a":"EwBTQxo=","why":"Enzymes are biological catalysts.","wrong":{"temp":"Enzymes are biological catalysts.","conc":"Enzymes are biological catalysts.","surf":"Enzymes are biological catalysts.","nat":"Enzymes are biological catalysts."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s catalyst."]},{"id":"f8","t":"A pressure cooker cooks food faster","_a":"ExdXWkgS","why":"Water boils at a higher temperature under pressure.","wrong":{"conc":"Water boils at a higher temperature under pressure.","surf":"Water boils at a higher temperature under pressure.","cat":"Water boils at a higher temperature under pressure.","nat":"Water boils at a higher temperature under pressure."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s temperature."]},{"id":"f9","t":"Stronger vinegar dissolves eggshell faster","_a":"EwBdWVsS","why":"Stronger vinegar has more acid particles per volume.","wrong":{"temp":"Stronger vinegar has more acid particles per volume.","surf":"Stronger vinegar has more acid particles per volume.","cat":"Stronger vinegar has more acid particles per volume.","nat":"Stronger vinegar has more acid particles per volume."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s concentration."]},{"id":"f10","t":"Zinc reacts with dilute acid; copper doesn’t","_a":"Ew1TQxo=","why":"Copper is less reactive.","wrong":{"temp":"Copper is less reactive.","conc":"Copper is less reactive.","surf":"Copper is less reactive.","cat":"Copper is less reactive."},"hints":["What is different between the two cases?","Is it heat, crowding, exposed surface, a helper substance or the substance itself?","It’s nature of reactants."]}]},{"id":"calc","type":"numeric","title":"Rate calculations","summary":"Rate calculations","goal":[1,3,4,6],"instruction":"Six calculations. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type a number, then press Check. The unit is shown after the box; for powers of ten, type 5.0e-4 or 5.0×10^-4.","items":[{"id":"r1","goal":1,"prompt":"Average rate of A’s use from 0 to 20 s.","use":"\u003cstrong>Model data\u003c/strong> for A → products: \u003cspan class=\"nw\">\u003ci>t\u003c/i> (s): 0, 10, 20, 30, 40, 50, 60;\u003c/span> \u003cspan class=\"nw\">[A] (mol/L): 0.900, 0.625, 0.400, 0.225, 0.100, 0.025, 0.000\u003c/span>","_a":"AU0CBQ0=","unit":"mol/(L·s)","display":"0.025 mol/(L·s)","why":"−(0.400 − 0.900) ÷ 20 = 0.025 mol/(L·s).","wrong":[{"match":-0.025,"fb":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>."},{"match":0.5,"fb":"Divide by Δ\u003ci>t\u003c/i>."}],"hints":["Average rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>.","Δ[A] = 0.400 − 0.900 = −0.500 mol/L over 20 s.","0.500 ÷ 20 = 0.025 mol/(L·s)."]},{"id":"r2","goal":1,"prompt":"A syringe collects 90 mL of gas in the first 30 s. Average rate?","_a":"Ag==","unit":"mL/s","display":"3.0 mL/s","why":"90 mL ÷ 30 s.","wrong":[{"match":0.33,"fb":"mL ÷ s, not s ÷ mL."},{"match":0.333,"fb":"mL ÷ s, not s ÷ mL."},{"match":0.3333,"fb":"mL ÷ s, not s ÷ mL."}],"hints":["Rate = volume ÷ time.","90 mL ÷ 30 s.","3.0 mL/s."]},{"id":"r3","goal":4,"star":true,"prompt":"2NO(g) + O₂(g) → 2NO₂(g). NO₂ forms at 0.050 mol/(L·s). Rate of O₂ use?","_a":"AU0CBQ0=","unit":"mol/(L·s)","display":"0.025 mol/(L·s)","why":"One O₂ is used for every two NO₂ formed: 0.050 ÷ 2.","wrong":[{"match":0.05,"fb":"In N₂ + 3H₂ → 2NH₃, H₂ is used 3 times as fast as N₂, and NH₃ forms twice as fast as N₂ is used."},{"match":0.1,"fb":"In N₂ + 3H₂ → 2NH₃, H₂ is used 3 times as fast as N₂, and NH₃ forms twice as fast as N₂ is used."}],"hints":["Compare coefficients: O₂ 1, NO₂ 2.","O₂ is used at half the rate NO₂ forms.","0.050 ÷ 2 = 0.025 mol/(L·s)."]},{"id":"r4","goal":3,"star":true,"prompt":"A tangent drawn at \u003ci>t\u003c/i> = 20 s passes through (10 s, 0.600 mol/L) and (30 s, 0.200 mol/L). Instantaneous rate at 20 s?","use":"\u003cstrong>Model data\u003c/strong> for A → products: \u003cspan class=\"nw\">\u003ci>t\u003c/i> (s): 0, 10, 20, 30, 40, 50, 60;\u003c/span> \u003cspan class=\"nw\">[A] (mol/L): 0.900, 0.625, 0.400, 0.225, 0.100, 0.025, 0.000\u003c/span>","_a":"AU0CBQ==","unit":"mol/(L·s)","display":"0.020 mol/(L·s)","why":"Tangent slope (0.200 − 0.600) ÷ (30 − 10) = −0.020, so the rate is 0.020 mol/(L·s).","wrong":[{"match":0.025,"fb":"That’s an average from 0. Instantaneous rate is the slope of the \u003cstrong>tangent\u003c/strong> at that moment, not an average from the start."},{"match":-0.02,"fb":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>."}],"hints":["Instantaneous rate is the tangent’s slope, reported as a positive number.","Slope = (0.200 − 0.600) ÷ (30 − 10) = −0.400 ÷ 20.","0.020 mol/(L·s)."]},{"id":"r5","goal":6,"star":true,"prompt":"Experiment model: the standard run takes 30 s to collect 60 mL. How long at 2.00 mol/L and 40 °C with the same large chips?","_a":"Ak0FAg==","tol":0.001,"unit":"s","display":"3.75 s","why":"×2 × ×4 = ×8: 16 mL/s, and 60 ÷ 16 = 3.75 s.","wrong":[{"match":15,"fb":"Two changes: ×2 and ×4."},{"match":7.5,"fb":"Concentration doubles it too."}],"hints":["Find each factor: 2.00 mol/L gives ×2; 40 °C gives ×4.","Rate = 2.0 × 2 × 4 = 16 mL/s.","60 ÷ 16 = 3.75 s."]},{"id":"r6","goal":1,"star":true,"prompt":"A flask loses 0.88 g of CO₂ in 40 s. Average rate in mol/s? (CO₂ = 44.0 g/mol)","_a":"AU0CBwgF","tol":0.00001,"unit":"mol/s","display":"5.0 × 10⁻⁴ mol/s","why":"0.88 ÷ 40 = 0.022 g/s, and 0.022 ÷ 44.0 = 0.00050 mol/s.","wrong":[{"match":0.022,"fb":"That’s g/s; divide by 44.0."},{"match":0.02,"fb":"0.88 ÷ 44.0 = 0.020 mol in \u003cstrong>40 s\u003c/strong>."}],"hints":["Rate in g/s first: 0.88 ÷ 40.","0.022 g/s.","0.022 ÷ 44.0 = 0.00050 mol/s."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Petra","goal":[1,4,5],"instruction":"Petra made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find the average rate of A’s use over the first 20 s.","steps":["[A] falls from 0.900 to 0.400 mol/L in 20 s.","Δ[A] = 0.400 − 0.900 = −0.500 mol/L.","Rate = Δ[A] ÷ Δ\u003ci>t\u003c/i> = −0.500 ÷ 20 = −0.025 mol/(L·s).","So the reaction has a negative rate."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"Rate = Δ\u003ci>t\u003c/i> ÷ Δ[A] = −40.","why":"Rate is change per time.","_n":"1k482","_k":"93320e63"},{"t":"Use Δ\u003ci>t\u003c/i> = 40 s.","why":"The interval is 20 s.","_n":"1l412","_k":"05193d7d"},{"t":"Step 3 is correct.","why":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>.","_n":"1m422","_k":"91033f1f"},{"t":"For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i> = +0.025 mol/(L·s).","why":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>.","_n":"1nbb2","_k":"8e88fb4d"}],"hints":["Can a rate be negative?","Reactant rates use a minus sign.","+0.025."]},{"id":"e2","goal":4,"task":"N₂ + 3H₂ → 2NH₃. NH₃ forms at 0.10 mol/(L·s). How fast is H₂ used?","steps":["The coefficients are 1, 3 and 2.","H₂ has the biggest coefficient, so divide by 3: 0.10 ÷ 3 = 0.033 mol/(L·s).","So H₂ is used more slowly than NH₃ forms."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 follows from step 2."],"fixes":[{"t":"Step 2 is correct.","why":"In N₂ + 3H₂ → 2NH₃, H₂ is used 3 times as fast as N₂, and NH₃ forms twice as fast as N₂ is used.","_n":"1oba2","_k":"3126bf84"},{"t":"Rates are equal for all species: 0.10.","why":"In N₂ + 3H₂ → 2NH₃, H₂ is used 3 times as fast as N₂, and NH₃ forms twice as fast as N₂ is used.","_n":"1pbd2","_k":"0ceaa212"},{"t":"3 mol H₂ per 2 mol NH₃: 0.10 × 3/2 = 0.15 mol/(L·s).","why":"H₂ is used 3/2 times as fast as NH₃ forms.","_n":"1qbc2","_k":"b41668f3"},{"t":"0.10 × 3 = 0.30.","why":"Divide by NH₃’s coefficient, 2, too.","_n":"1rb72","_k":"c8e681b7"}],"hints":["Ratio of H₂ to NH₃?","3 : 2.","0.15."]},{"id":"e3","goal":5,"task":"Test how temperature affects the rate of marble chips + acid.","steps":["Run 1: 1.00 mol/L acid, large chips, 20 °C. 60 mL took 30 s.","Run 2: 2.00 mol/L acid, large chips, 30 °C.","60 mL took 7.5 s: four times as fast.","So a 10 °C rise makes this reaction four times as fast."],"_a":"AA==","stepFb":["Step 1 is a sound baseline.","","The timing is fine; the design isn’t.","This conclusion depends on step 2."],"fixes":[{"t":"Run it at 40 °C instead.","why":"Still two changes.","_n":"1sb62","_k":"b08c5e93"},{"t":"Step 2 is correct.","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"1tb92","_k":"dfc993df"},{"t":"Use powder in run 2 as well.","why":"That adds another change. Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"1ub82","_k":"6634a40b"},{"t":"Keep the acid at 1.00 mol/L and change only the temperature.","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"1vc32","_k":"cef78387"}],"hints":["How many settings changed between runs?","Two: concentration and temperature.","Change only one."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the lab: how much powder sped things up, or how the rate fell during the reaction?"},{"id":"j2","q":"In your own words, explain the difference between an average and an instantaneous rate."},{"id":"j3","q":"Explain to a friend how to design a fair test of one factor."},{"id":"j4","q":"Which part is still shaky: units, coefficients or tangents? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which unit fits a rate measured as a change in concentration?","options":[{"t":"mol/L","why":"That’s a concentration, not a rate.","_n":"1wc22","_k":"2da086dc"},{"t":"s/mol","why":"Time per amount is inverted.","_n":"1xb52","_k":"08438787"},{"t":"L/(mol·s)","why":"Inverted.","_n":"1yb62","_k":"28ed57b9"},{"t":"mol/(L·s)","why":"Concentration (mol/L) per second.","_n":"1zb32","_k":"ea480a18"}]},"b":{"prompt":"Which unit fits a rate measured with a gas syringe?","options":[{"t":"mL/s","why":"Volume per second.","_n":"20b42","_k":"cabc341c"},{"t":"mL","why":"That’s a volume.","_n":"21b92","_k":"87c82f47"},{"t":"mol/L","why":"That’s a concentration.","_n":"22ba2","_k":"fe6b8a94"},{"t":"s/mL","why":"Inverted.","_n":"23b72","_k":"85d02803"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"For marble chips in acid, which change does \u003cstrong>not\u003c/strong> increase the rate?","options":[{"t":"Using larger chips of the same total mass","why":"Less surface exposed. The same mass cut into smaller pieces exposes far more surface.","_n":"24b82","_k":"44988004"},{"t":"Using more concentrated acid","why":"That increases the rate.","_n":"25bd2","_k":"a01dc76a"},{"t":"Grinding the chips to powder","why":"That increases surface area.","_n":"26be2","_k":"11f18f34"},{"t":"Warming the acid","why":"That increases the rate.","_n":"27473","_k":"a6a76a82"}]},"b":{"prompt":"Which change increases the rate of hydrogen peroxide decomposition, and is still present unchanged afterwards?","options":[{"t":"Adding a pinch of manganese(IV) oxide","why":"A catalyst. A catalyst speeds the reaction and is still there at the end; the products are the same.","_n":"28463","_k":"168e1d9b"},{"t":"Removing the oxygen produced","why":"That doesn’t change the forward rate.","_n":"29453","_k":"8fd7116e"},{"t":"Adding water","why":"Dilution slows it.","_n":"2a443","_k":"4a196f6f"},{"t":"Cooling the solution","why":"Cooling slows it.","_n":"2b4b3","_k":"a5eda82a"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"The instantaneous rate at a given time is the slope of…","options":[{"t":"the line from the origin to the final point","why":"Instantaneous rate is the slope of the \u003cstrong>tangent\u003c/strong> at that moment, not an average from the start.","_n":"2c4a3","_k":"c22ea2fc"},{"t":"the curve’s highest point","why":"Rate is a slope, not a height.","_n":"2d493","_k":"dc502a57"},{"t":"the tangent to the curve at that time","why":"A tangent touches the curve at that one moment.","_n":"2e483","_k":"a4fb5704"},{"t":"the secant from the start to that time","why":"Instantaneous rate is the slope of the \u003cstrong>tangent\u003c/strong> at that moment, not an average from the start.","_n":"2f3f3","_k":"c5d6c56f"}]},"b":{"prompt":"The average rate over an interval is the slope of…","options":[{"t":"the tangent at the start","why":"A tangent gives an instantaneous rate, not an average.","_n":"2g3e3","_k":"dbecf819"},{"t":"the \u003ci>y\u003c/i>-axis","why":"Not a slope.","_n":"2h412","_k":"c9afc6e0"},{"t":"the secant joining the two ends of the interval","why":"An average uses the change over the whole interval.","_n":"2i422","_k":"fc4faa3d"},{"t":"the tangent at the end","why":"A tangent gives an instantaneous rate, not an average.","_n":"2j432","_k":"4e5c6bb0"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"Model data: [A] = 0.400 mol/L at 20 s and 0.100 mol/L at 40 s. Average rate of A’s use over 20–40 s?","options":[{"t":"0.0075 mol/(L·s)","why":"The interval is 20 s, not 40 s.","_n":"2k442","_k":"d073ac4e"},{"t":"0.015 mol/(L·s)","why":"0.300 ÷ 20.","_n":"2l452","_k":"54b331c3"},{"t":"−0.015 mol/(L·s)","why":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>.","_n":"2m462","_k":"56f3964a"},{"t":"0.300 mol/(L·s)","why":"Divide by Δ\u003ci>t\u003c/i>.","_n":"2n472","_k":"a0e1f320"}]},"b":{"prompt":"Model data: [A] = 0.900 mol/L at 0 s and 0.100 mol/L at 40 s. Average rate over 0–40 s?","options":[{"t":"0.020 mol/(L·s)","why":"0.800 ÷ 40.","_n":"2o482","_k":"d9a56e59"},{"t":"0.800 mol/(L·s)","why":"Divide by Δ\u003ci>t\u003c/i>.","_n":"2p392","_k":"ace94625"},{"t":"0.040 mol/(L·s)","why":"The interval is 40 s.","_n":"2q3a2","_k":"21a52c88"},{"t":"−0.020 mol/(L·s)","why":"Rates are positive. For a reactant, rate = −Δ[A] ÷ Δ\u003ci>t\u003c/i>.","_n":"2r7cc","_k":"1615d882"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"2H₂O₂(aq) → 2H₂O(l) + O₂(g). H₂O₂ is used at 0.060 mol/(L·s). At what rate does O₂ form?","options":[{"t":"0.030 mol/(L·s)","why":"1 O₂ per 2 H₂O₂.","_n":"2s7dc","_k":"5f324933"},{"t":"0.020 mol/(L·s)","why":"The ratio is 1 : 2, not 1 : 3.","_n":"2t7ec","_k":"9410cfee"},{"t":"0.060 mol/(L·s)","why":"The coefficients differ. 1 O₂ forms per 2 H₂O₂ used.","_n":"2u7fc","_k":"294ba3a0"},{"t":"0.120 mol/(L·s)","why":"Multiplied instead of divided.","_n":"2v80c","_k":"90bf5f94"}]},"b":{"prompt":"N₂(g) + 3H₂(g) → 2NH₃(g). N₂ is used at 0.020 mol/(L·s). At what rate does NH₃ form?","options":[{"t":"0.010 mol/(L·s)","why":"Divided instead of multiplied. In N₂ + 3H₂ → 2NH₃, H₂ is used 3 times as fast as N₂, and NH₃ forms twice as fast as N₂ is used.","_n":"2w81c","_k":"13537d1c"},{"t":"0.020 mol/(L·s)","why":"In N₂ + 3H₂ → 2NH₃, H₂ is used 3 times as fast as N₂, and NH₃ forms twice as fast as N₂ is used.","_n":"2x82c","_k":"b5085298"},{"t":"0.060 mol/(L·s)","why":"That’s H₂’s rate.","_n":"2y83c","_k":"7c855340"},{"t":"0.040 mol/(L·s)","why":"2 NH₃ per N₂.","_n":"2z84c","_k":"1c57ea6f"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"On the model concentration graph, the tangent at 40 s passes through (30 s, 0.200 mol/L) and (50 s, 0.000 mol/L). Instantaneous rate at 40 s?","options":[{"t":"0.0025 mol/(L·s)","why":"[A] ÷ \u003ci>t\u003c/i> isn’t a slope. Instantaneous rate is the slope of the \u003cstrong>tangent\u003c/strong> at that moment, not an average from the start.","_n":"3085c","_k":"f5205b3c"},{"t":"0.020 mol/(L·s)","why":"That’s the rate at 20 s.","_n":"3182c","_k":"28dd8a66"},{"t":"0.005 mol/(L·s)","why":"That’s the secant from 40 to 60 s. Instantaneous rate is the slope of the \u003cstrong>tangent\u003c/strong> at that moment, not an average from the start.","_n":"3281c","_k":"99ee666e"},{"t":"0.010 mol/(L·s)","why":"0.200 ÷ 20.","_n":"3380c","_k":"30ca7fd9"}]},"b":{"prompt":"On the gas graph, the tangent at 15 s passes through (5 s, 22.5 mL) and (25 s, 82.5 mL). Instantaneous rate at 15 s?","options":[{"t":"60 mL/s","why":"Divide by the 20 s run.","_n":"347fc","_k":"d4fcec5a"},{"t":"3.5 mL/s","why":"52.5 ÷ 15 is the average since the start. Instantaneous rate is the slope of the \u003cstrong>tangent\u003c/strong> at that moment, not an average from the start.","_n":"3586c","_k":"785cc796"},{"t":"3.0 mL/s","why":"60.0 ÷ 20.","_n":"3685c","_k":"f6f5c141"},{"t":"4.0 mL/s","why":"That’s the starting rate.","_n":"3784c","_k":"aeb5f8f6"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why a reaction slows down as it proceeds?","options":[{"t":"“The products block the reaction.”","why":"Not generally.","_n":"3883c","_k":"3c2e0da6"},{"t":"“Reactants are used up, so their concentration falls and reacting particles meet less often.”","why":"As reactants are used up, collisions get rarer and the rate falls.","_n":"398ac","_k":"df6e70c6"},{"t":"“Rates are always constant; it only looks slower.”","why":"As reactants are used up, collisions get rarer and the rate falls.","_n":"3a89c","_k":"21df0649"},{"t":"“The reaction gets tired.”","why":"Particles don’t tire.","_n":"3b88c","_k":"2095dccf"}]},"b":{"prompt":"Which is the best explanation of why powdered marble reacts faster than chips of the same mass?","options":[{"t":"“Powder exposes much more surface, so many more acid particles can reach the solid at once.”","why":"The same mass cut into smaller pieces exposes far more surface.","_n":"3c89c","_k":"891b34e4"},{"t":"“Powder contains more CaCO₃.”","why":"Same mass, same amount. The same mass cut into smaller pieces exposes far more surface.","_n":"3d86c","_k":"b53f1f87"},{"t":"“Powder is a catalyst.”","why":"Powder is a reactant, and it gets used up. A catalyst speeds the reaction and is still there at the end; the products are the same.","_n":"3e87c","_k":"12aacf9f"},{"t":"“Powder is hotter.”","why":"Same temperature.","_n":"3f84c","_k":"76f712b7"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which plan is a fair test of how acid concentration affects the rate?","options":[{"t":"“Change concentration and temperature together to see a bigger effect.”","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"3g85c","_k":"1997c37f"},{"t":"“Same chip mass and size, same temperature, same acid volume; change only the acid concentration and time how long 60 mL of gas takes.”","why":"Only one variable changes, and the rest are controlled.","_n":"3h82c","_k":"e88c471c"},{"t":"“Use chips for one run and powder for another.”","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"3i83c","_k":"a17c6d47"},{"t":"“Use whatever chips are available each time.”","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"3j90c","_k":"d17f344c"}]},"b":{"prompt":"In two runs, a student changed both the temperature and the concentration, and the rate quadrupled. Which conclusion is best supported?","options":[{"t":"“Temperature caused the whole increase.”","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"3k91c","_k":"cdacf688"},{"t":"“Concentration caused the whole increase.”","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"3l8ec","_k":"69e3da00"},{"t":"“No conclusion about either factor alone can be drawn, because two variables changed.”","why":"Change only the factor you’re testing; otherwise you can’t tell which change caused the effect.","_n":"3m8dc","_k":"f737d20b"},{"t":"“Each factor doubled the rate.”","why":"Plausible, but these data can’t show it.","_n":"3n90c","_k":"a6a981d0"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Experiment model: the standard run (1.00 mol/L, large chips, 20 °C) takes 30 s to collect 60 mL. How long at 40 °C with everything else the same?","options":[{"t":"60 s","why":"Warmer is faster.","_n":"3o8fc","_k":"3f9fa1d8"},{"t":"7.5 s","why":"+20 °C gives ×4.","_n":"3p92c","_k":"68ae1b1b"},{"t":"120 s","why":"Warmer is faster.","_n":"3q91c","_k":"4b56c5ba"},{"t":"15 s","why":"That’s +10 °C.","_n":"3r94c","_k":"89cd1500"}]},"b":{"prompt":"Same model: how long with 0.50 mol/L acid at 30 °C and large chips?","options":[{"t":"30 s","why":"×½ × ×2 = ×1.","_n":"3s93c","_k":"169b8aa9"},{"t":"7.5 s","why":"That’s ×4.","_n":"3t86c","_k":"2e2d19b7"},{"t":"60 s","why":"The warming helps too.","_n":"3u85c","_k":"4a49bfe1"},{"t":"15 s","why":"Halving the concentration cancels the warming.","_n":"3v14c","_k":"24762734"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Why do some medicines carry the label “store in the refrigerator”?","options":[{"t":"Refrigerators remove oxygen","why":"They don’t.","_n":"3w15c","_k":"3a572bc8"},{"t":"Cold makes the medicine stronger","why":"It slows decomposition; the medicine doesn’t get stronger.","_n":"3x16c","_k":"191e6e0c"},{"t":"Lower temperature slows the reactions that break the medicine down","why":"Cold slows decomposition, so the medicine lasts longer.","_n":"3y17c","_k":"b7269873"},{"t":"Cold stops all chemical reactions","why":"It slows them.","_n":"3z10c","_k":"630a8794"}]},"b":{"prompt":"Why can laundry detergents with enzymes clean well in cold water?","options":[{"t":"The enzymes heat the water","why":"They don’t release significant heat.","_n":"4011c","_k":"60b56066"},{"t":"Cold water has more surface area","why":"Surface area belongs to solids.","_n":"4112c","_k":"fde9fd54"},{"t":"Enzymes are used up as fuel","why":"A catalyst speeds the reaction and is still there at the end; the products are the same.","_n":"4213c","_k":"9a66e232"},{"t":"The enzymes are catalysts that speed up stain-breaking reactions even at low temperature","why":"Enzymes are biological catalysts.","_n":"430cc","_k":"285a7577"}]}}]},"task":{"title":"Hit 15 seconds","summary":"Hit 15 seconds","statement":"\u003cp>Using the experiment model, choose conditions so that 60 mL of CO₂ is collected in exactly 15 s, while meeting the safety rules. Can you find all the answers?\u003c/p>\u003cp class=\"tiny muted\">There are 36 combinations of acid concentration, chip size and temperature. Rate = 2.0 mL/s × (\u003ci>c\u003c/i> ÷ 1.00) × size factor × 2\u003csup>(\u003ci>T\u003c/i> − 20) ÷ 10\u003c/sup> (model data).\u003c/p>","checks":["60 mL in exactly 15 s","Temperature at most 30 °C","No powder (it foams over)","Acid at most 1.00 mol/L"],"tips":["15 s for 60 mL means 4.0 mL/s, twice the standard rate.","You need an overall factor of ×2.","Each factor: concentration ×½, ×1 or ×2; chips ×1 or ×2; temperature ×½, ×1 or ×2 (up to 30 °C).","Try one ×2 change, or a ×½ balanced by ×4… but ×4 needs 40 °C."],"explainPrompt":"Explain how each set
