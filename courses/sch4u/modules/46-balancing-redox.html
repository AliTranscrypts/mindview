₄²⁻?","options":[{"t":"0","why":"+6 + (−6).","_n":"g94d","_k":"68faa01c"},{"t":"+12","why":"Multiply each charge by its count, then add with signs.","_n":"h95d","_k":"3437d309"},{"t":"−6","why":"You left out the +6.","_n":"i96d","_k":"95e82ddf"},{"t":"+1","why":"3 − 2 per pair ignores the coefficients.","_n":"j1fd","_k":"b673df04"}],"hints":["Charge × coefficient.","2(+3) = +6; 3(−2) = −6.","0."]},{"id":"w6","skill":"Charge sums","goal":2,"prompt":"What is the total charge of MnO₄⁻ + 8H⁺?","options":[{"t":"−7","why":"8H⁺ is +8.","_n":"k1ed","_k":"55e79cf2"},{"t":"+9","why":"MnO₄⁻ is −1, not +1.","_n":"l21d","_k":"869d8198"},{"t":"+8","why":"You left out MnO₄⁻’s −1.","_n":"m20d","_k":"e845e684"},{"t":"+7","why":"−1 + 8.","_n":"n23d","_k":"ff12fdab"}],"hints":["Add each species’ charge.","−1 and +8.","+7."]}],"refreshers":{"Oxidation numbers":"Assign them with module 45’s rules. A rise means oxidation (electrons lost); a fall means reduction (electrons gained).","Balancing equations":"Change coefficients, never subscripts. Balance the element that appears in the fewest species first.","Charge sums":"Total charge = Σ (coefficient × charge). Neutral molecules count as 0."}}},"explore":{"heading":"Half-reaction balancer","intro":"Choose a reaction, then choose each step from the menu and enter the numbers. The tallies tell you when atoms and charge balance.","how":"Pick a reaction and a method. In \u003cstrong>Half-reaction\u003c/strong>, tap a step, fill its number boxes (how many, and on which side), then press \u003cstrong>Apply\u003c/strong>. In \u003cstrong>Oxidation number\u003c/strong>, enter the multipliers, then finish O and H.","reactions":[{"id":"e1","t":"E1: Cu(s) + Ag⁺(aq) → Cu²⁺(aq) + Ag(s)"},{"id":"e2","t":"E2: MnO₄⁻(aq) + Fe²⁺(aq) → Mn²⁺(aq) + Fe³⁺(aq) (acidic)"},{"id":"e3","t":"E3: Cr₂O₇²⁻(aq) + I⁻(aq) → Cr³⁺(aq) + I₂(aq) (acidic)"},{"id":"e4","t":"E4: MnO₄⁻(aq) + I⁻(aq) → MnO₂(s) + I₂(aq) (basic)"},{"id":"e5","t":"E5: Al(s) + Cu²⁺(aq) → Al³⁺(aq) + Cu(s)"}],"methods":[{"id":"half","t":"Half-reaction"},{"id":"on","t":"Oxidation number"}],"steps":[{"id":"split","t":"Split into half-reactions"},{"id":"atoms","t":"Balance atoms other than O and H"},{"id":"water","t":"Add H₂O to balance O"},{"id":"hplus","t":"Add H⁺ to balance H"},{"id":"elec","t":"Add e⁻ to balance charge"},{"id":"mult","t":"Multiply to equalize electrons"},{"id":"add","t":"Add the halves and cancel"},{"id":"oh","t":"Convert to basic: add OH⁻","basicOnly":true},{"id":"check","t":"Check"}],"stepFb":{"needSplit":"Split the reaction into its oxidation and reduction half-reactions first.","needAtoms":"Balance the atoms other than O and H first.","hBeforeW":"Balance O first; the water you add brings H with it.","eBeforeH":"Charge can’t be balanced until every species is in place.","multEarly":"Each half must balance on its own first.","addEarly":"{g} e⁻ gained but {l} lost: multiply first.","eSide":"Electrons go on the side with the \u003cstrong>greater positive\u003c/strong> charge.","ohEarly":"First balance it as if it were acidic: add the halves.","checkEarly":"Add the halves first, then check.","demo":"This reaction holds the worked example from a prediction. Press \u003cstrong>Start again\u003c/strong> and balance it yourself."},"predictions":[{"id":"p1","prompt":"Is Cu + Ag⁺ → Cu²⁺ + Ag balanced?","options":[{"t":"Yes: there are no electrons to balance","_n":"o22d","_k":"2705236c"},{"t":"No: the atoms don’t match","_n":"p25d","_k":"edf24070"},{"t":"No: the charge is +1 on the left and +2 on the right","_n":"q24d","_k":"dab59207"},{"t":"Yes: the atoms match","_n":"r17d","_k":"89a9d8cd"}],"explain":"Cu + 2Ag⁺ → Cu²⁺ + 2Ag: +2 = +2. Two electrons move from one Cu to two Ag⁺."},{"id":"p2","prompt":"E2’s reduction half after the atoms step: MnO₄⁻ → Mn²⁺. How many H₂O, and on which side, balance the O?","options":[{"t":"4 on the left","_n":"s16d","_k":"f2ea6b21"},{"t":"8 on the right","_n":"t19d","_k":"a53c2691"},{"t":"4 on the right","_n":"u1ad","_k":"847c  = +6.","msgs":{"cr1":"Balance Cr first: two Cr on the left.","e3":"Each Cr gains 3, and there are 2 Cr: 6 e⁻.","i2":"Each I₂ needs 2 e⁻ lost; you need 6 lost: ×3."},"hints":["Balance Cr, then O (7H₂O), then H (14H⁺).","Charge: +12 on the left, +6 on the right, so add 6e⁻ on the left.","2I⁻ → I₂ + 2e⁻, times 3."]},{"id":"tc3","goal":4,"rx":"e4","_a":"Rgt7CClVHEFPGQAvS0EaQVBxBClGTA9BVnRYKVRBGkFXcARGTUEJLiwUFA==","stretch":true,"prompt":"Balance E4 in \u003cstrong>basic\u003c/strong> solution, in lowest terms.","why":"2MnO₄⁻ + 6I⁻ + 4H₂O → 2MnO₂ + 3I₂ + 8OH⁻: atoms equal, and −8 = −8.","msgs":{"hplus":"Basic solution has no H⁺: add OH⁻ to both sides.","water":"Cancel the water that appears on both sides.","ohLeft":"The OH⁻ that combined with H⁺ became water. The OH⁻ you added to the right is what stays."},"hints":["First balance it as if it were acidic.","2MnO₄⁻ + 6I⁻ + 8H⁺ → 2MnO₂ + 3I₂ + 4H₂O.","Add 8OH⁻ to both sides; 8H⁺ + 8OH⁻ → 8H₂O; cancel 4H₂O."]}],"chalMsgs":{"pick":"Choose {rx} in the reaction chips first.","unfinishedHalf":"Finish the balance: add the halves so the overall equation shows.","unfinishedOn":"Enter both multipliers first.","lowest":"Balanced, but not in lowest terms: divide every coefficient by {k}.","general":"Not yet. Check each half’s atoms and charge, then add again."}},"part3":{"slug":"special","name":"Special cases","heading":"Special cases","intro":"The balancer handles typical reactions. These four stations show the cases that confuse students: one species with two jobs, ions that just watch, a colour you can count, and the breath test. A “Check it with data” panel totals atoms and charge for each result.","s1":{"title":"Station 1: One species, two jobs (disproportionation)","intro":"Flip each card to reveal a half-reaction.","sets":[{"id":"pe","name":"Hydrogen peroxide decomposing","cards":[{"front":"Reduction half","back":"H2O2 + 2H+ + 2e- -> 2H2O","note":"reduction: O −1 → −2"},{"front":"Oxidation half","back":"H2O2 -> O2 + 2H+ + 2e-","note":"oxidation: O −1 → 0"},{"front":"Sum","back":"2H2O2 -> 2H2O + O2","note":"the 2H⁺ and 2e⁻ cancel"}]},{"id":"cu","name":"Copper(I) in water","cards":[{"front":"Reduction half","back":"Cu+ + e- -> Cu","note":"reduction: Cu +1 → 0"},{"front":"Oxidation half","back":"Cu+ -> Cu^2+ + e-","note":"oxidation: Cu +1 → +2"},{"front":"Sum","back":"2Cu+ -> Cu + Cu^2+","note":"one electron moves from one Cu⁺ to another"}]}],"q":"Which species is the oxidizing agent in 2H₂O₂ → 2H₂O + O₂?","opts":[{"t":"H₂O₂","fb":"Right. H₂O₂ is also the reducing agent: the same species is both agents.","_n":"14aae","_k":"a21b6280"},{"t":"H₂O","fb":"H₂O is a product. Look at the reactant whose O changes.","_n":"15a9e","_k":"2489caf2"},{"t":"O₂","fb":"O₂ is a product. Look at the reactant whose O changes.","_n":"16a8e","_k":"7078a834"}],"data":"\u003cp>2H₂O₂ → 2H₂O + O₂: H 4 = 4 · O 4 = 2 + 2 · charge 0 = 0.\u003c/p>\u003cp>2Cu⁺ → Cu + Cu²⁺: Cu 2 = 2 · charge +2 = +2.\u003c/p>"},"s2":{"title":"Station 2: Spectator ions","intro":"Potassium permanganate, KMnO₄, reacts with iron(II) sulfate, FeSO₄, in acid. Written as ions, the equation is below. Tap the ions that don’t change.","full":"Full formulas: KMnO₄(aq) and FeSO₄(aq), with acid for H⁺","tiles":[{"id":"k1","sp":"K+","side":"L","spec":"k"},{"id":"mn1","sp":"MnO4-","side":"L","why":"Mn changes: +7 → +2."},{"id":"fe1","sp":"5Fe^2+","side":"L","why":"Fe changes: +2 → +3."},{"id":"s1","sp":"5SO4^2-","side":"L","spec":"s"},{"id":"h1","sp":"8H+","side":"L","why":"H⁺ is used up: it ends in water, so it belongs in the net equation."},{"id":"k2","sp":"K+","side":"R","spec":"k"},{"id":"mn2","sp":"Mn^2+","side":"R","why":"Mn changes: +7 → +2."},{"id":"fe2","sp":"5Fe^3+","side":"R","why":"Fe changes: +2 → +3."},{"id":"s2","sp":"5SO4^2-","side":"R","spec":"s"},{"id":"w2","sp":"4H2O","side":"R","why":"Water forms in the reaction, so it belongs in the net equation."}],"good":{"k":"K⁺ is the same on both sides.","s":"SO₄²⁻ is the same on both sides."},"done":"Spectator ions don’t change oxidation number, so they’re left out of half-reactions.","net":"MnO4- + 5Fe^2+ + 8H+ -> Mn^2+ + 5Fe^3+ + 4H2O"},"s3":{"title":"Station 3: A colour you can count (investigation)","intro":"The flask holds Fe²⁺ (pale green). Add purple MnO₄⁻ from the burette. While Fe²⁺ remains, each drop loses its colour. At the end point the first drop stays pink.","endV":18,"q":"18.0 mL of MnO₄⁻ solution reacted, containing 0.000 90 mol MnO₄⁻. How many mol of Fe²⁺ were in the flask?","_a":"VBcGVlJU","good":"5 × 0.000 90 = 0.004 5 mol.","bad":"Use the 1 : 5 mole ratio from the balanced equation: mol Fe²⁺ = 5 × mol MnO₄⁻.","div":"Multiply by 5; don’t divide."},"s4":{"title":"Station 4: The breath test (STSE)","intro":"Older roadside breath testers passed breath through acidified orange dichromate. Ethanol reduced it to green Cr³⁺.","colours":"Cr₂O₇²⁻ is orange; Cr³⁺ is green.","task":"Fill in the coefficients with the balancer’s method, then press Check.","item":{"id":"bt","L":["Cr2O7^2-","C2H5OH","H+"],"R":["Cr^3+","CH3COOH","H2O"],"med":[],"_a":"Rgt1FFQuBj9WFBZNRlJyUywMeS5GShFQUnEdRktfEVUnS2hVTUEaQVd6flUlLn4pRBIWV1cpAy5G","display":"2Cr₂O₇²⁻ + 3C₂H₅OH + 16H⁺ → 4Cr³⁺ + 3CH₃COOH + 11H₂O","wrong":[{"sp":"H+","side":"L","n":28,"fb":"The ethanol half releases 12H⁺: 28 − 12 = 16."}],"hints":["Ethanol half: C₂H₅OH + H₂O → CH₃COOH + 4H⁺ + 4e⁻.","Dichromate half: 6e⁻. The LCM of 4 and 6 is 12, so ×3 and ×2.","Add, then cancel 12H⁺ and 3H₂O."]},"note":"Today’s devices mostly use fuel cells, which module 48 covers."},"quickCheck":{"title":"Quick check","summary":"Special cases quick check","items":[{"id":"q1","goal":5,"prompt":"In 2H₂O₂ → 2H₂O + O₂, which element is both oxidized and reduced?","choices":[{"t":"H","fb":"O goes −1 → −2 in water and −1 → 0 in O₂.","_n":"17a7e","_k":"b62835fa"},{"t":"Both","fb":"O goes −1 → −2 in water and −1 → 0 in O₂.","_n":"18a6e","_k":"c055b1d0"},{"t":"Neither","fb":"O goes −1 → −2 in water and −1 → 0 in O₂.","_n":"19a5e","_k":"9a596202"},{"t":"O","fb":"Right. O goes −1 → −2 in water and −1 → 0 in O₂.","_n":"1aa4e","_k":"9a1dfcd4"}]},{"id":"q2","goal":5,"prompt":"Which ions are spectators when KMnO₄ oxidizes FeSO₄?","choices":[{"t":"H⁺ and H₂O","fb":"Their oxidation numbers don’t change: look for the ions that are the same on both sides.","_n":"1ba3e","_k":"e7ce6aeb"},{"t":"None","fb":"Their oxidation numbers don’t change: look for the ions that are the same on both sides.","_n":"1ca2e","_k":"60ce977f"},{"t":"K⁺ and SO₄²⁻","fb":"Right. Their oxidation numbers don’t change.","_n":"1d25e","_k":"17b1e675"},{"t":"Mn and Fe","fb":"Their oxidation numbers don’t change: look for the ions that are the same on both sides.","_n":"1e26e","_k":"a56f5af8"}]},{"id":"q3","goal":6,"prompt":"MnO₄⁻ + 5Fe²⁺ + 8H⁺ → …: how many mol of Fe²⁺ react with 0.0010 mol MnO₄⁻?","choices":[{"t":"0.0002","fb":"Use the 1 : 5 mole ratio from the balanced equation.","_n":"1f27e","_k":"0b51e3ca"},{"t":"0.0010","fb":"Use the 1 : 5 mole ratio from the balanced equation.","_n":"1g28e","_k":"b3864b44"},{"t":"0.0050","fb":"Right. Use the 1 : 5 mole ratio from the balanced equation.","_n":"1h21e","_k":"a9b14895"},{"t":"0.0080","fb":"Use the 1 : 5 mole ratio from the balanced equation.","_n":"1i22e","_k":"7d51d1d0"}]},{"id":"q4","goal":6,"prompt":"\u003cstrong>Investigation:\u003c/strong> Why is the titration’s end point the first drop that stays pink?","choices":[{"t":"Mn²⁺ is pink","fb":"MnO₄⁻ is purple and Mn²⁺ is nearly colourless, so purple stays only when nothing is left to reduce it.","_n":"1j23e","_k":"592c400a"},{"t":"Fe³⁺ is pink","fb":"MnO₄⁻ is purple and Mn²⁺ is nearly colourless, so purple stays only when nothing is left to reduce it.","_n":"1k24e","_k":"1aad5c84"},{"t":"All the Fe²⁺ is used up, so extra MnO₄⁻ isn’t reduced","fb":"Right. MnO₄⁻ is purple and Mn²⁺ is nearly colourless, so purple stays only when nothing is left to reduce it.","_n":"1l1de","_k":"481663c5"},{"t":"The solution warms up","fb":"MnO₄⁻ is purple and Mn²⁺ is nearly colourless, so purple stays only when nothing is left to reduce it.","_n":"1m1ee","_k":"06f74fbe"}]}]}},"practice":{"activities":[{"id":"steps","type":"order","title":"Steps in order","summary":"Steps in order","goal":[1,4],"instruction":"Put the steps of each method in order.","sequences":[{"id":"s1","goal":1,"prompt":"Acidic solution (7 steps).","steps":["Split into oxidation and reduction half-reactions.","Balance atoms other than O and H.","Balance O by adding H₂O.","Balance H by adding H⁺.","Balance charge by adding e⁻.","Multiply so electrons lost = electrons gained.","Add, cancel, and check atoms and charge."],"start":[4,1,6,3,0,5,2],"wrong":[{"order":[0,1,2,4,3,5,6],"fb":"Charge can’t be balanced until every species is in place."},{"order":[0,5,1,2,3,4,6],"fb":"Each half must balance on its own first."},{"order":[5,0,1,2,3,4,6],"fb":"Each half must balance on its own first."},{"order":[0,1,3,2,4,5,6],"fb":"Balance O first; the water you add brings H with it."}],"why":"Atoms, then O with water, then H, then charge with electrons; only then equalize and add.","hints":["Atoms before charge.","O before H, because the water brings H.","Electrons last, then equalize."]},{"id":"s2","goal":4,"prompt":"Basic solution (5 steps).","steps":["Balance as if in acidic solution.","Add one OH⁻ to \u003cstrong>both\u003c/strong> sides for every H⁺.","Combine H⁺ and OH⁻ on the same side into H₂O.","Cancel water that appears on both sides.","Check atoms and charge."],"start":[2,4,0,3,1],"wrong":[{"order":[0,2,1,3,4],"fb":"Add the OH⁻ before you combine anything, and to both sides, or the equation changes."}],"why":"The acidic balance comes first; OH⁻ goes on both sides, turns the H⁺ into water, and the extra water cancels.","hints":["Start from the acidic answer.","What you add to one side you add to the other.","Add OH⁻, combine into water, cancel, then check."]}]},{"id":"balance","type":"custom","title":"Balance it","summary":"Balance it","star":true,"goal":[3,4,5,6],"instruction":"Fill in the coefficients. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type a coefficient in each box (a blank main box counts as 1, a blank H⁺, H₂O or OH⁻ box as 0) and choose the side for H⁺, H₂O and OH⁻. The tally updates as you type. Press Check when it balances.","items":[{"id":"b1","goal":3,"prompt":"Al + Cu²⁺ → Al³⁺ + Cu","L":["Al","Cu^2+"],"R":["Al^3+","Cu"],"med":[],"_a":"Rgt3CkZKEVInTGhUTUEcX0QLdwo4UhpBTxkFJRND","display":"2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu","wrong":[{"eq":"Al + Cu^2+ -> Al^3+ + Cu","fb":"Charge +2 vs +3: electrons lost (3 per Al) must equal gained (2 per Cu²⁺)."}],"hints":["Al → Al³⁺ + 3e⁻; Cu²⁺ + 2e⁻ → Cu.","The LCM of 3 and 2 is 6: ×2 and ×3.","2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu."]},{"id":"b2","goal":3,"prompt":"Fe²⁺ + H₂O₂ → Fe³⁺ + H₂O (acidic)","L":["Fe^2+","H2O2"],"R":["Fe^3+"],"med":["H+","H2O","OH-"],"medium":"acid","_a":"RgtwAzhTGkFPGX5UKVMRSkQLfk1GTA9BVn9TOFVKEUpEC35UKUM=","display":"2Fe²⁺ + H₂O₂ + 2H⁺ → 2Fe³⁺ + 2H₂O","wrong":[{"sp":"H+","n":0,"fb":"The peroxide half needs 2H⁺: H₂O₂ + 2H⁺ + 2e⁻ → 2H₂O."}],"hints":["H₂O₂ + 2H⁺ + 2e⁻ → 2H₂O.","Fe²⁺ → Fe³⁺ + e⁻, times 2.","2Fe²⁺ + H₂O₂ + 2H⁺ → 2Fe³⁺ + 2H₂O."]},{"id":"b3","goal":5,"star":true,"prompt":"Zn + NO₃⁻ → Zn²⁺ + NH₄⁺ (acidic)","L":["Zn","NO3-"],"R":["Zn^2+","NH4+"],"med":["H+","H2O","OH-"],"medium":"acid","_a":"Rg1sCEZKES8rChtGTUEAUSwSFktYQQU7CmcETUZKES8sDR1GTUECKVZ2FA==","display":"4Zn + NO₃⁻ + 10H⁺ → 4Zn²⁺ + NH₄⁺ + 3H₂O","wrong":[{"sp":"H+","side":"L","n":6,"fb":"NH₄⁺ needs 4 H as well as the 6 for 3H₂O: 10H⁺."},{"sp":"Zn","side":"L","n":1,"fb":"N gains 8 e⁻; each Zn gives 2: ×4."}],"hints":["Nitrate half: NO₃⁻ + 10H⁺ + 8e⁻ → NH₄⁺ + 3H₂O.","Zinc half: Zn → Zn²⁺ + 2e⁻.","×4 for zinc."]},{"id":"b4","goal":5,"star":true,"prompt":"MnO₄⁻ + SO₃²⁻ → Mn²⁺ + SO₄²⁻ (acidic)","L":["MnO4-","SO3^2-"],"R":["Mn^2+","SO4^2-"],"med":["H+","H2O","OH-"],"medium":"acid","_a":"Rgt7CClVHEFPGQM1KVJvU0kZHUZQKRpBSQcWVCsPb1NPGR1GUzJ+VToLG0ZNQQIpVnYU","display":"2MnO₄⁻ + 5SO₃²⁻ + 6H⁺ → 2Mn²⁺ + 5SO₄²⁻ + 3H₂O","wrong":[{"sp":"H+","side":"L","n":16,"fb":"Cancel: the sulfite half gives back 10H⁺ and uses 5H₂O."},{"sp":"H2O","side":"R","n":8,"fb":"Cancel: the sulfite half gives back 10H⁺ and uses 5H₂O."}],"hints":["MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O; SO₃²⁻ + H₂O → SO₄²⁻ + 2H⁺ + 2e⁻.","×2 and ×5 give 10 e⁻ each.","Cancel 10H⁺ and 5H₂O: 6H⁺ on the left, 3H₂O on the right."]},{"id":"b5","goal":4,"star":true,"prompt":"MnO₄⁻ + SO₃²⁻ → MnO₂ + SO₄²⁻ (basic)","L":["MnO4-","SO3^2-"],"R":["MnO2","SO4^2-"],"med":["H+","H2O","OH-"],"medium":"basic","_a":"Rgt7CClVHEFPGQU1KVJvU0kZHUYuU35BSQcWVCsPflNEEhZVNS4FP1YUFk1GU34pSRs=","display":"2MnO₄⁻ + 3SO₃²⁻ + H₂O → 2MnO₂ + 3SO₄²⁻ + 2OH⁻","wrong":[{"sp":"H+","min":1,"fb":"That’s the acidic answer; convert with 2OH⁻."}],"hints":["In acid: 2MnO₄⁻ + 3SO₃²⁻ + 2H⁺ → 2MnO₂ + 3SO₄²⁻ + H₂O.","Add 2OH⁻ to both sides; 2H⁺ + 2OH⁻ → 2H₂O.","Cancel one H₂O: H₂O on the left, 2OH⁻ on the right."]},{"id":"b6","goal":6,"star":true,"prompt":"Cr₂O₇²⁻ + C₂H₅OH → Cr³⁺ + CH₃COOH (acidic)","L":["Cr2O7^2-","C2H5OH"],"R":["Cr^3+","CH3COOH"],"med":["H+","H2O","OH-"],"medium":"acid","_a":"Rgt1FFQuBj9WFBZNRlJyUywMeS5GShFQUnEdRktfEVUnS2hVTUEaQVd6flUlLn4pRBIWV1cpAy5G","display":"2Cr₂O₇²⁻ + 3C₂H₅OH + 16H⁺ → 4Cr³⁺ + 3CH₃COOH + 11H₂O","wrong":[{"sp":"H+","side":"L","n":28,"fb":"The ethanol half releases 12H⁺: 28 − 12 = 16."}],"hints":["Ethanol half: C₂H₅OH + H₂O → CH₃COOH + 4H⁺ + 4e⁻.","Dichromate half: 6e⁻. The LCM of 4 and 6 is 12, so ×3 and ×2.","Add, then cancel 12H⁺ and 3H₂O."]}],"fb":{"acidOH":"In acidic solution O comes from water: add H₂O.","side":"Choose a side for {sp}.","whole":"Enter whole numbers from 0 to 99.","lowest":"Balanced, but not in lowest terms: divide every coefficient by {k}.","other":"Atoms and charge balance, but this isn’t the lowest-terms answer: compare electrons lost and gained."}},{"id":"spot","type":"spot","title":"Spot the error","student":"Signe","how":"","goal":[2,3,4],"instruction":"Signe made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Balance MnO₄⁻ → Mn²⁺ in acidic solution.","steps":["Mn is already balanced.","Add 4H₂O on the right for O.","Add 4H⁺ on the left for H.","Charge +3 vs +2: add 1e⁻ on the left."],"_a":"Vg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Add 2H₂ instead of H⁺.","why":"Use H⁺ in acidic half-reactions.","_n":"1n97e","_k":"79b9c77b"},{"t":"Step 3 is correct.","why":"Count H in 4H₂O: 8.","_n":"1o96e","_k":"d62208a7"},{"t":"Add 4OH⁻ instead.","why":"This is acidic solution.","_n":"1p99e","_k":"655108bf"},{"t":"4H₂O contain 8 H: add \u003cstrong>8H⁺\u003c/strong>, then 5e⁻ on the left.","why":"8H⁺ gives +7 on the left; 5e⁻ brings it to +2.","_n":"1q98e","_k":"ee346670"}],"hints":["How many H atoms in 4H₂O?","8.","8H⁺, then 5e⁻."]},{"id":"e2","goal":3,"task":"Balance Cr₂O₇²⁻ + I⁻ → Cr³⁺ + I₂ (acidic).","steps":["Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O","2I⁻ → I₂ + 2e⁻","Add them: Cr₂O₇²⁻ + 2I⁻ + 14H⁺ → 2Cr³⁺ + I₂ + 7H₂O + 4e⁻","Done."],"_a":"Vg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Divide the dichromate half by 3.","why":"That gives fractions of Cr₂O₇²⁻.","_n":"1r93e","_k":"d19b74d3"},{"t":"Drop the 4e⁻.","why":"Electrons can’t vanish; equalize them.","_n":"1s92e","_k":"7a1aaf67"},{"t":"Multiply the iodide half by 3 first: Cr₂O₇²⁻ + 6I⁻ + 14H⁺ → 2Cr³⁺ + 3I₂ + 7H₂O.","why":"6 e⁻ lost = 6 e⁻ gained, so they cancel completely.","_n":"1t95e","_k":"327cd4dc"},{"t":"Step 3 is correct.","why":"Charge: +10 on the left vs +6 on the right (plus free electrons).","_n":"1u94e","_k":"dfb8a47b"}],"hints":["Electrons gained vs lost?","6 vs 2.","×3 the iodide half."]},{"id":"e3","goal":4,"task":"Convert 2MnO₄⁻ + 3SO₃²⁻ + 2H⁺ → 2MnO₂ + 3SO₄²⁻ + H₂O to basic solution.","steps":["There are 2H⁺, so 2OH⁻ are needed.","Replace 2H⁺ with 2OH⁻ on the left.","2MnO₄⁻ + 3SO₃²⁻ + 2OH⁻ → 2MnO₂ + 3SO₄²⁻ + H₂O"],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Add 2OH⁻ to \u003cstrong>both\u003c/strong> sides; 2H⁺ + 2OH⁻ → 2H₂O; cancel one H₂O: 2MnO₄⁻ + 3SO₃²⁻ + H₂O → 2MnO₂ + 3SO₄²⁻ + 2OH⁻.","why":"Add the same number of OH⁻ to \u003cstrong>both\u003c/strong> sides, then combine H⁺ + OH⁻ into H₂O.","_n":"1v9fe","_k":"7ccc5079"},{"t":"Add 2OH⁻ to the right only.","why":"Adding to one side changes the equation.","_n":"1w9ee","_k":"1338d8cc"},{"t":"Step 2 is correct.","why":"Check the charge: −10 vs −8.","_n":"1x91e","_k":"17e8db7f"},{"t":"Remove the H⁺ and do nothing else.","why":"The atoms and charge would no longer balance.","_n":"1y92e","_k":"eac87c65"}],"hints":["What you add to one side you add to the other.","2OH⁻ both sides.","Combine to water, cancel."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the balancer: how mechanical the steps are, or how the basic conversion works?"},{"id":"j2","q":"In your own words, explain why electrons lost must equal electrons gained."},{"id":"j3","q":"Explain to a friend how to decide how many electrons to add to a half-reaction, and on which side."},{"id":"j4","q":"Which step do you still get wrong most often? What check will you add to catch it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In acidic solution, after balancing atoms other than O and H, what do you add to balance O?","options":[{"t":"H⁺","why":"H⁺ balances H, not O.","_n":"1z8fe","_k":"71ee6671"},{"t":"OH⁻","why":"OH⁻ is for basic solution.","_n":"2090e","_k":"dc090137"},{"t":"O₂","why":"O₂ isn’t a reactant here; water supplies O.","_n":"2195e","_k":"43340a57"},{"t":"H₂O","why":"In acidic solution O comes from water.","_n":"2296e","_k":"a7c0b6c4"}]},"b":{"prompt":"In acidic solution, what do you add to balance H?","options":[{"t":"H₂","why":"Use H⁺ in acidic half-reactions.","_n":"2393e","_k":"0114dc7f"},{"t":"OH⁻","why":"OH⁻ is for basic solution.","_n":"2494e","_k":"13641a27"},{"t":"H⁺","why":"H⁺ supplies H in acidic solution.","_n":"2599e","_k":"db0cf784"},{"t":"H₂O","why":"Water balances O; it would add O too.","_n":"269ae","_k":"c3530bac"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Cr₂O₇²⁻ + 14H⁺ → 2Cr³⁺ + 7H₂O. How many electrons, and on which side?","options":[{"t":"12 on the left","why":"That’s the left-side charge, not the difference.","_n":"2723e","_k":"f3ee2c3a"},{"t":"6 on the right","why":"Electrons go on the more positive side.","_n":"2822e","_k":"2cca6ffc"},{"t":"6 on the left","why":"+12 → +6.","_n":"2921e","_k":"38a0ab11"},{"t":"3 on the left","why":"Each Cr gains 3, and there are 2.","_n":"2a20e","_k":"422610b3"}]},"b":{"prompt":"MnO₄⁻ + 4H⁺ → MnO₂ + 2H₂O. How many electrons, and on which side?","options":[{"t":"3 on the left","why":"+3 → 0.","_n":"2b27e","_k":"25dfdcf0"},{"t":"3 on the right","why":"Electrons go on the more positive side.","_n":"2c26e","_k":"61e27aaf"},{"t":"5 on the left","why":"That’s for Mn²⁺, not MnO₂.","_n":"2d25e","_k":"5f9b7a37"},{"t":"7 on the left","why":"Mn goes +7 → +4: a change of 3.","_n":"2e24e","_k":"53714ddb"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"To convert an acidic-balanced redox equation to basic, you…","options":[{"t":"add O₂ to both sides","why":"O₂ isn’t part of the method.","_n":"2f1be","_k":"1406ac17"},{"t":"replace each H⁺ with OH⁻ on the same side","why":"Add the same number of OH⁻ to \u003cstrong>both\u003c/strong> sides, then combine H⁺ + OH⁻ into H₂O.","_n":"2g1ae","_k":"9f4876d5"},{"t":"add OH⁻ only to the side with H⁺","why":"Add the same number of OH⁻ to \u003cstrong>both\u003c/strong> sides, then combine H⁺ + OH⁻ into H₂O.","_n":"2h1de","_k":"432a2313"},{"t":"add as many OH⁻ to both sides as there are H⁺, combine H⁺ + OH⁻ into H₂O, and cancel","why":"OH⁻ on both sides keeps the equation balanced.","_n":"2i1ee","_k":"ce887754"}]},"b":{"prompt":"2MnO₄⁻ + 6I⁻ + 8H⁺ → 2MnO₂ + 3I₂ + 4H₂O. How many OH⁻ are added to each side?","options":[{"t":"2","why":"That matches MnO₄⁻, not H⁺.","_n":"2j1fe","_k":"59ee7cd7"},{"t":"4","why":"One OH⁻ per H⁺: 8.","_n":"2k20e","_k":"0bd960d5"},{"t":"8","why":"One OH⁻ per H⁺.","_n":"2l21e","_k":"12f89558"},{"t":"16","why":"8 per side, not 16.","_n":"2m22e","_k":"9474c139"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Balance in acidic solution, in lowest terms: Fe²⁺ + Cr₂O₇²⁻ → Fe³⁺ + Cr³⁺. What is the coefficient of Fe²⁺?","options":[{"t":"1","why":"Electrons gained (6) must equal electrons lost.","_n":"2n23e","_k":"c749d50b"},{"t":"3","why":"Two Cr atoms each gain 3.","_n":"2o24e","_k":"1e1590dd"},{"t":"6","why":"6Fe²⁺ + Cr₂O₇²⁻ + 14H⁺ → 6Fe³⁺ + 2Cr³⁺ + 7H₂O.","_n":"2p15e","_k":"fb652cd1"},{"t":"14","why":"That’s H⁺.","_n":"2q16e","_k":"b5e3262c"}]},"b":{"prompt":"Balance in acidic solution, in lowest terms: I⁻ + MnO₄⁻ → I₂ + Mn²⁺. What is the coefficient of H⁺?","options":[{"t":"4","why":"4H₂O per Mn need 8H⁺, and there are 2 Mn.","_n":"2r398","_k":"d351e011"},{"t":"8","why":"The permanganate half must be doubled.","_n":"2s3a8","_k":"8acb4fd0"},{"t":"10","why":"That’s I⁻.","_n":"2t3b8","_k":"ababe400"},{"t":"16","why":"10I⁻ + 2MnO₄⁻ + 16H⁺ → 5I₂ + 2Mn²⁺ + 8H₂O.","_n":"2u3c8","_k":"56e4ad63"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A student writes MnO₄⁻ + Fe²⁺ + 8H⁺ → Mn²⁺ + Fe³⁺ + 4H₂O. What’s wrong?","options":[{"t":"Nothing","why":"Check the charge.","_n":"2v3d8","_k":"9aa72b28"},{"t":"O doesn’t balance","why":"4 = 4.","_n":"2w3e8","_k":"97b0a790"},{"t":"The charge doesn’t balance (+9 vs +5): the electrons weren’t equalized","why":"5 e⁻ gained but only 1 lost: the iron half needs ×5.","_n":"2x3f8","_k":"e84ab753"},{"t":"H doesn’t balance","why":"8 = 8.","_n":"2y408","_k":"2f636e36"}]},"b":{"prompt":"A student writes Cr₂O₇²⁻ + 2I⁻ + 14H⁺ → 2Cr³⁺ + I₂ + 7H₂O. What’s wrong?","options":[{"t":"O doesn’t balance","why":"7 = 7.","_n":"2z418","_k":"7c93f3b4"},{"t":"I doesn’t balance","why":"2 = 2.","_n":"30428","_k":"123295a6"},{"t":"The charge doesn’t balance (+10 vs +6): iodide wasn’t multiplied by 3","why":"6 e⁻ gained but only 2 lost.","_n":"313f8","_k":"314e46c1"},{"t":"Nothing","why":"Check the charge.","_n":"323e8","_k":"15a86e3a"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"2Cu⁺ → Cu + Cu²⁺ is balanced. Which statement describes it?","options":[{"t":"Cu⁺ is only reduced","why":"One Cu⁺ goes to +2.","_n":"333d8","_k":"e5a64d0a"},{"t":"Cu is the oxidizing agent","why":"Cu is a product.","_n":"343c8","_k":"49047b16"},{"t":"It isn’t redox, because only one element is involved","why":"Numbers change: +1 → 0 and +1 → +2.","_n":"35438","_k":"d243d99a"},{"t":"Cu⁺ is both oxidized and reduced","why":"+1 → 0 for one Cu⁺ and +1 → +2 for the other.","_n":"36428","_k":"b59f202b"}]},"b":{"prompt":"2H₂O₂ → 2H₂O + O₂. What happens to oxygen’s oxidation number?","options":[{"t":"No change","why":"It changes in two directions.","_n":"37418","_k":"2ad0884a"},{"t":"−2 → 0","why":"O in a peroxide is −1.","_n":"38408","_k":"494f6c1c"},{"t":"−1 → −2 only","why":"O₂ forms too.","_n":"39478","_k":"031f44a2"},{"t":"−1 → −2 (in water) and −1 → 0 (in O₂)","why":"Peroxide oxygen is −1, and it changes in both directions.","_n":"3a468","_k":"7de30188"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best reason to balance charge with electrons as the \u003cstrong>last\u003c/strong> step of each half-reaction?","options":[{"t":"“Electrons only matter in basic solution.”","why":"Electrons balance the charge in acidic and basic solution alike.","_n":"3b459","_k":"1d8b5790"},{"t":"“Adding electrons changes charge without changing atoms, so once the atoms are balanced, electrons can fix the charge without undoing anything.”","why":"Electrons carry charge but no atoms.","_n":"3c469","_k":"e7195309"},{"t":"“The rules say so, for no particular reason.”","why":"The order has a reason.","_n":"3d439","_k":"e991c7f8"},{"t":"“Electrons are the heaviest species, so they go last.”","why":"Electrons are the lightest.","_n":"3e449","_k":"b84fa0ea"}]},"b":{"prompt":"Which is the best reason why electrons lost must equal electrons gained?","options":[{"t":"“Only in acidic solution.”","why":"It’s true in every medium.","_n":"3f419","_k":"7ba9ae30"},{"t":"“Because H⁺ and OH⁻ must cancel.”","why":"That’s a separate step.","_n":"3g429","_k":"297d4be6"},{"t":"“Electrons aren’t created or destroyed. Every electron released by the oxidation must be taken up by the reduction.”","why":"It’s a conservation law.","_n":"3h3f9","_k":"fe28e457"},{"t":"“So the equation looks symmetrical.”","why":"It’s a conservation law, not style.","_n":"3i409","_k":"751ea2f2"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which half-reaction is written correctly as an \u003cstrong>oxidation\u003c/strong>?","options":[{"t":"Fe²⁺ − e⁻ → Fe³⁺","why":"Write the electron as a product instead of subtracting it.","_n":"3j4d9","_k":"3d1073a5"},{"t":"Fe²⁺ → Fe³⁺ + e⁻","why":"The electron lost is a product: +2 = +3 − 1.","_n":"3k4e9","_k":"a097a9e2"},{"t":"Fe³⁺ + e⁻ → Fe²⁺","why":"That’s the reduction.","_n":"3l4b9","_k":"c1ed10ed"},{"t":"Fe²⁺ + e⁻ → Fe³⁺","why":"The charge doesn’t balance: +1 vs +3.","_n":"3m4a9","_k":"d7aeb22b"}]},"b":{"prompt":"Which half-reaction is written correctly as a \u003cstrong>reduction\u003c/strong>?","options":[{"t":"Ag⁺ + e⁻ → Ag","why":"The electron gained is a reactant: +1 − 1 = 0.","_n":"3n4d9","_k":"c52b6bb6"},{"t":"Ag⁺ → Ag + e⁻","why":"The charge doesn’t balance.","_n":"3o4c9","_k":"39838c5b"},{"t":"Ag → Ag⁺ + e⁻","why":"That’s the oxidation.","_n":"3p4f9","_k":"751698d5"},{"t":"Ag⁺ − e⁻ → Ag","why":"Electrons are written as products (oxidation) or reactants (reduction), never subtracted.","_n":"3q4e9","_k":"37345893"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"In an older breath tester, acidified dichromate oxidizes ethanol to ethanoic acid: 2Cr₂O₇²⁻ + 3C₂H₅OH + __H⁺ → 4Cr³⁺ + 3CH₃COOH + 11H₂O. What is the missing coefficient?","options":[{"t":"12","why":"That’s the H⁺ released, not the net.","_n":"3r519","_k":"fb497893"},{"t":"14","why":"That’s for one dichromate.","_n":"3s509","_k":"ad19a517"},{"t":"16","why":"28H⁺ are used and 12H⁺ released: 16.","_n":"3t439","_k":"a635781b"},{"t":"28","why":"The ethanol half gives back 12H⁺.","_n":"3u429","_k":"501f6fd0"}]},"b":{"prompt":"An iron supplement is analysed by titration: MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O. How many mol of Fe²⁺ react with 0.0020 mol MnO₄⁻?","options":[{"t":"0.0020 mol","why":"The ratio is 1 : 5, not 1 : 1.","_n":"3vd19","_k":"f5a7a330"},{"t":"0.000 40 mol","why":"Multiply by 5; don’t divide.","_n":"3wd29","_k":"4fd75f66"},{"t":"0.010 mol","why":"1 : 5.","_n":"3xd39","_k":"fd6fb4c7"},{"t":"0.016 mol","why":"Use Fe²⁺’s coefficient (5), not H⁺’s (8).","_n":"3yd49","_k":"bdfa5c9e"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Balance in basic solution: MnO₄⁻ + SO₃²⁻ → MnO₂ + SO₄²⁻. The lowest-terms equation contains…","options":[{"t":"2OH⁻ on the left","why":"The OH⁻ that combined with H⁺ became water; the OH⁻ added to the right is what stays.","_n":"3zcd9","_k":"e60b26d8"},{"t":"2H⁺ on the left","why":"That’s the acidic answer.","_n":"40ce9","_k":"049ffc36"},{"t":"2OH⁻ on the right","why":"2MnO₄⁻ + 3SO₃²⁻ + H₂O → 2MnO₂ + 3SO₄²⁻ + 2OH⁻.","_n":"41cf9","_k":"b0d72c7b"},{"t":"8OH⁻ on the right","why":"If H₂O or H⁺ appears on both sides, subtract the smaller amount.","_n":"42d09","_k":"cb7566c0"}]},"b":{"prompt":"Balance in basic solution: MnO₄⁻ + I⁻ → MnO₂ + I₂. Where does OH⁻ appear, and how many?","options":[{"t":"None","why":"Basic solution has no H⁺: add OH⁻ to both sides.","_n":"43c99","_k":"72fbed8d"},{"t":"4, on the right","why":"4 is the water count.","_n":"44ca9","_k":"bd2bda16"},{"t":"8, on the right","why":"2MnO₄⁻ + 6I⁻ + 4H₂O → 2MnO₂ + 3I₂ + 8OH⁻.","_n":"45d79","_k":"00a52a6b"},{"t":"8, on the left","why":"The OH⁻ that combined with H⁺ became water; the OH⁻ added to the right is what stays.","_n":"46d69","_k":"868efd46"}]}}]},"task":{"title":"Pick a titration reaction","summary":"Pick a titration reaction","statement":"\u003cp>Choose a reducing agent (the sample in the flask) and an oxidizing agent (in the burette), then enter the multipliers that balance the electrons. Can you find all the good pairings?\u003c/p>\u003col class=\"rdx-conds\">\u003cli>The electrons cancel.\u003c/li>\u003cli>The multipliers are the lowest whole numbers.\u003c/li>\u003cli>The oxidizing agent changes colour as it reacts, so the reaction can be followed by eye.\u003c/li>\u003cli>The sample dissolves, so it can be in solution in the flask (not a solid metal).\u003c/li>\u003c/ol>","qOx":"Oxidation half (the sample)","qRed":"Reduction half (in the burette)","qA":"Multiplier \u003cem>a\u003c/em> (oxidation half)","qB":"Multiplier \u003cem>b\u003c/em> (reduction half)","ox":[{"id":"fe","t":"Fe²⁺ → Fe³⁺ + e⁻"},{"id":"i","t":"2I⁻ → I₂ + 2e⁻"},{"id":"zn","t":"Zn → Zn²⁺ + 2e⁻"},{"id":"pe","t":"H₂O₂ → O₂ + 2H⁺ + 2e⁻"},{"id":"so","t":"SO₃²⁻ + H₂O → SO₄²⁻ + 2H⁺ + 2e⁻"}],"red":[{"id":"mn","t":"MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O","col":"purple → nearly colourless"},{"id":"cr","t":"Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O","col":"orange → green"},{"id":"ag","t":"Ag⁺ + e⁻ → Ag","col":"colourless"},{"id":"cu","t":"Cu²⁺ + 2e⁻ → Cu","col":"pale blue → colourless, but forms a solid"}],"checks":["Electrons cancel","Lowest whole numbers","Colour change to follow","Sample dissolves"],"tips":["Multiply each half so both show the same number of electrons.","If both multipliers share a factor, divide it out.","Ag⁺ and Cu²⁺ don’t give a colour change you can watch in solution.","Solid zinc can’t be measured into a flask as a solution."],"explainPrompt":"Explain how you chose the multipliers and why your pair suits a titration.","vocab":"Use half-reaction, electrons, lowest terms and oxidizing agent.","more":"There’s more than one good pairing. Can you find them all?","afterAt":
