<script>try{var t=localStorage.getItem("sch4u-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
--paper:#EDF3EA;--grid:#DAE6D5;--sheet:#FCFDFB;--ink:#1E2A57;--ink-2:#4D5A80;--rule:#C6D4C2;
--pen:#2343C4;--acol:#7A3DB8;--f3:#0E7C7B;
--p-k:#A84C05;--p-d:#0B7372;--p-c:#B0286F;--p-b:#6B5A1E;--p-t:#00648A;
--red:#B5392D;--green:#1D7646;--good-bg:#E3F1E7;--bad-bg:#F8E7E4;--info-bg:#EAEFFA;
--hi:#F4DA4E;--hi-soft:rgba(244,218,78,.38);--hi-ink:#1E2A57;
--plot-grid:#E4ECE1;--plot-axis:#1E2A57;
--font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--font-math:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;
--mv-top:0px;
color-scheme:light;
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--paper:#131B18;--grid:#1B2621;--sheet:#1A2420;--ink:#E5ECE4;--ink-2:#A8B7AC;--rule:#33443C;
--pen:#93AEFF;--acol:#C9A8FF;--f3:#5FD0CD;
--p-k:#FF9F5A;--p-d:#5FD0CD;--p-c:#F49AC8;--p-b:#D8D08F;--p-t:#7FD3F5;
--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;
--hi:#E6CF48;--hi-soft:rgba(230,207,72,.14);--hi-ink:#17201B;
--plot-grid:#243029;--plot-axis:#E5ECE4;
color-scheme:dark;
}
}
:root[data-theme="dark"]{
--paper:#131B18;--grid:#1B2621;--sheet:#1A2420;--ink:#E5ECE4;--ink-2:#A8B7AC;--rule:#33443C;
--pen:#93AEFF;--acol:#C9A8FF;--f3:#5FD0CD;
--p-k:#FF9F5A;--p-d:#5FD0CD;--p-c:#F49AC8;--p-b:#D8D08F;--p-t:#7FD3F5;
--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;
--hi:#E6CF48;--hi-soft:rgba(230,207,72,.14);--hi-ink:#17201B;
--plot-grid:#243029;--plot-axis:#E5ECE4;
color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{
margin:0;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:24px 24px;
font:400 1.0625rem/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
img,svg{max-width:100%}
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top));z-index:9;background:var(--paper);border-bottom:1.5px solid var(--rule)}
.top-inner{max-width:1060px;margin:0 auto;padding:10px 18px 0}
.top-row{display:flex;align-items:center;gap:12px 18px}
.brand{flex:1 1 auto;min-width:0;line-height:1.2}
.brand b{display:block;font:600 1.3rem var(--font-math);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{display:block;font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2);flex:0 0 auto}
.prog-bar{width:110px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.hd-btns{display:flex;gap:8px;flex:0 0 auto}
.home-link{flex:0 0 auto}
.theme-btn{min-width:2.6em;justify-content:center}
nav.steps{display:flex;gap:2px;overflow-x:auto;padding-top:6px;scrollbar-width:none;margin:0 -6px}
nav.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);font-weight:700;font-size:.95rem;padding:8px 8px 10px}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem}
.step.done .num{background:var(--green);border-color:var(--green);color:var(--sheet)}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.save-off{max-width:1060px;margin:10px auto 0;padding:0 18px}
.save-off p{margin:0;padding:10px 14px;border-left:4px solid var(--red);background:var(--bad-bg);border-radius:6px;max-width:none}
main{max-width:1060px;margin:0 auto;padding:6px 18px 40px}
h1,h2{font-family:var(--font-math);font-weight:600;line-height:1.15;margin:0 0 .45em}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem)}
h2{font-size:clamp(1.55rem,3.3vw,2rem)}
h3{font-size:1.15rem;line-height:1.3;margin:0 0 .45em}
h4{font-size:1rem;margin:0 0 .3em}
p{margin:0 0 .8em;max-width:68ch}
.muted{color:var(--ink-2)}
.tiny{font-size:.875rem}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:clamp(16px,3vw,30px);margin:22px 0}
.sheet > :last-child{margin-bottom:0}
.part{margin-top:30px;padding-top:24px;border-top:1.5px dashed var(--rule)}
.intro{padding:clamp(18px,4vw,36px) 0 0}
.intro p{font-size:1.1rem}
.next-row{display:flex;justify-content:flex-end;margin:8px 0 30px}
.m{font-family:var(--font-math);font-size:1.08em;white-space:nowrap}
.m i{font-style:italic}
.m .ar{font-family:var(--font-ui);font-style:normal;font-size:.9em;padding:0 .12em}
.m .fnm{font-style:normal}
.nw{white-space:nowrap}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.steps .step{position:relative}
sup{font-size:.68em;line-height:0}
sub{font-size:.68em;line-height:0}
.va,.p-a{color:var(--acol)} .vn,.p-n{color:var(--pen)}
.p-k{color:var(--p-k)} .p-d{color:var(--p-d)} .p-c{color:var(--p-c)} .p-b{color:var(--p-b)} .p-t{color:var(--p-t)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .08em;font-size:.92em}
.frac > .fn{padding:0 .15em .05em;border-bottom:1.2px solid currentColor}
.frac > .fd{padding:.05em .15em 0}
.rad{white-space:nowrap}
.rad > .rb{border-top:1.2px solid currentColor;padding:0 .08em;margin-left:.02em}
.vec{position:relative;display:inline-block}
.vec::after{content:"\2192";position:absolute;left:0;right:0;top:-.72em;font-size:.7em;font-style:normal;text-align:center;line-height:1}
.uses{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);font-size:.95rem;max-width:68ch}
.q-prompt canvas.plot,.task + canvas.plot,.fig-sm{max-width:380px;margin-top:8px;font-weight:400}
.uses strong{font-size:.85rem;color:var(--ink-2);margin-right:6px}
.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--rule)}
.btn.sm{font-size:.92rem;padding:.45em .9em}
.btn:disabled{opacity:.45}
.btn:not(:disabled):hover{border-color:var(--pen)}
.btn.primary:not(:disabled):hover{background:var(--pen);border-color:var(--pen)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}
.hero.solo{grid-template-columns:minmax(0,1fr)}
.hero p{font-size:1.12rem}
.hero .hero-eq{font:italic 400 clamp(3.6rem,11vw,7.2rem)/1 var(--font-math);margin:0 0 .22em;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero .hero-eq.md{font-size:clamp(2.2rem,7vw,4.4rem)}
.hero .hero-eq.sm{font-size:clamp(1.6rem,5vw,2.8rem);font-style:normal}
.hero-eq sup{font-size:.55em}
.hero-fig{margin:0;min-width:0}
.hero-fig figcaption{font:400 1.35rem var(--font-math);text-align:center;margin-top:8px;min-height:1.6em}
canvas.plot{display:block;width:100%;aspect-ratio:4/3;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);touch-action:pan-y}
canvas.plot.square{aspect-ratio:1/1}
canvas.plot.wide{aspect-ratio:16/9}
canvas.plot.nl{aspect-ratio:6/1;min-height:92px}
.plot-wrap{position:relative}
.drag-h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2;touch-action:none}
.drag-h:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.goal{padding:14px 0;border-bottom:1px solid var(--rule)}
.goal:last-child{border-bottom:0}
.goal-t{margin:0 0 8px;font-weight:700}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.32em .9em;font-size:.92rem}
.rbtn.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.was{margin:6px 0 0}
.q{padding:18px 0;border-bottom:1.5px dashed var(--rule)}
.q:last-child{border-bottom:0}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.qn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-top:1px}
.q-prompt{flex:1;font-weight:700;min-width:0}
.q-prompt .m{white-space:normal}
.opt .m,.fb .m,.hints .m,.refresh .m,.read .m{white-space:normal}
.tag{flex:0 0 auto;font-size:.8rem;font-weight:700;border:1.5px solid var(--ink-2);color:var(--ink-2);border-radius:999px;padding:.1em .7em;margin-top:2px}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.6em .8em;min-width:0}
.opt > span:last-child{min-width:0;overflow-wrap:anywhere}
.opt-mark{flex:0 0 auto;font-weight:700;color:var(--ink-2);min-width:1em}
.opt.picked{border-color:var(--ink);background:var(--hi-soft)}
.opt.right{border-color:var(--green);background:var(--good-bg)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)}
.opt:disabled{color:var(--ink)}
.opt:not(:disabled):hover{border-color:var(--pen)}
.opt canvas.plot{margin-top:6px;aspect-ratio:4/3;max-width:220px}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.conf-lab{font-size:.9rem;color:var(--ink-2);margin-right:4px}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:32px}
.chip.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.chip:disabled{opacity:.75}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:12px;padding:12px 14px;border-radius:6px;border-left:4px solid var(--ink-2);background:var(--info-bg)}
.fb.good{border-left-color:var(--green);background:var(--good-bg)}
.fb.bad{border-left-color:var(--red);background:var(--bad-bg)}
.fb:focus{outline:none}
.fb p{margin:0 0 .4em;max-width:none}.fb p:last-child{margin:0}
.hints{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--ink-2);border-radius:6px}
.hints p{margin:0 0 .4em;max-width:none}.hints p:last-child{margin:0}
.result{margin-top:14px}
.big-score{font:600 2.2rem/1 var(--font-math);margin:0 0 .3em}
.refresh{margin-top:12px;padding:12px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.refresh p{margin:0}
.pg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"graph read" "ctrl read";gap:16px 28px;align-items:start}
.pg-graph{grid-area:graph;min-width:0}.pg-ctrl{grid-area:ctrl;min-width:0}.pg-read{grid-area:read;min-width:0}
.eq-cap{font:400 clamp(1.6rem,4vw,2.3rem)/1.2 var(--font-math);margin:0 0 6px;min-height:1.25em;overflow-wrap:anywhere}
.eq-cap .m{font-size:1em;white-space:normal}
.banner{min-height:1.6em;margin:0 0 8px;font-weight:700}
.banner.good{color:var(--green)}.banner.bad{color:var(--red)}
.slider{display:block;margin:0 0 6px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider-top span{font-weight:700}
.slider output{font:600 1.35rem var(--font-math)}
input[type=range]{width:100%;accent-color:var(--pen);height:34px;margin:0}
.seg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:.4em .85em;font-size:.92rem;font-weight:700;min-height:34px}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
dl.read{margin:0}
.read > div{padding:10px 0;border-bottom:1px solid var(--rule)}
.read > div:first-child{padding-top:0}
.read > div:last-child{border-bottom:0}
.read dt{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.read dd{margin:2px 0 0;overflow-wrap:anywhere}
.qpath{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:0 .45em;border-radius:3px;font-weight:700;white-space:nowrap}
.legend{display:grid;gap:6px;margin:0 0 12px}
.legend > span{display:flex;align-items:center;gap:10px}
.legend i.sw{display:inline-block;width:28px;height:4px;border-radius:2px}
.pred-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-2)}
.dot.done{background:var(--green);border-color:var(--green)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
.pred-q{font-weight:700}
.chal{padding:16px 0;border-bottom:1.5px dashed var(--rule)}
.chal:last-child{border-bottom:0}
.chal .live{font-size:.9rem;font-weight:700;color:var(--green);min-height:1.2em;margin:8px 0 0}
.sym{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 30px;align-items:start}
.sym > *{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.fchip{border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.3em .8em;font:400 1.15rem var(--font-math);min-height:36px}
.fchip[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.alg{margin-top:14px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px}
.alg summary{font-weight:700;cursor:pointer}
.alg-lines{margin:10px 0 0;display:grid;gap:4px;font-family:var(--font-math);font-size:1.12rem}
.alg-lines small{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2)}
.sq{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.sq:last-child{border-bottom:0}
.sq .sq-p{flex:1 1 16rem;min-width:0}
.sq .sq-c{display:flex;flex-wrap:wrap;gap:6px}
.sq .fb{flex-basis:100%;margin-top:4px}
.how{font-size:.95rem;color:var(--ink-2)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.tile{border:2px solid var(--ink);background:var(--sheet);border-radius:6px;padding:.35em .8em;font:400 1.18rem var(--font-math);text-align:left;max-width:100%}
.tile.txt{font:400 1rem var(--font-ui)}
.tile[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.tile .m{font-size:1em;white-space:normal}
.sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.bins{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.bins.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.bin{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-height:118px;border:2px dashed var(--rule);background:var(--sheet);border-radius:8px;padding:10px 12px;min-width:0}
.bin.ready{border-color:var(--ink-2)}
.bin.ready:hover{border-color:var(--pen);border-style:solid}
.bin-head{display:flex;gap:10px;align-items:flex-start}
.bin-head svg{flex:0 0 auto}
.bin-head strong{display:block;line-height:1.25}
.bin-head small{display:block;color:var(--ink-2);font-size:.85rem}
.bin-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip-in{border:1.5px solid var(--green);background:var(--good-bg);border-radius:5px;padding:.1em .55em;font:400 1rem var(--font-math);max-width:100%}
.chip-in.txt{font:400 .92rem var(--font-ui)}
.chip-in .m{font-size:1em;white-space:normal}
.sort-done{margin:0;font-weight:700}
.task{font-weight:700}
.who{font-size:.9rem;color:var(--ink-2);margin:12px 0 6px}
ol.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sbtn{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.6em .8em}
.sbtn > span:last-child{min-width:0;overflow-wrap:anywhere}
.sbtn:not(:disabled):hover{border-color:var(--pen)}
.sbtn .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.sbtn.err{border-color:var(--red);background:var(--bad-bg)}
.sbtn.ok{border-color:var(--rule)}
.sbtn:disabled{color:var(--ink)}
.flag{display:inline-block;margin-left:6px;font-size:.8rem;font-weight:700;color:var(--red)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 16px;margin-top:10px}
.match-col{display:grid;gap:8px;align-content:start}
.match-col h4{margin:0;color:var(--ink-2);font-size:.85rem}
.mitem{display:flex;gap:8px;align-items:center;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .7em;min-height:40px}
.mitem > span{min-width:0;overflow-wrap:anywhere}
.mitem[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.mitem.done{border-color:var(--green);background:var(--good-bg)}
.mitem .pair-n{flex:0 0 auto;font-size:.8rem;font-weight:700;color:var(--green)}
.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 14: hero, Energy level ladder (C12), Spectra as fingerprints, calculations, Light a sign */
/* Module tokens: --bm-night (the dark screen a spectrum is shown on, both themes), --bm-tube (hydrogen tube glow),
   --bm-band (grey UV and IR bands). Spectral line colours are computed from wavelengths in app.js (course plan §4). */
:root{--bm-night:#05070D;--bm-tube:#C8479B;--bm-band:#D3D8E2}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bm-night:#000000;--bm-tube:#F07AC0;--bm-band:#3B4351} }
:root[data-theme="dark"]{--bm-night:#000000;--bm-tube:#F07AC0;--bm-band:#3B4351}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.bm-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.bm-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.bm-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Explore: energy level ladder */
.bm-how{margin-top:0}
.bm-modes{margin:0 0 12px}
.bm-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.bm-view,.bm-side{min-width:0}
.bm-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.bm-svg{display:block;width:100%;max-width:540px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.bm-cap{min-height:1.5em;margin:10px 0 2px;font-size:1rem}
.bm-c[hidden]{display:none}
.bm-c > * + *{margin-top:12px}
.bm-c > p.tiny{margin-top:12px}
.bm-fallb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bm-fb{min-height:40px;min-width:64px}
.bm-casc{margin:8px 0 0}
.bm-sendrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bm-btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px;padding-top:12px;border-top:1.5px solid var(--rule)}
.bm-note{margin:12px 0 0}
.bm-tabs{margin-top:4px}

/* Part 3: Spectra as fingerprints */
.bm-st h3{margin-bottom:6px}
#p3-app > .bm-st:first-child{margin-top:0;padding-top:0;border-top:0}
.bm-h4{margin:14px 0 6px;font-size:1rem}
.bm-hs{display:block;width:100%;max-width:540px;height:auto;font-family:var(--font-ui)}
.bm-unks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.bm-uk{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;border:2px solid var(--ink);border-radius:10px;background:var(--sheet);color:var(--ink);padding:8px 10px 4px;touch-action:none;cursor:grab;min-width:0}
.bm-uk[aria-pressed="true"]{border-color:var(--hi-ink);background:var(--hi-soft);box-shadow:0 0 0 3px var(--hi)}
.bm-ukh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:.95rem}
.bm-ukt{color:var(--ink-2);font-weight:700}
.bm-msg{min-height:1.4em;margin:8px 0 0;font-size:.95rem;color:var(--ink-2)}
.bm-refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.bm-ref{border:2px dashed var(--ink-2);border-radius:10px;background:var(--paper);padding:6px 8px 2px;min-width:0}
.bm-ref.over{border-style:solid;border-color:var(--pen);background:var(--hi-soft)}
.bm-refb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;width:100%;text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .6em;font-size:.95rem;min-height:40px}
.bm-refp{color:var(--ink-2);font-size:.85rem}
.bm-data{margin-top:14px}
.bm-ovi{margin-top:10px}
.bm-ovi .tiny{margin:2px 0 0}
.bm-sl{margin:12px 0 2px;font-size:.95rem}
.bm-cmp{margin:10px 0}
.bm-s3el{margin:6px 0 4px}
.bm-s3cap{min-height:1.4em;margin:10px 0 0}
.bm-ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--hi);color:var(--hi-ink);border:2px solid var(--hi-ink);border-radius:8px;padding:.25em .6em;font:700 .9rem var(--font-ui)}
.bm-st .jq{margin-top:14px}

/* Practice: calculations */
.bm-chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bm-chiplist .chip{text-align:left;max-width:100%}
.bm-unit{font-size:.95rem;color:var(--ink-2)}

/* Performance task: Light a sign */
.bm-conds{margin:6px 0 10px;padding-left:1.4em}
.bm-tl{margin:4px 0 8px}
.bm-tin{display:flex;flex-direction:column;gap:6px}
.bm-trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.bm-trl{min-width:5.6em;font-size:.92rem;font-weight:700;color:var(--ink-2)}
.bm-trb{display:flex;flex-wrap:wrap;gap:6px}
.bm-tb{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .7em;font-size:.95rem;min-height:38px;min-width:58px}
.bm-tb.on{background:var(--hi);border-color:var(--hi-ink);color:var(--hi-ink);font-weight:700}
.bm-tmsg{min-height:1.3em;margin:8px 0 0;font-size:.92rem;color:var(--ink-2)}

@media (max-width:760px){
  .bm-grid{grid-template-columns:minmax(0,1fr)}
}
/* phones: the ladder uses the sheet's full width, and SVG labels grow so they stay readable when the drawing shrinks */
@media (max-width:560px){
  .bm-view .bm-box{margin:0 -12px}
  .bm-svg text[font-size="12"],.bm-hx-svg text[font-size="12"]{font-size:14px}
  .bm-svg text[font-size="11"],.bm-hx-svg text[font-size="11"]{font-size:12.5px}
  .bm-svg text[font-size="11.5"],.bm-hx-svg text[font-size="11.5"]{font-size:13px}
  .bm-hs text[font-size="10.5"]{font-size:12px}
}

ntitative Equilibrium (Keq)","kind":"topic","group":"4"},{"nn":"37","slug":"ksp","title":"Solubility Equilibrium (Ksp)","kind":"topic","group":"4"},{"nn":"38","slug":"acids-and-bases","title":"Acids and Bases","kind":"topic","group":"4"},{"nn":"39","slug":"ph-strong-acids-bases","title":"pH of Strong Acids and Bases","kind":"topic","group":"4"},{"nn":"40","slug":"ka-and-kb","title":"Ka and Kb Calculations","kind":"topic","group":"4"},{"nn":"41","slug":"hydrolysis-of-salts","title":"Hydrolysis of Salts","kind":"topic","group":"4"},{"nn":"42","slug":"strong-titration","title":"Strong Acid/Base Titration","kind":"topic","group":"4"},{"nn":"43","slug":"weak-titration","title":"Weak Acid/Base Titration","kind":"topic","group":"4"},{"nn":"44","slug":"buffer-solutions","title":"Buffer Solutions","kind":"topic","group":"4"},{"nn":"45","slug":"oxidation-numbers","title":"Assigning Oxidation Numbers","kind":"topic","group":"5"},{"nn":"46","slug":"balancing-redox","title":"Balancing Redox Reactions (Half-Reaction Method)","kind":"topic","group":"5"},{"nn":"47","slug":"galvanic-cells","title":"Galvanic Cells and Standard Reduction Potentials","kind":"topic","group":"5"},{"nn":"48","slug":"cell-notation","title":"Cell Notation (Voltaic Cells)","kind":"topic","group":"5"},{"nn":"49","slug":"corrosion","title":"Corrosion","kind":"topic","group":"5"},{"nn":"50","slug":"faraday-first-law","title":"Faraday's First Law of Electrolysis","kind":"topic","group":"5"},{"nn":"51","slug":"faraday-second-law","title":"Faraday's Second Law of Electrolysis","kind":"topic","group":"5"},{"nn":"52","slug":"hall-heroult","title":"The Hall–Héroult Process","kind":"topic","group":"5"}]},"salt":"abfa99b2","content":{"id":"14-bohr-model","kind":"topic","title":"Bohr model","topic":"Bohr Model","readyTopic":"the Bohr model","hero":{"headline":"Hydrogen glows in only four visible colours. Why?","text":"Heat hydrogen gas and pass its light through a prism. Instead of a rainbow you get a few sharp \u003cstrong>lines\u003c/strong>. Niels Bohr explained them: the electron can only sit on certain \u003cstrong>energy levels\u003c/strong>. Each fall from one level to a lower one releases a \u003cstrong>photon\u003c/strong> whose energy matches the gap exactly.","fig":{"html":"\u003cdiv class=\"bm-hx\">\u003csvg class=\"bm-hx-svg\" id=\"bm-hx-svg\" viewBox=\"0 0 480 350\" role=\"img\" aria-label=\"A glowing hydrogen tube shines through a prism, which spreads its light into four sharp lines on a black spectrum: 410 nm violet, 434 nm violet-blue, 486 nm blue-green and 656 nm red. Beside it, an energy ladder with levels n = 1 to 6. The electron drops from n = 3 to n = 2 and a red wavy photon arrow flies to the 656 nm line; then drops from 4, 5 and 6 to n = 2 send blue-green, violet-blue and violet photons to the other three lines.\">\u003c/svg>\u003cdiv class=\"bm-hx-row\">\u003cp class=\"bm-hx-ctr\" id=\"bm-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"bm-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can describe Bohr’s model: electrons in fixed energy levels that absorb or emit photons only when they jump between levels.","I can connect a transition to its photon’s energy, wavelength and region (UV, visible, IR).","I can calculate photon energies from an energy-level diagram and count the possible lines.","I can explain emission and absorption line spectra as evidence for quantized energy.","I can use spectra to identify elements and describe the model’s limits and uses."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Electromagnetic spectrum","goal":2,"prompt":"Which list goes from \u003cstrong>lowest\u003c/strong> to \u003cstrong>highest\u003c/strong> photon energy?","options":[{"t":"Infrared, visible, ultraviolet","why":"IR \u003c visible \u003c UV: ultraviolet photons carry the most energy.","_n":"0b2d","_k":"d49258c4"},{"t":"Visible, infrared, ultraviolet","why":"Infrared is below visible.","_n":"1b5d","_k":"fb444865"},{"t":"Ultraviolet, visible, infrared","why":"Reversed: UV carries the most energy.","_n":"2b4d","_k":"f18aa783"},{"t":"Infrared, ultraviolet, visible","why":"Visible sits between IR and UV.","_n":"3b7d","_k":"a393d62d"}],"hints":["Which one gives a sunburn?","UV: high energy.","IR \u003c visible \u003c UV."]},{"id":"w2","skill":"Electromagnetic spectrum","goal":2,"prompt":"Which visible colour has the shortest wavelength?","options":[{"t":"Red","why":"Red is longest, about 700 nm.","_n":"4b6d","_k":"d6a261b7"},{"t":"Yellow","why":"Longer than violet.","_n":"5b9d","_k":"05757ad5"},{"t":"Violet","why":"About 400 nm.","_n":"6b8d","_k":"830908c8"},{"t":"Green","why":"In the middle.","_n":"7bbd","_k":"5aebf724"}],"hints":["Visible light runs from about 400 to 700 nm.","Red is at the long end.","Violet."]},{"id":"w3","skill":"Energy differences","goal":3,"prompt":"A ball drops from a shelf at −1.5 J to a shelf at −3.4 J (energies measured from the ceiling). How much energy is released?","options":[{"t":"4.9 J","why":"That adds the sizes.","_n":"8bad","_k":"29980b1c"},{"t":"−4.9 J","why":"Subtract: final from initial.","_n":"94be","_k":"ad2b8ea3"},{"t":"3.4 J","why":"That’s one shelf, not the gap.","_n":"a4ce","_k":"c27fc22e"},{"t":"1.9 J","why":"−1.5 − (−3.4) = 1.9.","_n":"b4de","_k":"9c8ac755"}],"hints":["Released energy = higher level − lower level.","−1.5 − (−3.4).","1.9 J."]},{"id":"w4","skill":"Energy differences","goal":3,"prompt":"Subtract: −0.85 − (−13.60) = ?","options":[{"t":"−14.45","why":"The photon carries the \u003cstrong>difference\u003c/strong>: −0.85 − (−13.60) = 12.75 eV, not 0.85 + 13.60.","_n":"c4ee","_k":"be1e4c2a"},{"t":"12.75","why":"Minus a negative is plus: −0.85 + 13.60 = 12.75.","_n":"d4fe","_k":"c8570301"},{"t":"12.85","why":"Check the hundredths: 13.60 − 0.85 = 12.75.","_n":"e50e","_k":"d6939906"},{"t":"14.45","why":"The photon carries the \u003cstrong>difference\u003c/strong>: −0.85 − (−13.60) = 12.75 eV, not 0.85 + 13.60.","_n":"f51e","_k":"cf9547b8"}],"hints":["Minus a negative is plus.","−0.85 + 13.60.","12.75."]},{"id":"w5","skill":"Continuous vs line spectra","goal":4,"prompt":"A hot, glowing solid, like a light bulb filament, gives which kind of spectrum?","options":[{"t":"A few bright lines","why":"That’s a hot gas.","_n":"g52e","_k":"2d99b17a"},{"t":"Dark lines only","why":"That’s light passing through a cool gas.","_n":"h53e","_k":"88373a70"},{"t":"Continuous: all colours","why":"Solids glow across all colours: a rainbow.","_n":"i54e","_k":"bc12ddd9"},{"t":"No visible light","why":"A glowing filament is visible.","_n":"jddf","_k":"73ff8367"}],"hints":["Think of a rainbow.","Solids glow across all colours.","Continuous."]},{"id":"w6","skill":"Continuous vs line spectra","goal":4,"prompt":"A glowing gas tube viewed through a prism shows…","options":[{"t":"Dark lines on a rainbow","why":"That’s absorption.","_n":"kdcf","_k":"f6d3de89"},{"t":"Bright lines at certain colours","why":"Each atom emits only certain photons, so a hot gas gives bright lines.","_n":"ldff","_k":"69428220"},{"t":"A full rainbow","why":"That’s a hot solid.","_n":"mdef","_k":"6cc55121"},{"t":"Only white light","why":"The prism separates colours.","_n":"ne1f","_k":"5f38a891"}],"hints":["Gas atoms behave individually.","Each atom emits only certain photons.","Bright lines."]}],"refreshers":{"Electromagnetic spectrum":"Radio \u003c microwave \u003c infrared \u003c visible (red → violet) \u003c ultraviolet \u003c X-ray. Shorter wavelength means higher photon energy.","Energy differences":"Energy released = \u003ci>E\u003c/i>(high) − \u003ci>E\u003c/i>(low). With negative levels, subtract carefully: −1.51 − (−3.40) = +1.89.","Continuous vs line spectra":"Hot solids give continuous spectra. Hot gases give bright lines. Cool gases in front of white light give dark lines at the same places."}}},"explore":{"heading":"Energy level ladder","intro":"Give the electron energy, let it fall, and watch which lines appear.","how":"Choose a mode. Place the electron and let it fall, send it a photon, or shine white light through hydrogen gas. The readout and the spectrum update as you go.","modes":[{"id":"em","t":"Emission"},{"id":"ab","t":"Absorption"},{"id":"gas","t":"Gas and light"}],"chips":[1.89,2,2.55,10.2,11,12.09,12.75,13.6,14],"temps":[{"id":"cool","t":"Cool (about room temperature)"},{"id":"hot","t":"Very hot (like a star’s surface)"}],"tags":[{"id":"n1","t":"they start at `n = 1`"},{"id":"n2","t":"they start at `n = 2`"},{"id":"n3","t":"they start at `n = 3`"}],"evNote":"Energies are in electron volts: 1 eV = 1.60 × 10\u003csup>−19\u003c/sup> J.","gasNote":"Model: the “very hot” setting stands in for the real effect of temperature. In a very hot gas, some atoms sit at `n = 2`; in a cool gas almost all sit at `n = 1`.","predictions":[{"id":"p1","prompt":"Emission, electron at `n = 3`. It falls to `n = 2`. What colour is the photon?","options":[{"t":"Violet","_n":"oe0f","_k":"6f942ecd"},{"t":"Red","_n":"pe3f","_k":"b8a50196"},{"t":"Ultraviolet","_n":"qe2f","_k":"32ce4bcd"},{"t":"Infrared","_n":"rd5f","_k":"8040f642"}],"explain":"1.89 eV is the smallest visible gap: the longest wavelength, red."},{"id":"p2","prompt":"Absorption, electron at `n = 2`, photon 2.00 eV. What happens?","options":[{"t":"The electron jumps to `n = 3`","_n":"sd4f","_k":"13be416a"},{"t":"Nothing: the photon passes through","_n":"td7f","_k":"00b11501"},{"t":"The atom ionizes","_n":"ud8f","_k":"4a9452c8"},{"t":"It jumps partway","_n":"vd5f","_k":"bb7dedbe"}],"explain":"Gaps from `n = 2` are 1.89 eV, 2.55 eV and so on. 2.00 eV matches none."},{"id":"p3","prompt":"Emission, electron at `n = 4`. Falling one or more steps at a time, how many \u003cstrong>different\u003c/strong> lines could atoms like this produce?","options":[{"t":"3","_n":"wd6f","_k":"a6fc4a04"},{"t":"4","_n":"xd3f","_k":"0cba9b76"},{"t":"6","_n":"yd4f","_k":"8b463d9b"},{"t":"10","_n":"zd1f","_k":"f1d37546"}],"explain":"Every pair of levels from 1 to 4: 4 × 3 ÷ 2 = 6."},{"id":"p4","prompt":"Emission 2 → 1. Where on the spectrum does this line appear?","options":[{"t":"Violet","_n":"10d2f","_k":"8f5d2842"},{"t":"Red","_n":"11dff","_k":"e91a39eb"},{"t":"Ultraviolet: invisible to us","_n":"12e0f","_k":"21a61212"},{"t":"Infrared","_n":"1369f","_k":"79222f20"}],"explain":"10.2 eV is far above visible-light energies."}],"chalIntro":"Use the ladder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 uses \u003cstrong>Gas and light\u003c/strong> mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Make hydrogen emit its \u003cstrong>blue-green\u003c/strong> line.","why":"4 → 2 gives out 2.55 eV: the blue-green line at 486 nm.","general":"No blue-green line recorded yet. In Emission mode, place the electron and choose a level for it to fall to.","hints":["Visible lines end at `n = 2`.","Blue-green is 486 nm, the second-lowest visible gap.","Fall from 4 to 2."]},{"id":"tc2","goal":[1,3],"prompt":"Start in the ground state. Choose the \u003cstrong>lowest-energy single photon\u003c/strong> that lets the atom later emit the red line.","why":"12.09 eV is exactly the 1 → 3 gap. From `n = 3` the electron can fall 3 → 2 and emit the red line; no smaller photon reaches `n = 3`.","general":"In Absorption mode, start the electron at `n = 1` and send a photon.","hints":["The red line is 3 → 2, so the electron must reach at least `n = 3`.","Gap from 1 to 3: −1.51 − (−13.60).","12.09 eV."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Gas and light mode: make hydrogen’s four \u003cstrong>visible\u003c/strong> dark lines appear. Then tag the level those absorbing electrons start on.","why":"Only a very hot gas has many atoms at `n = 2`, and every visible gap (1.89–3.02 eV) starts there. That’s why stars’ atmospheres show hydrogen’s visible dark lines.","hints":["Which level do visible transitions connect to?","`n = 2`.","Only a very hot gas has many atoms at `n = 2`, as in a star’s atmosphere."]}]},"part3":{"slug":"spectra","name":"Fingerprints","heading":"Spectra as fingerprints","intro":"Astronomers and testing labs use spectra as evidence. Every element has its own set of energy gaps, so its lines identify it. Match unknown spectra to their elements, see how helium was found in the Sun, and find where Bohr’s model breaks down.","refs":[{"id":"H","name":"Hydrogen","sym":"H","lines":[410,434,486,656]},{"id":"He","name":"Helium","sym":"He","lines":[447,502,588,668]},{"id":"Na","name":"Sodium","sym":"Na","lines":[589],"pair":true},{"id":"Hg","name":"Mercury","sym":"Hg","lines":[405,436,546,578]}],"unknowns":[{"id":"A","_a":"OkAuBBtk"},{"id":"B","_a":"OkAuBhtk"},{"id":"C","_a":"OkAuQxUbLFNDPw=="}],"s1":{"title":"Station 1: Match the fingerprint","intro":"Each reference spectrum shows an element’s main visible lines. Tap an unknown spectrum, then tap the element (or elements) it matches, or drag it there. One unknown is a \u003cstrong>mixture\u003c/strong>: its lines come from two elements.","fb":{"ok":"Each unknown’s lines are explained, and every element’s full set of lines is there. The mixture shows the union of hydrogen’s and sodium’s lines.","cH":"Four lines are hydrogen’s, but 589 nm isn’t. Which element has a line at 589 nm?","cNa":"589 nm is sodium’s, but the other four lines aren’t. Which element has lines at 410, 434, 486 and 656 nm?","aNa":"588 nm is close to sodium’s 589, but sodium has no lines at 447, 502 or 668 nm. The whole set of lines must match.","part":"Not every unknown is tagged correctly yet. Open \u003cstrong>Check it with data\u003c/strong> and compare the lines.","empty":"Tag all three unknowns first."}},"s2":{"title":"Station 2: An element found in the Sun","html":"\u003cp>In 1868 the Sun’s spectrum showed a yellow line at 588 nm that matched no known element. It was named \u003cstrong>helium\u003c/strong>, after the Greek word for the Sun, and found on Earth decades later.\u003c/p>","prompt":"Why can a dark or bright line name an element?"},"s3":{"title":"Station 3: Where Bohr fails","intro":"Bohr’s ladder has one electron. Compare its predicted lines with the lines really observed.","cap":"Two or more electrons push on each other; Bohr’s model has no way to include that."},"blocks":[{"title":"Canadian connection: Gerhard Herzberg","html":"\u003cp>Gerhard Herzberg came to Canada in 1935 and worked at the National Research Council in Ottawa. His spectroscopy revealed the structures of molecules and short-lived fragments of molecules, and he won the Nobel Prize in Chemistry in 1971.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Spectra as fingerprints quick check","items":[{"id":"q1","goal":5,"prompt":"An unknown shows lines at 410, 434, 486, 589 and 656 nm. What’s in it?","choices":[{"t":"Helium only","fb":"Four lines are hydrogen’s; 589 nm is sodium’s.","_n":"1468f","_k":"24282982"},{"t":"Sodium only","fb":"Four lines are hydrogen’s; 589 nm is sodium’s.","_n":"1567f","_k":"2085ce88"},{"t":"Hydrogen and sodium","fb":"Right. Four lines are hydrogen’s; 589 nm is sodium’s.","_n":"1666f","_k":"727b6c19"},{"t":"Mercury and helium","fb":"Four lines are hydrogen’s; 589 nm is sodium’s.","_n":"1765f","_k":"eb9f2a88"}]},{"id":"q2","goal":4,"prompt":"Why is each element’s spectrum unique?","choices":[{"t":"Its energy gaps are unique","fb":"Right. Lines come from gaps between levels.","_n":"1864f","_k":"c71163fd"},{"t":"It has a unique mass","fb":"Lines come from gaps between levels.","_n":"1963f","_k":"fb23cff0"},{"t":"Its atoms are a unique colour","fb":"Lines come from gaps between levels.","_n":"1a62f","_k":"88a11615"},{"t":"Its electrons move at unique speeds","fb":"Lines come from gaps between levels.","_n":"1b61f","_k":"88abc859"}]},{"id":"q3","goal":5,"prompt":"How was helium first identified?","choices":[{"t":"A spectral line in sunlight","fb":"Right. It was seen in the Sun first.","_n":"1c60f","_k":"f875e222"},{"t":"Cathode rays","fb":"It was seen in the Sun first.","_n":"1de3f","_k":"1bb4c050"},{"t":"A gas collected from rocks","fb":"It was seen in the Sun first.","_n":"1ee4f","_k":"4670e6d2"},{"t":"Gold foil","fb":"It was seen in the Sun first.","_n":"1fe5f","_k":"cdce1478"}]},{"id":"q4","goal":5,"prompt":"Why does Bohr’s model fail for helium?","choices":[{"t":"Helium emits no light","fb":"The model only works with one electron.","_n":"1ge6f","_k":"51692bb6"},{"t":"It ignores electron–electron repulsion","fb":"Right. The model only works with one electron.","_n":"1hdff","_k":"49c25459"},{"t":"Helium has no levels","fb":"The model only works with one electron.","_n":"1ie0f","_k":"cc976c9a"},{"t":"Helium has no nucleus","fb":"The model only works with one electron.","_n":"1je1f","_k":"f38c3c00"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Transition ↔ line","summary":"Transition ↔ line","goal":2,"instruction":"Match each electron fall to the line it gives out.","leftTitle":"Transition","rightTitle":"Line","left":[{"id":"l1","t":"3 → 2","why":"3 → 2: 1.89 eV, the smallest visible gap: the longest visible wavelength, red.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","3 → 2 gives 656 nm, red."]},{"id":"l2","t":"4 → 2","why":"4 → 2: 2.55 eV: a visible fall to `n = 2`, blue-green.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","4 → 2 gives 486 nm, blue-green."]},{"id":"l3","t":"5 → 2","why":"5 → 2: 2.86 eV: a bigger visible gap, so a shorter wavelength.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","5 → 2 gives 434 nm, violet-blue."]},{"id":"l4","t":"6 → 2","why":"6 → 2: 3.02 eV, the largest visible gap: the shortest visible wavelength, violet.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","6 → 2 gives 410 nm, violet."]},{"id":"l5","t":"2 → 1","why":"2 → 1: 10.20 eV: every fall to `n = 1` is far above visible-light energies.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","2 → 1 gives 122 nm, ultraviolet."]},{"id":"l6","t":"3 → 1","why":"3 → 1: 12.09 eV: a fall to `n = 1`, ultraviolet.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","3 → 1 gives 103 nm, ultraviolet."]},{"id":"l7","t":"4 → 3","why":"4 → 3: 0.66 eV: a small gap, so a long wavelength in the infrared.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","4 → 3 gives 1875 nm, infrared."]},{"id":"l8","t":"5 → 3","why":"5 → 3: 0.97 eV: a fall to `n = 3`, infrared.","hints":["Which level does it end on?","`n = 1` is UV, `n = 2` visible, `n = 3` IR.","5 → 3 gives 1282 nm, infrared."]}],"right":[{"id":"r1","t":"656 nm, red"},{"id":"r2","t":"486 nm, blue-green"},{"id":"r3","t":"434 nm, violet-blue"},{"id":"r4","t":"410 nm, violet"},{"id":"r5","t":"122 nm, ultraviolet"},{"id":"r6","t":"103 nm, ultraviolet"},{"id":"r7","t":"1875 nm, infrared"},{"id":"r8","t":"1282 nm, infrared"}],"_a":"GkAKUBsDQEBQQEpDVQtACEMQVEMVGw4BQ1hEEwobThANVkRbG0tWEE1AClQbA0BAVEBKQ1UPQAhDEFBDFRsOBUNYRBMOG04QDVpEWxtLWhAc","wrong":{"l1|r4":"656 nm is the \u003cstrong>smallest\u003c/strong> visible gap: red, not violet.","l5|r1":"Falls to `n = 1` are UV.","l5|r2":"Falls to `n = 1` are UV.","l5|r3":"Falls to `n = 1` are UV.","l5|r4":"Falls to `n = 1` are UV."},"wrongDefault":"Where the fall ends sets the region; the bigger the gap, the shorter the wavelength."},{"id":"calc","type":"custom","title":"Energy ladder calculations","summary":"Energy ladder calculations","star":true,"goal":[3,4],"instruction":"Seven items: number entry and choices. Items 5 to 7 are non-routine; items 6 and 7 go beyond the Final Check.","how":"Type your answer or tap your choice, then press Check. Energies within 0.01 eV are accepted.","use":"Hydrogen’s energy levels: `E_1` = −13.60 eV, `E_2` = −3.40 eV, `E_3` = −1.51 eV, `E_4` = −0.85 eV, `E_5` = −0.54 eV, `E_6` = −0.38 eV.","items":[{"id":"c1","kind":"num","goal":3,"prompt":"Photon energy for 5 → 2?","_a":"U0xeVw==","tol":0.01,"unit":"eV","display":"2.86 eV","wrong":[{"match":3.94,"fb":"The photon carries the \u003cstrong>difference\u003c/strong>: −0.54 − (−3.40) = 2.86 eV, not 0.54 + 3.40."}],"fb":"Photon energy = \u003ci>E\u003c/i>(upper) − \u003ci>E\u003c/i>(lower).","why":"−0.54 − (−3.40) = 2.86 eV.","hints":["The photon carries the gap.","−0.54 − (−3.40).","2.86 eV."]},{"id":"c2","kind":"num","goal":3,"prompt":"Energy needed to remove the electron completely from `n = 2`?","_a":"UkxS","tol":0.01,"unit":"eV","display":"3.40 eV","wrong":[{"match":13.6,"fb":"That’s from `n = 1`."}],"fb":"Removing the electron means lifting it from its level all the way to 0 eV.","why":"From −3.40 eV up to 0 eV: 3.40 eV.","hints":["A removed electron has 0 eV.","0 − (−3.40).","3.40 eV."]},{"id":"c3","kind":"num","goal":3,"prompt":"How many different lines can atoms excited to `n = 5` produce?","_a":"UFI=","tol":0,"unit":"lines","display":"10 lines","keypad":"numeric","wrong":[{"match":4,"fb":"Count every pair of levels: 5 × 4 ÷ 2."}],"fb":"Count every pair of levels from 1 to 5.","why":"5 × 4 ÷ 2 = 10.","hints":["Each line joins two levels.","Count the pairs among levels 1 to 5: `n(n - 1) ÷ 2`.","5 × 4 ÷ 2 = 10."]},{"id":"c4","kind":"chips","goal":4,"prompt":"\u003cstrong>Investigation:\u003c/strong> Why must a flame-test wire be cleaned between samples?","options":[{"t":"So the wire cools down before the next test","why":"Contamination adds another element’s lines.","_n":"1ke2f","_k":"bb3673b6"},{"t":"To make the flame hotter","why":"Contamination adds another element’s lines.","_n":"1ldbf","_k":"59d75dc6"},{"t":"So the wire itself doesn’t glow","why":"Contamination adds another element’s lines.","_n":"1mdcf","_k":"07d41616"},{"t":"Traces of one salt (especially sodium’s bright yellow) can hide another’s colour","why":"Contamination adds another element’s lines.","_n":"1n55f","_k":"e9b2e6d3"}],"hints":["What could be left on the wire from the last sample?","A trace of the last salt gives out its own lines too.","Traces of one salt (especially sodium’s bright yellow) can hide another’s colour."]},{"id":"c5","kind":"multi","star":true,"goal":4,"prompt":"Which of these photons can a ground-state hydrogen atom absorb: 10.20, 11.00, 12.09, 13.00 eV? (Select all.)","options":[{"t":"10.20 eV","why":"Exactly the 1 → 2 gap.","_n":"1o54f","_k":"00e19cef"},{"t":"11.00 eV","why":"Not a gap: it passes through.","_n":"1p57f","_k":"47ae7fe8"},{"t":"12.09 eV","why":"Exactly the 1 → 3 gap.","_n":"1q56f","_k":"2df3297f"},{"t":"13.00 eV","why":"Not a gap either (5 → 1 is 13.06 eV), and it’s below the 13.60 eV ionization energy: it passes through.","_n":"1r51f","_k":"f96162e8"}],"why":"10.20 eV (1 → 2) and 12.09 eV (1 → 3) match gaps exactly. The photon must match a gap \u003cstrong>exactly\u003c/strong>. Only an energy above the ionization energy can remove the electron outright.","hints":["List the gaps from `n = 1`: 10.20, 12.09, 12.75, 13.06, 13.22 eV.","Which photons match one of them exactly?","10.20 and 12.09."]},{"id":"c6","kind":"num","star":true,"goal":3,"prompt":"An electron falls 6 → 2, then 2 → 1. Total energy given out?","_a":"UFFIUws=","tol":0.01,"unit":"eV","display":"13.22 eV","wrong":[{"match":3.02,"fb":"Add the second photon: 10.20."},{"match":10.2,"fb":"Add the first photon: 3.02."}],"fb":"Add the energies of the two photons.","why":"3.02 + 10.20 = 13.22 eV: the same as one fall from 6 to 1.","hints":["Two falls, two photons.","3.02 eV + 10.20 eV.","13.22 eV."]},{"id":"c7","kind":"two","star":true,"goal":4,"prompt":"A photon of 14.00 eV hits a ground-state atom. What happens, and how much energy does the freed electron carry away?","options":[{"t":"The atom ionizes: the electron is removed","_n":"1s50f","_k":"e9c003cf"},{"t":"The electron jumps to `n = 6`","why":"A jump to `n = 6` needs exactly 13.22 eV. Is 14.00 eV more than the 13.60 eV ionization energy?","_n":"1t53f","_k":"a1b6cb50"},{"t":"The photon passes straight through","why":"14.00 eV is more than the 13.60 eV ionization energy, so it can remove the electron outright.","_n":"1u52f","_k":"4d0ab7fc"}],"_a":"UUxS","tol":0.01,"unit":"eV","display":"ionization; 0.40 eV of motion","label":"Energy the freed electron carries away:","fb":"13.60 eV frees it; the rest, 0.40 eV, is motion.","hints":["Is 14.00 eV more than the ionization energy?","Yes, by 14.00 − 13.60.","The electron leaves with 0.40 eV."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Hadiya","how":"","goal":[3,4],"instruction":"Hadiya made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the energy of the photon emitted when the electron falls from `n = 4` to `n = 2`.","steps":["`E_4` = −0.85 eV and `E_2` = −3.40 eV.","Photon energy = 0.85 + 3.40 = 4.25 eV.","That’s above 3.1 eV, so the photon is ultraviolet."],"_a":"UA==","stepFb":["Correct. Keep checking.","","This follows from step 2."],"fixes":[{"t":"Photon energy = 3.40 − 0.85 = −2.55 eV.","why":"Energies of emitted photons are positive.","_n":"1v5df","_k":"f745a535"},{"t":"Photon energy = `E_4 - E_2` = −0.85 − (−3.40) = 2.55 eV: visible, blue-green (486 nm).","why":"The photon carries the gap between the levels.","_n":"1w5cf","_k":"15f9bb34"},{"t":"Step 2 is correct.","why":"The photon carries the \u003cstrong>difference\u003c/strong>: −0.85 − (−3.40) = 2.55 eV, not 0.85 + 3.40.","_n":"1x4ff","_k":"22683f46"},{"t":"Photon energy = −0.85 × −3.40.","why":"Multiply? No: subtract.","_n":"1y50f","_k":"5299779a"}],"hints":["The photon carries the gap.","Gap = higher − lower.","2.55 eV."]},{"id":"e2","goal":4,"task":"Will a ground-state hydrogen atom absorb an 11.00 eV photon?","steps":["The gap from `n = 1` to `n = 2` is 10.20 eV.","11.00 eV is more than 10.20 eV.","So the atom absorbs it and jumps to `n = 2`, keeping the extra 0.80 eV.","Then it emits a 10.20 eV photon."],"_a":"Uw==","stepFb":["Correct.","Correct.","","This builds on step 3."],"fixes":[{"t":"It jumps to `n = 3`.","why":"That needs 12.09 eV exactly.","_n":"1z4df","_k":"4f4c1e3e"},{"t":"Step 3 is correct.","why":"The photon must match a gap \u003cstrong>exactly\u003c/strong>. Only an energy above the ionization energy can remove the electron outright.","_n":"204ef","_k":"9d18beb8"},{"t":"The atom ionizes.","why":"That needs 13.60 eV.","_n":"2153f","_k":"fac7b0c8"},{"t":"11.00 eV matches no gap from `n = 1` (the next is 12.09 eV), and it’s below the 13.60 eV ionization energy, so the photon passes through.","why":"For a jump between levels the photon must match the gap exactly.","_n":"2254f","_k":"537f831f"}],"hints":["Must the photon match exactly?","Yes, for jumps between levels.","No match: it passes through."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the ladder: photons passing straight through, or lines you couldn’t see?"},{"id":"j2","q":"In your own words, why do line spectra prove that electron energies are fixed?"},{"id":"j3","q":"Explain to a friend how to find a photon’s energy from an energy-level diagram."},{"id":"j4","q":"Which part (signs, regions or counting lines) still trips you up? How will you practise it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In Bohr’s model, when does a hydrogen atom emit light?","options":[{"t":"While its electron stays in one level","why":"Jumping up absorbs a photon; falling down emits one; staying put does neither.","_n":"2351f","_k":"6606a92c"},{"t":"Whenever the atom is heated, at any energy","why":"Heat lifts electrons; light comes as they fall.","_n":"2452f","_k":"68515a08"},{"t":"When its electron jumps to a higher level","why":"Jumping up absorbs a photon; falling down emits one; staying put does neither.","_n":"2557f","_k":"6a19fca0"},{"t":"When its electron falls from a higher energy level to a lower one","why":"Falling down emits a photon whose energy matches the gap.","_n":"2658f","_k":"c79fed4f"}]},"b":{"prompt":"In Bohr’s model, when can a photon lift the electron to a higher level?","options":[{"t":"Only when the atom is cold","why":"Temperature affects which level electrons start from, not this rule.","_n":"27e20","_k":"584fb059"},{"t":"Whenever its energy is at least as big as the gap","why":"The photon must match a gap \u003cstrong>exactly\u003c/strong>. Only an energy above the ionization energy can remove the electron outright.","_n":"28e10","_k":"b53e5d7d"},{"t":"When the photon’s energy exactly matches the gap","why":"Only an exact match is absorbed for a jump between levels.","_n":"29e00","_k":"6b7bf8b6"},{"t":"Whenever it is visible light","why":"Many gaps aren’t visible.","_n":"2adf0","_k":"ccb475b0"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which transition produces hydrogen’s red line (656 nm)?","options":[{"t":"2 → 1","why":"That’s UV.","_n":"2be60","_k":"4927a91c"},{"t":"3 → 2","why":"1.89 eV, the smallest visible gap: red.","_n":"2ce50","_k":"e5c7b88d"},{"t":"6 → 2","why":"That’s violet.","_n":"2de40","_k":"6c392d74"},{"t":"4 → 3","why":"That’s IR.","_n":"2ee30","_k":"a7b73cae"}]},"b":{"prompt":"In which region are transitions that end at `n = 1`?","options":[{"t":"Radio","why":"Far too low in energy.","_n":"2fda0","_k":"7c7a42c0"},{"t":"Ultraviolet","why":"Falls to `n = 1` are the biggest gaps (10.20 eV and up): UV.","_n":"2gd90","_k":"fcf71ede"},{"t":"Visible","why":"Only falls to `n = 2` (from 3–6) are visible. Falls to `n = 1` are UV; falls to `n = 3` or higher are IR.","_n":"2hdbf","_k":"1fd1d7cb"},{"t":"Infrared","why":"Those gaps are the largest: UV.","_n":"2idcf","_k":"bfaa27bb"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What is an emission line spectrum?","options":[{"t":"A full rainbow of colours","why":"That’s continuous.","_n":"2jddf","_k":"6ef235cf"},{"t":"White light only","why":"The lines are separate "t":"0.38 eV","why":"That’s one level.","_n":"2yf9c","_k":"d87de688"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A sample of hydrogen atoms has electrons excited to levels up to `n = 5`. How many different emission lines can it produce?","options":[{"t":"4","why":"That counts only falls to `n = 1`.","_n":"2zfac","_k":"a63a9023"},{"t":"5","why":"Count pairs of levels.","_n":"30fbc","_k":"636d9b99"},{"t":"10","why":"5 × 4 ÷ 2.","_n":"31f8c","_k":"4afe22cd"},{"t":"20","why":"Each pair counts once: divide by 2.","_n":"32f7c","_k":"cc1f7e02"}]},"b":{"prompt":"A sample of hydrogen atoms has electrons excited to levels up to `n = 6`. How many different emission lines can it produce?","options":[{"t":"5","why":"That counts only falls to `n = 1`.","_n":"33f6c","_k":"18209dfe"},{"t":"6","why":"Count pairs of levels.","_n":"34f5c","_k":"fbe5c3a6"},{"t":"15","why":"6 × 5 ÷ 2.","_n":"35fcc","_k":"4b7992d6"},{"t":"30","why":"Divide by 2.","_n":"36fbc","_k":"41159f83"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Which photon can a ground-state hydrogen atom absorb?","use":"`E_1` = −13.60 eV, `E_2` = −3.40 eV, `E_3` = −1.51 eV, `E_4` = −0.85 eV, `E_5` = −0.54 eV, `E_6` = −0.38 eV.","options":[{"t":"11.00 eV","why":"No gap matches.","_n":"37fac","_k":"82ec89c9"},{"t":"5.00 eV","why":"The photon must match a gap \u003cstrong>exactly\u003c/strong>. Only an energy above the ionization energy can remove the electron outright.","_n":"38f9c","_k":"9a66758e"},{"t":"1.89 eV","why":"That gap starts at `n = 2`, not 1.","_n":"3900c","_k":"aa143e50"},{"t":"10.20 eV","why":"Exactly the 1 → 2 gap.","_n":"3affc","_k":"4f2ad77b"}]},"b":{"prompt":"An atom with its electron at `n = 2` is hit by four photons. Which one is absorbed, lifting the electron to a higher level?","use":"`E_1` = −13.60 eV, `E_2` = −3.40 eV, `E_3` = −1.51 eV, `E_4` = −0.85 eV, `E_5` = −0.54 eV, `E_6` = −0.38 eV.","options":[{"t":"2.00 eV","why":"The photon must match a gap \u003cstrong>exactly\u003c/strong>. Only an energy above the ionization energy can remove the electron outright.","_n":"3bfec","_k":"b2e94c8c"},{"t":"10.20 eV","why":"That’s the 1 → 2 gap; from `n = 2` the gaps are different. (10.20 eV is more than the 3.40 eV needed to remove the electron from `n = 2`, so it would ionize the atom, not lift the electron to a level.)","_n":"3cffc","_k":"d04df27e"},{"t":"1.00 eV","why":"The photon must match a gap \u003cstrong>exactly\u003c/strong>. Only an energy above the ionization energy can remove the electron outright.","_n":"3dfcc","_k":"ce82a394"},{"t":"2.55 eV","why":"Exactly the 2 → 4 gap.","_n":"3efdc","_k":"940f4f85"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why hydrogen gives a line spectrum, not a continuous one?","options":[{"t":"“The prism only lets some colours through.”","why":"A prism spreads all colours.","_n":"3ffac","_k":"fc02ea84"},{"t":"“Its electron can only have certain energies, so only photons matching the gaps between levels are emitted.”","why":"Fixed levels mean fixed gaps, so only certain photons, and only certain lines.","_n":"3gfbc","_k":"c0e25541"},{"t":"“Hydrogen’s electrons move in every possible orbit.”","why":"Then the spectrum would be continuous.","_n":"3hf8c","_k":"2694fa77"},{"t":"“Hydrogen is a small atom.”","why":"Size doesn’t explain lines.","_n":"3if9c","_k":"50bb953b"}]},"b":{"prompt":"Which is the best explanation of why each element has its own line spectrum?","options":[{"t":"“Each element has a different set of energy levels, so its gaps, and its photons, are unique.”","why":"Different levels, different gaps, different lines.","_n":"3j06c","_k":"32a7a7aa"},{"t":"“Bohr’s model applies equally to all elements.”","why":"It predicts hydrogen exactly but fails for atoms with two or more electrons.","_n":"3k07c","_k":"cbfe2a15"},{"t":"“Each element is a different colour as a solid.”","why":"Spectra come from atoms’ energy gaps.","_n":"3l04c","_k":"93c947c9"},{"t":"“Each element has a different m oil showed the nucleus, not helium.","_n":"3z86c","_k":"0a5399b5"},{"t":"The Sun is made only of helium","why":"The Sun is mostly hydrogen.","_n":"4087c","_k":"e860b41f"},{"t":"Helium only exists in the Sun","why":"It was later found on Earth.","_n":"4188c","_k":"edda16d5"},{"t":"Its spectral line in sunlight matched no known element","why":"An unmatched line meant an unknown element.","_n":"4289c","_k":"80ed89f8"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A salt gives a lilac flame, and a spectroscope shows lines that match potassium’s reference spectrum. What does this show?","options":[{"t":"Nothing, because flame colours are just one wavelength","why":"A flame colour mixes several lines; a spectroscope separates them.","_n":"4382c","_k":"a80521ed"},{"t":"The salt contains every element with a purple line","why":"The whole set of lines must match.","_n":"4483c","_k":"ff958b6f"},{"t":"The salt contains potassium","why":"The whole set of lines matches potassium’s.","_n":"4590d","_k":"6063fce4"},{"t":"The salt is pure, with nothing else in it","why":"Other lines could be hidden; only potassium is confirmed.","_n":"468fd","_k":"5ee49a79"}]},"b":{"prompt":"A lab passes light through a vapourized drinking-water sample and sees absorption exactly at lead’s wavelengths. What does this show?","options":[{"t":"Only that the water is hot","why":"Wavelength matching identifies the element.","_n":"478ed","_k":"d4316723"},{"t":"The water contains lead","why":"Absorption at exactly lead’s lines names lead.","_n":"488dd","_k":"5c69ee22"},{"t":"The water contains no metals","why":"Absorption at lead’s lines means lead is present.","_n":"498cd","_k":"2ad9610b"},{"t":"The lead is in an ionic compound","why":"The lines name the element, not its compound.","_n":"4a8bd","_k":"12c9467a"}]}}]},"task":{"title":"Light a sign","summary":"Light a sign","statement":"\u003cp>Design a hydrogen sign by choosing exactly \u003cstrong>three\u003c/strong> electron falls. Your sign must meet e
