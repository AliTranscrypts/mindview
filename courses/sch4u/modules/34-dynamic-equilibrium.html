.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 34: hero rooms, Two-way traffic (C6 particle box + C8 graphs), Either side stations, Graph detective, Same destination.
   Colours: course plan §4 equilibrium roles --eq-r (A), --eq-p (B), --eq-f (forward rate), --eq-b (reverse rate). */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.de-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.de-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.de-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Explore: Two-way traffic */
.de-how{margin-top:0}
.de-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 12px}
.de-sys[hidden]{display:none}
.de-set{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;margin:0 0 14px;background:var(--sheet)}
.de-set summary{font-weight:700;cursor:pointer;min-height:30px}
.de-setg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 24px;margin-top:8px}
.de-setn{margin:10px 0 0;min-height:1.2em}
.de-sl{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.de-sll{color:var(--ink-2);font-weight:700}
.de-sl input[type=range]{width:100%;max-width:340px;min-height:28px;accent-color:var(--pen)}
.de-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px 26px;align-items:start}
.de-view,.de-side{min-width:0}
.de-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.de-svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.de-leg{margin:8px 0 0;line-height:1.9}
.de-sw{display:inline-block;width:26px;height:12px;vertical-align:-1px}
.de-cap{min-height:1.5em;margin:8px 0 2px;font-size:1rem}
.de-btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.de-graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px 22px;margin-top:16px}
.de-fig{margin:0;min-width:0}
.de-fig figcaption{font-weight:700;font-size:.95rem;margin:0 0 4px}
.de-g{display:block;width:100%;max-width:520px;height:auto;font-family:var(--font-ui)}
.de-note{margin:12px 0 0}
.de-gcap{margin:6px 0 14px}

/* Part 3 stations */
.de-st h3{margin-bottom:6px}
#p3-app > .de-st:first-child{margin-top:0;padding-top:0;border-top:0}
.de-runs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.de-run{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .85em;font-size:.92rem;min-height:36px}
.de-run[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.de-gbox{max-width:540px}
.de-rt,.de-hi{margin-top:10px}
.de-s1c{min-height:1.4em;margin:10px 0 0}
.de-cells{display:flex;flex-wrap:wrap;gap:6px}
.de-cell{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.25em .6em;font-size:.92rem;min-height:34px}
.de-cell.done{border-color:var(--ink-2)}
.de-cell.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.de-msg2{min-height:1.4em;margin:8px 0 0}
.de-zv{margin-top:10px;max-width:520px}
.de-zv[hidden]{display:none}
.de-ratio{margin-top:10px}
.de-s3c{margin:10px 0 0;min-height:1.4em}

/* Graph detective */
.de-chiplist{margin:6px 0 4px}
.de-unit{color:var(--ink-2);font-size:.92rem}

/* task */
.de-conds{margin:.4em 0 0 1.2em}
.de-h4{margin:0 0 6px;font-size:1rem}
.de-tg{margin-top:4px}
.de-tkf,.de-tkr,.de-ta0{margin-bottom:12px}

@media (max-width:760px){
  .de-grid{grid-template-columns:minmax(0,1fr)}
}

k":"8ed9db0a"}],"hints":["rate = \u003ci>k\u003c/i>[A].","[A] goes down.","The rate goes down."]},{"id":"w2","skill":"Rates and concentration","goal":5,"prompt":"rate = \u003ci>k\u003c/i>[B], with \u003ci>k\u003c/i> = 0.10 s\u003csup>−1\u003c/sup> and [B] = 0.75 mol/L. Rate?","options":[{"t":"7.5 mol/(L·s)","why":"That divides 0.75 by 0.10.","_n":"4236","_k":"2cc510e6"},{"t":"0.75 mol/(L·s)","why":"Multiply by \u003ci>k\u003c/i>.","_n":"5226","_k":"ac78be7a"},{"t":"0.075 mol/(L·s)","why":"0.10 × 0.75 = 0.075 mol/(L·s).","_n":"6216","_k":"b64f97f9"},{"t":"0.85 mol/(L·s)","why":"That adds them.","_n":"7286","_k":"b459244a"}],"hints":["Multiply.","0.10 × 0.75.","0.075."]},{"id":"w3","skill":"Reversible changes","goal":3,"prompt":"Which change is easily reversible?","options":[{"t":"Wood rotting","why":"Decomposition isn’t reversed.","_n":"8276","_k":"ad4209ae"},{"t":"An egg cooking","why":"Proteins change permanently.","_n":"9b5f","_k":"b0bc75f5"},{"t":"Paper burning","why":"Burning can’t be undone.","_n":"ab6f","_k":"43646b42"},{"t":"Water evaporating and condensing","why":"Vapour condenses back to liquid: the change runs both ways.","_n":"bb3f","_k":"f92181eb"}],"hints":["Which can go back the other way?","Think of a sealed jar with water.","Evaporation and condensation."]},{"id":"w4","skill":"Reversible changes","goal":3,"prompt":"In a saturated salt solution with extra solid on the bottom, which is true?","options":[{"t":"All the solid will eventually dissolve","why":"Saturated means it’s full.","_n":"cb4f","_k":"30415c7a"},{"t":"No salt dissolves any more","why":"Dissolving continues. Both directions keep going at the same rate; a tracer proves it.","_n":"db1f","_k":"2ff07654"},{"t":"The solution keeps getting more concentrated","why":"It stays constant.","_n":"eb2f","_k":"71f58baa"},{"t":"Salt dissolves and crystallizes at the same rate","why":"Dissolving = crystallizing, so the amounts stay constant.","_n":"faff","_k":"aec6d593"}],"hints":["What does saturated mean?","It holds as much as it can.","Dissolving = crystallizing."]},{"id":"w5","skill":"Closed and open systems","goal":2,"prompt":"Which is a closed system?","options":[{"t":"A pot of boiling soup with no lid","why":"Steam escapes.","_n":"gb0f","_k":"3eff6022"},{"t":"A puddle on a sidewalk","why":"Vapour escapes.","_n":"hbdf","_k":"b6fcaa09"},{"t":"A campfire","why":"Gases leave.","_n":"ibef","_k":"978da235"},{"t":"A sealed bottle of soda","why":"Matter can’t get in or out.","_n":"jaff","_k":"bfef9f97"}],"hints":["Can matter leave?","Look for a seal.","The sealed bottle."]},{"id":"w6","skill":"Closed and open systems","goal":2,"prompt":"Why does an open glass of water slowly disappear?","options":[{"t":"Evaporation stops at night","why":"It slows, but continues.","_n":"kaef","_k":"8900dafa"},{"t":"The glass absorbs it","why":"Glass isn’t porous.","_n":"ladf","_k":"2172541c"},{"t":"Water breaks down into H₂ and O₂","why":"That needs electrolysis.","_n":"macf","_k":"054b52be"},{"t":"Vapour escapes, so condensation can’t balance evaporation","why":"The vapour leaves the system, so it can’t come back.","_n":"nb3f","_k":"5e9786cf"}],"hints":["Where does the vapour go?","Out of the system.","So it can’t come back."]}],"refreshers":{"Rates and concentration":"rate = \u003ci>k\u003c/i> × concentration (for one-step changes). As a reactant is used up, its rate falls.","Reversible changes":"Some changes can run both ways: evaporation ⇌ condensation, dissolving ⇌ crystallizing, and many reactions.","Closed and open systems":"Closed: no matter enters or leaves. Only closed systems can reach equilibrium."}}},"explore":{"heading":"Two-way traffic","intro":"Set the forward and reverse rate constants, choose where to start, and watch the rates meet.","how":"Choose a system, open \u003cstrong>Settings\u003c/strong> to set \u003ci>k\u003c/i>\u003csub>f\u003c/sub>, \u003ci>k\u003c/i>\u003csub>r\u003c/sub>, the starting amounts and the container, then press \u003cstrong>Play\u003c/str keep up: no equilibrium.","_n":"292e0","_k":"43f88a13"},{"t":"A burning candle","why":"Products escape and it isn’t reversible.","_n":"2a2d0","_k":"fbe72dda"}]},"b":{"prompt":"Why can’t an open beaker of water reach liquid–vapour equilibrium?","options":[{"t":"Water can’t evaporate from glass","why":"It can.","_n":"2b300","_k":"c659e906"},{"t":"Evaporation stops in open air","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"2c2f0","_k":"08ff3812"},{"t":"The beaker is too small","why":"Size isn’t the issue.","_n":"2d320","_k":"5a3396e6"},{"t":"The vapour escapes, so condensation can’t keep up with evaporation","why":"Open system: no equilibrium.","_n":"2e310","_k":"1d3963cf"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which is a physical equilibrium?","options":[{"t":"H₂(g) + I₂(g) ⇌ 2HI(g) in a sealed flask","why":"That’s chemical.","_n":"2f340","_k":"ec92536e"},{"t":"Wood burning in a stove","why":"Not an equilibrium.","_n":"2g330","_k":"344c3a58"},{"t":"N₂(g) + 3H₂(g) ⇌ 2NH₃(g)","why":"That’s chemical.","_n":"2h460","_k":"5bca443b"},{"t":"A saturated salt solution with undissolved salt","why":"Dissolving ⇌ crystallizing: no new substances form.","_n":"2i470","_k":"675d3c10"}]},"b":{"prompt":"Which is a chemical equilibrium?","options":[{"t":"N₂O₄(g) ⇌ 2NO₂(g) in a sealed tube","why":"A reversible reaction in a closed container.","_n":"2j440","_k":"c97679d8"},{"t":"Ice and water at 0 °C in an insulated flask","why":"That’s physical.","_n":"2k450","_k":"e5c2f77b"},{"t":"Water ⇌ water vapour in a sealed jar","why":"That’s physical.","_n":"2l420","_k":"9f2e3eab"},{"t":"Sugar dissolving to saturation","why":"That’s physical.","_n":"2m430","_k":"981c1893"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"A ⇌ B with \u003ci>k\u003c/i>\u003csub>f\u003c/sub> = 0.30 s\u003csup>−1\u003c/sup> and \u003ci>k\u003c/i>\u003csub>r\u003c/sub> = 0.10 s\u003csup>−1\u003c/sup>, starting from [A] = 1.00 mol/L and no B. What is [A] at equilibrium?","options":[{"t":"0.25 mol/L","why":"[B] = 3[A] and [A] + [B] = 1.00.","_n":"2n400","_k":"60210728"},{"t":"0 mol/L","why":"It doesn’t go to completion.","_n":"2o410","_k":"4166e51b"},{"t":"0.50 mol/L","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"2p3e0","_k":"c13a0625"},{"t":"0.75 mol/L","why":"That’s [B].","_n":"2q3f0","_k":"5952c07f"}]},"b":{"prompt":"\u003ci>k\u003c/i>\u003csub>f\u003c/sub> = 0.10 s\u003csup>−1\u003c/sup>, \u003ci>k\u003c/i>\u003csub>r\u003c/sub> = 0.40 s\u003csup>−1\u003c/sup>, starting from [A] = 1.00 mol/L. What is [A] at equilibrium?","options":[{"t":"1.00 mol/L","why":"Some B forms.","_n":"2r708","_k":"fbc3c67a"},{"t":"0.20 mol/L","why":"That’s [B].","_n":"2s718","_k":"7b1b5fc2"},{"t":"0.50 mol/L","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"2t6e8","_k":"78abdd16"},{"t":"0.80 mol/L","why":"[B] ÷ [A] = 0.25.","_n":"2u6f8","_k":"64e3ad9b"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"H₂ + I₂ ⇌ 2HI at a fixed temperature. Starting with 1.00 mol/L each of H₂ and I₂ gives [HI] = 1.56 mol/L at equilibrium. A second flask (same volume and temperature) starts with 2.00 mol/L HI only. What is its equilibrium [HI]?","options":[{"t":"0.44 mol/L","why":"That’s how much HI breaks down.","_n":"2v748","_k":"0cae7f52"},{"t":"2.00 mol/L","why":"Some HI breaks down. Both directions keep going at the same rate; a tracer proves it.","_n":"2w758","_k":"cbc9e78a"},{"t":"1.00 mol/L","why":"Equilibrium can lie far to either side; it’s about equal rates.","_n":"2x728","_k":"1869161e"},{"t":"1.56 mol/L","why":"Same temperature, same totals: same equilibrium, from either side.","_n":"2y738","_k":"8ccc5079"}]},"b":{"prompt":"In that second flask, what is the equilibrium [H₂]?","options":[{"t":"0 mol/L","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"2z788","_k":"f5f7c21a"},{"t":"0.78 mol/L","why":"That’s how much H₂ reacts in the first flask.","_n":"30798","_k":"897f2396"},{"t":"1.00 mol/L","why":"Same temperature, same totals: same equilibrium, from either side.","_n":"31f69","_k":"81d0052c"},{"t":"0.22 mol/L","why":"0.44 mol/L of HI breaks down into 0.22 mol/L of H₂.","_n":"32f59","_k":"495e0773"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"On a rate–time graph, the forward rate starts at 0.30 mol/(L·s) and falls; the reverse rate starts at 0 and rises; they meet at 0.075 mol/(L·s) at about 12 s. What is true after 12 s?","options":[{"t":"Both rates drop to zero","why":"The forward rate falls until it matches the reverse rate, then stays there.","_n":"33f89","_k":"6004ef40"},{"t":"The concentrations become equal","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"34f79","_k":"c2b2b99c"},{"t":"The concentrations stay constant while both reactions continue at 0.075 mol/(L·s)","why":"Equal rates: constant concentrations, both directions still going.","_n":"35f29","_k":"1094bb4f"},{"t":"The forward reaction continues, but the reverse stops","why":"They’re equal.","_n":"36f19","_k":"aec16a68"}]},"b":{"prompt":"On a concentration–time graph, [A] and [B] level off at 0.25 and 0.75 mol/L. What does the levelling off show?","options":[{"t":"[A] = [B]","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"37f49","_k":"87970188"},{"t":"The forward and reverse rates have become equal","why":"Equal rates mean no net change.","_n":"38f39","_k":"528d1d6f"},{"t":"The system is open","why":"If a product escapes, the reverse process can’t keep up: no equilibrium.","_n":"39fe9","_k":"abeddef7"},{"t":"The reaction has stopped","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3afd9","_k":"e8b5dc42"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best description of dynamic equilibrium in a sealed jar of water?","options":[{"t":"“Water evaporates and vapour condenses at the same rate, so the amounts of liquid and vapour stay constant.”","why":"Equal rates, constant amounts, both still happening.","_n":"3b848","_k":"b25b4ca3"},{"t":"“Evaporation has stopped because the air is full.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3c858","_k":"7218bbb8"},{"t":"“Water evaporates faster than it condenses, forever.”","why":"Then the liquid would run out.","_n":"3d868","_k":"77a8ad14"},{"t":"“There are equal masses of liquid and vapour.”","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"3e878","_k":"ec0a965c"}]},"b":{"prompt":"Which is the best description of a saturated salt solution with solid on the bottom?","options":[{"t":"“Nothing dissolves any more.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3f808","_k":"3a3ab400"},{"t":"“The solid slowly disappears.”","why":"Its amount stays constant.","_n":"3g818","_k":"079f48a8"},{"t":"“The concentration of ions equals the mass of solid.”","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"3h828","_k":"4215bddc"},{"t":"“Solid dissolves and ions crystallize at equal rates, so the concentration stays constant while particles keep swapping.”","why":"Equal rates, constant concentration, particles still swapping.","_n":"3i838","_k":"ebc05287"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"A student says, ‘Starting with only products will give a different equilibrium mixture.’ Which is the best response?","options":[{"t":"“Starting with products gives no reaction.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3j7c8","_k":"c6cd7e82"},{"t":"“At the same temperature with the same total amounts, the same equilibrium is reached from either direction.”","why":"Same temperature, same totals: same equilibrium, from either side.","_n":"3k7d8","_k":"0fad888f"},{"t":"“Correct: the mixture depends on the start.”","why":"Same temperature, same totals: same equilibrium, from either side.","_n":"3l8a8","_k":"0866ecab"},{"t":"“Only the reactants can reach equilibrium.”","why":"Same temperature, same totals: same equilibrium, from either side.","_n":"3m898","_k":"4144f5ca"}]},"b":{"prompt":"A student says, ‘At equilibrium, the reaction is half finished.’ Which is the best response?","options":[{"t":"“Equilibrium can lie far toward reactants or products; it means the rates are equal, not that half has reacted.”","why":"Equilibrium can lie far to either side; it’s about equal rates.","_n":"3n888","_k":"c41fc4d3"},{"t":"“Correct: equilibrium is always 50%.”","why":"Equilibrium can lie far to either side; it’s about equal rates.","_n":"3o878","_k":"c3edec46"},{"t":"“At equilibrium, no reactants remain.”","why":"Both are present.","_n":"3p868","_k":"b60cccb0"},{"t":"“At equilibrium, the reaction is complete.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3q858","_k":"ab0e061a"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"Why does a sealed bottle of soda stay fizzy for months while an open one goes flat?","options":[{"t":"“Sealing stops CO₂ from leaving the liquid at all.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3r848","_k":"56df7120"},{"t":"“Soda goes flat only when it warms up.”","why":"Even a cold open soda goes flat.","_n":"3s838","_k":"38fd633e"},{"t":"“Sealed: CO₂ leaving and re-entering the solution reach equal rates. Open: CO₂ gas escapes, so the system can’t reach equilibrium.”","why":"Closed system: equilibrium. Open system: CO₂ is lost.","_n":"3t828","_k":"e5316683"},{"t":"“Opening the bottle adds CO₂.”","why":"CO₂ leaves.","_n":"3u818","_k":"1b537d8a"}]},"b":{"prompt":"Why does a closed perfume bottle keep the same amount of liquid while an open one dries out?","options":[{"t":"“Closed: evaporation and condensation balance. Open: the vapour escapes, so no equilibrium forms.”","why":"Only the closed bottle can reach equilibrium.","_n":"3vf88","_k":"5a941f0d"},{"t":"“Perfume only evaporates when it’s open.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"3wf98","_k":"5d66579e"},{"t":"“The lid cools the perfume.”","why":"Temperature isn’t the reason.","_n":"3xf68","_k":"0013e572"},{"t":"“Closed bottles have equal amounts of liquid and vapour.”","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"3yf78","_k":"5dc0e15e"}]}},{"id":"a2","cat":"A","goal":1,"a":{"prompt":"Radioactive chloride ions are added to a saturated silver chloride solution with solid on the bottom. Later the solid is radioactive, though its mass hasn’t changed. What does this show?","options":[{"t":"“Radioactivity makes salts less soluble.”","why":"That’s not what changed.","_n":"3zf48","_k":"1f48f842"},{"t":"“More solid formed.”","why":"The mass is unchanged.","_n":"40f58","_k":"5b2442e4"},{"t":"“The reaction stopped.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"41f28","_k":"a658e4be"},{"t":"“Dissolving and crystallizing continue at equal rates: the equilibrium is dynamic.”","why":"Tagged ions moved into the solid while its mass stayed the same.","_n":"42f38","_k":"659ad7e3"}]},"b":{"prompt":"Heavy water vapour (D₂O) is added to a sealed jar of ordinary water at equilibrium. Later, D₂O is found in the liquid, while the liquid level is unchanged. What does this show?","options":[{"t":"“Evaporation and condensation keep going at equal rates.”","why":"The tagged molecules moved while the level stayed the same.","_n":"43008","_k":"f51bbd9f"},{"t":"“The liquid and vapour now have equal amounts.”","why":"The \u003cstrong>rates\u003c/strong> are equal; the concentrations are constant but usually different.","_n":"44018","_k":"bdb8bae2"},{"t":"“The jar was open.”","why":"If a product escapes, the reverse process can’t keep up: no equilibrium.","_n":"45fe8","_k":"f91ddc45"},{"t":"“Condensation has stopped.”","why":"Both directions keep going at the same rate; a tracer proves it.","_n":"46fd8","_k":"9b63ac43"}]}}]},"task":{"title":"Same destination","summary":"Same destination","statement":"\u003cp>Set up A ⇌ B (total 1.00 mol/L) so it meets every condition. Can you find every setup?\u003c/p>\u003col class=\"de-conds\">\u003cli>At equilibrium, [B] = 0.60 mol/L.\u003c/li>\u003cli>At the start, the net reaction runs \u003cstrong>backwards\u003c/strong> (B → A).\u003c/li>\u003cli>It approaches equilibrium slowly enough to watch: \u003ci>k\u003c/i>\u003csub>f\u003c/sub> + \u003ci>k\u003c/i>\u003csub>r\u003c/sub> ≤ 0.50 s\u003csup>−1\u003c/sup>.\u003c/li>\u003c/ol>","checks":["[B] = 0.60 at equilibrium","Runs backwards at first","Slow enough to watch"],"tips":["[B] ÷ [A] = 0.60 ÷ 0.40 = 1.5, so \u003ci>k\u003c/i>\u003csub>f\u003c/sub> = 1.5 × \u003ci>k\u003c/i>\u003csub>r\u003c/sub>.","To run backwards, start with more B than the equilibrium amount.","Keep the two rate constants small."],"explainPrompt":"Explain how you chose the rate constants for [B] = 0.60, and why your starting mixture makes the reaction run backwards first.","vocab":"Use the words forward rate, reverse rate, equilibrium and closed system.","more":"There’s more than one setup. Can you find every one?","afterAt":4,"after3":"Two pairs of constants give the 1.5 ratio within the speed limit; each works from any start with more than 0.60 mol/L of B."},"cards":[["Dynamic equilibrium","Forward and reverse rates equal; concentrations constant; both still happening."],["Closed system","Matter can’t enter or leave; needed for equilibrium."],["Equal rates, not equal amounts","Concentrations are constant but usually different."],["A ⇌ B balance","\u003ci>k\u003c/i>\u003csub>f\u003c/sub>[A] = \u003ci>k\u003c/i>\u003csub>r\u003c/sub>[B], so [B] ÷ [A] = \u003ci>k\u003c/i>\u003csub>f\u003c/sub> ÷ \u003ci>k\u003c/i>\u003csub>r\u003c/sub>."],["Either direction","Same temperature and totals give the same equilibrium."],["Physical equilibrium","Liquid ⇌ vapour in a sealed jar; saturated solution with solid."],["Chemical equilibrium","A reversible reaction in a closed container, e.g. N₂O₄ ⇌ 2NO₂."],["Concentration–time graph","Curves level off when equilibrium is reached."],["Rate–time graph","Forward falls, reverse rises; they meet and stay equal."],["Tracer evidence","Tagged particles keep swapping at equilibrium."],["Open system","Products escape; no equilibrium."]]}};</script>
