<style>
:root{
--paper:#EDF3EA;--grid:#DAE6D5;--sheet:#FCFDFB;--ink:#1E2A57;--ink-2:#4D5A80;--rule:#C6D4C2;
--pen:#2343C4;--acol:#7A3DB8;--f3:#0E7C7B;

--hi:#F4DA4E;--hi-soft:rgba(244,218,78,.38);--hi-ink:#1E2A57;
--plot-grid:#E4ECE1;--plot-axis:#1E2A57;

--mv-top:0px;
color-scheme:light;
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){

--paper:#131B18;--grid:#1B2621;--sheet:#1A2420;--ink:#E5ECE4;--ink-2:#A8B7AC;--rule:#33443C;
--pen:#93AEFF;--acol:#C9A8FF;--f3:#5FD0CD;
--p-k:#FF9F5A;--p-d:#5FD0CD;--p-c:#F49AC8;--p-b:#D8D08F;--p-t:#7FD3F5;
--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;
--hi:#E6CF48;--hi-soft:rgba(230,207,72,.14);--hi-ink:#17201B;
--plot-grid:#243029;--plot-axis:#E5ECE4;
color-scheme:dark;
}
}
:root[data-theme="dark"]{
--paper:#131B18;--grid:#1B2621;--sheet:#1A2420;--ink:#E5ECE4;--ink-2:#A8B7AC;--rule:#33443C;
--pen:#93AEFF;--acol:#C9A8FF;--f3:#5FD0CD;
--p-k:#FF9F5A;--p-d:#5FD0CD;--p-c:#F49AC8;--p-b:#D8D08F;--p-t:#7FD3F5;
--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;
--hi:#E6CF48;--hi-soft:rgba(230,207,72,.14);--hi-ink:#17201B;
--plot-grid:#243029;--plot-axis:#E5ECE4;
color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{
margin:0;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:24px 24px;
font:400 1.0625rem/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
img,svg{max-width:100%}
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top));z-index:9;background:var(--paper);border-bottom:1.5px solid var(--rule)}
.top-inner{max-width:1060px;margin:0 auto;padding:10px 18px 0}
.top-row{display:flex;align-items:center;gap:12px 18px}
.brand{flex:1 1 auto;min-width:0;line-height:1.2}
.brand b{display:block;font:600 1.3rem var(--font-math);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{display:block;font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2);flex:0 0 auto}
.prog-bar{width:110px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.hd-btns{display:flex;gap:8px;flex:0 0 auto}
.home-link{flex:0 0 auto}
.theme-btn{min-width:2.6em;justify-content:center}
nav.steps{display:flex;gap:2px;overflow-x:auto;padding-top:6px;scrollbar-width:none;margin:0 -6px}
nav.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);font-weight:700;font-size:.95rem;padding:8px 8px 10px}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem}
.step.done .num{background:var(--green);border-color:var(--green);color:var(--sheet)}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.save-off{max-width:1060px;margin:10px auto 0;padding:0 18px}
.save-off p{margin:0;padding:10px 14px;border-left:4px solid var(--red);background:var(--bad-bg);border-radius:6px;max-width:none}
main{max-width:1060px;margin:0 auto;padding:6px 18px 40px}
h1,h2{font-family:var(--font-math);font-weight:600;line-height:1.15;margin:0 0 .45em}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem)}
h2{font-size:clamp(1.55rem,3.3vw,2rem)}
h3{font-size:1.15rem;line-height:1.3;margin:0 0 .45em}
h4{font-size:1rem;margin:0 0 .3em}
p{margin:0 0 .8em;max-width:68ch}
.muted{color:var(--ink-2)}
.tiny{font-size:.875rem}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:clamp(16px,3vw,30px);margin:22px 0}
.sheet > :last-child{margin-bottom:0}
.part{margin-top:30px;padding-top:24px;border-top:1.5px dashed var(--rule)}
.intro{padding:clamp(18px,4vw,36px) 0 0}
.intro p{font-size:1.1rem}
.next-row{display:flex;justify-content:flex-end;margin:8px 0 30px}
.m{font-family:var(--font-math);font-size:1.08em;white-space:nowrap}

.m .fnm{font-style:normal}
.nw{white-space:nowrap}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.steps .step{position:relative}
sup{font-size:.68em;line-height:0}
sub{font-size:.68em;line-height:0}
.va,.p-a{color:var(--acol)} .vn,.p-n{color:var(--pen)}
.p-k{color:var(--p-k)} .p-d{color:var(--p-d)} .p-c{color:var(--p-c)} .p-b{color:var(--p-b)} .p-t{color:var(--p-t)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .08em;font-size:.92em}
.frac > .fn{padding:0 .15em .05em;border-bottom:1.2px solid currentColor}
.frac > .fd{padding:.05em .15em 0}
.rad{white-space:nowrap}
.rad > .rb{border-top:1.2px solid currentColor;padding:0 .08em;margin-left:.02em}
.vec{position:relative;display:inline-block}
.vec::after{content:"\2192";position:absolute;left:0;right:0;top:-.72em;font-size:.7em;font-style:normal;text-align:center;line-height:1}
.uses{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);font-size:.95rem;max-width:68ch}
.q-prompt canvas.plot,.task + canvas.plot,.fig-sm{max-width:380px;margin-top:8px;font-weight:400}
.uses strong{font-size:.85rem;color:var(--ink-2);margin-right:6px}
.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--rule)}
.btn.sm{font-size:.92rem;padding:.45em .9em}
.btn:disabled{opacity:.45}
.btn:not(:disabled):hover{border-color:var(--pen)}
.btn.primary:not(:disabled):hover{background:var(--pen);border-color:var(--pen)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}
.hero.solo{grid-template-columns:minmax(0,1fr)}
.hero p{font-size:1.12rem}
.hero .hero-eq{font:italic 400 clamp(3.6rem,11vw,7.2rem)/1 var(--font-math);margin:0 0 .22em;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero .hero-eq.md{font-size:clamp(2.2rem,7vw,4.4rem)}
.hero .hero-eq.sm{font-size:clamp(1.6rem,5vw,2.8rem);font-style:normal}
.hero-eq sup{font-size:.55em}
.hero-fig{margin:0;min-width:0}
.hero-fig figcaption{font:400 1.35rem var(--font-math);text-align:center;margin-top:8px;min-height:1.6em}
canvas.plot{display:block;width:100%;aspect-ratio:4/3;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);touch-action:pan-y}
canvas.plot.square{aspect-ratio:1/1}
canvas.plot.wide{aspect-ratio:16/9}
canvas.plot.nl{aspect-ratio:6/1;min-height:92px}
.plot-wrap{position:relative}
.drag-h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2;touch-action:none}
.drag-h:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.goal{padding:14px 0;border-bottom:1px solid var(--rule)}
.goal:last-child{border-bottom:0}
.goal-t{margin:0 0 8px;font-weight:700}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.32em .9em;font-size:.92rem}
.rbtn.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.was{margin:6px 0 0}
.q{padding:18px 0;border-bottom:1.5px dashed var(--rule)}
.q:last-child{border-bottom:0}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.qn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-top:1px}
.q-prompt{flex:1;font-weight:700;min-width:0}
.q-prompt .m{white-space:normal}
.opt .m,.fb .m,.hints .m,.refresh .m,.read .m{white-space:normal}
.tag{flex:0 0 auto;font-size:.8rem;font-weight:700;border:1.5px solid var(--ink-2);color:var(--ink-2);border-radius:999px;padding:.1em .7em;margin-top:2px}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.6em .8em;min-width:0}
.opt > span:last-child{min-width:0;overflow-wrap:anywhere}
.opt-mark{flex:0 0 auto;font-weight:700;color:var(--ink-2);min-width:1em}
.opt.picked{border-color:var(--ink);background:var(--hi-soft)}
.opt.right{border-color:var(--green);background:var(--good-bg)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)}
.opt:disabled{color:var(--ink)}
.opt:not(:disabled):hover{border-color:var(--pen)}
.opt canvas.plot{margin-top:6px;aspect-ratio:4/3;max-width:220px}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.conf-lab{font-size:.9rem;color:var(--ink-2);margin-right:4px}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:32px}
.chip.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.chip:disabled{opacity:.75}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:12px;padding:12px 14px;border-radius:6px;border-left:4px solid var(--ink-2);background:var(--info-bg)}
.fb.good{border-left-color:var(--green);background:var(--good-bg)}
.fb.bad{border-left-color:var(--red);background:var(--bad-bg)}
.fb:focus{outline:none}
.fb p{margin:0 0 .4em;max-width:none}.fb p:last-child{margin:0}
.hints{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--ink-2);border-radius:6px}
.hints p{margin:0 0 .4em;max-width:none}.hints p:last-child{margin:0}
.result{margin-top:14px}
.big-score{font:600 2.2rem/1 var(--font-math);margin:0 0 .3em}
.refresh{margin-top:12px;padding:12px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.refresh p{margin:0}
.pg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"graph read" "ctrl read";gap:16px 28px;align-items:start}
.pg-graph{grid-area:graph;min-width:0}.pg-ctrl{grid-area:ctrl;min-width:0}.pg-read{grid-area:read;min-width:0}
.eq-cap{font:400 clamp(1.6rem,4vw,2.3rem)/1.2 var(--font-math);margin:0 0 6px;min-height:1.25em;overflow-wrap:anywhere}
.eq-cap .m{font-size:1em;white-space:normal}
.banner{min-height:1.6em;margin:0 0 8px;font-weight:700}
.banner.good{color:var(--green)}.banner.bad{color:var(--red)}
.slider{display:block;margin:0 0 6px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider-top span{font-weight:700}
.slider output{font:600 1.35rem var(--font-math)}
input[type=range]{width:100%;accent-color:var(--pen);height:34px;margin:0}
.seg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:.4em .85em;font-size:.92rem;font-weight:700;min-height:34px}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
dl.read{margin:0}
.read > div{padding:10px 0;border-bottom:1px solid var(--rule)}
.read > div:first-child{padding-top:0}
.read > div:last-child{border-bottom:0}
.read dt{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.read dd{margin:2px 0 0;overflow-wrap:anywhere}
.qpath{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:0 .45em;border-radius:3px;font-weight:700;white-space:nowrap}
.legend{display:grid;gap:6px;margin:0 0 12px}
.legend > span{display:flex;align-items:center;gap:10px}
.legend i.sw{display:inline-block;width:28px;height:4px;border-radius:2px}
.pred-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dots{display:flex;gap:6px}

.pred-q{font-weight:700}
.chal{padding:16px 0;border-bottom:1.5px dashed var(--rule)}
.chal:last-child{border-bottom:0}
.chal .live{font-size:.9rem;font-weight:700;color:var(--green);min-height:1.2em;margin:8px 0 0}
.sym{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 30px;align-items:start}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}

.alg-lines{margin:10px 0 0;display:grid;gap:4px;font-family:var(--font-math);font-size:1.12rem}

.sq{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.sq:last-child{border-bottom:0}

.sq .fb{flex-basis:100%;margin-top:4px}
.how{font-size:.95rem;color:var(--ink-2)}

.sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.bins{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))}

.chip-in{border:1.5px solid var(--green);background:var(--good-bg);border-radius:5px;padding:.1em .55em;font:400 1rem var(--font-math);max-width:100%}

.sort-done{margin:0;font-weight:700}
.task{font-weight:700}
.who{font-size:.9rem;color:var(--ink-2);margin:12px 0 6px}
ol.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}
.rg.en-whyg,.rg.en-tkcards{display:grid;gap:6px}
.rg.en-whyg button,.rg.en-tkcards button{border-radius:10px;text-align:left;padding:.45em .8em;line-height:1.35}

/* hero */
.en-eq{display:inline-block;line-height:1.3}
.en-hx-states{display:flex;align-items:center;justify-content:center;gap:4px 8px;margin-bottom:8px}
.en-hx-st{margin:0;flex:1 1 0;max-width:130px;text-align:center}
.en-hx-st svg{display:block;width:100%;height:auto}
.en-hx-st figcaption{font:700 .9rem var(--font-ui);color:var(--ink-2)}
.en-hx-arr{font:700 1.2rem var(--font-ui);color:var(--ink-2)}
.en-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.en-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.en-hx-cap{font:400 1.05rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:2.8em}
.en-hx-ctr{margin:2px 0 0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:1.4em}

/* Microstate shuffler */
.en-modes{margin:0 0 12px}
.en-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.en-view,.en-side{min-width:0}
.en-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:4px}
.en-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.en-cap{min-height:1.5em;margin:10px 0 4px}
.en-key{margin:6px 0 0}
.en-side > * + *{margin-top:12px}
.en-c1 > * + *{margin-top:10px}
.en-msg{min-height:0;margin:8px 0 0;color:var(--ink)}
.en-msg:empty{display:none}
.en-numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.en-numrow .numin{max-width:9rem}
.en-unit{font-weight:700}
.en-why{margin-top:10px}
.en-count{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:18px}
.en-barfig{margin:0;min-width:0}
.en-bars{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.en-tbl{min-width:0}
.en-tbl .tbl-wrap{max-height:300px;overflow:auto}
.en-ph{margin:0}
.en-b1[hidden],.en-b2[hidden],.en-c1[hidden],.en-c2[hidden],.en-work[hidden],.en-count[hidden],.en-why[hidden],.en-barfig[hidden],#en-tkw[hidden]{display:none}

/* Part 3 */
.en-st + .en-st{margin-top:22px}
.en-tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.en-tile{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:10px;padding:.45em .8em;font:400 1rem var(--font-ui);min-height:40px}
.en-tile[aria-pressed="true"]{border-color:var(--hi);background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}
.en-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.en-bin{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px dashed var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px;min-height:96px;font:400 1rem var(--font-ui)}
.en-bin small{color:var(--ink-2)}
.en-in{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.en-chipin{font-size:.88rem;background:var(--good-bg);border-radius:6px;padding:2px 6px}
.en-data{margin-top:8px}
.en-zs{margin:8px 0 0}
.en-sbox,.en-lbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:4px;margin-top:12px;max-width:560px}
.en-csvg,.en-lsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.en-ccap,.en-ltxt{margin:10px 0 0}
.en-lread{margin-top:10px}

/* Calculate ΔS° panel */
.en-acttab{margin:0 0 12px}

/* task */
#en-tkcard,#en-tkdir,#en-tkw{margin-bottom:12px}
.en-h4{margin:0 0 6px}
.en-tkeq{font-size:1.1rem;margin:0 0 10px}

@media (max-width:760px){

  .en-bins{grid-template-columns:minmax(0,1fr)}
  .en-bin{min-height:64px}
}

 \u003ci>S\u003c/i>°(reactants)\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"Delta S naught equals the sum of n times S naught of the products, minus the sum of n times S naught of the reactants","headline":"Nature bets on the odds","text":"\u003cstrong>Entropy\u003c/strong> counts the ways energy and particles can be arranged: the number of \u003cstrong>microstates\u003c/strong>. Spread-out arrangements far outnumber bunched-up ones, so changes tend toward them. The \u003cstrong>second law\u003c/strong> says the entropy of the universe always increases in a spontaneous change.","fig":{"html":"\u003cdiv class=\"en-hx\">\u003cdiv class=\"en-hx-states\" id=\"en-hx-states\">\u003c/div>\u003csvg class=\"en-hx-svg\" id=\"en-hx-svg\" viewBox=\"0 0 560 230\" role=\"img\" aria-label=\"Four gas particles start in the left half of a box. The partition lifts and they spread through the whole box, two on each side. Then a drop of food colouring spreads through a beaker of water.\">\u003c/svg>\u003cdiv class=\"en-hx-row\">\u003cp class=\"en-hx-cap\" id=\"en-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"en-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003cp class=\"en-hx-ctr\" id=\"en-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003c/div>"}},"goals":["I can describe entropy as the spreading out of energy and matter, using the idea of microstates.","I can predict the sign of Δ\u003ci>S\u003c/i> for physical changes and reactions.","I can calculate Δ\u003ci>S\u003c/i>° from standard entropies.","I can state the second law and explain how a system’s entropy can fall in a spontaneous change.","I can connect probability to the direction of change."],"start":{"warmup":{"questions":[{"id":"w1","skill":"States of matter","goal":2,"prompt":"In which state do particles have the most freedom to move and spread out?","options":[{"t":"All the same","why":"Freedom differs a lot between states.","_n":"07e5","_k":"c5665d87"},{"t":"Solid"," 0).","Reading data tables":"Multiply each tabulated value by its coefficient, then take products minus reactants. Only Δ\u003ci>H\u003c/i>°f is zero for elements."}}},"explore":{"heading":"Microstate shuffler","intro":"Count the ways particles can arrange themselves, then watch real changes spread out.","how":"\u003cstrong>Spreading out:\u003c/strong> set the number of particles, open the partition, then press \u003cstrong>Shuffle\u003c/strong> for one random arrangement or \u003cstrong>Count all\u003c/strong> to fill the table and chart. \u003cstrong>Changes and reactions:\u003c/strong> choose a process card and press \u003cstrong>Run the change\u003c/strong>.","modes":[{"id":"spread","t":"Spreading out"},{"id":"rx","t":"Changes and reactions"}],"whys":[{"id":"heat","t":"The heat it releases raises the entropy of the surroundings by more than the system’s entropy falls."},{"id":"cant","t":"It can’t happen, since entropy decreases."},{"id":"tidy","t":"Its entropy really rises, because fewer molecules can move faster."}],"predictions":[{"id":"p1","prompt":"\u003ci>N\u003c/i> = 4, all on the left. Open the partition. Which split will you find most often?","options":[{"t":"every split equally","_n":"o715","_k":"6d084fe0"},{"t":"3 and 1","_n":"p6e5","_k":"981a1918"},{"t":"2 and 2","_n":"q6f5","_k":"42095885"},{"t":"4 and 0","_n":"r6c5","_k":"83102fec"}],"explain":"2 | 2 has the most arrangements (6 of 16)."},{"id":"p2","prompt":"\u003ci>N\u003c/i> = 10. What is the chance of finding all 10 particles on the left at one instant?","options":[{"t":"1/1024","_n":"s6d5","_k":"5ddae565"},{"t":"1/20","_n":"t5a6","_k":"dfe9aa90"},{"t":"1/10","_n":"u596","_k":"b9ac51d9"},{"t":"1/2","_n":"v5c6","_k":"04ee636c"}],"explain":"Each particle has 2 choices: 2\u003csup>10\u003c/sup> = 1024. Possible, but you’d almost never see it."},{"id":"p3","prompt":"Dry ice subliming. Sign of Δ\u003ci>S\u003c/i>?","options":[{"t":"zero","_n":"w5b6","_k":"db53eb18"},{"t":"negative","_n":"x5e6","_k":"2 into the surroundings."]}]},"part3":{"slug":"predict","name":"Predict","heading":"Predict Δ\u003ci>S\u003c/i>","intro":"Three stations: sort reactions with the gas rule and check them with data, see the other clues at work, then watch the second law balance a system against its surroundings.","s1":{"title":"Station 1: The gas rule","intro":"Sort each reaction by counting moles of gas on each side. More gas → Δ\u003ci>S\u003c/i> &gt; 0; less gas → Δ\u003ci>S\u003c/i> &lt; 0; the same → about zero.","bins":[{"id":"pos","label":"Δ\u003ci>S\u003c/i> &gt; 0","sub":"more moles of gas"},{"id":"neg","label":"Δ\u003ci>S\u003c/i> &lt; 0","sub":"fewer moles of gas"},{"id":"zero","label":"about zero","sub":"the same moles of gas"}],"items":[{"id":"a1","eq":"CaCO3(s) -> CaO(s) + CO2(g)","r":[[1,"CaCO3(s)"]],"p":[[1,"CaO(s)"],[1,"CO2(g)"]],"g":[0,1],"_a":"QEFbRxU="},{"id":"a2","eq":"N2(g) + 3H2(g) -> 2NH3(g)","r":[[1,"N2(g)"],[3,"H2(g)"]],"p":[[2,"NH3(g)"]],"g":[4,2],"_a":"QF9RUxU="},{"id":"a3","eq":"C(s) + O2(g) -> CO2(g)","r":[[1,"C(graphite)"],[1,"O2(g)"]],"p":[[1,"CO2(g)"]],"g":[1,1],"_a":"QEtRRlhB"},{"id":"a4","eq":"H2O(l) -> H2O(g)","r":[[1,"H2O(l)"]],"p":[[1,"H2O(g)"]],"g":[0,1],"_a":"QEFbRxU="},{"id":"a5","eq":"2H2(g) + O2(g) -> 2H2O(g)","r":[[2,"H2(g)"],[1,"O2(g)"]],"p":[[2,"H2O(g)"]],"g":[3,2],"_a":"QF9RUxU="},{"id":"a6","eq":"CH4(g) + 2O2(g) -> CO2(g) + 2H2O(g)","r":[[1,"CH4(g)"],[2,"O2(g)"]],"p":[[1,"CO2(g)"],[2,"H2O(g)"]],"g":[3,3],"_a":"QEtRRlhB"}],"data":"Each Δ\u003ci>S\u003c/i>° below is Σ\u003ci>n\u003c/i> \u003ci>S\u003c/i>°(products) − Σ\u003ci>n\u003c/i> \u003ci>S\u003c/i>°(reactants), using the \u003ci>S\u003c/i>° panel. “About zero” reactions land within a few J/K of zero."},"s2":{"title":"Station 2: Other clues","intro":"When the gas count doesn’t change, use the other clues. Choose a clue and watch the particles.","clues":[{"id":"diss","t":"Dissolving","eq":"NaCl(s) -> Na+(aq) + Cl-(aq)","sign":"Δ\u003ci>S\u003c/i> &gt; 0 (usually)","text":"Dissolving a s  them all in that half.","_n":"3134d","_k":"541d5a4e"},{"t":"1/70","why":"70 is the number of ways for a 4 | 4 split.","_n":"3235d","_k":"6fb9027f"},{"t":"1/8","why":"Each particle has 2 choices, so multiply 2s.","_n":"3332d","_k":"91651a39"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Water freezes on a cold day even though Δ\u003ci>S\u003c/i>(system) &lt; 0. Which is the best explanation?","options":[{"t":"“Freezing releases heat, which raises the entropy of the colder surroundings by more than the water’s entropy falls, so the total increases.”","why":"It names the system, the surroundings and the total.","_n":"3433d","_k":"4bced278"},{"t":"“The second law doesn’t apply to water.”","why":"It applies to everything.","_n":"3530d","_k":"0742ffa1"},{"t":"“Entropy always decreases in cold weather.”","why":"The total still increases.","_n":"3631d","_k":"ba659a47"},{"t":"“Freezing has Δ\u003ci>S\u003c/i> &gt; 0 because ice is a crystal.”","why":"Count the ways energy and particles can be arranged. Freezing lowers the water’s entropy, but the heat released raises the surroundings’ entropy more.","_n":"372ed","_k":"12279021"}]},"b":{"prompt":"A cell builds an ordered protein (Δ\u003ci>S\u003c/i> &lt; 0 for that step). Which best explains why this doesn’t break the second law?","options":[{"t":"“Living things are exempt from the second law.”","why":"Nothing is exempt.","_n":"382fd","_k":"eb757bd1"},{"t":"“The cell releases heat and small molecules to its surroundings, so the total entropy still rises.”","why":"The second law is about the total.","_n":"392cd","_k":"d12143d6"},{"t":"“The protein’s enthalpy is zero.”","why":"Enthalpy isn’t the point here.","_n":"3a2dd","_k":"08b71a6e"},{"t":"“Proteins have more entropy than amino acids.”","why":"Count the ways energy and particles can be arranged. Freezing lowers the water’s entropy, but the heat released raises the surroundings’ entropy more.","_n":"3b2ed","_k":"6551c3b8"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which is the best description of entropy?","options":[{"t":"“A measure of how many ways energy and particles can be arranged, or how spread out they are”","why":"Entropy counts arrangements (microstates).","_n":"3c2dd","_k":"215548cf"},{"t":"“The heat content of a substance.”","why":"That’s enthalpy.","_n":"3d2cd","_k":"4ac7dc18"},{"t":"“How fast a reaction goes.”","why":"That’s rate.","_n":"3e2bd","_k":"89d98bec"},{"t":"“How messy something looks.”","why":"Count the ways energy and particles can be arranged. Freezing lowers the water’s entropy, but the heat released raises the surroundings’ entropy more.","_n":"3f32d","_k":"aa431734"}]},"b":{"prompt":"Why does a gas spread to fill its container?","options":[{"t":"“A force pushes them outward.”","why":"No force is needed.","_n":"3g31d","_k":"6a312e4e"},{"t":"“The particles repel each other strongly.”","why":"Gas particles barely interact.","_n":"3h30d","_k":"ba918074"},{"t":"“Spread-out arrangements vastly outnumber bunched-up ones, so the gas is almost certain to be found spread out.”","why":"It’s about the odds, not a force.","_n":"3i2fd","_k":"d0c15e3f"},{"t":"“Bunching up is impossible.”","why":"All the particles on one side is possible, just extremely unlikely: 1 in 2\u003csup>\u003ci>N\u003c/i>\u003c/sup>.","_n":"3j26d","_k":"d956ad13"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Lime (CaO) is made by heating limestone: CaCO₃(s) → CaO(s) + CO₂(g). Find Δ\u003ci>S\u003c/i>°.","options":[{"t":"+159.0 J/K","why":"(38.1 + 213.8) − 92.9.","_n":"3k25d","_k":"4f79be22"},{"t":"+344.8 J/K","why":"Subtract the reactant; don’t add it.","_n":"3l28d","_k":"8a924d6b"},{"t":"+120.9 J/K","why":"Include CaO.","_n":"3m29d","_k":"34174f7f"},{"t":"−159.0 J/K","why":"Products minus reactants.","_n":"3n2ad","_k":"e5bb87e0"}]},"b":{"prompt":"Ammonia can be split: 2NH₃(g) → N₂(g) + 3H₂(g). Find Δ\u003ci>S\u003c/i>°.","options":[{"t":"+390.9 J/K","why":"Multiply NH₃ by 2 as well. \u003ci>S\u003c/i>° is per mole: 3 mol of H₂ contri
