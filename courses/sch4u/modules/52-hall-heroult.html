.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 52: hero pot, Aluminium smelter, The cost of aluminium stations, Smelter calculations, Smelter plan task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.hh-eq{display:inline-block;line-height:1.35}
.hh-eqn{display:inline-block;font-size:.6em;color:var(--ink-2);font-weight:400}
.hh-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.hh-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.hh-hx-cap{font:400 1.02rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:2.8em}

/* Aluminium smelter */
.hh-modes{margin:0 0 10px}
.hh-ban{margin-top:4px}
.hh-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.hh-left,.hh-right{min-width:0}
.hh-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:6px}
.hh-cap{min-height:1.5em;margin:10px 0 6px;font-size:1rem}
.hh-tl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.hh-scrub{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.hh-scrub-l{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.hh-clk{flex:1 1 auto;min-width:0;min-height:28px;accent-color:var(--pen)}
.hh-clk-o{font-size:.9rem;white-space:nowrap}
.hh-right > * + *{margin-top:12px}
.hh-cpot > * + *,.hh-crun > * + *{margin-top:12px}
.hh-cpot[hidden],.hh-crun[hidden],.hh-tl[hidden],.hh-eff[hidden],.hh-an[hidden]{display:none!important}
.hh-read{margin-top:12px}
.hh-model{margin:6px 0 0}

/* Part 3 stations */
.hh-st + .hh-st{margin-top:18px}
.hh-pw{margin:10px 0}
.hh-leg{margin:0 0 6px;font-size:.88rem;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hh-sw{display:inline-block;width:14px;height:12px;border-radius:3px}
.hh-sw-e,.hh-be{background:var(--pen)}
.hh-sw-a,.hh-ba{background:var(--ink-2)}
.hh-bar{display:grid;grid-template-columns:6.5em minmax(0,1fr) 5.5em;align-items:center;gap:8px;margin:6px 0;font-size:.92rem}
.hh-bar.on{font-weight:700}
.hh-bar.on .hh-bt{outline:2px solid var(--hi);outline-offset:2px}
.hh-bt{display:flex;height:16px;border-radius:4px;background:var(--paper);overflow:hidden}
.hh-be,.hh-ba{display:block;height:100%}
.hh-bv{text-align:right;white-space:nowrap}
.hh-pwfb{margin:8px 0 10px;min-height:1.4em}
.hh-recin{display:grid;gap:8px;margin-top:8px}
.hh-recin .numrow,.hh-numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.hh-unit{font-weight:700;color:var(--ink-2)}
.hh-facts{margin:6px 0 10px;padding-left:1.3em}
.hh-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hh-notes textarea{width:100%;min-height:90px}
.hh-saved{min-height:1.3em;margin:4px 0 0}
.hh-flow{list-style:none;margin:10px 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;counter-reset:hhf}
.hh-flow li{position:relative;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.hh-flow li strong{display:block}
.hh-flow li small{display:block;color:var(--ink-2);font-size:.84rem;margin-top:2px}
.hh-flow li + li::before{content:"→";position:absolute;left:-9px;top:50%;transform:translate(-50%,-50%);font-weight:700;color:var(--ink-2)}

/* task */
.hh-conds{margin:6px 0 8px}
.hh-tkrow + .hh-tkrow{margin-top:12px}
.hh-h4{margin:0 0 8px}
.hh-dash{display:grid;gap:10px}
.hh-g{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.hh-g.ok{border-color:var(--green)}
.hh-g.no{border-color:var(--red)}
.hh-gt{display:flex;justify-content:space-between;gap:8px;font-size:.94rem}
.hh-g.ok .hh-gt strong{color:var(--green)}
.hh-g.no .hh-gt strong{color:var(--red)}
.hh-gb{position:relative;height:12px;border-radius:4px;background:var(--paper);margin-top:6px}
.hh-gf{display:block;height:100%;border-radius:4px;background:var(--pen)}
.hh-gl{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink)}
.hh-g p{margin:4px 0 0}

@media (max-width:760px){
  .hh-grid{grid-template-columns:minmax(0,1fr)}
  .hh-notes{grid-template-columns:minmax(0,1fr)}
  .hh-flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hh-flow li:nth-child(3)::before{content:"↓";left:50%;top:-9px}
}

ctricity source and recycling."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Reduction potentials","goal":2,"prompt":"Which is easier to reduce: Al³⁺ (−1.66 V) or water (2H₂O + 2e⁻ → H₂ + 2OH⁻, −0.83 V)?","options":[{"t":"Neither can be reduced","why":"Both can be, under the right conditions.","_n":"0893","_k":"846a83d9"},{"t":"Al³⁺","why":"The more negative value is harder to reduce.","_n":"1883","_k":"5618d651"},{"t":"Water","why":"−0.83 V is higher than −1.66 V.","_n":"2873","_k":"5ce06a22"},{"t":"They’re equally easy","why":"−0.83 and −1.66 differ.","_n":"38e3","_k":"b20e9c62"}],"hints":["Higher \u003cem>E\u003c/em>° means easier to reduce.","Compare −0.83 and −1.66.","Water."]},{"id":"w2","skill":"Reduction potentials","goal":2,"prompt":"So what forms at the cathode when aqueous Al₂(SO₄)₃ is electrolyzed?","options":[{"t":"O₂ gas","why":"Oxygen forms at an anode.","_n":"48d3","_k":"dc1ec4b0"},{"t":"Sulfur","why":"Sulfate isn’t reduced here.","_n":"58c3","_k":"ff323972"},{"t":"Aluminium metal","why":"Water (−0.83 V) is reduced before Al³⁺ (−1.66 V): you get H₂, not Al.","_n":"68b3","_k":"248e9674"},{"t":"H₂ gas","why":"Water is reduced first.","_n":"7923","_k":"fe1cdc71"}],"hints":["Use the first question’s answer.","Water wins.","H₂."]},{"id":"w3","skill":"Faraday chain","goal":3,"prompt":"How many moles of electrons make 1.00 mol of Al from Al³⁺?","options":[{"t":"3.00 mol","why":"Al³⁺ + 3e⁻ → Al.","_n":"8913","_k":"1be4ba05"},{"t":"1.00 mol","why":"Each Al³⁺ needs 3 electrons. Moles of Al = moles of e⁻ ÷ 3.","_n":"98e1","_k":"1a2906f2"},{"t":"0.333 mol","why":"Divided instead of multiplied.","_n":"a8f1","_k":"fa340211"},{"t":"2.00 mol","why":"Aluminium is 3+.","_n":"b8c1","_k":"2be7fbab"}],"hints":["Match the ion charge.","3+.","3.00 mol."]},{"id":"w4","skill":"Faraday chain","goal":3,"prompt":"How many moles of electrons are in 2.895 × 10⁸ C?","options":[{"t":"2.79 × 10¹³ mol","why":"Multiplied by \u003cem>F\u003c/em>.","_n":"c8d1","_k":"14c61571"},{ 003c/em> = \u003cem>n\u003c/em> × 27.0."},{"id":"h2","goal":4,"prompt":"Carbon anode used to make that 27.0 kg?","parts":[{"id":"m","_a":"AA==","unit":"kg","display":"9.00 kg"}],"wrong":[{"match":12,"fb":"3 C per 4 Al: 750 mol C. 2Al₂O₃ + 3C → 4Al + 3CO₂: 3 C (and 3 CO₂) for every 4 Al."}],"fb":"1000 mol Al; use the ratio 3 C : 4 Al, then \u003cem>m\u003c/em> = \u003cem>n\u003c/em> × 12.0."},{"id":"h3","goal":4,"prompt":"Anode CO₂ released making that 27.0 kg?","parts":[{"id":"m","_a":"ClI=","unit":"kg","display":"33.0 kg"}],"wrong":[{"match":44,"fb":"750 mol CO₂ × 44.0 g/mol. 2Al₂O₃ + 3C → 4Al + 3CO₂: 3 C (and 3 CO₂) for every 4 Al."}],"fb":"1000 mol Al; use the ratio 3 CO₂ : 4 Al, then \u003cem>m\u003c/em> = \u003cem>n\u003c/em> × 44.0."},{"id":"h4","goal":3,"star":true,"prompt":"How long must a 300 kA cell run to make 54.0 kg?","parts":[{"id":"t","_a":"CFgCVg==","unit":"s","display":"1930 s"}],"wrong":[{"match":965,"fb":"Twice the mass needs twice the charge."}],"fb":"Work backwards: mass → mol Al → mol e⁻ → charge → \u003cem>t\u003c/em> = \u003cem>Q\u003c/em> ÷ \u003cem>I\u003c/em>."},{"id":"h5","goal":3,"star":true,"prompt":"What current makes 9.00 kg in 965 s?","parts":[{"id":"i","_a":"CFEB","unit":"kA","display":"100 kA"}],"wrong":[{"match":300,"fb":"333 mol Al → 1000 mol e⁻ → 9.65 × 10⁷ C ÷ 965 s."}],"fb":"Work backwards: mass → mol Al → mol e⁻ → charge → \u003cem>I\u003c/em> = \u003cem>Q\u003c/em> ÷ \u003cem>t\u003c/em>.","hints":["Moles of Al first: 9000 ÷ 27.0.","× 3 = 1000 mol e⁻.","\u003cem>I\u003c/em> = 9.65 × 10⁷ ÷ 965 = 1.00 × 10⁵ A."]},{"id":"h6","goal":[3,5],"star":true,"prompt":"A 300 kA cell runs for 965 s at 90% efficiency, at 4.00 V. Mass of Al, and electrical energy used (MJ)?","parts":[{"id":"m","label":"Mass of Al","_a":"C1UfVQ==","unit":"kg","display":"24.3 kg"},{"id":"e","label":"Energy used","_a":"CFAEXg==","unit":"MJ","display":"1.16 × 10³ MJ"}],"wrong":[{"part":"m","match":27,"fb":"Only 90% of the electrons make Al."},{"part":"e","match":1042,"fb":"\u003cem>E\u003c/em> = \u003cem>VQ\u003c/em> = 4.00 × 2.895 × 10⁸ J; efficiency doesn’t reduce the charge passed."}],"fb":"Charge passed: \u003cem>Q\u003c/em> = \u003cem>It\u003c/em>. Mass: 90% of the 100% mass. Energy: \u003cem>E\u003c/em> = \u003cem>VQ\u003c/em>, then J → MJ.","hints":["Charge is 2.895 × 10⁸ C either way.","Al = 0.90 × 27.0 kg.","\u003cem>E\u003c/em> = 4.00 × 2.895 × 10⁸ = 1.158 × 10⁹ J = 1.16 × 10³ MJ."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Vikram","how":"","goal":[2,3],"instruction":"Vikram made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain why aluminium isn’t made by electrolysing aqueous aluminium sulfate.","steps":["The cathode could reduce either Al³⁺ or water.","From the table, Al³⁺/Al is −1.66 V and water is −0.83 V.","Al³⁺ has the larger number, so it’s reduced first.","So the problem must be that aluminium dissolves back into the water."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 reads the table correctly.","","Step 4 tries to explain away a wrong step 3."],"fixes":[{"t":"Step 3 is correct.","why":"−1.66 is more negative: harder to reduce. Water (−0.83 V) is reduced before Al³⁺ (−1.66 V): you get H₂, not Al.","_n":"1k892","_k":"f2daeb5c"},{"t":"Neither is reduced in water.","why":"Water is.","_n":"1l8e2","_k":"bb268603"},{"t":"−0.83 V is higher than −1.66 V, so water is reduced first and H₂ forms instead of aluminium.","why":"Water (−0.83 V) is reduced before Al³⁺ (−1.66 V): you get H₂, not Al.","_n":"1m8f2","_k":"8dd1e8b6"},{"t":"Both are reduced equally.","why":"The higher \u003cem>E\u003c/em>° wins.","_n":"1n201","_k":"23933e83"}],"hints":["Which is higher, −0.83 or −1.66?","−0.83.","So water is reduced: H₂."]},{"id":"e2","goal":3,"task":"Find the mass of aluminium made by 300 kA in 965 s.","steps":["\u003cem>Q\u003c/em> = 3.00 × 10⁵ A × 965 s = 2.895 × 10⁸ C.","\u003cem>n\u003c/em>(e⁻) = 2.895 × 10⁸ ÷ 96 500 = 3000 mol.","\u003cem>n\u003c/em>(Al) = 3000 × 3 = 9000 mol.","\u003cem>m\u003c/em> = 9000 × 27.0 g = 243 kg."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"\u003cem>n\u003c/em>(Al) = 3000 ÷ 3 = 1000 mol, so \u003cem>m\u003c/em> = 27.0 kg.","why":"Moles of Al = moles of e⁻ ÷ 3.","_n":"1o1f1","_k":"6a1d579a"},{"t":"\u003cem>n\u003c/em>(Al) = 3000 ÷ 2.","why":"Aluminium is 3+.","_n":"1p1e1","_k":"20af9581"},{"t":"Step 3 is correct.","why":"More electrons per atom means \u003cstrong>fewer\u003c/strong> atoms. Moles of Al = moles of e⁻ ÷ 3.","_n":"1q1d1","_k":"49ab5555"},{"t":"\u003cem>n\u003c/em>(Al) = 3000 mol, so 81.0 kg.","why":"Each Al needs 3 e⁻.","_n":"1r1c1","_k":"1e131209"}],"hints":["Al³⁺ + 3e⁻ → Al.","Divide by 3.","1000 mol, 27.0 kg."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: how much electricity aluminium takes, that the anodes burn away, or how much recycling saves?"},{"id":"j2","q":"In your own words, explain why aluminium is made from a molten bath and what cryolite does."},{"id":"j3","q":"Explain to a friend how to calculate the aluminium a cell makes in a day."},{"id":"j4","q":"Would you recommend building a new smelter in Canada? Name one fact from this module that supports your view, and one you’d want to check."}]},"final":{"intro":"Use these values: \u003cem>F\u003c/em> = 96 500 C/mol; Al 27.0, C 12.0, CO₂ 44.0 g/mol.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is cryolite’s role in the Hall–Héroult process?","options":[{"t":"It’s the material of the anodes","why":"The anodes are carbon.","_n":"1s1b1","_k":"aeb21265"},{"t":"It dissolves alumina so the electrolyte is liquid at about 960 °C instead of about 2050 °C","why":"Cryolite is the solvent that lowers the melting temperature.","_n":"1t1a1","_k":"f464464e"},{"t":"It reduces Al³⁺ to aluminium","why":"Electrons at the cathode do that.","_n":"1u191","_k":"7f7563f8"},{"t":"It’s the source of the aluminium","why":"Cryolite is the solvent. It dissolves alumina so the bath is liquid at about 960 °C. The aluminium comes from Al₂O₃.","_n":"1v181","_k":"f2497dee"}]},"b":{"prompt":"Why must the electrolyte be molten (or dissolved) for the cell to work?","options":[{"t":"Solid alumina has no aluminium in it","why":"It does; the ions just can’t move.","_n":"1w171","_k":"c1676488"},{"t":"Heat alone splits alumina","why":"Electricity does the splitting.","_n":"1x1a1","_k":"992f69f5"},{"t":"Ions must be free to move to carry the current","why":"In a solid, the ions are locked in place.","_n":"1y1b1","_k":"700bd984"},{"t":"The cryolite must boil","why":"It only needs to be liquid.","_n":"1z1c1","_k":"4d8e01a1"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which half-reaction happens at the cathode?","options":[{"t":"2H₂O + 2e⁻ → H₂ + 2OH⁻","why":"There’s no water in the bath.","_n":"201d1","_k":"65ac395d"},{"t":"C + 2O²⁻ → CO₂ + 4e⁻","why":"That’s the anode.","_n":"21161","_k":"366303f2"},{"t":"Al³⁺ + 3e⁻ → Al(l)","why":"Reduction happens at the cathode.","_n":"22171","_k":"772cab47"},{"t":"Al(l) → Al³⁺ + 3e⁻","why":"That’s oxidation.","_n":"23181","_k":"35f18b12"}]},"b":{"prompt":"Which half-reaction happens at a carbon anode?","options":[{"t":"CO₂ + 4e⁻ → C + 2O²⁻","why":"That’s a reduction, the reverse.","_n":"24191","_k":"b8876e70"},{"t":"No reaction; the anode is inert","why":"The anodes react: C + 2O²⁻ → CO₂ + 4e⁻. They burn away and are replaced.","_n":"25121","_k":"5be24d32"},{"t":"C + 2O²⁻ → CO₂ + 4e⁻","why":"Carbon is oxidized: the anode burns away.","_n":"26131","_k":"42676627"},{"t":"Al³⁺ + 3e⁻ → Al","why":"That’s the cathode.","_n":"27042","_k":"0f05de04"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Why isn’t aluminium made by electrolysing an aqueous solution?","options":[{"t":"Water (−0.83 V) is reduced more easily than Al³⁺ (−1.66 V), so H₂ forms instead","why":"The higher \u003cem>E\u003c/em>° wins at the cathode.","_n":"28032","_k":"4971f047"},{"t":"Al³⁺ (−1.66 V) is reduced too easily","why":"Water (−0.83 V) is reduced before Al³⁺ (−1.66 V): you get H₂, not Al.","_n":"29062","_k":"67ad40e0"},{"t":"Aluminium ions don’t dissolve in water","why":"They do.","_n":"2a052","_k":"bf59b0ef"},{"t":"Aluminium reacts with cryolite in water","why":"Cryolite isn’t the issue.","_n":"2b082","_k":"6c6533d9"}]},"b":{"prompt":"Aqueous Al³⁺ is electrolyzed. What forms at the cathode?","options":[{"t":"Cryolite","why":"It isn’t present.","_n":"2c072","_k":"ada7cfff"},{"t":"Aluminium metal","why":"Water (−0.83 V) is reduced before Al³⁺ (−1.66 V): you get H₂, not Al.","_n":"2d0a2","_k":"3922418a"},{"t":"Oxygen gas","why":"That’s at the anode.","_n":"2e092","_k":"f8d85937"},{"t":"Hydrogen gas","why":"Water is reduced before Al³⁺.","_n":"2f0c2","_k":"ce00512d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A cell runs at 200 kA for 965 s. Mass of aluminium (100% efficiency)?","use":"\u003cem>F\u003c/em> = 96 500 C/mol; Al 27.0, C 12.0, CO₂ 44.0 g/mol","options":[{"t":"27.0 kg","why":"That’s at 300 kA.","_n":"2g0b2","_k":"b4042382"},{"t":"18.0 kg","why":"1.93 × 10⁸ C → 2000 mol e⁻ → 667 mol Al → 18.0 kg.","_n":"2h1e2","_k":"e1559ce6"},{"t":"54.0 kg","why":"Divide the electrons by 3. Moles of Al = moles of e⁻ ÷ 3.","_n":"2i1f2","_k":"d8effe57"},{"t":"6.00 kg","why":"Divided by 3 twice.","_n":"2j1c2","_k":"3ab6ca89"}]},"b":{"prompt":"A cell runs at 400 kA for 965 s. Mass of aluminium (100% efficiency)?","use":"\u003cem>F\u003c/em> = 96 500 C/mol; Al 27.0, C 12.0, CO₂ 44.0 g/mol","options":[{"t":"12.0 kg","why":"Divided by 3 twice.","_n":"2k1d2","_k":"d795e8db"},{"t":"108 kg","why":"Moles of Al = moles of e⁻ ÷ 3.","_n":"2l1a2","_k":"12080061"},{"t":"36.0 kg","why":"4000 mol e⁻ → 1333 mol Al → 36.0 kg.","_n":"2m1b2","_k":"b94a4024"},{"t":"27.0 kg","why":"That’s at 300 kA.","_n":"2n182","_k":"f5c1f74a"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"How much carbon anode is used up to make 108 kg of aluminium?","use":"\u003cem>F\u003c/em> = 96 500 C/mol; Al 27.0, C 12.0, CO₂ 44.0 g/mol","options":[{"t":"27.0 kg","why":"Ratio of 1 : 4 by mass is not the equation.","_n":"2o192","_k":"ca4d1cde"},{"t":"72.0 kg","why":"Doubled.","_n":"2p162","_k":"6fe04a56"},{"t":"36.0 kg","why":"4000 mol Al → 3000 mol C → 36.0 kg.","_n":"2q172","_k":"033521f5"},{"t":"48.0 kg","why":"1 : 1 isn’t the ratio. 2Al₂O₃ + 3C → 4Al + 3CO₂: 3 C (and 3 CO₂) for every 4 Al.","_n":"2r70c","_k":"7947140f"}]},"b":{"prompt":"How much anode CO₂ is released making 54.0 kg of aluminium?","use":"\u003cem>F\u003c/em> = 96 500 C/mol; Al 27.0, C 12.0, CO₂ 44.0 g/mol","options":[{"t":"132 kg","why":"Doubled.","_n":"2s71c","_k":"d54d5187"},{"t":"44.0 kg","why":"That’s 1000 mol CO₂.","_n":"2t6ec","_k":"5c56fcdb"},{"t":"66.0 kg","why":"2000 mol Al → 1500 mol CO₂ → 66.0 kg.","_n":"2u6fc","_k":"c4723cce"},{"t":"88.0 kg","why":"2Al₂O₃ + 3C → 4Al + 3CO₂: 3 C (and 3 CO₂) for every 4 Al.","_n":"2v74c","_k":"3cc4ae37"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A smelter switches from carbon anodes to inert anodes that release O₂. Which statement is true?","options":[{"t":"Each mole of electrons now makes more aluminium","why":"Still 3 e⁻ per Al.","_n":"2w75c","_k":"2bd8963f"},{"t":"The anodes are no longer used up and no anode CO₂ is made, but the cell still needs electricity (more of it, in this model)","why":"2O²⁻ → O₂ + 4e⁻ leaves the anode intact, but the electrolysis still runs on electricity.","_n":"2x72c","_k":"f776f9c0"},{"t":"No electricity is needed any more","why":"Electrolysis always needs a supply.","_n":"2y73c","_k":"3e5db04b"},{"t":"Cryolite is no longer needed","why":"The bath must still be molten.","_n":"2z78c","_k":"fda7012f"}]},"b":{"prompt":"Current efficiency drops from 100% to 90% at the same current and time. What happens?","options":[{"t":"10% more aluminium","why":"Wrong direction.","_n":"3079c","_k":"2c0ebe5b"},{"t":"No aluminium is made","why":"90% still makes Al.","_n":"31f6c","_k":"903fb972"},{"t":"10% less aluminium is made from the same charge","why":"Only 90% of the electrons reduce Al³⁺.","_n":"32f5c","_k":"b085f8b9"},{"t":"The same aluminium, made 10% faster","why":"Faraday’s law: fewer electrons go to Al.","_n":"33f8c","_k":"472daa06"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why aluminium smelters are often built near large hydroelectric dams?","options":[{"t":"“The process needs enormous amounts of electricity, and hydro supplies it cheaply with little CO₂.”","why":"It names the need (electricity) and why hydro meets it.","_n":"34f7c","_k":"80bfb315"},{"t":"“The cells need river water to cool the aluminium.”","why":"The cell is molten and dry.","_n":"35f2c","_k":"cca1b1a2"},{"t":"“Aluminium ore is found in rivers.”","why":"Ore is mined as bauxite.","_n":"36f1c","_k":"efb39efe"},{"t":"“Dams make cryolite.”","why":"Not the reason.","_n":"37f4c","_k":"b9693c1e"}]},"b":{"prompt":"Which is the best explanation of why recycling aluminium uses far less energy than making new aluminium?","options":[{"t":"“Scrap aluminium melts at about 960 °C because of cryolite.”","why":"Cryolite isn’t used in remelting.","_n":"38f3c","_k":"9b406e42"},{"t":"“Recycled aluminium is lighter.”","why":"Mass isn’t the point.","_n":"39fec","_k":"6ce37055"},{"t":"“Recycling uses inert anodes.”","why":"No electrolysis is needed at all.","_n":"3afdc","_k":"d81bd8dc"},{"t":"“Scrap is already aluminium metal, so it only needs melting; there’s no Al³⁺ to reduce by electrolysis.”","why":"Scrap is already metal: it only needs remelting, not reducing.","_n":"3b84b","_k":"2730ed09"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which description of the Hall–Héroult cell is correct?","options":[{"t":"“The carbon lining is the cathode (−), where liquid aluminium collects. Carbon blocks are the anodes (+), and they are consumed as CO₂.”","why":"Both electrodes, their signs and what happens at each are right.","_n":"3c85b","_k":"8b501a81"},{"t":"“The carbon blocks are the cathode, where aluminium forms.”","why":"Aluminium forms on the lining.","_n":"3d86b","_k":"2d5572aa"},{"t":"“The cathode is positive.”","why":"In electrolysis the cathode is negative.","_n":"3e87b","_k":"5e65cdc2"},{"t":"“Both electrodes are inert and last forever.”","why":"The anodes react: C + 2O²⁻ → CO₂ + 4e⁻. They burn away and are replaced.","_n":"3f80b","_k":"bd64f946"}]},"b":{"prompt":"Which describes the electron path correctly?","options":[{"t":"“Electrons travel through the bath from cathode to anode.”","why":"Ions carry current in the bath; electrons travel in the wires.","_n":"3g81b","_k":"3ad0dbbe"},{"t":"“Electrons enter at the anodes.”","why":"They leave at the anodes.","_n":"3h82b","_k":"b470f542"},{"t":"“Electrons leave the anodes, travel through the external circuit and supply, and enter the bath at the cathode lining.”","why":"Electrons travel in the wires; ions carry the current in the bath.","_n":"3i83b","_k":"1ef1e59d"},{"t":"“Electrons are made by the cryolite.”","why":"Cryolite is the solvent. It dissolves alumina so the bath is liquid at about 960 °C. The aluminium comes from Al₂O₃.","_n":"3j7cb","_k":"d5e93f1c"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Model: making 1 kg of aluminium uses 12 kWh of electricity and releases 1.2 kg of anode CO₂. With coal power (1.0 kg CO₂ per kWh), what is the total CO₂ per kg of aluminium?","options":[{"t":"14.4 kg","why":"Multiplied 12 × 1.2.","_n":"3k7db","_k":"972846e2"},{"t":"1.2 kg","why":"Forgot the electricity. Electricity can produce far more CO₂ than the anodes if it comes from fossil fuels.","_n":"3l8ab","_k":"655e0889"},{"t":"12.0 kg","why":"Forgot the anodes.","_n":"3m89b","_k":"76f06934"},{"t":"13.2 kg","why":"12 × 1.0 + 1.2.","_n":"3n88b","_k":"d3f06499"}]},"b":{"prompt":"Same model, but with hydro power (0.02 kg CO₂ per kWh). Total CO₂ per kg of aluminium?","options":[{"t":"0.24 kg","why":"Forgot the anodes.","_n":"3o87b","_k":"1f74bc00"},{"t":"14.4 kg","why":"Multiplied 12 × 1.2.","_n":"3p86b","_k":"9bc1a996"},{"t":"1.2 kg","why":"Forgot the electricity.","_n":"3q85b","_k":"7e2d4ee4"},{"t":"1.44 kg","why":"12 × 0.02 + 1.2.","_n":"3r84b","_k":"588e8579"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Making new aluminium takes 12 kWh/kg (model). Remelting scrap takes 5% of that. Energy to produce 100 kg from scrap?","options":[{"t":"60 kWh","why":"0.05 × 12 × 100.","_n":"3s83b","_k":"e57ce6bb"},{"t":"1200 kWh","why":"That’s new aluminium. Scrap is already metal: it only needs remelting, not reducing.","_n":"3t82b","_k":"568c9c56"},{"t":"6 kWh","why":"Check: 5% of 1200.","_n":"3u81b","_k":"c6d2ff74"},{"t":"600 kWh","why":"That’s 50%.","_n":"3vf8b","_k":"cee45cc4"}]},"b":{"prompt":"Same model. How much energy is saved by recycling 50 kg instead of making it new?","options":[{"t":"30 kWh","why":"That’s the recycling energy, not the saving.","_n":"3wf9b","_k":"35412e88"},{"t":"600 kWh","why":"The recycling still uses 30 kWh.","_n":"3xf6b","_k":"bbe5baac"},{"t":"570 kWh","why":"600 − 30.","_n":"3yf7b","_k":"680f6e5b"},{"t":"540 kWh","why":"Took 10%.","_n":"3zf4b","_k":"f88f6c5c"}]}}]},"task":{"title":"Smelter plan","summary":"Smelter plan","statement":"\u003cp>Plan one day at a smelter. You may add remelted scrap to the output. Can you find all the plans that meet every condition?\u003c/p>\u003col class=\"hh-conds\">\u003cli>Total aluminium (smelted plus scrap) is at least 2.00 t.\u003c/li>\u003cli>Total CO₂ (anodes plus electricity) is at most 3.00 t.\u003c/li>\u003cli>Total electricity (cell plus remelting) is at most 40 000 kWh.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Model (24 h, 100% efficiency): 0.806 t of aluminium per 100 kA per day; cell energy 96 × \u003cem>I\u003c/em> (kA) kWh with carbon anodes or 120 × \u003cem>I\u003c/em> (kA) kWh with inert anodes; remelting 0.6 kWh per kg of scrap; anode CO₂ 1.22 × smelted Al (carbon only); electricity CO₂ = factor × total energy (hydro 0.02, natural gas 0.5, coal 1.0 kg/kWh).\u003c/p>","checks":["At least 2.00 t","CO₂ ≤ 3.00 t","Electricity ≤ 40 000 kWh"],"tips":["200 kA makes only 1.61 t: scrap can make up the rest.","Gas and coal power add 0.5 or 1.0 kg of CO₂ for every kWh: that’s more than 9.6 t on gas even at 200 kA.","Carbon anodes add 1.22 t of CO₂ per tonne smelted: at 300 kA that’s 2.95 t before any electricity.","Inert anodes use 120 kWh per kA: 400 kA is over the limit."],"explainPrompt":"Explain the trade-offs in your plan between output, electricity and CO₂.","vocab":"Use the words anode, current, electricity source and recycling.","more":"There’s more than one plan. Can you find them all?","after3":"Every valid plan runs on hydro. Carbon anodes only work at the lower current, with scrap topping up the output."},"cards":[["Hall–Héroult process","Electrolysis of alumina dissolved in molten cryolite to make aluminium."],["Cryolite","The solvent; it lets the bath melt at about 960 °C instead of about 2050 °C."],["Cathode reaction","Al³⁺ + 3e⁻ → Al(l), at the carbon lining (−)."],["Anode reaction","C + 2O²⁻ → CO₂ + 4e⁻; the carbon anodes (+) are used up."],["Overall reaction","2Al₂O₃ + 3C → 4Al + 3CO₂."],["Why not water?","Water (−0.83 V) is reduced before Al³⁺ (−1.66 V): H₂ forms."],["Aluminium per mole of electrons","9.00 g (27.0 ÷ 3)."],["300 kA for 965 s","3000 mol e⁻ → 1000 mol Al → 27.0 kg."],["Carbon and CO₂ per Al","3 mol C and 3 mol CO₂ for every 4 mol Al."],["Recycling","Remelting needs no electrolysis: about 5% of the energy (model value)."],["Biggest CO₂ lever","The electricity source; hydro vs coal changes CO₂ per kg about ninefold in the model."]]}};</script>
