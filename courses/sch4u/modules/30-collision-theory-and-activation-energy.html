.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}

--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 30: hero, Particle box (C6 box, Maxwell–Boltzmann curve, C4 diagram builder), Catalysts at work, tap diagrams, task.
   Colours come from the toolkit and course tokens only: particles A --pen, B --f3, AB --ink; Ea arrows --en-ea (brown),
   ΔH arrow --en-dh (orange), catalysed path --en-cat (teal, dashed); shaded energy tail --hi-soft. */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.ct-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ct-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.ct-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:1.6em;flex:1 1 14rem}

/* Explore */
.ct-how{margin-top:0}
.ct-modes{margin:0 0 12px}
.ct-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.ct-view,.ct-side{min-width:0}
.ct-pane[hidden],.ct-c[hidden]{display:none}
.ct-frame{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.ct-svg{display:block;width:100%;height:auto;margin:0 auto;font-family:var(--font-ui)}
.ct-ctr{margin:8px 0 2px;font-size:.98rem;font-variant-numeric:tabular-nums}
.ct-leg{margin:4px 0 0}
.ct-key{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:2px}
.ct-ka{border-radius:50%;background:var(--pen)}
.ct-kb{border-radius:3px;background:var(--f3)}
.ct-ke{border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink);width:9px;height:9px}
.ct-kab{border-radius:4px;background:var(--ink);width:18px}
.ct-boxbtns,.ct-dbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ct-cap{min-height:1.5em;margin:10px 0 2px;font-size:1rem}
.ct-c > * + *{margin-top:10px}
.ct-fixed{margin:10px 0 0}
.ct-read{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--rule)}
.ct-tc3{margin-top:14px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:10px}
.ct-h4{margin:0 0 6px;font-size:1rem}
.ct-sm{width:5.5em}
.ct-revrow{margin-top:12px}
.ct-hd{cursor:ns-resize;touch-action:none;outline:none}
.ct-hd:focus circle:nth-child(2){stroke:var(--hi);stroke-width:4}
.ct-model{margin-top:14px}

/* Part 3 */
.ct-st + .ct-st{margin-top:22px;padding-top:16px;border-top:1.5px solid var(--rule)}
.ct-st h3{margin-bottom:6px}
.ct-rx{margin:6px 0 10px;padding-left:1.3em}
.ct-fig{max-width:560px}
.ct-p3svg{display:block;width:100%;max-width:520px;height:auto;font-family:var(--font-ui)}
.ct-zoom{margin:12px 0;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px}
.ct-zoom summary{font-weight:700;cursor:pointer;min-height:32px}
.ct-zg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:8px}
.ct-mini{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ct-ask{margin:12px 0 6px}
.ct-chips{display:flex;flex-wrap:wrap;gap:6px}
.ct-chips .chip.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ct-sort{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.ct-card{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.ct-card.ok{border-color:var(--green)}
.ct-card p{margin:0 0 8px}
.ct-card .fb{margin:8px 0 0}
.ct-cb{display:flex;flex-wrap:wrap;gap:6px}

/* Practice: tap the diagram */
.ct-dn{margin:2px 0 6px}
.ct-tapf{max-width:560px}
.ct-tg{cursor:pointer;outline:none}
.ct-tg .ct-ring{stroke:transparent}
.ct-tg:hover .ct-ring,.ct-tg:focus .ct-ring{stroke:var(--hi)}
.ct-tg.bad .ct-ring{stroke:var(--red)}
.ct-tg.ok .ct-ring{stroke:var(--green)}
.ct-tg[aria-disabled="true"]{cursor:default}

/* task */
.ct-trow + .ct-trow{margin-top:12px}

@media (max-width:760px){
  .ct-grid{grid-template-columns:minmax(0,1fr)}
}

,"prompt":"The same diagram, no catalyst. What is \u003ci>E\u003c/i>\u003csub>a\u003c/sub> for the reverse reaction?","options":[{"t":"30 kJ","_n":"10608","_k":"aace57fc"},{"t":"20 kJ","_n":"115d8","_k":"7e5314fc"},{"t":"80 kJ","_n":"125e8","_k":"b002ac99"},{"t":"50 kJ","_n":"13d79","_k":"188ddb81"}],"explain":"A second brown arrow runs from the products (−30 kJ) up to the peak (50 kJ). \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = 50 − (−30) = 80 kJ."}],"chalIntro":"Use the particle box or the diagram builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 has its own boxes under the readout in Box mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2],"prompt":"Box mode: \u003cstrong>double\u003c/strong> the effective collisions per second without changing temperature or adding a catalyst.","why":"One reactant at ×2 doubles the collisions (4000 per second); the energy fraction stays at 1.0%, so effective collisions go from 5.0 to 10.0 per second.","general":"Effective collisions aren’t 10.0 per second yet. Start from the standard settings and change one concentration.","hints":["Collisions depend on how crowded each reactant is.","Doubling one reactant doubles the collisions; the energy fraction stays at 1.0%. Concentration changes how often particles collide, not how much energy each collision has.","Set A to ×2."]},{"id":"tc2","goal":[3],"prompt":"Diagram builder: draw an \u003cstrong>endothermic\u003c/strong> reaction with \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) = 40 kJ and Δ\u003ci>H\u003c/i> = +25 kJ. Then read off \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) and type it in the box.","why":"Peak − reactants = 40 kJ and products − reactants = +25 kJ. The reverse climb starts at the products: 40 − 25 = 15 kJ.","general":"The diagram doesn’t match yet. Check \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) (reactants up to the peak) and Δ\u003ci>H\u003c/i> (reactants to products).","hints":["Put the reactants at 0 and the peak at 40.","Products at +25.","Reverse: from 25 up to 40 is 15 kJ."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"At 300 K, which gives more effective collisions: doubling the concentration of A, or adding catalyst X (\u003ci>E\u003c/i>\u003csub>a\u003c/sub> 50 → 45 kJ/mol)? Predict first, then test both and enter each one’s factor compared with standard.","why":"Doubling [A] gives ×2.0; catalyst X gives ×7.4 (37.1 ÷ 5.0). \u003cstrong>Small drops in \u003ci>E\u003c/i>\u003csub>a\u003c/sub> have big effects. That’s why catalysts matter so much in industry and in cells.\u003c/strong>","hints":["Concentration changes collisions; a catalyst changes the energy fraction.","Test each one separately from the standard settings.","×2.0 for concentration; ×7.4 for catalyst X."]}]},"part3":{"slug":"catalysts","name":"Catalysts","heading":"Catalysts at work","intro":"Catalysts make reactions efficient in cars, in cells and in industry. Visit three stations and zoom in to the particles at each one to see the energy diagram at work.","s1":{"title":"Station 1: The catalytic converter","html":"\u003cp>Exhaust passes over a honeycomb coated with platinum, palladium and rhodium. Exhaust gases stick to the metal surface, their bonds weaken, and they react:\u003c/p>","zoom":"Molecules \u003cstrong>adsorb\u003c/strong> on the metal surface, held in the right orientation, so a lower-\u003ci>E\u003c/i>\u003csub>a\u003c/sub> pathway opens up. The catalyst is a solid and the gases aren’t: it’s a \u003cstrong>heterogeneous\u003c/strong> catalyst.","ask":"Tap the \u003cstrong>two\u003c/strong> things the catalyst does \u003cstrong>not\u003c/strong> change, then press Check.","opts":[{"id":"dh","t":"Δ\u003ci>H\u003c/i>","_n":"14d69","_k":"2a5b16d0"},{"id":"prod","t":"which products are possible","_n":"15d59","_k":"c70edcca"},{"id":"ea","t":"the activation energy","_n":"16d49","_k":"837da7fb"},{"id":"rate","t":"the rate of reaction","_n":"17d39","_k":"fdbdd3d1"}],"good":"Right. The catalyst only lowers the peak. A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","bad":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","two":"Choose exactly two."},"s2":{"title":"Station 2: Enzymes","html":"\u003cp>Enzymes are biological catalysts (you’ll meet them again in Biology). \u003cstrong>Catalase\u003c/strong> speeds the decomposition of hydrogen peroxide in cells: 2H₂O₂ → 2H₂O + O₂.\u003c/p>","cap":"Model data: the rate of a catalase-catalysed reaction at different temperatures (% of the fastest rate).","qs":[{"id":"up","prompt":"Why does the rate \u003cstrong>rise\u003c/strong> from 10 °C to about 37 °C?","opts":[{"t":"More particles have energy above \u003ci>E\u003c/i>\u003csub>a\u003c/sub>","fb":"Right. Warmer particles clear the barrier more often.","_n":"18d29","_k":"61afdec8"},{"t":"The enzyme gets used up faster","fb":"A catalyst isn’t used up. A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"19d19","_k":"01d02225"},{"t":"Warmth lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub>","fb":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub> of a pathway stays the same; the particles’ energies rise.","_n":"1ad09","_k":"03147d30"}]},{"id":"down","prompt":"Why does the rate \u003cstrong>fall\u003c/strong> sharply above about 45 °C?","opts":[{"t":"The enzyme’s shape changes (it denatures), so the lower-\u003ci>E\u003c/i>\u003csub>a\u003c/sub> pathway is lost","fb":"Right. Without its shape, the enzyme can’t offer its lower-\u003ci>E\u003c/i>\u003csub>a\u003c/sub> pathway.","_n":"1bdf9","_k":"3a0648c6"},{"t":"Fewer particles have enough energy","fb":"More particles have enough energy when it’s hotter.","_n":"1cde9","_k":"a41c71e7"},{"t":"The hydrogen peroxide evaporates","fb":"The drop means the catalyst stopped working.","_n":"1dd18","_k":"102913ef"}]}]},"s3":{"title":"Station 3: Industrial conditions","html":"\u003cp>Ammonia is made from N₂ and H₂ over an \u003cstrong>iron catalyst\u003c/strong> at a moderately high temperature, about 400–500 °C. Why not run it cooler?\u003c/p>","opts":[{"t":"At low temperature the reaction is far too slow, even with a catalyst.","fb":"Right. Even the catalysed barrier needs hot particles to be cleared often enough.","_n":"1ed28","_k":"f86f729a"},{"t":"The catalyst only works when hot.","fb":"Partly true, but not the main reason.","_n":"1fd38","_k":"6ac60c87"},{"t":"Higher temperature makes more ammonia.","fb":"Module 35 shows the opposite for this exothermic reaction: it’s a compromise.","_n":"1gd48","_k":"901c6869"}],"preview":"Module 35 explains why too hot lowers the yield."},"sort":{"title":"Homogeneous or heterogeneous?","intro":"A \u003cstrong>homogeneous\u003c/strong> catalyst is in the same phase as the reactants (for example, dissolved with them). A \u003cstrong>heterogeneous\u003c/strong> catalyst is in a different phase (usually a solid surface). Sort the four examples.","boxes":[{"id":"homo","t":"Homogeneous"},{"id":"het","t":"Heterogeneous"}],"cards":[{"id":"c1","t":"Catalase dissolved in the fluid inside a cell","_a":"FQsMW1ga","why":"An enzyme in solution, with dissolved reactants."},{"id":"c2","t":"Amylase dissolved in saliva, breaking down starch","_a":"FQsMW1ga","why":"An enzyme in solution."},{"id":"c3","t":"Platinum, palladium and rhodium in a catalytic converter","_a":"FQsGQhU=","why":"Solid metal; gaseous reactants."},{"id":"c4","t":"Iron in an ammonia plant","_a":"FQsGQhU=","why":"Solid iron; gaseous N₂ and H₂."}]},"quickCheck":{"title":"Quick check","summary":"Catalysts quick check","items":[{"id":"q1","goal":4,"prompt":"A catalyst speeds a reaction by…","choices":[{"t":"providing a pathway with lower \u003ci>E\u003c/i>\u003csub>a\u003c/sub>","fb":"Right. A lower peak means more collisions clear it.","_n":"1hcd8","_k":"249885fc"},{"t":"being used up","fb":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1ice8","_k":"b0423e3f"},{"t":"giving particles more energy","fb":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1jcf8","_k":"09c91bfb"},{"t":"increasing Δ\u003ci>H\u003c/i>","fb":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1kd08","_k":"82770691"}]},{"id":"q2","goal":4,"prompt":"After the reaction, the catalyst is…","choices":[{"t":"turned into product","fb":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1ld98","_k":"58ad3d6f"},{"t":"still present, chemically unchanged","fb":"Right. It’s regenerated and can work again.","_n":"1mda8","_k":"ec1e8fa9"},{"t":"used up","fb":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1n639","_k":"2d971d46"},{"t":"always destroyed by heat","fb":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1o629","_k":"b64dd63a"}]},{"id":"q3","goal":4,"prompt":"A catalyst’s effect on the reverse reaction is to…","choices":[{"t":"stop it","fb":"Lowering the peak lowers both climbs.","_n":"1p659","_k":"f994d746"},{"t":"have no effect","fb":"Lowering the peak lowers both climbs.","_n":"1q649","_k":"b2855be2"},{"t":"speed it up too","fb":"Right. Lowering the peak lowers both climbs.","_n":"1r5f9","_k":"e55764f5"},{"t":"slow it down","fb":"Lowering the peak lowers both climbs.","_n":"1s5e9","_k":"3abdf540"}]},{"id":"q4","goal":5,"prompt":"\u003cstrong>Investigation:\u003c/strong> In the enzyme data, the rate at 60 °C is lower than at 37 °C. Best explanation?","choices":[{"t":"fewer particles had enough energy","fb":"Higher temperature would normally speed it up; the drop means the catalyst stopped working.","_n":"1t619","_k":"32c62fde"},{"t":"enzymes work faster when cold","fb":"Higher temperature would normally speed it up; the drop means the catalyst stopped working.","_n":"1u609","_k":"5fffd472"},{"t":"the enzyme denatured, so its lower-\u003ci>E\u003c/i>\u003csub>a\u003c/sub> pathway was lost","fb":"Right. Heat changed the enzyme’s shape, so the catalyst stopped working.","_n":"1v5b9","_k":"b8610305"},{"t":"the substrate evaporated","fb":"Higher temperature would normally speed it up; the drop means the catalyst stopped working.","_n":"1w5a9","_k":"f1a29708"}]}]}},"practice":{"activities":[{"id":"tap","type":"custom","title":"Read the energy diagram","summary":"Read the energy diagram","goal":[3,4],"instruction":"Tap the point, arrow or region each question asks for.","how":"Tap (or Tab to and press Enter on) a point, an arrow or a band on the diagram. Arrows and bands are lettered so colour isn’t a clue.","dias":{"d1":{"name":"Diagram 1 (exothermic)","r":0,"pk":60,"p":-40,"cat":35},"d2":{"name":"Diagram 2 (endothermic)","r":0,"pk":90,"p":50}},"items":[{"id":"a1","dia":"d1","set":"pts","goal":3,"prompt":"Tap the activated complex (Diagram 1, uncatalysed).","_a":"FRMIFA==","fb":"The activated complex is at the top of the hill.","why":"The peak at 60 kJ: the short-lived arrangement at the top of the barrier.","hints":["The activated complex sits where the energy is highest.","Follow the solid (uncatalysed) path to its top.","The peak at 60 kJ."]},{"id":"a2","dia":"d1","set":"arrows","goal":3,"prompt":"Tap the arrow that shows \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward).","_a":"FQYCFA==","fb":"Start from the reactants, not zero or the products. \u003ci>E\u003c/i>\u003csub>a\u003c/sub> is measured from the \u003cstrong>reactants\u003c/strong> up to the peak.","why":"From the reactants (0 kJ) up to the peak (60 kJ): 60 kJ.","hints":["Which level does the arrow start from?","Forward starts at the reactants; reverse starts at the products.","The arrow from the reactants (0) up to the peak (60)."]},{"id":"a3","dia":"d1","set":"arrows","goal":3,"prompt":"Tap the arrow that shows Δ\u003ci>H\u003c/i>.","_a":"FQcLFA==","fb":"Δ\u003ci>H\u003c/i> runs from reactants to products.","why":"From the reactants (0 kJ) down to the products (−40 kJ): Δ\u003ci>H\u003c/i> = −40 kJ.","hints":["Which level does the arrow start from?","Forward starts at the reactants; reverse starts at the products.","The arrow from the reactants (0) down to the products (−40)."]},{"id":"a4","dia":"d1","set":"pts","goal":4,"prompt":"Tap the catalysed pathway’s peak.","_a":"FQATXRU=","fb":"The dashed path is the catalysed one.","why":"The teal dashed path peaks at 35 kJ, lower than the uncatalysed 60 kJ.","hints":["Look for the dashed path.","It starts and ends at the same levels but has a lower top.","The teal peak at 35 kJ."]},{"id":"a5","dia":"d1","set":"arrows","goal":3,"prompt":"Tap the arrow that shows \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse).","_a":"FREGQBU=","fb":"The reverse climb starts at the products. \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − Δ\u003ci>H\u003c/i>. For an exothermic reaction, the reverse barrier is \u003cstrong>higher\u003c/strong>.","why":"From the products (−40 kJ) up to the peak (60 kJ): 100 kJ.","hints":["Which level does the arrow start from?","Forward starts at the reactants; reverse starts at the products.","The arrow from the products (−40) up to the peak (60): 100 kJ."]},{"id":"a6","dia":"d2","set":"bands","goal":3,"prompt":"Diagram 2: tap the region that shows the reaction is endothermic.","_a":"FRETFA==","fb":"Products above reactants: energy absorbed.","why":"The gap between the reactants (0 kJ) and the products (+50 kJ): the products sit higher, so energy was absorbed.","hints":["Endothermic means the products end up higher than the reactants.","Find the band between the two flat levels.","The band from the reactants (0) up to the products (+50)."]},{"id":"a7","dia":"d2","set":"arrows","goal":3,"prompt":"Diagram 2: tap \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse).","_a":"FREGQBU=","fb":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − Δ\u003ci>H\u003c/i>. For an exothermic reaction, the reverse barrier is \u003cstrong>higher\u003c/strong>.","why":"From the products (+50 kJ) up to the peak (90 kJ): 40 kJ.","hints":["Which level does the arrow start from?","Forward starts at the reactants; reverse starts at the products.","The arrow from the products (+50) up to the peak (90): 40 kJ."]}]},{"id":"calc","type":"numeric","title":"Barriers and collisions","summary":"Barriers and collisions","star":true,"goal":[2,4],"instruction":"Six items. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type your answer, then press Check. Use + or − for signs.","items":[{"id":"d1","goal":3,"prompt":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) = 75 kJ, Δ\u003ci>H\u003c/i> = −40 kJ. \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse)?","_a":"BlJW","unit":"kJ","display":"115 kJ","wrong":[{"match":35,"fb":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − Δ\u003ci>H\u003c/i>. For an exothermic reaction, the reverse barrier is \u003cstrong>higher\u003c/strong>."}],"why":"75 − (−40) = 115 kJ.","hints":["The reverse climb starts at the products.","\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − Δ\u003ci>H\u003c/i>.","75 − (−40) = 115 kJ."]},{"id":"d2","goal":3,"prompt":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) = 120 kJ, \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = 50 kJ. Δ\u003ci>H\u003c/i>?","_a":"AFM=","unit":"kJ","display":"+70 kJ","wrong":[{"match":-70,"fb":"Products sit 70 above the reactants."}],"why":"Δ\u003ci>H\u003c/i> = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = 120 − 50 = +70 kJ.","hints":["The forward climb is longer than the reverse one. Which level is higher?","Δ\u003ci>H\u003c/i> = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse).","120 − 50 = +70 kJ."]},{"id":"d3","goal":4,"star":true,"prompt":"Uncatalysed \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) = 90 kJ; catalysed 60 kJ; Δ\u003ci>H\u003c/i> = −20 kJ. Catalysed \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse)?","_a":"D1M=","unit":"kJ","display":"80 kJ","wrong":[{"match":110,"fb":"That’s the uncatalysed reverse barrier."},{"match":40,"fb":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) − Δ\u003ci>H\u003c/i>. For an exothermic reaction, the reverse barrier is \u003cstrong>higher\u003c/strong>."}],"why":"60 − (−20) = 80 kJ: the catalyst lowers both climbs by 30 kJ.","hints":["Use the catalysed forward barrier.","\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = 60 − Δ\u003ci>H\u003c/i>.","60 − (−20) = 80 kJ."]},{"id":"d4","goal":2,"star":true,"prompt":"Model: from 300 K to 320 K (\u003ci>E\u003c/i>\u003csub>a\u003c/sub> 50), the fraction with \u003ci>E\u003c/i> ≥ \u003ci>E\u003c/i>\u003csub>a\u003c/sub> rises ×3.5 and collisions ×1.03. By about what factor does the rate rise?","_a":"BE1WAw==","tol":0.0142,"unit":"times","display":"about 3.6 times","wrong":[{"match":1.03,"fb":"Collisions rise only about 2% per 10 K, but the fraction with \u003ci>E\u003c/i> ≥ \u003ci>E\u003c/i>\u003csub>a\u003c/sub> nearly doubles. That’s the main effect."},{"match":4.53,"fb":"Multiply the factors; don’t add."},{"match":4.5,"fb":"Multiply the factors; don’t add."}],"why":"1.03 × 3.5 ≈ 3.6.","hints":["Effective collisions = collisions × fraction × orientation.","Both factors multiply the rate.","1.03 × 3.5 ≈ 3.6."]},{"id":"d5","goal":2,"star":true,"prompt":"Model: 2000 collisions/s, 1.0% with enough energy, 25% correctly oriented. Effective collisions per second? Then [B] is tripled: effective per second?","_a":"bFZPBwJl","unit":"per second","display":"5.0, then 15.0 per second","label":"Both answers, separated by a comma:","wrong":[{"match":[20],"fb":"Multiply by both fractions."},{"match":[20,60],"fb":"Multiply by both fractions."},{"match":[5,45],"fb":"Tripling one reactant triples collisions, not ×9."},{"match":[45],"fb":"Tripling one reactant triples collisions, not ×9."}],"why":"2000 × 0.010 × 0.25 = 5.0; tripling [B] triples the collisions: 15.0.","hints":["Multiply the collisions by both fractions.","2000 × 0.010 × 0.25; then ×3.","5.0, then 15.0."]},{"id":"d6","goal":3,"star":true,"prompt":"A two-step reaction: reactants 0 kJ, first peak 60 kJ, intermediate 20 kJ, second peak 50 kJ, products −30 kJ. Overall \u003ci>E\u003c/i>\u003csub>a\u003c/sub> (from the reactants)?","_a":"AVM=","unit":"kJ","display":"60 kJ","wrong":[{"match":90,"fb":"The step with the highest peak (measured from the reactants) controls the rate; barriers aren’t added."},{"match":30,"fb":"Measure from the reactants, not the intermediate."}],"why":"The highest peak above the reactants is the first one: 60 kJ, so step 1 is the slow step.","hints":["Which peak is highest above the reactants?","The first: 60 kJ; the second is 50 kJ above the reactants.","Overall \u003ci>E\u003c/i>\u003csub>a\u003c/sub> = 60 kJ; step 1 is the slow step."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Quentin","how":"","goal":[2,4],"instruction":"Quentin made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Explain how a catalyst speeds up a reaction.","steps":["Reactant particles must collide with at least the activation energy.","A catalyst provides a different reaction pathway.","The catalyst makes Δ\u003ci>H\u003c/i> more negative, so more energy is released.","So more collisions are effective."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows from step 3."],"fixes":[{"t":"The new pathway has a lower \u003ci>E\u003c/i>\u003csub>a\u003c/sub>, so more collisions have enough energy; Δ\u003ci>H\u003c/i> is unchanged.","why":"A catalyst lowers only the peak.","_n":"1x5d9","_k":"78e37cd9"},{"t":"Step 3 is correct.","why":"The diagram’s start and end don’t move.","_n":"1y5e9","_k":"6d33b152"},{"t":"The catalyst is used up, releasing energy.","why":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged.","_n":"1z5b9","_k":"29965e46"},{"t":"The catalyst gives particles extra kinetic energy.","why":"A catalyst lowers \u003ci>E\u003c/i>\u003csub>a\u003c/sub> by offering a new pathway. Δ\u003ci>H\u003c/i>, the products and the catalyst itself are unchanged. It doesn’t heat them.","_n":"205c9","_k":"df5c9dbc"}],"hints":["Does a catalyst change the reactant or product levels?","No; only the peak.","Lower \u003ci>E\u003c/i>\u003csub>a\u003c/sub>, same Δ\u003ci>H\u003c/i>."]},{"id":"e2","goal":3,"task":"\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) = 50 kJ and Δ\u003ci>H\u003c/i> = −30 kJ. Find \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse).","steps":["The products are 30 kJ below the reactants.","The peak is 50 kJ above the reactants.","\u003ci>E\u003c/i>\u003csub>a\u003c/sub>(reverse) = \u003ci>E\u003c/i>\u003csub>a\u003c/sub>(forward) + Δ\u003ci>H\u003c/i> = 50 + (−30) = 20 kJ.","So the reverse re
