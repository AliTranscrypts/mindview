.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}

.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}

.rg button:disabled{opacity:.5}

.wt-hcap{margin-right:6px}

.wt-probe{margin:6px 0 0;min-height:1.4em}
.wt-legend{margin:4px 0 0}
.wt-ctrl{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.wt-ctrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.wt-bur{display:flex;flex-wrap:wrap;gap:6px}
.wt-to,.wt-ent{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.wt-to label,.wt-ent label{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.wt-toin,.wt-entin{width:6.5em}
.wt-chk{display:flex;align-items:center;gap:8px;font-size:.92rem}
.wt-chk input{width:18px;height:18px}
.wt-msg{margin:0;min-height:1.2em;font-weight:600}
.wt-vals{margin:12px 0 0}
.wt-vals summary{cursor:pointer;font-weight:700}
.wt-tabs{margin-top:10px}
.wt-h4{margin:12px 0 6px;font-size:1rem}
.wt-work{margin:0;padding-left:1.4em}

.wt-tapo{font-variant-numeric:tabular-nums;min-width:4.5em}
.wt-taplist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.wt-taplist .btn{text-align:left;font-weight:500;white-space:normal}
.wt-taplist .btn.on{border-color:var(--ink);font-weight:700}

/* task */

?","options":[{"t":"0.40","why":"log 4 ≠ 0.4.","_n":"ccee","_k":"043b68e2"},{"t":"0.60","why":"log 4 = 2 log 2.","_n":"dd1e","_k":"fc89197b"},{"t":"0.90","why":"That’s log 8.","_n":"ed0e","_k":"3e0ede58"},{"t":"1.20","why":"That doubles twice: log 4 = 2 × 0.30.","_n":"fd3e","_k":"60b06530"}],"hints":["4 = 2².","log 2² = 2 log 2.","0.60."]},{"id":"w5","skill":"Logs","goal":3,"use":"log 2 = 0.30, log 3 = 0.48, log 1.8 = 0.26","prompt":"log(1/4) = ?","options":[{"t":"−0.60","why":"log(1/4) = −log 4.","_n":"gd2e","_k":"398ded3b"},{"t":"−0.25","why":"That’s the fraction with a minus sign. Take the log: −log 4.","_n":"hd5e","_k":"3777d980"},{"t":"0.25","why":"Logs of numbers below 1 are negative.","_n":"id4e","_k":"fced6ec0"},{"t":"0.60","why":"Keep the minus sign: log(1/4) = −log 4.","_n":"j5bd","_k":"48d70da5"}],"hints":["log(1/\u003ci>a\u003c/i>) = −log \u003ci>a\u003c/i>.","−log 4.","−0.60."]},{"id":"w6","skill":"Titration stoichiometry","goal":2,"prompt":"How many mL of 0.18 mol/L NaOH neutralize 25.0 mL of 0.18 mol/L HCl?","options":[{"t":"4.50 mL","why":"4.50 is the amount in mmol, not a volume.","_n":"k5cd","_k":"31e2ff09"},{"t":"50.0 mL","why":"Same concentration and a 1 : 1 reaction, so the same volume, not double.","_n":"l5dd","_k":"9ab20c39"},{"t":"25.0 mL","why":"4.50 mmol ÷ 0.18 mol/L.","_n":"m5ed","_k":"2461602a"},{"t":"12.5 mL","why":"Same concentration, so same volume.","_n":"n5fd","_k":"6868efd5"}],"hints":["\u003ci>n\u003c/i>(HCl) = 0.18 × 25.0 = 4.50 mmol.","\u003ci>V\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>c\u003c/i>.","25.0 mL."]}],"refreshers":{"Weak acid pH":"\u003ci>x\u003c/i>² = \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>c\u003c/i>, 5% check, pH = −log \u003ci>x\u003c/i>. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = −log \u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","Conjugate base hydrolysis":"A⁻ + H₂O ⇌ HA + OH⁻; \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> (module 41).","Logs":"log 2 = 0.30, log 4 = 0.60, log 8 = 0.90, log(1/2) = −0.30. log(\u003ci>ab\u003c/i>) = log \u003ci>a\u003c/i> + log \u003ci>b\u003c/i>.","Titration stoichiometry":"Equivalence: \u003ci>n\u003c/i>(OH⁻) = \u003ci>n\u003c/i>(acid) for a monoprotic acid. \u003ci>V\u003c/i> = \u003ci>n\u003c/i> ÷ \u003ci>c\u003c/i>."}}},"explore":{"heading":"Titration lab: weak mode","intro":"Titrate a weak acid or base. Compare it with a strong one, find the half-equivalence point, and see why the equivalence point isn’t at 7.","how":"Choose what’s in the flask and the titrant concentration, then add titrant with the burette buttons. \u003cstrong>Lab\u003c/strong> shows the flask and lets you record readings; \u003cstrong>Curve\u003c/strong> plots the curve with a movable probe (arrow keys: 0.5 mL, Shift: 0.05 mL); \u003cstrong>Calculate\u003c/strong> shows the method and working for the volume in the burette.","flaskNote":"Flask: 25.0 mL at 0.18 mol/L (fixed for the reference curves).","use":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> values: methanoic acid 3.74 · benzoic acid 4.20 · ethanoic acid 4.74 · hypochlorous acid 7.52 · NH₄⁺ 9.26 (= 14.00 − 4.74).\u003cbr>Logs: log 2 = 0.30, log 3 = 0.48, log 7.1 = 0.85.\u003cbr>Square root: √(5.0 × 10⁻¹¹) = 7.1 × 10⁻⁶.","predictions":[{"id":"p1","prompt":"Which needs more 0.18 mol/L NaOH to reach equivalence: 25.0 mL of 0.18 mol/L ethanoic acid or 25.0 mL of 0.18 mol/L HCl?","options":[{"t":"ethanoic acid needs more","_n":"o60d","_k":"4e8219c3"},{"t":"ethanoic acid never reaches equivalence","_n":"p61d","_k":"cecaa2f1"},{"t":"The same (25.0 mL each)","_n":"q62d","_k":"f2ae01cc"},{"t":"ethanoic acid needs less","_n":"r53d","_k":"a7c8d06c"}],"explain":"OH⁻ keeps pulling HA ⇌ H⁺ + A⁻ forward until every HA is used. OH⁻ removes H⁺, and HA keeps ionizing to replace it. Every HA is used: same moles, same volume."},{"id":"p2","prompt":"At 12.5 mL (half-equivalence), the pH will be:","options":[{"t":"8.85","_n":"s54d","_k":"ef3698ae"},{"t":"4.74, equal to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","_n":"t61d","_k":"cd8cb0da"},{"t":"7.00","_n":"u60d","_k":"b1639c79"},{"t":"2.74","_n":"v5fd","_k":"72fcf52d"}],"explain":"Equal amounts make log(1) = 0, so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>."},{"id":"p3","prompt":"At equivalence (25.0 mL), the pH will be:","options":[{"t":"above 7","_n":"w5ed","_k":"950bd4e8"},{"t":"below 7","_n":"x65d","_k":"f4b14b1d"},{"t":"equal to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","_n":"y64d","_k":"ae7c3941"},{"t":"exactly 7","_n":"z63d","_k":"22473899"}],"explain":"Only CH₃COO⁻ and Na⁺ remain, and ethanoate is a base. At equivalence the flask holds A⁻, the conjugate base of a weak acid, so it’s basic."},{"id":"p4","prompt":"Where is the equivalence pH for ammonia titrated with HCl?","options":[{"t":"below 7","_n":"1062d","_k":"2a4a1702"},{"t":"exactly 7","_n":"1159d","_k":"ad37e006"},{"t":"above 7","_n":"1258d","_k":"8be904d4"},{"t":"9.26","_n":"13dfe","_k":"f93a8ed3"}],"explain":"At equivalence the flask holds NH₄⁺, an acid."}],"chalIntro":"Use the lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Type pH values in the \u003cstrong>Your pH\u003c/strong> box. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,5],"prompt":"Find the half-equivalence point of the ethanoic acid titration and read the pH there.","why":"Half of 25.0 mL is 12.5 mL. There \u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻) = 2.25 mmol, so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74.","hints":["Equivalence is at 25.0 mL.","Half of 25.0 is 12.5 mL.","pH there = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74."]},{"id":"tc2","goal":[4,5],"prompt":"Mystery acid: the m&#101;ter shows pH 4.20 at half-equivalence. Identify the acid, then choose the indicator for its titration.","why":"pH at half-equivalence = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.20: benzoic acid. Its equivalence pH is 8.58, inside phenolphthalein’s range (8.2–10.0).","hints":["pH at half-equivalence = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","Match 4.20 in the p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> list.","Benzoic acid; equivalence 8.58, so phenolphthalein."]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Ethanoic acid, m&#101;ter off. (a) Add exactly the volume of NaOH that makes the pH 5.34. (b) Then predict the pH at 5.0 mL and type it in.","why":"(a) 5.34 − 4.74 = 0.60 = log 4, so \u003ci>n\u003c/i>(A⁻) ÷ \u003ci>n\u003c/i>(HA) = 4: 3.60 mmol of OH⁻, which is 20.0 mL. (b) At 5.0 mL the ratio is 1/4, so pH = 4.74 − 0.60 = 4.14.","hints":["5.34 − 4.74 = 0.60 = log 4, so \u003ci>n\u003c/i>(A⁻) ÷ \u003ci>n\u003c/i>(HA) = 4.","4.50 mmol in total: A⁻ = 3.60, HA = 0.90. A⁻ comes from OH⁻ added: 3.60 mmol ÷ 0.18 mol/L.","(a) 20.0 mL. (b) At 5.0 mL, A⁻ = 0.90 and HA = 3.60, so the ratio is 1/4 and pH = 4.74 − 0.60 = 4.14."]}]},"part3":{"slug":"half-equivalence","name":"Find \u003ci>K\u003c/i>\u003csub>a\u003c/sub>","heading":"Find \u003ci>K\u003c/i>\u003csub>a\u003c/sub> from a curve","intro":"The half-equivalence point is the most useful reading on a weak acid curve. Three stations: identify acids from finished curves, analyse a vinegar titration, and mirror the method for a weak base.","s1":{"title":"Station 1: Name that acid","intro":"Four unlabelled curves, all 25.0 mL of 0.18 mol/L acid with 0.18 mol/L NaOH. Choose a curve, drag the probe to its half-equivalence point (12.5 mL), read the pH, and match it to the p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> list: 3.74 methanoic, 4.20 benzoic, 4.74 ethanoic, 7.52 hypochlorous.","data":"\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 10\u003csup>−p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>\u003c/sup>, so 10\u003csup>−4.20\u003c/sup> = 6.3 × 10⁻⁵ matches the course table for benzoic acid."},"s2":{"title":"Station 2: How strong is this vinegar?","intro":"10.0 mL of vinegar is diluted to 100.0 mL. A 25.0 mL portion needs 20.0 mL of 0.100 mol/L NaOH to reach the phenolphthalein endpoint.","use":"0.800 × 60 ≈ 48","compare":"A label claiming “5% acidity” is within the expected uncertainty of this result (about 4.8%, mass per volume)."},"s3":{"title":"Station 3: The weak-base mirror","intro":"The ammonia curve: 25.0 mL of 0.18 mol/L NH₃ titrated with 0.18 mol/L HCl. Move the probe to 12.5 mL, then zoom to the particles."},"quickCheck":{"title":"Quick check","summary":"Find \u003ci>K\u003c/i>\u003csub>a\u003c/sub> quick check","items":[{"id":"q1","goal":5,"prompt":"Half-equivalence pH 3.74. Which acid?","choices":[{"t":"methanoic","fb":"Right. pH at half-equivalence = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 3.74: methanoic acid.","_n":"14e0e","_k":"663f8afe"},{"t":"benzoic","fb":"Match pH to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"15dde","_k":"4ac5ed2f"},{"t":"hypochlorous","fb":"Match pH to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"16dee","_k":"5246a579"},{"t":"ethanoic","fb":"Match pH to p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"17e3e","_k":"2c5def89"}]},{"id":"q2","goal":6,"prompt":"Vinegar diluted tenfold gives 0.0800 mol/L. Original?","choices":[{"t":"0.800 mol/L","fb":"Right. 0.0800 × 10 = 0.800 mol/L.","_n":"18e4e","_k":"2f53a4ce"},{"t":"0.0800 mol/L","fb":"Multiply by the dilution factor. The titration gives the diluted concentration. Multiply by the dilution factor to get the original.","_n":"19e1e","_k":"4d3570c9"},{"t":"8.00 mol/L","fb":"Multiply by the dilution factor: ×10, not ×100.","_n":"1ae2e","_k":"5705f9e2"},{"t":"0.00800 mol/L","fb":"Multiply by the dilution factor; don’t divide.","_n":"1bd7e","_k":"ab502993"}]},{"id":"q3","goal":5,"prompt":"Weak base: half-equivalence pH 9.26. p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>?","choices":[{"t":"2.74","fb":"14.00 − 9.26. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1cd8e","_k":"33fd9111"},{"t":"4.74","fb":"Right. 9.26 is p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺), so p\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 14.00 − 9.26 = 4.74.","_n":"1d65e","_k":"aadb110e"},{"t":"7.00","fb":"14.00 − 9.26. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1e64e","_k":"e68b73dd"},{"t":"9.26","fb":"14.00 − 9.26. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1f67e","_k":"f60f6b81"}]},{"id":"q4","goal":4,"prompt":"Which indicator suits the vinegar titration?","choices":[{"t":"bromothymol blue","fb":"Weak acid with strong base: the equivalence point is above 8.","_n":"1g66e","_k":"b0c0963d"},{"t":"methyl orange","fb":"Weak acid with strong base: the equivalence point is above 8.","_n":"1h61e","_k":"691b3999"},{"t":"methyl red","fb":"Weak acid with strong base: the equivalence point is above 8.","_n":"1i60e","_k":"1c90242d"},{"t":"phenolphthalein","fb":"Right. A weak acid with a strong base has its equivalence point above 8, inside 8.2–10.0.","_n":"1j63e","_k":"7745a0e6"}]}]}},"practice":{"activities":[{"id":"tap","type":"custom","title":"Tap the curve","summary":"Tap the curve","goal":[1,3],"instruction":"The ethanoic acid curve with 0.18 mol/L NaOH. Tap the curve where each statement is true.","how":"Tap the curve (or move the cursor with the slider and press \u003cstrong>Tap here\u003c/strong>). Points need to be within 0.5 mL; regions accept anywhere inside.","hints":["Find equivalence first (25.0 mL).","Halve it for p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>."],"items":[{"id":"t1","goal":[1,3],"prompt":"Tap where pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","region":"Half-equivalence, 12.5 mL: equal amounts of HA and A⁻."},{"id":"t2","goal":1,"prompt":"Tap the equivalence point.","region":"Equivalence, 25.0 mL: the middle of the jump."},{"id":"t3","goal":[1,3],"prompt":"Tap anywhere the solution is a buffer.","region":"The buffer region, about 3–22 mL: HA and A⁻ are both present."},{"id":"t4","goal":3,"prompt":"Tap where only HA (and water) is present.","region":"The very start, 0 mL: no NaOH added yet."},{"id":"t5","goal":3,"prompt":"Tap where excess OH⁻ sets the pH.","region":"After equivalence, beyond 25.5 mL: OH⁻ is left over."},{"id":"t6","goal":[1,3],"prompt":"Tap where the flask holds only Na⁺, CH₃COO⁻ and water.","region":"Equivalence, 25.0 mL: every HA has become A⁻, and no OH⁻ is left over."}]},{"id":"calc","type":"numeric","title":"Calculate the curve","summary":"Calculate the curve","star":true,"goal":[3,5],"instruction":"25.0 mL of 0.18 mol/L ethanoic acid with 0.18 mol/L NaOH unless stated. Items 4 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type the pH to 2 decimal places, then press Check.","items":[{"id":"c1","goal":3,"prompt":"pH before any NaOH is added.","_a":"V01WAA==","tol":0.0073,"display":"pH = 2.74","label":"pH:","use":"log 1.8 = 0.26","why":"\u003ci>x\u003c/i>² = \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>c\u003c/i> = 3.24 × 10⁻⁶, \u003ci>x\u003c/i> = 1.8 × 10⁻³, pH = 3 − 0.26 = 2.74.","wrong":[{"match":[0.74],"fb":"Ethanoic acid is weak."}],"hints":["Start: ICE with \u003ci>K\u003c/i>\u003csub>a\u003c/sub>. \u003ci>x\u003c/i>² = \u003ci>K\u003c/i>\u003csub>a\u003c/sub> × \u003ci>c\u003c/i>.","\u003ci>x\u003c/i>² = 1.8 × 10⁻⁵ × 0.18 = 3.24 × 10⁻⁶, so \u003ci>x\u003c/i> = 1.8 × 10⁻³.","pH = 3 − log 1.8 = 2.74."]},{"id":"c2","goal":3,"prompt":"pH after 5.0 mL of NaOH.","_a":"UU1QAA==","tol":0.0048,"display":"pH = 4.14","label":"pH:","use":"log 4 = 0.60","why":"\u003ci>n\u003c/i>(A⁻) = 0.90 mmol, \u003ci>n\u003c/i>(HA) = 3.60 mmol; pH = 4.74 + log(1/4) = 4.74 − 0.60 = 4.14.","wrong":[{"match":[5.34],"fb":"Ratio inverted. pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base form ÷ acid form). More A⁻ means a higher pH."}],"hints":["\u003ci>n\u003c/i>(OH⁻) added = 0.18 × 5.0 = 0.90 mmol, so \u003ci>n\u003c/i>(A⁻) = 0.90 and \u003ci>n\u003c/i>(HA) = 4.50 − 0.90 = 3.60 mmol.","pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003ci>n\u003c/i>(A⁻) ÷ \u003ci>n\u003c/i>(HA)) = 4.74 + log(1/4).","4.74 − 0.60 = 4.14."]},{"id":"c3","goal":5,"prompt":"pH after 12.5 mL of NaOH.","_a":"UU1WAA==","tol":0.0042,"display":"pH = 4.74","label":"pH:","why":"Half-equivalence: \u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻) = 2.25 mmol, so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74.","wrong":[{"match":[7],"fb":"Half-equivalence gives p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>."}],"hints":["12.5 mL is half of the equivalence volume.","\u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻), so log(1) = 0.","pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74."]},{"id":"c4","goal":3,"star":true,"prompt":"pH after 25.0 mL of NaOH (equivalence).","_a":"XU1ZAQ==","tol":0.0023,"display":"pH = 8.85","label":"pH:","use":"log 2 = 0.30, log 3 = 0.48, log 7.1 = 0.85; √(5.0 × 10⁻¹¹) = 7.1 × 10⁻⁶; p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>: ethanoic acid 4.74, NH₄⁺ 9.26","why":"0.090 mol/L ethanoate hydrolyzes: [OH⁻] = 7.1 × 10⁻⁶, pOH = 5.15, pH = 8.85.","wrong":[{"match":[7],"fb":"At equivalence the flask holds A⁻, the conjugate base of a weak acid, so it’s basic."},{"match":[5.15],"fb":"That’s the pOH. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH."},{"match":[4.74],"fb":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH."}],"hints":["4.50 mmol of A⁻ in 50.0 mL: 0.090 mol/L.","\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 5.6 × 10⁻¹⁰; \u003ci>x\u003c/i>² = 5.0 × 10⁻¹¹.","\u003ci>x\u003c/i> = 7.1 × 10⁻⁶, so pOH = 6 − 0.85 = 5.15 and pH = 8.85."]},{"id":"c5","goal":3,"star":true,"prompt":"pH after 35.0 mL of NaOH.","_a":"VFFPAA8=","tol":0.0016,"display":"pH = 12.48","label":"pH:","use":"log 2 = 0.30, log 3 = 0.48, log 7.1 = 0.85; √(5.0 × 10⁻¹¹) = 7.1 × 10⁻⁶; p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>: ethanoic acid 4.74, NH₄⁺ 9.26","why":"Excess OH⁻ = 1.80 mmol in 60.0 mL = 0.030 mol/L; pOH = 1.52, pH = 12.48.","wrong":[{"match":[1.52],"fb":"That’s the pOH. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH."},{"match":[12.71],"fb":"Divide 1.80 mmol by the total 60.0 mL, not 35.0 mL."}],"hints":["Excess OH⁻ = 6.30 − 4.50 = 1.80 mmol.","÷ 60.0 mL = 0.030 mol/L.","pOH = 2 − 0.48 = 1.52; pH = 12.48."]},{"id":"c6","goal":[3,5],"star":true,"prompt":"Ammonia (25.0 mL, 0.18 mol/L) with 0.18 mol/L HCl: pH at equivalence.","_a":"UE1QAQ==","tol":0.0039,"display":"pH = 5.15","label":"pH:","use":"log 2 = 0.30, log 3 = 0.48, log 7.1 = 0.85; √(5.0 × 10⁻¹¹) = 7.1 × 10⁻⁶; p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>: ethanoic acid 4.74, NH₄⁺ 9.26","why":"0.090 mol/L NH₄⁺ is an acid: [H₃O⁺] = 7.1 × 10⁻⁶, pH = 5.15.","wrong":[{"match":[8.85],"fb":"At equivalence the flask holds NH₄⁺, an acid."}],"hints":["\u003ci>c\u003c/i>(NH₄⁺) = 0.090 mol/L.","\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺) = \u003ci>K\u003c/i>\u003csub>w\u003c/sub> ÷ \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 5.6 × 10⁻¹⁰; \u003ci>x\u003c/i>² = 5.0 × 10⁻¹¹.","\u003ci>x\u003c/i> = [H₃O⁺] = 7.1 × 10⁻⁶; pH = 5.15."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Bao","how":"","instruction":"Bao made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the pH at equivalence when 25.0 mL of 0.18 mol/L ethanoic acid is titrated with 0.18 mol/L NaOH.","steps":["At equivalence, all 4.50 mmol of CH₃COOH has become CH₃COO⁻.","Total volume 50.0 mL, so [CH₃COO⁻] = 0.090 mol/L.","A salt was formed by neutralization, so the solution is neutral: pH = 7.00."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"pH = 14.00 − 4.74 = 9.26.","why":"That’s not how hydrolysis works here.","_n":"1k62e","_k":"cc4152fd"},{"t":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.74.","why":"That’s half-equivalence. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH.","_n":"1l5de","_k":"609dffc5"},{"t":"Step 3 is correct.","why":"Ethanoate is a base. At equivalence the flask holds A⁻, the conjugate base of a weak acid, so it’s basic.","_n":"1m5ce","_k":"5499a053"},{"t":"Ethanoate hydrolyzes: \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 5.6 × 10⁻¹⁰, \u003ci>x\u003c/i>² = 5.0 × 10⁻¹¹, [OH⁻] = 7.1 × 10⁻⁶, pOH 5.15, pH 8.85.","why":"At equivalence the flask holds A⁻, the conjugate base of a weak acid, so it’s basic.","_n":"1nd3e","_k":"8bba3658"}],"hints":["What’s in the flask at equivalence?","CH₃COO⁻, a base.","Hydrolysis gives pH 8.85."]},{"id":"e2","goal":5,"task":"Find the pH at half-equivalence for ethanoic acid (\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.8 × 10⁻⁵).","steps":["Half-equivalence is at 12.5 mL.","Here \u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻) = 2.25 mmol.","So [H₃O⁺] = \u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 1.8 × 10⁻⁵.","pH = −log(1.8 × 10⁻⁵) = 5 + log 1.8 = 5.26"],"_a":"Vg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"A \u003ci>K\u003c/i>\u003csub>a\u003c/sub> slightly above 10⁻⁵ gives p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> slightly below 5.","_n":"1od4e","_k":"8d96c591"},{"t":"pH = log(1.8 × 10⁻⁵) = −4.74.","why":"pH needs −log.","_n":"1pd5e","_k":"8cf31153"},{"t":"pH = 1.8 + 5 = 6.80.","why":"That isn’t a log.","_n":"1qd6e","_k":"4aeca46d"},{"t":"−log(1.8 × 10⁻⁵) = 5 − log 1.8 = 5 − 0.26 = 4.74.","why":"A \u003ci>K\u003c/i>\u003csub>a\u003c/sub> slightly above 10⁻⁵ gives p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> slightly below 5.","_n":"1rcfe","_k":"46608ab8"}],"hints":["Is 1.8 × 10⁻⁵ bigger or smaller than 10⁻⁵?","Bigger, so p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> is below 5.","4.74."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most when you overlaid the weak and strong curves?"},{"id":"j2","q":"In your own words, explain why pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> at the half-equivalence point."},{"id":"j3","q":"Explain to a friend why an ethanoic acid titration needs phenolphthalein, not bromothymol blue."},{"id":"j4","q":"Which region of the curve is still hardest for you to calculate? What will you do about it?"}]},"final":{"intro":"No hints. The “Use these values” box and the indicator table are available: p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> values methanoic acid 3.74, benzoic acid 4.20, ethanoic acid 4.74, hypochlorous acid 7.52, NH₄⁺ 9.26; logs: log 2 = 0.30, log 3 = 0.48, log 7.1 = 0.85; indicators: methyl orange 3.1–4.4, methyl red 4.4–6.2, bromothymol blue 6.0–7.6, phenolphthalein 8.2–10.0.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"At the half-equivalence point of a weak acid titrated with NaOH…","options":[{"t":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","why":"\u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻), so log(1) = 0 and pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"1sd0e","_k":"1f357c06"},{"t":"pH = ½ p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>","why":"No halving: log(1) = 0.","_n":"1td1e","_k":"65d64603"},{"t":"all of the HA has reacted","why":"Only half has.","_n":"1ud2e","_k":"074dd31d"},{"t":"pH = 7.00","why":"Half-equivalence is in the buffer region, not neutral: pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>.","_n":"1vdbe","_k":"e14d1a96"}]},"b":{"prompt":"At the half-equivalence point of a weak base titrated with HCl…","options":[{"t":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> of the conjugate acid (14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>)","why":"At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1wdce","_k":"5809de59"},{"t":"pH = 7.00","why":"The flask holds equal amounts of B and BH⁺, a buffer, not a neutral solution. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1xd9e","_k":"43a894c7"},{"t":"pOH = 7.00","why":"pOH = p\u003ci>K\u003c/i>\u003csub>b\u003c/sub> here.","_n":"1yd8e","_k":"9233f7bf"},{"t":"pH = p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>","why":"At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"1zd7e","_k":"71397b2b"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which indicator suits ethanoic acid titrated with NaOH (equivalence pH 8.85)?","options":[{"t":"Phenolphthalein (8.2–10.0)","why":"The equivalence pH here is 8.85. Phenolphthalein (8.2–10.0) brackets it.","_n":"20d6e","_k":"3631c812"},{"t":"Methyl red (4.4–6.2)","why":"Too low. The equivalence pH here is 8.85. Phenolphthalein (8.2–10.0) brackets it.","_n":"21d5e","_k":"af85070b"},{"t":"Methyl orange (3.1–4.4)","why":"Far too low. The equivalence pH here is 8.85. Phenolphthalein (8.2–10.0) brackets it.","_n":"22d4e","_k":"aa4d538d"},{"t":"Bromothymol blue (6.0–7.6)","why":"Its range ends before 8.85. The equivalence pH here is 8.85. Phenolphthalein (8.2–10.0) brackets it.","_n":"23d3e","_k":"b20da8cf"}]},"b":{"prompt":"Which indicator suits ammonia titrated with HCl (equivalence pH 5.15)?","options":[{"t":"Bromothymol blue (6.0–7.6)","why":"Its range is above 5.15: it changes too early.","_n":"24d2e","_k":"d5c58c15"},{"t":"Methyl red (4.4–6.2)","why":"Its range brackets the equivalence pH, 5.15.","_n":"25e1e","_k":"6e9ae627"},{"t":"Methyl orange (3.1–4.4)","why":"Its range starts below the equivalence pH.","_n":"26e0e","_k":"4d0922b2"},{"t":"Phenolphthalein (8.2–10.0)","why":"Its range is far above 5.15.","_n":"2757c","_k":"9c99d18e"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"25.0 mL of 0.18 mol/L ethanoic acid and 25.0 mL of 0.18 mol/L HCl are each titrated with 0.18 mol/L NaOH. The equivalence volumes are…","options":[{"t":"the same, 25.0 mL each","why":"Same moles of acid, same moles of OH⁻.","_n":"2858c","_k":"a439fc39"},{"t":"impossible to compare","why":"Moles decide it.","_n":"2955c","_k":"bc0fbb06"},{"t":"more for ethanoic acid","why":"Same moles of acid.","_n":"2a56c","_k":"72ad4009"},{"t":"less for ethanoic acid","why":"OH⁻ removes H⁺, and HA keeps ionizing to replace it. Every HA is used: same moles, same volume.","_n":"2b53c","_k":"cf890dc3"}]},"b":{"prompt":"25.0 mL of 0.18 mol/L NH₃ and 25.0 mL of 0.18 mol/L NaOH are each titrated with 0.18 mol/L HCl. The equivalence volumes are…","options":[{"t":"less for NH₃","why":"H₃O⁺ removes OH⁻, and NH₃ keeps reacting to replace it. Every NH₃ is used: same moles, same volume.","_n":"2c54c","_k":"710d63bd"},{"t":"impossible to compare","why":"Moles decide it.","_n":"2d51c","_k":"1141ca73"},{"t":"more for NH₃","why":"Same moles of base.","_n":"2e52c","_k":"94450781"},{"t":"the same, 25.0 mL each","why":"Same moles of base, same moles of H₃O⁺.","_n":"2f5fc","_k":"c998dfb5"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Find the pH after 5.0 mL of 0.18 mol/L NaOH is added to 25.0 mL of 0.18 mol/L ethanoic acid (p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 4.74).","options":[{"t":"2.74","why":"That ignores the NaOH added.","_n":"2g60c","_k":"490f5094"},{"t":"4.14","why":"A⁻ 0.90 mmol, HA 3.60 mmol; log(1/4) = −0.60.","_n":"2h5dc","_k":"9c863a45"},{"t":"4.74","why":"That’s half-equivalence (12.5 mL).","_n":"2i5cc","_k":"985c9d54"},{"t":"5.34","why":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base form ÷ acid form). More A⁻ means a higher pH.","_n":"2j5fc","_k":"57eaed4e"}]},"b":{"prompt":"Find the pH after 20.0 mL is added.","options":[{"t":"4.14","why":"pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(base form ÷ acid form). More A⁻ means a higher pH.","_n":"2k5ec","_k":"0e326844"},{"t":"4.74","why":"That’s half-equivalence (12.5 mL).","_n":"2l61c","_k":"3711c49e"},{"t":"5.34","why":"A⁻ 3.60, HA 0.90; +0.60.","_n":"2m60c","_k":"c42ad315"},{"t":"8.85","why":"Equivalence is at 25.0 mL.","_n":"2n63c","_k":"496959fe"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Find the equivalence pH for 25.0 mL of 0.18 mol/L benzoic acid titrated with 0.18 mol/L NaOH. (Use \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(benzoate) = 1.59 × 10⁻¹⁰, √(1.43 × 10⁻¹¹) ≈ 3.78 × 10⁻⁶ and log 3.78 ≈ 0.58.)","options":[{"t":"4.20","why":"That’s p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH.","_n":"2o62c","_k":"29264862"},{"t":"5.42","why":"That’s the pOH. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH.","_n":"2p55c","_k":"cdce95f3"},{"t":"7.00","why":"At equivalence the flask holds A⁻, the conjugate base of a weak acid, so it’s basic.","_n":"2q54c","_k":"07d610c7"},{"t":"8.58","why":"\u003ci>c\u003c/i>(A⁻) = 0.090; \u003ci>K\u003c/i>\u003csub>b\u003c/sub> × \u003ci>c\u003c/i> = 1.43 × 10⁻¹¹; \u003ci>x\u003c/i> = 3.78 × 10⁻⁶; pOH 5.42.","_n":"2rb0a","_k":"139a45a8"}]},"b":{"prompt":"Find the equivalence pH for 25.0 mL of 0.18 mol/L methanoic acid titrated with 0.18 mol/L NaOH. (Use \u003ci>K\u003c/i>\u003csub>b\u003c/sub>(methanoate) = 5.50 × 10⁻¹¹, √(4.95 × 10⁻¹²) ≈ 2.22 × 10⁻⁶ and log 2.22 ≈ 0.35.)","options":[{"t":"3.74","why":"That’s p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH.","_n":"2safa","_k":"64327465"},{"t":"5.65","why":"That’s the pOH. p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> belongs to half-equivalence. At equivalence, solve the hydrolysis of A⁻, then convert pOH to pH.","_n":"2taea","_k":"ea0ef881"},{"t":"7.00","why":"At equivalence the flask holds A⁻, the conjugate base of a weak acid, so it’s basic.","_n":"2uada","_k":"777a6eb5"},{"t":"8.35","why":"pOH = 6 − 0.35 = 5.65.","_n":"2vb4a","_k":"d9aefa80"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A 25.0 mL sample of an unknown weak acid needs 30.0 mL of 0.10 mol/L NaOH to reach equivalence. After 15.0 mL, pH = 4.20. Find the acid’s concentration and identity.","options":[{"t":"0.120 mol/L, benzoic acid","why":"3.0 mmol ÷ 25.0 mL; 15.0 mL is half-equivalence, so p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 4.20.","_n":"2wb3a","_k":"4c15d2aa"},{"t":"0.120 mol/L, identity unknown without the equivalence pH","why":"Half-equivalence pH identifies it.","_n":"2xb2a","_k":"22b4a8bb"},{"t":"0.120 mol/L, ethanoic acid","why":"Ethanoic acid’s p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> is 4.74.","_n":"2yb1a","_k":"f1849879"},{"t":"0.0833 mol/L, benzoic acid","why":"Volumes inverted.","_n":"2zb8a","_k":"fdfee2ab"}]},"b":{"prompt":"A 20.0 mL sample needs 16.0 mL of 0.15 mol/L NaOH. After 8.0 mL, pH = 7.52. Find the concentration and identity.","options":[{"t":"0.188 mol/L, hypochlorous acid","why":"Volumes inverted.","_n":"30b7a","_k":"a54777ad"},{"t":"0.120 mol/L, ethanoic acid","why":"8.0 mL is half-equivalence, so p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 7.52: hypochlorous acid, not ethanoic acid (4.74).","_n":"31aaa","_k":"5417e2e3"},{"t":"0.120 mol/L, identity unknown","why":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> identifies it.","_n":"32aba","_k":"93057093"},{"t":"0.120 mol/L, hypochlorous acid","why":"2.4 mmol ÷ 20.0 mL; p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> 7.52.","_n":"33aca","_k":"e0b03004"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which best explains why the equivalence pH is above 7 for ethanoic acid titrated with NaOH?","options":[{"t":"“At equivalence the flask holds ethanoate, the conjugate base of a weak acid, which reacts with water to make OH⁻.”","why":"It names what’s in the flask and why that makes the solution basic.","_n":"34ada","_k":"fddf3f8c"},{"t":"“Phenolphthalein is basic.”","why":"Indicators don’t set the pH.","_n":"35aea","_k":"5b7967bb"},{"t":"“Some NaOH is left over at equivalence.”","why":"By definition, none is in excess.","_n":"36afa","_k":"252d1cab"},{"t":"“Ethanoic acid is weak, so it doesn’t fully react.”","why":"OH⁻ removes H⁺, and HA keeps ionizing to replace it. Every HA is used: same moles, same volume.","_n":"37b0a","_k":"18c29d89"}]},"b":{"prompt":"Which best explains the flat buffer region between about 5 and 20 mL?","options":[{"t":"“Both HA and A⁻ are present, so added OH⁻ turns some HA into A⁻ and the ratio, and the pH, change slowly.”","why":"It names both species and explains why the pH changes slowly.","_n":"38b1a","_k":"68d2f5dc"},{"t":"“No reaction happens in that region.”","why":"OH⁻ reacts with HA throughout.","_n":"39b2a","_k":"ac4fc6dd"},{"t":"“The solution is neutral there.”","why":"It’s acidic (pH 4–5.5).","_n":"3ab3a","_k":"f033b848"},{"t":"“The indicator absorbs the added base.”","why":"Indicators are present in tiny amounts.","_n":"3b3ca","_k":"86a82864"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"A student uses bromothymol blue (6.0–7.6) for an ethanoic acid titration. What is the effect?","options":[{"t":"No effect: any indicator works.","why":"The equivalence pH here is 8.85. Phenolphthalein (8.2–10.0) brackets it.","_n":"3c3ba","_k":"1642d65c"},{"t":"It never changes colour.","why":"The pH passes through 6.0–7.6 just before the jump.","_n":"3d3ea","_k":"c566f640"},{"t":"The colour changes slightly before equivalence (8.85), so the recorded volume and the calculated concentration are a little too low.","why":"6.0–7.6 sits just below 8.85, so the colour changes a little early.","_n":"3e3da","_k":"04bdbde3"},{"t":"It changes after equivalence, so the volume is too high.","why":"6.0–7.6 is below 8.85, so it changes earlier.","_n":"3f40a","_k":"a879cbea"}]},"b":{"prompt":"A student uses methyl orange (3.1–4.4) for an ammonia titration with HCl (equivalence 5.15). What is the effect?","options":[{"t":"It never changes.","why":"The pH falls through 4.4 just after equivalence.","_n":"3g3fa","_k":"6dcd34fc"},{"t":"No effect.","why":"Choose an indicator whose range contains the equivalence pH: methyl red (4.4–6.2) here.","_n":"3h42a","_k":"d2ac835e"},{"t":"The colour changes slightly after equivalence, so the recorded volume and the calculated NH₃ concentration are a little too high.","why":"The pH is falling, and 3.1–4.4 sits just below 5.15, so the colour changes a little late.","_n":"3i41a","_k":"c47f15eb"},{"t":"It changes before equivalence.","why":"4.4 is below 5.15, and the pH is falling.","_n":"3j34a","_k":"91600a1b"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"10.0 mL of vinegar is diluted to 100.0 mL. A 25.0 mL portion needs 20.0 mL of 0.100 mol/L NaOH. What is the ethanoic acid concentration in the original vinegar?","options":[{"t":"8.00 mol/L","why":"×10, not ×100.","_n":"3k33a","_k":"5365d571"},{"t":"0.800 mol/L","why":"2.00 mmol ÷ 25.0 mL = 0.0800 mol/L; 0.0800 × 10.","_n":"3lb6a","_k":"57d6ecdf"},{"t":"0.0800 mol/L","why":"The titration gives the diluted concentration. Multiply by the dilution factor to get the original.","_n":"3mb7a","_k":"8da37a58"},{"t":"0.125 mol/L","why":"Volumes inverted.","_n":"3nb4a","_k":"2e5fcd6c"}]},"b":{"prompt":"5.00 mL of a cleaning vinegar is diluted to 50.0 mL. A 20.0 mL portion needs 30.0 mL of 0.100 mol/L NaOH. What is the original concentration?","options":[{"t":"0.150 mol/L","why":"The titration gives the diluted concentration. Multiply by the dilution factor to get the original.","_n":"3ob5a","_k":"e5dc81e0"},{"t":"1.50 mol/L","why":"3.00 mmol ÷ 20.0 = 0.150; × 10.","_n":"3pb2a","_k":"01b59d17"},{"t":"0.667 mol/L","why":"Volumes inverted.","_n":"3qb3a","_k":"e54baff8"},{"t":"15.0 mol/L","why":"×10, not ×100.","_n":"3rb0a","_k":"c71579a4"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A 20.0 mL sample of a diluted household ammonia cleaner needs 25.0 mL of 0.120 mol/L HCl. What is the NH₃ concentration, and the pH at half-equivalence?","options":[{"t":"0.0960 mol/L; pH 9.26","why":"Volumes inverted.","_n":"3sb1a","_k":"a4373900"},{"t":"0.150 mol/L; pH 7.00","why":"Half-equivalence is a buffer of NH₃ and NH₄⁺, not neutral. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"3tbea","_k":"be580687"},{"t":"0.150 mol/L; pH 9.26","why":"3.00 mmol ÷ 20.0 mL; pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(NH₄⁺).","_n":"3ubfa","_k":"dc0aa91a"},{"t":"0.150 mol/L; pH 4.74","why":"That’s p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"3v48b","_k":"af483f8f"}]},"b":{"prompt":"An unknown weak base B is titrated with HCl. At half-equivalence pH = 10.64. What is \u003ci>K\u003c/i>\u003csub>b\u003c/sub> of B? (Use log 4.4 ≈ 0.64.)","options":[{"t":"2.3 × 10⁻¹¹","why":"That’s \u003ci>K\u003c/i>\u003csub>a\u003c/sub> of BH⁺. At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"3w47b","_k":"b8a29949"},{"t":"1.8 × 10⁻⁵","why":"That assumes ammonia.","_n":"3x46b","_k":"6c1ada8f"},{"t":"10\u003csup>−10.64\u003c/sup>","why":"At half-equivalence [B] = [BH⁺], so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>.","_n":"3y45b","_k":"6ea0833d"},{"t":"4.4 × 10⁻⁴","why":"p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 10.64, so p\u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 3.36 and \u003ci>K\u003c/i>\u003csub>b\u003c/sub> = 10\u003csup>−3.36\u003c/sup> = 4.4 × 10⁻⁴ (methylamine).","_n":"3z44b","_k":"5ef9396c"}]}}]},"task":{"title":"Pick the acid and indicator","summary":"Pick the acid and indicator","statement":"\u003cp>You’ll titrate 25.0 mL of a 0.18 mol/L weak acid with NaOH. Choose the acid, the NaOH concentration and the indicator so the titration works well. There’s more than one good choice.\u003c/p>\u003col class=\"wt-conds\">\u003cli>The equivalence volume is between 15.0 and 30.0 mL.\u003c/li>\u003cli>The indicator’s range contains the equivalence pH.\u003c/li>\u003cli>The jump is clear: the pH rises by at least 3.0 units between 0.50 mL before and 0.50 mL after equivalence.\u003c/li>\u003c/ol>","checks":["Equivalence 15.0–30.0 mL","Indicator fits","Clear jump"],"tips":["Equivalence volume = 4.50 mmol ÷ NaOH concentration.","A weak acid with a strong base has its equivalence point above 7. Which range is high enough?","A very weak acid (large p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>) gives a high equivalence pH and a small jump."],"explainPrompt":"Explain why phenolphthalein suits your acid and why hypochlorous acid is a poor choice.","vocab":"Use the words equivalence point, conjugate base, p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> and indicator range.","more":"There’s more than one good choice. Can you find every one?","after3":"Hypochlorous acid fails twice: its equivalence pH (10.24) is above phenolphthalein’s range, and its jump is only about 2 units."},"cards":[["Weak acid curve: start","Higher pH than a strong acid of the same concentration (ICE with \u003ci>K\u003c/i>\u003csub>a\u003c/sub>)."],["Buffer region","HA and A⁻ both present; pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub> + log(\u003ci>n\u003c/i>(A⁻) ÷ \u003ci>n\u003c/i>(HA)); changes slowly."],["Half-equivalence","\u003ci>n\u003c/i>(HA) = \u003ci>n\u003c/i>(A⁻), so pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>."],["Equivalence (weak acid + strong base)","Above 7: A⁻ hydrolyzes. 0.090 mol/L ethanoate: pH 8.85."],["Equivalence (weak base + strong acid)","Below 7: BH⁺ hydrolyzes. 0.090 mol/L NH₄⁺: pH 5.15."],["Equivalence volume","Same as for a strong acid of equal moles: stoichiometry, not strength."],["Indicator for weak acid + NaOH","Phenolphthalein (8.2–10.0)."],["Indicator for weak base + HCl","Methyl red (4.4–6.2)."],["\u003ci>K\u003c/i>\u003csub>a\u003c/sub> from a curve","\u003ci>K\u003c/i>\u003csub>a\u003c/sub> = 10\u003csup>−(pH at half-equivalence)\u003c/sup>."],["Weak base: half-equivalence","pH = p\u003ci>K\u003c/i>\u003csub>a\u003c/sub>(BH⁺) = 14.00 − p\u003ci>K\u003c/i>\u003csub>b\u003c/sub>."],["After equivalence","Excess OH⁻ ÷ total volume: the weak and strong curves merge."],["Dilution factor","If a sample was diluted ×10 before titrating, multiply the result by 10."]]}};</script>
