.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}

.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}

pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}

.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}

.face.back > span{background:var(--sheet);background:transparent}

.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

.hd-btns{gap:6px}

.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}

}

*{transition:none!important;animation:none!important}

₃\u003cspan class=\"am-n\">N\u003c/span>H₂ →\u003c/span> \u003cspan class=\"nw\">(CH₃)₂\u003cspan class=\"am-n\">N\u003c/span>H →\u003c/span> \u003cspan class=\"nw\">(CH₃)₃\u003cspan class=\"am-n\">N\u003c/span>,\u003c/span> \u003cspan class=\"nw\">then CH₃C\u003cspan class=\"am-o\">O\u003c/span>\u003cspan class=\"am-n\">N\u003c/span>H₂\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"N H 3, then C H 3 N H 2, then (C H 3) 2 N H, then (C H 3) 3 N; then C H 3 C O N H 2","headline":"Ammonia with carbon attached","text":"Swap the hydrogens of ammonia for carbon groups and you get \u003cstrong>amines\u003c/strong>: primary, secondary or tertiary. Put a C=O next to the nitrogen and you get an \u003cstrong>amide\u003c/strong>, the link that holds proteins and nylon together. One lone pair decides who is a base; one N–H decides who can \u003cstrong>hydrogen-bond\u003c/strong>.","fig":{"html":"\u003cdiv class=\"am-hx\">\u003cdiv id=\"am-hx-mol\">\u003c/div>\u003cdiv class=\"am-hx-row\">\u003cp class=\"am-hx-cap\" id=\"am-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"am-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can classify amines as primary, secondary or tertiary by counting carbons on the nitrogen, and tell amines from amides.","I can name and draw simple amines and amides using IUPAC rules (including N-substituents).","I can explain and predict boiling points and solubility of amines and amides from hydrogen bonding and polarity.","I can write the condensation that forms an amide and the hydrolysis that breaks one.","I can explain why amines are basic and amides are not, and use this in everyday contexts.","I can identify amine and amide groups in proteins, polymers and medicines."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Hydrogen bonding","goal":3,"prompt":"Which pure substance has hydrogen bonds between its molecules?","options":[{"t":"Propane, CH₃CH₂CH₃","why":"C–H bonds aren’t polar enough.","_n":"0512","_k":"2ca94732"},{"t":"Ethanol, CH₃CH₂OH","why":"An H on O lets molecules hydrogen-bond.","_n":"14e2","_k":"b23444d3"},{"t":"Methoxymethane, CH₃OCH₃","why":"No H is bonded to the O.","_n":"24f2","_k":"f1f3b8f8"},{"t":"Chloromethane, CH₃Cl","why":"Polar, but no H on N, O or F.","_n":"3542","_k":"bab9216c"}],"hints":["Look for H bonded directly to N, O or F.","Only one choice has an O–H.","Ethanol."]},{"id":"w2","skill":"Hydrogen bonding","goal":3,"prompt":"Using electronegativity (N 3.04, O 3.44, F 3.98), which bond makes the strongest hydrogen bonds?","options":[{"t":"N–H","why":"N is the least electronegative of the three.","_n":"4552","_k":"2c03091a"},{"t":"All three equally","why":"Polarity depends on the electronegativity difference.","_n":"5522","_k":"90fd37b0"},{"t":"F–H","why":"The largest difference from H (2.20) gives the most polar bond.","_n":"6532","_k":"ed21a9d5"},{"t":"O–H","why":"O–H is common but F–H is more polar.","_n":"7482","_k":"5533194f"}],"hints":["Which atom pulls electrons hardest?","F has the highest value.","F–H."]},{"id":"w3","skill":"Functional groups","goal":1,"prompt":"Which functional group is in CH₃COOCH₂CH₃?","options":[{"t":"Carboxylic acid","why":"An acid ends in –COOH, with an H on the O.","_n":"8492","_k":"0bd32661"},{"t":"Ether","why":"The C=O makes it an ester.","_n":"95c9","_k":"bee48900"},{"t":"Ester","why":"–COO– between two carbon groups.","_n":"a5b9","_k":"543bfe22"},{"t":"Ketone","why":"The C=O carbon is also bonded to an O.","_n":"b5e9","_k":"c93a9f61"}],"hints":["Is there an H on the O?","No: an alkyl group.","Ester (ethyl ethanoate)."]},{"id":"w4","skill":"Functional groups","goal":1,"prompt":"Which formula shows a carboxylic acid?","options":[{"t":"CH₃COCH₃","why":"That’s a ketone.","_n":"c5d9","_k":"e99495c5"},{"t":"CH₃CH₂CHO","why":"That’s an aldehyde (–CHO).","_n":"d609","_k":"b7f723e3"},{"t":"CH₃CH₂CH₂OH","why":"That’s an alcohol.","_n":"e5f9","_k":"d7587985"},{"t":"CH₃CH₂COOH","why":"–COOH.","_n":"f629","_k":"2e6c9cd0"}],"hints":["Look for C=O and O–H on the same carbon.","–COOH.","Propanoic acid."]},{"id":"w5","skill":"Condensation","goal":4,"prompt":"Ethanoic acid reacts with methanol to make an ester. What else forms?","options":[{"t":"Water","why":"The –OH from the acid and H from the alcohol leave as H₂O.","_n":"g619","_k":"346902fe"},{"t":"Nothing","why":"Condensation always releases a small molecule.","_n":"h649","_k":"08377f73"},{"t":"Hydrogen gas","why":"No H₂ is released.","_n":"i639","_k":"b0ad32c5"},{"t":"Carbon dioxide","why":"No carbon is lost.","_n":"jea9","_k":"753f2db5"}],"hints":["What does ‘condensation’ mean in organic chemistry?","Two molecules join and a small one is lost.","Water."]},{"id":"w6","skill":"Brønsted–Lowry bases","goal":5,"prompt":"In NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, what does NH₃ do?","options":[{"t":"Nothing; it only dissolves","why":"NH₄⁺ forms, so a proton moved.","_n":"keb9","_k":"83fda6e7"},{"t":"Donates OH⁻","why":"NH₃ has no OH; the OH⁻ comes from water.","_n":"lec9","_k":"f74dabad"},{"t":"Donates H⁺","why":"NH₃ gains an H to become NH₄⁺.","_n":"med9","_k":"b2427d13"},{"t":"Accepts H⁺ from water, so it acts as a base","why":"Its lone pair bonds to H⁺.","_n":"nee9","_k":"04ab5f52"}],"hints":["Compare NH₃ and NH₄⁺.","It gained an H⁺.","Base."]}],"refreshers":{"Hydrogen bonding":"Between molecules, an H bonded to N, O or F is attracted to a lone pair on N, O or F of a neighbour. The more electronegative the atom, the stronger the hydrogen bond.","Functional groups":"–OH alcohol; –CHO aldehyde; C=O between carbons ketone; –COOH acid; –COO– ester.","Condensation":"Two molecules join and release a small molecule, usually water.","Brønsted–Lowry bases":"A base accepts H⁺, usually with a lone pair."}}},"explore":{"heading":"Nitrogen family builder","intro":"Put carbon groups on a nitrogen, or a C=O next to it. Watch the class, the name and the boiling point change.","how":"Choose a mode. \u003cstrong>Build:\u003c/strong> pick a group for each of the three places on the nitrogen (arrow keys move through the choices), and switch on the C=O to make an amide. \u003cstrong>Compare:\u003c/strong> tap up to 5 compounds to see their boiling points. \u003cstrong>Condense:\u003c/strong> choose an acid and an N-compound, then press Condense.","modes":[{"id":"build","t":"Build"},{"id":"compare","t":"Compare"},{"id":"condense","t":"Condense"}],"condenseNote":"The module shows the overall condensation. In practice an acid and an amine first form a salt and need heating (or a more reactive form of the acid) to make the amide.","predictions":[{"id":"p1","prompt":"Compare mode: propan-1-amine and N,N-dimethylmethanamine both have a molar mass of 59 g/mol. Which has the higher boiling point?","options":[{"t":"can’t tell without more data","_n":"oef9","_k":"cf0fceaf"},{"t":"propan-1-amine","_n":"pf09","_k":"271e692c"},{"t":"N,N-dimethylmethanamine","_n":"qf19","_k":"5ad5ce73"},{"t":"the same","_n":"re29","_k":"1b4789f6"}],"explain":"The bars rise to 48 °C and 3 °C. A tertiary amine has no N–H, so its molecules can’t hydrogen-bond to each other."},{"id":"p2","prompt":"Ethanamine (45 g/mol) and ethanol (46 g/mol). Which boils higher?","options":[{"t":"the same","_n":"se39","_k":"f736a152"},{"t":"ethanamine, because N has a lone pair","_n":"tf09","_k":"de513763"},{"t":"ethanamine","_n":"uef9","_k":"cab68b25"},{"t":"ethanol","_n":"vee9","_k":"16deca1a"}],"explain":"17 °C vs 78 °C. O–H is more polar than N–H, so ethanol’s hydrogen bonds are stronger."},{"id":"p3","prompt":"Build mode: methanamine is in water with a pH m&#101;ter. Now the C=O is switched on, making methanamide. What happens to the pH when the C=O is added?","options":[{"t":"it becomes strongly acidic","_n":"wed9","_k":"2c7afc71"},{"t":"it stays basic","_n":"xf49","_k":"82357473"},{"t":"it drops from basic (above 7) to about 7","_n":"yf39","_k":"d60744b2"},{"t":"it rises","_n":"zf29","_k":"1ee849f7"}],"explain":"The m&#101;ter swings from about 11.8 to about 7 (model reading). The amide’s lone pair is pulled toward the C=O, so it no longer accepts H⁺."},{"id":"p4","prompt":"Ethanamide and propan-1-amine (both 59 g/mol). Which boils higher?","options":[{"t":"about the same","_n":"10f19","_k":"8e80dca5"},{"t":"ethanamide, by about 5 °C","_n":"11e89","_k":"71dc7710"},{"t":"propan-1-amine","_n":"12e79","_k":"d9a19fd4"},{"t":"ethanamide, by about 170 °C","_n":"13eea","_k":"0efd3c20"}],"explain":"221 °C vs 48 °C. Two N–H bonds \u003cstrong>and\u003c/strong> a very polar C=O: amide molecules stick together strongly."}],"chalIntro":"Use the builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Build a \u003cstrong>secondary\u003c/strong> amine with molar mass 59 g/mol.","why":"N-methylethanamine, CH₃CH₂NHCH₃: two carbon groups on the N, and C₃H₉N is 59 g/mol. It’s the only secondary amine with this formula.","hints":["C₃H₉N: 3 carbons to share out.","Secondary means exactly two carbon groups on N.","A methyl and an ethyl: N-methylethanamine."]},{"id":"tc2","goal":[2,3],"prompt":"Build an amide whose molecules \u003cstrong>can’t\u003c/strong> hydrogen-bond to each other, then name it with the name chips.","why":"A tertiary amide has no N–H, so its molecules can’t hydrogen-bond to each other. The carbons on the N are N-prefixes; the parent comes from the C=O side.","hints":["Which bond lets amides hydrogen-bond?","Replace both H’s on N.","e.g. CH₃CON(CH₃)₂: N,N-dimethylethanamide."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Condense mode: choose an acid and an N-compound so the amide formed has molar mass 73 g/mol \u003cstrong>and\u003c/strong> can still hydrogen-bond to itself.","why":"C₃H₇NO with at least one N–H. Three pairs work: propanoic acid + ammonia → propanamide; ethanoic acid + methanamine → N-methylethanamide; methanoic acid + ethanamine → N-ethylmethanamide.","hints":["Amide formula C\u003ci>n\u003c/i>H\u003csub>2\u003ci>n\u003c/i>+1\u003c/sub>NO: 73 g/mol means 3 carbons in total.","Share the 3 carbons between the acid and the N-compound.","Keep at least one H on N: avoid the secondary amine as the N-compound."]}],"blocks":[{"title":"What the builder shows","html":"\u003cp>The same molar mass can boil anywhere from 3 °C to 221 °C. What matters is the number of N–H bonds and whether there’s a C=O beside the nitrogen.\u003c/p>"}]},"part3":{"slug":"amides","name":"Amides","heading":"Amides everywhere","intro":"From single molecules to the big molecules of life and materials: the peptide bond in proteins, a preview of nylon, and the groups in real medicines and foods. Structures only: no procedures.","s1":{"title":"Station 1: The peptide bond","intro":"Glycine and alanine are amino acids: each has an amine end (H₂N–) and an acid end (–COOH). Press \u003cstrong>Join\u003c/strong>: the –OH of glycine’s acid and an H of alanine’s amine leave as H₂O, and a –CO–NH– link forms.","zoom":"The amide group is \u003cstrong>planar\u003c/strong>: the C, the O, the N and the atoms bonded to them lie in one plane. Chemists draw it as a resonance pair: C=O with a lone pair on N, and C–O⁻ with C=N⁺. The N’s lone pair is shared with the C=O, so it isn’t free to accept H⁺. That’s why amides are not basic."},"s2":{"title":"Station 2: A nylon preview","intro":"A diacid and a diamine each have \u003cstrong>two\u003c/strong> reactive ends. Press \u003cstrong>Join\u003c/strong> again and again: each join makes one amide link and releases one water.","banner":"Two reactive ends → a chain. You’ll build these in module 08."},"s3":{"title":"Station 3: Groups in real molecules","intro":"Structure only. Tap each part of the formula to find its functional group.","mols":[{"id":"acet","name":"Acetaminophen","use":"a pain reliever","segs":[{"t":"HO–","g":"oh"},{"t":"C₆H₄","g":"ring"},{"t":"–NH–CO–","g":"amide"},{"t":"CH₃","g":""}],"done":"Found them all: an amide (–NH–CO–) and a hydroxyl group on a benzene ring."},{"id":"asp","name":"Aspartame","use":"a sweetener","segs":[{"t":"HOOC–","g":"acid"},{"t":"CH₂–CH(","g":""},{"t":"NH₂","g":"amine"},{"t":")–","g":""},{"t":"CO–NH","g":"amide","n":"amide (peptide) link (–CO–NH–)"},{"t":"–CH(CH₂","g":""},{"t":"C₆H₅","g":"ring"},{"t":")–","g":""},{"t":"COOCH₃","g":"ester"}],"done":"Found them all: an amine, a carboxylic acid, an amide (peptide) link, an ester and a benzene ring."}],"groups":{"oh":"hydroxyl group (–OH)","ring":"benzene ring","amide":"amide group (–NH–CO–)","acid":"carboxylic acid (–COOH)","amine":"amine (–NH₂): primary, with a free lone pair","ester":"ester (–COO–CH₃)"},"backbone":"Carbon backbone: not a functional group."},"data":{"title":"Check it with data: acetaminophen","head":["Property","Acetaminophen","What the structure explains"],"rows":[["State at 25 °C","solid; melts at about 169 °C","The amide N–H, the C=O and the O–H hydrogen-bond between molecules, holding them in a solid."],["Cold water (25 °C)","dissolves only a little: about 14 g/L","The benzene ring is nonpolar, so it limits mixing with water."],["Hot water","dissolves noticeably more","The O–H, N–H and C=O hydrogen-bond with water; heat helps break up the solid."]],"note":"Data: rounded literature values (course table additions)."},"quickCheck":{"title":"Quick check","summary":"Amides everywhere quick check","items":[{"id":"q1","goal":4,"prompt":"Glycine + glycine → dipeptide. What else forms?","choices":[{"t":"nothing","fb":"Condensation: one H₂O per amide link.","_n":"14efa","_k":"c5139a07"},{"t":"CO₂","fb":"Condensation: one H₂O per amide link.","_n":"15eca","_k":"a28dd747"},{"t":"ammonia","fb":"Condensation: one H₂O per amide link.","_n":"16eda","_k":"f458bf4b"},{"t":"water","fb":"Right. Condensation: one H₂O per amide link.","_n":"17f2a","_k":"7e67caca"}]},{"id":"q2","goal":6,"prompt":"How many amide links in a chain of 5 amino acids?","choices":[{"t":"3","fb":"Links join neighbours: 5 units, 4 links.","_n":"18f3a","_k":"417d129b"},{"t":"4","fb":"Right. Links join neighbours: 5 units, 4 links.","_n":"19f0a","_k":"d4f8b05e"},{"t":"5","fb":"Links join neighbours: 5 units, 4 links.","_n":"1af1a","_k":"6574bcac"},{"t":"10","fb":"Links join neighbours: 5 units, 4 links.","_n":"1be6a","_k":"112d9979"}]},{"id":"q3","goal":5,"prompt":"Which group in acetaminophen is basic?","choices":[{"t":"the ring","fb":"The amide N’s lone pair is tied up with the C=O, and rings aren’t bases here.","_n":"1ce7a","_k":"7181164d"},{"t":"the amide N","fb":"The amide N’s lone pair is tied up with the C=O.","_n":"1df4a","_k":"4e76ef20"},{"t":"the OH","fb":"The amide N’s lone pair is tied up with the C=O, and an OH on a ring isn’t a base.","_n":"1ef3a","_k":"a2d72bc6"},{"t":"none","fb":"Right. The amide N’s lone pair is tied up with the C=O, and the OH and the ring aren’t bases.","_n":"1ff6a","_k":"46076813"}]},{"id":"q4","goal":5,"prompt":"A fishy smell comes from an amine. Lemon juice reduces it. Why?","choices":[{"t":"Lemon juice adds hydrogen bonds","fb":"The amine accepts H⁺ from the acid; ions don’t evaporate.","_n":"1gf5a","_k":"eea9c52a"},{"t":"The acid turns the amine into a non-volatile ammonium salt","fb":"Right. The amine accepts H⁺ from the acid; ions don’t evaporate.","_n":"1hf0a","_k":"93fd6fcb"},{"t":"The acid forms an amide at room temperature","fb":"The amine accepts H⁺ from the acid; ions don’t evaporate.","_n":"1iefa","_k":"7563a682"},{"t":"Lemon juice is a base","fb":"The amine accepts H⁺ from the acid; ions don’t evaporate.","_n":"1jf2a","_k":"bb748c18"}]}]}},"practice":{"activities":[{"id":"classify","type":"custom","title":"Classify and name","summary":"Classify and name","goal":[1,2],"instruction":"Ten compounds. Sort each one into its box, then pick its name.","how":"Tap a compound, then tap the box it belongs in. When it’s in the right box, pick its name from the chips below the boxes.","boxes":[{"id":"p","label":"Primary amine"},{"id":"s","label":"Secondary amine"},{"id":"t","label":"Tertiary amine"},{"id":"a","label":"Amide"}],"wrongDefault":"Count the carbon groups on the N, and check for a C=O next to it.","items":[{"id":"i1","t":"CH₃CH₂CH₂NH₂","_a":"E0lD","why":"One carbon group (propyl) on the N: primary.","wrong":{"a":"No C=O next to the N: it’s an amine."},"names":[{"t":"propan-1-amine","why":"Three-carbon chain, NH₂ on C1.","_n":"1kf1a","_k":"08b01a7d"},{"t":"propan-2-amine","why":"The NH₂ is on the end carbon: C1.","_n":"1leca","_k":"2cb0266e"},{"t":"propanamide","why":"No C=O: -amine, not -amide.","_n":"1meba","_k":"85cf4552"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Primary amine: one carbon group (propyl) on N. Name: propan-1-amine."]},{"id":"i2","t":"CH₃CH(NH₂)CH₃","_a":"E0lD","why":"The N has only one carbon on it: primary. The carbon it’s on doesn’t matter.","wrong":{"s":"The N has only one carbon on it: primary. The carbon it’s on doesn’t matter.","t":"The N has only one carbon on it: primary.","a":"No C=O next to the N: it’s an amine."},"names":[{"t":"propan-2-amine","why":"NH₂ on the middle carbon, C2.","_n":"1n629","_k":"d8521487"},{"t":"propan-1-amine","why":"The NH₂ is on the middle carbon, C2.","_n":"1o639","_k":"5b40eb00"},{"t":"N-methylethanamine","why":"Only one carbon group is on N, so there’s no N-prefix.","_n":"1p649","_k":"724b71bc"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Primary amine: one carbon on N (the middle carbon of the chain). Name: propan-2-amine."]},{"id":"i3","t":"CH₃NHCH₂CH₂CH₃","_a":"E0pD","why":"Two carbon groups (methyl and propyl) on the N: secondary.","wrong":{"a":"No C=O next to the N: it’s an amine."},"names":[{"t":"N-methylpropan-1-amine","why":"Propyl is the parent; the methyl on N is an N-prefix.","_n":"1q659","_k":"e219bd83"},{"t":"butan-1-amine","why":"Carbons on the N are N-prefixes. The parent chain is the one with the C=O (amide) or bonded to N (amine).","_n":"1r5e9","_k":"396b24ea"},{"t":"N-propylmethanamine","why":"The parent is the longest carbon group on N: propyl.","_n":"1s5f9","_k":"33864248"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Secondary amine: methyl and propyl on N. Name: N-methylpropan-1-amine."]},{"id":"i4","t":"(CH₃CH₂)₂NH","_a":"E0pD","why":"Two ethyl groups on the N: secondary.","wrong":{"a":"No C=O next to the N: it’s an amine."},"names":[{"t":"N-ethylethanamine","why":"One ethyl is the parent; the other is an N-prefix.","_n":"1t609","_k":"5f1c187f"},{"t":"butan-1-amine","why":"The N isn’t part of a chain: each ethyl is on the N. Carbons on the N are N-prefixes. The parent chain is the one with the C=O (amide) or bonded to N (amine).","_n":"1u619","_k":"020b2158"},{"t":"diethanamine","why":"Name one ethyl as the parent and the other as an N-prefix.","_n":"1v6a9","_k":"def5515f"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Secondary amine: two ethyls on N. Name: N-ethylethanamine."]},{"id":"i5","t":"(CH₃)₂NCH₂CH₃","_a":"E01D","why":"Three carbon groups (two methyls and an ethyl) on the N: tertiary.","wrong":{"a":"No C=O next to the N: it’s an amine."},"names":[{"t":"N,N-dimethylethanamine","why":"Ethyl is the parent; both methyls on N are N-prefixes.","_n":"1w6b9","_k":"ca6519c2"},{"t":"N-methylpropan-1-amine","why":"Count the groups on N: there are three, and none is a propyl.","_n":"1x689","_k":"b6503278"},{"t":"N,N-dimethylmethanamine","why":"The longest group on N is ethyl, so the parent is ethanamine.","_n":"1y679","_k":"3449623e"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Tertiary amine: two methyls and an ethyl on N. Name: N,N-dimethylethanamine."]},{"id":"i6","t":"CH₃CH₂CONH₂","_a":"E1hD","why":"A C=O is bonded to the N: an amide.","wrong":{"p":"There’s a C=O next to the N: that makes it an amide.","s":"There’s a C=O next to the N: that makes it an amide.","t":"There’s a C=O next to the N: that makes it an amide."},"names":[{"t":"propanamide","why":"Three carbons including the C=O carbon, -amide.","_n":"1z669","_k":"a8251de7"},{"t":"propan-1-amine","why":"There’s a C=O on the N’s carbon: -amide.","_n":"20659","_k":"709850d8"},{"t":"ethanamide","why":"Count the C=O carbon: three carbons in all.","_n":"21649","_k":"819dba84"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Amide: C=O next to N. Name: propanamide."]},{"id":"i7","t":"CH₃CONHCH₂CH₃","_a":"E1hD","why":"A C=O is bonded to the N: an amide.","wrong":{"p":"There’s a C=O next to the N: that makes it an amide.","s":"There’s a C=O next to the N: that makes it an amide.","t":"There’s a C=O next to the N: that makes it an amide."},"names":[{"t":"N-ethylethanamide","why":"Ethanoyl parent (with the C=O); the ethyl on N is an N-prefix.","_n":"22639","_k":"325d956f"},{"t":"butanamide","why":"The N-ethyl carbons aren’t in the chain.","_n":"23629","_k":"d0cdf030"},{"t":"N-ethylethanamine","why":"There’s a C=O next to N: -amide.","_n":"24619","_k":"c2289820"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Amide: C=O next to N, ethyl on N. Name: N-ethylethanamide."]},{"id":"i8","t":"HCON(CH₃)₂","_a":"E1hD","why":"A C=O is bonded to the N: an amide.","wrong":{"p":"There’s a C=O next to the N: that makes it an amide.","s":"There’s a C=O next to the N: that makes it an amide.","t":"There’s a C=O next to the N: that makes it an amide."},"names":[{"t":"N,N-dimethylmethanamide","why":"Methanoyl parent (HCO–); both methyls on N are N-prefixes.","_n":"25709","_k":"078be9d4"},{"t":"propanamide","why":"The methyls on N are N-prefixes, not part of the chain.","_n":"266f9","_k":"9bd2c621"},{"t":"N-methylethanamide","why":"Both methyls are on N: N,N-dimethyl, and the parent has only the C=O carbon.","_n":"27e68","_k":"7a26db02"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Amide: HCO– on N with two methyls. Name: N,N-dimethylmethanamide."]},{"id":"i9","t":"CH₃CH₂CH₂CH₂NH₂","_a":"E0lD","why":"One carbon group (butyl) on the N: primary.","wrong":{"a":"No C=O next to the N: it’s an amine."},"names":[{"t":"butan-1-amine","why":"Four-carbon chain, NH₂ on C1.","_n":"28e78","_k":"5f7f11b7"},{"t":"butanamide","why":"No C=O: -amine.","_n":"29e48","_k":"c203b44a"},{"t":"butan-2-amine","why":"The NH₂ is on the end carbon: C1.","_n":"2ae58","_k":"f0d5c0b3"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Primary amine: one carbon group on N. Name: butan-1-amine."]},{"id":"i10","t":"C₆H₅NH₂","_a":"E0lD","why":"One carbon group (the benzene ring) on the N: primary.","wrong":{"a":"No C=O next to the N: it’s an amine."},"names":[{"t":"aniline (phenylamine; benzenamine)","why":"An NH₂ on a benzene ring.","_n":"2be28","_k":"a6f414cc"},{"t":"benzamide","why":"No C=O: it’s an amine.","_n":"2ce38","_k":"f9c54843"},{"t":"cyclohexanamine","why":"A benzene ring (C₆H₅), not a cyclohexane ring (C₆H₁₁).","_n":"2de08","_k":"87223b6f"}],"hints":["Is there a C=O bonded to the N’s carbon?","Count carbon groups on N.","Primary amine: one carbon group (a benzene ring) on N. Name: aniline (phenylamine; benzenamine)."]}]},{"id":"puzzles","type":"custom","title":"Property puzzles","summary":"Property puzzles","star":true,"goal":[3,5],"instruction":"Six items: order four compounds or choose one of four. Items 3 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"To order, tap the compounds from lowest to highest boiling point. To choose, tap an answer. Then press Check.","items":[{"id":"r1","kind":"order","goal":3,"prompt":"Order by boiling point, lowest first: butane, propan-1-amine, propan-1-ol, ethanamide.","tiles":["propan-1-ol","ethanamide","butane","propan-1-amine"],"_a":"agtNCh9UHwhs","wrong":[{"before":[0,3],"fb":"Amine above alcohol: O (3.44) is more electronegative than N (3.04), so O–H···O bonds are stronger than N–H···N bonds."}],"general":"Rank by the forces between molecules: London only, then N–H hydrogen bonds, then stronger O–H hydrogen bonds, then an amide’s N–H and very polar C=O.","why":"butane (London forces only) \u003c propan-1-amine (N–H) \u003c propan-1-ol (O–H) \u003c ethanamide (two N–H and a very polar C=O).","hints":["Which has no hydrogen bonding at all?","N–H hydrogen bonds are weaker than O–H ones; amides boil highest.","butane \u003c propan-1-amine \u003c propan-1-ol \u003c ethanamide."]},{"id":"r2","kind":"pick","goal":3,"prompt":"Which dissolves best in water: N,N-dimethylmethanamine, hexane, octan-1-amine, decane?","options":[{"t":"hexane","why":"Nonpolar: it can’t hydrogen-bond with water.","_n":"2ee18","_k":"a962f7db"},{"t":"decane","why":"Nonpolar: it can’t hydrogen-bond with water.","_n":"2fee8","_k":"b21b9ff4"},{"t":"N,N-dimethylmethanamine","why":"Small amines accept hydrogen bonds from water through the lone pair, even with no N–H.","_n":"2gef8","_k":"058857d5"},{"t":"octan-1-amine","why":"Small amines accept hydrogen bonds from water through the lone pair, even with no N–H. Octan-1-amine’s long nonpolar chain outweighs its NH₂.","_n":"2hec8","_k":"93f6bb70"}],"hints":["Which molecules can hydrogen-bond with water?","Water’s O–H can bond to an N lone pair, and a short chain helps.","N,N-dimethylmethanamine."]},{"id":"r3","kind":"pick","star":true,"goal":3,"prompt":"\u003cstrong>Investigation:\u003c/strong> A student wants to test whether N–H bonds raise boiling points. Which set is a fair test?","options":[{"t":"ethanamine and ethanamide","why":"The C=O is a second change, and the masses differ (45 and 59 g/mol).","_n":"2ieb8","_k":"64f35f6c"},{"t":"propan-1-amine, propan-1-ol, butane (similar masses)","why":"That changes the kind of atom (N, O or none), not just the number of N–H bonds.","_n":"2jee8","_k":"35e7b9f0"},{"t":"propan-1-amine, N-methylethanamine, N,N-dimethylmethanamine (all 59 g/mol)","why":"Same molar mass, so London forces are controlled; only the number of N–H bonds (2, 1, 0) changes.","_n":"2ked8","_k":"d19acaef"},{"t":"methanamine (31 g/mol), N-methylmethanamine (45 g/mol), N,N-dimethylethanamine (73 g/mol)","why":"Molar mass changes London forces too; keep it the same.","_n":"2lf08","_k":"c2909372"}],"hints":["What else affects boiling point besides hydrogen bonding?","Molar mass changes London forces: keep it fixed.","Three C₃H₉N isomers with 2, 1 and 0 N–H bonds."]},{"id":"r4","kind":"order","star":true,"goal":3,"prompt":"Order by boiling point, lowest first: three amides of 73 g/mol, N,N-dimethylmethanamide, N-methylethanamide and propanamide.","tiles":["propanamide","N,N-dimethylmethanamide","N-methylethanamide"],"_a":"aghNCx9Ubg==","general":"Fewer N–H bonds, fewer hydrogen bonds per molecule.","why":"N,N-dimethylmethanamide (153 °C, no N–H) \u003c N-methylethanamide (206 °C, one N–H) \u003c propanamide (213 °C, two N–H).","hints":["Count the N–H bonds in each amide.","0, 1 and 2 N–H bonds.","N,N-dimethylmethanamide \u003c N-methylethanamide \u003c propanamide."]},{"id":"r5","kind":"pick","star":true,"goal":3,"prompt":"Two bottles are labelled only ‘C₃H₉N’. One boils at 3 °C, the other at 48 °C. Which is which, and could a third bottle with C₃H₉N boil at about 33–37 °C?","options":[{"t":"Either bottle could be either compound: isomers boil at the same temperature","why":"Isomers differ in N–H count and shape.","_n":"2mef8","_k":"0064c514"},{"t":"3 °C: propan-1-amine; 48 °C: N,N-dimethylmethanamine. No third isomer","why":"Isomers differ in N–H count and shape. The tertiary amine, with no N–H, boils lowest.","_n":"2nf28","_k":"c84297d2"},{"t":"3 °C: N,N-dimethylmethanamine; 48 °C: propan-1-amine. Yes: N-methylethanamine (36 °C), or propan-2-amine (32 °C)","why":"The tertiary amine has no N–H; propan-1-amine has two. The secondary amine, and the branched primary amine, boil in between.","_n":"2of18","_k":"30e466c7"},{"t":"3 °C: N,N-dimethylmethanamine; 48 °C: propan-1-amine. No: there are only two C₃H₉N isomers","why":"Isomers differ in N–H count and shape. C₃H₉N has four amine isomers: two primary, one secondary, one tertiary.","_n":"2pe48","_k":"fac2422f"}],"hints":["C₃H₉N isomers: primary, secondary, tertiary.","Tertiary can’t hydrogen-bond; primary has two N–H.","3 °C tertiary; 48 °C primary; the secondary is in between."]},{"id":"r6","kind":"pick","star":true,"goal":5,"fixedOrder":true,"prompt":"Which mixture’s smell fades most: an amine spill wiped with (a) water, (b) vinegar, (c) baking-soda solution, (d) oil?","options":[{"t":"(a) water","why":"Some amine dissolves, but no salt forms, so the rest still evaporates.","_n":"2qe38","_k":"ce453b05"},{"t":"(b) vinegar","why":"Ethanoic acid protonates the amine to an ammonium salt; ions don’t evaporate.","_n":"2r071","_k":"6cde4369"},{"t":"(c) baking-soda solution","why":"Baking soda is basic and can’t.","_n":"2s061","_k":"bceecf4e"},{"t":"(d) oil","why":"The amine stays a neutral molecule and still evaporates.","_n":"2t051","_k":"717737ea"}],"hints":["Which household liquid is an acid?","An amine + acid → ammonium salt.","Vinegar."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Cameron","how":"","instruction":"Cameron made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Name CH₃CH₂CONHCH₃.","steps":["It has C=O next to N, so it’s an amide.","The longest chain through N has 4 carbons, so the parent is butanamide.","There are no other groups.","Name: butanamide."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier.","The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"The N’s carbons aren’t part of the parent chain. Carbons on the N are N-prefixes. The parent chain is the one with the C=O (amide) or bonded to N (amine).","_n":"2u041","_k":"6c585062"},{"t":"N-propylmethanamide.","why":"The C=O is on the 3-carbon side.","_n":"2v0b1","_k":"acccd133"},{"t":"Methyl propanamide (no N).","why":"The N- shows where the methyl sits.","_n":"2w0a1","_k":"d655b1e5"},{"t":"The parent chain contains the C=O carbon (3 carbons: propanamide); the CH₃ on N is a prefix: N-methylpropanamide.","why":"Carbons on the N are N-prefixes. The parent chain is the one with the C=O (amide) or bonded to N (amine).","_n":"2x091","_k":"4f72593d"}],"hints":["Which carbons are attached to the C=O carbon’s side?","Three: the propanoyl part.","N-methylpropanamide."]},{"id":"e2","goal":4,"task":"Write the condensation of ethanoic acid with ethanamine.","steps":["CH₃COOH + CH₃CH₂NH₂ →","The acid’s –OH and one H from the amine’s NH₂ leave.","They form H₂O.","The product is CH₃COOCH₂CH₃.","So the products are ethyl ethanoate and water."],"_a":"Ag==","stepFb":["Correct reactants.","Step 2 is correct.","Step 3 is correct.","","Follows step 4. The mistake is earlier."],"fixes":[{"t":"CH₃CONH₂ + CH₃CH₂OH.","why":"No alcohol forms; the ethyl stays on N.","_n":"2y081","_k":"fcc33bb2"},{"t":"CH₃CH₂NHCH₃.","why":"The C=O must stay.","_n":"2z0f1","_k":"f57a114b"},{"t":"Step 4 is correct.","why":"An ester would need an alcohol, not an amine. An acid + \u003cstrong>alcohol\u003c/strong> gives an ester; an acid + \u003cstrong>amine\u003c/strong> gives an amide. Both release water.","_n":"300e1","_k":"a09a3295"},{"t":"The new bond is C–N: CH₃CONHCH₂CH₃, N-ethylethanamide.","why":"The amine’s N bonds to the acid’s carbon, so an amide forms. An acid + \u003cstrong>alcohol\u003c/strong> gives an ester; an acid + \u003cstrong>amine\u003c/strong> gives an amide. Both release water.","_n":"31011","_k":"e3fe3477"}],"hints":["Which atom bonds to the acid’s carbon?","The amine’s N.","CH₃CONHCH₂CH₃."]},{"id":"e3","goal":5,"task":"Predict which solution is more basic: 0.1 mol/L methanamine or 0.1 mol/L ethanamide.","steps":["Both compounds contain a nitrogen with a lone pair.","A lone pair that’s free can accept H⁺.","Both lone pairs are free, so both are bases of similar strength.","The solutions will have about the same pH."],"_a":"Aw==","stepFb":["True as written.","Correct.","","Follows step 3."],"fixes":[{"t":"Neither is basic; only OH⁻ compounds are bases.","why":"That’s Arrhenius thinking. A Brønsted–Lowry base accepts H⁺, and methanamine’s free lone pair does.","_n":"32021","_k":"6ad38c6c"},{"t":"In ethanamide the lone pair is drawn toward the C=O, so it isn’t free; methanamine is basic and ethanamide is about neutral.","why":"In an amide, the N’s lone pair is pulled toward the C=O, so it isn’t free to accept H⁺.","_n":"33031","_k":"1b0d6ee7"},{"t":"Ethanamide is more basic because it’s heavier.","why":"Mass doesn’t make a base: a free lone pair does, and ethanamide’s isn’t free.","_n":"34041","_k":"9aeb633c"},{"t":"Step 3 is correct.","why":"In an amide, the N’s lone pair is pulled toward the C=O, so it isn’t free to accept H⁺.","_n":"35051","_k":"bd7ee9a4"}],"hints":["What is next to the N in an amide?","A C=O, which pulls electron density.","Methanamine is the base."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result in the builder surprised you most: the tertiary amine boiling at 3 °C, or ethanamide boiling at 221 °C? Why?"},{"id":"j2","q":"In your own words, explain why amines are classified by the nitrogen, not by the carbon."},{"id":"j3","q":"Explain to a friend how to tell an amine from an amide in a big molecule like aspartame."},{"id":"j4","q":"Which part of naming amides still feels shaky? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a secondary amine?","options":[{"t":"CH₃CH₂NHCH₃","why":"Two carbon groups on N.","_n":"36061","_k":"ad3e641f"},{"t":"CH₃CH₂CH₂NH₂","why":"One carbon group on N: primary.","_n":"37071","_k":"4ed2b274"},{"t":"(CH₃)₃N","why":"Three carbon groups: tertiary.","_n":"38081","_k":"b7fca90c"},{"t":"CH₃CONHCH₃","why":"C=O next to N: an amide.","_n":"39091","_k":"6b4569c4"}]},"b":{"prompt":"Which is a tertiary amine?","options":[{"t":"(CH₃)₂NCH₂CH₃","why":"Three carbon groups on N.","_n":"3a0a1","_k":"03337f57"},{"t":"(CH₃)₃CNH₂","why":"One carbon on N: primary, even though that carbon is tertiary.","_n":"3b932","_k":"e69d22fb"},{"t":"CH₃NHCH₂CH₃","why":"Two: secondary.","_n":"3c922","_k":"7b3da51f"},{"t":"CH₃CON(CH₃)₂","why":"An amide, not an amine.","_n":"3d952","_k":"61b97ae7"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is the IUPAC name of CH₃CH₂CH₂NH₂?","options":[{"t":"propanamide","why":"No C=O: amine, not amide.","_n":"3e942","_k":"761ccb03"},{"t":"propan-2-amine","why":"The NH₂ is on the end carbon.","_n":"3f972","_k":"88059783"},{"t":"propan-1-amine","why":"Three-carbon chain, NH₂ on C1.","_n":"3g962","_k":"6cfe4d7c"},{"t":"N-methylethanamine","why":"That’s CH₃CH₂NHCH₃.","_n":"3h992","_k":"3c3a31a7"}]},"b":{"prompt":"What is the IUPAC name of CH₃CONHCH₃?","options":[{"t":"N-methylethanamine","why":"There’s a C=O: amide.","_n":"3i982","_k":"a68a17eb"},{"t":"propanamide","why":"The N’s methyl isn’t part of the chain.","_n":"3j8b2","_k":"6fff894d"},{"t":"N-methylethanamide","why":"Ethanoyl parent; methyl on N.","_n":"3k8a2","_k":"1b54ecf4"},{"t":"methyl ethanamide","why":"The locant N- is needed to show the methyl is on nitrogen.","_n":"3l8d1","_k":"44a5850c"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Ethanoic acid condenses with methanamine. What are the products?","options":[{"t":"N-methylethanamide and water","why":"C–N bond forms; H₂O leaves.","_n":"3m8e1","_k":"e839d687"},{"t":"ethanamide and methanol","why":"The methyl stays on the N.","_n":"3n8b1","_k":"e1101e88"},{"t":"N-methylethanamine and oxygen","why":"The C=O stays; no O₂ forms.","_n":"3o8c1","_k":"728af230"},{"t":"methyl ethanoate and ammonia","why":"That would need methanol.","_n":"3p891","_k":"066d39f9"}]},"b":{"prompt":"Propanoic acid condenses with ammonia. What are the products?","options":[{"t":"propanamide and water","why":"CH₃CH₂CONH₂ + H₂O.","_n":"3q8a1","_k":"1232008f"},{"t":"ethyl methanoate and ammonia","why":"An acid + \u003cstrong>alcohol\u003c/strong> gives an ester; an acid + \u003cstrong>amine\u003c/strong> gives an amide. Both release water.","_n":"3r871","_k":"22dbc19d"},{"t":"propan-1-amine and water","why":"The C=O stays: an amide.","_n":"3s881","_k":"0e40e157"},{"t":"propanamide and hydrogen","why":"The small molecule is H₂O.","_n":"3t951","_k":"7346fd3a"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Rank from lowest to highest boiling point: propan-1-amine, ethanamide, N,N-dimethylmethanamine, N-methylethanamine (all 59 g/mol).","options":[{"t":"propan-1-amine \u003c N-methylethanamine \u003c N,N-dimethylmethanamine \u003c ethanamide","why":"More carbon groups don’t add London forces at equal mass; they remove N–H.","_n":"3u961","_k":"9651e330"},{"t":"They’re all about equal","why":"Same mass, very different forces.","_n":"3v9f2","_k":"04c14db6"},{"t":"N,N-dimethylmethanamine \u003c N-methylethanamine \u003c propan-1-amine \u003c ethanamide","why":"0, 1, 2 N–H, then the very polar amide.","_n":"3w9e2","_k":"0aff1b1b"},{"t":"N,N-dimethylmethanamine \u003c ethanamide \u003c N-methylethanamine \u003c propan-1-amine","why":"Amides boil far higher than amines.","_n":"3x9d2","_k":"39fb23ce"}]},"b":{"prompt":"Rank from lowest to highest boiling point: ethanol, N-methylmethanamine, methanamide, ethanamine (about 45 g/mol).","options":[{"t":"N-methylmethanamine \u003c ethanamine \u003c ethanol \u003c methanamide","why":"One N–H, then two N–H, then the stronger O–H, then the amide’s N–H and very polar C=O.","_n":"3y9c2","_k":"deefaa9f"},{"t":"ethanamine \u003c N-methylmethanamine \u003c ethanol \u003c methanamide","why":"Fewer N–H bonds mean fewer hydrogen bonds: N-methylmethanamine (one N–H) boils below ethanamine (two).","_n":"3z9b2","_k":"4b7fd776"},{"t":"methanamide \u003c ethanol \u003c ethanamine \u003c N-methylmethanamine","why":"Reversed.","_n":"409a2","_k":"cfa1ea1e"},{"t":"N-methylmethanamine \u003c ethanol \u003c ethanamine \u003c methanamide","why":"O–H beats N–H.","_n":"41992","_k":"7d328f9f"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Fish smells fishy because of N,N-dimethylmethanamine. Why does squeezing lemon on fish reduce the smell?","options":[{"t":"Lemon juice is a base that neutralizes the amine","why":"Lemon juice is acidic.","_n":"42982","_k":"f5fbb725"},{"t":"The acid and amine form an amide at room temperature","why":"A tertiary amine has no N–H to lose, and amides need heating.","_n":"43972","_k":"670e3daf"},{"t":"The lemon adds hydrogen bonds that trap the smell","why":"The key change is a proton transfer.","_n":"44962","_k":"dae39e81"},{"t":"Citric acid gives H⁺ to the amine, forming an ammonium salt, which is ionic and doesn’t evaporate","why":"The amine’s free lone pair accepts H⁺; the ions stay put.","_n":"45992","_k":"1520d6f8"}]},"b":{"prompt":"Which 0.10 mol/L solution has the higher pH?","options":[{"t":"Both are acidic","why":"Amines are bases.","_n":"469a2","_k":"f659a024"},{"t":"Both are 7: neither has OH⁻","why":"Methanamine makes OH⁻ by taking H⁺ from water.","_n":"479b2","_k":"7ad2fdda"},{"t":"Methanamide, because it contains N","why":"In an amide, the N’s lone pair is pulled toward the C=O, so it isn’t free to accept H⁺.","_n":"489c2","_k":"d05c6b2c"},{"t":"Methanamine, because its free lone pair accepts H⁺ from water","why":"Taking H⁺ from water leaves OH⁻, so the pH rises above 7.","_n":"49952","_k":"f21bf6b8"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"N-ethylpropanamide is hydrolysed. What are the products?","options":[{"t":"ethyl propanoate and ammonia","why":"Hydrolysis adds water; it doesn’t make an ester.","_n":"4a962","_k":"0b65ae8c"},{"t":"propanoic acid and ethanamine","why":"C–N breaks: the C=O side becomes the acid.","_n":"4b972","_k":"c51e3c01"},{"t":"propan-1-ol and ethanamide","why":"The C=O side becomes a carboxylic acid.","_n":"4c982","_k":"0b60e51c"},{"t":"propan-1-amine and ethanoic acid","why":"The C=O is on the 3-carbon side. Hydrolysis breaks the C–N bond: the C=O side becomes the acid, the N side becomes the amine.","_n":"4d912","_k":"bcc0f2da"}]},"b":{"prompt":"N-methylbutanamide is hydrolysed. What are the products?","options":[{"t":"methyl butanoate and ammonia","why":"Hydrolysis adds water; it doesn’t make an ester.","_n":"4e922","_k":"1445e0fc"},{"t":"butan-1-amine and methanoic acid","why":"Hydrolysis breaks the C–N bond: the C=O side becomes the acid, the N side becomes the amine.","_n":"4f0b2","_k":"65b7648c"},{"t":"butanoic acid and methanamine","why":"C–N breaks: the 4-carbon C=O side becomes butanoic acid; the N side becomes methanamine.","_n":"4g0a2","_k":"49162651"},{"t":"butan-1-ol and methanamide","why":"The C=O side becomes a carboxylic acid.","_n":"4h0d2","_k":"daa57214"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Propan-1-amine (48 °C) boils higher than N,N-dimethylmethanamine (3 °C), though both are 59 g/mol. Which is the best explanation?","options":[{"t":"“The tertiary amine has no lone pair.”","why":"It does; it lacks an N–H.","_n":"4i0c2","_k":"5c485d4a"},{"t":"“Propan-1-amine has N–H bonds, so its molecules hydrogen-bond to each other; the tertiary amine has no N–H, so only weaker dipole and London forces act.”","why":"Same mass: the N–H, and the hydrogen bonds it allows, make the difference.","_n":"4j072","_k":"54bfa8f6"},{"t":"“The tertiary amine is branched, so it has more London forces.”","why":"Branching lowers London forces, and it’s not the main effect here.","_n":"4k062","_k":"492cb121"},{"t":"“Propan-1-amine has more electrons.”","why":"Same formula, same electrons.","_n":"4l092","_k":"798c2fe1"}]},"b":{"prompt":"Ethanol (78 °C) boils higher than ethanamine (17 °C). Which is the best explanation?","options":[{"t":"“Ethanamine can’t hydrogen-bond.”","why":"It has N–H; its hydrogen bonds are weaker.","_n":"4m082","_k":"1e46d869"},{"t":"“O (3.44) is more electronegative than N (3.04), so ethanol’s O–H bonds are more polar and its hydrogen bonds are stronger.”","why":"Both hydrogen-bond; the more polar O–H makes stronger hydrogen bonds.","_n":"4n132","_k":"0a5ec711"},{"t":"“N has two lone pairs, which repel.”","why":"N has one lone pair in an amine.","_n":"4o122","_k":"0b0a17fa"},{"t":"“Ethanol is much heavier.”","why":"46 vs 45 g/mol.","_n":"4p052","_k":"467459d1"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Acetaminophen is HO–C₆H₄–NH–CO–CH₃. Which description of its functional groups is correct?","options":[{"t":"A carboxylic acid and an amine","why":"No –COOH.","_n":"4q062","_k":"5e7128fb"},{"t":"An ester and an amine","why":"No –COO–.","_n":"4r032","_k":"059c7d45"},{"t":"An amine and a ketone","why":"The N and C=O are bonded: together they’re an amide.","_n":"4s042","_k":"f29ca96b"},{"t":"An amide (–NH–CO–) and a hydroxyl group on a benzene ring","why":"The N bonded to the C=O makes an amide; the OH sits on the ring.","_n":"4t092","_k":"b851ce76"}]},"b":{"prompt":"Which describes the link between two amino acids in a dipeptide?","options":[{"t":"An amide (peptide) bond made by condensation, releasing one water","why":"The acid end of one amino acid and the amine end of the next join; one H₂O leaves.","_n":"4u0a2","_k":"f06c7e37"},{"t":"An ester bond","why":"N, not O, bonds to the C=O.","_n":"4v072","_k":"b362fd65"},{"t":"An ionic bond between –NH₃⁺ and –COO⁻","why":"The link is covalent.","_n":"4w082","_k":"f65adc93"},{"t":"An amine bond made by addition","why":"Water is lost: condensation.","_n":"4x0d2","_k":"f3b05344"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A small amine spills in a lab storeroom, leaving a fishy smell. Which household liquid would best reduce the smell, and why?","options":[{"t":"Cooking oil: it dissolves the amine","why":"The amine would still evaporate.","_n":"4y0e2","_k":"3dd5c57c"},{"t":"Vinegar: ethanoic acid converts the amine to a non-volatile ammonium salt","why":"The amine accepts H⁺ from the acid; ions don’t evaporate.","_n":"4z972","_k":"b7b5cf59"},{"t":"Salt water: the ions trap the smell","why":"No proton transfer happens.","_n":"50962","_k":"c90f36b6"},{"t":"Baking-soda solution: it neutralizes the amine","why":"Baking soda is a base too.","_n":"51952","_k":"ac0d96e8"}]},"b":{"prompt":"An amine-based cleaning residue makes a surface slightly basic. Which rinse best neutralizes it, and why?","options":[{"t":"Dilute ethanoic acid: it donates H⁺ to the amine, forming an ammonium salt","why":"An acid neutralizes a base: the amine is protonated.","_n":"52942","_k":"171cc12d"},{"t":"Dilute ammonia: it dilutes the residue","why":"Ammonia is also basic.","_n":"539b2","_k":"f05b59e5"},{"t":"Hot water only: heat breaks the amine","why":"No proton transfer.","_n":"549a2","_k":"24338159"},{"t":"Ethanol: it hydrogen-bonds the amine","why":"No neutralization.","_n":"55992","_k":"f6c4d320"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Aspartame, a sweetener, is HOOC–CH₂–CH(NH₂)–CO–NH–CH(CH₂C₆H₅)–COOCH₃. Which list of groups is complete and correct?","options":[{"t":"carboxylic acid, amine, amide, ester, benzene ring","why":"–COOH, –NH₂, –CO–NH–, –COOCH₃ and C₆H₅: five groups.","_n":"56982","_k":"b0c47635"},{"t":"amine, amide, aldehyde, benzene ring","why":"There’s no –CHO.","_n":"578f2","_k":"8426d99e"},{"t":"two carboxylic acids, amine, amide","why":"–COOCH₃ has no O–H: it’s an ester.","_n":"588e2","_k":"922a2342"},{"t":"carboxylic acid, amine, ketone, ether, benzene ring","why":"–CO–NH– is an amide; –COOCH₃ is an ester.","_n":"59112","_k":"73476284"}]},"b":{"prompt":"A local anaesthetic contains an amide group and a separate tertiary amine group (–N(CH₂CH₃)₂). Which part lets it accept H⁺?","options":[{"t":"The amide C=O oxygen only","why":"The free amine lone pair is the basic site.","_n":"5a122","_k":"ffeca443"},{"t":"The tertiary amine nitrogen","why":"Its lone pair is free.","_n":"5b132","_k":"8e672806"},{"t":"The benzene ring","why":"Rings aren’t bases here.","_n":"5c142","_k":"1626bf6b"},{"t":"The amide nitrogen","why":"In an amide, the N’s lone pair is pulled toward the C=O, so it isn’t free to accept H⁺.","_n":"5d152","_k":"0a8927d5"}]}}]},"task":{"title":"Design an amide","summary":"Design an amide","statement":"\u003cp>Choose a carboxylic acid and an amine (or ammonia) to make an amide that meets every condition. Then name it. Can you find all the answers?\u003c/p>\u003col class=\"am-conds\">\u003cli>Its molecules can hydrogen-bond to each other.\u003c/li>\u003cli>It has exactly 4 carbon atoms.\u003c/li>\u003cli>Its nitrogen carries at least one carbon group.\u003c/li>\u003cli>Its name is entered correctly.\u003c/li>\u003c/ol>","checks":["Can hydrogen-bond to itself","Exactly 4 carbons","A carbon group on N","Named correctly"],"tips":["A secondary amine leaves no H on the amide’s N.","Add the carbons of both reactants.","Ammonia gives an unsubstituted amide (–CONH₂).","Parent from the acid; N-prefix from the amine’s carbons."],"explainPrompt":"Explain how you chose the two reactants and why your amide can hydrogen-bond.","vocab":"Use the words condensation, amide, N–H bond and hydrogen bonding.","more":"There are three answers. Can you find them all?","after3":"You’ve found all three. Each answer splits 4 carbons between the acid side and the N side. Butanoic acid + ammonia gives butanamide: 4 carbons and N–H, but no carbon on N."},"cards":[["Amine","Ammonia with H’s replaced by carbon groups: R–NH₂, R₂NH, R₃N."],["Primary / secondary / tertiary amine","1, 2 or 3 carbon groups on the \u003cstrong>nitrogen\u003c/strong>."],["Amide","R–CO–NR′R″: a C=O bonded to N."],["Naming amines","Parent + -amine (propan-1-amine); extra N-groups as N- prefixes (N-methylethanamine)."],["Naming amides","Parent from the acid + -amide (ethanamide); N-groups as N- prefixes (N,N-dimethylethanamide)."],["Amines as bases","The N lone pair accepts H⁺: RNH₂ + H₂O ⇌ RNH₃⁺ + OH⁻."],["Amides aren’t basic","The N lone pair is pulled toward the C=O."],["Hydrogen bonding in amines","Needs an N–H: primary and secondary
