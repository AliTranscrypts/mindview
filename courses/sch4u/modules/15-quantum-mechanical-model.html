*{transition:none!important;animation:none!important}
}

:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;

}

/* SCH4U 15: hero storyboard, Orbital viewer (orbital / ring / find modes), Part 3 stations, practice sorter, task */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:2.2em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}

.rg.chips button.qm-grey[aria-checked="true"]{background:var(--paper);border-color:var(--ink-2);color:var(--ink-2)}

.qm-hxcell{border:1.5px dashed var(--rule);border-radius:6px;padding:.15em .55em;color:var(--ink-2);white-space:nowrap}
.qm-hxcell.on{border:1.5px solid var(--pen);color:var(--ink);font-weight:700;background:var(--hi-soft)}

.qm-sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}

topic","group":"4"},{"nn":"36","slug":"keq","title":"Quantitative Equilibrium (Keq)","kind":"topic","group":"4"},{"nn":"37","slug":"ksp","title":"Solubility Equilibrium (Ksp)","kind":"topic","group":"4"},{"nn":"38","slug":"acids-and-bases","title":"Acids and Bases","kind":"topic","group":"4"},{"nn":"39","slug":"ph-strong-acids-bases","title":"pH of Strong Acids and Bases","kind":"topic","group":"4"},{"nn":"40","slug":"ka-and-kb","title":"Ka and Kb Calculations","kind":"topic","group":"4"},{"nn":"41","slug":"hydrolysis-of-salts","title":"Hydrolysis of Salts","kind":"topic","group":"4"},{"nn":"42","slug":"strong-titration","title":"Strong Acid/Base Titration","kind":"topic","group":"4"},{"nn":"43","slug":"weak-titration","title":"Weak Acid/Base Titration","kind":"topic","group":"4"},{"nn":"44","slug":"buffer-solutions","title":"Buffer Solutions","kind":"topic","group":"4"},{"nn":"45","slug":"oxidation-numbers","title":"Assigning Oxidation Numbers","kind":"topic","group":"5"},{"nn":"46","slug":"balancing-redox","title":"Balancing Redox Reactions (Half-Reaction Method)","kind":"topic","group":"5"},{"nn":"47","slug":"galvanic-cells","title":"Galvanic Cells and Standard Reduction Potentials","kind":"topic","group":"5"},{"nn":"48","slug":"cell-notation","title":"Cell Notation (Voltaic Cells)","kind":"topic","group":"5"},{"nn":"49","slug":"corrosion","title":"Corrosion","kind":"topic","group":"5"},{"nn":"50","slug":"faraday-first-law","title":"Faraday's First Law of Electrolysis","kind":"topic","group":"5"},{"nn":"51","slug":"faraday-second-law","title":"Faraday's Second Law of Electrolysis","kind":"topic","group":"5"},{"nn":"52","slug":"hall-heroult","title":"The Hall–Héroult Process","kind":"topic","group":"5"}]},"salt":"365ebc37","content":{"id":"15-quantum-mechanical-model","kind":"topic","title":"Quantum mechanical model","topic":"Quantum Mechanical Model","readyTopic":"the quantum mechanical model","hero":{"headline":"Not orbits: clouds with addresses","text":"Electrons act like \u003cstrong>waves\u003c/strong>, so we can’t track their paths. Instead, the quantum mechanical model gives each electron an \u003cstrong>orbital\u003c/strong>: a region where it’s likely to be. Four \u003cstrong>quantum numbers\u003c/strong> work like an address: shell, shape, direction and spin. No two electrons in an atom share the same address.","fig":{"html":"\u003cdiv class=\"qm-hx\">\u003ccanvas class=\"qm-hxc\" id=\"qm-hxc\" role=\"img\" aria-label=\"A dot races around a Bohr circle. The dot blurs and the circle dissolves into a fuzzy, spherical 1s cloud of dots, densest near the nucleus. Beside it, a sphere morphs into a dumbbell-shaped 2p orbital with blue and orange lobes, and an address strip fills in: n = 2, l = 1, m sub l = 0, m sub s = +½.\">\u003c/canvas>\u003cp class=\"qm-hxaddr\" id=\"qm-hxaddr\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"qm-hxrow\">\u003cp class=\"qm-hxctr\" id=\"qm-hxctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"qm-hxreplay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can explain why the quantum mechanical model replaced fixed orbits, and what an orbital is.","I can state the allowed values of `n`, `l`, `m_l` and `m_s` and decide whether a set is allowed.","I can count orbitals and electrons in sublevels and shells (`2l + 1`, `n^2`, `2n^2`).","I can describe the shapes and sizes of s, p and d orbitals.","I can describe a Canadian contribution and apply the model to unfamiliar cases."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Bohr energy levels","goal":1,"prompt":"Bohr’s model explained hydrogen’s spectrum. What could it \u003cstrong>not\u003c/strong> explain?","options":[{"t":"The spectra of atoms with more than one electron","why":"It worked for hydrogen’s one electron but failed for atoms with more.","_n":"0969","_k":"c24f7800"},{"t":"Why falls to `n = 1` give UV","why":"It explained that too.","_n":"1959","_k":"e9369af9"},{"t":"Why hydrogen has lines at all","why":"It explained that.","_n":"2949","_k":"16dcfb27"},{"t":"The existence of the nucleus","why":"That came from Rutherford.","_n":"39b9","_k":"476322b4"}],"hints":["Bohr’s model was built for one atom.","Hydrogen has one electron.","Many-electron atoms."]},{"id":"w2","skill":"Bohr energy levels","goal":3,"prompt":"In Bohr–Rutherford diagrams from Grade 11, how many electrons fit in the first shell?","options":[{"t":"1","why":"Helium has two in the first shell.","_n":"49a9","_k":"5dffef28"},{"t":"2","why":"Helium’s two electrons fill the first shell.","_n":"5999","_k":"7691f79e"},{"t":"8","why":"That’s the second shell.","_n":"6989","_k":"18f22e8f"},{"t":"18","why":"That’s the third shell’s full capacity.","_n":"79f9","_k":"6e5dda4c"}],"hints":["Think of helium.","It fills the first shell.","2."]},{"id":"w3","skill":"Waves","goal":1,"prompt":"A guitar string fixed at both ends can only vibrate in certain patterns. Why?","options":[{"t":"Only whole numbers of half-wavelengths fit between the fixed ends","why":"Both ends stay still, so only patterns that fit last.","_n":"89e9","_k":"184166fb"},{"t":"Sound waves need air","why":"That’s about how sound travels, not the string’s patterns.","_n":"9e96","_k":"1a8f242c"},{"t":"Strings can vibrate at any frequency equally","why":"Only certain patterns last.","_n":"aea6","_k":"29ffda9c"},{"t":"The string is too short to vibrate","why":"It does vibrate.","_n":"be76","_k":"f7f227e5"}],"hints":["Both ends must stay still.","The wave has to “fit”.","Whole numbers of half-wavelengths."]},{"id":"w4","skill":"Waves","goal":1,"prompt":"Two waves meet crest to trough. What happens?","options":[{"t":"They cancel","why":"Destructive interference.","_n":"ce86","_k":"88f9b91c"},{"t":"They double in height","why":"That’s crest meeting crest.","_n":"de56","_k":"90ce2785"},{"t":"They bounce apart","why":"Waves pass through each other.","_n":"ee66","_k":"1a02282b"},{"t":"Nothing changes","why":"They combine.","_n":"fe36","_k":"11753655"}],"hints":["A crest is up, a trough is down.","Up + down = …","They cancel."]},{"id":"w5","skill":"Counting patterns","goal":3,"prompt":"If `l = 3`, how many whole numbers run from `-l` to `+l`?","options":[{"t":"3","why":"Include the negatives.","_n":"ge46","_k":"b7addc7f"},{"t":"4","why":"That’s 0 to 3.","_n":"hf16","_k":"e2cf4584"},{"t":"6","why":"Don’t forget 0.","_n":"if26","_k":"14054cfa"},{"t":"7","why":"−3, −2, −1, 0, 1, 2, 3.","_n":"je36","_k":"1c2e7f86"}],"hints":["List them.","−3 … 3.","7 = 2(3) + 1."]},{"id":"w6","skill":"Counting patterns","goal":3,"prompt":"What is `2n^2` when `n = 3`?","options":[{"t":"8","why":"8 is the s + p total of the outer shell. Shell `n` holds `2n^2`: 2, 8, 18, 32.","_n":"ke26","_k":"0cde9bbd"},{"t":"12","why":"3² = 9, not 6.","_n":"le16","_k":"9a1c1ef9"},{"t":"18","why":"3² = 9, and 2 × 9 = 18.","_n":"me06","_k":"187c49a2"},{"t":"36","why":"Square first, then double: 2 × 9.","_n":"ne76","_k":"36b18f89"}],"hints":["`n^2` first.","3² = 9.","2 × 9 = 18."]}],"refreshers":{"Bohr energy levels":"Bohr gave hydrogen fixed energy levels. It worked for one electron but failed for others, and it gave electrons exact paths.","Waves":"Standing waves only fit in whole-number patterns; waves that don’t fit cancel themselves out.","Counting patterns":"From `-l` to `+l` there are `2l + 1` whole numbers. `2n^2`: square, then double."}}},"explore":{"heading":"Orbital viewer","intro":"Set the quantum numbers and see the orbital. Then find out why only certain waves fit.","how":"Choose a mode. In \u003cstrong>Orbital\u003c/strong> mode, tap a value for each quantum number. Drag the view or use the arrow keys to turn it.","modes":[{"id":"orb","t":"Orbital"},{"id":"ring","t":"Standing-wave ring"},{"id":"find","t":"Find the electron"}],"orbNote":"Blue and orange are the two phases (signs) of the electron wave; dashed lines mark nodes, where the electron is never found. Each `m_l` value shows one representative shape.","ringNote":"A simplified picture: real orbitals come from 3D waves (Schrödinger’s equation), not waves on a ring.","findNote":"Each dot is one measurement of a hydrogen electron’s position. The measurements are random but repeatable: the same dots appear every time.","cntLabel":"Challenge 3: how many electrons?","predictions":[{"id":"p1","prompt":"Orbital mode with `n = 2`. Which values of `l` are allowed?","options":[{"t":"0 and 1","_n":"oe66","_k":"13258522"},{"t":"only 2","_n":"pe56","_k":"304ed6f9"},{"t":"0, 1 and 2","_n":"qe46","_k":"a22e1c8d"},{"t":"1 and 2","_n":"reb6","_k":"0078faf4"}],"explain":"`l` runs from 0 to `n - 1`: 2s and 2p."},{"id":"p2","prompt":"Ring mode at 2.5 wavelengths. What happens to the wave?","options":[{"t":"It doubles in size","_n":"sea6","_k":"b11b0c7a"},{"t":"It overlaps itself out of step and cancels","_n":"tdd6","_k":"2d336840"},{"t":"It glows steadily","_n":"ude6","_k":"1a3d3a3b"},{"t":"It turns into a particle","_n":"vdf6","_k":"b9ccec03"}],"explain":"Only whole numbers of wavelengths fit, so only certain energies are allowed."},{"id":"p3","prompt":"How many orbitals does the 3d sublevel have?","options":[{"t":"2","_n":"we06","_k":"659d909b"},{"t":"3","_n":"xe16","_k":"259c2435"},{"t":"5","_n":"ye26","_k":"554cdcc0"},{"t":"10","_n":"ze36","_k":"c58bf1c9"}],"explain":"`2l + 1 = 5`. (10 is the number of electrons.)"},{"id":"p4","prompt":"Find the electron, 1s. Measure the position 500 times. What will the dots look like?","options":[{"t":"A fuzzy ball, densest near the nucleus","_n":"10e46","_k":"bbedb032"},{"t":"A neat circle","_n":"11e56","_k":"185ee8f1"},{"t":"A figure-8","_n":"12e66","_k":"a6c036e9"},{"t":"One dot","_n":"13e77","_k":"429cedaa"}],"explain":"No track, just probability. The orbital’s surface holds about 90% of the dots."}],"chalIntro":"Use the viewer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 uses the \u003cstrong>count box\u003c/strong> in Orbital mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"Show a \u003cstrong>4f\u003c/strong> orbital.","why":"f means `l = 3`, and `l = 3` first appears in shell 4. Any `m_l` from −3 to +3 is one of the seven 4f orbitals.","hints":["f means `l = 3`.","`l = 3` needs `n >= 4`.","`n = 4`, `l = 3`, `m_l` any of −3 to 3."]},{"id":"tc2","goal":2,"prompt":"Set the address of an electron in a \u003cstrong>3p\u003c/strong> orbital with `m_l = -1` and spin −½.","why":"(3, 1, −1, −½): shell 3, a p sublevel, one of its three orientations, spin down.","hints":["p means `l = 1`.","Then set `m_l` and spin.","(3, 1, −1, −½)."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"How many electrons in one atom can have `n = 4` \u003cstrong>and\u003c/strong> `m_l = 0`? Enter the number, then show each orbital they occupy.","why":"4s, 4p, 4d and 4f each have exactly one orbital with `m_l = 0`: 4 orbitals × 2 electrons = 8.","hints":["Which `l` values exist in shell 4?","`l = 0`, 1, 2, 3, and each has exactly one orbital with `m_l = 0`.","4 orbitals × 2 electrons = 8."]}]},"part3":{"slug":"quantum-numbers","name":"Quantum numbers","heading":"Quantum numbers puzzle","intro":"Three stations, away from the viewer: build the counting table by hand, sort addresses into allowed and not allowed, then see how a Canadian chemist read atoms and bonds from electron density.","s1":{"title":"Station 1: Build the table","intro":"Fill in each shell. Separate several values with commas (for example 0, 1). A row checks itself when every box is filled.","cols":[{"id":"l","label":"Allowed `l` values"},{"id":"let","label":"Sublevel letters"},{"id":"orb","label":"Orbitals per sublevel"},{"id":"sh","label":"Orbitals per shell (`n^2`)"},{"id":"el","label":"Electrons per shell (`2n^2`)"}],"data":{"summary":"Check it with data: does `2n^2` match the periodic table?","intro":"Compare the shell capacities with the lengths of the periods (rows) of the periodic table.","periods":[2,8,8,18,18,32,32],"note":"Periods don’t equal `2n^2`, because sublevels fill in energy order (module 16)."}},"s2":{"title":"Station 2: Allowed or not?","intro":"Decide whether each address card is allowed. The card flips to show its rule.","cards":[{"id":"c1","t":"(2, 1, 0, +½)","_a":"EVleRw==","back":"Allowed: 2p."},{"id":"c2","t":"(2, 2, 1, +½)","_a":"EVhaRw==","back":"Not allowed: `l \u003c n`."},{"id":"c3","t":"(3, 1, 2, −½)","_a":"EVhaRw==","back":"Not allowed: `|m_l| \u003c= l`."},{"id":"c4","t":"(4, 0, 0, −½)","_a":"EVleRw==","back":"Allowed: 4s."},{"id":"c5","t":"(1, 0, 0, 1)","_a":"EVhaRw==","back":"Not allowed: spin is `+½` or `-½`."},{"id":"c6","t":"(3, 2, −2, +½)","_a":"EVleRw==","back":"Allowed: 3d."}],"wrong":"Check the four rules in turn: `n >= 1`; `0 \u003c= l \u003c= n - 1`; `-l \u003c= m_l \u003c= l`; `m_s = ±½`."},"s3":{"title":"Station 3: Seeing electron density","html":"\u003cp>Richard F. W. Bader at McMaster University in Hamilton developed ways to read molecules from their electron density. Within a molecule, an atom is the region its own density surrounds, and bonds show up as ridges of density.\u003c/p>","task":"Compare the density map of methanal (H₂CO) with its ball-and-stick model. Tap a bond in the model, then tap the ridge it matches on the map.","mapNote":"Model density map, drawn from the sum of the atoms’ densities. The map is flipped left to right compared with the model, so use the sizes of the peaks: bigger atoms have taller peaks.","bonds":[{"id":"co","t":"C=O"},{"id":"ch1","t":"C–H (top)"},{"id":"ch2","t":"C–H (bottom)"}],"done":"Every bond sits on a ridge of density, and there’s no ridge between atoms that aren’t bonded, such as O and H. That’s how Bader’s method finds bonds from density alone."},"quickCheck":{"title":"Quick check","summary":"Quantum numbers puzzle quick check","items":[{"id":"q1","goal":3,"prompt":"How many orbitals are in shell 3?","choices":[{"t":"3","fb":"`n^2 = 9` (one 3s, three 3p, five 3d).","_n":"14e67","_k":"7e87fa48"},{"t":"8","fb":"`n^2 = 9` (one 3s, three 3p, five 3d).","_n":"15e97","_k":"5c2c952e"},{"t":"9","fb":"Right. `n^2 = 9` (one 3s, three 3p, five 3d).","_n":"16e87","_k":"b52eb483"},{"t":"18","fb":"`n^2 = 9` (one 3s, three 3p, five 3d).","_n":"17e37","_k":"5c1ffc1a"}]},{"id":"q2","goal":2,"prompt":"Which address is not allowed?","choices":[{"t":"(3, 2, 0, +½)","fb":"`l` must be less than `n`.","_n":"18e27","_k":"d4fc7a90"},{"t":"(3, 1, 1, +½)","fb":"`l` must be less than `n`.","_n":"19e57","_k":"8fff8e46"},{"t":"(3, 3, 0, +½)","fb":"Right. `l` must be less than `n`.","_n":"1ae47","_k":"d2956afc"},{"t":"(3, 0, 0, −½)","fb":"`l` must be less than `n`.","_n":"1bef7","_k":"eb065d06"}]},{"id":"q3","goal":2,"prompt":"Two electrons share `n`, `l` and `m_l`. What must differ?","choices":[{"t":"Nothing","fb":"Pauli: opposite spins.","_n":"1cee7","_k":"01a64594"},{"t":"Shell","fb":"Pauli: opposite spins.","_n":"1d617","_k":"14fba526"},{"t":"Spin","fb":"Right. Pauli: opposite spins.","_n":"1e627","_k":"824c067f"},{"t":"Shape","fb":"Pauli: opposite spins.","_n":"1f5f7","_k":"e4547122"}]},{"id":"q4","goal":5,"prompt":"What did Bader’s work map?","choices":[{"t":"Hydrogen’s spectral lines","fb":"Atoms and bonds read from density.","_n":"1g607","_k":"5aa1214c"},{"t":"Electron density in molecules","fb":"Right. Atoms and bonds read from density.","_n":"1h657","_k":"db3cfb49"},{"t":"Nuclear sizes","fb":"Atoms and bonds read from density.","_n":"1i667","_k":"ff15cdf4"},{"t":"Alpha-particle tracks","fb":"Atoms and bonds read from density.","_n":"1j637","_k":"6532796a"}]}]}},"practice":{"activities":[{"id":"allowed","type":"custom","title":"Allowed or not?","summary":"Allowed or not?","goal":2,"instruction":"Sort the ten address cards (`n`, `l`, `m_l`, `m_s`). After you sort a card into \u003cstrong>Not allowed\u003c/strong>, choose the rule it breaks.","how":"Tap a card, then tap the box it belongs in.","boxes":[{"id":"ok","label":"Allowed"},{"id":"no","label":"Not allowed"}],"rules":[{"id":"n"  ±½`, never 0."]},{"id":"a6","t":"(3, 2, 1, −½)","_a":"EVleRw==","why":"Allowed: 3d.","goal":2,"wrongFb":"","hints":["Check `n >= 1`, then `0 \u003c= l \u003c= n - 1`.","Then `-l \u003c= m_l \u003c= l`, and `m_s = ±½`.","Allowed: 3d."]},{"id":"a7","t":"(2, 1, 1, +½)","_a":"EVleRw==","why":"Allowed: 2p.","goal":2,"wrongFb":"","hints":["Check `n >= 1`, then `0 \u003c= l \u003c= n - 1`.","Then `-l \u003c= m_l \u003c= l`, and `m_s = ±½`.","Allowed: 2p."]},{"id":"a8","t":"(0, 0, 0, +½)","_a":"EVhaXwxB","why":"Not allowed: `n >= 1`. There is no shell 0.","goal":2,"wrongFb":"`n` counts shells from 1: there is no shell 0.","hints":["Check `n >= 1`, then `0 \u003c= l \u003c= n - 1`.","Then `-l \u003c= m_l \u003c= l`, and `m_s = ±½`.","Not allowed: `n >= 1`. There is no shell 0."]},{"id":"a9","t":"(3, 0, 1, +½)","_a":"EVhaXw8PEQ==","why":"Not allowed: `l = 0` allows only `m_l = 0`.","goal":2,"wrongFb":"`m_l` runs from `-l` to `+l`, giving `2l + 1` orbitals.","hints":["Check `n >= 1`, then `0 \u003c= l \u003c= n - 1`.","Then `-l \u003c= m_l \u003c= l`, and `m_s = ±½`.","Not allowed: `l = 0` allows only `m_l = 0`."]},{"id":"a10","t":"(5, 4, 4, +½)","_a":"EVleRw==","why":"Allowed: 5g (exists in theory; no known element uses it).","goal":2,"wrongFb":"","hints":["Check `n >= 1`, then `0 \u003c= l \u003c= n - 1`.","Then `-l \u003c= m_l \u003c= l`, and `m_s = ±½`.","Allowed: 5g (exists in theory; no known element uses it)."]}]},{"id":"counting","type":"custom","title":"Counting with quantum numbers","summary":"Counting with quantum numbers","star":true,"goal":[1,3,4],"instruction":"Seven items: six number entries and one choice. Items 4 to 7 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type your answer or tap a choice, then press Check.","items":[{"id":"n1","kind":"num","goal":3,"prompt":"Orbitals in shell 3?","_a":"Cg==","display":"9 orbitals","wrong":[{"match":18,"fb":"That’s electrons. Count orbitals first, then double for electrons."}],"fb":"Add the orbitals in 3s, 3p and 3d.","hints":["Shell 3 has 3s, 3p and 3d.","1 + 3 + 5.","`n^2 = 9`."]},{"id":"n2","kind":"num","goal":3,"prompt":"Electrons in a full 4d sublevel?","_a":"AgY=","display":"10 electrons","wrong":[{"match":5,"fb":"Count orbitals first, then double for electrons."}],"fb":"Count the orbitals in a d sublevel, then double.","hints":["d means `l = 2`.","`2l + 1 = 5` orbitals.","5 × 2 = 10."]},{"id":"n3","kind":"num","goal":3,"prompt":"Electrons with `n = 3` and `l = 1`?","_a":"BQ==","display":"6 electrons","wrong":[{"match":3,"fb":"Count orbitals first, then double for electrons."}],"fb":"Which sublevel is `n = 3`, `l = 1`? Count its orbitals, then double.","hints":["`n = 3`, `l = 1` is the 3p sublevel.","3p has 3 orbitals.","3 × 2 = 6."]},{"id":"n4","kind":"num","star":true,"goal":3,"prompt":"Electrons with `n = 4` and `m_l = -1`?","_a":"BQ==","display":"6 electrons","wrong":[{"match":2,"fb":"`l = 1`, 2 and 3 each have an `m_l = -1` orbital: 3 orbitals × 2."}],"fb":"Find every sublevel in shell 4 that has an `m_l = -1` orbital.","hints":["Which `l` values in shell 4 allow `m_l = -1`?","`l >= 1`: that is `l = 1`, 2, 3.","3 orbitals × 2 = 6."]},{"id":"n5","kind":"num","star":true,"goal":3,"prompt":"Electrons with `n = 3` and `m_s = +½`?","_a":"Cg==","display":"9 electrons","wrong":[{"match":18,"fb":"Only half of shell 3’s 18 electrons have spin +½."}],"fb":"How many orbitals are in shell 3, and how many +½ electrons fit in each?","hints":["Shell 3 holds `2n^2 = 18` electrons.","Each orbital holds one +½ electron and one −½ electron.","18 ÷ 2 = 9."]},{"id":"n6","kind":"num","star":true,"goal":4,"prompt":"Total nodes in a 3p orbital?","_a":"AQ==","display":"2 nodes","wrong":[{"match":1,"fb":"3p has one spherical node and one nodal plane: `n - 1 = 2`."}],"fb":"Add the spherical nodes and the nodal planes.","hints":["Spherical nodes: `n - l - 1`.","Nodal planes: `l`.","1 + 1 = 2."]},{"id":"n7","kind":"chips","star":true,"goal":1,"prompt":"\u003cstrong>Investigation:\u003c/strong> a student claims a 2p electron travels along a figure-8 path. Which idea contradicts this?","options":[{"t":"The Pauli exclusion principle: two electrons can’t share the figure-8","why":"Pauli is about sharing an address, not about paths. The dumbbell is where the electron is likely to be, not a track.","_n":"1k647","_k":"9ae69154"},{"t":"Bohr’s model: electrons follow fixed paths","why":"That supports the claim instead of contradicting it. The dumbbell is where the electron is likely to be, not a track.","_n":"1l697","_k":"26bc0a06"},{"t":"The uncertainty principle: exact paths can’t be known; the orbital is a probability region","why":"The dumbbell is where the electron is likely to be, not a track.","_n":"1m6a7","_k":"242e75d8"},{"t":"The `2n^2` rule: shell 2 holds 8 electrons","why":"That counts electrons; it says nothing about paths. The dumbbell is where the electron is likely to be, not a track.","_n":"1n7b7","_k":"0d0d4fb8"}],"hints":["Can anyone track an electron’s exact path?","Exact paths can’t be known.","The uncertainty principle: the dumbbell is a probability region."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Harper","how":"","goal":[2,3],"instruction":"Harper made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"List the orbitals in the 3d sublevel.","steps":["3d means `n = 3` and `l = 2`.","`m_l` can be 0, 1 or 2.","So 3d has 3 orbitals and holds 6 electrons."],"_a":"Ag==","stepFb":["Correct. Keep checking.","","This follows from step 2."],"fixes":[{"t":"`m_l` runs from −2 to +2: −2, −1, 0, 1, 2. So 3d has 5 orbitals holding 10 electrons.","why":"`m_l` runs from `-l` to `+l`, giving `2l + 1` orbitals.","_n":"1o7a7","_k":"c30c2479"},{"t":"`m_l` can be 1, 2 or 3.","why":"`m_l` can’t exceed `l`.","_n":"1p797","_k":"f81b0059"},{"t":"3d has 3 orbitals, but they hold 10 electrons.","why":"At most 2 el , 2 (s, p, d).","_n":"1y766","_k":"0391ba80"},{"t":"0, 1, 2, 3","why":"`l` stops at `n - 1`.","_n":"1z776","_k":"8b8565fe"}]},"b":{"prompt":"Which values of `m_l` are allowed when `l = 2`?","options":[{"t":"0, 1, 2","why":"`m_l` runs from `-l` to `+l`, giving `2l + 1` orbitals.","_n":"20786","_k":"edb8b026"},{"t":"−1, 0, 1","why":"That’s for `l = 1`.","_n":"21716","_k":"0be53506"},{"t":"1, 2","why":"`m_l` runs from `-l` to `+l`, giving `2l + 1` orbitals.","_n":"22726","_k":"761c62ca"},{"t":"−2, −1, 0, 1, 2","why":"`m_l` runs from `-l` to `+l`, giving `2l + 1` orbitals.","_n":"23736","_k":"5097d7d5"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"How many orbitals are in a p sublevel?","options":[{"t":"1","why":"That’s s.","_n":"24746","_k":"5f60237e"},{"t":"3","why":"For p, `l = 1`, so `2l + 1 = 3`.","_n":"256d6","_k":"2c0cbfcb"},{"t":"5","why":"That’s d.","_n":"266e6","_k":"a4fd6dde"},{"t":"6","why":"That’s electrons. Count orbitals first, then double for electrons.","_n":"275f8","_k":"869d79d3"}]},"b":{"prompt":"What is the maximum number of electrons in a d sublevel?","options":[{"t":"5","why":"That’s orbitals. Count orbitals first, then double for electrons.","_n":"285e8","_k":"f5bd8ccf"},{"t":"6","why":"That’s p.","_n":"29618","_k":"bc7c377b"},{"t":"10","why":"5 orbitals × 2 electrons.","_n":"2a608","_k":"730fb305"},{"t":"14","why":"That’s f.","_n":"2b638","_k":"74f34316"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"In the quantum mechanical model, an orbital is…","options":[{"t":"The circular path an electron travels","why":"An orbital is a region of probability, not a track. The electron’s exact path can’t be known.","_n":"2c628","_k":"77c1b5d2"},{"t":"A photon of fixed energy","why":"Photons are light.","_n":"2d658","_k":"b247ea86"},{"t":"The nucleus","why":"The nucleus is at the centre.","_n":"2e648","_k":"fdc4d8ea"},{"t":"A region where an electron is likely to be found","why":"Its surface is drawn to hold about 90% of the chance of finding the electron.","_n":"2f678","_k":"3bd27199"}]},"b":{"prompt":"What does the uncertainty principle mean for electrons in atoms?","options":[{"t":"Electrons move in circles of known size","why":"An orbital is a region of probability, not a track. The electron’s exact path can’t be known.","_n":"2g668","_k":"610af89a"},{"t":"Electrons have no energy","why":"They have definite energies.","_n":"2hf97","_k":"bb82d5b7"},{"t":"Electrons are always at the nucleus","why":"They’re spread in orbitals.","_n":"2ifa7","_k":"eda7b2c2"},{"t":"Their exact position and motion can’t both be known, so exact paths can’t be drawn","why":"So the model uses orbitals: regions of probability.","_n":"2jf77","_k":"01d932a0"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"How many electrons can have `n = 4`?","options":[{"t":"8","why":"8 is the s + p total of the outer shell. Shell `n` holds `2n^2`: 2, 8, 18, 32.","_n":"2kf87","_k":"c8165fc5"},{"t":"16","why":"That’s orbitals. Count orbitals first, then double for electrons.","_n":"2lf57","_k":"bca0e91f"},{"t":"18","why":"That’s shell 3.","_n":"2mf67","_k":"164c8da5"},{"t":"32","why":"`2(4^2) = 32`.","_n":"2nf37","_k":"74147e10"}]},"b":{"prompt":"How many electrons can have `n = 3` and `l = 2`?","options":[{"t":"5","why":"Count orbitals first, then double for electrons.","_n":"2of47","_k":"7992ad55"},{"t":"6","why":"That’s 3p.","_n":"2pf17","_k":"5cbf3c37"},{"t":"10","why":"A full 3d sublevel.","_n":"2qf27","_k":"5ba2c4d2"},{"t":"18","why":"That’s the whole shell.","_n":"2r43d","_k":"7a9fa328"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Which set is \u003cstrong>not\u003c/strong> allowed?","options":[{"t":"(3, 2, 3, +½)","why":"`m_l` can’t exceed `l = 2`.","_n":"2s44d","_k":"924bdc09"},{"t":"(3, 1, −1, +½)","why":"Allowed: 3p.","_n":"2t41d","_k":"c896e9bc"},{"t":"(4, 3, −2, −½)","why":"Allowed: 4f.","_n":"2u42d","_k":"4fd6092e"},{"t":"(2, 0, 0, −½)","why":"Allowed: 2s.","_n":"2v47d","_k":"d1ffd7f8"}]},"b":{"prompt":"Which set \u003cstrong>is\u003c/strong> allowed?","options":[{"t":"(1, 1, 0, +½)","why":"`l` runs from 0 up to `n - 1`. In shell 3: 0, 1, 2 (s, p, d).","_n":"2w48d","_k":"9e648f7e"},{"t":"(4, 2, −2, +½)","why":"4d.","_n":"2x45d","_k":"42c9e107"},{"t":"(3, 0, 1, −½)","why":"`l = 0` allows only `m_l = 0`.","_n":"2y46d","_k":"7a980a26"},{"t":"(2, 2, 1, +½)","why":"`l` runs from 0 up to `n - 1`. In shell 3: 0, 1, 2 (s, p, d).","_n":"2z4bd","_k":"c0e3a421"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"How many electrons in an atom can have `n = 3` and `m_l = +1`?","options":[{"t":"2","why":"Two sublevels qualify.","_n":"304cd","_k":"0487182d"},{"t":"4","why":"3p and 3d each have one `m_l = +1` orbital: 2 orbitals × 2.","_n":"3149d","_k":"78ffcb21"},{"t":"6","why":"Only `l = 1` and `l = 2` have `m_l = +1`.","_n":"3248d","_k":"b8e0b10c"},{"t":"18","why":"That’s the whole shell.","_n":"334bd","_k":"1e6182ff"}]},"b":{"prompt":"How many orbitals in shell 4 are d or f orbitals?","options":[{"t":"8","why":"Count both: 5 d and 7 f.","_n":"344ad","_k":"bcb286fb"},{"t":"10","why":"That’s d electrons. Count orbitals first, then double for electrons.","_n":"3545d","_k":"ca7c9296"},{"t":"12","why":"5 + 7.","_n":"3644d","_k":"d26b5a97"},{"t":"16","why":"That’s every orbital in shell 4.","_n":"3747d","_k":"32a58b66"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why the quantum mechanical model replaced Bohr’s orbits?","options":[{"t":"“Bohr’s model had no energy levels.”","why":"It did.","_n":"3846d","_k":"f47aeb30"},{"t":"“Electrons behave as waves and their exact paths can’t be known, so the model uses orbitals, which work for atoms with many electrons.”","why":"It names the evidence (waves, no exact paths), the new idea (orbitals) and what it fixed (many-electron atoms).","_n":"3951d","_k":"13944102"},{"t":"“Electrons were found to orbit faster.”","why":"An orbital is a region of probability, not a track. The electron’s exact path can’t be known.","_n":"3a50d","_k":"22dc705c"},{"t":"“The nucleus turned out to be bigger.”","why":"Nucleus size isn’t the reason.","_n":"3bd7d","_k":"f2563423"}]},"b":{"prompt":"Which is the best explanation of why an electron in an atom can have only certain energies?","options":[{"t":"“Electrons are too small to have other energies.”","why":"Size isn’t the reason.","_n":"3cd8d","_k":"6614a855"},{"t":"“As a wave, only patterns that fit, like whole numbers of wavelengths around a ring, last; the rest cancel.”","why":"Fitting waves set the allowed energies.","_n":"3dd9d","_k":"ac2f4520"},{"t":"“Photons force them into place.”","why":"Photons are absorbed or emitted between allowed levels.","_n":"3edad","_k":"d16086e2"},{"t":"“The nucleus blocks other energies.”","why":"Fitting waves set the energies.","_n":"3fd3d","_k":"a8e88993"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which description of the 2p orbitals is correct?","options":[{"t":"Three circular paths","why":"An orbital is a region of probability, not a track. The electron’s exact path can’t be known.","_n":"3gd4d","_k":"ca03bafd"},{"t":"Three dumbbell-shaped orbitals at right angles, along x, y and z","why":"`m_l = -1`, 0 and +1: three dumbbells, one along each axis.","_n":"3hd5d","_k":"ae634ce0"},{"t":"Five cloverleaf orbitals","why":"That’s d.","_n":"3id6d","_k":"6a6ae731"},{"t":"One sphere","why":"That’s s.","_n":"3jcfd","_k":"75aed25f"}]},"b":{"prompt":"How do the 1s and 2s orbitals compare?","options":[{"t":"They are identical","why":"2s is larger.","_n":"3kd0d","_k":"ae98d1d5"},{"t":"Both spherical; 2s is larger and has one spherical node inside","why":"Every s orbital is spherical. 2s is larger, with one node inside.","_n":"3l5dd","_k":"210c3dae"},{"t":"2s is dumbbell-shaped","why":"Every s orbital is spherical. 2s is larger, with one node inside.","_n":"3m5cd","_k":"af8e74d3"},{"t":"2s is smaller than 1s","why":"Higher `n`, larger orbital.","_n":"3n5bd","_k":"61fe9249"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"What did Richard Bader’s work at McMaster University contribute?","options":[{"t":"The gold-foil experiment","why":"That was Rutherford’s team.","_n":"3o5ad","_k":"88fec3df"},{"t":"The discovery of the electron","why":"That was Thomson.","_n":"3p59d","_k":"f73f4168"},{"t":"Hydrogen’s line spectrum","why":"That’s Bohr’s era.","_n":"3q58d","_k":"e775f3d4"},{"t":"Ways to read atoms and bonds in molecules from their electron density","why":"Atoms are the regions their density surrounds; bonds are ridges of density.","_n":"3r57d","_k":"56082383"}]},"b":{"prompt":"Electron density maps (from X-ray studies of crystals) show molecules as smooth clouds that are densest near the nuclei. Which model do they support?","options":[{"t":"Bohr’s model of fixed circular orbits","why":"An orbital is a region of probability, not a track. The electron’s exact path can’t be known.","_n":"3s56d","_k":"0204ef1c"},{"t":"Thomson’s plum pudding","why":"Thomson’s model has no nucleus.","_n":"3t55d","_k":"e2d97a98"},{"t":"The quantum mechanical model","why":"Smooth clouds of density are what orbitals predict.","_n":"3u54d","_k":"baf387ef"},{"t":"Dalton’s solid spheres","why":"Dalton’s atoms have no inner structure.","_n":"3vcbd","_k":"483a05c7"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Theory predicts g orbitals with `l = 4` (no known element uses them yet). How many orbitals would a g sublevel have?","options":[{"t":"4","why":"`m_l` runs from `-l` to `+l`, giving `2l + 1` orbitals.","_n":"3wccd","_k":"c0d5c98f"},{"t":"8","why":"Count from −4 to +4 including 0.","_n":"3xc9d","_k":"995a65ce"},{"t":"9","why":"2(4) + 1.","_n":"3ycad","_k":"98ca312c"},{"t":"18","why":"That’s electrons. Count orbitals first, then double for electrons.","_n":"3zc7d","_k":"7aba6066"}]},"b":{"prompt":"How many electrons could shell 5 hold in theory?","options":[{"t":"18","why":"8 is the s + p total of the outer shell. Shell `n` holds `2n^2`: 2, 8, 18, 32.","_n":"40c8d","_k":"8af987e6"},{"t":"25","why":"Count orbitals first, then double for electrons.","_n":"41c5d","_k":"bfccb89a"},{"t":"32","why":"That’s shell 4.","_n":"42c6d","_k":"b0577246"},{"t":"50","why":"2(5²).","_n":"43d3d","_k":"f6d17654"}]}}]},"task":{"title":"Quantum address","summary":"Quantum address","statement":"\u003cp>Write the quantum address of an electron that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"qm-conds\">\u003cli>The set is allowed.\u003c/li>\u003cli>The electron is in the third shell.\u003c/li>\u003cli>It is in a p or d sublevel.\u003c/li>\u003cli>Its `m_l` is +1.\u003c/li>\u003c/ol>","checks":["Allowed","Third shell","p or d","`m_l = +1`"],"tips":["`m_l` can’t be bigger than `l`.","Shell 3 has s, p and d.","`m_l = +1` needs `l >= 1`.","Don’t forget spin: two electrons can share an orbital."],"lTip":"`l` runs from 0 up to `n - 1`. In shell 3: 0, 1, 2 (s, p, d).","explainPrompt":"Explain what each of your four numbers tells about the electron, and why exactly four addresses work.","vocab":"Use the words shell, sublevel, orbital, spin and Pauli exclusion principle.","success":"That address meets every condition.","more":"There’s more than one answer. Don’t forget spin: two electrons can share an orbital.","after3":"Four addresses, four electrons: two in one 3p orbital and two in one 3d orbital, each pair with opposite spins (Pauli).","afterAt":4},"cards":[["Orbital","A 3D region where an electron is likely to be found (the boundary holds about 90% of the chance)."],["Uncertainty principle","An electron’s exact position and motion can’t both be known, so there are no exact paths."],["Standing-wave idea","Only whole-number wave patterns fit, so only certain energies are allowed."],["`n`","Principal quantum number: shell, energy and size (1, 2, 3, …)."],["`l`","Shape: 0 to `n - 1` (s, p, d, f)."],["`m_l`","Orientation: `-l` to `+l`; `2l + 1` orbitals per sublevel."],["`m_s`","Spin: +½ or −½."],["Pauli exclusion principle","No two electrons in an atom share all four quantum numbers: at
