\u003c/sub> → shape.\u003c/span> \u003cspan class=\"nw\">\u003cspan class=\"chem\">NH\u003csub>3\u003c/sub>\u003c/span> = \u003cspan class=\"chem\">AX\u003csub>3\u003c/sub>E\u003csub>1\u003c/sub>\u003c/span>\u003c/span> \u003cspan class=\"nw\">→ trigonal pyramidal, ≈ 107°\u003c/span>\u003c/span>","eqSize":"sm","eqLabel":"A X m E n gives the shape. N H 3 is A X 3 E 1, so it is trigonal pyramidal, about 107 degrees.","headline":"Electron groups push apart","text":"Electron groups around a central atom repel each other, so they spread out as far as they can. That gives the \u003cstrong>electron-group arrangement\u003c/strong>. Name what the \u003cstrong>atoms\u003c/strong> make, and you have the \u003cstrong>molecular shape\u003c/strong>. \u003cstrong>Lone pairs\u003c/strong> are invisible in the name, but they bend the bonds.","fig":{"html":"\u003cdiv class=\"vs-hx\">\u003csvg class=\"vs-hx-svg\" id=\"vs-hx-svg\" viewBox=\"0 0 440 320\" role=\"img\" aria-label=\"Four balloons tied at their knots push apart into a tetrahedron. Each balloon becomes an electron cloud: three get H atoms at their tips and the fourth, fatter and violet, stays a lone pair on N. The H–N–H angle shrinks from 109.5° to 107°. With the lone pair hidden, the atoms make a pyramid labelled trigonal pyramidal.\">\u003c/svg>\u003cdiv class=\"vs-hx-row\">\u003cp class=\"vs-hx-cap\" id=\"vs-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"vs-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can count electron groups around a central atom from a Lewis structure, counting a multiple bond as one group.","I can name the electron-group arrangement and the molecular shape for AXₘEₙ, up to six groups.","I can predict bond angles, including how lone pairs squeeze them.","I can explain where lone pairs sit in five- and six-group arrangements.","I can go from a formula to a 3D shape for molecules and polyatomic ions.","I can draw and descri
