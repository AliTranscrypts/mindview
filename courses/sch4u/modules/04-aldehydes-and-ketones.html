.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--at-c:#1E2A57;--at-h:#FFFFFF;--at-h-line:#4D5A80;--at-h-ink:#1E2A57;--at-o:#B0286F;--at-n:#2343C4;--at-x:#0B7372;--at-s:#6B5A1E;--at-p:#A84C05;--at-m:#00648A;
--e-pair:#7A3DB8;--dl-neg:#B0286F;--dl-pos:#2343C4;--en-dh:#A84C05;--en-ea:#6B5A1E;--en-cat:#0B7372;--eq-r:#2343C4;--eq-p:#0B7372;--eq-f:#2343C4;--eq-b:#A84C05;
--ab-h3o:#B0286F;--ab-oh:#00648A;--ec-e:#7A3DB8;--ec-cat:#A84C05;--ec-an:#0B7372;--orb-a:#2343C4;--orb-b:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
}
:root[data-theme="dark"]{--at-c:#E5ECE4;--at-h:#FFFFFF;--at-h-line:#A8B7AC;--at-h-ink:#1E2A57;--at-o:#F49AC8;--at-n:#93AEFF;--at-x:#5FD0CD;--at-s:#D8D08F;--at-p:#FF9F5A;--at-m:#7FD3F5;
--e-pair:#C9A8FF;--dl-neg:#F49AC8;--dl-pos:#93AEFF;--en-dh:#FF9F5A;--en-ea:#D8D08F;--en-cat:#5FD0CD;--eq-r:#93AEFF;--eq-p:#5FD0CD;--eq-f:#93AEFF;--eq-b:#FF9F5A;
--ab-h3o:#F49AC8;--ab-oh:#7FD3F5;--ec-e:#C9A8FF;--ec-cat:#FF9F5A;--ec-an:#5FD0CD;--orb-a:#93AEFF;--orb-b:#FF9F5A}
.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 04: hero, C1 molecule view, carbonyl explorer (bars, dipole box, gallery, pin), test bench, C2 chips, task builder */

/* test-bench observation colours, drawn true to life and always named in words (plan §5): colourless and blue solutions,
   brick-red precipitate, silver mirror (a light-grey gradient in dark mode) */
:root{--ak-tol:#EDF3F7;--ak-ben:#2F6FD0;--ak-brick:#B4532C;--ak-silver-a:#8E98A3;--ak-silver-b:#F1F3F6}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ak-tol:#2B3B44;--ak-ben:#4F8BE6;--ak-brick:#D9774D;--ak-silver-a:#A3ACB6;--ak-silver-b:#E8ECEF}
}
:root[data-theme="dark"]{--ak-tol:#2B3B44;--ak-ben:#4F8BE6;--ak-brick:#D9774D;--ak-silver-a:#A3ACB6;--ak-silver-b:#E8ECEF}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.ak-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ak-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ak-hx-cap{font:400 1.05rem var(--font-ui);color:var(--ink);margin:4px 0;min-height:2.8em}

/* C1 molecule view */
.c1-wrap{position:relative;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.c1-svg{display:block;width:100%;height:auto;touch-action:pan-y;font-family:var(--font-ui)}
.c1-ov{position:absolute;inset:0;pointer-events:none}
.c1-b{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;padding:0;pointer-events:auto;cursor:pointer}
.c1-b.bd{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:6px}
.c1-b:hover{background:var(--hi-soft)}
.c1-b:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.c1-rot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.c1-rot .btn{min-width:40px;min-height:40px}
.c1-rot[hidden]{display:none}

/* explorer */
.ak-how{margin-top:0}
.ak-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"view read" "ctrl read";gap:16px 28px;align-items:start}
.ak-left{grid-area:view;min-width:0}.ak-ctrl{grid-area:ctrl;min-width:0}.ak-right{grid-area:read;min-width:0}
.ak-cap{font:400 clamp(1.15rem,2.6vw,1.55rem)/1.3 var(--font-ui);white-space:normal;min-height:1.4em}
.ak-cap .chem{white-space:normal;overflow-wrap:anywhere}
.ak-molrow{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.ak-molrow.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.ak-pin{border:1.5px dashed var(--rule);border-radius:10px;padding:6px 8px}
.ak-pin .ak-sub{margin:0 0 4px}
.ak-pinlab{margin:6px 0 0;font-size:.92rem;overflow-wrap:anywhere}
.ak-views{margin-top:10px}
.ak-note{min-height:1.4em;margin:8px 0 0;font-size:1rem}
.ak-modes{margin-bottom:12px}
.ak-sl{display:block;margin:4px 0 8px}
.ak-me{margin:6px 0 2px}
.ak-mehint{margin:4px 0 0}
.ak-msg{min-height:1.4em;margin:8px 0 6px;font-size:.92rem;color:var(--ink-2)}
.ak-sub{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:10px 0 6px}
.ak-acts{margin-top:8px}
.ak-water{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:.95rem;min-height:32px}
.ak-water input{width:20px;height:20px}
.ak-right .chem-tab{margin-top:14px}
.ak-gal[hidden],.ak-molrow[hidden],.ak-pin[hidden],.ak-pbox[hidden],.ak-bars[hidden],.ak-views[hidden],.ak-water[hidden],.ak-build[hidden],.ak-note[hidden],.ak-acts [hidden],.ak-dmol[hidden],#ak-tkprod[hidden]{display:none}
/* bars */
.ak-bars{margin-top:12px}
.ak-bsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ak-blabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:2px}
.ak-blab{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:.9rem;line-height:1.25;overflow-wrap:anywhere;padding:4px 2px;border-radius:6px}
.ak-blab.cur{background:var(--hi-soft)}
/* particle box */
.ak-pbox{margin-top:12px}
.ak-psvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ak-pcap{margin:8px 0 2px;font-size:.98rem}
.ak-pleg{margin:4px 0 0}
.ak-hbkey{display:inline-block;width:26px;height:0;border-top:3px dotted var(--e-pair);vertical-align:middle;margin:0 2px}
/* gallery */
.ak-cards{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.ak-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:8px 10px;min-height:44px;min-width:8.5em;font:inherit;font-size:.9rem;cursor:pointer}
.ak-card span{font-size:.82rem;color:var(--ink-2)}
.ak-card .ak-fam{font-weight:700}
.ak-card.on{border-color:var(--pen);box-shadow:inset 0 0 0 1.5px var(--pen);background:var(--hi-soft)}
.ak-galfig{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.ak-galsvg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.ak-galnote{margin:8px 0 0}

/* C2 chips */
.c2-tape{font:400 1.3rem/1.3 var(--font-ui);margin:4px 0 10px;min-height:1.4em;overflow-wrap:anywhere}
.c2-name{font-weight:700;color:var(--ink)}
.c2-lab{display:block;font-size:.78rem;font-weight:700;color:var(--ink-2);margin:6px 0 2px}
.c2-tape .c2-lab{display:inline;font-size:.85rem}
.c2-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c2-row .c2-lab{flex-basis:100%;margin-bottom:0}
.c2-c{min-height:36px;min-width:36px}
.c2-c:disabled{opacity:.45}
.c2-act{margin-top:10px}

/* Part 3 */
#p3-app > .part:first-child{border-top:0;margin-top:0;padding-top:0}
.ak-bench{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px 24px;align-items:start}
.ak-tubebox{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:6px 8px}
.ak-tube{display:block;width:100%;max-width:320px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.ak-obs{margin:4px 0 2px;font-weight:700;min-height:2.6em}
.ak-tdesc{margin:10px 0;font-size:.95rem}
.ak-spick{margin:4px 0 12px}
.ak-h4{margin:16px 0 6px}
.ak-res{width:100%;border-collapse:collapse;font-size:.92rem}
.ak-res th,.ak-res td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.ak-res thead th{font-size:.85rem;color:var(--ink-2)}
.ak-rec{display:flex;flex-wrap:wrap;gap:4px}
.ak-rec .chip{min-height:32px;font-size:.85rem}
.ak-bad{display:block;margin-top:4px;font-size:.85rem;color:var(--red)}
.ak-data{margin-top:14px}
.ak-dmol{max-width:560px}
.ak-deq{margin:8px 0 4px}
.ak-deq .chem{white-space:normal;overflow-wrap:anywhere}
.ak-crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0}
.ak-clab{min-width:6.5em;font-weight:700}
.ak-nnav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ak-nnav .chip{min-height:36px;min-width:44px}
.ak-nmol{max-width:600px}
.ak-ncond{margin:8px 0 4px}
.ak-ncond .chem{white-space:normal;overflow-wrap:anywhere}

/* practice + task */
.ak-tf{display:block;font-size:.85em;color:var(--ink-2);font-weight:400}
.ak-ring{display:block;width:84px;height:auto}
.ak-pchips{margin-top:10px}
.ak-pchips .chip{min-height:36px}
.ak-conds{margin:6px 0 10px;padding-left:1.3em}
.ak-menu{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ak-menu .ak-sub,.ak-menu p{flex-basis:100%;margin:4px 0 0}
.ak-menu .btn{min-height:36px}
.ak-menu .btn:disabled{opacity:.5}
.ak-tkr{flex-basis:100%;margin-top:6px}
#ak-tkview{margin-bottom:6px}
#ak-tkprod{margin-top:10px}

@media (max-width:760px){
  .ak-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "ctrl" "read"}
  .ak-molrow.two{grid-template-columns:minmax(0,1fr)}
  .rg.seg button{padding:.4em .6em}
  .ak-modes .rg.seg{display:flex}

/span>","eqSize":"sm","eqLabel":"R C H O, an aldehyde, and R C O R prime, a ketone","headline":"Where the C=O sits changes everything","text":"The \u003cstrong>carbonyl group\u003c/strong>, C=O, gives cinnamon, vanilla and almonds their smells. At the \u003cstrong>end\u003c/strong> of a chain it makes an \u003cstrong>aldehyde\u003c/strong>; in the \u003cstrong>middle\u003c/strong>, a \u003cstrong>ketone\u003c/strong>. That one difference decides how the molecule is named and whether it can be oxidized.","fig":{"html":"\u003cdiv class=\"ak-hx\">\u003csvg class=\"ak-hx-svg\" id=\"ak-hx-svg\" viewBox=\"0 0 560 320\" role=\"img\" aria-label=\"Propanal, a three-carbon chain with its C=O at C1, shown with δ− on the oxygen and δ+ on the carbon. The C=O slides to C2 and the hydrogens on C2 hop to C1: the label changes to propanone. Then an [O] token approaches each molecule: propanal becomes propanoic acid, with an OH where its H was; propanone shrugs it off, with no H to replace.\">\u003c/svg>\u003cdiv class=\"ak-hx-row\">\u003cp class=\"ak-hx-cap\" id=\"ak-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ak-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can identify the carbonyl group and tell an aldehyde from a ketone.","I can name and draw aldehydes and ketones, including methanal and propanone.","I can explain the boiling points and solubility of aldehydes and ketones compared with alkanes and alcohols.","I can explain why aldehydes oxidize easily but ketones don’t, and use this to tell them apart.","I can connect aldehydes and ketones to alcohol oxidation and to everyday substances."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Alcohol oxidation","goal":5,"prompt":"Oxidizing a secondary alcohol gives…","options":[{"t":"nothing","why":"Tertiary alcohols don’t react; secondary ones do.","_n":"0702","_k":"adabad67"},{"t":"a carboxylic acid","why":"Only primary alcohols go that far.","_n":"1712","_k":"cf2bd06f"},{"t":"a ketone","why":"Module 03.","_n":"2722","_k":"d68c90b8"},{"t":"an aldehyde","why":"That’s from a primary alcohol.","_n":"3732","_k":"91d2f2f3"}],"hints":["Recall the oxidation ladder.","Secondary stops after one step.","A ketone."]},{"id":"w2","skill":"Alcohol oxidation","goal":5,"prompt":"Which alcohol oxidizes to propanal?","options":[{"t":"propane","why":"Not an alcohol.","_n":"4742","_k":"5af0e8d7"},{"t":"2-methylpropan-2-ol","why":"Tertiary: no reaction.","_n":"5752","_k":"a1b08e5f"},{"t":"propan-2-ol","why":"That gives propanone.","_n":"6762","_k":"61d91403"},{"t":"propan-1-ol","why":"Primary → aldehyde.","_n":"7772","_k":"c2643ea8"}],"hints":["An aldehyde comes from which class?","Primary.","propan-1-ol."]},{"id":"w3","skill":"Intermolecular forces","goal":3,"prompt":"Which force acts between molecules with permanent dipoles but no O–H, N–H or F–H?","options":[{"t":"dipole–dipole","why":"Permanent dipoles attract (plus London forces).","_n":"8782","_k":"b7cb63d4"},{"t":"ionic bonding","why":"No ions.","_n":"9830","_k":"a44f0932"},{"t":"hydrogen bonding","why":"Needs H on O, N or F.","_n":"a820","_k":"21b12d5b"},{"t":"covalent bonding","why":"That’s within molecules.","_n":"b810","_k":"d7f6fda3"}],"hints":["Polar, but no O–H.","Permanent dipoles attract.","Dipole–dipole."]},{"id":"w4","skill":"Intermolecular forces","goal":3,"prompt":"Which bond is most polar?","options":[{"t":"C=O","why":"O is much more electronegative than C (3.44 vs 2.55).","_n":"c800","_k":"ca6402a8"},{"t":"C–H","why":"ΔEN 0.35: nearly nonpolar.","_n":"d870","_k":"27de5d53"},{"t":"H–H","why":"ΔEN 0.","_n":"e860","_k":"2ef0836b"},{"t":"C–C","why":"ΔEN 0.","_n":"f850","_k":"a9d26563"}],"hints":["Compare electronegativities.","ΔEN for C=O is 0.89.","C=O."]},{"id":"w5","skill":"Naming","goal":2,"prompt":"Which suffix shows an alcohol?","options":[{"t":"-one","why":"That shows a ketone.","_n":"g840","_k":"c283d1cb"},{"t":"-oic acid","why":"That shows a carboxylic acid.","_n":"h8b0","_k":"750e98ba"},{"t":"-ol","why":"ethan-ol: -ol shows an alcohol.","_n":"i8a0","_k":"fbbd6423"},{"t":"-al","why":"That shows an aldehyde.","_n":"j890","_k":"fde875e3"}],"hints":["ethan-ol.","-ol.","-ol."]},{"id":"w6","skill":"Naming","goal":2,"prompt":"In propan-2-ol, what does the 2 tell you?","options":[{"t":"The OH is on carbon 2","why":"Numbers before a suffix are locants: they give positions.","_n":"k8a0","_k":"8b81c625"},{"t":"There are 2 carbons","why":"prop- means 3.","_n":"l870","_k":"a6531c1b"},{"t":"There are 2 OH groups","why":"That would be a diol.","_n":"m880","_k":"0ff222dd"},{"t":"It’s a secondary alcohol","why":"That’s true here, but the number is a locant.","_n":"n850","_k":"fbea3c2b"}],"hints":["Numbers before a suffix are locants.","They give positions.","OH on C2."]}],"refreshers":{"Alcohol oxidation":"Primary → aldehyde → acid; secondary → ketone; tertiary → no reaction.","Intermolecular forces":"London \u003c dipole–dipole \u003c hydrogen bonding, for molecules of similar size.","Naming":"Root = chain length; suffix = family; locant = position."}}},"explore":{"heading":"Carbonyl explorer","intro":"Slide a C=O along a carbon chain. Watch the family, the name, the polarity and the boiling point change.","how":"Set the number of carbons and slide the C=O along the chain (arrow keys work on both sliders). Add one methyl branch if you like. Choose a mode to compare boiling points, see the polarity and water, or browse everyday molecules. Press \u003cstrong>Pin for comparison\u003c/strong> to keep a molecule beside the one you build next.","modes":[{"id":"prop","t":"Properties"},{"id":"pol","t":"Polarity view"},{"id":"gal","t":"Everyday molecules"}],"gallery":[{"id":"methanal","name":"methanal (formaldehyde)","use":"preservative","fam":"aldehyde","f":"CH2O","cond":"HCHO","bonded":"two H","ox":"yes → methanoic acid","note":"A solution of methanal in water preserves biological specimens."},{"id":"ethanal","name":"ethanal (acetaldehyde)","use":"made when ethanol is oxidized","fam":"aldehyde","f":"C2H4O","cond":"CH3CHO","bonded":"one carbon and one H","ox":"yes → ethanoic acid","note":"Ethanal is the first product when ethanol is oxidized (module 03)."},{"id":"propanone","name":"propanone (acetone)","use":"nail-polish remover","fam":"ketone","f":"C3H6O","cond":"CH3COCH3","bonded":"two carbons","ox":"no","note":"The smallest ketone. It mixes with water and dissolves nonpolar substances too, and it evaporates easily."},{"id":"butanedione","name":"butanedione","use":"butter flavour","fam":"ketone (two ketone groups)","f":"C4H6O2","cond":"CH3COCOCH3","bonded":"two carbons (each C=O)","ox":"no: neither carbonyl carbon has an H","note":"Two C=O groups, and each carbonyl carbon is bonded to two carbons."},{"id":"benzaldehyde","name":"benzaldehyde","use":"almond flavour","fam":"aldehyde","f":"C7H6O","cond":"C6H5CHO","bonded":"one carbon (in the ring) and one H","ox":"yes → benzoic acid","note":"Left in an open bottle, air slowly oxidizes it to white crystals of benzoic acid."},{"id":"cinnamaldehyde","name":"cinnamaldehyde","use":"cinnamon flavour","fam":"aldehyde","f":"C9H8O","cond":"C6H5CH=CHCHO","bonded":"one carbon and one H","ox":"yes → a carboxylic acid","note":"A benzene ring, a C=C and a –CHO group. The –CHO group is the aldehyde."},{"id":"vanillin","name":"vanillin","use":"vanilla flavour","fam":"aldehyde","f":"C8H8O3","cond":"C6H3(OH)(OCH3)CHO","bonded":"one carbon (in the ring) and one H","ox":"yes → a carboxylic acid","note":"Besides the –CHO group, vanillin has an –OH and an –OCH₃ group on its ring."}],"predictions":[{"id":"p1","prompt":"Slide the C=O from C1 to C2. What do you have now?","options":[{"t":"a ketone, propanone","_n":"o860","_k":"238aab9e"},{"t":"an ether","_n":"p830","_k":"d3c84cd3"},{"t":"an alcohol","_n":"q840","_k":"6c21122d"},{"t":"a different aldehyde, propan-2-al","_n":"r910","_k":"7d759c1c"}],"explain":"The carbonyl carbon now has two carbon neighbours, and the label flips. A middle C=O is a ketone."},{"id":"p2","prompt":"Butane (58 g/mol) boils at −1 °C and propan-1-ol (60 g/mol) at 97 °C. Propanal boils at…","options":[{"t":"above 97 °C","_n":"s920","_k":"c7cad29a"},{"t":"below −1 °C","_n":"t8f0","_k":"97c2f312"},{"t":"the same as propan-1-ol","_n":"u8e0","_k":"6c47ad48"},{"t":"about 48 °C, between them","_n":"v910","_k":"db6a0553"}],"explain":"Dipole–dipole forces beat London forces, but there’s no O–H for hydrogen bonding."},{"id":"p3","prompt":"Will propanone dissolve in water?","options":[{"t":"no, it floats","_n":"w900","_k":"b030438c"},{"t":"only when heated","_n":"x930","_k":"20063848"},{"t":"it reacts with water","_n":"y920","_k":"0b64eca4"},{"t":"yes, completely","_n":"z950","_k":"dbdc3453"}],"explain":"Water’s O–H can H-bond to the C=O oxygen."},{"id":"p4","prompt":"Which one is oxidized?","options":[{"t":"both","_n":"10940","_k":"8d227d64"},{"t":"butanone only","_n":"11870","_k":"38e4539d"},{"t":"butanal only","_n":"12860","_k":"ca9476e4"},{"t":"neither","_n":"13950","_k":"ce6f266e"}],"explain":"Only the aldehyde has an H on its carbonyl carbon."}],"chalIntro":"Use the explorer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. For challenge 2, pin one molecule, then build the other. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build pentan-3-one.","why":"Pentan-3-one, CH₃CH₂COCH₂CH₃: 5 carbons, with the C=O on the middle carbon.","hints":["5 carbons.","The C=O on the middle carbon.","CH₃CH₂COCH₂CH₃."]},{"id":"tc2","goal":[1,2],"prompt":"Build an aldehyde and a ketone that are \u003cstrong>isomers\u003c/strong> of each other, each with 4 carbons.","why":"Same formula, C₄H₈O, different families. Only one C₄ ketone exists, butanone; butanal and 2-methylpropanal are its aldehyde isomers.","hints":["Same formula, C₄H₈O.","Only one C₄ ketone exists.","Butanone, plus butanal or 2-methylpropanal."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Build ne test can tell an aldehyde from a ketone."},{"id":"j4","q":"What still confuses you about naming carbonyl compounds? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Name CH₃CH₂CH₂CHO.","options":[{"t":"butanone","why":"C=O at the end: aldehyde. Check the carbonyl carbon: an H on it means aldehyde; two carbons on it means ketone.","_n":"2h931","_k":"ae421e1d"},{"t":"propanal","why":"Count the CHO carbon too. The CHO carbon is C1 of the chain. Count it, and don’t add a locant.","_n":"2i921","_k":"815147c9"},{"t":"butan-1-ol","why":"That’s the alcohol.","_n":"2j911","_k":"a8e72391"},{"t":"butanal","why":"4 carbons including the CHO carbon.","_n":"2k901","_k":"13469fda"}]},"b":{"prompt":"Name CH₃COCH₂CH₂CH₃.","options":[{"t":"butanone","why":"Count again: 5 carbons.","_n":"2l971","_k":"b04057d5"},{"t":"pentan-2-one","why":"5 carbons, numbered so the C=O gets the lowest locant: C2.","_n":"2m961","_k":"7fb78126"},{"t":"pentan-4-one","why":"Give the C=O the lowest locant.","_n":"2n951","_k":"992d6481"},{"t":"pentanal","why":"C=O inside the chain: ketone. Check the carbonyl carbon: an H on it means aldehyde; two carbons on it means ketone.","_n":"2o941","_k":"15cd05d5"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which compound is a ketone?","options":[{"t":"CH₃CH₂CH₂OH","why":"Alcohol.","_n":"2p8b1","_k":"74594bcf"},{"t":"CH₃CH₂COCH₃","why":"C=O between two carbons.","_n":"2q8a1","_k":"f828f2de"},{"t":"CH₃CH₂CH₂CHO","why":"Aldehyde. Check the carbonyl carbon: an H on it means aldehyde; two carbons on it means ketone.","_n":"2rf51","_k":"be27b170"},{"t":"CH₃CH₂COOH","why":"Carboxylic acid.","_n":"2sf41","_k":"36173a7c"}]},"b":{"prompt":"Which compound is an aldehyde?","options":[{"t":"CH₃OCH₃","why":"Ether.","_n":"2tf71","_k":"fcab29cc"},{"t":"CH₃OH","why":"Alcohol.","_n":"2uf61","_k":"04513908"},{"t":"HCHO","why":"Methanal: the carbonyl carbon carries H.","_n":"2vf91","_k":"658e7e83"},{"t":"CH₃COCH₃","why":"Ketone. Check the carbonyl carbon: an H on it means aldehyde; two carbons on it means ketone.","_n":"2wf81","_k":"150743f4"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which compound gives a silver mirror in Tollens’ test?","options":[{"t":"ethanol","why":"Tollens’ reagent doesn’t oxidize alcohols.","_n":"2xfb1","_k":"84730379"},{"t":"ethanal","why":"An aldehyde is oxidized.","_n":"2yfa1","_k":"54d31a20"},{"t":"propanone","why":"Ketones don’t react. A ketone’s carbonyl carbon has no H to replace, so mild oxidizers leave it alone.","_n":"2zed1","_k":"1b23ea54"},{"t":"ethane","why":"No functional group to oxidize.","_n":"30ec1","_k":"7f1080de"}]},"b":{"prompt":"Which compound does \u003cstrong>not\u003c/strong> react with a mild oxidizing agent?","options":[{"t":"butanal","why":"Aldehydes oxidize to acids.","_n":"316f1","_k":"f825d96f"},{"t":"butanone","why":"Ketone. A ketone’s carbonyl carbon has no H to replace, so mild oxidizers leave it alone.","_n":"32701","_k":"9b00221a"},{"t":"butan-1-ol","why":"Primary alcohols oxidize.","_n":"336d1","_k":"80b05eef"},{"t":"propanal","why":"Aldehyde.","_n":"346e1","_k":"5cceb4f9"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Order by boiling point, lowest first: butane, propanal, propan-1-ol (all ≈ 58–60 g/mol).","options":[{"t":"butane \u003c propan-1-ol \u003c propanal","why":"No O–H, so no H-bonds between molecules. Dipole–dipole forces only.","_n":"356b1","_k":"6838d5f7"},{"t":"propanal \u003c butane \u003c propan-1-ol","why":"The polar aldehyde boils above butane.","_n":"366c1","_k":"40fe0dd5"},{"t":"butane \u003c propanal \u003c propan-1-ol","why":"London only; plus dipole–dipole; plus H-bonds.","_n":"37691","_k":"46011b15"},{"t":"All about the same","why":"Similar masses, different forces.","_n":"386a1","_k":"df540c21"}]},"b":{"prompt":"Order by boiling point, lowest first: pentane, butanone, butan-1-ol (all ≈ 72–74 g/mol).","options":[{"t":"butanone \u003c pentane \u003c butan-1-ol","why":"Butanone’s dipole raises its boiling point.","_n":"39771","_k":"37f9da15"},{"t":"All about the same","why":"Similar masses, different forces.","_n":"3a781","_k":"7509dcc2"},{"t":"pentane \u003c butan-1-ol \u003c butanone","why":"No O–H, so no H-bonds between molecules. Dipole–dipole forces only.","_n":"3b691","_k":"47b0f057"},{"t":"pentane \u003c butanone \u003c butan-1-ol","why":"36 °C, 80 °C, 118 °C.","_n":"3c681","_k":"46f3ce00"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Alcohol X, C₃H₈O, is oxidized to Y. Y gives a positive Benedict’s test. What is X?","options":[{"t":"propan-2-ol","why":"That gives propanone: negative test.","_n":"3d671","_k":"13e85fbf"},{"t":"propanone","why":"Not C₃H₈O, and not an alcohol.","_n":"3e661","_k":"19027e93"},{"t":"propan-1-ol","why":"Primary → propanal, an aldehyde.","_n":"3f6d1","_k":"aa693bf5"},{"t":"methoxyethane","why":"An ether doesn’t oxidize.","_n":"3g6c1","_k":"c6232944"}]},"b":{"prompt":"Alcohol X, C₄H₁₀O, is oxidized to Y. Y does \u003cstrong>not\u003c/strong> react with Tollens’ reagent. What is X?","options":[{"t":"butan-2-ol","why":"Secondary → butanone.","_n":"3h6b1","_k":"ca0271bd"},{"t":"2-methylpropan-1-ol","why":"That gives an aldehyde: positive.","_n":"3i6a1","_k":"12f6d540"},{"t":"butan-1-ol","why":"That gives butanal: positive.","_n":"3j711","_k":"a3c47768"},{"t":"2-methylpropan-2-ol","why":"Tertiary: it isn’t oxidized at all, so there’s no Y.","_n":"3k701","_k":"d3235e80"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"How many aldehydes and ketones have the formula C₄H₈O?","options":[{"t":"2","why":"Don’t forget the branched aldehyde.","_n":"3l630","_k":"3ec9eae8"},{"t":"3","why":"butanal, 2-methylpropanal, butanone.","_n":"3m640","_k":"04f5a175"},{"t":"4","why":"Butan-2-one and butanone are the same molecule.","_n":"3n650","_k":"d7554a8c"},{"t":"5","why":"Only three distinct structures.","_n":"3o660","_k":"64c15692"}]},"b":{"prompt":"How many ketones have the formula C₅H₁₀O?","options":[{"t":"2","why":"Don’t forget the branched ketone.","_n":"3p670","_k":"7ef1cd10"},{"t":"3","why":"pentan-2-one, pentan-3-one, 3-methylbutan-2-one.","_n":"3q680","_k":"518ffa8d"},{"t":"4","why":"Pentan-4-one is pentan-2-one.","_n":"3r690","_k":"bc4c631c"},{"t":"7","why":"That includes the four aldehydes.","_n":"3s6a0","_k":"34ab0981"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why propanone dissolves in water?","options":[{"t":"“Propanone has an O–H group.”","why":"It doesn’t.","_n":"3t6b0","_k":"2e422851"},{"t":"“Its C=O oxygen accepts hydrogen bonds from water molecules, and its small carbon groups don’t block it.”","why":"Water’s O–H can H-bond to the C=O oxygen.","_n":"3u6c0","_k":"b989c77a"},{"t":"“Propanone reacts with water to form an alcohol.”","why":"It dissolves without reacting.","_n":"3v6d2","_k":"0b62732f"},{"t":"“All organic compounds dissolve in water.”","why":"Alkanes don’t.","_n":"3w6c2","_k":"dee476a5"}]},"b":{"prompt":"Which is the best explanation of why butanal boils at 75 °C but butan-1-ol at 118 °C?","options":[{"t":"“Butanal has no O–H, so its molecules attract by dipole–dipole forces, not hydrogen bonds.”","why":"No O–H, so no H-bonds between molecules. Dipole–dipole forces only.","_n":"3x6f2","_k":"06a02be0"},{"t":"“Butanal is much heavier.”","why":"It’s slightly lighter.","_n":"3y6e2","_k":"f92e9785"},{"t":"“Butanal’s hydrogen bonds are weaker.”","why":"No O–H, so no H-bonds between molecules. Dipole–dipole forces only.","_n":"3z692","_k":"73e381f2"},{"t":"“Butanal is nonpolar.”","why":"Its C=O is polar.","_n":"40682","_k":"c480c9a8"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which statement best explains why aldehydes are oxidized but ketones aren’t?","options":[{"t":"“An aldehyde’s carbonyl carbon has an H that can be replaced by OH; a ketone’s carbonyl carbon is bonded to two carbons instead.”","why":"Only the aldehyde has an H on its carbonyl carbon.","_n":"416b2","_k":"4ef80878"},{"t":"“Ketones have no C=O.”","why":"They do.","_n":"426a2","_k":"fd366f97"},{"t":"“Aldehydes have an O–H group.”","why":"They don’t.","_n":"43752","_k":"cc101ed9"},{"t":"“Ketones are always larger molecules.”","why":"Size isn’t the reason. A ketone’s carbonyl carbon has no H to replace, so mild oxidizers leave it alone.","_n":"44742","_k":"b017c733"}]},"b":{"prompt":"Which equation shows the oxidation of ethanal?","options":[{"t":"CH₃CHO + [O] → CH₃COOH","why":"The H on the carbonyl carbon becomes OH: ethanal → ethanoic acid.","_n":"45671","_k":"67a0b4e8"},{"t":"CH₃CHO + H₂ → CH₃CH₂OH","why":"That’s reduction.","_n":"46681","_k":"f9e20d43"},{"t":"CH₃CHO + [O] → CH₃COCH₃","why":"Oxidation doesn’t add a carbon.","_n":"47651","_k":"9d875a7b"},{"t":"CH₃CHO → CH₄ + CO","why":"Not an oxidation.","_n":"48661","_k":"01c3d29b"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Benzaldehyde (almond flavour) left in an open bottle slowly forms white crystals of benzoic acid. What happened?","options":[{"t":"It was reduced to an alcohol","why":"Air oxidizes; it doesn’t reduce.","_n":"496b1","_k":"f53dbb26"},{"t":"The aldehyde was oxidized by oxygen in the air to a carboxylic acid","why":"The H on its carbonyl carbon became OH: benzaldehyde → benzoic acid.","_n":"4a6c1","_k":"1ae0e958"},{"t":"It turned into a ketone","why":"Oxidation of an aldehyde gives an acid, not a ketone.","_n":"4b691","_k":"7e1e5652"},{"t":"It evaporated, leaving crystals of the same compound","why":"Benzoic acid is a new substance.","_n":"4c6a1","_k":"37b277cb"}]},"b":{"prompt":"Propanone is used in nail-polish remover. Which properties make it suitable?","options":[{"t":"It forms hydrogen bonds with itself","why":"No O–H, so no H-bonds between molecules. Dipole–dipole forces only.","_n":"4d6f1","_k":"1b32cc5f"},{"t":"It’s strongly acidic","why":"Ketones aren’t acids.","_n":"4e701","_k":"39ecc03f"},{"t":"It has a very high boiling point","why":"56 °C is low.","_n":"4f011","_k":"6929d260"},{"t":"It dissolves both polar and nonpolar substances, and it evaporates easily (56 °C)","why":"Its polar C=O and its small nonpolar CH₃ groups let it dissolve both kinds, and 56 °C is a low boiling point.","_n":"4g001","_k":"4c08a5cb"}]}},{"id":"a2","cat":"A","goal":1,"a":{"prompt":"Cinnamaldehyde (cinnamon flavour) has a benzene ring, a C=C and a –CHO group. What result do you expect from Tollens’ test?","options":[{"t":"The C=C is oxidized instead","why":"Tollens’ test responds to the aldehyde.","_n":"4hff1","_k":"953bdd0b"},{"t":"A silver mirror (positive), because it has an aldehyde group","why":"The –CHO group is oxidized, whatever else the molecule carries.","_n":"4ife1","_k":"d4801e1e"},{"t":"No change, because it’s a ketone","why":"The C=O is at the end, with an H. Check the carbonyl carbon: an H on it means aldehyde; two carbons on it means ketone.","_n":"4jfd1","_k":"d5e865db"},{"t":"No change, because the benzene ring blocks the reaction","why":"The CHO group still reacts.","_n":"4kfc1","_k":"de7c090d"}]},"b":{"prompt":"Butanedione (butter flavour), CH₃COCOCH₃, has two C=O groups. Each carbonyl carbon is bonded to two carbons. What result do you expect from Tollens’ test?","options":[{"t":"No mirror (negative): both carbonyls are ketone groups","why":"Each carbonyl carbon is bonded to two carbons: no H to replace.","_n":"4lfb1","_k":"2f452270"},{"t":"A mirror, because it has two C=O groups","why":"Ketone groups don’t react. A ketone’s carbonyl carbon has no H to replace, so mild oxidizers leave it alone.","_n":"4mfa1","_k":"030aa061"},{"t":"A brick-red precipitate","why":"That’s a Benedict’s result, and it would need an aldehyde.","_n":"4nf91","_k":"f6cd109e"},{"t":"A mirror, because it’s an aldehyde","why":"Check the carbonyl carbon: an H on it means aldehyde; two carbons on it means ketone.","_n":"4of81","_k":"71261cc2"}]}}]},"task":{"title":"Ketone factory","summary":"Ketone factory","statement":"\u003cp>Choose an alcohol that a factory can oxidize into a ketone, then name the ketone. Can you find every answer?\u003c/p>\u003col class=\"ak-conds\">\u003cli>The alcohol has 5 carbons (C₅H₁₂O).\u003c/li>\u003cli>It can be oxidized by [O].\u003c/li>\u003cli>The product gives a negative Tollens’ test.\u003c/li>\u003cli>You named the product correctly.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Tap an atom in the builder, then use the buttons under it: add a C, put the –OH on a carbon, or remove an end atom. Hydrogen atoms fill in automatically, and the builder checks valence (C makes 4 bonds; the O is always an –OH). Then name the product with the chips.\u003c/p>","checks":["5-carbon alcohol","Oxidizable","Negative Tollens’ product","Product named correctly"],"tips":["Count all carbons, including branches.","Tertiary alcohols don’t oxidize.","A primary alcohol makes an aldehyde, which gives a mirror.","The ketone keeps the same carbon skeleton; give the C=O the lowest locant."],"explainPrompt":"Explain how the alcohol’s class decides whether the product passes the Tollens’ test.","vocab":"Use the words secondary, oxidation, ketone and aldehyde.","after3":"Every answer is a secondary alcohol. The ketone’s C=O sits exactly where the alcohol’s OH was."},"cards":[["Carbonyl group","C=O; polar (δ− on O, δ+ on C)."],["Aldehyde","C=O at the end, with H on the carbonyl carbon; suffix -al (propanal)."],["Ketone","C=O inside the chain, bonded to two carbons; suffix -one (pentan-2-one)."],["Aldehyde numbering","The CHO carbon is C1; no locant for it."],["Smallest ketone","Propanone (3 carbons), also called acetone."],["Boiling points","Alkane \u003c aldehyde or ketone \u003c alcohol, for similar molar masses."],["Solubility","Small aldehydes and ketones dissolve: water H-bonds to the carbonyl O."],["Oxidation","Aldehyde → carboxylic acid; ketones resist oxidation."],["Tollens’ test","Silver mirror with aldehydes; no change with ketones."],["Benedict’s test","Blue → brick-red with simple aldehydes; stays blue with ketones."],["From alcohols","Primary alcohol → aldehyde; secondary alcohol → ketone."]]}};</script>
