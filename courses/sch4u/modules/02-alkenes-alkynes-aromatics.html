.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}

}

003cspan class=\"nw\">CH₂Br–CH₂Br\u003c/span>","eqSize":"sm","eqLabel":"C H 2 double bond C H 2, plus B r 2, gives C H 2 B r, single bond, C H 2 B r","headline":"A double bond is a place where atoms can add","text":"Alkanes are saturated: every carbon already has four single bonds. \u003cstrong>Alkenes\u003c/strong> and \u003cstrong>alkynes\u003c/strong> have double or triple bonds, so they’re \u003cstrong>unsaturated\u003c/strong>: atoms can \u003cstrong>add\u003c/strong> across the multiple bond. \u003cstrong>Aromatic\u003c/strong> compounds like benzene look unsaturated on paper but behave very differently.","fig":{"html":"\u003cdiv class=\"ae-hx\">\u003csvg class=\"ae-hx-svg\" id=\"ae-hx-svg\" viewBox=\"0 0 640 420\" role=\"img\" aria-label=\"Ethene, a flat molecule with 120° angles, meets Br₂. The double bond opens, one Br adds to each carbon, and the molecule becomes 1,2-dibromoethane with 109.5° angles while orange-brown bromine water turns colourless. Then Br₂ bounces off a benzene ring: no catalyst, no reaction.\">\u003c/svg>\u003cdiv class=\"ae-hx-row\">\u003cp class=\"ae-hx-cap\" id=\"ae-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"ae-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can name and draw alkenes and alkynes, giving the multiple bond the lowest locant.","I can name simple aromatic compounds such as methylbenzene and 1,4-dimethylbenzene.","I can predict the products of addition reactions, using Markovnikov’s rule.","I can explain why benzene undergoes substitution rather than addition.","I can tell saturated from unsaturated compounds using formulas and the bromine test.","I can compare the shapes and rotation of single, double and triple bonds."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Naming alkanes","goal":1,"prompt":"Name CH₃CH(CH₃)CH₂CH₃.","options":[{"t":"2-methylbutane","why":"4-carbon chain, methyl on C2.","_n":"0e82","_k":"f473afd9"},{"t":"3-methylbutane","why":"Lowest locant: 2.","_n":"1eb2","_k":"f373c365"},{"t":"isopentane","why":"That’s a common name; the IUPAC name is 2-methylbutane.","_n":"2ea2","_k":"6862025d"},{"t":"2-methylpentane","why":"Count the chain again: 4.","_n":"3e52","_k":"25545800"}],"hints":["Longest chain?","4 carbons, methyl on C2.","2-methylbutane."]},{"id":"w2","skill":"Naming alkanes","goal":1,"prompt":"Which part of a name tells you the number of carbons in the parent chain?","options":[{"t":"The suffix","why":"The suffix tells the family (-ane, -ene).","_n":"4e42","_k":"979e0c4e"},{"t":"The prefix (methyl, chloro)","why":"Prefixes are substituents.","_n":"5e72","_k":"b5fefb48"},{"t":"The root (meth-, eth-, prop-, but-, pent-…)","why":"but- means 4.","_n":"6e62","_k":"1f1df7dd"},{"t":"The locant","why":"Locants give positions.","_n":"7f12","_k":"59c74971"}],"hints":["but-ane, but-ene: what’s shared?","The root.","Root = chain length."]},{"id":"w3","skill":"Formulas","goal":5,"prompt":"Which formula fits a saturated open-chain hydrocarbon?","options":[{"t":"C₆H₁₄","why":"CₙH₂ₙ₊₂.","_n":"8f02","_k":"0f699be8"},{"t":"C₆H₁₀","why":"Four H short.","_n":"9b6a","_k":"a626bcf9"},{"t":"C₆H₆","why":"Far too few H: that’s benzene.","_n":"ab7a","_k":"96eb94b4"},{"t":"C₆H₁₂","why":"Two H short: a ring or a double bond.","_n":"bb8a","_k":"c7ee1964"}],"hints":["Saturated alkanes are CₙH₂ₙ₊₂.","\u003ci>n\u003c/i> = 6 gives 14.","C₆H₁₄."]},{"id":"w4","skill":"Bonding and shape","goal":6,"prompt":"What is the bond angle around a carbon with four single bonds?","options":[{"t":"120°","why":"That’s trigonal planar, as around a C=C.","_n":"cb9a","_k":"6d5a5900"},{"t":"109.5°","why":"Tetrahedral.","_n":"db2a","_k":"25ffce2b"},{"t":"180°","why":"That’s linear, as around C≡C.","_n":"eb3a","_k":"df4e666c"},{"t":"90°","why":"Electron groups spread as far apart as possible.","_n":"fb4a","_k":"1930acdc"}],"hints":["Four groups around the carbon.","Tetrahedral.","109.5°."]},{"id":"w5","skill":"Bonding and shape","goal":6,"prompt":"How many electrons are shared in a C=C double bond?","options":[{"t":"2","why":"That’s a single bond.","_n":"gb5a","_k":"ec9bc310"},{"t":"4","why":"Two pairs.","_n":"haea","_k":"7cf97361"},{"t":"6","why":"That’s a triple bond.","_n":"iafa","_k":"3216b214"},{"t":"8","why":"Too many.","_n":"j28b","_k":"8488f87d"}],"hints":["A single bond shares one pair.","A double bond shares two pairs.","4 electrons."]},{"id":"w6","skill":"Reaction types","goal":3,"prompt":"CH₄ + Cl₂ → CH₃Cl + HCl is which type of reaction?","options":[{"t":"Substitution","why":"An H is replaced by Cl.","_n":"k27b","_k":"09a4f164"},{"t":"Combustion","why":"No O₂.","_n":"l2ab","_k":"57164a16"},{"t":"Addition","why":"Nothing adds; one atom swaps for another.","_n":"m29b","_k":"65ad0aff"},{"t":"Elimination","why":"No double bond forms.","_n":"n24b","_k":"88472ba5"}],"hints":["What happened to one H?","Replaced.","Substitution."]}],"refreshers":{"Naming alkanes":"Root = chain length, suffix = family, prefixes = substituents with locants.","Formulas":"CₙH₂ₙ₊₂ is saturated; each ring or C=C removes 2 H; each C≡C removes 4.","Bonding and shape":"4 groups → 109.5°; 3 groups (around C=C) → 120°; 2 groups (around C≡C) → 180°.","Reaction types":"Substitution swaps an atom; addition adds atoms across a multiple bond; combustion burns in O₂."}}},"explore":{"heading":"Multiple-bond lab","intro":"Build chains with double and triple bonds, see their shapes, and react them with a reagent.","how":"Set the chain length. Tap a C–C bond in the drawing (or Tab to it), then choose single, double or triple; with the keyboard, Enter cycles the bond type. Tap a carbon to see its bond angle and to add or remove the methyl group.","modes":[{"id":"shape","t":"Name and shape"},{"id":"react","t":"Reactions"},{"id":"benz","t":"Benzene vs cyclohexene"}],"reagents":[{"id":"H2","t":"H₂ (metal catalyst)"},{"id":"Br2","t":"Br₂"},{"id":"Cl2","t":"Cl₂"},{"id":"HBr","t":"HBr"},{"id":"HCl","t":"HCl"},{"id":"H2O","t":"H₂O (acid catalyst)"}],"benzReagents":[{"id":"plain","t":"Br₂ (no catalyst)"},{"id":"fe","t":"Br₂ with FeBr₃ catalyst"}],"predictions":[{"id":"p1","prompt":"Propene + HBr. What is the major product?","options":[{"t":"propane","_n":"o23b","_k":"dca1a4ef"},{"t":"2-bromopropane","_n":"p26b","_k":"9831a836"},{"t":"1,2-dibromopropane","_n":"q25b","_k":"1878f337"},{"t":"1-bromopropane","_n":"r30b","_k":"14e66202"}],"explain":"H attaches to C1 (which had 2 H), Br to C2. Markovnikov: H goes to the carbon that already has more H."},{"id":"p2","prompt":"Benzene vs cyclohexene, Br₂ with no catalyst. Which flask loses its orange-brown colour quickly?","options":[{"t":"neither","_n":"s2fb","_k":"225c4082"},{"t":"both","_n":"t22a","_k":"9efdc198"},{"t":"benzene only","_n":"u23a","_k":"1527558c"},{"t":"cyclohexene only","_n":"v20a","_k":"7786a54b"}],"explain":"The cyclohexene flask goes colourless; the benzene flask stays orange-brown. Cyclohexene adds Br₂ across its C=C. Benzene’s delocalized ring resists addition."},{"id":"p3","prompt":"But-2-ene in Name and shape mode. Try to rotate the C2=C3 bond. What happens?","options":[{"t":"the molecule breaks apart","_n":"w21a","_k":"45d02db4"},{"t":"it rotates 90° then stops","_n":"x26a","_k":"439f29c0"},{"t":"it won’t rotate","_n":"y27a","_k":"84cb14cf"},{"t":"it spins freely","_n":"z24a","_k":"f6f067e0"}],"explain":"The handle resists: rotating would break the π bond. That’s why cis and trans forms exist (module 11)."},{"id":"p4","prompt":"Ethyne + H₂ (metal catalyst), with “add twice” on. What forms?","options":[{"t":"ethene","_n":"1025a","_k":"5af329ee"},{"t":"nothing","_n":"112aa","_k":"6efb3f3b"},{"t":"methane","_n":"122ba","_k":"187396f7"},{"t":"ethane","_n":"13a4a","_k":"e60c160a"}],"explain":"One H₂ gives ethene, the second gives ethane. A triple bond can add two molecules of H₂."}],"chalIntro":"Use the Multiple-bond lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Build \u003cstrong>but-2-ene\u003c/strong>.","why":"CH₃CH=CHCH₃: 4 carbons, with the double bond starting at C2 from either end.","hints":["4 carbons.","The double bond must start at C2 from either end.","CH₃CH=CHCH₃."]},{"id":"tc2","goal":3,"prompt":"In \u003cstrong>Reactions\u003c/strong> mode, choose an alkene and a reagent that give \u003cstrong>2-chlorobutane as the only product\u003c/strong>.","why":"A symmetric alkene gives one product: but-2-ene + HCl.","hints":["A symmetric alkene gives one product.","Which butene has the same groups on both C=C carbons?","but-2-ene + HCl."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Design the starting alkene so that adding water (acid catalyst) gives \u003cstrong>2-methylpropan-2-ol\u003c/strong> as the major product.","why":"CH₂=C(CH₃)₂: H adds to CH₂, OH to the central carbon.","hints":["Work backwards: where is the OH? On a carbon bonded to three other carbons.","That carbon must be the C=C carbon with fewer H.","CH₂=C(CH₃)₂: H adds to CH₂, OH to the central carbon."]}],"blocks":[{"title":"What the lab shows","html":"\u003cp>The multiple bond is the reactive site \u003cstrong>and\u003c/strong> the rigid part of the molecule. Markovnikov’s rule decides where the atoms go when HX or H₂O adds. Benzene’s delocalized ring stays intact.\u003c/p>"}]},"part3":{"slug":"bromine-test","name":"Bromine test","heading":"Test for unsaturation","intro":"Bromine water is orange-brown. A multiple bond adds Br₂, and the colour disappears. Run the test on six samples, choose a control, then compare two oils. Bromine and benzene are hazardous, so this test is virtual only: no procedure or amounts are given.","s1":{"title":"Station 1: Run the test","intro":"Tap a sample to add bromine water (in the dark, no catalyst). Read the observation card, then record what you saw in the results table.","samples":[{"id":"hexane","name":"hexane","f":"C6H14","dec":false},{"id":"hexene","name":"hex-1-ene","f":"C6H12","dec":true,"prod":"1,2-dibromohexane","eq":"CH2=CHCH2CH2CH2CH3 + Br2 -> CH2BrCHBrCH2CH2CH2CH3"},{"id":"chx","name":"cyclohexane","f":"C6H12","dec":false},{"id":"chxe","name":"cyclohexene","f":"C6H10","dec":true,"prod":"1,2-dibromocyclohexane","eq":"C6H10 + Br2 -> C6H10Br2"},{"id":"benz","name":"benzene","f":"C6H6","dec":false},{"id":"oil","name":"a vegetable oil","f":"","dec":true,"prod":"Br adds across each C=C in the oil’s chains (a dibromo unit at every C=C)"}],"yes":"orange-brown → colourless within seconds","no":"stays orange-brown","tableNote":"Record each observation. The last column fills in once your record matches the card."},"s2":{"title":"Station 2: Controls and conclusions","q":"Which sample is the best negative control, and why?","options":[{"t":"cyclohexane","why":"No multiple bond, but it’s a ring: it differs from hex-1-ene in more than one way.","_n":"14a3a","_k":"2c166655"},{"t":"hex-1-ene","why":"Hex-1-ene decolourizes the bromine water: it’s a positive result, not a negative control.","_n":"15a2a","_k":"abdbd091"},{"t":"hexane","why":"Same carbon count as hex-1-ene, no multiple bonds: it shows what ‘no reaction’ looks like.","_n":"16a1a","_k":"42f6c536"},{"t":"benzene","why":"Benzene also stays coloured, but it differs from hex-1-ene in more than one way, so hexane is the cleaner control.","_n":"17a8a","_k":"6349f64d"}],"data":"\u003cp>The addition product for each positive sample. Hexane and hex-1-ene have the same number of carbons and similar boiling points, so the C=C is the only real difference.\u003c/p>"},"s3":{"title":"Station 3: How unsaturated?","intro":"Add bromine one unit at a time to 1 g of each oil. While C=C bonds remain, the colour disappears; once they’re used up, the orange-brown stays. Model data.","cap":{"P":2,"Q":1},"q":"Oil P absorbs 2 units of bromine per gram; oil Q absorbs 1. Compared with Q, how many C=C bonds per gram does P have?","options":[{"t":"the same number","why":"Different uptake means different numbers of C=C bonds.","_n":"18a7a","_k":"2aac04b5"},{"t":"four times as many","why":"2 units vs 1 unit is a ratio of 2, not 4.","_n":"19a6a","_k":"02b80859"},{"t":"half as many","why":"P absorbed \u003cstrong>more\u003c/strong> bromine: more C=C bonds, not fewer.","_n":"1aa5a","_k":"a71467da"},{"t":"about twice as many","why":"Each C=C adds one Br₂, so twice the bromine means about twice as many C=C bonds per gram.","_n":"1baca","_k":"99dbced8"}],"stse":"\u003cstrong>STSE:\u003c/strong> Margarine is made by adding H₂ (metal catalyst) to some C=C bonds in a liquid vegetable oil. The chains become more saturated, the melting point rises, and the product absorbs less bromine."},"quickCheck":{"title":"Quick check","summary":"Bromine test quick check","items":[{"id":"q1","goal":5,"prompt":"Which decolourizes bromine water quickly?","choices":[{"t":"cyclopentane","fb":"Only the multiple bond adds Br₂.","_n":"1caba","_k":"d2e55647"},{"t":"pent-2-ene","fb":"Right. Only the multiple bond adds Br₂.","_n":"1d1e9","_k":"1aa38384"},{"t":"pentane","fb":"Only the multiple bond adds Br₂.","_n":"1e1f9","_k":"c4056315"},{"t":"benzene","fb":"Only the multiple bond adds Br₂.","_n":"1f209","_k":"2e89dafd"}]},{"id":"q2","goal":3,"prompt":"Product of cyclohexene + Br₂?","choices":[{"t":"bromobenzene","fb":"Addition puts one Br on each C=C carbon.","_n":"1g219","_k":"d81786c1"},{"t":"1,2-dibromocyclohexane","fb":"Right. Addition puts one Br on each C=C carbon.","_n":"1h229","_k":"9de003f6"},{"t":"bromocyclohexane","fb":"Addition puts one Br on each C=C carbon.","_n":"1i239","_k":"e3a078d5"},{"t":"cyclohexane","fb":"Addition puts one Br on each C=C carbon.","_n":"1j249","_k":"518ebb3d"}]},{"id":"q3","goal":5,"prompt":"Why use hexane in the test set?","choices":[{"t":"solvent only","fb":"Same size, no multiple bond: it shows what ‘no reaction’ looks like.","_n":"1k259","_k":"0611ccd9"},{"t":"positive control","fb":"Same size, no multiple bond: it shows what ‘no reaction’ looks like."," hich has none.","_n":"1za8a","_k":"3068e60b"}]},{"id":"r3","kind":"chips","star":true,"goal":3,"prompt":"propyne + 2 HBr (major)","options":[{"t":"2,2-dibromopropane","why":"Markovnikov applies to both additions: Br goes to C2 twice.","_n":"20a9a","_k":"3b373d65"},{"t":"1,2-dibromopropane","why":"Markovnikov applies to both additions: Br goes to C2 twice.","_n":"21a6a","_k":"1b7dff9c"},{"t":"1,1-dibromopropane","why":"The H goes to the carbon that already has more H atoms; the other atom goes to the more substituted carbon.","_n":"22a7a","_k":"ad682472"},{"t":"2-bromopropene","why":"That’s only the first addition: the second HBr adds too.","_n":"23a4a","_k":"04ada688"}],"hints":["First addition: propyne → 2-bromopropene.","Second addition: H to the CH₂ end.","2,2-dibromopropane."]},{"id":"r4","kind":"all","star":true,"goal":3,"prompt":"Select \u003cstrong>all\u003c/strong> alkenes that give 3-bromo-3-methylpentane as the major product with HBr.","options":[{"t":"3-methylpent-2-ene","_n":"24a5a","_k":"fa29e62d"},{"t":"2-ethylbut-1-ene","_n":"25b2a","_k":"a5a14966"},{"t":"3-methylpent-1-ene","why":"Br goes to C2: 2-bromo-3-methylpentane.","_n":"26b3a","_k":"5523cecb"},{"t":"2-methylpent-2-ene","why":"Br on C2: 2-bromo-2-methylpentane.","_n":"272cb","_k":"70146417"}],"why":"3-methylpent-2-ene and 2-ethylbut-1-ene both put Br on the carbon bonded to an ethyl, an ethyl and a methyl.","hints":["Where must the Br end up? On a carbon bonded to an ethyl, an ethyl and a methyl.","That carbon must be the C=C carbon with fewer H.","3-methylpent-2-ene and 2-ethylbut-1-ene both put Br there."]},{"id":"r5","kind":"chips","star":true,"goal":5,"prompt":"\u003cstrong>Investigation:\u003c/strong> Three unlabelled liquids: hexane, hex-1-ene, benzene. Bromine water (dark, no catalyst) decolourizes only liquid B. What is B, and which of the others serves as the negative control?","options":[{"t":"B is hex-1-ene; benzene is the negative control","why":"Benzene also stays coloured, but it differs from hex-1-ene in more than one way, so hexane is the cleaner control.","_n":"282bb","_k":"2fd0c155"},{"t":"B is hexane; benzene is the negative control","why":"Hexane has no multiple bond, so it can’t add Br₂: it stays coloured.","_n":"292ab","_k":"aae1161b"},{"t":"B is hex-1-ene; hexane is the negative control","why":"Only the C=C in hex-1-ene adds Br₂. Hexane has the same carbon count and no multiple bond. Benzene also stays coloured, but it differs from hex-1-ene in more than one way, so hexane is the cleaner control.","_n":"2a29b","_k":"a8c11798"},{"t":"B is benzene; hexane is the negative control","why":"Benzene’s delocalized ring resists addition, so benzene stays coloured. Only the C=C adds Br₂.","_n":"2b28b","_k":"1fc7c4d5"}]},{"id":"r6","kind":"chips","star":true,"goal":5,"prompt":"A hydrocarbon C₆H₁₀ adds exactly 2 mol of H₂ per mole to become hexane. Which could it be?","options":[{"t":"hex-2-yne","why":"C₆H₁₀ with one C≡C: two H₂ add and the open chain becomes hexane, C₆H₁₄.","_n":"2c27b","_k":"e4938a4c"},{"t":"hex-1-ene","why":"C₆H₁₂.","_n":"2d26b","_k":"245a6ded"},{"t":"cyclohexene","why":"It adds only 1 H₂ and gives cyclohexane.","_n":"2e25b","_k":"1362936b"},{"t":"benzene","why":"C₆H₆, not C₆H₁₀.","_n":"2f34b","_k":"a4ea4ec2"}]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Alana","how":"","instruction":"Alana made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Name CH₂=CHCH₂CH₂CH₃.","steps":["The chain has 5 carbons: root pent-.","There is one C=C, so the suffix is -ene.","Number from the right end: the double bond starts at C4.","Name: pent-4-ene."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Follows from step 3."],"fixes":[{"t":"Name it pentane.","why":"The C=C makes it an alkene.","_n":"2g33b","_k":"506ec7dc"},{"t":"Name it pent-1-yne.","why":"Double bond: -ene."," ut a catalyst. With FeBr₃ it substitutes: bromobenzene + HBr.","why":"Benzene’s electrons are delocalized. It stays a ring and substitutes, and only with a catalyst.","_n":"2o25b","_k":"5cf70c36"},{"t":"Step 3 is correct.","why":"Benzene’s electrons are delocalized. It stays a ring and substitutes, and only with a catalyst.","_n":"2p2eb","_k":"760e294e"},{"t":"It burns instead.","why":"No O₂ source here.","_n":"2q2fb","_k":"e68488f0"},{"t":"It adds three Br₂ at once.","why":"Benzene’s electrons are delocalized. It stays a ring and substitutes, and only with a catalyst.","_n":"2r1fd","_k":"0b491ac8"}],"hints":["Does benzene behave like cyclohexene in the bromine test?","No: it stays coloured.","No reaction; substitution only with a catalyst."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you: the double bond refusing to rotate, or benzene ignoring bromine?"},{"id":"j2","q":"In your own words, explain Markovnikov’s rule and when you need it."},{"id":"j3","q":"Explain to a friend how the bromine test tells an alkene from an alkane."},{"id":"j4","q":"Which kind of addition product is still hard for you to predict? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Name CH₃CH=CHCH₂CH₃.","options":[{"t":"pent-3-ene","why":"From the other end it starts at C2.","_n":"2s20d","_k":"cf5a07e6"},{"t":"pent-2-yne","why":"It’s a double bond.","_n":"2t21d","_k":"876d227c"},{"t":"pent-2-ene","why":"Number from the end nearer the C=C.","_n":"2u22d","_k":"e9bdc765"},{"t":"pentene","why":"A locant is needed: there are two possible positions.","_n":"2v1bd","_k":"cd485d60"}]},"b":{"prompt":"Name CH≡CCH(CH₃)CH₃.","options":[{"t":"3-methylbut-1-ene","why":"It’s a triple bond: -yne.","_n":"2w1cd","_k":"c8aec6fc"},{"t":"2-methylbut-3-yne","why":"The triple bond gets the lowest number.","_n":"2x1dd","_k":"aa650c8c"},{"t":"2-methylbutyne","why":"Locants are needed.","_n":"2y1ed","_k":"13a59ee0"},{"t":"3-methylbut-1-yne","why":"Triple bond at C1, methyl on C3.","_n":"2z27d","_k":"3b493a77"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which describes 1,3-dimethylbenzene?","options":[{"t":"A cyclohexane ring with two methyl groups","why":"Benzene is aromatic, not cyclohexane.","_n":"3028d","_k":"ce1d3e9e"},{"t":"Methyl groups on neighbouring ring carbons","why":"That’s 1,2-.","_n":"3125d","_k":"e0e31cf6"},{"t":"A benzene ring with methyl groups on carbons separated by one ring carbon","why":"Ring carbons 1 and 3 have one ring carbon (C2) between them.","_n":"3224d","_k":"d4ea6d63"},{"t":"Methyl groups on opposite ring carbons","why":"That’s 1,4-.","_n":"3323d","_k":"ce7919b2"}]},"b":{"prompt":"Name a benzene ring carrying one CH₂CH₃ group.","options":[{"t":"ethylcyclohexane","why":"The ring is aromatic.","_n":"3422d","_k":"5c74f150"},{"t":"1-ethylhexene","why":"Aromatic rings aren’t named as hexenes.","_n":"3521d","_k":"2ebd7936"},{"t":"ethylbenzene","why":"Name it as a substituted benzene: ethylbenzene.","_n":"3620d","_k":"a0702e9b"},{"t":"methylbenzene","why":"The group has 2 carbons.","_n":"371fd","_k":"55f8b29a"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Which formula could be an alkyne?","options":[{"t":"C₅H₁₀","why":"One C=C or a ring.","_n":"381ed","_k":"ebd20afe"},{"t":"C₅H₈","why":"CₙH₂ₙ₋₂.","_n":"392dd","_k":"4cc0f714"},{"t":"C₅H₁₂","why":"Saturated.","_n":"3a2cd","_k":"8c1c3818"},{"t":"C₅H₁₄","why":"Too many H for 5 carbons.","_n":"3babe","_k":"d4057754"}]},"b":{"prompt":"Which compound is saturated?","options":[{"t":"cyclohexane","why":"Only single bonds.","_n":"3cace","_k":"8de869ab"},{"t":"hex-1-ene","why":"Has a C=C.","_n":"3da9e","_k":"fc674c51"},{"t":"cyclohexene","why":"Has a C=C.","_n":"3eaae","_k":"4e74d8a8"},{"t":"benzene","why":"Aromatic ring, unsaturated.","_n":"3fafe","_k":"44096dcc"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"What is the major product of 2-methylpropene + HCl?","options":[{"t":"1,2-dichloro-2-methylpropane","why":"That’s addition of Cl₂.","_n":"3gb0e","_k":"bc5e3b2a"},{"t":"2-methylpropane","why":"That’s addition of H₂.","_n":"3hade","_k":"5f39598c"},{"t":"2-chloro-2-methylpropane","why":"H goes to the CH₂ carbon; Cl to the carbon with no H.","_n":"3iaee","_k":"00c08b0b"},{"t":"1-chloro-2-methylpropane","why":"The H goes to the carbon that already has more H atoms; the other atom goes to the more substituted carbon.","_n":"3ja3e","_k":"dbebbfa1"}]},"b":{"prompt":"What is the major product of 1-methylcyclohexene + HBr?","options":[{"t":"methylcyclohexane","why":"That’s addition of H₂.","_n":"3ka4e","_k":"28a82c57"},{"t":"bromocyclohexane","why":"The methyl doesn’t leave.","_n":"3lb1e","_k":"472a9bf0"},{"t":"1-bromo-2-methylcyclohexane","why":"The H goes to the carbon that already has more H atoms; the other atom goes to the more substituted carbon.","_n":"3mb0e","_k":"6222284c"},{"t":"1-bromo-1-methylcyclohexane","why":"Br on the ring carbon that carries the methyl (it had no H).","_n":"3nb3e","_k":"bfdb421b"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Which alkene gives butan-2-ol as the major product when water adds (acid catalyst)?","options":[{"t":"but-2-ene","why":"Either C=C carbon gets the OH: butan-2-ol.","_n":"3ob2e","_k":"d9b36abf"},{"t":"2-methylpropene","why":"That gives 2-methylpropan-2-ol.","_n":"3pade","_k":"0a6a7434"},{"t":"butane","why":"No double bond, no addition.","_n":"3qace","_k":"a8d23efa"},{"t":"propene","why":"That gives propan-2-ol: only 3 carbons.","_n":"3rafe","_k":"a6df3a10"}]},"b":{"prompt":"Which alkene gives 2-bromo-2-methylbutane as the major product with HBr?","options":[{"t":"pent-2-ene","why":"No branch: you’d get bromopentanes.","_n":"3saee","_k":"d96e11a2"},{"t":"3-methylbut-1-ene","why":"That gives 2-bromo-3-methylbutane.","_n":"3ta9e","_k":"9877f961"},{"t":"2-methylbut-2-ene","why":"Br goes to C2, which has no H.","_n":"3ua8e","_k":"3fbf3c92"},{"t":"2-methylbutane","why":"No double bond.","_n":"3va7d","_k":"fd25d33e"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Benzene reacts with Br₂ only when FeBr₃ is present, and HBr is released. What does this show?","options":[{"t":"Benzene is saturated","why":"C₆H₆ is far from saturated; it’s stabilized, not saturated.","_n":"3wa8d","_k":"73fe87cc"},{"t":"Substitution: one ring H is replaced by Br and the delocalized ring stays intact","why":"HBr comes from the H that Br replaces; the ring keeps its delocalized electrons.","_n":"3xa9d","_k":"8b974865"},{"t":"Combustion of benzene","why":"No O₂ involved.","_n":"3yaad","_k":"01234367"},{"t":"Addition across one C=C","why":"Addition wouldn’t release HBr.","_n":"3zabd","_k":"e888b877"}]},"b":{"prompt":"Cyclohexene decolourizes bromine water instantly; benzene doesn’t. What is the best conclusion?","options":[{"t":"Benzene is saturated","why":"C₆H₆ has far fewer H than a saturated C₆.","_n":"40acd","_k":"2068a261"},{"t":"Cyclohexene is aromatic","why":"Cyclohexene has one ordinary C=C.","_n":"41add","_k":"a974524b"},{"t":"Benzene has no double bonds at all","why":"It has π electrons, spread around the ring.","_n":"42aed","_k":"7b40fe71"},{"t":"Benzene’s π electrons are delocalized, which makes the ring stable and resistant to addition","why":"Benzene’s electrons are delocalized. It stays a ring and substitutes, and only with a catalyst.","_n":"439fd","_k":"10f2fbfc"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why but-2-ene has cis and trans forms but butane doesn’t?","options":[{"t":"“The π part of the C=C prevents rotation, so groups are locked on the same side or opposite sides. The C–C single bonds in butane rotate freely.”","why":"The π part of the double bond locks the two carbons; no rotation without breaking it.","_n":"44a0d","_k":"05bea429"},{"t":"“Double bonds are longer than single bonds.”","why":"They’re shorter; length isn’t the reason.","_n":"45add","_k":"3639da3f"},{"t":"“But-2-ene has more atoms than butane.”","why":"It has two fewer H.","_n":"46acd","_k":"49f52713"},{"t":"“Butane is a ring.”","why":"Butane is an open chain.","_n":"47abd","_k":"cc559f4f"}]},"b":{"prompt":"Which correctly states the shape around each carbon in ethyne?","options":[{"t":"Bent, 104.5°","why":"Carbon has no lone pairs here.","_n":"48aad","_k":"e5c4c48b"},{"t":"Linear, 180°","why":"Two electron groups (the triple bond and the C–H).","_n":"49b1d","_k":"2b900c98"},{"t":"Trigonal planar, 120°","why":"That’s around a C=C.","_n":"4ab0d","_k":"768f676a"},{"t":"Tetrahedral, 109.5°","why":"That’s around a carbon with four single bonds.","_n":"4bafd","_k":"a3215ada"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which equation correctly shows complete hydrogenation of propyne?","options":[{"t":"CH≡CCH₃ + H₂ → CH₃CH₂CH₃","why":"H isn’t balanced: one H₂ only gives propene.","_n":"4caed","_k":"84b8c694"},{"t":"CH≡CCH₃ + H₂O → CH₃CH₂CH₂OH","why":"That’s not hydrogenation.","_n":"4da5d","_k":"7513d74b"},{"t":"CH≡CCH₃ + 2H₂ → CH₂=CHCH₃","why":"That’s not balanced either: propene needs only one H₂.","_n":"4ea4d","_k":"6e937adf"},{"t":"CH≡CCH₃ + 2H₂ → CH₃CH₂CH₃ (metal catalyst)","why":"A triple bond can add two molecules of H₂: one gives propene, the second gives propane.","_n":"4fb3d","_k":"9fb1e285"}]},"b":{"prompt":"Which equation correctly shows bromine adding to ethene?","options":[{"t":"CH₂=CH₂ + Br₂ → CH₂=CHBr + HBr","why":"That’s substitution.","_n":"4gb4d","_k":"507f5190"},{"t":"CH₂=CH₂ + Br₂ → CH₂Br₂ + CH₂","why":"The carbon chain stays intact.","_n":"4hb1d","_k":"c267215e"},{"t":"CH₂=CH₂ + Br₂ → CH₃CH₂Br","why":"Both Br atoms add, and no H appears.","_n":"4ib2d","_k":"8a545db8"},{"t":"CH₂=CH₂ + Br₂ → CH₂BrCH₂Br","why":"In addition, both atoms of the reagent add, one to each carbon of the multiple bond.","_n":"4jafd","_k":"db908c35"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Liquid vegetable oils are hydrogenated to make solid margarine. What happens to the oil molecules?","options":[{"t":"H₂ adds across some C=C bonds, making the chains more saturated and raising the melting point","why":"Hydrogenation is addition of H₂: fewer C=C bonds, more saturated chains, a higher melting point.","_n":"4kb0d","_k":"f9d71d83"},{"t":"H₂ replaces C=C bonds with C≡C bonds","why":"Adding H₂ removes multiple bonds.","_n":"4ladd","_k":"da18649a"},{"t":"The oil molecules lose hydrogen","why":"They gain it.","_n":"4maed","_k":"bf7e529e"},{"t":"Bromine adds to the oil","why":"Hydrogen is added, not bromine.","_n":"4nabd","_k":"5ba15b82"}]},"b":{"prompt":"Oil P absorbs twice as much bromine per gram as oil Q in a test. What can you conclude?","options":[{"t":"P has more benzene rings","why":"Rings resist addition.","_n":"4oacd","_k":"1a56aeae"},{"t":"P is more saturated","why":"More Br₂ added means more C=C bonds.","_n":"4p19d","_k":"4cd9831b"},{"t":"P has about twice as many C=C bonds per gram, so it is more unsaturated","why":"More Br₂ added means more C=C bonds.","_n":"4q18d","_k":"49a60074"},{"t":"The two oils are identical","why":"Different uptake means different unsaturation.","_n":"4r1bd","_k":"f2fd165e"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"Naphthalene (two fused benzene rings, C₁₀H₈) is used in mothballs. With Br₂ and a catalyst, which reaction type is expected on the ring?","options":[{"t":"Addition","why":"Benzene’s electrons are delocalized. It stays a ring and substitutes, and only with a catalyst.","_n":"4s1ad","_k":"7e8c1d00"},{"t":"Elimination","why":"Nothing is removed to form a new multiple bond.","_n":"4t1dd","_k":"f99433d2"},{"t":"No reaction under any conditions","why":"With a catalyst, aromatic rings substitute.","_n":"4u1cd","_k":"a7404458"},{"t":"Substitution","why":"Aromatic rings keep their delocalized system.","_n":"4v1fd","_k":"463697d1"}]},"b":{"prompt":"Methylbenzene reacts with Cl₂ in the presence of FeCl₃. Which products are expected?","options":[{"t":"A chloromethylbenzene and HCl","why":"Substitution on the ring.","_n":"4w1ed","_k":"83196b7b"},{"t":"1,2-dichloro-methylcyclohexadiene","why":"That would be addition.","_n":"4x21d","_k":"e8c134de"},{"t":"Methylcyclohexane","why":"That needs H₂ and harsh conditions.","_n":"4y20d","_k":"636ee5f2"},{"t":"Benzene and chloromethane","why":"The methyl group stays.","_n":"4z2fc","_k":"13787502"}]}}]},"task":{"title":"Tertiary target","summary":"Tertiary target","statement":"\u003cp>Design an alkene so that adding HBr gives one clear product with Br on a carbon bonded to three other carbons. Then name your alkene. Can you find every answer?\u003c/p>\u003col class=\"ae-conds\">\u003cli>The alkene has 5 or 6 carbons.\u003c/li>\u003cli>HBr gives one clear product (a single product or a clear Markovnikov major product).\u003c/li>\u003cli>In that product, Br is on a carbon bonded to three other carbons.\u003c/li>\u003cli>You named the alkene correctly.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Choose the main chain length, where the C=C starts and (optionally) one methyl group on an inner carbon. The builder renumbers a structure entered from the “wrong” end. Name your alkene with the chips; its IUPAC name appears after you check a name.\u003c/p>","checks":["5 or 6 carbons","One clear product","Br on a carbon bonded to three carbons","Named correctly"],"tips":["Count the methyl branch as well as the chain.","If both C=C carbons carry one H each, HBr gives a mixture.","Put the methyl on one of the C=C carbons.","The double bond gets the lowest locant; then the methyl."],"explainPrompt":"Explain how Markovnikov’s rule guided where you put the methyl group.","vocab":"Use the words addition, Markovnikov’s rule, major product and double bond.","more":"There’s more than one answer. Can you find every one?","after3":"Every answer puts the methyl on a C=C carbon. That carbon has no H, so Markovnikov sends Br there."},"cards":[["Alkene","Hydrocarbon with a C=C; suffix -ene; one C=C gives CₙH₂ₙ (propene C₃H₆)."],["Alkyne","Hydrocarbon with a C≡C; suffix -yne; CₙH₂ₙ₋₂ (ethyne C₂H₂)."],["Locant rule","The multiple bond gets the lowest number: but-1-ene, not but-3-ene."],["Diene","Two C=C bonds: buta-1,3-diene."],["Shapes","Single 109.5°, double 120° (planar), triple 180° (linear)."],["No rotation","A C=C can’t rotate without breaking its π bond."],["Addition","Both atoms of H₂, X₂, HX or H₂O add across the multiple bond."],["Markovnikov’s rule","In HX or H₂O addition, H goes to the C=C carbon that already has more H."],["Benzene","C₆H₆ ring with delocalized electrons; stable; substitutes rather than adds."],["Aromatic names","methylbenzene, ethylbenzene, 1,4-dimethylbenzene; C₆H₅– is phenyl."],["Bromine test","Alkenes and alkynes decolourize bromine water quickly; alkanes and benzene don’t."],["Hydrogenation","Adding H₂ (metal catalyst) to C=C or C≡C makes the compound more saturated."]]}};</script>
