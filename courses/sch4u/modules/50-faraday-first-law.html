.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}
/* SCH4U 50: hero cell, Electrolysis cell (C10), Electroplating stations, Plating plan */
/* Module tokens (built from base tokens): --fl-sol (CuSO₄ tint; --hi-soft in dark mode, plan §5), --fl-sol0 (colourless
   solutions), --fl-metal (metal electrodes). */
:root{--fl-sol:var(--info-bg);--fl-sol0:var(--paper);--fl-metal:var(--rule)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--fl-sol:var(--hi-soft);--fl-sol0:var(--grid);--fl-metal:var(--rule)} }
:root[data-theme="dark"]{--fl-sol:var(--hi-soft);--fl-sol0:var(--grid);--fl-metal:var(--rule)}

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* shared */
.fl-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.fl-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.fl-h4{margin:14px 0 6px;font-size:1rem}

/* hero */
.fl-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.fl-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Explore */
.fl-modes,.fl-sols{margin:0 0 10px}
.fl-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.fl-view,.fl-side{min-width:0}
.fl-key{list-style:none;display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 4px;padding:0;font-size:.86rem;color:var(--ink-2)}
.fl-key li{display:flex;align-items:center;gap:6px}
.fl-dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.fl-de{background:var(--ec-e);width:9px;height:9px}
.fl-dc{background:var(--ec-cat)}
.fl-da{background:var(--ec-an)}
.fl-bars{margin:6px 0 0}
.fl-bar{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;align-items:center;gap:8px;margin:4px 0;font-size:.9rem}
.fl-bl{font-weight:700}
.fl-bt{display:block;height:14px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--sheet);overflow:hidden}
.fl-bf{display:block;height:100%}
.fl-bfc{background:var(--ink-2)}
.fl-bfa{background:var(--fl-metal)}
.fl-bv{font-variant-numeric:tabular-nums;min-width:6.5em;text-align:right}
.fl-bnote{margin:2px 0 0}
.fl-cap{margin:10px 0 0;min-height:2.6em}
.fl-sl{margin-bottom:8px}
.fl-pred{margin:6px 0 10px}
.fl-btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.fl-gbox{margin-top:16px}
.fl-tabs{margin-top:8px}
@media (max-width:760px){
  .fl-grid{grid-template-columns:minmax(0,1fr)}
}

/* Part 3 */
.fl-st h3{margin-top:0}

.fl-wcol{min-width:0}

.fl-ob[aria-pressed="true"]{border-color:var(--hi);background:var(--hi);color:var(--hi-ink);font-weight:700}

.fl-obs{font-size:.86rem;color:inherit;opacity:.85}
.fl-wsol{margin:0 0 10px}
.fl-wbox{max-width:420px}
.fl-chain{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 10px;margin:8px 0}
.fl-cbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl-cbox label{font-size:.86rem;font-weight:700}
.fl-crow{display:flex;align-items:center;gap:6px}

.fl-unit{color:var(--ink-2);min-width:2em}
.fl-mk{min-width:1em;font-weight:700}
.fl-arr{color:var(--ink-2);font-size:1.2rem;padding-bottom:.45em}
.fl-data{margin:6px 0 10px}
.fl-cq{margin:14px 0 6px}
.fl-causes{display:flex;flex-direction:column;gap:6px}
.fl-s4{margin:8px 0}

3ci>F\u003c/i>)","eqSize":"md","eqLabel":"m equals M times I times t, divided by z times F","headline":"Count the electrons, weigh the metal","text":"In \u003cstrong>electrolysis\u003c/strong>, a power supply forces electrons onto the \u003cstrong>cathode\u003c/strong>, where metal ions are reduced and plate out. Every mole of electrons carries 96 500 C, the \u003cstrong>Faraday constant\u003c/strong>. So the \u003cstrong>charge\u003c/strong> you pass decides exactly how much metal you get: twice the charge, twice the metal.","fig":{"html":"\u003cdiv class=\"fl-hx\">\u003csvg class=\"fl-svg\" id=\"fl-hx-svg\" viewBox=\"0 0 440 318\" role=\"img\" aria-label=\"A beaker of blue copper(II) sulfate solution. A copper strip on the left is the anode, marked +, and a key on the right is the cathode, marked −; both are wired to a power supply. Violet electrons stream from the anode through the supply into the key. Orange Cu²⁺ ions drift to the key and become a copper coat while the copper strip thins. A counter reads: charge 1930 C, 0.0200 mol of electrons, 0.0100 mol of copper, 0.635 g.\">\u003c/svg>\u003cdiv class=\"fl-hx-row\">\u003cp class=\"fl-hx-ctr\" id=\"fl-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"fl-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can compare electrolytic and galvanic cells (energy, spontaneity, electrode signs) and label an electrolytic cell.","I can state Faraday’s first law and predict how changing current or time changes the mass produced.","I can convert between current, time, charge and moles of electrons.","I can calculate the mass, time or current for an electrolysis, including working backwards.","I can predict what forms at the cathode in aqueous electrolysis using the reduction table.","I can apply Faraday’s first law to electroplating, and calculate and explain current efficiency."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Moles and mass","goal" 003c/i>+ needs \u003ci>z\u003c/i> electrons: Ag⁺ 1, Cu²⁺ 2, Al³⁺ 3.","Cells and signs":"Galvanic: spontaneous, anode −. Electrolytic: forced by a supply, anode +. Oxidation is always at the anode."}}},"explore":{"heading":"Electrolysis cell","intro":"Set the current and the time. Watch the charge add up, and see how much metal plates onto the cathode.","how":"Choose a mode and a solution, then set the current and the time. \u003cstrong>Run\u003c/strong> plays the electrolysis, \u003cstrong>Step\u003c/strong> adds 965 s, and \u003cstrong>Reset\u003c/strong> sets the time back to 0 s. Explore assumes 100% current efficiency.","modes":[{"id":"plate","t":"Plate it"},{"id":"graph","t":"Graph lab"},{"id":"forms","t":"What forms?"}],"sols":[{"id":"cu","t":"CuSO₄(aq), copper anode"},{"id":"ag","t":"AgNO₃(aq), silver anode"},{"id":"zn","t":"ZnSO₄(aq), zinc anode"},{"id":"al","t":"Al₂(SO₄)₃(aq), carbon anode"},{"id":"na","t":"NaCl(aq), carbon anode"}],"graphNote":"Graph lab: each \u003cstrong>Run\u003c/strong> adds a line for the current you set (up to three, same solution). Compare the slopes with the currents.","formsNote":"What forms? Choose a solution, predict the cathode product, then press \u003cstrong>Run\u003c/strong>.","predictions":[{"id":"p1","prompt":"CuSO₄(aq), 1.00 A for 1930 s. Then the current is doubled. What happens to the mass of copper?","options":[{"t":"It quadruples","_n":"o725","_k":"6ae69592"},{"t":"It stays the same","_n":"p715","_k":"9c70da1a"},{"t":"It doubles","_n":"q705","_k":"a0cd3b25"},{"t":"It halves","_n":"r6f5","_k":"0fe269e0"}],"explain":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> doubles, so the moles of electrons and of copper double."},{"id":"p2","prompt":"Same charge, two ways. Run A: 2.00 A for 965 s. Run B: 1.00 A for 1930 s at a higher voltage. Which deposits more copper?","options":[{"t":"Run B, because it runs longer","_n":"s6e5","_k":"e0ec2002"},{"t":"Run B, because the voltage is higher","_n":"t715","_k":"584c2d56"},{"t":"The same","_n":"u725","_k":"8dcabf9b"},{"t":"Run A, because the current is bigger","_n":"v735","_k":"63ea6d32"}],"explain":"Both pass 1930 C. Voltage isn’t in Faraday’s law."},{"id":"p3","prompt":"CuSO₄(aq) with a copper anode, 2.00 A for 965 s. What happens to the copper anode?","options":[{"t":"It loses 1.27 g","_n":"w745","_k":"5a526610"},{"t":"It loses 0.635 g","_n":"x6d5","_k":"cbd3c64b"},{"t":"It gains 0.635 g","_n":"y6e5","_k":"05a94b44"},{"t":"It doesn’t change","_n":"z6f5","_k":"535e4a38"}],"explain":"Cu(s) → Cu²⁺(aq) + 2e⁻ at the anode replaces the ions plated at the cathode."},{"id":"p4","prompt":"What forms? mode: Al₂(SO₄)₃(aq). What forms at the cathode?","options":[{"t":"Hydrogen gas","_n":"10705","_k":"696029f5"},{"t":"Nothing at all","_n":"11695","_k":"46c5ed51"},{"t":"Oxygen gas","_n":"126a5","_k":"f28e1cde"},{"t":"Aluminium metal","_n":"136b5","_k":"b4046944"}],"explain":"Water (−0.83 V) is easier to reduce than Al³⁺ (−1.66 V). That’s why aluminium is made from a molten bath (module 52)."}],"chalIntro":"Use the cell to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,4],"prompt":"Deposit exactly \u003cstrong>0.635 g of copper\u003c/strong>.","why":"Any \u003ci>I\u003c/i> and \u003ci>t\u003c/i> with \u003ci>I\u003c/i>\u003ci>t\u003c/i> = 1930 C: 0.0200 mol e⁻ → 0.0100 mol Cu → 0.635 g.","general":"Use CuSO₄(aq) and set a current and a time.","hints":["0.635 g Cu = 0.0100 mol Cu.","That needs 0.0200 mol e⁻ = 1930 C.","Any \u003ci>I\u003c/i> and \u003ci>t\u003c/i> with \u003ci>I\u003c/i>\u003ci>t\u003c/i> = 1930 C, e.g. 2.00 A for 965 s."]},{"id":"tc2","goal":[3,4],"prompt":"Switch to silver. Deposit exactly \u003cstrong>1.08 g of silver\u003c/strong>.","why":"\u003ci>I\u003c/i>\u003ci>t\u003c/i> = 965 C: 0.0100 mol e⁻ → 0.0100 mol Ag → 1.08 g. Each Ag⁺ takes one electron.","general":"Use AgNO₃(aq) and set a current and a time.","hints":["1.08 g ÷ 108 = 0.0100 mol Ag.","Ag⁺ + e⁻ → Ag: 0.0100 mol e⁻.","965 C: 1.00 A for 965 s."]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Choose a solution and a current so that exactly \u003cstrong>0.100 mol of metal\u003c/strong> forms at the cathode in 9650 s.","why":"In 9650 s, each 1.00 A passes 0.100 mol e⁻. Ag⁺ needs 1 e⁻ per atom, so 1.00 A; Cu²⁺ and Zn²⁺ need 2, so 2.00 A. Al³⁺ and Na⁺ don’t plate from water.","general":"Set the time to 9650 s, then choose a solution and a current.","hints":["In 9650 s, each 1.00 A passes 0.100 mol e⁻.","Moles of metal = moles of e⁻ ÷ \u003ci>z\u003c/i>.","Ag⁺ at 1.00 A, or Cu²⁺ or Zn²⁺ at 2.00 A. Al³⁺ and Na⁺ don’t plate from water."]}]},"part3":{"slug":"plating","name":"Plating","heading":"Electroplating","intro":"Plating shops put thin, even coats of silver, copper or zinc on objects, and Faraday’s first law runs every job. Work through a plater’s job sheet: wire the cell, time the job, check the efficiency and deal with the waste.","s1":{"title":"Station 1: Wire it right","intro":"Silver-plate a ring. Tap the ring or the silver bar, then tap the terminal to connect it to (tap a terminal again to take it off). Choose the solution, then press Check.","fb":{"ok":"Right. The ring is the cathode (−): Ag⁺ + e⁻ → Ag coats it. The silver bar is the anode (+): Ag → Ag⁺ + e⁻ dissolves it and replaces the silver ions.","rev":"The ring would be the anode and would dissolve. In electrolysis the supply’s positive terminal pulls electrons off the anode, so the anode is positive. Oxidation is still at the anode.","sol":"Copper ions would plate copper onto the ring, not silver. Use a solution of the plating metal’s ions.","empty":"Connect both objects and choose a solution first."}},"s2":{"title":"Station 2: How long?","intro":"The ring needs 2.16 g of silver at 0.500 A. Fill in the chain, then press Check. Answers within 1% are accepted.","done":"1930 C ÷ 0.500 A = 3860 s: 1 h 4 min 20 s."},"s3":{"title":"Station 3: Efficiency","intro":"A plating run used 2.00 A for 965 s through CuSO₄(aq). Open \u003cstrong>Check it with data\u003c/strong> for the measured masses, then work out the efficiency.","causesQ":"The actual mass is less than the theory. Which could explain it? Choose every likely cause.","causes":[{"id":"h2","t":"Some current reduced water to H₂","why":"Charge spent making H₂ deposits no copper, so less metal forms than the charge predicts."},{"id":"rinse","t":"The coat was rinsed off","why":"Loosely held copper that washes away is never weighed."},{"id":"early","t":"The mass was recorded early","why":"If the cathode was weighed before the run finished, not all of the charge had passed."}],"causesFb":"All three are likely causes. Each one makes the measured mass smaller than the theoretical mass."},"s4":{"title":"Station 4: The plating shop and the environment","html":"\u003cp>Plating baths can contain toxic metal compounds, so waste rinse water must be treated before it is released. Newer processes replace the most hazardous baths.\u003c/p>","q":"Choose one practice that reduces harm.","opts":[{"id":"recover","t":"Recover metal from the rinse water","why":"The metal is collected and reused instead of going down the drain."},{"id":"loop","t":"Use closed-loop rinsing","why":"The same rinse water is cleaned and reused, so far less waste water leaves the shop."},{"id":"switch","t":"Switch to a less hazardous process","why":"Replacing the most hazardous baths means less harm if anything escapes."}],"fb":"Any of these reduces harm; shops often combine them."},"quickCheck":{"title":"Quick check","summary":"Electroplating quick check","items":[{"id":"q1","goal":6,"prompt":"To plate a spoon with silver, the spoon connects to…","choices":[{"t":"the positive terminal","fb":"The spoon must be the cathode, where Ag⁺ is reduced.","_n":"146a5","_k":"ec88e454"},{"t":"the negative terminal","fb":"Right. The spoon must be the cathode, where Ag⁺ is reduced.","_n":"156d5","_k":"d380c6a7"},{"t":"neither terminal","fb":"The spoon must be the cathode, where Ag⁺ is reduced.","_n":"166c5","_k":"216f8854"},{"t":"either terminal","fb":"The spoon must be the cathode, where Ag⁺ is reduced.","_n":"176f5","_k":"5b0b4a94"}]},{"id":"q2","goal":2,"prompt":"Doubling the plating time at the same current…","choices":[{"t":"halves the mass","fb":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> doubles.","_n":"186e5","_k":"d5852234"},{"t":"doesn’t change the mass","fb":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> doubles.","_n":"19715","_k":"45d47fe2"},{"t":"quadruples the mass","fb":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> doubles.","_n":"1a705","_k":"3c83be07"},{"t":"doubles the mass","fb":"Right. \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> doubles.","_n":"1b635","_k":"5150e7ab"}]},{"id":"q3","goal":6,"prompt":"A run deposits 0.762 g when theory says 0.953 g. Efficiency?","choices":[{"t":"20%","fb":"Actual ÷ theoretical: 0.762 ÷ 0.953 ≈ 0.80.","_n":"1c625","_k":"5b7f0c44"},{"t":"100%","fb":"Actual ÷ theoretical: 0.762 ÷ 0.953 ≈ 0.80.","_n":"1de55","_k":"8ae44b29"},{"t":"80%","fb":"Right. Actual ÷ theoretical: 0.762 ÷ 0.953 ≈ 0.80.","_n":"1ee65","_k":"dfef11e0"},{"t":"125%","fb":"Actual ÷ theoretical: 0.762 ÷ 0.953 ≈ 0.80.","_n":"1fe35","_k":"63db8ca1"}]},{"id":"q4","goal":6,"prompt":"Why must plating rinse water be treated?","choices":[{"t":"It can contain toxic metal compounds","fb":"Right. Metal ions in waste water harm living things.","_n":"1ge45","_k":"d3708fdc"},{"t":"It contains extra electrons","fb":"Metal ions in waste water harm living things.","_n":"1he15","_k":"f6f705b1"},{"t":"It’s too hot","fb":"Metal ions in waste water harm living things.","_n":"1ie25","_k":"9a98dab3"},{"t":"It’s acidic only","fb":"Metal ions in waste water harm living things.","_n":"1jdf5","_k":"61ee4903"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Galvanic or electrolytic?","summary":"Galvanic or electrolytic?","goal":1,"noun":"statement","txt":true,"instruction":"Eight statements. Sort each one: galvanic cell or electrolytic cell.","boxes":[{"id":"g","label":"Galvanic","sub":"spontaneous; makes electricity"},{"id":"e","label":"Electrolytic","sub":"forced by a power supply"}],"wrongDefault":"Ask: does it run by itself, or is it forced?","items":[{"id":"i1","t":"Anode is negative","_a":"QAZE","why":"Galvanic: electrons leave the anode on their own, so it’s negative.","hints":["Spontaneous or forced?","Which way does energy flow?","Galvanic: electrons leave the anode on their own, so it’s negative."],"wrong":{"e":"In electrolysis the anode is +."}},{"id":"i2","t":"Anode is positive","_a":"QARE","why":"Electrolytic: the supply’s + terminal pulls electrons off the anode.","hints":["Spontaneous or forced?","Which way does energy flow?","Electrolytic: the supply’s + terminal pulls electrons off the anode."]},{"id":"i3","t":"\u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> is positive","_a":"QAZE","why":"Galvanic: a positive \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> means the reaction runs by itself.","hints":["Spontaneous or forced?","Which way does energy flow?","Galvanic: a positive \u003ci>E\u003c/i>°\u003csub>cell\u003c/sub> means the reaction runs by itself."]},{"id":"i4","t":"Needs a power supply","_a":"QARE","why":"Electrolytic: the supply forces a non-spontaneous reaction.","hints":["Spontaneous or forced?","Which way does energy flow?","Electrolytic: the supply forces a non-spontaneous reaction."]},{"id":"i5","t":"Converts chemical energy to electrical energy","_a":"QAZE","why":"Galvanic: the reaction makes electricity.","hints":["Spontaneous or forced?","Which way does energy flow?","Galvanic: the reaction makes electricity."]},{"id":"i6","t":"Converts electrical energy to chemical energy","_a":"QARE","why":"Electrolytic: electricity drives the reaction.","hints":["Spontaneous or forced?","Which way does energy flow?","Electrolytic: electricity drives the reaction."]},{"id":"i7","t":"A flashlight battery while it’s lighting the bulb","_a":"QAZE","why":"Galvanic: the battery runs by itself and makes electricity.","hints":["Spontaneous or forced?","Which way does energy flow?","Galvanic: the battery runs by itself and makes electricity."]},{"id":"i8","t":"Copper plating of a key","_a":"QARE","why":"Electrolytic: a supply forces Cu²⁺ onto the key.","hints":["Spontaneous or forced?","Which way does energy flow?","Electrolytic: a supply forces Cu²⁺ onto the key."]}]},{"id":"calc","type":"numeric","title":"Faraday calculations","summary":"Faraday calculations","star":true,"goal":[3,4,6],"instruction":"Six calculations. Items 4 to 6 are non-routine; items 5 and 6 go beyond the Final Check.","how":"Type a number (no units) and press Check. Answers within 1% are accepted.","items":[{"id":"f1","goal":3,"prompt":"2.50 A flows for 3860 s. Moles of electrons?","_a":"Uk9X","tol":0.001,"unit":"mol","display":"0.100 mol","why":"9650 C ÷ 96 500 C/mol = 0.100 mol e⁻.","wrong":[{"match":[9650],"fb":"That’s the charge in C; divide by \u003ci>F\u003c/i>."}],"hints":["\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>, then \u003ci>n\u003c/i>(e⁻) = \u003ci>Q\u003c/i> ÷ \u003ci>F\u003c/i>.","2.50 × 3860 = 9650 C.","9650 ÷ 96 500 = 0.100 mol."]},{"id":"f2","goal":4,"prompt":"0.500 A for 7720 s through CuSO₄(aq). Mass of Cu?","_a":"U09UAg==","tol":0.0127,"unit":"g","display":"1.27 g","why":"3860 C → 0.0400 mol e⁻ → 0.0200 mol Cu → 1.27 g.","wrong":[{"match":[2.54],"fb":"÷ 2 for Cu²⁺. Each Cu²⁺ needs \u003cstrong>2\u003c/strong> electrons. Moles of Cu = moles of e⁻ ÷ 2."}],"hints":["3860 C → moles of electrons.","0.0400 mol e⁻ ÷ 2 = 0.0200 mol Cu.","0.0200 × 63.5 = 1.27 g."]},{"id":"f3","goal":4,"prompt":"Time to deposit 2.16 g of Ag at 2.00 A?","_a":"W1dT","tol":9.65,"unit":"s","display":"965 s","why":"0.0200 mol Ag → 0.0200 mol e⁻ → 1930 C; 1930 ÷ 2.00 = 965 s.","wrong":[{"match":[3860],"fb":"\u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i>, not \u003ci>Q\u003c/i> × \u003ci>I\u003c/i>."}],"hints":["2.16 ÷ 108 = 0.0200 mol Ag = 0.0200 mol e⁻.","0.0200 × 96 500 = 1930 C.","\u003ci>t\u003c/i> = 1930 ÷ 2.00 = 965 s."]},{"id":"f4","goal":4,"prompt":"Current needed to deposit 6.54 g of Zn in 4825 s?","_a":"Vg==","tol":0.04,"unit":"A","display":"4.00 A","why":"0.100 mol Zn → 0.200 mol e⁻ → 19 300 C; 19 300 ÷ 4825 = 4.00 A.","wrong":[{"match":[2],"fb":"0.100 mol Zn needs \u003cstrong>0.200\u003c/strong> mol e⁻ = 19 300 C."}],"hints":["Moles of Zn.","× 2 for electrons.","19 300 C ÷ 4825 s = 4.00 A."]},{"id":"f5","goal":4,"prompt":"A key gained 0.635 g of copper in 1930 s. What was the average current (100% efficiency)?","_a":"Uw==","tol":0.01,"unit":"A","display":"1.00 A","why":"0.0100 mol Cu → 0.0200 mol e⁻ → 1930 C; 1930 ÷ 1930 = 1.00 A.","wrong":[{"match":[0.5],"fb":"0.0100 mol Cu → 0.0200 mol e⁻ → 1930 C."}],"hints":["0.635 ÷ 63.5 = 0.0100 mol Cu.","× 2: 0.0200 mol e⁻ = 1930 C.","\u003ci>I\u003c/i> = 1930 C ÷ 1930 s = 1.00 A."]},{"id":"f6","goal":6,"prompt":"2.00 A for 9650 s through CuSO₄(aq) deposited 5.08 g of Cu. Current efficiency?","_a":"WlE=","tol":0.8,"unit":"%","display":"80.0%","why":"Theory: 6.35 g; 5.08 ÷ 6.35 × 100% = 80.0%.","wrong":[{"match":[125],"fb":"Actual ÷ theoretical: 5.08 ÷ 6.35."},{"match":[40],"fb":"Theory is 6.35 g: divide the moles of e⁻ by 2 only once."}],"hints":["Theoretical mass first.","19 300 C → 0.200 mol e⁻ → 0.100 mol Cu → 6.35 g.","5.08 ÷ 6.35 = 0.800."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Lindiwe","goal":4,"instruction":"Lindiwe made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"What mass of copper is deposited by 2.00 A for 4825 s?","steps":["\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> = 2.00 × 4825 = 9650 C.","\u003ci>n\u003c/i>(e⁻) = 9650 ÷ 96 500 = 0.100 mol.","\u003ci>n\u003c/i>(Cu) = \u003ci>n\u003c/i>(e⁻) = 0.100 mol.","\u003ci>m\u003c/i> = 0.100 × 63.5 = 6.35 g."],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"\u003ci>n\u003c/i>(Cu) = 0.100 × 2 = 0.200 mol.","why":"Each Cu needs 2 e⁻, so there are fewer Cu atoms than electrons.","_n":"1ke05","_k":"ccfc90d7"},{"t":"\u003ci>n\u003c/i>(Cu) = 0.100 ÷ 63.5.","why":"That mixes moles and molar mass.","_n":"1led5","_k":"6a0b791c"},{"t":"Step 3 is correct.","why":"Count the electrons per ion. Each Cu²⁺ needs \u003cstrong>2\u003c/strong> electrons. Moles of Cu = moles of e⁻ ÷ 2.","_n":"1mee5","_k":"6f97a9a8"},{"t":"Cu²⁺ + 2e⁻ → Cu, so \u003ci>n\u003c/i>(Cu) = 0.100 ÷ 2 = 0.0500 mol and \u003ci>m\u003c/i> = 3.18 g.","why":"Each Cu²⁺ needs \u003cstrong>2\u003c/strong> electrons. Moles of Cu = moles of e⁻ ÷ 2.","_n":"1ndf4","_k":"8b1df0ff"}],"hints":["Write the half-reaction.","2 e⁻ per Cu.","0.0500 mol, 3.18 g."]},{"id":"e2","goal":4,"task":"How long does it take to deposit 1.08 g of silver at 0.500 A?","steps":["\u003ci>n\u003c/i>(Ag) = 1.08 ÷ 108 = 0.0100 mol.","Ag⁺ + e⁻ → Ag, so \u003ci>n\u003c/i>(e⁻) = 0.0100 mol.","\u003ci>Q\u003c/i> = 0.0100 × 96 500 = 965 C.","\u003ci>t\u003c/i> = \u003ci>Q\u003c/i> × \u003ci>I\u003c/i> = 965 × 0.500 = 483 s."],"_a":"UQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"\u003ci>t\u003c/i> = 965 s.","why":"That’s only right at 1.00 A.","_n":"1ode4","_k":"4c769a66"},{"t":"\u003ci>t\u003c/i> = \u003ci>I\u003c/i> ÷ \u003ci>Q\u003c/i>.","why":"Units: A ÷ C isn’t seconds.","_n":"1pdd4","_k":"e8938588"},{"t":"\u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i> = 965 ÷ 0.500 = 1930 s.","why":"\u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i>. A bigger current means a shorter time. Here the current is small, so the time is long.","_n":"1qdc4","_k":"ad83b931"},{"t":"Step 4 is correct.","why":"A smaller current should take \u003cstrong>longer\u003c/strong>. \u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i>. A bigger current means a shorter time.","_n":"1re34","_k":"79ec1962"}],"hints":["\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>: rearrange for \u003ci>t\u003c/i>.","\u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i>.","1930 s."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: that voltage doesn’t change the mass, or that aluminium won’t plate out of water? Why?"},{"id":"j2","q":"In your own words, state Faraday’s first law and explain why it works (think about what each electron does)."},{"id":"j3","q":"Explain to a friend the four-step chain from current and time to mass."},{"id":"j4","q":"Which step of the chain do you still slip on? How will you check it next time?"}]},"final":{"intro":"Use these values: \u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In an electrolytic cell, the anode is…","options":[{"t":"negative, and reduction happens there","why":"Both parts are wrong.","_n":"1se24","_k":"3b26446e"},{"t":"negative, and oxidation happens there","why":"That’s a galvanic cell’s anode. In electrolysis the supply’s positive terminal pulls electrons off the anode, so the anode is positive. Oxidation is still at the anode.","_n":"1te14","_k":"9680c072"},{"t":"positive, and reduction happens there","why":"Reduction is at the cathode.","_n":"1ue04","_k":"3f890456"},{"t":"positive, and oxidation happens there","why":"In electrolysis the supply’s positive terminal pulls electrons off the anode, so the anode is positive. Oxidation is still at the anode.","_n":"1ve74","_k":"920dfabd"}]},"b":{"prompt":"To copper-plate a key, the key must be connected to…","options":[{"t":"the negative terminal, so it’s the cathode","why":"Cu²⁺ is reduced onto the cathode, which is negative in electrolysis.","_n":"1we64","_k":"1edbd551"},{"t":"the positive terminal, so it’s the cathode","why":"The cathode is negative in electrolysis.","_n":"1xd94","_k":"cdcace7d"},{"t":"either terminal; plating works both ways","why":"Only the cathode gains metal.","_n":"1yda4","_k":"788d01cc"},{"t":"the positive terminal, so it’s the anode","why":"It would dissolve. In electrolysis the supply’s positive terminal pulls electrons off the anode, so the anode is positive. Oxidation is still at the anode.","_n":"1zdb4","_k":"88f8afbc"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Faraday’s first law says the mass of product at an electrode is proportional to…","options":[{"t":"the voltage of the supply","why":"The mass depends only on the charge, \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>. Voltage and concentration aren’t in the law.","_n":"20dc4","_k":"d5a9ad06"},{"t":"the concentration of the solution","why":"The mass depends only on the charge, \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>. Voltage and concentration aren’t in the law.","_n":"21dd4","_k":"1e098410"},{"t":"the charge passed through the cell","why":"Each ion needs a fixed number of electrons, so the mass follows the charge.","_n":"22de4","_k":"0e450925"},{"t":"the size of the electrode","why":"Electrode size isn’t in the law.","_n":"23df4","_k":"7132f5b8"}]},"b":{"prompt":"Which change doubles the mass of metal deposited?","options":[{"t":"Doubling the solution’s concentration","why":"The mass depends only on the charge, \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>. Voltage and concentration aren’t in the law.","_n":"24e04","_k":"b17cccfe"},{"t":"Halving the current and doubling the time","why":"The charge stays the same.","_n":"25e14","_k":"310a0eda"},{"t":"Doubling the time at the same current","why":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> doubles.","_n":"26e24","_k":"3ed89475"},{"t":"Doubling the voltage at the same current","why":"The mass depends only on the charge, \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>. Voltage and concentration aren’t in the law.","_n":"27f37","_k":"aa5f522a"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"How many moles of electrons are in 19 300 C?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"0.100 mol","why":"That’s 9650 C.","_n":"28f27","_k":"137c124c"},{"t":"0.200 mol","why":"19 300 ÷ 96 500.","_n":"29f57","_k":"d6f3964d"},{"t":"5.00 mol","why":"96 500 ÷ 19 300; divide the other way.","_n":"2af47","_k":"26d64de3"},{"t":"2.00 mol","why":"Check the powers of 10.","_n":"2bef7","_k":"dbc012ef"}]},"b":{"prompt":"How many moles of electrons are in 4825 C?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"20.0 mol","why":"Divided the wrong way.","_n":"2cee7","_k":"566e5555"},{"t":"0.0500 mol","why":"4825 ÷ 96 500.","_n":"2df17","_k":"f5faeca4"},{"t":"0.100 mol","why":"That’s 9650 C.","_n":"2ef07","_k":"bfbc32bb"},{"t":"0.500 mol","why":"Check the powers of 10.","_n":"2feb7","_k":"ec2b7c9f"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"What mass of copper is deposited by 1.00 A for 9650 s?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"0.635 g","why":"That’s 1930 C.","_n":"2gea7","_k":"4c52d61d"},{"t":"6.35 g","why":"Divide the moles of e⁻ by 2. Each Cu²⁺ needs \u003cstrong>2\u003c/strong> electrons. Moles of Cu = moles of e⁻ ÷ 2.","_n":"2hed6","_k":"40c51f80"},{"t":"1.59 g","why":"Divided by 4.","_n":"2iee6","_k":"1303be44"},{"t":"3.18 g","why":"9650 C → 0.100 mol e⁻ → 0.0500 mol Cu → 3.18 g.","_n":"2jeb6","_k":"ad6c8b03"}]},"b":{"prompt":"What mass of zinc is deposited by 2.00 A for 4825 s?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"3.27 g","why":"9650 C → 0.100 mol e⁻ → 0.0500 mol Zn → 3.27 g.","_n":"2kec6","_k":"0eacfb57"},{"t":"6.54 g","why":"Each Zn²⁺ needs 2 electrons: divide the moles of e⁻ by 2.","_n":"2lf16","_k":"2fb485d4"},{"t":"0.327 g","why":"Check the powers of 10.","_n":"2mf26","_k":"29350d8a"},{"t":"1.64 g","why":"Divided by 4.","_n":"2nef6","_k":"a7e91fe0"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"How long does it take to plate 2.16 g of silver at 1.00 A?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"3860 s","why":"That’s 4.32 g.","_n":"2of06","_k":"2ee711ea"},{"t":"1930 s","why":"0.0200 mol Ag → 0.0200 mol e⁻ → 1930 C → 1930 s.","_n":"2pe56","_k":"c9294e52"},{"t":"965 s","why":"Silver needs one electron per ion; don’t halve.","_n":"2qe66","_k":"535d508b"},{"t":"0.0200 s","why":"That’s the number of moles, not a time.","_n":"2rfc3","_k":"ab683bf7"}]},"b":{"prompt":"How long does it take to deposit 1.27 g of copper at 2.00 A?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"3860 s","why":"That’s the charge in C; divide by 2.00 A.","_n":"2sfd3","_k":"e92fdd11"},{"t":"1930 s","why":"0.0200 mol Cu → 0.0400 mol e⁻ → 3860 C → 1930 s.","_n":"2tfa3","_k":"ac8a5078"},{"t":"7720 s","why":"Multiplied by the current. \u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i>. A bigger current means a shorter time.","_n":"2ufb3","_k":"d601cef9"},{"t":"965 s","why":"Each Cu needs 2 e⁻.","_n":"2vf83","_k":"3537da04"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A solution contains Zn²⁺(aq) and Na⁺(aq). Using the table (Zn²⁺/Zn −0.76 V; water −0.83 V; Na⁺/Na −2.71 V), what forms first at the cathode?","options":[{"t":"Zinc","why":"−0.76 V is the highest, so Zn²⁺ is reduced first.","_n":"2wf93","_k":"46edc253"},{"t":"Sodium","why":"−2.71 V is the hardest to reduce.","_n":"2xf63","_k":"20b5f684"},{"t":"Hydrogen","why":"Water is just below zinc.","_n":"2yf73","_k":"69f51b38"},{"t":"Oxygen","why":"Oxygen forms at an anode, not a cathode.","_n":"2z043","_k":"6216a436"}]},"b":{"prompt":"Aqueous Al₂(SO₄)₃ is electrolyzed with carbon electrodes. What forms at the cathode?","options":[{"t":"Hydrogen gas","why":"Water (−0.83 V) is reduced before Al³⁺ (−1.66 V).","_n":"30053","_k":"69e93d45"},{"t":"Aluminium metal","why":"Water (−0.83 V) is reduced before Al³⁺ (−1.66 V) or Na⁺ (−2.71 V), so H₂ forms instead.","_n":"31823","_k":"6d0f1678"},{"t":"Sulfur","why":"Sulfate isn’t reduced here.","_n":"32813","_k":"4415c6a0"},{"t":"Oxygen gas","why":"That’s at the anode.","_n":"33843","_k":"f623c63c"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why the copper anode loses mass during copper plating?","options":[{"t":"“The anode is oxidized: Cu(s) → Cu²⁺(aq) + 2e⁻. The ions it releases replace those plated at the cathode.”","why":"The copper anode is oxidized (Cu → Cu²⁺ + 2e⁻) and dissolves; ideally it loses exactly what the cathode gains.","_n":"34833","_k":"d0226737"},{"t":"“The anode is reduced and shrinks.”","why":"Reduction would add metal.","_n":"35863","_k":"66a94d08"},{"t":"“Copper falls off the anode because of the current.”","why":"It dissolves as ions; it doesn’t fall off.","_n":"36853","_k":"c4aec230"},{"t":"“The anode doesn’t lose mass.”","why":"The copper anode is oxidized (Cu → Cu²⁺ + 2e⁻) and dissolves; ideally it loses exactly what the cathode gains.","_n":"37883","_k":"259fbc24"}]},"b":{"prompt":"Which is the best explanation of why the mass deposited depends on charge, not voltage?","options":[{"t":"“Each ion needs a fixed number of electrons, so the moles of metal equal (\u003ci>Q\u003c/i> ÷ \u003ci>F\u003c/i>) ÷ \u003ci>z\u003c/i>. Voltage only has to be enough to drive the reaction.”","why":"The electrons do the work; voltage only has to be large enough.","_n":"38873","_k":"9ab2d6df"},{"t":"“Voltage and charge are the same thing.”","why":"Charge is in coulombs; voltage is energy per coulomb.","_n":"397a3","_k":"b7d92186"},{"t":"“Higher voltage makes faster ions, which stick better.”","why":"The mass depends only on the charge, \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>. Voltage and concentration aren’t in the law.","_n":"3a793","_k":"38b6eba6"},{"t":"“Charge depends on the solution’s concentration.”","why":"The mass depends only on the charge, \u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>. Voltage and concentration aren’t in the law.","_n":"3bf02","_k":"f99385f4"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which order of steps correctly finds the mass of metal deposited?","options":[{"t":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i> ÷ \u003ci>t\u003c/i> → \u003ci>n\u003c/i>(e⁻) = \u003ci>Q\u003c/i> ÷ \u003ci>F\u003c/i> → \u003ci>n\u003c/i>(metal) = \u003ci>n\u003c/i>(e⁻) ÷ \u003ci>z\u003c/i> → \u003ci>m\u003c/i> = \u003ci>n\u003c/i> × \u003ci>M\u003c/i>","why":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i>.","_n":"3cf12","_k":"48dca358"},{"t":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> → \u003ci>n\u003c/i>(metal) = \u003ci>Q\u003c/i> ÷ \u003ci>F\u003c/i> → \u003ci>m\u003c/i> = \u003ci>n\u003c/i> × \u003ci>M\u003c/i>","why":"Skips dividing by \u003ci>z\u003c/i>.","_n":"3df22","_k":"12f302d0"},{"t":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> → \u003ci>n\u003c/i>(e⁻) = \u003ci>Q\u003c/i> ÷ \u003ci>F\u003c/i> → \u003ci>n\u003c/i>(metal) = \u003ci>n\u003c/i>(e⁻) ÷ \u003ci>z\u003c/i> → \u003ci>m\u003c/i> = \u003ci>n\u003c/i> × \u003ci>M\u003c/i>","why":"Charge, then electrons, then atoms, then mass.","_n":"3ef32","_k":"aef45137"},{"t":"\u003ci>Q\u003c/i> = \u003ci>I\u003c/i>\u003ci>t\u003c/i> → \u003ci>n\u003c/i>(e⁻) = \u003ci>F\u003c/i> ÷ \u003ci>Q\u003c/i> → \u003ci>n\u003c/i>(metal) = \u003ci>n\u003c/i>(e⁻) ÷ \u003ci>z\u003c/i> → \u003ci>m\u003c/i> = \u003ci>n\u003c/i> × \u003ci>M\u003c/i>","why":"\u003ci>n\u003c/i>(e⁻) = \u003ci>Q\u003c/i> ÷ \u003ci>F\u003c/i>.","_n":"3ff42","_k":"8e2a379c"}]},"b":{"prompt":"Which single formula gives the mass deposited?","options":[{"t":"\u003ci>m\u003c/i> = (\u003ci>z\u003c/i> × \u003ci>F\u003c/i> × \u003ci>I\u003c/i> × \u003ci>t\u003c/i>) ÷ \u003ci>M\u003c/i>","why":"Upside down.","_n":"3gf52","_k":"625fb1c8"},{"t":"\u003ci>m\u003c/i> = (\u003ci>M\u003c/i> × \u003ci>I\u003c/i>) ÷ (\u003ci>z\u003c/i> × \u003ci>F\u003c/i> × \u003ci>t\u003c/i>)","why":"Time belongs in the numerator.","_n":"3hf62","_k":"8418a090"},{"t":"\u003ci>m\u003c/i> = (\u003ci>M\u003c/i> × \u003ci>I\u003c/i> × \u003ci>t\u003c/i>) ÷ (\u003ci>z\u003c/i> × \u003ci>F\u003c/i>)","why":"It folds the four steps into one.","_n":"3if72","_k":"07e33a7f"},{"t":"\u003ci>m\u003c/i> = (\u003ci>M\u003c/i> × \u003ci>I\u003c/i> × \u003ci>t\u003c/i>) ÷ \u003ci>F\u003c/i>","why":"Missing \u003ci>z\u003c/i>.","_n":"3jf82","_k":"f1258284"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A jeweller plates a trophy with 4.32 g of silver at 2.00 A. How long does it take (100% efficiency)?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"3860 s","why":"3860 is the charge in C.","_n":"3kf92","_k":"67b72c68"},{"t":"1930 s","why":"0.0400 mol Ag → 0.0400 mol e⁻ → 3860 C → 1930 s.","_n":"3lf62","_k":"d653f737"},{"t":"7720 s","why":"\u003ci>t\u003c/i> = \u003ci>Q\u003c/i> ÷ \u003ci>I\u003c/i>. A bigger current means a shorter time.","_n":"3mf52","_k":"4714e79a"},{"t":"965 s","why":"Silver needs one electron per ion; don’t halve.","_n":"3nf42","_k":"0aa890f4"}]},"b":{"prompt":"A bolt is plated with 3.27 g of zinc at 1.00 A. How long does it take (100% efficiency)?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"19 300 s","why":"That would deposit 6.54 g.","_n":"3of32","_k":"32f7cdf6"},{"t":"3270 s","why":"Treated grams as seconds.","_n":"3pfa2","_k":"b5a9e91b"},{"t":"9650 s","why":"0.0500 mol Zn → 0.100 mol e⁻ → 9650 C → 9650 s.","_n":"3qf92","_k":"46c293dd"},{"t":"4825 s","why":"Each Zn²⁺ needs 2 electrons: multiply the moles of Zn by 2.","_n":"3rf82","_k":"d3747c4c"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A plating shop measured 2.54 g of copper after passing 9650 C. What was the current efficiency?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"125%","why":"Divided the wrong way. Efficiency = actual ÷ theoretical × 100%. Side reactions waste charge, so it’s at most 100%.","_n":"3sf72","_k":"62ac8a9e"},{"t":"100%","why":"The actual mass is less than theory.","_n":"3tfe2","_k":"521cc513"},{"t":"80%","why":"Theory: 0.100 mol e⁻ → 0.0500 mol Cu → 3.175 g; 2.54 ÷ 3.175 = 0.80.","_n":"3ufd2","_k":"c8b24e3c"},{"t":"40%","why":"Theory is 3.175 g, not 6.35 g.","_n":"3vf43","_k":"045d53f7"}]},"b":{"prompt":"2.00 A for 965 s deposited 0.572 g of copper. What was the current efficiency?","use":"\u003ci>F\u003c/i> = 96 500 C/mol; Cu 63.5, Ag 108, Zn 65.4 g/mol.","options":[{"t":"About 180%","why":"That divides by 0.318 g, halving the moles of copper a second time.","_n":"3wf53","_k":"6aa14f83"},{"t":"About 90%","why":"Theory: 1930 C → 0.0200 mol e⁻ → 0.0100 mol Cu → 0.635 g; 0.572 ÷ 0.635 ≈ 0.90.","_n":"3xf23","_k":"d7c90fd4"},{"t":"About 45%","why":"Theory is 0.635 g, not 1.27 g.","_n":"3yf33","_k":"66c73d0b"},{"t":"About 111%","why":"Efficiency = actual ÷ theoretical × 100%. Side reactions waste charge, so it’s at most 100%.","_n":"3zf83","_k":"f81a26ff"}]}}]},"task":{"title":"Plating plan","summary":"Plating plan","statement":"\u003cp>Plan a plating job that meets every condition. Can you find all the plans?\u003c/p>\u003col class=\"fl-conds\">\u003cli>The metal actually plates out of the solution.\u003c/li>\u003cli>The coating has a mass of at least 2.00 g.\u003c/li>\u003cli>The coating has a mass of at most 4.00 g.\u003c/li>\u003cli>The job finishes in at most 1 hour (3600 s).\u003c/li>\u003c/ol>","checks":["Metal plates out","At least 2.00 g","At most 4.00 g","Within 1 hour"],"tips":["Al³⁺ isn’t reduced in water: H₂ forms instead.","Find the charge you need: mass ÷ \u003ci>M\u003c/i> × \u003ci>z\u003c/i> × 96 500.","Too heavy? Lower the current or the time.","Only 965 s and 1930 s fit in an hour, so the current has to do the work."],"ex
