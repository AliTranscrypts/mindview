.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.chem{white-space:nowrap}
.chem sub,.chem sup{font-size:.72em;line-height:0}
.chem sub{vertical-align:-.28em}
.chem sup{vertical-align:.5em}
.chem-tab{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.chem-tab summary{font-weight:700;cursor:pointer;min-height:28px}
.chem-tab label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 8px;font-size:.9rem;font-weight:700}
.chem-tab input{font:inherit;font-weight:400;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;flex:1 1 10rem;max-width:18rem}
.chem-tab table.vt td{text-align:left}
.chem-tab .tbl-wrap{max-height:320px;overflow:auto}

   Colours come from the course tokens only: --en-dh (ΔH arrow, energy out, orange), --en-ea (energy in, brown), --ink. */

/* radio groups (radioGroup component) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.5}

/* hero */
.eh-hx-svg{display:block;width:100%;height:auto;font-family:var(--font-ui)}
.eh-hx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.eh-hx-ctr{margin:0;font:400 1rem var(--font-ui);color:var(--ink-2);min-height:2.6em;flex:1 1 14rem}

/* Explore: enthalpy diagram builder */
.eh-how{margin-top:0}
.eh-modes{margin:0 0 12px}
.eh-subs{margin:0 0 10px}
.eh-subs[hidden]{display:none}
.eh-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.eh-view,.eh-side{min-width:0}
.eh-box{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.eh-box.drag{cursor:ns-resize;touch-action:none}
.eh-box:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.eh-svg{display:block;width:100%;max-width:620px;height:auto;margin:0 auto;font-family:var(--font-ui)}
.eh-cap{min-height:1.5em;margin:10px 0 2px;font-size:1rem}
.eh-c[hidden]{display:none}
.eh-c > * + *{margin-top:12px}
.eh-sl{margin-top:12px}
.eh-bbtns{display:flex;flex-wrap:wrap;gap:8px}
.eh-read{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--rule)}
.eh-tabs{margin-top:8px}

/* Part 3: Write it two ways */
.eh-st h3{margin-bottom:6px}
#p3-app > .eh-st:first-child{margin-top:0;padding-top:0;border-top:0}
.eh-s1row{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--sheet)}
.eh-s1p{margin:0 0 8px}
.eh-eqt{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.eh-tile{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:8px;padding:.2em .6em;background:var(--paper);min-height:36px}
.eh-op{font-weight:700;padding:0 2px}
.eh-slot{min-width:48px;min-height:40px;border:2px dashed var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink-2);font-weight:700;padding:.2em .6em}
.eh-slot.ready{border-color:var(--pen);background:var(--hi-soft);color:var(--ink)}
.eh-slot.on{border-style:solid;border-color:var(--en-dh);color:var(--ink)}
.eh-heat-t{color:var(--en-dh);font-weight:700;white-space:nowrap}
.eh-tray{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
.eh-heat{border:2px solid var(--en-dh);border-radius:8px;background:var(--sheet);padding:.3em .8em;min-height:40px}
.eh-heat[aria-pressed="true"]{background:var(--hi-soft);box-shadow:0 0 0 3px var(--hi)}
.eh-dhrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.eh-dhl{font-weight:700}
.eh-num{width:7em}
.eh-base,.eh-neweq,.eh-calc{margin:8px 0}
.eh-trs{margin:8px 0}
.eh-s3sel{margin:8px 0}

/* calculations */
.eh-h4{margin:14px 0 6px;font-size:1rem}
.eh-chiplist{display:flex;flex-wrap:wrap;gap:6px}
.eh-unit{font-weight:700}

/* task */
.eh-conds{margin:6px 0 0 1.2em;padding:0}
.eh-tcard{margin-bottom:6px}

@media (max-width:760px){
  .eh-grid{grid-template-columns:minmax(0,1fr)}

  .eh-cardrow button{flex:0 0 auto}
  .eh-cards .rg-wrap{flex-wrap:wrap;min-width:0}
  .eh-cards .rg-wrap > .rg{max-width:100%}
}

us sign","text":"In every chemical change, energy moves between the \u003cstrong>system\u003c/strong> (the chemicals) and the \u003cstrong>surroundings\u003c/strong>. If energy flows out, the change is \u003cstrong>exothermic\u003c/strong> and Δ\u003ci>H\u003c/i> is negative; if it flows in, it’s \u003cstrong>endothermic\u003c/strong> and Δ\u003ci>H\u003c/i> is positive. A \u003cstrong>thermochemical equation\u003c/strong> records exactly how much, for exactly the amounts written.","fig":{"html":"\u003cdiv class=\"eh-hx\">\u003csvg class=\"eh-hx-svg\" id=\"eh-hx-svg\" viewBox=\"0 0 480 340\" role=\"img\" aria-label=\"Left: a hand warmer pouch is squeezed; orange heat arrows flow out of it into a hand and the thermometer beside it rises. Below it, an enthalpy diagram steps down from 4Fe + 3O₂ to 2Fe₂O₃ with an orange downward arrow, ΔH = −1648.4 kJ. Right: a cold pack is squeezed; orange heat arrows flow from the hand into the pack and its thermometer drops. Below it, an enthalpy diagram steps up from NH₄NO₃(s) to NH₄⁺(aq) + NO₃⁻(aq) with an upward arrow, ΔH = +25.7 kJ.\">\u003c/svg>\u003cdiv class=\"eh-hx-row\">\u003cp class=\"eh-hx-ctr\" id=\"eh-hx-ctr\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"eh-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can use system and surroundings to decide whether a change is exothermic or endothermic and give the sign of Δ\u003ci>H\u003c/i>.","I can draw and read enthalpy diagrams.","I can write a thermochemical equation both ways: with Δ\u003ci>H\u003c/i>, and with a heat term.","I can scale and reverse thermochemical equations and calculate the energy for a given amount (moles or mass).","I can compare the energy scales of physical, chemical and nuclear changes.","I can choose reactions for an energy purpose (heating, cooling) using Δ\u003ci>H\u003c/i>."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Moles and molar mass","goal":4,"prompt":"How many moles are in 32.0 g of methane, CH₄? (Use \u003ci>M\u003c/i> = 16.0 g/mol.)","options":[{"t":"32.0 mol","why":"Grams aren’t moles.","_n":"0749","_k":"a4f20ddc"},{"t":"0.500 mol","why":"That’s 16.0 ÷ 32.0, upside down.","_n":"1719","_k":"281be860"},{"t":"512 mol","why":"Multiplied instead of dividing.","_n":"2729","_k":"2a8739a4"},{"t":"2.00 mol","why":"32.0 ÷ 16.0.","_n":"36f9","_k":"be583f11"}],"hints":["\u003ci>n\u003c/i> = \u003ci>m\u003c/i> ÷ \u003ci>M\u003c/i>.","32.0 ÷ 16.0.","2.00 mol."]},{"id":"w2","skill":"Moles and molar mass","goal":4,"prompt":"What is the molar mass of propane, C₃H₈? (Use C 12.0, H 1.0.)","options":[{"t":"13.0 g/mol","why":"Added one C and one H.","_n":"4709","_k":"a1fcb424"},{"t":"96.0 g/mol","why":"Multiplied 12 by 8.","_n":"56d9","_k":"1772dcc2"},{"t":"20.0 g/mol","why":"Counted one C and eight H: 12 + 8.","_n":"66e9","_k":"fa266780"},{"t":"44.0 g/mol","why":"3(12.0) + 8(1.0).","_n":"77b9","_k":"bd052e22"}],"hints":["Count the atoms.","3 C and 8 H.","36 + 8 = 44."]},{"id":"w3","skill":"Balancing equations","goal":3,"prompt":"Balance: C₃H₈ + __O₂ → 3CO₂ + 4H₂O.","options":[{"t":"3","why":"That balances only the CO₂ oxygen.","_n":"87c9","_k":"8ae2adf3"},{"t":"5","why":"Right side: 6 + 4 = 10 O atoms, so 5 O₂.","_n":"943f","_k":"43918f11"},{"t":"7","why":"Count again: 3 × 2 + 4 × 1 = 10.","_n":"a42f","_k":"728c6e33"},{"t":"10","why":"10 is the number of O atoms; O₂ has two each.","_n":"b45f","_k":"b3edaa7f"}],"hints":["Count O on the right.","6 + 4 = 10.","5 O₂."]},{"id":"w4","skill":"Balancing equations","goal":4,"prompt":"In 2H₂ + O₂ → 2H₂O, how many moles of H₂O form from 1 mol of O₂?","options":[{"t":"2 mol","why":"Mole ratio 1 : 2.","_n":"c44f","_k":"30598b64"},{"t":"1 mol","why":"Read the coefficients.","_n":"d3ff","_k":"d470ce5b"},{"t":"0.5 mol","why":"Inverted the ratio.","_n":"e3ef","_k":"ef8b6cf9"},{"t":"4 mol","why":"Doubled twice.","_n":"f41f","_k":"65926daf"}],"hints":["Use the coefficients.","O₂ : H₂O = 1 : 2.","2 mol."]},{"id":"w5","skill":"Heat flow","goal":1,"prompt":"You dissolve a salt in water and the beaker feels cold. Which way did heat flow?","options":[{"t":"From the beaker to the air","why":"The beaker is cold because heat left it \u003cem>into the system\u003c/em>.","_n":"g40f","_k":"e2fe5027"},{"t":"From the salt into the water","why":"Then the beaker would feel warm. The system absorbs energy \u003cem>from\u003c/em> the surroundings, so the surroundings (your hand) feel colder.","_n":"h4bf","_k":"72bc942e"},{"t":"From the water and your hand into the dissolving salt","why":"The system absorbed energy, so it’s endothermic.","_n":"i4af","_k":"954cba8f"},{"t":"No heat flowed; cold was released","why":"‘Cold’ isn’t a substance; heat flows in.","_n":"jd1e","_k":"adee7c26"}],"hints":["Heat flows from warm to cool.","Your hand lost heat.","Into the system."]},{"id":"w6","skill":"Heat flow","goal":1,"prompt":"A burning candle warms the room. The burning is…","options":[{"t":"endothermic, because it needs a match","why":"The match supplies activation energy; overall, energy is released.","_n":"kd2e","_k":"98014c98"},{"t":"endothermic","why":"The room gains energy. Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"ld3e","_k":"80387072"},{"t":"neither, because it’s a physical change","why":"Combustion is chemical.","_n":"md4e","_k":"f6104e18"},{"t":"exothermic","why":"Energy leaves the system.","_n":"ncde","_k":"5a651f3d"}],"hints":["Did the surroundings warm or cool?","Warmed.","Exothermic."]}],"refreshers":{"Moles and molar mass":"\u003ci>n\u003c/i> = \u003ci>m\u003c/i> ÷ \u003ci>M\u003c/i>. Add up atomic masses for \u003ci>M\u003c/i>.","Balancing equations":"Balance C, then H, then O. Coefficients give mole ratios.","Heat flow":"Heat flows from hot to cold. If the surroundings cool, the system took in energy (endothermic)."}}},"explore":{"heading":"Enthalpy diagram builder","intro":"Choose a reaction, build its enthalpy diagram, scale it, reverse it, and see the energy the surroundings gain or lose.","how":"Choose a mode. In \u003cstrong>Diagram\u003c/strong>, pick a reaction card, then set the amount and the direction. \u003cstrong>Build it\u003c/strong> hides Δ\u003ci>H\u003c/i> until you place the products’ level (drag it, or use the arrow keys). \u003cstrong>Linked panels\u003c/strong> pairs burning methane with limestone.","bondsNote":"Qualitative: bar lengths follow the bond energies in the course table, but the numbers wait for the bond-energy module.","scalesNote":"Each step on the ruler is ten times the one before. Tap a marker, then tap the ruler (or use the slider) to place it; then reveal the real values.","predictions":[{"id":"p1","prompt":"The Methane card in \u003cstrong>Build it\u003c/strong>. Should the products’ level be above or below the reactants’?","options":[{"t":"Above, because flames are hot","_n":"ocee","_k":"a3476772"},{"t":"Above: energy is released, so Δ\u003ci>H\u003c/i> is positive","_n":"pcfe","_k":"ca39eb4a"},{"t":"At the same level","_n":"qd0e","_k":"fa8402b0"},{"t":"Below: energy leaves, so Δ\u003ci>H\u003c/i> is negative","_n":"rc9e","_k":"e04b8394"}],"explain":"The products have less enthalpy; the difference went to the surroundings. Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative."},{"id":"p2","prompt":"The Limestone card, forward. Now flip the direction toggle. What is Δ\u003ci>H\u003c/i> for CaO + CO₂ → CaCO₃?","options":[{"t":"−179.2 kJ","_n":"scae","_k":"81a2ad8d"},{"t":"0 kJ","_n":"td7f","_k":"45e57bc3"},{"t":"+358.4 kJ","_n":"ud6f","_k":"ef93f303"},{"t":"+179.2 kJ","_n":"vd5f","_k":"59a9bb5b"}],"explain":"Reversing a reaction reverses the energy flow. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>."},{"id":"p3","prompt":"The Methane card, multiplier 2. What is Δ\u003ci>H\u003c/i> for burning 2 mol of CH₄?","options":[{"t":"−890.5 kJ","_n":"wd4f","_k":"f2f12f13"},{"t":"−445.3 kJ","_n":"xd3f","_k":"b5bf346b"},{"t":"+1781.0 kJ","_n":"yd2f","_k":"7845c45b"},{"t":"−1781.0 kJ","_n":"zd1f","_k":"b0b995a0"}],"explain":"Twice the reaction, twice the energy. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>."},{"id":"p4","prompt":"\u003cstrong>Energy scales\u003c/strong> mode. About how many times more energy does burning 1 mol of methane release than melting 1 mol of ice absorbs?","options":[{"t":"About 150","_n":"10d0f","_k":"d0145390"},{"t":"About the same","_n":"11cff","_k":"88ec9ae9"},{"t":"About 15 000","_n":"12cef","_k":"54e60085"},{"t":"About 1.5","_n":"1345e","_k":"0b043c24"}],"explain":"The markers sit about two steps (powers of ten) apart: 890.5 ÷ 6.01 ≈ 148. Chemical changes involve far more energy than phase changes, and nuclear changes far more again."}],"chalIntro":"Use the builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenges 1 and 2 use one reaction in Diagram mode; challenge 3 uses \u003cstrong>Linked panels\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[4,6],"prompt":"Set a card, direction and amount so the system \u003cstrong>releases\u003c/strong> exactly 824.2 kJ.","why":"Hand warmer, forward, × 0.5: ½ × (−1648.4 kJ) = −824.2 kJ.","general":"Not yet. The system must release exactly 824.2 kJ.","hints":["Which card’s Δ\u003ci>H\u003c/i> is double 824.2?","1648.4 kJ: the hand warmer.","Hand warmer, forward, × 0.5."]},{"id":"tc2","goal":[4,6],"prompt":"Make a process that \u003cem>absorbs\u003c/em> exactly 358.4 kJ.","why":"Limestone, forward, × 2: 2 × (+179.2 kJ) = +358.4 kJ.","general":"Not yet. The process must absorb exactly 358.4 kJ.","hints":["Absorbing means Δ\u003ci>H\u003c/i> &gt; 0.","358.4 ÷ 2 = 179.2.","Limestone × 2."]},{"id":"tc3","goal":[4,6],"stretch":true,"prompt":"Two linked panels: on the left, Methane × 1 (forward); on the right, Limestone with an adjustable multiplier. Set the limestone amount to absorb as much energy as possible without needing more than the heat that 1 mol of methane releases.","why":"4.5 × 179.2 = 806.4 kJ, which is ≤ 890.5 kJ; 5.0 would need 896.0 kJ.","general":"Not yet. Find the largest limestone amount whose heat need still fits in 890.5 kJ.","hints":["How many 179.2s fit into 890.5?","5 × 179.2 = 896.0, too much.","4.5."]}]},"part3":{"slug":"thermochemical","name":"Two ways","heading":"Write it two ways","intro":"A thermochemical equation can carry its energy change two ways: as a Δ\u003ci>H\u003c/i> value beside the equation, or as a heat term inside it. Place the heat tiles, transform an equation, then check the values against the course data table.","s1":{"title":"Station 1: Place the heat","intro":"Each equation’s species are tiles. Tap the heat tile, then tap the end of the equation where it belongs. Then fill in the Δ\u003ci>H\u003c/i> box with a sign and a value.","items":[{"id":"ch4","_a":"R2oX"},{"id":"caco3","_a":"R3QX"},{"id":"cold","_a":"R3QX"}]},"s2":{"title":"Station 2: Transform it","intro":"Start from the equation below. Choose a transformation and write the new Δ\u003ci>H\u003c/i>.","gasNote":"States matter: 2 × 44.0 kJ is needed to vaporize the water, so less energy is released."},"s3":{"title":"Station 3: Check it with data","intro":"Every Δ\u003ci>H\u003c/i> above can be confirmed from the course table of enthalpies of formation: add up the products’ values, subtract the reactants’. (You’ll do this properly in the formation-enthalpy module.)"},"quickCheck":{"title":"Quick check","summary":"Write it two ways quick check","items":[{"id":"q1","goal":3,"prompt":"Rewrite with a heat term: N₂ + O₂ → 2NO, Δ\u003ci>H\u003c/i> = +182.6 kJ","choices":[{"t":"182.6 kJ on the left","fb":"Right. Endothermic: heat is a reactant.","_n":"1446e","_k":"f17fd553"},{"t":"no heat term","fb":"Endothermic: heat is a reactant.","_n":"1543e","_k":"45561ffc"},{"t":"−182.6 kJ on the left","fb":"Endothermic: heat is a reactant. Heat terms are written as positive amounts.","_n":"1644e","_k":"28fe5b50"},{"t":"182.6 kJ on the right","fb":"Endothermic: heat is a reactant. Exothermic: heat is a \u003cem>product\u003c/em> (right side). Endothermic: heat is a \u003cem>reactant\u003c/em> (left side).","_n":"1741e","_k":"8be93f44"}]},{"id":"q2","goal":4,"prompt":"Δ\u003ci>H\u003c/i> for ½N₂ + ½O₂ → NO?","choices":[{"t":"+182.6 kJ","fb":"Half the equation, half of Δ\u003ci>H\u003c/i>. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>.","_n":"1842e","_k":"e49e0eb8"},{"t":"−91.3 kJ","fb":"Half the equation, half of Δ\u003ci>H\u003c/i>, and it isn’t reversed, so the sign stays.","_n":"193fe","_k":"0a7b9d90"},{"t":"+91.3 kJ","fb":"Right. Half the equation, half of Δ\u003ci>H\u003c/i>.","_n":"1a40e","_k":"2866bb08"},{"t":"+365.2 kJ","fb":"Half the equation, half of Δ\u003ci>H\u003c/i>.","_n":"1b4de","_k":"5b3bd614"}]},{"id":"q3","goal":3,"prompt":"Which shows an exothermic heat term?","choices":[{"t":"A + B + 50 kJ → C","fb":"Heat is released as a product.","_n":"1c4ee","_k":"8782e2a4"},{"t":"A + B → C − 50 kJ","fb":"Heat is released as a product, written as a positive amount.","_n":"1d4be","_k":"d533e554"},{"t":"50 kJ → A + B + C","fb":"Heat is released as a product.","_n":"1e4ae","_k":"1f04aa22"},{"t":"A + B → C + 50 kJ","fb":"Right. Heat is released as a product.","_n":"1f4de","_k":"a67d0363"}]},{"id":"q4","goal":3,"prompt":"Why does H₂O(l) vs H₂O(g) change Δ\u003ci>H\u003c/i>?","choices":[{"t":"Gas is heavier","fb":"Forming liquid water releases more energy than forming vapour.","_n":"1g4ce","_k":"e5c4158a"},{"t":"Liquids have no enthalpy","fb":"Forming liquid water releases more energy than forming vapour.","_n":"1h4fe","_k":"ae92f4cc"},{"t":"Vaporizing absorbs 44.0 kJ/mol","fb":"Right. Forming liquid water releases more energy than forming vapour.","_n":"1i4ee","_k":"b25740cd"},{"t":"It doesn’t","fb":"Forming liquid water releases more energy than forming vapour.","_n":"1j51e","_k":"2b5442ee"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Exothermic or endothermic?","summary":"Exothermic or endothermic?","goal":[1,5],"noun":"change","txt":true,"instruction":"Sort each change by the direction its energy flows.","boxes":[{"id":"exo","label":"Exothermic","sub":"Δ\u003ci>H\u003c/i> &lt; 0"},{"id":"endo","label":"Endothermic","sub":"Δ\u003ci>H\u003c/i> &gt; 0"}],"items":[{"id":"s1","t":"Water freezing","_a":"R11NXUQ=","why":"Freezing releases energy as the particles settle into the solid.","wrong":{"endo":"Freezing \u003cem>releases\u003c/em> energy as the particles settle into the solid; that’s why orchards are sprayed with water before a frost."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Exothermic. Freezing releases energy as the particles settle into the solid."]},{"id":"s2","t":"Steam condensing","_a":"R11NXUQ=","why":"Condensing releases energy as the particles come together: that’s why a steam burn is so bad.","wrong":{"endo":"Condensing \u003cem>releases\u003c/em> energy as the particles come together. Steam burns because it condenses on your skin."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Exothermic. Condensing releases energy as the particles come together: that’s why a steam burn is so bad."]},{"id":"s3","t":"Propane burning","_a":"R11NXUQ=","why":"Combustion releases energy: Δ\u003ci>H\u003c/i> = −2219.9 kJ.","wrong":{"endo":"A barbecue warms its surroundings: energy leaves the system."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Exothermic. Combustion releases energy: Δ\u003ci>H\u003c/i> = −2219.9 kJ."]},{"id":"s4","t":"Photosynthesis","_a":"R11bVglE","why":"Plants absorb light energy and store it in glucose.","wrong":{"exo":"Photosynthesis stores energy from sunlight in glucose: energy enters the system."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Endothermic. Plants absorb light energy and store it in glucose."]},{"id":"s5","t":"A cold pack activating","_a":"R11bVglE","why":"Dissolving absorbs energy from your hand, so the pack feels cold.","wrong":{"exo":"The system absorbs energy \u003cem>from\u003c/em> the surroundings, so the surroundings (your hand) feel colder."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Endothermic. Dissolving absorbs energy from your hand, so the pack feels cold."]},{"id":"s6","t":"A hand warmer activating","_a":"R11NXUQ=","why":"Iron oxidizing releases energy into your hand.","wrong":{"endo":"The pack warms your hand: energy leaves the system."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Exothermic. Iron oxidizing releases energy into your hand."]},{"id":"s7","t":"Ice melting","_a":"R11bVglE","why":"Melting absorbs 6.01 kJ/mol from the surroundings.","wrong":{"exo":"Melting takes energy from the surroundings: that’s why ice cools a drink."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Endothermic. Melting absorbs 6.01 kJ/mol from the surroundings."]},{"id":"s8","t":"Sweat evaporating from skin","_a":"R11bVglE","why":"Evaporating sweat takes heat from your skin.","wrong":{"exo":"Evaporating sweat takes heat from your skin. The system absorbs energy \u003cem>from\u003c/em> the surroundings, so the surroundings (your hand) feel colder."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Endothermic. Evaporating sweat takes heat from your skin."]},{"id":"s9","t":"Limestone decomposing in a kiln","_a":"R11bVglE","why":"The kiln must keep heating it: Δ\u003ci>H\u003c/i> = +179.2 kJ.","wrong":{"exo":"A kiln supplies heat the whole time: the reaction absorbs energy."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Endothermic. The kiln must keep heating it: Δ\u003ci>H\u003c/i> = +179.2 kJ."]},{"id":"s10","t":"An acid neutralizing a base","_a":"R11NXUQ=","why":"Neutralization warms the solution.","wrong":{"endo":"The solution warms up: energy leaves the system."},"hints":["Do the surroundings warm or cool?","Phase changes toward a more ordered state release energy.","Exothermic. Neutralization warms the solution."]}],"wrongDefault":"Ask whether the surroundings warm or cool."},{"id":"calc","type":"custom","title":"Energy calculations","summary":"Energy calculations","goal":[3,4,5],"instruction":"First, one investigation question from the sort. Then six calculations: items 3 to 6 are non-routine (★), and 5 and 6 go beyond the Final Check.","how":"Type your answer, then press Check. Give Δ\u003ci>H\u003c/i> with its sign; an amount of energy released is a positive number.","use":"Methane: CH₄ + 2O₂ → CO₂ + 2H₂O, Δ\u003ci>H\u003c/i> = −890.5 kJ. Propane: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O, Δ\u003ci>H\u003c/i> = −2219.9 kJ. Limestone: CaCO₃ → CaO + CO₂, Δ\u003ci>H\u003c/i> = +179.2 kJ.","inv":{"id":"inv","kind":"chips","goal":1,"prompt":"\u003cstrong>Investigation:\u003c/strong> You touch the outside of a beaker while a cold pack’s salt dissolves (sort item 5), and it feels cold. Name the system and the surroundings.","options":[{"t":"System: the dissolving salt. Surroundings: the water, the beaker and your hand","why":"The salt dissolving is the change; everything that lost heat to it is the surroundings.","_n":"1k50e","_k":"9b5eb3e5"},{"t":"System: the water. Surroundings: the salt, the beaker and your hand","why":"The water is part of the surroundings: it lost heat. The system absorbs energy \u003cem>from\u003c/em> the surroundings, so the surroundings (your hand) feel colder.","_n":"1l43e","_k":"82d59f41"},{"t":"System: the beaker. Surroundings: the air","why":"The beaker only holds the change; the system is the chemicals that change.","_n":"1m42e","_k":"053ca729"},{"t":"System: your hand. Surroundings: the beaker and the water","why":"Your hand is part of the surroundings: it lost heat to the dissolving salt.","_n":"1n39e","_k":"880c6b9c"}],"hints":["The system is the chemicals that change.","What is changing here? The salt dissolves.","System: the dissolving salt. Surroundings: the water, the beaker and your hand."]},"items":[{"id":"c1","kind":"num","goal":4,"prompt":"Δ\u003ci>H\u003c/i> for 3CH₄ + 6O₂ → 3CO₂ + 6H₂O?","_a":"SAoDBVdIAg==","tol":0.05,"unit":"kJ","display":"−2671.5 kJ","signed":true,"wrong":[{"match":-890.5,"fb":"Multiply by 3. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>."},{"match":2671.5,"fb":"Check the sign: burning releases energy, so Δ\u003ci>H\u003c/i> is negative."}],"fb":"Every coefficient is 3 times the methane equation’s, so Δ\u003ci>H\u003c/i> is 3 times as big.","why":"3 × (−890.5 kJ) = −2671.5 kJ.","hints":["Compare the coefficients with the methane equation.","Everything is tripled.","3 × (−890.5) = −2671.5 kJ."]},{"id":"c2","kind":"num","goal":4,"prompt":"Δ\u003ci>H\u003c/i> for 2CaO + 2CO₂ → 2CaCO₃?","_a":"SAsACkhS","tol":0.05,"unit":"kJ","display":"−358.4 kJ","signed":true,"wrong":[{"match":358.4,"fb":"Reversed, so the sign changes. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>."},{"match":-179.2,"fb":"The coefficients are doubled too: double Δ\u003ci>H\u003c/i>."},{"match":179.2,"fb":"Reversed \u003cem>and\u003c/em> doubled."}],"fb":"This is the limestone equation reversed and doubled.","why":"Reverse: −179.2 kJ; double: −358.4 kJ.","hints":["Is it the limestone equation forward or reversed?","Reversed, and the coefficients are 2.","2 × (−179.2) = −358.4 kJ."]},{"id":"c3","kind":"num","goal":4,"star":true,"prompt":"Energy released when 8.0 g of CH₄ burns (\u003ci>M\u003c/i> = 16.0 g/mol)?","_a":"UQwAHFRT","tol":0.8,"unit":"kJ","display":"445 kJ","wrong":[{"match":7124,"fb":"You multiplied by the mass. Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first."},{"match":890.5,"fb":"That’s for 1 mol: 8.0 g is only 0.50 mol."}],"fb":"Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first.","why":"8.0 ÷ 16.0 = 0.50 mol; 0.50 × 890.5 = 445 kJ released.","hints":["Moles first.","8.0 ÷ 16.0 = 0.50 mol.","0.50 × 890.5 = 445 kJ released."]},{"id":"c4","kind":"num","goal":4,"star":true,"prompt":"Energy released when 11.0 g of C₃H₈ burns (\u003ci>M\u003c/i> = 44.0 g/mol)?","_a":"UA0BHF9e","tol":0.8,"unit":"kJ","display":"555 kJ","wrong":[{"match":2219.9,"fb":"11.0 g is only 0.250 mol."},{"match":24418.9,"fb":"You multiplied by the mass. Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first."}],"fb":"Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first.","why":"11.0 ÷ 44.0 = 0.250 mol; 0.250 × 2219.9 = 555 kJ released.","hints":["Moles first.","11.0 ÷ 44.0 = 0.250 mol.","0.250 × 2219.9 = 555 kJ released."]},{"id":"c5","kind":"num","goal":4,"star":true,"prompt":"A furnace must deliver 4452.5 kJ. How many moles of CH₄ must burn?","_a":"UA==","tol":0.01,"unit":"mol","display":"5.00 mol","wrong":[{"match":0.2,"fb":"Divide the energy by 890.5 kJ/mol."}],"fb":"Divide the energy needed by the energy per mole.","why":"4452.5 ÷ 890.5 = 5.00 mol.","hints":["Each mole of CH₄ gives 890.5 kJ.","How many 890.5s make 4452.5?","4452.5 ÷ 890.5 = 5.00 mol."]},{"id":"c6","kind":"chips","goal":5,"star":true,"prompt":"\u003cstrong>STSE:\u003c/strong> Per kJ of heat delivered, which fuel releases less CO₂: methane (1 CO₂ per 890.5 kJ) or propane (3 CO₂ per 2219.9 kJ, i.e. 1 per 740.0 kJ)?","options":[{"t":"Methane","why":"Methane makes 1 CO₂ per 890.5 kJ, propane 1 per 740 kJ: methane gives more heat per CO₂.","_n":"1o3ae","_k":"765af876"},{"t":"Propane","why":"Propane makes 1 CO₂ per 740 kJ, methane 1 per 890.5 kJ: methane gives more heat per CO₂.","_n":"1p3be","_k":"ac933159"}],"hints":["Compare the heat delivered per CO₂.","Methane: 890.5 kJ per CO₂. Propane: 740.0 kJ per CO₂.","Methane: more heat for each CO₂."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Milan","goal":[1,4],"instruction":"Milan made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"A reaction in a beaker makes the water warmer. Describe Δ\u003ci>H\u003c/i>.","steps":["The reaction is the system; the water is the surroundings.","The water warmed, so energy flowed from the system to the surroundings.","Energy was released, so Δ\u003ci>H\u003c/i> is positive.","So the reaction is endothermic."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Δ\u003ci>H\u003c/i> is zero.","why":"Energy moved.","_n":"1q3ce","_k":"086c5931"},{"t":"The water is the system.","why":"The reaction is the system.","_n":"1r3de","_k":"d50a4f39"},{"t":"Step 3 is correct.","why":"Release means Δ\u003ci>H\u003c/i> &lt; 0. Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"1s3ee","_k":"3fa02649"},{"t":"Energy left the system, so its enthalpy fell: Δ\u003ci>H\u003c/i> is negative (exothermic).","why":"Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"1t3fe","_k":"715df306"}],"hints":["Did the system gain or lose enthalpy?","Lose.","Energy left the system, so its enthalpy fell: Δ\u003ci>H\u003c/i> is negative (exothermic)."]},{"id":"e2","goal":4,"task":"Given 4Fe + 3O₂ → 2Fe₂O₃, Δ\u003ci>H\u003c/i> = −1648.4 kJ, find Δ\u003ci>H\u003c/i> for Fe₂O₃ → 2Fe + 3/2 O₂.","steps":["The target is the reverse of the given reaction.","It’s also half of the reversed reaction.","Halving gives −824.2 kJ.","Reversing doesn’t change the size, so Δ\u003ci>H\u003c/i> = −824.2 kJ."],"_a":"Vg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct so far.",""],"fixes":[{"t":"Step 4 is correct.","why":"The size is unchanged, but the sign flips. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>.","_n":"1u40e","_k":"dc5a8a4f"},{"t":"Reversing flips the sign: Δ\u003ci>H\u003c/i> = +824.2 kJ.","why":"Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>.","_n":"1v41e","_k":"a0334de6"},{"t":"−1648.4 kJ.","why":"Both steps were skipped.","_n":"1w42e","_k":"6803a257"},{"t":"+1648.4 kJ.","why":"Halve it too.","_n":"1x3fe","_k":"5d54b63d"}],"hints":["What happens to the sign on reversal?","It changes.","Reversing flips the sign: Δ\u003ci>H\u003c/i> = +824.2 kJ."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: how small phase-change energies are compared with combustion, or how big nuclear energies are?"},{"id":"j2","q":"In your own words, explain why an endothermic reaction makes a beaker feel cold."},{"id":"j3","q":"Explain to a friend how to change Δ\u003ci>H\u003c/i> when you reverse or scale an equation."},{"id":"j4","q":"Which part of thermochemical equations do you still get wrong? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A reaction releases heat to its surroundings. Its Δ\u003ci>H\u003c/i> is…","options":[{"t":"positive (endothermic)","why":"Endothermic absorbs heat.","_n":"1y3ee","_k":"8ddae863"},{"t":"zero","why":"Energy moved.","_n":"1z3de","_k":"bbbd0241"},{"t":"positive (exothermic)","why":"Release means a negative Δ\u003ci>H\u003c/i>. Energy \u003cem>leaving\u003c/em> the system makes e.","_n":"2a4d0","_k":"2fe67b89"},{"t":"CaCO₃ + 179.2 kJ → CaO + CO₂","why":"Endothermic: heat is a reactant.","_n":"2b520","_k":"63ce60d8"},{"t":"CaCO₃ → CaO + CO₂ + 179.2 kJ","why":"Exothermic: heat is a \u003cem>product\u003c/em> (right side). Endothermic: heat is a \u003cem>reactant\u003c/em> (left side).","_n":"2c530","_k":"17bfbdbf"},{"t":"CaCO₃ → CaO + CO₂ − 179.2 kJ","why":"Positive amounts, on the correct side.","_n":"2d500","_k":"eacc2e83"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Which order is correct, from smallest to largest energy change per mole?","options":[{"t":"nuclear fission &lt; burning methane &lt; melting ice","why":"Burning methane releases about 150 times as much as melting the same number of moles of ice. Fission releases about 10 million times more again.","_n":"2e510","_k":"eef1e9ff"},{"t":"All about the same","why":"Burning methane releases about 150 times as much as melting the same number of moles of ice. Fission releases about 10 million times more again.","_n":"2f460","_k":"17bc28bc"},{"t":"burning methane &lt; melting ice &lt; nuclear fission","why":"6.01 &lt; 890.5. Burning methane releases about 150 times as much as melting the same number of moles of ice. Fission releases about 10 million times more again.","_n":"2g470","_k":"94b0695c"},{"t":"melting ice &lt; burning methane &lt; nuclear fission","why":"6.01 &lt; 890.5 &lt; about 2 × 10\u003csup>10\u003c/sup> kJ/mol.","_n":"2h540","_k":"8c9c3498"}]},"b":{"prompt":"Which typically involves the largest energy change per mole?","options":[{"t":"boiling water","why":"44.0 kJ/mol.","_n":"2i530","_k":"8a3128c9"},{"t":"fission of uranium-235","why":"About 2 × 10\u003csup>10\u003c/sup> kJ/mol.","_n":"2j560","_k":"059cdc34"},{"t":"dissolving a salt","why":"Tens of kJ/mol.","_n":"2k550","_k":"f135dad1"},{"t":"burning propane","why":"2219.9 kJ/mol.","_n":"2l500","_k":"2446c37b"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"N₂ + O₂ → 2NO, Δ\u003ci>H\u003c/i> = +182.6 kJ. What is Δ\u003ci>H\u003c/i> for 2NO → N₂ + O₂ when 3 mol of NO decompose?","options":[{"t":"−547.8 kJ","why":"That’s for 6 mol NO (3 × −182.6).","_n":"2m4f0","_k":"059cdeb7"},{"t":"−273.9 kJ","why":"Reversed: −182.6 kJ per 2 mol NO, so −91.3 kJ per mol × 3.","_n":"2n520","_k":"cb663fec"},{"t":"+273.9 kJ","why":"Reversing flips the sign. Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>.","_n":"2o510","_k":"b71507c1"},{"t":"−182.6 kJ","why":"This is for 3 mol, not 2.","_n":"2p4c0","_k":"212e7427"}]},"b":{"prompt":"4Fe + 3O₂ → 2Fe₂O₃, Δ\u003ci>H\u003c/i> = −1648.4 kJ. What is Δ\u003ci>H\u003c/i> when 1 mol of Fe₂O₃ decomposes into its elements?","options":[{"t":"+412.1 kJ","why":"That’s per mol of Fe.","_n":"2q4b0","_k":"6366755f"},{"t":"−824.2 kJ","why":"Δ\u003ci>H\u003c/i> belongs to the equation as written: reverse it and change the sign; double it and double Δ\u003ci>H\u003c/i>.","_n":"2rdc0","_k":"0899454d"},{"t":"+824.2 kJ","why":"Reverse (+1648.4 kJ for 2 mol of Fe₂O₃), then halve for 1 mol.","_n":"2sdb0","_k":"d0ea5d2a"},{"t":"+1648.4 kJ","why":"That’s for 2 mol.","_n":"2tda0","_k":"f4670cc1"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"How much energy is released when 4.0 g of CH₄ burns completely? (\u003ci>M\u003c/i> = 16.0 g/mol; Δ\u003ci>H\u003c/i> = −890.5 kJ/mol)","options":[{"t":"890.5 kJ","why":"That’s for 1 mol. Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first.","_n":"2ud90","_k":"fa0de440"},{"t":"3562 kJ","why":"You multiplied by the mass. Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first.","_n":"2vd80","_k":"6942feb2"},{"t":"223 kJ","why":"0.25 mol × 890.5 = 222.6 kJ.","_n":"2wd70","_k":"6f56576f"},{"t":"55.7 kJ","why":"You divided by the molar mass twice.","_n":"2xd60","_k":"3dc6b2da"}]},"b":{"prompt":"How much energy is released when 22.0 g of C₃H₈ burns completely? (\u003ci>M\u003c/i> = 44.0 g/mol; Δ\u003ci>H\u003c/i> = −2219.9 kJ/mol)","options":[{"t":"2219.9 kJ","why":"That’s for 1 mol. Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first.","_n":"2yd50","_k":"180775d0"},{"t":"4440 kJ","why":"That’s for 2 mol; 22.0 g is 0.500 mol.","_n":"2zd40","_k":"3320d972"},{"t":"1110 kJ","why":"0.500 mol × 2219.9 = 1110 kJ.","_n":"30d30","_k":"b50d5def"},{"t":"48 838 kJ","why":"You multiplied by the mass. Δ\u003ci>H\u003c/i> is per mole of reaction as written. Convert grams to moles first.","_n":"31d60","_k":"fefa9128"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A cold pack absorbs 25.7 kJ per mole of NH₄NO₃ dissolved. How many moles must dissolve to absorb 12.85 kJ, and what happens to the pack’s temperature?","options":[{"t":"330 mol; it gets colder","why":"That’s 12.85 × 25.7: divide instead.","_n":"32d70","_k":"e4e68d2a"},{"t":"0.500 mol; it gets colder","why":"12.85 ÷ 25.7 = 0.500 mol; the dissolving absorbs heat, so the pack cools.","_n":"33d80","_k":"da4d24af"},{"t":"2.00 mol; it gets colder","why":"That’s 25.7 ÷ 12.85, upside down.","_n":"34d90","_k":"8cc53922"},{"t":"0.500 mol; it gets warmer","why":"The system absorbs energy \u003cem>from\u003c/em> the surroundings, so the surroundings (your hand) feel colder.","_n":"35d20","_k":"ea1e23e8"}]},"b":{"prompt":"A hand warmer reaction releases 1648.4 kJ per 4 mol of Fe. How much energy does 1.0 mol of Fe release, and what happens to the pack?","options":[{"t":"412.1 kJ; it cools","why":"Energy is released, so the surroundings warm. Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"36d30","_k":"fe699b9a"},{"t":"412.1 kJ; it warms","why":"1648.4 ÷ 4 = 412.1 kJ, released into the surroundings.","_n":"37d40","_k":"38d1ec77"},{"t":"824.2 kJ; it warms","why":"That’s for 2 mol of Fe.","_n":"38d50","_k":"47d9d2b2"},{"t":"6593.6 kJ; it warms","why":"Divide by 4, don’t multiply.","_n":"39ce0","_k":"27f29ad2"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":" nts’; the arrow points up, labelled with a positive Δ\u003ci>H\u003c/i>.”","why":"Energy enters the system, so the products have more enthalpy.","_n":"3k4f0","_k":"81cd724d"},{"t":"“Products below reactants, arrow down, Δ\u003ci>H\u003c/i> positive.”","why":"Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"3l420","_k":"2173ffc1"}]},"b":{"prompt":"Which enthalpy diagram description matches CH₄ + 2O₂ → CO₂ + 2H₂O, Δ\u003ci>H\u003c/i> = −890.5 kJ?","options":[{"t":"“CO₂ + 2H₂O on the higher level.”","why":"Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"3m430","_k":"9500e381"},{"t":"“An upward arrow of 890.5 kJ.”","why":"Energy \u003cem>leaving\u003c/em> the system makes Δ\u003ci>H\u003c/i> negative.","_n":"3n400","_k":"32c6ff11"},{"t":"“CH₄ + 2O₂ on the higher level, CO₂ + 2H₂O lower, with a downward arrow of 890.5 kJ.”","why":"Exothermic: the products sit 890.5 kJ lower.","_n":"3o410","_k":"b1e0b206"},{"t":"“Both on the same level.”","why":"Energy is released.","_n":"3p460","_k":"cecb0809"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A company wants a reaction for a \u003cem>cold pack\u003c/em>. Which reaction fits?","options":[{"t":"CaO + CO₂ → CaCO₃, Δ\u003ci>H\u003c/i> = −179.2 kJ","why":"Exothermic.","_n":"3q470","_k":"1672d919"},{"t":"NH₄NO₃(s) → NH₄⁺(aq) + NO₃⁻(aq), Δ\u003ci>H\u003c/i> = +25.7 kJ","why":"Endothermic: it absorbs heat.","_n":"3r440","_k":"df1e05c6"},{"t":"4Fe + 3O₂ → 2Fe₂O₃, Δ\u003ci>H\u003c/i> = −1648.4 kJ","why":"That warms: a hand warmer.","_n":"3s450","_k":"71b633c1"},{"t":"CH₄ combustion","why":"Exothermic, and it needs a flame.","_n":"3t4a0","_k":"f3c0b62a"}]},"b":{"prompt":"A company wants a reaction for a \u003cem>hand warmer\u003c/em> that needs no flame. Which reaction fits?","options":[{"t":"NH₄NO₃ dissolving","why":"Endothermic.","_n":"3u4b0","_k":"cde54d48"},{"t":"Propane combustion","why":"Needs a flame.","_n":"3v43f","_k":"e62a0d20"},{"t":"4Fe + 3O₂
