ng>Isomers\u003c/strong> share a molecular formula but are different compounds. \u003cstrong>Structural isomers\u003c/strong> connect their atoms differently. \u003cstrong>Stereoisomers\u003c/strong> connect them the same way but point them differently in space. A C=C double bond can’t twist, so it can lock groups on the same side (\u003cstrong>cis\u003c/strong>) or opposite sides (\u003cstrong>trans\u003c/strong>).","caps":["Ethane: the C–C single bond spins freely.","Ethene: twisting the C=C stretches the π bond, and the turn snaps back.","The locked C=C gives two different molecules: cis and trans but-2-ene."],"fig":{"html":"\u003cdiv class=\"si-hx\">\u003csvg class=\"si-hx-svg\" id=\"si-hx-svg\" viewBox=\"0 0 480 300\" role=\"img\" aria-label=\"A ball-and-stick ethane spins freely about its C–C bond. Then ethene tries to turn: a π-bond band stretches and glows, and the turn snaps back. Finally two but-2-ene models slide apart: cis, with both CH₃ groups up, boils at about 4 °C; trans, one up and one down, at about 1 °C.\">\u003c/svg>\u003cdiv class=\"si-hx-row\">\u003cp class=\"si-hx-cap\" id=\"si-hx-cap\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"si-hx-replay\" hidden>Replay\u003c/button>\u003c/div>\u003c/div>"}},"goals":["I can decide whether two structures are the same compound, structural isomers, stereoisomers, or not isomers at all.","I can name and draw chain, position and functional-group isomers for a molecular formula.","I can explain why a C=C bond gives cis–trans isomers and decide whether a given alkene has them.","I can name cis and trans isomers and draw each one from its name.","I can explain differences in boiling point, melting point and polarity between isomers using shape and intermolecular forces.","I can apply isomerism to real substances, such as fats in food."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Formulas from structures","goal":1,"prompt":"What is the molecular formula of CH₃CH₂ does ‘1’ put the double bond?","Between C1 and C2.","CH₂=CHCH₂CH₃."]},{"id":"w5","skill":"Intermolecular forces","goal":5,"prompt":"Which force is present between \u003cstrong>all\u003c/strong> molecules?","options":[{"t":"Dipole–dipole forces","why":"Only between polar molecules.","_n":"g0b4","_k":"c508183d"},{"t":"Ionic bonds","why":"Those hold ions together, not molecules.","_n":"h1a4","_k":"ceafb782"},{"t":"London dispersion forces","why":"Every molecule has electrons that can shift briefly.","_n":"i194","_k":"e9f72424"},{"t":"Hydrogen bonds","why":"Only with H on N, O or F.","_n":"j184","_k":"950ebca5"}],"hints":["Which force needs no polarity?","Temporary dipoles.","London dispersion."]},{"id":"w6","skill":"Intermolecular forces","goal":5,"prompt":"Two liquids have molecules of the same mass. One is polar and one is nonpolar. Which usually boils higher?","options":[{"t":"The polar one","why":"Dipole–dipole forces add to London forces.","_n":"k194","_k":"9b95efc6"},{"t":"It can’t be predicted at all","why":"With the same mass, polarity is the deciding factor.","_n":"l164","_k":"2f7dc0f9"},{"t":"The nonpolar one","why":"Nonpolar molecules lack the extra attraction.","_n":"m174","_k":"5ca6da45"},{"t":"They boil at the same temperature","why":"Same mass doesn’t mean same forces.","_n":"n1c4","_k":"7016bbea"}],"hints":["What extra force does a polar molecule have?","Dipole–dipole.","Stronger attractions mean a higher boiling point."]}],"refreshers":{"Formulas from structures":"Count each element; check alkanes against CₙH₂ₙ₊₂ and alkenes against CₙH₂ₙ.","Alkene naming":"Longest chain containing the C=C; number to give the C=C the lowest locant; -ene.","Intermolecular forces":"London forces act between all molecules and grow with surface area. Polar molecules add dipole–dipole forces; O–H, N–H and F–H add hydrogen bonds. Stronger forces mean a higher boiling point."}}},"explore":{"heading":"Isomer explorer","intro":"Build molecules, then compare them. Rotate each model and try to twist its bonds.","how":"Choose a mode. In \u003cstrong>Structural isomers\u003c/strong>, pick a target formula, tap an atom or a bond in the drawing, then use the builder buttons. In \u003cstrong>Cis–trans\u003c/strong>, choose the group in each of the four places. Press \u003cstrong>Save for comparison\u003c/strong> to keep a molecule, and open \u003cstrong>Compare\u003c/strong> to see two saved molecules side by side. Turn the 3D model by dragging it, with the arrow keys, or with the view buttons.","cmpNote":"Compare mode shows the last two molecules you saved, side by side. Save molecules in the other two modes.","dataNote":"Boiling and melting points are rounded data; the ≈ 270 kJ/mol needed to twist a C=C is approximate (course table additions).","rules":{"m1":"Same atoms joined the same way is the same compound, however it’s drawn. Trace the bonds, not the picture.","m2":"Same formula, different shape. Shape changes the forces between molecules, so boiling points differ.","m3":"Each carbon of the C=C needs two \u003cstrong>different\u003c/strong> groups. But-1-ene’s first carbon has two H atoms, so it has no cis–trans pair.","m4":"Groups spin freely around a single bond. Only the double bond (or a ring) stops rotation.","m5":"\u003cem>Cis\u003c/em> = same side; \u003cem>trans\u003c/em> = across.","m6":"Same mass, but a branched molecule is more compact: less surface, weaker London forces, lower boiling point.","m7":"The atoms are joined in the same order; only the arrangement in space differs. That makes them stereoisomers."},"modes":[{"id":"struct","t":"Structural isomers"},{"id":"ct","t":"Cis–trans"},{"id":"cmp","t":"Compare"}],"predictions":[{"id":"p1","prompt":"Butane and 2-methylpropane are both C₄H₁₀. Which boils at the higher temperature?","options":[{"t":"it depends on the room","_n":"o1d4","_k":"bc147550"},{"t":"butane","_n":"p1a4","_k":"aeb8aa0d"},{"t":"2-methylpropane","_n":"q1b4","_k":"ba5ae814"},{"t":"the same","_n":"r104","_k":"539e4035"}],"explain":"The branched isomer is more compact: less contact, weaker London forces."},{"id":"p2","prompt":"Press Rotate on ethane’s C–C bond, then on ethene’s C=C bond. What happens?","options":[{"t":"both turn freely","_n":"s114","_k":"bafbe739"},{"t":"ethane turns freely; ethene’s turn is blocked","_n":"t1e5","_k":"bc5bc84a"},{"t":"ethene turns but ethane doesn’t","_n":"u1d5","_k":"0e3fa8d9"},{"t":"neither turns","_n":"v205","_k":"3c70421b"}],"explain":"The π bond needs the p orbitals side by side; twisting pulls them apart."},{"id":"p3","prompt":"Cis–trans mode, with H and H on the left carbon and H and C₂H₅ on the right (but-1-ene). Does but-1-ene have cis and trans forms?","options":[{"t":"Only at low temperature","_n":"w1f5","_k":"ea0d2785"},{"t":"Yes, two","_n":"x1a5","_k":"fa63f395"},{"t":"Yes, four","_n":"y195","_k":"c956027c"},{"t":"No","_n":"z1c5","_k":"30bf77d6"}],"explain":"C1 has two H atoms. Swapping them changes nothing."},{"id":"p4","prompt":"Compare mode: cis- and trans-1,2-dichloroethene. Which boils at the higher temperature?","options":[{"t":"the same","_n":"101b5","_k":"b6fb1725"},{"t":"trans","_n":"11165","_k":"01e179b8"},{"t":"cis","_n":"12155","_k":"3c89169b"},{"t":"neither boils below 100 °C","_n":"13144","_k":"da5085c7"}],"explain":"Cis is polar, so dipole–dipole forces add to its London forces."}],"chalIntro":"Use the isomer explorer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,5],"prompt":"Build an isomer of pentane, C₅H₁₂, that boils \u003cstrong>below 20 °C\u003c/strong>.","why":"2,2-dimethylpropane is the most compact C₅H₁₂ isomer: the least surface, the weakest London forces, ≈ 10 °C.","hints":["Branching lowers the boiling point.","Put as many branches as possible on the shortest chain.","A central carbon with four CH₃ groups: 2,2-dimethylpropane, ≈ 10 °C."]},{"id":"tc2","goal":[3,4,5],"prompt":"In cis–trans mode, build the \u003cstrong>nonpolar\u003c/strong> isomer with formula C₂H₂Cl₂.","why":"trans-1,2-dichloroethene: the two C–Cl dipoles point in opposite directions across the molecule and cancel.","hints":["Where must the two C–Cl dipoles point to cancel?","Opposite directions, across the molecule.","Cl on different carbons, on opposite sides: trans."]},{"id":"tc3","goal":[1,2,3],"stretch":true,"prompt":"Build \u003cstrong>every\u003c/strong> isomer of C₄H₈. Each new one is added to your list; duplicates are flagged.","why":"Four alkenes (but-1-ene, cis- and trans-but-2-ene, 2-methylpropene) and two rings (cyclobutane, methylcyclopropane): six isomers of C₄H₈.","hints":["CₙH₂ₙ means one double bond \u003cstrong>or\u003c/strong> one ring.","Chains with C=C: where can the C=C go, and which carbons can branch? Then check each for cis–trans.","4 alkenes (but-1-ene, cis- and trans-but-2-ene, 2-methylpropene) + 2 rings (cyclobutane, methylcyclopropane)."]}]},"part3":{"slug":"properties","name":"Properties","heading":"Same formula, different properties","intro":"Isomers have the same formula, yet their boiling and melting points differ. Read the data at each station, then zoom to the particles to see the forces that explain it.","dataNote":"Rounded data. Butane, 2-methylpropane and the three C₅H₁₂ boiling points are from the course data table; the other values are course table additions.","s1":{"title":"Station 1: Three kinds of difference","intro":"Each card compares isomers. Press \u003cstrong>Zoom to the particles\u003c/strong> to see the forces between two molecules.","cards":[{"id":"chain","title":"Chain isomers: C₅H₁₂","names":["pentane","2-methylbutane","2,2-dimethylpropane"],"note":"More branching, less surface.","zaria":["Two long pentane molecules lie side by side, touching along their whole length: many London attractions.","Two compact 2,2-dimethylpropane molecules touch at only one small spot: few London attractions."],"zoom":"Long pentane molecules touch along their whole length; compact 2,2-dimethylpropane molecules touch at only a small spot, so their London forces are weaker."},{"id":"fg","title":"Functional group isomers: C₂H₆O","names":["ethanol","methoxymethane"],"note":"Hydrogen bonding needs the O–H.","zaria":["Two ethanol molecules: the O–H hydrogen of one points at the O of the other, joined by a dotted hydrogen bond.","Two methoxymethane molecules: no H on the O, so only a weak dipole–dipole attraction is drawn."],"zoom":"Ethanol’s O–H hydrogen-bonds to the O of its neighbour. Methoxymethane’s O has no H attached, so it can only form weaker dipole–dipole attractions."},{"id":"pos","title":"Position isomers: C₃H₈O","names":["propan-1-ol","propan-2-ol"],"note":"The OH at the end is more exposed for hydrogen bonding.","zaria":["Two propan-1-ol molecules: the O–H at the chain end reaches the next O easily, a dotted hydrogen bond.","Two propan-2-ol molecules: the O–H sits in the middle, circled, with CH₃ groups around it; the hydrogen bond is faint."],"zoom":"At the end of the chain, the O–H is easy to reach. In the middle, two CH₃ groups crowd it, so hydrogen bonds form less well."}]},"s2":{"title":"Station 2: Cis vs trans","intro":"cis- and trans-1,2-dichloroethene have the same atoms joined the same way. Which effect explains each difference? Choose one for each row, then check.","rows":[{"id":"bp","t":"Boiling points: cis 60 °C, trans 48 °C","_a":"Q0UMDRE=","why":"The cis molecule is polar, so dipole–dipole forces add to London forces when it boils."},{"id":"mp","t":"Melting points: cis −80 °C, trans −50 °C","_a":"Q0UCAlgQ","why":"The trans shape packs into the crystal better, so the solid holds together until a higher temperature."}],"choices":[{"id":"pol","t":"polarity"},{"id":"pack","t":"packing"}],"summary":"Polarity explains the boiling points; packing explains the melting points.","zoomL":"Liquid: cis molecules line up their dipoles (δ+ next to δ−).","zoomR":"Solid: flat trans molecules stack neatly in the crystal."},"s3":{"title":"Station 3: Fats in food","intro":"Three 18-carbon fatty acid chains. Tap a chain, then tap where it belongs at room temperature (about 20 °C).","items":[{"id":"sat","t":"Saturated (straight)","_a":"Q0YMDVpWQQ==","why":"Straight chains line up closely, so the fat is solid: it melts at ≈ 70 °C."},{"id":"cis","t":"Cis-unsaturated (kinked)","_a":"Q1kKEEZbB0E=","why":"The cis kink stops the chains packing, so the fat melts at ≈ 13 °C: a liquid oil."},{"id":"trans","t":"Trans-unsaturated (nearly straight)","_a":"Q0YMDVpWQQ==","why":"The trans double bond keeps the chain nearly straight, so it packs like a saturated fat and melts at ≈ 44 °C."}],"bins":[{"id":"solid","label":"Solid at room temperature"},{"id":"liquid","label":"Liquid at room temperature"}],"note":"Partial hydrogenation (an addition reaction, module 02) can turn some cis double bonds into trans. Trans fats raise “bad” cholesterol, and Canada banned partially hydrogenated oils in foods in 2018."},"quickCheck":{"title":"Quick check","summary":"Same formula, different properties quick check","items":[{"id":"q1","goal":5,"prompt":"Which C₅H₁₂ isomer has the lowest boiling point?","choices":[{"t":"2-methylbutane","fb":"Most compact, least surface.","_n":"14154","_k":"b2bf52d9"},{"t":"all equal","fb":"Most compact, least surface.","_n":"15164","_k":"b1e5160f"},{"t":"pentane","fb":"Most compact, least surface.","_n":"16174","_k":"3fdd68fd"},{"t":"2,2-dimethylpropane","fb":"Right. Most compact, least surface: ≈ 10 °C.","_n":"17184","_k":"bfbdaacc"}]},{"id":"q2","goal":5,"prompt":"Why does ethanol boil 100 °C higher than its isomer methoxymethane?","choices":[{"t":"Ethanol is heavier","fb":"Same formula, so same mass and electrons; only ethanol has O–H.","_n":"18194","_k":"cfd098a9"},{"t":"Ethanol has more electrons","fb":"Same formula, so same mass and electrons; only ethanol has O–H.","_n":"191a4","_k":"376f9abc"},{"t":"Ethanol hydrogen-bonds","fb":"Right. Only ethanol has an O–H, so only ethanol hydrogen-bonds.","_n":"1a1b4","_k":"9c497544"},{"t":"Methoxymethane is ionic","fb":"Same formula, so same mass and electrons; only ethanol has O–H.","_n":"1b0c4","_k":"e9b23d12"}]},{"id":"q3","goal":5,"prompt":"Why does trans-1,2-dichloroethene melt at a higher temperature than cis?","choices":[{"t":"It is more polar","fb":"Trans is the nonpolar one; packing, not polarity, explains melting here.","_n":"1c0d4","_k":"a793b3d4"},{"t":"Trans bonds are stronger","fb":"Trans is the nonpolar one; packing, not polarity, explains melting here.","_n":"1d9a4","_k":"d4593ad5"},{"t":"It has more atoms","fb":"Trans is the nonpolar one; packing, not polarity, explains melting here.","_n":"1e994","_k":"651b62c8"},{"t":"Its shape packs better in a solid","fb":"Right. The trans shape fits into the crystal better.","_n":"1f984","_k":"c7a1e875"}]},{"id":"q4","goal":6,"prompt":"Why is a cis-unsaturated fat liquid at room temperature?","choices":[{"t":"It is ionic","fb":"Kinked chains can’t line up, so the forces between them are weaker.","_n":"1g974","_k":"1e1848d8"},{"t":"It has more hydrogen","fb":"Kinked chains can’t line up, so the forces between them are weaker.","_n":"1h9e4","_k":"33a1290d"},{"t":"The kink stops chains from packing","fb":"Right. Kinked chains can’t line up, so the forces between them are weaker.","_n":"1i9d4","_k":"278a911e"},{"t":"It has no double bonds","fb":"Kinked chains can’t line up, so the forces between them are weaker.","_n":"1j9c4","_k":"42ab73b5"}]}]}},"practice":{"activities":[{"id":"rel","type":"sorter","title":"What’s the relationship?","summary":"What’s the relationship?","noun":"pair","txt":true,"goal":[1,2,3],"instruction":"Ten pairs of structures. Sort each pair by how the two are related.","boxes":[{"id":"same","label":"Same compound"},{"id":"struct","label":"Structural isomers"},{"id":"ct","label":"Cis–trans isomers"},{"id":"not","label":"Not isomers"}],"wrongDefault":"Check the formulas first, then trace the connections.","items":[{"id":"i1","goal":1,"t":"CH₃CH₂CH₂CH₃ and CH₃CH₂CH₂CH₃ drawn as a zigzag pointing down","_a":"Q0YCDFYQ","why":"Four carbons in a row both times: the same compound, drawn two ways.","wrong":{"struct":"Trace the chain: 4 carbons in a row both times.","ct":"Trace the chain: 4 carbons in a row both times."},"hints":["Same formula?","Same connections?","Same compound: both are butane, four carbons in a row; only the drawing differs."]},{"id":"i2","goal":2,"t":"Butane and 2-methylpropane","_a":"Q0YXE0ZRF0E=","why":"Both C₄H₁₀, with different carbon skeletons: chain isomers.","hints":["Same formula?","Same connections?","Structural isomers: both are C₄H₁₀, but one chain is straight and one is branched."]},{"id":"i3","goal":3,"t":"cis-but-2-ene and trans-but-2-ene","_a":"Q1YXQw==","why":"Same connections; the CH₃ groups are on the same side in one and opposite sides in the other.","wrong":{"struct":"Same connections; only the arrangement differs."},"hints":["Same formula?","Same connections?","Cis–trans isomers: same connections, different arrangement around the C=C."]},{"id":"i4","goal":2,"t":"Propan-1-ol and propan-2-ol","_a":"Q0YXE0ZRF0E=","why":"Both C₃H₈O; the OH is on a different carbon: position isomers.","hints":["Same formula?","Same connections?","Structural isomers: both C₃H₈O, with the OH on C1 in one and C2 in the other."]},{"id":"i5","goal":2,"t":"Ethanol and methoxymethane","_a":"Q0YXE0ZRF0E=","why":"Both C₂H₆O: an alcohol and an ether, functional group isomers.","wrong":{"not":"Both are C₂H₆O."},"hints":["Same formula?","Same connections?","Structural isomers: both C₂H₆O, but one is an alcohol and one is an ether."]},{"id":"i6","goal":1,"t":"Butane and but-1-ene","_a":"Q1sMFRE=","why":"Different formulas: C₄H₁₀ vs C₄H₈.","wrong":{"struct":"C₄H₁₀ vs C₄H₈.","ct":"C₄H₁₀ vs C₄H₈.","same":"C₄H₁₀ vs C₄H₈."},"hints":["Same formula?","Same connections?","Not isomers: C₄H₁₀ vs C₄H₈."]},{"id":"i7","goal":1,"t":"CH₂=CHCH₂CH₃ and CH₃CH₂CH=CH₂","_a":"Q0YCDFYQ","why":"Read the second one from the right: it’s but-1-ene again.","wrong":{"struct":"Numbered from the other end, it’s but-1-ene again.","ct":"Numbered from the other end, it’s but-1-ene again."},"hints":["Same formula?","Same connections?","Same compound: both are but-1-ene, written from opposite ends."]},{"id":"i8","goal":3,"t":"cis- and trans-1,2-dimethylcyclopropane","_a":"Q1YXQw==","why":"The ring locks the groups: both CH₃ on the same side of the ring in one, on opposite sides in the other.","wrong":{"same":"The ring locks the groups: same side vs opposite sides."},"hints":["Same formula?","Same connections?","Cis–trans isomers: the ring can’t rotate, so same side and opposite sides are different molecules."]},{"id":"i9","goal":2,"t":"Propanal and propanone","_a":"Q0YXE0ZRF0E=","why":"Both C₃H₆O: an aldehyde and a ketone, functional group isomers.","hints":["Same formula?","Same connections?","Structural isomers: both C₃H₆O, with the C=O at the end in one and in the middle in the other."]},{"id":"i10","goal":1,"t":"Butane, and butane with its two middle carbons rotated 180°","_a":"Q0YCDFYQ","why":"Rotating about a single bond doesn’t make a new compound.","wrong":{"ct":"Single bonds rotate; no isomers.","struct":"Single bonds rotate; no isomers."},"hints":["Same formula?","Same connections?","Same compound: single bonds rotate freely, so it’s still butane."]}]},{"id":"puz","type":"custom","title":"Isomer puzzles","summary":"Isomer puzzles","star":true,"goal":[2,3,4,5],"instruction":"Seven puzzles: number entry and choices. Puzzles 5 to 7 are non-routine; 6 and 7 go beyond the Final Check.","how":"Type a number or tap a choice, then press Check.","items":[{"id":"p1","kind":"num","goal":2,"prompt":"How many structural isomers does C₆H₁₄ have?","_a":"VA==","unit":"isomers","display":"5","wrong":[{"match":4,"fb":"Don’t forget 3-methylpentane."},{"match":6,"fb":"Check for duplicates (2-methylpentane drawn from the other end)."}],"fb":"Draw each carbon skeleton and check every one for duplicates."},{"id":"p2","kind":"num","goal":2,"prompt":"How many structural isomers does C₄H₉Cl have?","_a":"VQ==","unit":"isomers","display":"4","wrong":[{"match":2,"fb":"Branch the chain too: 1-chloro-2-methylpropane and 2-chloro-2-methylpropane."}],"fb":"Put the Cl on each different carbon of each chain, then check for duplicates."},{"id":"p3","kind":"num","goal":3,"prompt":"How many isomers of C₂H₂Cl₂ are there, counting cis and trans separately?","_a":"Ug==","unit":"isomers","display":"3","wrong":[{"match":2,"fb":"1,2-dichloroethene has cis and trans forms."}],"fb":"Both Cl on one carbon, or one on each carbon; then check for cis and trans."},{"id":"p4","kind":"chips","goal":3,"prompt":"Does 2-methylbut-2-ene have cis–trans isomers?","options":[{"t":"No","why":"C2 carries two CH₃ groups, so swapping them gives the same molecule.","_n":"1k9b4","_k":"7211d56e"},{"t":"Yes","why":"C2 carries two CH₃ groups.","_n":"1l924","_k":"72d15016"}]},{"id":"p5","kind":"num","star":true,"goal":3,"prompt":"How many alkene isomers (including cis and trans) have formula C₅H₁₀?","_a":"Vw==","unit":"isomers","display":"6","wrong":[{"match":5,"fb":"Pent-2-ene counts twice: cis and trans."},{"match":7,"fb":"2-methylbut-2-ene has no cis–trans pair."}],"fb":"List the chains, place the C=C, then check each for cis–trans.","hints":["List the chains: 5 carbons, then 4 with a branch.","Pent-1-ene, pent-2-ene, 2-methylbut-1-ene, 3-methylbut-1-ene, 2-methylbut-2-ene.","Only pent-2-ene has a cis–trans pair: 6 in all."]},{"id":"p6","kind":"chips","star":true,"goal":5,"prompt":"\u003cstrong>Investigation:\u003c/strong> a student compares the boiling points of the two 1,2-dichloroethenes on different days, at different altitudes. Which variable must be controlled?","options":[{"t":"beaker size","why":"Boiling point depends on the pressure above the liquid.","_n":"1m914","_k":"487c4bf8"},{"t":"sample colour","why":"Boiling point depends on the pressure above the liquid.","_n":"1na04","_k":"4b13af7a"},{"t":"time of day","why":"Boiling point depends on the pressure above the liquid.","_n":"1oa14","_k":"b93ce446"},{"t":"air pressure","why":"Boiling point depends on the pressure above the liquid, so both must be measured at the same pressure.","_n":"1p9e4","_k":"276f49c2"}]},{"id":"p7","kind":"chips","star":true,"goal":5,"prompt":"Hex-3-ene, CH₃CH₂CH=CHCH₂CH₃: predict which isomer, cis or trans, has the higher \u003cstrong>melting\u003c/strong> point, and why.","options":[{"t":"Trans: its straighter shape packs better","why":"Melting is about fitting into a solid: the straighter trans molecules pack better.","_n":"1q9f4","_k":"c2891e68"},{"t":"Cis: it is polar, so its molecules attract more","why":"Cis is the polar one, which matters for boiling. Melting is about packing.","_n":"1r9c4","_k":"66607e7d"}],"hints":["Which property is about fitting into a solid?","Melting point.","Trans is straighter, so it packs better and melts higher."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ezra","how":"","goal":[1,3],"instruction":"Ezra made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"List the structural isomers of C₅H₁₂.","steps":["Straight chain: pentane, CH₃CH₂CH₂CH₂CH₃.","One branch on a 4-carbon chain: 2-methylbutane.","Moving the branch: 3-methylbutane is a third isomer.","Two branches on a 3-carbon chain: 2,2-dimethylpropane.","So C₅H₁₂ has 4 isomers."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is fine on its own, but the mistake is earlier.","This follows from step 3."],"fixes":[{"t":"Numbered from the other end, 3-methylbutane is 2-methylbutane, the same compound. C₅H₁₂ has 3 isomers.","why":"Same connections, same compound: pentane, 2-methylbutane and 2,2-dimethylpropane.","_n":"1s9d4","_k":"d02137cc"},{"t":"3-methylbutane is a stereoisomer of 2-methylbutane.","why":"There’s no double bond or ring.","_n":"1t9a4","_k":"b17bc9e5"},{"t":"Step 3 is correct.","why":"Trace the bonds: same connections.","_n":"1u9b4","_k":"a2fd0173"},{"t":"Add 4-methylbutane as a fifth isomer.","why":"That’s pentane.","_n":"1v984","_k":"239829d2"}],"hints":["Number 3-methylbutane from the other end.","The branch lands on C2.","Same compound: 3 isomers in all."]},{"id":"e2","goal":3,"task":"Draw the cis–trans isomers of 2-methylbut-2-ene, (CH₃)₂C=CHCH₃.","steps":["The C=C is between C2 and C3.","C3 carries H and CH₃: two different groups.","C2 carries CH₃ and CH₃.","So there are cis and trans forms: the CH₃ on C3 can be on the same side as a CH₃ on C2, or opposite.","Cis-2-methylbut-2-ene has the higher boiling point."],"_a":"Ug==","stepFb":["Correct. Keep checking.","Correct.","Correct.","","This builds on step 4."],"fixes":[{"t":"There are cis and trans forms, but trans is higher-boiling.","why":"Each carbon of the C=C needs two \u003cstrong>different\u003c/strong> groups. But-1-ene’s first carbon has two H atoms, so it has no cis–trans pair.","_n":"1w994","_k":"3b4d378e"},{"t":"Step 4 is correct.","why":"Both CH₃ groups on C2 are the same, so ‘same side’ and ‘opposite’ are identical.","_n":"1x864","_k":"706f4a5d"},{"t":"There are four stereoisomers.","why":"Each carbon of the C=C needs two \u003cstrong>different\u003c/strong> groups. But-1-ene’s first carbon has two H atoms, so it has no cis–trans pair.","_n":"1y854","_k":"c7cfa2d7"},{"t":"C2 has two identical groups, so swapping its top and bottom gives the same molecule. There are no cis–trans isomers.","why":"Both carbons of the C=C need two different groups; C2 fails.","_n":"1z884","_k":"b1962e9e"}],"hints":["What does each carbon of the C=C need?","Two different groups.","C2 fails: no cis–trans pair."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the isomer explorer: the blocked rotation, the boiling-point gaps, or a duplicate you thought was new?"},{"id":"j2","q":"In your own words, what makes two molecules stereoisomers rather than structural isomers?"},{"id":"j3","q":"Explain to a friend how to decide whether an alkene has cis and trans forms."},{"id":"j4","q":"Which isomer type still trips you up? What will you check first next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the relationship between CH₃CH₂CH₂OH and CH₃CH(OH)CH₃?","options":[{"t":"The same compound","why":"The OH is on C1 in one and C2 in the other.","_n":"20874","_k":"07f76f09"},{"t":"Structural (position) isomers","why":"Same formula, C₃H₈O; the OH is on a different carbon.","_n":"218a4","_k":"985ffa21"},{"t":"Not isomers","why":"Both are C₃H₈O.","_n":"22894","_k":"c1a28e85"},{"t":"Cis–trans isomers","why":"No double bond; the connections differ.","_n":"238c4","_k":"19ec32ae"}]},"b":{"prompt":"What is the relationship between cis-pent-2-ene and trans-pent-2-ene?","options":[{"t":"Not isomers","why":"Both are C₅H₁₀.","_n":"248b4","_k":"f0aa83d8"},{"t":"Structural isomers","why":"The atoms are joined in the same order.","_n":"258e4","_k":"8e52b07e"},{"t":"Stereoisomers (cis–trans)","why":"Same connections, different arrangement around the C=C.","_n":"268d4","_k":"83fef66f"},{"t":"The same compound","why":"The C=C can’t rotate, so they can’t interconvert.","_n":"279c3","_k":"24dabc90"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which is a \u003cstrong>functional group\u003c/strong> isomer of propanal, CH₃CH₂CHO?","options":[{"t":"Propanone, CH₃COCH₃","why":"Both are C₃H₆O; aldehyde vs ketone.","_n":"289d3","_k":"d90f70f3"},{"t":"Propan-1-ol","why":"C₃H₈O: not the same formula.","_n":"299e3","_k":"51fffaa4"},{"t":"Butanal","why":"C₄H₈O: one carbon too many.","_n":"2a9f3","_k":"1d975edb"},{"t":"Propanal drawn backwards","why":"That’s the same compound.","_n":"2b983","_k":"002a435e"}]},"b":{"prompt":"Which is a \u003cstrong>chain\u003c/strong> isomer of hexane?","options":[{"t":"Hexane drawn as a zigzag","why":"Same atoms joined the same way is the same compound, however it’s drawn. Trace the bonds, not the picture.","_n":"2c993","_k":"41bea64a"},{"t":"Hex-1-ene","why":"C₆H₁₂: not the same formula.","_n":"2d9a3","_k":"72134751"},{"t":"Cyclohexane","why":"C₆H₁₂.","_n":"2e9b3","_k":"21313acb"},{"t":"3-methylpentane","why":"C₆H₁₄ with a different carbon skeleton.","_n":"2f943","_k":"b0f18279"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which alkene has cis and trans isomers?","options":[{"t":"Pent-1-ene","why":"C1 has two H.","_n":"2g953","_k":"f8c84dca"},{"t":"2-methylbut-2-ene","why":"C2 has two CH₃.","_n":"2ha23","_k":"2ce0fa12"},{"t":"Ethene","why":"Each carbon has two H.","_n":"2ia13","_k":"0111c638"},{"t":"Pent-2-ene","why":"C2 has H and CH₃; C3 has H and C₂H₅.","_n":"2ja03","_k":"798263f9"}]},"b":{"prompt":"Which alkene has \u003cstrong>no\u003c/strong> cis–trans isomers?","options":[{"t":"Hex-3-ene","why":"C3 and C4 each carry H and C₂H₅, so hex-3-ene has cis and trans forms.","_n":"2k9f3","_k":"2bb605d1"},{"t":"2-methylpropene","why":"C1 has two H (and C2 has two CH₃).","_n":"2l9e3","_k":"06c1b10a"},{"t":"1,2-dichloroethene","why":"Each carbon carries H and Cl, so it has cis and trans forms.","_n":"2m9d3","_k":"5fc52961"},{"t":"But-2-ene","why":"C2 and C3 each carry CH₃ and H, so but-2-ene has cis and trans forms.","_n":"2n9c3","_k":"c87730ad"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Rank by boiling point, highest first: pentane, 2-methylbutane, 2,2-dimethylpropane.","options":[{"t":"Pentane > 2-methylbutane > 2,2-dimethylpropane","why":"More branching, less surface, weaker London forces.","_n":"2o9b3","_k":"1a2b90f6"},{"t":"2-methylbutane > pentane > 2,2-dimethylpropane","why":"The straight chain has the most contact.","_n":"2p9a3","_k":"21ec06bd"},{"t":"All the same","why":"Same formula, different shape. Shape changes the forces between molecules, so boiling points differ.","_n":"2q993","_k":"6b80b080"},{"t":"2,2-dimethylpropane > 2-methylbutane > pentane","why":"Same mass, but a branched molecule is more compact: less surface, weaker London forces, lower boiling point.","_n":"2ra41","_k":"71819b94"}]},"b":{"prompt":"Rank by boiling point, highest first: hexane, 2-methylpentane, 2,2-dimethylbutane.","options":[{"t":"All the same","why":"Same formula, different shape. Shape changes the forces between molecules, so boiling points differ.","_n":"2sa31","_k":"dd813c92"},{"t":"2,2-dimethylbutane > 2-methylpentane > hexane","why":"Same mass, but a branched molecule is more compact: less surface, weaker London forces, lower boiling point.","_n":"2ta61","_k":"85ade584"},{"t":"2-methylpentane > hexane > 2,2-dimethylbutane","why":"The straight chain has the most contact.","_n":"2ua51","_k":"c6b0e37e"},{"t":"Hexane > 2-methylpentane > 2,2-dimethylbutane","why":"More branching, less surface, weaker London forces.","_n":"2va01","_k":"9ada3107"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"How many isomers (structural and cis–trans) are alkenes with formula C₄H₈?","options":[{"t":"3","why":"But-2-ene counts twice.","_n":"2w9f1","_k":"a633afaf"},{"t":"4","why":"But-1-ene, cis- and trans-but-2-ene, 2-methylpropene.","_n":"2xa21","_k":"06a90a47"},{"t":"5","why":"Neither but-1-ene nor 2-methylpropene has a cis–trans pair.","_n":"2ya11","_k":"abc546b6"},{"t":"6","why":"That count includes the two rings, which aren’t alkenes.","_n":"2zac1","_k":"018c676b"}]},"b":{"prompt":"How many isomers of C₃H₅Cl contain a C=C (counting cis and trans separately)?","options":[{"t":"2","why":"Cl can sit on any of the three carbons.","_n":"30ab1","_k":"e310725b"},{"t":"3","why":"1-chloropropene has cis and trans forms.","_n":"319e1","_k":"d0e6f7bd"},{"t":"4","why":"1-chloropropene (cis and trans), 2-chloropropene, 3-chloropropene.","_n":"329f1","_k":"40ea4262"},{"t":"5","why":"2-chloropropene and 3-chloropropene have no cis–trans pair.","_n":"339c1","_k":"3c8e61ad"}]}},{"id":"t3","cat":"T","goal":1,"a":{"prompt":"A student draws CH₃CH₂CH(CH₃)₂ and CH₃CH(CH₃)CH₂CH₃ and calls them two isomers. Is the student right?","options":[{"t":"Yes: they are position isomers","why":"Same atoms joined the same way is the same compound, however it’s drawn. Trace the bonds, not the picture.","_n":"349d1","_k":"3a380865"},{"t":"Yes: they are cis–trans isomers","why":"Groups spin freely around a single bond. Only the double bond (or a ring) stops rotation.","_n":"35a21","_k":"f489ca7e"},{"t":"No: both are 2-methylbutane, drawn from opposite ends","why":"Number each from the end nearer the branch: the CH₃ is on C2 both times.","_n":"36a31","_k":"f0e3fd93"},{"t":"No: they have different formulas","why":"Both are C₅H₁₂.","_n":"37a01","_k":"bf07eaaa"}]},"b":{"prompt":"A student draws CH₂ClCH₂CH₃ and CH₃CH₂CH₂Cl and calls them isomers. Is the student right?","options":[{"t":"No: different formulas","why":"Both are C₃H₇Cl.","_n":"38a11","_k":"841522c0"},{"t":"Yes: position isomers","why":"Same atoms joined the same way is the same compound, however it’s drawn. Trace the bonds, not the picture.","_n":"39a61","_k":"a0bcd266"},{"t":"Yes: stereoisomers","why":"Groups spin freely around a single bond. Only the double bond (or a ring) stops rotation.","_n":"3aa71","_k":"b79d4c7b"},{"t":"No: both are 1-chloropropane","why":"The Cl is on an end carbon both times: the same compound, written from opposite ends.","_n":"3b381","_k":"fa2aa072"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why cis-1,2-dichloroethene boils at a higher temperature than the trans isomer?","options":[{"t":"“In cis, both C–Cl dipoles point to one side, so the molecule is polar and has dipole–dipole forces; in trans they cancel.”","why":"It names the cause (polarity) and the force it adds (dipole–dipole).","_n":"3c371","_k":"00ab1d74"},{"t":"“Trans molecules are heavier.”","why":"Same mass.","_n":"3d361","_k":"7a97df49"},{"t":"“Cis has a stronger double bond.”","why":"Boiling breaks attractions between molecules, not bonds.","_n":"3e351","_k":"8a35a487"},{"t":"“Cis has more atoms.”","why":"Same formula.","_n":"3f341","_k":"a676b925"}]},"b":{"prompt":"Which is the best explanation of why ethanol boils far higher than methoxymethane?","options":[{"t":"“Ethanol has an O–H group, so its molecules hydrogen-bond to each other; methoxymethane’s O has no H attached.”","why":"It names the group (O–H) and the force it allows (hydrogen bonding).","_n":"3g331","_k":"d3d2062c"},{"t":"“Ethanol is heavier.”","why":"Same formula, same mass.","_n":"3h321","_k":"e9547331"},{"t":"“Methoxymethane is ionic.”","why":"It’s molecular.","_n":"3i311","_k":"1685d2cf"},{"t":"“Ethanol’s bonds are harder to break.”","why":"Boiling doesn’t break covalent bonds.","_n":"3j301","_k":"99d53b75"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which name matches CH₃ and CH₃ on opposite sides of the C=C in CH₃CH=CHCH₃?","options":[{"t":"but-2-ene, which has no isomers","why":"C2 and C3 each carry CH₃ and H, so but-2-ene has cis and trans forms.","_n":"3k2f1","_k":"4166b4e9"},{"t":"trans-but-2-ene","why":"Opposite sides: trans.","_n":"3l321","_k":"f21d13ba"},{"t":"cis-but-2-ene","why":"\u003cem>Cis\u003c/em> = same side; \u003cem>trans\u003c/em> = across.","_n":"3m331","_k":"4077dc25"},{"t":"trans-but-1-ene","why":"The C=C starts at C2.","_n":"3n341","_k":"7ba79acd"}]},"b":{"prompt":"Which name matches Cl and Cl on the same side of the C=C in ClCH=CHCl?","options":[{"t":"1,1-dichloroethene","why":"The Cl atoms are on different carbons.","_n":"3o351","_k":"5f30eb9d"},{"t":"trans-1,2-dichloroethene","why":"\u003cem>Cis\u003c/em> = same side; \u003cem>trans\u003c/em> = across.","_n":"3p2e1","_k":"2f6f0755"},{"t":"cis-1,1-dichloroethene","why":"1,1 has no cis–trans pair.","_n":"3q2f1","_k":"1c16f0df"},{"t":"cis-1,2-dichloroethene","why":"Same side: cis.","_n":"3r301","_k":"28a564ea"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A margarine label lists ‘partially hydrogenated oil’. Why might its fat be more solid than the original oil?","options":[{"t":"Hydrogenation removes some double bonds and turns some cis bonds trans; straighter chains pack better","why":"Fewer kinks let the chains line up, so the fat melts higher.","_n":"3s311","_k":"6673441a"},{"t":"It adds more cis kinks","why":"Cis kinks make fats more liquid, not less.","_n":"3t2a1","_k":"f3d03595"},{"t":"Hydrogenation adds water","why":"It adds H₂ across C=C.","_n":"3u2b1","_k":"2a192297"},{"t":"It makes the fat ionic","why":"It’s still molecular.","_n":"3v2c1","_k":"569e7ff5"}]},"b":{"prompt":"Olive oil is liquid but butter is solid at room temperature. Which best explains the difference?","options":[{"t":"Olive oil is a solution in water","why":"It’s a fat.","_n":"3w2b1","_k":"b494b109"},{"t":"Olive oil has fewer carbons per molecule","why":"Both have long chains of similar length.","_n":"3x2e1","_k":"78ac51fd"},{"t":"Olive oil’s fats have more cis double bonds whose kinks stop chains from packing","why":"Kinked chains can’t line up, so the forces between them are weaker.","_n":"3y2d1","_k":"bccd56ae"},{"t":"Butter’s fats are polar","why":"Both are mostly nonpolar.","_n":"3z301","_k":"8371d8e5"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"But-2-enedioic acid, HOOC–CH=CH–COOH, has cis and trans isomers. One melts near 135 °C, the other near 287 °C. Which is which, and why?","options":[{"t":"Cis melts at 287 °C because it’s polar","why":"Polarity matters more for boiling; melting here is decided by packing.","_n":"402f1","_k":"e03b6803"},{"t":"They must melt at the same temperature","why":"Same formula, different shape. Shape changes the forces between molecules, so boiling points differ.","_n":"41321","_k":"b2d3ff05"},{"t":"The cis isomer melts higher because it has more atoms","why":"Same formula.","_n":"42311","_k":"f0cd59b9"},{"t":"The trans isomer melts at 287 °C: its straighter shape packs into a tighter crystal","why":"Melting is decided by packing, and the trans shape packs better.","_n":"43241","_k":"db658f65"}]},"b":{"prompt":"Two isomers of BrCH=CHBr boil at 112 °C and 108 °C. One has both Br on the same side. Which boils at 112 °C?","options":[{"t":"The trans isomer, because it packs better","why":"Packing matters for melting; boiling here follows polarity.","_n":"44231","_k":"fd01456e"},{"t":"They can’t differ","why":"Same formula, different shape. Shape changes the forces between molecules, so boiling points differ.","_n":"45261","_k":"f918aeae"},{"t":"The cis isomer, because it is polar","why":"Both Br on one side: the dipoles add, so dipole–dipole forces raise the boiling point.","_n":"46271","_k":"ceca8017"},{"t":"1,1-dibromoethene","why":"Both isomers named here have Br on different carbons.","_n":"47241","_k":"81a3342e"}]}}]},"task":{"title":"Isomer family","summary":"Isomer family","statement":"\u003cp>Choose exactly three cards to make an isomer family that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"si-conds\">\u003cli>All three molecules have the formula C₄H₈.\u003c/li>\u003cli>The family includes a cis–trans pair.\u003c/li>\u003cli>The third molecule is a structural isomer of that pair.\u003c/li>\u003cli>No two cards show the same molecule.\u003c/li>\u003c/ol>","checks":["All C₄H₈","Includes a cis–trans pair","Third card is a structural isomer","Three different molecules"],"tips":["Count H atoms: butane is C₄H₁₀.","Which card is cis? Pair it with a trans card.","Rings are CₙH₂ₙ too.","Turn the models of 2 and 3, and of 4 and 9: same molecule."],"explainPrompt":"Explain why your three molecules are isomers of each other, and which pair are stereoisomers.","vocab":"Use the words molecular formula, structural isomer, stereoisomer and cis–trans.","more":"There’s more than one answer. Can you find another family?"},"cards":[["Isomers","Same molecular formula, different compounds."],["Structural isomers","Atoms joined in a different order: chain, position or functional group."],["Stereoisomers","Same connections, different arrangement in space."],["Why C=C makes cis–trans","Twisting would break the π bond, so groups stay locked on one side."],["Test for cis–trans","Each carbon of the C=C must carry two \u003cstrong>different\u003c/strong> groups."],["cis","Matching groups on the same side of the C=C (or ring)."],["trans","Matching groups on opposite sides."],["Branching and boiling point","More branching, less surface, weaker London forces, lower boiling point."],["cis vs trans boiling","Cis is often polar, so it often boils higher."],["cis vs trans melting","Trans is straighter, so it packs better and often melts higher."],["Same compound, drawn differently","Trace the bonds: flipping or renumbering doesn’t make an isomer."],["Trans fats","Nearly straight chains that pack like saturated fats; formed in partial hydrogenation."]]}};</script>
